description: |
  Afresh, the AI platform for grocery, began by tackling the
  most complex problem in the industry: fresh, and has evolved
  into the core AI platform for grocers.

  By leveraging proprietary AI designed for high-volatility
  environments, we empower partners like Albertsons, Meijer,
  and Wakefern to drive smarter decisions across their entire
  enterprise.

  Following record-breaking 70% revenue growth in 2025, we
  have scaled to 6 enterprise-grade solutions, with solutions
  live in over 10% of the U.S. grocery market. Our platform
  now orchestrates billions of decisions from the store floor
  to the distribution center and prevented over 200 million
  pounds of food waste last year alone.

  If you're looking for a role where your work directly
  translates into massive scale and social good, and you want
  to be part of the team that defines how the world eats,
  there is no better time to join us.

  About the Role

  Join the Ordering Pod as a Senior Software Engineer to own
  the development of our high-revenue, flagship AI ordering
  product. This is a pivotal role where you will be empowered
  to define the architectural roadmap for our next-generation
  systems and tackle challenging engineering problems that
  directly enable our business expansion.

  What You’ll Do

  - Lead the design, building, and deploy highly scalable and
    robust APIs, making critical architectural decisions that
    shape our platform.
  - Partner with Product, Account Management, and peer
    engineering teams to deliver integrated solutions that
    serve client needs.
  - Contribute to the vision of the next generation Ordering
    product, while also support our current iPad solution.
  - Enforce best practices for testing and releases to maintain
    high standards of system reliability.

  What makes you a great fit

  - BS in Computer Science or equivalent experience.
  - 4+ years of software development experience.
  - A strong desire to learn and master new technologies to meet
    the evolving needs of the platform.
  - Proven ability to lead and drive projects through the entire
    development lifecycle, from conception to launch, with a
    high degree of autonomy.
  - Readiness to step into a mentorship role to guide junior
    engineers and contribute to the team's growth.
  - Being curious about complex systems, including a desire to
    understand our intricate business domain and dependencies
    outside the team's direct ownership.
  - A strong team player who understands that we succeed (and
    learn) together.. In the spirit of that, you actively
    participate in team ceremonies, swarm with engineers and
    perform that doing timely and constructive code reviews.

  Nice to Have

  - You have worked in with an Agile software delivery cycle
    before.
  - You have leveraged modern AI-powered tools to accelerate
    development and enhance your workflow
  - You have experience in Typescript and cloud technologies in
    general and Azure specifically.

  Afresh's Tech Stack: Python, Javascript, Typescript, React
  Native, Databricks, GraphQL

  We encourage all highly-qualified candidates to apply, even
  if they don’t meet every listed qualification.

  This position is not eligible for immigration sponsorship.

  Salary Range in US: $156,000 - 210,000 USD/year + meaningful
  early-stage equity + benefits



  This position is not eligible for immigration sponsorship.



  Why You’ll Love Working at Afresh At Afresh, our mission to
  eliminate food waste starts with investing in our people. We
  provide a comprehensive support system designed to help you
  do your best work while maintaining a healthy, balanced
  life.

  - Comprehensive Health & Wellness: Comprehensive medical,
    dental, and vision coverage for you and your family, with
    the majority of premiums covered by Afresh. We also
    provide dedicated mental health support and counseling
    services.
  - Invested in Your Future: Competitive base salary, meaningful
    equity (U.S. employees), and a 401(k) program with a
    generous company match.
  - Flexible & Modern Workspace: Whether you work from home or a
    local office, we support your setup with a home office
    stipend and "Coworking Wallets" for flexible workspace
    access.
  - Growth-Obsessed Culture: We believe in continuous learning.
    Every employee receives an annual professional development
    budget to master new skills and grow their career at
    Afresh.
  - Holistic Monthly Stipends: Beyond your paycheck, we provide
    monthly stipends for "Betterment" (wellness/lifestyle) and
    telecommunications to ensure you have what you need to
    thrive.
  - Time to Recharge: Flexible paid time off to take the time
    you need to recharge.

  *Full-time U.S. employees are eligible for these benefits



  About Afresh

  Founded in 2017, Afresh is using AI to tackle the #1
  solution to curb climate change: reducing food waste. By
  building AI specifically for the intricacies of grocery—from
  the fresh perimeter to the center store—we help grocers
  minimize waste and maximize sales.

  Afresh sits at an incredible intersection of positive social
  impact, rocket ship financial growth, and cutting-edge
  technology. Our best-in-class AI research has been published
  in top journals, including ICML, and our investors include
  Al Gore’s Just Climate, former Whole Foods Market CEO Walter
  Robb, and Eric Schmidt's Innovation Endeavors.

  Grocery is the past, present, and future of our food system
  – the waste we create today will impact our planet for years
  to come. Join us as we continue to build a vibrant, diverse,
  and inclusive team that embodies our company’s values of
  proactivity, kindness, candor, and humility.

  Afresh provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, genetics, sexual orientation, gender
  identity/expression, marital status, pregnancy or related
  condition, or any other basis protected by law.

  Here at Afresh, many of our employees work remotely provided
  that they reside in one of the following states: AL, AR, CA,
  CO, FL, GA, IL, KY, MA, MI, MT, MO, NV, NJ, NY, NC, OR, PA,
  TX, WA, UT, VA, WI.
