  Job Description

  Join Miratech as an Software Engineer and play a key role in
  shaping our group finance system. The purpose of this role
  is to build, maintain, and extend Miratech’s new finance
  system on Odoo 20, ensuring robust customisations,
  integrations, and data migration. You will be responsible
  for developing and maintaining Odoo customisations for
  finance and project-management systems, including a custom
  expense application. Your work will include building
  integrations with business applications such as Microsoft
  Dynamics and Zoho, and migrating historical data using
  scripted, repeatable loads. You will collaborate closely
  with internal and external stakeholders, maintain testing
  pipelines, and keep technical documentation current. This
  role offers the opportunity to use AI coding tools in day-
  to-day development and support the finance automation
  programme.

  Responsibilities:

  - Develop and maintain Odoo customisations (back end and front
    end) for finance and project-management systems, including
    a custom expense application.
  - Build and maintain integrations with Miratech’s business
    applications (Microsoft Dynamics, Zoho, banking).
  - Migrate historical data using scripted, repeatable loads
    validated against source, through dry runs and at cutover.
  - Build and maintain testing pipelines, including test and
    mock data.
  - Collaborate daily with the Odoo Functional Consultant on
    requirements and solution options, and with the Project
    Manager on estimates, progress, and risks.
  - Keep technical documentation current and support the system
    post go-live.
  - Perform other duties as may be required consistent with the
    purpose of this role.

  Qualifications

  - 3+ years of commercial Python development, including 2+
    years building custom Odoo modules on recent Odoo
    versions.
  - Strong expertise in Odoo development, including back-end
    (ORM, inheritance, security, reports, scheduled actions)
    and front-end (OWL, JavaScript) technologies, with
    experience building custom user-facing Odoo application.
  - Experience integrating Odoo with external systems using REST
    APIs and Odoo external APIs, including implementation of
    robust error handling mechanisms.
  - Hands-on experience with data migration projects, including
    scripted and repeatable data loads, validation, and data
    quality assurance.
  - Proficiency with PostgreSQL, Git, Linux, Docker, and Odoo
    deployment and maintenance practices.
  - Strong testing discipline, including automated testing,
    CI/CD pipelines, test data management, as well as
    demonstrated initiative and ability to deliver
    independently.
  - Professional proficiency in English and Ukrainian.

  Additional Information

