description: |
  Resend is growing fast, and there are now over 4 million
  developers using it. We’re building our core team of
  software engineers to support millions of emails sent every
  day.

  We’re a small team that cares deeply about developer
  experience, reliability, and quality. We’re looking for
  engineers who enjoy shipping features end-to-end and
  understand how to build and operate the infrastructure
  behind them.

  This role is fully remote based in Americas or European
  timezones, with some expected travel for team offsites,
  conferences, meetups, and more.

  Read more about how we work, how we hire, and what we value
  here.

  In this role, you will…

  - Own features end-to-end, from proposing ideas and scoping
    projects to building APIs, dashboard experiences, and the
    services behind them.
  - Build reliable distributed systems, including queues and
    background workers that handle traffic spikes, retries,
    and failures predictably.
  - Scale APIs and databases, improving performance, data
    integrity, and efficiency as usage grows.
  - Operate what you build, with meaningful monitoring, safe
    deployments, and participation in our on-call rotation.
  - Work closely with support and customers to understand
    recurring problems and turn them into product
    improvements.
  - Improve engineering quality, strengthening tests, tooling,
    and existing systems alongside building new capabilities.

  You will be a great fit if you...

  - Have 8+ years of software engineering experience, with
    substantial experience building and operating backend
    services in production
  - Have worked with queues, asynchronous processing, and
    distributed systems, including retries, duplicate events,
    concurrency, and partial failures
  - Have the ability to design systems from scratch and think
    through the rollout of those systems
  - Understand cloud infrastructure and service operations,
    including deployments, observability, capacity, and
    debugging production issues
  - Have experience designing APIs and relational data models,
    diagnosing slow queries, and making safe database changes
  - Have experience managing production infrastructure with
    infrastructure as code, using tools such as Terraform or
    AWS CDK
  - Are comfortable working across the stack to deliver a
    complete product experience
  - Take initiative, communicate tradeoffs clearly, and know
    when to ask for help
  - Enjoy helping other developers and care about the details
    that make software easy to use
  - Communicate clearly in written and spoken English and can
    consistently work with overlap during Americas working
    hours

  You will be an exceptional fit if you also...

  - Have deep experience with Node.js, TypeScript, Go, and
    Postgres
  - Have built and operated services on AWS, using serverless or
    container-based infrastructure
  - Have worked on developer tools, public APIs, or email
    infrastructure

  What it means to join the team:

  - Meaningful ownership: Help decide what we build and take
    responsibility for how it works
  - Autonomy: Make decisions, propose improvements, and move
    work forward
  - A high bar for quality: Care about everything from API
    behavior to how a service recovers from failure
  - A collaborative, low-ego team: Give honest feedback, share
    knowledge, and help each other grow
  - Remote work: Work with a fully remote team, with flexibility
    around shared working hours
  - Comp: $140,000 - $180,000 USD, commensurate with location
    and experience

  About Resend

  We are building the modern email sending platform for
  developers. We care deeply about quality, craft, and the
  developer experience.

  Our fully remote team of 50 spans 15 countries and counting.
  We're backed by a16z, Y Combinator, and others. Meet the
  humans →
