description: |
  At Affirm, we exist for the moments that matter—giving
  people a clear, predictable way to pay over time, with no
  hidden fees, no surprises, and no tradeoffs on what matters
  most.

  Affirm is reinventing credit to make it more honest and
  transparent, giving consumers flexible ways to pay without
  hidden fees or compounding interest. After building a
  market-leading BNPL network with 30M+ customers, $50B+ GMV
  and 500k merchants, we’re entering our next ambitious
  chapter: transforming DTC shopping. At the center of this
  vision is the Affirm Marketplace, a rapidly scaling, high-
  leverage platform that connects consumers with merchants in
  a dynamic, two-sided ecosystem.

  About the Team

  The Risk & Analytics team makes crucial decisions that
  direct Affirm’s business strategy. Our team designs and runs
  experiments to decide which product features to launch and
  which marketing campaigns to fund. We analyze performance
  not just to report on it, but to determine where to invest
  resources for maximum impact through building tools and
  analytical frameworks. We take ownership of the entire
  analytical lifecycle, from initial question to final
  business decision, ensuring Affirm grows efficiently and
  intelligently. After building a market-leading BNPL network,
  we’re entering our next ambitious chapter: transforming DTC
  shopping. At the center of this vision is the Affirm
  Marketplace, a rapidly scaling, high-leverage platform that
  connects consumers with merchants in a dynamic, two-sided
  ecosystem.

  We’re looking for a Marketplace Analytics Lead to help
  architect and optimize the economic engine of our
  marketplace, balancing supply, demand, pricing, and user
  experience to drive sustainable growth. This is a high-
  impact IC role at the intersection of product, growth, and
  marketplace strategy.

  What You’ll Do

  - Own marketplace monetization and economics, balancing
    merchant supply, consumer demand, and pricing to drive
    engagement, conversion, and profitability
  - Monitor marketplace performance and adjust strategies based
    on engagement, relevance, merchant outcomes, LTV, and
    overall health
  - Build and maintain dashboards and reporting to track key
    Marketplace KPIs and enable data-driven decisions
  - Partner with Sales, Client Success, and Marketing to grow
    marketplace partners and increase merchant value
  - Collaborate with Product and Engineering to improve the
    effectiveness, competitiveness, and relevance of
    Marketplace inventory and offers
  - Analyze supply-side dynamics, including incentives, pricing,
    and placement, to understand elasticity and drive
    incremental GMV
  - Lead analyses and experiments to test and refine new
    placements and optimize marketplace performance
  - Conduct loan-level profitability analyses to ensure offers
    align with credit and financial goals while balancing
    consumer and merchant value
  - Evaluate affiliate portfolio performance by integrating
    network data, identifying trends, and assessing the
    incremental impact of merchant-funded incentives

  What We’re Looking For

  - 7+ years in analytics, with experience in marketplaces,
    ads/affiliate ecosystems, or two-sided platforms
  - Strong intuition for supply-demand dynamics, pricing, and
    marketplace tradeoffs
  - Experience with data tools such as SQL, Python, DBT, Sigma;
    comfortable managing ETLs and working with engineering
    teams to optimize data pipelines
  - Strong curiosity and bias toward leveraging AI tools to
    accelerate analysis, automate workflows, and increase
    personal and team productivity
  - Experience working cross-functionally with Product, GTM, and
    Engineering
  - High ownership, strong judgment, and a bias toward action

  Pay Grade - M Equity Grade - 5 Employees new to Affirm
  typically come in at the start of the pay range. Affirm
