description: |
  Join Vetcove and help modernize the future of veterinary
  software and the pet parent healthcare experience. Our suite
  of platforms features a market-leading procurement
  marketplace, an ultra-modern home delivery ecommerce
  experience, and a next-generation practice management
  system. More than 25,000 hospitals across all 50 states rely
  on Vetcove daily, supporting tens of thousands of
  veterinarians who care for tens of millions of pets each
  year.

  We are modernizing the 50 billion dollar plus animal health
  industry by giving veterinary organizations the tools to
  focus more on patient care. Backed by Y Combinator and top
  venture investors in Silicon Valley, New York and Miami,
  Vetcove is a fast-growing, mission-driven company. We are
  searching for talented and passionate people who want to
  help shape the future of veterinary care.



  About the Position

  As a Staff Frontend Engineer, you’ll lead the architecture
  and evolution of the user facing experience across Vetcove’s
  platforms. You’ll own critical frontend systems that power
  how tens of thousands of veterinary professionals and
  millions of pet parents interact with our products daily;
  from clinical workflows to patient care tools.



  This role goes beyond implementation. You’ll define frontend
  strategy, establish best practices, and shape how our
  applications scale in performance, usability, and
  maintainability. You’ll work closely with product, design,
  and backend teams to deliver seamless, high-quality user
  experiences at scale.



  About Our Team



  We’re a fast-moving team solving big challenges in a field
  that’s rapidly adopting technology. Our platform powers
  every aspect of veterinary clinic operations, from medical
  records to pet parent experiences. At Vetcove, engineers
  work across the stack and have a holistic view of the
  platform. You’ll have the opportunity to work closely with
  users, influence the product roadmap, and make a real
  difference in an industry that impacts millions of animals
  and their caregivers. We operate in a fully remote
  environment, giving you the flexibility to do your best work
  while staying deeply connected to a fast-moving, highly
  collaborative team.



  What You’ll Do



  - Lead the architecture, design, and delivery of large scale
    frontend applications across web and mobile
  - Build and evolve high performance React and React Native
    applications
  - Define and enforce frontend best practices, including
    performance optimization, accessibility, and
    maintainability
  - Develop shared component libraries, design systems, and
    frontend infrastructure to improve team velocity
  - Drive improvements in application performance, reliability,
    and user experience
  - Partner closely with product managers, designers, and
    backend engineers to deliver cohesive, user centered
    features
  - Mentor junior front end engineers
  - Influence technical direction and frontend strategy across
    multiple product areas
  - Debug and resolve complex frontend and cross stack issues



  What We’re Looking For



  - 8+ years of software engineering experience, with a strong
    focus on frontend development
  - Experience building Claude/Cursor skills to help streamline
    FE best practices
  - Bachelor’s degree required, CS or technical degree preferred
  - Deep expertise in JavaScript/TypeScript and modern frontend
    frameworks (especially React)
  - Experience architecting and scaling complex frontend
    applications and systems
  - Strong understanding of performance optimization, state
    management, and frontend architecture patterns
  - Experience building and maintaining design systems or shared
    component libraries
  - Familiarity with mobile development (React Native or
    similar) is a plus
  - Solid understanding of APIs and backend interactions (REST,
    GraphQL, etc.)
  - Proven ability to lead projects and mentor engineers
  - Strong communication skills and a product-oriented mindset
  - Comfortable operating in fast paced, evolving environments



  Tools We Use



  - Backend: Python (Django, Django Rest Framework)
  - Frontend: JavaScript (React, React-Query), TypeScript
  - Datastores: Postgres, Elasticsearch, Redis, Clickhouse
  - Mobile: React Native
  - Version Control: Git



  Benefits (Full Time Roles)

  - 100% remote within the USA
  - Medical, Dental, and Vision Insurance
  - Automatic 401k contribution
  - Employee referral program
  - At home office set up
  - Bi-annual company retreats
  - Open vacation policy
  - Equity
  - Monthly team events



  The typical base pay range for this role across the U.S. is:
  $170,000/year - $230,000/year + significant bonus + equity +
  benefits. There is a different range applicable to specific
  work locations. For Colorado, the salary range is: $190,000
  - $220,000 + bonus + equity + benefits. This salary range is
  a good faith estimate of what Vetcove may pay for this
  position at the time of posting. Actual compensation may
  vary based on skills, qualifications, and experience. The
  range reflects the base hourly rate or annual compensation
  (as applicable), and does not include bonus, equity or other
  incentives.

  In addition to base compensation, Vetcove offers a
  comprehensive benefits package. Please refer to the
  “Benefits (Full Time Roles)” section above for more Details.



  To apply, please submit your application through Vetcove’s
  Careers Page. The application deadline is accepted on an on
  going basis.

  Please note we are unable to sponsor work visas at this
  time.

