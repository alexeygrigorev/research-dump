description: |
  Job Description

  The Office of Technology and Innovation (OTI) leverages
  technology to drive opportunity, improve public safety, and
  help government run better across New York City. From
  delivering affordable broadband to protecting against
  cybersecurity threats and building digital government
  services, OTI is at the forefront of how the city delivers
  for New Yorkers in the 21st century. Follow us on social
  media @NYCOfficeofTech, and visit www.nyc.gov/oti to learn
  more. At OTI, we offer great benefits, and the chance to
  work on projects that have a meaningful impact on millions
  of people. You'll have the opportunity to work with cutting-
  edge technology and collaborate with other passionate
  professionals who share your drive and commitment to making
  a difference through technology. OUR WORK The Public
  Interest Technology (PIT) Crew, at the NYC Office of
  Technology and Innovation, is a new team that builds the
  technology, products, and services needed to deliver a more
  affordable New York City. We design, build, and launch
  exceptional public-facing products for New Yorkers. Learn
  more at nyc.gov/pitcrew. JOB DESCRIPTION We are hiring
  Senior Product Engineers across the stack to design, build,
  and ship resident-facing products. This is a hands-on role.
  You will pair closely with product managers, designers, user
  researchers, policy teams, and other city employees to move
  from problem statements to working products and services for
  New Yorkers. You will write code across systems, integrate
  with city agency data sources and legacy systems, and work
  alongside policy and legal stakeholders. You will also lead
  modern engineering practices for the team: how we use
  generative coding tools, productionize, document processes,
  responsibly hand off products to other teams for production
  support, and balance speed with the reliability standards of
  a city government service. Responsibilities will include,
  but not limited to:
  - Design, build, and ship applications from concept to launch.
    Own meaningful components of the product end-to-end or
    focus on specific components (frontend, backend, mobile,
    or data pipelines) as needed.
  - Move quickly through rapid prototyping, MVP iteration,
    pilot, and public launch, making pragmatic tradeoffs
    between scope, quality, and timing.
  - Build integrations with government data sources, including
    modern APIs, flat-file feeds, open data portals, and older
    legacy systems that may require creative solutions.
  - Partners with product managers, designers, engineers, and
    other OTI employees on day-to-day product decisions,
    participate in user research and design reviews, and
    contribute to scoping and prioritization.
  - Coordinate with the wider OTI team on hosting, performance
    testing, accessibility audits, and security reviews so
    that products meet the city's quality and production
    standards.
  - Work directly with agency staff, policy advisors, and legal
    counsel to translate complex eligibility rules and
    regulations into clear, accurate product logic.
  - Write clear technical documentation, runbooks, and
    architecture notes so that products can be maintained and
    extended after launch.
  - Contribute to reusable patterns, components, and
    infrastructure that make the next quarter's project faster
    to ship than the last one.
  - Help shape the engineering culture of a small, mission-
    driven team, including code review, mentorship, and
    onboarding for future hires.
  - Perform special projects and initiatives as assigned.
  HOURS/SHIFT Day - Due to the necessary technical duties of
  this position in a 24/7 operation, candidate may be required
  to work various shifts such as weekends and/or
  nights/evenings. WORK LOCATION Brooklyn, NY TO APPLY Please
  go to www.cityjobs/jobs/search and search for Job ID #782364
  * Interested applicants with other civil service titles who
  meet the preferred requirements should also submit a resume
  for consideration SUBMISSION OF A RESUME IS NOT A GUARANTEE
  THAT YOU WILL RECEIVE AN INTERVIEW APPOINTMENTS ARE SUBJECT
  TO OVERSIGHT APPROVAL OTI participates in E-Verify SENIOR IT
  ARCHITECT - 95711

  Qualifications

  1. A baccalaureate degree from an accredited college in
  computer science, information systems, engineering,
  mathematics or related field and six years of satisfactory
  full-time experience related to enterprise architecture,
  solutions architecture, network architecture and/or IT
  infrastructure systems; or 2. A baccalaureate degree from an
  accredited college and ten years of satisfactory full-time
  experience related to enterprise architecture, solutions
  architecture, network architecture and/or IT infrastructure
  systems; or 3. Education and/or experience which is
  equivalent to "1" or "2" above.

  Additional Information

  The City of New York is an inclusive equal opportunity
  employer committed to recruiting and retaining a diverse
  workforce and providing a work environment that is free from
  discrimination and harassment based upon any legally
  protected status or protected characteristic, including but
  not limited to an individual's sex, race, color, ethnicity,
  national origin, age, religion, disability, sexual
  orientation, veteran status, gender identity, or pregnancy.
