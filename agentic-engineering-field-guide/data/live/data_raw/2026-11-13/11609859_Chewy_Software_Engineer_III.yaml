description: |
  Job Description: Our Opportunity: Chewy is seeking Senior
  Software Engineer, Level III in Boston, MA or Minneapolis
  MN. Chewy is growing! We're looking for a Senior Backend
  Software Engineer to join our team developing Chewy.com.
  Chewy is THE go-to online shopping destination for all
  things pet and we are continuously striving to delight pet
  parents with a seamless experience across our platforms.

  - Are you a passionate and energetic Software Engineer?
  - Are you excited about developing solutions focused on
    providing delightful customer experience?
  - Are you able to easily adapt to meet the needs of our
    continuous business growth?
  - Are you a quality focused engineer with a operational
    excellence mindset?

  If your answer is yes, read on... We are looking for a
  Senior Software lead engineer for our core customer
  platforms. Customer platforms are a critical P0 platform
  powering Chewy.com & Chewy App experiences. Delivering
  reliable and high-performance services and features at
  Chewy's scale requires engineers with extraordinary
  expertise and boundless creativity. As a lead engineer in
  our team you will work with a talented group of backend and
  frontend engineers, product managers and business leaders in
  an Agile environment. As part of a dynamic team, this role
  offers a tremendous opportunity for professional growth in
  the leading online pet retailer in the United States. Our
  team @Chewy is focused on building solutions which guide pet
  lovers in making their best, most informed decisions to
  purchase products that their pets love, every single day.
  What to expect in this Role:

  - Design and Architecture on scalable performant event driven
    /service architectures (#ThinkBig, #ActAsOwner)
  - Independently own and lead initiatives end to end. Establish
    AI first mindset for accelerating delivery from ideation
    to release (#ActAsAOwner)
  - Guide /mentor junior engineers; (#BuildHighPerforming teams)
  - Own implementations with focus to drive high scalable,
    performant bug free delivery. Own operational excellence
    core metrics to build out effective anomaly detection/
    monitoring and self-healing platforms (#DeliverResults)

  What You'll Do:

  - Drive & own key initiatives end to end from ideation to
    delivery , including design implementation, test and
    release.
  - Design & architect enterprise scale platforms and build new
    features and capabilities to power personalization on
    chewy.com
  - Implement core capabilities - Write scalable, performant,
    readable and tested code.
  - Own solutions for improving the high bar of operational
    excellence core metrics of SLA, latency, Availability,
    resiliency.
  - Participate in technical decisions and collaborate with
    talented peers
  - Review code, implementations and give meaningful feedback
    that helps others build better solutions
  - Write documentation on design, architecture and solutions
  - Provide mentorship and guidance for peers and more junior
    engineers
  - Establish strong working relationships at all organizational
    levels and across functional teams
  - Take responsibility and ownership of project timelines and
    deliverables

  What You'll Need:

  - Strong knowledge and experience developing large scale
    platforms using tools including but not limited to
    Java/Kotlin, Spring, RESTful Webservices, Kafka, Federated
    Graphql, OpenSearch, Graph DB', Datadog, Jenkins, AWS
  - 7+ years of working primarily on the server-side
    technologies (e.g. Spring Boot, Java/Kotlin, Kafka,
    Graphql).
  - 5+ years of hands-on experience designing and developing
    scalable, high performing and fault-tolerant applications
    for large enterprises.
  - Experience with event driven architectures & service-
    oriented architectures
  - Experience architecting systems with multiple domain
    dependencies and cross cutting concerns
  - Expertise in measuring, evaluating, and tuning application
    performance
  - Hands on experience working in a public cloud environment.
  - A Bachelor's degree in Computer Science or related field or
    equivalent experience

  Bonus:

  - Experience designing and developing tests within a test
    automation framework. Experience in Test Driven
    Development
  - Ai Native or Ai first development and tooling to showcase
    clear delivery velocity acceleration.
  - Background in e-commerce. Agentic Commerce engagement.

  - The specific salary offered to a candidate may be influenced
    by a variety of factors including but not limited to the
    candidate's relevant experience, education, and work
    location. In addition, this position is eligible for 401k
    and a new hire and annual equity grant. C08+ positions may
    also be eligible for annual bonus.

  We offer different types of insurance and benefits, such as
  medical/Rx, vision, dental, life, disability, hospital
  indemnity, critical illness, and accident. We offer parental
  leave, family services benefits, backup dependent care,
  flexible spending accounts, telemedicine, pet adoption
  reimbursement, employee assistance program, and many
  discounts including 10% off pet insurance and 20% off at
  Chewy.com. Exempt salary team members have unlimited PTO,
  subject to manager approval. Team members will receive six
  paid holidays per year. Team members may be eligible for
  paid sick and family leave in compliance with applicable
  state and local regulations. Chewy is an equal opportunity
  employer. All qualified applicants will receive
  consideration for employment without regard to race, color,
  ancestry, national origin, gender, citizenship, marital
  status, religion, age, disability, gender identity, results
  of genetic testing, veteran status, as well as any other
  legally-protected characteristic. If you have a disability
  under the Americans with Disabilities Act or similar law,
  and you need an accommodation during the application process
  or to perform these job requirements, or if you need a
  religious accommodation, please contact CAAR@chewy.com. To
  access Chewy's California CPRA Job Applicant Privacy Policy,
  please click here.
