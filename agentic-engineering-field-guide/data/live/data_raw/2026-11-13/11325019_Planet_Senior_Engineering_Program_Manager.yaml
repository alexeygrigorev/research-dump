description: |
  Welcome to Planet. We believe in using space to help life on
  Earth.

  Planet designs, builds, and operates the largest
  constellation of imaging satellites in history. This
  constellation delivers an unprecedented dataset of empirical
  information via a revolutionary cloud-based platform to
  authoritative figures in commercial, environmental, and
  humanitarian sectors. We are both a space company and data
  company all rolled into one.

  Customers and users across the globe use Planet's data to
  develop new technologies, drive revenue, power research, and
  solve our world’s toughest obstacles.

  As we control every component of hardware design,
  manufacturing, data processing, and software engineering,
  our office is a truly inspiring mix of experts from a
  variety of domains.

  We have a people-centric approach toward culture and
  community and we strive to iterate in a way that puts our
  team members first and prepares our company for growth. Join
  Planet and be a part of our mission to change the way people
  see the world.

  Planet is a global company with employees working remotely
  world wide and joining us from offices in San Francisco,
  Washington DC, Germany, Austria, Slovenia, and The
  Netherlands.

  About the Role:

  As a Senior Engineering Program Manager (EPM) at Planet you
  will sit at the intersection of our hardware, engineering,
  and external partnerships to drive complex spacecraft
  programs from inception to launch. You will help set
  strategy, drive problem-solving efforts, eliminate
  roadblocks, execute on schedule, and you will be responsible
  for managing and communicating status and issues along the
  way. The ideal candidate has deep technical expertise and
  experience in multiple areas of spacecraft design and
  manufacturing.

  This is a full-time, in-office position based in our Berlin
  manufacturing hub 5 days per week.

  Impact You’ll Own:

  - Lead satellite development programs from planning and
    requirements definition through critical design, build,
    test, and launch.
  - Ensure efficient execution of all program phases, including
    MCR, SRR, PDR, CDR, IRR, SRR, and LRR.
  - Develop project schedules and budgets and track performance
    across all project phases.
  - Oversee execution of technical plans at all levels, both
    internally and with external suppliers, including project
    definition, budgeting, and long-term strategic planning.
  - Collaborate and coordinate with external stakeholders,
    including suppliers, partners, vendors, and customers, to
    manage deliverables, technical plans, and program
    milestones.
  - Coordinate schedules, priorities, and status updates with
    engineering, manufacturing, teams, stakeholders, and
    management.
  - Work directly with multiple engineering teams and cross-
    functional stakeholders to drive productivity and progress
    on concurrent projects.
  - Develop tools and processes to measure and improve
    engineering productivity.
  - Drive root cause problem-solving, identify, and eliminate
    blocking issues.
  - Work directly with Program Management, Manufacturing
    Operations, Supply Chain to drive progress on concurrent
    manufacturing lines and initiatives.
  - Lead manufacturing ramp programs from early factory
    engagement and readiness through key build phases into
    production.
  - Drive root cause analysis for complex engineering and
    manufacturing issues, identify and eliminate blocking
    problems, and implement robust corrective actions.

  What You Bring:

  - 10+ years of relevant experience of program management in
    aerospace, manufacturing or similar industry.
  - Bachelor’s degree in Aerospace Engineering, Mechanical
    Engineering, Electrical Engineering, Manufacturing
    Engineering, or a related technical field.
  - Excellent written and verbal communication and facilitation
    skills, including externally to customers.
  - Proficiency in spoken and written German and professional
    working proficiency in English, the language of the
    company.
  - Experience in an engineering program management role for the
    development and ramp of hardware systems in a cross-
    functional context.
  - Capability to exercise creative and critical thinking in
    project execution.
  - Experience working with and managing external contract
    manufacturers (CMs), suppliers, and vendors to drive
    program success.
  - Excellent written and verbal communication and facilitation
    skills, with the ability to present complex technical
    information clearly to diverse audiences.
  - Ability to travel internationally, specifically to San
    Francisco about 2-3 times a year.

  What Makes You Stand Out:

  - Experience with satellite manufacturing and AI&T.
  - Experience with customer management on satellite programs.
  - Excellent problem-solving, organizational, and analytical
    skills, with the ability to drive strategy based on data.

