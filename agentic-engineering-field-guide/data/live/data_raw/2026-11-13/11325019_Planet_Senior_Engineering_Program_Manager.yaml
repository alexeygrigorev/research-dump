  Why we care so much about Belonging.  We’re dedicated to
  helping the whole Planet, and to do that we must strive to
  represent all of it within each of our offices and on all of
  our teams. That’s why Planet is guided by an ultimate north
  star of Belonging—dreaming big as we approach our ongoing
  work.  If this job intrigues you, but you’re thinking you
  might not have all the qualifications, please... do apply!
  At Planet, we are looking for well-rounded people from
  around the world who can contribute to more ways than just
  what is listed in this job description.  We don’t just fill
  positions, we aspire to fulfill people’s careers, most
  excited about folks who are motivated by our underlying
