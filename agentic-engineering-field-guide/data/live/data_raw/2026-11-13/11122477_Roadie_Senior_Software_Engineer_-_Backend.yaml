description: |
  Roadie, a UPS company, is a leading logistics and delivery
  platform that helps businesses tackle the complexities of
  modern retail with unmatched delivery coverage, flexibility
  and visibility. Reaching 97% of U.S. households across more
  than 30,000 zip codes — from urban hubs to rural communities
  — Roadie provides seamless, scalable solutions that meet a
  variety of delivery needs.

  With a network of more than 310,000 independent drivers
  nationwide, Roadie offers flexible delivery solutions that
  make complex logistics challenges easy, including solutions
  for local same-day delivery, delivery of big and bulky
  items, ship-from-store and DC-to-door. For more information,
  visit www.roadie.com.

  As a Senior Software Engineer at Roadie, you’ll design and
  build systems that power large-scale logistics solutions.
  You’ll play a key role in evolving the architecture of
  Roadie’s platform to meet growing scalability and
  performance needs. The ideal candidate has strong technical
  experience, enjoys solving complex problems, and thrives in
  a collaborative environment.

  What You’ll Do

  - Design, build, and maintain core services and infrastructure
    that drive Roadie’s logistics platform
  - Identify and address performance bottlenecks, ensuring
    reliability and scalability
  - Collaborate closely with Product, Data Science, and other
    engineering teams to deliver impactful features
  - Contribute to code reviews, technical discussions, and the
    improvement of engineering best practices
  - Take ownership of projects from concept to production,
    balancing speed and quality
  - Stay up to date with new technologies and bring forward
    ideas to improve our systems

  Technology We’re Using

  - Languages: Golang, Ruby on Rails
  - Data: Postgres, Redis, Kafka
  - Infrastructure: AWS, Docker, Kubernetes
  - Tools: git, GitHub, CircleCI

  What You Bring

  - 6+ years of professional software development experience
  - Solid understanding of service-oriented architecture,
    distributed systems, and API design
  - Proficiency in Golang or Ruby
  - Experience working with or migrating from a monolithic
    architecture
  - Strong problem-solving and communication skills
  - Ability to collaborate effectively in a team environment

  Why Roadie?

  - Competitive compensation packages
  - 100% covered health insurance premiums for yourself
  - 401k with company match
  - Tuition and student loan repayment assistance (that’s right
    - Roadie will contribute directly to your existing student
    loans!)
  - Flexible work schedule with unlimited PTO
  - Monthly 3-day weekends
  - Monthly WFH stipend
  - Paid sabbatical leave - tenured team members are given time
    to rest, relax, and explore
  - The technology you need to get the job done

  This role is not eligible for visa sponsorship. Applicants
  must be authorized to work for any employer in the U.S.
