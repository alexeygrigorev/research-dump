description: |
  At Oversee, we build practical AI solutions for the $1.6
  trillion global travel industry.

  For over a decade, we have helped travel agencies and global
  enterprises cut travel costs and work more efficiently. Our
  AI-based reshopping products, FareSaver for air and
  HotelSaver for hotels, track booked trips and automatically
  rebook them when a better rate becomes available.

  AgentSee, our agentic AI platform, works alongside travel
  agents. It reads traveler requests, handles bookings and
  changes, and takes on routine servicing tasks, so agents can
  manage more trips while improving service quality.

  We work with the largest travel agencies and fortune 500
  companies, supporting over $15B in annual booking volume for
  more than 11,000 customers in over 60 countries.

  If you want to solve real problems with a focused team in a
  fast-moving market, Oversee is the place to build, grow, and
  make an impact.

  Why join us?

  You will join our AI team and help build production-grade AI
  agents used by global enterprises. You’ll work on real-world
  problems at the intersection of LLMs, automation, and large-
  scale travel data, with the freedom to shape both the
  technology and the product.

  You’ll work on production AI systems, not demos. Think agent
  orchestration, retrieval systems, tool calling, workflow
  automation, large-scale integrations, and real-time
  decision-making.

  Come shape the future of business travel with us!

  What you’ll do:

  - Design, build, and scale AI-driven systems that power our
    virtual agent capabilities, including conversational
    reasoning, retrieval, tool calling, and automation
    workflows;
  - Develop backend services and data pipelines that integrate
    multiple APIs, including Amadeus, Sabre, internal systems,
    and third-party platforms, to support real-time decision-
    making;
  - Build and deploy AI agents that solve real-world business
    problems;
  - Design evaluation, testing, and observability systems to
    understand how agents behave in production and
    continuously improve their accuracy and reliability;
  - Solve the engineering challenges that come with
    probabilistic AI systems, including latency, failures,
    model behavior, cost, and scalability;
  - Own problems end-to-end, from understanding the problem and
    shaping the technical approach through implementation,
    deployment, and production monitoring;
  - Own architecture decisions for distributed, high-performance
    AI applications;
  - Help define engineering best practices and contribute to the
    technical direction of the team;
  - Collaborate closely with Product and other teams to turn
    complex business problems into reliable AI-powered
    solutions.

  About you:

  - 5+ years of experience building production software systems;
  - Strong Python and backend engineering skills;
  - Strong experience designing and developing scalable,
    distributed applications;
  - Hands-on experience building and shipping LLM-powered
    products or features to production;
  - Experience with AI agents, agentic workflows, RAG, tool
    calling, or orchestration systems;
  - Strong understanding of the challenges of production AI
    systems, including evaluation, reliability, latency, cost,
    and failure handling;
  - Comfortable owning problems end-to-end and making technical
    decisions with a high degree of autonomy;
  - Comfortable using modern AI coding tools as part of your
    day-to-day engineering workflow while maintaining strong
    ownership of code quality and technical decisions;
  - Solid understanding of Linux runtime environments;
  - Experience identifying and solving performance bottlenecks;
  - Fluent English, written and spoken;
  - Curious, proactive, and excited about learning new
    technologies;
  - Comfortable operating in a fast-moving environment where
    requirements can evolve and engineers have significant
    ownership.

  Bonus points if you have:

  - Experience designing evaluation or monitoring systems for
    production LLM applications;
  - Experience with embeddings, vector databases, and advanced
    retrieval architectures;
  - Familiarity with frameworks and protocols such as LangChain,
    LangGraph, LlamaIndex, Google ADK, CrewAI, MCP, or
    similar;
  - Experience experimenting with different models, retrieval
    approaches, or agent architectures;
  - Exposure to travel-tech or GDS integrations, particularly
    Sabre, Amadeus, or Travelport;
  - Hands-on experience with Kubernetes, AWS, Terraform, and
    CI/CD tooling;
  - Open-source contributions, side projects, or technical
    writing

  Our technology stack:

  - Backend: Python, Django, Kotlin
  - Frontend: TypeScript, React
  - Infrastructure: Kubernetes, AWS, Terraform
  - Data: High-scale pipelines & distributed systems

  If you’re excited about building real AI products and not
  just talking about them, we’d love to meet you.

  We are proud to be an equal opportunity workplace.

  We provide employment opportunities without regard to race,
  color, ancestry, religion, sex, national origin, sexual
  orientation, age, citizenship, marital status, disability,
  gender identity or expression, or veteran status.
