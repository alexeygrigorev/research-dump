description: |
  Are you ready to shape the future of technology at
  JPMorganChase? As a Senior Lead Software Engineer, you will
  be part of an agile team that thrives on collaboration and
  continuous improvement. You’ll have the opportunity to make
  a significant impact by delivering trusted, market-leading
  products in a secure and scalable environment. We value your
  deep technical expertise and problem-solving skills, and
  offer a culture that encourages growth, learning, and
  innovation. Together, we build solutions that empower our
  workforce and drive business success.



       As a Senior Lead Software Engineer in Employee
  Platform: Workforce Experience Technology, you will play a
  pivotal role in enhancing, building, and delivering top-tier
  technology products. You will apply your technical expertise
  to solve diverse challenges across multiple technologies and
  applications. You’ll drive business impact through your
  contributions, foster a collaborative team culture, and help
  shape the direction of our products and processes. Your
  leadership will support the team’s growth and ensure our
  solutions are secure, stable, and scalable.







  Job Responsibilities:



  - Provide technical guidance and direction to support teams,
    contractors, and vendors
  - Develop secure, high-quality production code and
    review/debug code written by others
  - Drive adoption and governance of approved AI-assisted
    engineering practices to improve code quality, delivery
    speed, and operational outcomes
  - Establish and promote validation standards such as secure
    coding, peer review, and automated testing
  - Apply knowledge of tools within the Software Development
    Life Cycle toolchain, including AI-assisted development
    and automation capabilities
  - Influence product design, application functionality, and
    technical operations
  - Serve as a subject matter expert in one or more areas of
    focus
  - Advocate firmwide frameworks, tools, and practices within
    the engineering community
  - Promote reuse of proven patterns and automation within the
    SDLC/TLM toolchain
  - Contribute to decisions that enhance technical operations
    and processes
  - Actively participate in the engineering community to share
    best practices



  Required Qualifications, Capabilities, and Skills:



  - Formal training or certification in software engineering
    concepts
  - Hands-on experience in system design, application
    development, testing, and operational stability
  - Advanced proficiency in one or more programming languages
  - Demonstrated experience leading the use of enterprise-
    authorized AI-assisted software development tools
  - Ability to set team expectations for validating AI outputs
    for correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity and secure handling
    of inputs/outputs
  - Experience coaching senior engineers/leads on compliant
    usage patterns and controls
  - Ability to solve design and functionality problems
    independently
  - Practical cloud native experience



  Preferred Qualifications, Capabilities, and Skills:



  - AWS Certification (Developer, AI Developer, or similar)
  - UI Development (React, Micro Frontend, BFF patterns)
  - Java / Springboot
  - Experience with Claude / Co-Pilot
  - PostgreSQL development
  - Neptune / Graph Development
  - Figma / Lucid
  - Data visualization tools and reporting frameworks



  Why Join Us? We offer a collaborative environment where you
  can grow your career, work with cutting-edge technologies,
  and make a meaningful impact. Join us to be part of a team
