description: |
  Aviso:

  At Aviso, we are dedicated to improving the financial well-
  being of Canadians. As a leading wealth management
  organization, we are committed to leadership, innovation,
  partnership, responsibility, and community. Working with
  talented and energetic professionals who exemplify our
  values every day, you will quickly notice that our people
  and dynamic ‘oneaviso’ culture sets us apart. If you are
  looking for interesting and challenging work, at a company
  committed to its people, find out more about what Aviso has
  to offer at www.aviso.ca.

  The Opportunity:

  We’re looking to fill an opening for a 12 Month Temporary
  Manager, Software Engineering to join our Technology Team.

  Reporting to the Director, Software Engineering, the
  Manager, Software Engineering, works closely with other
  Technology Leaders to remove systemic organizational
  blockers, while providing leadership, skills development
  opportunities and coaching to Team Leaders as well as Front-
  End, Full-Stack and Cloud Engineers reporting into them.

  This role will own the Software Engineering processes &
  roadmap, responsible for providing visibility and
  eliminating bottlenecks to delivery flow within the Teams,
  embedding governance & standardization across the
  Engineering function while partnering with other Business
  and Technology Leaders on evolving the Engineering practice
  including following standards & best practices, implementing
  DevOps practices and code quality gates.

  As oneaviso:

  - We Care – You do the right thing for clients, partners and
    colleagues. You build trusted relationships, champion
    service excellence, and contribute to a culture where
    people feel valued and supported

  - We Dare –You challenge the status quo with bold ideas and
    fresh perspectives. You embrace change, seek opportunities
    to innovate and are comfortable exploring new ways of
    working

  - We Share – You collaborate openly and build meaningful
    relationships. You seek out diverse perspectives, share
    your knowledge and work together to help colleagues,
    clients and partners succeed

  - We Deliver – You take ownership of your work, honour your
    commitments and focus on delivering meaningful results.
    You hold yourself accountable and continuously look for
    ways to improve

  What your day looks like:

  - Provide leadership and coaching to elevate high-performing
    teams, bringing a continuous learning and problem-solving
    mindset to deliver business solutions
  - Collaborate in the planning, coordination, execution, and
    delivery of complex cross-team engineering initiatives
    identifying risk and suggesting solutions to optimize
  - Continual assessment of the current state of Software
    Engineering organization, staying abreast of industry
    trends and emerging technologies to identify strategic
    opportunities and aligning the Software Engineering
    roadmap with the Enterprise Architecture vision and
    organization goals
  - Establish Team and professional development goals, action
    plans and influencing desired outcomes using SMART metrics
    and feedback loops
  - Build relationships and align Team expectations with
    business partners and internal entities, such as
    Technology Operations and Security
  - Facilitate effective collaboration, deployment planning,
    decision-making, issue resolution among management and
    Team members
  - Provide technical feedback to the Teams to ensure software
    standards, architectural, and corporate security policies
    are applied in the Team governance
  - Organize and conduct presentations at multi-Team alignment
    planning sessions
  - Monitor and evaluate the impact of coaching activity and
    adjust the approach as needed to drive team effectiveness
  - Understand flow metrics and provide recommendations for
    improvement through data-driven Team reporting and
    analytics

  Requirements

  Your experience and skills:

  - Degree in Computer Science, Engineering, Technical Diploma,
    or relevant software development work experience
  - Certified in Product Management, Organizational Change and
    Leadership, SAFe/ Agile-related methodologies, and/or a
    similar professional certification
  - Previous experience as a high performing Software
    Engineering or Technical Product Manager leading delivery
    of software in a fast-paced environment (7-10 years)
  - Strong understanding of Software Engineering best practices
    (Design patterns, Trunk-based delivery, Feature Flags,
    etc), secure coding concepts and DevSecOps practices
  - Experience with GitHub Co-pilot, Cloud Development (Azure),
    Microservices API architecture (Spring Boot, .NET Core),
    AI-driven development and DevOps concepts such as
    Container technologies (Docker)
  - Experience in IT operational processes (i.e. ITIL, IT
    security governance processes - NIST, etc) an asset
  - Excellent verbal, presentation, and written communication
    skills for technical and business audiences (including
    upwards, sideways, and downwards communications in the IT
    organization)
  - Fluent communications skills in English are required and
    bilingual skills in French are an asset
  - Strong problem-solving, decision making, organizing, and
    conflict-resolution ability
  - Strong teaching and training skills and ability to impart
    knowledge, skills, and best practices
  - Solid organizational skills and ability to prioritize, plan,
    document, schedule, and meet deadlines
  - A high degree of Emotional Intelligence, including listening
    skills, questioning skills, trust-building, coaching
    skills, and the ability to empathize with others’ emotions
  - Passionate about continuous learning and personal
    development

  Benefits

  Why Aviso Wealth?

  At Aviso Wealth, you will find a dynamic and inclusive
  culture that rewards innovation and celebrates success.
  Here are a few things that set us apart:

  - Competitive compensation package that rewards and recognizes
    individual contributions
  - Excellent health, dental and insurance benefits to meet the
    diverse needs of our employees
  - Generous vacation time, fitness benefit, parental leave top-
    up options
  - Matching contributions to our retirement program
  - Commitment to the continuous improvement of our staff
    through learning & development and an education assistance
    program
  - Regular social events to foster teamwork

  Your Information

  By submitting your application, you consent to the
  collection, use, and disclosure of your provided personal
  information for the purposes of assessing your
  qualifications and suitability for employment with Aviso.
  Your information will be handled in accordance with
  applicable Canadian privacy laws, including the Personal
  Information Protection and Electronic Documents Act (PIPEDA)
  and relevant provincial legislation. Your data may be shared
  with authorized personnel involved in the recruitment
  process and retained only as long as necessary to fulfill
  these purposes or as required by law.

  Further information is available on the Privacy link on our
  Career Page – Privacy Policies

  Equal Employment Opportunity

  Aviso welcomes and encourages applications from all
  qualified individuals including persons with disabilities.
  If you require an accommodation, we will work with you to
  meet your needs in all stages of the hiring process.

  We thank all applicants for their interest, however, only
  those selected for further consideration will be contacted.

  No recruiters or agencies, please.

  Company Overview:

  Aviso is a leading wealth management and investment services
  provider for the Canadian financial industry, with
  approximately $145 billion in total assets under
  administration and management, and over 1,000 employees.
  We’re building a comprehensive, technology-enabled, client-
  centric wealth services ecosystem. Our clients include our
  partners, advisors, and investors. We’re a trusted partner
  for nearly all credit unions across Canada, in addition to a
  wide range of portfolio managers, investment dealers,
  insurance and trust companies, and introducing brokers. Our
  partners depend on Aviso for specific solutions that give
  them a competitive edge in a rapidly evolving, highly
  competitive industry. Our investment dealer and mutual fund
  dealer and our insurance services support thousands of
  investment advisors. Our asset manager, NEI Investments,
  specializes in investing responsibly. Our online brokerage,
  Qtrade Direct Investing®, empowers self-directed investors,
  and our fully automated investing service, Qtrade Guided
  Portfolios®, serves investors who prefer a hands-off
  approach. Aviso Correspondent Partners provides custodial
  and carrying broker services to a wide range of firms. We
  have offices in Toronto, Vancouver, Montreal, and Winnipeg.
  Aviso is backed by the collective strength of our owners:
  the credit union Centrals, Co-operators/CUMIS, and
  Desjardins. We’re proud to power businesses that empower
  investors.

  A career with Aviso means being part of a group of talented,
  energetic professionals who live their values every day, and
  belonging to an organization dedicated to your success and
  career development. If you’re looking for interesting and
  challenging work, at a company committed to its people,
  apply to join our team.

  Salary

  This position is posted with an expected salary range of
  $145,000 - $160,000 CAD annually. Individual compensation
  packages are based on various factors unique to each
  candidate and the requirements of the position.

