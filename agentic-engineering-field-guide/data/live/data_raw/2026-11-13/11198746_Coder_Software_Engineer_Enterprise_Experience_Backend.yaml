description: |
  As a Backend Engineer on Coder's Enterprise Experience team,
  you'll build the features that help large organizations run
  Coder in production with confidence. The team owns what
  administrators and operators need to run Coder well. That
  covers how it scales, how it's upgraded, how reliably it
  performs, how it's observed and reported on, how activity is
  held accountable, and how it's secured.

  You'll join a cross-functional team of backend, platform,
  and QA engineers who own the operator experience end to end.
  You'll ship features from design through production and
  partner with product and design to solve real operator
  problems.

  What you'll do here

  - Build features end to end, from a design you write within
    the team's existing approach through production rollout.
  - Write database migrations that follow the team's patterns
    for schema compatibility and safe upgrades.
  - Build the observability, reporting, and audit features
    administrators rely on to see what their deployment is
    doing.
  - Build features that keep enterprise deployments secure,
    following the team's security practices.
  - Help investigate and resolve scalability bottlenecks under
    production-like load, from database access patterns to
    concurrency in coderd.
  - Help resolve backend issues surfaced by Coder operators and
    administrators.
  - Document the features you build so a reviewer and the next
    engineer do not have to decode them.
  - Participate in code reviews, contribute to RFC-style design
    discussions, and join the on-call rotation.

  What we're looking for

  - 2+ years of professional software engineering experience.
  - Professional experience writing and shipping Go.
  - Working understanding of Go's concurrency model, including
    goroutines, channels, and the sync package.
  - Comfortable with SQL, schema changes, and writing
    migrations.
  - Strong verbal and written communication skills, including
    surfacing blockers and uncertainty early.
  - Solid debugging skills and the persistence to work a
    problem, and to escalate early when stuck.
  - A self-motivated, analytical engineer who enjoys difficult
    technical challenges.

  Bonus tacos if you have

  - (Tacos? If you need an ice-breaker, ask how we say thanks by
    giving tacos!)
  - Experience investigating performance under real-world load,
    including debugging race conditions.
  - Experience with observability, audit, or security features
    in an enterprise product.
  - Experience with major cloud providers, Kubernetes, and
    container orchestration.
  - Experience building or operating distributed systems at a
    meaningful scale.
  - Curiosity about the latest developer tooling.

  Our tech stack

  - Backend: Go, Postgres, Kubernetes, gRPC
  - Observability: Prometheus, Grafana
  - CI/CD: GitHub Actions
  - General: GitHub, Slack, Discord, Notion

  About Coder

  Coder is the leading platform for AI development
  Infrastructure, enabling enterprises to securely run human
  and AI-driven development workflows in consistent, governed
  environments. Coder provides self-hosted, agent-ready
  workspaces that unify developer productivity and platform
  governance. With Coder, enterprises can confidently evolve
  from human-only development to AI-assisted and autonomous
  workflows, without sacrificing security, compliance, or
  performance. Learn more at coder.com.

  Interview process

  We believe that the interview process should be transparent,
  consistent, and enjoyable. We value your time and hope to
  complete the interview process in two to four weeks, if
  schedules allow. Through your interviews, you will meet a
  mix of individual contributors, managers, and senior
  leaders.

  AI use during the interview process

  As an AI company, Coder embraces the use of AI tools, and we
  want to be transparent about our expectations as you
  navigate our interview process.

  Not permitted: Using AI assistance during conversational
  interviews.

  Permitted: Using AI tooling for take-home assessments.
  Please flag where and to what extent it was used in your
  take-home. Your submission will not be penalized for using
  AI as long as it is done honestly.

  Our use of AI in hiring

  We use AI tools to help manage our recruitment process
  efficiently and fairly. Specifically:

  - Ashby and Brainerr help us review inbound applications by
    surfacing candidates who best match the role requirements
    we've defined. This tool does not make hiring decisions;
    it helps our team prioritize which applications to review
    first.
  - Granola takes notes during our interview calls so our team
    can focus on the conversation with you.

  All hiring decisions are made by humans. Our team reviews
  applications, conducts interviews, and makes final
  selections. AI tools assist us but never replace human
  judgment, and these practices are conducted in compliance
  with applicable data protection, AI governance, and labor
  laws. Your data is not used to train AI models.

  In accordance with New York City Local Law 144, an
  independent bias audit has been conducted on "Automated
  Employment Decision Tools"; results are available for Ashby.

  If you're applying for a role at Coder and have questions
  about how we use AI in our process, or if you'd like to
  request information about the data we collect, please
  contact careers@coder.com.



