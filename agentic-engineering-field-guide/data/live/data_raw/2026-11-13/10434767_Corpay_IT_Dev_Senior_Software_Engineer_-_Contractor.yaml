description: |
  Your roleWhat you'll be doing

  What We Need

  Corpay is currently looking to hire a IT Dev Senior
  (Software Engineer) – Contractor. In this role, you will
  work within Corpays technology function to deliver effective
  support to both external clients/suppliers and colleagues
  across all applications. Responsible for investigating
  software issues raised by clients, identifying the
  appropriate solution, and prioritizing against the client’s
  business requirements, planned future development and
  available resource.

  How We Work

  Working as a IT Dev Senior (Software Engineer) – Contractor,
  Corpay will set you up for success by providing:

  - Company-issued equipment + remote access
  - Formal, hands-on training

  Role Responsibilities

  The responsibilities of the role will include:

  - Investigating verified application issues within defined
    timelines depending on priority of the issues
  - Identifying resolutions whilst ensuring the integrity of the
    software application in relation to the generic customer
    base.
  - Creating detailed technical support documentation where
    required.
  - Providing support and guidance to users and colleagues
  - Working closely with the Design, Test and Development teams
    to ensure we understand future functionality and deliver a
    consolidated solution.
  - Specifying, developing and implementing interfaces to
    support the core product.
  - Inputting into the production of detailed estimates of
    resource timings.
  - To be responsible for monitoring personal project
    performance against the plan and, where necessary, take
    appropriate corrective actions to ensure project goals are
    met.

  About Corpay

  Corpay is a global technology organisation that is leading
  the future of commercial payments with a culture of
  innovation that drives us to constantly create new and
  better ways to pay. Our specialized payment solutions help
  businesses control, simplify, and secure payment for fuel,
  general payables, toll and lodging expenses. Millions of
  people in over 80 countries around the world use our
  solutions for their payments.

  All offers of employment made by Corpay (and its subsidiary
  companies) are subject to the successful completion of
  satisfactory pre-employment vetting by an independent
  supplier (Experian). This is in accordance with Corpay's
  Resourcing Policy and include employment referencing,
  identity, adverse financial, criminal and sanctions list
  checks. We do this to meet our legal and regulatory
  requirements.

  Corpay is dedicated to encouraging a supportive and
  inclusive culture among our employees. It is within our best
  interest to promote diversity and eliminate discrimination
  in the workplace. We seek to ensure that all employees and
  job applicants are given equal opportunities.

  Notice to Agency and Search Firm Representatives: Corpay
  will not accept unsolicited CV's from agencies and/or search
  firms for this job posting. Resumes submitted to any Corpay
  employee by a third party agency and/or search firm without
  a valid written & signed search agreement, will become the
  sole property of Corpay. No fee will be paid if a candidate
  is hired for this position as a result of an unsolicited
  agency or search firm referral. Thank you.
