description: |
  About the Role

  The Software Engineer III designs, develops, tests, and
  supports web, mobile, and cloud-based applications. This
  role contributes to the full software development lifecycle,
  leads moderately complex technical initiatives, mentors
  junior team members, and collaborates with cross-functional
  stakeholders to deliver scalable, high-quality solutions.

  Key Responsibilities

  - Design, develop, test, and maintain software applications
    and services.
  - Translate business and technical requirements into scalable
    solutions.
  - Lead development efforts for moderately complex projects and
    enhancements.
  - Review code and provide technical guidance to junior team
    members.
  - Troubleshoot, debug, and resolve application and system
    issues.
  - Develop and maintain APIs, integrations, and database
    solutions.
  - Create and maintain technical documentation.
  - Participate in system architecture, design discussions, and
    technology evaluations.
  - Collaborate with Product, QA, DevOps, and business teams
    throughout the development lifecycle.
  - Support production deployments and ongoing application
    maintenance.
  - Perform other duties as assigned.

  Required Qualifications

  - Bachelor's degree in Computer Science, Software Engineering,
    Information Technology, or a related field; equivalent
    combination of education and experience may be considered.
  - 5+ years of software development experience.
  - Experience developing web, mobile, or cloud-based
    applications.
  - Proficiency in object-oriented design, software development
    methodologies, and application architecture.
  - Experience working in Agile development environments.
  - Strong analytical, problem-solving, and communication
    skills.

  Preferred Qualifications

  - Master's degree in Computer Science or a related field.
  - Experience leading technical projects or mentoring junior
    developers.
  - Experience with cloud platforms, microservices, and modern
    application architectures.
  - Experience building enterprise-scale applications and
    integrations.
  - Knowledge of DevOps practices, CI/CD pipelines, and
    automated testing.
  - Relevant technical certifications.

  Technical Skills

  - Proficiency in one or more programming languages such as C#,
    Java, JavaScript, TypeScript, Python, or similar.
  - Experience with modern web frameworks and API development.
  - Knowledge of relational and non-relational databases.
  - Experience with cloud platforms such as Azure, AWS, or
    Google Cloud.
  - Familiarity with source control systems, including Git.
  - Experience with CI/CD tools and automated testing
    frameworks.
  - Understanding of containerization, security best practices,
    and application performance optimization.
  - Proficiency with SQL, debugging, and troubleshooting tools.

  What We Offer

  - Competitive salary and performance bonus program
  - Fully remote work environment
  - Comprehensive benefits package including 401k match
  - 19 days of PTO per year; 10 holidays per year
  - Opportunity to work in a mission-driven organization where
    your work directly shapes clarity, confidence, and better
    outcomes across healthcare

  Travel

  Up to 10% travel, based on business needs.  While our roles
  are 100% remote, we do get together a few times a year for
  up to one week.  Employees are given ample notice and
  attendance is expected. 



  Work Environment

  This position operates in a professional work environment
  and requires the use of standard office equipment such as a
  computer, keyboard, mouse, webcam, and phone.

