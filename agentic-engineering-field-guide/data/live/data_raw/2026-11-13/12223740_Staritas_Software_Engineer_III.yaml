  Benefits Statement

  Staritas offers a comprehensive and competitive benefits
  package designed to support the health, wellbeing, and
  financial security of our employees. Benefits include
  medical, dental, and vision coverage; retirement savings
  plans with company contributions; paid time off and company
  holidays; paid parental and family leave; and access to
  employee assistance and wellness resources. Additional
  benefits include life and disability insurance, professional
  development opportunities, and flexible work arrangements.

  Learn more about us by visiting www.staritas.com.
