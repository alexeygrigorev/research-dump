  - Strong proficiency in Python
  - Experience with modern cloud platforms (AWS, Azure, or GCP)
  - Hands-on experience integrating AI/ML systems into
    applications
  - Background in enterprise software architecture and
    distributed systems

  Why Numos You’ll be building systems that don’t just assist
  work, but actually get it done. The problems are complex,
  the expectations are high, and the impact is real.
