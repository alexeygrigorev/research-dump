  About Axis Communications

  We enable a smarter and safer world by creating innovative
  solutions for improving security and business performance.
  As a network technology company and industry leader, we
  offer solutions in video surveillance, access control,
  intercom, and audio systems, enhanced by intelligent
  analytics applications.

  With around 6,000 committed employees in over 50 countries,
  we collaborate with partners worldwide. Together, we thrive
  in our friendly, open, and collaborative culture and inspire
  each other to think beyond the expected. United by our
  commitment to inclusion, diversity, and sustainability, we
  consistently seek to develop our skills and way of working.

