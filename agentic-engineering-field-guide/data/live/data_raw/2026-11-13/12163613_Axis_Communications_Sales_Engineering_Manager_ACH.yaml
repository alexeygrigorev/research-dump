description: |
  Job Title

  Sales Engineering Manager ACH

  Job Description

  Axis Communications is looking for an experienced, people-
  focused Sales Engineering Manager for Austria and
  Switzerland to lead our technical experts and shape how the
  market sees Axis as the technology leader in IP
  surveillance. The role is based at our office in Ismaning
  (Munich), Germany.

  If you enjoy building and growing a team, turning complex
  technology into clear value, and being the trusted expert in
  the room, this is your chance to lead at the heart of our
  sales success in the region.

  WHAT IS AXIS?

  Axis Communications is a fast-growing, innovative IT company
  with Swedish roots and a global reach. With over 5,000
  employees in 50+ countries, we create cutting-edge security
  and surveillance solutions that make the world smarter and
  safer. At Axis, creativity and independent thinking thrive
  in a multicultural, open-minded workplace, where passionate
  people come together to innovate for a smarter, safer world.

  WHAT WILL YOU DO?

  As Sales Engineering Manager, you lead a growing team of
  Sales Engineers. They support projects with technology and
  solution expertise and deliver high-level training for
  distributors, partners, customers and colleagues. You also
  take responsibility for our events team in the German-
  speaking region and for the Axis Experience Center in our
  Ismaning office. This role is both strategic and hands-on,
  and it involves regular travel across the region.

  Strategy and planning:

  - You set up new initiatives and drive change, so our
    organisation, structure and ways of working are ready for
    growth.
  - You bring structure to a fast-growing team in a video
    surveillance market that keeps changing and expanding.
  - You are the go-to person for technology, products and
    solutions in Austria and Switzerland, for colleagues and
    for external contacts.
  - You follow industry news, market developments and
    legislation on video surveillance.
  - You help shape the market by promoting new technology and by
    taking an active role in industry organisations and market
    initiatives.

  Building and leading the team:

  - You build and lead a team of specialists and use their
    expertise where it has the most impact, in the region and
    across EMEA.
  - You help the sales organisation win more projects by
    organising pre-sales support, including for our Key
    Account Managers.
  - You keep growing the team's knowledge of our products,
    solutions and competitors.
  - You set priorities for technical support on projects
    together with the Sales Manager, and you help win major
    projects from a technical standpoint.
  - You lead the events team and link Marketing and Sales on the
    technical solutions we show at events.
  - You own the Axis Experience Center in Ismaning. You develop
    new solutions with Sales and Marketing and keep the center
    up to date with the latest technology.

  WHO ARE WE LOOKING FOR?

  You are a leader with a strong technical background. You
  earn the trust of engineers, customers and partners, and you
  can switch between a strategic question and an operational
  challenge in the same day. You explain technology in a way
  that motivates people, and you stay curious about what comes
  next.

  We would love to hear from you if you have/are:

  - Strong management experience, including leading and
    developing engineers or technical specialists
  - Good knowledge of technology products, the IT and security
    market, and its ecosystem
  - Technical depth that shows Axis leads in knowledge of this
    market
  - Proven leadership and people skills
  - Strong presentation skills, able to motivate customers and
    other stakeholders
  - A solid education that fits a technology-driven, innovative
    product portfolio
  - Excellent organisation skills and the ability to handle
    several priorities at once
  - Fluency in German and English, written and spoken (other
    regional languages are a plus)
  - An open-minded, self-driven approach with strong
    relationship skills
  - The ability to handle both strategic questions and
    operational challenges
  - Residence in the Munich region, or willingness to relocate,
    as the role is office based
  - Willingness to travel within the region
  - Alignment with our values: Think Big. Always Open. Act as
    One.

  Don't tick every box? We'd still love to hear from you. We
  hire for potential and passion as much as for experience.

  WHERE WILL YOU BE BASED?

  This role is based at our office in Ismaning (Munich),
  Germany. Being present in the office is an important part of
  leading your team and running the Experience Center, so we
  work on site for 60% of the week. We are looking for
  candidates who already live in the region or are ready to
  move here. You will also travel across Austria and
  Switzerland as part of the job.

  WHAT CAN AXIS OFFER?

  At Axis, you will be working within an international
  organisation surrounded by enthusiastic people in an open-
  minded and innovative culture. We are growing rapidly, which
  means new challenges and opportunities to grow personally
  and professionally happen every day.

  - A visible leadership role with real influence on strategy
    and team structure
  - Ownership of our Experience Center and the chance to shape
    how we show our technology
  - Close collaboration with Sales, Marketing and EMEA
    colleagues
  - Internal events across Middle Europe and the EMEA region
  - Axis pension contribution
  - 100 days fully paid parental leave (gender neutral)
  - Individual training opportunities through the Axis Academy

  READY TO ACT?

  Axis is a company realising the benefits of a diverse
  workforce. We know that diversity in groups creates a better
  working environment and promotes creativity — something that
  is fundamental to our success.

  To be considered, please submit your CV and motivation
  letter in English.

