  WHY WE NEED YOU? GLAD YOU ASKED...

  Pelmorex (The Weather Network / MétéoMédia) reaches millions
  of Canadians every day and operates one of the country's
  most trusted information services, including the Alert Ready
  emergency alerting system. Our newly formed AI & Data
  Solutions team exists to turn that scale, data, and trust
  into a competitive advantage across three fronts: empowering
  our workforce with AI, building custom AI solutions for the
  business, and monetizing our data. This is an early, ground-
  floor role on a small, high-leverage team. You'll have an
  unusually direct line of sight from the code you write to
  the business outcomes it drives, and the latitude to shape
  how AI gets built and shipped across the company.

   Be part of the team that takes working prototypes to
  production quality. We are building active AI tools powering
  key workflows for both internal partners and external
  customers requiring robust, production-grade systems
  complete with resilient infrastructure, automated
  guardrails, enterprise fallbacks, and end-user support. You
  will own the end-to-end production path for approved
  products, shipping high-impact services one launch at a time
  by swapping demo shortcuts for reliable engineering
  standards that can scale.

  This is a software development and infrastructure role that
  leverages multi-modal LLM APIs (text, image, and video). We
  expect you to leverage AI natively to architect, test, and
  ship modern production systems - identifying bottlenecks,
  setting higher benchmarks, and continuously raising the bar.

  Please note, that is is a 12 month contract role and we are
  only considering candidates who are eligible to work in
  Canada and can work in a Hybrid model at our Oakville
  location.

