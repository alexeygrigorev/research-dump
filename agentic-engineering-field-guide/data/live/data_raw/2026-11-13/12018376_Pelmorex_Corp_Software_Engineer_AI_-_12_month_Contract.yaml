  Fair and Authentic Interview Experience

  We welcome candidates using AI tools to prepare for
  interviews or to learn more about Pelmorex. During the
  interviews themselves, we expect responses to come from your
  own experience and thinking.

  We ask that candidates not use real-time AI assistance, live
  answer prompts, or automated response tools during
  interviews. This helps ensure a fair process for everyone
  and allows us to evaluate how you approach problems and
  communicate in your own voice.
