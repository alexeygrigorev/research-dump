description: |
  About Us

  Constructor is the next-generation platform for search and
  discovery in ecommerce, built to explicitly optimize for
  metrics like revenue, conversion rate, and profit. Our
  search engine is entirely invented in-house utilizing
  transformers and generative LLMs, and we use its core and
  personalization capabilities to power everything from search
  itself to recommendations to shopping agents. Engineering is
  by far our largest department, and we’ve built our
  proprietary engine to be the best on the market, having
  never lost an A/B test to a competitive technology. We’re
  passionate about maintaining this and work on the bleeding
  edge of AI to do so.

  Out of necessity, our engine is built for extreme scale and
  powers over 1 billion queries every day across 150 languages
  and roughly 100 countries. It is used by some of the biggest
  ecommerce companies in the world like Sephora, Under Armour,
  and Petco.

  We’re a passionate team who love solving problems and want
  to make our customers’ and coworkers’ lives better. We value
  empathy, openness, curiosity, continuous improvement, and
  are excited by metrics that matter. We believe that
  empowering everyone in a company to do what they do best can
  lead to great things.

  Constructor is a U.S. based company that has been in the
  market since 2019. It was founded by Eli Finkelshteyn and
  Dan McCormick who still lead the company today.

  The Team

  The Core Team sits at the heart of Constructor, shaping
  Constructor’s in-house search engine, where user requests
  meet customer catalogs and Constructor’s learnings. We build
  and operate the foundational systems that power every
  request flowing through the platform, enabling fast,
  reliable, and intelligent interactions at massive scale.

  Our systems handle billions of requests daily with
  exceptional uptime, and we take pride in delivering a highly
  scalable, resilient, and globally distributed platform. As
  part of the Core team, you will help design, build, and
  maintain the critical infrastructure and services that
  underpin the entire product, ensuring performance,
  stability, and reliability across the globe.

  Requirements

  You’ll thrive in this role if you:

  - Have a strong foundation in computer science, including
    algorithms, data structures, concurrency, and systems
    design.
  - Have experience building and scaling high-traffic, high-
    availability backend systems.
  - Have experience designing and operating backend
    infrastructure, including deployment automation, capacity
    planning, and observability.
  - Are comfortable working across different layers of the
    stack, from performance-critical code to production
    operations.
  - Enjoy learning new technologies and tools in a fast-moving,
    large-scale environment.
  - Collaborate effectively and contribute to a positive,
    ownership-driven team culture.

  Our Tech Stack

  - Languages: Rust, C++, Python
  - Cloud Infrastructure: AWS
  - CI/CD: Jenkins, GitHub Actions
  - Monitoring & Observability: Prometheus, Grafana

  Benefits

  - 🏝️ Unlimited vacation time - we strongly encourage all of
    our employees take at least 3 weeks per year
  - 🌎 Fully remote team - choose where you live
  - 🛋️ Work from home stipend! We want you to have the resources
    you need to set up your home office
  - 💻 Apple laptops provided for new employees
  - 🧑‍🎓 Training and development budget for every employee,
    refreshed each year
  - 👪 Maternity & Paternity leave for qualified employees
  - 🧠 Work with smart people who will help you grow and make a
    meaningful impact
  - 💵 Base salary: $80k–$120k USD, depending on knowledge,
    skills, experience, and interview results
  - 📈 Stock options - offered in addition to the base salary
  - 🎉 Regular team offsites to connect and collaborate

  Diversity, Equity, and Inclusion at Constructor

  At Constructor.io we are committed to cultivating a work
  environment that is diverse, equitable, and inclusive. As an
  equal opportunity employer, we welcome individuals of all
  backgrounds and provide equal opportunities to all
  applicants regardless of their education, diversity of
  opinion, race, color, religion, gender, gender expression,
  sexual orientation, national origin, genetics, disability,
  age, veteran status or affiliation in any other protected
  group.

  Studies have shown that women and people of color may be
  less likely to apply for jobs unless they meet every one of
  the qualifications listed. Our primary interest is in
  finding the best candidate for the job. We encourage you to
  apply even if you don’t meet all of our listed
  qualifications.

  How we handle your data. By submitting this application, you
  acknowledge that Constructor will collect and process the
  personal data you provide for the purpose of evaluating your
  candidacy for this role. If you are not selected, we will
  retain your data for a limited period as described in our
  Recruitment Privacy Notice. After that period your data will
  be deleted or anonymized.
