description: |
  About Modular

  At Modular, a Qualcomm company, we’re on a mission to
  revolutionize AI infrastructure by systematically rebuilding
  the AI software stack from the ground up. Our team, made up
  of industry leaders and experts, is building cutting-edge,
  modular infrastructure that simplifies AI development and
  deployment. By rethinking the complexities of AI systems,
  we’re empowering everyone to unlock AI’s full potential and
  tackle some of the world’s most pressing challenges.

  If you’re passionate about shaping the future of AI and
  creating tools that make a real difference in people’s
  lives, we want you on our team. You can read about our
  culture and careers to understand how we work and what we
  value.

  About the role:



  Platform Engineering is responsible for the build, test, and
  deployment systems that ship MAX/Mojo as well as enabling
  teams to build & ship code faster with AI. This is a hands-
  on, technical role at the center of Modular's engineering
  org. You sit between Platform Engineering and the compiler,
  runtime, kernel, cloud, and product teams that depend on it,
  turning broad goals like faster builds, reliable tests, and
  shorter CI feedback loops into work that ships.

  Working closely with engineering and product leaders, you
  bring structure to how work is planned, tracked, and
  communicated. You join design discussions, help teams build
  realistic plans, and surface risk early, shaping engineering
  decisions across the org.

  LOCATION: Candidates based in or open to relocating to the
  San Fransisco Bay Area are welcome to apply. You can work in
  our office in Los Altos, CA or remotely from home.
  Onboarding for new hires is conducted in-person in our Los
  Altos, CA office.

  What you will do:

  - Partner with engineering and product leaders to scope
    projects, set milestones, and sequence work against
    dependencies and available staffing.
  - Set and run the cadence for planning, status reporting, and
    risk review across the org.
  - Drive execution on the build, release, and continuous
    deployment infrastructure behind MAX, Mojo, and Cloud,
    shortening the path from merge to production and keeping
    rollouts and rollbacks safe and routine.
  - Define and report the metrics for developer experience
    health, including build time, CI queue time, test
    flakiness, and time to merge. Use them to prioritize where
    to invest.
  - Partner with Security on the integrity of the build and
    release path — secrets handling in CI, runner and artifact
    isolation, signing and provenance, and access control on
    deploy paths.
  - Coordinate rollouts and migrations across teams, with clear
    communication, rollback plans, and adoption tracking.
  - Strengthen reliability of developer infrastructure: lead
    follow-through after incidents, drive root-cause analysis
    across teams, and make sure action items actually close.

  What you bring to the table:



  - Bachelor’s degree in a technical field, or equivalent
    practical experience.
  - 8 years of experience in technical program management,
    engineering management, or infrastructure engineering.
  - Experience driving programs for platform or developer
    infrastructure teams at scale, such as build systems,
    CI/CD pipelines, test infrastructure, or release tooling.
  - Experience leading cross-functional programs with multiple
    teams and dependencies, from scoping and planning through
    delivery.
  - Strong written and verbal communication skills, with the
    ability to explain technical work to a range of audiences.

  Minimum Qualifications:

  - Bachelor's degree in Engineering, Computer Science, or
    related field.
  - 4+ years of Program Management or related work experience.
    - Completed advanced degrees in a relevant field may be
      substituted for up to two years (Master’s = one year,
      Doctorate = two years) of work experience.

  Helpful, but not required:



  - Experience building or operating release and deployment
    infrastructure, including continuous deployment.
  - Ability to diagnose and improve build performance, test
    reliability, and pipeline throughput.
  - Experience working with compiler, systems software, or AI/ML
    infrastructure teams.
  - Experience setting the planning and reporting cadence for an
    engineering organization.
  - Excellent written communication skills, with the ability to
    make technical detail clear to people outside the work.

  What Modular brings to the table:

  - Amazing Team. We are a progressive and agile team with some
    of the industry’s best engineering and product leaders.
  - World-class Benefits. In order to attract the best, we need
    to offer the best. Your benefits package may include
    comprehensive healthcare coverage, retirement and savings
    programs, employee stock purchase opportunities, paid time
    off, wellbeing resources, family support programs, and
    learning and development opportunities. Please note that
    specific benefit packages may vary based on your location,
    you can read more about benefits offered by Qualcomm here.
  - Competitive Compensation. We offer very strong compensation
    packages, including RSU grants. We want people to be
    focused on their best work and believe in tailoring
    compensation plans to meet the needs of our workforce.
  - Team Building Events. We organize regular team onsites and
    local meetups in Los Altos, CA as well as different
    cities. Traveling 2-4 times a year is expected for all
    roles.

  Working at Modular will enable you to grow quickly as you
  work alongside incredibly motivated and talented people who
  have high standards, possess a growth mindset, and a purpose
  to truly change the world.



  The estimated base salary range for this role to be
  performed in the US, regardless of the state, is $143,400.00
  - $277,200.00 USD.

  The salary for the successful applicant will depend on a
  variety of permissible, non-discriminatory job-related
  factors, which include but are not limited to education,
  training, work experience, business needs, or market
  demands. This range may be modified in the future. The total
  compensation for a candidate will also include annual target
  bonus, equity, and benefits.

  For candidates who fall outside of the listed requirements,
  we nevertheless encourage you to apply as we may have
  upcoming openings that are lower/higher level than the ones
  advertised.
