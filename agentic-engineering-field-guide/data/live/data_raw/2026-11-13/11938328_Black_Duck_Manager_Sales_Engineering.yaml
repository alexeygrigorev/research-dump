description: |
  Black Duck Software, Inc. helps organizations build secure,
  high-quality software, minimizing risks while maximizing
  speed and productivity. Black Duck, a recognized pioneer in
  application security, provides SAST, SCA, and DAST solutions
  that enable teams to quickly find and fix vulnerabilities
  and defects in proprietary code, open source components, and
  application behavior. With a combination of industry-leading
  tools, services, and expertise, only Black Duck helps
  organizations maximize security and quality in DevSecOps and
  throughout the software development life cycle.

  Manager, Sales Engineering - South Europe and Middle East
  region

  Location: France - Remote

  We’re looking for an experienced Manager, Sales Engineering
  to lead our Sales Engineering team supporting the South
  Europe and Middle East region.

  This is a senior technical leadership role for someone who
  combines people leadership, Application Security expertise
  and strong commercial acumen. You’ll partner closely with
  Sales, Product Management, Engineering and R&D to support
  strategic customer engagements, accelerate new and expansion
  business, and ensure our customers understand the value of
  Black Duck’s AppSec portfolio.

  What you’ll do:

  - Lead, coach and develop a high-performing team of Sales
    Engineers across the FAME region
  - Partner with Sales leadership on regional strategy, complex
    opportunities and customer growth
  - Support strategic technical engagements, demos and PoCs with
    enterprise customers
  - Engage confidently with audiences from developers and
    security practitioners through to C-level executives
  - Bring strong knowledge of Application Security, SDLC and
    DevSecOps, including technologies such as SAST, DAST, IAST
    and SCA
  - Work closely with Product and R&D, bringing customer and
    market feedback into product discussions
  - Help customers navigate emerging areas including AI-assisted
    software development and AI-driven code analysis
  - Support partner and MSP-led AppSec opportunities

  What we’re looking for:

  - 3+ years' experience leading Sales Engineering or technical
    pre-sales teams
  - 5+ years within enterprise software, ideally Sales
    Engineering or Technical Sales
  - Strong knowledge of Application Security and modern software
    development
  - Experience with SDLC, CI/CD and modern development
    technologies
  - Comfortable leading complex enterprise sales cycles and
    technical evaluations
  - Strong presentation and communication skills with both
    technical and executive audiences
  - Based in France, with the ability to support customers and
    teams across FAME

  Languages: Fluent English is essential, with French and
  Arabic fluency highly desirable given the regional customer
  coverage.

  Black Duck is an equal opportunity employer. We consider all
  applicants for employment without regard to race, color,
  national origin, religion, sex, gender identity or
  expression, age, disability, sexual orientation, veteran or
  military service status, or any other characteristic
  protected by applicable law. Black Duck complies with all
  applicable laws prohibiting employment discrimination in
  every jurisdiction where it operates and provides reasonable
  accommodations to individuals with disabilities in
  accordance with applicable law.
