description: |
  HHAeXchange is the leading technology platform for home and
  community-based care. Founded in 2008, HHAeXchange was born
  out of an idea to create a fully comprehensive end-to-end
  homecare solution to help people who are aging or have
  disabilities thrive in their homes and communities. Our
  employees are passionate about transforming the healthcare
  space by building the only homecare ecosystem that fully
  connects patients, personal care providers, managed care
  organizations, and states.

  The Principal Software Engineer will play a critical role in
  the design, development, and evolution of our customer-
  facing analytics, ML, and AI applications and data
  platforms. As a key leader of our engineering team, you will
  collaborate with cross-functional teams to guide the
  technical strategy, deliver scalable, secure, and high-
  performance solutions. You will also mentor junior
  engineers, provide technical oversight, and ensure the team
  is aligned with the overall strategic vision.You are
  responsible for ensuring that all software developed by one
  or more teams at HHA meets our standards for quality,
  performance, scalability, availability and security by
  working alongside team members to develop innovative
  solutions to customer problems.

  To perform this job successfully, an individual must be able
  to perform each essential job duty satisfactorily.
  Reasonable accommodations may be made to enable individuals
  with disabilities to perform the essential functions.

  This is a fully remote opportunity for candidates located in
  the EST or CST time zones within the US only.

