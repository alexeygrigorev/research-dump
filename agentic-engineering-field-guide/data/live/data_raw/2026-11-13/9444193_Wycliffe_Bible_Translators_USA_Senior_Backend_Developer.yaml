description: |
  Job Title

  Senior Backend Developer

  Location

  Global

  Position Type

  Paid - Regular

  Job Description

  The Senior Back-End Developer is responsible for building
  and maintaining the server-side operations and functionality
  of cloud-based solutions supporting Bible translation and
  publishing workflows. This includes developing and
  maintaining the database layer, APIs, hosted solutions,
  cloud services and other web services, working as part of a
  collaborative, inter-organisational team serving translation
  teams worldwide.

   Responsibilities:

  Core Development

  - Design, develop and deploy server-side systems, including
    database creation, APIs and hosted solutions.
  - Integrate data from various back-end services and databases.
  - Maintain, expand and scale websites and cloud-based
    platforms.
  - Collaborate with front-end developers and web designers to
    match visual design intent.
  - Work with the engineering manager to review and deliver
    high-quality software applications against a cohesive
    product roadmap.
  - Exhibit ownership, initiative, follow-through and effective
    communication with peers and management.

  Support & Documentation

  - Analyse system requirements by consulting with the user
    community and development team.
  - Provide developer-level support to the user community and
    development team.
  - Monitor and report on system performance and analytics.
  - Write technical reference documentation for new software
    features and services.

  Collaboration & Travel

  - Participate in regular project status, planning and
    strategic meetings.
  - Available to travel to meet with the wider development team
    at least once per year.
  - Participate in relevant professional conferences and
    meetings.

  Training & Orientation

  - Participate in relevant professional conferences and
    meetings.

  Knowledge, Skills, and Abilities:

  - Demonstrated experience with hosted and cloud-based
    solutions, including AWS, Kubernetes and Docker.
  - Demonstrated experience in the design and implementation of
    APIs.
  - Demonstrated experience managing multiple websites and web
    services.
  - Familiarity with relevant frameworks and languages including
    Go and PHP.
  - Demonstrated skills in software development, algorithms and
    user interface design.
  - Ability to quickly analyse and learn a large existing
    codebase.
  - Ability to generate and analyse multiple solutions to a
    problem and make decisions in a timely manner.
  - Strong ability to work both independently and as part of a
    team, multitasking effectively.
  - Good interpersonal communication and organisational skills.

  Education and Experience:

  - Bachelor's or Master's degree in Computer Science or
    equivalent work experience; we value a heart and mind that
    are always learning.
  - 5+ years of experience in back-end development with a solid
    understanding of the full software development lifecycle.
  - Experience in software engineering with a strong
    understanding of Agile development practices.
  - undefined

  Applicant must be located within the U.S., and have the
  ability to legally work within the U.S.

  $75,000 - $96,000 annually

  Weekly Hours

  40
