description: |
  Come join the organization that is redefining security for
  the AI era. As one of the fastest-growing startups ever, we
  enable teams to secure cloud and AI applications by
  connecting code, cloud, and runtime into a single shared
  context. Trusted by security teams all over the world, we
  have a proven track record of success and a culture that
  values world-class talent. Not to mention, we're now powered
  by Google, meaning we offer our customers an AI-powered
  platform that harnesses Google’s Threat Intelligence and
  Security Operations to better detect, prevent, and respond
  to threats across all environments, allowing for further
  innovation.

  Our Wizards from all over the globe work together to protect
  the infrastructure of our customers, including over 65% of
  the Fortune 100, who trust us to scan and secure over 230
  billion files daily. We’re honored to be a leading player in
  a massive and growing market, and we continue to look for
  exceptional Wizards who are eager to make a significant
  impact on our team. At Wiz, you’ll have the freedom to think
  creatively, dream big, and use your full range of skills to
  contribute to our momentous growth. Come join our team and
  help us create secure cloud environments that allow even the
  best companies to move faster, all while having some fun!

  This is a highly collaborative hybrid role based in NYC,
  expect to be in office approximately 2-3 days on a weekly
  basis!  Minimum Qualifications

  - Bachelor of Science in Computer Science/Software Engineering
    or related field.
  - 6+ years of experience with Backend Engineering in a high-
    level programming language (e.g., Java, C#, Golang).
  - Experience with cloud platforms (e.g., AWS, GCP, Azure).

  Preferred Qualifications

  - Experience with microservices based architecture.
  - Experience with databases and message queue technologies.
  - Experience with continuous integration and deployment
    (CI/CD).
  - Familiarity or experience with Golang, GraphQL, PostgreSQL,
    Neptune, Docker, and Kubernetes.

  About the Job We're looking for an experienced Backend
  Engineer to join our expanding R&D team and help drive the
  growth of Wiz. In this role, you'll be responsible for
  developing and maintaining large-scale distributed
  components that power Wiz. We're looking for candidates who
  are passionate about tackling scaling challenges and take
  pride in writing clean, efficient, and maintainable code.
  Join us in our mission to secure the cloud.

  Our tech stack includes a multi-cloud architecture (Azure,
  AWS, GCP, OCI, Alibaba Cloud) with Golang, GraphQL,
  PostgreSQL, Neptune, Docker, Kubernetes, and more.

  Responsibilities

  - End-to-end development of backend software components
    (research, design, development, testing, rollout,
    monitoring).
  - Contributing to technological and architectural decisions.
  - Conducting design and code reviews.
  - Analysing and improving efficiency, scalability, and
    stability of various backend system components.
  - Collaborating with cross-functional teams (e.g., Frontend,
    DevOps) to deliver top-tier features.

  Compensation + Benefits

  Compensation for this full-time position includes base
  salary + bonus + equity + benefits. Our salary ranges are
  determined by role, level, and location. Within the range,
  individual pay is determined by work location and additional
  factors, including job-related skills, experience, and
  relevant education or training. Your recruiter can share
  more about the specific salary range for your preferred
  location during the hiring process.

  Please note that the compensation details listed in US role
  postings reflect the base salary only, and do not include
  bonus, equity, or benefits. Learn more about benefits at
  Google.

  The US base salary range for this full-time position is
  listed below.

  US Base Pay Range

  $174,000—$238,000 USD

  Applicants must have the legal right to work in the country
  where the position is based, without the need for visa
  sponsorship. This role does not offer visa sponsorship.

