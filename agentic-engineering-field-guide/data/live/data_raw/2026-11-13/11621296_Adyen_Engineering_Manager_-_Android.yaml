description: |
  This is Adyen

  Adyen provides payments, data, and financial products in a
  single solution for customers like Meta, Uber, H&M, and
  Microsoft - making us the financial technology platform of
  choice. At Adyen, everything we do is engineered for
  ambition. For our teams, we create an environment with
  opportunities for our people to succeed, backed by the
  culture and support to ensure they are enabled to truly own
  their careers. We are motivated individuals who tackle
  unique technical challenges at scale and solve them as a
  team. Together, we deliver innovative and ethical solutions
  that help businesses achieve their ambitions faster.

  Engineering Manager - Android / iOS

  We're looking for experienced Engineering Managers to lead
  one of our Android or iOS teams within Channels, part of our
  Payment Engineering organization. These teams build and
  operate Adyen’s in-store payment method integrations,
  focusing on low-level integration layers, including payment
  kernels and compliance with global PCI standards. Their work
  forms the foundation of reliable, secure payments for
  retailers around the world.In this role, you’ll drive
  technical strategy, build and develop a high-performing
  engineering team, and shape the evolution of our platform as
  Adyen continues to scale globally.

  What you'll do

  - Lead and develop a high-performing team: manage engineers
    across all levels, owning day-to-day operations, planning,
    and hiring for our office in Amsterdam. Setting clear
    individual and team goals that align with our strategic
    engineering ambitions and create an inspiring and
    collaborative team environment with an open communication
    / feedback culture.
  - Work cross-functionally: closely collaborate with our
    design, product, data, and engineer teams and other key
    stakeholders within Payments.
  - Act as a multiplier: by motivating team members and
    providing coaching in areas including but not limited to:
    engineering best practices,scalable architecture design,
    product roadmap discussions.
  - Bring structure and process to execution: Collaborate with
    different teams to design and implement new services with
    reliability/infra/data/dev in mind.
  - Foster a culture of technical excellence: Drive globally
    optimized technical decisions with a focus on automation,
    partnering with other leads to evolveour solutions to
    process payments in store.

  Who you are

  - Experienced engineering leader: you bring a wealth of
    knowledge, with 7+ years in the Mobile (Android & iOS)
    and/or IoT software development industry within a fast-
    paced tech environment and 2+ years in a people management
    position.
  - Technical leader with a strong engineering perspective:
    you've led Mobile strategy, shape technical direction,
    improve reliability and performance, and ensure solutions
    are scalable and maintainable with a focus on automation.
  - Hands-on when needed: while this is a management role,
    you're comfortable in technical discussions to guide your
    team and ensure sound decisions, and can partner across
    development teams to diagnose and resolve issues when
    needed.
  - Technical skills: the team will primarily code in Android,
    iOS or Kotlin. You have significant experience with one of
    these languages.
  - In store domain expertise: your team will own payment method
    integrations for in store payments, this includes
    knowledge around payment kernels, pci, p2pe and pci pin.
    Having experience with these protocols will be a
    significant benefit, however a technical mind who can
    quickly learn new low level technologies would also work.

  Diversity, Equity, and Inclusion at Adyen

  We actively seek different perspectives to sharpen our
  ideas. Our unique culture is a product of our diverse
  backgrounds and experiences. No matter who you are or where
  you’re from, you’re welcome to be your true self at Adyen.

  If you need accommodations or support during the recruitment
  process to perform at your best, you’ll have the opportunity
  to let our team know in your application. We encourage
  people from all backgrounds and abilities to apply.

  What’s next?

  Ensuring a smooth and enjoyable candidate experience is
  critical for us. We aim to get back to you regarding your
  application within 5 business days. Our interview process
  tends to take about 4 weeks to complete, but may fluctuate
  depending on the role. Learn more about our hiring process
  here. Don’t be afraid to let us know if you need more
  flexibility.

  This role is based out of our Amsterdam office. We are an
  office-first company and value in-person collaboration; we
  do not offer remote-only roles.
