  About the Role

  We are looking for a candidate who will be responsible for
  working directly with development, support, implementation,
  and other internal teams as well as external vendors and
  clients. The Head of Engineering will be responsible for
  overseeing and managing all aspects of the engineering
  department within the organization. This role requires
  strong leadership skills, technical expertise, and a
  strategic mindset to drive innovation and ensure the
  successful delivery of engineering projects.

  You will work directly with the CEO/CTO and will act as both
  a technology and business expert, making decisions that will
  impact the current and future operations of the company.

  Roles and Responsibilities:

  - Manage multiple engineering projects and ensure successful
    delivery of products on time and within budget
  - Lead a team of engineers and provide guidance on technical
    issues
  - Collaborate with other teams such as product, design, and
    customer support to ensure smooth product development and
    delivery
  - Ensure coding standards, best practices, and security
    protocols are followed by the team
  - Hire, train, and mentor engineers and support staff
  - Evaluate and recommend new technologies and methodologies to
    improve the engineering process
  - Build and maintain strong relationships with vendors and
    partners to ensure projects are completed successfully
  - Must have successfully delivered at least two projects end-
    to-end.
  - Oversight of the full software development lifecycle
    required for a group of developers and testers in an agile
    environment.
  - Leading staff to implement clients in the most efficient,
    time driven manner. The manager is responsible for the
    total quality of the technical deliverables in their
    domain, making sure that they are secure, defect-free.
  - Mentoring technical staff during projects to ensure
    continuous improvement. Includes working with each
    resource to define and act upon career paths and obtain
    appropriate training. Is responsible for the hiring,
    training, staff development, performance appraisals,
    corrective action and pay review of technical personnel.
  - Developing and establishing department standards and
    procedures.
  - Recommends the most efficient ways to ensure best
    implementation practices of new upgraded products.
  - Evaluates and reports progress and results.

  Skills and Qualifications Required:

  - Must have hands-on experience in Java, Front end
    technologies like Bootstrap, jQuery, AWS, Modular software
    development, multi-tenant architecture and highly scalable
    systems.
  - Proficient with cloud technologies (AWS, Azure, Google
    Cloud).
  - Must have a minimum of 8-10 years of experience
    demonstrating required skills and competencies in
    engineering
  - BSc/BA in Computer Science, Engineering or a related field;
    MS/MBA or other relevant graduate degree is a plus.
  - Must have hands on Full stack architecture experience
  - Have in-depth conceptual functional and non-functional
    knowledge of Docker Containers, Kubernetes Cluster
    management and orchestration, microservice architectures,
    DevOps practices and tooling.
  - Previous leadership or management experience required
  - Strong communication skills are a requirement, as this
    position must build consensus with numerous internal and
    external resources and effectively influence the technical
    direction of projects in order to be successful.
  - Ability to determine the best implementation
    approach/methodology for assigned project(s) based on
    established guidelines and best practices and determine
    appropriate strategy for ensuring desired objectives.
  - Must be very flexible with learning new technology quickly.

  Location: Montreal (Remote)

