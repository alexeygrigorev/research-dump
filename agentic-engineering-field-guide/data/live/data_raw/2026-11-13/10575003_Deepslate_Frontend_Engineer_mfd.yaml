description: |
  Location: Remote / Berlin (Office available) | Language
  Requirement: Fluent German

  At Deepslate, we are building Speech to Speech Voice AI
  models that sound and act indistinguishable from a human.
  And we believe everyone should be able to use it.

  When it comes to text and images, giants like OpenAI and
  Google have already cracked the code. With video, Veo3, Sora
  and others are closing the gap rapidly. But with its endless
  languages, dialects, accents, subtle intonations, and speech
  melodies voice remains a highly complex unsolved frontier.

  That is exactly why we started Deepslate.

  Backed by top-tier investors from the Tech and AI sectors,
  as well as a major German VC fund, we are incredibly well-
  funded and moving fast.

  We are building the future of communication.

  We aren't trying to build another standalone platform;
  instead, we are the intelligence engine powering countless
  other applications. Whether it's integrated as a module by a
  CRM provider, plugged into another Voice AI platform, or
  directly embedded into an enterprise system by our
  integration partners - our model is everywhere.

  Your Role

  While our core engine is API-first, our developers need
  world-class interfaces to interact with, configure, and
  integrate our voice models. Your mission is to architect and
  own the entire front-end ecosystem from developer dashboards
  and billing portals to real-time interactive voice
  applications.

  From state management and user workflows to raw rendering
  performance and client-side observability: You are building
  the face of our AI infrastructure.

  Bring Deepslate to Life in the Browser

  You’ll work on building highly reliable web applications
  that serve developers and enterprise clients. Your work will
  directly impact how people perceive and interact with our
  AI, making a complex technology feel engaging, efficient,
  and intuitive.

  - Architect & Own: Take complete ownership of designing and
    building our modern front-end stack from the ground up
    using TypeScript and React (e.g., Next.js).
  - Flawless User Experience: Build responsive, accessible UIs
    capable of handling complex data and real-time
    interactions without dropping a frame.
  - Performance-First Mindset: Write exceptionally clean,
    consistent code. Advanced state management, optimized
    bundle sizes, and fast load times.
  - Production Ownership: Troubleshoot and resolve live client-
    side issues, and build the testing systems (unit,
    integration, E2E) that ensure UI regressions never happen.

  Elevate Our Engineering Quality to the Next Level:

  - Tooling & DevEx: Design and build robust internal component
    libraries and streamline our front-end CI/CD pipelines.
  - Sustainable Architecture: Build highly scalable, modular
    front-end architectures that allow us to iterate rapidly
    while keeping maintenance overhead low.
  - Observability: Implement comprehensive client-side logging
    and performance monitoring to drastically improve user
    experience and error tracing.

  What We’re Looking For: Must-Haves:

  - Solid professional experience with TypeScript and React.
  - Readiness and ability to take complete ownership of a modern
    Front-End Stack (NextJS or similar frameworks).
  - A true startup mindset: You are comfortable navigating the
    chaos of an early-stage codebase (inconsistent structures,
    missing docs. You name it, you’ll help fix it).
  - Drive and Vision: You aren't just looking to blindly process
    Jira tickets. You want to actively shape the product,
    architect solutions, and take complete ownership of
    projects.

  Nice-to-Haves:

  - Previous experience in a fast-paced Startup or DeepTech
    environment.
  - Experience with WebSockets, WebRTC, or handling real-time
    audio streams/data in the browser.
  - A strong eye for UI/UX design and experience bridging the
    gap between design tools (e.g., Figma) and code.
  - Fluent German skills (spoken and written).

  Deepslate is an equal opportunity employer. We welcome
  applications from all qualified candidates regardless of
  gender, nationality, ethnic origin, religion, disability,
  age, or sexual orientation.
