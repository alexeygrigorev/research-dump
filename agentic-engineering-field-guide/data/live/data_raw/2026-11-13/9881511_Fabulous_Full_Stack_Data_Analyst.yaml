description: |
  You'll be part of a small, cross-functional data team that
  drives impact across Fabulous. We work closely with Product
  Growth, User Acquisition, and Finance.

  We take a full stack approach: every team member contributes
  across the full data spectrum. We don't specialize into
  Analytics Engineering or Data Science or Data Analysis.
  While we each have our own strengths, we contribute to
  projects across the entire spectrum of data work. This
  encourages strong ownership and drives impact. Practically,
  we work across three areas:

  - Analytics Engineering: Data modeling and transformations to
    build, maintain, and scale our analytics pipelines in dbt.
    Once an MVP is validated, we implement and improve it
    iteratively - with solid testing, data observability, and
    architecture that keeps tech debt manageable.

  - Applied Analytics: Data exploration, dashboard building in
    Omni, and ML model building. We aim for simplicity and
    interpretability but don't shy away from complexity when
    we face it. We work with highly data literate stakeholders
    - when building new models or dashboards we empower our
    users to continue to analyze the data themselves.

  - Data Science: ML model building to make predictions to
    inform the business quickly.

  Our stack: **Fivetran · BigQuery · dbt · Amplitude · Omni**

  This role is critical to the team's continued success:

  - Diverse, high-impact projects. You'll work on business-
    critical problems in close collaboration with business
    teams — improving metric accuracy, exploring new growth
    perspectives, building well-tested reporting pipelines,
    investigating data discrepancies, or applying statistics
    and ML where they add real value.

  - Building and maintaining our codebase. You'll contribute to
    solid analytics pipelines using SQL and dbt. Managing tech
    debt, improving engineering practices, and shaping the
    project's architecture are core to this role.

  - Growing into ownership. Over time, you'll own parts of the
    codebase, become the go-to person for at least one
    business team, and have a strong voice in how the
    analytics project evolves.

  - Leveling up the team. Share knowledge, and contribute to
    practices that help everyone grow. Speak up - we want you
    to shape the team's direction, cohesion, and mission.

  - Working autonomously. You'll manage your own projects and
    stakeholders. Clear, concise documentation is expected so
    future collaborators can build on your work.

  We embrace the age of AI. We use tools like Claude Code
  daily to write, review and ship code faster, while focusing
  our time on problem solving multiple projects in parallel.
  We are building out multiple entry points for our business
  stakeholders to interact with our data in natural language
  and believe this is the future of data work.

  You'll report to the Data Lead and be part of the
  Engineering team.

  Requirements

  Required:

  - University degree in Engineering, Computer Science, or
    Applied Mathematics

  - 4+ years of experience across data science, analytics, or
    analytics engineering - ideally with exposure to more than
    one of these

  - Excellent SQL skills, with experience building data models
    using dbt (or similar tools)

  - Strong engineering fundamentals: testing, clean code, peer
    review, CI/CD, git workflows

  - Passionate about the future of AI, researches the cutting
    edge, not afraid to experiment with new tools

  - Experience with cloud data warehouses and modern data stack
    tools

  - Self-starter who takes ownership, manages stakeholders, and
    communicates proactively

  - Excellent written and verbal English

  - Comfortable working remotely (we're remote-first)

  Great to have:

  - Hands-on experience with Digital Marketing / User
    Acquisition (attribution, iOS privacy & SKAN, UA metrics)
    or Product / Growth (A/B testing, retention, monetization)

  - Familiarity with our stack (Amplitude, dbt, BigQuery, Omni)

  - Good analytical and statistical intuition

  - Prior experience in an agile startup environment

  If you're excited about this role but don't check every box,
  we'd still love to hear from you. We value curiosity and
  growth mindset over a perfect resume.

  BenefitsAbout Us

  An award-winning health, wellness, & coaching company that
  creates apps which fall the top ten internationally. Our
  science-based approach sits squarely in the tech-for-good
  lane, helping people live their best lives. Everyone who has
  joined this company is committed to using evidence-based
  research to find the absolute best ways to change lives for
  the better.

  Our History

  Three co-founders created the Fabulous app: Sami, Amine, and
  Taylor. Growing up in Tunisia, Sami and Amine were only 16
  when they met. With their early iteration, they reached out
  to Taylor, an award-winning designer in Malaysia. Their
  vision was welcomed into an incubation lab for startups at
  Duke University led by world-renowned Behavioral Economics
  Professor Dan Ariely. Our Chief Storyteller Jaz co-founded
  the Introductory Psychology program at Stanford University.

  Our Approach

  We use a behavioral economics lens to help individuals find
  that 'on switch' inside them to achieve their fullest
  potential. What has emerged is a system that transforms tiny
  habits into profound long-term changes. A world in which
  people with ADHD thrive. A method for gratitude to reach
  through difficulty. A sanctuary to seek out your true
  purpose. A fountain of knowledge. A space for rest and self
  compassion.

  Our Mission

  Help every individual discover the wonderful person inside
  themselves by creating: beautiful, evidence-based, life-
  changing products.

  Our Environment

  The first thing that sets us apart is that we’re not a place
  at all. While we’re a remote company, it’s not unusual to
  feel you know your teammates better than those you’ve shared
  an office with in the past. Ours is a professionally
  nourishing environment that is flexible and fully remote.
  Team members enjoy in house challenges and Slack event and
  work across a variety of tools. Meetings are kept to a
  minimum and deep work is encouraged.

  Our Awards

  - Apple Best Apps of 2018
  - Editor’s app choice in more than 30 countries
  - Winner of Google’s Material Design Award
  - Best App Finalist in Google Play Awards
  - Consistently ranking in the top ten Health & Fitness apps
  - Backed by Facebook Startup Lab and Microsoft Venture

  Our Norms

  Ownership: Be the CEO of your tasks. No one is watching over
  your shoulder. Be the proof.

  Open Communication: Constructive ideas are always flying
  across time zones.

  Deep Work: Disconnect. Find your flow. Become industrious.
  It’s about the work here.

  Always Offer Context: Sharing rationale works wonders in
  asynchronous conversations.

  Impeccable Agreement: Promise, then follow through. Everyone
  relies on everyone.

  Egos are checked at the door. Those who join our workforce
  place themselves in service of our members.

  Our Future

  To this day, over 30 million people have started their
  journey to better themselves with our apps. We are creating
  a generation of change-makers, with the same drive to help
  others, each in their own way.

  Our Invitation

  At Fabulous, every team member is a sculptor in their own
  right. Together, we help millions of users step out of their
  block of stone and step into the fullest version of their
  life through behavioral science. Tell us what drives you; if
  you were to pick up your tools, what would you contribution
  look like?
