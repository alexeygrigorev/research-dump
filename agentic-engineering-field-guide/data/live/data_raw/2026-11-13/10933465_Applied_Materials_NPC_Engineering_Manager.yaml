description: |
  Who We Are

  Applied Materials is the global leader in materials science
  and engineering solutions that are at the foundation of
  virtually every new semiconductor chip and advanced display
  in the world. The equipment that we create and service is
  essential to advancing AI and accelerating the
  commercialization of next-generation semiconductor chips.
  Join us and push the boundaries of materials science and
  engineering in a company at the foundation of the
  electronics industry. The work we do together advances the
  world’s technology.

  What We Offer

  Salary:

  $120,000.00 - $165,000.00

  Location:

  Austin,TX

  You’ll benefit from a supportive work culture that
  encourages you to learn, develop, and grow your career as
  you take on challenges and drive innovative solutions for
  our customers. We empower our team to push the boundaries of
  what is possible—while learning every day in a supportive
  leading global company. Visit our Careers website to learn
  more.

  At Applied Materials, we care about the health and wellbeing
  of our employees. We’re committed to providing programs and
  support that encourage personal and professional growth and
  care for you at work, at home, or wherever you may go. Learn
  more about our benefits.

  Key Responsibilities

  Lead engineering team,  projects and programs in area of
  responsibility, and ensures that necessary preliminary
  activities (e.g., determination of outcomes, milestones,
  viability studies, and resource planning, among others) are
  completed to allow for effectiveness and focus during later
  stages of projects.

  Ensures that all projects and programs assigned are
  completed in accordance with predetermined requirements,
  with specific attention to product/process specifications,
  project/program costs, resource utilization, and timeliness
  for completion.

  Ensures that all phases of project, program and/or process
  development are documented and that information required in
  other functional areas is reported, disseminated, or
  transferred, as appropriate. Ensures compliance with company
  policies including (but not limited to) engineering/lab
  notebooks, patents, Intellectual property, confidentiality,
  ISO, safety and others as required.

  Establishes departmental budgets and spending requirements.
  Ensures that the utilization of all material and financial
  resources is carried out in an effective manner in alignment
  with AOP to ensure maximum productivity for the area.

  Effectively assigns work to subordinate staff, providing for
  professional development and coaching.

  Spearheads research and development of new manufacturing
  technologies, as appropriate, and ensures that newly created
  processes, designs, and/or methodologies are incorporated
  into Applied Materials products/services, and/or
  disseminated to other areas as needed.

  Effectively utilizes common engineering technology and
  software packages for optimization of design development
  activities and timelines to ensure rapid commercialization.

  Functional Knowledge

  - Demonstrates in-depth understanding of concepts, theories
    and principles in own job family and basic knowledge of
    other related job families

  Business Expertise

  - Applies understanding of the industry and how own area
    contributes to the achievement of objectives

  Leadership

  - Manages a generally homogeneous team; adapts plans and
    priorities to meet service and/or operational challenges

  Problem Solving

  - Identifies and resolves technical, operational and
    organizational problems

  Impact

  - Impacts the level of service and the team’s ability to meet
    quality, volume, and timeliness objectives
  - Guided by policies and resource requirements within business
    unit, department or sub-function

  Interpersonal Skills

  - Guides, influences and persuades others internally in
    related areas or externally

  Position requires understanding of Applied Materials global
  Standards of Business Conduct and compliance with these
  standards at all times. This includes demonstrating the
  highest level of ethical conduct reflecting Applied
  Materials' core values.

  Additional Information

  Time Type:

  Full time

  Employee Type:

  Assignee / Regular

  Travel:

  Yes, 10% of the Time

  Relocation Eligible:

  No

  The salary offered to a selected candidate will be based on
  multiple factors including location, hire grade, job-related
  knowledge, skills, experience, and with consideration of
  internal equity of our current team members. In addition to
  a comprehensive benefits package, candidates may be eligible
  for other forms of compensation such as participation in a
  bonus and a stock award program, as applicable.

  For all sales roles, the posted salary range is the Target
  Total Cash (TTC) range for the role, which is the sum of
  base salary and target bonus amount at 100% goal
  achievement.

  Applied Materials is an Equal Opportunity Employer.
  Qualified applicants will receive consideration for
  employment without regard to race, color, national origin,
  citizenship, ancestry, religion, creed, sex, sexual
  orientation, gender identity, age, disability, veteran or
  military status, or any other basis prohibited by law.

  In addition, Applied endeavors to make our careers site
  accessible to all users. If you would like to contact us
  regarding accessibility of our website or need assistance
  completing the application process, please contact us via
  e-mail at Accommodations_Program@amat.com, or by calling our
  HR Direct Help Line at 877-612-7547, option 1, and following
  the prompts to speak to an HR Advisor. This contact is for
  accommodation requests only and cannot be used to inquire
  about the status of applications.
