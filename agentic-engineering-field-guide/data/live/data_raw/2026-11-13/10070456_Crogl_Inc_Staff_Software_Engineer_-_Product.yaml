description: |
  Role: Staff Software Engineer - Product

  Job Type: Full Time, Remote

  Crogl

  Fully Autonomous AI Team Member for Your SOC

  Are you passionate about making the world more secure? Have
  you been a senior technical leader on a high performing
  product team shipping to hundreds of paying customers? If
  so, we want you. Come join Crogl and reinvent security
  operations.

  What you'll be doing

  As a Staff Engineer at Crogl, you will be the technical
  anchor for one of our engineering teams. You will own the
  architecture and design for your team's part of the
  platform, set the technical bar for the engineers around
  you, and give our customers' analysts, from beginners to
  SMEs, superpowers. Your work will directly impact how
  organizations secure and defend their digital estate.

  - Own the architecture, technical design, and delivery for
    your team's area of the platform, turning roadmap into
    engineering plans that ship and hold up in production
  - Drive the hardest technical decisions in your domain and
    resolve ambiguous, high-risk problems before they become
    blockers
  - Design and build core parts of our compound AI system,
    spanning agents, LLMs, and RAG, with a focus on
    reliability, evaluation, and scale
  - Own your team's most complex, mission-critical initiatives
    end to end, from problem framing through production and
    iteration
  - Establish and champion engineering best practices, coding
    standards, architectural patterns, and AI-native
    development techniques within your team
  - Multiply your team's impact by mentoring senior and mid-
    level engineers, raising the quality bar through code
    review, design review, and your own hands-on work
  - Partner closely with your product and design counterparts to
    uncover requirements and align on priorities
  - Stay current with the state of the art in software
    engineering and applied AI, and bring the relevant
    advances into your part of the platform

  What you bring to the team

  - 8+ years of back-end engineering experience, or equivalent,
    including time operating as the technical lead or
    architect for a team or a significant product area
  - Deep experience architecting production-grade distributed
    systems and scaling them, with strong fluency in one or
    more of Go, Python, or other major back-end (preferably
    statically typed) languages
  - Proven ability to set technical direction for a team and
    deliver complex, high-impact projects
  - Hands-on experience building or scaling AI systems in
    production, ideally LLM-based, agentic, or retrieval-
    augmented, with sound judgment on where AI genuinely fits
  - Strong business acumen and the ability to translate
    technical solutions into tangible business value
  - A continuous learning mindset and a bias toward proving out
    new approaches rather than only tracking them
  - Excellent interpersonal and collaboration skills, with a
    history of building consensus, elevating peers, and
    navigating cross-functional relationships

  What makes you stand out from other candidates

  - Track record of taking high-impact products from concept to
    market at scale
  - Experience building agentic or LLM-powered products in
    production, including evaluation and reliability practices
  - Cybersecurity domain depth, especially in security
    operations (SOC, SIEM, SOAR, EDR, XDR) or detection
    engineering
  - Early or founding engineer experience at a fast-moving
    startup
  - Passion for delivering highly reliable systems and for
    transforming the practice of defensive cybersecurity

  Education

  Bachelor's degree or higher in Computer Science or
  equivalent experience

  Crogl is an equal opportunity employer and provides equal
  employment opportunities (EEO) to all employees and
  applicants for employment without regard to race, color,
  religion, gender, national origin, sexual orientation,
  gender identity or expression, age, disability, genetic
  information, marital status or veteran status.
