description: |
  ## Full Stack – React.js & Rust Developer :: Web3 networking
  platform - Token compensation

  ### About the Role

  We’re looking for a Full Stack Developer with strong
  React.js and Rust experience to join our early-stage Web3
  startup and help build the next generation of professional
  networking infrastructure for the blockchain and crypto
  ecosystem.

  You’ll work closely with our product, design, and
  engineering teams to build, improve, and scale core platform
  features. This is an opportunity to take ownership of
  meaningful technical work and have a direct impact on a
  product that is being built from the ground up.

  ### What You’ll Do

  * Develop and maintain responsive, scalable web applications
  using React.js. * Build and enhance backend services and
  APIs using Rust. * Integrate frontend and backend components
  to deliver reliable end-to-end features. * Work with product
  and UI/UX teams to translate requirements and designs into
  production-ready functionality. * Design and implement REST
  APIs and backend services. * Debug, troubleshoot, and
  optimize application performance. * Write clean,
  maintainable, and reusable code. * Participate in code
  reviews, testing, and technical discussions. * Collaborate
  with a distributed international team in a fast-moving
  startup environment. * Contribute to technical decisions and
  help shape the platform as it evolves. * Stay current with
  Web3, blockchain, and emerging technology trends.

  ### What We’re Looking For

  * Strong hands-on experience with React.js,
  JavaScript/TypeScript, and Rust. * Experience developing
  full-stack web applications. * Strong understanding of
  frontend architecture, APIs, databases, and backend
  development. * Experience with Git and modern software
  development practices. * Ability to independently
  troubleshoot problems and deliver features with minimal
  supervision. * Good understanding of software development
  lifecycle and testing practices. * Strong communication and
  collaboration skills. * Interest or experience in Web3,
  blockchain, cryptocurrency, or decentralized technologies is
  a strong advantage. * Startup experience and an ownership
  mindset are highly valued.

  ### What We Offer

  * 100% remote opportunity. * Flexible and collaborative
  startup environment. * Opportunity to work directly with an
  international Web3 team. * Significant ownership and direct
  involvement in product development. * Opportunity to work on
  real-world Web3 and blockchain use cases. * Learn and grow
  alongside an early-stage technology product. * Project-based
  token compensation and potential ecosystem benefits, subject
  to the project’s terms and applicable arrangements.

  ### Who Will Thrive Here

  We’re looking for people who take ownership, communicate
  clearly, move proactively, and enjoy building things from
  the ground up. If you’re excited by Web3 and want your
  technical contributions to have a visible impact on an
  emerging platform, we’d love to hear from you.

  ### Application Process

  Shortlisted candidates will be invited to a Google Meet
  interview to discuss the role, technical responsibilities,
  working expectations, compensation structure, and the
  project in greater detail.
