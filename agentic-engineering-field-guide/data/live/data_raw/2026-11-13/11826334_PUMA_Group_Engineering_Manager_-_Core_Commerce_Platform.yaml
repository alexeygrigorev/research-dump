description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Core Commerce Platform organisation
  responsible for delivering the omnichannel commerce
  capabilities that power the purchase journey, inventory
  availability, delivery promise, order processing &
  fulfilment and post-purchase experiences across channels.
  The organisation plays a critical role in ensuring products
  are available to buy, orders can be fulfilled reliably, and
  commitments made to consumers are delivered consistently.
  Through a portfolio of commerce platform capabilities, the
  organisation enables seamless omnichannel experiences while
  supporting efficient, scalable, and resilient commerce
  operations across the global digital ecosystem.

  The Engineering Manager is accountable for engineering
  delivery, roadmap execution, operational excellence, and
  engineering team development. Partnering with Product
  Owners, Project Managers, Tech Leads, and peer engineering
  teams, you will enable predictable delivery, grow
  engineering talent, and build a high-performing culture
  focused on ownership, accountability, and continuous
  improvement.

  What you will do:

  · Lead and develop a team of software engineers building
  basket, checkout, payments, and consumer commerce services.

  · Drive delivery of highly available, secure, and scalable
  commerce services that directly impact conversion, revenue,
  and consumer experience.

  · Own engineering execution for payment gateway
  integrations, alternative payment methods, checkout
  orchestration, promotions, taxation, and transactional
  commerce workflows.

  · Drive planning and execution against team objectives and
  key results (OKRs), ensuring alignment, accountability and
  transparent reporting.

  · Own sprint execution, delivery planning, capacity
  management, dependency management, and risk management.

  · Partner with Product Owners, Project Managers, Retail Tech
  team, and Tech Leads to deliver business outcomes.

  · Drive engineering excellence through strong development
  practices, quality standards, operational discipline and
  continuous improvement.

  · Coach engineers through regular feedback, mentoring,
  performance management, and career development.

  · Build a high-performing engineering culture focused on
  ownership, accountability, collaboration, and learning.

  · Establish effective engineering metrics and use data to
  improve team productivity, quality, and delivery
  predictability.

  · Drive adoption of AI-assisted engineering practices and
  automation to improve productivity, quality, and delivery
  efficiency.

  · Identify opportunities to leverage AI across software
  development, testing, documentation, knowledge management
  and onboarding.

  · Collaborate with engineering leadership on hiring,
  staffing, onboarding, talent development, and succession
  planning.

  · Manage delivery partners and vendors where applicable and
  ensure alignment with team objectives.

  YOUR TALENT

  10+ years of software engineering experience, with
  experience leading engineering teams in an agile delivery
  environment.

  · 3+ years of people leadership experience.

  · Strong experience leading roadmap execution, delivery
  planning, dependency management, and stakeholder engagement.

  · Familiarity with API-first, cloud-native architectures and
  design patterns.

  · Solid software engineering background with experience
  building APIs, distributed systems, and high-volume
  transactional platforms.

  · Strong understanding of basket, checkout, payment
  processing, promotions, pricing, taxation, and other
  commerce services within modern eCommerce platforms.

  · Experience integrating with payment gateways, fraud
  prevention providers, financial service providers, and
  third-party commerce platforms.

  · Understanding of payment security, tokenisation,
  authentication, PCI-DSS principles, and secure transaction
  processing practices.

  · Experience working with event-driven architectures, high-
  volume transactional systems, and enterprise integrations.

  · Strong people leadership skills with experience in hiring,
  mentoring, developing, and retaining high-performing
  engineering teams.

  · Strong understanding of modern software engineering
  practices including software architecture & engineering
  principles, code quality, automated testing, CI/CD, and AI-
  assisted development.

  · Strong communication, collaboration, decision-making, and
  organisational leadership skills.

  · Experience driving engineering quality, operational
  excellence, reliability, security, and continuous
  improvement.

  · Experience working in Agile delivery environments using
  tools such as Jira & Confluence or equivalent.

  · A data-driven mindset with the ability to use engineering,
  delivery, and operational metrics to improve team
  effectiveness and predictability.

  · Experience leveraging coding agents, LLMs, and AI-assisted
  engineering tools to improve software delivery and team
  productivity will be a strong advantage.

  · Experience in global DTC, retail, omnichannel commerce or
  high-volume consumer digital environment preferred.

  · Bachelor's degree in Computer Science, Information
  Technology, Engineering or a related field.

