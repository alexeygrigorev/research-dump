description: |
  About Ovative Group:

  Ovative Group is an independent, full-funnel media,
  measurement, and creative firm transforming how brands grow.
  We partner with leading names like American Eagle, Best Buy,
  Domino’s, The Home Depot, Polaris, and UnitedHealth Group to
  build smarter media and measurement programs that drive
  real, profitable growth.

  We don’t just track performance—we redefine it. Powered by
  our proprietary intelligence platform, EMRge, and our
  holistic metric Enterprise Marketing Return (EMR), we help
  brands connect revenue, customer, and brand outcomes into
  one clear picture of success. Our approach to full-funnel
  strategy, buying, and measurement delivers results that
  matter—and it’s getting noticed. Our work has been
  recognized by Digiday, Google, USA Today, Inc. 5000, and
  Search Engine Land.

  About the Role:

  We are seeking a Sr. Full Stack Engineer to join our rapidly
  growing product and engineering development team.

  In this role, you will take a leadership position within a
  cross-functional team responsible for creating, optimizing,
  and maintaining scalable software and data solutions to
  enhance performance, stability, and scalability. You will
  play a pivotal role in guiding the team and working closely
  with internal and client stakeholders throughout the entire
  software development lifecycle, from concept to deployment.


  The ideal candidate will bring extensive experience in
  iterative development practices, a strong focus on building
  testable solutions and both conceptual and pragmatic
  problem-solving skills. Your outstanding attention to detail
  and strong written and oral communication skills will enable
  you to work directly with business users, understanding
  their objectives and translating them into technical
  requirements. As a valuable team member, you will have the
  opportunity to mentor junior team members, contribute to
  innovative ideas, and drive the adoption of cutting-edge
  technologies within the team and foster your own
  professional growth.

  Responsibilities of a Sr. Full Stack Engineer:

  - Develop and maintain an existing software product,
    onboarding new clients and maintaining existing clients.

  - Lead the design, development, testing, and deployment of
    robust software solutions that marry together our ELT and
    ETL pipelines and client facing website

  - Lead, design, advise, and implement data engineering
    solutions that facilitate robust data vending and
    utilization for general usage across the organization

  - Lead efforts in identifying opportunities for automation
    with a focus on the operational stability of software
    applications and systems.

  - Engage directly with Product Managers and stakeholders to
    understand their business goals, gather requirements, and
    translate into detailed, actionable technical
    requirements.

  - Research, write and edit documentation and technical
    requirements, including software designs, evaluation
    plans, test results, technical manuals and formal
    recommendations and reports.

  - Evaluate trade-offs between correctness, robustness,
    performance and customer impact to ensure we build the
    right solutions on that scale.

  - Mentor and level up the skills of your teammates through
    collaboration and by sharing your expertise.

  - Drive and ensure adherence to and advancement of software
    and product engineering best practices, including code
    quality, documentation, testing, security, deployment, and
    performance.

  - Troubleshoot complex software issues and provide effective
    solutions.

  - Provide guidance, mentorship, and contribute to
    architectural decisions, code reviews, and project
    direction.

  - Foster a culture of continuous learning to keep your team
    current with emerging technology and software engineering
    trends.

  - Drives and ensures adherence to SDLC and DevOps best
    practices, maintaining high standards of quality and
    security across all phases of development.

  Requirements:

  - 5+ years of relevant software engineering experience.

  - Highly proficient in one or more object-oriented languages
    (e.g., Python, Java, C#).

  - Highly proficient with data structures and design patterns.

  - Experience with testing best practices (e.g., unit,
    integration, smoke).

  - Experience building and deploying containerized application
    code.

  - Experience with React, Angular or Vue frameworks

  - Experience with cloud-based platforms (e.g., GCP, AWS,
    Azure).

  - Experience with DevOps & CI/CD.

  - Experience working with relational databases.

  Preferred:

  - Experience with microservices.

  - Experience with security best practices and tools.

  - Experience with authentication strategies.

  - Experience working with big data.

  - Experience with iterative development.

  - Experience in the digital marketing and measurement space.

  - Experience with, or a strong demonstrable interest in,
    agentic AI technologies and their practical applications.

  Pay Transparency:

  At Ovative, we offer a transparent view into three core
  components of the total compensation package: Base Salary,
  Annual Bonus, and Benefits.

  For our Manager positions, including the position of Sr.
  Full Stack Engineer, our compensation range is from $90,000
  to $132,000 on an annualized basis, which is inclusive of an
  annual bonus opportunity of up to 20% of base salary.

  Working at Ovative Group:

  We provide strong, competitive, holistic benefits that
  understand the importance of your life inside and out of
  work.

  At Ovative, culture isn’t a buzzword—it’s the reason we’ve
  been named a Top Workplace for ten years running. We lead
  with trust, transparency, and a commitment to doing the hard
  work others avoid.

  We offer flexibility. You'll work from our Minneapolis,
  Chicago, or New York office on set days each week, and an
  option to work remote on others.

  Our open floor plan reflects our open communication and flat
  structure—where interns collaborate with VPs, analysts
  partner with senior leaders, and our CEO engages with every
  team member. Together, we create an environment where smart,
  driven people can do their best work and support one another
  in the process.

  We’re equally committed to inclusion and belonging. Ovative
  fosters a workplace where everyone can participate and
  thrive—regardless of ethnicity, gender, sexual orientation,
  gender identity, or expression or other protected class
  status. Our benefits and policies reflect that commitment,
  from inclusive medical leave coverage for same-sex spouses
  to equitable care and support for all families.

  Benefits:

  We strive to hire and retain the best talent by offering
  fair, competitive compensation, a meaningful bonus program,
  and excellent health coverage. When the company performs
  well, we all benefit.

  Some tangible benefits and amenities we enjoy:

  - Access to all office spaces in MSP, NYC, and CHI

  - Frequent, paid travel to our Minneapolis headquarters for
    company events, team events, and in-person collaboration
    with teams

  - Generous paid vacation policy

  - 401k match program

  - Top-notch health insurance options, inclusive of same sex
    partners

  - Family formation benefits including reimbursement options
    for fertility, pregnancy, and parenting needs

  - Monthly stipend for your mobile phone and data plan

  - Sabbatical program

  - Charitable giving via our time and a financial match program

  - Shenanigan’s Day

  Additional information can be found at Ovative's Career
  Page.

  The details of the benefits are covered by applicable plan
  documents for group benefits and by company policies where a
  plan document does not apply.

  Working at Ovative won’t be easy—but if you like
  challenging, hard work, driving results, and being
  surrounded by the best talent, it has the potential to be
  the most rewarding job you’ll ever have. If you think you
  can make us better, we want to hear from you!

  EEO & Accessibility:

  Ovative is an Equal Opportunity Employer committed to a
  respectful, inclusive workplace for all. Applicants receive
  consideration without regard to legally protected
  characteristics (e.g., color, religion, creed, national
  origin, sex, pregnancy, childbirth and related conditions,
  sexual orientation, gender identity/, gender expression,
  gender identity, age, physical or mental disability,
  marital/ status, familial status, military or veteran’s
  status, genetic information, status with regard to public
  assistance, and any other status protected under applicable
  law).

  We provide reasonable accommodations consistent with the
  Americans with Disabilities Act and applicable state law to
  qualified applicants and employees with disability, unless
  doing so would create an undue hardship.

  If you need assistance or accommodation at any stage of the
  application or interview process due to a disability, please
  contact us at application.accomodations@ovative.com.

  Application Details and Process:

  Applicants must be legally authorized to work in the United
  States for any employer on a full-time basis, without
  current or future need for visa sponsorship. Ovative is
  unable to sponsor or take over sponsorship of an employment
  visa for this position. In compliance with federal law, all
  persons hired will be required to verify identity and
  eligibility to work in the United States and to complete the
  required employment eligibility verification documentation
  upon hire.

  Open Until Filled or Otherwise Withdrawn:

  We encourage interested candidates to apply early. The
  position will remain open for at least 10 business days from
  the first day of posting. After this time, if the position
  has not been filled, the posting will remain open until the
  position is filled, or until the posting is otherwise closed
  or withdrawn for business reasons.
