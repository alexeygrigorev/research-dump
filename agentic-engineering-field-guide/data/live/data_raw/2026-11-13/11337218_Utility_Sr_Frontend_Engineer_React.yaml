description: |
  Join the Utility Team!

  Utility is an end-to-end mobile app and digital platform
  agency, focused on designing and engineering innovative,
  transformative technology. Our clients are premier global
  brands and new ventures across the wellness, fitness,
  entertainment, streaming, and educational spaces. Founded by
  digital leaders from companies like Major League Baseball
  and McCann Erickson, Utility is built by folks who have been
  on the other side of the table. We treat every project as if
  it were our own, from startup ventures to blue-chip brands.

  What You'll Do

  - Have the freedom to create products people love.
  - Collaborate with a cross-disciplinary team to build large-
    scale products for well-known brands.
  - Advocate for software engineering best practices and inspire
    their team to continuously learn and improve.
  - Help build a React app from scratch / end-to-end.
  - Work with other React developers on the project and
    architect the app’s patterns, structure, library choices,
    and code reviews.
  - Promote best practices in coding and architecture,
    collaborating with and mentoring other members of the
    engineering team.
  - Commit to building fast and scalable products that people
    love, all while using best practices and the latest
    technologies.

  Qualifications

  - 8+ years of professional experience developing complex web
    applications using React and other modern web
    technologies.
  - 5+ years experience with React Web.
  - Deep understanding of React and TypeScript best practices,
    design patterns, and performance optimization techniques.
  - Strong, demonstrated leadership skills to effectively lead
    front-end teams on a fast-paced React Web project.
  - Excellent communication and collaboration skills to
    effectively communicate technical concepts to both
    technical and non-technical stakeholders, and work closely
    with designers, product managers, and other stakeholders.
  - Proven track record of leading successful web development
    projects, and ability to drive the team toward delivering
    high-quality, scalable, and maintainable code in a fast-
    paced environment.

  Benefits

  - Competitive salary
  - 100% remote
  - PTO policy: unlimited (within reason)
  - Holidays policy: Local holidays apply
  - Additional benefits: Growth Potential, Flexible Work
    Location, Company Branded Swag Package, Professional
    Personal Development Support
