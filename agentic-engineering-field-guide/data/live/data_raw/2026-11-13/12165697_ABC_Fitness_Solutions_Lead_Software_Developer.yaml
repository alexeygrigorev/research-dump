  Job Description Summary

  You’ll join the Users Squad, a critical engineering team
  responsible for some of the most important capabilities on
  the ABC Glofox platform. The team owns core user, account,
  authentication, permissions, and member-management
  experiences that are fundamental to how studios and their
  staff interact with the platform. The Users Squad works on
  capabilities including authentication, MFA, permissions,
  member transfers, family accounts, global search, and
  restricted member profiles. These are high-impact platform
  services used across the product, requiring strong attention
  to security, reliability, scalability, and user experience.
  As a Lead Software Developer, you’ll help set technical
  direction for the Users domain, lead complex backend
  initiatives, mentor engineers, and partner closely with
  Product and other engineering squads. You’ll also contribute
  to cross-team initiatives such as splitting the Core API and
  API Gateway.

  WHAT YOU’LL DO • Provide technical leadership and guidance
  across the Users Squad. • Mentor engineers through design
  reviews, pairing, thoughtful feedback, and technical
  coaching. • Design and develop reliable backend services
  using Golang and other appropriate technologies. • Own
  complex technical problems from discovery and design through
  delivery, operation, and continuous improvement. • Help
  define and evolve the technical direction for user, account,
  authentication, and permissions capabilities. • Contribute
  to authentication and security-related features, including
  login, MFA, and the permissions service across frontend and
  backend. • Work on account capabilities including: Leads and
  client management; Staff and user details; Family accounts.
  • Build and improve global features including: Categories;
  Global search; User-related settings; Restricted member
  profiles; • Contribute to orchestration capabilities such as
  member transfers. • Work with an energised, fun, friendly,
  and customer-focused cross-functional team. • Collaborate
  with designers, developers, product managers, testers, and
  partner squads to transform ideas into unique, human
  experiences for fitness entrepreneurs. • Contribute to
  cross-team platform initiatives, including the separation of
  the Core API and API Gateway. • Use modern Agile and Lean
  ways of working underpinned by DevOps and CI/CD. • Use AI
  coding tools as part of normal delivery while maintaining
  ownership of design decisions, code quality, testing, and
  what reaches production. • Reduce repeated manual work
  through automation and AI-assisted tooling, applying
  appropriate review and test standards to anything those
  tools produce.

  WHAT YOU’LL NEED

  - Bachelor’s degree in Computer Science or a relevant field
    preferred.
  - 6+ years of experience with a general-purpose programming
    language.
  - Proven experience owning complex backend features, services,
    or platform capabilities.
  - Strong experience designing and building production software
    and APIs.
  - Experience leading technical direction and influencing
    engineering decisions across a team or domain.
  - Hands-on experience using AI coding assistants or agents to
    deliver production software, including reviewing and
    testing generated output.
  - Strong understanding of practical Agile, Lean, and
    Continuous Delivery methods.
  - Knowledge of modern quality and testing principles.
  - Strong written and verbal communication skills.
  - Comfortable mentoring engineers and partnering closely with
    Product and other technical teams.
  - Comfortable learning new technologies and systems.
  - Experience working on systems where security, permissions,
    authentication, and reliability are important
    considerations.

  AND IT’S GREAT TO HAVE

  - Experience with Golang, Java, PHP, or similar backend
    technologies.
  - Experience with authentication, MFA, permissions, or
    identity-related systems.
  - Experience with high-throughput APIs, event-driven
    architectures, or distributed systems.
  - Experience with MySQL or other relational databases.
  - Experience with file or asset-upload systems.
  - Experience with global search, member-management, or
    account-management domains.
  - Experience working across multiple engineering squads on
    platform initiatives.
  - Experience integrating with third-party services such as
    Mailchimp.

