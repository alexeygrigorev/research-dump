description: |
  Company Overview

  Crewfare is a travel tech company transforming how groups
  travel and experience the world. We leverage cutting-edge
  technology and exceptional service to deliver unforgettable
  journeys. Our culture is collaborative, creative, and
  focused on delivering exceptional results.

  Job Description

  We are seeking a passionate and experienced Full-Stack
  TypeScript Developer to join our growing team. In this role,
  you will help build robust, scalable, and high-performance
  web applications as part of our cutting-edge travel
  management platform. You will collaborate closely with
  product, design, and engineering teams to create intuitive
  user interfaces and powerful backend systems that redefine
  how groups manage travel.

  Key Responsibilities

  - Develop and maintain full-stack web applications using
    TypeScript, React, Node.js, and related technologies.
  - Design and implement RESTful APIs and microservices to power
    new features.
  - Optimize application performance, including frontend
    responsiveness and backend scalability.
  - Participate in the entire development lifecycle, from
    ideation to deployment.
  - Write clean, maintainable, and well-documented code.
  - Ensure the reliability of our systems by implementing
    thorough unit and integration tests.
  - Collaborate with cross-functional teams to design, define,
    and ship new features.
  - Stay informed on emerging technologies and propose new tools
    or practices to enhance development.
  - Participate in code reviews and contribute to the continuous
    improvement of our technical architecture.

  What We’re Looking For

  - Excellent English communication skills (written and verbal).
  - Working hours overlapping with US Eastern Time.
  - Bachelor’s degree in Computer Science or a related field, or
    equivalent professional experience.
  - 5+ years of professional experience in full-stack web
    development.
  - Strong proficiency in TypeScript, JavaScript, React, and
    Node.js.
  - Experience with modern front-end frameworks and libraries
    (e.g., Redux, Next.js).
  - Familiarity with database technologies (e.g., PostgreSQL,
    MongoDB).
  - Knowledge of cloud platforms (preferably AWS).
  - Proficiency in debugging and optimizing frontend and backend
    performance.
  - Strong problem-solving and analytical skills.
  - A passion for creating exceptional user experiences and
    delivering high-quality software.

  Nice-to-Haves

  - Experience with NestJS for building scalable backend
    applications.
  - Knowledge of the PostGIS extension for spatial and
    geographic data in PostgreSQL.
  - Familiarity with containerization and orchestration (Docker,
    Kubernetes).
  - Experience with the SST framework for serverless
    applications.
  - Knowledge of CI/CD pipelines and DevOps practices.
  - Experience working in the travel tech industry or with
    similar domains.
  - Exposure to performance profiling tools and strategies for
    scaling high-traffic systems.

  Team and Culture

  - You’ll be part of a small, close-knit team of three
    developers, working collaboratively on key projects.
  - While the core development team is small, you’ll interact
    frequently with other developers and stakeholders across
    the company to integrate features and solutions across
    multiple products.
  - We value curiosity, innovation, and a willingness to learn
    from each other.
  - Our team is dedicated to fostering a culture of inclusion
    and continuous improvement.

  Why Join Us?

  - Impactful Work: Help build a platform that simplifies and
    enhances group travel for thousands of users.
  - Growth Opportunities: Access to training budgets,
    mentorship, and career advancement programs.
  - Collaborative Environment: Work cross-functionally with
    talented teams across the organization.
  - Flexible Environment: Remote-friendly work culture with
    flexible hours.

  Location

  This position is international, and we are looking for
  candidates who are excited to work in a global environment.
