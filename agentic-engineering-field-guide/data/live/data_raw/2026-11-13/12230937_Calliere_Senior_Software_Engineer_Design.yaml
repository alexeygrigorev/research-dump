description: |
  This is a remote position.



  The opportunity



  Our client is looking for a Senior or Staff Engineer focused
  on design: someone who is both a skilled engineer and a
  creative craftsperson. You'll care deeply about the fine
  details of user interface and experience, so the product
  feels as good as it works, and you'll raise the quality of
  Loancrate's UI from pixel to production.




  What you'll do



  • Own the design process end to end, from wireframes in
  Figma to implementation in React and TypeScript.




  • Build and maintain a scalable design system and component
  library using shadcn/ui.




  • Write accessible, production-quality React components with
  correct ARIA, keyboard and focus handling.




  • Turn complex mortgage workflows into intuitive, elegant
  experiences, working closely with product and engineering.




  • Define and enforce visual and interaction standards so the
  product stays consistent.








    Requirements

  What they're looking for



  • At least 5 years at Senior Engineer level in a Design
  Engineer, frontend or full-stack role.




  • A record of shipping production code with strong design
  sense and close attention to detail.




  • Hands-on Figma skills alongside deep React and TypeScript.




  • Experience building design systems and component
  libraries.



  • Solid accessibility knowledge, including ARIA, keyboard
  navigation and focus management.
