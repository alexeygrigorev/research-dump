description: |
  Condé Nast is one of the world's most renowned media
  publishing companies, creating and distributing every type
  of media today, spanning print and digital publishing in all
  formats. With a portfolio of some of today's most
  influential brands, the company continues to grow its
  audience through a global operational and content
  infrastructure across its 12 owned and operated markets.
  Headquartered in New York City, the company's owned and
  operated markets include China, France, Germany, India,
  Italy, Japan, Mexico & Latin America, Spain, Taiwan,
  UAE/Dubai, the U.K., and the U.S., with additional local
  license partners in over twenty additional markets across
  the globe. Lead brands include Vogue, The New Yorker, GQ,
  Architectural Digest, Condé Nast Traveler, Vanity Fair,
  Wired, Allure, Ars Technica, Bon Appétit, House & Garden,
  Pitchfork, Tatler, and Vogue Business.Job Description

  Location:

  London, GB

  Condé Nast is a global media company, home to iconic brands
  including Vogue, GQ, Glamour, CN Traveller, Vanity Fair,
  Wired, The World of Interiors, House & Garden and Tatler,
  among many others.

  We are headquartered in New York and London and operate in
  32 markets worldwide, with a footprint of more than 1
  billion consumers across print, digital, video and social
  platforms.

  Condé Nast thrives on collaboration, and our teams come
  together in the office four days a week (Monday - Thursday).

  Condé Nast is looking for an experienced engineering leader
  to help build the next generation of Vogue products. You
  will lead an engineering team in its mission to keep Vogue
  users entertained and inspired, improving content
  discoverability and enabling scalable, brand agnostic
  solutions.

  This is a hands-on leadership role. You should be as
  comfortable in a design review or a pull request as you are
  in a one-to-one or a performance conversation.

  We want you to work in an AI-native way and guide your team
  in doing the same.

  That means treating AI tooling as a normal part of how work
  gets designed, built and reviewed here, setting clear
  standards for using it well, and looking for places where it
  can improve the product for our users.

  Responsibilities

  Technical leadership and hands-on delivery

  - Contribute directly to production code across back-end APIs
    and front-end components, and stay close enough to the
    detail to make credible technical decisions.
  - Set and own the technical direction for your team, including
    architecture, design patterns and engineering standards.
  - Lead projects from ideation through execution to
    maintenance.
  - Participate in design and code reviews, and raise the
    standard of both across the team.
  - Identify and resolve code, performance and usability issues.
  - Evaluate libraries and tools for integration into our
    platform, including AI tooling, and set standards for how
    the team uses it covering code quality, review, security
    and data handling.
  - Balance delivery against platform health, technical debt and
    long-term maintainability.

  Line management and people leadership

  - Line manage a team of engineers, owning their growth,
    performance and wellbeing through regular one-to-ones,
    clear expectations and honest feedback.
  - Coach engineers through career progression, including the
    difficult conversations, and support each person in doing
    their best work.
  - Build a team where people feel safe to ask questions, raise
    concerns, disagree with you and admit mistakes, and make
    space for quieter and newer voices in technical
    discussion.
  - Contribute to hiring and onboarding for your team, with
    attention to fair and consistent assessment.

  Collaboration and delivery

  - Work closely with product and design partners on the
    creation and iteration products and features.
  - Own the delivery of your team's work, planning and
    prioritising alongside your product partner.
  - Keep stakeholders informed with clear communication about
    progress, risk and trade-offs.
  - Collaborate with the broader engineering group on new ideas
    and on improving existing ones.

  What We Value

  We do not expect any one person to necessarily arrive with
  all of this. If you meet most of what follows and are
  interested in the rest, we would like to hear from you.

  - Significant experience as a software engineer, with a track
    record of shipping and running production systems.
  - Proven line management experience, including career
    development, hiring and performance management.
  - Comfortable remaining hands-on. You still write and review
    production code, and you contribute credibly to technical
    discussions with engineers at every level.
  - Deep, current fluency in JavaScript.
  - Experience working with, designing and deploying production-
    grade RESTful APIs. Experience and knowledge of GraphQL
    APIs is a plus.
  - Have seen technical projects through the entire development
    lifecycle, from ideation through execution and
    maintenance.
  - Strong analytical and problem solving skills, and strong
    attention to design detail.
  - Excellent communication skills, including being comfortable
    explaining technical concepts to non-technical
    stakeholders.
  - A track record of mentoring and developing engineers,
    including people whose background or route into the
    industry may differ from your own.
  - Hands-on experience with AI-assisted development tools and a
    considered view on how engineering teams should use them.

  Desirable

  - Experience in digital publishing, media or another high-
    traffic, content-heavy domain.
  - Experience working on content discoverability,
    personalisation or search.
  - Experience with brand agnostic or multi-tenant platforms.
  - Experience shipping AI-powered product features, for example
    using large language models, embeddings, semantic search
    or recommendation systems.
  - Experience introducing engineering practices or AI tooling
    across a team.

  Things We Use Daily

  - Languages and Frameworks: JavaScript, NodeJS, ReactJS,
    TypeScript, GraphQL
  - Deployment: Docker, AWS, Kubernetes
  - Source Control: Git, GitHub
  - AI Tooling: Codex, ChatGPT, Gemini

  What benefits do we offer?

  - 25 days holiday (plus bank holidays) and extra days of
    annual leave if you move house or want to volunteer.

  - You’ll have access to a competitive pension scheme, Bupa
    Private Healthcare, Season ticket loans and eye tests.

  - We offer a range of tools to support your wellbeing,
    including core hours, 10 remote days (from home or a
    country with a Condé Nast office location), access to our
    Employee Assistance Programme, corporate gym membership
    and cycle to work scheme.
  - We’re a dog-friendly office, plus you’ll enjoy discounts and
    magazine subscriptions, keeping you up to date with all
    things Condé Nast.

  - We encourage personal and professional growth through the
    Condé Nast Learning Hub, where you’ll find an extensive
    portfolio of learning courses and training available in
    local languages.
  - Our Employee Resource Groups provide a platform for
    employees to identify shared objectives, exchange ideas,
    and work on community priorities for our global workforce.

  What happens next?

  If you are interested in this opportunity, please apply
  below, and we will review your application as soon as
  possible. You can update your resume or upload a cover
  letter at any time by accessing your candidate profile.

  Condé Nast is an equal opportunity employer. We evaluate
  qualified applicants without regard to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, disability, veteran status, age, familial status and
  other legally protected characteristics.
