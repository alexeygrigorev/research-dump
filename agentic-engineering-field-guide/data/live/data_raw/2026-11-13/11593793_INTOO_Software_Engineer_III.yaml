description: |
  Software Engineer III INTOO is a fast-growing HR technology
  solutions provider and is seeking a dynamic, talented, and
  ambitious Software Engineer III to join our team. This role
  is for experienced engineers who independently deliver
  complex features and contribute to system design.

  IDEAL KNOWLEDGE, SKILLS, AND ABILITIES INCLUDE: •    Ability
  to communicate complex technical concepts and tradeoffs •
  Ownership of medium-to-large features and technical
  solutions •    Ability to gather requirements and clarify
  ambiguity with product and design •    Responsibility for
  production readiness, deployments, and operational support •
  Proactive focus on performance, reliability, and security •
  Ability to mentor less experienced engineers •    Evaluation
  and application of new tools, patterns, and technologies

  IDEAL CANDIDATES WILL HAVE THE FOLLOWING MINIMUM EXPERIENCE:
  •    2–4 years of professional software engineering
  experience •    Strong working knowledge of Ruby on Rails
  and React •    Strong experience with modern front-end
  architectures and state management •    Strong understanding
  of automated testing pipelines and CI/CD practices •
  Proven experience troubleshooting Linux environments •
  Strong working knowledge of MySQL or similar relational
  databases, including schema design and query optimization •
  Strong hands-on experience with AWS infrastructure and
  troubleshooting •    Hands-on experience implementing SSO
  integrations (OAuth, SAML) •    Experience with monitoring,
  alerting, and security tooling •    Experience configuring,
  tuning, and maintaining web servers such as NGINX •
  Experience implementing security and compliance requirements
  (SOC2, NIST, ISO 27001) •    Exposure to accessibility
  standards and frameworks.

  PREFERRED QUALIFICATIONS (AKA: NICE-TO-HAVES): •
  Experience with Redis or other NoSQL databases •
  Experience tuning application performance and scalability •
  Additional language fluency (Italian, French, Spanish)

  EDUCATION, CERTIFICATIONS AND/OR OTHER PROFESSIONAL
  CREDENTIALS: •    BS/MS degree in Computer Science,
  Engineering, or a related subject (or equivalent experience)

  WORK LOCATION & TRAVEL REQUIREMENTS: •    Ability to travel
  up to 6 times per year •    Ability to work 1 day per week
  in the office located in Framingham, MA

  WHAT WE OFFER:  •    Medical, Vision, Dental •
  Telemedicine and Well-Being Resources •    100% Remote •
  Career Development Resources

