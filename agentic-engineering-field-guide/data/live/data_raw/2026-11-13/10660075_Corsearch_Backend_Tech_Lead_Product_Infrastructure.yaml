description: |
  At Corsearch, we are dedicated to creating a world where
  consumers can trust the choices they make.

  As a global leader in Trademark and Brand Protection, we
  partner with businesses to safeguard their most valuable
  assets in an increasingly complex digital environment.

  Our comprehensive solutions, powered by AI-driven data and
  deep analytics, enable brands to establish, monitor, and
  protect their presence against infringement and
  counterfeiting.

  Why Choose Corsearch?

  - Innovative Solutions: We combine cutting-edge technology
    with expert judgment to deliver market-leading services in
    trademark clearance, brand protection, and anti-
    counterfeiting.
  - Global Impact: Trusted by over 5,000 customers worldwide,
    including 73 of Fortune's Top 100 companies, our work has
    a meaningful impact on businesses and consumers alike.
  - Collaborative Culture: With a team of over 1,900
    professionals across multiple global offices, you'll be
    joining an inclusive environment where diverse
    perspectives thrive.
  - Mission-Driven Purpose: Our commitment to protecting
    consumers and their trust in brands drives everything we
    do, making Corsearch a force for good in the world.

  ✅The Role

  We are looking for a Tech Lead to guide and scale our
  Product Infrastructure team. In this role, you will lead a
  team of 3–5 engineers while remaining closely involved in
  technical architecture and execution.

  Our team sits at the critical intersection of raw data
  collection and product utility. We focus heavily on
  infrastructure support, scalability, and service
  provisioning—ensuring data flows seamlessly from upstream
  scrapers, refines through our AI models, and lands reliably
  in our production application. If you enjoy driving
  technical strategy, optimizing high-throughput data
  pipelines and databases, and stepping up to mentor and
  manage a high-performing engineering team, this is the role
  for you.

  ✅Responsibilities and Duties

  - People & Project Leadership: Manage, mentor, and support a
    core team of 3–5 engineers. Drive project planning, sprint
    execution, and technical delivery while fostering
    technical growth and team performance.
  - Ingestion Pipeline Architecture: Lead and accelerate our
    strategic migration from legacy daily batch tasks to a
    high-throughput, real-time stream processing ingestion
    pipeline.
  - Infrastructure & Database Optimization: Oversee
    infrastructure scaling (including our growing adoption of
    Kubernetes on AWS) and take technical ownership of
    PostgreSQL performance, index tuning, and database
    consistency under heavy load.
  - Automation & AI Integration: Partner with Product
    Engineering to evolve our real-time auto-moderation
    pipeline and integrate AI/ML models into our core data
    workflows.
  - Observability & Incident Automation: Leverage our
    observability stack (powered by ClickHouse and Grafana) to
    automate incident investigation, drive performance
    improvements, and rapidly resolve critical bugs.
  - Stakeholder & Roadmap Alignment: Work closely with cross-
    functional squads, product managers, and engineering
    leaders to translate business objectives into clear
    technical roadmaps and execution plans.

  ✅Essential

  - Leadership & Mentorship: Direct people management experience
    OR a strong background in technical leadership, mentoring
    engineers, or leading project virtual teams (v-teams),
    with the desire and capability to step into managing 3–5
    direct reports.
  - Production Engineering Experience: Proven track record
    building, scaling, and monitoring production-grade backend
    and infrastructure applications.
  - Core Language Proficiency: Python is our primary backend
    language. We welcome candidates with strong experience in
    other core languages (Go, Java, C++, etc.), provided you
    are fully motivated to develop primarily in Python moving
    forward.
  - Database Expertise: Deep hands-on experience with relational
    databases (specifically PostgreSQL), including query
    optimization, index tuning, high-concurrency performance
    tuning and data modelling.
  - Hands-on experience with Kubernetes management, deployment,
    and container orchestration.
  - Cloud & Systems Infrastructure: Solid understanding of cloud
    computing concepts with hands-on experience in AWS.
  - Communication & Collaboration: Outstanding communication
    skills with a proven ability to bridge complex technical
    execution with non-technical business stakeholders.

  ✅Desirable

  - Experience architecting or migrating legacy batch systems to
    real-time streaming data pipelines.
  - Foundational knowledge or practical experience integrating
    Artificial Intelligence / Machine Learning models into
    production data workflows.

  Corsearch is an equal opportunity and inclusive employer and
  does not tolerate discrimination of any kind. We are
  committed to creating a diverse and inclusive workplace
  where all employees feel valued, respected, and supported.
  We welcome applications from all individuals regardless of
  race, nationality, religion, gender, gender identity or
  expression, sexual orientation, age, disability, or any
  other protected characteristic. Together, we are working
  proactively to build a workplace where everyone can belong
  and be at their best selves. Together, we make an Impact.
