description: |
  Level Up Your Career with Zynga!

  At Zynga, we bring people together through the power of
  play. As a global leader in interactive entertainment and a
  proud label of Take-Two Interactive, our games have been
  downloaded over 6 billion times—connecting players in 175+
  countries through fun, strategy, and a little friendly
  competition.

  From thrilling casino spins to epic strategy battles, mind-
  bending puzzles, and social word challenges, our diverse
  game portfolio has something for everyone. Fan-favorites and
  latest hits include FarmVille™, Words With Friends™, Zynga
  Poker™, Game of Thrones Slots Casino™, Wizard of Oz Slots™,
  Hit it Rich! Slots™, Wonka Slots™, Top Eleven™, Toon Blast™,
  Empires & Puzzles™, Merge Dragons!™, CSR Racing™, Harry
  Potter: Puzzles & Spells™, Match Factory™, and Color Block
  Jam™—plus many more!

  Founded in 2007 and headquartered in California, our teams
  span North America, Europe, and Asia, working together to
  craft unforgettable gaming experiences. Whether you're
  spinning, strategizing, matching, or competing, Zynga is
  where fun meets innovation—and where you can take your
  career to the next level.

  Join us and be part of the play!

  POSITION OVERVIEW

  Zynga is seeking a Full Stack Engineer (Backend-focused) in
  the Austin, San Mateo, or Toronto areas, with a specific
  focus on candidates who have a level of experience
  equivalent to that of a Principal Software Engineer.

  We have a well-rounded and tight-knit, distributed team with
  a healthy mix of engineering skill levels, and we are
  looking to strengthen our team. We need a self-driven and
  motivated engineer who is a strong communicator, works well
  as a team player, and performs well under the pressure of
  tight deadlines. The candidate would have an opportunity to
  work on user-facing features (including UI / UX), core
  gameplay functionality, various systems, and generally solve
  challenging problems for high-profile mobile games. On the
  backend, our servers and APIs support the mobile games that
  tens of millions of users enjoy every day. We support some
  of the world's largest mobile games on some of the world's
  largest infrastructures. Our servers and APIs help the
  mobile games that tens of millions of users enjoy every day,
  including Words With Friends. As a Full Stack Software
  Engineer, you'll develop and architect critical game
  components and systems that directly relate to the success
  of our games.

  Our mission is to “Connect the World through Games” by
  building a truly social experience that makes the world a
  better place. To be successful in this role you will have a
  passion for games, a high level of integrity, great
  technical depth and skills, and a strong desire to build
  successful software. Don’t hesitate; Apply now!

  WHAT YOU'LL DO

  - Full Stack Software Engineer specializing in server-side
    technologies like C# and Ruby on Rails, driving cloud
    infrastructure on AWS, while also supporting Unity front-
    end features and DevOps execution.
  - Individual Contributor, working under a Technical Lead /
    Manager.
  - Define, architect, develop & maintain features and gameplay
    functionality in RoR, C# on the backend, and Unity, C# on
    the front end.
  - Support live-ops and deployments on a rotational basis.
  - Develop robust and scalable APIs and server-side logic using
    languages such as C# or Ruby on Rails.
  - Design and implement database schemas and manage data
    storage solutions (e.g., MySQL, PostgreSQL).
  - Deploy and maintain applications on cloud platforms (e.g.,
    AWS, Azure, Google Cloud).
  - Write unit and integration tests to ensure code quality and
    perform thorough debugging.
  - Participate in code reviews to ensure code quality and share
    knowledge with other team members.
  - Proactively optimize code & memory for high-performance
    simulations with tight constraints.
  - Develop & integrate new technologies and tools (working with
    content teams).
  - Work closely with product managers, designers, and other
    engineers to understand requirements and deliver
    solutions.
  - Create and maintain clear and concise technical
    documentation.
  - Identify and address performance bottlenecks in both front-
    end and back-end systems.
  - Mentor junior engineers and guide best practices and
    technical solutions.
  - Participate in technical design discussions and contribute
    to architectural decisions.
  - Identify opportunities to improve the team's development
    processes and workflows.

  WHAT YOU BRING

  - Bachelor's degree in Computer Science or a related field.
  - 5+ years of experience in full-stack development with the
    majority of the focus on server-side development.
  - Expert knowledge of at least one of the server-side
    languages such as C#.NET, Node.js, Python, Java, or Ruby
    on Rails.
  - Experience with database systems (e.g., PostgreSQL, MySQL).
  - Experience with cloud platforms (e.g., AWS, Azure, Google
    Cloud).
  - Proficiency in at least one modern frontend framework
    (React, Angular, Vue.js, Unity etc).
  - Expertise in caching frameworks (e.g., Redis, Memcached).
  - Strong understanding of data structures, algorithms, and
    software design principles.
  - Proficient with containerization technologies (e.g., Docker,
    Kubernetes).
  - Expertise with CI/CD pipelines.
  - Experience with performance monitoring tools.
  - Excellent communication and collaboration skills.
  - Experience with version control systems (e.g., Git).
  - Experience with Agile development methodologies.

  BONUS POINTS

  - Contributions to open-source projects.
  - Experience leading small technical projects.

  WHAT WE OFFER YOU

  Zynga offers a world-class benefits package that helps
  support and balance the needs of our teams. To find out more
  about our benefits, visit the Zynga Benefits site.

  The pay range for this position in California at the start
  of employment is expected to be between $133,900 and
  $183,900 USD per year.

  The pay range for this position in Ontario at the start of
  employment is expected to be between $114,300 and $164,300
  CAD per year.

  However, base pay offered is based on market location, and
  may vary further depending on individualized factors for job
  candidates, such as job-related knowledge, skills,
  experience, and other objective business considerations.

  Subject to those same considerations, the total compensation
  package for employees in regular roles may also include
  other elements, including a bonus and/or equity awards, in
  addition to a full range of medical, financial, and/or other
  benefits, provided that temporary or intern roles will not
  be eligible for many of these payments or benefits. Details
  of participation in compensation and benefit plans (if
  applicable) will be provided if an employee receives an
  offer of employment. If hired, employee will be in an "at-
  will position" and the company reserves the right to modify
  base salary (as well as any other discretionary payment or
  compensation or benefit program) at any time, including for
  reasons related to individual performance, company or
  individual department/team performance, and market factors.

  The use of artificial intelligence is not being used to
  screen candidates. The position is for an existing vacancy.

