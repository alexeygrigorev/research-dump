description: |
  🌎 About Us

  TeamSnap is made up of innovators, technologists, builders,
  and problem-solvers shaping the future of youth sports.
  We’ve been setting the standard in youth sports technology
  since we were founded in 2009.

  We hire for big ideas and tiny egos — which is part of how
  we landed on Outside Magazine's Best Places to Work, Built
  In's 100 Best Remote-First Places to Work and, for several
  years running, Sports Business Journal’s Best Places to Work
  in Sports.



  TeamSnap is seeking a Senior Frontend Engineer interested in
  working across the stack to join our fully distributed
  engineering team to help us continue our impressive growth
  from 2+ million daily active users to beyond! Our stack
  primarily includes Node.js, TypeScript and React. As an
  engineering team, we design and build scalable systems using
  a service-oriented and event-driven architecture that serve
  millions of daily users and some of the largest youth and
  amateur sports organizations in the world. Our team values
  collaboration in a remote culture, so we regularly
  participate in pair sessions and virtual team swarms to stay
  connected and improve the team and company.

  What You'll Do:

  - Develop engaging experiences for our millions of users
    across our web applications.
  - Design and implement scalable web apps and features,
    integrating these into an evolving unified product and
    system architecture.
  - Brainstorm and evaluate new product features in
    collaboration with the product and UX team.
  - Collaborate and pair with other developers to develop
    solutions and teach technical skills.
  - Contribute to our development standards within the team and
    across engineering to ensure code quality, adherence to
    standards, and identify opportunities for improvement
  - Champion and implement automated testing practices to uphold
    the dependability and stability of frontend applications,
    while also taking ownership of the overall reliability of
    the team’s web experiences.
  - Actively engage in on-call responsibilities and contribute
    to incident management efforts.
  - Evaluate and test new technologies to help TeamSnap move
    faster or serve our users more effectively.
  - Help teammates overcome obstacles, resolve blockers, and
    complete work tasks.

  What Will Set You Up for Success:

  Got cold feet? If you’re thinking you don’t meet 100% of the
  above qualifications, you should still seriously consider
  applying. We’re all humans with special talents that go
  beyond what’s listed here.



  Compensation

  We’re committed to equitable compensation for all
  TeamSnappers. The minimum starting point for this role is
  $150,000, inclusive of base and bonus, with comp updated
  based on multiple factors. Our comp is highly competitive in
  our space and we adjust overall comp based on relevant
  experience, skills, certifications, and geographic location.

  🖥 Location

  TeamSnap is a fully remote company, so you'll need to be
  comfortable working with people in other time zones.  We're
  always expanding, but we can't currently hire in Alabama,
  Alaska, Delaware, District of Columbia, Hawaii, Iowa,
  Louisiana, Mississippi, Nebraska, New Mexico, Rhode Island,
  South Dakota, West Virginia, or Utah. We can only hire
  permanent US residents at this time.

  🚀 Opportunities to Grow

  We work hard on a culture built on trust, accountability,
  and inclusion — one where you can take on more, make a
  lasting impact, and have some fun doing it.

  🎩 Total Rewards

  - Remote-first since 2009
  - Flexible PTO and parental leave
  - 100% premium coverage of medical, dental, and vision for you
    and your family
  - 401(k) to invest in your future
  - $1,500 annual learning and development reimbursement
  - Travel to all-company meetings and team events
  - Generous home office allowance
  - TeamSnap swag when you start, plus a $50 store credit on
    every work anniversary
  - Monthly health and wellness reimbursement, and more
  - TeamSnap Total Rewards

  🏆  Award-winning Culture

  At TeamSnap, you're not a culture fit – you're a culture
  add. Read our Culture Playbook to see how we play, what we
  ask of each other, and what drives us.

  🧡 Inclusion and Diversity

  Creativity and innovation don't come from cookie-cutter
  teams. We hold ourselves accountable for building a culture
  where everyone is valued.

  Need any accommodations during the interview process? Just
  ask. We are an Equal Employment Opportunity Employer.

  AI Notice

  We may use AI tools to support parts of the hiring process,
  such as reviewing applications and resumes or assessing
  responses. These tools assist our recruitment team; they
  don't replace human judgment, and final hiring decisions are
  made by people. Contact us if you'd like more information
  about how your data is processed.
