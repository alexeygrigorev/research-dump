description: |
  About Dragonfly

  Dragonfly is a global investment firm focused on the future
  of money, markets, and intelligence. With origins in crypto
  and over $3.5 billion in assets under management, we invest
  in generational companies and protocols across the frontier
  of finance and technology. We're a team of seasoned VCs,
  technologists, and markets experts with deep roots in New
  York, Silicon Valley, and Asia. We've published some of the
  industry's most widely read research on stablecoins, market
  structure, decentralized finance, networks, protocol
  security, and increasingly, the intersection of finance and
  AI.

  This is not a listing for an internal role at Dragonfly.
  This posting connects you directly with one or more
  companies in our portfolio that are actively hiring Software
  Engineers.

  Our team partners with engineers across the entire stack,
  from crypto (blockchain, protocol, smart contracts) through
  backend, frontend, full-stack, mobile, infra, etc., and
  across various disciplines: data, security, machine
  learning, DevOps, etc. We work together to identify
  opportunities within our portfolio that are mutually aligned
  in terms of interests.

  What We’re Looking For:

  - Software engineering experience (any language, any stack)
  - Interest in crypto, blockchain, or open-source technologies
  - Bonus: prior experience at a startup or on a crypto-native
    project

  Even if you don't match every point above, we encourage you
  to apply. There may be other opportunities that fit your
  skill set.

  Process:

  - We’ll confidentially match you with portfolio companies
    aligned with your background, skill set, and interests
  - If mutual interest exists between you and a team, we’ll
    facilitate a warm introduction
  - If there isn’t a match today, we’ll keep you top of mind for
    future opportunities

  Compensation

  - Early Career: S$90,000–S$120,000
  - Mid: S$120,000–S$180,000
  - Senior: S$180,000–S$250,000
  - Staff/Leadership: S$250,000–S$300,000

  The compensation range reflects variation by seniority,
  location, and hiring company. Final compensation is
  confirmed with the specific hiring company.

  Submit your information below, and we’ll reach out if
  there’s a potential fit.
