  $286,200 - $326,700 for Sr. Staff Full-stack Engineer
  Riverwoods, IL: $286,200 - $326,700 for Sr. Staff Full-stack
  Engineer Candidates hired to work in other locations will be
  subject to the pay range associated with that location, and
  the actual annualized salary amount offered to any candidate
  at the time of hire will be reflected solely in the
  candidate's offer letter. This role is also eligible to earn
  performance based incentive compensation, which may include
  cash bonus(es) and/or long term incentives (LTI). Incentives
  could be discretionary or non discretionary depending on the
  plan. Capital One offers a comprehensive, competitive, and
  inclusive set of health, financial and other benefits that
  support your total well-being. Learn more at the Capital One
  Careers website . Eligibility varies based on full or part-
  time status, exempt or non-exempt status, and management
  level. This role is expected to accept applications for a
  minimum of 5 business days. No agencies please. Capital One
