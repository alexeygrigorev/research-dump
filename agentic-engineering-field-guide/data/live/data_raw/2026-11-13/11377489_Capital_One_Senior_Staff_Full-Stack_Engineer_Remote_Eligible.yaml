description: |
  Senior Staff Full-Stack Engineer (Remote Eligible) As a
  Senior Staff Engineer at Capital One, you will be part of a
  community of technical experts working to define the future
  of banking in the cloud. You will work alongside our
  talented team of developers, machine learning experts,
  product managers and people leaders. Our Senior Staff
  Engineers are leading experts in their domains, helping
  devise practical and reusable solutions to complex problems.
  You will drive innovation at multiple levels, helping
  optimize business outcomes while delivering strong
  technology solutions. At Capital One, we believe diversity
  of thought strengthens our ability to influence, collaborate
  and provide the most innovative solutions across
  organizational boundaries. You will promote a culture of
  engineering excellence and strike the right balance between
  lending expertise and providing an inclusive environment
  where the ideas of others can be heard and championed. You
  will lead the way in creating next-generation talent for
  Capital One Tech, mentoring engineers and actively
  recruiting to keep building our community. Senior Staff
  Engineers are expected to lead through technical
  contribution. You will operate as a trusted advisor for our
  key technologies, platforms and capability domains, creating
  clear and concise communications, code samples, blog posts
  and other materials to share knowledge both inside and
  outside the organization. You will specialize in a
  particular subject area, but your input and impact will be
  sought and expected throughout the organization. The Global
  Payment Network (GPN) Technology organization designs,
  builds, and operates the mission-critical systems and
  infrastructure that seamlessly power complex money movement
  across domestic and international rails. We build and
  operate a high-volume, low-latency, and highly resilient
  distributed ecosystem that is simultaneously secure,
  performant, accurate, and nimble. What You'll Do:

  - Articulate and evangelize a bold technical vision for your
    domain
  - Decompose complex problems into practical and operational
    solutions
  - Ensure the quality of technical design and implementation
  - Serve as an authoritative expert on non-functional system
    characteristics, such as performance, scalability and
    operability
  - Continue learning and injecting advanced technical knowledge
    into our community
  - Handle several projects simultaneously, balancing your time
    to maximize impact
  - Act as a role model and mentor within the tech community,
    helping to coach and strengthen the technical expertise
    and know-how of our engineering and product community
  - Drive modernization of monolithic systems into microservice
    architectures and event-driven platforms
  - Collaborate with senior engineering and architecture leaders
    to define long-term platform strategy and API standards
  - Serve as a force-multiplier for the team, balancing deep,
    hands-on technical contribution and innovation with
    mentoring and elevating the skills of peers and junior
    engineers.
  - Lead cross-divisional projects and impacts that promote
    technological best practices and enhancements

  Capital One is open to hiring a Remote Employee for this
  opportunity. Basic Qualifications:

  - Bachelor's Degree or higher in Computer Science or a related
    quantitative field (Statistics, Economics, Operations
    Research, Analytics, Mathematics, Engineering)
  - At least 9 years of experience in all of the following:
    - Software engineering and solution architecture
    - Enterprise architecture and design patterns
    - Cloud computing (AWS, Microsoft Azure, Google Cloud)
    - Data architecture

  Preferred Qualifications:

  - Master's Degree in Computer Science or Software Engineering
  - 12+ years of experience in all of the following:
    - Software engineering and solution architecture
    - Enterprise architecture and design patterns
    - Web technologies (JavaScript, TypeScript and SPA frameworks)
    - Designing and building distributed HPC and ML systems
    - Cloud computing (AWS, Microsoft Azure, Google Cloud)
    - Data architecture
  - 12+ years of professional experience coding in commonly used
    languages like Go, Java, JavaScript/TypeScript, Python,
    Rust, C#, Scala
  - 10+ years of experience with database and database
    management systems
  - 12+ years of professional experience in the full lifecycle
    of system development, from conception through
    architecture, implementation, testing, deployment and
    production support
  - 7+ years of experience with public cloud platforms (AWS,
    GCP, Azure), cloud-based productivity tools, or
    virtualization technologies
  - 12+ years of experience with Networking protocols and
    integration with third party distributed systems
  - 7+ years of experience mentoring senior engineers and
    driving professional development within technical teams
  - 3+ years of experience leading cross-domain architectural
    reviews or establishing coding and design standards
  - Expertise in the strategic application of agentic AI coding
    tools to solve systemic development challenges

  Capital One will consider sponsoring a new qualified
  applicant for employment authorization for this position.
  The minimum and maximum full-time annual salaries for this
  role are listed below, by location. Please note that this
  salary information is solely for candidates hired to perform
  work within one of these locations, and refers to the amount
  Capital One is willing to pay at the time of this posting.
  Salaries for part-time roles will be prorated based upon the
  agreed upon number of hours to be regularly worked. Remote
  (Regardless of Location): $286,200 - $326,700 for Sr. Staff
  Full-stack Engineer Chicago, IL: $286,200 - $326,700 for Sr.
