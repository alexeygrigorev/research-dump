description: |
  Electric Mind, formerly Intelliware, is a business and
  technology consulting leader in providing innovative,
  practical solutions driven by engineering excellence.

  Electric Mind is looking for Front-End Developers (React
  Native Mobile) to join our team! At Electric Mind you’ll
  have the opportunity to be part of a top-notch team and work
  on a wide range of consumer and enterprise mobile
  applications. We have virtual collaborative project rooms
  where you’ll work closely with a cross functional team
  including client subject matter experts, end users, and IT
  teams to deliver anything from proof-of-concept prototypes
  to bulletproof, long living, high volume production
  applications.



  The nature of our client project-based work allows teams the
  opportunity to work with a wide variety of technologies. We
  develop and deliver native iOS, native Android, and
  responsive web apps as well as consumer facing and
  enterprise large-scale applications. We’re looking for
  mobile specialists to join our team and provide their
  expertise!

  While working within a team in an Agile environment, you
  will be:

  - Design and build scalable, responsive web and mobile
    applications using React and React Native
  - Collaborate closely with cross-functional teams including
    designers, product managers, and backend developers
  - Estimate effort, break down tasks, and rapidly prototype
    features
  - Write clean, maintainable, and well-documented code within a
    shared codebase
  - Research, learn, and apply emerging technologies and
    development practices
  - Clarify requirements and iterate quickly based on feedback

  ‘Must Have’ Skills/Experience:

  - Proven experience building high-performance, content-rich
    web and mobile applications
  - Strong proficiency in JavaScript, with hands-on experience
    in both React (web) and React Native (mobile)
  - Solid understanding of HTML5, CSS3, and responsive design
    principles
  - Experience working with both browser-based and mobile
    platform constraints
  - Familiarity with component-based architecture and state
    management (e.g., Redux, Context API)
  - Strong attention to detail and commitment to writing well-
    crafted, accessible, and reusable code

  ‘Nice to Have’ Skills/Experience:

  - Familiarity with Agile methodologies (e.g., standups,
    sprints, TDD, CI/CD)
  - Experience integrating APIs and working with RESTful
    services
  - Knowledge of usability and user experience best practices
    across web and mobile
  - Exposure to mobile-specific tools, build systems, and
    deployment (e.g., Expo, Xcode, Android Studio)
  - Experience organizing scalable CSS and styling systems
    (e.g., BEM, styled-components, Tailwind CSS)

  For more info on Electric Mind, check out our Careers Page
  and Instagram.

  Electric Mind is committed to diversity in the workplace. We
  are an inclusive employer and welcome and encourage
  applications from all qualified candidates. Applicants’
  needs will be accommodated during our recruitment and
  selection process so please advise us if you require
  accommodation.
