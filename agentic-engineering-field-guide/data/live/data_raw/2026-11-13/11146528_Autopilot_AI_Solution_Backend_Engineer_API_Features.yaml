description: |
  Location: New York, NY (fully onsite 5 days)

  Please note: We are unable to sponsor or take over
  sponsorship of employment visas at this time. Candidates
  must be authorized to work in the U.S. without current or
  future visa sponsorship.

  About Us:

  Autopilot is a next-gen trading app and registered
  investment advisor (RIA) that makes professional-style
  investing accessible to everyone. Users can autopilot the
  portfolios of politicians, public figures, and top
  investors, or create and launch their own fund for others to
  follow. Built for transparency and ease of use, Autopilot
  reimagines how people invest, manage, and grow their money.

  Backed by notable investors such as Craft Ventures (Airbnb,
  Slack, Tesla), Nomad Ventures (Intro, Bezel), Balaji
  Ventures (Perplexity), Next Fund (7Signal), and TTV Capital
  (Bill, SmartAsset).

  Autopilot is ranked among the Top 30 Most Downloaded Finance
  Apps. With over 3M+ million downloads, $1.8B+ in assets
  under management (AUM), and a rapidly growing community of
  200k+ users, Autopilot is quickly becoming a leader in
  fintech.

  Role Overview:

  We’re seeking a Backend Engineer, API & Features to join our
  talented team as an early engineer. In this role, you’ll
  work closely with our founders and cross-functional teams to
  drive technical excellence, build scalable APIs and
  customer-facing backend features, and contribute directly to
  shaping the future of investing. This is a hands-on, highly
  impactful role in a fast-paced, engineering- and product-
  focused company.

  Responsibilities

  - Design, build, and maintain robust backend services and APIs
    that power our trading platform.
  - Lead the development of product features and our pilot
    portal, enabling seamless user interactions, data input,
    and persistence.
  - Design clear API contracts, data models, and business logic
    that scale as we grow.
  - Collaborate with frontend engineers, product managers, and
    cross-functional teams to deliver high-quality, user-
    centric solutions.
  - Drive impact in a hands-on capacity, owning features from
    technical design through testing, release, and iteration.

  Qualifications

  2-5 years of professional experience as a backend engineer,
  ideally in a fast-paced startup environment.

  - Proficiency in TypeScript for backend development (open to
    other languages).
  - Experience with Google Cloud Platform (GCP) or similar cloud
    infrastructure.
  - Expertise in API design, relational data modeling,
    distributed systems, and cloud-hosted applications.
  - Proven track record of building and scaling backend systems
    to support rapid growth.

  Nice-to-Haves:

  - Previous experience as a software engineer for trading,
    investing, or fintech platforms.
  - Previous experience working in hyper-growth start up.
  - Experience with integrations involving platforms like
    Robinhood, Stripe, Plaid, or similar platforms/apps.
  - Familiarity with AWS, GCP, or other cloud infrastructure.
  - Passion for building user-centered solutions and delivering
    impact.
  - A self-starter mentality with strong ownership and problem-
    solving skills.
  - Experience with some of these backend tech stacks: node.js,
    typescript, graphql, nest.js, gcp, google pubsub, postgres
    sql, etc.

  Benefits:

  - Generous UNLIMITED PTO (and we mean it!).
  - Mandated two-week holiday shutdown at the end of the year
    for Christmas and New Year’s + company holidays.
  - Autopilot covers 100% of premiums for employee and dependent
    benefits (health, dental, vision).
  - Equinox memberships.
  - Top-of-the-line equipment: laptops, external monitors,
    standing desks, etc.

  Equal Employment Opportunity:

  Autopilot is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, disability, veteran status, or any other
  protected characteristic under federal, state, or local law.

  Work Authorization:

  Candidates must be currently authorized to work in the
  United States. At this time, Autopilot is unable to sponsor
  employment visas or transfer existing visa sponsorships.
