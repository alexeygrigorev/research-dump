description: |
  What We Do

  Gecko Robotics is helping the world’s most important
  organizations ensure the availability, reliability, and
  sustainability of critical infrastructure. Gecko's complete
  and connected solutions combine wall-climbing robots,
  industry-leading sensors, and an AI-powered data platform to
  provide customers with a unique window into the current and
  future health of their physical assets. This enables real-
  time decision making to increase the efficiency and safety
  of operations, promote mission readiness, and protect the
  environment and civilization from the effects of
  infrastructure failure.

  Role at a Glance

  The Software Platform team’s purpose is to empower software
  engineers, reduce unnecessary blockers, and increase our
  velocity to create exceptional products. They do this by
  making software effortless to build, deploy, and manage.
  Using automation, shared libraries, and DevOps tools, they
  solve the common software problems so other engineers can
  focus on Gecko’s unique challenges.

  This role will specifically focus on leveling up our cloud
  architecture and automation, empowering engineers to manage
  and own their own deployments without needing extensive
  cloud expertise. We are looking for someone to become the
  primary owner of Gecko’s Cloud, supported by the rest of the
  team.

  What you will do

  Primary owner of Gecko’s Cloud, discovering and designing
  solutions for a well-architected cloud

  - Operational excellence (i.e. observability)
  - Security, privacy, and compliance
  - Reliability
  - Cost optimization
  - Performance optimization
  - Contribute significantly to the Software Platform team’s
    other work

  - Smooth, intuitive, automated CI/CD
  - Customer authentication
  - Permission management
  - DevOps Tool management and optimization
  - Optimizing the local development experience
  - Effective onboarding and internal training
  - Enable new business for Gecko by architecting solutions to
    achieve necessary certifications (e.g. DoD IL4/5)

  Technologies We Use

  We use a variety of technologies, but we primarily operate
  using Python, React, and Typescript with Google Cloud
  Platform (GCP) as our primary cloud provider. Our cloud
  architecture is primarily serverless, stateless, and event-
  driven. This is a non-exhaustive list and we are tech
  agnostic in our interview process, so we encourage you to
  apply regardless of your background.

  About YouRequired Skills

  - Previous experience in a DevOps role
  - Strong automation/scripting skills
  - Previous experience with one or more cloud platforms (GCP,
    AWS, Azure, etc.)
  - Previous experience with Terraform
  - Previous experience with cloud automation, CI/CD, and Docker
  - Proficiency with Linux and command line tools
  - Experience in developing and maintaining technical
    documentation and procedures
  - Strong communication skills, both verbal and written
  - Ability to work both independently and with cross-functional
    teams



  Preferred Skills

  - Python
  - Experience working with the US Government (DoD specifically)
  - GCP specific experience

  Who We Are

  At Gecko, our people are our greatest investment. In
  addition to competitive compensation packages, we offer
  company equity, 401(k) matching, gender-neutral parental
  leave, full medical, dental, and vision insurance, mental
  health, ongoing professional development, family planning
  assistance, and flexible paid time off.

  Gecko values collaboration, innovation, and partnership, and
  we believe we do our best work when we're together in
  person. We’re an office-first culture but understand that
  sometimes you may need to work from home. Many people are in
  the office five days a week, others need a bit more
  flexibility. Ultimately, we care about the outcomes we
  achieve - and creating a culture of autonomy and trust that
  enables that impact.

  Gecko is committed to creating a culture of inclusion and
  belonging, and we are proud to be an equal opportunity
  employer.  We believe it is our collective responsibility to
  uphold these values and encourage candidates from all
  backgrounds to join us in our mission to protect today’s
  infrastructure and give form to tomorrow’s. All qualified
  applicants will be treated with respect and receive equal
  consideration for employment without regard to race, color,
  creed, religion, sex, gender identity, sexual orientation,
  national origin, disability, uniform service, veteran
  status, age, or any other protected characteristic per
  federal, state, or local law. If you are passionate about
  what you do and want to use your talents to support our
  critical mission, we’d love to hear from you.
