description: |
  About the company

  Our client is an advanced manufacturing technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Join an early engineering group as a hands-on builder,
  designing and shipping internal software systems from
  scratch and owning them end-to-end. You will work closely
  with the people who use the software every day, gathering
  feedback and iterating quickly. The work focuses on
  operational software for a physical production environment,
  built so it can be reused across multiple sites.

  What you'll do

  - Build an enterprise resource planning system covering
    inventory, material tracking and workflow across a
    facility.

  - Develop monitoring software that exchanges low-latency data
    with industrial equipment.

  - Create quality management tools that track and improve
    precision part quality.

  - Work directly with floor operators to collect feedback and
    iterate quickly on the tools they use daily.

  - Architect systems so they can be replicated across multiple
    sites.

  Requirements

  What we're looking for

  - 2+ years of software engineering experience.

  - Track record of building and shipping real products at high-
    intensity technology companies or startups.

  - Computer science degree from a top-30 program.

  - Academic record of a 3.75+ GPA, or 4.0 GPA if from a program
    outside the top 30.

  - Strong Python proficiency.

  - Strong machine learning knowledge, including model fine-
    tuning.

  - High agency: able to take ambiguous problems and deliver
    solutions independently.

  - Able to work on-site full-time.

  - U.S. citizen or lawful permanent resident, eligible under
    export-control requirements.

  Bonus points

  - Background in industrial or hardware-adjacent business
    software.

  - Past work on products where you learned directly from the
    people using them.

  - Familiarity with geometry-heavy, design-to-production or
    robotics programming.

  Benefits

  Compensation and benefits

  - Base salary: USD 130,000 to 200,000 per year

  - Equity

  - Health, dental and vision coverage

  Location and work model

  - Austin, TX, United States

  - On-site, 5 days per week in office

  - Full-time
