description: |
  About Scrivy

  Scrivy is the growth desk for self-published authors. We
  give KDP authors one toolkit to grow their books on Amazon:
  keyword rank tracking, sales analytics, listing
  optimization, A+ Content design, category research, and
  reader review distribution. We're a small, remote-first team
  headquartered in the Boston area, building for authors who
  treat their books like a business.

  The role

  You'll ship product end to end: the data-heavy author
  dashboard, the public marketing site and free tools,
  billing, email, and the AI-assisted features that help
  authors write better listings. The codebase is a modern
  TypeScript monolith (Next.js, React, Tailwind, Prisma on
  PostgreSQL, deployed on Vercel) and you'll work across all
  of it. There's no ticket factory here. You'll take a problem
  from "authors keep asking for this" to designed, built,
  tested, and live, usually within days.

  You'll work directly with the founder and have real
  influence on what gets built, not just how.

  What you'll do

  - Design and ship features end to end across the dashboard,
    marketing site, and free tools
  - Own data models and API design for features that track and
    visualize book performance over time
  - Integrate and maintain third-party services: payments,
    transactional email, and LLM providers
  - Build AI-assisted product features with attention to cost,
    latency, and output quality
  - Keep the system healthy: testing, error monitoring,
    performance, and sensible observability
  - Review code, write clear technical docs, and raise the bar
    on engineering quality as the team grows

  What we're looking for

  - 5+ years of professional software engineering, with
    significant production experience in TypeScript and React
  - Strong relational database skills: schema design, query
    performance, and care around migrations
  - Product sense. You ask why a feature exists, propose simpler
    versions, and notice when a flow will confuse a non-
    technical user
  - You ship independently: scope a problem, make reasonable
    calls, and deliver without heavy process
  - Clear written communication. We're remote and most decisions
    live in writing
  - Care for correctness in the unglamorous places: billing,
    email, background jobs, third-party API failure modes

  Nice to have

  - Deep Next.js App Router experience (server components, route
    handlers, caching)
  - Stripe subscriptions and billing edge cases
  - Experience shipping LLM-backed features to production
  - Data visualization or charting-heavy UI work

  Compensation & benefits

  - $150,000–$190,000 base salary, depending on experience
  - Health, dental, and vision insurance
  - 401(k) plan
  - Flexible PTO plus company holidays
  - $1,000 home-office setup budget
  - An annual book stipend, naturally

  How we work

  We're fully remote across the US, with a home base in the
  Boston area. The team is small, communication is mostly
  written and async, and there's no layer between you and the
  founder. Work ships quickly and gets in front of real
  authors the same week.

  Equal opportunity

  Scrivy is an equal opportunity employer. We consider all
  qualified applicants without regard to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, age, disability, veteran status, or any other
  characteristic protected by law.

  How to apply

  Apply through the form on this page. No cover letter
  required; a link to something you built and shipped, with a
  sentence on the hardest decision in it, is more useful to us
  than a formal letter.
