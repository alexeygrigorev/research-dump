description: |
  As a Full Stack Developer/Testing Lead, serves as a Testing
  Lead for pre-production efforts. This role is responsible
  for defining, establishing, implementing, and continuously
  improving the program's testing and quality assurance
  processes, procedures, standards, and methodologies. The
  individual will develop the overall test strategy, implement
  testing frameworks and practices, and ensure consistent
  execution of front-end, back-end, integration, system, and
  user acceptance testing activities. Leveraging extensive
  full stack development experience, this role will help
  ensure comprehensive test coverage across application,
  service, and data layers while promoting quality throughout
  the software development lifecycle.

  *This position is contingent upon contract award. Award
  anticipated December 2026/January 2027.*

  Responsibilities:

  - Define, establish, and lead testing and quality assurance
    processes covering front-end, back-end, integration,
    system, and user acceptance testing.
  - Establish the overall test strategy, including objectives,
    methodologies, analysis, schedules, and success criteria;
    translate complex program requirements into testable
    objectives.
  - Design, develop, and maintain automated test frameworks and
    test suites to support continuous validation of
    application functionality and performance.
  - Develop and maintain integrations among the modern UI/UX
    front end, service layer, and modernized relational
    database.
  - Apply full stack development expertise across application,
    service, and data layers to support defect resolution,
    performance optimization, and test coverage.
  - Support system integration activities and resolve issues
    related to compatibility, interoperability, and multi-
    platform environments.
  - Collaborate with technical teams to ensure software
    solutions meet functional, performance, security, and
    quality requirements.
  - Analyze software defects, identify root causes, and
    implement corrective actions to improve application
    reliability and maintainability.
  - Perform feasibility analyses and technical assessments for
    future enhancements, technology improvements, and program
    objectives.
  - Develop training materials, technical documentation, test
    artifacts, and knowledge transfer products.
  - Support and participate in project reviews, stakeholder
    meetings, and other program activities; communicate risks
    in a timely manner with associated mitigation strategies.

  Qualifications:

  - Years of Experience: Five (5) years
  - Education Level: None. Desired BS in Computer Science,
    Information Systems, Engineering, IT, or closely related
    discipline, or equivalent additional relevant experience.
  - Clearance Requirements: Secret. Must possess IT-II Non-
    Critical Sensitive security clearance or Tier 3 (T3) at
    time of proposal submission.
  - Certification Requirements: Security+ or ability to obtain
    Security+ within first year of employment.

  Any other work-related qualifications needed for the role:

  - Extensive experience with DevSecOps and CI/CD pipelines.
  - Extensive experience setting up, defining, and leading
    testing/QA processes — front-end testing, back-end
    testing, and user acceptance testing.
  - Demonstrated experience as a full stack developer.
  - Experience refactoring monolithic solutions into micro-
    service structures operating within hardened containers.
  - Experience with configuration management and IaC tooling
    (e.g., TFS, Puppet, Chef, Ansible, Salt) and
    containerization technologies (e.g., Docker, OpenShift).
  - Experience in an Agile environment; knowledge of System
    Operations, Engineering, and DevOps integration.
  - Extensive experience working highly complex IT systems.
    Resume must demonstrate experience working legacy system
    upgrades, modernization, legacy system transition, data
    migration and/or system analysis and design. Priority
    given to personnel with demonstrated experience performing
    functional and technical solutions decomposition that
    enables solutions analysis and design and demonstrated
    experience implementing solutions with respect to modern
    database design and modern software languages within the
    federal Government, specifically within the DoD. AI/ML
    experience is preferred.
  - Travel to on-site meetings in Columbus, OH (Onsite once per
    month (average) up to 3 days.)

  About Us

  Diné Development Corporation (DDC) is a Navajo Nation–owned
  family of companies that provides government agencies and
  commercial organizations with high-quality IT, professional,
  environmental, and research and development services. DDC is
  dedicated to empowering the Navajo Nation and the
  communities we serve.

