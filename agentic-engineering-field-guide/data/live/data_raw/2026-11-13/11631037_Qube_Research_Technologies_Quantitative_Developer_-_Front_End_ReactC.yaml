description: |
  Qube Research & Technologies (QRT) is a global quantitative
  and systematic investment manager, operating in all liquid
  asset classes across the world. We are a technology and data
  driven group implementing a scientific approach to
  investing. Combining data, research, technology and trading
  expertise has shaped QRT’s collaborative mindset which
  enables us to solve the most complex challenges. QRT’s
  culture of innovation continuously drives our ambition to
  deliver high quality returns for our investors.

  You will work on internal applications and infrastructure
  that deliver data from core services and APIs to a multitude
  of users across Trading, Risk, Compliance, Regulatory
  Reporting, Operations and Support. The role focuses
  primarily on C# development, building scalable systems that
  provide accurate and timely data for trading and operational
  workflows, alongside contributing to user interfaces
  developed using React and TypeScript.

  Your future role within QRT

  - Design, develop and maintain C# applications and
    infrastructure supporting real time data delivery across
    the business
  - Build scalable services and data flows for trade entry,
    positions, order monitoring, execution, risk and PnL
    workflows
  - Optimise application architecture, memory management and
    resource utilisation to improve scalability and
    reliability
  - Investigate and resolve production issues involving data
    quality, latency, throughput and system performance
  - Take ownership of technical decisions and continuously
    improve existing systems in response to evolving business
    needs
  - Develop and enhance user interfaces using React and
    TypeScript in collaboration with other engineers
  - Collaborate with Trading, Risk and operational stakeholders
    to understand requirements and deliver practical technical
    solutions

  Your Present Skillset

  - Minimum three years of professional software engineering
    experience, with strong C# and .NET development skills
  - Experience designing, developing and supporting real time
    applications and data intensive production systems
  - Strong understanding of software engineering fundamentals,
    including data structures, memory allocation, garbage
    collection and concurrency
  - Experience investigating performance bottlenecks and
    implementing improvements to application reliability and
    efficiency
  - Ability to work autonomously, make informed architectural
    decisions and take ownership of complex technical problems
  - Experience with React, TypeScript, JavaScript, WPF, WinForms
    or similar user interface technologies is beneficial
  - Strong communication and collaboration skills, with the
    ability to work effectively with technical and business
    stakeholders
  - Familiarity with AWS, C++, real time messaging technologies,
    WebSockets or SignalR is advantageous
  - Exposure to financial markets, trading systems or risk
    management applications is beneficial

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
