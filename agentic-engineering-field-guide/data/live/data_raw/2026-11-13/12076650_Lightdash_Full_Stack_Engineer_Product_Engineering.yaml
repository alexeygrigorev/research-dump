description: |
  We're looking for a full-stack engineer to join our growing
  team.

  We value small and high performing teams and are looking for
  a full-time software engineer to join alongside the current
  core team. The responsibilities will go beyond just the
  technical stack: you'll help shape product direction and
  company strategy, and you'll have a lot of influence over
  how we build and how we work.

  Some things we're looking for:

  - You're a high-ownership builder. You take a fuzzy customer
    problem, decide what to build, and get it shipped.
  - You're AI-native. You build with coding agents and LLMs
    every day, you understand how they work under the hood,
    and you have real projects to show us.
  - You have product experience. You've built products that real
    users and customers depend on.
  - You appreciate good design (UI/UX) and are passionate about
    building products that people love to use.
  - You care about security but know how to build secure systems
    without slowing down. An interest in networking or
    security operations is a plus.
  - You're a fantastic communicator and happy to keep
    challenging existing ideas.
  - You're thoughtful about creating and maintaining a world-
    class engineering culture.

  What the job involves:

  - Build and own features from start to finish: plan, build,
    test, deploy, iterate.
  - Working directly with our users in the community (through
    Slack, X, Github), reviewing their issues and using the
    feedback to prioritise our work.
  - Having an ownership mindset: being comfortable with both
    responsibility and accountability.
  - Being comfortable when faced with a lot of ambiguity, both
    technically and organizationally.
  - Making good trade-off decisions between moving quickly and
    launching features versus optimising for engineering
    excellence. You're happy to ship something at ~80% and
    iterate.

  Location This is a hybrid role based in London.

  Research has shown that women are less likely than men to
  apply for a role if they don’t have experience in 100% of
  the requirements outlined in a job description. Please know
  that even if you don’t have experience in all the areas
  above, but think you could do a great job and are excited
  about shaping company culture, finding great people and
  building great teams, we’d love to hear from you!

  How we work at Lightdash

  - We build in public, by default. We’re an open source
    product, so having shared context is important so that
    people can contribute effectively to Lightdash. As a team,
    we also think that we make the best decisions when
    everyone has a lot of the same information. We don't
    oversell and under-deliver: we want the experience of
    using Lightdash to be as awesome as the experience we're
    selling.
  - We challenge problems, not people. We ask ourselves “why is
    this broken?” not “who is breaking this?”
  - We’re highly collaborative. We’re a group of people that are
    happy working independently, but love being part of a
    team. ****We not only work on problems as a team, but we
    also listen to the feedback from our community and our
    users. We invest in tools and processes that allow us to
    do this, even while fully remote.
  - We bias towards impact. We’d rather build something to 80%
    and get it in front of users so we can iterate on fast
    feedback than build something to 100% just to find out
    it’s not the right thing. We spend a lot of time thinking
    about how our work solves real user problems. We work on
    the highest impact problems even if they’re something a
    bit “out of your remit”.

  Our tech stack:

  While we don't expect you to have used all the components of
  our stack, it'd be great to know which parts of it you're
  familiar with:

  - Primary stack: Typescript, React, Node, SQL
  - Frameworks: express, react-hooks
  - Infrastructure: Docker, GCP

  💜 We believe that to build a product that works for a
  diverse group of people, we need a diverse team. So, we
  strongly encourage candidates of all different perspectives,
  experiences, backgrounds and identities to apply. We’re
  committed to hiring people regardless of race, religion,
  colour, national origin, sex, sexual orientation, gender
  identity, age or disability. And once you join us, we’re
  committed to building an inclusive, supportive place for you
  to do the best work of your career.
