description: |
  Role Summary

  We are seeking a highly skilled Senior Salesforce Developer
  to design, develop, and implement scalable, high-performance
  Salesforce solutions. This role requires deep technical
  expertise, strong architectural thinking, and leadership in
  delivering intelligent, data-driven capabilities leveraging
  Salesforce technologies, including Agentforce and Data
  Cloud.

  Key Responsibilities

  Core Development

  - Lead the design and development of complex Salesforce
    solutions
  - Build and maintain Apex classes, triggers, and SOQL/SOSL
    queries
  - Develop Lightning Web Components (LWC), Aura components, and
    Visualforce pages
  - Architect scalable automation using Flows and platform tools
  - Design and implement robust integrations (REST/SOAP APIs,
    middleware)
  - Optimize system performance, scalability, and reliability
  - Enforce development best practices, coding standards, and
    governance
  - Conduct code reviews and mentor junior developers
  - Translate business requirements into technical designs
  - Troubleshoot and resolve complex technical issues
  - Support CI/CD pipelines and release management

  AI & Agentforce Leadership

  - Lead design and implementation of Agentforce-powered
    solutions
  - Define AI agent architecture, behaviors, and orchestration
    patterns
  - Integrate Agentforce with Flows, Apex, Data Cloud, and
    external systems
  - Drive prompt design, agent optimization, and performance
    tuning
  - Establish AI governance, security, and compliance standards
  - Partner with stakeholders to identify AI-driven automation
    opportunities
  - Monitor, evaluate, and continuously improve AI agent
    effectiveness

  Data Cloud Responsibilities

  - Lead integration and activation strategies using Salesforce
    Data Cloud
  - Design data ingestion, identity resolution, and
    harmonization models
  - Implement calculated insights, segmentation, and real-time
    activation
  - Integrate Data Cloud with Sales Cloud, Service Cloud, and
    external platforms
  - Ensure data quality, compliance, privacy, and governance
  - Collaborate with data architects, analytics, and business
    teams
  - Optimize performance when working with large-scale datasets

  Required Qualifications

  - Bachelor’s degree in Computer Science, Engineering, or
    related field (or equivalent experience)
  - 7+ years of Salesforce development experience
  - Deep expertise in:
    - Apex, Triggers
    - Lightning Web Components (LWC)
    - SOQL/SOSL
    - Salesforce Flows & Automation
    - Salesforce APIs & Integrations
  - Strong understanding of Salesforce architecture & governor
    limits
  - Advanced knowledge of Salesforce security model
  - Experience with DevOps, Salesforce DX, CI/CD pipelines
  - Proven ability to lead technical initiatives

  AI / Agentforce Expertise

  - Hands-on experience with Agentforce / Salesforce AI
    capabilities
  - Understanding of AI-driven workflows & conversational design
  - Experience integrating AI agents into enterprise processes
  - Knowledge of AI governance, ethical AI, and data privacy

  Data Cloud Expertise

  - Experience implementing or supporting Salesforce Data Cloud
  - Understanding of data unification, identity resolution,
    segmentation
  - Experience with real-time activation & personalization use
    cases
  - Knowledge of data governance & compliance frameworks

  Preferred Qualifications

  - Salesforce Certifications relevant to the role and
    experience
  - Additional certifications (Application/System Architect) are
    a plus
  - Experience with:
    - Sales Cloud / Service Cloud / Experience Cloud
    - Enterprise-scale Salesforce implementations
    - Integration platforms
    - Event-driven architecture
  - Knowledge of design patterns & scalable solution frameworks

  Compensation at Pearson is influenced by factors including
  skill set, experience, and location.

  The full-time salary range for this role is $145,000 –
  $160,000.

  This position is eligible to participate in an annual
  incentive program. Information on benefits can be found
  here.

  Applications will be accepted through 20th November 2026.
  This window may be extended depending on business needs.

