description: |
  Sales | Paris, France | Remote, France | London, United
  Kingdom | Remote, UK Working at Atlassian Atlassians can
  choose where they work - whether in an office, from home, or
  a combination of the two. That way, Atlassians have more
  control over supporting their family, personal goals, and
  other priorities. We can hire people in any country where we
  have a legal entity. Atlassian is looking for a Senior
  Manager to lead the Solutions Engineering (SE) team within
  some of our Strategic market segments across EMEA. You will
  manage a partial EMEA remit. This leader will be vital in
  shaping a rapidly growing team and a critical function
  within the Atlassian sales team. Atlassian's Solutions
  Engineering team partners with our direct sales and channel
  sales teams to deliver technical expertise in the sales
  cycle and assist in qualifying and closing high-value
  strategic opportunities while shaping the customer's
  solutions purchasing decisions across the full Atlassian
  suite of products. The ideal candidate will possess a unique
  blend of technical expertise, strategic thinking, and
  leadership skills. As the Senior Manager of the EMEA
  Strategic organization, you will focus on building
  credibility and trust with the technical leaders in our
  customers & prospects by developing cross-functional
  strategies and solutions. Our team brings technical
  expertise, real-world experience, strong executive
  engagement skills, and an inspirational mindset to help our
  customers understand the opportunities of Atlassian's
  "System of Work" Platform. We act as technical leaders,
  assisting customers to solve their most complex business
  challenges through the value they realize from Atlassian
  solutions. We do this by leveraging best practices and
  industry standards to build customer trust, align with
  business outcomes, and architect best-in-class solutions.
  This is a remote position, as part of a distributed team. To
  help our teams work together effectively we're looking for
  someone based in France or the UK. Leadership & Team
  Development:

  - Lead, mentor, and inspire a growing team of Solutions
    Engineers, fostering a culture of excellence, innovation,
    and continuous learning in an AI-first sales environment.
  - Develop and implement training programs that enhance the
    team's technical depth, AI fluency, and consultative sales
    skills - with a focus on delivering live value
    demonstrations over traditional presentations.
  - Build and optimize scalable processes that support rapid
    growth, including structured DRI (Directly Responsible
    Individual) models that protect contributor focus and
    maximize field impact.
  - Provide thought leadership across Atlassian business units
    and stakeholders, helping shape the go-to-market model for
    the Strategic and Enterprise market segments.
  - Continue building team domain disciplines across AI and
    Intelligent Automation, Cloud Migration, IT Service
    Management, Enterprise Agile, DevOps, and Work Management
    - with particular emphasis on positioning Atlassian's AI
    capabilities in complex accounts.
  - Establish performance metrics and conduct regular
    evaluations, connecting individual excellence to team-
    level outcomes and measurable business impact.

  Strategic Planning & Execution:

  - Collaborate with senior leadership to define and execute a
    Solutions Engineering strategy aligned to the Strategic
    segment, with clear input into annual and quarterly
    planning cycles.
  - Define and operationalize "Metrics that Matter" to manage
    the business effectively - including AI-assisted deal
    velocity, SE influence on win rate, and POC-to-close
    conversion rates.
  - Champion field-led feedback loops as a strategic input to
    product and GTM prioritization, ensuring SE insights are
    systematically surfaced to Product and Marketing teams.
  - Identify and prioritize key market opportunities, with
    emphasis on cloud platform consolidation, AI adoption, and
    enterprise-wide Atlassian deployments.
  - Ensure proper alignment of SE resources across regions,
    account tiers, and solution domains - balancing reactive
    deal support with proactive pipeline-building activity.

  Customer Engagement & Solution Design:

  - Lead high-impact sales pursuits across EMEA engaging
    Executive Architects, Directors, VPs, and C-suite
    stakeholders throughout the full customer lifecycle.
  - Provide technical leadership during discovery, solution
    design, executive briefings, demonstrations, and POC
    engagements - with an emphasis on co-creating outcomes
    with the customer.
  - Drive AI-led demo and value engineering capabilities within
    the team, enabling SEs to deliver personalized, data-
    driven presentations that resonate with executive buyers.
  - Partner with Marketing to design effective pipeline
    generation activities in the Strategic segment, including
    account-based plays and new routes to market.
  - Leverage customer success stories and Voice of Customer
    (VOC) insights as proof points in active sales motions,
    connecting real-world outcomes to prospect priorities.
  - Demonstrate strong executive alignment with key Partner and
    Channel resources, building joint engagement models for
    strategic accounts.

  Cross-Functional Collaboration:

  - Serve as the primary liaison between Solutions Engineering
    and Product, Marketing, R&D, and Sales Enablement -
    translating field signals into actionable product and
    roadmap input.
  - Maintain a rigorous and structured feedback loop with
    Product teams, delivering prioritized field perspectives
    on roadmap investment through a repeatable, DRI-
    accountable model.
  - Partner with Sales Enablement to evolve SE-specific
    training, certification paths, and role readiness
    frameworks that keep pace with a rapidly changing product
    and competitive landscape.
  - Drive the creation of high-quality technical collateral -
    including whitepapers, solution briefs, AI use case
    narratives, and customer case studies - in partnership
    with Product Marketing.
  - Collaborate on event strategy and content programming to
    amplify SE expertise and customer success narratives at
    scale, including flagship events and customer summits.

  Market & Industry Expertise:

  - Stay current on industry trends, competitive dynamics, and
    emerging technologies - with particular depth in
    enterprise AI platforms, ITSM modernization, and agile-at-
    scale transformations.
  - Understand and navigate regional market nuances across the
    global customer base, including cultural and
    organizational decision-making differences that influence
    enterprise buying behavior.
  - Represent Atlassian at industry conferences, customer
    events, and advisory forums - contributing thought
    leadership on AI adoption, team productivity, and
    enterprise transformation.
  - Develop and maintain strong relationships with key industry
    analysts, partners, and customer stakeholders to build
    Atlassian's strategic presence in the market.

  The SE team's expertise is critical to developing solution-
  based opportunities in our high-growth business and shaping
  the enablement and go-to-market perspective around those
  solutions. You will partner with a diverse set of
  stakeholders - direct sales, channel sales, field marketing,
  product marketing, and sales enablement - to define and
  drive areas of joint execution. Given the broad demand for
  your team's time and expertise, you will need to negotiate
  prioritization to ensure SE involvement is deployed where it
  creates the greatest business impact. At Atlassian, we
  strive to design equitable, explainable, and competitive
  compensation programs. We follow consistent hiring practices
  and account for each candidate's skills, knowledge, and
  experience when setting base pay within the range. This role
  may also be eligible for benefits, bonuses, commissions, and
  equity.

  - Proven experience in sales engineering in a leadership role
    within a global, high-growth technology
  - Bachelor's degree in Engineering, Computer Science, or a
    related field; MBA or advanced technical degree preferred.
  - Successfully led diverse teams to reach challenging goals
    and can leverage organizational networks to get things
    done. Be Hungry and Humble.
  - Passion and energy for building business relationships, and
    is accustomed to driving the simplification of complex
    concepts into compelling customer proposals
  - Drive for results using out-of-the-box innovative thinkin,g
    together with excellent problem-solving skills
  - The ability to multiply the effect of a team through
    situational leadership, constant challenge, and a team-
    first mindset
  - Strong written and oral communication skills and the ability
    to manage your time effectively are critical.
  - Ideally, we're looking for someone with a prior background
    in solutions selling to Software Development or IT
    c-suite/SVPs/VP leadership and who understands the
    ecosystem of potential integrations and partnerships we
    would work with.
  - Experience managing distributed remote teams is a plus.
  - You want to be part of something big. You are up for the
    challenge of running a team within a fast-growing
    organization and balancing the team's needs with the
    business's needs.
  - You enjoy mentoring and inspiring your team with a growth
    mindset.
  - Fluent in French and English

  Compensation At Atlassian, we strive to design equitable,
  explainable, and competitive compensation programs. We
  follow consistent hiring practices and account for each
  candidate's skills, knowledge, and experience when setting
  base pay within the range. This role may also be eligible
  for benefits, bonuses, commissions, and equity. Benefits &
  Perks Atlassian offers a wide range of perks and benefits
  designed to support you, your family and to help you engage
  with your local community. Our offerings include health and
