description: |
  161 Bay Street (93021), Canada, Toronto,Toronto,
  Ontario,Senior Staff Software Engineer - Capital One Travel
  Tech - Full-stack About Capital One Canada. For 30 years,
  we've been on a mission to change banking for good. We
  challenge the traditional bank stereotype by integrating
  machine learning, conversational AI and design thinking into
  our core operations. We're a bank a tech company would
  build, where your work directly shapes innovative solutions
  that impact millions of Canadians. We're driven by fearless
  curiosity, bold innovation, and a collective of authentic
  people working together to redefine what's possible.
  Technology isn't just part of our strategy, it is our
  strategy . Everything we do serves our vision and the
  creation of what's next. About the Team If you're looking
  for challenging work with real impact, a team that cares
  deeply about the code they ship, and a product that real
  people use when they're planning their next trip - come
  build the next generation of the travel portal with us. From
  the moment a traveler starts planning a trip, to browsing
  options, comparing rates, and finally hitting that booking
  button - your code is there for all of it. You're not
  working on one small corner of the product. You're touching
  the whole journey. We are solving real customer problems: we
  need all hotels at the right price with accurate
  information, and we need to make sure the portal is the best
  place to book your travel. About the Role As a Senior Staff
  Engineer at Capital One Software Studio, you will
  orchestrate the creation of technology solutions that align
  with our business goals. Your day begins with a review of
  ongoing solution designs that are in different phases of
  their life cycles. You'll spend your time designing scalable
  and secure solution architectures, evaluating new
  technologies, and overseeing the development of high-level
  designs. You will engage in dynamic collaboration with
  cross-functional teams to advocate for best practices in
  architecture and design. For the new projects, you will
  closely work with your business partners to create sound
  business architectures. By day's end, you will have
  contributed to solutions and strategies that will shape our
  future, ensuring that all solutions are not only innovative
  but also follow our architectural and security standards.
  Your Responsibilities:

  - Design and implement architectural solutions that align with
    Capital One Canada's business goals and adhere to our
    architectural framework.
  - Develop and maintain a comprehensive catalog of technical
    and business capabilities, ensuring alignment with
    strategic objectives.
  - Lead the creation and review of Architectural Decision
    Records (ADRs) and High-Level Design (HLD) documents.
  - Actively participate in governance forums such as the
    Architectural Review Board ensuring compliance with
    internal and external standards.
  - Collaborate with stakeholders across all levels to promote
    technology strategies that deliver better business value
    and innovation.
  - Mentor and lead teams in the adoption of architectural best
    practices and continuous improvement initiatives.

  Basic Requirements:

  - At least 8 years of experience in Software Engineering and
    Systems Architecture or Technology Solution design
  - At least 2 years of experience creating solutions
    architectures in a public cloud (AWS, Microsoft Azure,
    Google Cloud)

  Preferred Qualifications

  - Bachelor's, Master's or Diploma in Computer Science,
    Software Engineering, Information Technology or in related
    field
  - Certification in TOGAF, AWS, or other relevant architectural
    frameworks.
  - 3+ years of experience as a Solutions Architect in
    large/complex organizations
  - 10+ years of experience in software engineering
  - 8+ years of experience architecting, designing, and/or
    delivering scalable and decoupled systems in a heavily
    regulated technology environment
  - 3+ years of experience working with internal and external
    business clients
  - 2+ years of experience with AWS concepts and implementations
  - Experience to engaging, influencing and driving initiatives
    by partnering with technology executives
  - Experience mentoring software engineers or architects
  - Experience in a regulated environment (HIPAA, PCI, Privacy,
    etc)
  - Ability to communicate at all levels in the organizations
    with required technical depth and breadth
  - AWS or equivalent certifications (Cloud Practitioner,
    Solution Architect-Associate)

  Working at Capital One. You'll be empowered to take end-to-
  end ownership of your work and your career, backed by a
  high-performance, hybrid culture and holistic suite of
  benefits designed to support your whole self.

  - Take ownership of your own potential: Whether you're looking
    to upskill, pivot into new business areas, or master your
    craft, you'll have access to tools and mentorship to reach
    your potential and define your career trajectory.
  - Find your rhythm: We believe trust fosters the flexibility
    and autonomy required to balance personal needs with a
    focus on high performance. We support a hybrid model -
    with 3 days in the office per week - that gives room for
    both collaboration and personal commitments.
  - Benefits built for your life: We take a holistic approach to
    well-being, providing support for you and those who are
    most important to you. This includes: full coverage for
    spouses, domestic partners and dependents, a one-time Work
    From Home allowance to build your comfortable workspace,
    up to $3,000 in mental health coverage and up to $5,000 in
    annual tuition subsidies.

  You'll find that Capital One is committed to helping you
  thrive and evolve every step of the way.  This posting is
  for an existing vacancy. The expected annual salary range
  for this position is $202,400 - $231,000. This role is also
  eligible to earn performance based incentive compensation,
  which may include cash bonus(es). Incentives could be
  discretionary or non discretionary depending on the plan. We
  embrace the responsible use of artificial intelligence (AI)
  to enhance the candidate experience and streamline our
  recruitment processes. However, no hiring decisions are made
  using AI as every hiring decision is made by our hiring
  managers, business interviewers, and recruitment
  professionals. Our teams are equipped with training that
  empowers them to use AI responsibly. Capital One Canada is
  an equal opportunity employer committed to fostering a
  diverse and inclusive work environment. We consider all
  qualified applicants and will meet the needs of those
  requiring reasonable accommodations. If you have visited our
  website in search of information on employment opportunities
  or to apply for a position, and you require an
  accommodation, please contact Capital One Recruiting at
  1-800-304-9102 or via email at ARCanada@capitalone.com . All
  information you provide will be kept confidential and will
  be used only to the extent required to provide needed
  reasonable accommodations. For technical support or
  questions about Capital One's recruiting process, please
  send an email to Careers@capitalone.com Capital One does not
  provide, endorse nor guarantee and is not liable for third-
  party products, services, educational tools or other
  information available through this site. Capital One
  Financial is made up of several different entities. Please
  note that any position posted in Canada is for Capital One
  Canada, any position posted in the United Kingdom is for
  Capital One Europe and any position posted in the
  Philippines is for Capital One Philippines Service Corp.
  (COPSSC).
