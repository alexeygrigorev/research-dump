description: |
  The Role

  As a Product Engineer, you’ll play a pivotal role in shaping
  the trajectory of product development, while ensuring we
  stay user focused. As an early member of the team, you’ll
  own decision making and problem solving on some of our most
  challenging problems in Healthcare and HR Tech.

  You will own features or product areas end to end - from
  specification, to delivery, QA, customer feedback etc. If
  you are someone who likes to work with an early stage
  startup that is building a SAAS product from scratch and
  solving customers' challenges, this is an amazing
  opportunity.

  What you’ll do:

  - Own, build, scale, and evolve features across product lines
    used by HRs, therapists, and employees. Work directly with
    design and product to deliver end to end user experiences.
  - Lead architecture design and set standards for future
    growth: Research and identify industry best practices and
    state-of-the-art tools to leverage.
  - Influence the features and direction of the platform with
    your own ideas and proactively identify opportunities to
    improve business processes and customer satisfaction.

  Who You Are:

  - You resonate with our mission to promote greater mental
    wellbeing in workplaces.
  - You have 3+ years of experience as a full stack developer.
  - You're a generalist who is willing to contribute across the
    stack, both frontend and backend.
  - Experience with Python and React/ Next.js.
  - Entrepreneurial spirit. You have worked in a startup or on
    your own side projects or built products from the ground
    up.
  - Product thinker. You want to build through a user-centric
    lens and be involved not only in engineering decisions but
    product and design decisions as well.
  - You have strong written communication skills.
  - You have worked in a fast-paced environment.

  Bonus if you have:

  - Experience in building dashboard products.
  - Good exposure to security best practices, bonus: experience
    working with security constraints such as HIPAA.
  - Past founder or strong entrepreneurial background.

  Benefits:

  - The chance to drive impact within the mental healthcare
    landscape in Asia and Pacific region.
  - The opportunity to help build a rapidly scaling start-up
    organization by taking strong ownership of your work,
    mentorship, and our unbounded leadership opportunities.
  - Enjoy a low-bureaucracy environment, minimal meetings, and
    an asynchronous communications culture.
  - Competitive compensation.

  About the interview

  Interview Process:

  - Technical Interview: Deep dive into technical skills and
    problem-solving capabilities. (60-min video call)
  - Technical Case: Tackle a real-world problem related to our
    current technical challenges. (Take home Assignment)
  - Interview with Co-founders: Discuss vision, motivation, and
    fit. (45-min video call)
  - Offer
