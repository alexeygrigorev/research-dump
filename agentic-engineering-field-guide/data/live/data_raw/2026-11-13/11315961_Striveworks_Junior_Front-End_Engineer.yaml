  origin, political affiliation, sexual orientation, marital
  status, disability, genetic information, age, membership in
  an employee organization, retaliation, parental status,
  military service, or other non-merit factors. Striveworks
  will not tolerate discrimination or harassment of any kind.

  If you require assistance or a reasonable accommodation in
  the application process, please contact People Operations at
  hr@striveworks.us.

  In compliance with federal law, all persons hired will be
  required to verify their identity and eligibility to work in
  the United States and to complete an employment eligibility
  verification form upon hire.

  Striveworks is a participating employer in the E-Verify
  program.
