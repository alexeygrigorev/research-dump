description: |
  * This is a remote position open to candidates in Europe.
  For those based in the Czech Republic, a hybrid work model
  is also available.

  * The position is for B2B/freelancing cooperation and it is
  a long-term contract engagement

  ABOUT US

  We are a leading product development partner specializing in
  custom web and mobile application development. With Silicon
  Valley founders and top-tier European tech talent, we
  operate from Prague and have successfully delivered over 65
  software products for early-stage startups, scaleups, and
  global enterprises.

  - Founded in 2016
  - Headquartered in Prague
  - Built and launched 65+ products
  - 90+ team members
  - Driving product innovation for leading US companies

  At OAK’S LAB, we take an AI-first approach, utilizing AI on
  almost every project. From streamlining design and testing
  workflows to enhancing developer productivity, our teams
  leverage tools such as Figma MCP Server, Playwright MCP
  Server, and Cursor, and we’re actively experimenting with
  remote AI agents to push the boundaries of what’s possible
  in product development.

  OUR PROJECTS

  Here are a few from our portfolio:

  - Nasdaq Private Market (Series C, Finance)-
    nasdaqprivatemarket.com
  - Blackpoint Cyber (Series B, Cybersecurity) -
    blackpointcyber.com
  - OpenLoop (Series A, Healthcare) - openloophealth.com

  THE ROLE

  Our product development team is looking for a Senior
  Fullstack Engineer who combines creative thinking,
  exceptional problem-solving skills, and technical expertise
  to build outstanding web and mobile applications for our
  clients.

  You’ll play a key part in building and scaling impactful
  digital products from the ground up. You’ll work as part of
  a dedicated product team alongside a Tech Lead, Product
  Manager, Designer, and a talented group of engineers,
  driving the success of innovative companies. Your role will
  involve everything from participating in high-level
  technical discussions to engineering and deploying complex
  features, giving you full ownership across the entire
  product development lifecycle.

  For ambitious engineers, we’ll provide the time, mentorship,
  and opportunities to step into a leadership role, where you
  can guide and mentor your own team over the longer term.
  You’ll also have the opportunity to join our internal AI
  Guild, a community where engineers share insights,
  experiment with cutting-edge AI tools, and learn from one
  another.

  RESPONSIBILITIES

  - Design, develop, and version high-quality web and mobile
    applications
  - Collaborate with product teams to understand feature
    requirements and translate them into technical solutions
  - Be accountable for an area of the application, its delivery,
    production-level quality, and its effective presentation
    to stakeholders
  - Understand the product and user needs to prioritize business
    value and functionality
  - Ensure the application meets all requirements of security
    and scalability
  - Write clean and scalable code
  - Engage in code reviews, provide constructive feedback,
    mentoring less senior engineers

  SKILLS & REQUIREMENTS

  - 5+ years of experience in building web solutions using Node
    and React
  - Experienced with Javascript/Typescript
  - Focus on code quality
  - Desire to learn new technologies and apply AI in your
    workflow
  - Strong analytical and problem-solving skills
  - Proactiveness and the capability to make a difference
  - Driven, hard work ethic, showing commitment
  - Ability to work effectively in a team environment, following
    Agile methodologies
  - Proficient in English
  - Experience with Python is beneficial but not essential

  OUR TECH STACK

  - Typescript
  - Node.js
  - React + Next.js
  - React Native
  - GraphQL, tRPC
  - Material UI
  - Playwright
  - PostgreSQL
  - Google Cloud Platform
  - Python
  - HuggingFace API, LLM APIs (eg OpenAI API), Langchain, Vector
    Databases for RAG

