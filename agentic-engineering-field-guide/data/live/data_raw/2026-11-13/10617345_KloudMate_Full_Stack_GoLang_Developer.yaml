description: |
  Full Stack GoLang Developer About KloudMate

  KloudMate is an Observability platform for Developers and
  Businesses, building applications on distributed systems.

  KloudMate detects performance bottlenecks in modern
  distributed applications, identifies errors and boosts
  developer productivity by reducing Mean-Time-To Resolve
  (MTTR), helping businesses improve application performance,
  shrink operating costs, increase customer satisfaction and
  grow revenues.

  The Role

  This is a remote-first, full-time product engineering
  position with a core focus on building KloudMate platform.
  You'll be responsible in building, maintaining and deploying
  extremely high-volume, fault-tolerant, scalable distributed
  system that uses technologies such as using OpenTelemetry,
  Golang, Clickhouse, Kafka, Redis, React, AWS/Azure,
  Kubernetes, docker etc.

  Responsibilities

  - Play a leading role in architecting, designing, and
    developing and maintaining complex OpenTelemetry
    observability platform.
  - Be self-motivated and thrive in a fast-paced environment
    with minimal supervision.
  - Demonstrate a strong desire to learn and continuously
    improve your skills.
  - Performs the evaluation of new platforms tools and
    technologies.

  Required Skills

  - Minimum 3 years of experience in Golang, familiarity with
    concurrency in Go, using goroutines and channels for
    effective concurrent and parallel processing, gRPC is
    must.
  - Experience with relational and OLTP databases, including
    PostgreSQL, Clickhouse
  - Experience working with queues and stream processing using
    Kafka & Redis.
  - Experience with observability practices and OpenTelemtry is
    preferred.
  - Experience with container and container orchestration
    technologies, such as Docker and Kubernetes.
  - Strong analytical, problem-solving/quantitative skills.

  What We Offer

  Compensation: Competitive salary in the range of 8 to 16 LPA
  CTC annually. Location: Remote-first with the flexibility to
  work from anywhere. We have offices in Bangalore, India, and
  occasional visits are encouraged to foster team connections.
  We also host annual off-sites at beautiful locations
  (beaches or mountains!).

  Benefits:

  - Comprehensive health insurance.
  - Generous PTO (20 days) + National/Regional holidays +
    Compensation Day off.
  - Remote-friendly work environment.
  - Professional development opportunities.
  - Fun and engaging company events.
  - Strong emphasis on work-life balance (including celebrating
    birthdays and anniversaries!).
  - Opportunity to work from home.

  Cutting-edge Technologies: Work with the latest and greatest
  technologies on a brand new codebase.

  Growth and Impact: As an early-stage employee, you'll have
  significant ownership and the chance to make a real
  difference.

  Healthy Work Culture: We value a 40-hour workweek and
  asynchronous communication.

  Investment Day: Similar to Google's 20% time, we encourage
  employees to dedicate Fridays to explore and develop ideas
  that benefit KloudMate.

  Hiring Process

  - 30-minute general interview to get to know you and your
    experience.
  - A take-home coding exercise or a 2-hour live coding session
    with discussion.
  - A 30-minute chat with our founders to discuss the vision and
    your potential fit.

  Ready to join a passionate team and build the future of
  cloud observability? We look forward to hearing from you!
