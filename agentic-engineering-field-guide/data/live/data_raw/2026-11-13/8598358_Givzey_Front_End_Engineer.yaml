description: |
  About Givzey

  We’re a fast-growing tech startup on a mission to
  revolutionize fundraising through the power of AI and
  machine learning. Our autonomous fundraising platform
  empowers nonprofit organizations, schools, and mission-
  driven teams to raise more money with less effort—turning
  data into action and intention into impact.

  As we scale our product and user base, we're looking for a
  Front End Engineer who thrives in fast-paced environments
  and is passionate about building elegant, responsive, and
  intuitive user interfaces.

  What You’ll Do

  - Own the front-end development of our web applications—from
    design handoff to polished, performant code
  - Collaborate with product designers, back-end engineers, and
    AI/ML teams to deliver seamless user experiences
  - Build and maintain reusable components and front-end
    infrastructure using modern frameworks (React, TypeScript,
    Tailwind, etc.)
  - Optimize applications for maximum speed, responsiveness, and
    accessibility
  - Help shape the technical direction of the product with your
    input and expertise
  - Continuously improve our UI/UX through A/B testing, user
    feedback, and analytics

  What We’re Looking For

  - US Citizen

  - 3+ years of professional front-end development experience
  - Strong proficiency in JavaScript/TypeScript and React
    (Next.js is a bonus), apis, backend, python - a big plus
  - Experience with modern CSS frameworks (Tailwind, SCSS, or
    similar)
  - Solid understanding of responsive design, performance
    optimization, and cross-browser compatibility
  - Familiarity with API integration (REST/GraphQL)
  - A collaborative mindset with a passion for clean code and
    scalable architecture
  - Experience working in a startup or fast-paced environment is
    a big plus
  - Bonus: Experience with data visualization (e.g., D3.js,
    Recharts), AI-powered UX, or personalization features

  Nice-to-Have

  - Knowledge of accessibility best practices (WCAG)
  - Familiarity with CI/CD and front-end testing (Jest, Cypress)
  - An eye for design or experience working closely with
    product/design teams

  Why Join Us?

  - Be part of a mission-driven team redefining the future of
    fundraising
  - Work with cutting-edge AI/ML technologies
  - Competitive salary, great benefits and culture
  - A collaborative team that values creativity, ownership, and
    growth
