description: |
  Company Description

  We’re a close-knit team comprised of creative, strategic,
  and technical minds -- meaning you’ll collaborate with all
  departments to make our client campaigns a success. We take
  our work seriously, but not ourselves. We pride ourselves on
  finding and building new solutions to meet our clients
  needs. And we do it with a dash of flair!

  Job Description

  Alipes is seeking a contractor for front-end development
  support for work on two national campaigns. The term of the
  contract would be a minimum of six weeks of daily on-site
  support, with an opportunity for longer-term engagement.
  Potential for remote support if qualifications warrant.

  Key Responsibilities

  - Working with our strategy and design teams to build,
    maintain, and enhance modern web applications and
    traditional web sites, including building fully responsive
    sites from wireframes
  - Developing special interactive features of websites using
    standards-compliant technologies

  Qualifications

  Required Qualifications

  - Expertise in HTML, JavaScript, and CSS3
  - Proficiency in implementing responsive designs
  - Proficiency in jQuery
  - Intermediate or better PHP skills
  - Experience with a CSS-preprocessor, preferably Compass/SCSS
  - Experience with a major MV* JavaScript framework, preferably
    Backbone
  - Familiarity with data manipulation and some knowledge of SQL
    and WordPress
  - Familiarity with Git
  - Working knowledge of Photoshop and Illustrator

  Nice to have

  - Understanding and familiarity with CrownPeak

  Additional Information

  Compensation

  - This is a contract position. Salary will be commensurate
    with experience and qualifications. Alipes is an equal
    opportunity employer.

  Your application should include:

  - Resume
  - Cover letter indicating your interest
  - Links to relevant work along with a description of your
    involvement
