description: |
  Software Engineer

  Blossom Health exists to solve the mental health epidemic in
  America by partnering with psychiatrists to expand access to
  affordable, timely, clinically effective mental healthcare.
  Our AI-native care platform is loved by hundreds of
  clinicians and tens of thousands of patients.

  We’re a Series A company with $20M+ raised from Headline,
  Village Global, and the founders of General Catalyst,
  Flatiron Health, Sword Health, Fay, Elemy, Zip, Blank
  Street, Assured, Bridge, Birches Health, and Enzo Health.

  The Role:

  We're looking for a Software Engineer to build and scale the
  products and technology powering the future of psychiatric
  care.

  You'll work closely with our Head of Engineering and a
  small, highly talented team to develop the core systems
  behind Blossom's AI-native platform, building everything
  from clinician-facing applications and patient experiences
  to backend infrastructure and intelligent automation.

  This isn't a role where you'll be handed tickets and asked
  to write code. You'll own meaningful engineering projects
  end-to-end, contribute to product and architectural
  decisions, and build technology that directly improves how
  thousands of patients access mental healthcare.

  We're looking for someone with strong software engineering
  fundamentals, exceptional problem-solving ability, and the
  ambition to build high-quality products in a fast-moving
  startup environment.

  Why You Should Work Here:

  - 🚀 Be early in a hyper-growth startup: Join a foundational
    engineering team and help build the products, systems, and
    infrastructure behind Blossom's next stage of growth.
  - Build products with real-world impact: Your code will
    directly improve the experience of thousands of clinicians
    and patients, making mental healthcare more accessible and
    efficient.
  - 🤝 High trust and autonomy: Own meaningful engineering
    projects from day one, influence product decisions, and
    have the freedom to turn ideas into production-ready
    software.
  - 🧠 Talent-dense engineering team: Work alongside exceptional
    engineers from Meta, Apple, and AWS who bring high
    technical standards, intellectual curiosity, and a shared
    ambition to build something consequential.
  - Move with speed and purpose: Build and ship quickly, solve
    challenging problems, and see your work make a tangible
    difference in a rapidly scaling company.

  What You'll Do:

  - Build and ship core product experiences: Develop features
    and applications used directly by clinicians, patients,
    and internal teams across Blossom's platform.
  - Design scalable backend systems: Build and maintain APIs,
    services, and infrastructure that support our rapidly
    growing clinical operations.
  - Develop AI-native functionality: Integrate intelligent
    automation, LLM-powered capabilities, and AI-driven
    workflows into real-world healthcare products.
  - Own engineering projects end-to-end: Take features from
    initial problem definition and technical design through
    development, testing, deployment, and iteration.
  - Solve complex operational challenges: Build systems
    supporting clinician scheduling, patient workflows,
    insurance, billing, and other critical healthcare
    processes.
  - Improve system performance and reliability: Identify
    bottlenecks, optimize application performance, and ensure
    our platform remains scalable, secure, and dependable.
  - Collaborate across engineering and product: Work directly
    with engineers, clinicians, and business stakeholders to
    translate complex problems into intuitive, high-quality
    software.
  - Shape our engineering foundation: Contribute to
    architectural decisions, development practices, and
    technical standards as our team and platform scale.

  You'll Be a Good Fit If:

  - You have 2+ years of professional software engineering
    experience, ideally at a highly technical engineering
    organization or high-growth, venture-backed startup.
  - You have strong computer science fundamentals, including
    data structures, algorithms, system design, and software
    architecture.
  - You're highly proficient in Python and/or TypeScript, with
    experience building and shipping production software.
  - You have experience developing backend services, APIs, full-
    stack applications, or distributed systems.
  - You understand the fundamentals of scalable software design,
    databases, performance optimization, and system
    reliability.
  - You've demonstrated the ability to independently own
    engineering projects and deliver high-quality software
    from concept to production.
  - You have strong product instincts and care about building
    intuitive, reliable experiences that solve real user
    problems.
  - You're comfortable working across the stack, learning new
    technologies, and tackling unfamiliar technical
    challenges.
  - You thrive in fast-moving environments where priorities
    evolve quickly and engineers are expected to take
    initiative.
  - You have a bachelor's degree in Computer Science or a
    related technical field, or equivalent practical
    experience.
  - You're authorized to work in the United States.
  - You're excited to work in-person in New York City, 5 days a
    week.

  Bonus: You've worked at a top-tier technology company or
  high-growth, venture-backed startup, with experience
  building products from 0→1, scaling backend systems, or
  integrating AI capabilities into production applications.

  What We're Looking For:

  - Highly motivated, ambitious, and capable: You want to tackle
    meaningful engineering challenges and hold yourself to an
    exceptionally high bar.
  - Ownership mindset: You take responsibility for outcomes, not
    just assigned tasks, and approach your work with a
    founder's mentality.
  - High velocity and high excellence: You move quickly, write
    high-quality code, and take pride in consistently shipping
    great products.
  - Technically rigorous: You think critically about system
    design, performance, maintainability, and the long-term
    implications of engineering decisions.
  - Product-minded: You care about the people using your
    software and understand how technical decisions influence
    the overall user experience.
  - An explorer: You're comfortable with ambiguity, curious
    about new technologies, and excited to solve problems
    without an established playbook.
  - Humble: You value feedback, collaborate openly, and use your
    strengths in service of the team.

  Compensation & Benefits:

  - $150,000–$220,000 base salary
  - Meaningful equity ownership
  - Significant growth opportunities as the company scales
  - Beautiful, sunshine and snack-filled office in the heart of
    Flatiron, Manhattan
  - Health, dental, and vision insurance
  - A focus on outcomes, not hours
  - Team outings, offsites, and unlimited PTO
