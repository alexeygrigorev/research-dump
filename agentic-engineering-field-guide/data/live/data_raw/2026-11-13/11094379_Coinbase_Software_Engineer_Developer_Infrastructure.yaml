description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  Coinbase's Developer Infrastructure group builds the systems
  every Coinbase engineer relies on to write, validate, ship,
  and run their code. Our teams collectively own the path from
  commit to production — scalable CI and build infrastructure,
  the platform that moves code safely to production, and the
  test infrastructure that gives engineers fast, trustworthy
  signals. We're hiring Senior Software Engineers across
  several teams in the group, and you'll be matched to the one
  that best fits your strengths and interests. Wherever you
  land, you'll design and operate foundational platform
  services used by all of Coinbase engineering, where a single
  improvement in build speed, deploy safety, or test
  reliability compounds across thousands of engineers. This is
  high-leverage, deep systems work at a financial-grade
  reliability and security bar.

  What you’ll be doing (ie. job duties):

  - Design, build, and operate core developer-infrastructure
    services — spanning CI and build systems, deployment
    orchestration, and test infrastructure — that are fast,
    reliable, and secure by default at Coinbase scale.
  - Drive measurable improvements to the metrics every engineer
    feels: build and CI wall time, deploy speed and safety,
    and test feedback time and flakiness.
  - Own your services end to end, including SLOs, observability,
    and on-call.
  - Partner closely with engineering teams across Coinbase (your
    customers) to understand pain points and turn them into
    platform improvements.
  - Lead technical design for ambitious, cross-cutting projects
    and see them through to production.

  Pay Transparency Notice: Base salary varies by location (see
  range below). Total compensation may also include equity and
  bonus eligibility, and benefits (medical, dental, vision,
  401(k)).

  Annual base salary range (excluding equity and bonus):

  $152,405—$179,300 USD

