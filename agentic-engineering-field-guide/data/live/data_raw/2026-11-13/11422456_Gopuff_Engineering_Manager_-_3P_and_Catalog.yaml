description: |
  Gopuff is seeking an Engineering Manager to lead its Catalog
  and Partner Integrations teams. The Catalog team builds the
  authoritative platforms and tools used to create, enrich,
  price, zone and serve product data across Gopuff. Partner
  Integrations connects that data - and associated inventory,
  promotions, orders, and fulfillment workflows - to
  marketplaces, strategic partners, and retail platforms such
  as Shopify. Together, these teams ensure products are
  accurately represented, sellable and fulfillable across
  Gopuff’s first-party and partner channels. If you are a
  driven and experienced engineering manager, we would love to
  hear from you.

  This position will involve a combination of hands-on
  engineering and people management. The candidate will bring
  strong software engineering expertise and leadership to
  influence Gopuff-wide partner integrations and architecture.
  The ideal candidate will be an experienced engineering
  leader with an interest in both the technical and product
  management aspects of engineering.

  What We Offer

  - Medical/Dental/Vision Insurance
  - 401(k) Retirement Savings Plan
  - HSA or FSA eligibility
  - Long and Short-Term Disability Insurance
  - Fitness Reimbursement Program
  - 25% employee discount & FAM Membership
  - Flexible PTO
  - Group Life Insurance
  - EAP through AllOne Health (formerly Carebridge)

