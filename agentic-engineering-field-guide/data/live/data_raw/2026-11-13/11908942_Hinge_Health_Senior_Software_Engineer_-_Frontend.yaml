title: Senior Software Engineer - Frontend
company: Hinge Health
location: San Francisco, USA
work_type: FULL_TIME
company_size: 550 Employees
description: |
  About this role

  As a Senior Software Engineer at Hinge Health, you will play
  a pivotal role in designing, building, and maintaining
  large-scale software solutions that directly impact our
  members’ health outcomes. You will collaborate with cross-
  functional partners, including product managers and
  designers, to deliver new product capabilities and improve
  the maintainability, availability, and performance of our
  features. This role is essential to advancing our mission of
  transforming joint and muscle care through technology,
  including the integration of AI-driven solutions to automate
  and enhance care delivery. Hinge Health software engineers
  work on small interdisciplinary teams focused on different
  parts of the user journey.

  As a member of the Accounts team, you will help build and
  shape new improved experiences with impact across the whole
  company. A resilient and scalable Accounts system ensures
  both stability and helps with growth of our member base.
  You’ll work closely with product managers, designers, and
  backend engineers to build scalable, performant, and
  accessible applications that will enable every user to
  securely register, sign in and access our features

  Frontend engineers contribute to their team’s success by
  adding beautiful, useful features to Hinge Health
  applications. Senior frontend engineers design and implement
  end-to-end solutions for large-scale features, profile app
  performance, and help maintain a high bar with thoughtful
  and constructive code reviews.

  We enjoy a continuous deployment DevOps culture, and take
  owner-operator pride in supporting our code in production
  with an on-call rotation. Rotations vary by team. Our
  production systems rely on React Native, React, Node.js,
  TypeScript, Nestjs, GraphQL, Golang, Docker, Temporal,
  Rails, AWS, Postgres, Redis, Apollo, and Redux. Our workflow
  is trunk-based CI/CD, and our security/compliance posture is
  at the highest standards of healthcare, including HIPAA,
  HITRUST, SOC 2, and CCPA.

  What You’ll Accomplish

  - Deliver large projects that introduce new product
    capabilities, often acting as a maintainer for key code
    repositories.
  - Break down complex problems into manageable tasks, ensuring
    steady and predictable delivery while identifying and
    resolving root causes of incidents.
  - Collaborate with your team to roadmap and execute ambitious
    technical strategies, balancing short-term and long-term
    trade-offs.
  - Mentor and support junior engineers, providing thoughtful
    code reviews and real-time pairing.
  - Integrate and leverage AI technologies to automate processes
    and enhance product features, contributing to Hinge
    Health’s AI-driven care platform.
  - Proactively improve the maintainability, availability, and
    performance of the team’s features, and contribute to the
    team’s overall architecture and developer tooling.
  - Exhibit strong user and business judgment, grounding
    decisions in customer needs and business priorities to
    drive durable product value
  - Communicate technical ideas clearly to both technical and
    non-technical partners, and document solutions for future
    reference.

  Basic Qualifications

  - Bachelor’s Degree (or equivalent) in Computer Science,
    Engineering or related technical field
  - 3+ years of non-internship full time professional software
    development experience
  - Experience with at least one software programming language
  - Experience in the full software development life cycle
  - Experience delivering large software projects or features in
    a production environment
  - Experience with mobile app development/deployment lifecycles
  - Proficiency in TypeScript/JavaScript
  - Experience with cloud based services (e.g.
    Docker/Kubernetes, cloud services such as AWS, and gRPC,
    protobufs, and temporal, etc.)

  Preferred Qualifications

  - Experience with AI technologies for software design and
    coding assistance
  - Experience mentoring or onboarding junior engineers
  - Familiarity with distributed systems, cloud infrastructure,
    or scalable architectures
  - Experience with healthcare technology or regulated
    environments
  - Experience with Agile development practices

  Hinge Health Hybrid Model

  We believe that remote work and in-person work have their
  own advantages and disadvantages, and we want to be able to
  leverage the best of both worlds. Employees in hybrid roles
  are required to be in the office 3 days per week, for the
  full 8 hours of a typical business day. The San Francisco
  office has a dog-friendly workplace program.



  About Hinge Health

  At Hinge Health, we’re using technology to scale and
  automate the delivery of healthcare, starting with
  musculoskeletal (MSK) conditions, which affect over 1.7
  billion people worldwide. Our AI-powered, human-centered
  care model spans MSK, pelvic health, gastrointestinal (GI)
  and migraine care. With over 60 partnerships with health
  plans, PBMs and other ecosystem partners, Hinge Health is
  available to over 25 million people across more than 2,900
  employers. The company is headquartered in San Francisco
  with additional offices in Montreal and Bangalore. Learn
  more at hingehealth.com.



  What You’ll Love About Us

  - Inclusive healthcare and benefits: On top of comprehensive
    medical, dental, and vision coverage, we offer employees
    and their family members help with gender-affirming care,
    tools for family and fertility planning, and travel
    reimbursements if healthcare isn’t available where you
    live.
  - Planning for the future: Start saving for the future with
    our traditional or Roth 401k retirement plan options which
    include a 2% company match.
  - Modern life stipends: Manage your own learning and
    development.
  - Grow with us: Grow with us through discounted company stock
    through our ESPP with easy payroll deductions.



  Culture & Engagement

  Hinge Health is an equal opportunity employer and prohibits
  discrimination and harassment of any kind. We make
  employment decisions without regards to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, age, veteran status, disability status, pregnancy,
  or any other basis protected by federal, state or local law.
  We also consider qualified applicants regardless of criminal
  histories, consistent with legal requirements. We provide
  reasonable accommodations for candidates with disabilities.
  If you feel you need assistance or an accommodation due to a
  disability, let us know by reaching out to your recruiter.

  By submitting your application you are acknowledging we are
  using your personal data as outlined in the personnel and
  candidate privacy policy.

  Beware of Phishing Attempts: We've noticed an increase in
  phishing where fraudsters impersonate employees and send
  fake job offers to steal sensitive information. We'll never
  ask for financial details during the hiring process and only
  use "@hingehealth.com" emails. If you receive a suspicious
  offer, stop communication and report it to the US FBI
  Internet Crime Complaint Center. To verify an email from our
  recruiting team, forward it to security@hingehealth.com.
