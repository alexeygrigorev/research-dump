description: |
  As a Back-end Software Engineer within Group Functions
  Technology, you will be a key member building technology
  which supports our global operations. The ideal candidate
  has a curious mind, a thirst for knowledge, a desire to
  understand how technology works and a passion for high
  quality software engineering. You have solid software
  engineering fundamentals and understand the importance of
  implementing standard processes such as secure coding,
  microservices, CI/CD pipelines, and test automation. You
  enjoy keeping your existing technical skills honed and
  develop new ones so you can make meaningful contributions to
  Manulife's success.

  Position Responsibilities:

  - Work in an Agile team to create, deliver and maintain high-
    quality, performant, and secure solutions.
  - Use a proactive approach to common challenges and
    continually research industry standard methodologies in
    software development.
  - Assess the target (future) state of the organization’s
    technology needs to achieve the business objectives.
  - Provide technical leadership across the software development
    lifecycle, ensuring architectural consistency and
    engineering excellence.
  - Lead the design and review of software systems, making high-
    level decisions on architecture and technology choices.
  - Build the solutions to close identified gaps and improve our
    systems.
  - Pair program with other software engineers or AI tools to
    learn, coach, and mentor.
  - Consume and contribute to open source and inner source
    projects.
  - Help us build up our performance and reliability story using
    tools like New Relic, Dynatrace, and Moogsoft for
    performance monitoring, end-to-end logging, and other
    telemetry data.
  - Learn and become proficient in various technologies as
    required.

  Required Qualifications:

  - 5+ years back-end development, designing, implementing
    solutions in Databricks, Pyspark (Python API), Azure Data
    Factory and SQL Server
  - 5+ years of experience developing cloud-native solutions on
    Azure
  - 5+ years working with solutions deployment via CI/CD using
    Azure DevOps, Jenkins, GitHub Actions, or similar
    technologies
  - Proven experience in designing software systems and
    documenting the design using tools such as UML
  - An approach dedicated to finding solutions, with the ability
    to make sound professional decisions
  - Ability to make complex information accessible and
    communicate easily within distributed teams
  - Familiarity with Java and Java Spring Boot is an asset

  Preferred Qualifications:

  - Experience in Power BI is an asset.
  - Experience in the financial industry (a plus).
  - Proven track record of practical, thoughtful problem
    solving.
  - Experience with JavaScript, React, and/or NodeJS would be an
    asset.

  When you join our team:

  - We’ll empower you to learn and grow the career you want.
  - We’ll recognize and support you in a flexible environment
    where well-being and inclusion are more than just words.
  - As part of our distributed team, we’ll support you in
    shaping the future you want to see.

  The role being advertised is an existing vacancy.

