description: |
  You're a Software Engineer with 2 to 5 years of experience
  who builds scalable systems, thinks in product outcomes, and
  uses AI models and coding agents effectively as part of
  daily engineering work. The Engineering team builds and runs
  the TypeScript and Python systems behind Qogita's Wholesale
  Operating System, working closely with Product, Design,
  Science, and Platform. What you'll do

  - Build and extend the Python and Django services that power
    Qogita's Wholesale Operating System, delivering new
    features, APIs, and services end to end.
  - Develop frontend changes, extending our TypeScript and
    Next.js portals, when a feature needs them, so you can
    ship a complete feature without handoffs.
  - Own the design of scoped services and features, documenting
    the trade-offs and presenting them to the team for
    discussion and review.
  - Improve system performance, observability, and reliability,
    using metrics, and tracing to find and fix bottlenecks.
  - Drive product decisions with Product partners by challenging
    requirements, proposing alternatives, and shipping the
    smallest change that delivers the outcome.
  - Execute day-to-day development with AI models and coding
    agents, building the specifications, tests, and guardrails
    that let agents ship correct, secure, and maintainable
    changes without line-by-line review.

  What you'll bring

  - 2 to 5 years of experience designing scalable, high-
    performance production systems, including distributed and
    event-driven architectures, and the judgment to explain
    the trade-offs.
  - Fullstack working ability: able to ship frontend and backend
    changes when a feature needs them.
  - A product mindset: able to turn an ambiguous business
    problem into a scoped solution and push back on work that
    does not move the outcome.
  - Daily, hands-on use of AI models, coding agents, and the
    tooling around them, with the discipline to review and
    test what they produce.
  - Engineering fundamentals that do not depend on one language:
    system design, data modeling, testing, and clean,
    maintainable code.
  - Able to give and receive direct feedback and align cross-
    functional partners on a shared goal without formal
    authority.

  Benefits

  - Base salary: €60,000 – €75,000
  - 26 days of annual leave, plus 4 additional personal days
  - Company performance-based bonus
  - Attractive equity package
  - Pension contributions
  - Annual learning & development budget
  - Office-led culture with hybrid flexibility
  - Dog-friendly offices
  - Home-office setup package
  - Office socials and annual company-wide offsite

  Who we are Qogita [Ko-gi-ta] is on a mission to make global
  trade radically efficient by building the operating system
  for modern wholesale. Wholesale is a €50 trillion market
  still largely run through phone calls, catalogues and trade
  shows. Behind every product sits a fragmented chain of
  sourcing, trading and logistics that makes wholesale slower,
  more complex and expensive than it should be. Qogita is
  changing this by connecting the global market into a single
  order book, building the rails to move products across
  borders efficiently, and providing the intelligence to help
  businesses know what to stock, what it’s worth and where it
  should go. We operate across health and beauty in 30+
  European markets, with ambitions to reach every category,
  everywhere. Backed by Accel, Bessemer, Dawn and LocalGlobe,
  we’re one of Europe’s fastest-growing B2B companies. We’re
  an ambitious, pragmatic and highly collaborative team,
  united by a desire to reshape one of the world’s biggest
  markets.
