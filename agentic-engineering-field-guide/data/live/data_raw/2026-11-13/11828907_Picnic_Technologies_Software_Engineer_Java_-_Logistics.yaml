title: Software Engineer (Java) - Logistics
company: Picnic Technologies
location: Amsterdam, NLD
work_type: FULL_TIME
company_size: 4,979 Employees
description: |
  In a nutshell

  Our Java teams in the Logistics domain make sure that our
  products travel all the way from the suppliers in our
  electronic vehicles, and arrive at our customers’ houses
  with a smile. From optimizing our routes, to making our
  drivers’ lives easier, to planning and executing all inbound
  and outbound products: there’s a wide range of products to
  work on. Through designing, developing, and testing new
  features, or improving the scalability and security of our
  platform: you’ll be owning a product together with your
  team, while finding yourself fully immersed in an engaging
  scaleup culture.

  Tricks of the trade

  - Ownership: Take ownership of projects from concept to
    delivery, aligning technical solutions with business goals
    with a product engineering mindset
  - Problem solving: You see a problem, you tackle it with
    technology - with your users always in mind
  - Contribution: Design, test, evolve, and evaluate the systems
    that underpin our Logistics operations, offering a
    creative and analytical approach
  - Our Tech: Java 21/25 (Spring 6 with Spring Boot 3.5,
    Reactor, Immutables, Maven), React, Angular, RabbitMQ,
    Kafka, PostgreSQL, MongoDB, Git, Docker, AWS, Helm,
    Terraform, Kubernetes, Vault, Datadog, Python 3.x

  We’re looking for

  - You have a Master’s Degree (in Computer Science, Artificial
    Intelligence, Information Technology, Computer Engineering
    or a related technical field) or equivalent experience.
  - You have a product mindset: you own and solve business
    problems through tech
  - You have 1-5 years of professional experience in programming
    and software development
  - You have a profound understanding of software development
    principles and are ready to have hands on backend and
    frontend alike
  - Your English skills are on point (no Dutch required)
  - You're based in or happy to relocate to the Netherlands*

  * We work from our office in Amsterdam. Being present makes
  a genuine difference to your team and the work. There's
  flexibility to work from home when needed, but if remote or
  hybrid-first is what you're after, this probably isn't the
  right fit.

  Please send your CV in English for complete consideration.

  Picnic Perks

  ✍🏼 Mastery is a journey!

  You’ll get plenty of opportunities to challenge yourself and
  grow, including the Picnic Tech Academy, Lunch & Learn
  sessions, and tailored soft skills training.

  💡 Make a difference

  You will work on real-world problems, seeing the impact of
  your work every day in our warehouses and in our satisfied
  customers. Plus, our fully electric vehicles and sustainable
  business model mean you’ll also be contributing to making
  the world a better place!

  🫱🏼‍🫲🏾 Teamwork makes the dream work

  With more than 80 nationalities across 3 countries, you’ll
  be part of a diverse company with plenty of cool stuff to
  get involved with, from board game evenings, to after-work
  drinks, to our company ski trip and more!

  🍎 You are what you eat

  You’ll get freshly prepared, healthy lunches and snacks
  (with plenty of vegetarian, vegan, and halal options).
  Coffee snob? Don’t worry, our amazing Picnic barista has you
  covered.

  🚴🏽 Stay healthy

  Mental health is important. As well as having the option to
  speak with Picnic colleagues who act as confidential
  advisors, our collaboration with OpenUp gives you easy
  access to professional psychologists, along with workshops
  and materials. There are plenty of sports communities and
  events to get involved with, from tennis to yoga, to
  climbing!

  🔋 Attractive package

  We offer competitive compensation and a pension plan that
  looks out for your future self, as well as 25 vacation days
  per year, so you can recharge your batteries

  🌍 Benefits for expats

  It can be daunting starting a new job AND moving to a new
  country. That’s why we offer lots of support for our many
  expat colleagues, if you want to find our relocation
  benefits, see here.
