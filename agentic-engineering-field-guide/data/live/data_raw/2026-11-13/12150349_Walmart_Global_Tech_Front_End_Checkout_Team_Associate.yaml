description: |
  Position Summary...To support and process transactions,
  providing exceptional customer service to ensure a positive
  shopping experience and drive customer loyalty.



  What you'll do...

  1.Greets all customers in a polite and friendly manner.
  2.Processes all purchase transactions in a timely and
  efficient manner, including deactivation of merchandise with
  respect to the EAS Program. 3.Promotes company sponsor
  programs, ie. Credit card service, product protection and
  charity initiatives. 4.Assists customers with bagging and
  loading of merchandise. 5.Ensures safe work practices are
  followed including proper lifting and keeping a clean work
  area. 6.Maintains register security and integrity through
  diligent cash handling, adherence to relevant company
  policies and awareness of surroundings.. 7.Refers
  appropriate service and transactional items to a Customer
  Service Manager or Front End Team Lead. 8.Educating and
  supporting customers on the correct and efficient use of
  self-checkout options.

  The minimum rate of pay for this position starts from
  $18.10.

  ‎

  Le taux horaire minimum pour ce poste débute à 18.10.

