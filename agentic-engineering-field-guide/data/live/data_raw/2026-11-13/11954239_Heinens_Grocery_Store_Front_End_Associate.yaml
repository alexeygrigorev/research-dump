description: |
  *Opportunity for promotion*

  Company Overview:

  Established in 1929, Heinen’s is a leading, family-owned
  grocery retailer known for its premium-quality products and
  outstanding customer service. Now in its fourth generation
  of family leadership, Heinen’s operates 23 locations – 18 in
  the Cleveland, Ohio area and 5 in the Chicago, Illinois
  market – supported by two distribution warehouses, a food
  production facility, and a corporate office located in
  Warrensville Heights, Ohio.

  Our culture is rooted in an associate-first philosophy,
  placing a strong emphasis on the well-being, development,
  and quality of life of every team member. We offer
  competitive compensation, professional development and
  leadership training programs, paid time off, and flexible
  scheduling designed to promote a healthy work-life balance.



  Retail Professional – Heinen’s Diamond Difference Standards:

   As an associate of Heinen’s there are key components to
  learn, implement and master. Each of these are integral to
  the Heinen’s Brand and to your success. These are simple
  behaviors that help distinguish us as the premier
  supermarket in Northeast Ohio and Chicago.

  Professional Appearance - Ensure you present yourself, your
  team, your products and your department in support of our
  Brand.

  Acknowledge - Acknowledge customers with a smile and eye
  contact.

  Evaluate - Develop the habit of evaluating store conditions
  on a continuous basis using our 5-Step QCSSS (Quality,
  Cleanliness, Stock Levels, Signage, and Serviceable) for
  excellence.

  Thank - Thank each other for a job well done to reinforce
  positive behaviors and attitudes to support your team.

  Engage - Engage customers when appropriate.

  Responsibilities:

  - Operate scanners, scales, cash registers and other
    electronics.
  - Accept payments, ensuring all prices and quantities are
    accurate.
  - Follow all store procedures regarding coupons, gift cards or
    the purchase of specific items, such as alcohol.
  - Follow company standards for proper packing.
  - Acquire and share knowledge of the store.
  - Prioritize daily work based on varying business needs.
  - Attend required corporate meetings and training classes.
  - Comply with all personal and food safety company standards.
  - Performs other duties as assigned.

  Qualifications:

  - Possess excellent written and verbal communication skills.
  - Possess a sense of urgency and the ability to work
    independently to achieve daily tasks.
  - Comply with all company policies and standards.
  - Possess the ability to work with minimal supervision.
  - Be production driven with the ability to work continuously
    on repetitive tasks, while standing.
  - Possess the ability to frequent lift and/or move up to 50
    lbs.
  - Be able to work in various weather conditions.
  - Must be willing to work the number of hours required to meet
    company objectives, with the understanding that
    occasionally business needs will require additional time.
  - Must be willing to work the non-traditional five-day work
    schedule, including Saturday, Sunday and evenings.

  Illinois Benefits Information

  - Retirement Plan
    - Company-sponsored 401k plan for eligible full-time and part-
      time associates.  5% company match.
  - Healthcare Benefits
    - Medical and Pharmacy coverage for full-time associates.
    - Flexible Spending and Health Savings Account options, as
      well as Commuter Benefit options.
    - Company-provided Dental and Vision coverage for full-time
      and part-time associates.
  - Paid Time Off
    - Paid Time Off, including paid sick time.
  - Insurance
    - Company-paid life, short and long-term disability insurance.
  - Work-Life Balance
    - Flexible schedules.
    - Biweekly scheduling for better work predictability.
    - Closed on 7 major holidays.
  - Growth and Development
    - Daily professional development and growth opportunities,
      including leadership development for all associates.
  - Wellbeing
    - Company-provided associate assistance program.
    - Family, Parental and Personal Leave options.
  - Discounts
    - 20% discount on Heinen's products.

  Heinen’s, Inc. provides equal employment opportunity to all
  persons regardless of age, color, national origin,
  citizenship status, physical or mental disability, race,
  religion, creed, gender, sex, sexual orientation, gender
  identity and/or expression, genetic information, marital
  status, veteran status, or any other characteristic
  protected by federal, state or local law.
