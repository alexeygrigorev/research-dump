  business processes. With built-in governance, auditability,
  and human oversight, Camunda gives enterprises the control
  they need to move AI from pilots to production — safely and
  at scale. Trusted by over 700 organizations worldwide,
  including 9 of top 10 US banks, Camunda helps enterprises
  boost operational efficiency, accelerate time-to-value, and
  deliver better customer experiences. Fully remote and
  global, we are in the middle of something bigger:
  transforming into an AI-first organisation, built on our own
  platform. We use Agentic AI to automate, orchestrate
  intelligent processes, and elevate human contribution across
  every team. Named GP Bullhound’s Top 100 Next Unicorn list,
  2025 Great Place to Work certified. Visionary in 2025
  Gartner® Magic Quadrant™ for Business Orchestration and
  Automation Technologies. ranked 3rd in Flexa's 2026 Most
  Flexible Companies, We’re growing fast and looking for top
  talent to join our team. If you want meaningful work,
  visible impact and put something genuinely rare on your CV,
  keep reading.

  About the role:

  As a Senior Software Engineer on Camunda's new Data
  Streaming team, you'll help build a foundational new piece
  of architecture that changes how customers and internal
  products access process data. Today, customers have no
  first-class way to stream their own process data out of
  Camunda, and Camunda's own analytics product is bottlenecked
  by querying the same storage the live engine depends on.
  You'll be part of a greenfield team rebuilding how process
  data is consumed and served at scale, built on top of a
  durable, continuously-written streaming layer that decouples
  data consumption from the live engine. You'll be part of a
  small team from day one, with real room to shape both the
  architecture and the team's scope as it matures.

  At Camunda, we approach engineering in a holistic manner. As
  such, you will form strong partnerships with product
  management, the Data Layer and Distributed Systems teams,
  QA, and support, and work closely with your peers to not
  only deliver but directly influence how our data streaming
  architecture evolves to meet our customers' needs.

  What You Will Do:

  - Help rebuild how Camunda's analytics product consumes and
    serves process data at scale, moving it off the engine's
    critical path entirely.
  - Design and build the core streaming infrastructure that
    decouples process data access from the live execution
    engine, backed by durable, object storage.
  - Build customer-facing data streaming capabilities, including
    a supported way to integrate with systems like Kafka, so
    customers can reliably get their process data into their
    own tools.
  - Make foundational architecture decisions as part of a small,
    high-ownership team, including how the system guarantees
    consistency and durability across a distributed streaming
    pipeline.
  - Participate in L3 support and on-call rotations, partnering
    with Support and SRE to investigate data layer production
    issues, and feeding what you learn back into the product.

  What You Will Bring to the Role:

  Must Haves:

  - 7+ years of experience as a backend engineer, in Java, with
    a strong focus on distributed or data-intensive systems.
  - Hands-on experience building or operating an analytical
    serving layer over a table format such as Apache Iceberg
    or Delta Lake - including experience with an
    embedded/lightweight query engine (e.g. DuckDB, or
    similar), or a stateful stream-processing framework (e.g.
    Flink, Kafka Streams).
  - A track record of working with object storage systems
    (S3/GCS/Azure or similar) and building reliable,
    idempotent upload/commit protocols against them.
  - Solid grounding in the reasoning behind correctness and
    consistency in data-intensive systems (e.g. concurrent
    writes, atomicity, idempotency).
  - A demonstrated track record of driving a technical
    initiative through genuine ambiguity in a still-being-
    designed system, not just extending an established one.
  - Proven experience leading medium-to-large engineering
    initiatives (3+ months) end-to-end, from solution design,
    project planning, and coordinating across teams, right
    through to driving predictable delivery.
  - Strong communication and collaboration skills in a remote-
    first environment: you translate requirements into
    actionable technical work with Product, and give and
    receive clear, direct feedback in code review.

  Nice to Haves:

  - Experience with Kafka or a similar streaming/event-log
    system
  - Experience with embedded state stores (RocksDB or similar)
    for projection/checkpointing workloads.
  - Experience with stream processing frameworks (e.g. Apache
    Flink), particularly stateful processing with local state
    backends and checkpointing.
  - Familiarity with object-storage-native streaming
    architectures (e.g. systems like WarpStream) is a plus,
    even without direct hands-on experience.

