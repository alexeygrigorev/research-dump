description: |
  We are looking for a skilled and passionate Engineering
  Manager to join our Excel Agents Team in the Amsterdam
  office. Working in a bootstrapped and profitable scaleup,
  you'll have the unique opportunity to lead a team building
  the intelligence layer that automates the assurance
  lifecycle and brings AI directly into the workflows of
  auditors worldwide.

  Why DataSnipper?

  The hardest AI problems aren't about getting an answer fast.
  They're about getting one people can trust.

  We believe trust is essential to how society works. Every
  day, we rely on information that's been independently
  verified, from financial statements to the products we buy,
  to the sustainability claims companies make. Behind that
  trust are audit and finance professionals who examine
  evidence, verify information and hold organizations
  accountable.

  At DataSnipper, we build AI solutions that empower those
  professionals. By making evidence easier to trace and
  verify, we help them focus on the judgment and expertise
  that make their work so important.

  For our product and engineering team, this is where things
  get exciting. In audit, a plausible answer isn't good
  enough. Every output has to be explainable and traceable
  back to its source. We've just launched a brand new agentic
  platform, Alwin by DataSnipper. AI agents running in the
  cloud across hundreds of documents at once, reasoning across
  PDF, Word and Excel, with a full audit trail behind every
  step. There are lots of greenfield problems ahead, and real
  room to shape what we build and how we build it.

  And we build at scale. More than 600,000 professionals
  across 3,000+ organizations in 175 countries rely on
  DataSnipper, including Fortune 500 companies, government
  agencies and all Big Four audit firms. In 2025 alone, the
  DataSnipper platform delivered more than $1.4 billion in
  productivity savings to is customers. Backed by a $100
  million Series B led by Index Ventures, at a $1 billion
  valuation, and as proud members of 1% for the Planet, we
  care about how we grow, not just how fast.

  If you want to build AI that professionals trust with work
  that really matters, this is your chance to help shape the
  future of audit and finance and do the best work of your
  career along the way.

  What You Will Do

  - Lead an engineering team through outcomes, not tasks; set
    clear goals with the team and trust them to figure out
    how.
  - Make the team measurably better; raise the engineering bar,
    grow engineers into bigger problems, and address
    performance issues directly when they arise.
  - Drive a step change in what the team can do with AI; not
    just shipping faster, but tackling harder problems,
    raising quality, and expanding what the team can credibly
    own.
  - Lead the team responsible for building AI-powered agents
    that automate assurance workflows, from risk assessment
    and evidence gathering to control testing and
    documentation generation.
  - Own the technical direction and architecture of the Excel
    Agent platform, ensuring agents are reliable, observable,
    secure, and effective in real customer workflows.
  - Guide the team in designing and scaling agentic systems that
    combine LLMs, document intelligence, business workflows,
    and human oversight.
  - Partner closely with Product, Design, and other Engineering
    teams to shape the roadmap and translate customer needs
    into impactful AI experiences.
  - Make the architectural and technical calls that shape the
    team's systems, and stay close enough to the code to do so
    credibly.
  - Lead the adoption of AI-assisted engineering practices and
    contribute to how DataSnipper leverages AI across the
    broader engineering organization.
  - Help shape the team's scope as it evolves, including
    expanding ownership areas and standing up new teams when
    needed.
  - Foster a culture of experimentation, learning,
    documentation, and operational excellence.

  What You Bring

  - At least 3 years of leading and managing engineering teams,
    driving performance, growth, and professional development
    through hands-on mentorship, feedback, and goal setting.
  - Minimum 5 years as a software engineer with a passion for
    building scalable, reliable, and high-quality software
    systems.
  - Track record of leading engineering teams that build with AI
    day to day, and making those teams measurably more
    effective as a result.
  - Experience building AI-powered products or platforms,
    ideally involving LLMs, agentic workflows, document
    processing, or automation systems.
  - An empowerment style of management; you lead through
    outcomes and trust, not by assigning tasks.
  - Strong product aptitude; can challenge product framing,
    translate customer needs into technical solutions, and
    make effective roadmap tradeoffs.
  - Strong understanding of software architecture, distributed
    systems, APIs, and cloud native development.
  - Experience operating systems in production with a focus on
    reliability, observability, and maintainability.
  - A track record of growing engineers and creating high-
    performing teams.
  - Strategic thinker; able to shape product direction,
    technical direction, and team scope, not just execute on
    what's handed down.
  - Entrepreneurial mindset with the ability to thrive in a
    fast-moving scale-up environment.

  Preferred Qualifications

  - Experience building and deploying GenAI applications in
    production.
  - Experience with agentic systems, orchestration frameworks,
    or AI-powered workflow automation.
  - Experience with Python and modern backend development
    practices.
  - Familiarity with Azure AI services, document intelligence,
    and cloud infrastructure.
  - Experience with observability and monitoring tools.
  - Experience working in startups or scaleups.
  - Experience in fintech, audit technology, or document-
    intensive workflows.
  - Strong understanding of testing strategies and engineering
    quality practices.

  What We Offer

  - Be part of one of the fastest-growing, profitable unicorn
    scale-ups in the Netherlands with a global impact
  - Equity (Stock Appreciation Rights) to share the company's
    success and growth
  - Pension plan with a 6% contribution on top of your base
    salary
  - 28 vacation days per year (full-time) to support your work-
    life balance
  - Hybrid work model with at least 3 days onsite in our dynamic
    Amsterdam office
  - Daily, freshly prepared lunches by our in-house chef to keep
    you energized
  - NS business card for easy commuting to the office if
    applicable
  - Access to continuous learning and development initiatives to
    grow your skills
  - Engage with a vibrant international team spread across five
    global offices
  - Company-wide events like DataSnipper GO, where global teams
    come together
  - Access to a mental health and wellness platform supporting
    your wellbeing

  Recruitment Process

  - Recruitment Screen (30 minutes, online)
  - Hiring Manager Interview (30 minutes, online)
  - System design interview (60 minutes, online)
  - Product Insight Discussion (60 minutes, on-site)
  - Final Interview (30 minutes, online)

  At DataSnipper, we believe great ideas come from different
  perspectives, experiences, and backgrounds. We are committed
  to building an inclusive workplace and providing every
  candidate with a fair and equitable hiring experience.

  Our hiring decisions are merit-based and grounded in the
  skills, experience, potential, and capabilities relevant to
  the role.

  We welcome applicants regardless of age, race, ethnicity,
  nationality, gender, gender identity or expression, sexual
  orientation, religion, disability, or any other
  characteristic that makes you, you.

  What matters to us is what you can bring to the role, the
  team, and DataSnipper. 🚀
