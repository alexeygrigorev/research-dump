description: |
  N-iX is a software development service company that helps
  businesses across the globe develop successful software
  products. During 20 years on the market and by leveraging
  the capabilities of Easter Europe talents, the company has
  grown to 2000+ professionals with a broad portfolio of
  customers in the area of Fortune 500 companies as well as
  technological start-ups. With its headquarters in Lviv,
  Ukraine, the company also has multiple development offices
  in the East European region and representative entities in
  the United States of America, Sweden, and Malta.

  We are looking for a Senior Full Stack Engineer comfortable
  with C# and Angular, with a proven history of building high-
  performance apps with a strong focus on system integrations
  and API-driven solutions.

  The Customer  Our clients are developing a modern B2B
  platform for the automotive industry, designed to digitalize
  and simplify complex business processes. The solution
  connects different stages of the automotive service and
  procurement journey, replacing fragmented and manual
  activities with more streamlined digital workflows. The
  project operates in the European market and is being
  designed with further growth and scalability in mind. This
  is AI First project with massive usage of AI DLC practices.

  The role This is a great opportunity for an experienced
  Senior Full Stack Engineer  to join our super-motivated
  Software Development team, being part of one of our existing
  scrum teams. Each agile team includes technical leadership,
  development, architecture, quality, product, and project
  management roles.

  Responsibilities:

  - Work on business requests and development improvements
  - Develop, test, document and maintain our application back
    end build scalable and reusable code
  - Provide realistic estimates for requests, fixes and new
    ideas
  - Create unit tests
  - Write clear and precise technical documentation
  - Manage realistic work deadlines
  - Participate in all the scrum ceremonies and be part of the
    team performance and continuous improvement
  - Design and maintain integrations between internal and
    external systems
  - Develop and evolve RESTful APIs used for system-to-system
    communication
  - Ensure reliability, performance, and data consistency across
    integrations
  - Own integration-related technical decisions, including
    security and data exchange approaches

  Requirements:

  - 5+ years of experience in Microsoft development, stack
    including: .NET C#, SQL Server T-SQL.
  - Commercial experience with ASP.NET MVC, SQL Server, HTML,
    CSS, JavaScript, Git.
  - Hands-on experience with Angular, at least 2 years.
  - Proficiency in Azure, .NET core, SOLID principles,
    Microservices architecture, Design principles, and Jira.
  - Experience working with Scrum methodology in a variety of
    contexts; different team sizes, organizational cultures,
    distributed development, etc.
  - Proficiency in track record of previous experience,
    including training, conferences, user groups, and self-
    study, is desirable.
  - Hands-on experience with AI-assisted software development,
    including AI coding tools, custom AI agents/skills, and AI
    integrations (e.g., MCP) to improve development
    productivity and code quality.

  Personal Qualities:

  - Self-organizing problem solver.
  - Able to think outside the box (open thinking).
  - Strong ability to work effectively in a team. Collaborating,
    motivating, and energizing others (Team player).
  - Encourage and drive others to deliver high-quality, cutting-
    edge software.
  - You will have attention to detail and have a proactive
    ethos.
  - Always looking for continuous improvement.
  - Excellent verbal and written communication skills, in
    English.

  We offer*:

  - Flexible working format - remote, office-based or flexible
  - A competitive salary and good compensation package
  - Personalized career growth
  - Professional development tools (mentorship program, tech
    talks and trainings, centers of excellence, and more)
  - Active tech communities with regular knowledge sharing
  - Education reimbursement
  - Memorable anniversary presents
  - Corporate events and team buildings
  - Other location-specific benefits

  *not applicable for freelancers
