title: Senior Lead Software Engineer - Market Risk Tech
company: JPMorganChase
location: London, GBR
work_type: FULL_TIME
company_size: 289,097 Employees
description: |
  Market Risk Technology supports JPMorganChase's Risk
  Managers in understanding firmwide exposures and running
  core risk processes, including VaR and Stress.

  We build applications that start with the business. Risk
  Managers increasingly prototype their own tools. When a tool
  outgrows what a non-engineer can maintain, we take it on and
  rebuild it to production standard: secure, supported, easy
  to use and integrated with firm platforms. We also build
  directly from business ideas where no prototype exists.

  In this role you will be a senior engineer working directly
  with Risk Managers in London. You will understand the
  problem behind a request, design and build a solution that
  fits the wider system, and see it through to a stable
  production service. You will work with senior stakeholders,
  pull in the people needed to solve a problem, and guide the
  engineers around you. Speed to production matters to us, and
  so does doing it safely and doing it well.

  Job Responsibilities

   •    Design, build and run production applications end to
  end (services, data pipelines and user interfaces) that
  integrate with firm platforms and data sources •
  Understand the business problem behind each request, and
  shape the solution around it, which sometimes means
  proposing a different answer to the one asked for •    Look
  beyond the immediate request to find the problems worth
  solving, and make the case for them •    Design solutions
  with the wider system in mind, and make the trade-offs
  between speed, resilience and long-term maintainability
  explicit •    Design applications, APIs and data for AI
  agents as well as people to use and operate: clear
  interfaces, structured outputs, permissions and guardrails •
  Build trusted working relationships with senior Market Risk
  stakeholders, including Managing Directors, and be
  accountable to them for delivery •    Set clear expectations
  on scope, success criteria, timelines and risks, and keep
  stakeholders informed as things change •    Provide
  transparency on status and issues, raising problems early
  and with options •    Work across team boundaries to get
  problems solved: bring the right people together, set up the
  conversations that are needed, and follow through to
  resolution •    Guide and review the work of junior
  engineers, and help them grow their skills and judgement •
  Use AI tools day to day to build, test and document faster,
  and look for where AI and agents can solve the business
  problem directly •    Challenge existing ways of working,
  bring fresh ideas, and improve processes and tools as you
  go, keeping the ones that add value and removing the ones
  that don't •    Uphold engineering standards across design,
  coding, testing, CI/CD, security, observability,
  documentation and runbooks •    Represent the team with
  senior business and technology stakeholders, lead by
  example, and contribute to an inclusive and respectful team
  culture

  Required Qualifications, Capabilities, and Skills

   •    Significant hands-on experience designing, building
  and running production applications in large corporate
  environments •    Deep proficiency in at least one
  programming language, and comfort working across the stack •
  Strong systems thinking: you design solutions that fit
  across platforms, data flows and teams, and can explain the
  trade-offs •    Practical, regular use of AI tools in
  engineering, with the depth to review and take
  responsibility for AI-generated code and the judgement to
  know when it isn't good enough •    A working understanding
  of agentic systems: how agents use tools, APIs and data, how
  agent workflows are orchestrated, and how to keep them
  observable, controlled and safe •    A business-first
  approach to problems, and the judgement to tell the problem
  worth solving from the one that is simply nearest •    A
  track record of building trusted relationships with senior
  business stakeholders and being accountable to them •
  Clear, candid written and verbal communication, including
  explaining technical trade-offs and delivering difficult
  messages to senior audiences •    Comfortable working across
  teams to resolve problems, including pulling people together
  when no one else does •    Experience guiding and reviewing
  the work of other engineers •    A track record of taking
  accountability for outcomes, your own and those of the work
  you lead •    The confidence to challenge the status quo,
  and a habit of improving things along the way

  Preferred Qualifications, Capabilities, and Skills

   •    Python, our primary language •    Understanding of
  financial markets and Market Risk concepts, such as
  sensitivities, VaR, Stress or FRTB •    Familiarity with
  Athena or SecDB and related integration patterns •
  Experience with Databricks or similar data platforms •
  Experience building LLM-based or agentic capabilities into
  production (for example retrieval, tool interfaces such as
  MCP, or multi-agent orchestration) •    Experience leading a
  small team of engineers

  What Success Looks Like

   •    Senior Risk Managers see you as their technology
  partner, bring problems to you early, and trust what you
  tell them •    Stakeholders know what to expect, when to
  expect it, and hear about risks before they become issues •
  You work on the problems that matter to the business, and
  help the team do the same •    Your solutions fit the wider
  system and hold up as needs change •    Your applications
  can be used and operated by AI agents as well as people,
  safely and with clear controls •    Problems that span teams
  get resolved because you brought the right people together •
  Junior engineers grow faster for working with you •
  Processes and tools are better because you were there •
  You represent the team well, and others learn from how you
  work

