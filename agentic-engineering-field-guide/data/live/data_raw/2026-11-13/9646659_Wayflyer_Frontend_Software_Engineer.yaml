description: |
  About Wayflyer

  Today's small businesses need a capital provider that keeps
  pace with their growth ambitions. Traditional financing
  options are slow, cumbersome and often out of reach. That's
  why we built Wayflyer.

  Our technology allows us to assess businesses in minutes,
  generate financing offers that reflect their growth
  potential and send funds in as little as 24 hours. To date,
  we've deployed over $6bn to thousands of businesses
  worldwide, backed by Tier 1 banks like J.P. Morgan.

  You'll be collaborating with ambitious colleagues from
  around the world. We have offices in Dublin, London, New
  York, Charlotte, Berlin and Sydney.

  The challenge

  When a founder logs into Wayflyer, what they see, and how
  easily they can make sense of it, directly affects whether
  they trust us with their business. We're building financial
  products that need to feel effortless.

  What you'll actually do

  - Provide technical leadership in architectural decisions and
    champion our existing frontend best practices, advocating
    for our standards and helping push them forward across the
    team
  - Lead the design and implementation of complex frontend
    features using TypeScript and React, ensuring high-
    quality, reusable components that scale across our
    financial products
  - Partner with product and design teams to shape product
    outcomes, defining intuitive experiences that help
    e-commerce brands access and manage their funding. This
    goes beyond delivering UI; every engineer here plays a
    meaningful role in what we build and how it serves our
    customers
  - Own end-to-end delivery: shape solutions with
    product/design, build and test, ship to production and
    monitor/iterate using our observability stack.
  - Drive improvements in performance, accessibility, and user
    experience across our platform
  - Mentor engineers across the team and conduct thorough code
    reviews to maintain high quality standards
  - Work closely alongside our backend engineers, contributing
    across the stack when needed. We actively encourage
    curiosity and flexibility about where you can add value
  - Lead technical discussions and contribute to the team's
    technical strategy
  - Identify and proactively address technical debt and system
    scalability challenges

  Who thrives here

  You should be comfortable making and defending technical
  decisions, while remaining open to feedback and alternative
  approaches. You'll need to balance technical excellence with
  business needs and help guide the team toward pragmatic
  solutions.

  You excel at stakeholder management and can effectively
  communicate technical concepts to non-technical audiences.
  You're proactive in identifying and addressing potential
  issues before they become problems. We look for candidates
  with most or all of the below traits that can point to real
  experience applying them.

  - Bachelor's degree in Computer Science, Engineering, or
    related field, or equivalent practical experience
  - 5+ years of experience with deep expertise in frontend
    development
  - Advanced proficiency in TypeScript and extensive experience
    with React and modern frontend architectures
  - Expert knowledge of HTML5, CSS3 and JavaScript fundamentals
    with a focus on performance optimisation
  - Strong experience designing and implementing RESTful APIs
    and managing complex state, including hands-on experience
    with TanStack Query
  - Experience contributing to and working with design systems
  - Familiarity with backend technologies (Python, Django) and a
    willingness to contribute across the stack. This isn’t a
    hard requirement, but that flexibility matters to us.
  - Experience with CI/CD pipelines (especially GitHub Actions)
    and maintaining high-quality testing practices using tools
    like Storybook/Chromatic, Playwright, and Vitest
  - Proven track record of leading technical initiatives and
    mentoring engineers
  - Strong problem-solving skills with the ability to break down
    complex problems
  - Excellent communication abilities and experience managing
    stakeholder relationships

  Given what we do, experience in financial services, fintech
  and business-to-business organisations is particularly
  interesting to us.

  We hire for range

  What you're like as a person and how you treat people is a
  big deal for us. People love working with you. You're
  helpful and generous with your time and knowledge. People
  love helping you back. People know where they stand with
  you.

  You're always looking to learn and grow, on a personal and
  professional level. And you're always looking to help others
  learn and grow by sharing your own knowledge and experience.

  You know why diversity, equality, inclusion and belonging
  matters, and speak up when we can do better.

  What this role could turn into

  Frontend engineers here tend to grow in a few different
  directions: shaping architecture across multiple products,
  moving into staff or principal engineering tracks, or
  stepping into engineering management. Some engineers want to
  go deep on the technical track; others find their strengths
  pull them toward leading and growing people. We support both
  paths, and the direction depends on where your interests are
  strongest.

  Location and working policy

  📍Fully remote, Europe.

  The good stuff

  25 days off, plus public holidays. Equity - because you
  should own a piece of what you're building. Generous
  parental leave for primary and secondary caregivers. 60 days
  a year to work abroad from wherever you want.

  By submitting your application, you acknowledge that
  Wayflyer Limited will process your personal data for the
  purpose of evaluating your suitability for the role. Such
  processing is based on the need to take steps prior to
  entering into a potential employment agreement. To learn
  more about how we handle your personal data, you can contact
  our privacy team at privacy@wayflyer.com or review our
  privacy notice at https://wayflyer.com/privacy-notice. #LI-
  OC1
