description: |
  Your opportunity:

  Since 2004, we've had one clear goal: to make payments and
  money management effortless for every business in Europe.

  Today, more than 250,000 companies use Mollie to get paid,
  manage money and grow, with products designed to be simple,
  scalable, and dependable.

  With 950+ Mollies across 14+ locations, we care deeply about
  autonomy and craft. So we work in small teams, with real
  ownership, and we trust you to make the right decisions.

  We're building for the long term, so we provide the tools
  you need, processes you can rely on, and a balanced work
  environment to help you do work you're proud of.

  Sound like your kind of place? Let's build together.

  As a hands-on Engineering Manager, you'll lead a team of
  skilled engineers in defining and delivering the technical
  roadmap for our products. Collaborating with cross-
  functional teams, you'll help shape product strategy and
  direction, while representing engineering in key technical
  discussions. Your work will directly influence product
  quality, scalability, and innovation, playing a critical
  role in our overall success.



  What you'll be doing:

  - Lead a growing team of application engineers, with a hands-
    on leadership approach expected from all engineering
    managers
  - Bring strong technical expertise and a proven track record
    in large-scale distributed systems and/or guiding teams
    through complex technical transitions
  - Drive strategic technical decisions in collaboration with
    cross-functional teams, and lead cross-domain technical
    initiatives that align with overall business and product
    goals
  - Identify improvements within the team, propose actionable
    solutions, and coordinate efforts to improve team velocity
    and effectiveness
  - Help shape the broader domain vision, influence strategic
    direction, and set goals for ongoing product improvement
  - Balance hands-on engineering with big picture thinking,
    taking pride in mentoring and developing high performing
    teams
  - Maintain a results driven mindset focused on delivering
    impact at scale and speed



  What you have:

  - Management Experience: Preferably 2+ years of managing
    multidisciplinary teams, with a proven ability to recruit,
    retain, and grow top engineering talent.
  - Leadership Skills: Demonstrated ability to lead, coach, and
    mentor engineering teams. Excellent communication,
    interpersonal, and collaboration skills. You are a great
    active listener.
  - Engineering Excellence: Significant hands-on experience in
    various contexts, building scalable, robust, and fault-
    tolerant systems and full-stack products, preferably on
    the JVM or PHP stacks.
  - Product Sense: A strong understanding of product development
    principles and a customer-centric approach.
  - Bias Towards Action: Balance speed and quality, make quick
    decisions, and learn from mistakes.
  - Problem-Solving Ability: Strong analytical and problem-
    solving skills, with a passion for finding creative
    solutions to complex challenges.
  - Passion and Energy: Demonstrate ownership and enthusiasm,
    seeing new tasks as opportunities to contribute and grow.
  - Always Be Shipping Mindset: It’s about consistently
    delivering value to customers, where speed and quality go
    hand in hand.

  *Kindly note relocation support is not offered for this
  position.
