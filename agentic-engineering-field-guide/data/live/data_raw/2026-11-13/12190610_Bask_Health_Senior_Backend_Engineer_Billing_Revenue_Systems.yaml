description: |
  About Bask Health

  Bask Health is a software platform that enables
  entrepreneurs, doctors, and healthcare businesses to launch,
  manage, and grow direct-to-consumer telehealth businesses.

  Our platform brings together patient experiences, clinical
  workflows, pharmacy operations, and commerce tools in one
  place.

  We're an entrepreneurial, product-focused engineering team
  that values ownership, technical excellence, and building
  software that solves real problems. Engineers work closely
  with product teams and company leadership, take features
  from idea to production, and have a direct role in shaping
  the platform.

  Engineering at Bask is AI-first and builder-led. We use
  tools like Cursor and Claude Code throughout development
  while maintaining high standards for reliability, testing,
  and software quality.

  About the Role

  We're looking for a Senior Backend Engineer, Billing &
  Revenue Systems to design, build, and improve the backend
  infrastructure supporting payments, subscriptions, billing
  workflows, and revenue operations across Bask Health's
  telehealth platform.

  You'll work on systems that connect merchant configuration,
  patient checkout, recurring payments, billing records, and
  financial reporting. Your work will help ensure transactions
  are processed reliably, subscription changes are handled
  correctly, and financial information remains accurate across
  the platform.

  This is a hands-on engineering role requiring strong
  technical judgment, experience with complex backend systems,
  and the ability to independently own projects from
  architecture through production.

  Bask's engineering platform uses TypeScript, Node.js, AWS,
  SST, and SQL databases, with technologies including tRPC,
  Prisma, and Drizzle in our broader stack.

  You'll collaborate with product managers, engineers,
  finance, and operations teams to develop scalable systems
  that support the financial side of running telehealth
  businesses.

  We're looking for someone who understands that billing
  systems need more than functional code. They need accurate
  data, predictable behavior, clear error handling, and
  reliable recovery when something goes wrong.

  What You'll Do

  - Design, develop, and maintain backend services supporting
    billing, payments, subscriptions, and revenue-related
    workflows.
  - Build and improve integrations with payment processors and
    external billing services.
  - Develop APIs and application logic for subscription
    creation, renewals, cancellations, plan changes, and
    payment status updates.
  - Help implement pricing, discount, trial, and billing
    configuration logic across merchant and patient workflows.
  - Design reliable processing for payment events, webhooks, and
    asynchronous billing updates.
  - Build services using TypeScript, Node.js, AWS, SST, and SQL
    databases.
  - Use AWS Lambda, SQS, EventBridge, and related services to
    support event-driven billing workflows.
  - Design database schemas and data models for transactions,
    subscriptions, invoices, billing events, and financial
    records.
  - Develop mechanisms to prevent duplicate charges,
    inconsistent billing states, and lost payment events.
  - Implement retry logic, idempotency, validation, and error
    handling for payment-related operations.
  - Help build reconciliation processes that identify
    discrepancies between internal billing records and
    external payment providers.
  - Improve the reliability, performance, and maintainability of
    existing billing services.
  - Collaborate with finance and operations teams to understand
    billing issues, reporting needs, and operational
    requirements.
  - Work with product managers and engineers to translate
    business requirements into technical designs.
  - Develop internal tools and workflows that make billing
    issues easier to investigate and resolve.
  - Build appropriate access controls, audit trails, and
    safeguards around sensitive billing information.
  - Create automated tests covering billing calculations,
    subscription transitions, payment failures, and other edge
    cases.
  - Investigate production incidents, identify root causes, and
    implement durable fixes.
  - Improve monitoring, logging, alerting, and visibility into
    billing system performance.
  - Review code, provide technical guidance, and contribute to
    engineering standards.
  - Take ownership of complex billing initiatives from design
    and implementation through deployment and production
    support.
  - Use Cursor, Claude Code, and other AI-assisted development
    tools to accelerate development while independently
    validating correctness, security, and maintainability.
  - Help establish reusable billing architecture that supports
    additional products, merchants, and business models.

  Requirements

  - 5+ years of professional software engineering experience,
    including substantial hands-on backend development.
  - Strong proficiency in TypeScript, JavaScript, and Node.js.
  - Experience designing, building, and maintaining production
    backend services and APIs.
  - Professional experience integrating third-party APIs,
    processing webhooks, or building event-driven backend
    systems.
  - Experience working with AWS services and serverless
    architectures.
  - Familiarity with AWS Lambda, SQS, EventBridge, or comparable
    asynchronous processing infrastructure.
  - Strong experience with SQL databases, relational data
    modeling, and database schema design.
  - Experience with modern ORM or database access tools such as
    Prisma or Drizzle.
  - Strong understanding of transactional data integrity,
    consistency, and reliable backend processing.
  - Experience implementing idempotency, retries, error
    handling, and recovery mechanisms for critical workflows.
  - Ability to design backend systems that support complex
    business rules and state transitions.
  - Strong understanding of API security, authentication,
    authorization, and secure handling of sensitive
    information.
  - Experience writing automated tests, debugging production
    systems, and maintaining high software quality.
  - Ability to independently own complex engineering projects
    from architecture through deployment.
  - Experience making architectural decisions and evaluating
    technical tradeoffs.
  - Familiarity with Git, code reviews, CI/CD, and modern
    software development practices.
  - Ability to use AI-assisted development tools effectively
    while independently validating generated code.
  - Strong analytical thinking, attention to detail, and
    problem-solving skills.
  - Excellent written and verbal communication skills.
  - Ability to collaborate with product managers, engineers,
    finance, and operations teams.
  - Comfortable working in a fast-moving environment with
    significant ownership and responsibility.

  Nice to Have

  - Experience building billing infrastructure, payment systems,
    or subscription management platforms.
  - Experience integrating Stripe or similar payment processors.
  - Familiarity with payment intents, webhooks, recurring
    billing, refunds, disputes, or payment reconciliation.
  - Experience working with subscription lifecycle management,
    pricing engines, or usage-based billing.
  - Experience building financial reporting, revenue tracking,
    or billing reconciliation systems.
  - Familiarity with transactional database design and payment-
    related consistency challenges.
  - Experience with SST and serverless application development
    on AWS.
  - Experience with tRPC, Next.js, React, or full-stack
    TypeScript applications.
  - Experience working with multi-tenant SaaS platforms or
    monorepo architectures.
  - Familiarity with PCI DSS considerations, payment security,
    or financial data controls.
  - Experience building internal finance or billing operations
    tools.
  - Experience supporting e-commerce checkout, merchant billing,
    or subscription-based SaaS products.
  - Experience implementing audit logs, operational monitoring,
    and alerting for financial workflows.
  - Experience mentoring engineers or establishing reusable
    backend architecture.
  - Experience using Cursor, Claude Code, or similar AI-assisted
    development tools in production engineering workflows.
