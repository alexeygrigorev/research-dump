description: |
  Behind every investment is a person with ambitions,
  motivations and values. While we know that every client is
  unique, they come to J.P. Morgan Personal Investing for the
  same reason: our straightforward and transparent approach to
  investing, and the trust that 150 years of J.P. Morgan
  heritage brings.  

  J.P. Morgan Personal Investing offers award-winning
  investments, products and digital wealth management services
  to over 275,000 investors in the UK. We built the business
  with innovation as a core part of our ethos to give
  consumers the confidence and clarity to make informed
  investment decisions and achieve their financial goals. 

  Our team is at the heart of this venture, focused on getting
  smart ideas into the hands of our customers. We're looking
  for people who have a curious mindset, thrive in
  collaborative squads, and are passionate about building
  quality software that has a big impact in a rapidly changing
  environment. By their nature, our people are also solution-
  oriented, commercially savvy and have a head for fintech. We
  work in tribes and squads that focus on specific products
  and projects.



  Short Description: Drive innovation and quality in iOS
  engineering, empowering users to achieve their financial
  goals through impactful software.

  Introductory Marketing Language: Join us at J.P. Morgan
  Personal Investing, where your expertise shapes award-
  winning digital wealth management solutions for over 275,000
  UK investors. You’ll be part of a collaborative, innovative
  team that values curiosity, commercial savvy, and a passion
  for fintech. We empower you to make a real impact, offering
  opportunities for growth and skill development. Your work
  will help clients make informed investment decisions, backed
  by 150 years of trusted heritage. Experience a culture that
  thrives on smart ideas, teamwork, and continuous
  improvement.

  Job Summary: As a Senior iOS Engineer in the Personal
  Investing Engineering team, you will design, build, and
  maintain the iOS SDLC toolchain, ensuring compliance and
  reliability. You’ll drive technical initiatives, mentor
  engineers, and act as the go-to expert for iOS platform
  questions. Your focus will be on improving developer
  experience, automating processes, and supporting the
  adoption of new technologies. You will collaborate across
  squads and tribes, contributing to a culture of learning and
  innovation while delivering high-quality software that makes
  a difference.

  Job Responsibilities:

  - Design, build, and maintain the iOS SDLC toolchain to meet
    firm standards
  - Write and maintain Jenkins pipelines (Groovy, Docker, Shell)
    for iOS and engineering tools
  - Keep Xcode, Swift, iOS SDK, and supporting tools updated
    with stable versions
  - Own and optimize a reliable, repeatable release cycle for
    iOS apps
  - Identify and automate gaps and friction in developer
    experience and release processes
  - Take on cross-cutting iOS work beyond single feature teams
    or pillars
  - Define and improve iOS architecture patterns and testing
    strategies
  - Write, maintain, and support Architectural Decision Records
    (ADR) for the iOS platform
  - Track and adopt new iOS technologies and platform features
    where valuable
  - Set up and maintain AI skills for safe and effective use by
    iOS engineers
  - Lead and contribute to technical initiatives that enhance
    the codebase and toolset
  - Own shared core layers of the iOS app, including monitoring,
    feature flags, and networking
  - Act as senior escalation point for incidents, complex bugs,
    and production issues
  - Provide timely guidance and support for iOS technical
    questions across the team
  - Focus on root cause analysis and resolution
  - Collaborate with Security teams to implement controls and
    reduce risk
  - Coordinate and resolve security findings with feature teams
  - Mentor and guide iOS engineers at all levels
  - Review code across iOS projects, maintaining quality and
    fostering learning
  - Share knowledge through sessions and skill-sharing within
    the iOS and Engineering teams

  Required Qualifications, Capabilities, and Skills:

  - English working proficiency for collaboration with the
    London team
  - Significant commercial experience in native iOS mobile
    application development
  - Strong knowledge of Swift, Xcode, and LLVM/Clang build
    systems
  - Expertise in core iOS libraries, frameworks, Swift
    Concurrency, and modern architecture patterns
  - Hands-on experience with Jenkins, Groovy, and Docker for
    CI/CD pipelines
  - Experience owning or improving mobile release processes,
    including signing and provisioning
  - Understanding of mobile application security and regulated
    control environments
  - Strong analytical, debugging, and problem-solving skills for
    complex build, runtime, and production issues
  - Effective communication skills to influence stakeholders
    across Engineering, Security, Product, Operations, and
    partner organizations
  - Curiosity and openness to new ways of working, proactively
    supporting innovation

  Preferred Qualifications, Capabilities, and Skills:

  - Experience in the FinTech sector or highly regulated
    industry
  - Experience building or working with Design Systems (UI
    Development, White-labelling)
  - Appreciation for Accessibility and ability to meet
    Accessibility requirements
  - Experience with React Native or other multiplatform
    solutions
  - Portfolio of apps or GitHub contributions



