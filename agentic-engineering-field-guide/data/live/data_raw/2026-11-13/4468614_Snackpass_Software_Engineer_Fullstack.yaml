description: |
  Our software engineers are determined to build the most fun,
  convenient and social experiences for our customers. We are
  also building products for our restaurant partners to grow
  their customer base and improve their operations.

  At Snackpass, you will talk to customers, find and fix pain
  points on the fly, and build extensive internal tooling to
  support on-the-ground launch operations. You will be
  building a scalable payments platform that handles
  marketplace transactions between users and restaurants:
  automated payouts, promotions, customer analytics and
  acquisition tools, and recommendations.

  We believe operating a brick-and-mortar restaurant should be
  as easy as operating an online Shopify store. Most local
  business still run on legacy systems. At Snackpass, we are
  building the OS for local commerce.
