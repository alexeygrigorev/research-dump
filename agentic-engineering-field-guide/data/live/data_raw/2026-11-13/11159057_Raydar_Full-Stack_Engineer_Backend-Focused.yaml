description: |
  Our client is a seed-stage enterprise software company
  building an AI-native ERP platform for defense
  manufacturing. Founded in 2025, the company has raised $12M
  and grown to a 15-person team tackling the operational and
  financial systems behind mission-critical hardware
  production. This is a ground-floor opportunity to build a
  clean-slate product in a sector seeing generational
  investment.

  We are hiring a backend-focused Full-Stack Engineer to
  architect the data models, APIs, and services behind new
  finance and accounting modules. You will bring domain
  knowledge from ERP, fintech, or accounting software, own
  meaningful greenfield work from design through deployment,
  and help expand the platform from operational inventory and
  supply-chain management into a complete financial reporting
  system.

  What you'll do

  • Design data models for invoicing, payments, P&L reporting,
  and other complex financial workflows

  • Build client-facing APIs that connect the platform with
  HR, payroll, accounting, and other external systems

  • Architect backend services in Python and FastAPI with
  PostgreSQL, choosing thoughtfully between OLAP and OLTP
  approaches

  • Aggregate operational data with labor, subscription, and
  finance inputs to produce reliable reporting

  • Own substantial features end-to-end, from technical design
  and schema decisions through deployment and iteration

  • Contribute to the React frontend when needed while
  maintaining primary ownership of backend systems

  Requirements

  What we're looking for

  • 3 to 7 years of backend or full-stack engineering
  experience building production systems, with 5+ years
  preferred

  • Mastery of Python, FastAPI, PostgreSQL, and GraphQL

  • Experience at an ERP, fintech, or accounting software
  company, including data modeling for invoicing, payments, or
  financial reporting

  • Strong schema design skills and a practical command of
  OLAP versus OLTP trade-offs

  • A track record of driving greenfield features from design
  to deployment, not only maintaining existing systems

  • Fluency with accounting and finance concepts and the
  ability to collaborate directly with domain stakeholders

  Bonus points

  • Experience designing clean, client-facing APIs for
  integrations with HR, payroll, or accounting tools

  • Familiarity with Docker, CI/CD, React, or WebSockets

  • Experience working in defense technology or manufacturing
  software

  Benefits

  Compensation and work model

  • Base salary of $170K to $230K, with potential flexibility
  for exceptional candidates

  • Competitive early-employee equity

  • Full-time position

  • Open to candidates based in the United States, with a
  preference for the West Coast

  • Remote employees attend quarterly team on-sites in San
  Diego

  • Candidates based in San Diego work in the office three
  days per week

  • Visa sponsorship is not available; candidates must be US
  citizens or green card holders
