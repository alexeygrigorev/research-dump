description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  ￼￼

  As a Software Engineer (Full Stack), you will build and
  enhance consumer-facing web applications that power AI-
  driven product discovery, search, recommendation, and
  personalization experiences. You will contribute across the
  full technology stack, with a primary focus on frontend
  development using modern web technologies while
  collaborating on backend services and integrations. Working
  closely with Lead Engineers, Engineering Managers, AI/ML
  Engineers, and Product teams, you will deliver scalable,
  reliable, and engaging digital experiences.

  What you will do:

  - Design and build modern web applications and user
    experiences that power AI-driven product discovery,
    search, recommendation, and personalization capabilities.
  - Own end-to-end delivery of features from design and
    development through deployment
  - Develop reusable UI components and frontend applications
    using React and modern web technologies.
  - Collaborate with AI/ML, Data, and Backend Engineers to
    integrate GenAI, recommendation, personalization, and
    search capabilities into consumer-facing experiences.
  - Integrate frontend applications with APIs, microservices,
    and enterprise platforms to deliver seamless end-to-end
    customer journeys.
  - Contribute to the development of backend services and
    integration layers that support frontend experiences and
    business workflows.
  - Drive improvements in application performance,
    accessibility, scalability, reliability, and overall user
    experience.
  - Participate in design reviews, code reviews, and engineering
    best practices to maintain high-quality software delivery.
  - Leverage AI-assisted engineering tools and practices to
    improve productivity, code quality, and delivery
    effectiveness.

  YOUR TALENT

  - 4+ years of experience building modern web applications and
    digital consumer experiences.
  - Strong experience in React, TypeScript, JavaScript, and
    modern frontend development practices.
  - Experience building responsive, scalable, and high-
    performing web applications with a strong focus on
    usability and user experience.
  - Experience integrating frontend applications with REST APIs,
    microservices, and backend platforms.
  - Good understanding of backend development using Java, Spring
    Boot, API design, and microservices architecture.
  - Experience with search technologies such as Elasticsearch,
    OpenSearch, Azure AI Search, or similar platforms is
    desirable.
  - Experience working with SQL/NoSQL databases, caching
    technologies such as Redis, and event-driven architectures
    such as Kafka.
  - Experience building and deploying applications on cloud
    platforms such as Azure, AWS, or GCP.
  - Good understanding of system design, application
    performance, observability, reliability, and operational
    excellence.
  - Strong collaboration skills and experience working across
    product, design, engineering, data, and AI teams.
  - Exposure to AI/ML, Generative AI, LLMs, conversational
    experiences, or AI-powered applications is a plus.

