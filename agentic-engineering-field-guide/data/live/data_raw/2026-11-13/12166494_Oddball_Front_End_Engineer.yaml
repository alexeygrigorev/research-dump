description: |
  Oddball believes that the best products are built when
  companies understand and value the things they are working
  on. We value learning and growth and the ability to make a
  big impact at a small company. We believe that we can make
  big changes happen and improve the daily lives of millions
  of people by bringing quality software to the federal space.

  We’re looking for a Frontend Engineer to join our VA team,
  building and maintaining the shared components and forms
  that help VA.gov teams ship consistent, accessible
  experiences for Veterans.

  What you'll be doing:

  - Build and maintain reusable front-end components using
    React, JavaScript/TypeScript, and web components
  - Extend and improve the VA Design System component library
    and Forms Library
  - Fix bugs and handle component requests from product teams
    across VA.gov
  - Write automated tests and Storybook documentation for the
    components you ship
  - Meet Section 508 and WCAG 2.2 AA accessibility standards in
    everything you build
  - Work with designers and engineers to turn Figma designs into
    working, accessible code
  - Use AI-assisted development tools such as GitHub Copilot or
    Claude Code to speed up delivery while keeping quality
    high
  - Take part in code reviews, sprint planning, and Agile
    ceremonies

  What you’ll bring:

  - Hands-on experience with React and JavaScript or TypeScript
  - Solid HTML and CSS skills, including accessible, semantic
    markup
  - Understanding of accessibility standards such as WCAG and
    ARIA
  - Experience with design systems, component libraries, or
    form-heavy applications is a plus
  - Familiarity with Stencil, web components, USWDS, or SCSS is
    a plus
  - Familiarity with Storybook and component testing is a plus
  - Familiarity with AI-assisted development tools is a plus
  - Thrives in a remote, collaborative Agile environment and
    genuinely enjoys working with designers and engineers
  - Communicates clearly and openly, whether in a code review or
    a conversation with a non-technical teammate

  - Performs other related duties as assigned

  Requirements:

  - Applicants must be authorized to work in the United States.
    In alignment with federal contract requirements, certain
    roles may also require U.S. citizenship and the ability to
    obtain and maintain a federal background investigation
    and/or a security clearance.

  Education:

  - Bachelor’s Degree

  Benefits:

  - Fully remote
  - Annual Stipend
  - Comprehensive Benefits Package
  - Company Match 401(k) plan
  - Flexible PTO, Paid Holidays

