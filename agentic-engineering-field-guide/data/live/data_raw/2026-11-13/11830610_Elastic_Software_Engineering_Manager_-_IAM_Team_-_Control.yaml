description: |
  Elastic, the Search AI Company, enables everyone to find the
  answers they need in real time, using all their data, at
  scale — unleashing the potential of businesses and people.
  The Elastic Search AI Platform, used by more than 50% of the
  Fortune 500, brings together the precision of search and the
  intelligence of AI to enable everyone to accelerate the
  results that matter. By taking advantage of all structured
  and unstructured data — securing and protecting private
  information more effectively — Elastic’s complete, cloud-
  based solutions for search, security, and observability help
  organizations deliver on the promise of AI.

  What is The Role

  In this role, you will lead the IAM team within the Elastic
  Cloud, guiding an accomplished group as they work to
  modernize our identity and access management systems. You’ll
  have the chance to oversee and support a distributed high-
  performance team that is tackling an ambitious roadmap,
  making a real impact on how we manage user identities and
  access. If you're looking to help shape and improve crucial
  systems while fostering collaboration and innovation, this
  position offers a great opportunity.

  What You Will Be Doing

  - Foster a collaborative and innovative culture within the
    team. Mentor team members to enhance their technical
    skills, setting clear performance expectations while
    monitoring team dynamics. Lead regular meetings to align
    on goals and share updates appropriately.
  - Develop project plans and timelines for IAM initiatives to
    ensure capable execution. Allocate resources appropriately
    to meet project goals while tracking progress and making
    necessary adjustments. Communicate status updates to
    stakeholders and proactively manage risks and address any
    issues that arise.
  - Evaluate and implement emerging technologies to improve IAM
    capabilities. Align technical strategies with overall
    business objectives to ensure cohesive progress. Lead
    technical discussions and decision-making processes within
    the team to foster innovation and collaboration.
  - Engage with key stakeholders to gather requirements and
    insights for IAM projects. Build solid relationships with
    internal teams to ensure seamless integration of IAM
    solutions. Regularly communicate project progress and
    gather feedback to stay aligned on objectives and
    deliverables.
  - Conduct regular performance evaluations for each team member
    to assess their contributions. Offer constructive feedback
    and coaching to promote individual growth and development.
    Recognize and reward noteworthy achievements to inspire
    the team and foster a positive environment.

  What You Bring

  - Bachelor's degree in Computer Science or a related field
  - 8+ years in software engineering
  - 3+ years in identity and access management
  - Experience with cloud-based technologies and architectures
  - Experience with IAM solutions and frameworks
  - Proficiency in software development methodologies
  - Knowledge of cloud security best practices

  Compensation for this role is in the form of base salary.
  This role does not have a variable compensation component.

  At Elastic, our compensation philosophy aims to provide
  fair, competitive and transparent remuneration. Salary
  ranges are established based on a combination of external
  market benchmarks, internal pay equity considerations, and
  the responsibilities and complexity associated with each
  role. This approach helps ensure consistency across
  comparable roles while remaining competitive within the
  relevant labour markets.

  The final compensation offered within the applicable range
  will be determined based on several objective factors,
  including relevant professional experience, level of skills
  and expertise, alignment with the role requirements, and the
  overall scope and complexity of the position.

  The typical starting salary range for this role is:

  307 800 zł—486 900 zł PLN

  Additional Information - We Take Care of Our People

  As a distributed company, diversity drives our identity.
  Whether you’re looking to launch a new career or grow an
  existing one, Elastic is the type of company where you can
  balance great work with great life. Your age is only a
  number. It doesn’t matter if you’re just out of college or
  your children are; we need you for what you can do.

  We strive to have parity of benefits across regions and
  while regulations differ from place to place, we believe
  taking care of our people is the right thing to do.

  - Competitive pay based on the work you do here and not your
    previous salary
  - Health coverage for you and your family in many locations
  - Ability to craft your calendar with flexible locations and
    schedules for many roles
  - Generous number of vacation days each year
  - Increase your impact - We match up to $2000 (or local
    currency equivalent) for financial donations and service
  - Up to 40 hours each year to use toward volunteer projects
    you love
  - Embracing parenthood with minimum of 16 weeks of parental
    leave

