description: |
  Company Description

  You will join a world-class team of engineers and data
  scientists from Facebook, Uber, Amazon and Google. We are a
  fast growing consulting firm based in Toronto with clients
  ranging from leading startups building impactful
  technologies to Fortune 500 companies looking to scale their
  engineering and data capabilities.

  Job Description

  We are looking for an ambitious Jr to Intermediate Fullstack
  Engineer/Developer. You are passionate about technology but
  very pragmatic in the application of it to real-world
  engineering problems. You have experience in launching new
  products and scaling them. Critical thinking and problem-
  solving skills are essential for this role.

  At Ample Insight, you will have a unique opportunity to work
  with best-in-class engineers on large engineering problems,
  and in an environment with small teams and abundant
  opportunities for personal impact and growth.

  Please note that although this role is remote, you are
  required to be located in Canada (preferably in the Greater
  Toronto Region).

  Qualifications

  Responsibilities

  - You will be part of a small but highly impactful team, with
    a large amount of ownership and autonomy for managing
    things directly.
  - You will architect important systems and anticipate
    strategic and scaling-related challenges via thoughtful
    long-term planning
  - You will need to design, prototype, and create solutions
    that support highly reliable, scalable, performant SaaS
    products
  - You will own relationships with other engineering teams and
    collaborate with other functions

  Requirements

  - BS (or MS/PhD) in Computer Science or related engineering
    field involving coding
  - 2+ years of professional software development experience
  - 1+ years of experience working with React, Node, Typescript
  - Solid CS fundamentals with experience across a range of
    disciplines, with one or more area of deep knowledge and
    experience
  - Proven track record of technical expertise at a company with
    a strong engineering culture
  - Experience setting technical strategy for an important
    company initiative
  - Experience with shipping software

  Additional Information

  We have competitive compensation.

  Work on cool projects based on your interests and skills. We
  believe in accountability and NOT micro-management.
