description: |
  Workforce Classification:

  Hybrid



  Join Our Team: Do Meaningful Work and Improve People’s Lives

  Our purpose, to improve customers’ lives by making
  healthcare work better, is far from ordinary. And so are our
  employees. Working at Premera means you have the opportunity
  to drive real change by transforming healthcare.

  Premera is committed to being a workplace where people feel
  empowered to grow, innovate, and lead with purpose. By
  investing in our employees and fostering a culture of
  collaboration and continuous development, we’re able to
  better serve our customers. It’s this commitment that has
  earned us recognition as one of the best companies to work
  for. Learn more about our recent awards and recognitions as
  a greatest workplace.

  Learn how Premera supports our members, customers and the
  communities that we serve through our Healthsource blog:
  https://healthsource.premera.com/.

  As a Software Development Engineer III, you will analyze,
  design, code, test, maintain, debug, and modify software,
  applications, packaged applications, and systems for local,
  networked, web, mobile or cloud based technologies generally
  in an agile team environment.

  This is a hybrid role located on our campus in Mountlake
  Terrace, Washington.

  What you’ll do:

  - Design, build, and maintain CRM capabilities in Microsoft
    Dynamics 365 customer service (Canvas Apps, model-driven
    apps, Power Automate).
  - Support integrations with telephony platforms (e.g.,
    Genesys), Facets, and other internal systems to move
    toward a single-pane-of-glass experience.
  - Build and maintain plug-ins, custom workflows, Power
    Platform components, and data integrations via Dataverse
    and external APIs.
  - Optimize performance, usability, and automation for CSR
    call, chat, and email flows.
  - Enable AI-driven experiences through virtual agents, case
    summarization, and intelligent routing.
  - Monitor, troubleshoot, and improve reliability and adoption
    of D365 features.
  - Confer with stakeholders and IT leaders to understand
    business problems or improvement opportunities and
    identify software solutions.
  - Analyze moderate risk business needs to determine solutions.
    Design solutions on various platforms by studying
    requirements and information needs.
  - Translate moderately complex system requirements into code
    using multiple programming languages and/or tools. Develop
    and modify code and system set-up based on program
    specifications. Apply CICD (Continuous
    Integration/Continuous Deployment).
  - Perform testing using both unit testing and test automation
    and document test results. Participate in testing
    associated with cross-functional project team efforts.
  - Produce appropriate technical documentation and
    notifications for changes to production systems or fixes
    to production problems. Create SDLC (Software Development
    Lifecycle) artifacts.
  - Analyze and resolve moderate risk production problems
    related to assigned applications. Includes performance
    tuning, technical troubleshooting, debugging, call-
    rotation, and root cause analysis.
  - Support project initiatives collaborating with the rest of
    the design team ensuring that development milestones and
    deadlines are met. Begin to provide feedback to peers on
    designs.
  - Provide input to standardization of IT processes and ensure
    application of IT standard processes and requirements.
  - Participate in continuing education opportunities and
    proactively improve your level of knowledge about
    Premera’s business and relevant technologies.

  What you’ll bring:

  Required Qualifications

  - Bachelor’s Degree in Computer Science, Information Systems,
    or a related field.
  - (5) years of software development experience, knowledge of
    software development lifecycle, and skills to utilize one
    or more programming languages.
  - (5) years of any D365 experience.
  - Proficient in Dataverse, Power Apps, Power Automate, Power
    BI, and Dynamics 365 SDK.
  - Experience with Azure services such as Azure Functions,
    Azure ADF, Azure APIM, and Logic Apps to extend and
    integrate D365 capabilities.
  - Experience with data surfacing strategies like PCF, custom
    pages, and virtual entities.
  - Strong understanding of CRM user experience and designing
    for front-line support teams.
  - Ability to work cross-functionally in agile or hybrid
    project environments.
  - Exposure to cloud solutions.
  - Previous experience in an agile environment.

  Preferred Qualifications

  - (5) years of experience as a Dynamics 365/Power Platform
    Engineer, with a focus on customer service.
  - Familiarity with telephony integrations (preferably Genesys
    Cloud CX).
  - Knowledge of Azure Services such as Azure Service Bus, Azure
    Fabrics, and Synapses to extend and integrate Dynamics 365
    capabilities.
  - Familiarity with Azure OpenAI, RAG architecture, or other
    AI-enhanced CRM tools.
  - Knowledge of license tiers and optimization (e.g.,
    Enterprise vs. Professional).
  - Experience using and creating automated test tools.
  - Experience in the healthcare industry or a highly regulated
    environment.

  Knowledge, Skills, and Abilities

  - Demonstrated ability to use technology to solve business
    problems.
  - Proficient application of systems coding and development
    tools, techniques, and practices.
  - Desire and ability to continually improve technical skills.
  - Good written and verbal communication skills and effective
    listening skills.

  Physical Requirements

  The following have been identified as essential physical
  requirements of this job and must be performed with or
  without an accommodation:

  - This is primarily a sedentary role which requires the
    ability to exert up to 10 lbs. of force occasionally
    and/or a negligible amount of force frequently or
    constantly to lift, carry, push, pull, or otherwise move
    objects, including the human body.
  - This role requires the ability to keyboard and to
    communicate clearly and understandably in person and over
    the telephone.

  Premera total rewards

  Our comprehensive total rewards package provides support,
  resources, and opportunities to help employees thrive and
  grow. Our total rewards are more than a collection of perks,
  they're a reflection of our commitment to your health and
  well-being. We offer a broad array of rewards including
  physical, financial, emotional, and community benefits,
  including:

  - Medical, vision, and dental coverage with low employee
    premiums.
  - Voluntary benefit offerings, including pet insurance for paw
    parents.
  - Life and disability insurance.
  - Retirement programs, including a 401K employer match and,
    believe it or not, a pension plan that is vested after 3
    years of service.
  - Wellness incentives with a wide range of mental well-being
    resources for you and your dependents, including
    counseling services, stress management programs, and
    mindfulness programs, just to name a few.
  - Generous paid time off to reenergize.
  - Looking for continuing education? We have tuition assistance
    for both undergraduate and graduate degrees.
  - Employee recognition program to celebrate anniversaries,
    team accomplishments, and more.

  For our hybrid employees, our on-campus model provides
  flexibility to create your own routine with access to on-
  site resources, networking opportunities, and team
  engagement.

  - Commuter perks make your trip to work less impactful on the
    environment and your wallet.
  - Free convenient on-site parking.
  - Subsidized on-campus cafes make lunchtime connections with
    colleagues fun and affordable.
  - Participate in engaging on-site activities such as health
    and wellness events, coffee connects, disaster
    preparedness fairs and more.
  - Our complementary fitness & well-being center offers both
    in-person and virtual workouts and nutritional counseling.
  - Need a brain break? Challenge someone to a game of
    shuffleboard or ping pong while on campus.

