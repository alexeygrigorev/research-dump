description: |
  We are looking for a Fullstack Web Engineer to join the
  Backstage team, passionate about crafting the best developer
  experience for millions of developers in the software
  industry.

  Leveraging our thriving open-source developer experience
  platform, Backstage, our teams are delivering high-impact
  external commercial products that truly up-level the
  industry standard of developer experience. Whether it’s a
  seasoned tech company that wants to build an internal
  developer portal using Backstage, or smaller companies that
  just want to quickly and easily increase developer
  satisfaction, or anything in between - our squads are
  shipping solutions that meet platform engineering needs all
  across the industry.

  About the team

  You will join the Backstage Product Area where you will help
  play an instrumental role in improving the experience of
  developers at our customer companies, in our fast-growing
  open-source community, and at Spotify internally. If you
  want to make a direct impact in helping Spotify become the
  industry leader in developer experience, this is the role
  for you.

  What You'll Do

  Who You Are

  Where You'll Be

  Spotify is an equal opportunity employer. You are welcome at
  Spotify for who you are, no matter where you come from, what
  you look like, or what’s playing in your headphones. Our
  platform is for everyone, and so is our workplace. The more
  voices we have represented and amplified in our business,
  the more we will all thrive, contribute, and be forward-
  thinking! So bring us your personal experience, your
  perspectives, and your background. It’s in our differences
  that we will find the power to keep revolutionizing the way
  the world listens.



  At Spotify, we are passionate about inclusivity and making
  sure our entire recruitment process is accessible to
  everyone. We have ways to request reasonable accommodations
  during the interview process and help assist in what you
  need. If you need accommodations at any stage of the
  application or interview process, please let us know - we’re
  here to support you in any way we can.
