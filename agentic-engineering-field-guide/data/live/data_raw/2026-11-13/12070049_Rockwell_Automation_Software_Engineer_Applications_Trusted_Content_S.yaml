description: |
  Rockwell Automation is a global technology leader focused on
  helping the world’s manufacturers be more productive,
  sustainable, and agile. With more than 28,000 employees who
  make the world better every day, we know we have something
  special. Behind our customers - amazing companies that help
  feed the world, provide life-saving medicine on a global
  scale, and focus on clean water and green mobility - our
  people are energized problem solvers that take pride in how
  the work we do changes the world for the better.

  We welcome all makers, forward thinkers, and problem solvers
  who are looking for a place to do their best work. And if
  that’s you we would love to have you join us!

  Job Description

  We are seeking an experienced Software Engineer,
  Applications to help shape the future of Trusted Content
  within the Trusted Content & Standards team. In this role,
  you will work with product management, operating segment
  stakeholders, customer co-innovation teams, and other
  Rockwell Automation engineering teams to define, develop,
  and scale Trusted Content development capabilities and
  standards that accelerate autonomous operations across
  design, operations, and maintenance workflows.

  The ideal candidate combines strong systems and automation
  engineering experience with curiosity, collaboration, and
  execution discipline. This person is an expert in Rockwell
  Automation technologies and Rockwell Automation product
  applications. This person is comfortable working across
  ambiguity, distilling organizational knowledge into Trusted
  Content methods and standards, and turning emerging ideas
  into repeatable solutions, proofs of concept, and scalable
  practices that support both internal teams and customer-
  facing efforts.

  Your Responsibilities:

  - Standards Development
    - Work with the Trusted Content Organization in addition to
      Operating Segments, Commercial Engineering, Technical
      Consultants to define best practices as standards

  The Essentials - You Will Have:

  - 5+ years of industry experience

  - Strong understanding of Rockwell Automation products like
    Logix, Optix, Application Code Manager, etc.

  - Excellent communication and teamwork skills to collaborate
    effectively with multidisciplinary teams

  - Proven ability to manage multiple tasks and priorities

  - Strong written and verbal communication skills, including
    the ability to present concepts and strategies to fellow
    developers and management

  The Preferred - You Might Also Have:

  - Bachelor's degree in engineering, computer science, or
    related field or equivalent

  - Strong analytical and problem-solving skills for
    interpreting complex data sets

  - Experience in the application of industrial automation

  - 10+ years of industry experience

  - Experience developing software applications for industrial
    automation

  - Experience with maintaining specifications and standards

  - Experience with leveraging and implementing AI workflows

  What We Offer:

  Our benefits package includes …

  - Comprehensive mindfulness programs with a premium membership
    to Calm
  - Employee Assistance Program
  - Personalized wellbeing programs through our OnTrack program

  ... and other local benefits!

  At Rockwell Automation we are dedicated to building a
  diverse, inclusive and authentic workplace, so if you're
  excited about this role but your experience doesn't align
  perfectly with every qualification in the job description,
  we encourage you to apply anyway. You may be just the right
  person for this or other roles.

  #LI-Hybrid

  #LI-PM1

  Ingénieur·e Logiciel Applicatif, Trusted Content Standards

  Nous recherchons une personne expérimentée au poste
  d'Ingénieur·e Logiciel Applicatif afin de contribuer à
  façonner l'avenir du Trusted Content au sein de l'équipe
  Trusted Content & Standards.

  Dans ce rôle, vous collaborerez avec les équipes de gestion
  de produit, les parties prenantes des segments
  opérationnels, les équipes de co-innovation client et les
  autres équipes d'ingénierie de Rockwell Automation afin de
  définir, développer et faire évoluer les capacités et
  standards de développement du Trusted Content. Ces travaux
  visent à accélérer les opérations autonomes dans les
  processus de conception, d'exploitation et de maintenance.

  La personne idéale combine une solide expérience en
  ingénierie des systèmes et de l'automatisation avec
  curiosité, collaboration et rigueur d'exécution. Elle
  possède une expertise reconnue des technologies Rockwell
  Automation et de leurs applications. Elle est à l'aise dans
  des environnements parfois ambigus, sait transformer les
  connaissances organisationnelles en méthodes et standards
  Trusted Content, et convertir des idées émergentes en
  solutions reproductibles, preuves de concept et pratiques
  évolutives au service des équipes internes comme des
  clients.

  PRINCIPALES RESPONSABILITÉS

  Développement des standards

  - Collaborer avec l'organisation Trusted Content ainsi qu'avec
    les segments opérationnels, les équipes Commercial
    Engineering et les consultant·es techniques pour définir
    les meilleures pratiques et les transformer en standards.
  - Favoriser la prise de décision grâce à la collaboration
    entre des équipes pluridisciplinaires.
  - Développer des méthodes permettant de mesurer et d'évaluer
    le respect des standards définis à travers des revues
    automatisées et des contrôles par les pairs.
  - Identifier de nouveaux domaines nécessitant des standards
    afin d'assurer la cohérence des pratiques de développement
    et des solutions livrées.



  Développement de bibliothèques et d'applications

  - Définir des applications et logiciels Trusted Content en
    s'appuyant sur Logix Designer, View Studio, View Designer,
    Optix Studio, les futurs environnements de développement
    Rockwell et d'autres outils d'automatisation afin de créer
    des architectures applicatives optimisées pour les
    applications et cellules de travail.
  - Définir et optimiser des bibliothèques favorisant le
    développement d'applications et de logiciels dans les
    environnements de développement d'automatisation de
    Rockwell Automation.
  - Participer à la veille et promouvoir la connaissance, au
    sein de Rockwell Automation, de l'évolution des standards
    industriels liés au Trusted Content (spécifications OPC UA
    Companion, ISA, exigences constructeurs, etc.).
  - Contribuer au développement et à la priorisation des
    fonctionnalités logicielles et firmware facilitant
    l'intégration des applications Trusted Content dans les
    automates, variateurs et autres produits.
  - Contribuer à la définition de stratégies d'ingénierie
    numérique (jumeaux numériques, génération automatique de
    code et principes de création automatisée de
    bibliothèques) soutenant le développement d'applications
    automobiles.
  - Gérer la propriété intellectuelle au fur et à mesure de sa
    création et participer au développement de brevets liés au
    Trusted Content.
  - Concevoir des systèmes d'automatisation intégrés et
    complexes en s'appuyant sur le Trusted Content et des
    méthodologies modernes.
  - Identifier de nouveaux secteurs industriels et cas d'usage
    pour le Trusted Content et les prioriser selon la
    couverture actuelle des bibliothèques, les écarts à
    combler et les efforts de développement, déploiement et
    support nécessaires.
  - Collaborer avec les membres clés de l'équipe Trusted Content
    afin de piloter, développer et améliorer de nouveaux
    workflows de développement de bibliothèques assistés par
    l'IA.



  Collaboration

  - Travailler en étroite collaboration avec l'équipe Trusted
    Content Innovations pour définir les exigences et examiner
    les livrables.
  - Collaborer avec les équipes Commercial Engineering et les
    consultant·es techniques afin d'anticiper les besoins
    futurs en bibliothèques et solutions Trusted Content pour
    les différentes industries.



  Autres activités

  - Participer aux événements mondiaux tels qu'Automation Fair,
    TechEd ou tout autre événement pertinent.
  - Apporter un soutien sur site aux projets clients ou aux
    projets des segments opérationnels lorsque nécessaire.



  Co-innovation client

  - Collaborer avec les équipes Customer Co-Innovation de T&I
    sur les initiatives liées au Trusted Content.



  QUALIFICATIONS

  - Minimum 5 ans d'expérience dans l'industrie.
  - Excellente connaissance des produits Rockwell Automation
    tels que Logix, Optix, Application Code Manager, etc.
  - Excellentes compétences en communication et en travail
    d'équipe pour collaborer efficacement avec des équipes
    multidisciplinaires.
  - Capacité démontrée à gérer plusieurs priorités et projets
    simultanément.
  - Excellentes compétences rédactionnelles et orales, avec la
    capacité de présenter des concepts et des stratégies à des
    équipes de développement comme au management.



  Qualifications souhaitées

  - Diplôme d'ingénieur·e, d'informatique ou dans un domaine
    connexe, ou expérience équivalente.
  - Solides capacités d'analyse et de résolution de problèmes,
    notamment pour l'interprétation de jeux de données
    complexes.
  - Expérience dans le domaine de l'automatisation industrielle.
  - Plus de 10 ans d'expérience dans l'industrie.
  - Expérience dans le développement d'applications logicielles
    pour l'automatisation industrielle.
  - Expérience dans la gestion et la maintenance de
    spécifications et de standards.
  - Expérience dans la mise en œuvre et l'utilisation de
    workflows intégrant l'intelligence artificielle.

  At Rockwell Automation we are dedicated to building a
  diverse, inclusive and authentic workplace, so if you're
  excited about this role but your experience doesn't align
  perfectly with every qualification in the job description,
  we encourage you to apply anyway. You may be just the right
  person for this or other roles.

