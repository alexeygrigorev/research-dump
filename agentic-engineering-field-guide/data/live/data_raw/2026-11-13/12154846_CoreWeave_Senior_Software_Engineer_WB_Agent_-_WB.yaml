description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  Weights & Biases at CoreWeave

  CoreWeave acquired Weights & Biases to create the most
  powerful end-to-end platform to develop, deploy, and iterate
  AI faster. CoreWeave operates a growing footprint of data
  centers covering every region of the US and across Europe,
  and was ranked as one of the TIME100 most influential
  companies of 2024. By bringing together CoreWeave’s
  industry-leading cloud infrastructure with the best-in-class
  tools AI practitioners know and love from Weights & Biases,
  we’re setting a new standard for how AI is built, trained,
  and scaled.

  The integration of our teams and technologies is
  accelerating our shared mission: to empower developers with
  the tools and infrastructure they need to push the
  boundaries of what AI can do. From experiment tracking and
  model optimization to high-performance training clusters,
  agent building, and inference at scale, we’re combining
  forces to serve the full AI lifecycle — all in one seamless
  platform.

  Weights & Biases has long been trusted by over 1,500
  organizations — including AstraZeneca, Canva, Cohere,
  OpenAI, Meta, Snowflake, Square, Toyota, and Wayve — to
  build better models, AI agents and applications. Now, as
  part of CoreWeave, that impact is amplified across a broader
  ecosystem of AI innovators, researchers, and enterprises.

  As we unite under one vision, we’re looking for bold
  thinkers and agile builders who are excited to shape the
  future of AI alongside us. If you’re passionate about
  solving complex problems at the intersection of software,
  hardware, and AI, there’s never been a more exciting time to
  join our team.

  What You’ll Do:

  ARIA is the AI Research and Iterations Agent that enables
  continuous experimentation at scale. The engineering team is
  responsible for building this research agent from scratch by
  leveraging  distributed backend systems that execute multi-
  turn agent conversations, to the React UI that thousands of
  ML practitioners interact with every day. Our mission is to
  ship a fast, reliable, and delightful agent experience that
  genuinely accelerates ML workflows, and every engineer on
  the team owns that outcome end to end.

  About the role:

  As a Senior Full Stack Engineer on the ARIA Agent team,
  you'll own features and systems across the entire stack —
  from backend infrastructure and API design to the React
  frontend that powers the chat interface, billing UI, and
  agent configuration experience. You'll build and maintain
  the distributed worker systems that run agent conversations
  at scale, design the streaming architecture that delivers
  real-time token output to the browser, and contribute to the
  frontend components that make ARIA feel fast and intuitive.
  You'll collaborate closely with ML science, product, iOS,
  and SRE teams — blending reliability engineering with
  product sensibility. Day to day, you'll move fluidly between
  debugging a production memory leak in a Kubernetes worker,
  shipping a new billing UI component, and hardening the
  egress controls on the code execution sandbox.

  Who You Are:

  - Bachelor’s degree or foreign equivalent in Computer Science,
    Computer Engineering, Data Science, Information Systems,
    or a closely related technical or quantitative field
    involving substantial coursework in Engineering.
  - 4+ years of full stack engineering experience, with
    meaningful depth in both backend services and
    React/TypeScript frontend development.
  - Strong Python backend skills — async patterns, FastAPI,
    distributed state machines, Kubernetes pod lifecycle.
  - Proficient in TypeScript and React; comfortable building and
    maintaining production UI components including real-time
    streaming interfaces, complex state management, and
    responsive layouts across web and mobile web.
  - Experience building and operating services at scale —
    rolling deploys, autoscaling, worker concurrency, graceful
    termination.
  - Experience with observability tooling (Datadog, Weave
    tracing, structured logging) and a track record of
    building dashboards that surface actionable signals.
  - Security-conscious engineering mindset — input validation,
    sandboxed code execution, egress controls, and payload
    hardening.
  - Experience with MySQL or similar RDBMS for transactional
    state management.

  Preferred:

  - Experience building streaming UIs (server-sent events,
    WebSockets) with graceful fallback handling.
  - Background in ML infrastructure, developer tooling, or
    observability platforms.
  - Hands-on experience building and shipping production-grade
    AI agents — including tool use, multi-turn conversation
    management, and agentic reliability patterns.
  - Comfortable thriving in a fast-paced startup environment —
    able to move quickly, make pragmatic tradeoffs, and
    iterate on real user feedback without sacrificing
    production quality.

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren't a
  100% skill or experience match. Here are a few qualities
  we’ve found compatible with our team. If some of this
  describes you, we’d love to talk.

  - You love to turn messy, complex performance problems into
    clear, data-backed stories that lead to concrete action.
  - You’re curious about how systems behave under real-world
    load and enjoy building experiments that reveal what’s
    really happening under the hood.
  - You’re an expert in transforming deep technical insights
    into tools and processes that empower other engineers to
    build faster, more reliable systems.
  - You find satisfaction in long-term, cross-team collaboration
    — helping others succeed by embedding performance thinking
    into their workflows.
  - You get energy from bridging theory and practice: designing
    scalable architectures and writing the code that proves
    them out.
  - You care deeply about measurement, iteration, and continuous
    improvement — not just fixing bottlenecks, but preventing
    them from ever recurring.

  Why Us?

  We work hard, have fun, and move fast! We’re in an exciting
  stage of hyper-growth that you will not want to miss out on.
  We’re not afraid of a little chaos, and we’re constantly
  learning. Our team cares deeply about how we build our
  product and how we work together, which is represented
  through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and provides the opportunity to
  develop innovative solutions to complex problems. As we get
  set for takeoff, the growth opportunities within the
  organization are constantly expanding. You will be
  surrounded by some of the best talent in the industry, who
  will want to learn from you, too. Come join us!

  The base salary range for this role is $182,000 to $242,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

