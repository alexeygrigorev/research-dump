description: |
  At Moxie, we empower ambitious aesthetic entrepreneurs to
  build profitable, independent practices—without burnout,
  overwhelm, or guesswork. In just a few years, we've grown
  from an idea to a global, remote-first team now supporting
  700+ practices nationwide.

  Our purpose is simple: to unlock sustainable success for
  aesthetic entrepreneurs, at every stage of their journey.

  Staff Product Engineer (Backend)

  We're looking for a Staff Product Engineer (Backend) to lead
  some of Moxie's highest-impact projects in Q4 2026 and Q1
  2027, starting on our Financial Operations (FinOps) team.
  Beyond the project work, you'll provide technical leadership
  across the company and own and validate the major
  architectural decisions that shape how Moxie builds. This
  hire is part of a deliberate shift toward direct-hire
  engineers in the Americas, and you'll help set the
  engineering standards for the team

  You'll join FinOps as a core contributor and work day to day
  with Product, Design, and your engineering peers on the
  payments and transactions systems that our customers rely
  on, including our integrations with Stripe, LayerFi, and
  Cherry. You'll work across our middleware and backend
  architecture, key GraphQL schemas, APIs, and data models,
  and

  Our Objectives for the Role

  - Become a primary IC on FinOps by the end of Q4. Within three
    months you're ramped on FinOps workflows, the middleware
    and backend architecture, and Moxie's release practices,
    and you contribute a meaningful share of overall project
    velocity.
  - Ship early wins that make the backend better. In your first
    three months, deliver targeted fixes and improvements that
    raise reliability, performance, or developer experience,
    and address a clear backend pain point raised by
    engineers, product, or our customers
  - Lead a big project from design to production. Take one
    meaningful FinOps project through design, architecture
    review, cross-functional collaboration, and launch, then
    lead a second, more ambitious initiative to a visible
    milestone or production-ready state by month six.
  - Shape architecture across the company. Within three months
    you're ramped to Moxie's system design and architecture,
    and opinionated on what we can do better, and what we
    should build next. You're comfortable developing technical
    proposals, and taking them from draft to review, approval,
    and final implementation.
  - Own non-project technical initiatives and engineering
    culture. Start owning at least one org-level initiative in
    your first three months (for example unit testing
    standards, redesigning our SDLC for the agentic era,
    documentation culture, or the code review process), and by
    month nine own one or two initiatives with measurable
    gains in quality or velocity, while shipping v1 of one or
    more key initiatives.

  We're Looking For

  - 8-12 years of backend engineering experience, including time
    at the senior or staff level leading large initiatives and
    influencing architecture across teams
  - Staff-level backend experience. You've led large, ambiguous
    initiatives as a hands-on IC, owning scope, delivery, and
    tradeoffs, and you want to do it again with clear
    accountability.
  - Depth in financial, payments, or transactions systems.
    You've built and shipped systems where money moves and
    correctness matters, and you can learn a new domain and
    its business context quickly.
  - Strong backend and API design judgment. You're comfortable
    across middleware, GraphQL schemas, APIs, and data models,
    and you can explain the design choices and tradeoffs
    behind them.
  - A record of influencing architecture. You've made and
    defended major architectural decisions, and you balance
    speed, quality, and long-term maintainability when you
    plan with product and engineering leadership.
  - Ownership of engineering standards. You've established or
    matured practices such as unit testing, code review,
    documentation, or SDLC automation, and you lead by
    modeling them.
  - Cross-functional partnership. You work closely with Product,
    Design, and engineering peers, unblock complex decisions
    across teams, and communicate status, risks, and tradeoffs
    clearly.
  - Fluency with AI tooling in daily work. You use AI tools in
    how you build and have a point of view on how AI can
    improve the software development lifecycle. Bonus points
    if you’re opinionated about harnesses, tooling (Ghosty,
    Herdr, Pi, Plannotator, etc), and multi-agent workflows
    and processes.

  This is not a role for someone who wants a narrow, single-
  system scope or a title without hands-on delivery.

  Why Join Us?

  - Real ownership and influence. You'll operate as a high-trust
    IC with a real say in architecture and technical
    direction, on decisions that aren't buried under layers of
    bureaucracy.
  - Ambitious financial systems used by real customers. You'll
    build and ship payments and transactions products at
    meaningful scale, with real complexity and real
    constraints.
  - Shape how engineering works. You'll help set the cultural
    norms and build the processes where they aren't yet in
    place, not just ship features.
  - Staff-level scope without the jump to Principal. You'll work
    close to product, customers, and leadership, with impact
    and leverage over narrow ownership.
  - Above all, we're in this to empower small business owners to
    own and grow their businesses. If you succeed, Med Spas
    will remain the opportunity for independent owner-
    operators instead of being dominated by a small number of
    large chains. If that speaks to you, speak to us.
  - We have much left to build. But given the market feedback
    we're getting and our founding team's company-building
    experience, we think we are writing the first chapters of
    a real success story. Competitive compensation and a fully
    remote role.

  At Moxie, we believe in creating a workplace where everyone
  feels valued, trusted, and included. Our team lives by our
  values: act as owners, give more than we take, move with
  speed and care, and simplify and learn every day.

  We welcome people of all backgrounds, experiences, and
  perspectives to apply. If you require any accommodations to
  fully participate in the interview process, please let us
  know, we’re happy to assist.
