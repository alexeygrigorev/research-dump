description: |
  Overview

  Join an amazing team that is consistently recognized for our
  achievements and culture, including our most recent Forbes
  award of being one of America's Best Midsize Employers for
  2026!

  Position Summary:

  As a Staff Software Engineer, you will provide technical
  leadership and direction for multiple agile teams or
  projects to implement prioritized software product roadmaps.
  This role includes designing, developing, and maintaining
  complex software systems, along with mentoring junior
  engineers.

  Geo-Salary Information

  An in-person interview may be required during the hiring
  process

  State specific pay scales for this role are as follows:

  $101,167 to $204,439 (CA, NJ, NY, WA, HI, AK, MD, CT, RI,
  MA)

  $91,970 to $185,853 (NV, OR, AZ, CO, WY, TX, ND, MN, MO, IL,
  WI, FL, GA, MI, OH, VA, PA, DE, VT, NH, ME)

  $82,773 to $167,268 (UT, ID, MT, NM, SD, NE, KS, OK, IA, AR,
  LA, MS, AL, TN, KY, IN, SC, NC, WV)

  The expected base salary for this position will vary
  depending on a number of factors, including relevant
  experience, skills and location.

  In CA: Typical hiring range is $137,523 to $191,004

  Responsibilities

  Essential Job Functions:

  - Write high-quality code for complex scenarios with good test
    coverage.
  - Review and translate product requirements into robust
    designs to ensure high-quality distributed application
    systems that are modular, configurable, maximize reuse,
    and are fast, effective, user-friendly, secure, compliant,
    scalable, and maintainable.
  - Lead design and code reviews of multiple applications to
    ensure best practices, adherence to Mercury standards, and
    high quality.
  - Lead multiple sprint teams within the same product area to
    deliver new or improved features, addressing any
    impediments in delivering high-quality solutions for items
    in the product backlog.
  - Collaborate with other teams and stakeholders as necessary
    to ensure overall successful delivery of the intended
    functionality.
  - Mentor and provide technical guidance to other engineers
    across multiple teams within the same functional area,
    fostering a culture of innovation and excellence within
    Mercury engineering.
  - Collaborate with product managers to estimate effort,
    prioritize work, plan, and deliver prioritized roadmap
    items.

  Qualifications

  Education:

  Minimum:

  - Bachelor’s Degree in Computer Science, Information Systems
    or other related fields Or equivalent combination of
    education and experience.

  Preferred:

  - Master’s Degree in Computer Science.

  Experience:

  Minimum:

  - 7+ years software engineering experience with proven
    experience in cutting-edge Technologies and/or those used
    at Mercury.
  - 3+ years hands-on experience leading multi-team engineering
    initiatives for building features in a distributed
    application systems environment.

  Preferred:

  - Experience building distributed services using Java, Python,
    Spring Boot, and microservices architectures.
  - Hands-on experience with Apache Airflow and message-queuing
    technologies to orchestrate workflows and build event-
    driven systems.
  - Strong understanding of cloud technologies, containerization
    (such as Docker), and deploying or supporting services in
    containerized environments.
  - Solid foundation in data structures and API
    design/integration, with experience using integration
    frameworks to connect services and systems.
  - Experience working with metadata stores and schema
    registries to manage data definitions, compatibility, and
    discovery across services.
  - Experience driving automation through AI.

  Skills:

  Minimum:

  - Proficient in programming in one or more industry-standard
    languages (e.g., Java, Python, Go, C++, JavaScript).
  - Proficient in leveraging various data structures,
    algorithms, and design patterns. Experienced in relational
    databases, NoSQL, and caching solutions.
  - Skilled in APIs using modern protocols like REST and gRPC.
  - Experienced in message queuing, data streaming, workflow,
    and integration frameworks (such as Apache Kafka, Apache
    NiFi, Amazon SQS, MS MQ, Apache Camel, etc.).
  - Knowledgeable in microservices architecture.
  - Experienced in containerization technologies like Docker and
    Kubernetes. Proficient in cloud platforms such as AWS,
    Google Cloud, or Azure.
  - Experienced in leveraging DevSecOps to improve engineering
    efficiency.
  - Proficient in designing and implementing high-quality
    distributed application systems that are modular,
    configurable, maximize reuse, and are fast, effective,
    user-friendly, secure, compliant, scalable, and
    maintainable.
  - Experienced in leveraging analytics data and experimentation
    to design and improve systems for speed, scalability, and
    effectiveness.
  - Excellent problem-solving skills leading to innovative
    solutions.
  - Strong communication skills. Strong ability to collaborate
    and influence cross-functional teams and stakeholders
    across multiple functional areas to address impediments
    and deliver desired results.
  - Demonstrated leadership skills through mentoring and
    providing technical guidance to multiple teams within a
    functional area.
  - Experienced in championing operational excellence and best
    practices with a focus on quality, performance,
    scalability, maintainability, and observability.
  - Experienced in driving technical strategy and vision for
    multiple teams.

  About the Company

  Why choose a career at Mercury?

  At Mercury, we have been guided by our purpose to help
  people reduce risk and overcome unexpected events for more
  than 60 years. We are one team with a common goal to help
  others. Everyone needs insurance and we can’t imagine a
  world without it.

  Our team will encourage you to grow, make time to have fun,
  and work together to make great things happen. We embrace
  the strengths and values of each team member. We believe in
  having diverse perspectives where everyone is included, to
  serve customers from all walks of life.

  We care about our people, and we mean it. We reward our
  talented professionals with a competitive salary, bonus
  potential, and a variety of benefits to help our team
  members reach their health, retirement, and professional
  goals.

  Learn more about us here:
  https://www.mercuryinsurance.com/about/careers

