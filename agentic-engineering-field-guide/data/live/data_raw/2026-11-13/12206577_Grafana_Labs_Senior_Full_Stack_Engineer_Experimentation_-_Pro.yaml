description: |
  Grafana Labs is the company behind Grafana Cloud, the fully
  managed observability platform trusted by more than 10,000
  organizations to ensure reliability, resolve incidents
  faster, and optimize telemetry at scale. Built on open
  source and open standards and designed for interoperability
  across any stack, Grafana Cloud brings AI to observability
  and observability to AI, giving teams (and their agents)
  unified visibility so they can see, understand, and act on
  all their disparate data, wherever it lives, and move at the
  speed of their ambitions. Customers, including Anthropic,
  Bloomberg, NVIDIA, Microsoft, and Salesforce, rely on
  Grafana Labs. We are a 100% remote company with team members
  across 40+ countries, backed by leading investors including
  Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue,
  J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at
  grafana.com and follow us on LinkedIn and X.

  We’re scaling fast and staying true to what makes us
  different: an open-source legacy, a global collaborative
  culture, and a passion for meaningful work. Our team thrives
  in an innovation-driven environment where transparency,
  autonomy, and trust fuel everything we do.

  You may not meet every requirement, and that’s okay. If this
  role excites you, we’d love you to raise your hand for what
  could be a truly career-defining opportunity.

  This is a remote opportunity and we would be interested in
  applications from the UK, Ireland, Sweden, Spain and
  Germany.

  The opportunity:

  Grafana Labs is building a native experimentation platform:
  a Grafana app that lets teams define A/B tests, connect them
  to feature flags and product telemetry, and get trustworthy,
  statistically sound answers about what their changes
  actually did.

  It started as a hackathon project and is now used by Grafana
  engineering and product teams in our internal environment to
  run real experiments. The next step is to make it a first-
  class product: one we rely on every day internally and, over
  time, one we offer to Grafana Cloud customers alongside
  Frontend Observability, Session Replay and our other user-
  experience capabilities.

  You'll join the Product Analytics team, a group of highly
  technical product analysts who help teams across Grafana
  understand how our products are used and run experiments on
  them. As the team's dedicated software engineer, you'll own
  the engineering of the experimentation app and have a lot of
  influence over where it goes. You'll partner closely with
  data scientists on the statistics, data engineers on event
  pipelines and the data warehouse, software engineers across
  Grafana on feature flags, Frontend Observability and the App
  Platform, and product stakeholders who rely on experiment
  results to make decisions. This is a hands-on engineering
  role that ships production code. It is not an analyst role.

  About the product:

  The experimentation app is built on the Grafana App
  Platform:

  - Frontend: a TypeScript and React app plugin using
    @grafana/ui, plus a custom datasource plugin that powers
    experiment statistics panels.
  - Backend: Go, built with the Grafana App SDK. Experiments are
    Kubernetes-style custom resources defined in CUE, with an
    operator, admission webhooks, and support for declarative,
    GitOps-style management.
  - Feature flags: integration with OpenFeature and the
    OpenFeature Remote Evaluation Protocol (OFREP), Grafana's
    multi-tenant feature toggle service, and an embedded GO
    Feature Flag evaluator.
  - Statistics engine: a Bayesian analysis engine (TypeScript,
    with a Go port) that produces a direction-aware verdict
    per metric, probability to be best, credible intervals,
    expected loss and sample-size recommendations.
  - Data: experiment exposure and outcome events flow from
    product instrumentation through RudderStack into BigQuery,
    or from Grafana Faro into Loki, and are queried live
    through Grafana datasources.
  - AI: experiment authoring assisted by Grafana Assistant,
    which discovers relevant data and drafts the experiment
    configuration for a human to review.

  What You’ll be doing:

  - Evolve the experimentation app from internal tool to
    product. Full ownership of features end to end across the
    React frontend and Go backend, from problem framing and
    design through rollout, measurement and iteration.
  - Build the experimentation experience. Develop intuitive
    workflows for defining hypotheses, configuring experiments
    and metrics, managing their lifecycle, and exploring
    results. Make these experiences useful for product
    managers and analysts as well as engineers.
  - Make instrumentation easier to adopt and trust. Evolve the
    experimentation SDK and its OpenFeature and Faro
    integrations. Help teams connect variant assignment,
    actual exposure, and outcome events with consistent
    identity and event contracts.
  - Connect experiments to the rest of Grafana’s user-experience
    stack. Integrate with Grafana Faro and Frontend
    Observability so flag exposures and outcomes are captured
    automatically, and link experiment results to Session
    Replay and critical user journeys so teams can see why a
    variant won, not only that it won.
  - Harden the statistics and analysis path. Work with our data
    analysts to extend the statistics engine, and make
    analysis scalable, cost-aware and correct. Examples
    include moving computation server-side, scheduled
    analysis, alerting on experiment health, and guardrails
    against misleading results.
  - Use AI where it genuinely helps. Extend the Grafana
    Assistant integration for authoring, explaining and
    reporting on experiments.
  - Raise the engineering bar. Mentor teammates, including
    analysts who contribute code, through code review, pairing
    and design docs. Write the architecture decision records
    (ADRs), docs and demos that help other teams adopt
    experimentation.
  - Own what you ship. Take part in on-call for the services you
    build, and support the internal teams that run experiments
    on them.

  We invest heavily in developer productivity. You can use
  modern AI coding assistants as part of your daily workflow
  (your choice of tools, within security guidelines), backed
  by a company-funded usage budget so you can iterate quickly
  without unnecessary friction. We encourage pragmatic AI-
  assisted development: faster prototyping, test generation,
  refactors, documentation, and incident follow-ups, always
  with strong code review and quality standards. You’ll also
  have access to the latest frontier models from OpenAI,
  Anthropic, and Google.

  What makes you a great fit:

  We highly value people who are intellectually curious,
  default to transparency, have a strong bias towards action,
  and are kind and enjoy working as a team.

  - Strong full-stack engineering experience. You’ve built and
    operated production web applications with TypeScript and
    React, and backend services in Go (or a similar language,
    with willingness to work in Go). You value
    maintainability, automated testing and secure development
    practices.
  - Experience building an in-house platform or integrating
    existing experimentation and A/B testing platform (for
    example Statsig, Eppo, GrowthBook, Optimizely,
    LaunchDarkly experiments, or an in-house platform).
  - Product and data intuition. You care whether what you
    shipped actually moved the needle, and you’re comfortable
    working with event data, SQL and data warehouses such as
    BigQuery.
  - Technical ownership. You’ve delivered complex projects with
    minimal supervision, broken them into short feedback loops
    (analyze, design, ship an MVP, learn, iterate), and helped
    teammates work more effectively.
  - Operational responsibility. You’ve been on call, supported
    software in production, and know how to make systems
    observable and debuggable.
  - Pragmatic AI usage. You use AI coding tools thoughtfully,
    validate their output, and share practices that improve
    the team’s speed and quality.
  - Clear communication. You can explain technical and
    statistical tradeoffs to engineers, analysts and product
    managers in a fully remote, asynchronous environment.

  Bonus Points For:

  - Hands-on experience with feature flags and OpenFeature.
  - A working understanding of experiment statistics: Bayesian
    or frequentist testing, sample sizing, variance reduction,
    and common pitfalls such as peeking and sample ratio
    mismatch.
  - Experience with Kubernetes concepts: custom resources,
    operators, admission webhooks, GitOps.
  - Experience building Grafana plugins or apps, or with the
    Grafana App SDK or Scenes.
  - Familiarity with frontend observability and product
    analytics tooling, such as Grafana Faro, RUM, session
    replay, RudderStack or Segment.
  - Open source contribution or maintainership.
  - Experience as a user of Grafana, Prometheus, Loki or Tempo,
    whether at work or on a homelab.

  Compensation & Rewards:

  In Germany, the base compensation range for this role is
  €100,000 - €125,000. Actual compensation may vary based on
  level, experience, and skillset as assessed throughout the
  interview process. All of our roles include Restricted Stock
  Units (RSUs), giving every team member ownership in Grafana
  Labs' success. We believe in shared outcomes—RSUs help us
  stay aligned and invested as we scale globally.

  *Compensation ranges are country specific. If you are
  applying for this role from a different location than listed
  above, your recruiter will discuss your specific market’s
  defined pay range & benefits at the beginning of the
  process.

  Why You’ll Thrive at Grafana Labs:

  - 100% Remote, Global Culture - As a remote-only company, we
    bring together talent from around the world, united by a
    culture of collaboration and shared purpose.
  - Scaling Organization – Tackle meaningful work in a high-
    growth, ever-evolving environment.
  - Transparent Communication – Expect open decision-making and
    regular company-wide updates.
  - Innovation-Driven – Autonomy and support to ship great work
    and try new things.
  - Open Source Roots – Built on community-driven values that
    shape how we work.
  - Empowered Teams – High trust, low ego culture that values
    outcomes over optics.
  - Career Growth Pathways – Defined opportunities to grow and
    develop your career.
  - Approachable Leadership – Transparent execs who are
    involved, visible, and human.
  - Passionate People – Join a team of smart, supportive folks
    who care deeply about what they do.
  - In-Person onboarding - We want you to thrive from day 1 with
    your fellow new ‘Grafanistas’ to learn all about what we
    do and how we do it.
  - Balance is Key - We operate a global annual leave policy of
    30 days per annum. 3 days of your annual leave entitlement
    are reserved for Grafana Shutdown Days to allow the team
    to really disconnect. *We will comply with local
    legislation where applicable.

  Equal Opportunity Employer: Grafana Labs is an equal
  opportunities employer. We welcome applications from
  everyone regardless of race, colour, nationality, origin,
  caste, sex, gender reassignment identity or expression,
  sexual orientation, age, religion or belief, disability,
  veteran status, genetic information, pregnancy, maternity,
  marital, family or carer status, or any other characteristic
  which is protected by local law. We believe that equality
  and diversity build a strong organisation, and we work hard
  to ensure that is the foundation of our organisation as we
  grow.

  Grafana Labs may utilize AI tools in its recruitment process
  to assist in matching information provided in CVs to job
  postings. The recruitment team will continue to review
  inbound CVs manually to identify alignment with current
  openings.

