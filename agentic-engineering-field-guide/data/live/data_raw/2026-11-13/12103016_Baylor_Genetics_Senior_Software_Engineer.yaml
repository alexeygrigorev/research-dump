  JOB SUMMARY

  Baylor Genetics is a clinical genetic testing laboratory
  that offers a wide range of genetic testing services. Baylor
  Genetics specializes in providing diagnostic testing,
  carrier screening, prenatal testing, as well as cytogenetics
  and biochemistry tests to help healthcare professionals and
  patients understand and manage genetic conditions.

  As we continue to grow and expand our services, we are
  seeking a talented and motivated Senior Software Engineer to
  join our dynamic team. This position will play a paramount
  role in the development and enhancement of our software
  solutions. It requires curiosity, attention to detail,
  technical expertise, and the ability to coordinate and
  communicate with all levels of technologists and the
  business. The successful candidate will work closely with
  geneticists, bioinformaticians, and laboratory professionals
  to create robust software solutions that streamline testing
  and reporting workflows and enhance the overall efficiency
  of our operations.

  KEY RESPONSIBILITES

  - Design, develop, and maintain software applications.
  - Collaborate with cross-functional teams to define software
    requirements, specifications, and architecture.
  - Document system architecture, processes, and workflows to
    ensure maintainability and traceability
  - Troubleshoot and resolve software defects to ensure system
    reliability and data accuracy
  - Contribute to continuous improvement initiatives and
    technical innovation
  - Adhere to the company’s Code of Conduct and all applicable
    compliance, security, and regulatory requirements
  - Perform other duties as assigned to support team and
    organizational objectives.
  - Comply with all company policies, procedures, and applicable
    regulatory requirements.

  QUALIFICATIONS

  Required

  - S. or equivalent degree in Computer Science or related field
  - 5+ years of professional software development experience
  - Strong experience with C# and .NET (e.g., .NET Core / .NET
    6+)
  - Solid experience building frontend applications with React
    and TypeScript
  - Strong experience with MS SQL Server or equivalent
    relational database systems (e.g. PostgresSQL, MySQL),
    including schema design and query optimization
  - Experience designing and consuming RESTful APIs
  - Strong understanding of software architecture, design
    patterns, and best practices
  - Experience with version control systems (e.g., Git)
  - Strong problem-solving skills and ability to work
    independently
  - Equivalent combination of education and experience may be
    considered.

  Preferred:

  - Experience in healthcare, clinical diagnostics, or
    genomics/NGS environments
  - Familiarity with laboratory workflows or clinical reporting
    systems
  - Experience working in regulated environments (e.g., CLIA,
    CAP, HIPAA)
  - Knowledge of CI/CD pipelines and DevOps practices
  - Experience improving performance in data-intensive
    applications

  COMPETENCIES

  - Strong ownership mindset and accountability
  - High attention to detail, especially when handling sensitive
    clinical data
  - Ability to communicate effectively with both technical and
    non-technical stakeholders
  - A collaborative team player with mentorship capability
  - Sound judgment when balancing speed, quality, and regulatory
    considerations
  - Passion for building tools that directly impact patient care

