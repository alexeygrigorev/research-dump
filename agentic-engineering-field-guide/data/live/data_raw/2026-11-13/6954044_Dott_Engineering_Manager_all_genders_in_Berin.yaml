description: |
  TIER-Dott is the European champion of shared micro-mobility.
  Created through the merger of operators TIER and Dott in
  March 2024, the company decided to move forward under the
  name of Dott and integrated all vehicles into the Dott app.
  With the mission to change mobility for good, the team is
  led by CEO Henri Moissinac and President Maxim Romain. TIER-
  Dott facilitates sustainable travel, reduces congestion and
  pollution in cities, and decreases reliance on cars. With
  more than 250,000 shared vehicles in more than 400 cities
  across 21 countries in Europe and the Middle East, the 10
  million users have generated over 400 million rides so far.
  For more information, visit www.ridedott.com

  Permanent employee, Full-time

  As the Engineering Manager for the Rider Experience team,
  you will lead a strategic and highly impactful consumer
  product, directly shaping the future of urban mobility for
  millions of riders, and making our cities greener and
  sustainable. In this role, you will lead a team of talented,
  highly experienced backend and mobile engineers in building
  innovative, functional yet delightful and intuitive
  solutions that shape the everyday mobility experience for
  millions of riders.

  A successful Engineering Manager will bring a unique blend
  of technical leadership, a collaborative management style
  that fosters a high-performing team, and a deep
  understanding of the product understanding that they apply
  across cross-functional product teams. You’ll steer your
  teams towards a product vision and reliable delivery
  anchored on strategic and operational business impact, while
  driving personal and technical growth of your team members.

  This role is a unique opportunity to wear multiple hats,
  from product development to engineering excellence, from
  strategic planning to business understanding, from cross-
  functional collaboration to individual growth.

   WHAT YOU'LL NEED TO SUCCEED

  - Apply your deep understanding of the product in shaping and
    delivering an ambitious and innovative product roadmap
  - Coordinate and drive technical decisions within your team
    and across departments
  - Advise product managers and stakeholders on technical
    feasibility while ensuring timely delivery
  - Inspire and steer your team towards efficient execution of
    company, team, and product strategies
  - Build a high performing Engineering team anchored on
    technical excellence including scalability, reliability,
    and high quality
  - Lead and support the technical and personal growth of
    engineers
  - Set and monitor team objectives, ensuring accountability and
    alignment in the overall software development lifecycle
  - Monitor industry trends, new innovations and help shape the
    overall engineering vision for the Tech organization

  YOU’LL FIT GREAT WITH THESE SKILLS AND QUALIFICATIONS

  - Extensive experience in software engineering (5 - 8+ years),
    with at least 2 years in a technical leadership or
    engineering management role.
  - Deep understanding of modern mobile and/or backend
    development, and working with data at scale
  - Holistic view and understanding of system architecture that
    serves millions of users
  - Proven experience leading teams in a cross-functional
    environment
  - Experience creating and managing career development plans
    for engineers with diverse skill sets
  - Experience building complex consumer product and user
    experiences, from architectural design to delivery
  - Ability to stay up to date with industry best practices and
    emerging technologies, introducing them where relevant
  - Comfortable working in highly collaborative and fast-paced
    environments with multiple stakeholders (engineering,
    design, product, operations)
  - Excellent communication skills – able to explain high-level
    strategy and technical details clearly

  THIS MAY INSPIRE YOU*

  - 💻 Our one time home office bonus upon your start to create
    your ideal home office set up
  - 📚 Our annual learning & development budget
  - 🛴 Our rides program with availability to opt in and opt out
    to ride our e-scooters & e-bikes
  - ☀️ Our partnership for mental health at work, with free 1on1
    video counselling, self-guided development and more
  - 🚀 Our company onboarding
  - 🌴 Our sabbatical program
  - ⏳ Our flexible hours and 1 months remote working option
  - 🏳️‍🌈 Our diversity and inclusivity initiatives and programs
  - 🎉 Our public holiday swap, with which you can switch two
    public holidays to another day
  - 🌍 Our voluntary day off for charity work

  * benefits may vary depending on country and position

  We actively encourage a diverse and inclusive environment
  that fosters each employee’s individuality at Dott. We take
  affirmative action to ensure equal opportunity for your
  application, regardless to your nationality, ethnic or
  national origin, skin color, religion, disability, sex,
  sexual orientation or gender identity. Come as you are and
  join our ride!

  In case you are living with disabilities, chronic illness or
  neurodiversity please inform us, so we can ensure a smooth
  application process.

  If we could spark your interest and you want to change
  mobility for good with us, apply now and let us know why
  you’re the one for the job! We encourage everyone to apply
  and grow with us. Even if you may not tick all the boxes of
  the requirements, we are happy to hear about the value you
  can add to the team. We are all learners!

  We are looking forward to your application!

  At Dott, we respect fundamental privacy rights. We process
  your personal data in accordance with the requirements of
  the General Data Protection Regulation (“GDPR”). For a clear
  explanation of how we handle and process your personal data,
  please read our Candidate Privacy Statement.
