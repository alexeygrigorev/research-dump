title: Senior Frontend Engineer - Hospitality
company: OpenTable
location: Toronto, CAN
work_type: FULL_TIME
company_size: 1,891 Employees
description: |
  This hybrid role requires working in the office two days per
  week. Learn more about our Hospitality team at OpenTable!

  With millions of diners, 70,000+ restaurant partners and 25+
  years of experience, OpenTable, part of Booking Holdings,
  Inc. (NASDAQ: BKNG), is an industry leader with a passion
  for helping restaurants thrive. Our world-class technology
  empowers restaurants to focus on what matters most – their
  team, their guests, and their bottom line – while enabling
  diners to discover and book the perfect restaurant for every
  occasion.

  Every employee at OpenTable has a tangible impact on what we
  do and how we do it. You’ll also be part of a global team
  and its portfolio of metasearch brands. Hospitality is all
  about taking care of others, and it defines our culture.

  We’re hoping that you, a Senior Frontend Engineer, can come
  help us create even more engaging web experiences for our
  restaurant customers. Our applications are written in modern
  React with Hooks and Redux using TypeScript. We test with
  React Testing Library and Cypress, work in Node.js, and
  collaborate closely with backend engineers, product
  managers, designers and delivery managers. This posting is
  for an existing vacancy.

  You’ll help us:

  - Build modern, data-rich guest relationship tools that help
    restaurateurs personalize hospitality, and convert first-
    time diners into loyal regulars
  - Leverage modern AI dev tools (Claude Code, Codex, Cursor,
    etc.) to streamline engineering workflows, shorten build
    cycles, and deliver impactful product iterations faster
  - Enhance and refine our current applications by applying your
    technical knowledge, analytical judgment, and creative
    problem-solving skills
  - Partner as a technical peer with Product and Design to
    understand customer problems and explore solutions
  - Leverage observability tools (Sentry, Grafana) to ensure
    best in class performance and quality

  You’ll fit right in if:

  - You have an empathetic mindset and enjoy working with
    developers, designers and product owners of all career
    levels
  - You have 5+ years of experience with JavaScript or
    TypeScript, and React
  - You can drive projects from technical planning all the way
    to the release
  - You enjoy crafting great accessible and scalable web
    experiences
  - You value testing as a way to ensure a great user experience
  - You embody a growth mindset and enjoy working in a team
    setting
  - You possess an appetite for refining and improving the end
    user experience as well as the developer experience
  - You see communication as the cornerstone of building solid
    applications
  - You embrace modern AI dev tools to multiply your output,
    while applying a 'human-in-the-loop' critical eye to
    ensure generated code meets high standards for
    performance, security, and accessibility
  - You are passionate about the hospitality space and eager to
    make an impact
  - Bonus if you have knowledge of TypeScript, NodeJS and a
    build system like Webpack

  Benefits and Perks

  - Work from (almost) anywhere for up to 20 days per year
  - Focus on mental health and well-being:
    - Company-paid therapy sessions through SpringHealth
    - Company-paid subscription to Headspace
    - Annual company-wide week off a year - the whole team fully
      recharges (and returns without a pile-up of work!)
  - Paid parental leave
  - Generous paid vacation + time off for your birthday
  - Paid volunteer time
  - Focus on your career growth:
    - Development Dollars
    - Leadership development
    - Access to thousands of on-demand e-learnings
  - Travel Discounts
  - Employee Resource Groups
  - 20 days of paid time off
  - Private health and dental insurance
  - Life and Disability insurance

  The best connections happen face-to-face, whether you’re
  sitting down to dinner or having coffee with a coworker.
  That’s why OpenTable has adopted a hybrid workplace model.
  This role aligns with that approach, with an expectation of
  coming into the office two days a week—giving employees the
  best of both worlds: in-person collaboration and
  flexibility.

  The expected range of compensation for this position based
  in Toronto, Canada, including commission and/or bonuses, is
  $140,000-$160,000 CAD. There are a variety of factors that
  go into determining a compensation range, including but not
  limited to external market benchmark data, geographic
  location, and years of experience sought/required.

  We offer a competitive base salary and benefits including:
  health benefits; retirement benefits; life insurance; paid
  time off (including PTO, paid sick leave, medical leave,
  bereavement leave, floating holidays and paid holidays); and
  parental leave benefits. This role is eligible to be
  considered for an annual bonus and equity grant.

  Work Environment & Flexibility

  At OpenTable, we pride ourselves on fostering a global and
  dynamic work environment. As a team member with us, you will
  benefit from a schedule tailored to accommodate a global
  workforce operating across multiple time zones. While the
  majority of your responsibilities may align with
  conventional business hours, there will be instances where
  you are expected to manage communications - via calls, Slack
  messages, or emails - outside of regular working hours to
  effectively collaborate with international colleagues,
  respond to restaurant partners, and/or address urgent
  matters. OpenTable will always abide by and consider local
  laws and regulations.

  Inclusion

  We’re committed to creating a workplace where everyone feels
  they belong and can thrive. We know the best ideas come when
  we bring different voices to the table, so we're building a
  team as dynamic as the diners and restaurants we serve—and
  fostering a culture where everyone feels welcome to be
  themselves.

  If you need accommodations during the application or
  interview process, or on the job, we’re here to support you.
  Please reach out to your recruiter to request any
  accommodations.

