description: |
  Job Description At Boeing, we innovate and collaborate to
  make the world a better place. We're committed to fostering
  an environment for every teammate that's welcoming,
  respectful and inclusive, with great opportunity for
  professional growth. Find your future with us. With more
  than a century of experience, Boeing brings innovative
  solutions to commercial, defense, and space customers around
  the world. For our Commercial Modifications Europe Team we
  are currently searching for you as a Senior Manager
  Engineering, Commercial Modifications (m/f/d) in either
  Dublin, Ireland, Frimley, UK Munich, Germany or Hamburg
  Germany About us Our Commercial Modifications Europe Team
  delivers aircraft retrofit solutions for commercial aviation
  customers. Operating under an EASA Part 21J Design
  Organization Approval, our international team works across a
  range of cabin modification projects. We are expanding our
  senior engineering and airworthiness Team and are looking
  for an experienced leader to develop the team's
  capabilities, ensure strong technical governance, regulatory
  compliance and engineering excellence in support of our
  Connectivity, SIT and Interiors Programs. This role supports
  the Commercial Modifications Europe Chief Engineer and Head
  of Design Organisation to provide functional leadership to
  senior engineering staff and key design assurance personnel,
  while maintaining the framework, processes, and standards
  needed to support a compliant and high-performing
  organization. In this role, you will

  - Lead and provide functional direction to the Chief
    Electrical Engineer, Chief Payloads Engineer, Chief
    Systems Engineer, and Chief Structures Engineer, all of
    whom are senior engineering staff
  - Support the DOA management staff, Deputy COA, and Deputy HDO
  - Maintain and continuously improve the organizational
    framework required to drive compliance, technical
    excellence, and effective engineering governance across
    the design organization
  - Engage with our Connectivity, SIT and Interiors programs to
    ensure that our quality framework is harmonized and
    implemented across all sites.
  - Provide leadership, coaching, and guidance to senior
    engineers and support staff, fostering a culture of
    accountability, collaboration, and professional excellence
  - Oversee functional engineering standards, processes, and
    best practices to ensure consistency and quality across
    Programmes as determined by the HDO
  - Act as a key escalation point for technical, compliance, and
    organizational issues within the engineering function.
  - Work closely with Programme, certification, and operational
    stakeholders to align engineering capability with business
    and customer needs
  - Drive continuous improvement initiatives to strengthen
    engineering performance, compliance, and efficiency in
    alignment with HDO strategy

  Candidate Profile The ideal candidate will be a highly
  experienced aerospace engineering leader with deep technical
  credibility, strong people leadership capability, and a
  proven ability to manage compliance-driven engineering
  organizations. They will be comfortable leading senior
  technical personnel and ensuring the organization maintains
  the structure and discipline required to meet regulatory and
  Programme objectives. What we offer you Benefits Ireland:
  The Boeing benefits package goes above and beyond, focusing
  on your physical, emotional, financial, and social well-
  being. Here's a snapshot of what we offer:

  - Competitive salary and annual incentive plans
  - Continuous learning you'll develop the approach and skills
    to navigate whatever comes next
  - Success as defined by you we'll provide the tools and
    flexibility, so you can make a meaningful impact, your way
  - Inclusive culture you'll be embraced for who you are and
    empowered to use your voice to help others find theirs
  - Excellent Adoption and Parental leave options
  - 25 days plus public holidays and a Winter Break between
    Christmas and New Year
  - Pension Plan with up to 10% employer contribution
  - Company paid Irish Life Medical Plan
  - Short Term Sickness: 100% pay for the first 26 weeks
  - Long Term Sickness: 66.67% of annual salary from 27th week
  - 6x annual salary life insurance
  - Learning Together Programme to support your on-going
    personal and career development
  - Access to Boeing's Well Being Programs, tool and incentives

  Benefits UK: The Boeing benefits package goes above and
  beyond, focusing on your physical, emotional, financial, and
  social well-being. Here's a snapshot of what we offer:

  - Competitive salary and annual incentive plans
  - Continuous learning - you'll develop the approach and skills
    to navigate whatever comes next
  - Success as defined by you - we'll provide the tools and
    flexibility, so you can make a meaningful impact, your way
  - An inclusive culture - you'll be embraced for who you are
    and empowered to use your voice to help others find theirs
  - Excellent Adoption and Parental leave options
  - 23 days plus UK public holidays and a Winter Break between
    Christmas and New Year
  - Pension Plan with up to 10% employer contribution
  - Company paid BUPA Medical Plan
  - Short Term Sickness: 100% pay for the first 26 weeks
  - Long Term Sickness: 66.67% of annual salary from 27th week
  - 6x annual salary life insurance
  - Learning Together Programme to support your on-going
    personal and career development
  - Access to Boeing's Well Being Programs, tool and incentives

  Benefits Germany:

  - Vacation & Personal Time Off: 32 vacation days plus paid PTO
    for life events - recharge when it matters
  - Meal & Transport: Monthly meal allowance of €115 and € 50
    transport credit through flexible apps (including
    Deutschland-Ticket, any form of public transportation,
    e-rollers and bikes, taxis/Uber, fuel/e-charges, and bike
    leasing) to help with daily costs, commuting and personal
    travel
  - Pension & Retirement: Robust pension plan and flexible
    contribution options to support your financial future
  - Income & Insurance Protection: Life insurance at 2x annual
    salary and total occupational disability cover at 1x;
    sick-leave salary gap insurance to bridge social security
    and your pay
  - Global Travel & Medical Coverage: Business-trip insurance
    with International SOS assistance and medical protection
    while abroad - travel with confidence
  - Career Development: Learning Together program funding
    degrees, MBAs, and certifications to grow your skills and
    career
  - Wellness & Support: Employee Assistance and Well-Being
    programs for comprehensive health and mental-wellness
    support

  For a full list of our benefits in Germany please check our
  website as these are changing regularly to match market
  requirements at a local level  What you bring to the table
  Basic Qualifications

  - Minimum of 10 years of experience in the aerospace
    engineering sector
  - Minimum of 5 years of leadership experience, including
    leadership of senior engineering or technical teams.

  - Bachelor's degree or higher from an accredited program in
    aerospace engineering, another safety-critical engineering
    discipline, or a comparable field

  Preferred Qualifications and Experience

  - Experience working within a Design Organisation Approval
    environment
  - Strong understanding of design assurance, airworthiness, and
    engineering compliance frameworks
  - Demonstrated ability to lead senior engineering
    professionals and support functions effectively
  - A servant-leadership approach, with a commitment to
    developing people, enabling collaboration, and supporting
    team success
  - Experience supporting complex aerospace Programmes
  - Familiarity with certification and continued airworthiness
    processes
  - Experience in driving organizational improvement and
    engineering governance across multiple disciplines
  - Chartered Engineer status or equivalent professional
    recognition is desirable.

  Key Competencies

  - Strategic leadership
  - Technical credibility
  - Regulatory and compliance focus
  - People leadership and team development
  - Management of high performing teams
  - Cross-functional collaboration
  - Continuous improvement mindset

  You'll be part of a small, cross-functional team empowered
  to move fast, experiment freely, and build ambitious
  solutions, all while benefiting from the infrastructure,
  network and mentorship available within a mature enterprise.
  If you're ready to tackle exciting challenges in aviation
  and contribute to a team that relentlessly pursues
  excellence, apply online now and help us shape the future of
  air travel; where possibilities are engineered! Applications
  for this position will be accepted until Nov. 23, 2026
  Education Bachelor's Degree or Equivalent Required
