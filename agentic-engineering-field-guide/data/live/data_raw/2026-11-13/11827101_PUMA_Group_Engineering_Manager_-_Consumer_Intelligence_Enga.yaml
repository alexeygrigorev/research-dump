  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Consumer Intelligence & Engagement
  organisation responsible for delivering the intelligence and
  engagement capabilities that enable more relevant and
  personalised consumer experiences across digital channels.
  The organisation plays a key role in how consumers discover
  products, engage with content, and elevate experiences
  through membership & loyalty. Through capabilities such as
  personalisation, recommendations, consumer intelligence,
  experimentation, and AI-driven decisioning, the organisation
  helps deliver more contextual, data-driven interactions
  across the consumer journey.

  The Engineering Manager is accountable for engineering
  delivery, roadmap execution, operational excellence, and
  engineering team development. Partnering with Product
  Owners, Data Engineering & Analytics, Tech Leads, and peer
  engineering teams, you will enable predictable delivery,
  grow engineering talent, and build a high-performing culture
  focused on ownership, accountability, and continuous
  improvement.

  What you will do:

  ·       Lead and develop a team of software engineers
  building product discovery experiences, including search,
  browse, merchandising, recommendations and consumer
  engagement capabilities.

  ·       Enable the delivery of scalable, reliable and
  reusable services that power product discovery, content
  discovery and consumer engagement experiences across digital
  channels.

  ·       Drive continuous improvement of search, browse,
  recommendation and merchandising experiences through
  experimentation, analytics, and consumer behavioral insights
  in collaboration with Product & Merchandising team.

  ·       Partner with Product, Merchandising, Data
  Engineering, and Consumer Experience teams to improve
  product findability, discovery effectiveness, consumer
  engagement, and conversion outcomes.

  ·       Drive planning and execution against team objectives
  and key results (OKRs), ensuring alignment, accountability
  and transparent reporting.

  ·       Own sprint execution, delivery planning, capacity
  management, dependency management, and risk management.

  ·       Drive engineering excellence through strong
  development practices, quality standards, operational
  discipline and continuous improvement.

  ·       Coach engineers through regular feedback, mentoring,
  performance management, and career development.

  ·       Build a high-performing engineering culture focused
  on ownership, accountability, collaboration, and learning.

  ·       Establish effective engineering metrics and use data
  to improve team productivity, quality, and delivery
  predictability.

  ·       Drive adoption of AI-assisted engineering practices
  and automation to improve productivity, quality, and
  delivery efficiency.

  ·       Identify opportunities to leverage AI across
  software development, testing, documentation, knowledge
  management and onboarding.

  ·       Collaborate with engineering leadership on hiring,
  staffing, onboarding, talent development, and succession
  planning.

  ·       Manage delivery partners and vendors where
  applicable and ensure alignment with team objectives.

  YOUR TALENT

  · 10+ years of software engineering experience, with
  experience leading engineering teams in an agile delivery
  environment.

  · 3+ years of people leadership experience.

  · Strong experience leading roadmap execution, delivery
  planning, dependency management, and stakeholder engagement.

  · Strong people leadership skills with experience in hiring,
  mentoring, developing, and retaining high-performing
  engineering teams.

  · Strong understanding of modern software engineering
  practices including software architecture & engineering
  principles, code quality, automated testing, CI/CD, and AI-
  assisted development.

  · Strong communication, collaboration, decision-making, and
  organisational leadership skills.

  · Experience driving engineering quality, operational
  excellence, reliability, security, and continuous
  improvement.

  · Experience working in Agile delivery environments using
  tools such as Jira & Confluence or equivalent.

  · A data-driven mindset with the ability to use engineering,
  delivery, and operational metrics to improve team
  effectiveness and predictability.

  · Experience working with search, browse, recommendations,
  merchandising and product discovery capabilities.

  · Experience working with consumer behavioural data,
  experimentation platforms, product catalogues, search
  technologies, recommendation engines, or personalization
  platforms will be a plus.

  · Experience leveraging coding agents, LLMs, and AI-assisted
  engineering tools to improve software delivery and team
  productivity will be a strong advantage.

  · Experience in global DTC, retail, omnichannel commerce or
  high-volume consumer digital environment preferred.

  · Bachelor's degree in Computer Science, Information
  Technology, Engineering or a related field.

