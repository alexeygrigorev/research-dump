title: Principal Software Engineer (Sign-on bonus available)
company: BAE Systems, Inc.
location: Austin, USA
work_type: FULL_TIME
company_size: 40,000 Employees
description: |
  Job Description  We are looking for a talented, experienced
  software engineer to join our SW Development team to help us
  create the world's most advanced solutions in the area such
  as Electronic Warfare (EW), Signals Intelligence (SIGINT),
  Aircraft Protection, Radar Warning and Electronic Attack
  (EA) for our defense-related customers. Our products provide
  critical mission capabilities to address the ever-evolving
  challenges and threats to our nation's security and the war
  fighter. You will be an integrated team member, with growth
  opportunities, collaborating with Systems, Hardware, and
  Test engineers, primarily in the phases of Development,
  Integration and Testing. This position is customer-facing
  and offers the opportunity for regular customer interaction.
  You will prepare project documentation intended to be used
  within complex programs or across sets of programs in
  accordance with established processes. We will provide you
  opportunities to learn, leverage our current technologies,
  incorporate new technologies, and be a leader in our
  engineering organization. We put our customers first -
  exemplified by our mission: "We Protect Those Who Protect
  Us®."

  - Perform backlog prioritization in coordination with
    management and the customer
  - Work collaboratively in a team environment with both
    internal and external customers to maintain a positive and
    productive work environment
  - Maintain a regular and predictable work schedule.
  - On-time delivery of contract deliverables with acceptable
    quality and 90%+ first pass customer acceptance.
  - Plan/participate in formal software development milestone
    reviews with the engineering team as well as the customer
  - Evaluate complex software designs to identify design flaws.
  - Working with collaborative tools and supporting development
    of an automated digital delivery capability
  - Current BAE Systems employees are ineligible for sign-on
    bonuses.

  Required Education, Experience, & Skills

  - Bachelor's degree in Computer Science or Computer
    Engineering with 6+ years of experience
  - Active Secret Clearance (or active within the last two
    years)
  - Proficient in C++
  - Object Oriented Design/Development
  - Experience with software engineering processes,
    methodologies, and tools
  - Experience performing software testing, validation, and
    verification activities
  - GIT, Jira, Bitbucket, Visual Studio

  Preferred Education, Experience, & Skills

  - Full life-cycle software development
  - Software automated test development and execution
  - Experience with Agile Development and DevSecOps
  - Experience using software tools like Jira, Confluence,
    BitBucket and ClearCase
  - Software/Firmware interface definition development
  - Experience with Embedded Software Development
  - Linux
  - Containerized based SW development
  - I&T Experience
  - EW Software Experience
  - DevSecOps
  - Agile
  - Works well in a team environment

  #ECSSE Pay Information Full-Time Salary Range: $118095 -
  $200762 Please note: This range is based on our market pay
  structures. However, individual salaries are determined by a
  variety of factors including, but not limited to: business
  considerations, local market conditions, and internal
  equity, as well as candidate qualifications, such as skills,
  education, and experience. Employee Benefits: At BAE
  Systems, we support our employees in all aspects of their
  life, including their health and financial well-being.
  Regular employees scheduled to work 20+ hours per week are
  offered: health, dental, and vision insurance; health
  savings accounts; a 401(k) savings plan; disability
  coverage; and life and accident insurance. We also have an
  employee assistance program, a legal plan, and other perks
  including discounts on things like home, auto, and pet
  insurance. Our leave programs include paid time off, paid
  holidays, as well as other types of leave, including paid
  parental, military, bereavement, and any applicable federal
  and state sick leave. Employees may participate in the
  company recognition program to receive monetary or non-
  monetary recognition awards. Other incentives may be
  available based on position level and/or job specifics.
  About BAE Systems, Inc. BAE Systems, Inc. is a defense,
  aerospace, and security company headquartered in Falls
  Church, Virginia, with more than 40,000 employees worldwide.
  We serve, supply, and protect those who protect us. As one
  of the most geographically diverse international defense
  companies, we deliver a full range of products and services
  spanning air, land, maritime, space, and cyber, including
  advanced electronics, intelligence solutions, and dedicated
  customer support. Our culture is performance-driven and
  values-led, built on curiosity, creativity, and
  collaboration. Purpose isn't a tagline here. It's what
  drives us. We're developing breakthrough technologies that
  defend national security and make a lasting impact on our
  communities and our planet. When you join BAE Systems,
  you're not just building a career. You're contributing to a
  mission that truly matters. This position will be posted for
  at least 5 calendar days. The posting will remain active
  until the position is filled, or a qualified pool of
  candidates is identified.
