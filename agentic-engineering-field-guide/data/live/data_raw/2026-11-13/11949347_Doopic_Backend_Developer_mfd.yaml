description: |
  Not just a random job! A world full of possibilities to
  expand your skills, unleash creativity, challenge yourself,
  and exceed expectations. We provide you with the right
  environment and exciting tasks to help you grow. (We are
  especially looking for candidates based in Berlin) Aufgaben
  * You support the development and improvement of our
  existing backend systems and applications as part of our
  development team. * You develop and implement new features,
  focusing on clean, maintainable code, stability, security,
  and performance. * You help identify and fix bugs, optimize
  existing processes, and contribute your own ideas to improve
  our systems. * Testing and maintenance might not always be
  the most exciting tasks, but you understand their importance
  and approach them with care. Qualifikation * You have
  practical experience with object-oriented programming in
  PHP, ideally with Symfony or Zend Framework, and are
  familiar with MySQL databases, JavaScript, and HTML. * You
  have experience developing backend applications and are
  familiar with MVC architecture, Git, and database queries.
  Knowledge of query optimization is a plus. * Basic knowledge
  of front-end development, Linux, Nginx, Docker, deployment
  pipelines, AWS, or image processing tools is not a must –
  but would definitely make us happy! * You communicate
  confidently in German or English, enjoy working in a team,
  and approach your tasks in a structured and solution-
  oriented way. * Experience in e-commerce or image processing
  is a big plus, especially if you’ve worked with automated
  workflows or image processing technologies. Benefits * Every
  day brings new, exciting challenges that we tackle together.
  * We live, love, and nurture our positive work atmosphere.
  For you, this means taking responsibility and continuing to
  develop. * No one scrutinizes you at work. What matters are
  the results, and they are (almost) always fantastic – simply
  because we enjoy our work so much. * Team events, free
  snacks, fruit, coffee, etc., are, of course, standard. * We
  work with the best tools, materials, and colleagues, offer
  flexible working hours and, of course, a competitive salary.
  * Last but not least, we are committed to making you better
  every day and happily invest in seminars and further
  education. Excited to join? Then quickly send us your
  application documents (in German or English), we are looking
  forward to getting to know you.
