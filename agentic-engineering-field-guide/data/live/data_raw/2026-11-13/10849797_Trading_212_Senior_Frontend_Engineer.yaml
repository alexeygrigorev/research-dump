description: |
  Our mission is to enable everyone to build wealth

  We reinvent how trading and investing work by creating
  exceptional products people love.

  That takes high standards, high velocity and engineers who
  own what they ship.

  Today, we serve over 6 million clients, with more than €38
  billion in assets under management. At that scale, frontend
  performance, correctness and clarity are part of the
  product.

  Our frontend platform spans web and mobile: TypeScript,
  React, React Native and React Native Web in an Nx and pnpm
  monorepo, with TanStack Query, Zustand, Playwright, Detox
  and Jest. Around 95% of our code is reused across web and
  mobile.

  About the role

  Senior Frontend Engineers work across our product domains.
  Your team match will reflect your strengths, interests and
  where you can contribute most.

  Across every team, the model is the same: small, autonomous
  groups, a weekly release cycle and ownership from problem
  definition through production.

  What you’ll do

  - Own complex frontend features end to end across web and
    mobile.
  - Design and evolve React and React Native systems, shared
    libraries and durable abstractions.
  - Identify and resolve rendering, state-management, bundle and
    runtime-performance bottlenecks.
  - Use TypeScript to make behaviour explicit and prevent
    defects rather than suppressing type errors.
  - Work closely with product, backend engineering and QA to
    turn complex requirements into simple user experiences.
  - Keep quality high through code review, unit, end-to-end and
    visual-regression testing.
  - Share knowledge, mentor colleagues and raise the frontend
    engineering standard.

  What you need to have

  - Proven ownership of production frontend systems built with
    React or React Native and TypeScript.
  - Strong knowledge of React rendering, component boundaries,
    data flow and state management.
  - A track record of designing maintainable frontend
    architecture and reusable abstractions.
  - Practical experience diagnosing performance problems in
    complex web or mobile products.
  - Sound testing judgement across unit, end-to-end and visual-
    regression coverage.
  - Clear, structured problem-solving and the ability to explain
    technical decisions and trade-offs.
  - Strong engineering fundamentals, product judgement and
    confidence learning unfamiliar technologies.

  Depth in one frontend ecosystem and sound tool choice matter
  more than familiarity with every technology listed.

  What to expect

  - Recruiter conversation
  - Code Review
  - Experience Deep Dive
  - Managerial interview

  Your recruiter will explain each stage clearly and follow up
  after every conversation.

  Bring your ambition to Europe’s fastest-growing mobile
  broker! We thank all applicants, but only candidates
  selected for interview will be contacted. All personal data
  of applicants is protected by law and treated with strict
  confidentiality.
