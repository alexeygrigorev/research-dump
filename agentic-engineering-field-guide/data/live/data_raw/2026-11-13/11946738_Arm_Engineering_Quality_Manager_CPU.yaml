description: |
  I nterested in working with some of the world's most
  advanced processor technologies and helping make them even
  better?  We are looking for an Engineering Quality Manager
  to join our Central Engineering Quality and Compliance team
  and work closely with Arm's CPU teams to improve product
  quality and how we develop, deliver and maintain our IP.
  This role covers the CPU development lifecycle, from
  requirements and design to verification, release and long-
  term maintenance. It involves working directly with
  engineers, reviewing existing practices, using data to
  identify problems and helping teams find better ways of
  working. We value curiosity, technical understanding and
  people who enjoy solving complex problems, asking questions
  and learning new things. There are opportunities to work
  across different teams, explore new methods and tools, and
  contribute your own ideas. What You'll Do

  - Provide independent quality oversight for CPU product
    development and readiness, working with engineering teams
    to identify risks, review evidence and support decisions
    throughout the product lifecycle.
  - Lead quality circles and problem-solving activities,
    contributing to engineering review boards, defect
    investigations, root cause analysis and corrective
    actions. Support urgent customer issues and errata
    resolution, working with teams to assess impact and
    resolve issues.
  - Improve verification effectiveness and engineering quality,
    introducing practical tools and helping teams strengthen
    requirements, design and verification practices to prevent
    problems and detect defects earlier.
  - Use quality data to identify problems and trends, analyzing
    errata, quality metrics and customer feedback to
    understand recurring issues and areas requiring attention.
  - Find ways to simplify development activities, reduce
    unnecessary work and share effective methods and lessons
    learned across Arm.

  What We're Looking For

  - Experience in semiconductor development, verification or
    engineering quality, with an understanding of RTL/VLSI
    design, defect management or complex IP development.
  - Good analytical and problem-solving skills, including root
    cause analysis, risk identification and the ability to use
    engineering data to support decisions.
  - Curiosity about how engineering processes work and an
    interest in finding ways to improve them.
  - Good communication skills, with the confidence to challenge
    experienced engineers constructively, collaborate across
    teams and respond quickly when priorities change.

  Nice to Have Experience in any of the following areas would
  be valuable, but is not essential:

  - CPU architecture, semiconductor productization or
    hardware/software integration.
  - Engineering standards, Quality Management Systems,
    Functional Safety, Automotive Quality or Cybersecurity.
  - Engineering quality metrics, data analytics, AI or
    automation tools.

  We welcome candidates from different engineering
  backgrounds. Experience in every area listed above is not
  required.  Salary Range: $249,900-$338,100 per year We value
  people as individuals and our dedication is to reward people
  competitively and equitably for the work they do and the
  skills and experience they bring to Arm. Salary is only one
  component of Arm's offering. The total reward package will
  be shared with candidates during the recruitment and
  selection process. Our 10x Mindset At Arm, we believe
  progress happens when people are empowered to think bigger
  and push beyond what seems possible. Our 10x mindset is
  about curiosity, ambition and creating impact that will be
  used by millions. We learn fast, prioritise collaboration
  and turn bold ideas into real technology. We look for people
  who are inspired by this way of working and want to grow in
  an environment where bold ideas are welcomed. Discover how
  the 10x mindset shapes life at Arm:
  https://careers.arm.com/10x-mindset Use of AI in Your
  Application At Arm, we embrace the benefits AI can bring,
  including in recruitment. You may use AI to support your
  preparation, such as improving the clarity of written
  responses, practicing interview questions, or learning more
  about our industry. However, your application and interview
  responses must reflect your own thinking, experience, and
  abilities. We want to understand your authentic perspective,
  creativity, and approach to problem solving. As such, you
  may not use AI to complete assigned tasks as part of any
  assessments. If you plan to use AI-supported or assistive
  technologies as part of a reasonable adjustment, please
  contact accommodations@arm.com so we can support you.
  Recruitment Adjustments and Accommodations At Arm, we want
  to build extraordinary teams. If you need an adjustment or
  an accommodation during the recruitment process, please
  email accommodations@arm.com . To note, by sending us the
  requested information, you consent to its use by Arm to
