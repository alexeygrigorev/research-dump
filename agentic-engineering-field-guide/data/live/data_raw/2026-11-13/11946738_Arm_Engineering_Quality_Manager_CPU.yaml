  Although this is not an exhaustive list, examples of support
  include breaks between interviews, having documents read
  aloud, or office accessibility. Please email us about
  anything we can do to accommodate you during the recruitment
  process. Hybrid Working Arm's approach to hybrid working is
  designed to create a working environment that supports both
  high performance and personal wellbeing. We believe in
  bringing people together face to face to enable us to work
  at pace, whilst recognizing the value of flexibility. Within
  that framework, we empower groups/teams to determine their
  own hybrid working patterns, depending on the work and the
  team's needs. Details of what this means for each role will
  be shared upon application. In some cases, the flexibility
