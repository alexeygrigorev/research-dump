description: |
  We are looking for an engineering manager to join our team.

  Miaplaza is dedicated to making education engaging and
  accessible through innovative online learning platforms. We
  develop personalized learning experiences for students,
  helping them grow in a supportive and interactive
  environment. Our vision is to elevate online learning by
  applying the most successful approaches in virtual education
  to create an accessible and inclusive education curriculum
  platform where all students can be successful!

  As an engineering manager at Miaplaza, your team will build
  technology with a direct impact on the lives of hundreds of
  thousands of students. Every step of the way, you will have
  the opportunity to influence our direction. Through our
  platforms, we create engaging, safe, and thoughtfully
  designed learning experiences that help children grow
  academically, creatively, and personally. Every feature we
  ship, every system we scale, and every improvement we make
  contributes to shaping how the next generation learns and
  discovers their potential.

  What you’ll work on:

  We’re a C# and Vue.js platform growing towards a scale that
  no longer matches our legacy architecture. You’ll need to
  work with your team balancing both product and engineering
  initiatives. You’ll report to our head of engineering and be
  expected to split your time roughly 50/50 between people
  management and hands-on development. Prioritization always
  goes to leading and supporting your engineers. Depending on
  the team that matches you best, your team will consist of
  roughly 3-7 engineers split between Eng I, Eng II, and
  senior levels.

  Minimum Requirements:

  - Bachelor’s degree or equivalent practical experience.
  - 1+ years leading a team, formally or as a tech lead
  - 2+ years of experience being a mentor/leader
  - 7+ years of experience in software development in one or
    more object-oriented programming languages
  - 3+ years of experience with front-end software development
    in a reactive front-end framework
  - 3+ years of experience with software architecture
  - 3+ years of experience operating at a Senior, Staff, or
    Principal Engineer level.
  - Experience working directly with product and design on
    scoping and prioritization
  - Experience being on-call and resolving production incidents

  What makes you stand out:

  - Experience leading a team through a significant
    architectural migration
  - Experience with consumer platforms at scale
  - Experience building in regulated environments
  - Extensive senior front-end development experience

  Responsibilities:

  - Work with your teams to design, develop, and maintain
    scalable and reliable web applications using primarily C#
    and Vue.js
  - Collaborate with your product trio (PM, UX, EM), product
    leadership team, and other EMs to scope, prioritize, and
    deliver features that matter to students and families
  - Set the quality bar for your team. You'll have dedicated
    capacity for reliability and architecture work rather than
    fitting it around feature delivery, and a strong say in
    where that capacity goes.
  - Manage, lead, and mentor your team while working side by
    side with them in code quality, clean architecture, soft
    skills, best practices, etc
  - Lead team trainings, set SMART goals, hold performance
    reviews, and provide individual feedback recurrently to
    each of your devs

  We offer*:

  - Flexible working format - remote, office-based or flexible
  - A competitive salary and good compensation package
  - Personalized career growth
  - Professional development tools (mentorship program, tech
    talks and trainings, centers of excellence, and more)
  - Active tech communities with regular knowledge sharing
  - Education reimbursement
  - Memorable anniversary presents
  - Corporate events and team buildings
  - Other location-specific benefits

  *not applicable for freelancers
