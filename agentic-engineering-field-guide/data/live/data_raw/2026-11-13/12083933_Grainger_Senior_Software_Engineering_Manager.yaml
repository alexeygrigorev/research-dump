description: |
  Work Location Type: Hybrid  Req Number 336255 About Grainger
  W.W. Grainger, Inc. is a leading broad line distributor with
  operations primarily in North America and Japan. At
  Grainger, We Keep the World Working® by serving more than
  4.6 million customers worldwide with maintenance, repair and
  operating (MRO) products and value-added solutions delivered
  through innovative technology and deep customer expertise.
  Known for its commitment to service and purpose-driven
  culture, the Company reported 2025 revenue of $17.9 billion.
  For more information, visit www.grainger.com. Compensation
  The anticipated base pay compensation range for this
  position is $146,200.00 - $243,600.00. This role is eligible
  for an incentive target of up to 20% or $, based on the
  achievement of individual and company performance objectives
  in accordance with the current terms of the incentive
  program which are subject to change. Rewards and Benefits
  With benefits starting on day one, our programs provide
  choice and flexibility to meet team members' individual
  needs, including:

  - Medical, dental, vision, and life insurance plans with
    coverage starting on day one of employment and 6 free
    sessions each year with a licensed therapist to support
    your emotional wellbeing.
  - 23 paid time off (PTO) days annually for full-time employees
    (accrual prorated based on employment start date) and 6
    company holidays per year.
  - 6% company contribution to a 401(k) Retirement Savings Plan
    each pay period, no employee contribution required.
  - Employee discounts, tuition reimbursement, student loan
    refinancing and free access to financial counseling,
    education, and tools.
  - Maternity support programs, nursing benefits, and up to 14
    weeks paid leave for birth parents and up to 4 weeks paid
    leave for non-birth parents.


  For additional information and details regarding Grainger's
  benefits, please click on the link below:
  https://experience100.ehr.com/grainger/Home/Tools-
  Resources/Key-Resources/New-Hire Grainger Benefits The pay
  range provided above is not a guarantee of compensation. The
  range reflects the potential base pay for this role at the
  time of this posting based on the job grade for this
  position. Individual base pay compensation will depend, in
  part, on factors such as geographic work location and
  relevant experience and skills. The anticipated compensation
  range described above is subject to change and the
  compensation ultimately paid may be higher or lower than the
  range described above. Grainger reserves the right to amend,
  modify, or terminate its compensation and benefit programs
  in its sole discretion at any time, consistent with
  applicable law. Position Details We are seeking a Senior
  Engineering Manager to lead part of Order Channels, where we
  build the experiences customers use to place orders on
  Grainger.com. In this role you will directly lead the
  Customer Order Entry (COE) team, which owns the checkout
  experience on Grainger.com. You will also manage the
  Engineering Manager who leads the Cart Experience team.
  Together, these teams own the path from a customer's cart
  through a submitted order. This role reports to the Senior
  Director of Engineering. This is an area where even small
  changes that reduce friction for our customers can have a
  big impact on what they end up purchasing and on how quickly
  and easily they can make decisions. That ease is core to
  Grainger's value proposition. You will lead the work to keep
  optimizing these experiences, partnering closely with a
  shared Product Manager, a UX lead, and the domain's
  architects. You will be accountable for the delivery,
  operational health, and growth of both teams. That means
  setting clear direction, keeping checkout and cart reliable
  in production, and making sound technical trade-offs
  alongside product and architecture. You will also coach your
  Engineering Manager and grow the engineers across both
  teams. We are looking for an experienced engineering leader
  who has led managers, is comfortable with both the people
  and the technical sides of the job, and can align teams that
  share a customer journey around a common set of priorities.
  You Will

  - Leads multiple software engineering teams through managers,
    technical leads, and senior engineers by establishing
    organizational priorities, developing leadership
    capability, setting clear performance expectations,
    advancing AI fluency and adoption of AI-enabled
    engineering practices and fostering an inclusive,
    collaborative, and high-performing engineering culture.

  - Partners with Product Management, Architecture, User
    Experience, Security, Site Reliability Engineering, and
    business stakeholders to define engineering strategies,
    align delivery priorities, execute product roadmaps, and
    ensure technology investments support business objectives
    and customer outcomes.

  - Directs the design, development, testing, deployment, and
    operational support of software products while ensuring
    solutions meet enterprise standards for quality, security,
    scalability, reliability, performance, maintainability,
    and operational resilience.

  - Establishes engineering governance by promoting modern
    software engineering practices, Agile delivery, DevSecOps,
    CI/CD, AI-assisted software engineering practices,
    automated testing, observability, code quality standards,
    and architecture alignment to improve engineering
    productivity and delivery effectiveness.

  - Monitors engineering performance through operational,
    delivery, quality, customer experience, and financial
    metrics by managing capacity, mitigating delivery risks,
    improving operational health, and driving continuous
    improvement across the software development lifecycle.

  - Develops organizational capability by leading workforce
    planning, succession planning, technical talent
    development, vendor partnerships, technology modernization
    initiatives, and continuous learning to ensure the
    engineering organization can effectively deliver current
    and future business priorities.


   You Have

  - Bachelor's Degree Computer Science, Software Engineering,
    Information Technology, Computer Engineering, or a related
    technical field, or equivalent required

  - Master's Degree in related technical field preferred

  - 7+ years progressive experience leading software engineering
    organizations responsible for enterprise application
    development, product engineering, or digital technology
    delivery. required

  - 5+ years Experience managing engineering managers, technical
    leads, or multiple Agile software development teams in
    complex technology environments. required

  - 3+ years Experience delivering cloud-based software
    solutions using Agile methodologies, DevSecOps practices,
    CI/CD pipelines, and modern software engineering
    frameworks. preferred

  - Ability to lead multiple engineering teams responsible for
    software delivery, operational support, technology
    modernization, engineering governance, and continuous
    improvement.

  - Knowledge of engineering operations, delivery governance,
    workforce planning, financial management, vendor
    management, software quality, application security, and
    technology risk management within enterprise technology
    organizations.

  - Ability to influence senior technology and business leaders,
    develop engineering leadership capability, coach managers
    and technical leaders, and drive organizational
    improvements that strengthen engineering effectiveness and
    customer outcomes.

  - Strong communication, prioritization, and strategic planning
    skills with the ability to balance delivery commitments,
    operational needs, and long-term transformation goals.


  Position is not eligible for visa sponsorship  As part of
