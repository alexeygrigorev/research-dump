  protected veteran status or any other protected
  characteristic under federal, state, or local law. We are
  proud to be an equal opportunity workplace. We are committed
  to fostering an inclusive, accessible work environment that
  includes both providing reasonable accommodations to
  individuals with disabilities during the application and
  hiring process as well as throughout the course of one's
  employment, should you need a reasonable accommodation
  during the application and selection process, including, but
  not limited to use of our website, any part of the
  application, interview or hiring process, please advise us
  so that we can provide appropriate assistance.
