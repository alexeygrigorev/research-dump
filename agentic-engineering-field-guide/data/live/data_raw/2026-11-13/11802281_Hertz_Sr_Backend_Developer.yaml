description: |
  Come join us in our effort to digitally transform Hertz!
  Recent innovations such as smartphones, electric vehicles,
  and ride-hailing apps have created new and exciting
  opportunities in transportation that Hertz is uniquely
  positioned to capitalize on. We’re looking for software
  engineers who will modernize Hertz’s tech stack and, in the
  process, ship delightful products to meet the ever-
  increasing demands of our customers.


  What you will do: •    Design, implement and maintain Java
  based applications that can be high-volume and low-latency •
  Contribute to all stages of software development lifecycle •
  Analyze user requirements to define business objectives •
  Envisioning system features and functionality Develop and
  test software •    Identify and resolve any technical issues
  arising •    Create detailed design documentation •
  Propose changes to current infrastructure •    Develop
  technical designs for application development •    Write
  well designed, testable code •    Conduct software analysis,
  programming, testing, and debugging •    Support continuous
  improvement, investigating alternatives and technologies,
  and presenting for architectural review

  What We're Looking For: •    A four-year degree or more in
  Computer Science, Software Engineering, or a related field.
  •    7+ years of overall engineering experience. •
  Proficiency in one or more programming languages and common
  data structures /algorithms •    Ability to design systems
  of large complexity •    Ability to act at tech lead for
  projects end-to-end. •    Experience developing in the cloud
  platform using native cloud technologies and also building
  cloud agnostic technologies •    Modern development
  practices like Test driven development, Clean code •
  Strong communication skills. •    Ability to collaborate
  with cross-functional partners to gather requirements and
  explain outcomes •    Strong product sense to align your
  work with business objectives and make appropriate
  tradeoffs. •    Learning mentality. You must be able to pick
  up new skills as needed and demonstrate a curiosity about
  new technologies


  What You’ll Get: •    40% off any standard Hertz Rental •
  Paid Time Off •    Medical, Dental & Vision plan options •
  Retirement programs, including 401(k) employer matching •
  Paid Parental Leave & Adoption Assistance •    Employee
  Assistance Program for employees & family •    Educational
  Reimbursement & Discounts •    Voluntary Insurance Programs
  - Pet, Legal/Identity Theft, Critical Illness •    Perks &
  Discounts –Theme Park Tickets, Gym Discounts & more


