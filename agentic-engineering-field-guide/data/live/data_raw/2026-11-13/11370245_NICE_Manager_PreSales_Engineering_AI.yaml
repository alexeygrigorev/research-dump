description: |
  At NiCE, we don’t limit our challenges. We challenge our
  limits. Always. We’re ambitious. We’re game changers. And we
  play to win. We set the highest standards and execute beyond
  them. And if you’re like us, we can offer you the ultimate
  career opportunity that will light a fire within you.

  So, what's the role all about?

  NiCE Cognigy is looking for a Manager, PreSales Engineering,
  AI to lead our Sales Engineering team across three of our
  fastest-growing continental European markets: Benelux,
  France, and Nordics.

  This is a hands-on, frontline manager role. You'll stay
  close to the business - personally engaging in strategic
  deal support alongside your team - while carrying direct
  responsibility for market penetration, lead generation, and
  building thought leadership as we scale in these regions.

  You'll lead a team of 5-6 Sales Engineers who provide
  technical demos, support discovery calls, answer technical
  RFPs, and actively support events across Benelux, France,
  and Nordics, and you'll report to our Senior Director,
  PreSales Engineering, AI.

  How will you make an impact?

  - Act as a hands-on, frontline manager - staying close to the
    business and personally engaging in strategic deal support
    alongside your team, rather than managing from a distance.
  - Own market penetration for Benelux, France, and Nordics,
    turning your team's efforts into sustained new-business
    growth across these emerging regions.
  - Drive lead generation initiatives that build qualified
    pipeline in these markets, working closely with marketing
    and regional sales.
  - Build and scale thought leadership for the team across
    Benelux, France, and Nordics, positioning Cognigy as a
    trusted authority as these regions grow.
  - Lead the Sales Engineering team, making sure demo pitches
    and other activities are prioritized correctly.
  - Take the presales lead on RFPs, making sure they're
    delivered on time together with the Bid Manager in region.
  - Approach opportunities holistically - bridging technical
    capabilities with solution requirements and business
    impact, including customer experience and ROI.
  - Support customer success with upsell opportunities by
    spotting strategic openings.
  - Engage with a broad range of customer and partner
    stakeholders, from hands-on technical contacts to VP
    level, identifying champions and building relationships.
  - Delegate work and prioritize team activities with full
    autonomy.
  - Liaise with regional sales and customer success leaders.
  - Stay on top of the competitive landscape, comparing our
    software with other conversational AI products on the
    market.
  - Facilitate internal training so the team stays sharp and up
    to date.

  Have you got what it takes?

  - Experience in enterprise software, ideally with contact
    center or automation technologies - whether at a software
    company or building custom solutions.
  - Proven “team lead” or manager experience: leading a team,
    running regular 1:1s, and genuinely understanding what
    your people need.
  - The ability to coach individuals and build a high-performing
    team, backed by a solid foundational understanding of
    technology and AI.
  - A drive to stay current and share knowledge across the team
    in a fast-changing environment.
  - Comfort dealing with pressure - tight presentation
    deadlines, unexpected team gaps, and everything in
    between.
  - Deep understanding of Conversational AI technologies,
    including GenAI, LLMs, speech-to-text (STT), and text-to-
    speech (TTS) solutions.
  - Familiarity with agentic AI concepts such as RAG, MCP and
    A2A communication.
  - Strong selling skills - qualifying opportunities, building
    rapport, and demonstrating NiCE Cognigy's value with
    confidence.
  - Excellent communication skills, with the ability to
    collaborate across functions and lead a team successfully,
    including full people-management responsibilities.
  - A curious, adaptable mindset - you stay on top of the latest
    trends in conversational AI and love learning new things.

  What’s in it for you?

  Join an ever-growing, market disrupting, global company
  where the teams - comprised of the best of the best - work
  in a fast-paced, collaborative, and creative environment! As
  the market leader, every day at NICE is a chance to learn
  and grow, and there are endless internal career
  opportunities across multiple roles, disciplines, domains,
  and locations. If you are passionate, innovative, and
  excited to constantly raise the bar, you may just be our
  next NICEr!

  About Cognigy

  NiCE Cognigy delivers AI that works - fast, human, and
  enterprise-ready. As the leading AI-first CX platform built
  for real-world scale, we combine Generative and
  Conversational AI through orchestration, tools, and
  enterprise systems to power Agentic AI. Backed by global CX
  leader NiCE, we empower brands with AI Agents that redefine
  customer experiences and achieve measurable ROI- instantly,
  across every channel and in 100+ languages.

