description: |
  Join the Tilt team

  At Tilt, we see a side of people that traditional lenders
  miss. Our mobile-first products and machine learning-powered
  credit models look beyond credit scores, using over 250
  real-time financial signals to recognize real potential.
  With millions of customers worldwide, we're not just
  changing how people access financial products — we're
  creating a new credit system that backs the working,
  whatever they're working toward.

  The Opportunity: Senior Software Engineer, Backend

  We’re looking for Senior Backend Engineers who care about
  building scalable, reliable systems - and who thrive in a
  collaborative environment. You’ll join one of several
  product or infrastructure teams, each tackling challenges
  from decisioning to payments to APIs. Wherever you land,
  you’ll work on projects that are high-impact, technically
  challenging, and deeply rewarding.

  Tilt is a remote-first company. We drive connectivity
  through regular company offsites. Travel for company
  offsites is expected at a minimum 2 times a year.

  How You’ll Make an Impact

  - Design and scale backend systems that power our consumer
    facing products
  - Build and refine APIs that deliver instant, seamless
    experiences.
  - Collaborate with product, credit/finance, compliance,
    support, and analytics teams.
  - Contribute to technical discussions, code reviews, and
    roadmap planning.
  - Drive continuous improvement in code quality, security, and
    operational excellence.
  - Share knowledge, mentor peers, and contribute to engineering
    best practices.

  Why You’re a Great Fit

  - 3+ years of backend engineering experience (we know careers
    don’t all look the same — if you’re close, let’s talk).
  - Experience with .NET (C#), or similar frameworks
  - Experience scaling consumer-facing products with significant
    transaction volumes
  - A collaborative problem-solver who values inclusion,
    feedback, and continuous learning.
  - Able to effectively leverage AI-powered development tools
    (e.g., Cursor, Augment, Factory) to enhance productivity,
    code quality, and collaboration

  Don’t meet every qualification? We care about potential over
  your past. If you're bringing ambition and drive to what
  we're building, we want to hear from you.

  What you'll get at Tilt

  - Virtual-first teamwork: The Tilt team is collaborating
    across 14 countries, 12 time zones, and counting. You’ll
    get started with a WFH office reimbursement.
  - Competitive pay: We're big on potential, and it's reflected
    in our competitive compensation packages and generous
    equity.
  - Complete support: Find flexible health plans at every
    premium level, and substantial subsidies that stand up to
    global standards.
  - Visibility is yours: You can count on direct exposure to our
    leadership team — we’re a team where good ideas travel
    quickly.
  - Paid global onsites: Magic happens IRL: we gather twice
    yearly to reconnect over shared meals or kayaking
    adventures. (We’ve visited Vail, San Diego, and Mexico
    City, to name a few.)
  - Impact is recognized: Growth opportunities follow your
    contributions, not rigid promotion timelines.

  The Tilt Way

  We're looking for people who chase excellence and impact.
  Those who stand behind their work, celebrating the wins and
  learning from the missteps equally. We foster an environment
  where every voice is valued and mutual respect is non-
  negotiable — brilliant jerks need not apply. We're in this
  together, working to expand access to fair credit and prove
  that people are incredible. When you join us, it's not just
  another day at the [virtual] office, you're helping millions
  of hardworking people reach better financial futures.

  You’re pushing ahead in your career? We can get behind that.
  Join us in building the credit system that people deserve.
