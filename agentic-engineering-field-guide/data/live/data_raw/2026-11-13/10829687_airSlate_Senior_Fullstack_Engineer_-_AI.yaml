  What we expect from you:

  What we offer



  Flexible working environment - Our teams operate across the
  globe. We value in‑person collaboration in our hubs, but we
  also embrace remote and hybrid working. You can work from
  one of our offices in the United States, Poland, Romania or
  Ukraine, or remotely from many countries.



  Competitive compensation and stock options - We offer
  salaries that reflect local market conditions and
  experience,  plus a performance-based bonus system and stock
  options so you share in the company’s growth.



  Professional growth and learning - We invest in your
  development through courses, conferences, and access to
  learning resources. We encourage career growth and internal
  mobility, supporting teammates who want to explore new
  opportunities within airSlate.



  Health and well‑being - We provide comprehensive benefits
  tailored to each country, including health coverage,
  wellness programmes and access to fitness options. We also
  dedicate quarterly company-wide Mental Health Days, when
  everyone takes time off to rest and recharge.



  Family‑friendly culture - Family life is part of who we are,
  and we embrace it in many forms. From flexibility for
  parents to our airSlate Junior Club for kids, to company-
  wide family days and our pet-friendly approach, we’re
  committed to making work and life easier to balance.



  Giving back - We support charitable initiatives around the
  world through the airSlate Care programme. Our current focus
  includes humanitarian aid in Ukraine and other regions,
  matching employee donations and supporting causes chosen by
  our teams.



  Open communication - We encourage transparent dialogue at
  all levels. From team discussions to company-wide Q&A
  sessions with our CEO, we make sure everyone has the chance
  to be heard and to influence how we grow.







