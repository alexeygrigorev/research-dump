description: |
  Job Description  Come see what you're missing. Our employees
  work on the world's most advanced electronics - from
  detecting threats for F-35 pilots to illuminating the night
  for soldiers. Spanning air, land, sea, and space, we are
  developing the technology of tomorrow, delivered today.
  Drawing strength from our differences, we're innovating for
  the future. And you can, too. If you're looking to return to
  the workplace after a career pause or looking to dial back
  your hours from your current full-time role, we're the place
  for you! We know that your talents are a valuable addition
  to our team, and our schedule is flexible around your
  availability. Our engineers are the lifeblood of our company
  and we're more than 5,000 strong. With our robust offering
  of educational and career development opportunities, your
  opportunities to grow are limitless. In addition to learning
  alongside your team as you deliver software, you'll have the
  opportunity to take training courses online and in person to
  further grow your technical skills and domain knowledge. We
  also offer education benefits which can fund additional
  degrees in a related field of study. We pair new employees
  like you with a mentor - someone who's eager to welcome you
  to BAE Systems and help you get connected to and settled
  into the BAE Systems community. The organization focuses on
  career development of our software engineers and advancement
  of the craft of software engineering. We work with you align
  your projects with your career aspirations, whether you're
  interested in becoming an experienced developer, subject
  matter expert, software leader, or landing in engineering or
  program management You will be working alongside other
  highly motivated engineers passionate about software and
  protecting our military service personnel. This position may
  require occasional travel to support integration and test
  event. Come join us as "We Protect Those Who Protect Us®."
  Because of the need for consistent, in-person collaboration
  and/or the requirement to perform all work onsite due to the
  nature of this particular role, it will be performed full-
  time on site. This means work will be conducted on location
  at a BAE Systems facility 100% of the time. Job Description
  We are looking for talented early career Software
  professionals to help us create the world's most advanced
  solutions in the area such as Signals Intelligence (SIGINT),
  Aircraft Protection, Radar Warning and Electronic Attack for
  our defense related customers. Our products provide critical
  mission capabilities to address the ever-evolving threats to
  our nation's security and the war fighter. In this exciting
  role, you will enjoy opportunities to take on diverse and
  challenging work assignments, flexible scheduling with every
  other Friday off, an inviting and supportive culture,
  competitive compensation, and an excellent benefits package
  that includes tuition reimbursement for advanced degrees. We
  will provide you opportunities to learn, leverage our
  current technologies, incorporate new technologies, and if
  you desire...become an expert or future technical leader in
  our engineering organization. We have multiple positions in
  Southern New Hampshire, in facilities located in Nashua,
  Hudson, Merrimack and Manchester. Job Responsibilities •
  Duties include analyzing, designing, coding and code
  modification (typically in C++) of complex software designs
  for simple systems or subsystems or subsystems of larger
  systems. • You will be assisting in the evaluation of
  complex software designs to identify design flaws.• You will
  utilize either a Windows or Linux based software development
  environment. Embedded targets could range from ARM through
  high performance x86-64 CPUs and Graphics Processing Units
  (GPUs). You will be integrating and testing in the selected
  target test environments. We put our customers first -
  exemplified by our mission: "We Protect Those Who Protect
  Us®." Please note that pursuant to a government contract,
  this specific position requires US citizenship status #ESPT
  #IJS Required Education, Experience, & Skills

  - Bachelor's Degree in computer science, computer engineering,
    or related field, and 2 years related work experience or
    equivalent experience
  - Experience with Object Oriented design, development
    practices, and implementation in C++
  - Experience with source code control tools
  - Willingness to perform a wide variety of related tasks

  Preferred Education, Experience, & Skills

  - Secret Clearance (active within the last two years)
  - Real-time embedded development
  - GIT, Jira, Confluence
  - Agile Development experience
  - Designing and/or implementing software algorithms

  Pay Information Full-Time Salary Range: $79365 - $134921
  Please note: This range is based on our market pay
  structures. However, individual salaries are determined by a
  variety of factors including, but not limited to: business
  considerations, local market conditions, and internal
  equity, as well as candidate qualifications, such as skills,
  education, and experience. Employee Benefits: At BAE
  Systems, we support our employees in all aspects of their
  life, including their health and financial well-being.
  Regular employees scheduled to work 20+ hours per week are
  offered: health, dental, and vision insurance; health
  savings accounts; a 401(k) savings plan; disability
  coverage; and life and accident insurance. We also have an
  employee assistance program, a legal plan, and other perks
  including discounts on things like home, auto, and pet
  insurance. Our leave programs include paid time off, paid
  holidays, as well as other types of leave, including paid
  parental, military, bereavement, and any applicable federal
  and state sick leave. Employees may participate in the
  company recognition program to receive monetary or non-
  monetary recognition awards. Other incentives may be
  available based on position level and/or job specifics.
  About BAE Systems, Inc. BAE Systems, Inc. is a defense,
  aerospace, and security company headquartered in Falls
  Church, Virginia, with more than 40,000 employees worldwide.
  We serve, supply, and protect those who protect us. As one
  of the most geographically diverse international defense
  companies, we deliver a full range of products and services
  spanning air, land, maritime, space, and cyber, including
  advanced electronics, intelligence solutions, and dedicated
  customer support. Our culture is performance-driven and
  values-led, built on curiosity, creativity, and
  collaboration. Purpose isn't a tagline here. It's what
  drives us. We're developing breakthrough technologies that
  defend national security and make a lasting impact on our
  communities and our planet. When you join BAE Systems,
  you're not just building a career. You're contributing to a
  mission that truly matters. This position will be posted for
  at least 5 calendar days. The posting will remain active
  until the position is filled, or a qualified pool of
  candidates is identified.
