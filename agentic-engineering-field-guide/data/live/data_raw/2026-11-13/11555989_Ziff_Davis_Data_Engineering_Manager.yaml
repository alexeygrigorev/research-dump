description: |
  The Opportunity:

  Ziff Davis (NASDAQ: ZD) is a global multi-billion-dollar
  digital media and internet company, home to 40+ leading
  brands spanning technology, shopping, gaming, entertainment,
  cybersecurity, media marketing, health, and wellness. We
  pride ourselves on ethical governance, robust data privacy,
  and an inclusive culture that empowers all employees to
  thrive, values reflected across our Environmental, Social &
  Governance (ESG) and Diversity, Equity & Inclusion (DEI)
  initiatives.

  As a Data Engineering Manager at Ziff Davis Shopping, you’ll
  drive the evolution of our global data architecture,
  enabling data-informed experiences across our diverse
  portfolio from Retailmenot.com, VoucherCodes.co.uk,
  Offers.com, BlackFriday.com, and more.  This role requires
  managing a global team across UK and USA.

  If you want to be at the forefront of retail technology, and
  create marketing leading products, this could be the
  challenge for you.

  Key Responsibilities:

  - Providing leadership and management in the data domain
  - Leading and ensuring on time and high quality delivery of
    the data roadmap
  - Hands-on role continuing to combine local systems into
    global solutions
  - Coaching, mentoring and inspiring members of your team

  Job Qualifications:

  - Experience managing a team, plus senior-level hands-on data
    engineering experience
  - Excellent communication and leadership skills: with the
    ability to initiate and drive projects proactively
  - Strong AWS knowledge, including Kinesis, Athena, S3, etc.
  - Extensive data warehousing experience, Snowflake, Redshift
    etc.
  - Experience with Airflow or a similar ETL tool, Python
    experience and data modelling knowledge
  - Enjoy working with other engineers and stakeholders



  Our Benefits:

  - The flexibility to get that perfect work/life balance with
    hybrid working - especially when balancing work with
    family or personal commitments.
  - A supportive, inclusive culture; we care about each other,
    our customers and our planet
  - Two uninterrupted hours a week dedicated to your personal
    development
  - Pension, with employer contributions up to 8%
  - Subsidised gym membership
  - Private medical insurance
  - Employee Assistance Programme
  - Free lunch from JustEat for Business when you’re in the
    office
  - Regular social events
  - 16 hours volunteering time per year along with donation
    matching
  - Enhanced parental leave, with specific support in place for
    returning to work parents



  Join us at our bright, spacious open-plan office situated in
  the heart of London. The area is home to a wonderful array
  of cafés, restaurants, pubs and galleries. For the more
  adventurous, there's some of the best street food London has
  to offer right on our doorstep. We don’t expect you to be in
  the office every day - there’s plenty of flexibility so you
  can achieve a great work/life balance.



  About Ziff Davis Shopping

  VoucherCodes is part of Ziff Davis Shopping, which helps
  millions of shoppers discover and save, delivering
  exceptional consumer and merchant-advertiser experiences
  across a portfolio of leading mobile and ecommerce brands.
  Our US brands include RetailMeNot, Offers.com,
  Blackfriday.com, TechBargains and more. We also run
  VoucherCodes, one of the leading discount code brands in the
  UK.

  About Ziff Davis

  Ziff Davis (NASDAQ: ZD) is a vertically focused digital
  media and internet company whose portfolio includes leading
  brands in technology, shopping, gaming and entertainment,
  connectivity, health, cybersecurity, and martech. Today,
  Ziff Davis is focused on seven key verticals – Technology,
  Connectivity, Shopping, Entertainment, Health & Wellness,
  Cybersecurity and Marketing Technology. Its brands include
  IGN, Mashable, RetailMeNot, PCMag, Humble Bundle,
  Spiceworks, RootMetrics, Everyday Health, BabyCenter, Moz,
  iContact and Vipre Security.

  At Ziff Davis, we remain dedicated to creating an
  environment where everyone feels valued, respected, and
  empowered to succeed. We offer Employee Resource Groups,
  company-sponsored events, and regular opportunities for
  professional growth through educational support, mentorship
  programs, and career development resources. Our employees
  are recognized and celebrated through employee engagement
  programs and recognition awards.

  If you're seeking a dynamic and collaborative work
  environment where you can see the direct impact of your
  performance and thrive both personally and professionally,
  then VoucherCodes is the place for you.



  Ziff Davis is an Equal Opportunity Employer. At Ziff Davis,
  Diversity, Equity, and Inclusion (DEI) has always been about
  fairness, equal opportunity, and belonging. DEI enables us
  to attract and retain the best talent, regardless of
  background or circumstances, while enabling our thousands of
  employees worldwide to thrive.

