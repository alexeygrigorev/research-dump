description: |
  Payabli is the Intelligent Fintech Operating System for
  software platforms. If you are a software company, you are a
  fintech company, and Payabli is your operating system. Built
  by payments industry and SaaS veterans and powered by its
  own models, Payabli gives platforms everything they need to
  embed, manage, and monetize financial services through a
  single developer-friendly API spanning Pay In, Pay Out, and
  Pay Ops. Intelligence is not a layer on top, it is the
  foundation, expressed through Amigo™, Payabli's native AI
  Agent Suite, and a growing set of capabilities that make
  payment operations smarter and more autonomous.



  Payabli gives software companies PayFac capabilities without
  the heavy lift, administrative burden, or cost of becoming a
  payment facilitator themselves. With PayFac-as-a-Service,
  embedded payment acceptance and issuance, and intelligent
  payment operations, platforms turn payments into a
  meaningful revenue stream while staying focused on their
  core product.

  Payabli is backed by world-class fintech investors including
  QED Investors, Fika Ventures, TTV Capital, and Bling
  Capital, and was recently named to the Forbes Fintech 50.

  For more information, visit payabli.com.

  As a Senior Software Engineer, Full-Stack at Payabli, you’ll
  own the interfaces that sit between complex financial
  infrastructure and the humans who use it every day –
  merchant dashboards, onboarding flow, embeddable components,
  and white-label experiences consumed by our platform
  partners and their end users. You’ll work at the
  intersection of product, design, and backend engineering to
  ship a UI that is fast, bulletproof, and genuinely pleasant
  to use. Trust and precision are paramount in the products we
  build so balancing great Human Interface Design (HID)
  principles with robust, secure engineering isn’t a nice-to-
  have, it is the job.

  What You'll Do

  - Build the product people touch. Design, develop, and
    maintain the frontend applications and reusable component
    libraries that power Payabli’s, and its partners,
    platforms.
  - Ship embeddable experiences. Build hosted payment forms,
    white-label components, and drop-in UI that third-party
    platforms integrated directly with their own products.
    Your code needs to be lean, flexible and rock-solid as it
    will be running inside other people’s software.
  - Bridge frontend and backend. Collaborate closely with other
    service owning teams to integrate via APIs and real-time
    data streams, ensuring seamless data flow across the stack
    & overall platform
  - Raise the bar. Lead code reviews, champion frontend
    standards, and drive architectural decisions that keep the
    codebase healthy as we scale.
  - Multiply the team. Mentor engineers around you and elevate
    frontend engineering quality across the organization
    through pairing, documentation and leading by example.
  - Own the full lifecycle. Work across requirements,
    implementation, testing, and deployment. We don’t throw
    things over the wall here.
  - Sweat the details. Optimize for performance, accessibility,
    and cross-browser compatibility.

  What We're Looking For

  We’re looking for someone who meets the minimum requirements
  below. If you meet them, we encourage you to apply – your
  skills and trajectory matter more than checking every box.

  - 5+ years of professional frontend engineering experience.
    You've shipped real products to real users.
  - React, Typescript and .Net, C# You don’t just use React, you
    understand its rendering model, know when to reach for
    which patterns, and can reason about performance at the
    component level.
  - Strong understanding of CSS and responsive design. You can
    build pixel-perfect, accessible interfaces without leaning
    on a framework for everything.
  - API integration experience. You’ve shipped products that
    rely upon APIs from multiple services and know to
    gracefully handle loading states, errors, and edge cases.
  - State management chops. Experience with Redux, Zustand, or
    similar frameworks. You have strong opinions on what is
    the right tool when.
  - Strong communicator. You enjoy walking your partners
    (design, PM, other engineers, leadership) through
    technical trade-offs.
  - Security awareness. Web security principles (XSS, CSRF, CSP,
    etc.) and build with them in mind from step on.

  Nice to Haves

  - A degree in Computer Science, or related field (or
    equivalent experience – we care more about how you operate
    and what you can build).
  - Prior experience in fintech or payments technology.
    Especially as it relates to good payments UX: checkout
    flows, merchant onboarding, reconciliation dashboards, or
    similar financial interfaces.
  - Experience building embeddable or white-label UI components.
    Bonus points if you’ve dealt with CSS isolation,
    versioning and cross-origin challenges.

  We think you'll love being part of our team because

  At Payabli, you'll have a front row seat into building a
  high-growth venture backed fintech company. As a senior
  leader in Operations, you'll shape how the organization
  scales and be the driving force behind our AI-first
  operations strategy — directly influencing how we build,
  automate, and optimize for the future. You'll stretch
  yourself every day, learn a ton, grow alongside the company,
  and have a lot of fun building Payabli with us. We're a
  values driven company that cares deeply about our team,
  partners, and customers. Our north star values are:

  🤝 Team Love = Customer Love — You understand that when you
  build great products for your internal partners, they
  deliver exceptional experiences to merchants. You obsess
  over the platform partners and businesses that depend on
  every payout landing on time.

  🔥 Run to the Fire — When ACH returns spike or a card program
  hits a snag, you're the first one in the war room. You don't
  shy away from hard problems—you chase them. You volunteer
  for the complex, messy challenges others avoid.

  🔍 Little Things Count — You sweat the details because you
  know a single decimal error in a payout can damage a
  business. You double-check edge cases, validate every
  assumption, and understand that excellence lives in the
  details.

  💎 Truth Seekers — You give direct feedback, receive it with
  grace, and never let ego get in the way of finding the right
  answer. You document what you don't know, admit mistakes
  quickly, and hold yourself accountable in the open.

  🚀 Relentlessly Curious — You're constantly asking "what if?"
  and "why not?" You study how competitors solve problems,
  explore adjacent industries for inspiration, and never stop
  learning about the payments ecosystem.

  We build technology that gets noticed and a workplace where
  people want to grow their careers. Our work has been
  recognized by some of the industry’s most respected
  organizations, including being named No. 43 on the 2026 Inc.
  5000, marking our third consecutive year on the list.
  Payabli was also named to the 2026 Forbes Fintech 50,
  recognizing the most innovative private companies in
  financial technology, Inc.’s 2025 Best Workplaces, and Built
  In’s 2026 Best Places to Work in Miami.

  What we can offer you

  - Competitive salary
  - Stock options with the potential to unlock more equity as we
    grow
  - Flexible PTO and paid parental leave
  - Medical, dental, & vision insurance
  - 401K, HSA, pre-tax savings programs

  Payabli is an equal opportunity employer and values a
  diverse, inclusive workplace.

  Principals only. No external agency submissions. Candidates
  must apply directly; We will not accept submissions from
  third-party recruiters or staffing agencies.
