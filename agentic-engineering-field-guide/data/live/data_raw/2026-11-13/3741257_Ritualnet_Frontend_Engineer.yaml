description: |
  About Ritual

  Ritual is building a sovereign, execution layer for AI, with
  our private testnet already live and running. The Ritual
  chain is the first blockchain custom-built to support AI-
  native operations, designed from the ground up to enable a
  new class of applications at the intersection of crypto and
  AI. Our first product, Infernet, is pioneering new ground as
  the first solution to enable developers to access AI models
  both on-chain via smart contracts and off-chain,
  demonstrating our commitment to bridging these
  transformative technologies.

  About the role

  As a Frontend Engineer at Ritual, you'll build sophisticated
  interfaces that enable developers to interact with our AI
  and blockchain infrastructure, as well as rapidly build
  prototypes built on top of Ritual Chain. You'll create
  intuitive dashboards and monitoring tools that make complex
  distributed systems accessible and manageable, from tracking
  cross-chain transactions to monitoring AI compute nodes, and
  much more.

  - Design and implement transaction monitoring interfaces that
    visualize the complete lifecycle across Ritual's
    infrastructure, including broker status, node operations,
    and cross-chain interactions
  - Build and maintain dashboard interfaces for things like node
    deployment, monitoring, and management across cloud
    providers
  - Develop web applications that enable users to provision and
    manage customized node infrastructure through intuitive
    interfaces
  - Create responsive dashboards for real-time monitoring of
    distributed compute resources and container management
  - Design and implement DeFi-style interfaces for protocol
    interactions, similar to DEX and vault management
    experiences
  - Work closely with product, design, and backend teams to
    create seamless user experiences
  - Participate in code reviews and provide constructive
    feedback to team members
  - Writing efficient, high-quality code that maintains our high
    standards for user experience

  About you

  - Robust fundamental understanding of HTML/CSS, TypeScript,
    and React
  - Strong experience productionizing user interfaces for
    decentralized applications that interact directly with
    various EVM-based blockchains
  - Strong experience with popular Web3 wallet integration
    libraries (wagmi, ethers, etc.) and blockchain interaction
    patterns
  - Proven full-stack experience, with the ability to diagnose
    and resolve end-to-end issues independently from frontend
    to backend, including familiarity with API design and
    server-side architectures
  - Proficiency with Linux and command-line environments for
    development and debugging
  - Experience building responsive monitoring dashboards and
    data visualization interfaces
  - Expertise in state management patterns and real-time data
    handling
  - Strong understanding of cross-chain transaction flows and
    blockchain infrastructure
  - Experience with modern frontend build tools and deployment
    pipelines
  - Ability to act quickly under high pressure scenarios and
    context switch at a high frequency
  - A high level of end-to-end ownership and self-direction,
    with excellent communication skills
  - Hungry, high-energy and ability to work within and meet
    deadlines in a fast-paced environment

  Nice to have

  - Proven track record developing multi-platform applications
    (web, desktop, mobile)
  - Experience building interfaces for distributed systems or
    node management
  - Background with AI/ML infrastructure monitoring and
    management
  - Familiarity with container orchestration and cloud provider
    interfaces
  - Experience with Electron or similar desktop application
    frameworks
  - Knowledge of GraphQL and real-time data subscriptions
  - Contributions to open-source projects in the web3 space

  Why join us

  - Join a passionate group of engineers, researchers, and
    operators on a mission to build the next generation of AI
    infrastructure
  - Highly competitive compensation package, including annual
    discretionary bonus & optimized tax structure compared to
    the vast majority of web3 startups
  - Top 1% of benefits across the web3 startup space
  - 100% of premiums covered on highest quality healthcare
  - Aggressive company 401k match
  - Fully remote and/or hybrid, up to you!
  - Participate in virtual and in-person events
  - Much much more!
