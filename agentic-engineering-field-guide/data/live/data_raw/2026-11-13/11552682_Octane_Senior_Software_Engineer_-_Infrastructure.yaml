description: |
  Octane is unlocking the power of financial products for
  merchants and consumers. Our cutting-edge technology and
  innovative financial products empower businesses with more
  control and flexibility, enabling them to deliver seamless
  digital experiences, drive customer loyalty, and build long-
  term value.

  Octane supports merchants throughout the sales cycle:
  connecting dealerships with high-intent buyers, driving
  transparent, fast, and easy closings with award-winning
  technology, and providing on-going customer care with
  superior loan servicing.

  Founded in 2014, Octane supports over 60 OEM partner brands
  and over 4,000 dealer partners, and has a team of over 600.
  Visit www.octane.co.

  We are hiring a Senior Software Engineer to build
  infrastructure for our consumer lending marketplace. Used by
  dealerships across the country, this product provides a
  streamlined workflow for dealerships to get fast, flexible
  financing to their customers. Working with a team of
  passionate, experienced engineers, you'll work throughout
  the backend of our stack with technologies such as Python,
  Django, PostgreSQL.

  This role requires extensive experience in cloud platform,
  site reliability, or infrastructure engineering backed by
  strong expertise in AWS, Kubernetes, identity platforms, and
  automated deployment pipelines. The ideal candidate blends
  deep technical mastery with strong project management,
  consensus building, and communication skills to navigate
  complex priorities independently.

  Responsibilities:

  - Design, build, and maintain scalable infrastructure-as-code
    (IaC) using Terraform and AWS CDK across core AWS
    resources, including VPCs, compute (EC2/ECS), load
    balancing, RDS/Aurora, IAM policies, and security groups.
  - Architect highly available, resilient cloud environments
    hosting core applications, balancing architectural
    simplicity with performance and scalability.
  - Develop automation tooling in TypeScript to eliminate
    operational toil across both cloud and corporate
    infrastructure.
  - Implement Policy-as-Code guardrails to enable application
    engineers to deploy features safely, securely, and
    independently.
  - Drive cloud financial management, overseeing cost
    optimization, budget tracking, and resource attribution.
  - Lead Disaster Recovery (DR) efforts, including business
    continuity planning and routine testing exercises.

  Requirements:

  - 5+ years of experience in Infrastructure Engineering, Site
    Reliability Engineering (SRE), or Cloud Platform
    Engineering.
  - Bachelor’s degree (or higher) in Computer Science or a
    related field preferred.
  - Strong proficiency in Infrastructure as Code (IaC) using
    Terraform and/or AWS CDK, with direct experience in module
    development, state management, and automated deployment
    workflows.
  - Deep hands-on experience with core AWS services (VPC, IAM,
    EC2/ECS, RDS, S3, CloudWatch) and managing Kubernetes
    clusters (EKS); AWS certifications (Solutions Architect,
    DevOps Engineer, or Security Specialty) preferred.
  - Solid foundation in build automation & CI/CD (GitHub
    Actions, GitLab CI, ArgoCD), networking fundamentals, and
    zero-trust platforms such as Zscaler.
  - Solutions-oriented ownership mindset with the ability to
    independently manage multiple projects, prioritize
    deadlines, and solve complex analytical problems with
    minimal supervision.
  - Excellent written and verbal communication skills, with a
    proven track record of collaborating across teams,
    building consensus, and translating complex technical
    concepts for non-technical stakeholders.
  - Demonstrated leadership and mentorship abilities, with
    experience guiding and developing junior engineers.

  Compensation: In addition to salary, Total Rewards include
  bonus eligibility, a stock option package, and benefits as
  outlined below. The role described above offers a base
  salary of $130,000 to $170,000 + corporate bonus
  eligibility. Your offer will be based on location, the
  alignment of your qualifications with the requirements of
  the job and internal equity.

  Benefits:

  - Robust Health Care Plans (Medical, Dental & Vision)
  - Generous Parental Leave
  - Flexible Time Off (FTO) Policy - Time Off When You Need It
  - Retirement Plan (401k) with company match!
  - Educational Assistance/Tuition Reimbursement up to $3K/year
  - Life Insurance (Basic, Voluntary & AD&D)
  - Short Term / Long Term Disability
  - Robust Ancillary benefits including accident insurance,
    hospital insurance, etc
  - Wellhub (Gympass) Wellness Benefit
  - Recreational Safety Benefit

  Disclaimer:  The above statements are intended to describe
  the general nature and level of work being performed by
  associates assigned to this classification.  They are not to
  be construed as an exhaustive list of all responsibilities,
  duties, and skills required of personnel so classified.  All
  personnel may be required to perform duties outside of their
  normal responsibilities from time to time, as needed.

  Octane Lending is an equal opportunity employer committed to
  providing equal employment opportunity without regard to
  race, color, religion, sex, sexual orientation, gender
  identity, national origin, age, disability, or any other
  protected status with respect to recruitment, hiring,
  promotion and other terms and conditions of employment.
