description: |
  This is a remote position.



   The Senior Full Stack Developer is responsible for end-to-
  end software development, including front-end, back-end,
  APIs, databases, and cloud integration. This role requires
  strong technical depth, system thinking, and the ability to
  deliver scalable enterprise-grade solutions while
  collaborating closely with Product Managers, Architects, and
  Engineering Leads.









   Key Responsibilities




  - Design, develop, and maintain scalable full-stack
    applications.
  - Build and integrate RESTful APIs and microservices.
  - Develop responsive and high-performance front-end
    interfaces.
  - Architect and optimize backend systems, databases, and data
    models.
  - Collaborate with Product, Design, and Engineering teams to
    deliver features end-to-end.
  - Ensure application security, scalability, and performance
    optimization.
  - Participate in system design discussions and technical
    architecture decisions.
  - Write clean, maintainable, testable, and well-documented
    code.
  - Troubleshoot, debug, and upgrade existing systems.
  - Contribute to CI/CD pipelines and DevOps practices.



  Required Qualifications



  - 9+ years of full-stack software development experience.
  - Strong experience building enterprise or SaaS applications.
  - Proven ability to deliver complex systems from concept to
    production.
  - Experience working in Agile development environments.
  - Strong problem-solving and system design skills.
  - Excellent communication and collaboration abilities in
    remote teams.



  Technical Skills



  - Frontend: JavaScript, TypeScript, React / Angular / Vue
  - Backend: Node.js, Java, Python, .NET, or similar
  - APIs: RESTful APIs, GraphQL
  - Databases: SQL (PostgreSQL, MySQL) and NoSQL (MongoDB)
  - Cloud Platforms: Amazon Web Services / Azure / GCP
  - DevOps: CI/CD pipelines, Docker, Kubernetes
  - Version Control: Git / GitHub / GitLab
  - Software Architecture: Microservices, event-driven systems
