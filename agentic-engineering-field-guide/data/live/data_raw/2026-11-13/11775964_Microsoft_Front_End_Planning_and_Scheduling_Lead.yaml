description: |
  Overview

  Overview

  In alignment with our Microsoft values, we are committed to
  cultivating an inclusive work environment for all employees
  to positively impact our culture every day, and we need you
  as a Senior Integrated Planner – Front End Planning Lead.

  As a Front End Planning Lead, you will play a critical role
  in establishing the foundation for successful project
  delivery across a portfolio of large-scale data center
  construction projects. This role is responsible for leading
  front- end planning activities from project initiation
  through schedule baseline approval, ensuring project
  schedules are realistic, compliant, and aligned with project
  objectives and execution strategies.

  The successful candidate will provide subject matter
  expertise in schedule development, schedule evaluation,
  baseline reviews, risk assessment, and planning best
  practices. This individual will work closely with project
  teams, construction partners, consultants, and stakeholders
  to assess proposed schedules, identify risks and
  opportunities, and ensure high-quality baselines are
  established before project execution begins.

  This is a highly collaborative and hands-on role requiring
  deep expertise in construction planning and scheduling,
  strong analytical capabilities, and the ability to influence
  project teams and stakeholders across a large project
  portfolio.

  Do you want to empower billions across the world? Come and
  join us in Cloud Operations + Innovation (CO+I) and be at
  the forefront of the action!

  Responsibilities

  Planning

  - Lead front-end planning and scheduling activities across a
    portfolio of large-scale data center construction
    projects.
  - Review and evaluate contractor, vendor, and project
    schedules during project development and procurement
    phases.
  - Assess proposed schedules for completeness, logic,
    feasibility, execution strategy alignment, and overall
    quality.
  - Perform detailed baseline schedule reviews to ensure
    schedules meet established planning standards and project
    requirements prior to approval.
  - Partner with project teams to identify schedule gaps, risks,
    constraints, and opportunities during baseline
    development.
  - Provide recommendations and guidance to improve schedule
    quality, constructability sequencing, milestone
    development, and critical path logic.
  - Support development and maintenance of planning standards,
    schedule review criteria, and governance processes.
  - Evaluate schedule revisions and baseline changes for
    alignment with project objectives and approved execution
    plans.
  - Promote consistent planning methodologies and scheduling
    best practices across the portfolio.
  - Develop executive-ready analysis and recommendations to
    support schedule approval and project decision-making.

  Cross-Functional Planning Leadership

  - Lead collaborative planning workshops with internal and
    external stakeholders to align project execution
    strategies and schedule assumptions.
  - Facilitate schedule development and baseline review
    workshops across multiple projects and regions throughout
    the Americas portfolio.
  - Drive early identification and resolution of schedule
    conflicts, dependencies, and execution challenges.
  - Foster a culture of proactive planning, accountability, and
    collaboration across project teams.
  - Build strong working relationships with project teams, Lease
    Providers, consultants, and stakeholders to support
    successful schedule development.

  Qualifications

  Required Qualifications

  - Bachelor's Degree AND 5+ years experience in Construction
    Management, engineering, product/technical program
    management, data analysis, or product development
    - OR equivalent experience.
  - 4+ years of experience managing cross-functional and/or
    cross-team projects.

  Other Requirements: Ability to meet Microsoft, customer
  and/or government security screening requirements are
  required for this role. These requirements include but are
  not limited to the following specialized security
  screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred Qualifications:

  - Bachelor's Degree AND 10+ years experience in Construction
    Management, engineering, product/technical program
    management, data analysis, or product development
    - OR equivalent experience.
  - 6+ years of experience managing cross-functional and/or
    cross-team projects.
  - 5+ years of experience in planning/scheduling utilizing
    scheduling software (P6 and MS Project)
  - 7+ years of experience in design and construction project
    management.
  - 7+ years of experience in planning medium sized capital
    projects ($50MM - $200MM+) in construction, oil, gas or
    chemicals (or related process industry).
  - Proven track record of delivering medium-to-large scale
    construction projects on time and to the satisfaction of
    clients.
  - Excellent understanding of Project Planning.
  - Demonstrated skills in project planning software’s Primavera
    P6 and MS Project.
  - Strong familiarity with CPM scheduling methodology
  - Ability to analyze EPC plans/schedule and provide deep
    insights into trends, issues, mitigations
  - Strong problem-solving skills and ability to self-direct
    work in a fast-paced environment.
  - Ability to manage multiple project schedules simultaneously
    and prioritize tasks effectively.
  - Strong attention to detail and ability to deliver high-
    quality work.
  - Experience in Datacenter design and construction.
  - Deep knowledge of Primavera P6 and other schedule health
    analysis tools
  - Strong experience with Risk Schedule Analysis
  - Ability to present data from detailed to high-level
    depending on audience.



