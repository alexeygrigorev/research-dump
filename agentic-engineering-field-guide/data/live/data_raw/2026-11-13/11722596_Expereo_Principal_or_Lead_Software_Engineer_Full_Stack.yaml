description: |
  We are the Intelligent Internet Platform. We connect People,
  Places and Things anywhere, managing Internet Performance
  better than anyone else, while providing One Global
  Experience, giving Visibility, Control and Security through
  expereoOne.

  Expereo believes in the power of Internet connectivity. As
  the world's largest provider of managed internet, SD-
  WAN/SASE, and Cloud connectivity solutions, we power
  enterprises and government sites worldwide, helping to
  enhance every business' productivity with flexible and
  optimal Internet performance.

  As a trusted partner of Fortune 500 enterprises and
  carriers, our continued aim and success in helping both our
  customers and partners depends solely on the talented
  individuals that make Expereo a dynamic, effective,
  multicultural, and equitable environment.

  About the role

  As a Principal or Lead Engineer within our new Digital
  Office, you will play a critical role in accelerating
  Expereo’s transformation through the Single-Threaded Owner
  (STO) model. Operating within either the Commercial XP or
  In-Life XP STO, you will join a full-stack, outcome-driven
  squad focused on delivering intuitive, performant, scalable
  digital experiences across the Expereo customer journey.

  You will design and build modern front-end and back-end
  applications, mentor engineers, shape engineering best
  practices, and contribute to a truly programmable, automated
  digital platform. This role is ideal for engineers who
  thrive in high-impact, cross-functional environments and
  enjoy building elegant user experiences backed by robust,
  scalable distributed systems.

  Key Responsibilities

  Full-Stack Application Development

  - Lead the design and maintenance of scalable front-end
    applications (React, Vue, Angular) and back-end services
    (Node.js, Python, or similar) , creating reference
    implementations and documentation for the team to follow.
  - Develop reusable UI components, design systems, shared
    libraries, and internal service frameworks.
  - Build and integrate APIs (REST, GraphQL, event-driven and
    microservices architectures).

  Performance, Quality & Reliability

  - Ensure applications meet the highest standards of
    performance, security, accessibility, and reliability.
  - Lead automated testing across unit, integration, contract,
    and end-to-end layers.
  - Implement observability in both front-end and back-end
    systems, including logging, metrics, tracing, and
    alerting.
  - Champion reliability engineering practices and performance
    optimization.

  Automation & Platform Engineering

  - Contribute to and evolve CI/CD pipelines, build tooling,
    infrastructure automation, and quality gates.
  - Drive engineering standardization across STOs, including
    coding guidelines, architectural patterns, and platform
    abstractions.
  - Lead initiatives that reduce friction, improve developer
    experience, and accelerate delivery cycles.

  Technical Leadership & Innovation

  - Partner with designers, architects, product managers, and
    engineers to ensure the technical direction aligns with
    long-term platform goals.
  - Partner directly with designers and your team’s Product
    Manager to evaluate the technical feasibility of new
    capabilities and provide effort estimations.
  - Foster a high-ownership engineering culture through active
    mentorship and by setting the bar for code quality and
    testing layers.
  - Lead explorations of new technologies, including agentic AI
    enablement, data-driven UX, programmable networks, and
    developer tooling.
  - Contribute to reference implementations, architectural
    blueprints, and engineering guardrails.
  - Identify technical risks early in the product lifecycle and
    propose pragmatic solutions to mitigate them.

  Requirements

  Must Have

  - Strong proficiency with JavaScript & TypeScript and back-end
    languages (.NET must, Node.js or Python preferred).
  - Expertise in modern front-end frameworks (React, Vue, or
    Angular).
  - Knowledge of component-based architecture, state-management
    patterns (Redux, Zustand, Vuex, etc.).
  - Experience building and consuming REST, GraphQL,
    streaming/event-driven APIs, and microservices.
  - Familiarity with modern build tools (Vite, Webpack, Babel)
    and CI/CD pipelines (GitHub Actions, GitLab, Azure DevOps,
    etc.).
  - Experience with CSS frameworks (Tailwind, Bulma, MUI,
    Chakra).
  - Strong understanding of automated testing (Jest, Cypress,
    Playwright).
  - Solid grounding in accessibility (WCAG), security best
    practices, observability, and performance tuning.
  - Experience with cloud environments (AWS, Azure, or GCP).
  - Experience working with Salesforce.
  - Experience leading technical decision-making and mentoring
    experienced engineers.

  ·

  Nice to Have

  - Exposure to agentic AI, data-driven UI architectures, or AI-
    powered developer tools (Cursor, Claude Code, Copilot).
  - Experience with design systems, component libraries, or
    Storybook.
  - Familiarity with programmable networks, observability
    tooling, or network automation concepts.
  - Understanding of advanced security practices (CSP, threat
    modeling, RBAC patterns, dependency scanning).
  - Experience in distributed systems or event-driven
    architectures.

  Mindset

  - You treat the product as your own and prioritize long-term
    stability over short-term "hacks".
  - Code-first and automation-first approach to solving
    problems.
  - You are eager to work across the full stack and stay curious
    about the evolving tech landscape.

  Benefits

  What We Offer

  - A dynamic, international work environment with growth
    opportunities

  - Exposure to cutting-edge technologies and large-scale global
    networks

  - Learning and development support to build your career in
    product management

  - Competitive compensation and local benefits
  - Hybrid working

  Beyond the Job

  We’re proud of our focus on Environment, Social and
  Governance as well as the passion we display for the
  communities where we live and work.

