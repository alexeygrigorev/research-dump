description: |
  Intetics Inc., a global technology company providing custom
  software application development, distributed professional
  teams, software product quality assessment, and “all-things-
  digital” solutions, is seeking a highly skilled and
  experienced Senior AI-Augmented Software Engineer to join
  our dynamic team.

  The client is a leading company specializing in advanced
  cybersecurity solutions. They provide comprehensive security
  measures designed to protect sensitive data and systems from
  cyber threats. Their offerings include vulnerability
  management, threat intelligence, incident response, and
  compliance management. With cutting-edge technology and a
  team of experts, they ensure robust protection for
  organizations across various industries, helping clients
  stay ahead of evolving cyber threats and maintain a secure
  digital environment. This role is for engineers who use AI
  agents as an integral part of their daily development
  workflow, not just as coding assistants. We are looking for
  someone experienced with AI-powered tooling, agentic
  workflows, and coding harnesses who can significantly
  accelerate delivery while maintaining high engineering
  standards.

  This is not a "vibe coding" role. The successful candidate
  must be able to critically evaluate AI-generated solutions,
  make sound technical decisions, and take full ownership of
  the result.

  Requirements

  - 7+ years of software engineering experience
  - Strong PHP and/or Python expertise
  - Extensive practical use of AI agents in software development
  - Ability to review, validate, and improve AI-generated code
  - Strong software design, debugging, and problem-solving
    skills
  - Ownership mindset and accountability for delivered solutions

  Nice to Have

  - Experience with both PHP and Python
  - Technical leadership or mentoring experience
  - Architecture and solution design experience
  - Background in cybersecurity, vulnerability management, or
    risk management
