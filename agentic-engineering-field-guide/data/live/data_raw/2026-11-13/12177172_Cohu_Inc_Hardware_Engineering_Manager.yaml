description: |
  Seeking a Hardware Engineering Manager with team leadership
  experience and deep, hands-on expertise in VI ATE instrument
  design. In this role, you will drive innovative solutions in
  the Semiconductor Test Group at Cohu, leading a team
  defining next-generation VI instruments that go beyond what
  is available in the market today.

  Essential Duties and Responsibilities:

  This role is an exciting opportunity to lead the
  architecture and design of VI instrumentation for
  semiconductor ATE. You will manage a team of hardware
  engineers while remaining technically hands-on, owning
  large, multi-disciplinary projects from concept through
  release to manufacturing alongside firmware, software,
  mechanical, and manufacturing engineers. This includes:

  - Precision, high voltage, and high current VI instrumentation
  - Custom ASIC-enabled instrument architectures
  - Advanced packaging and heterogeneous integration, such as
    SiP, MCM, and chiplets

  Work activities involve:

  - Building, managing, and mentoring a team of hardware
    engineers, including hiring, performance management, and
    career growth
  - Leading project scope, schedule, budget, risk, and technical
    direction
  - Translating product marketing and customer requirements into
    instrument architecture, and deciding where custom ASIC,
    advanced packaging, or discrete design best meets
    performance, power, density, and cost goals
  - Defining ASIC, SiP, or MCM requirements at the system level,
    and selecting and managing external partners through
    milestones, deliverable reviews, and verification that
    parts meet requirements
  - Leading analog design from simulation and prototyping
    through layout, bring-up, and characterization of
    instruments and partner-built silicon
  - Defining theory of operation and test strategy, and guiding
    firmware and software development
  - Driving difficult design and customer issues to root cause
    and corrective action, and shaping future instrument
    roadmaps with marketing and applications

  Required Qualifications:

  - BSEE required; MSEE preferred
  - Minimum 10 years of experience designing analog hardware,
    with a record of taking complex instruments from concept
    to production
  - Expert knowledge of VI instrumentation design, such as
    device power supplies or source-measure units, including
    force/sense architectures and accuracy and stability
    across wide voltage and current ranges
  - Strong knowledge of feedback control for digitally
    controlled analog loops, including compensation, stability
    analysis, and transient response with varying and
    capacitive loads
  - Expert knowledge of precision analog design at IC and
    discrete level, including data converters, power
    converters, and high voltage and high current design with
    thermal, safety, and reliability considerations
  - Experience defining requirements for custom ASICs or
    advanced packages and managing external design partners
    through development to production
  - Proficiency with SPICE and schematic capture/PCB tools such
    as Cadence Allegro, and with signal integrity, power
    integrity, and low-noise design practices
  - Extensive hands-on laboratory test, debug, and
    characterization experience
  - Proven ability to lead large projects on schedule, guide
    cross-functional teams and external partners, and
    communicate complex design concepts clearly

  Desired Qualifications:

  - Experience with ATE instruments, such as device power
    supplies or parametric measurement
  - Experience implementing digital control and DSP for control
    loops, such as digital compensators and filters in an
    FPGA, ASIC, or DSP
  - Experience with metrology and calibration
  - Experience managing or technically leading engineering teams

  Compensation: The estimated base pay range for this position
  is $150,000-$185,000 per year, depending on qualifications,
  experience, education, and other job-related factors. This
  range represents Cohu’s good faith estimate of what it
  reasonably expects to pay for this role upon hire. This role
  may also be eligible for other compensation programs as
  determined by company policy.



  Featured benefits

  - Medical, dental & vision insurance
  - 401(k) with company matching contributions
  - Employee Stock Purchase Plan
  - Tuition assistance
  - Disability & life insurance
  - Profit Sharing



