description: |
  Clear Creek Federal is part of the Seneca Nation Group (SNG)
  portfolio of companies. SNG is Seneca Holdings' federal
  government contracting business that meets mission-critical
  needs of federal civilian, defense, and intelligence
  community customers. Our portfolio comprises multiple
  subsidiaries that participate in the Small Business
  Administration 8(a) program. To learn more about SNG, visit
  the website and follow us on LinkedIn.

  Our team of talented individuals is what makes us
  successful. To support our team, we provide a balanced mix
  of benefits and programs. Your total rewards package
  includes competitive pay, benefits, and perks, flexible
  work-life balance, professional development opportunities,
  and performance and recognition programs. We offer a
  comprehensive benefits package that includes medical,
  dental, vision, life, and disability, voluntary benefit
  programs (critical illness, hospital, and accident), health
  savings and flexible spending accounts, and retirement 401K
  plan. One of our fundamental principles is to offer
  competitive health and welfare benefits to our team members,
  providing coverage and care for you and your family. Full-
  time employees working at least 30 hours a week on a regular
  basis are eligible to participate in our benefits and paid
  leave programs.  We pride ourselves on our collaborative
  work environment and culture, which embraces our mission of
  providing financial and non-financial benefits back to the
  members of the Seneca Nation.

  About the Program

  The U.S. Army Communications-Electronics Command (CECOM)
  Software Engineering Center, Intelligence Electromagnetic
  Warfare and Sensors (IEW&S) Directorate, operates the Army
  Reprogramming Analysis Team (ARAT) at Aberdeen Proving
  Ground. ARAT builds, tests, and distributes mission software
  for fielded electromagnetic warfare systems, including the
  AN/APR-39 radar warning receiver family, the AN/APR-48A/B
  Modernized Radar Frequency Interferometer, the Aircraft
  Gateway Processor on the AH-64, and the AN/VLQ-12 CREW Duke.
  ARAT targets its mission software products to 14 geographic
  areas of responsibility across six combatant commands.

  The ARAT Innovation Initiatives effort modernizes that
  infrastructure: browser-based threat modeling in the Signal
  Modeling Framework, automated RF hardware-in-the-loop
  testing through the Unified Test Automation Suite and
  software-defined radios, an automated Air/Terrestrial
  Testbed, test data warehousing, automated mission data
  product generation, and the ASPEN software distribution
  portal across NIPR, SIPR, and JWICS. Work is executed in
  Agile sprints with DevSecOps practices in a Government-
  approved GitLab environment.

  Position Summary

  The Level II Software Engineer independently designs and
  delivers software features across the client's existing
  products. The role owns end-to-end delivery of assigned
  GitLab milestones, integrating TCP/IP communication among
  SDRs, Keysight UXGs, UTAS server/client, M&S server/client,
  and CATS/UMCATS rack components into the TestNet enterprise.
  It provides technical support for integrated system
  evaluation, interface upgrades, sustainment, and issue
  resolution. The software engineering is defined full stack
  (C#, .Net, Python, Angular, SQL Server, Postgres) and the
  role also builds Section 508 compliant browser-based user
  interfaces required such as a threat-simulation builder, a
  test setup and analysis interface, and the software delivery
  portal.

  Responsibilities include, but are not limited to:

  - Independently design and deliver software features across
    the client's products under owning assigned GitLab
    milestones end to end.
  - Integrate TCP/IP communication among software-defined
    radios, Keysight UXGs, UTAS server and client, modeling
    and simulation server and client, and CATS and UMCATS rack
    components into the TestNet enterprise.
  - Build the browser-based user interfaces required by covering
    the threat-simulation builder, the test setup and analysis
    interface, and the software delivery portal, and deliver
    them Section 508 conformant.
  - Provide technical support for integrated system evaluation,
    interface upgrades, sustainment, and issue resolution.
  - Travel to Aberdeen Proving Ground at the end of a project to
    install, configure and test software in the client's
    laboratory to gain client acceptance of deliverables.
  - Track hours across multiple projects (5-12 annually) to
    ensure accurate cost accounting for monthly reports.
  - Assist Project Manager and client with accurate and
    reasonable estimates on level of effort for planned
    software projects.
  - Architect solutions using as much open source software as
    possible to increase the client's mission capabilities and
    the team's DevSecOps and software delivery capabilities.
  - Build data pipelines and warehouses on very large datasets
    that support analytic visualizations and key mission
    metrics.
  - Build an anchored and factual chat assistant using open
    source LLMs and design for on-premise model hosting and
    inference.
  - Build software that creates, processes and deploys threat
    signals defined in SMF and transform those definitions
    into vendor specific file types for testing across
    hardware devices.

  Required Qualifications

  - Bachelor's degree in engineering, computer science, or a
    related technical discipline.
  - 4 to 8 years of relevant professional experience in software
    engineering.
  - Active DoD Secret clearance at time of application.
  - Position-specific training beyond the common set: IA
    baseline certification (8570 IAT II equivalent) where the
    engineer holds privileged access to the DEVNET or the
    classified lab.
  - Ability to work on-site at Aberdeen Proving Ground, Maryland
    on a hybrid schedule, with on-site presence required for
    classified and laboratory work.

  Preferred Qualifications

  - CompTIA Security+ CE.
  - Certified Scrum Developer.
  - AWS Certified Developer - Associate.
  - IAAP CPACC or DHS Trusted Tester (front-end scope).
  - Experience building instrument control interfaces over
    TCP/IP, particularly Keysight or National Instruments
    hardware.
  - Front-end delivery experience in Angular against a Section
    508 or WCAG 2.1 AA standard.
  - Experience with electronic warfare, software defined radios,
    electromagnetic spectrum.
  - Experience with data warehousing, data pipelines and data
    science.

  Technical Skills and Tools

  C#, or Python development; Agile/Scrum delivery; GitLab
  CI/CD pipelines; REST API design; unit and integration
  testing; STIG-compliant secure coding; Windows Army Gold
  Master (AGM) target environment; software installation
  package assembly (source, executables, Build Version
  Description, Help); System User's Manual authoring; TCP/IP
  instrument integration; SDR and Keysight UXG control
  interfaces; code review and mentoring; front-end development
  in a modern JavaScript framework (Angular); HTML5/CSS3 and
  responsive browser-based UI construction; data visualization
  for RF and scenario data; Section 508 / WCAG 2.1 AA
  conformance; usability testing.

  Security and Training Requirements

  - An active DoD clearance at the level shown above is
    required. Secret is the floor across this contract.
  - A signed non-disclosure agreement is required before start
    of performance.
  - Common Access Card issuance runs approximately 24 hours;
    full network and facility access typically takes three to
    four business days after in-processing.
  - Every position carries the universal DoD and Army training
    set, completed at start of performance and refreshed on
    the Army cycle: DoD Cyber Awareness Challenge, Threat
    Awareness and Reporting Program (TARP), annual security
    refresher, insider threat awareness, controlled
    unclassified information handling, Antiterrorism Level I,
    iWATCH briefing, ATCTS registration, and installation
    access processing.

