description: |
  Position Summary

  The Front End (UI) Software Engineer is a senior-level
  position responsible for establishing, architecting, and
  implementing new or revised application systems and programs
  in coordination with the Technology team. The overall
  objective of this role is to lead applications systems
  analysis, frontend architecture, and fullstack programming
  activities.

  This role specifically focuses on leading the development of
  scalable, secure, and modern Front End (UI) digital
  platforms with Fullstack capabilities. The lead engineer
  will set architectural standards for enterprise-grade web
  applications, drive UI component libraries and design system
  adherence, establish best practices for API integration and
  backend services, and mentor development teams across the
  software delivery lifecycle.

  Key ResponsibilitiesTechnical Leadership & Core Applications
  Development

  - Architectural Alignment & System Design: Provide expertise
    in frontend/fullstack applications programming and ensure
    application design strictly adheres to the overall
    enterprise architecture blueprint, security standards, and
    technology roadmap.

  - Standards & Engineering Governance: Utilize advanced
    knowledge of system flow to develop and enforce robust
    standards for UI coding, component reusability, testing
    automation, debugging, performance profiling, and CI/CD
    deployment.

  - Frontend & UI Engineering: Lead the architecture and
    implementation of responsive, accessible (WCAG 2.1 AA),
    and performant web applications using modern frameworks
    (e.g., React, TypeScript, Next.js/Angular) and enterprise
    design systems.

  - Fullstack Integration & API Design: Lead end-to-end
    integration by designing, consuming, and optimizing
    RESTful APIs, GraphQL endpoints, Backend-for-Frontend
    (BFF) layers, and microservices (e.g., Node.js,
    Java/Spring Boot, or Python).

  - Cross-Functional Collaboration: Partner with multiple
    management teams, product owners, UX/UI designers, and
    backend engineering teams to ensure appropriate
    integration of functions to meet business goals,
    identifying and defining necessary system enhancements to
    deploy new products and process improvements.

  - Complex Problem Solving: Resolve a variety of high-impact
    problems and complex projects through in-depth evaluation
    of complex business processes, system processes, data
    flows, and industry standards.

  - Cross-Domain Integration: Develop comprehensive knowledge of
    how areas of business—such as enterprise architecture,
    infrastructure, cloud platforms, and security—integrate to
    accomplish strategic business goals.

  - Innovative Solution Delivery: Provide in-depth analysis with
    interpretive thinking to define critical technical issues
    and engineer innovative, resilient solutions..

  Risk Management, Governance & Controls

  - Risk & Compliance Safeguarding: Appropriately assess risk
    when business and technical decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients, and
    assets, by driving compliance with applicable laws, rules,
    and regulations, adhering to Policy, applying sound
    ethical judgment regarding personal behavior, conduct, and
    business practices, and escalating, managing, and
    reporting control issues with transparency.

  - Security & Data Privacy: Ensure all developed user
    interfaces and application workflows adhere to rigorous
    enterprise cyber security standards (e.g.,
    SSO/OAuth2/OIDC, XSS/CSRF mitigation, secure session
    management, and vulnerability remediation).

  Recommended Qualifications

  - Experience: Extensive relevant professional experience in an
    Applications Development or systems analysis role, with
    demonstrated expertise in UI/Frontend engineering and
    fullstack delivery.

  - Technical SME: Subject Matter Expert (SME) in at least one
    core area of modern frontend development (e.g.,
    React/TypeScript ecosystem, Micro-frontends, Design
    Systems, State Management) with strong working competency
    in backend integration (Node.js, Java, Python, or
    REST/GraphQL APIs).

  - System Analysis & Implementation: Extensive experience in
    software systems analysis, programming, and architecture
    of enterprise web applications.

  - Project & Delivery Track Record: Proven track record of
    managing and successfully delivering complex, high-impact
    technology projects within an Agile/Scrum framework.

  - Adaptability: Demonstrated ability to adjust priorities
    quickly and effectively as business and technical
    circumstances dictate.

  - Leadership Skills: Demonstrated technical leadership,
    project coordination, and mentoring skills.

  - Communication: Consistently demonstrates clear, concise, and
    professional written and verbal communication skills
    across technical and executive stakeholders.



  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

  What we’ll provide you

  By joining Citi, you will not only be part of a business
  casual workplace with a hybrid working model (up to 2 days
  working at home per week), but also receive a competitive
  base salary (which is annually reviewed), and enjoy a whole
  host of additional benefits such as:

  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  - Access to an array of learning and development resources

  Visit our Global Benefits page to learn more.

  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.

