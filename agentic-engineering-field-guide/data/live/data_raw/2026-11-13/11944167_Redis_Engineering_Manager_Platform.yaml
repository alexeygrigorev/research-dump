description: |
  Who we are

  We're Redis. We built the product that runs the fast apps
  our world runs on. (If you checked the weather, used your
  credit card, or looked at your flight status online today,
  you’re welcome.) At Redis, you’ll work with the fastest,
  simplest technology in the business—whether you’re building
  it, telling its story, or selling it to our 10,000+
  worldwide customers. We’re creating a faster world with
  simpler experiences. You in?

  Why would you love this job?

  You will lead a team responsible for the infrastructure and
  platform services behind customer-facing Redis applications
  that move, transform, manage, and operationalize data at
  scale. Your team will build and operate the shared systems
  product teams rely on to deliver scalable, reliable,
  production-grade services: service control planes, lifecycle
  APIs, deployment automation, Kubernetes orchestration,
  identity and access, observability, release workflows, and
  operational tooling.

  You will combine people leadership, technical judgment, and
  delivery ownership. You will create an environment where
  engineers can do their best work, partner with product and
  engineering leaders to turn customer and business needs into
  a clear roadmap, and ensure the team delivers durable
  platform capabilities across cloud, hybrid, and on-premise
  environments. You will remain close enough to the
  architecture and operations to guide decisions, manage risk,
  and hold a high bar for quality without becoming the team's
  primary implementer.

  We are opinionated about using LLMs and AI-assisted
  development tools as part of modern software engineering.
  You will help the team use these tools effectively while
  maintaining strong engineering judgment, accountability,
  security, and code quality.

  What you’ll do

  - Lead, support, and grow a team of engineers through clear
    expectations, regular feedback, coaching, and career
    development
  - Own the team's execution and outcomes, from planning and
    prioritization through delivery, production operation, and
    continuous improvement, with accountability for tactical
    results over the coming quarters
  - Translate broader cloud platform strategy and organizational
    priorities into operational plans, team objectives, and a
    pragmatic roadmap
  - Allocate people and resources to meet schedules and goals
    while managing capacity, dependencies, and changing
    priorities
  - Execute workforce, capacity, and operating-cost planning in
    partnership with engineering leadership
  - Establish clear ownership and operating practices for
    platform services, including service APIs, Kubernetes
    controllers and operators, deployment automation,
    configuration, upgrades, and lifecycle management
  - Guide technical decisions and architectural tradeoffs,
    working closely with senior individual contributors and
    ensuring designs align with the established cloud platform
    direction
  - Drive reliability through SLAs, SLOs, KPIs, observability,
    operational readiness, incident response, post-incident
    learning, and reduction of recurring operational work
  - Balance product delivery with investments in platform
    consistency, security, scalability, technical debt, and
    developer productivity
  - Build strong partnerships across product engineering, SRE,
    security, infrastructure, and other platform teams
  - Engage customers and external stakeholders where
    appropriate, presenting results and recommendations across
    technical disciplines
  - Identify dependencies and risks early, communicate them
    clearly, and align teams on decisions and delivery plans
  - Improve engineering practices for system design, testing,
    CI/CD, release automation, production debugging, and data-
    informed decision-making
  - Hire and onboard engineers while building an inclusive,
    collaborative, and accountable team culture
  - Use delivery, quality, reliability, and team-health signals
    to improve how the team works

  What will you need to have?

  - Experience managing or formally leading a software
    engineering team, including coaching engineers and
    supporting their performance and career growth
  - A strong software engineering background in distributed
    systems, infrastructure services, backend systems, or
    platform engineering
  - Experience delivering and operating production systems with
    accountability for reliability, quality, and customer
    impact
  - Strong technical judgment and the ability to guide
    architecture and engineering decisions without needing to
    own every implementation detail
  - Working knowledge of Kubernetes, cloud infrastructure, and
    modern software delivery practices
  - Understanding of infrastructure fundamentals such as
    compute, networking, storage, IAM, secrets, service-to-
    service communication, and observability
  - Experience planning and delivering complex work across team
    boundaries while managing dependencies, risk, and changing
    priorities
  - Experience with resource allocation, workforce and capacity
    planning, and managing operating costs within
    organizational priorities
  - Ability to partner effectively with product managers, senior
    engineers, SRE, security, infrastructure, and other
    stakeholders
  - Clear written and verbal communication, including the
    ability to explain tradeoffs and build alignment with
    technical and non-technical audiences
  - A track record of building healthy teams with clear
    ownership, high standards, psychological safety, and a
    culture of continuous improvement
  - Comfort helping engineers use AI-assisted development tools
    effectively and responsibly

  Extra great if you have

  - Experience managing a platform, infrastructure, SRE, or
    developer productivity team
  - Experience building internal platforms, control planes,
    Kubernetes operators, or shared developer infrastructure
  - Experience supporting enterprise software across cloud,
    hybrid, or on-premise environments
  - Experience with distributed databases, data infrastructure,
    data movement, streaming systems, or integration platforms
  - Experience with Terraform, Argo CD, GitHub Actions, or
    similar infrastructure and delivery tooling
  - Experience establishing SLOs, leading incident response, and
    improving operational maturity
  - Experience partnering with product teams to turn recurring
    infrastructure needs into reusable platform capabilities
  - Experience growing senior engineers and developing technical
    and team leadership within an organization

  As a global company, we value a culture of curiosity,
  diversity of thought, and innovation from our employees,
  customers, and partners. Redis is committed to a diverse and
  inclusive work environment where all employees’ differences
  are celebrated and supported, and everyone feels safe to
  bring their authentic selves to work. Redis is dedicated to
  equal employment opportunities regardless of race, color,
  ancestry, religion, sex, national orientation, sexual
  orientation, age, marital status, disability, gender
  identity, gender expression, Veteran status, or any other
  classification protected by federal, state, or local law. We
  strive to create a workplace where every voice is heard, and
  every idea is respected.

  Redis is committed to working with and providing access and
  reasonable accommodation to applicants with mental and/or
  physical disabilities. If you think you may require
  accommodations for any part of the recruitment process,
  please send a request to recruiting@redis.com. All requests
  for accommodations are treated discreetly and
  confidentially, as practical and permitted by law.

  Any offer of employment at Redis is contingent upon the
  successful completion of a background check, consistent with
  applicable laws.

  Redis reserves the right to retain data longer than stated
  in the privacy policy in order to evaluate candidates.
