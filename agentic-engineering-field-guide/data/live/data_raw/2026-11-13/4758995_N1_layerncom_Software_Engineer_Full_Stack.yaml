description: |
  About N1: N1 is an L1 blockchain built for global, high-
  performance, trustless finance. N1 combines ultra-high
  throughput and sub-millisecond latency with native financial
  primitives including an on-chain orderbook, margining,
  atomics, and RFQ infrastructure. N1 is comprised of a team
  spanning backgrounds from Harvard, CMU, DFINITY, VMWare,
  Galaxy Digital, and more, and is backed by top-tier
  institutions like Founders Fund, Kraken Ventures, SALT,
  Amber Group, and more. Position Overview: We are seeking a
  mid-to-senior Software Engineer, Frontend-Leaning Full-Stack
  to join our engineering team in New York City. You will
  primarily build and own N1’s user-facing products, including
  high-performance, real-time trading interfaces, while
  working across the stack when needed. Requirements:

  - 3+ years of professional software engineering experience
  - Strong TypeScript and modern frontend experience
  - Experience building complex, high-performance web
    applications
  - Strong understanding of state management, real-time data,
    and frontend performance
  - Strong product and design instincts with attention to UX
  - Ability to independently own and ship production features

  Nice to Haves:

  - SolidJS, Vite, Tailwind, TanStack Query, Storybook, Vitest,
    or Playwright
  - WebSockets or other real-time/streaming systems
  - Trading, financial, or data-dense product experience
  - Node.js, Fastify, Postgres, or Redis
  - React Native / Expo
  - Crypto, wallet, Solana, or EVM experience

  The base salary range for this full-time position is
  $120K–$200K. The range displayed on each job posting
  reflects the minimum and typical maximum target for new hire
  salaries for the position of a candidate based in New York
  at any level. We do hire exceptionally talented
  professionals with decades of experience in their field. As
  such, our range may be higher than what is displayed. Our
  base salary ranges are determined by experience and
  location, and we hire at all levels for multiple roles.
  Within the range, individual pay is determined by work
  location, job-related skills demonstrated during the
  interviews, working experience, and relevant education or
  training. Please note that the compensation details listed
  in role postings reflect the base salary only and do not
  include equity, tokens, or benefits.
