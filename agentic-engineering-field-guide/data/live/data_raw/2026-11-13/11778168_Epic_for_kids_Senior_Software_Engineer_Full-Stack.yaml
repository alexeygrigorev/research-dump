description: |
  About Us

  Epic Kids is the leading digital reading platform built for
  kids 12 and under, trusted by millions of children,
  educators, and families around the world. Our mission is to
  inspire a lifelong love of reading by providing unlimited
  access to thousands of high-quality books, videos, and
  educational content through a safe and engaging experience.
  We combine technology, storytelling, and learning innovation
  to help every child become a confident reader.

  At Epic, you'll join a collaborative and fast-paced global
  team passionate about building meaningful products that make
  a real impact on children's education and literacy.

  About the Role

  The Senior Software Engineer, Full-Stack owns features end-
  to-end across Epic's web application -- Angular front-end,
  PHP/Symfony and Go services, MySQL -- and helps raise the
  engineering bar for the team. We hire for engineering
  strength over experience with any specific stack; strong
  engineers ramp quickly on ours.

  This is a fully remote, US-based role working closely with a
  global engineering team with members in the US and China.

  What You'll Do

  - Design and ship features end-to-end across the full stack,
    from spec to production.
  - Make sound decisions on architecture, data modeling, and API
    design; document trade-offs and align stakeholders.
  - Drive code quality through code review and testing across
    front-end and back-end.
  - Mentor junior and mid-level engineers through code review
    and pairing.
  - Lead technical design reviews, RFCs, and architecture
    discussions.
  - Use AI-assisted development tools to accelerate delivery,
    holding generated code to the same quality bar.
  - Participate in production support -- investigations, post-
    mortems, and systemic fixes.

  What We're Looking ForRequired Qualifications

  - 2-5 years years of professional software engineering, owning
    complex, cross-team work autonomously.
  - Bachelor's degree or higher in Computer Science, Software
    Engineering, or a related field.
  - Strong front-end engineering with a modern component
    framework (Angular a plus), plus solid
    TypeScript/JavaScript and UI fundamentals (HTML, CSS,
    accessibility).
  - Strong back-end engineering in a modern server-side language
    (we use PHP and Go).
  - Relational-database proficiency -- data modeling, performant
    queries, and indexing.
  - Experience designing and operating production APIs (REST or
    gRPC).
  - Comfort with Git, pull-request workflows, and CI/CD.

  Preferred Qualifications

  - Direct experience with our stack (Angular, PHP/Symfony, Go,
    MySQL) a plus.
  - Experience leading a service migration between
    languages/runtimes (e.g., PHP to Go) in production.
  - Familiarity with Tera for server-side templating.
  - Experience with Docker and Kubernetes (GKE) at the
    application-developer level.
  - Cloud-platform experience -- GCP preferred, AWS or Azure
    acceptable.
  - Experience operating against an observability stack (New
    Relic, Datadog, or similar).
  - Awareness of children's-privacy compliance frameworks
    (COPPA, FERPA).
  - Proficiency in Mandarin Chinese a plus.

  Compensation: 160-210k - inclusive of bonus - flexible for
  the right skillset
