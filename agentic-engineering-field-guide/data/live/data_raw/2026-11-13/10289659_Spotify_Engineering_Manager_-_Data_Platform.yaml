description: |
  Within the Data Platform studio, we own two critical
  pillars: our event delivery platform that collects trillions
  of events per day from producers to consumers, and another,
  which handles the pseudonymisation of data so Spotify can
  use data responsibly and in compliance with privacy
  regulations. These systems sit at the heart of Spotify's
  data collection and are used by hundreds of teams across the
  company.

  We're looking for an Engineering Manager to lead a team of
  six experienced engineers distributed across Europe. You'll
  set the technical direction, ensure the team delivers high-
  impact work, and - just as importantly - invest deeply in
  the growth and careers of your engineers. If you're
  energised by both the technical challenges of large-scale
  data systems and the human side of building a high-
  performing team, we'd love to hear from you.

