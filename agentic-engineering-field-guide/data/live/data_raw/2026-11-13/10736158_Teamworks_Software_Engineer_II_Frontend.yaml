description: |
  AMS (Athlete Management System) is a core product in the
  Teamworks Performance suite, used by elite sports
  organizations and high-performance military programs as
  their single source of truth for physical performance data,
  medical records, and athlete readiness. We're investing
  seriously in modernizing the platform, and we're growing the
  team with a frontend engineer who can take real ownership of
  the React layer as we build the next generation of AMS.

  In this role, you'll be the primary frontend engineer on
  AMS, building the interactive, data-intensive interfaces
  that coaches, trainers, and performance staff rely on every
  day. You'll work closely with backend engineering and design
  to translate complex data workflows into fast, reliable UI,
  with real scope and a clear technical direction from day
  one.

  The Role

  - Own the AMS frontend end to end, building and shipping React
    and TypeScript features from design through production
  - Build complex, data-intensive components including
    interactive grids, forms, dashboards, and widgets that
    handle large datasets efficiently using AG Grid
  - Implement and maintain form-building functionality using
    SurveyJS, and manage application state using React Context
    or Zustand
  - Integrate frontend components with RESTful APIs and Tanstack
    Query, partnering with our backend team to keep data flows
    performant and reliable
  - Collaborate with design and backend engineering to deliver
    intuitive, accessible, and responsive user experiences
  - Contribute to code reviews and Agile ceremonies with our AMS
    team

  What We're Looking ForWhat You Must Bring

  - 3+ years of professional frontend engineering experience
    with strong expertise in React and TypeScript
  - Proven experience building complex, data-driven UI
    components including grids, forms, and dashboards in
    production applications
  - Experience integrating RESTful APIs into frontend
    applications with a solid understanding of async data
    fetching patterns
  - Working knowledge of modern build tooling including RsPack
    and pnpm, with experience shipping in CI/CD environments
  - Ability to work effectively across large timezone gaps, with
    regular overlap with our Australia-based team
  - US citizenship, with willingness to pursue security
    clearance in the future given AMS supports military and
    government performance programs

  Even Better If

  - You're familiar with visualization libraries like Chart.js
  - You have a background in performance-driven applications in
    sports tech, health, or military/tactical environments
  - You have experience working outside pure frontend, such as
    devops, testing, or backend
  - You have some Java background or prior experience working
    alongside backend Java teams

  Why This Role

  AMS is a mission-critical product trusted by elite sports
  organizations and military programs around the world, and
  the frontend work ahead has real scope and real stakes.
  You'll have clear ownership over a layer of the product that
  directly shapes how coaches and performance staff do their
  jobs every day, on a focused team with a clear modernization
  roadmap.

  This role is not eligible for sponsorship at this time.

  Please submit your application through this posting only.
  We're unable to review applications or resumes sent via
  email, LinkedIn, or other channels.

  To all recruitment agencies: Teamworks does not accept
  agency resumes. Please do not forward resumes to our jobs
  alias, Teamworks employees or any other organization
  location. Teamworks is not responsible for any fees related
  to unsolicited resumes.

  About Teamworks

  We're the Operating System for Sports™, powering 7,000+
  organizations worldwide, from collegiate programs to every
  major pro league. Founded in 2006, we've evolved from a
  messaging tool for college football into the leading sports
  tech platform, with 600+ global teammates building the
  future of sports tech. Our solutions span Personnel,
  Coaching, Performance, Operations, and Intelligence -
  helping teams recruit smarter, train better, stay compliant,
  and win. Teamworks is an equal opportunity employer - if you
  live our core values every day and are honest, hardworking,
  humble, committed, innovative, and an all-around exceptional
  person, you'll thrive at Teamworks. We are committed to
  building a diverse and inclusive workforce and take
  affirmative action to not discriminate based on race,
  religion, color, national origin, ancestry, physical
  disability, mental disability, medical condition, genetic
  information, marital status, sex, gender, gender identity,
  gender expression, age, sexual orientation, veteran or
  military status, or any other legally protected
  characteristics. This policy applies to all employment
  practices within our organization, including but not limited
  to recruiting, hiring, promotion, termination, compensation,
  benefits, and training. Teamworks is committed to providing
  reasonable accommodations for candidates with disabilities
  who need assistance during the hiring process. To request a
  reasonable accommodation, please email talent@teamworks.com.
