description: |
  Who We Are

  Inspiren offers a complete and connected technology
  ecosystem for senior living. Founded by Michael Wang, a
  former Green Beret and cardiothoracic nurse, Inspiren was
  built on the belief that compassionate care and technology
  can and should coexist.

  Our integrated solutions fit into existing workflows and
  give senior-living operators greater visibility into what is
  happening across their communities. Supported by nurse
  specialists and powerful analytics, Inspiren helps teams
  make informed clinical and operational decisions that
  improve efficiency, outcomes, and quality of care.

  You’ll join a growing global team united by a shared
  mission, with a new NYC office designed to strengthen
  collaboration and in-person connection.

  About the Role

  Inspiren is on a mission to build a world where technology
  augments and empowers human care. As a Software Engineer on
  our Intelligence & Integrations team, you will be a key
  player in this mission. You'll work on the core systems that
  enable our platform to ingest, process, and make sense of
  real-time data from our hardware devices to deliver on our
  promise to improve healthcare outcomes and quality of life.
  Your work will directly impact our ability to scale, from
  enhancing our data pipelines to building resilient
  integrations with our customers' Electronic Health Record
  (EHR) systems. You'll be a key driver in turning raw data
  into actionable insights for our users.

  What You'll Own

  - Architecture & Scalability: Partner with engineering
    leadership to evolve our core data models and APIs,
    transitioning from our current point-to-point architecture
    to a more resilient, event-driven system.
  - Technical Excellence: Drive a culture of delivering reliable
    and scalable solutions. You'll be a key voice in defining
    best practices for integration and end-to-end testing to
    improve our development velocity and system stability.
  - Customer Integrations: Lead the development and maintenance
    of integrations with third-party systems like EHRs. This
    includes building clean, well-documented APIs and ensuring
    our systems can reliably communicate with a diverse range
    of external platforms.
  - Mentorship: Mentor and elevate other engineers on the team,
    particularly in the areas of distributed systems, AWS best
    practices, and secure development.

  What You Bring

  - Experience: You have 8+ years of experience in backend or
    full-stack development, with a strong background in
    building scalable, cloud-native applications.
  - Cloud: Deep expertise with AWS infrastructure, including
    serverless technologies (Lambda, Fargate), message queues
    (SQS/SNS), and data services (Kinesis, DynamoDB, RDS).
  - Programming: Proficient in TypeScript and Node.js.
    Experience with React is a plus.
  - Databases: Experience with both relational databases like
    PostgreSQL and NoSQL databases like DynamoDB.
  - Data Models: A strong understanding of data modeling
    principles and their application in building scalable and
    performant APIs.
  - AI Adoption: You actively use AI coding tools (Cursor,
    Claude Code) as a core part of how you work. AI usage goes
    well beyond basic prompting and into automating tasks,
    long-running processes, and complex integrations.
  - Problem Solver: You excel at breaking down complex,
    ambiguous problems into clear, actionable steps. You
    thrive in a fast-paced environment and are motivated by
    delivering tangible, high-impact results.
  - Collaborator: You are a strong communicator, capable of
    working with product, data science, and other engineering
    teams to solve real-world business challenges. You believe
    that great software is built through close collaboration.
  - Communication: Excellent verbal and written communication
    skills, with the ability to convey complex ideas clearly.
  - Adaptability: Comfortable working in a fast-paced, dynamic
    environment and adapting to changing priorities.
  - Start-up experience is a plus.



  What You’ll Get

  At Inspiren, you’ll help reshape how older adults live and
  age with greater safety, connection, and dignity. Here’s how
  we support the people making that possible:

  - Competitive Compensation — A strong base salary and variable
    compensation where applicable.
  - Ownership in Our Future — Equity that gives you a stake in
    the impact and value we’re building together.
  - Growth and Recognition — Semiannual reviews that recognize
    your contributions and support your continued development.
  - AI Tools and Training — Access to leading AI tools and
    company-wide training that help you work smarter and
    strengthen your skills.



  For U.S.-Based Employees

  - Health and Wellness — Comprehensive medical, dental, and
    vision coverage, mental-health resources, and employee-
    assistance programs.
  - Financial Protection — A 401(k) retirement plan, HSA and FSA
    options, and company-paid life and disability insurance.
  - Time to Recharge — Flexible PTO, five paid sick days
    annually, company-observed holidays, and company-wide
    recharge periods designated each year.
  - Family Support — Up to 12 weeks of paid parental leave for
    bonding, additional leave for birthing parents, fertility
    and family-building benefits, and paid caregiver and
    bereavement leave.
  - Flexible Work Support — Hybrid and remote arrangements based
    on the role and location, along with home-office,
    internet, or phone reimbursement where applicable.

  Don’t meet every qualification?

  Research shows that women and people of color may be less
  likely to apply unless they meet every qualification. If
  you’re excited about this role but don’t check every box, we
  encourage you to apply—we’d love to hear from you.
