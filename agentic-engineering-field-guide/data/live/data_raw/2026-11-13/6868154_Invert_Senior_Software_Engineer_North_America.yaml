description: |
  What We're Building

  Drug development is one of the most data-intensive endeavors
  in human history. Yet scientists spend more time finding and
  cleaning data than actually using it, slowing down drugs
  that should reach patients faster and more affordably.
  Biopharma has seen billions invested in software. Almost
  none of it was built for the scientists actually running
  experiments.

  Bioprocess data is high-frequency, multi-source, and
  inconsistent. It’s spread across dozens of systems that are
  rarely connected or clean. We make it usable. On top of
  that, our AI agent gives scientists something they've never
  had: the ability to query their full experimental history,
  catch deviations in real time, and make decisions that
  inform million-dollar manufacturing outcomes. We think
  carefully about model behavior, reliability, and what it
  means for AI to be trustworthy in a regulated industry.
  Every engineer here owns that problem.

  This is a place for builders — people who want to own hard
  problems, ship fast, and work with others who hold
  themselves to a high bar.

  The Role

  You will be joining one of our North American engineering
  teams to tackle hard engineering problems that will help our
  customers do their critical science. We build with:

  - Backend: Python, FastAPI, PostgreSQL
  - Frontend: Next.js,TypeScript,Tailwind, Vercel
  - Infrastructure: Terraform, AWS
  - AI: Bedrock, Modal, LiteLLM
  - Streaming data: Kinesis, Greengrass

  As a Senior Software Engineer, you will work closely with
  your peers on engineering and the product team to ship new
  features, maintain existing ones, and push our technical
  towards excellence. Because this is a senior role, you will
  deliver on this mission through both hands-on delivery and
  project leadership.

  Competencies

  - Ownership: We all own the results. Engineers at invert are
    both expected to and have wide latitude to identify
    problems and solve them, as well as to choose how to
    implement features envisioned by our product team. People
    who succeed here don’t wait for orders, they get to work.
  - Strong Communication: In a remote environment, communication
    can be the difference between a project finishing in days
    instead of weeks.
  - Adaptable: This is a fast paced environment and plans change
    when they need to.
  - AI-First: At Invert, we’re committed to making sure every
    team member benefits from how the software industry is
    changing. Adopting AI isn’t optional — it’s a shared
    responsibility and a growth opportunity. You’ll be
    expected to both use the most recent tooling, and discover
    and teach new workflows to your peers.
  - Ambitious: Intrinsically motivated, driven to succeed.
  - Mentors effectively: Educates and empowers others

  The Bar

  - Deep backend and system design instincts, you've built
    things at scale and have the judgment to show for it
  - Strong opinions on code quality, held loosely enough to
    change when the problem demands it
  - You actively seek out new AI tools, form opinions on how
    they should be used, and have a point of view on what good
    AI product looks and feels like
  - You don't wait to be told what to own, you identify it and
    go
  - You over-communicate in writing because you know silence
    creates drag
  - You find the hard problems fun. That's who thrives here.

  The package

  - High-growth startup with impactful work
  - Fully remote, work with great people distributed across US
    and European timezones
  - Competitive salary, equity, and benefits
  - Unlimited credits on your chosen AI coding tools (Claude
    Code, Devin, Codex, etc.)
  - New laptop, monitor, and accessories of your choice
  - Frequent team offsites
  - Unlimited PTO

  The interview process

  The interview process consists of the four stages described
  below. Candidates are assessed between each of these stages.
  The hiring manager is responsible for communicating
  decisions and next steps throughout the process. We aim to
  complete all stages within two weeks.

  - Discovery: A 30-minute conversation with the hiring manager
    to determine whether there is mutual interest in moving
    forward.
  - Technical Coding Challenge: A 90-minute interview with two
    different employees to assess technical coding
    competencies.
  - Technical Leadership Challenge: A 60-minute working session
    with two employees to assess technical leadership
    competencies.
  - Founder Chat: 30-minute meet-and-greet with one or both of
    the founders (depending on whether they have already
    participated in previous interviews).
  - Head of Engineering Chat: 30-minute meet-and-greet with our
    Head of Engineering to answer your questions.

  Invert is an equal opportunity employer. We value diverse
  perspectives and lived experiences — especially in a field
  where better science depends on better systems. If you're
  inspired by our mission, we want to hear from you.
