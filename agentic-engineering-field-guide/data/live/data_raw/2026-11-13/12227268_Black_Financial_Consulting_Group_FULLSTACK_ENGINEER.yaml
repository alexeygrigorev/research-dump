description: |
  This is a remote position.





  The Full Stack Engineer will work across both frontend and
  backend systems to build scalable, reliable, and user-
  focused applications. The role involves collaborating with
  senior engineers, product managers, and designers to deliver
  features, fix issues, and continuously improve product
  performance and usability.



  Key Responsibilities



  - Develop and maintain full-stack web applications.
  - Build responsive frontend interfaces and reusable UI
    components.
  - Design and implement backend services and APIs.
  - Integrate applications with databases and third-party
    services.
  - Collaborate with cross-functional teams to deliver product
    features.
  - Debug, troubleshoot, and optimize application performance.
  - Write clean, maintainable, and well-tested code.
  - Participate in code reviews and agile development processes.
  - Support deployment activities and CI/CD pipelines.



  Required Qualifications



  - Bachelor’s degree in Computer Science, Software Engineering,
    or related field.
  - 5-8 years of experience in full-stack development.
  - Experience building web applications using modern
    frameworks.
  - Strong understanding of frontend and backend development
    principles.
  - Familiarity with Agile development methodologies.
  - Good problem-solving and debugging skills.
  - Ability to work effectively in remote, collaborative teams.
