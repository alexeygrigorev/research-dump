description: |
  Why Accordance

  Accordance is a secure AI platform for professionals in
  accounting and finance that augments productivity and
  automates complex workflows. Accordance uses algorithms with
  reasoning-adept LLMs that have been customized by our expert
  team of finance professionals, engineers, and research
  scientists. We’ve found product-market fit and are scaling
  our team very quickly. Some reasons to join Accordance are:

  - Exceptional product-market fit: We have partnered with the
    largest accounting firms and professional service
    providers in the world.
  - Strategic investors: Raised from top strategic investors.
  - World-class team: Accordance is hiring the best technical
    and non-technical talent from places like OpenAI, FAIR,
    Flexport, DeepMind, Google Brain, and Stanford AI
    Laboratory (SAIL).
  - Partnerships: Our engineers and researchers work directly
    with Microsoft and OpenAI to build the future of
    generative AI and redefine professional services.
  - Value: Top of market cash and equity compensation.

  About the Role

  As a Software Engineer on the Frontend Engineering team at
  Accordance, you will own and lead engineering projects that
  define the user experience of our various product lines. The
  team is composed of highly competent and considerate humans.
  Everything we touch is polished to high standards extending
  to all aspects of our work – from design to architecture to
  code to slack communication. If any of this resonates with
  you, this role might be right for you.

  This role is based in San Francisco, CA. We use an in-person
  work model and offer relocation assistance to new employees.

  Responsibilities

  - Collaborate with designers, research scientists, engineers,
    and finance and accounting experts.
  - Be the eyes and ears of UI excellence, elevate design
    standards across Accordance.
  - Build state-of-the-art progressive web apps that can scale
    with our user base.
  - Collaborate with and assist full-stack product engineers
    with polish.
  - Build and maintain our design system.
  - Ensure all code being pushed to the frontend (across the
    team) is excellent.

  Qualifications

  - Experience with React, Typescript, and CSS.
  - Track record of building fast-growing SaaS products by
    leveraging PWA technologies.
  - Track record of shipping highly intuitive products, strong
    attention to detail.
  - Grit - experience working at early-stage startups is a plus.
  - Strong programming skills.
  - Appreciation for good API designs.

  Accordance is an equal opportunity employer and does not
  discriminate on the basis of race, gender, sexual
  orientation, gender identity/expression, national origin,
  disability, age, genetic information, veteran status,
  marital status, pregnancy or related condition, or any other
  basis protected by law.
