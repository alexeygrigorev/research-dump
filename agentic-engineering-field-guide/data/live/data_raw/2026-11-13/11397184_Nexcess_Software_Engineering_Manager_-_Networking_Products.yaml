  - While performing the essential duties of this job, the
    individual is regularly required to speak and hear
  - While performing the essential duties of this job, the
    individual is regularly required to use hands for
    keyboarding, gross manipulation, and fine manipulation
  - Works at a desk and computer screen for extended periods of
    time
  - Works in a traditional climate controlled office environment
    or from home
  - Works in a highly stressful environment dealing with a wide
    variety of challenges, deadlines and diverse employee
    population

