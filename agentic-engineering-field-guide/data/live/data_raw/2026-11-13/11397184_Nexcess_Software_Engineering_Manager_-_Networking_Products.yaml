description: |
  About Nexcess

  Nexcess provides cloud solutions for companies who need
  control over their environments. Our mission is to simplify
  the experience, lower risk, and enable performance and
  scalability. We leverage our expertise and Nexcess owned
  portfolio of compute, cloud services, hosting and software
  solutions to help businesses grow. We serve 185k customers
  with more than 100,000 servers across the globe. About the
  Team

  Nexcess customers run workloads where performance and
  compliance both matter. The Network Solutions team builds
  the software behind their networking: the customer portal
  features and server-side services for load balancing,
  firewalls, VPN and VPC. We write the code, APIs and
  automation that let customers configure and manage these
  products themselves.

  This is a software engineering team. We don’t run a network
  operations center.

  The Role

  You will lead the engineers who build these products, and
  you will stay hands-on. You own the team’s architecture,
  delivery and roadmap, and you are accountable for what it
  ships. Networking is the product domain. The job is
  engineering leadership.

  What you’ll do

  - Partner with Product on the roadmap and make trade-offs
    visible early.
  - Write specs, review pull requests and ship real changes with
    the team.
  - Scope and cut work monthly, deliver to committed dates and
    report bad news early.
  - Move the team toward DORA High and then Elite, with tests on
    every change.
  - Build AI-assisted engineering into daily work, including
    automated review in the pull-request path.
  - Clear cross-team dependencies before they block delivery.
  - Hold one-to-ones, write growth plans, give direct feedback
    and own hiring.
  - Take a turn on the on-call rotation and close incident
    actions on time.

  What you’ll bring

  - 7+ years in software engineering, including at least 1 year
    leading engineers.
  - You write code and review pull requests today.
  - A record of making a team measurably faster and delivering
    predictably.
  - Hands-on AI-assisted engineering experience, with results
    you can quantify.
  - Experience running on-call and owning hiring.

  A must: background at a managed hosting, cloud, or other
  high-availability service business.

  Our Stack

  Perl, PHP, React and Vue, Postgres and MariaDB, HAProxy and
  nginx, configuration management.

  Networking Knowledge

  You should know the basics: VLANs, VPNs, firewalls and load
  balancers. You don’t need to have administered them in
  production. Your engineers and our network specialists bring
  the depth, and you bring the judgment to ship products on
  top of it.

  How we measure success

  - Speed, measured by DORA metrics.
  - Predictable, reliable delivery.
  - AI adoption and its impact.

  Engineering here exists to move the business, not to be
  busy.

