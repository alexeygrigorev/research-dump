description: |
  CyrusOne is a leading global data center developer and
  operator, delivering secure, scalable, and reliable
  infrastructure solutions for the world’s largest enterprises
  and hyperscale customers. We are committed to operational
  excellence, innovation, and delivering high-performance
  environments that support critical business needs. The
  Senior Operations Engineering Program Manager supports
  execution across key engineering initiatives. This role is
  responsible for coordinating program activities and
  contributing to frameworks that enable the successful
  delivery of operational priorities. The position supports
  the tracking and reporting of key performance metrics,
  monitors program and process effectiveness, and highlights
  insights to support continuous improvement. This individual
  partners cross-functionally to help translate strategic
  plans into actionable deliverables, ensuring alignment and
  progress across the engineering organization. The role
  focuses on driving day-to-day program execution, maintaining
  visibility into milestones, and supporting accountability to
  deliver operational results.

  New Capacity Readiness Program Leadership

  - Own the programmatic framework for new capacity readiness
    across power and mechanical systems, ensuring consistent
    execution across sites and projects.
  - Coordinate across commissioning, engineering, and site
    operations teams to align scope, sequencing, and
    milestones.
  - Track commissioning issues, defects, and punch-list items at
    the program level, ensuring accountability,
    prioritization, and timely closure.
  - Lead the development and execution of Day 1 (new capacity)
    readiness programs, establishing clear readiness criteria,
    stage gates, and exit conditions.
  - Lead the development and execution of a standardized
    turnover process for accepting new capacity into
    operation.

  Risk Management & Mitigation Program Ownership

  - Lead the development and execution of Day 2 (operational
    reliability) readiness programs.
  - Establish and maintain the risk analysis and mitigation
    program framework, including a program-level risk register
    rolled up by site and system.
  - Drive mitigation plans through prioritization, resourcing,
    scheduling, and verification of closure.
  - Ensure risks and mitigations are visible, decision-ready,
    and actively managed, enabling informed risk acceptance or
    remediation decisions.

  Operations-to-Design Program Integration

  - Own the operations-to-design bridge process at the program
    level.
  - Ensure field changes, design deviations, and operational
    impacts identified by engineering or operations are
    documented, communicated to stakeholders, and tracked
    through resolution.

  Cross-Functional Coordination & Schedule Integration

  - Serve as the central coordination point for capacity and
    risk initiatives across engineering, commissioning, design
    and construction, and site operations.
  - Develop and maintain integrated schedules that align
    engineering execution with operational readiness
    milestones.
  - Identify cross-discipline dependencies, conflicts, and
    resource constraints early and drive resolution.

  - Standards, Playbooks & Continuous Improvement
  - Partner with Critical Power and Mechanical Systems
    Specialists and Engineers to translate lessons learned
    into updated readiness playbooks.
  - Standardize capacity readiness, turnover, and risk
    management processes across sites and regions, driving
    continual improvement of all owned programs.

  Project and Program Visibility

  - Develop and execute methodology and processes to provide
    clear, concise reporting on all relevant metrics and
    program KPIs.

  Qualifications

  Education

  - Bachelor's degree in Engineering (Mechanical, Electrical,
    Facilities), Construction Management, Operations, or a
    related technical field; or equivalent practical
    experience in mission-critical infrastructure programs.

  Experience

  - 7+ years of experience in mission-critical environments
    (data centers, critical facilities, high-availability
    infrastructure) in one or more of the following:
    operations, commissioning, engineering,
    design/construction interface, or reliability programs.
  - 4+ years leading cross-functional programs or complex
    projects with multiple stakeholders, dependencies, and
    schedule integration.
  - Demonstrated experience building or operating readiness
    stage gates / go-live criteria for new capacity,
    expansions, or major infrastructure changes.
  - Proven track record driving risk identification, mitigation
    planning, and closure tracking (risk register ownership,
    mitigation verification, executive-ready risk posture).

  Technical & Domain Knowledge

  - Working knowledge of mission-critical infrastructure
    concepts, including:
  - Electrical distribution (UPS, switchgear, generators,
    protection/grounding concepts)
  - Mechanical cooling and heat rejection (chilled water plants,
    CRAH/CRAC, towers/dry coolers, pumping strategies)
  - BAS/BMS and controls sequence implications on operations
  - Ability to interpret and synthesize technical inputs
    (commissioning findings, punch lists, readiness gaps,
    design deviations) into program actions and decisions.

  Program Management & Execution

  Strong capability in:

  - Developing integrated schedules and managing
    interdependencies across engineering, commissioning,
    design and construction, and operations
  - Establishing repeatable processes (templates, workflows,
    governance cadence)
  - Managing program artifacts: stage gate checklists, RAID
    logs, risk registers, issue trackers, readiness dashboards
  - Excellent written and verbal communication skills with a
    demonstrated ability to produce decision-ready executive
    summaries (capacity posture, readiness status, and risk
    exposure).

  Leadership Behaviors

  - Proven ability to influence without direct authority and
    drive closure across multiple organizations.
  - Bias for action, strong follow-through, and comfort
    escalating issues when readiness, risk, scope, or
    timelines are misaligned.

  Travel

  - Ability to travel 25%–50%, based on business and program
    needs.

  Preferred Qualifications

  - Experience supporting multi-site / portfolio-scale capacity
    or reliability programs (regional or global).
  - Familiarity with commissioning and readiness frameworks
    (e.g., Level 1–5 commissioning, IST/ISx, integrated
    systems testing, operational acceptance).
  - Experience developing turnover documentation standards,
    operational readiness repositories, and training
    validation programs.
  - Program/Project Management certification (PMP, PgMP,
    Agile/SAFe PM) or equivalent demonstrated mastery.
  - Reliability or risk credentials/experience (FMEA
    facilitation, MOC/Change Management, operational risk
    frameworks).
  - Advanced proficiency with planning and reporting tools
    (e.g., MS Project, Smartsheet, Power BI, SharePoint/Teams-
    based governance).

  CyrusOne is an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, sex, sexual orientation, gender
  identity, religion, national origin, disability, veteran
  status, or other legally protected status.

  CyrusOne provides reasonable accommodation for qualified
  individuals with disabilities in accordance with the
  Americans with Disabilities Act (ADA) and any other state or
  local laws. We will respond to requests for reasonable
  accommodations to assist you in applying for positions at
  CyrusOne, or to submit a resume.
