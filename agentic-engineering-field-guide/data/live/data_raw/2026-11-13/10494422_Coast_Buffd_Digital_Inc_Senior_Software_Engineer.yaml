description: |
  About the role

  We’re looking for an experienced full-stack product engineer
  to join us as we build the backbone of technical sales. In
  this role, you’ll contribute to the entire tech stack, and
  will need the ability to think critically about product,
  design, and our customers’ goals.

  By keeping a lean team, we’ve been able to move fast and
  want to keep it that way with high performers that take
  pride in their work. The role reports directly to our
  Founders and will work alongside our team in-person in our
  NYC office.

  About you

  - You love to design, build, and work hard. You’re excited to
    roll up your sleeves, build something you’re proud of and
    take ownership.
  - You are / are excited to become an expert on API-first
    companies and the best way to showcase their products
    (bonus: experience working at an API company)
  - You’re low ego, honest and kind.
  - You love builder and design tools and enabling technical
    sellers.
  - Have experience in React, JS for at least 3 years
    professionally (React Native, Expo bonus)
  - Have design experience, strong design thinking skills - a
    lot of our platform is visual so bring skills and
    understanding on graphic design (layout, typography,
    color, etc)
  - Understanding of modern web technologies

  You will

  - Obsess over the UI/UX for onboarding, building experience
    (API integrations) and beyond
  - Collaborate directly with founders on roadmap and
    prioritization
  - Architect and develop across our stack
  - Go the extra mile working on the user experience

  Tech stack

  Web: React, RN for Web

  Backend: Node.js, Express, MongoDB

  Requirements

  - Located in New York and able to work in office
  - Ability to go from 0-to-1
  - Deep understanding of React internals, CSS
  - Ability to architect complex frontend systems
  - Deep familiarity with current web development trends
  - 4+ years of engineering experience (React, JavaScript)
  - Basic understanding of UX/UI principles
  - Exceptionally fast learner, thriving in a fast-paced
    environment
  - Frontend Excellence - you should be able to build any UI or
    experience

  Interview Process

  - Intro call
  - Product Deep Dive
  - Platform Access / Take home activity
  - Technical Interview
  - Meet in person
  - Reference calls
