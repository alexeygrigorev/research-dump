description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About The Role:

  CrowdStrike's Falcon sensor runs on millions of endpoints
  globally, protecting more than half of the Fortune 500
  companies. It's a high-performance, lightweight agent that
  detects and prevents sophisticated threats in real-time.
  It's one of the most widely deployed security platforms in
  the world, running across every major OS and architecture.

  We're looking for a Software Engineer to build the
  development infrastructure that powers this massive-scale,
  cross-platform system. You'll architect the test frameworks,
  deployment pipelines, and developer tools that enable our
  sensor teams to ship production code faster and more
  reliably. Think of this as building the platform that builds
  the platform – solving complex challenges, creating
  frameworks and tools that eliminate friction at scale.

  This role sits at the intersection of systems programming,
  developer productivity, and production infrastructure.
  You'll work in Python (primarily) with touches of C/C++ when
  needed, solving problems like: How do we build and test
  across 10+ OS/architecture combinations in minutes? How do
  we give developers instant feedback on cross-platform
  compatibility? How can we make sensor developer’s lives
  better? How do we deploy sensor updates to millions of
  endpoints with zero downtime?

  Location:

  - This role is hybrid, requiring 2x days per week on-site at
    one of the posted locations.

  What You'll Do:

  - Build production-grade systems that power cross-platform
    sensor development across Windows, Linux, and macOS
  - Architect test and release infrastructure that handles
    dependency management and fast, reliable builds at scale
  - Design developer-facing APIs and tools that abstract away
    platform complexity and accelerate feature velocity
  - Engineer CI systems that provide fast feedback loops and
    enable confident, frequent merges
  - Drive platform evolution by identifying bottlenecks,
    prototyping solutions, and shipping improvements that
    measurably improve developer productivity
  - Collaborate with sensor teams to understand their workflows
    and build leverage points that multiply their
    effectiveness

  What You'll Need:

  - 5+ years building production systems with focus on platform
    engineering, test frameworks, developer tools, or systems
    programming
  - Extensive Python expertise
  - Cross-platform development experience - you've dealt with
    the reality of Windows/Linux/macOS differences
  - Test framework experience - you understand test frameworks
    and the complexity involved to make them robust, reliable,
    backwards compatible, and work on all platforms
  - Collaboration skills - you can work with distributed teams
    and translate needs into technical solutions
  - Experience with GenAI-assisted development workflows or
    building AI-powered developer tools
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - C/C++ experience for low-level system integration
  - CI platform architecture (Jenkins, GitHub Actions, or
    similar at scale)
  - Track record of measurably improving developer productivity
    (e.g., "reduced build times by 60%," "eliminated 80% of
    cross-platform bugs pre-merge")

