description: |
  Collectors is the leading creator of innovative technology
  that provides value-added services for collectors worldwide.
  We grade, authenticate, vault, and sell millions of record-
  setting collectibles, all while modernizing and digitalizing
  the process to further our mission of helping collectors
  pursue their passions. We’re always on the lookout for
  talented people to join our growing team.

  Our services span collectible trading cards, autographs,
  comic books, coins, video games, event tickets, and
  memorabilia. Our subsidiaries include PSA, PCGS, Beckett,
  SGC, and Card Ladder.

  Since our founding in 1986, we have graded and authenticated
  millions of items. We employ more than 3000 people across
  our headquarters in Santa Ana, California and offices in New
  Jersey, Texas, Florida, Japan, Shanghai, Hong Kong, Canada,
  Mexico, Germany, the UK, and France.

  As part of our interview process, we request that candidates
  have their cameras on during video interviews. This helps
  foster meaningful conversation and allows us to create an
  experience that closely resembles our standard working
  environment. Certain interview steps may take place by
  phone. For remote roles, and at our discretion, candidates
  may be asked to participate in an on-site interview as part
  of the final stages of the process.

  We understand there may be occasional circumstances
  requiring accommodation and are happy to discuss them as
  needed. Your recruiter will be able to clarify expectations
  and answer any questions you have.

  Collectors is the leading creator of innovative technology
  that provides value-added services for collectors worldwide.
  We grade, authenticate, vault, and sell millions of record-
  setting collectibles, all while modernizing and digitalizing
  the process to further our mission of helping collectors
  pursue their passions. Our services span collectible coins,
  trading cards, Funko Pops!, video games, event tickets,
  autographs, and memorabilia. Our subsidiaries include PSA,
  PCGS, SGC, WATA, and Card Ladder.

  Since our founding in 1986, we have graded and authenticated
  millions of items. We employ more than 1,900 people across
  our headquarters in Santa Ana and offices in Jersey City,
  Tokyo, Shanghai, Hong Kong, Toronto, Guadalajara, Dallas,
  and Paris.

  We’re transforming the collecting experience with technology
  that brings authentication, grading, and trading into the
  modern era. Our products are equalizing the playing field by
  providing tools that make complex research analytics —
  including pricing, scarcity reports, and historic sales data
  — accessible to every collector, old or new. Our engineering
  mission is to democratize technology while promoting
  innovation, collaboration, and continuous learning
  throughout the organization. We're seeking engineers to
  utilize advanced technology in agile settings, with a focus
  on improving the customer experience for every collector.

  Our Collectors Experience team is enhancing an entirely
  virtual and digital Collectors ecosystem. We’re delivering a
  unified, end-to-end experience across all our brands, from
  grading submissions to marketplace serving millions of
  collectors and investors worldwide. You’ll lead and mentor
  our software engineering team and partner with product,
  design and cross-functional teams. We’re looking for a Staff
  Software Engineering Manager to lead the team behind PSA Set
  Registry, PSA’s flagship experience for collectors to
  organize, compete, and celebrate their PSA-graded
  collections. This is a highly visible, consumer-facing
  product at scale (hundreds of thousands of registered sets)
  with a deeply engaged user base of collectors who care about
  every card, ticket, and set they build on the platform.
  You’ll report to the Director of Software Engineering.

  What You’ll Do:

  - Drive the design, development, and delivery of high-quality
    software products, from concept to production release.
    Build public facing web and mobile apps used daily by a
    passionate global collector community-direct user impact,
    tangible feedback, real customer problems.
  - Partner with Product, Design, and cross-functional teams to
    develop clear business requirements and translate them
    into technical solutions.
  - Oversee the entire software development lifecycle, including
    architecture decisions, code reviews, and release
    management.
  - Lead and mentor teams of software engineers, fostering a
    collaborative and inclusive environment.
  - Promote best practices in engineering, including continuous
    learning, agile methodologies, and high standards for code
    quality and documentation.
  - Troubleshoot complex issues in production applications and
    provide hands-on technical guidance when necessary.
  - Champion company policies and contribute to building a
    positive, engaging culture.
  - Identify opportunities for process improvement and help
    shape long-term technical strategy.

  Who You Are:

  - Experienced engineering manager or technical lead with a
    proven track record of delivering software projects and
    growing engineering teams
  - 10+ years of experience architecting systems (service-
    oriented, event-driven, distributed systems, cloud) as
    well as hands-on development experience in modern api
    development and scalable architectures
  - 5+ years of experience building solutions using AWS
    technologies such as: Lambda, SQS, SNS, EventBridge, API
    Gateway
  - Proficiency in Python
  - Experience using strongly typed languages (C#, Java, etc) is
    a plus
  - Strong fundamentals working with databases and data
    modeling, both relational (e.g. PostgreSQL) & NoSQL (e.g.
    DynamoDB)
  - Experience with IaC such as CDK/CloudFormation or TerraForm
  - Demonstrated ownership and understanding of large, real-time
    high availability systems
  - Deep technical background - comfortable guiding architecture
    discussions, code quality standards, and designing
    reliable, scalable systems
  - Strong communication and interpersonal skills, with an
    ability to promote collaboration across engineering,
    product, and business teams
  - Passion for mentoring and developing engineers, with a
    commitment to continuous learning and growth
  - Nice to have: Familiar with Agile/Scrum methodologies and
    client-side frameworks, such as Vue.js, React, or Svelte

  Collectors uses e-Verify to validate your ability to work
  legally in the United States.

  We are aware that there are instances where individuals are
  receiving job offers that fraudulently allege to be from
  Collectors or one of our business units. This type of fraud
  can be carried out through false websites, through fake
  e-mails claiming to be from the company or through social
  media. We never ask for personal information such as your
  bank account, Social Security numbers or National IDs, nor
  do we send or request payments for the purchase of business-
  related equipment. If you suspect fraud, please reach out to
  interviewfraud@collectors.com.

