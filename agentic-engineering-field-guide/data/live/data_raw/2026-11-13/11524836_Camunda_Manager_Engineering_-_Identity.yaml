description: |
  Camunda is the enterprise platform for agentic
  orchestration, enabling organizations to coordinate AI
  agents, people, and systems across complex, end-to-end
  business processes. With built-in governance, auditability,
  and human oversight, Camunda gives enterprises the control
  they need to move AI from pilots to production — safely and
  at scale. Trusted by over 700 organizations worldwide,
  including 9 of top 10 US banks, Camunda helps enterprises
  boost operational efficiency, accelerate time-to-value, and
  deliver better customer experiences. Fully remote and
  global, we are in the middle of something bigger:
  transforming into an AI-first organisation, built on our own
  platform. We use Agentic AI to automate, orchestrate
  intelligent processes, and elevate human contribution across
  every team. Named GP Bullhound’s Top 100 Next Unicorn list,
  2025 Great Place to Work certified. Visionary in 2025
  Gartner® Magic Quadrant™ for Business Orchestration and
  Automation Technologies. ranked 3rd in Flexa's 2026 Most
  Flexible Companies, We’re growing fast and looking for top
  talent to join our team. If you want meaningful work,
  visible impact and put something genuinely rare on your CV,
  keep reading.

  About the Role:

  An extensible, integration-ready enterprise-grade IAM
  solution is integral to Camunda’s long-term strategy. As our
  next Engineering Manager for Identity, you’ll lead the team
  that builds and delivers the Identity and Access Management
  (IAM) foundation that powers the entire Camunda 8 platform,
  both on-premise and as part of our SaaS offering. This is a
  key role which can have a deep impact on Camunda’s success,
  offering you the chance to have a direct impact on the
  company’s growth.

  As engineering manager, you will be tasked with end-to-end
  delivery of said solutions, and work closely with other
  engineering teams to ensure they are well integrated across
  the entire stack, making it secure, enterprise-ready, and
  easy to integrate at scale. You will coach and grow your
  team in order to deliver a high quality product within a
  predictable timeframe.

  At Camunda, we approach engineering in a holistic manner. As
  such, you will form strong partnerships with product
  management, design, QA, and sales, and work with your peers
  to not only deliver but directly influence the evolution of
  our platform to meet our customer’s needs.

  What You Will Do:

  - Own end-to-end delivery of reusable IAM components across
    the Camunda 8 stack—shaping authentication
    (multi‑protocol), authorization (RBAC), and federated
    organization management that work seamlessly for large,
    integration‑heavy enterprises.
  - Partner closely with multiple engineering teams, SREs, QA,
    and the Product Leadership Team to develop and drive a
    clear technical and product vision; transparently steward
    the roadmap and track commitments from support, incidents,
    and the product backlog.
  - Raise the bar on reliability and efficiency: keep
    build/release pipelines low‑effort and stable, ship
    security fixes within SLOs, and drive down support load,
    bug count, and incident rate.
  - Grow and coach a team of senior and developing
    engineers—setting clear expectations, giving actionable
    feedback, and creating a culture of autonomy,
    accountability, and continuous improvement, especially in
    an asynchronous, remote environment aligned to the DRI
    model.
  - Help mature our SaaS offering for large scale enterprise
    customers, ensuring it can easily integrate with our
    customer’s own IAM solutions in a safe, reliable way.

  What You Will Bring to the Role:

  Must Haves:

  - Senior‑level technical depth in IAM and enterprise software:
    you can review designs, ask the right questions, and
    represent your team to technical and non‑technical
    stakeholders with clarity.
  - Proven track record leading medium‑to‑large delivery: you
    have owned 6‑month‑scale projects from inception to
    release, guiding 3–5+ engineers, writing solution designs
    and project plans, and delivering on time without
    micromanagement in a remote, asynchronous setting.
  - Hands-on experience either implementing or integrating IAM
    solutions; you understand protocols like OIDC and SAML and
    how they work in complex enterprise environments.
  - Strong communication and stakeholder management: you
    translate business requirements into actionable
    engineering plans, can speak with customers when needed,
    and drive decisive, low‑churn outcomes.
  - Background in product engineering for integration‑heavy B2B
    products (not primarily consulting), with a deep
    appreciation for enterprise needs around security,
    operability, and performance.

  - Ability and/or willingness to use our product.

  Nice to Haves:

  - Experience with workflow orchestration platforms or similar
    distributed systems.
  - Familiarity with Spring Security and the broader Spring
    ecosystem.
  - Experience implementing IAM federation.
  - Experience with clustered/distributed, eventually consistent
    applications.
  - Experience with L3 support/incident management.
  - Experience working in a fully remote organization.

  This role is an existing vacancy

  #LI-SG1 #LI-Remote #USEAST #C1

  What We Have to Offer:

  Compensation

  We offer competitive, fair, and transparent compensation.
  Salary ranges are location-based, with Standard and Major
  markets (global tech hubs) reflecting local competition.

  The Annual Total Target Cash (base salary + 100% variable
  target, where applicable) shown below spans from the minimum
  in a Standard market to the maximum in a Major market. Final
  offers depend on skills, experience, and location, and we
  typically hire in the first half of the range to allow room
  for growth:

  - United States: $172,600.00 to $278,300.00
  - United Kingdom: £108,400.00 to £178,300.00
  - Singapore: S$214,400.00 to S$321,500.00
  - Canada: C$183,300 to C$301,500

  If you’re based elsewhere, you’ll be hired via Remote.com
  (our global employer partner), and your Talent Acquisition
  Partner will provide a personalized Total Rewards Calculator
  after your first interview.

  Equity: We also offer equity (where applicable) through our
  Virtual Stock Option Plan (VSOP).

  Benefits & Perks

  We invest in your wellbeing, growth, and ability to connect,
  along with perks that support you no matter where you’re
  based. Our benefits are globally designed and locally
  delivered where applicable.

  - Remote & Flexible: Work from anywhere with the setup that
    suits you, home office budget, co-working space support,
    and flexible time off to recharge when you need it.
  - In Person Connection: We invest in meaningful face time
    through our Annual Kickoff (Vienna in 2025, Madrid in
    2026!), team offsites, and Camundi Connection Budgets,
    including contributing to meetups while travelling,, and
    local gatherings with fellow Camundi.
  - Health & Wellbeing: Access locally tailored healthcare,
    Modern Health for global mental wellbeing, and our Live
    Well Lifestyle Spending Account (LSA), a flexible, global
    benefit that puts you in control of your whole life, not
    just work, from: staying active, to caring for family,
    exploring personal passions, meaningful experiences, and
    investing in your financial wellbeing. The Live Well
    program launches in 2026 and scales to €1,000 annually
    from 2027.
  - Financial Security: Retirement and pension plans (often with
    company contributions), plus life and disability insurance
    where relevant.
  - Professional Growth: Up to $/€/£1,000 per year for self-
    driven learning: courses, certifications, books, you
    decide!

