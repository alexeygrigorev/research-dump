description: |
  Job Title: Senior Full Stack Web Developer - Only EST ZONE
  candidates to apply

  Location: Remote Work

  Type: 6+ Month Contract

  Rate: $Open /hr.

  Position Overview

  We are seeking a highly experienced Senior Full Stack Web
  Developer with strong expertise in modern web application
  development. The ideal candidate will have extensive
  experience building scalable, high-performance applications
  using Angular or React on the frontend and Python on the
  backend. This role requires hands-on development experience
  across the full software development lifecycle and a passion
  for delivering robust, user-centric solutions.

  Key Responsibilities

  - Design, develop, test, and maintain scalable web
    applications.
  - Build responsive and interactive user interfaces using
    Angular or React (TypeScript).
  - Develop secure and efficient backend services and RESTful
    APIs using Python and the Flask Framework.
  - Design, develop, and optimize relational database schemas,
    queries, and stored procedures.
  - Collaborate with cross-functional teams, including product
    owners, UX designers, QA, and DevOps engineers.
  - Write clean, maintainable, and well-documented code
    following industry best practices.
  - Perform code reviews, troubleshoot production issues, and
    optimize application performance.
  - Participate in architecture discussions and contribute to
    technical design decisions.
  - Mentor junior developers and promote engineering best
    practices.

  Requirements

  Required Qualifications

  - 10–15 years of overall IT experience.
  - 8–10 years of hands-on experience in full-stack web
    application development.
  - Strong proficiency in Angular or React using TypeScript.
  - Strong backend development experience using Python and the
    Flask Framework.
  - Extensive experience designing and developing RESTful APIs.
  - Strong knowledge of Relational Database Management Systems
    (RDBMS) such as PostgreSQL, MySQL, SQL Server, or Oracle.
  - Solid understanding of object-oriented programming, design
    patterns, and software engineering principles.
  - Experience with Git and modern version control practices.
  - Strong analytical, troubleshooting, and problem-solving
    skills.
  - Excellent verbal and written communication skills.

  Preferred Qualifications

  - Experience with cloud platforms such as AWS, Azure, or
    Google Cloud Platform.
  - Familiarity with Docker, Kubernetes, and CI/CD pipelines.
  - Experience with automated testing frameworks and Agile/Scrum
    methodologies.
  - Knowledge of application security best practices and
    performance optimization techniques.

  Benefits

