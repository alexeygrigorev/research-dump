description: |
  About N1:

  N1 is the first hyper-performant and horizontally scalable
  blockchain network designed to enable trustless computing at
  internet scale.

  N1 is comprised of a team spanning backgrounds from Harvard,
  CMU, DFINITY, VMWare, Galaxy Digital, and more, and is
  backed by top-tier institutions like Founders Fund, Kraken
  Ventures, SALT, Amber Group, and more.

  Position Overview:

  As a key member of the software engineering team, you will
  spearhead the development of the core backend components for
  our blockchain network, focusing on networking, reliability,
  and scalability. Your primary responsibilities will entail
  designing and coding core backend software components
  primarily in Rust, leveraging your extensive experience to
  ensure the creation, testing, debugging, and deployment of
  production-grade components. Your role will involve
  maintaining and enhancing high-quality software engineering
  practices within a prominent open-source project.

  Requirements:

  - Bachelor's degree in Computer Science or related technical
    field or equivalent practical experience
  - Experience in designing, testing, and implementing scalable
    backend systems
  - Experience with a low level programming language like Rust,
    C, C++, Zig
  - Experience in systems programming. Strong signals include
    experience writing compilers, operating systems, kernels,
    machine simulators
  - Experience writing correct, reliable software. Must have
    worked on and deployed software changes to software used
    by people
  - Creative, independent, and collaborative team player with
    the ability to work in a fast paced environment
  - Active participation in Bitcoin/Ethereum/Blockchain projects
    or the open-source community is highly desirable

  The base salary range for this full-time position is $120k -
  $260k. The range displayed on each job posting reflects the
  minimum and typical maximum target for new hire salaries for
  the position of a candidate based in New York at any level.
  We do hire exceptionally talented professionals with decades
  of experience in their field. As such, our range may be
  higher than what is displayed. Our base salary ranges are
  determined by experience and location, and we hire at all
  levels for multiple roles. Within the range, individual pay
  is determined by work location, job-related skills
  demonstrated during the interviews, working experience, and
  relevant education or training. Please note that the
  compensation details listed in role postings reflect the
  base salary only and do not include equity, tokens, or
  benefits.
