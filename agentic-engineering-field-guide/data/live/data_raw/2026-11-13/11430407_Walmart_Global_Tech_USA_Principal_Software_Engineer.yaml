description: |
  Position Summary...

  What you'll do...Role summary: Join Walmart as a Principal
  Software Engineer to lead platform engineering initiatives
  that deliver scalable, cloud-native solutions and AI-
  enhanced applications. This role drives the full software
  development lifecycle across multiple teams, ensuring high
  availability, reliability, and innovation in distributed
  systems. The position requires strategic technical
  leadership, mentorship, and collaboration with cross-
  functional partners to align engineering efforts with
  business goals. The successful candidate will champion
  continuous improvement, technical excellence, and the
  integration of advanced technologies to support Walmart’s
  evolving platform capabilities and long-term roadmap.

  **Immigration Sponsorship support will NOT be available for
  this position** About the team: The Data Ventures team
  advances supplier-facing analytics by integrating data
  engineering, product intelligence, and supplier experience.
  They develop a centralized, role-aware intelligence platform
  delivering real-time insights into key business metrics.
  Their solutions enable dynamic, self-serve analytics and
  replace offline workflows with AI-driven forecasting and
  recommendations. Focused on scalable data products, the team
  directly impacts supplier health and supply chain
  performance. This collaborative environment emphasizes
  innovation, technical excellence, and delivering actionable
  insights that empower suppliers to make informed decisions
  efficiently.

  What you'll do:

  - Deliver platform capabilities including infrastructure,
    tooling, and ML frameworks aligned with roadmap
    priorities.
  - Drive full software development lifecycle activities such as
    coding, testing, deployment, monitoring, and maintenance.
  - Apply cloud-native architecture principles to ensure
    scalable, resilient, and agile systems.
  - Lead system design reviews to validate quality and alignment
    with architectural standards.
  - Build AI-driven applications integrating ML components for
    automation and multi-step reasoning.
  - Mentor engineers, influence technical decisions, and promote
    engineering excellence.
  - Collaborate cross-functionally to define user problems and
    translate them into actionable technical requirements.
  - Continuously improve processes, tools, and products through
    innovation and data-driven practices.

  What you'll bring:

  - Proven expertise in cloud-native architecture, including
    microservices, containers, and automation to build
    scalable and resilient systems.
  - Strong proficiency in software design patterns, API design,
    and platform development to deliver maintainable and
    modular solutions.
  - Experience leading Full Stack software development lifecycle
    activities, including coding using JAVA, React, GraphQL
    and BigQuery, testing, CI/CD deployment, and
    observability.
  - Ability to conduct system design reviews ensuring alignment
    with architectural best practices and project goals.
  - Skilled in mentoring engineers and influencing technical
    decisions to promote engineering excellence and continuous
    improvement.
  - Data-driven problem-solving skills with a focus on
    delivering high-quality, customer-centric software
    solutions.

  About Walmart Global Tech: Imagine working in an environment
  where one line of code can make life easier for hundreds of
  millions of people. That’s what we do at Walmart Global
  Tech. We’re a team of software engineers, data scientists,
  cybersecurity expert's and service professionals within the
  world’s leading retailer who make an epic impact and are at
  the forefront of the next retail disruption. People are why
  we innovate, and people power our innovations. We are
  people-led and tech-empowered. We train our team in the
  skillsets of the future and bring in experts like you to
  help us grow. We have roles for those chasing their first
  opportunity as well as those looking for the opportunity
  that will define their career. Here, you can kickstart a
  great career in tech, gain new skills and experience for
  virtually every industry, or leverage your expertise to
  innovate at scale, impact millions and reimagine the future
  of retail. Flexible, hybrid work We use a hybrid way of
  working with primary in office presence coupled with an
  optimal mix of virtual presence. We use our campuses to
  collaborate and be together in person, as business needs
  require and for development and networking opportunities.
  This approach helps us make quicker decisions, remove
  location barriers across our global team, be more flexible
  in our personal lives. Benefits: Beyond our great
  compensation package, you can receive incentive awards for
  your performance. Other great perks include a host of best-
  in-class benefits maternity and parental leave, PTO, health
  benefits, and much more. Equal Opportunity Employer:
  Walmart, Inc. is an Equal Opportunity Employer – By Choice.
  We believe we are best equipped to help our associates,
  customers and the communities we serve live better when we
  really know them. That means understanding, respecting and
  valuing diversity- unique styles, experiences, identities,
  ideas and opinions – while being inclusive of all people.
  The above information has been designed to indicate the
  general nature and level of work performed in the role. It
  is not designed to contain or be interpreted as a
  comprehensive inventory of all responsibilities and
  qualifications required of employees assigned to this job.
  The full Job Description can be made available as part of
  the hiring process.


   At Walmart, we offer competitive pay as well as
  performance-based bonus awards and other great benefits for
  a happier mind, body, and wallet. Health benefits include
  medical, vision and dental coverage. Financial benefits
  include 401(k), stock purchase and company-paid life
  insurance. Paid time off benefits include PTO (including
  sick leave), parental leave, family care leave, bereavement,
  jury duty, and voting. Other benefits include short-term and
  long-term disability, company discounts, Military Leave Pay,
  adoption and surrogacy expense reimbursement, and more.

  You will also receive PTO and/or PPTO that can be used for
  vacation, sick leave, holidays, or other purposes. The
  amount you receive depends on your job classification and
  length of employment. It will meet or exceed the
  requirements of paid sick leave laws, where applicable.

  For information about PTO, see
  https://one.walmart.com/notices.

  Live Better U is a Walmart-paid education benefit program
  for full-time and part-time associates in Walmart and Sam's
  Club facilities. Programs range from high school completion
  to bachelor's degrees, including English Language Learning
  and short-form certificates. Tuition, books, and fees are
  completely paid for by Walmart.

  Eligibility requirements apply to some benefits and may
  depend on your job classification and length of employment.
  Benefits are subject to change and may be subject to a
  specific plan or program terms.

  For information about benefits and eligibility, see
  One.Walmart.

  The annual salary range for this position is $110,000.00 -
  $220,000.00

  Additional compensation includes annual or quarterly
  performance bonuses.

  Additional compensation for certain positions may also
  include :
  - Stock

