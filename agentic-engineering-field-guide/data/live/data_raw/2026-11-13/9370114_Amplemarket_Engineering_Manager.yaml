description: |
  What is Amplemarket all about?

  Amplemarket's premise is that a lot of the playbooks used by
  B2B sales teams that worked 5 years ago don't cut it
  anymore.

  In today's environment, sales teams need to have a
  tremendous amount of information about their prospects to
  decide when is the best moment and channel to reach out in
  the most relevant way. You can't do this with 5 different
  data/sales enablement point solutions that don't share the
  same data schema and barely communicate with each other.
  Amplemarket is the all-in-one compound solution that enables
  this.

  Our AI-powered sales platform helps B2B companies generate
  more opportunities thanks to our advanced lead generation
  engine, hyper-personalized sequencing, omnichannel outreach,
  and AI-powered smart actions. We are backed by Y Combinator,
  and we are powering the sales teams at some of the fastest-
  growing companies in the world like Deel, Moveworks, H1 and
  Vanta.



  This position is available for candidates based in EMEA,
  LATAM or North America.

  Important Notice: Beware of Recruitment Scams

  It has come to our attention that there are fraudulent
  activities targeting job seekers, where individuals are
  impersonating Amplemarket by using fake profiles, domains,
  and emails. Please be informed that Amplemarket always uses
  our main domain (amplemarket.com) for all hiring and
  recruitment purposes. Any communication or offer not
  originating from an amplemarket.com email address should be
  regarded as suspicious.

  - We will never request personal financial information (such
    as bank account details) during the initial application or
    interview process.
  - Our hiring process does not involve transferring money or
    making payments of any kind to secure a position.

  Amplemarket is not responsible for any loss or damage
  incurred as a result of job scams or fraudulent activity by
  third parties misusing our company name.

  If you have any doubts about the legitimacy of a job
  opportunity with Amplemarket, please contact our HR
  department directly.

  We advise you to verify the authenticity of any job-related
  communications claiming to be from Amplemarket. If you have
  any concerns or doubts, please contact us directly through
  our official channels.

  Your security is our priority. Thank you for your vigilance
  and understanding.

  Software engineers build the core of Amplemarket.

  The three co-founders have an engineering background (João,
  Luís and Mica studied Physics & Computer Science at
  university) and deeply value the work that engineers are
  responsible for.

  Our main goal is to build a sales platform that helps
  companies grow. Our product requires us to solve a myriad of
  difficult engineering problems very diverse in nature: from
  working on NLP models that can extract information from a
  thread of emails, to scaling an elasticsearch cluster
  holding terabytes of data.

  We are deeply aware of the importance of our tool to our
  customers and look for people that share that vision.

  Among other things, our stack includes: Ruby on Rails,
  React, PostgreSQL, Elasticsearch, Redis

  We don't require you to have experience in our stack to
  apply.

  However, it's important to note that while this position
  primarily focuses on people and process management, there is
  a significant technical aspect we expect from candidates.
  The ideal candidate should possess the ability to work
  hands-on with the codebase when necessary, providing
  technical guidance, troubleshooting complex issues, and
  ensuring the overall quality and efficiency of our
  engineering efforts.

  This role involves leading greenfield projects from the
  ground up, building new products that leverage Large
  Language Models and modern AI technologies, with meaningful
  ownership over both execution and technical direction.

  Main Responsibilities:

  - Report directly to the founders
  - Provide leadership and mentorship to other engineers on the
    team
  - Plan engineering sprints
  - Recruit a robust team of engineers that are among the best
    in the industry, from outreach to closing
  - Empower the engineering team to achieve a high level of
    technical productivity and quality
  - Manage an excellent team of engineers, helping to develop
    their careers with stretch projects and excellent feedback
  - Contribute to engineering-wide initiatives as part of the
    engineering management team



  Some more about Amplemarket:

  - We are a post-Series A start-up
  - Backed by YCombinator
  - Strong technical founding team from MIT and IST (also
    founders of https://fermatslibrary.com/)
  - Fast growing startup with product market fit
  - Great team spirit



  We offer:

  - Nice work environment
  - Competitive Salary
  - Health Insurance
  - Stock Options
  - Annual Company Trip in a secret location
  - and more



  Amplemarket is committed to creating an inclusive employee
  experience for all.

  Regardless of race, gender, religion, sexual orientation,
  age, disability, or if you’re parenting the next generation
  of innovators, we firmly believe that what truly matters is
  how your skills, knowledge and personality fit our company.
  So bring your best professional version of yourself, and
  apply - we'd like to hear from you!
