  We are looking for a Frontend Engineering Intern who will
  get to help us build our revolutionary fintech product. You
  should expect to be in the cockpit of a high-growth startup,
  getting the exciting opportunity to write high-quality code
  and keep on top of novel technologies right from the get-go.
  Join us and become part of our journey to empower the lives
  of millions!

  About the company Kadmos is on an ambitious mission to
  revolutionise salary payments to migrant workers. The
  Berlin-based startup was founded in 2021 by MIT graduates
  Justus Schmueser and Sasha Makarovych to bring fintech, low
  margins, and transparent FX to industries riddled with
  opaque mark-ups, kickbacks, and physical cash transactions.

  Backed by renowned VCs Addition and Atlantic Labs, Kadmos
  has raised more than $39 million since 2021. The company
  intends to use the funding for expanding across industries
  and further accelerating product development. For more
  information, visit https://www.kadmos.io/

  Job Description

  What you can expect

  - Focus on React. You will help us build our web application
    by learning to use React to its fullest potential.
  - Support the testing and implementation endeavours. Your
    responsibilities will include writing unit and end-to-end
    tests, implementing designs, and optimizing for
    performance.
  - Collaborate with the best. Work with and grow alongside our
    highly experienced and capable engineering team.
  - Enjoy regular feedback sessions. At Kadmos, we are all on
    the same path of growth! Feedbacks are an integral part of
    our no-hierarchy work culture and are freely shared across
    the team.

  Qualifications

  Must have requirements

  - You are currently working on a Bachelor's/Master's degree in
    computer science or related subjects
  - Initial experience with JavaScript and React
  - Passion for working with cutting-edge tech in the context of
    a high-growth fintech startup
  - Willingness to work in an agile team with quickly evolving
    requirements
  - Fluency in English

  Nice to have requirements

  - Previous projects with React

