description: |
  Role:                                 Software Engineer
  Department:                     Engineering Location:
  UK - London Reports into:                    Lead Software
  Engineer

  About the role:

  disguise is looking for a mid-level software engineer who
  considers themselves a generalist programmer. You will work
  in a small, highly focused team that is light on process and
  hands-on by default, writing software for demanding end
  users in situations where failure is visible to an audience
  of thousands.

  Our products design, sequence and control live productions
  across film and TV, broadcast, and live events. The code you
  write runs in front of an audience, often with no second
  take.

  What you will do:

  - Own delivery of projects: customer projects, large features
    and internal tooling
  - Build and help specify new features, working with Product to
    shape them
  - Improve, support and maintain existing areas of the product
  - Write testable, maintainable code, and the unit tests that
    prove it
  - Debug methodically, using tools and logging to establish
    root cause rather than symptom
  - Review the work of others constructively, explaining the
    reasoning behind a correction
  - Work closely with Support so they understand issues in the
    codebase
  - Share knowledge of your areas with the wider team

  Essential experience we are looking for:

  - 3+ years experience writing C++ in a professional
    environment
  - Experience releasing at least one commercial software
    product
  - Experience working in a team to create code, review code and
    fix bugs

  Desirables:

  - Background in high performance, real-time systems
  - Experience of Visual Studio, Python, Windows, DirectX
  - Graphics development, Unreal Engine 5, or games industry
    experience
  - Media server experience

  Skills, behaviour and values we are looking for:

  - You will have clear communication, both verbal and written

  - You will have excellent attention to detail, when writing
    and reviewing code
  - You will enjoy problem solving complex issues with a curious
    and inquisitive mind
  - You will be technically competent and interested in building
    out a product (ie, what the product should do, what else
    can make the product great)
  - You will be collaborative, working with the team to build a
    product and knowledge share
  - You will be pragmatic in the way you approach writing code
  - You will be passionate to expand your knowledge
  - You will have the resilience to keep experimenting

  About Disguise

  Disguise is the industry-leading platform sitting at the
  heart of a new era of visual experiences. One powerful
  integrated system of software, hardware and services to help
  create the next dimension of real-time spectacle. We partner
  with the biggest entertainment brands and companies in the
  world to deliver the A-list of live music events, live TV
  broadcasts, immersive experiences, installations, theatre,
  film and TV production, corporate communications and brand
  product launches. Working with Disney, Snapchat, Netflix,
  ESPN, the Burj Khalifa, and Adele, Disguise is the number
  one partner delivering the next dimension of entertainment.

  Watch our showreel

  Don’t Disguise your differences.

  Innovation comes from everyone. We strive to create a
  workplace that reflects our diverse audience. We celebrate
  our people for their full authentic selves, and embrace
  uniqueness. Inclusion and Equity matter at Disguise. We
  create together and we create everywhere.

  Our values

  - Honest. We are real with ourselves and our clients and share
    our ideas with openness and transparency.
  - Evolutionary. We innovate using our user’s ever-changing
    needs so our technology remains ahead-of-the-game.
  - Fearless. We take the best path, not the easiest, and
    innovate where it’s right, not where it’s simplest.
  - Resilience. We don’t give up until we find the right
    solution, even if it means going outside our remit.
  - Belong.  We create an environment where everyone feels like
    they belong and is empowered to do their best work.

  Our benefits

  - We have a suite of globally relevant competitive benefits
    packages as we want to make sure we retain the best talent
    out there. Our benefits for every perm hire, globally
    include:
  - Unlimited Paid Time Off - with minimum time you must take
    set at 20% above statutory
  - Hybrid working between home and our offices (dependent on
    role and location)
  - Mental health and wellbeing support - subscription to the
    Calm app, mental health first-aid buddies, employee
    assistance programmes
  - Gig allowance - £400 (or local equivalent) to spend on
    tickets every year to immerse yourself in our industries
  - Belonging policies -  including (but not limited to) support
    for Parental, Fertility, Miscarriage, Menopause and
    Transitioning
  - Training, coaching & mentoring
