description: |
  About Aalyria:

  Aalyria is a leading technology company that supplies laser
  communications technology and temporospatial software-
  defined networking platforms to the aerospace industry. With
  technology acquired from Google, Aalyria is at the forefront
  of innovation in satellite and airborne mesh networks, as
  well as cislunar and deep-space communications. We are
  revolutionizing the orchestration and management of
  planetary mesh networks using any radio or optical spectrum,
  any orbit, and any hardware across land, sea, air, and
  space.

  Role Overview:

  We are seeking an experienced Software Engineer to join our
  core Spacetime engineering team, working on the data models
  and APIs that sit at the foundation of how we represent and
  evolve complex communications networks. We value engineers
  who are adaptable, proactive, and eager to tackle new
  challenges as we advance our technology. The ideal candidate
  brings strong software engineering fundamentals and a track
  record of designing durable, production-grade interfaces. As
  a Software Engineer on Spacetime, you'll play a central role
  in shaping the core models and APIs that every other team
  builds on, with the flexibility to take ownership of new
  projects as both you and the company grow.

  You'll work alongside a team of seasoned engineers from top-
  tier tech companies, managing project priorities, timelines,
  and deliverables while designing, building, testing, and
  operating the systems that power Spacetime.

  Key Responsibilities:

  - Design and evolve core data models for complex
    communications networks.
  - Design, build, and operate the APIs through which users and
    systems interact with Spacetime.
  - Develop durable abstractions for heterogeneous physical and
    logical networks.
  - Maintain the quality, compatibility, consistency, and
    performance of core product models and interfaces.

  Required Qualifications:

  - Bachelor's degree in Computer Science or a related technical
    field.
  - 5+ years experience designing and developing production
    software systems.
  - Strong software engineering fundamentals, including system
    design, testing, and debugging.
  - Experience designing durable APIs, schemas, or domain
    models.
  - Experience evolving production interfaces while maintaining
    compatibility.
  - Proficiency in Golang, C/C++, Rust, or Java

  Preferred Qualifications:

  - Experience modeling a variety of physical layer (RF,
    optical) communications systems
  - Experience with production transport network design and
    operations.
  - Familiarity with networking, telecommunications, or network
    orchestration.

  Compensation

  The base salary for this role is $154,000 – $174,000, which
  may vary by geographic location. Compensation also includes
  a competitive equity grant, an annual performance bonus, and
  a comprehensive benefits package. Your final offer will
  reflect your location, skills, qualifications, and
  experience.

  What We Offer:

  - Innovative Environment: Work at a cutting-edge company
    shaping the future of aerospace communications.
  - Impactful Work: Directly contribute to critical national
    security programs and initiatives.
  - Growth Opportunities: Expand your career with opportunities
    for professional development and advancement.
  - Inclusive Culture: Be part of a collaborative, supportive,
    and inclusive workplace where your contributions matter.
  - Flexibility: Flexible working arrangements including hybrid
    remote/in-office schedules.
  - Compensation and Equity: Competitive salary, comprehensive
    benefits (401(k), dental, vision, health, life insurance),
    paid time off, and equity options.

  ITAR/EAR Requirements:

  This position involves access to export-controlled
  information. To comply with U.S. government export
  regulations, applicants must meet one of the following
  criteria:

  (A) Qualify as a U.S. person, which includes:

  - U.S. citizen or national
  - U.S. lawful permanent resident (green card holder)
  - Refugee under 8 U.S.C. 1157
  - Asylee under 8 U.S.C. 1158

  (B) Be eligible to access export-controlled information
  without requiring an export authorization.

  (C) Be eligible and reasonably likely to obtain the
  necessary export authorization from the appropriate U.S.
  government agency.

  The company reserves the right to decline pursuing an export
  licensing process for legitimate business-related reasons.

  Equal Opportunity Employer Statement:

  Aalyria is an Equal Opportunity Employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. We do not discriminate based
  on race, color, religion, sex (including pregnancy, gender
  identity, and sexual orientation), national origin, age,
  disability status, genetic information, protected veteran
  status, or any other characteristic protected by law.
  Qualified applicants from all backgrounds are encouraged to
  apply.
