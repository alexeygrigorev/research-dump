description: |
  About the Team:

  Information processing and sense-making systems are the
  lifeblood of national security efforts, facilitating an
  understanding of the global situation, strategic planning,
  and tactical execution. The reliability, accessibility, and
  sophistication of these systems can determine the outcomes
  of conflicts before they begin. STR’s Analytics and Command
  & Control (AC2) Division focuses on developing actionable,
  advanced technology solutions to provide asymmetric
  advantages within the information domain.

  The Mission Applications (MA) Group within the AC2 Division
  specializes in ensuring the technology that STR creates
  produces outsized mission impact. Staff within the MA group
  have a deep understanding of missions and technology needs
  for national security with skills targeting transition of
  technology to operational use, including product management,
  UX Product implementation, software integration & mission
  engineering, platform engineering, DevOps, and program
  management. MA staff combine with other science and
  engineering staff from the various STR research and
  development groups to form dedicated product teams focused
  on accelerating the operational transition of cutting-edge
  software technologies.

  The Role:

  As a Mission Engineer (Full Stack) in the Mission
  Applications Group, you will develop and deploy software
  essential for a specific, real-world objective or "mission"
  in partnership with our customers. You have: 1) expertise in
  developing and deploying software solutions in complex and
  high-security environments, 2) deep domain knowledge in the
  complex missions executed across the Department of Defense,
  and 3) expertise in modern frameworks, building full stack
  applications, and integrating APIs for deployment in high-
  security environments.

  You will work as a leader of software teams to design,
  develop, and maintain software systems deployed in
  operational use. You have experience managing customer
  relationships while simultaneously leading engineering teams
  to ensure the delivered product meets the highest standards
  of quality, reliability, and performance. 

  What you will do:

  - Build Prototype Capabilities: Break down use cases and user-
    defined problems, build an MVP, and rapidly evolve a
    solution into a cohesive application
  - Develop and Enhance Features: Create high-performance,
    visually appealing frontend solutions that handle complex
    use cases effectively. Ensure the product is fast, smooth,
    and intuitive to use, even under heavy load
  - System Integration: Leading cross functional engineering
    teams to design, build, and deploy a cohesive system.
    Integrate independent capabilities into existing solutions
  - Customer Collaboration: Working closely with end-users and
    customers, who are typically military or Government
    operators, to understand their requirements and translate
    them into software features. You are experienced in
    product discovery best practices
  - Deployment and Field Testing: Traveling to integration sites
    to deploy, test, and triage software in secure operational
    environments.  On average, travel to customer sites should
    not exceed one week per month

  Who You Are:

  - Active Secret Security Clearance with the ability to obtain
    Top Secret level with SCI Eligibility
  - BS in Computer Science or related technical field with at
    least 7 years of work experience. Equivalent experience
    will be considered
  - Experience deploying software for DoD or IC missions
  - A passion for crafting user-centric interfaces and a
    keen eye for design details
  - Demonstrated strong knowledge of modern technologies such
    as React, TypeScript, and Python
  - Knowledge of performance-focused tools and techniques for
    rendering large datasets and building responsive, smooth
    interfaces
  - A demonstrated ability to adopt new languages, libraries,
    and technologies
  - Organized, detail-oriented, and with an ability to work both
    independently and collaboratively
  - Demonstrated experience as an effective communicator to both
    technical and non-technical audiences

  Even Better:

  - Advanced Degree in Computer Science, Information Technology,
    or related technical field
  - Prior US Military Service with experience in joint planning,
    large force battle monitoring, and fluidity with large
    force debrief best practices
  - Located in San Diego, CA, Denver, CO, Arlington, VA, or
    Boston, MA, or willing to relocate

  Pay Information Full-Time Salary Range: $175,000 - $240,000

  The salary range listed is based on external market data.
  Offers are based on factors, such as but not limited to, the
  candidate’s experience, education, training, key
  skills/critical skills, security clearances, and prevailing
  market and business conditions.

  STR is a growing technology company with locations near
  Boston, MA, Arlington, VA, near Dayton, OH, Melbourne, FL,
  Carlsbad, CA, Atlanta, GA, and Denver, CO. We specialize in
  advanced research and development for defense, intelligence,
  and national security in: cyber; next generation sensors,
  radar, sonar, communications, and electronic warfare; and
  artificial intelligence algorithms and analytics to make
  sense of the complexity that is exploding around us.

  STR is committed to creating a collaborative learning
  environment that supports deep technical understanding and
  recognizes the contributions and achievements of all team
  members. Our work is challenging, and we go home at night
  knowing that we pushed the envelope of technology and made
  the world safer.

  STR is not just any company. Our people, culture, and
  attitude along with their unique set of skills, experiences,
  and perspectives put us on a trajectory to change the world.
  We can't do it alone, though - we need fellow trailblazers.
  If you are one, join our team and help to keep our society
  safe! Visit us at www.str.us for more info.

  STR is an equal opportunity employer. We are fully dedicated
  to hiring the most qualified candidate regardless of race,
  color, religion, sex (including gender identity, sexual
  orientation and pregnancy), marital status, national origin,
  age, veteran status, disability, genetic information or any
  other characteristic protected by federal, state or local
  laws.

  If you need a reasonable accommodation for any portion of
  the employment process, email us at appassist@str.us and
  provide your contact info.

  Pursuant to applicable federal law and regulations,
  positions at STR require employees to obtain national
  security clearances and satisfy the requirements for
  compliance with export control and other applicable laws.
