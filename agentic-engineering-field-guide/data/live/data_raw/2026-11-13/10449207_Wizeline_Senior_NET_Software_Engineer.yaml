description: |
  Senior .NET Developer (Card Payment Experience)

  We are

  Wizeline is a global AI-native technology solutions provider
  that develops cutting-edge, AI-powered digital products and
  platforms. We partner with clients to leverage data and AI,
  accelerating market entry and driving business
  transformation. As a global community of innovators, we
  foster a culture of growth, collaboration, and impact.

  With the right people and the right ideas, there’s no limit
  to what we can achieve.

  Are you a fit?

  We're looking for a Senior .NET Developer with a passion for
  building scalable, cloud-native applications and distributed
  systems. In this role, you'll design, develop, and maintain
  high-quality backend solutions using modern .NET
  technologies while collaborating with cross-functional teams
  to deliver reliable, secure, and high-performing software.

  You'll play a key role in designing microservices,
  implementing event-driven architectures, improving CI/CD
  pipelines, and contributing to technical decisions that
  shape the future of our platform.

  If you're passionate about software craftsmanship, cloud
  technologies, and building resilient distributed systems,
  we'd love to meet you.

  Qualifications:

  - Excellent communication and collaboration skills. English B2
    Advanced or C1
  - Proven experience as a .NET Core Developer (.Net 6 / 8)
  - Card payment experience
  - Strong understanding of object-oriented programming
    principles
  - Proficiency in C#
  - DevOps experience, pipeline, releases. (ideally with
    AzureDevOps)
  - Unit tests, integration and end to end testing experience
  - Cloud computing and related concepts (ideally with Azure)
  - Messaging systems (ideally Azure Services Bus brokered,
    topics and queues)
  - Experience with Event driven and/or microservices
    Architecture and related patterns
  - Experience with Distributed Systems and related patterns,
    focusing on fault-tolerant environments:
  - Experience integrating with internal and external Apis
  - Experience with Terraform or Infrastructure as Code (IaC)

  Nice-to-have

  - AI Tooling Proficiency: Leverage one or more AI tools to
    optimize and augment day-to-day work, including drafting,
    analysis, research, or process automation. Provide
    recommendations on effective AI use and identify
    opportunities to streamline workflows.

  Why You'll Love This Role

  - Build modern cloud-native applications using the latest .NET
    and Azure technologies.
  - Work on scalable, event-driven, and distributed
    architectures.
  - Collaborate with highly skilled engineers in an AI-native
    technology company.
  - Influence technical decisions and contribute to engineering
    best practices.
  - Enjoy continuous learning, professional development, and
    global collaboration opportunities.

