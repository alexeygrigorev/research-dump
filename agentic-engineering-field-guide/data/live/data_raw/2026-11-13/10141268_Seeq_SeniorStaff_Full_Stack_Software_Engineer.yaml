description: |
  Seeq creates cutting-edge data analytics software for
  industrial process data, serving sectors like
  pharmaceuticals, energy, and manufacturing. Our core product
  is a robust calculation engine capable of executing advanced
  math and machine learning algorithms on streaming time-
  series data. By leveraging generative AI, we enhance
  usability and accelerate outcomes for our users.

  As a fully remote company, Seeq fosters collaboration using
  tools like Zoom, Slack, and our own Qube Virtual Office.
  With a focus on agile principles, our team of talented
  engineers is dedicated to building products that exceed
  customer expectations while nurturing a supportive,
  collaborative environment.

  Your Passion:

  Passionate about crafting exceptional software, you revel in
  writing code with elegance, extensibility, and
  maintainability as your guiding principles.

  Your Skills:

  Always striving to perfect your craft, you excel as a
  teammate.  Meticulous and detail-oriented, you advocate for
  unit testing, continuous integration, and elegant solutions.
  Bugs are your adversaries, and you take pleasure in
  immediately squashing them.

  Having reached a high potential for your own output, you’ve
  begun taking on leadership roles and mentoring others to
  help scale up your team.

  Collaboration:

  Eager to collaborate through pair-programming or other means
  to contribute to team acceleration, you consistently
  participate in code reviews and take advantage of them as
  positive learning opportunities, both for yourself and
  others on the team.

  The Tech Stack:

  Comfortable across the tech stack, you excel in a JVM
  language or Python for backend functionality. Your expertise
  may extend to databases, distributed computing, and cloud
  platforms.  When working on the front-end, you craft
  visually appealing pages for our Typescript + React
  application.

  Your Drive:

  Interested in finding the best way to solve problems, you
  want to have an impact that extends beyond your individual
  technical contributions.  Armed with a bachelor’s degree in
  Computer Science or equivalent experience, you bring years
  of experience as a Senior software development engineer,
  leading successful development efforts within your team.
  Proactive in seeking and providing feedback, you maintain
  open communication about growth opportunities with your
  manager(s) and colleagues. Getting together in person once a
  year is something you’d look forward to. Seeking work-life
  balance, you aspire to contribute your skills to a startup
  with a promising future, surrounded by a diverse group of
  intelligent, collaborative individuals. Your desire to join
  Seeq is motivated by a belief that it is a perfect fit for
  your skills and aspirations, as evident in your application
  cover letter response to the question, “What makes Seeq a
  good fit for you?”

  Requirements

  - Substantial professional experience in software development,
    with a solid record of designing, building and evolving
    complex software systems over a period of years
  - Demonstrate a strong understanding of software design
    principles, patterns, and best practices
  - Expertise in building large React applications with
    TypeScript
  - Expertise in one or more backend languages, such as Java,
    Kotlin, or Python
  - Experience building and deploying generative AI
    infrastructure and/or applications
  - Experience working with databases such as Postgres or MySQL
  - Ability to work effectively across frontend and backend
    codebases, owning features end-to-end
  - Excellent problem-solving and analytical skills, with great
    attention to detail
  - Proven leadership skills, with the ability to guide and
    mentor junior engineers
  - Excellent communication and collaboration skills, and the
    ability to work effectively in a cross-functional team
    environment
  - Familiarity with agile development methodologies and tools,
    such as Scrum or Kanban

  Benefits

  Seeq is a remote-first (only) company founded by serial
  entrepreneurs. Our executive team and board of directors
  have extensive experience with successful startup ventures
  in high-growth environments.

  We are founded on the idea that companies need better
  solutions for quickly and easily getting business insight
  from their industrial process data. Our mission is to
  provide software and services that convert that data into
  meaningful information that the business can use to improve
  profitability.

  We have a wonderful, kind-hearted, talented team that loves
  to collaborate, lead by example, and exceed our customers’
  expectations. We are certified as a great place to work, an
  emerging startup, the Technology Fast 500, and Inc.
  Magazine's Best Places to Work.

  The Perks of Working at Seeq

  - Competitive salary plus cash bonus incentives.
  - Benefits:

  Seeq provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, or genetics.

  You must be authorized to work in the country in which you
  reside. Seeq does not sponsor US F1 or H-1B work visas
