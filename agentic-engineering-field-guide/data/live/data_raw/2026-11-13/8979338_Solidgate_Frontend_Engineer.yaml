description: |
  Our Mission and Vision

  At Solidgate, our mission is clear: to empower outstanding
  entrepreneurs to build exceptional internet companies. We
  exist to fuel the builders — the ones shaping the digital
  economy — with the financial infrastructure they deserve. To
  achieve that, we’re on a bold path: to become the #1
  payments orchestration platform in the world.

  About the Team and Role

  We’re looking for a Frontend Engineer to join our Finance
  Engineering team, which builds the finance system. It’s
  essentially a highly powerful calculator that helps
  businesses run smoothly. The goal is simple: ensure that
  every dollar merchants and Solidgate earn ends up in their
  accounts correctly and on time.

  We process over 18 million payments every month, generating
  fees based on each individual’s specific settings. This
  affects automated payouts and financial reports.

  Why it may be your next big move

  Impactful work. Build a mission-critical platform that
  directly affects the products you use every day. We’re
  defining what future Solidgate financial contracts will look
  like.

  Collaboration with experts. Work alongside engineers who
  built systems at Amazon, Revolut, Wix, and other world-class
  products.

  Autonomy & ownership. Own your work end-to-end — from design
  to deployment — and see the direct business impact of your
  decisions.

  AI-assisted engineering: We invest in developer productivity
  by fully covering tools like GitHub Copilot,
  Windsurf/Cursor, and Coderabbit. You’ll write less
  boilerplate, ship faster, and focus on solving real problems
  — not fighting with repetitive code.

  Why is it the perfect time to join?

  We’re building a next-generation financial system from
  scratch — not refactoring legacy code.

  We’re standardizing fee calculation logic, making
  configuration transparent and modular, and laying the
  groundwork for new financial modules such as pricing,
  billing, ledger, and more.

  Explore our technology stack ➡️ here.

  What You’ll Drive

  - Expand the platform with new financial configurationsBuild
    frontend solutions that support new contract types,
    commission models, and flexible configurations, enabling
    merchants to precisely define their financial terms.
  - Build internal tools for operational teamsDevelop powerful
    back-office interfaces used to configure merchant invoices
    and balances, and manage complex recalculation processes
    involving millions of transactions and commissions.
  - Contribute to the web platform and design systemHelp evolve
    the design system and shared frontend libraries, improving
    consistency, scalability, and developer experience across
    the entire product.
  - Develop customer-facing financial experiencesCreate fast and
    intuitive interfaces that allow users to search and
    download invoices, view balances, and easily navigate
    their financial data.

  What We Pay Attention To: Technical MasteryYou know your way
  under the hood:

  - 3+ years of commercial experience building applications with
    TypeScript/React
  - Deep knowledge of browser internals, networking, and web
    performance
  - Proven ability to design and implement systems outside of
    frameworks
  - Hands-on experience with automated testing
    (Unit/Integration/E2E)

  Mindset & ImpactYou don’t just ship code — you own outcomes:

  - Product mindset — You think end-to-end and build solutions
    that solve real user problems.
  - Ownership & independence — You drive projects forward and
    take responsibility for decisions.
  - Ability to learn quickly — You pick up new technologies and
    patterns without waiting for instructions.
  - High standards & accountability — You deliver reliable
    systems and hold yourself to exceptional quality.

  The Points That Make You Stand Out

  - Familiarity with architectural approaches such as DDD, Clean
    Architecture, Hexagonal, or Layered architecture
  - Background in building and maintaining component libraries
    or design systems
  - Full-stack development background

  Why Solidgate?

  High-impact role. You’re not inheriting a perfect system —
  you’re building one.

  Massive growth opportunity. Solidgate is scaling rapidly —
  this role will be a career-defining move.

  Top-tier tech team. Work alongside our driving force — a
  proven, results-driven engineering team that delivers. We’re
  also early adopters of cutting-edge fraud and chargeback
  prevention technologies from the Schemes.

  Great product. We’ve built a fintech powerhouse that scales
  fast. Solidgate isn’t just an orchestration player — it’s
  the financial infrastructure for modern Internet businesses.
  From subscriptions to chargeback management, fraud
  prevention, and indirect tax — we’ve got it covered. We hold
  financial licenses in key regions and are a direct Visa &
  Mastercard partner and sub-reseller (top 5 globally).

  💌 The Extras: 30+ days off, unlimited sick leave, free
  office meals, health coverage, and Apple gear to keep you
  productive. Courses, conferences, sports and wellness
  benefits — all designed for ideas, focus, and fun.

  Tomorrow’s fintech needs your mindset. Come build it with
  us.

  🫂 Know top talent? We’re always on the lookout. Refer
  someone for our role, and if they get hired, there’s a bonus
  waiting for you — simple as that.
