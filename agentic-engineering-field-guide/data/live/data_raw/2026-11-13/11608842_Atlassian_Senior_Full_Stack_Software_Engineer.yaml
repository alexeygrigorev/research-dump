  Engineering | San Francisco, United States | Remote, Remote
  Working at Atlassian Atlassians can choose where they work -
  whether in an office, from home, or a combination of the
  two. That way, Atlassians have more control over supporting
  their family, personal goals, and other priorities. We can
  hire people in any country where we have a legal entity. To
  help our teams work together effectively, this role is fully
  remote, but requires you to be located in either US Pacific
  or Mountain time zones. We're looking for a Senior Fullstack
  Software Engineer to join our team, passionately focused on
  delivering creative improvements for our engineering teams.
  What You'll Do:

  - You will guide the technical direction and implementation of
    large-scale product features

  - Evaluate trade-offs between correctness, robustness,
    performance and customer impact to ensure we build the
    right solution

  - Collaborate with product, design and engineering to
    influence product strategy and direction

  - Ship well-tested, secure, reliable, and maintainable code
    while keeping our customers best interests in mind

  - React to how our product is used in the wild, and help to
    fix bugs and production issues as they occur

  - Contribute to code reviews, documentation, and complex bug
    fixes with security, performance and reliability in mind

  - Mentor and level up the skills of your teammates by sharing
    your expertise

