description: |
  About WorkWhile WorkWhile is on a mission to help workers
  earn a better living and live better lives. More than 80
  million Americans work hourly jobs, often with unpredictable
  schedules that pay close to minimum wage and offer limited
  benefits, leading to financial instability.

  WorkWhile is revolutionizing frontline work by creating a
  more flexible and efficient labor market. Powered by AI, the
  WorkWhile platform helps businesses quickly access high-
  quality talent. Workers benefit from same-day pay, free
  telehealth services, upskilling, and the ability to choose
  shifts that match their skills and schedules.

  We have the audacious goal to align incentives and solve
  inefficiencies in the labor market, disrupting the $650
  billion staffing and recruiting market. Backed by Khosla
  Ventures and recognized by the Inc. 5000 for 10x growth,
  WorkWhile is reshaping the future of work.

  What you'll do

  - Collaborate closely with our leadership team and cross-
    functional partners to build thoughtful, impactful
    features that serve both workers and businesses
  - Take the lead on key initiatives, guiding projects from
    design through implementation, delivery and ongoing
    improvement
  - Help shape our technical systems, internal tools, and team
    culture as we continue to grow
  - Balance pragmatism with care - aiming for scalable,
    maintainable solutions that meet real user needs
  - Support and mentor teammates, helping foster a collaborative
    and inclusive engineering culture

  What we're looking for

  - Deep experience in backend development (Python), with an
    understanding of how backend systems support product and
    user-facing experiences
  - A thoughtful approach to technical leadership, including
    experience leading projects or product areas
  - Strong communication skills, with the ability to collaborate
    effectively across disciplines
  - Interest in contributing to a supportive, mission-driven
    team where autonomy and trust are valued
  - Experience mentoring others or helping grow a team is a plus

  Engineering @ WorkWhile

  - We’re a small and mighty team with senior engineers from
    Rippling, Stripe, DoorDash, Faire among others
  - We value user-centricity, competence, speed, and having fun
  - We embrace independence and take ownership of our projects,
    yet are also great team players
  - We deal in outcomes, not projects

  Benefits & Perks

  - Remote work culture with optional office hubs in SF, NY &
    Toronto
  - In-person company offsites
  - Medical, dental, & vision coverage
  - Flexible time off
  - 401(k)
  - WFH stipend to support your home office needs

  WorkWhile has a diverse, mission-driven, and supportive
  culture—we look for people who want to take ownership, are
  energized by ambiguity, and strive to make a lasting impact.
  If this resonates with you, we’d love to chat!

  WorkWhile is an Equal Opportunity Employer. Women,
  minorities, individuals with disabilities and protected
  veterans are encouraged to apply.
