  Job Summary

  We’re hiring a US-based Full Stack Website Developer to
  build, optimize, and maintain websites and CRM systems
  across multiple platforms. This is a hands-on role for
  someone who thrives in a fast-paced environment and can
  deliver high-quality work with urgency and attention to
  detail.

  You will be responsible for managing end-to-end website and
  CRM development projects, ensuring builds are completed on
  time, functional, user-friendly, and aligned with business
  goals. This is an ideal opportunity for a proactive
  developer with strong platform expertise, a polished
  portfolio, and excellent communication skills.

  Key Responsibilities

  - Build, customize, and maintain websites across platforms
    such as WordPress and Shopify
  - Manage CRM setup, customization, and integrations using
    tools such as HubSpot and HighLevel
  - Handle full-cycle website and CRM builds from planning
    through launch
  - Ensure all projects are delivered on time and meet high
    standards for quality, performance, and usability
  - Troubleshoot bugs, technical issues, and integration
    challenges quickly and effectively
  - Collaborate with internal stakeholders to understand
    business needs and translate them into technical solutions
  - Optimize websites for speed, responsiveness, SEO readiness,
    and conversion performance
  - Maintain clear, proactive communication on progress,
    blockers, timelines, and deliverables

