description: |
  Description

  We're growing fast and looking for a Senior Backend Engineer
  to join our AppSec Solution group, home of company core
  platform, and play a key role in shaping the architecture
  and infrastructure the whole product runs on.

  This is a high-impact, cross-functional role where you'll
  work closely with our Software Architect, team leads across
  R&D, DevOps and Product, helping us build the foundations
  for what comes next, including running AI agents inside the
  product at scale.

  If you're independent, opinionated and love turning a design
  on a whiteboard into a production system, we'd love to meet
  you.

  RequirementsWhat We're Looking For:

  - 7+ years of backend engineering experience, with architect-
    level depth in system design
  - Strong production experience with Node.js and TypeScript
  - AI-first: you build with AI tools every day, adopt new AI
    technologies early, and look for ways AI can improve
    developer experience and system performance
  - Deep experience with databases at scale: data modelling,
    performance, and evolving a data layer in production
  - Proven hands-on experience in platform engineering and
    infrastructure, including shared foundations adopted
    across teams
  - Hands-on experience with Kubernetes and a strong
    understanding of DevOps practices
  - Track record of leading cross-team technical projects and
    influencing without formal authority
  - Clear written communication: design docs and technical
    reviews

  Nice to have:

  - Practical understanding of LLMs and AI agents
  - Experience with cloud cost optimization
  - Background in cybersecurity or SaaS
