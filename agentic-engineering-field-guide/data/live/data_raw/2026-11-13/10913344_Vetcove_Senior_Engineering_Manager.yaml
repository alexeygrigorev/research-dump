description: |
  Join Vetcove and help modernize the future of veterinary
  software and the pet parent healthcare experience. Our suite
  of platforms features a market-leading procurement
  marketplace, an ultra-modern home delivery ecommerce
  experience, and a next-generation practice management
  system. More than 25,000 hospitals across all 50 states rely
  on Vetcove daily, supporting tens of thousands of
  veterinarians who care for tens of millions of pets each
  year.

  We are modernizing the 50 billion dollar plus animal health
  industry by giving veterinary organizations the tools to
  focus more on patient care. Backed by Y Combinator and top
  venture investors in Silicon Valley, New York and Miami,
  Vetcove is a fast-growing, mission-driven company. We are
  searching for talented and passionate people who want to
  help shape the future of veterinary care.

  About the Position



  We are looking for a Senior Engineering Manager to lead a
  high impact team of software engineers with a strong focus
  on people leadership, mentorship, and engineer growth. We
  are looking for someone who enjoys coaching engineers,
  building strong teams, creating clarity, and helping people
  do the best work of their careers.

  As a Senior Engineering Manager at Vetcove, you will help
  guide projects from conception to completion across much of
  the technology stack. Your involvement will span team
  leadership, execution planning, mentorship, hiring, career
  development, architecture discussions, technical strategy,
  and engineering process improvement. You should also be
  close to the code, able to understand technical tradeoffs,
  assist with code reviews, and help unblock engineers.

  As a leader supporting the core features of the Vetcove
  platform, you will help ensure we are building intuitive,
  reliable, and innovative products that veterinary
  organizations depend on every day. You will work closely
  with engineers, product leaders, and company leadership to
  move quickly, maintain high technical standards, and support
  the long term growth of the team.



  About our team

  We believe every engineer at Vetcove should have a holistic
  view of the business and feel ownership across many areas of
  our technology stack. Our engineering leaders are no
  exception. We value managers who stay close to the code,
  understand the customer experience, and lead by creating
  clarity, developing people, and helping teams execute
  effectively.

  We move quickly in an industry that has historically been
  slow to adopt technology. As Vetcove continues expanding its
  offerings to better serve veterinary groups and supply chain
  partners, we are rapidly growing our engineering
  organization while maintaining a strong focus on code
  quality, system reliability, thoughtful product development,
  and strong people leadership.

  You will have the opportunity to work closely with end
  users, support engineers across different stages of their
  careers, help the team tackle large scale infrastructure
  challenges, and shape how our engineering organization
  evolves. We operate in a fully remote environment that
  emphasizes ownership, autonomy, communication, and teamwork.



  What you'll do



  - Lead, mentor, and grow a team of engineers with a strong
    focus on people development, team health, and career
    growth
  - Support engineers through regular coaching, feedback, goal
    setting, and career development conversations
  - Create clarity for the team around priorities, expectations,
    ownership, and successful outcomes
  - Partner closely with product and engineering leadership to
    define priorities, drive execution, and deliver successful
    outcomes
  - Support projects from early planning and architecture
    through implementation, rollout, and long term maintenance
  - Stay close to the technical work by understanding system
    design, reviewing technical plans, participating in
    architecture discussions, and helping evaluate tradeoffs
  - Assist with code reviews and technical feedback where
    helpful, while primarily enabling the team rather than
    acting as a regular direct contributor
  - Help unblock engineers by providing context, asking the
    right questions, connecting people, and clarifying
    priorities
  - Contribute to the conceptualization and technical design of
    new ideas and product enhancements
  - Help drive architectural improvements that prioritize
    scalability, reliability, maintainability, and performance
  - Reinforce strong engineering standards, development
    practices, testing habits, and ownership across the team
  - Help promote a culture of quality, accountability,
    collaboration, and continuous improvement
  - Work directly with our CTO, engineering leadership, and
    cross functional partners to continuously evolve our
    products and technical foundation
  - Support hiring, onboarding, mentorship, performance
    feedback, and career development across the engineering
    organization
  - Foster a collaborative, low ego, high ownership culture in a
    fully remote environment



  What you should have



  - 7+ years of professional software engineering experience,
    preferably building modern web applications
  - Experience managing, leading, or mentoring engineers in a
    fast moving technical environment
  - A genuine interest in people management, coaching, feedback,
    and engineer growth
  - Strong technical judgment and the ability to understand
    code, architecture, system design, and engineering
    tradeoffs
  - Comfort assisting with code reviews and technical
    discussions, even if you are not expected to contribute
    production code regularly
  - Bachelor's Degree required, ideally in Computer Science
  - Ability to design systems and features with scalability,
    security, reliability, and performance in mind
  - Experience working with databases and analyzing queries for
    optimization opportunities
  - Comfortable working in a fully remote environment



  The typical base pay range for this role across the U.S. is:
  $170,000/year -$230,000/year + bonus + equity + benefits.
  There is a different range applicable to specific work
  locations. For Colorado, the salary range is: $180,000 -
  $215,000 + bonus + equity + benefits. This salary range is a
  good faith estimate of what Vetcove may pay for this
  position at the time of posting. Actual compensation may
  vary based on skills, qualifications, and experience. The
  range reflects the base hourly rate or annual compensation
  (as applicable), and does not include bonus, equity or other
  incentives.

  In addition to base compensation, Vetcove offers a
  comprehensive benefits package. Please refer to the
  “Benefits (Full Time Roles)” section above for more details.
  To apply, please submit your application through Vetcove’s
  Careers Page. The application deadline is on an ongoing
  basis.



