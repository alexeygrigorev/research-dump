description: |
  ABOUT HAPPY MONEY

  Happy Money is a consumer finance company that empowers
  people to achieve their goals through simple, transparent
  loans funded by trusted financial institutions. Through its
  proprietary lending platform, Hive, Happy Money delivers a
  fully digital experience that simplifies borrowing for
  consumers and helps credit unions, banks and asset managers
  diversify balance sheets and scale with confidence.  Happy
  Money’s end-to-end loan origination and participation
  programs provide partners with turnkey access to high-
  performing assets, underpinned by disciplined credit
  expertise and robust risk management. Together with its
  lending partners, Happy Money has originated more than $7
  billion in loans to help nearly 350,000 people take greater
  control of their financial futures. Learn more at
  happymoney.com. View our Employee Privacy Policy here. Happy
  Money is a 100% fully distributed company. Remote work
  doesn’t mean less work, we work full-time jobs and show up
  to them fully every day. To learn more about our values and
  the way we work, review our Happy Money Way Overview!

  ABOUT THE ROLE

  Happy Money’s Engineering team is seeking to hire a Senior
  Software Engineer to design, build, deploy, and own consumer
  applications, infrastructure, and data-delivering products
  and services in support of Happy Money’s lending business.
  You will work in an autonomous environment, and be able to
  take general direction and formulate specific tasks to
  accomplish the desired results for Happy Money Customers.
  You have a strong sense of product ownership and a customer
  mindset. You will work to contribute to complex functional
  specs and design docs when necessary.

  RESPONSIBILITIES

  - Develop and build products that provide an exceptional
    customer experience for our members.
  - Own design, test, development and delivery of new and
    existing features.
  - Participate in all phases of the software development life
    cycle.
  - Collaborate with product managers, designers, business
    owners, and other engineers to identify the best
    solutions.
  - Demonstrated experience driving engineering efficiency
    through the adoption of AI-driven coding agents and
    agentic workflows, to autonomously build, test, and ship
    complex React applications at scale.
  - Experience implementing automated frontend testing for
    critical components and user workflows.
  - Capable of working in isolation to design solutions to
    complex problems.
  - Design and develop maintainable, scalable, fault-tolerant,
    and efficient systems.
  - Upholding code quality to ensure features are up to
    standards to deliver a quality product.
  - Prioritize team needs in technical debt and tooling to
    relieve operational load and evolve the system to meet the
    changing needs of the environment.
  - Bring positive energy into meetings and ensure all coworkers
    feel valued and included in every interaction.
  - Mentor other frontend engineers across the Engineering team.
  - Demonstrate a proactive mindset by defaulting to action,
    taking initiative to address challenges, and driving
    projects forward.

  ABOUT YOU

  - 5+ years building production React applications, with deep
    expertise in React, hooks, and component architecture at
    scale.
  - You have production experience developing in ReactJS, CSS,
    GraphQL, Javascript, NodeJS, and are a polyglot with
    working knowledge of Python, Java, and the ability to pick
    up new languages and technologies quickly.
  - Delivering a product across the entire technology stack
    motivates you more than working in an individual silo of
    frontend or backend, but you have a stronger affinity and
    experience building frontend user interfaces and UI based
    SDKs for other developers.
  - Believe strongly in testing everything you design and
    develop using automation.
  - Ability to scope, scale, and prioritize tasks to help team
    project plan and deliver on their milestones, delivering
    results over clear and ambiguous business and technical
    projects.
  - You have excellent written and verbal communication skills.
  - You are results-oriented, and know how to unblock yourself
    and others to achieve goals and objectives.
  - Familiarity with AWS technologies - EC2, S3, Lambda, API
    Gateway, etc.
  - You have production experience developing scalable/highly
    available consumer applications.
  - You have a BA/Master degree in Computer Science or related
    field of study or equivalent work experience.

  BENEFITS & PERKS

  - Generous medical, dental, and vision insurance options
  - Eligible for Annual Bonus
  - 401k Plan with a matching contribution
  - Financial wellness suite with high-yield savings, credit
    building, and home buying support
  - Generous PTO including sick leave, vacation, volunteer, and
    more
  - Paid Parental Leave
  - Company-paid short & long term disability and life insurance
  - Monthly tech stipend to help cover expenses for remote work
  - Happy Money is a 100% fully distributed workforce within the
    USA

  Base Salary Range

  $140,000—$160,000 USD
