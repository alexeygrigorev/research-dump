description: |
  About The Role

  Security Engineering keeps Jane, and the patient data our
  clinics trust us with, safe. The team is growing from
  shipping security controls to running a full product
  portfolio, and we're bringing on our first dedicated Product
  Manager to help shape what comes next.

  Our customers are mostly Jane's own developers, managers,
  and teams, plus the clinics and practitioners whose patient
  data we protect. Security at Jane works through partnership,
  so good security work here means controls people are glad to
  adopt. You'll help drive change through influence and
  curiosity, learning why things are the way they are before
  pushing to change them.

  We sit within Enablement, a group focused on helping
  everyone at Jane build quickly, safely, and securely on a
  shared paved road. Much of our engineering now happens with
  AI coding agents in the loop, which changes both the threats
  we face and the tools we can use to defend against them.
  You’ll help us lead at that intersection.

  As our Product Manager, you’ll partner with Security
  Engineering and others on strategy, risk, vendor decisions,
  and more. You’ll own the why (priorities and requirements)
  and the rollout (adoption across teams, tracking, and
  reporting) for two areas: our in-house security platform and
  Jane Account Protection. You’ll also partner with teams
  across Jane on platform security. If you’re curious,
  collaborative, and excited about security work that makes
  life easier for the people it protects, we’d love to hear
  from you.

  The Impact You Could Have

  - Partner with Security leadership on overall roadmap,
    priorities, and vendor decisions, facilitating trade-offs
    between teams and stakeholders and bringing your own point
    of view.
  - Own the roadmap for our in-house security platform, growing
    it into a reliable, scalable product with solid product
    practices and the development org on board as partners.
  - Own product management for Jane Account Protection, bringing
    privacy, legal, identity, and even patient communications
    perspectives together.
  - Bring a strong security perspective to access management and
    platform security, partnering with the teams that own
    those areas to shape requirements, review designs, and
    support delivery.
  - Run build-versus-buy evaluations and proofs of concept with
    clear rubrics, and keep an eye on the security tooling
    landscape to inform what’s worth building at Jane.
  - Give leadership a clear view of what matters most through
    reporting and project tracking for the areas you own
  - Write the briefs, specs, and communication plans that make
    rollouts easy for everyone to say yes to.
  - Champion pragmatic, responsible AI adoption, both in how you
    work day to day and in how we understand and defend
    against the new risks AI coding agents and workflows can
    bring.

  The Experience We Feel We Need

  - 3+ years in product management, or in a closely related role
    like security engineering, GRC, or technical program
    management with a move into product, ideally on security,
    infrastructure, platform, or developer-facing products.
  - Working fluency in security areas like code scanning
    (SAST/DAST), vulnerability management, secrets exposure,
    and incident response.
  - Familiarity with identity and access management concepts
    such as SSO, MFA, OAuth/OIDC, or session management, and
    comfort partnering with another PM who owns a product
    area.
  - Hands-on use of AI coding agents and AI tools, with a clear
    sense of the risks they introduce, such as prompt
    injection, secrets leakage, over-permissioned agents, and
    unreviewed code.
  - High emotional intelligence and genuine curiosity, with a
    track record of influencing engineers and leaders without
    formal authority.
  - Strong written communication, including a one-page brief a
    skeptical engineering manager will happily read to the
    end.
  - Experience in healthcare, fintech, or another regulated
    environment (PHI/PII, SOC 2, HIPAA, PIPEDA, PHIPA), or
    with agentic security tooling like AI-driven vulnerability
    detection or automated remediation, is a nice bonus.

  If you don't meet every single qualification but are excited
  about this role, we'd still love to hear from you.

  More About Jane

  Jane is a founder-led, high-growth SaaS company with a
  remote-first team working across Canada, the US, and the UK,
  united by our mission to help the helpers. We build the
  products and tools that thousands of clinics rely on every
  day to run their businesses, care for their patients, and
  grow their communities. That level of impact means every
  person at Jane plays an important role in how we show up for
  our customers. We're all responsible for being deeply
  connected to their needs, obsessed with improving their
  experience, and proud of the difference our work makes in
  their day-to-day lives. Jane is growing fast, and that
  growth brings exciting challenges that call for
  adaptability, resilience, learning agility, and humility.
  We're proud of what we've built and quick to admit what we
  don't know yet. We listen, learn, and adjust as we go. More
  than 70,000 businesses run on Jane which has 250,000+
  practitioners interacting with our product on a daily basis
  and growth is continuing to accelerate. Our goal isn't just
  delivery - it's delight. We move quickly, communicate
  openly, and solve real problems together. If you're
  energized by ambiguity, motivated by impact, and eager to
  learn with others, you'll thrive at Jane.

  Compensation & Benefits

  At Jane, we’re committed to paying fairly, clearly, and
  above all, paying for growth. This role has an annual salary
  range of $94,000 to $141,000. While that is a large range,
  it is intentional. It reflects the full growth journey
  someone might take in the role, from developing skills early
  on to becoming highly proficient and ultimately achieving
  excellence.

  Most new hires join at the accomplished stage, which for
  this role represents an annual salary of $111,700. A
  starting salary below this typically indicates a candidate
  with strong potential who is still developing key skills.
  Salaries above this usually apply to existing team members
  who have made a significant impact and bring deep Jane-
  specific knowledge.

  We believe in paying for growth. You’ll have regular career
  development conversations with your manager and your
  compensation will grow as you gain experience and contribute
  meaningfully to our mission.

  Paying clearly is one of our compensation fundamentals.
  Watch this short video to learn how our salary bands are
  set. You’re also encouraged to ask questions about
  compensation at any point during the interview process.

  Jane takes job scams and candidate fraud seriously. Jane
  will only contact you from an @jane.app email address. We'll
  never contact you from a personal email, ask for payment, or
  request purchases during the hiring process. If something
  doesn't seem right, please reach out to us at
  hiring@jane.app before sharing any personal information.
