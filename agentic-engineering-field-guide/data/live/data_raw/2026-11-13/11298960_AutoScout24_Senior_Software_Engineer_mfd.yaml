description: |
  A career driven by you. Join AutoScout24 Group and
  experience life in the fast lane. We’re not just leading the
  market; we’re creating it. We’re constantly innovating,
  evolving and transforming things for our customers. We’re
  driven, ambitious and determined to do our best work,
  together. For a career that doesn’t stand still, where you
  can put your ideas in the driving seat and change the way
  the world moves, join our international community.

  We're hiring a Senior Software Engineer to join our Search
  Funnel team at AutoScout24 – the team behind the core buyer
  journey. This role is about real ownership: you’ll work on
  high-traffic systems, shape key parts of our user
  experience, and contribute to critical business outcomes.
  This role is a full stack engineer who is excited about
  GenAI’s boosting their own engineering performance and
  productivity and now wants an opportunity to influence a
  large, ambitious organization

  The engineering world is moving very fast. We are all
  learning every day. Your core traits should be curiosity and
  a strong drive to learn and grow. We do not expect you to
  know everything. We expect you to help accelerate our
  curiosity and learning culture, and to become AI-first
  together with us.

  What you’ll do:

  - Be part of a team of strong fullstack engineers, guiding
    feature development using React, TypeScript, Node.js,
    Java, Next.
  - Drive strategic technical decisions, ensure optimal code
    design standards, and promote long-term system health with
    the team.
  - Architect and maintain a modular monolith that’s clean,
    scalable, and built to last.
  - Apply an AI-first mindset to every phase of you-build-it-
    you-run-it: from design and coding to testing, deployment
    and operations.
  - Work hands-on in real product codebases (for example
    TypeScript/Node/Next.js or Java/Spring), using GenAI tools
    to accelerate development, improve quality and simplify
    existing systems.
  - Optimise frontend performance with a strong focus on Core
    Web Vitals and user experience.
  - Design backend services, in the cloud, that are efficient,
    observable, and production-ready.
  - Drive A/B experimentation, performance measurement, and
    data-informed decisions.
  - Mentor engineers across the team and foster a high-
    performance engineering culture.

  Our Tech Stack

  - Frontend: React, TypeScript, Zustand…

  - Backend: Node.js, Java, REST APIs

  - Infrastructure: AWS (EC2, S3, SQS, etc.), CI/CD via GitHub
    Actions

  - Observability: Datadog

  - Other: Internal experimentation platform, analytics tooling,
    feature flag systems

  Must haves

  - Engineering experience of 10+ years

  - Experience of leading team(s) of 5+ people in the last
    several years

  - Deep expertise in JavaScript/TypeScript, React, and Node.js.

  - Experience driving and applying good code design principles

  - Experience building and running high-traffic applications in
    a product-focused environment.

  - Demonstrated personal excellence in using GenAI coding tools
    (preferably Codex) to significantly improve your own
    development speed and quality.

  - Experience integrating LLM APIs (such as OpenAI, Anthropic,
    Azure OpenAI, Vertex AI or similar) into production
    applications.

  - Strong understanding of frontend performance, SEO, and Core
    Web Vitals.

  - Comfortable working with experimentation, feature flags, and
    data-driven iteration.

  - Clear communicator and natural mentor, capable of guiding
    technical decisions and team growth.

  Nice to Have

  - Solid backend knowledge in Java and distributed systems
    (Scala is a plus).

  - Experience in marketplace platforms or high-visibility
    consumer-facing products.

  - Familiarity with frontend architecture at scale: routing,
    state, and modular UI design.

  - Contributions to frontend or backend tooling, testing
    strategies, or performance profiling.

  A culture of growth

  With over 50 nationalities represented, we’re proud to
  welcome people of all backgrounds to our growing community,
  and we’re always finding new ways to help people feel
  welcomed and included. Here, you’ll have the tools, training
  and support you need to work in a way that suits you, learn
  new skills and reach your potential.

  For a career where you can drive our business and shape your
  future, apply now.
