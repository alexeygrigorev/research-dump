description: |
  Summary

  Topstep is hiring an Engineering Manager to directly lead
  two or more teams of engineers within Trading Platform,
  which builds and runs TopstepX. TopstepX is a real-time
  system that tens of thousands of traders rely on every day,
  spanning charts and trading experience, order flow and
  execution, market data, and the services and integrations
  behind them.

  This is a people leadership role; hands-on work is welcome
  but not expected. Topstep moves fast: priorities shift with
  trader and business needs, and you'll re-plan accordingly.
  We don't micromanage: you'll have autonomy to run your area,
  and we expect you to take initiative.

  Key Responsibilities

  - Own your area: spot problems early, act on them, and decide
    without waiting for direction.
  - Develop your people: coach for growth, address performance
    issues early, and hold engineers to a high bar.
  - Plan through change: work with Product and the business to
    decide what matters most, and keep your teams delivering
    as plans change.
  - Drive reliability and quality: be accountable for the
    availability, performance, quality, and resilience of your
    teams' systems.
  - Staff your teams: set the hiring bar, run interviews, and
    plan capacity alongside the other Engineering Managers
    across all our teams.
  - Communicate upward: share progress, risks, and trade-offs
    proactively.
  - Speak up: disagree openly and constructively, including with
    leadership.

  Required Qualifications and Key Competencies

  - 2+ years of people or technical leadership experience:
    hiring, coaching, and developing engineers across levels.
  - 7+ years of software engineering experience, including
    production systems and integrations.
  - Experience in startup or other fast-paced environments.
  - Experience leading teams that own production systems (on-
    call, incident response, observability).
  - Hands-on background in .NET/C# and distributed systems.
  - A track record of balancing feature delivery against
    reliability and technical investment.
  - Working experience with AWS and containers (Docker,
    Kubernetes).
  - Experience building a culture of psychological safety.

  Preferred

  - Trading, fintech, or other regulated financial environments,
    especially futures or trading platforms.
  - High-availability, low-latency, or real-time systems;
    microservices and real-time messaging (e.g.,
    WebSocket/SignalR).
  - Observability tooling (APM, tracing, synthetic checks).
  - CI/CD tooling (e.g., Argo CD, GitHub Actions).
  - Familiarity with mobile application development (React
    Native).

  Company Culture & Perks

  - Topstep is an engaging working environment that ranges from
    fully remote to hybrid. We foster a culture of
    collaboration by keeping cameras on during meetings and
    maintaining a robust Slack environment for communication.
  - Seven Company-paid Holidays and generous Family Leave. Paid
    time off is front-loaded.
  - Competitive 401(k) matching, health, dental, and vision
    insurance are offered for full-time employees.
  - Vacations are encouraged with a bonus for taking 5
    consecutive days. Topstep offers a food and groceries
    budget and contributes towards health and wellness.

  New Hire Base Salary Range

  - $190,000 - $230,000.
  - The compensation offered will take into account the internal
    compensation structure and may vary depending on the
    candidate's geographic region, job-related knowledge,
    skills, and experience, among other factors.
  - This position is eligible for a performance-based bonus as
    provided by the plan terms and governing documents.

  Equal Opportunity Employer

  Topstep is an Equal Opportunity Employer. We are committed
  to fostering an inclusive environment where all employees
  and applicants are valued. All qualified candidates will
  receive consideration for employment without regard to race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, age, disability, or
  veteran status, in compliance with applicable federal,
  state, and local laws.

