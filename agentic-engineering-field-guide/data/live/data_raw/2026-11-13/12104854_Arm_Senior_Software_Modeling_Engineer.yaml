description: |
  Job Overview Join Arm's Central Engineering Software
  modelling team to develop software models of system-on-chip
  (SoC) hardware and intellectual property (IP). Your work
  will help internal and external users build and validate
  software for Arm IP-based systems across areas including
  IoT, client and infrastructure. You will build virtual
  platforms that represent hardware components alongside
  software stacks such as Linux and Android. These platforms
  support early software development and debugging, including
  inspection of memory bus transactions. Responsibilities

  - Develop, test and maintain high-speed software models of Arm
    system-level IP using hardware designs and specifications.
  - Work with hardware engineers to understand their IP and
    represent it accurately in software.
  - Build virtual platforms that support early software
    development.
  - Collaborate with software engineers to integrate their
    software on the platforms and diagnose problems.
  - Provide feedback on SoC designs based on your modelling
    experience.


  Required Skills and Experience

  - Ability to develop in C and C++.
  - Understanding of computer architecture and system-on-chip
    designs.
  - Ability to develop software, including coding, testing and
    debugging.
  - Ability to collaborate with others and communicate
    effectively in written and spoken English.


  Nice-to-Have Skills and Experience

  - Experience with programmer-view modelling or instruction-
    level simulators, such as QEMU, Simics, Gem5 or
    Virtualizer, or knowledge of Arm IP or architecture.
  - Experience developing SoC virtual prototypes using C, C++,
    SystemC or TLM.
  - Understanding of system-level architecture and integration,
    including components such as system memory management
    units, cache hierarchies or interrupt controllers.
  - Experience developing low-level or bare-metal software,
    firmware or device drivers.
  - Experience collaborating on complex software projects with a
    large team across multiple sites.


  In Return You will work closely with software, hardware and
  systems teams across Arm, with opportunities to share ideas
  and learn from other engineers while developing virtual
  platforms for early software development. Additional
  Information No relocation is available for this role. #LI-
