description: |
  Location: Fully Remote Engagement: 3-month renewable
  consulting mission Start Date: ASAP Compensation: Daily
  rate. 600 USD/day max Languages: French fluency is
  mandatory, English is required

  About the Opportunity

  Pragmatike is recruiting on behalf of a growing technology
  company looking for an experienced Engineering Manager to
  take ownership of its engineering function on a consulting
  basis.

  This is a 3-month initial mission, renewable based on
  business needs, with an ASAP start.

  You will sit at the intersection of engineering leadership,
  technical decision-making and business priorities. The role
  combines team management with enough technical depth to
  challenge architectural decisions, unblock engineers and
  stay close to the technology.

  You will work closely with product and business stakeholders
  to turn company priorities into clear technical direction,
  while helping the engineering team improve how it builds,
  delivers and operates.

  This is a good fit for someone who is hands-on, pragmatic
  and comfortable taking ownership in a fast-moving
  environment.

  What You'll Do

  - Engineering leadership: Define and drive the engineering
    roadmap in line with product and business priorities.
  - Team management: Lead, mentor and support engineers, set
    priorities, remove blockers and help the team perform at
    its best.
  - Technical direction: Make and challenge architectural and
    technical decisions, with a focus on scalability,
    reliability and maintainability.
  - Delivery: Lead complex technical projects from planning
    through execution, ensuring teams stay aligned and focused
    on outcomes.
  - Stakeholder management: Work closely with product, sales and
    business stakeholders to translate requirements into clear
    technical objectives.
  - Engineering practices: Establish and improve development
    standards, processes and ways of working across the
    engineering organization.
  - Hands-on contribution: Stay technically close to the team
    and contribute directly when deeper technical input or
    support is needed.
  - Technology strategy: Evaluate new technologies and identify
    practical opportunities across Cloud, AI, Blockchain and
    other emerging technologies.
  - Continuous improvement: Improve engineering processes, team
    performance and delivery quality as the company scales.

  What We're Looking For

  - Significant experience as an Engineering Manager,
    Engineering Lead, Head of Engineering or similar technical
    leadership role.
  - Strong software engineering background with experience in
    one or more of Python, Ruby, Elixir or Golang.
  - Strong understanding of software architecture, engineering
    practices and modern development workflows.
  - Proven experience managing engineering teams and delivering
    complex technical projects.
  - Ability to balance technical depth with people leadership
    and remain hands-on when needed.
  - Strong understanding of agile methodologies and modern
    engineering practices.
  - Ability to translate business and product priorities into
    clear technical execution.
  - Strong communication and stakeholder management skills.
  - Pragmatic approach to problem-solving, with the ability to
    make decisions and move quickly.
  - Comfortable working independently in a remote, fast-moving
    environment.
  - Curious about emerging technologies and able to distinguish
    practical opportunities from hype.
  - Fluent French is mandatory.
  - Strong English communication skills are required.

  Why Join

  - Take ownership of engineering leadership in a growing
    technology company.
  - Combine technical leadership, team management and hands-on
    engineering.
  - Work directly with product and business stakeholders and
    influence technical direction.
  - Have a meaningful impact from day one in a flexible, remote
    consulting setup.
  - Potential to extend the mission beyond the initial 3-month
    engagement based on business needs.

  Pragmatike is committed to a fair, transparent, and
  inclusive recruitment process. We do not discriminate based
  on age, disability, gender, gender identity or expression,
  marital or civil partner status, pregnancy or maternity,
  race, religion or belief, sex, or sexual orientation.

  In accordance with GDPR, your personal data will be
  processed lawfully, fairly, and securely and used solely for
  recruitment purposes, including sharing it with our
  client(s) for employment consideration.
