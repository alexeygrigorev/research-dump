description: |
  Restream is looking for a Frontend Engineer to join us to
  solve complex challenges and build world-class products. In
  this role, you will build new features, develop the user
  interface of our product, and improve the reliability of our
  systems as we scale.  You will collaborate with a team of
  Engineers to drive processes and enhance user-facing
  features. You understand the importance of simplicity and
  reliability, and you calculate the impact of every decision
  on each. We believe in small teams where each member
  contributes significant value.

  What You'll Do

  - Craft beautiful interfaces and interactions in Restream web
    services
  - Design and implement the UI and business logic necessary to
    support new and existing features
  - Partner with a product designer to build great and user-
    friendly UI/UX
  - Give and receive code review feedback with the team
  - Maintain a pulse on emerging technologies and discover
    hidden opportunities in our environment

  What We Look For

  - A scrappy, entrepreneurial attitude that gets high-quality
    projects done quickly
  - Strong design sensibility, attention to detail, and strive
    for an excellent user experience
  - Solid knowledge of JavaScript, TypeScript, and newer
    specifications of ECMAScript (Experience with other
    programming languages is a plus)
  - Expert in React and its major state management systems
  - Experience with CSS preprocessors like LESS or SASS
  - Basic backend skills: Node.JS, building REST APIs, working
    with relational or NoSQL databases
  - Comfortable working with TypeScript, MobX, AWS, Linux,
    Docker, Kubernetes, continuous deployment workflow
  - Strong written and verbal communication skills
  - Self-directed, analytical, and work well in a team
    environment

  Back in 2015, Restream was founded in Ukraine. We had a
  burning passion for helping creators to be seen and heard.
  As the #1 multistreaming solution, Restream inspires over 10
  million people worldwide to share their stories through live
  video and follow their dreams. We believe that a small but
  highly driven and focused team can make a lasting impact in
  people's lives.

  What We Offer

  - A startup environment and a flat company structure
  - Work closely with founders and team to build and grow the
    product
  - Opportunity to make an impact on the evolution of the
    product
  - Ability to create something that influences people's lives
  - Equity packages for you to truly be a part of the Restream
    journey
  - The tech you need to get your job done
