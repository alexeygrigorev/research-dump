  Job Description:

  The Audit Manager II ( Business Intelligence Engineering)
  provides specialized expertise to help guide the planning,
  risk assessment, and execution of audits. This role plays an
  essential part in shaping the strategic direction of the
  audit function, while fostering alignment with enterprise
  risk frameworks and supporting the broader audit strategy.
  Lead and/or provide supervisory oversight to complex audits
  and ensure completion.

  Day to day:

  The Audit Manager II, Business Intelligence Engineering is
  responsible for transforming audit and operational data into
  meaningful insights that support strategic decision making
  across Internal Audit. This role partners with audit
  leadership, auditors, data providers, and technology teams
  to design and deliver reporting solutions, dashboards, key
  performance indicators, and analytical insights that improve
  transparency, efficiency, and risk management. The
  successful candidate combines strong analytical thinking,
  data visualization expertise, and business acumen to help
  drive data-informed decisions and continuous improvement
  across the audit function.

  - Develop and maintain dashboards, scorecards, reports, and
    visualizations that provide meaningful insights into audit
    performance, risk exposure, strategic initiatives, and
    operational effectiveness.
  - Partner with audit leadership and business stakeholders to
    understand reporting requirements and translate business
    needs into analytical solutions.
  - Analyze audit, risk, issue management, and operational data
    to identify trends, patterns, emerging risks, and
    improvement opportunities.
  - Design and maintain key performance indicators (KPIs), key
    risk indicators (KRIs), and management reporting used to
    support executive decision making.
  - Support audit planning, audit universe management, risk
    assessment, issue monitoring, and strategic reporting
    through data-driven insights.
  - Build and maintain reporting datasets, data models, and
    business intelligence solutions that improve reporting
    consistency and scalability.
  - Validate and reconcile source data to ensure accuracy,
    completeness, and integrity of reporting outputs.
  - Collaborate with technology, data management, and business
    partners to improve data quality, accessibility, and
    governance practices.
  - Present analytical findings and recommendations to audit
    leadership and stakeholders in a clear and actionable
    manner.
  - Identify opportunities to automate reporting processes and
    increase efficiency through enhanced data and reporting
    capabilities.
  - Support implementation and adoption of audit technologies,
    reporting platforms, and analytical tools.
  - Monitor reporting effectiveness and continuously evolve
    dashboards and metrics to align with changing business and
    regulatory requirements.

  Depth & Scope:

  - Works autonomously and accountable for acting as a lead
    within a specialized audit practice area and provide work
    direction to others
  - Provides seasoned specialized knowledge, advice and/or
    guidance to various stakeholders and team members
  - May lead and/or provide supervisory oversight to complex
    audits and ensure completion
  - Knowledge of external competition, industry and/or market
    trends in relation to own function / business
  - Scope of role may have enterprise impact
  - Undertakes and completes a variety of complex audit projects
    and initiatives requiring specialist knowledge and/or the
    integration of cross functional processes within own area
    of expertise
  - May oversee and/or independently perform concurrent multiple
    audits and related tasks from end to end
  - Ability to process and handle confidential information with
    discretion

  Education & Experience:

  - Undergraduate degree required
  - 7+ years of relevant experience

  Customer Accountabilities:

  - Supports the development and implementation of audit
    programs by contributing insights and assisting with
    planning activities
  - Participates in audit engagements across multiple areas,
    helping ensure audits are conducted in line with
    established standards and timelines
  - Executes the development of Audit Planning Memorandum (APM),
    Process Risk and Control Matrix (pRCM), Findings Grid and
    Audit Report
  - Completes L1 reviews/sign off on all audit activities (i.e.
    walkthroughs, test scripts, test results, grid, evidence
    uploads)
  - Oversees / leads audits and/or execute the follow-up of
    findings arising from internal audits and regulatory
    reviews in accordance with policy
  - Oversees / leads the ongoing audit communications and/or the
    reporting process with the stakeholders, senior management
    and external auditors for specific and/or overall Audit
    area
  - Contributes to audit initiatives by providing input and
    assisting in the design and testing of solutions, as well
    as supporting implementation efforts
  - Leads / manages the integrated implementation of policies /
    processes / procedures / changes across multiple
    functional areas
  - Acts as the audit lead or audit advisor to management and
    respective teams for area of specialization. Reports on
    emerging trends, identifying issues and opportunities and
    recommending action to senior management
  - Facilitates key discussions and provide thought leadership
    to executive audience

  Shareholder Accountabilities:

  - Adheres to internal policies / procedures, enterprise
    frameworks and methodologies and applicable regulatory
    guidelines, contributes to the review of internal
    processes and activities and assists in identifying
    control weaknesses / failures, potential opportunities to
    improve operational efficiencies for their business area
  - Actively manages relationships with business lines /
    corporate and/or control functions and ensures alignment
    with enterprise and/or regulatory requirements
  - Keeps abreast of emerging issues, trends, and evolving
    regulatory requirements and assess potential impacts to
    the Bank
  - Assesses / identifies key issues and escalates to
    appropriate levels and relevant stakeholders where
    required
  - Maintains a culture of risk management and control,
    supported by effective processes and sound infrastructure
    in alignment with risk appetite
  - Participates in cross-functional / enterprise initiatives as
    a subject matter expert helping to identify risk /
    provides guidance for complex situations

  Employee/Team Accountabilities:

  - Provides thought leadership and/or industry knowledge for
    own area of expertise
  - Encourages a positive work environment that promotes service
    to the business, quality, innovation and teamwork and
    ensure timely communication of issues / points of interest
  - Identifies and recommends opportunities to enhance
    productivity, effectiveness and operational efficiency
  - Works effectively as a team, supporting other members of the
    team in achieving business objectives and providing
    stakeholders services
  - Participates in knowledge transfer within the team and
    business units
  - Contributes to the overall performance management process by
    providing coaching and input into team members' assessment
    on assigned audits

  Preferred Qualifications:

  - "Big Tech" experience strongly preferred
  - Master's degree preferred in Business Analytics, Data
    Science, Information Management, Statistics, Finance,
    Accounting OR
  - Bachelor's degree required in Business Analytics, Data
    Analytics, Information Systems, Computer Science,
    Statistics, Mathematics, Economics, Finance, Accounting,
    or a related discipline.
  - 7+ years of experience in business intelligence, analytics,
    reporting, data visualization, audit analytics, or related
    disciplines.
  - Advanced experience developing dashboards and reporting
    solutions using Power BI, Tableau, Qlik, or similar
    business intelligence platforms.
  - Strong understanding of data modeling, dimensional modeling,
    reporting architecture, and visualization best practices.
  - Experience developing executive-level reporting, scorecards,
    KPIs, and strategic performance metrics.
  - Proficiency with SQL for data extraction, transformation,
    validation, and reporting.
  - Experience utilizing Python, Alteryx, Power Query, or
    comparable tools to automate data preparation, analysis,
    and reporting workflows.
  - Strong analytical and problem-solving skills with the
    ability to identify trends, patterns, anomalies, and
    emerging risks.
  - Knowledge of data governance, data quality, metadata
    management, and reporting controls.
  - Experience supporting enterprise reporting initiatives,
    technology implementations, or business transformation
    programs.
  - Strong communication skills with the ability to present
    complex analytical findings to senior leadership and non-
    technical stakeholders.
  - Experience with AI-enabled analytics, natural language
    reporting, or emerging business intelligence technologies
    is considered an asset.

