description: |
  Claroty is a global leader in cyber-physical systems (CPS)
  protection, dedicated to securing the critical
  infrastructure that keeps the world running. We’re a fast-
  growing, award-winning team where innovation meets
  purpose—and we want you to help us define the future of
  cybersecurity.

  We’re growing and looking to hire a Backend Software
  Engineer who embodies our core values: People First,
  Customer Obsession, Strive for Excellence, and Integrity.

  At Claroty, our technology strategy is focused on solving
  real-world cyber-physical security problems at scale through
  robust, distributed, cloud-native architectures. We design
  and evolve a unified platform that serves as the
  technological backbone for all Claroty products, delivering
  deep visibility across CPS environments—without disrupting
  critical operations. Our architecture emphasizes
  scalability, resilience, and extensibility to support both
  cloud and on-prem deployments.

  Requirements

  - 6+ years of experience in backend design and development of
    production-grade applications.
  - Strong experience with Python
  - Solid experience with databases, preferably SQL
  - Experience working with large-scale systems
  - Experience with AI orchestration frameworks such as
    LangChain or LlamaIndex, or experience integrating third-
    party AI APIs such as OpenAI or Anthropic.
  - Knowledge of networking infrastructure.
  - Cybersecurity experience — a strong advantage.
  - Ability to learn quickly and adapt to new technologies.
  - Strong teamwork and collaboration skills.

  Responsibilities

  - Take full ownership of features, from product design through
    deployment, including end-to-end feature architecture.
  - Plan, design, and develop systems with complex performance
    and scalability requirements.
  - Design, maintain, and contribute to the company’s code
    infrastructure.
  - Design, build, and maintain robust, scalable server-side
    architecture.
  - Integrate with Large Language Models (LLMs) and vector
    databases.
  - Develop AI-powered API endpoints and services.

  What we offer

  - Help and support from our caring HR team.
  - 20 working days of annual paid leave.
  - Health insurance coverage.
  - Multisport coverage (Poland).
  - Public holidays.
  - Last but not least - valuable compensation for your efforts.
