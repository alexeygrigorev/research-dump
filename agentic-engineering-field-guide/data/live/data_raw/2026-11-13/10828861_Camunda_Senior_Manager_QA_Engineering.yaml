  About the Role:

  Camunda is hiring a Senior Manager, QA Engineering to lead
  the end-to-end QA strategy for Camunda 8 — elevating quality
  governance with rigorous quality gates, outcome-driven
  automation, and strategic reporting that guides roadmap and
  release decisions. They will manage two teams (functional
  and reliability) comprising 12 ICs, a principal engineer,
  and a manager; evolve the structure for scale; and ensure
  comprehensive coverage across business users, developers,
  and admins/operators in Kubernetes, cloud, and bare-metal
  environments. This first-of-its-kind role reports directly
  to the VP of Engineering.

  What you'll be doing:

  - Own and drive the end-to-end QA strategy for Camunda 8,
    establishing quality gates and cross-team accountability.
  - Partner with principal engineering to mature reliability,
    performance, and resilience testing.
  - Guide automation strategy and QA processes to enable teams
    to deliver high-quality outcomes efficiently.
  - Develop actionable quality metrics, dashboards, and reports
    that inform leadership and roadmap decisions.
  - Lead and scale QA teams — managers, principal engineers, and
    ICs — evolving structure for maximum impact.
  - Influence cross-functional stakeholders (engineering,
    product, UX, documentation, field) to embed quality across
    the organization.

  What you bring:

  - Ability and/or willingness to use our product.
  - Proven track record leading QA in engineering organizations
    of 100–500 people, with measurable impact.
  - Ability to define and implement end-to-end QA strategy,
    quality gates, and data-informed decision-making across
    multiple teams.
  - Comfort staying connected to hands-on QA execution while
    leading strategically.
  - Experience leveling up QA for complex technical products,
    including developer/admin persona coverage and high-load,
    performance, resilience testing.
  - Skill aligning engineering, product, UX, documentation, and
    field teams around shared quality goals.
  - Enterprise software / workflow automation background.

  Nice-to-haves:

  - Deep understanding of Kubernetes, cloud, microservices, and
    related operational challenges.
  - Hands-on experience with Playwright, TestRail, or CI/CD-
    integrated testing environments.
  - Chaos engineering or advanced reliability/performance
    benchmarking experience.
  - Proven ability to drive cultural change in QA.

  This role is an existing vacancy

