description: |
  Secta Labs helps people create photos indistinguishable from
  reality. We are a team of experienced founders, engineers
  and builders. Our mission is to build a virtual camera for
  people’s sense of self. We’re starting by democratizing
  first impressions with our Headshots with AI product

  We’ve generated over 9 million headshots in the last year.

  Read our wall of love here https://testimonials.secta.ai

  About the role

  Note we are only accepting candidates from US or Canada at
  this time

  We are looking for a Senior Front-end Engineer to join our
  early team.

  You deeply care about your craft and the aesthetics. You
  have worked on things that others might see as a waste of
  time but these things were technically challenging and the
  beauty was enough reward. You are maybe a bit obsessive but
  you understand how to take a product vision and develop it
  into a usable first version using proven design patterns and
  elegant solutions.

  You love hanging out with designers and PMs in Figma and
  Excalidraw. You come up with growth hack ideas and fix
  broken things without asking for permission.

  Join us to shape the products our customers experience and
  our company and engineering culture!

  Skills and Experience

  - 5+ years of experience as frontend-focused engineer
  - Proficiency in React, NextJS and TypeScript
  - Deep knowledge of frontend concepts related to aesthetics,
    design, and usability
  - Attention to details, can spot extra padding and tell apart
    Inter from Helvetica
  - Know keyboard shortcuts in Figma and Excalidraw
  - Ability to communicate your ideas to engineers, leadership,
    and users
  - Flexible and comfortable with ambiguity of working in a
    rapidly changing environment
  - Highly collaborative and you proactively seek out feedback
    to incorporate into your work

  Bonus:

  - Experience with backend: used ORMs, deployed to Railway,
    understand caching and scaling
  - Have shipped a React Native app to production
  - Self-taught design skills
  - Built side projects, played with Stable Diffusion, or
    already used Bun

  What you’ll be working on

  Our projects and priorities will change as we explore and
  iterate. Here are some of the examples of things you’ll be
  working on:

  - Onboarding flow for our iOS application (React Native)
  - Checkout flow on web using Stripe’s React SDK
  - New AI features in our Gallery
  - New design system (e.g. with Storybook)
  - The next version of our Enterprise dashboard for larger
    companies like Microsoft, Dell and Hubspot
  - Working with the growth team to come up with innovative
    viral loops

  How we work

  - Everyone works remotely, but we get together at least 2
    times a year
  - We believe that smaller teams are better: faster decisions,
    fewer meetings, more fun
  - We value deep, focused work. Our engineers are on maker’s
    schedule
  - Our core app is built with TypeScript, React, NextJS, tRPC &
    Prisma, styled with Tailwind
  - On ML side, we work with the cutting edge image generation
    AI tech
  - We ship fast — our build pipeline takes less than 3 minutes,
    and we are not afraid to push code on Fridays
  - We constantly talk to our users, and it’s easy to get
    feedback on the new features we ship
  - We invest in things that make us more productive

  About the Founders

  - Marko Jak (Co-Founder and CEO) is an entrepreneur and
    product builder who has been building B2B and B2C products
    in AI space for over 10 years. Previously co-founder at
    Overscore AI (exit in 2016) and co-founder at nFold AI
    (shutdown 2019)
  - Alex Kotliarsky (Co-founder and CTO) is a software engineer
    and UX zealot. Ex-Facebook & Replit, he worked on React
    Native core team and lead consumer products like the
    Oculus App and Desktop Messenger (used by tens of millions
    of people). Alex is unique in his ability to balance
    exquisitely crafted products that “just work” while moving
    quickly.
