description: |
  Meet the Team Cisco ThousandEyes is a Digital Experience
  Assurance platform that empowers organizations to deliver
  flawless digital experiences across every network - even the
  ones they don't own. Powered by AI and an unmatched set of
  cloud, internet and enterprise network telemetry data,
  ThousandEyes enables IT teams to proactively detect,
  diagnose, and remediate issues - before they impact end-
  user experiences. ThousandEyes is deeply integrated across
  the entire Cisco technology portfolio and beyond, helping
  customers deploy at scale while also delivering AI-powered
  assurance insights within Cisco's leading Networking,
  Security, Collaboration, and Observability portfolios. The
  Endpoint Engineering team is leading this charge, competing
  to dominate its market segment as well as becoming part of
  the fabric of Cisco's wireless, security and collaboration
  systems. We are a small team where every engineer is hands-
  on and has a voice in where the product and technology goes.
  This creates a rare opportunity for you to work with one eye
  on the future, while staying closely rooted in delivering
  exciting new innovations today. Your Impact As part of the
  Endpoint team, you will build and enhance core product
  capabilities that help customers quickly troubleshoot
  network issues and analyze end-user experience over time.
  You will design, develop, and scale backend systems that
  ingest, aggregate, and store data collected by endpoint
  agents, ensuring the platform remains reliable as usage
  grows. You will partner with engineers and cross-functional
  stakeholders to deliver resilient, high-quality features
  that translate complex data into actionable customer
  insights. You will improve operational excellence through
  monitoring, automation, and thoughtful system design to
  maintain high standards of availability and performance.
  Minimum Qualifications

  - Professional production experience developing backend
    systems with Java or Kotlin, and Spring Boot.
  - Experience designing distributed, event-driven systems with
    a proven ability to manage asynchronous high-load
    challenges.
  - Experience participating in on-call rotations and resolving
    production incidents.

  Preferred Qualifications

  - Bachelor's degree in computer science or a related field,
    and an excellent knowledge of computer science
    fundamentals.
  - Experience with Docker, Kubernetes, and cloud platforms
    (e.g., AWS).
  - Experience processing large data sets using Elasticsearch or
    similar data stores.
  - Experience with event-driven architectures (e.g., CQRS,
    Kafka Streams).
  - Understanding of networking fundamentals.

  Why Cisco? At Cisco, we're revolutionizing how data and
  infrastructure connect and protect organizations in the AI
  era - and beyond. We've been innovating fearlessly for 40
  years to create solutions that power how humans and
  technology work together across the physical and digital
  worlds. These solutions provide customers with unparalleled
  security, visibility, and insights across the entire digital
  footprint. Fueled by the depth and breadth of our
  technology, we experiment and create meaningful solutions.
  Add to that our worldwide network of doers and experts, and
  you'll see that the opportunities to grow and build are
  limitless. We work as a team, collaborating with empathy to
  make really big things happen on a global scale. Because our
  solutions are everywhere, our impact is everywhere. We are
  Cisco, and our power starts with you.
