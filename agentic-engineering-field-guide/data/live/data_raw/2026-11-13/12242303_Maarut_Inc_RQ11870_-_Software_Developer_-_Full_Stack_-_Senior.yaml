description: |
  Description:

  A senior full stack software developer that will be
  responsible for providing maintenance and support for the
  OASIS CoreWeb application in Production. The OASIS solution
  comprises of the OASIS CoreWeb application and OASIS Remote
  Field Data Capture Mobile application. The OASIS CoreWeb
  application has integration with the OASIS Remote Field Data
  Capture Mobile application. The OASIS Remote Field Data
  Capture Mobile application is built on ESRI GIS technology.
  The OASIS CoreWeb application is built using Azure Cloud
  Java technology,



  Background:

  The purpose of the Ontario Agricultural Soil Information
  System (OASIS) project is to design and develop a robust,
  comprehensive system for the collection, storage and
  maintenance of the OMAFRA’s legacy and new Agricultural soil
  and agronomic data in alignment to actions under the Soil
  Strategy and other emerging OMAFRA and government
  initiatives. The OASIS core application will have a
  centralized repository with state-of-the-art mapping data
  and detailed soil survey analysis data. The mobile native
  data collection application will integrate with the OASIS
  core application via the ArcGIS Enterprise.

  Requirements

  Experience and Skill Set Requirements:

  Must Haves:

  - 7+ years of full-stack Java development knowledge and
    experience
  designing and delivering solutions



  Skill Set Requirements:

  Mandatory Skills/Experience:

  - At least 1+ year experience developing and implementing java
  solutions targeting the soil management systems.
  - 7+ years of full stack java development knowledge and
  experience designing and delivering solutions using:

  - Java/JEE technology with Sprint Boot version 2.5 or higher
  - Angular 2+
  - HTML 5
  - Accessibility for Ontarians with Disability Act (AODA)
  - RESTful APIs
  - Databases (Azure SQL database, Oracle, PostgreSQL)
  - Azure DevOps Pipelines
  - Good design skills to develop quality solutions
  - Integration with ESRI ArcGIS Portal and ESRI ArcGIS Survey
  COTS
  - RESTful API integration with ESRI
  - Tools (Eclipse, Azure Git Repositories)
  - Excellent design skills with ability to make design
  recommendations and develop quality solutions.
  - Developing detailed programming specifications and/or code,
  and performing application configuration as needed
  - Building release deployments and conducting unit tests
  within an Agile project environment.
  - Integration skills, and experience developing java solutions
  using APIM
  - Integration skills, experience and knowledge building
  java backend using Azure Application Service Plan.



  Desirable skills/experience:

  - Python
  - ESRI GIS database
  - RESTful API integration with ESRI
  - Excellent communication (verbal and written) as well as
  facilitation skills



  General:

  - 4+ years of experience delivering solutions using Agile
  practices and tailoring approaches to maximize adoption of
  Agile principles while working within organizational
  constraints.
  - 4+ years of experience leading Agile teams through
  continuous improvement processes including but not limited
  to Sprint Retrospectives, etc.
