description: |
  Role Summary

  As a Backend Engineer at Gaya, you will work hand-in-hand
  with our Senior Backend Engineer to build, test, and scale
  the backend systems powering insurance automation for
  thousands of users. You will contribute to our API
  infrastructure, help implement unit testing across our tech
  stack, and support our cloud migration efforts. This is a
  high-growth role for someone hungry to learn fast, ship real
  code from day one, and grow into a senior engineer under
  strong mentorship. Curiosity about Robotic Process
  Automation (RPA) and AI workflows is a big plus.

  Responsibilities

  Backend Development: Build and maintain features across our
  backend services, contributing to both internal and external
  API infrastructures under the guidance of our Senior Backend
  Engineer.

  Unit Testing: Write thorough unit tests for new and existing
  code, following and helping refine the testing playbook
  established by the engineering team.

  Bug Fixing and Optimization: Investigate, debug, and resolve
  issues across the backend, and contribute to improving the
  speed and reliability of our core algorithms.

  Cloud Migration Support: Support the migration of our
  backend systems from Supabase to a more robust cloud
  provider, handling well-scoped migration tasks and learning
  cloud infrastructure along the way.

  System Reliability: Help monitor, maintain, and improve the
  availability of our backend systems, escalating and
  documenting issues proactively.

  Collaboration: Work closely with our Senior Backend
  Engineer, front-end engineers, and other stakeholders,
  communicating clearly and asking the right questions early.

  AI Integration: Get hands-on with AI workflows, systems, and
  endpoints as we integrate advanced features into our backend
  services.

  Continuous Learning: Actively seek feedback through code
  reviews and pairing sessions, and level up quickly on our
  stack and best practices.

  Ideal Candidate Profile

  Experience: 1–3 years of development experience
  (internships, freelance work, and serious personal projects
  count), with production code you're proud to walk us
  through.

  Backend Foundations: Working proficiency in Node.js and
  JavaScript, with a solid understanding of REST APIs,
  databases, and backend fundamentals.

  Hunger to Grow: You're a self-starter who learns fast, takes
  ownership of your work, and treats every code review as a
  chance to get better. Attitude matters more to us than a
  perfect resume.

  Testing Mindset: You understand why testing matters and are
  eager to build the habit of writing well-tested code from
  the start.

  Bias for Action: You ship. You'd rather deliver, get
  feedback, and iterate than wait for perfect conditions.

  Curiosity About RPA and AI (Plus): Exposure to or genuine
  interest in Robotic Process Automation and AI-powered
  systems is highly desirable.

  Cloud Curiosity (Plus): Any exposure to cloud platforms
  (AWS, GCP, Azure) or Supabase/PostgreSQL is a bonus.

  Collaborative Team Player: Strong communication skills,
  humility, and a proactive approach to teamwork and problem-
  solving.

  Core Tech Stack

  - JavaScript
  - React
  - Node.js
  - Python
  - PostgreSQL

  Reporting Structure

  You will report directly to our Senior Backend Engineer,
  with close exposure to our CTO, giving you a front-row seat
  to how technical and strategic decisions get made at a fast-
  moving company.

  Join Us

  As a Junior Backend Engineer at Gaya, you'll get the kind of
  hands-on experience and mentorship that compresses years of
  growth into months. You'll ship code that powers insurance
  automation for thousands of users, learn directly from
  senior engineers who are invested in your development, and
  take on more responsibility as fast as you can earn it. If
  you're hungry, coachable, and excited to build your career
  on real backend challenges with real business impact, we'd
  love to hear from you.
