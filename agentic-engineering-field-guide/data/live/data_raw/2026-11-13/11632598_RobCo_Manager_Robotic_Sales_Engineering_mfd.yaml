description: |
  About the Role at RobCo

  RobCo is building the category of Autonomous Industrial
  Robotics and we're doing it fast. We believe that automating
  the ordinary frees humans to do the extraordinary, and we're
  building the end-to-end robotics infrastructure to make that
  possible - hardware, software, and AI in one stack that just
  works.



  At RobCo, we automate the ordinary, so humans can do the
  extraordinary. To achieve this, we are looking for an
  ambitious Manager Robotic Sales Engineering (m/f/d) to help
  us establish RobCo as leading provider of automation
  solutions.

  Your mission

  Robotic Sales Engineers (RSEs) are RobCo’s technical face to
  the customer. They qualify opportunities, run requirement
  workshops, check feasibility and drive each deal to a
  concept our Solutions Development team can build.

  As Manager Robotic Sales Engineering, you lead a team of
  around six RSEs and report to the Head of Robotic Sales
  Engineering. You make sure every deal gets the right
  technical lead, every customer gets a consistent experience
  and every RSE on your team keeps getting better. You carry a
  quota together with Sales and are measured on whether your
  team hits it.

  You are a player-coach. You lead the team, and you still go
  on-site for the deals that matter most. You work where
  modular robotics, software and AI come together, and you
  help scale how RobCo brings physical AI into real
  production.

  What you will do

  - Lead and grow the team – Hire, onboard and coach your RSEs.
    Run regular 1:1s, give clear feedback, write performance
    reviews and build real career paths.
  - Deliver the quota – Own your team’s quota together with your
    Sales counterparts. Track pipeline and win rates, spot
    deals at risk early and put your team’s capacity where it
    moves the number.
  - Steer the deal portfolio – Match RSEs to Account Executives
    and deals, balance workload and set priorities together
    with Sales and Delivery, so no customer waits and no deal
    slips.
  - Raise the quality bar – Set the standard for discovery,
    requirement workshops, feasibility checks and handovers.
    Review the critical concepts before they go to the
    customer or to Solutions Development.
  - Be hands-on where it counts – Join strategic accounts and
    complex workshops yourself, and be the technical
    escalation point for customers and AEs.
  - Own the interfaces – Work closely with Sales leadership,
    Solutions Development and Product to keep handovers clean
    and expectations aligned.
  - Improve how we work – Shape the team’s processes, templates,
    tools and KPIs, and turn field insights into input for
    Product.

  What you bring

  - 5+ years in technical pre-sales, application engineering or
    automation projects, including 2+ years leading a team
  - You’ve run requirement workshops, won deals yourself and
    worked against a quota, so you know what it takes to hit
    it
  - You still enjoy being in front of customers and are credible
    with an engineer on the shop floor and a plant manager
    deciding on the investment
  - You make people better: you coach, give direct feedback and
    know when to step in and when to let your team own it
  - You set clear priorities when everything feels urgent, and
    you can explain them to sales, engineering and management
    alike
  - You build structure that helps the team move faster, not
    process for its own sake
  - You speak German and English fluently
  - You are happy to travel, around 30% of the time
  - Experience in physical AI (AI-based perception, learning-
    based manipulation, autonomous robots) is a plus
  - Experience building or scaling a team in a fast-growing
    company is a plus
  - A background at a robot manufacturer or system integrator is
    a plus

  Why join RobCo?

  - Develop modular, software-defined robotics solutions with us
    that set new standards in automation.
  - Help us build robots equipped with state-of-the-art AI that
    perceive their environment, analyze data, and make
    intelligent decisions in real time.
  - As part of a very dynamic and fast-growing scale-up, you
    will take on responsibility from day one, drive your own
    projects, and see the direct impact of your work.
  - Flat hierarchies, open communication, and regular 360°
    feedback enable fast decisions and support your
    professional and personal development.
  - Work out across Germany in over 7,200 studios with our
    subsidized Wellpass membership.
  - Flexible working hours, a modern office, and—depending on
    the role—the option to work from home.
  - Regular team events—from relaxed beer & pizza nights on the
    rooftop terrace to shared experiences on ski trips or at
    Oktoberfest.

  About RobCo

  Founded in Munich in 2020, RobCo leads the transition toward
  fully Autonomous Industrial Robotics. Our mission is to
  deploy RobCo in every factory - solving the industrial labor
  shortage through end-to-end robotics that just works.
  Powered by Physical AI, our solutions combine a scalable
  modular hardware architecture with intelligent software that
  continuously learns and improves, requiring zero upfront
  investment through our Robotics-as-a-Service (RaaS) model.

  We solve our customers' most pressing pain points - labor
  shortage, cost pressure, workplace safety, and national
  reshoring - across the full spectrum of Autonomous
  Industrial Robotics. In October 2026, RobCo reached unicorn
  status with a valuation exceeding one billion US dollars,
  with its valuation doubling in less than nine months. With
  $200M raised from investors including Sequoia, Lightspeed,
  Lingotto, Kindred, Cherry Ventures, and the European Tech
  Collective, 225+ people globally, and 3.5M+ operating hours
  in the field, we are deploying robots in factories across
  Europe and the United States - with our US operations
  headquartered in Austin, TX, and our Bay Area Lab in San
  Francisco.

  Don’t meet every single requirement? If you’re excited about
  this role but your past experience doesn’t align perfectly
  with every qualification in the job description, we
  encourage you to apply anyway. You may be just the right
  candidate for this or other roles.

  At RobCo, applicants are selected regardless of ethnic
  origin, religion, gender, age, disability, or sexual
  orientation. All decisions throughout the recruitment
  process are based solely on applicants’ qualifications,
  skills, knowledge, and experience, as well as relevant
  business requirements.
