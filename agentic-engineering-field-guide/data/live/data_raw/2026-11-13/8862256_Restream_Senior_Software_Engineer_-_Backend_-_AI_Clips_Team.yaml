description: |
  Restream is looking for a Backend Engineer to join us to
  solve complex challenges and build world-class products. In
  this role, you will build new features, design and implement
  new services, and improve the reliability of our systems as
  we rapidly scale our product and organization. You
  understand the importance of simplicity and reliability, and
  you calculate the impact of every decision on each. We
  believe in small teams where each member contributes
  significant value.

  What You'll Do

  - Develop and maintain features in Restream web services
  - Design and implement backend APIs and business logic
    necessary to support new and existing features
  - Give and receive code review feedback with the team
  - Maintain a pulse on emerging technologies and discover
    hidden opportunities in our environment
  - Ensure redundancy and resilience of Restream production
    infrastructure.

  What We Look For

  - A scrappy, entrepreneurial attitude that gets high-quality
    projects done quickly
  - Expert in at least one general-purpose programming language
  - Node.JS (TypeScript) or Rust would be a plus but are not a
    requirement
  - Highly proficient in database design, with both relational
    and NoSQL (Scylla, Redis) databases
  - Experience with creating, testing, consuming, and supporting
    APIs for web services
  - Comfortable working with AWS, Linux, Docker, Kubernetes,
    continuous deployment workflow, multiple programming
    languages tech stack
  - Basic front-end skills
  - Experience with modern front-end frameworks is a plus
  - Strong written and verbal communication skills
  - Self-directed, analytical, and work well in a team
    environment.

  Back in 2015, Restream was founded in Ukraine. We had a
  burning passion for helping creators to be seen and heard.
  As the #1 multistreaming solution, Restream inspires over 11
  million people worldwide to share their stories through live
  video and follow their dreams. We believe that a small but
  highly driven and focused team can make a lasting impact on
  people’s lives.

  What We Offer

  - A startup environment and a flat company structure
  - Work closely with founders and team to build and grow the
    product
  - Opportunity to make an impact on the evolution of the
    product
  - Ability to create something that influences people's lives
  - Equity packages for you to truly be a part of the Restream
    journey
  - The tech you need to get your job done
