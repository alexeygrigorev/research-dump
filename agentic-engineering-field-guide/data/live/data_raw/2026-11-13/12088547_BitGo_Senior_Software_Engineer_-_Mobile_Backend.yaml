description: |
  BitGo (NYSE: BTGO) is the digital asset infrastructure
  company delivering custody, wallets, staking, trading,
  financing, stablecoins, and settlement services from
  regulated cold storage. Since 2013, BitGo has focused on
  accelerating the transition of the financial system to a
  digital asset economy. BitGo maintains a global presence and
  multiple regulated entities, including BitGo Bank & Trust,
  National Association, the first federally chartered digital
  asset trust bank owned by a publicly traded company. Today,
  BitGo serves thousands of institutions, including many of
  the industry's top brands, financial institutions,
  exchanges, and platforms, and millions of investors
  worldwide. For more information, visit www.bitgo.com.

  This role will require being full-time onsite at our Toronto
  office to support collaborative team dynamics and innovative
  problem-solving.

  BitGo is looking for a Senior Software Engineer (Backend) to
  join our Mobile team and help us build the first-time user
  experience for our retail users.

  Responsibilities:

  - Design and build scalable, well abstracted, and robust APIs,
    libraries, and services to empower our API-first platform
  - Own functionality and scalability features by taking
    responsibility from inception to deployment and customer
    integration
  - Expose and document functionality to the UI, third-party
    developers, and our internal and external tooling
  - Collaborate with cross-functional teams to define, design,
    and ship new features
  - Write clean, maintainable, and efficient code
  - Ensure the performance, quality, and responsiveness of
    applications
  - Identify and correct bottlenecks and fix bugs
  - Continuously discover, evaluate, and implement new
    technologies to maximize development efficiency
  - Participate in code reviews and contribute to a culture of
    continuous improvement
  - Work closely with product managers, designers, and other
    engineers to understand and refine product requirements
  - Provide mentorship to your peers in the broader engineering
    team through code reviews and education on best practices

  Skills & Experience:

  We are looking for teammates who share and practice our
  values: open communication, transparency, taking ownership,
  and a high level of craftsmanship. We are looking for
  coworkers who share our vision and mission: deliver trust in
  digital assets.

  Required

  - 6+ years of proven experience of back-end and server-side
    development
  - Great at algorithm design, problem solving, and complexity
    analysis
  - Strong experience with of TypeScript, Node.js and Express
  - Strong experience with Node.js, TypeScript, PostgreSQL and
    MongoDB
  - Strong experience with RESTful API design
  - Experience with microservices and service-oriented
    architectures
  - Experience with unit and functional testing and debugging
  - Experience in Git/GitHub and branching methodologies, code
    review tools, CI tools, etc.
  - Ability to move quickly and adjust course as needed in a
    fast-paced environment
  - Bachelor’s degree in computer science, applied mathematics,
    or another technical discipline from a top university
  - Understanding of and strong interest in cryptocurrencies and
    blockchain

  Preferred

  - Experience developing consumer-facing crypto products
  - Proven experience building public-facing APIs in a
    production environment
  - Ability to work full-stack and familiarity with React
  - Experience working with clients and/or business partners
  - Familiarity with any of the following: digital wallets,
    clearing and settlement, lending, trading, accounting
    systems, etc

  Why Join BitGo?

  Disrupting an industry takes vision, innovation, passion,
  technical chops, drive to deliver, collaboration, and
  execution. Join a team of great people who strive for
  excellence and personify our corporate values of ownership,
  craftsmanship, and open communication. We are looking for
  new colleagues who bring innovative ways of thinking and
  problem-solving, and who want risks to be part of the team
  that changes the world’s financial markets.

  Benefits may vary based on location.

  Pay Transparency Notice:

  Depending upon your leveling and location, the compensation
  for this role averages between $180,000 and $220,000 CAD
  base salary. Equity, an annual performance bonus, and the
  benefits outlined above are also part of this role’s
  package.

  Cryptocurrencies are the most disruptive change the
  financial services industry has seen in years. Join us and
  you'll be able to look back and say you were part of the
  team that transformed investing.
