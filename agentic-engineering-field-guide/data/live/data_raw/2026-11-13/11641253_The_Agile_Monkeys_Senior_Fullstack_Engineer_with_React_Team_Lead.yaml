description: |
  About The Agile Monkeys

  The Agile Monkeys is a software boutique with over 75 people
  and we keep growing.We do two things:

  - We create products: We are a very creative team that is
    constantly pursuing new ideas and projects we love. Now we
    are focused on building products related to search and AI.
    We take great joy in tackling the challenges of AI
    associated with scalability and information retrieval.
  - We deliver bespoke consulting solutions to leading
    enterprises, driving strategic transformation, operational
    excellence, and sustainable growth

  About the position:

  - The project: You will be working with one of the most
    renowned entities in the insurance field. You’ll have the
    opportunity to engage with a competitive community of
    engineers to craft complex solutions and have an impact in
    the company’s success. Some of the tasks you can expect to
    do are:
    - Participate in architecture and software development
      discussions and decisions.
    - Translate functional requirements into technical
      requirements together with the other team members.
    - Refactor legacy code, improving it by applying good coding
      practices.
    - Collaborate with the QA team to ensure everything works well
      before releasing the code to production.
    - Participate in agile ceremonies.
  - Duration: Initially, the position is for 6 months, but it
    can be extended depending on the client's needs.
  - Dedication: It’s a full-time position (8 hours, 5 days a
    week) and fully remote (preferably if you are in a time
    zone ranging from GMT -7 to GMT +2).
  - Schedule: At our company, we understand that everyone has
    unique schedules and needs. Therefore, we offer
    flexibility in terms of working hours, and will only ask
    you to make sure you have overlapping time to attend
    client and team meetings.
  - The Agile Monkeys way: You will be part of our team and,
    therefore, will take advantage of all of our perks:
    technical workshops and presentations, mentoring, and
    coaching sessions, among others.

  About the Role

  At The Agile Monkeys, we’re looking for a Senior React
  Developer who’s ready to go beyond coding and step up as a
  team lead. This role is ideal for someone who not only has
  deep React expertise but also loves mentoring others,
  coordinating teams, and ensuring project success.

  You’ll be leading two squads of junior/intermediate
  developers, helping them grow while keeping delivery on
  track. You’ll also collaborate with backend, infrastructure,
  and automation teams to ensure smooth integration of
  features and handle complex requirements.

  What is required in terms of APTITUDE:

  - At least 8 years of experience working as a software
    engineer.
  - Strong expertise in React and modern JavaScript/TypeScript.
  - Solid experience with HTML, CSS, and frontend best
    practices.
  - Experience leading or mentoring junior and intermediate
    developers.
  - Ability to understand complex requirements and translate
    them into technical solutions.
  - Proven track record of delivering features in coordination
    with multiple teams (backend, infra, automation).
  - Knowledge of testing practices and promoting clean,
    maintainable code.

  Considered a Plus:

  - Backend experience: Java, Spring, Struts 1, JSP, Maven,
    PostgreSQL.
  - Infrastructure/automation knowledge: Docker, Kubernetes,
    GitHub Actions, Azure.
  - Previous experience as a team lead or technical coordinator.

  What is required in terms of COMMUNICATION:

  - English level: B2 or higher – written, spoken, and listening
    (international team, cross-team collaboration required).
  - Strong communication skills: ability to discuss technical
    challenges, create and review proposals, and raise issues
    early to ensure smooth project delivery.
  - Comfortable coordinating with multiple teams and aligning
    stakeholders.

  What is required in terms of ATTITUDE:

  - Proactivity: willing to take ownership, suggest
    improvements, and step up to guide the team.
  - Humility: open to feedback and eager to collaborate in order
    to grow and help others grow.
  - Flexibility: while React is the core, openness to contribute
    in backend or infrastructure areas when needed.
  - Teamwork: able to foster collaboration, mentor juniors, and
    build bridges between teams.
