description: |
  Who We Are

  At Bluehost, we believe all small businesses deserve the
  opportunity to succeed online. Our mission is to give small
  businesses the confidence to think big. We're the all-in-one
  platform for small businesses to grow online with powerful
  simplicity, premium performance, smart tools and human
  support.

  This role is a part of Bluehost's innovation team, the group
  building the AI-native backbone of our platform while the
  rest of the business scales around us. You'll design async,
  production-grade backend systems that treat AI as a first-
  class citizen: multi-agent orchestration, retrieval-
  augmented generation, and provider-agnostic LLM integration,
  all woven into products millions of small businesses depend
  on. We want a true go-getter who can take an idea from
  whiteboard to production without waiting to be told how.

  What You'll Do & How You'll Make Your Mark

  - Design and scale async REST/WebSocket APIs in Python
    (FastAPI or similar), using dependency injection, type
    hints, and clean, vertical-slice architecture

  - Implement multi-agent workflows (sequential, concurrent, and
    handoff patterns) to route work among specialized LLM
    agents

  - Integrate multiple LLM providers behind a provider-agnostic
    layer, enabling A/B testing and cost-aware routing rather
    than hard-coding a single vendor

  - Build and maintain Retrieval-Augmented Generation (RAG)
    pipelines against vector stores such as pgvector, Chroma,
    or a managed vector search service

  - Design schemas and evolve data models (SQLAlchemy/SQLModel-
    style ORM plus migrations) that support both traditional
    application logic and AI-driven features

  - Instrument services with structured logs, distributed
    tracing, and cost/latency metrics, holding a real bar for
    p95 response time under production load

  - Maintain end-to-end CI/CD ownership, lint, type-check, test,
    package, and deploy, so releases are boring and safe

  - Champion AI across the delivery lifecycle, not just code
    generation, and set the guardrails the team works inside:
    how generated code gets reviewed, how provenance and
    licensing are checked, and what customer data may enter a
    prompt

  - Move ideas from concept to production fast, with real
    ownership over architecture and outcomes, not just tickets

  Who You Are & What You'll Need to Succeed

  - 5+ years building production backend systems in Python, with
    real async I/O experience

  - Hands-on experience designing and scaling REST or async
    APIs, including dependency injection and clean service
    architecture

  - Practical experience integrating LLM APIs (OpenAI, Gemini,
    or similar) and building AI-readiness into backend systems
    from the ground up

  - Real experience with vector databases and RAG-style
    retrieval architectures, not just reading about them

  - Strong relational database skills: schema design, query
    optimization, and migration discipline

  - AI-augmented delivery: you use AI across the delivery
    lifecycle, not just code generation, and can say which
    models suit which problems and where you don't use them.
    You review AI-generated code knowing its failure modes,
    and you have set the guardrails others work inside —
    review expectations for generated code, provenance and
    licensing checks, and clear boundaries for what customer
    data enters a prompt and what a security or compliance
    review will ask for.

  - End-to-end CI/CD ownership, from build and test through
    packaging and deployment

  - A self-starting, go-getter mindset: comfortable with
    ambiguity, fast iteration, and owning a problem until it's
    actually solved

  - Bonus: experience with multi-agent orchestration frameworks
    (Semantic Kernel, LangChain, or similar) and LLM
    cost/observability tooling

  Why you’ll love us.

  - Work-life balance. Our work is thrilling and meaningful, but
    we know balance is key to living well.
  - We celebrate one another’s differences.  We’re proud of our
    culture of diversity and inclusion. We foster a culture of
    belonging. Our company and customers benefit when
    employees bring their authentic selves to work. We have
    programs that bring us together on important issues and
    provide learning and development opportunities for all
    employees.  We have 20 + affinity groups where you can
    network and connect with employees globally.
  - We care about you. We provide excellent Health Insurance
    options to fit you, HSA, Medical, Dental, Vision, Matching
    401K, Life/AD&D/STD/LTD, Tuition Reimbursement, Pet
    Insurance, Generous vacation policy, and much more!
  - Where can we take you? We’re fans of helping our employees
    learn different aspects of the business, be challenged
    with new tasks, be mentored, and grow their careers.
    Unfold new possibilities with Bluehost #OTOD!

  #LI-SM1 #LI-Remote #Bluehost

