  Job Description:

  CUSTOMER

  - Contribute to the strategic direction of the business
    /function, play a key role in the development and
    implementation of process and operational synergies and
    efficiencies
  - Leverage advanced analytics and process modeling to solve
    moderate to complex process problems, as well as make
    process improvements
  - Provide advice to business leaders and lead solutions to
    improve quality and eliminate waste. Lead the team to
    execute on recommendations
  - Provide advanced data-driven recommendations / decisions to
    forecast, lead and deliver financial and customer benefits
    to the business
  - Gather data to translate a practical problem into a
    statistical problem, using advanced methods including data
    modeling
  - Actively manage relationships within and across various
    business lines, corporate and/or control functions and
    ensure alignment with enterprise

  SHAREHOLDER

  - Adhere to enterprise frameworks or methodologies that relate
    to activities for this process improvement &
    transformation
  - Ensure respective programs/policies/practices meet business
    needs, complies with internal and external requirements,
    and aligns with business priorities
  - Consistently exercise discretion in managing correspondence,
    information and all matters of confidentiality; escalate
    issues where appropriate
  - Ensure compliance with applicable internal and external
    requirements (e.g. financial controls, segregation of
    duties)
  - Participate in cross-functional / enterprise / initiatives
    as a subject matter expert helping to identify risk /
    provide guidance for complex situations
  - Conduct internal and external research projects; support the
    development/ delivery of presentations / communications to
    management or broader audience
  - Conduct meaningful analysis at the functional and/or
    enterprise level using results to draw conclusions, make
    recommendations, assess the effectiveness of programs/
    policies/ practices
  - Monitor service, productivity and assess efficiency levels
    within own function and implement continuous process /
    performance improvements where opportunities exists
  - Adhere to internal policies/procedures and applicable
    regulatory guidelines
  - Protect the interests of the organization escalate –
    identify and manage risks, and non-standard, high risk
    activities as necessary
  - Keep abreast of emerging issues, trends, and evolving
    regulatory requirements and assess potential impacts
  - Maintain a culture of risk management and control, supported
    by effective processes in alignment with risk appetite

  EMPLOYEE / TEAM

  - Participate fully as a member of the team, support a
    positive work environment that promotes service to the
    business, quality, innovation and teamwork and ensure
    timely communication of issues/ points of interest
  - Provide thought leadership and/ or industry knowledge for
    own area of expertise in own area and participate in
    knowledge transfer within the team and business unit
  - Keep current on emerging trends/ developments and grow
    knowledge of the business, related tools and techniques
  - Participate in personal performance management and
    development activities, including cross training within
    own team
  - Contribute to team development of skills and capabilities
    through mentorship of others, by sharing knowledge and
    experiences and leveraging best practices.
  - Lead, motivate and develop relationships with internal and
    external business partners / stakeholders to develop
    productive working relationships.
  - Contribute to a fair, positive and equitable environment
    that supports a diverse workforce
  - Act as a brand ambassador for your business area/function
    and the bank, both internally and/or externally

  BREADTH & DEPTH

  - Process improvement advisor for a business, typically
    leading or contributing on projects of moderate scope and
    complexity
  - Solves moderately to highly complex process problems
  - Advanced level professional role requiring substantial
    knowledge / expertise in a complex field and knowledge of
    broader related areas
  - Integrates knowledge of the enterprise sub-function’s or
    business line’s overarching strategy in developing
    solutions across multiple functions or operations
  - Interprets internal/external business challenges and the
    industry environment, recommends course of action and best
    practices to improve products, processes or services
  - Has advanced knowledge of all the software application and
    tools required to perform tasks while following best
    practices; provides guidance to others
  - Uses advanced analytical thought to exercise judgement and
    identify solutions
  - Work is guided by policies and industry standards/methods
  - Communicates difficult concepts; converts information to
    compelling business context and advice; influences and
    gains alignment across increasingly senior stakeholders
  - Works autonomously as the lead and guides others within area
    of expertise
  - Provides leadership guidance, makes recommendations and
    collaborates with business to ensure solutions meets the
    business needs on a complex project or program
  - Generally reports to a Senior Manager or above

  EXPERIENCE AND/OR EDUCATION

  - Undergraduate degree or relevant professional
    certifications, designations, or equivalent required
  - 7+ years of relevant experience
  - Black Belt

  PREFERED SKILS/EXPERIENCE:

  - "Big Tech" experience strongly preferred
  - Master's degree preferred
  - Bachelor's degree required in Business Administration,
    Accounting, Finance, Information Systems, Industrial
    Engineering, Operations Management, or related field.
  - Professional certifications such as Lean Six Sigma Green
    Belt, Lean Six Sigma Black Belt, PMP, CBAP, CPA, CIA, or
    equivalent.
  - 7+ years of experience in process improvement, operational
    excellence, business transformation, consulting, process
    engineering, or related disciplines
  - Experience leading cross-functional process improvement or
    transformation initiatives.
  - Experience documenting and redesigning complex business
    processes.
  - Demonstrated ability to influence stakeholders and drive
    organizational change.
  - Experience applying Lean, Six Sigma, Agile, Design Thinking,
    Business Process Management (BPM), or Continuous
    Improvement methodologies.
  - Experience with business process modeling and workflow
    design tools such as Visio, Lucidchart, Signavio, ARIS, or
    similar platforms.
  - Experience supporting implementation of enterprise
    platforms, workflow tools, governance systems, or audit
    technologies.
  - Experience developing operating models, governance
    structures, process controls, and performance measurement
    frameworks.
  - Knowledge of workflow automation, robotic process automation
    (RPA), artificial intelligence, or process mining
    technologies.
  - Strong workshop facilitation, stakeholder management, and
    change leadership skills.
  - Ability to communicate complex process and operational
    concepts to technical and non-technical audiences.
  - Consulting, transformation, or operational excellence
    experience within financial services preferred

  Who We Are:

  TD is one of the world's leading global financial
  institutions and is the fifth largest bank in North America
  by branches/stores. Every day, we strive to make every
  interaction, product, and experience remarkably human and
  refreshingly simple for over 27 million households and
  businesses in Canada, the United States and around the
  world. More than 95,000 TD colleagues bring their skills,
  talent, and creativity to foster deeper relationships,
  ensure disciplined execution, and build a simpler, faster
  banking experience. TD is deeply committed to being a leader
  in client experience, that is why we believe that all
  colleagues, no matter where they work, are client facing.
  Together, we are reimagining what banking can be for our
  clients, colleagues and communities.

  Our Total Rewards Package Our Total Rewards package reflects
  the investments we make in our colleagues to help them and
  their families achieve their financial, physical, and mental
  well-being goals. Total Rewards at TD includes a base
  salary, variable compensation, and several other key plans
  such as health and well-being benefits, savings and
  retirement programs, paid time off, banking benefits and
  discounts, career development, and reward and recognition
  programs. Learn more

  Additional Information: We’re delighted that you’re
  considering building a career with TD. Through regular
  development conversations, training programs, and a
  competitive benefits plan, we’re committed to providing the
  support our colleagues need to thrive both at work and at
  home.

  Please be advised that this job opportunity is subject to
  provincial regulation for employment purposes. It is
  imperative to acknowledge that each province or territory
  within the jurisdiction of Canada may have its own set of
  regulations, requirements.

  Colleague Development

  If you’re interested in a specific career path or are
  looking to build certain skills, we want to help you
  succeed. You’ll have regular career, development, and
  performance conversations with your manager, as well as
  access to an online learning platform and a variety of
  mentoring programs to help you unlock future opportunities.

  If you’re passionate about helping clients and building
  deep, lasting relationships, TD offers diverse career paths
  where you can grow your expertise and make a meaningful
  impact.

  We're committed to your success and foster a respectful
  workplace where diverse perspectives are valued, everyone
  has fair opportunities to grow, and you can unlock your full
  potential to achieve your career goals. Here at TD, we hire
  and develop the best.

  Training & Onboarding We will provide training and
  onboarding sessions to ensure that you’ve got everything you
  need to succeed in your new role.

  Interview Process  We’ll reach out to candidates of interest
  to schedule an interview. We do our best to communicate
  outcomes to all applicants by email or phone call.

  Accommodation  Your accessibility is important to us. Please
  let us know if you’d like accommodations (including
  accessible meeting rooms, captioning for virtual interviews,
  etc.) to help us remove barriers so that you can participate
  throughout the interview process. We look forward to hearing
  from you!

