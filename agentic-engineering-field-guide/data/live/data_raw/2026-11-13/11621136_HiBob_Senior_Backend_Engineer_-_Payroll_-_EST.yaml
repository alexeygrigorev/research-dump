description: |
  It’s an exciting time to join HiBob. Salesforce is leading a
  $166 million investment in the company, supporting our
  vision to bring trusted people context into the AI-powered
  enterprise. As we accelerate our product, technology, AI,
  and innovation roadmap, you’ll have the opportunity to help
  shape what comes next. As a Senior Backend Engineer on the
  team, you’ll have a key role in developing our Payroll
  product and its unique features, working closely with our
  Product team. You are passionate about software engineering
  and building a product end-to-end. You will be responsible
  for owning the dev cycle from the technical design, through
  coding and testing, to deployment and monitoring. We work in
  a true continuous delivery environment with fully automated
  QA processes on a microservices architecture, deploying to
  production dozens of times every day. As an agentic AI
  company, we’re building intelligent software that takes
  action to help customers get work done—and embracing AI in
  how we build it. Base salary for this role ranges from
  $170,000 - $220,000 per year plus benefits and stock options
  (ISOs). Candidates must be physically located in the Eastern
  Time Zone to ensure sufficient working-hour overlap with our
  team in Europe and Israel. Job Requirements

  - Physically located in the Eastern Time Zone---we cannot
    consider applicants outside EDT at this time.
  - Hands-on experience using AI coding tools to develop, test,
    and debug backend software, with the judgment to validate
    generated code for quality, security, and maintainability.
  - 6+ years of professional experience as a software engineer,
    strongly emphasizing backend development.
  - Experience building customer-facing SaaS products from
    inception to launch with thousands of users.
  - Experience collaborating with product managers, exercising
    sound judgment on when to advocate strongly, and
    confidently navigating trade-offs and negotiations.
  - Experience with relational databases like PostgreSQL, MySQL,
    etc.
  - Excellent knowledge of software design and scalable
    architecture.
  - Experience with testing methodologies - unit-testing, TDD,
    mocking, etc.
  - Experience with AWS or an equivalent cloud platform.
  - Independent, fast learner, and excited about learning new
    technologies.
  - Proactive team player with a desire to impact our team, our
    product, and our customers.

  The following is a big plus:

  - Experience with Kotlin, Java, or Scala.
  - Experience developing a payroll/payments/HR product.

  Job Responsibilities

  - Design, develop, and maintain highly scalable back-end
    systems for our Payroll product using a modern
    microservices architecture.
  - Collaborate with product managers, front-end engineers, and
    other stakeholders to implement new features and ensure
    alignment with the overall product roadmap.
  - Write clean, maintainable, and efficient code in Kotlin,
    Scala, or Java (or be eager to learn Kotlin).
  - Build and optimize APIs to support seamless integrations
    across our platform.
  - Participate in code reviews and provide constructive
    feedback to team members.
  - Take ownership of the full development cycle, including
    technical design, implementation, testing, deployment, and
    monitoring.
  - Work in a continuous delivery environment with automated QA
    processes to ensure robust and reliable releases.

  Benefits At HiBob, our people are at the heart of everything
  we do. We’re building a global village of ambitious,
  thoughtful, and talented Bobbers who want to do the best
  work of their careers. With a vibrant NYC office and remote
  teammates across the country, we’ve created an environment
  where people can be themselves, grow quickly, and make a
  real impact. Joining HiBob means working alongside
  exceptional people while being supported with competitive
  compensation, comprehensive benefits, and pre-IPO equity,
  including the perks below. Ownership & Financial

  - Equity in a global, high-growth HR tech SaaS leader
  - 401(k) with a 3% company match effective the month following
    your start date
  - $2,500 employee referral bonus

   Health & Wellbeing

  - Medical, dental, and vision coverage from day one
  - $1,920 annual wellness stipend to support your physical and
    mental wellbeing
  - Annual Headspace membership and expanded wellness benefits

  Workplace Flexibility

  - Hybrid working model for Bobbers in the NY metro area
  - Temporary work from anywhere for up to 2 months per year
    (after 6 months)

  Work-Life Balance

  - Generous paid time off and company holidays to rest,
    recharge, and enjoy
  - Bob Balance Days – 4 additional days within a calendar year
    - Enjoy a company-wide long weekend at the beginning of
    each quarter
  - Your birthday off — plus a special gift from us

  Work From Home

  - Home office allowance to set up your ideal workspace

  Community & Culture

  - Two paid Social Impact days each year to give back to causes
    you care about
  - Frequent team and company social events, both in-person and
    virtual
  - Dog friendly office

  If this sounds like something you’ve been looking for, we’d
  love to have you. Come on, join our village!
