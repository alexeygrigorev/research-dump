description: |
  Building the Future of Open Finance

  Payward - the parent company behind Kraken, NinjaTrader,
  Breakout, xStocks, Payward Services and CF Benchmarks - has
  spent the last 15 years building one of the most modern and
  globally accessible financial infrastructure platforms in
  the industry, built to advance an open, global financial
  system.

  The team

  Founded in 2011, Kraken is one of the world's longest-
  standing crypto platforms, trusted by over 10 million
  individuals and institutions across the globe. It offers
  spot trading, margin, futures, staking, and OTC services,
  with products built for both individual investors and
  institutional clients.



  The opportunity

  - Make web development faster by improving builds, type
    checking, linting, and tests, both locally and in CI
  - Evolve our monorepo, package management, and shared
    configuration so changes across applications and libraries
    are straightforward and reliable
  - Simplify development environment setup and support parallel
    work by engineers and coding agents, with clear
    documentation and tools that work with minimal
    configuration
  - Improve web delivery pipelines, including preview
    environments, progressive rollouts, production monitoring,
    and reliable rollback
  - Strengthen automated validation, including browser-based
    checks that help engineers and agents verify changes
    before they ship
  - Work with product and infrastructure teams to investigate
    web performance, improve observability, and address
    problems across application code, tooling, and delivery
  - Lead tooling upgrades and migrations across teams, balancing
    long-term improvements with the practical needs of
    engineers shipping products
  - Own improvements from design through rollout and ongoing
    maintenance, staying close to the people using what you
    build





  What you bring

  - Solid experience building and maintaining production web
    applications, with a strong understanding of React and the
    modern JavaScript ecosystem
  - Strong TypeScript and JavaScript skills, including
    experience using Node.js to build tooling and automation
  - A good understanding of how web applications work, including
    browser behavior, module systems, bundling, caching, and
    performance
  - Experience improving developer tooling, build systems,
    automated testing, or CI/CD pipelines, and the ability to
    diagnose problems across those layers
  - Good judgment about reliability, security, maintainability,
    and when added complexity is worth the cost
  - The ability to lead a technical design, explain it clearly,
    and work with other teams to get changes adopted
  - Ownership: you can take an ambiguous problem, find a
    practical solution, and keep it working once people depend
    on it





  Nice to haves

  - Experience maintaining large monorepos, shared packages, or
    tooling used by multiple engineering teams
  - Familiarity with pnpm, ESM, and modern build, linting, and
    test tools
  - Experience with browser automation, end-to-end testing, web
    performance profiling, or production observability
  - Hands-on experience with coding agents and improving the
    environments, documentation, and feedback loops they rely
    on
  - Experience with GitLab CI, containers, or cloud
    infrastructure supporting web development and delivery
  - Contributions to open-source frontend infrastructure or
    developer tools







