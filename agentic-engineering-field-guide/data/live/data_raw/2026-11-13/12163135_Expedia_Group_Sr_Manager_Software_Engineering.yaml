description: |
  At Expedia Group, we help travelers explore the world, one
  journey at a time. As a global travel company powered by
  passionate people, trusted partnerships, and leading
  technology, we connect travelers, partners, and advertisers
  through our consumer brands, B2B network, and travel
  advertising business.

  Here, you'll do meaningful work that helps millions of
  people discover, book, and experience travel with more ease,
  confidence, and joy. Our five Behaviors-Traveler First,
  Think Big, Operate with Excellence, Ownership Mindset, and
  Succeed Together-help foster a supportive environment where
  people can grow their careers and have the flexibility,
  benefits, and support to do their best work. Join us and
  build for travelers everywhere.

  Senior Manager, Software Development Engineering

  Introduction to the Team: Expedia Group B2B connects
  partners across the travel industry to our leading
  technology, supply, and services - helping them deliver
  seamless travel experiences to their customers. From
  airlines and hotels to financial institutions and other
  travel platforms, we power smarter, faster, and more
  impactful travel solutions through the most connected
  marketplace in the world.

  The Digital Operations Supply Marketing (DigOps Engineering)
  sits at the intersection of supply marketing and
  engineering, organized into three streams: Data Engineering,
  Software Engineering, and Innovation. Data Engineering owns
  the ETL pipelines moving data to/from Marketo, SFMC, and
  other marketing platforms across our business verticals
  (Hotels, VR, B2B/Connectivity, OCF). The Software
  Engineering stream, which this role leads, builds and runs
  the DigOps Utilities platform and front-end tooling that let
  marketers and designers move faster without waiting on
  engineering for every change. Our users are Marketing
  Operations teams across Hotels, VR, Connectivity and OCF,
  and we work side by side with them on intake, QA and launch.



  Make An Impact!

  Are you a hands-on engineering leader who loves turning
  marketing operations into scalable, self-service platforms?
  Are you ready to build and grow a high-performing team at a
  leading travel technology company? If this sounds like you,
  keep reading!

  The Expedia for Business Digital Operations Supply Marketing
  team is looking for a Senior Manager, Software Development
  Engineering to lead our Software Engineering stream.

  This role owns the technical vision, delivery, and team
  growth for the DigOps Utilities platform: the self-service
  tools marketing operations use every day to run campaigns,
  such as Multi-Select (partner opt-in/opt-out and Expiring
  DRR), Bulk List Upload, Target List Upload and scheduler,
  token upload/download, Babel Prime localization and A/B
  testing. It also covers the AI Orchestration engine that
  builds Marketo programs and templates from Figma files,
  GenAI-assisted Email QA, and the data-integration layer
  (Trino/Starburst, Salesforce, EGA) behind our utilities. You
  will lead the move of these utilities from legacy PHP to our
  new utility stack, and shape how they evolve as we move
  toward SFMC.

  If you are someone with a growth mindset and love solving
  complex and challenging problems, come join us on this
  exciting journey.



  In This Role You Will:

  - Lead and grow an engineering team, building self-service
    marketing utilities on the DigOps Utilities platform,
    including Multi-Select and Expiring DRR, Bulk List Upload,
    Target List Upload and scheduling, token upload/download,
    A/B testing, and localization/translation tooling (Babel
    Prime multi-asset support), with CSV/TSV data handling for
    Marketo campaigns
  - Lead the migration of legacy PHP utilities (hosted on the
    CoE and MSLPS servers, with per-brand copies) to the new
    DigOps Utilities stack, including cutover, validation with
    Marketing Operations, and retirement of the legacy code
  - Plan the rebuild or replacement of Marketo-based utilities
    for SFMC, so marketers keep the same self-service
    experience on the new platform
  - Own the API and data-integration layer connecting our
    utilities to Trino/Starburst, Salesforce (ACR, account,
    and contact tables), and EGA data sources. This includes
    schema management and Lake Formation permissioning across
    environments
  - Own the technical roadmap for front-end development across
    every DigOps project, including the self-service utility
    UIs marketers and designers use daily
  - Own the AI Orchestration engine that generates Marketo
    templates from Figma files, and GenAI-assisted Email QA
  - Partner with design and marketing stakeholders to push
    template build support toward designer self-service
  - Own platform and infrastructure health for DigOps tooling
    (Okta sign-in and access groups, Cloud Gate Proxy,
    deployment automation) and drive down tech debt, including
    reliable background processing (for example idempotent
    Celery tasks and batch status/failure reporting)
  - Establish engineering best practices for API design, coding,
    testing, observability, and operational readiness
  - Run support and incident readiness for the utilities: work
    with Marketing Operations on the utility bug and outage
    process, and build monitoring and alerting (such as
    Datadog) so failures are caught and routed before
    marketers are affected
  - Recruit, develop, and mentor engineers, creating an
    inclusive, high-performing culture and clear career paths
    for the engineers below them
  - Partner with cross-functional leads (Data Engineering,
    Innovation) to align priorities across Supply Marketing
  - Balance near-term delivery commitments with longer-term
    platform modernization



  Experience and Qualifications:

  - Bachelor’s or Master’s degree in Computer Science or related
    field, or equivalent related professional experience
  - 8+ years of software engineering experience
  - Proven track record delivering production services or
    platforms at scale
  - Strong experience with distributed systems, RESTful API
    design, and AWS-based platforms
  - Experience with front-end development frameworks and modern
    JavaScript/TypeScript stacks
  - Experience building and operating Python web services with
    asynchronous or batch job processing (queues, workers,
    retries), and relational databases such as Postgres
  - Experience modernizing legacy applications (for example PHP)
    to a new stack, including phased cutover and retirement of
    the old system
  - Hands-on experience with marketing technology (MarTech)/CRM
    platforms such as Marketo and Salesforce Marketing Cloud
    (SFMC) is a key requirement, including an understanding of
    campaign data models and marketing data integrations
  - Demonstrated ability to lead teams through technical change
    and platform modernization
  - Strong cross-functional communication and stakeholder
    management skills



  Preferred Qualifications:

  - Experience with Figma-to-code or design-system tooling
    integrations
  - Experience building internal self-service tools for
    marketing or operations teams, such as bulk list and
    audience uploads, campaign setup and opt-in/opt-out
    workflows, with strong validation and clear status and
    error reporting for non-technical users
  - Experience with marketing personalization or recommendation
    systems (e.g., next-best-action or opportunity engines)
    that surface campaign or audience signals
  - Experience with localization or translation workflows for
    global marketing campaigns across multiple languages
  - Broader software engineering experience across multiple
    domains or tech stacks beyond this team’s core stack is a
    plus. Marketing-domain exposure is valuable, but depth as
    a software engineering leader comes first
  - Experience in the travel or e-commerce industry

  The total cash range for this position in Austin is
  $184,500.00 to $258,000.00. Employees in this role have the
  potential to increase their pay up to $295,000.00, which is
  the top of the range, based on ongoing, demonstrated, and
  sustained performance in the role. The total cash range for
  this position in Seattle is $184,500.00 to $258,000.00.
  Employees in this role have the potential to increase their
  pay up to $295,000.00, which is the top of the range, based
  on ongoing, demonstrated, and sustained performance in the
  role.

  Starting pay for this role will vary based on multiple
  factors, including location, available budget, and an
  individual’s knowledge, skills, and experience. Pay ranges
  may be modified in the future.

