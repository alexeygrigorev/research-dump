description: |
  161 Bay Street (93021), Canada, Toronto,Toronto,
  Ontario,Senior Manager, Software Engineering About Capital
  One Canada. For 30 years, we've been on a mission to change
  banking for good. We challenge the traditional bank
  stereotype by integrating machine learning, conversational
  AI and design thinking into our core operations. We're a
  bank a tech company would build, where your work directly
  shapes innovative solutions that impact millions of
  Canadians. We're driven by fearless curiosity, bold
  innovation, and a collective of authentic people working
  together to redefine what's possible. Technology isn't just
  part of our strategy, it is our strategy . Everything we do
  serves our vision and the creation of what's next. About the
  Team: Since 2014, Capital One Canada's software studio has
  grown from a team of 10 to a team of over 250. We're
  passionate about what we do, and we're always on the lookout
  for people who want to make a difference in the world of
  credit through technology. We're obsessed with doing the
  right thing, and we achieve that by finding innovative ways
  to better serve our customers. Here are a few of the ways
  we're helping people take control of their credit:

  - Helping customers view and monitor their credit scores with
    Credit Keeper
  - Enabling customers to view and edit their Personal
    Information directly in the Mobile App
  - Providing customers 100% certainty which credit cards
    they'll be approved for before they apply, by using Quick
    Check™

  We're all-in on the cloud and we're leaders in the adoption
  of open source, RESTful APIs, microservices, and containers.
  We build our own products and release them with a speed and
  agility that allows us to get new customer experiences to
  market quickly. And, as a founder-led company, we're
  inspired to make, break, do, and do good.  About the Role:
  In this role, you will motivate, manage, and inspire a team
  of software engineers to deliver innovative products
  alongside participating in hands-on development. Your
  Responsibilities:

  - Directly and indirectly lead 2+ teams of engineers to build
    solutions that help to reduce fraud and improve our
    customers' experience
  - Participate in talent and succession planning, encourage
    innovation, implement cutting-edge technologies, elevate
    inclusion, offer out of the box thinking, celebrate
    teamwork, self-organization and diversity
  - Lead the craftsmanship, availability, resilience and
    scalability of applications within the Software Studio
  - Bring passion to stay on top of tech trends, experiment with
    and learn new technology, participate in internal &
    external technology communities, and mentor other members
    of the engineering community

  Basic Qualifications:

  - At least 4 years of experience leading a team within an
    agile environment
  - At least 4 years of experience providing direct people
    leadership including talent development, performance
    management, team building and succession planning
  - At least 10 years of experience as a hands-on software
    engineer
  - Knowledge of software engineering best practices including
    security, automated testing, continuous delivery (CI/CD),
    high-availability and system resiliency

  Preferred Qualifications:

  - Experience with AWS, GCP, Microsoft Azure, or another cloud
    service
  - Exposure to financial/tech industry
  - Bachelor's, Master's or Diploma in Computer Science,
    Software Engineering, Information Technology or in related
    field
  - Experience leading multiple teams
  - Demonstrated ability to influence senior business and
    product stakeholders (Director+) on strategy and roadmaps
  - At least 5 years of experience managing relationships with
    Business and/or Product stakeholders, and/or external
    partners
  - At least 4 years of experience leading software engineers
    creating customer facing and enterprise facing web
    applications and/or supporting application services
  - At least 10 years of experience contributing to application
    and/or data design, architecture and development

  Working at Capital One.  You'll be empowered to take end-to-
  end ownership of your work and your career, backed by a
  high-performance, hybrid culture and holistic suite of
  benefits designed to support your whole self.

  - Take ownership of your own potential: Whether you're looking
    to upskill, pivot into new business areas, or master your
    craft, you'll have access to tools and mentorship to reach
    your potential and define your career trajectory.
  - Find your rhythm: We believe trust fosters the flexibility
    and autonomy required to balance personal needs with a
    focus on high performance. We support a hybrid model -
    with 3 days in the office per week - that gives room for
    both collaboration and personal commitments.
  - Benefits built for your life: We take a holistic approach to
    well-being, providing support for you and those who are
    most important to you. This includes: full coverage for
    spouses, domestic partners and dependents, a one-time Work
    From Home allowance to build your comfortable workspace,
    up to $3,000 in mental health coverage and up to $5,000 in
    annual tuition subsidies.

  You'll find that Capital One is committed to helping you
  thrive and evolve every step of the way.  This posting is
  for an existing vacancy. The expected annual salary range
  for this position is $202,400 - $231,000. This role is also
  eligible to earn performance based incentive compensation,
  which may include cash bonus(es). Incentives could be
  discretionary or non discretionary depending on the plan. We
  embrace the responsible use of artificial intelligence (AI)
  to enhance the candidate experience and streamline our
  recruitment processes. However, no hiring decisions are made
  using AI as every hiring decision is made by our hiring
  managers, business interviewers, and recruitment
  professionals. Our teams are equipped with training that
  empowers them to use AI responsibly. Capital One Canada is
  an equal opportunity employer committed to fostering a
  diverse and inclusive work environment. We consider all
  qualified applicants and will meet the needs of those
  requiring reasonable accommodations. If you have visited our
  website in search of information on employment opportunities
  or to apply for a position, and you require an
  accommodation, please contact Capital One Recruiting at
  1-800-304-9102 or via email at ARCanada@capitalone.com . All
  information you provide will be kept confidential and will
  be used only to the extent required to provide needed
  reasonable accommodations. For technical support or
  questions about Capital One's recruiting process, please
  send an email to Careers@capitalone.com Capital One does not
  provide, endorse nor guarantee and is not liable for third-
  party products, services, educational tools or other
  information available through this site. Capital One
  Financial is made up of several different entities. Please
  note that any position posted in Canada is for Capital One
  Canada, any position posted in the United Kingdom is for
  Capital One Europe and any position posted in the
  Philippines is for Capital One Philippines Service Corp.
  (COPSSC).
