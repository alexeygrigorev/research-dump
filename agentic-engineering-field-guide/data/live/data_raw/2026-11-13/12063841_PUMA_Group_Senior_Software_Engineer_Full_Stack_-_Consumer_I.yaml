  YOUR MISSION

  About the Organisation & Role:

  Consumer Intelligence & Engagement organisation responsible
  for delivering the intelligence and engagement capabilities
  that enable more relevant and personalised consumer
  experiences across digital channels. The organisation plays
  a key role in how consumers discover products, engage with
  content, and elevate experiences through membership &
  loyalty. Through capabilities such as personalisation,
  recommendations, consumer intelligence, experimentation, and
  AI-driven decisioning, the organisation helps deliver more
  contextual, data-driven interactions across the consumer
  journey.organisation responsible for delivering the
  intelligence and engagement capabilities that enable more
  relevant and personalised consumer experiences across
  digital channels. The organisation plays a key role in how
  consumers discover products, engage with content, and
  elevate experiences through membership & loyalty. Through
  capabilities such as personalisation, recommendations,
  consumer intelligence, experimentation, and AI-driven
  decisioning, the organisation helps deliver more contextual,
  data-driven interactions across the consumer journey.

  As a Senior Software Engineer (Full Stack), you will design,
  build, and maintain modern web applications and supporting
  backend services that power AI-driven product discovery,
  personalization, and consumer experiences. You will work
  closely with Tech Leads, Product Owners, AI/ML Engineers,
  and Data Engineering teams to deliver scalable, reliable,
  and intuitive solutions.

  What you will do:

  - Design, build, and maintain modern consumer-facing web
    applications that power AI-driven product discovery,
    search, recommendation, and personalization experiences.

  - Lead the technical design and delivery of complex frontend
    features and user journeys, ensuring high quality,
    performance, accessibility, and maintainability.
  - Partner with AI/ML Engineers, Data Engineers, and Backend
    Engineers to integrate GenAI, recommendation,
    personalization, and search capabilities into consumer-
    facing applications.
  - Build and optimize search, discovery, and conversational
    experiences that enable intuitive and engaging customer
    interactions.
  - Develop reusable UI components, frontend frameworks, and
    integration layers using modern web technologies such as
    React and TypeScript.
  - Contribute to backend APIs and services required to support
    frontend experiences and business workflows.
  - Drive improvements in application performance, reliability,
    observability, security, and overall user experience.
  - Mentor engineers, participate in design and code reviews,
    and promote frontend engineering best practices across the
    team.
  - Collaborate with product, design, engineering, and external
    technology partners to deliver impactful consumer
    experiences and business outcomes.

  Leverage AI-assisted engineering tools and practices to
  improve productivity, code quality, and delivery
  effectiveness.

  YOUR TALENT

  - 7+ years of experience designing, building, and operating
    modern web applications and digital consumer experiences.
  - Strong expertise in React, TypeScript, JavaScript,
    component-based architecture, and modern frontend
    engineering practices.
  - Experience building scalable, responsive, and high-
    performing web applications with a strong focus on
    usability, accessibility, and user experience.
  - Hands-on experience integrating frontend applications with
    REST APIs, microservices, and backend platforms.
  - Good understanding of backend engineering fundamentals using
    Java, Spring Boot, API design, and microservices
    architecture.
  - Experience building search and discovery experiences, with
    exposure to technologies such as Elasticsearch,
    OpenSearch, Azure AI Search, or similar platforms.
  - Experience working with cloud-native applications and modern
    development platforms such as Azure, AWS, or GCP.
  - Strong understanding of application performance
    optimization, observability, security, and operational
    excellence.
  - Experience collaborating across engineering, product,
    design, data, and AI teams to deliver customer-facing
    solutions.
  - Experience leading technical initiatives, mentoring
    engineers, and driving frontend engineering best
    practices.
  - Familiarity with SQL/NoSQL databases, caching technologies
    such as Redis, and event-driven architectures is
    desirable.
  - Exposure to AI/ML, Generative AI, LLMs, conversational
    experiences, or AI-powered consumer products is highly
    desirable.

