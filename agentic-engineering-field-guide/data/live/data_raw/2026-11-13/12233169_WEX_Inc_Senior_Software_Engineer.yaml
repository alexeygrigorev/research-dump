description: |
  Please note that we are unable to support visa sponsorship
  or visa transfers, either now or in the future . Candidates
  must be authorized to work in the United States without
  requiring sponsorship at any point during their employment (
  No exceptions). Additionally, candidates must reside within
  a 50-mile radius of one of the following locations: Dallas,
  TX; Chicago, IL; New York City, NY; San Francisco Bay Area,
  CA; or Seattle, WA.

  At WEX, we simplify the business of running a business.  Our
  WEX Benefits solutions reduce complexity and help manage
  costs of benefits administration for our clients and
  partners.  We are looking for passionate technologists,
  collaborators, and problem solvers to join our Benefits
  Technology team as we build the next generation of employer
  benefits solutions and services.

  As a Software Engineer on the WEX Benefits Technology team,
  you will work in a team that partners closely with Product
  Managers and customers to learn about the challenges
  employers face while navigating the competitive employee
  benefits landscape.  You will design solutions that solve
  problems in ways our customers love and work for our
  business.  You will build the highest quality software in
  the latest technologies and test driven development
  practices.

  Responsibilities:

  - Collaborate with stakeholders to learn about our customers
    biggest challenges.
  - Measure, inspect, and drive decisions using data.
  - Design, test, code, and instrument new solutions.
  - Strengthen and drive our engineering process with Test
    Driver Development and Behavior Driven Development,
    Microservice and Vertical Slice Architectures.
  - Support live applications, promote proactive monitoring,
    rapid incident response, and continuous improvement.
  - Analyze existing systems and processes to identify
    bottlenecks and opportunities for improvements.
  - Mentor and learn from your peers, foster continuous learning
    within your team and organization.
  - Become a subject matter expert in your functional area and
    best practices.
  - Assess unique circumstances and apply creative problem-
    solving techniques to resolve issues or suggest various
    approaches.
  - Independently complete work and proactively review with
    others.
  - Highly self-motivated, take ownership of your work, actively
    seek out ways to contribute, and require minimal
    supervision.

  Required Qualifications:

  - Bachelor's degree in Computer Science, Software Engineering,
    or related field;OR demonstrable equivalent experience.
  - At least 5 years of experience in software engineering.
  - Strong problem-solving and analytical skills
  - Excellent communication and collaboration skills.
  - Passionate about keeping up with modern technologies and
    design.
  - Strong proficiency in Angular and/or React
  - Experience building and consuming REST APIs
  - Proven track record of writing comprehensive unit tests and
    test suites
  - Strong understanding of software security principles and
    Open Worldwide Application Security Project (OWASP)
    guidelines
  - Proficiency with Git version control and CI/CD pipelines
  - Experience with Agile development methodologies
  - Excellent communication and collaboration abilities
  - Track record of delivering complex projects on schedule
  - Experience in writing performant stored procedures and
    functions
  - Experience in developing Cloud-Native applications and
    services

  Technology Must-Haves:

  - C#, Python (if applicable)
  - Docker
  - Modern RDBMS (i.e. MS SQL, Postgres, MySQL)
  - ASP.NET RESTful API design
  - Kafka / event-driven design
  - Modern Web UI Frameworks and Libraries (i.e. Angular, React)

  Technology Nice-To-Have or Dedicate to Learning Quickly:

  - Kubernetes
  - Helm/ArgoCD
  - Terraform
  - GitHub Actions
  - NoSQL databases
  - GraphQL
  - Azure

