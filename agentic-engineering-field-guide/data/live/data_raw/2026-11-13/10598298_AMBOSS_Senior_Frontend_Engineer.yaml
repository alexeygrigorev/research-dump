description: |
  Hi! We are AMBOSS and we are looking for a Senior Frontend
  Engineer to join our Educator Experience team or our Course
  Experience team, and shape the future of medical education
  with us! About AMBOSS

  AMBOSS is a dynamic learning and clinical decision support
  tool committed to empowering physicians globally to deliver
  optimal care. Since our inception in 2012, we've harnessed
  cutting-edge technology to transform the way physicians
  acquire and apply scientific knowledge. Each AMBOSSian is
  passionate about being the champion of clinicians today -
  this motivates and unites us each day towards success. And
  what does success look like? When a clinician or med student
  tells us, “AMBOSS makes practicing medicine easier and
  enjoyable. I love what I do, and a big part is because of
  AMBOSS.” Why can this position be exciting for you?

  We are AMBOSS, and we’re looking for a Senior Frontend
  Engineer in the Educator Experience team & the Course
  Experience team. Engineers at AMBOSS are at the forefront of
  shaping user experience for doctors and students, helping
  them make critical decisions, ultimately impacting the
  healthcare of billions of people worldwide. We are looking
  for someone with a passion for getting the most out of
  technology and people, setting the pace and direction of
  excellence for our frontend craft. We work AI-first: agentic
  tools like Claude Code are part of our daily engineering
  workflow, and we are looking for someone ready to lead the
  way in how software gets built in this new era. Join our
  agile team on one of two missions: to enable institutions
  (like educational clinics, medical schools) to use AMBOSS
  resources efficiently and effectively when teaching their
  learners (e.g. residents and students); or empowering
  doctors to further their education with expertly crafted
  courses . You will:

  - Lead frontend engineering projects within both teams, from
    conception to completion.
  - Set the bar for best practices in code health, testing,
    accessibility, and maintainability, and drive their
    adoption across the team.
  - Champion our AI-first way of working: use agentic tools
    (like Claude Code) across the development lifecycle, and
    help the team get more out of them.
  - Collaborate with Product and Design to shape requirements,
    turning ambiguous ideas into well-scoped technical plans.
  - Address Ad-Hoc requests from customer support channels.
  - Mentor engineers and share your knowledge within the AMBOSS
    community, contributing to a culture of continuous
    learning and growth.

  You bring:

  - Deep hands-on expertise with modern JavaScript, TypeScript,
    and React, and curiosity about emerging frontend
    technologies and practices.
  - Proven experience integrating AI coding agents such as
    Claude Code (or similar) into real production work, and
    the judgment to know where they excel and where they fail.
  - Experience across the full development lifecycle, from
    requirements analysis and system design through coding,
    testing, deployment, and maintenance.
  - Experience working with shared design systems and component
    libraries, and integrating APIs (GraphQL and/or REST) from
    the frontend.
  - Deep understanding of accessibility: you treat WCAG
    guidelines as the baseline, not the ceiling, and advocate
    for inclusive design in every architectural decision.
  - Performance optimization expertise: bundle sizes, tree-
    shaking, lazy loading, and how architectural decisions
    affect performance across devices and network conditions.
  - A testing and quality mindset, with experience in component
    testing strategies (unit, integration, visual regression)
    and building maintainable test suites.
  - Excellent verbal and written communication skills in
    English, able to articulate technical concepts and trade-
    offs to engineers, designers, and stakeholders.
  - Curiosity, being interested in optimizing processes,
    learning domain’s ins and outs.
  - Taking initiatives, having analytical mindset, being
    proactive and solution-oriented.
  - A strong sense of ownership, driving topics end-to-end and
    mentoring others along the way.



  Which team is the right fit?  No need to decide that now.
  Through a few rounds of interviews, we'll get to talk in
  more detail, and together we'll factor in interview
  performance, team fit, and your own preference. We're
  looking forward to meeting you!

  Benefits:

  AMBOSSians tell us that innovative work keeps them
  energized, and employee benefits help them to feel
  appreciated and empowered. We invest in every AMBOSSians
  with our employee benefits package, crafted to support
  financial, physical, and mental health and work-life
  harmony. Check out all of our employee benefits below:

  https://go.amboss.com/the-amboss-prescription-de

  We believe that diversity is a powerful driver of innovation
  and progress. That’s why we are committed to fostering an
  inclusive, respectful, and supportive environment where
  everyone—regardless of gender, age, ethnic or cultural
  background, religion, disability, sexual orientation, gender
  identity—is valued and given equal opportunity to thrive. We
  warmly welcome people of all backgrounds to help us fulfil
  our mission: empowering all medical professionals to provide
  the best possible care .

  Even if you don’t meet every single point in the job
  description, we still encourage you to apply. We’d love to
  hear from you!
