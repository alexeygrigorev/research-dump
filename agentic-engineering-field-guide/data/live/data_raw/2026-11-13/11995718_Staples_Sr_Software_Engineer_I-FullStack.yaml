description: |
  Senior Software Engineer I /Work Model: Onsite, Framingham

  Staples is business to business. You’re what binds us
  together. 

  Team Summary: 

  The eCommerce engineering team within Staples Digital
  Solutions builds and modernizes the technology that powers
  scalable, reliable, and high-performing digital shopping
  experiences. The team partners across Product, UX, Data
  Engineering, Infrastructure, and Business Operations to
  deliver customer-focused solutions, strengthen platform
  capabilities, and support Staples’ continued digital
  transformation.

  Role Summary:

  As a Senior Software Engineer I, you will serve as a key
  technical leader on the eCommerce team, designing and
  optimizing cloud-hosted platforms using modern microservices
  and micro-frontend architecture. You will work across the
  full technology stack, partner with technical and business
  stakeholders, and help deliver accessible, secure, data-
  driven experiences that improve performance and customer
  engagement.

  What you’ll be doing: 

  • Architect, design, and implement microservices and micro-
  frontend solutions for scalable, high-performance eCommerce
  platforms.

  • Develop full-stack applications using Java and Spring Boot
  for backend services and React with TypeScript for frontend
  experiences.

  • Translate business and product requirements into
  practical, innovative technical solutions in partnership
  with cross-functional stakeholders.

  • Build and maintain streaming and batch data pipelines that
  support real-time analytics and complex business decisions.

  • Improve site speed and user engagement by optimizing Core
  Web Vitals and overall application performance.

  • Deliver accessible applications that meet ADA requirements
  and support an inclusive customer experience.

   • Integrate payment gateways and maintain secure
  transaction processing aligned with PCI-DSS standards.

  • Design distributed data solutions using Couchbase, MySQL,
  and NoSQL technologies, and messaging solutions using
  platforms such as Solace, Azure Event Hubs, and Apache
  Kafka.

  • Provide technical guidance and mentoring to less-
  experienced engineers, and lead project teams or workstreams
  as needed.

  • Participate in code reviews, design discussions, and
  architecture reviews, while documenting systems and
  processes for ongoing support and knowledge sharing.

  What you bring to the table: 

  • Strong technical leadership, mentoring, collaboration, and
  communication skills.

  • Ability to connect business needs with scalable technology
  solutions and clearly explain complex concepts to technical
  and non-technical audiences.

  • Excellent problem-solving and critical-thinking skills,
  with sound independent judgment in architecture and
  technical design.

  • A customer-focused mindset, attention to detail,
  adaptability, and a commitment to continuous learning.

  What’s needed- Basic Qualifications: 

  • Bachelor’s degree in Computer Science, Software
  Engineering, or a related field.

  • 7+ years of progressively complex software engineering
  experience, including full-stack development with
  Java/Spring Boot and React/TypeScript.

  • Proven experience designing and implementing microservices
  and micro-frontend architectures.

  5+ years of experience working with cloud-hosted platforms
  such as AWS, Azure, or Google Cloud Platform and 5yrs of
  experience with Kubernetes.

  • Experience with distributed databases, including
  Couchbase, MySQL, and NoSQL technologies.

  • Experience with distributed messaging platforms such as
  Solace, Azure Event Hubs, or Apache Kafka.

  • Demonstrated expertise in Core Web Vitals optimization and
  ADA compliance.

  • Experience integrating and managing payment gateways and
  supporting PCI-DSS compliance.

  • Experience building and managing streaming and batch data
  pipelines.

  • Strong understanding of Agile methodologies, CI/CD
  pipelines, DevOps principles, and software engineering best
  practices.

  What’s needed- Preferred Qualifications: 

  • Master’s degree in a related field.

  • 2+ years of experience with micro-frontend frameworks and
  modular frontend architectures.

  • Experience supporting eCommerce platforms or digital
  marketplaces.

  • Familiarity with machine learning or optimization
  algorithms used in advanced analytics.

  • Experience with payment providers such as Klarna, PayPal,
  Venmo, or ACI.

  • Cloud platform certification, such as AWS Certified
  Solutions Architect or Azure Solutions Architect.

  We Offer: 

  - Inclusive culture with associate-led Business Resource
    Groups
  - Flexible PTO (22 days) and Holiday Schedule (7 observed paid
    holidays)
  - Online and Retail Discounts, Company Match 401(k), Physical
    and Mental Health Wellness programs, and
    more! https://careers.staples.com/Staples-Life/Benefits

  The salary range represents the expected compensation for
  this role at the time of posting. The specific base pay may
  be influenced by a variety of factors to include the
  candidate's experience, skill set, education, geography,
  business considerations, and internal equity.  In addition
  to base pay, this role may be eligible for bonuses, or other
  forms of variable compensation. 

