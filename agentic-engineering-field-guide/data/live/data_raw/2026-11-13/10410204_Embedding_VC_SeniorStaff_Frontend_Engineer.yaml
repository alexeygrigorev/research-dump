description: |
  About Flick

  Flick is defining the future interface for AI-native
  filmmaking. Think Figma and Cursor, but for creating AI
  films. Founded by Ray Wang (engineer who built Instagram
  Stories) and Zoey Zhang (award-winning filmmaker). Well-
  funded by top VCs including Y Combinator, Google Ventures,
  True Ventures, and Lightspeed.

  The Role

  Founding front-end engineer. Lead the development of the
  core experience of Flick — the canvas, timeline, and
  creative tooling. Work directly with founders and shape the
  future interface for AI visual storytelling.

  Responsibilities

  • Lead the architecture and development of editor UI from
  the ground up (canvas, timeline, node graph, playback)

  • Rapidly prototype and iterate on new creative workflows to
  validate ideas and user experience

  • Establish best practices for code quality, performance,
  testing, and maintainability

  • Collaborate closely with design, product, and AI backend
  teams to shape end-to-end user experience

  • Drive key technical and product decisions as part of the
  founding engineering team

  Required Qualifications

  • 3+ years of experience

  • Experience owning and leading technical initiatives on
  high-performance web applications

  • Strong expertise with modern front-end tooling (React,
  TypeScript, build systems, CI/CD)

  • Deep experience optimizing complex UX interactions,
  especially in editors, canvases, visual builders, or
  multimedia tools

  • Ability to design scalable UI architectures and manage
  large, dynamic client-side state

  • Passion for creating fast, intuitive, and beautiful
  creative interfaces

  • Startup mindset: thrive in fast-moving environments, take
  ownership, solve ambiguous problems at scale

  Nice-to-Have Qualifications

  • Experience with video editors, creative canvas,
  animation/keyframe systems, design tools, node-graph
  editors, or similar

  • Love films and art

  • Open-source contributions and personal coding projects
  outside regular work

  Compensation

  • $100,000 – $200,000 / year + 0.10% – 1.00% equity

  • Visa sponsorship available
