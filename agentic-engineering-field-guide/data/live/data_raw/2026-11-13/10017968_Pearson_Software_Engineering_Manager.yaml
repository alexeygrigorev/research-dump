description: |
  ROLE: Manager, Software Engineering Role aim

  Are you passionate about AI and Education? We are thrilled
  to announce a great opportunity to join our international AI
  organization inside the English Language Learning division
  as a Software Engineering Manager to lead one of the most
  critical products in the company.

  In Pearson English Language Learning we aspire to become the
  world's leading destination to learn, assess and improve
  English language skills. Our main focus is to deliver our
  promise to committed learners from around the world, who
  want to reach their full potential through learning English.


  Estimated time spent on various task types:

  Meetings, incl. people management: 60%

  New features: 20%

  Documentation and processes: 20%

  Maintenance: 0%

  Role profile

  As an Experienced Software Engineering Manager, you will
  play a vital role in leading and inspiring a team of
  software engineers and Data Scientists to deliver high-
  quality AI powered software solutions to learn and assess
  language skills. You will be responsible for overseeing the
  entire software development lifecycle, from planning and
  design to implementation and maintenance. Your technical
  expertise and managerial skills will be crucial in ensuring
  the successful execution of technical solutions, meeting
  deadlines, and fostering a collaborative and inclusive work
  environment   This role requires minimal guidance as you
  will be the leader of one or more product engineering
  squads, responsible for their goals and performance.

  Responsibilities

  - Co-Responsible for one or more digital products together
    with the business product owner, taking ownership of the
    experience our customers have and driving the technical
    strategy that has most impact on that experience.

  - Lead and manage a team of software engineers, providing
    guidance, mentorship, and support to help them grow
    professionally and achieve their goals.

  - Collaborate with cross-functional teams, including product
    managers, developers, designers, architecture, data, QA,
    Operations and Customer Service, to define product goals,
    business needs, and timelines.

  - Drive the software development process, including planning,
    design, implementation, testing, and deployment, while
    ensuring adherence to best practices and coding standards
    like DevOps/DevSecOps, Clean Code, DDD, etc.

  - Ensure the team's productivity and efficiency by removing
    obstacles, resolving conflicts, and providing necessary
    Capacity.

  - Be the single point of contact to the rest of the
    organization for the owned Digital Products, collaborating
    with stakeholders to understand business needs and
    translating them into technical solutions.

  - Be accountable for the data generated as part of the product
    offering, understanding its journey into different
    platforms and its uses to help business to make decisions
    in an outcome driven way.

  - Track and report on roadmap progress, budget, and capacity
    allocation, ensuring timely and successful value delivery.

  - Responsible for the budget of the solution(s), understanding
    the total cost of ownership, making the right financial
    choices.

  - Understand security and compliance requirements and drive
    their fulfilment with Product and Development teams.

  - Act as a technical leader, with deep understanding of AI
    possibilities, providing guidance and making critical
    decisions to drive technical excellence and ensure the
    scalability and maintainability of software systems.

  - Stay up to date with the latest industry trends,
    technologies, and methodologies, and recommend process
    improvements and technical solutions accordingly.

  - Foster a culture of continuous improvement, innovation, and
    knowledge sharing within the team.

  - Uphold and promote a diverse and inclusive work environment
    where all team members feel valued, respected, and
    empowered.

  Most desirable qualifications:

  - Bachelor's or Master's degree in Computer Science, Software
    Engineering, or a related field.

  - Proven experience in software engineering principles,
    development processes, technologies, extreme development
    methodologies and practices and industry trends for
    Development and QA.

  - Hands-on experience with programming languages such as Java,
    PHP, Kotlin, Python, or C++, as well as frameworks like
    React and Node.js.

  - Strong leadership and managerial skills, with the ability to
    motivate and inspire a team.

  - Working experience in Agile practices, product and project
    management principles.

  - Excellent communication skills, with the ability to
    effectively collaborate and build relationships with
    stakeholders at all levels. Able to communicate technical
    concepts to non-technical individuals.

  - Experience with software development and DevOps/DevSecOps
    tools and practices, such as version control systems,
    issue tracking systems, CI/CD pipelines, Continuous
    deployment, Feature Flags, Domain Driven Design, Events
    Driven Architecture, Clean Code, etc.

  - Ability to make strategic decisions, prioritize tasks, and
    manage multiple teams and initiatives simultaneously.

  - Strong problem-solving and analytical skills, with a keen
    attention to detail.

  - A passion for staying up to date with emerging technologies
    and industry trends.

  - Commitment to fostering an inclusive and diverse work
    environment.

  Location:

  We are looking for an individual in Spain or Poland to join
  one of the 2 locations where our team is based. #LI-MG1
