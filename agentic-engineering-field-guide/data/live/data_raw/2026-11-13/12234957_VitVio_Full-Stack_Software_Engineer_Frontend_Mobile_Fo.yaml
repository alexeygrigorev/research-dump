description: |
  About VitVio

  VitVio is building AI-powered tools to simplify and
  streamline operating room workflows, so surgical teams can
  focus on what really matters—patient care. Our platform uses
  computer vision and context-aware AI to understand actions
  happening in the OR in real time. From automatically logging
  surgical stages to coordinating team readiness, we take on
  the administrative load so clinical staff don’t have to.‍

  Our team has experience founding and scaling leading
  companies in adjacent industries. We're growing quickly,
  backed by top-tier investors, and working with some of the
  most respected hospitals in the US and Europe.



  About the Opportunity

  We're looking for a Fullstack Software Engineer who is a
  frontend specialist to join our experienced engineering
  team. This role blends deep technical work on the frontend
  with people leadership and offers the chance to build tools
  used directly in surgical care.

  This role is remote-first, and open to candidates based in
  Europe and the US, we prioritize talent over everything
  else. Some international travel is required to visit
  hospitals, observe workflows, and co-design with clinical
  users.



  What You’ll Do

  Like all our engineers, you will work across the stack on
  systems used by hospital staff in high-stakes environments.
  From RFD to deployment, you’ll take ownership of features,
  propose creative improvements, and ship clean, reliable code
  with confidence. As a frontend specialist, we will lean on
  you to define our frontend strategy to maintain high
  iteration speed while supporting a wide range of devices.
  You will ensure high quality in the frontend while
  facilitating contributions from all engineers.

  In your first 6 months, you will:

  - Work closely with our design team to implement our design
    system
  - Modularise the frontend code to make it testable and mobile-
    ready
  - Mentor good frontend habits to onboard software team to the
    structures you are putting in place
  - Deliver weekly enhancements or fixes with high quality and
    near-zero regressions
  - Contribute to product development through structured
    feedback, prototyping, and testing
  - Own and ship projects end-to-end across our product and
    machine learning teams

  You’ll work across a diverse stack:

  - Frontend: React, TypeScript
  - Backend: Elixir (Phoenix), C++
  - Infrastructure: GCP, GitHub Actions, NixOS
  - Data: Postgres, ETL pipelines
  - APIs: GraphQL, REST, integrations with healthcare systems
    (e.g. HL7/FHIR)

  Although we are looking for extensive frontend and mobile
  experience, we don’t expect you to have deep experience in
  each tool and language — but we’re looking for curiosity and
  adaptability. We support engineers in learning new tools as
  needed. So, if you don’t have experience with some of the
  tech above, no problem, we’d still love you to apply!



  You Might Be a Great Fit If You…

  - You have architected and implemented highly maintainable and
    reliable web apps that work across devices
  - You have built and maintained design systems
  - Are a well-rounded engineer with experience and interest
    across the stack (our philosophy is for all engineers to
    contribute to all repositories)
  - Are known for clean, reliable code and proactive
    communication
  - Take the initiative: when something’s broken, you fix it or
    raise it
  - Think in systems and edge cases, but you move quickly and
    pragmatically
  - Thrive in team settings that value candid discussions,
    curiosity, and mutual respect
  - Include the word ‘reactor’ in your application (to let us
    know you’ve read this)
  - Find purpose in building software that solves real problems
    for real people

  We don’t expect you to know all of our stack or match every
  bullet here — we care more about how you think, learn, and
  collaborate.

  Benefits

  📈 Early-Stage Equity

  💰 Competitive salary

  💻 Company laptop along with tools you need to succeed

  🧠 Learning & development budget

  🎉 Offsites and team-building events

  🌴 Flexible PTO

  Hiring Process

  - Review: Submit your application
  - First Call (30 min): A call with our CTO to talk through
    your current/past experience, your motivations and tell
    you more about VitVio.
  - Meet with our CEO (30 min): You’ll speak to our CEO to see
    if the magic is there.
  - Coding Interview (90 mins): You’ll be working with two of
    our team members through a coding exercise.
  - Career Deep Dive (90 mins): Our CTO will go with you through
    your achievements and learnings of your career so far.
  - Design Interview (90 mins): You’ll be showing us how you are
    working with designers and how you have solved design
    challenges in the past
  - Offer
