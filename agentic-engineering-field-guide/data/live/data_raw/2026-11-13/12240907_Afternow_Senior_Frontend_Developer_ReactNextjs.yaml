description: |
  Quick Summary 🎯 Project Focus: We’re looking for a Frontend
  Expert to develop the functional and styled frontend based
  on the given Figma designs. Build the storefronts and
  supplier management hubs for a massive digital retail
  ecosystem. You will transform complex B2B/B2C designs into
  high-performance web experiences for the LATAM market. 🕛
  Hours: Full-time 🌎 Location: Fully remote 🇪🇺 Time Zone:
  Looking for people in Europe or LATAM 🇬🇧 Language: Native or
  professional English required. Spanish is a strong bonus, as
  the project is targeting the Latin American market. 🤠 5+
  years of experience in Frontend Engineering. You must have
  deep expertise in React, TypeScript, and Next.js. Experience
  with modern tooling (TailwindCSS, shadcn/ui, TanStack Query,
  Zustand) is required. 💸 Salary: €3,000 / month, gross, B2B

  About Afternow

  We are partners in your digital journey. We bring together
  strategy, design, and technology to build systems that flex
  as your future unfolds. Afternow creates the digital systems
  brilliant companies are built on. Strategy, identity, web
  and product design, and technology that scales. Every part
  of the process supports and informs the other, creating an
  environment that works today and adapts to wherever the
  business goes next. We work primarily with ambitious,
  digitally focused organizations navigating change. From
  startups finding their footing, to scale-ups building
  momentum, to established enterprises reshaping their digital
  foundations. Our partnerships are built on clarity, craft,
  and care. Since 2012, we've grown from our roots on Island
  Krk, Croatia, to a fully remote team of more than thirty
  talented people working across the globe. We've partnered
  with companies including AWS, ThoughtSpot, Progressive,
  Descartes, ShipBob, Quillbot, Teachable, Crisp, CloudZero,
  Kinetik, and many more. 🏆 4.6 Glassdoor Rating - Join our
  team and discover why our people consistently rate us so
  highly.

  The Role

  We are seeking a Senior Frontend Developer to lead the
  frontend implementation of our B2C E-commerce Shop and B2B
  Vendor Portal. You won't just be building landing pages; you
  will be architecting a high-conversion retail engine. This
  includes complex inventory dashboards, predictive reordering
  interfaces, and supplier management tools. You will work
  within a Multi-Repo architecture, consuming and contributing
  to an internal shared components library.

  What You'll Do

  - Component Architecture: Actively contribute to the shared
    internal Next.js components library based on shadcn/ui and
    TailwindCSS. You will build reusable components (Product
    Cards, Multi-select Filters, Inventory Grid, DataTables)
    used by all portals.
  - Complex State Management: Manage server state using TanStack
    Query (caching, optimistic updates) and client state using
    Zustand.
  - Design-to-Code: A keen eye for detail. You can take Figma
    designs and translate them into pixel-perfect, responsive
    layouts.
  - High-Performance Data Grids: implementation of TanStack
    Table (Headless UI) to render, filter, sort, and paginate
    a large amount of records without performance lag.
  - Form Engineering: Build forms using React Hook Form and Zod.
    You will implement strict client-side validation logic
    that mirrors backend constraints.
  - Security & Auth: Handle authentication flows, ensuring
    strict RBAC (Role-Based Access Control) visibility for UI
    elements.
  - Performance Optimization: Ensure "Cold Starts" under 3s and
    lightning-fast transitions. You understand how to optimize
    Next.js Server Components (RSC) and implement effective
    code-splitting.
  - Quality Assurance: Write tests for critical user flows to
    ensure zero regressions in production.

  What We're Looking For

  - 5+ years of professional experience building React/Next.js
    applications.
  - TypeScript: You don't just use any. You use Generics,
    Utility Types, and Zod inference to ensure type safety
    from the API response to the UI component.
  - Modern CSS: Mastery of TailwindCSS. You understand the
    utility-first philosophy and how to configure a design
    token system.
  - Library Experience: Hands-on experience with TanStack Query
    (React Query), TanStack Table, and React Hook Form.
  - Design System Mindset: Experience working with component
    libraries (Radix UI, Headless UI, or building your own) is
    crucial.
  - Performance Tuning: You know how to debug re-renders, use
    useMemo/useCallback correctly, and code-split heavy
    bundles.
  - API First: Work closely with Backend Engineers to consume
    OpenAPI/Swagger generated types, ensuring the frontend
    remains in sync with our Java Spring Boot microservices.
  - Domain Knowledge: Experience in E-commerce, Fintech, or
    Retail (Marketplaces, Warehouse, and Inventory Management
    systems) is a massive plus.
  - Language: Fluent English is mandatory. Spanish is a plus for
    understanding the context of the systems you are building
    and communicating with the client.

  What To Expect

  - Flexibility - We have standard 40-hour work weeks. While our
    agency working hours are from 9 am to 7 pm CET, you’ll
    have the freedom to work flexible hours and maintain a
    healthy work-life balance. Just make sure the majority of
    your working hours fall within that time frame.
  - Remote work & Tooling - We operate as a fully remote team.
    We utilize HubStaff for time tracking and work
    transparency. We value trust and output, and these tools
    help us streamline administrative overhead.
  - Culture - We value collaboration, openness, a willingness to
    learn, lead, and a curious nature. Our approach encourages
    mistakes as long as we are willing to learn from them,
    fostering a culture where growth comes from understanding
    and overcoming challenges.
  - Autonomy and responsibility – You’ll be trusted to get
    things done efficiently and effectively.

  Hiring Process

  - Application review - We’ll review your experience,
    background, and overall fit for the role.
  - Video Call with HR - Initial conversation about fit,
    availability, and expectations
  - Second interview with Leadership - If there is a strong
    match after the first conversation, we’ll invite you to a
    second interview with the Leadership team. This discussion
    will focus primarily on cultural fit, ownership,
    communication, and the way you approach collaboration and
    problem-solving. We may also revisit a few technical
    topics if anything needs additional clarification.
  - Welcome to Afternow!

  Timeline: We're moving quickly. If you're the right fit and
  can start immediately, we can move through this process
  within 1-2 weeks. Apply Now

  If you have strong React/Next.js experience, and enjoy
  building scalable, high-performance frontend applications,
  we’d love to hear from you.

  Show us your work that demonstrates:

  - React, Next.js, TypeScript, and modern frontend tooling
  - Complex B2B/B2C products, dashboards, or marketplaces
  - Design systems and reusable component architecture
  - Performance optimization and responsive UI development
  - Fast-paced environments and practical problem-solving

  Your future starts today. Let’s talk.

  Afternow is an equal opportunity employer. We believe
  diverse teams build better products and create better
  experiences. We encourage applications from people of all
  backgrounds, experiences, and perspectives.
