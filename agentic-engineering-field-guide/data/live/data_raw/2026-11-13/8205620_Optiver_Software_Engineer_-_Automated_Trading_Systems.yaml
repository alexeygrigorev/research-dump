title: Software Engineer - Automated Trading Systems
company: Optiver
location: Amsterdam, NLD
work_type: FULL_TIME
company_size: 1,600 Employees
description: |
  Optiver leverages technology to solve a variety of complex
  problems: optimising for scarce bandwidth, responding to
  market events with nanosecond speed, automatically pricing
  complex sets of financial instruments with extremely low
  error tolerance, and analysing huge volumes of data. Our
  systems are built to add to the stability of the market, not
  detract from it; therefore they must operate at peak
  efficiency in the most extreme market conditions. To achieve
  this, our user interfaces must present coherent, responsive,
  real-time visualisations of market activity and system
  performance while providing intuitive control of a highly
  complex system.

  Our Core Software Engineers focus on the infrastructural and
  strategic components of our software landscape, ensuring the
  core elements provide a stable, performant, and trusted
  foundation upon which our systems are built.

  WHAT YOU'LL DO:

  Our systems play an essential role in everything we do in
  the trading domain. That is why our Technology and Trading
  Teams collaborate closely to jointly explore ideas and
  establish the new directions. Together, they build and
  maintain an outstanding suite of reliable, high-performing
  systems and applications.

  As a member of the Core Software Team:

  - You will provide the rock-solid software backbone on which
    the business relies every single day, and will define the
    technical arena in which the trading-focused development
    teams continue to innovate.
  - You will not only be challenged on your technical knowledge
    and skills, but also on your capacity for producing simple
    and elegant solutions in face of an incredibly fast-paced
    and ever changing business environment.

  WHAT YOU'LL GET::

  You’ll join a culture of collaboration and excellence, where
  you’ll be surrounded by curious thinkers and creative
  problem solvers. Motivated by a passion for continuous
  improvement, you’ll thrive in a supportive, high-performing
  environment alongside talented colleagues, working
  collectively to tackle the toughest problems in the
  financial markets.

  In addition, you’ll receive:

  - A performance-based bonus structure unmatched anywhere in
    the industry. We combine our profits across desks, teams
    and offices into a global profit pool.
  - The opportunity to work alongside best-in-class
    professionals from over 40 different countries.
  - 25 paid vacation days and fully paid first-class commuting
    expenses.
  - Training opportunities and discounts on health insurance.
  - Extensive office perks, including breakfast and lunch,
    world-class barista coffee, sports and leisure activities,
    Friday afternoon drinks, and weekly in-house chair
    massages.
  - Competitive relocation packages and visa sponsorship where
    necessary for expats.

  WHO YOU ARE:

  - A Software Engineer with a genuine and deep desire to write
    clean and correct code, combined with a strong interest in
    delivering architectural and strategic solutions, topped
    off with a considerable dose of realistic and sustainable
    pragmatism allowing you to simply get things done
  - 4+ Years of experience (doesn't require experience in
    Finance)
  - A solid grasp of computer science, knowing your algorithms,
    memory and concurrency models, CPU-architecture, operating
    systems and relational databases etc
  - As our main body of software is written in C++ and runs on
    Linux, you will either need to have extensive experience
    in this language and platform or be more than willing to
    learn on the job. Next to C++, we also extensively use
    Python, C# and other languages in Optiver, and you are
    therefore expected to be willing and able to learn new
    languages quickly
  - We are looking for both senior and junior brilliant minds.
    If you feel comfortable with the characteristics outlined
    above, we strongly encourage you to apply!

  WHO WE ARE:

  At Optiver, our mission is to constantly improve the market
  by injecting liquidity, providing accurate pricing,
  increasing transparency and acting as a stabilizing force no
  matter the market conditions. With a focus on continuous
  improvement, we participate in the safeguarding of healthy
  and efficient markets for everyone who participates. As one
  of the largest market making institutions, we are a trusted
  partner of 70+ exchanges across the globe.

  HOW TO APPLY:

  Are you interested in furthering your career on one of the
  most dynamic and exciting trading floors in Europe?

  Apply directly via the form below for the position of Core
  Software Engineer. If you are selected from your application
  to proceed to the next round for the position of Core
  Software Engineer, you will be required to take an online
  assessment. If you have any questions feel free to contact
  our Recruitment team via our recruitment inquiry form.

  Please note:

  - We cannot accept applications via email for data protection
    reasons.
  - We do not require any assistance from third-parties
    including agencies in the recruitment of this role.

  DIVERSITY STATEMENT:

  Optiver is committed to diversity and inclusion.
