description: |
  Job Description:

  In order to support the Test Means Component GR Team, Airbus
  is looking for a

  Software Developer for Lab Test Means (d/f/m)

  Within the Test Means & Digital platform domain, the 'Test
  Means Components' sub-department verifies and supports all
  instrumentation and test environments for laboratory,
  respectively ground test installations across all aircraft
  programs.

  You will integrate into the new and motivated Test Means
  Components team (across the Hamburg and Bremen sites) and
  serve as the Software Developer for Lab Test Means (d/f/m),
  taking full responsibility for ground test means components.
  In this role, you will be in charge of ensuring operational
  availability, driving new developments, and executing
  lifecycle governance of test means components while strictly
  complying with relevant quality standards and development
  processes. The main focus will be on Software Development
  according to German needs, e.g. test bricks for Ground Test
  Automation (GTA), Test Management System (TMS) and the Data
  Access Management System (DAMS):

  GTA: This software enables automated and remote testing. As
  Software Developer (d/f/m), you are responsible for
  developing and adapting local GTA bridges according to
  different test requirements based on the core GTA brick.

  TMS: The software drives the instrumentation, distributes
  parameters around between all necessary computers, executes
  simulation models, transmitting information between each.

  DAMS: This software tool records all test data from a test
  bench and uploads it to an archive.

  You will work closely with your transnational peers to
  foster best practices and lessons learned for a harmonized
  global approach. With a focus on software, you will take
  over responsibility for existing applications, including
  their registration and maintenance in ATOM (database).

  If you have strong experience in test instrumentation and
  software development, a passion for product ownership, and
  the motivation to manage end-to-end testing solutions in an
  operational aerospace environment, this job is for you!

  Your location

  You will be working across the Hamburg and Bremen sites.

  You will be working at the largest production site for civil
  aircraft situated in Hamburg. Its location on the southern
  banks of the river Elbe includes the option to commute by
  ferry. Experience the special flair of Hamburg in your spare
  time where vibrant cosmopolitan culture meets nautic legacy.

  Bremen is a charming city full of history in the northwest
  of Germany. In addition to being one of the country’s
  greenest cities, it offers wonderful sights, a rich culture,
  urban flair and culinary delights. It’s also a great place
  for seaside lovers, being located just an hour’s drive from
  the North Sea coast.

  Our Benefits for You

  - Fair Compensation & Extras: Attractive remuneration and
    individual additional benefits, such as company pension
    schemes, mobility offers (e.g., bike leasing), or
    corporate discounts with partner companies in accordance
    with our current guidelines.
  - Time for You (and Your Loved Ones): 30 days of annual leave
    based on our collective agreement (35-hour week); work-
    life balance through flexible working hours (flextime),
    mobile working, part-time options, job sharing, and
    sabbatical opportunities.
  - Growth Made Easy: Excellent professional development
    opportunities and international, group-wide career
    perspectives.
  - Feel Good at Work: On-site company doctor; comprehensive
    health programs (sports courses, preventive care, etc.),
    canteen and cafeteria, and local childcare facilities at
    selected locations.
  - Diversity Connects: Work in a diverse environment with more
    than 140 nationalities, where exchange, mutual support,
    and inclusion are part of our DNA.

  Your tasks and responsibilities

  - Product Ownership & Strategy: Act as the Product Responsible
    and End-to-End (E2E) referent for catalogue solutions,
    managing technical relationships and performance with
    internal and external suppliers.
  - Test Means Components Development: Propose and/or develop
    innovative test means components tailored to the specific
    requirements of Architects and Specialists, serving as the
    core Product Technical Referent for the architecture team.
  - Software Development: Based on GTA, develop and adapt
    software bricks according to specific needs. Functional
    testing and cybersecurity compliance are mandatory.
  - Operational Accountability: Ensure maximum availability and
    optimal utilization of all test means components. This
    includes executing hardware (H/W) and software (S/W)
    qualification tests, creating and updating Technical
    Sheets, and overseeing infrastructure reporting and
    documentation. The objective is to provide a fully
    validated solution for test benches.
  - Lifecycle & Maintenance: Lead H/W maintenance of test means,
    manage S/W maintenance & evolutions, and proactively
    perform obsolescence monitoring and mitigation.
  - Verification & Support: Responsible for the validation and
    verification of performance tests. Provide comprehensive
    technical support for all core and add-on functions,
    including hands-on integration support.
  - Supply Chain & Logistics: Manage the specific supply of
    critical components not covered under standard logistic
    mini-stocks (e.g., specialized test units).
  - Process Compliance: Ensure all new component developments
    fully comply with relevant processes and quality metrics
    defined for test means.

  Desired skills and qualifications

  - Bachelor degree in informatics or an equivalent degree
    programme
  - Strong background in the test instrumentation domain,
    avionics knowledge, ground test environments, or physical
    measurements.
  - Proven experience in Product Ownership, Software
    Development, project management, or supplier management
    within an engineering context.
  - Solid knowledge of hardware and software integration,
    maintenance lifecycles, and qualification testing.
  - Aeronautical system knowledge and familiarity with test
    architecture.
  - Advanced level of English (working language).
  - Excellent communication and interpersonal skills to manage
    interfaces between architects, specialists, and suppliers.
  - Agility to multitask in a highly operational and fast-paced
    environment.
  - Problem-solving mindset and a proactive approach to
    obsolescence and technical challenges.
  - Ability and interest in teamwork across transnational sites
    (Hamburg, Bremen, Toulouse, and UK).
  - Autonomy and adaptability to integrate innovative and
    emerging technologies in a ground test context.
  - Open-mindedness, curiosity, and a positive attitude.
  - Occasional travel is part of the mission.

  Not a 100% match? No worries! Airbus supports your personal
  growth with customized development solutions.

  This job requires an awareness of any potential compliance
  risks and a commitment to act with integrity, as the
  foundation for the Company’s success, reputation and
  sustainable growth.

