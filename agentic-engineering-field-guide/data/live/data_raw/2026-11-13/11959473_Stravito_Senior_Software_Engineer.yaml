description: |
  Large organisations consistently make important decisions
  without the intelligence they already own — because they
  can't find what they have, can't see what they're missing,
  and can't act on it fast enough to matter.

  We are Stravito and this is the problem we solve.

  Stravito transforms how Consumer Insights professionals and
  Brand Managers work by building AI that automates their core
  workflows. We help world-leading organizations accelerate
  strategic decision-making by turning millions of market
  research documents into intelligent systems that generate
  reports, discover insights proactively and synthesize
  knowledge across vast content libraries.

  We really mean it when we say we're a diverse and
  international team as our team of 100 has more than 30
  different nationalities! We are guided by our operating
  principles: simplicity first, an “own it, do it” mentality,
  embracing different perspectives, and enjoying the journey
  together.

  We're now looking for a Senior Software Engineer to join our
  Continuity team.

  The mission

  Make the seam invisible. Stravito has two sides: the
  evidence base that insights teams build and govern, and the
  decision tools that commercial teams use to act on it.
  Continuity is the team in between. We own everything both
  sides meet.

  As a Senior Software Engineer in Continuity, you'll own the
  services behind those surfaces and build the frontend on top
  of them. You'll keep today's product stable and fast while
  new spaces go up alongside it, and make sure a user moving
  between them never notices where one team's work ends and
  another's begins.

  What makes this role unique

  - The whole product is your canvas. Continuity touches nearly
    every screen a user sees, so your work shapes the
    experience of every Stravito customer, not one feature.
  - Full ownership, end to end. You'll take a capability from
    data model to API to UI, without handing it over a wall.
  - Platform thinking with a product lens. Several of our areas
    are shared pieces other teams build on. You'll design them
    so other teams can plug in cleanly.

  What you'll do

  - Own the library backend: evolve the services and data models
    behind the features owned by the team, and keep them
    reliable as usage grows.
  - Shape the search and viewing experience: build the APIs and
    UI for search, working with the Evidence Platform team,
    which owns retrieval and ranking.
  - Ship the frontend too: build the screens behind navigation,
    onboarding, settings and admin, and contribute to the
    shared component library and design system, working
    closely with our designers.
  - Design clean extension points: work with the other teams on
    how they embed their features into the shared area of
    Stravito.
  - Raise the bar: help decide how Continuity builds new
    capabilities, keeping the architecture as simple as the
    problem allows. Improve code quality, performance,
    accessibility and test coverage across a large,
    established product, and mentor other engineers.

  What we need

  - Senior backend experience: a track record of building and
    running production services, with strong fundamentals in
    API design, data modelling and distributed systems. You
    have worked in Kotlin or Java, or in another typed backend
    language. You are comfortable running services on AWS or
    similar, with containers, infrastructure as code and
    modern CI/CD.
  - Real frontend skills: you've shipped production features and
    are comfortable owning a UI, not just reading one.
  - Product sense and collaboration: you care about the user
    problem, communicate clearly and work well across teams,
    with product and design.

  How we work

  Fast, from wherever you work best. Teams own their area end
  to end and ship to production continuously. We build with
  agents every day, and we hold what they produce to the same
  bar as code written by hand. You choose where you work: from
  home, from the office in Stockholm or Amsterdam, or a mix.
  We meet in person at least four times a year.

  What’s in it for you?

  Join a remote-first, globally distributed team of 100+
  people from 30+ nationalities, united by our core values:
  simplicity first, an "own it, do it" mentality, embracing
  different perspectives and enjoying the journey together. We
  bring everyone together for company events throughout the
  year.

  You'll grow alongside seasoned people with deep expertise in
  AI, market research and enterprise systems. We offer strong
  career development in a fast-moving market, competitive
  compensation and a culture where people actively support
  each other's success.

  Most of all, you'll shape the experience of every person who
  uses Stravito, from their first login to the decision they
  make with it.

  This role is fully remote, but you will need to be a current
  resident for tax purposes in one of the chosen locations.

  The salary range for this role depends on location and will
  proactively be shared with you before the first interview.
