description: |
  Circle (NYSE: CRCL) is one of the world's leading internet
  financial platform companies, building the foundation of a
  more open, global economy through digital assets, payment
  applications, and programmable blockchain infrastructure.
  Circle's platform includes the world's largest regulated
  stablecoin network anchored by USDC, Circle Payments Network
  for global money movement, and Arc, an enterprise-grade
  blockchain designed to become the Economic OS for the
  internet. Enterprises, financial institutions, and
  developers use Circle to power trusted, internet-scale
  financial innovation. Learn more at circle.com . What you'll
  be part of: Circle is committed to visibility and stability
  in everything we do. As we grow as an organization, we're
  expanding into some of the world's strongest jurisdictions.
  Speed and efficiency are motivators for our success and our
  employees live by our company values : High Integrity,
  Future Forward, Multistakeholder, Mindful, and Driven by
  Excellence. We have built a flexible work environment where
  new ideas are encouraged and everyone is a stakeholder. What
  you'll be responsible for You will build world-class Web3
  consumer applications, web SDKs, and developer tools that
  make it easier for developers to integrate with Circle's
  existing and future product offerings. You will also create
  internal tools that enable our Customer Success teams to
  deliver exceptional support. As a member of a dedicated
  engineering team, you will contribute to Circle's broader
  frontend ecosystem by participating in code reviews,
  promoting consistent engineering practices, and maintaining
  a high standard for quality. You will collaborate closely
  with Product, Design, and Engineering partners to translate
  requirements into intuitive, reliable, and scalable
  experiences for developers and end users. What you'll work
  on

  - Build and maintain responsive Web3 applications using modern
    frontend technologies.
  - Develop web SDKs and tools that simplify integration with
    Circle products and services.
  - Design reusable, accessible, and scalable frontend
    components for shared use across products.
  - Partner with Product and Design to translate user needs into
    intuitive, high-quality features.
  - Build internal tools that help Customer Success teams
    resolve customer needs efficiently.
  - Participate in code and design reviews to improve quality,
    consistency, and maintainability.
  - Use automated testing, continuous delivery practices, and
    AI-assisted development tools to improve engineering
    velocity.

  What you'll bring to Circle Core requirements

  - 4+ years of experience building user interfaces for complex
    web applications.
  - Strong proficiency in HTML, CSS, TypeScript, and JavaScript.
  - Experience building responsive, component-based applications
    with React.
  - Experience using AI-assisted development tools such as
    Claude, Codex, Cursor, or similar platforms.
  - Experience writing well-tested, maintainable code and
    contributing to strong coding standards.
  - Strong product judgment and the ability to identify
    opportunities to improve usability and quality.
  - Experience collaborating with product managers, designers,
    and distributed engineering teams.
  - Excellent written and verbal communication skills, with the
    ability to clearly present technical concepts.

  Preferred requirements

  - Experience with Node.js, developer platforms, SDKs, Web3
    products, or blockchain technologies.

  Circle is on a mission to create an inclusive financial
  future, with transparency at our core. We consider a wide
  variety of elements when crafting our compensation ranges
  and total compensation packages.  Starting pay is determined
  by various factors, including but not limited to: relevant
  experience, skill set, qualifications, and other business
  and organizational needs. Please note that compensation
  ranges may differ for candidates in other locations. Base
  Pay Range: $152,500 - $205,000 We are an equal opportunity
  employer. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status, or any other protected status required by
  the laws in the locations where we hire. Additionally,
  Circle participates in the E-Verify Program in certain
  locations, as required by law. Should you require
  accommodations or assistance in our interview process
  because of a disability, please reach out to
  accommodations@circle.com for support. We respect your
  privacy and will connect with you separately from our
  interview process to accommodate your needs. #LI-Remote
