description: |
  Staff Software Engineer (EMEA)

  Zenrows is the web data infrastructure for AI. Founded in
  2021, we give developers, AI agents and businesses one
  reliable way to access, extract and structure data from any
  website, at any scale, however hard the site tries to block
  them.

  Whether it’s an agent that needs fresh web context mid-task,
  an LLM application grounded in live data, or an enterprise
  pipeline pulling millions of pages a day, Zenrows handles
  the rendering, the anti-bot defences and the parsing behind
  a single API, 10B+ requests a month. Teams at more than
  10,000 companies, including Microsoft, Amazon, Dell, IBM,
  Slack, eBay, EY, Nokia and Clay, rely on Zenrows to turn the
  web into a reliable source of data for their products,
  workflows and AI-driven applications, across e-commerce,
  finance, real estate and AI.

  As we continue our expansion, we are now looking for a Staff
  Software Engineer to join us on a permanent basis and make
  an instant impact, working directly with the CEO and CTO.

  The Role

  AI runs on web data, and more and more of the work that
  needs it is done by AI agents. Zenrows is how they get it.
  Fetch gets any page past the toughest anti-bot systems.
  Extract turns it into clean, structured data. Batch and
  Crawl do it across whole websites.

  We’re also changing how software gets built. Our engineers
  already write 100% of their code with agents. We are moving
  more and more operational workflows from manual, to
  automated, to autonomous, trusting agents with real work in
  production. Very few teams are doing this for real. We are,
  and we want you to help lead it.

  What You’ll Do

  - You’ll own a customer-facing product end to end: what it
    does, how it runs, and the business number it moves. There
    are no product managers here. You talk to customers,
    decide what to build, build it with your agents, ship it,
    and own it.
  - The problems are real. Our systems run on thousands of CPU
    cores, handle millions of requests a day, and stay ahead
    of anti-bot systems built by companies many times our
    size. You’ll design systems that hold up under that load.
    You’ll also build the tests, evals and guardrails that
    tell us when an agent’s work can be trusted.
  - As a Staff Engineer, you’ll shape how the whole company
    works with agents. When one team finds a better way of
    working, you’ll help turn it into the standard for
    everyone.
  - Your days aren’t prescribed. You’ll look across the company,
    find where you can add the most value and go after it.

  What We're Looking For

  - You’ve built high-load, complex production systems and
    you’ve set the technical direction that other engineers
    followed.
  - You put product first. You talk about customers and business
    impact before code, and you can say clearly what your work
    changed for the business.
  - You’re all in on AI-native engineering. You build with
    agents every day, and you know how to verify, test and
    take ownership of what they produce. Bonus points if
    you’ve built and shipped products that use LLMs or agents
    in production.
  - You write clearly. We’re remote and our agents work from
    written context, so a good spec or decision record is
    worth as much as good code.
  - You’re comfortable working with non-technical people. You
    can sit down with sales, GTM or operations colleagues,
    understand their problems and turn them into something
    that ships, no translator needed.
  - You take ownership without being asked. You’re comfortable
    with ambiguity, happy to experiment, fail and argue for
    ideas, and you think like a co-founder.
  - You pick the tool that serves the customer. Today that’s
    mostly Go, AWS, and Terraform, and you are open to learn
    new languages and tools quickly.
  - A love of hands-on work. You’ll still champion collaboration
    via knowledge-sharing sessions, kickoffs, and cross-team
    reviews, but this is an IC role at its heart, focused on
    building and influence.
  - Availability to work EMEA hours, as our team collaborates
    across European time zones.

  Why You’ll Love Working Here

  - Our people crave ownership and opportunity over everything
    else. We offer responsibility and scope to do things in
    your role that you can only dream of in similar roles in
    larger companies.
  - We have a CEO who values world class talent over everything
    else. Trust and respect is earned and with it comes reward
    and recognition like nowhere else.
  - In a world where it feels like everyone is being called back
    being in an office, we operate a truly 100% remote
    approach that allows you to work from anywhere you choose.
  - Forget Agile, Scrum, Lean... or whatever development
    methodology is trendy this week. We give you a horizontal
    view that enables you to identify where you think you can
    contribute the most.
  - We have fun! The above may sound like we are all about work
    but we put a lot of focus on ensuring our culture is one
    that our people enjoy, lets you build lasting friendships
    and grow both personally and professionally.

  Why You Might Not Fit

  - We are a small yet efficient team of 20, and our competitors
    are 10x our size. We manage to outperform them because
    everyone takes ownership of their work, holds themselves
    accountable and focuses on delivering meaningful outcomes.
    If you’re just looking for a job rather than a mission
    then you probably shouldn’t apply.
  - We are an agentic company, and agents are an essential part
    of how every team works. If you aren’t excited to build,
    delegate to and take ownership of AI agents in your day to
    day, then you probably shouldn’t apply.
  - We work 100% remotely and give our people the freedom to
    work wherever they choose. To offset this there is
    naturally more need to document and update workflows than
    in other companies. If you hate documenting then you
    probably shouldn’t apply.
  - Feedback is how we better ourselves every day and we foster
    a culture that encourages everyone to have a voice. If you
    don’t like being surrounded by world class talent that
    will always express strong opinions then you probably
    shouldn’t apply
  - We are a start-up and know the growth journey holds plenty
    of lessons to learn. If you are looking for the perfect
    organization, flawless processes and predictability in
    your day to day then you probably shouldn’t apply.

  Our Rewards And Benefits

  - 100% remote work: We are a company that offers true freedom.
    Work wherever life takes you.
  - The salary you are worth: We never ask people what they are
    earning but instead what you are looking for. If your
    ability and experience justifies it and we think you are
    going to help us succeed then we will match your
    expectations.
  - The equipment you want: We believe in giving our people the
    tools they need to succeed and don’t have a default
    machine to give you.
  - Generous Learning & Development budget: We believe in always
    adding value to our top performers and helping them grow
    their skills in a direction that is beneficial both to
    them and the business
  - All Star Awards: We recognize achievements in many ways
    within the business but the bi-annual All star rewards
    allows the CEO to tailor reward packages to the person.
    Whether this is a holiday destination of choice, a
    learning course that adds value or something else.. We
    believe in getting to know every employee personally.
  - Charity Initiatives: We are a business that believes in
    giving back to the community and every year allows our
    employees the opportunity to give back.
  - Annual Kick-Off: We want our employees to see where Zenrows
    was born and enjoy all the Pinxos they can handle.
  - Share in Our Success: We want our top performers to be part
    of the company's success and offer opportunities for stock
    option allocation when people show their value.
  - Deel Benefits: As a fully remote organization we employ our
    people via Deel. This not only brings freedom of location
    but also a host of other benefits including discounts on
    VPNs, memberships and services.

  Values

  We are proud of our uniquely agile, fast paced, and
  autonomous environment. Our core values of Ownership,
  Dedication, Impact, Transparency and Agility run through
  everyone who works for us, and everything we do.

  We are a sociable company and don’t let a fully remote model
  stop us from feeling connected to the place we work and the
  people that we work with. The atmosphere across the business
  is friendly and supportive, with a constant desire to
  improve in everything we do!

  Diversity, Equity and Inclusion

  Here at Zenrows we are committed to diversity, equity and
  inclusion but recognise that we can always do more. Every
  job description is subject to scrutiny through a gender bias
  decoder ensuring our roles are as inclusive and attractive
  as possible. Our culture is one that aims to nurture a
  welcoming and safe working environment for everyone with
  initiatives that embrace our globally diverse family. We are
  committed to protecting the mental health of our employees
  and aim to create a great place to work, whoever you are and
  wherever in the world you work from.

  https://www.zenrows.com/careers

  Privacy and Your Data

  At Zenrows, we prioritize the privacy and security of data
  entrusted to us. We are committed to complying with all
  applicable data protection regulations and industry best
  practices. As part of our team, you will contribute to
  creating and maintaining systems that uphold the highest
  standards of data integrity, confidentiality, and
  transparency. Your role will help ensure that we continue to
  protect sensitive information, foster trust with our
  customers, and support a privacy-first culture across our
  organization.

  Any job offer that we may make to you will be subject to you
  successfully passing background checks.
