description: |
  Founded in 2016 and headquartered in Munich, enmacc is a
  high growth scale-up with a diverse team of over 100
  professionals. We’re passionate about energy, technology,
  and building something that makes a real impact. If you are
  looking for an entrepreneurial environment where your work
  directly contributes to a more sustainable and digital
  energy future,  we invite you to submit your application
  below.

  Your Mission:

  Join us disrupting the international energy trading market
  and leave your mark in re-defining how energy traders work!

  The Engineering Manager's main objectives are team
  empowerment and overseeing the successful delivery and
  performance of their team. This role acts as the interface
  between business, strategy, product and engineering teams.
  As a strong force multiplier, the engineering manager
  ensures that the team delivers and is responsible for the
  work activities through coordination and prioritization.

  Your Responsibilities:

  - Leadership and  Technical Guidance: Lead a team in an agile
    environment. Display strong decision making skills and
    offer expert advice to support the team. Solve complex
    technical problems and ensure adherence to technical
    standards and requirements.
  - Maintain and Update Technical Expertise: Stay current with
    the latest technological advancements and industry best
    practices. This involves continuously updating one's own
    technical knowledge and skills to provide effective
    guidance, make informed decisions, and lead the team in
    implementing cutting-edge solutions and technologies.
  - Build and Maintain Team Culture: Align the engineering team
    with the company's goals and strategy, foster a positive
    and collaborative culture, and empower the team by
    building emotional/psychological safety
  - Mentorship and Career Development: Actively mentor team
    members, providing guidance for their career growth and
    skill development. This includes setting clear performance
    expectations, offering regular feedback, and identifying
    opportunities for professional advancement within the
    team.
  - Plan and Oversee Projects: Coordinate and supervise project
    execution, ensuring timely and efficient completion. This
    includes prioritising tasks, allocating resources, and
    collaborating with various departments.
  - Manage Stakeholder Relations: Communicate effectively with
    stakeholders like the design or product team, manage their
    expectations, represent the team's interests, and shield
    the team from external distractions.
  - Ensure Quality and Improve Processes: Guarantee the quality
    of engineering outputs through methods like code reviews,
    and continually seek opportunities to enhance efficiency
    and productivity within the team.

   Your profile:

  - Experience managing and developing engineering teams,
    including meaningful hands-on people management in a co-
    located or hybrid environment.
  - Strong experience working directly with engineers in person
    — including 1:1s, coaching, feedback, team development and
    day-to-day collaboration.
  - Experience managing fully distributed teams can be an
    additional plus, but fully remote-only management
    experience is not sufficient.
  - University studies in Computer Science or similar experience
    as an IT specialist
  - Several years of experience in software engineering combined
    with proven leadership responsibility (e.g., as
    Engineering Manager, Tech Lead, or Team Lead).
  - Ideally experience implementing scrum methodology
  - Be up-to-date and passionate about new technologies
  - Experience with the following technologies: Angular, Spring
    Boot, Amazon Web Services
  - Great communication skills
  - ability to work autonomously and in a result-oriented way
  - Strong written and spoken English skills

  Don't match every single requirement? We still want to hear
  from you!

  Our offer

  - Competitive compensation package, including 28 days of
    annual leave.
  - Entrepreneurial, impact-driven culture with flat hierarchies
    and high autonomy.
  - Hybrid & Workation flexibility that balances office
    connection with the freedom to work from home or abroad.
  - €2,000 annual L&D budget plus 5 dedicated "Level Up" days to
    fuel your growth (for all full-time employees).
  - Commute & Wellness support, including fully covered gym
    memberships and paid transportation for office days.
  - Inclusive, international team that celebrates diversity and
    offers language classes to help you settle in.
  - AI-first environment where you’ll collaborate with a
    dedicated AI Philosophy and cross-functional expert
    groups.
  - Premium tech & workspaces, featuring top-tier Apple/Bose
    hardware in modern, dog-friendly offices.

  About enmacc

  enmacc is Europe’s largest over-the-counter trading platform
  for energy and environmental commodities. We are digitizing
  the world’s energy markets by replacing manual, outdated
  processes with speed, transparency, and liquidity.

  Our platform empowers a massive network of over 2,400 active
  traders to manage risk and accelerate the global energy
  transition. By providing a secure and efficient trading
  environment for 650+ companies, we facilitate more than
  14,000 monthly requests for quotes and 8,000 monthly trades.
  With a traded volume exceeding 60 TWh per month, enmacc
  enables energy suppliers, industrial companies, and trading
  houses to access the liquidity they need to thrive in a
  shifting market.

  As an Equal Opportunity Employer, enmacc is a diverse
  environment where all backgrounds, identities, and cultures
  are welcomed and celebrated. If you're excited about this
  role, apply and help us shape the future of energy trading!
