description: |
  The Opportunity

  We are looking for an experienced Senior Full Stack
  Developer who thrives on solving complex software challenges
  and enjoys deep team collaboration. If you want ownership, a
  mission-driven environment, and the runway to experiment
  with emerging tech, you’ll find it here.

  Required Skills and Experience

  - Experienced full stack application developer with a passion
    for building digital experiences that matter.
  - Minimum of 6 years of professional experience in a
    development environment.
  - Expertise in React UI or related UI frameworks (such as
    Angular).
  - Proficiency with Node.js for scalable backend services.
  - Experience with AWS Cloud Tools to support cloud-native
    applications.
  - Strong grasp of SQL and Data Analytics to drive informed
    technical decisions.
  - Complex Problem Solver: Ability to understand intricate
    business processes and how they relate to the systems
    supporting them.
  - Root Cause Analysis: Ability to research problems, identify
    a root cause, and recommend/implement efficient solutions.
  - Continuous Learner: Aptitude for picking up technology
    quickly along with a desire to learn and progress.
  - Strong Communicator: Excellent written and verbal
    communication skills.
  - Collaborative Spirit: Ability to partner with team members
    to ensure client needs are exceeded.
  - Educational Background: Bachelor’s degree required.

  Preferred Skills

  - Experience with AWS Lambda and serverless patterns.
  - Knowledge of the SPA concept and associated libraries.
  - Familiarity with Agile and DevOps tools (Git, Jenkins,
    Cloudbees, React Testing Library, Jest).
  - Experience with relational database structures and DynamoDB.

  Clearance & Eligibility

  - Must be a US Citizen.
  - Must have the ability to obtain a US Government Public Trust
    clearance. (Preference given to candidates with active or
    recent ICE or CBP clearance).
