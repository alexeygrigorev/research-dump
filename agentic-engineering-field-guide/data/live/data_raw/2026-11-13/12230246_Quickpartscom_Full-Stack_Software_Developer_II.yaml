description: |
  Full-Stack Software Developer II

  Remote (US/EU) with periodic onsite collaboration | Reports
  to Manager, Business Systems Architecture & Development |
  Technology / Enterprise Systems

  Build. Integrate. Automate.

  If you love owning the full stack — from the user interface
  to the Azure pipeline that ships it — this role is for you.

  Quickparts is hiring a Full-Stack Software Developer II to
  lead the design, development, and delivery of the enterprise
  applications and system integrations that run our business.
  This is a hands-on development role. You will build user-
  facing applications, develop APIs and backend services,
  manage data flows, and connect the core platforms behind our
  global manufacturing network — including ERP, CRM, CPQ, MES,
  and related operational systems.

  You will also lead CI/CD, test automation, and Azure
  services implementation, helping shape a modern, scalable
  development organization.

  Why This Role Matters

  Our enterprise systems are the backbone of how we quote,
  build, and deliver for customers. As a Full-Stack Software
  Developer II, you will:

  ✔ Lead enterprise systems architecture and implementation

  ✔ Own CI/CD, test automation, and Azure hosting

  ✔ Build integrations that drive automation and operational
  efficiency

  ✔ Reduce manual work across the business

  ✔ Deliver stable, scalable, and secure applications

  What You'll Do

  Front-End Development

  - Develop and maintain responsive web interfaces and internal
    tools
  - Build user-friendly dashboards and workflow interfaces
  - Implement UI/UX standards to improve system usability
  - Integrate front-end applications with backend APIs
  - Ensure cross-browser compatibility and performance
    optimization

  Back-End Development

  - Develop APIs, services, and middleware solutions
  - Build business logic supporting ERP, CRM, CPQ, and other
    enterprise platforms
  - Manage database design, queries, and optimization
  - Implement data validation and error-handling mechanisms
  - Support authentication, permissions, and access controls

  Systems Integration & Automation

  - Build and maintain integrations between enterprise systems
  - Develop automation processes to reduce manual intervention
  - Support data synchronization and transformation workflows
  - Troubleshoot integration issues and resolve root causes
  - Document integration architecture and dependencies

  CI/CD, Azure & Infrastructure

  - Lead CI/CD pipeline design and implementation in Azure
  - Lead Azure services implementation and application hosting
  - Drive test automation and deployment best practices
  - Lead system monitoring and reliability improvements

  Collaboration & Implementation

  - Partner with Business Systems Analysts to translate
    functional requirements into technical design
  - Lead architectural discussions and solution planning
  - Estimate development effort and timelines
  - Support QA during testing and validation phases
  - Participate in structured release cycles

  Quality, Security & Production Support

  - Write clean, maintainable, well-documented code
  - Participate in peer code reviews
  - Lead version control and deployment best practices
  - Ensure development aligns with internal security and
    documentation standards
  - Support audit and compliance requirements as needed
  - Troubleshoot and resolve application issues and perform root
    cause analysis

  What We're Looking For

  - 5+ years of full-stack development experience
  - Strong knowledge of Azure CI/CD pipelines and Azure hosting
  - Proficiency in front-end frameworks (e.g., React, Angular,
    Vue)
  - Proficiency in back-end development (e.g., C#,
    JavaScript/Node, Python)
  - Strong understanding of RESTful APIs
  - Experience working with relational databases (SQL)
  - Understanding of the software development lifecycle (SDLC)
  - Strong debugging and analytical skills
  - Understanding of enterprise security best practices
  - Willingness to work within our established technology stack
  - Clear communicator who works well with business-facing teams

  Preferred:

  - Experience applying AI tools or AI-enabled solutions
    alongside cloud infrastructure
  - Experience integrating ERP, CRM, CPQ, or manufacturing
    systems
  - Experience in ISO-controlled or regulated environments

  How We Measure Success

  - Stability and performance of applications
  - On-time delivery of enhancements
  - Reduction in manual processes
  - Low post-release defect rate
  - User satisfaction with front-end usability
  - Reliable and scalable integrations

  Why You'll Love It Here

  - Real ownership — your work shapes how the company operates
  - Clear career path to Senior Full-Stack Developer III and
    Engineering Manager
  - High-growth, global organization
  - Complex technical challenges across enterprise and
    manufacturing systems
  - Strong culture of accountability and collaboration
  - Flexible work environment
  - Competitive compensation
  - 401K Employer match
  - Excellent health and wellness benefits
  - Generous Paid Time Off - Recharge with ample PTO, including
    vacation days, sick leave, and holidays

  Celebrate Your Strengths!

  We believe that understanding your natural behavioral style
  helps ensure success for both you and Quickparts. As part of
  our application process, we invite you to complete a quick,
  six-minute Behavioral Assessment. This brief assessment
  highlights your unique strengths and how they align with our
  role requirements—providing valuable insights to spark great
  conversations about your fit, growth, and development here
  at Quickparts. Please click the link below to begin the
  assessment:

  Quickparts Assessment Link

  About Quickparts

  Quickparts is a global leader in on-demand manufacturing
  with over 25 years of experience. We deliver advanced
  manufacturing solutions including metal & plastic 3D
  printing, CNC machining, injection molding, and casting
  patterns.

  With facilities across the US and Europe and more than 4,000
  customers worldwide, we serve industries including
  aerospace, defense, automotive, medical, energy, and
  industrial equipment.

  Our team of application engineers and project managers
  average 10+ years of experience — ensuring customers receive
  expert guidance from prototype to production.

  Quickparts is ISO 9001 certified and ITAR registered, and we
  are continuously expanding our quality capabilities to
  support regulated industries.

