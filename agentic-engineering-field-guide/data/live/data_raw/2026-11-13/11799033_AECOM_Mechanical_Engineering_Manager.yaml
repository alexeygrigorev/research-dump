  Job Description

  AECOM is seeking a motivated, technically experienced team
  leader to serve as Mechanical Engineering Manager based in
  our Oakland or San Francisco, CA office. The ideal candidate
  will have a passion for leading technically proficient
  teams, designing custom solutions, mentoring mid-level and
  junior staff, managing the mechanical team workload and
  developing calculations, drawings, reports, and
  specifications for the mechanical design work on exciting
  and complex projects.

  The Mechanical Engineering Manager should be capable of
  leading and developing teams to complete building
  engineering projects. Excellent written and verbal
  communication skills with internal and external clients is
  required. You will be expected to:

  - Serve as a Discipline Lead for our Bay Area team and provide
    mentorship to an experienced group of engineers.
  - Be responsible for Mechanical systems design (EOR of
    contract documents).
  - Participate in developing project fee proposals that detail
    the scope, schedule and budget necessary to deliver the
    work.
  - Coordinate design and schedule with other disciplines such
    as architectural, structural, electrical, technology and
    equipment suppliers.
  - Maintain accurate project documentation and design data for
    permanent project files.
  - Evaluates project staffing requirements, analyzes problems,
    and writes reports.
  - Lead client meetings regarding engineering systems and
    maintaining good client relations.
  - Identify prospective clients, assist in marketing efforts to
    develop new clients, and develops future projects with
    existing clients.
  - Assure quality and completeness of the engineering design.

  Qualifications

  Minimum Requirements:

  - BA/BS in Mechanical Engineering, Architectural Engineering
    or similar field +8 years of related experience or
    demonstrated equivalency of experience and/or education.
  - Professional Engineer (PE) license in the State of
    California

  Preferred Qualifications:

  - 12+ years of related experience or demonstrated equivalency
    of experience and/or education.
  - 5+ years of experience as the primary engineering interface
    with multiple clients either as a project manager or as
    the engineering lead
  - Working knowledge of California Building Codes and relevant
    industry standards (ASHRAE, LEED, HCAI).
  - Excellent project planning, project management,
    organizational and time management skills.
  - Extensive understanding of  HVAC engineering fundamentals
    including load calculations, conceptual systems analysis
    through construction documentation design.
  - Documented experience with advanced HVAC systems design and
    technically challenging projects with fasted paced
    schedules.
  - Experience with Design-Build and other Alternate Delivery
    practices a plus
  - Plumbing and Fire Protection system design experience
  - Experience with sustainable design and certification or
    high-performance buildings
  - Excellent communication skills: articulate, assertive, and
    confident
  - Experience in the following markets: Healthcare, Federal
    Market Project Delivery, Advanced Manufacturing, Data
    Centers / Mission Critical, Corporate Commercial / Mixed
    Use

  Additional Information

  - Project-related travel may be required for this position.
  - Hybrid work environment – Fully remote position not
    available.
  - Sponsorship is not available for this opportunity.
  - Pursuant to the San Francisco Fair Chance Ordinance, we will
    consider for employment qualified applicants with arrest
    and conviction records.

  At AECOM, we are committed to maintaining a secure and
