description: |
  About Discern

  Discern is a modern registered agent and entity management
  solution provider. As a venture-backed company, we develop
  compliance technology that monitors entity status, standing,
  and filing requirements across all US jurisdictions.

  The Team You’ll Work With

  We are an engaged team with ambitious goals. In this role,
  you will report directly to the CTO and collaborate closely
  with the engineering leads, Head of Product, and Lead
  Product Designer. Our group is highly collaborative,
  bringing extensive experience from both corporate and tech
  startup environments. The engineering team is distributed
  across the US time zone.

  What We're Looking For

  At Discern, we leverage the latest technologies including
  React, Go, Temporal, sqlc, GKE and Kibu to tackle complex
  business challenges.



  We are looking for a passionate and experienced full stack
  engineer with a strong background in software design, front-
  end and back-end engineering, and relational database
  design.



  If you thrive on building high-quality, working software in
  a fast-paced environment using cutting-edge technologies, we
  would love to hear from you.



  We are specifically interested in engineers with a genuine
  passion for, and hands-on experience in, React, TypeScript,
  and Go.

  Your Impact at Discern

  - You will work on both our front-end and back-end platform
    technologies to deliver functional features for the
    Discern product.
  - You will collaborate closely with our Product Owners, Lead
    Product Designer, and other stakeholders to ensure the
    development of high-quality software.
  - You will contribute your insights into the technologies,
    patterns, and practices used in software development at
    Discern.
  - You will leverage your experience and creativity as our
    company and engineering team continue to grow.

  About You

  - You have over 5 years of professional software engineering
    experience.
  - You have over 3 years of professional experience building
    software with React and TypeScript.
  - You have over 3 years of professional experience programming
    in Go.
  - You possess extensive experience designing relational
    database structures and working with SQL.
  - You are passionate about solving business problems and have
    significant experience developing enterprise or SaaS
    business software.
  - You excel at debugging software defects and performing
    regression testing to prevent recurring issues.
  - You dislike repetitive work and prefer to develop tools and
    methodologies to automate tasks and help the team move
    faster.
  - You are an effective communicator with experience working as
    part of a distributed engineering team.
  - You are dedicated to code quality and reusable design, and
    you enjoy learning every day.

  Benefits

  - Competitive salary ranging from $150,000 to $200,000 per
    year
  - Startup equity
  - Health insurance with 100% of the premium covered
  - 20 days of PTO with roll-over, plus 13 federal holidays

