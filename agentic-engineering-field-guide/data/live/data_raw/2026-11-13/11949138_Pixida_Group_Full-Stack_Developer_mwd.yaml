description: |
  At Pixida, we’re passionate developers and technology
  consultants driving digitalization and mobility solutions.
  As we continue to grow, we’re looking for an experienced
  full-stack software engineer to join our development team.
  You’ll work on cutting-edge projects in connected services,
  backend infrastructure, and tailor-made solutions — the kind
  of work that shapes how vehicles and services connect. If
  that sounds like you, we’d love to meet you.
  Responsibilities * Take ownership of major new features,
  using the latest technologies and methodologies. * Drive
  solution analysis, development, and integration across
  frontend, backend, and cloud systems. * Ensure product
  quality through automated testing and clean code. * Advance
  and foster our culture of best practices throughout the
  development process. Requirements Professional experience
  (or a substantial personal/open-source project) in one or
  more of these areas: * Frontend: TypeScript and Angular
  (React a plus) * Backend: Java, Kotlin, or Node.js, with SQL
  and/or NoSQL databases * DevOps: GitLab and CI/CD * Cloud:
  AWS, Azure, or similar Benefits * We support your health
  with attractive offers like gym subsidy, health workshops,
  sport events,… * We support you in the public
  transportation, e.g Deutschlandticket, Mobility Voucher. *
  We support, offer and cover the cost of language courses
  from level A1 to C1. * We support you to help you grow
  individually by a variety of training programs * Dependend
  on the country you're hired: We provide some support for
  several insurances, e.g. occupational disability, health,
  life insurance. * Enjoy daily supportive lunch provisions.
  Pixida is proud to be an Equal Opportunity Employer! We are
  committed to a work environment that supports, inspires and
  respects all individuals and in which all aspects of
  employment are applied without discrimination. Therefore we
  encourage all individuals to apply!
