description: |
  Description  Liberty Mutual Investments manages Liberty
  Mutual Insurance Group's global financial assets across
  public and private domains, to create capital and generate
  income. With over $100 billion in AUM and staffed with 300+
  investment, finance and operations professionals located in
  Boston, MA., Liberty Mutual Investments offers the best of
  both worlds; the look and feel of a boutique investment
  firm, and the reputation and financial strength of a Fortune
  100 company. Note: This role has a preferred hybrid work
  arrangement (3 days per week in our Boston office). The
  Principal Full Stack Software Engineer for the Public
  Markets Agile Squad will:
  - Provide hands-on technical leadership designing and building
    real-time, high-throughput trading and market data
    platforms for Global Liquid Markets.
  - Partner closely with Product Owners, business stakeholders,
    and Solution Engineers to co-create solution designs that
    balance speed, resilience, security, and enterprise
    quality.
  - Serve as the technical authority on the squad, guiding
    architecture decisions, setting engineering standards, and
    ensuring alignment with Public Markets and enterprise
    technology strategy.
  - Design clean, evolvable architectures for low-latency,
    event-driven, and API-first systems supporting
    institutional trading workflows.
  - Embed modern software engineering practices including CI/CD,
    automated testing, observability, and responsible use of
    AI across the SDLC to improve developer productivity and
    system quality.
  - Lead design reviews, produce clear architectural artifacts,
    and articulate technical trade-offs to both technical and
    non-technical audiences.
  - Collaborate across squads and enterprise architecture to
    deliver integrated solutions while avoiding local
    optimization.
  - Mentor and develop engineers through code reviews, pairing,
    and coaching, setting a high bar for engineering
    excellence.
  Qualifications Experience
  - 8+ years of software engineering experience in an agile
    environment
  - Prior experience building real-time trading, execution,
    order management, or market data systems for institutional
    investors strongly preferred.
  - Deep understanding of distributed systems, low-latency
    architectures, and resilient, fault-tolerant design.
  - Proven experience working in fast-paced, regulated financial
    services environments.
   Skills
  - Strong proficiency in Python and modern backend development;
    experience with cloud-native architectures on AWS (e.g.,
    Lambda, Fargate, Step Functions).
  - Experience designing and consuming REST and event-driven
    APIs; familiarity with data platforms such as Snowflake
    and ingestion pipelines.
  - Practical experience applying AI-assisted tools in the SDLC
    (e.g., code generation, test creation, observability, or
    productivity tooling).
  - Excellent communication, facilitation, and influence skills.
   Knowledge
  - Deep knowledge of software architecture patterns, security
    and privacy controls, and enterprise engineering
    practices.
  - Strong grasp of agile delivery, backlog management, and
    incremental value delivery.
   Education  A Bachelor's or Master's degree in Computer
  Science, Engineering, or equivalent practical experience.
