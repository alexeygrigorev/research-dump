description: |
  Dynamic Manufacturing, Inc. is hiring a Mechanical & Design
  Engineering Manager to join our growing Team!  The
  Mechanical & Design Engineering Manager provides technical
  and organizational leadership for Dynamic's Mechanical
  Engineering and Mechanical Design teams. This role is
  responsible for managing a multidisciplinary engineering
  organization focused on the design, development,
  implementation, validation, and continuous improvement of
  manufacturing equipment, tooling, fixtures, gauges,
  automated testing systems, and advanced automation solutions
  supporting Dynamic's remanufacturing operations. The role is
  expected to maintain 3D models, 2D drawings, and produce and
  assemble mechanical fixtures, gauges, mechanical engineering
  solutions, and technologies aiming to aid manufacturing
  operators in testing components, sub-assemblies, and
  assemblies of products. The position combines strategic
  engineering leadership with hands-on technical oversight
  across mechanical design, industrial automation, robotics,
  motion control, hydraulics, pneumatics, machine safety, and
  manufacturing systems integration. The manager establishes
  engineering standards, develops technical roadmaps, mentors
  engineering talent, and partners closely with Controls
  Engineering, Software Controls, Instrumentation Engineering,
  Product Engineering, Manufacturing, Quality, Operations, and
  external suppliers to deliver innovative, reliable, and
  cost-effective manufacturing solutions.

   At Dynamic Manufacturing, we offer:

  - An Engaging Work Environment
  - Opportunities for Advancement
  - Tuition Reimbursement
  - Competitive Pay (we pay weekly!)
  - Comprehensive Benefits Package & 401(k) Match
  - Generous Paid Time Off, and more!

  Engineering & Technical Responsibilities:

  - Lead and develop a multidisciplinary engineering team of
    Mechanical Engineers, Mechanical Designers, Design
    Engineers, and Technicians.
  - Establish engineering standards, technical roadmaps, and
    best practices for mechanical design and automation.
  - Direct design of tooling, fixtures, gauges, ergonomic
    devices, assembly equipment, and automated test systems.
  - Lead advanced automation initiatives including robotics,
    servo motion control, hydraulics, pneumatics, and machine
    safety.
  - Collaborate with Controls, Software Controls, and
    Instrumentation Engineering to integrate complete
    manufacturing systems.
  - Evaluate equipment and determine repair, redesign, rebuild,
    replacement, or automation strategies.
  - Review and approve CAD models, drawings, engineering
    calculations, FEA, structural analysis, tolerance studies,
    and prototype validation.
  - Apply DFM, DFA, PLM, material selection, GD&T, and 3D
    assembly simulation throughout development.
  - Manage capital equipment projects from concept through
    commissioning while controlling scope, schedule, budget,
    and technical risk.
  - Support new product launches and manufacturing readiness.
  - Drive Lean Manufacturing, continuous improvement, and root
    cause problem solving.
  - Mentor engineers, conduct performance reviews, hire talent,
    and build succession plans.
  - Represent the company with customers, suppliers, and
    engineering partners.

  Project & Operational Leadership:

  - Lead multiple concurrent engineering projects from concept
    through implementation while managing scope, schedule,
    budget, resources, and technical risk.
  - Coordinate engineering activities across Product
    Engineering, Manufacturing Engineering, Operations,
    Quality, Supply Chain, Purchasing, Maintenance, and
    external vendors.
  - Support new product launches through equipment development,
    manufacturing readiness, validation, and process
    implementation.
  - Manage supplier selection, equipment procurement, technical
    reviews, factory acceptance testing (FAT), site acceptance
    testing (SAT), installation, and commissioning.
  - Monitor engineering KPIs, project performance, capital
    expenditures, and resource utilization.

  Customer & Supplier Interface:

  - Serve as the technical engineering representative during
    customer meetings, engineering reviews, and technical
    discussions.
  - Build strong partnerships with equipment suppliers, system
    integrators, and engineering service providers.
  - Evaluate emerging manufacturing technologies and recommend
    investments that strengthen Dynamic's engineering
    capabilities.

  Required Skills/Abilities:

  - Demonstrated success delivering complex automation and
    manufacturing equipment projects.
  - Advanced knowledge of CAD, 3D Design, Linear FEA, structural
    analysis, PLM, DFM/DFA, prototype development, and
    material selection (especially for metals).
  - Strong project management, leadership, communication, and
    decision-making skills.
  - Project management certifications and/or a proven record of
    successful delivery of projects
  - Ability to demonstrate prior success in all project phases
    such as inception, costing, design, implementation,
    troubleshooting, and delivery
  - Demonstrated understanding of electrical, mechanical and
    software engineering concepts
  - Ability to make smart decisions independently, with minimal
    supervision while weighing multiple factors and
    considering different outcomes
  - Working knowledge of spreadsheets, and data analysis and
    presentation

  Education and Experience:

  - 6-10 years of progressive experience in the field of
    Engineering and Management of Multidisciplinary
    Engineering Departments or automotive manufacturing
  - A bachelor’s or master’s degree in Mechanical Engineering or
    equivalent
  - Minimum of 5 years leading multidisciplinary engineering
    teams.
  - Experience working in the manufacturing and/or automotive
    industry
  - Experience with lean methodologies such as SMED, Kaizen, 5S,
    and Kanban
  - Strong experience with industrial robotics, motion control,
    hydraulics, pneumatics, automated test equipment, tooling,
    fixtures, and gauges.

   Physical Requirements:

  - Prolonged periods of sitting at a desk and working on a
    computer.
  - Regularly required to stand, walk, bend, kneel, climb
    stairs, and move throughout manufacturing and warehouse
    environments.
  - Ability to inspect manufacturing equipment, automation
    systems, machinery, tooling, fixtures, gauges, and
    production processes on the plant floor.
  - Must be able to occasionally lift and carry materials,
    tools, or equipment weighing up to 25 pounds.
  - Ability to use standard office equipment, engineering
    workstations, and computer-aided design (CAD) software for
    extended periods.
  - Ability to safely access manufacturing equipment, work
    around moving machinery, and wear required personal
    protective equipment (PPE), including safety glasses,
    hearing protection, steel-toed footwear, and other
    required safety equipment.
  - Ability to travel periodically to customer sites, supplier
    facilities, equipment manufacturers, and other Dynamic
    locations as business needs require.

  WHY CHOOSE DYNAMIC?

  Dynamic Manufacturing is a family owned and operated
  organization formed in 1955 by John Partipilo. Our
  organization specializes in the manufacture of automotive,
  off-road, industrial and racing powertrain products. This
  includes Torque Converters, Transmissions (Automatic,
  Manual, Hybrid models) and Transfer Case Assemblies.

  Our organization started with a single retail facility and a
  dream. Today, we serve the aftermarket and several OE
  customers. Our operations consist of almost a million square
  feet of floor space and 1,000+ extremely talented employees
  encompassing turnkey operations from engineering, total
  machining operations, through assembly and dynamometer
  testing.

  We are an equal opportunity employer and prohibit
  discrimination/harassment without regard to race, color,
  religion, age, sex, national origin, disability status,
  genetics, protected veteran status, sexual orientation,
  gender identity or expression, or any other characteristic
  protected by federal, state or local laws.
