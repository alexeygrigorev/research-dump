description: |
  Career Area: Technology, Digital and Data Job Description:
  Your Work Shapes the World at Caterpillar Inc. When you join
  Caterpillar, you're joining a global team who cares not just
  about the work we do - but also about each other. We are the
  makers, problem solvers, and future world builders who are
  creating stronger, more sustainable communities. We don't
  just talk about progress and innovation here - we make it
  happen, with our customers, where we work and live.
  Together, we are building a better world, so we can all
  enjoy living in it. Job Summary: As the Software Test
  Engineering Manager you will lead a System Integration
  Testing team supporting programs within our Platform
  Engineering organization. The Test Engineering Manager owns
  the integration test strategy, with a primary focus on back-
  end testing of APIs, services, data pipelines, and system
  interfaces. The role also sets the quality standards for
  end-to-end data flow across system boundaries. It manages
  the test automation frameworks, environments, and schedules
  that keep releases on track. It partners with software
  engineering, product, and architecture teams to confirm
  release readiness. It also hires, mentors, and develops test
  engineers, and reports on quality, risk, and test coverage
  to stakeholders. What You Will Do:

  - Lead, mentor, and develop a team of test engineers,
    including hiring, performance management, and training.
  - Define and own the test strategy, test plans, and quality
    standards across the software development life cycle.
  - Oversee the design, development, and maintenance of
    automated test frameworks, including regression,
    integration, performance, and system-level testing.
  - Partner with software engineering, product, and architecture
    teams to define requirements, acceptance criteria, and
    release readiness.
  - Build and manage test schedules, estimates, and resource
    plans, and report on status, risks, and quality metrics to
    stakeholders.
  - Drive CI/CD test integration, test environments, and tooling
    to speed up feedback and improve release quality.
  - Oversee defect triage and root-cause analysis and drive
    continuous improvement in test coverage and efficiency.
  - Ensure compliance with company standards, safety and
    security requirements, and industry best practices.

  What You Will Have:

  - Organizational Leadership: Knowledge of leadership concepts
    and ability to use strategies and skills to enlist others
    in setting, embracing and achieving objectives.
  - Software Development Life Cycle: Knowledge of software
    development life cycle; ability to use a structured
    methodology for delivering and managing new or enhanced
    software products to the marketplace.
  - Software Quality Assurance and Testing: Knowledge of
    software quality assurance and testing; ability to apply
    appropriate processes, tools, and techniques for assuring
    a high level of quality in computer software products and
    systems.
  - System Integration Test Engineering: Knowledge of software
    integration processes and functions; ability to design,
    develop and maintain interfaces and linkage to alternative
    platforms and software packages.

  Top candidates will have:

  - Strong people leadership skills, with experience leading,
    mentoring, and developing test engineers and automation
    specialists across multiple programs.
  - Experience reviewing test strategies, test plans, and
    release readiness to ensure quality standards are met.
  - Experience managing automated pipeline health and test
    triage, with the ability to work with engineering leads to
    identify and reduce flaky tests and false positives
  - Strong quality leadership skills, with the ability to define
    testing priorities and align quality strategy with
    product, engineering, and business goals.
  - Strong communication skills, with the ability to report
    quality risks and test metrics to engineering and product
    leaders and influence release decisions.
  - Understanding of Gen AI capabilities and development tools,
    with the ability to identify opportunities to improve
    engineering productivity, automation, and team efficiency.

  Additional Details:

  - This position requires the candidate to be based in Chicago,
    IL
  - Relocation assistance is NOT available for this position
  - Visa sponsorship is NOT available with this position.

  Summary Pay Range: $128,470.00 - $208,770.00 Compensation
  and benefits offered may vary depending on multiple
  individualized factors, job level, market location, job-
  related knowledge, skills, individual performance and
  experience. Please note that salary is only one component of
  total compensation at Caterpillar. Benefits: Subject to plan
  eligibility, terms, and guidelines. This is a summary list
  of benefits.

  - Medical, dental, and vision benefits*
  - Paid time off plan (Vacation, Holidays, Volunteer, etc.)*
  - 401(k) savings plans*
  - Health Savings Account (HSA)*
  - Flexible Spending Accounts (FSAs)*
  - Health Lifestyle Programs*
  - Employee Assistance Program*
  - Voluntary Benefits and Employee Discounts*
  - Career Development*
  - Incentive bonus*
  - Disability benefits
  - Life Insurance
  - Parental leave
  - Adoption benefits
  - Tuition Reimbursement

  * These benefits also apply to part-time employees Visa
  Sponsorship is not available for this position. Posting
  Dates: November 3, 2026 - November 15, 2026 Any offer of
  employment is conditioned upon the successful completion of
  a drug screen. Caterpillar is an Equal Opportunity Employer,
  Including Veterans and Individuals with Disabilities.
  Qualified applicants of any age are encouraged to apply. Not
  ready to apply? Join our Talent Community.
