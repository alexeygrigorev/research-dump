description: |
  Pomelo Care is the leading virtual medical practice for
  women and children, providing care across pregnancy,
  postpartum, pediatrics, menopause, and perimenopause. We
  combine proactive, 24/7 clinical care with technology that
  helps us reach patients earlier, identify risks sooner, and
  deliver personalized care throughout their journey. Our team
  includes clinicians, technologists, operators, and problem-
  solvers working together to make high-quality care more
  accessible for families nationwide.

  At Pomelo Care, we're on a mission to improve the health and
  well-being of mothers and their families. Our engineering
  team is the engine behind our innovative virtual care
  platform, building AI-powered solutions that fundamentally
  transform care delivery and create exceptional experiences
  for both patients and clinicians. If you're passionate about
  using technology to effect real, tangible good in the world,
  we'd love to meet you.

  What you'll do

  - Define and guide technical direction by designing, building
    and scaling the technology that underpins Pomelo’s success
  - Act as a technical leader and a mentor to fellow engineers
  - Write exemplary code that sets the standard for the team,
    shipping high-impact features while architecting systems
    that scale effortlessly
  - Drive the technical direction and architecture of complex,
    distributed systems that enable our clinical team to
    deliver personalized, data-driven care at scale
  - Pioneer our AI-powered tools, designing and building agents
    that make clinicians drastically more efficient and
    effective
  - Elevate the game of those around you through mentorship,
    technical guidance, and fostering our culture of
    excellence and continuous learning
  - Partner with product and clinical leadership to shape the
    company's technical strategy, identifying breakthrough
    opportunities to ensure we are tackling the most impactful
    problems

  Who you are

  - 6+ years of experience shipping high-quality, scalable
    software systems
  - A seasoned, product-minded, technical leader who is an
    expert in navigating ambiguity, identifying opportunities
    that have a lasting impact on the business, and raising
    the bar for the people around you
  - Possess a proven ability to translate user needs into high-
    quality technical solutions
  - Have an expert level of proficiency in system and relational
    database design and one or more languages like Java, C#,
    Kotlin, Python, Go, etc.
  - Have experience guiding technical teams in the development
    of applications with modern front-end frameworks like
    React or Vue.js
  - Are passionate about staying on the cutting-edge of agentic
    tooling to significantly accelerate delivery and amplify
    engineering impact
  - Have a track record of delivering elegant and maintainable
    solutions to complex problems that matter
  - Have prior experience in AI/ML, natural language processing
    or building agent-based systems
  - Have worked in an early stage, fast-paced, product-oriented
    environment

  Our Tech Stack

  - Expo + React Native, React, TypeScript, Kotlin, SQL

  Compensation

  The expected base salary range offered for this role is
  $220,000 - $260,000. This role is also eligible for equity,
  giving you an ownership stake in Pomelo’s mission. Actual
  compensation may vary based on relevant experience, skills,
  competencies, and certifications.

  Benefits and Perks:

  - Comprehensive Health, Dental, and Vision coverage for
    employees and their families
  - High deductible Health Plans with Health Savings Account
    (HSA) options
  - Flexible Spending Account (FSA)
  - Equity grant participation
  - 401(k) program
  - Competitive vacation policy
  - 16 weeks paid parental leave
  - Fully remote work flexibility (within the US)

  Why You Should Join Our Team

  By joining Pomelo, you’ll get in on the ground floor of a
  fast-moving, well-funded startup on a mission to improve
  outcomes for all mothers and babies. We cultivate a
  collaborative, patient-first environment where data drives
  our decisions and team members are challenged to learn,
  grow, and have fun together.

  We are committed to hiring the best team to improve outcomes
  for all mothers and babies. To solve the complex challenges
  facing the diverse population we serve, we need diverse
  perspectives, actively welcoming people of all races, ages,
  sexual orientations, gender identities and expressions,
  national origins, religions, disabilities, and veteran
  statuses. We strive to cultivate an inclusive and respectful
  environment where team members thrive by working across
  disciplines, moving fast, making data driven decisions,
  learning continuously, and always putting the patient first.
