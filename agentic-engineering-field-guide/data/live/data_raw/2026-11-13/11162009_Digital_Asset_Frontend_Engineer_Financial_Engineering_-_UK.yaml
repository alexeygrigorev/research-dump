description: |
  About Digital Asset & the Canton Network Digital Asset
  builds the technologies that are reshaping the foundations
  of financial markets. Our mission is to create the world’s
  most trusted, privacy-enabled, and interoperable digital
  infrastructure for global finance. At the heart of this
  mission is the Canton Network — the blockchain purpose-built
  for institutional finance. Uniquely combining privacy,
  compliance, and scalability, Canton enables real-time,
  secure settlement across multiple asset classes. Governed by
  the Canton Foundation with participation from leading
  financial institutions, it is the proven link between the
  promise of blockchain and the power of global finance.
  Founded in 2014 and headquartered in New York City, with
  offices in London, Zurich, Budapest, Hong Kong, and Sydney —
  we are on a mission to transform finance — and that
  transformation is now playing out rapidly on the Canton
  Network. If you’re interested in playing a crucial role at
  the intersection of traditional and crypto-capital markets
  and want to help bring the next trillion dollars of finance
  on-chain, join us. Job requirements

  - Proven engineering depth: You’re an experienced Frontend
    Engineer with strong React and TypeScript expertise,
    demonstrated through production-grade applications or
    meaningful contributions to open-source projects.
  - Production focused: You’ve built, shipped, and maintained
    React applications in production environments and
    understand what it takes to make them performant,
    resilient, scalable, and user-friendly.
  - Committed to sustainable, high-quality development: You care
    deeply about design systems, UX quality and clean
    component architecture. You back this up with strong
    testing practices and modern CI/CD tooling to ensure
    maintainable high-quality code.
  - UI systems designer: You have experience designing reusable
    component libraries, modular frontend architectures, or
    scalable design systems. Understanding of web performance,
    state management or frontend security practices is a plus.
  - Technical experience: You hold a Master’s or PhD in computer
    science (or related field); or bring equivalent experience
    that demonstrates deep technical skill and curiosity.
  - Strong communicator: You can explain complex ideas clearly -
    in code, in writing, and in conversation. Experience
    writing technical documentation is a bonus.
  - Financial prowess: Familiarity with financial systems,
    trading platforms, or fintech UI patterns is helpful but
    not required — an eagerness to learn and engage with
    domain challenges is equally valued.
  - Hybrid role based in Switzerland, the UK, Hungary or Hong
    Kong.

  Job responsibilities Opportunity The Financial Engineering
  team is responsible for designing, building and operating
  mission-critical financial workflows - such as Asset
  Tokenization, Collateral Management, Credentials and more -
  on the Canton Network. Our solutions leverage the
  foundational technologies of Digital Asset’s platform for
  the Canton Network, including the Canton blockchain, the
  Daml smart contract language and a range of complementary
  components. As a Frontend Engineer on the Financial
  Engineering team, you will have the unique opportunity to
  design and build intuitive, high-performance user interfaces
  that power mission-critical applications for our clients.
  You will work across modern frontend technologies while
  collaborating closely with product and design teams to shape
  the evolution of our platform’s user experience. Your work
  will span diverse and challenging areas such as UI
  architecture, design systems, performance optimization,
  accessibility, and seamless integration with backend
  services.

  - Build and ship great software: Contribute hands-on across
    our React and TypeScript codebase - writing clean,
    reliable and maintainable code that moves our product
    forward.
  - Bring your technical depth: Use your experience in design,
    engineering and production systems to help the team make
    smart, scalable decisions.
  - Collaborate from idea to delivery: Be part of planning,
    design, and implementation discussions - shaping solutions
    that balance technical excellence with real-world impact.
  - Help others grow: Review code, share feedback and mentor
    teammates. Raise the bar by leading with curiosity,
    empathy, and a focus on continuous improvement.
  - Build with everyone in mind: We’re a team that thrives on
    diverse perspectives and shared ownership where every
    voice matters and everyone plays a key role in our
    success.

  NO AGENCIES PLEASE! Benefits Connect with us! We offer a
  comprehensive benefits package designed to support the well-
  being of our team members. Health and insurance benefits
  vary by region to ensure local relevance and compliance, and
  may include medical, dental, and vision coverage. Digital
  Asset is an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, national origin, sex, religion,
  sexual orientation, age, disability, citizenship status,
  veteran status or any other basis protected by applicable
  law. If and as required by applicable law, all persons hired
  to work at Digital Asset will be required to verify identity
  and eligibility to work in the location for which they have
  an offer to work and to complete the necessary employment
  eligibility verification documents upon hire. Applicants
  with disabilities who require accommodation should contact
  recruiting@digitalasset.com. As part of our commitment to
  equal opportunity, Digital Asset believes that all employees
  should receive equal pay for equal work and is committed to
  this principle in its pay structure. DA also offers family-
  friendly benefits in addition to flexible work arrangements.
