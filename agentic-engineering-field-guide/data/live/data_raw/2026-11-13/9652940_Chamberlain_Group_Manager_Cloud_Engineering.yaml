description: |
  Chamberlain Group (CG) is a global leader in intelligent
  access and Blackstone portfolio company. Powered by our myQ
  technology, we make access simple and secure for millions of
  homeowners, businesses, and communities worldwide. Our
  flagship brands, LiftMaster®  and Chamberlain® , are found
  in 51+ million homes, and 14 million+ people rely on the
  myQ®  app daily.

  This role is responsible for leading and managing the myQ
  Cloud Engineering team that designs, builds, and operates
  the cloud infrastructure powering Chamberlain Group's myQ
  connected products and services. As a people manager, this
  role oversees a team of cloud engineers and architects,
  driving day-to-day delivery, professional development,
  performance management, and hiring. This individual partners
  closely with Engineering, Product Management, IT Security,
  and SRE/DevOps leaders to execute the cloud infrastructure
  roadmap, advance automation and modernization efforts, and
  ensure the platform scales reliably and securely with the
  growth of the myQ ecosystem. Success in this role looks like
  a high-performing, engaged team consistently delivering
  secure, cost-optimized, and resilient cloud solutions while
  continuously improving operational maturity. The Manager
  will set technical direction in collaboration with
  architects and senior engineers, remove blockers, manage
  stakeholder relationships, and own outcomes for the team's
  commitments.

  Job Responsibilities:

  - Lead, manage, coach, and develop a team of cloud engineers
    and architects supporting the myQ Cloud Engineering
    platform; conduct 1:1s, performance reviews, career
    development planning, and goal setting.
  - Own hiring, onboarding, retention, and team capacity
    planning; build a diverse, high-performing team aligned to
    current and future business needs.
  - Partner with the Lead Cloud Infrastructure Architect and
    senior engineers to execute the cloud infrastructure
    roadmap, balancing strategic initiatives with operational
    priorities.
  - Evolve PaaS and cloud service implementations (Azure and/or
    other cloud platforms), guiding vendor selection, cost
    optimization, and adoption of managed services.
  - Drive day-to-day delivery of cloud engineering work
    including design, implementation, automation,
    observability, and incident response; ensure commitments
    are met on schedule and at quality.
  - Establish and maintain strong working relationships with
    Engineering, Product Management, IT Security, SRE/DevOps,
    and other technology stakeholders to align on priorities
    and dependencies.
  - Champion automation, Infrastructure as Code (IaC), and
    modern DevOps practices across the team to improve
    reliability, repeatability, and engineering velocity.
  - Provide leadership during monitoring, troubleshooting, root
    cause analysis (RCA), and post-incident reviews for
    security and infrastructure events; ensure follow-through
    on remediation.
  - Collaborate with the IT Security team on architecture
    reviews, compliance requirements, and tooling; ensure the
    team's deliverables meet security and regulatory
    expectations.
  - Facilitate and manage discussions with IT executives, senior
    engineers, and cross-functional partners; communicate
    technical trade-offs, risks, and recommendations clearly
    to varied audiences.
  - Provide governance of the Infrastructure-as-a-Service
    environment; stay current on IT strategy, business goals,
    and technology trends; provide mentoring and coaching
    across the broader engineering organization.
  - Manage team budget, vendor relationships, software/licensing
    renewals, and capacity forecasts in partnership with
    finance and procurement.
  - Accountable for accomplishing team and individual objectives
    both independently and collaboratively; deliver high
    quality outcomes in a deadline-driven environment.
  - Responsible for complying with the security requirements set
    forth by the Information Security team and the established
    ISO 27001 Security Roles, Responsibilities, and
    Authorities Document found in the ISMS Document Library.
  - Comply with health and safety guidelines and rules; managers
    should also ensure compliance across their teams.
  - Protect Chamberlain Group’s reputation by keeping
    information confidential.
  - Maintain professional and technical knowledge by attending
    educational workshops, reading professional publications,
    establishing personal networks, and participating in
    professional societies.
  - Contribute to the team effort by accomplishing related
    results and participating on projects as needed.

  Job Requirements:

  - Bachelor's Degree in Engineering, Computer Science,
    Information Systems, or a related field.
  - 7+ years of progressive infrastructure, cloud, and
    operations experience in a technical role, including
    design, implementation, disaster recovery, and
    network/security architecture.
  - 3+ years of direct people-management experience leading
    technical teams (cloud, infrastructure, DevOps, or SRE).
  - Demonstrated experience leading teams that operate
    production cloud environments at scale (Azure, AWS, or
    GCP), including experience with managed/PaaS services.
  - Experience with Agile methodologies and Scrum is required.
  - Experience in software development and Infrastructure as
    Code (e.g., Terraform, ARM/Bicep, CloudFormation) is
    required.
  - Experience with Linux, Windows platforms, and Active
    Directory.
  - Experience working in a team-oriented, collaborative, cross-
    functional environment.
  - An advanced degree in a directly applicable area of study
    may substitute for up to two (2) years of job-related
    experience.
  - Ability to travel up to 10% of the time, domestically and
    internationally.

  Knowledge, Skills, and Abilities:

  - Proven ability to lead, develop, and retain high-performing
    engineering talent.
  - Strong analytical and problem-solving skills; ability to
    debug, troubleshoot, and drive root cause analysis across
    complex distributed systems.
  - Proficient in cloud and network architecture design,
    documentation, and review.
  - Strong written and verbal communication skills; able to
    communicate effectively with executives, peers, and
    engineers.
  - Self-motivated, organized, and capable of multitasking and
    prioritization in a fast-paced environment.
  - Comfortable making decisions with incomplete information and
    driving alignment across stakeholders.

  Preferred Job Requirements:

  - MBA or Master's Degree in Engineering, Computer Science, or
    a related field.
  - Relevant cloud certifications (e.g., Microsoft Azure
    Solutions Architect Expert, AWS Solutions Architect,
    Google Cloud Professional Cloud Architect).
  - Experience in IoT and connected/durable goods industries.
  - Experience managing globally distributed engineering teams.
  - Experience leading cloud cost optimization (FinOps)
    initiatives.
  - Experience with Kubernetes, container platforms, and modern
    CI/CD ecosystems.
  - Strong analytical, financial, and vendor management skills.
  - Ability to work effectively in a matrix environment.

  The pay range for this position is $133,783.00 -
  $228,241.50; base pay offered may vary depending on a number
  of factors including, but not limited to, the position
  offered, location, education, training, and/or experience.
  In addition to base pay, also offered is a comprehensive
  benefits package and 401k contribution (all benefits are
  subject to eligibility requirements). This position is
  eligible for participation in a short-term incentive plan
  subject to the terms of the applicable plans and policies.

  Chamberlain Group wants all of its employees to succeed and
  encourages people of all backgrounds to apply. We’re proud
  to be an Equal Opportunity Employer, and you’ll be
  considered for this role regardless of race, color,
  religion, sex, national origin, age, sexual orientation,
  ancestry; marital, disabled or veteran status. We’re
  committed to fostering an environment where people of all
  lived experiences feel welcome.

  Persons with disabilities who anticipate needing
  accommodations for any part of the application process may
  contact, in confidence Recruiting@Chamberlain.com.

  NOTE: Staffing agencies, headhunters, recruiters, and/or
  placement agencies, please do not contact our hiring
  managers directly.
