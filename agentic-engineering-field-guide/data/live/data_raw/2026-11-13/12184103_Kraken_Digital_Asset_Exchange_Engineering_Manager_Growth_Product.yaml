description: |
  Building the Future of Open Finance

  Payward - the parent company behind Kraken, NinjaTrader,
  Breakout, xStocks, Payward Services and CF Benchmarks - has
  spent the last 15 years building one of the most modern and
  globally accessible financial infrastructure platforms in
  the industry, built to advance an open, global financial
  system.

  The team

  Founded in 2011, Kraken is one of the world's longest-
  standing crypto platforms, trusted by over 10 million
  individuals and institutions across the globe. It offers
  spot trading, margin, futures, staking, and OTC services,
  with products built for both individual investors and
  institutional clients. The Growth Engineering team builds
  the experiences that connect people to our ecosystem for the
  first time and keeps them coming back. We design and ship
  the systems behind our marketing funnels, signup and KYC
  flows, and the key engagement features that help new users
  fund their accounts and explore our products. It’s a team
  with direct influence on company growth, global reach, and
  user engagement at scale. Our products serve millions of
  users globally. As an Engineering Manager, you’ll guide a
  cross-functional engineering team responsible for delivering
  measurable impact on growth metrics. You’ll work closely
  with Product and Design partners to plan, prioritize, and
  execute projects that accelerate user acquisition,
  activation, and retention. You’ll help engineers do their
  best work — setting clear direction, removing blockers, and
  maintaining strong alignment across stakeholders.



  The opportunity

  - Lead, mentor, and support a cross-functional team of
    engineers delivering growth-critical systems and features.
  - Collaborate daily with Product and Design to define scope,
    set priorities, and ensure seamless execution.
  - Keep projects moving forward maintaining clear expectations,
    realistic estimates, and transparent communication with
    stakeholders.
  - Provide technical guidance and context to help engineers
    make sound architectural and implementation decisions.
  - Foster a culture of accountability, trust, and learning
    helping the team grow their impact and autonomy.
  - Improve team processes, communication, and collaboration
    across time zones.
  - Partner with other engineering leaders to ensure consistency
    and best practices across the broader Growth organization.



  What you bring

  - Experience leading engineering teams and delivering high-
    quality results in a collaborative environment.
  - Strong people leadership skills you invest in coaching,
    clarity, and empowerment.
  - Solid technical foundation; you can engage in design
    discussions, code reviews, and help engineers make
    pragmatic decisions.
  - Familiarity with one or more modern programming languages
    React and React Native on the front end with a Rust-based
    backend or Experience in (TypeScript, Go, Nodejs or
    similar).
  - A product mindset — you care about how your team’s work
    impacts users and moves key metrics.
  - Clear communication and organizational skills, with the
    ability to align engineering efforts with business goals.
  - Experience working in distributed, remote-first teams.



  Nice to haves

  - Experience with analytics, experimentation, or growth
    tooling.
  - Exposure to scaling teams or processes during high-growth
    phases.
  - Background in product engineering, building user-facing
    features and owning delivery from idea to launch

  Unless a specific application deadline is stated in the job
  posting, applications are accepted on an ongoing basis.

  Please note, applicants are permitted to redact or remove
  information on their resume that identifies age, date of
  birth, or dates of attendance at or graduation from an
  educational institution.

  We consider qualified applicants with criminal histories for
  employment on our team, assessing candidates in a manner
  consistent with the requirements of the San Francisco Fair
  Chance Ordinance.

  Our commitment

  Payward is powered by people from around the world and we
  celebrate the diverse talents, backgrounds, contributions,
  and unique perspectives that everyone brings to the table.
  We hire based on merit, seeking out people with the right
  abilities, knowledge, and skills for the job. We encourage
  you to apply for roles where you don't fully meet the listed
  requirements, especially if you're passionate or
  knowledgeable about crypto.

  We may ask candidates to complete job-related skills or
  work-style assessments as part of our hiring process. These
  assessments evaluate competencies relevant to the role and
  are applied consistently across candidates for similar
  positions. Results are considered alongside experience and
  interviews, and are not the sole basis for any employment
  decision.

  As an equal opportunity employer, we don't tolerate
  discrimination or harassment of any kind, whether based on
  race, ethnicity, age, gender identity, citizenship,
  religion, sexual orientation, disability, pregnancy, veteran
  status, or any other protected characteristic as outlined by
  federal, state, or local laws.

