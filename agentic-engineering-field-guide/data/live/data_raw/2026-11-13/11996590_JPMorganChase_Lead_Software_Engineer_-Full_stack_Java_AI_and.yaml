  About the TeamOur Consumer & Community Banking Group depends
  on innovators like you to serve consumers, small businesses,
  municipalities and non-profits.  You’ll support the delivery
  of award winning tools and services that cover everything
  from personal and small business banking as well as lending,
  mortgages, credit cards, payments, auto finance and
  investment advice. This group is also focused on developing
  and delivering cutting edged mobile applications, digital
  experiences and next generation banking technology solutions
  to better serve our clients and customers.
