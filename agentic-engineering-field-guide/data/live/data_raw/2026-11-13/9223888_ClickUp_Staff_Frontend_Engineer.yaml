description: |
  At ClickUp, we're building the future of work: the first
  truly converged AI workspace unifying tasks, docs, chat,
  calendar, and enterprise search, all supercharged by
  context-driven AI. We are an AI-native company. Every team
  member is expected to leverage AI daily, and we evaluate AI
  fluency as part of our hiring process. Join us and help
  redefine what's possible. 🚀

  Collaboration and partnership are vital to how ClickUp
  operates. A significant portion of your responsibilities
  will include working closely with members of the backend
  team and Integrations team to develop features together.
  Engineers at ClickUp are also responsible for the quality of
  their own code, so you will work with a QA counterpart to
  ensure all edge cases are tested. We’re scaling quickly, so
  we’re recruiting teammates who share our core values, know
  how to get sh*t done, and add to our very driven culture.
  You should be proficient in using one or more of the modern
  JavaScript frameworks (Angular//Vue/etc.) and have a strong
  understanding of building reusable components and developing
  for performance.

  The Role:

  - Build features in Angular 2+ while collaborating with
    designers, engineers, and product
  - Architect efficient and reusable front-end code that drive
    the ClickUp user experience
  - Manage individual project priorities, deadlines and
    deliverables
  - Identify and resolve performance and scalability issues
  - Build and maintain unit and integration tests
  - Fixing bugs fast and finding robust solutions to tackle hard
    problems
  - Follow established practices for maintaining state inside
    ClickUp

  Qualifications:

  - 8+ years working with JavaScript and one or more modern
    frameworks (Angular 2+ required)
  - Experience with Redux style state management NgRx,
    Typescript, and RxJs
  - HTML/CSS experience, including concepts like layout,
    specificity, cross browser compatibility, and
    accessibility
  - A strong self-starter, operationally-focused; a problem-
    solver
  - Excellent interpersonal, written, and oral communication
    skills
  - You’ve mentored teammates on new ways to deepen their
    technical craft

