description: |
  About Accelerant

  Accelerant is a data-driven risk exchange connecting
  underwriters of specialty insurance risk with risk capital
  providers. Accelerant was founded in 2018 by a group of
  longtime insurance industry executives and technology
  experts who shared a vision of rebuilding the way risk is
  exchanged – so that it works better, for everyone. The
  Accelerant risk exchange does business across more than 20
  different countries and 250 specialty products, and we are
  proud that our insurers have been awarded an AM Best A-
  (Excellent) rating. For more information, please visit
  www.accelerant.ai.

  Senior Software Development Engineer in Test (SDET)

  Location: Remote (flexible within U.S.)

  The Role

  We're building business solutions across the enterprise at
  Accelerant, and we need quality engineering to scale and
  keep up. You'll help drive the test automation strategy and
  implementation across our enterprise stack: Salesforce,
  MuleSoft, D365 and Reporting. You are a key decider about
  what gets automated, how it gets covered, and what gets
  pushed back on engineering.

  We need someone who can scale it, harden it, expand its
  reach into systems that have never had real QA coverage, and
  build modern, AI-assisted QA tooling that lets our team
  expand its impact.

  You'll partner closely with engineering, product, and
  business teams to identify where quality is leaking, expand
  automation breadth and depth, and build specialized QA
  agents that reduce the manual toil. You own end-to-end
  delivery of the test automation function.

  This Is a High-Autonomy, High-Impact Role for Someone Who:

  ·         Sees a flaky test or a coverage gap and cannot
  leave it alone. Excels at iterating and shipping the right
  framework, not the perfect one.

  ·         Has scaled a real test automation framework in
  production — not just written tests against one.

  ·         Has built with Playwright, modern CI, and AI
  coding assistants long enough to have strong opinions about
  what fits our needs.

  ·         Can prototype a QA agent in Cursor and iterate as
  they go.

  ·         Operates with autonomy, and can carry a technical
  discussion on framework design, test architecture, and
  tradeoffs.

  ·         Is genuinely curious about applying emerging AI to
  QA.

  What You'll Do

  Drive the test automation initiative

  ·         Own the test automation roadmap end to end. Set
  the strategy, prioritize the work, and drive execution
  across the team. You'll partner with QA and engineering on
  what we automate, how, and when.

  Scale the foundational framework

  ·         A Playwright/JavaScript framework is already
  built. Take it from foundational to enterprise-grade, with a
  focus on performance, stability, and reusability.

  Expand coverage breadth and depth

  ·         Push automation into areas that may not have any
  QA support today, and deepen regression coverage on core
  systems: Salesforce, MuleSoft, D365 Power Apps, D365 F&O,
  DCR, and Tagetik.

  Implement a scalable design and review process

  ·         Help build the design and review process that
  keeps automation quality high as the suite and the team grow
  - test design standards, code review norms, framework
  contribution guidelines.

  Scale test execution and reporting

  ·         Build the infrastructure that runs tests fast,
  reports results clearly, and surfaces signal over noise.
  Parallel execution, smart retries, actionable dashboards.

  Build specialized QA agents using Cursor AI

  ·         Design and ship AI agents for performance testing,
  regression analysis, and defect triage (to name a few). Use
  Cursor as your build environment. Treat the agents as
  products solving specific problems.

  Host QA agents on the AI fabric

  ·         Partner with the AI platform team to deploy your
  agents on the org's AI fabric. Make them discoverable,
  governed, and reusable across functions.

  What You'll Bring

  Must-Haves

  ·         Proven experience designing and scaling test
  automation frameworks in production.

  ·         Deep hands-on expertise with Playwright and modern
  JavaScript/TypeScript.

  ·         Experience automating against complex enterprise
  SaaS - ideally Salesforce, MuleSoft, D365 (Power Apps and/or
  F&O).

  ·         Hands-on experience building with LLMs and AI
  coding assistants - Cursor in particular. Bonus if you've
  built and deployed agents.

  ·         Solid grasp of API testing, contract testing, and
  integration testing patterns - especially across layers like
  MuleSoft.

  ·         Ability to define test strategy, coverage targets,
  and quality metrics - and defend them to engineering
  leadership and the business.

  ·         Strong communication skills - you can explain a
  flaky-test root cause to a junior engineer and a coverage
  gap to a product lead.

  ·         Demonstrated bias for action and ability to
  operate autonomously in ambiguous, fast-changing
  environments.

  Nice-to-Haves

  ·         Experience in insurance, fintech, or other
  regulated financial services industries.

  ·         Familiarity with insurance concepts (underwriting,
  claims, actuarial workflows) or willingness to learn them
  deeply.

  ·         Strong working knowledge of CI/CD, and
  reporting/observability for test suites.

  ·         Experience deploying AI agents on an internal AI
  platform or fabric (governance, eval harnesses,
  prompt/version management).

  ·         Performance testing background.

  Why This Role

  You won't be buried in a QA backlog writing yet another
  regression script. You'll set the automation strategy, scale
  the framework, and build the QA tooling that defines how
  this company ships and tests business solutions for the next
  decade. You'll have direct access to engineering and
  business leadership, a mandate to move fast, and the
  autonomy to choose your own tools and approach. If you've
  been waiting for a role where you can prove what modern AI-
  enabled QA can actually do inside a real company, this is
  it.
