description: |
  We are CoCrafter (YC W24), a fast-growing Munich-based
  startup on a mission to fundamentally transform core
  processes in the construction industry. The construction
  industry is the backbone of the German and European economy
  – yet it has largely been overlooked by digitalization. The
  result? Inefficient processes and significant untapped
  potential. At CoCrafter, we are building the Operating
  System (OS) for subcontractor management and already serve
  numerous medium-sized construction companies and trade
  businesses across Germany. We have raised €1.8 million from
  Y Combinator, 10x Founders, and other top-tier investors –
  and are ready to take the next big step in our growth
  journey. Join our team and help us shape the future of the
  construction industry! 🚀 The Role We are a small, high-
  performing engineering team that is growing rapidly. As a
  Senior Software Engineer (m/f/d), you will ensure that our
  system architecture and engineering processes scale
  alongside the business – from our early-stage startup setup
  to enterprise-level requirements. At the same time, you will
  remain hands-on: You will actively contribute to feature
  development wherever needed and lead by example. You will
  work closely with our CTO and have real ownership and
  influence over our technical direction. Responsibilities *
  Evolve our system architecture and optimize performance to
  handle 10x growth in load and meet enterprise requirements *
  Build and improve CI/CD pipelines, automated deployments,
  and a testing strategy that enables the team to ship quickly
  and reliably * Stay hands-on and develop features wherever
  the team needs support * Define technical standards for
  observability, security, and code quality * Help the team
  grow through code reviews, pair programming, Architecture
  Decision Records (ADRs), and mentoring * Prepare and
  document technical decisions, clearly outlining trade-offs
  and implications Qualification * A degree in Computer
  Science or a related field * Experience guiding a product or
  system through a significant growth phase * You are a strong
  Senior Engineer who enjoys building features hands-on and
  delivering pragmatic solutions * Several years of backend
  engineering experience, ideally with TypeScript/Node.js (our
  stack: NestJS, PostgreSQL, Next.js, Docker, AWS) * Strong
  knowledge of databases, performance optimization, cloud
  infrastructure, CI/CD, and observability * You think in
  terms of trade-offs and take ownership beyond the scope of
  your individual tickets * Excellent German or English
  skills. German is a plus Benefits * An outstanding network
  of founders, investors, and mentors to support your personal
  and professional growth * Competitive compensation,
  including equity (ESOP) – share in our success * 28 days of
  paid vacation per year to recharge * WellPass to help you
  stay active or unwind outside the office * Team events
  including bowling, mini golf, offsites, and regular feedback
  sessions * A beautiful office in the heart of Munich
  (Maxvorstadt) Why You Should Join CoCrafter * Impact: In
  less than a year, we have built a product that has become
  essential to our customers. With your work, you will help
  redefine an entire industry * Growth: Joining an early-stage
  startup is a unique opportunity. Become part of a fast-
  growing team and take on a key role in shaping its future! *
  Team: We are an interdisciplinary, dynamic, and supportive
  team passionate about building something extraordinary. Join
  CoCrafter and grow both personally and professionally! 🚀
  Let’s build the future of construction together!
