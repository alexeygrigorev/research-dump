description: |
  Artificial Intelligence. Actual Impact.

  At Docebo, we’re using AI to change how people learn at
  work—and we mean actually change it. We’re an AI-powered
  learning platform that helps organizations create, deliver,
  and manage training all in one place. But our real mission
  goes deeper: we help teams move faster, work smarter, and
  focus on the work that truly matters. Our platform is built
  with intelligent, time-saving tools that personalize
  learning, eliminate busywork, and turn training from a
  checkbox into a superpower. The result? Better experiences
  for learners and real results for businesses.

  We’re shaping the future of learning with a team that isn’t
  afraid to challenge the status quo. If you're excited by the
  idea of using AI to make work-life better for real
  people–you’ll feel right at home here. And it’s not just
  what we build, it’s how we show up. At Docebo, our values
  aren’t just posters on the wall—they guide how we work every
  day. We call it the Docebo Heart: trust by default, assume
  positive intent, and create space for different perspectives
  to thrive.

  So… what are you waiting for? Join 900+ Docebians around the
  world and help us reinvent the way people learn, because
  learning never stops.

  The Adventure Ahead 🚀

  As a Senior Product Engineer II, you bring deep expertise in
  either backend or frontend engineering alongside strong
  working competency across the full stack. You own complex
  features and technical initiatives end to end, working
  across customer facing applications, services, APIs, and
  integration boundaries to deliver complete solutions.

  Your primary strength may be building cloud native backend
  systems and event driven architectures, or architecting
  complex frontend applications and customer experiences. In
  either case, you understand how the broader system fits
  together and can confidently work across boundaries when
  needed.

  Beyond your individual technical output, you function as a
  technical anchor within your squad. You help drive technical
  direction, mentor peers, coordinate dependencies, and ensure
  the team can consistently deliver high quality software
  without creating unnecessary knowledge silos.



  The Day-to-Day ⚒️

  - Own complex initiatives end to end Drive multi sprint
    technical initiatives from architecture through
    implementation, production deployment, and ongoing
    evolution.
  - Build across the stack Navigate frontend applications, APIs,
    backend services, data layers, and platform integrations
    to deliver complete outcomes.
  - Set technical direction Bring deep expertise in your primary
    discipline while shaping architecture decisions and
    engineering patterns across the broader system.
  - Make durable technical decisions Evaluate complex tradeoffs,
    manage technical risk, and balance immediate delivery with
    long term scalability and maintainability.
  - Anchor the squad Break down complex work, coordinate
    technical dependencies, unblock others, and help the team
    maintain delivery momentum.
  - Drive engineering excellence Raise the bar for testing,
    CI/CD, observability, architecture, code quality, and
    pragmatic technical debt management.
  - Partner across functions Work with Product, Design, QA, SRE,
    platform teams, and engineering groups to translate
    customer problems into reliable solutions.
  - Level up the team Mentor engineers through architecture
    discussions, design reviews, code reviews, pairing, and
    knowledge sharing.

  Your Superpowers⚡️

  - Engineering depth and breadth Six or more years of software
    engineering experience, with deep expertise in either
    backend or frontend engineering and strong working
    competency across the broader stack.
  - End to end ownership A proven record of owning complex
    technical initiatives from architecture through production
    deployment and operation.
  - System design expertise Strong understanding of scalable
    application architecture, APIs, distributed systems, cloud
    services, and maintainable production software.
  - Technical leadership The ability to guide engineers through
    uncertainty, establish effective architecture patterns,
    and raise engineering standards.
  - Integration fluency Comfort navigating unfamiliar systems
    and safely changing frontend, backend, and integration
    boundaries.
  - Engineering excellence Strong experience with automated
    testing, CI/CD, observability, monitoring, and pragmatic
    technical debt management.
  - Collaborative communication The ability to explain
    tradeoffs, challenge assumptions constructively, and align
    Engineering, Product, Design, QA, and platform
    stakeholders.

  Bonus Points 🌟

  - Cloud and event driven systems Cloud native AWS applications
    using serverless services, asynchronous workflows,
    distributed systems, or event driven architecture.
  - Infrastructure and delivery Infrastructure as Code, CI/CD
    pipelines, deployment strategies, or production
    operations.
  - Frontend architecture Angular, React, or comparable
    frameworks, including application architecture, state
    management, design systems, performance, or accessibility.
  - Backend breadth Node.js and TypeScript services or polyglot
    environments that include Go, Python, PHP, or other
    backend technologies.
  - Production observability Monitoring, tracing, logging,
    metrics, incident diagnosis, and production operation.
  - Technical growth Experience acting as a technical lead or
    clear progression toward broader Staff level leadership.

  Our Stack 🛠️

  Our product teams work primarily with TypeScript across
  frontend and backend development. Frontend applications
  include Angular and modern web technologies. Backend and
  platform systems span Node.js, TypeScript, Go, PHP, Python,
  AWS, REST APIs, event driven architectures, relational and
  NoSQL databases, CI/CD, and modern observability tooling.

  You do not need deep expertise in every technology we use.
  We are looking for deep expertise in a primary discipline,
  strong software engineering fundamentals, and confidence
  working across frontend, backend, and integration
  boundaries.

  Our Hybrid Work Philosophy 🤝

  Great work can happen anywhere but coming together helps us
  go further. Our team spends three days a week in the office
  (Tuesday-Thursday) to collaborate, solve problems, and learn
  from each other. With flexibility the rest of the week, it’s
  a balance designed to help everyone do their best work and
  keep growing.

  Our Total Rewards Philosophy 🎉

  Our Total Rewards Philosophy centers around three core areas
  to reward and care for our People:

  - Rewarding Impact: We lead with competitive pay to reward the
    impact, skills and traits that fuel our success.
  - Fostering Holistic Wellbeing: We care deeply about and
    invest in the whole person with programs that support our
    people’s physical, mental, and financial well-being.
  - Empowering Our Talent Culture: We build a culture of trust
    and empowerment by designing our rewards and benefits with
    transparency, equity, and flexibility, enabling our people
    to do their best work and stay for the long haul.

  Our Promise to You 😍

  - Financial Wellness: Own a piece of Docebo through our
    Employee Share Purchase Plan (ESPP) at a 15% discount,
    plus a competitive compensation package.
  - Your Well-Being, Covered: You’ll get access to health
    benefits, so you can get the care you need when you need
    it.
  - Rest, Relax, Repeat: Rest and recharge with paid vacation
    days, two company-wide Docebo Days, floating holidays for
    cultural celebrations, and your birthday off!
  - Family First: We provide coverage offering you time with
    your little one(s) so you can soak up all those precious
    moments. Fun fact: we had 30 Docebian babies join the
    family in 2025!
  - Connections That Count: Connect with global communities
    through our Employee Resource Groups (including PRIDE,
    DWA, BIDOC, and Green Ambassadors) and company-wide events
    that keep the fun rolling all year long.

  About Docebo 💙

  At Docebo, we create seamless, AI-powered learning
  experiences for over 3,000 customers worldwide. We have
  successfully achieved two IPOs (TSX: DCBO & NASDAQ: DCBO),
  been recognized as a top SaaS e-learning solution, and are
  growing exponentially in the process. We're a global
  company, with office across North America, EMEA, APAC, and
  beyond. Our team is guided by five core values—Grow Together
  Win Together, Build with Our Customer, Clear is Kind, Own
  Outcomes, Progress Over Perfection—that shape everything we
  do. If this resonates with you, now is the perfect time to
  join one of the fastest-growing learning technology
  companies in the world.

