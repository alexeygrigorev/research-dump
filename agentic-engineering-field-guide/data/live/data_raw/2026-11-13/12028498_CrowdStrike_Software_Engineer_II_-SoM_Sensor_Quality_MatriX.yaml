description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About The Role:

  CrowdStrike's Falcon sensor runs on millions of endpoints
  globally, protecting more than half of the Fortune 500
  companies. It's a high-performance, lightweight agent that
  detects and prevents sophisticated threats in real-time.
  It's one of the most widely deployed security platforms in
  the world, running across every major OS and architecture.

  Every Falcon sensor release ships to millions of endpoints,
  so knowing a release is healthy — and being able to prove it
  — is a high-stakes problem. We're looking for a Software
  Engineer to design and build the systems, metrics, and
  dashboards that give engineers and leadership one clear,
  trusted picture of sensor and release health.



  You'll join a small team of 4 engineers (remote and hybrid)
  focused on the metrics, dashboards, and developer tooling
  that give visibility into the overall health of our build
  system — tools that sensor engineers and leadership rely on
  every day. You'll start in our repo-health rotation to see
  firsthand where sensor teams get stuck — and continue
  building the automation that replaces that manual process
  with AI-assisted signals, so attention goes to the highest-
  priority work.

  This role sits at the intersection of developer tooling,
  metrics, and release quality. You'll work primarily in
  Python and Django on the backend, and React and CSS on the
  front end, turning raw signal into clear, actionable
  insight. We're also building out agentic workflows with
  Claude Code — you'll help create the skills and commands
  that both our automated systems and the sensor engineering
  team use day to day, solving problems like: How do we know a
  sensor repo is unhealthy before it becomes a crisis? How do
  we give every stakeholder a single source of truth on
  release quality? How do we quantify the health of the tools
  and processes our team owns?

  This role is a hybrid role with an expectation of at least
  2x days in office each week, working out of one of the
  posted locations.

  What You'll Do:

  - Design and build our sensor quality dashboard from the
    ground up, giving engineers and leadership full visibility
    into the health of active sensor releases across multiple
    metrics
  - Own the process of defining new signals and metrics for repo
    and release health, and instrument the systems needed to
    capture them
  - Spend time in our repo-health rotation, partnering with
    sensor teams to see firsthand where engineers get stuck —
    then build the tooling that fixes it
  - Build and maintain metrics and visibility across all tooling
    and processes owned by our team
  - Build and extend Claude Code skills, commands, and agentic
    workflows used by both our automated systems and the
    sensor engineering team
  - Drive improvements by identifying gaps in visibility,
    prototyping solutions, and shipping dashboards and tooling
    that measurably improve how our team and stakeholders
    understand sensor health
  - Work with our data stack — LogScale, PostgreSQL, and Valkey
    — to collect, process, and surface sensor health metrics
    reliably

  What You'll Need:

  - 3+ years building production systems with a focus on
    developer tooling, metrics, or observability/monitoring
  - Strong Python experience (we build on Django)
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.
  - Experience with AI-assisted development workflows (we use
    Claude Code and are building out agentic workflows day to
    day)

  Bonus Points:

  - Cloud experience, applied to collecting and surfacing sensor
    health metrics
  - Front-end (UI) experience (React, CSS) building robust,
    production-grade dashboards
  - Experience with GitLab CI/CD
  - A focus on AI fluency and staying current with AI-assisted
    tooling

