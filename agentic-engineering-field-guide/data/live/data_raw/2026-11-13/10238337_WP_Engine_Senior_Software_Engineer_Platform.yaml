  Senior Software Engineer, Platform (Poland)

  In this role, you will architect and implement backend
  capabilities that drive our global, high-scale cloud
  infrastructure services.This position transcends standard
  backend development and pure DevOps; you will operate at the
  intersection of software engineering, distributed systems,
  and production reliability, maintaining full ownership of
  services from initial design through observability and
  technical support. Your work will focus on complex
  challenges in resiliency, asynchronous workflows,
  automation, and system scalability. We value engineers with
  deep technical fundamentals who are eager to adapt to
  evolving architectures, new languages, and emerging cloud-
  native technologies.

  What's cool about this job

  - Design, build, test, and operate scalable backend services
    and platform capabilities.
  - Develop APIs and service integrations used across
    distributed and cloud-based systems.
  - Make technical design decisions around data flow,
    asynchronous workflows, scalability, resiliency, and
    performance.
  - Own services throughout their lifecycle, from design and
    implementation to deployment, observability,
    troubleshooting, and production support.
  - Design and operate services across different cloud and
    platform environments, understanding how application,
    infrastructure, networking, and runtime decisions affect
    production systems.
  - Work across modern and established platform technologies,
    making pragmatic decisions based on system requirements.
  - Diagnose complex problems across application,
    infrastructure, networking, and data layers.
  - Improve CI/CD, automation, testing, and engineering
    workflows to reduce manual work and increase delivery
    quality.
  - Contribute to technical designs through ADRs, RFCs, and
    architecture discussions.
  - Collaborate with engineers across teams and help raise
    engineering standards through technical feedback and
    knowledge sharing.
  - Use AI-assisted engineering tools to accelerate development,
    investigate problems, and improve engineering
    productivity.

  Your expertise and passion

  You have strong software engineering fundamentals and a
  passion for building scalable, resilient production systems.
  You value engineering principles over specific languages and
  are comfortable operating across the entire software
  lifecycle.

  - Backend & Cloud Architecture: Skilled in designing REST/gRPC
    APIs, relational databases (SQL), and cloud-native
    architectures across GCP and AWS environments.
  - Distributed Systems: Deep understanding of event-driven
    architecture, asynchronous processing, scalability, fault
    tolerance, and eventual consistency.
  - DevOps & Security: Committed to Infrastructure as Code
    (Terraform), observability (monitoring/tracing), and
    integrating security (IAM, OAuth) throughout the
    development process.
  - Engineering Discipline: Practitioner of SOLID principles,
    automated testing, and collaborative development through
    code reviews and technical documentation.
  - AI Integration: Proactive in leveraging modern AI tools to
    accelerate development and improve code quality while
    maintaining technical ownership.

  Helpful experience to have

  - Languages & Runtimes: Go, PHP, Ruby, Python.
  - Cloud Services: GCP (GKE, Pub/Sub, IAM, BigQuery, Cloud SQL)
    and AWS (EC2, S3).
  - Orchestration & Infrastructure: Kubernetes, Docker,
    Terraform.
  - Observability Tools: OpenTelemetry, Google Cloud Operations,
    Prometheus, Datadog

