description: |
  Discover your future at Citi

  Working at Citi is far more than just a job. A career with
  us means joining a team of more than 230,000 dedicated
  people from around the globe. At Citi, you’ll have the
  opportunity to grow your career, give back to your community
  and make a real impact.

  Job Overview

  We are looking for experienced Full-Stack Software Engineers
  who are passionate about solving business problems through
  innovation and engineering practices. This role will be
  responsible for writing code, pairing with other developers
  as appropriate, decomposing acceptance criteria to
  understand team backlog deliverables, complexities, and
  risk, while working as a strong contributor on an agile
  team.

  From a technical standpoint, the Software Engineer has full-
  stack coding and implementation responsibilities and adheres
  to best practice principles including modern cloud-based
  software development, agile and scrum, code quality, and
  tool usage. The Software Engineer works to understand and
  influence software architecture, while contributing to
  Citi’s technical user base.

  Responsibilities:

  - Apply depth of knowledge and expertise to all aspects of the
    software development lifecycle, as well as partner
    continuously with stakeholders on a regular basis
  - Develop and engineer solutions within an Agile software
    delivery team, working to collaboratively deliver sprint
    goals, write code, and participate in the broader Citi
    technical community and team-level Agile and Scrum
    processes.
  - Contribute to the design, documentation, and development of
    world-class enterprise applications leveraging the latest
    technologies and software design patterns.
  - Leverage technical knowledge of concepts and procedures
    within own area and basic knowledge of other areas to
    resolve issues, as necessary.
  - Follow and contribute to defining technical and team
    standards.
  - Collaborate technical leadership to achieve established
    goals, in line with our broader technical strategy.
  - AI-Driven Development: Leverage AI tools, such as GitHub
    Copilot, to enhance development efficiency, accelerate
    delivery timelines, and optimize software solutions.
  - AI Landscape Awareness: Maintain awareness of the rapidly
    evolving AI landscape and proactively propose innovative
    approaches to implement product features.
  - Problem Solving and Troubleshooting: Possess the expertise
    to analyze and effectively troubleshoot complex coding,
    application performance, and design challenges.
  - Root Cause Analysis: Capable of conducting thorough research
    to identify the root causes of development and performance
    issues, as well as devising and implementing effective
    defect resolutions.
  - Technical Acumen: Demonstrate a profound understanding of
    the technical requirements pertinent to the solutions
    under development.
  - Containerization and Orchestration: Utilize Docker for
    application containerization and Kubernetes for efficient
    service orchestration.
  - Communication and Risk Management: Effectively communicate
    progress, proactively anticipate bottlenecks, provide
    skilled escalation management, and adeptly identify,
    assess, track, and mitigate issues and risks across
    various levels.
  - Process Optimization: Streamline, automate, or eliminate
    redundant processes within architecture, build, delivery,
    production operations, or business areas where similar
    efforts or issues recur annually.

  Requirements:

  - 3+ years of proven software development experience,
    specializing in Java, JavaScript framework like React,
    Spring Boot, and Oracle.
  - Modern Application Development:
    - In-depth knowledge of modern application architecture
      principles.
    - Clear understanding of Data Structures and Object-Oriented
      Principles using Java
    - Practical experience with Artificial Intelligence (AI) tools
      for enhancing development workflows.
    - Proficiency in Microservices frameworks (e.g., Spring Boot),
      Event-Driven Services, and Cloud-Native Application
      Development.
    - Multiple years of experience on Service Oriented and
      Microservices architectures, including REST and GraphQL
      implementations
  - Full Stack Proficiency: Demonstrated ability to design,
    develop, and maintain both front-end and back-end
    components of robust web applications.
  - Front-End Development: Strong expertise in developing
    intuitive user interfaces using contemporary JavaScript
    frameworks (e.g., React), HTML5, and CSS.
  - Back-End Development: Solid experience in developing server-
    side logic and APIs using languages such as Java, Python,
    or similar.
  - Database Expertise: Comprehensive knowledge of SQL and
    PL/SQL, with a deep understanding of Relational Database
    Management Systems (RDBMS), particularly Oracle.
  - API Development: Proven capability in designing, developing,
    and implementing high-performance RESTful APIs leveraging
    appropriate frameworks and technologies.
  - CI/CD and DevOps:
    - Proficiency with Continuous Integration/Continuous
      Deployment (CI/CD) pipelines and tools for building
      (e.g., Maven, Gradle) and deploying code (e.g., Docker,
      Jenkins, OpenShift).
    - Experience with AWS is considered a significant advantage.
  - Agile Methodologies: Practical experience working within
    Agile development methodologies and utilizing project
    management tools such as JIRA.
  - Testing Automation: Ability to develop and automate
    comprehensive unit, integration, and end-to-end tests to
    ensure code quality.
  - Version Control: Solid understanding and practical
    experience with code versioning tools, including GitHub
    Enterprise.

  Education:

  - A bachelor’s degree in computer science, Software
    Engineering, or a related field is required.

