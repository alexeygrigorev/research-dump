  Job Description - JR0026533 Sr Software Dev Engineer


  A Lot About You


  We are seeking a highly skilled Senior Software Development
  Engineer to join our Developer Experience team and play a
  critical role in maintaining and advancing Yahoo’s developer
  platforms and tools. The team provides company-wide source
  code management through GitHub Enterprise and GitLab
  Enterprise, manages access to AI programming tools including
  Claude, Cursor, and GitHub Copilot, and supports core
  language environments used across Yahoo.


  This role will primarily own Yahoo’s enterprise Node.js
  development environment, including the runtimes, packages,
  container images, reusable CI/CD workflows, and internal-
  library integrations that engineering teams rely on. You
  will keep this ecosystem current, secure, reliable, and easy
  to use while improving its automation, testing,
  documentation, and long-term maintainability. You will also
  contribute to the team’s broader source code management, AI
  tooling, and developer experience responsibilities.


  Responsibilities

  - Own the lifecycle of Yahoo’s supported Node.js runtimes,
    including adopting new releases and retiring end-of-life
    versions.
  - Build and maintain Node.js packages, container images,
    internal-library integrations, and automated release
    pipelines.
  - Develop and support reusable CI/CD and GitHub Actions
    workflows for Node.js applications and libraries.
  - Monitor upstream releases, security updates, and dependency
    changes, translating them into timely platform updates.
  - Troubleshoot complex runtime, build, packaging, container,
    and dependency issues affecting engineering teams.
  - Automate platform maintenance, testing, release validation,
    and other recurring operational work.
  - Partner with security, operating system, container, CI/CD,
    and application teams on platform changes and migrations.
  - Support the team’s GitHub Enterprise and GitLab Enterprise
    services and develop tools that improve the source code
    management experience.
  - Use and help integrate AI programming tools such as Claude
    AI and Claude Code, Cursor, and GitHub Copilot to improve
    engineering productivity and automate development
    workflows.
  - Document platform operations and clearly communicate
    releases, migrations, deprecations, and required actions
    to internal users.

  Qualifications

  - Strong software development skills in Node.js and JavaScript
    or TypeScript; experience with Python, Go, or other
    programming languages is a plus.
  - Experience building or maintaining shared developer
    platforms, runtime environments, or infrastructure used by
    multiple engineering teams.
  - Strong Linux, container, and CI/CD experience, including
    build automation and system troubleshooting.
  - Familiarity with Git, GitHub, GitLab, and modern source code
    management practices.
  - Working knowledge of AI programming tools such as Claude AI
    and Claude Code, Cursor, or GitHub Copilot, with the
    ability to use them effectively in software development
    and automation.
  - Experience managing software releases, dependencies,
    security updates, and supported-version lifecycles.
  - Experience with RPM packaging, enterprise Linux, native
    Node.js addons, or compiling language runtimes from source
    is preferred.
  - Strong problem-solving, communication, and documentation
    skills, with the ability to collaborate effectively across
    teams.
  - Bachelor’s degree or equivalent work experience.

