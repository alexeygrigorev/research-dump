description: |
  Daintta are a rapidly growing, values-driven team of
  specialists who work with government clients across Cyber
  Security, National Security, Law Enforcement and
  Telecommunications. We are seeking a talented and motivated
  Embedded Software Engineer to join our team and contribute
  to our mission of protecting the UK through data-driven
  insights and solutions. As an Embedded Software Engineer,
  you will work closely with our public sector clients and
  project teams to design, develop, and implement embedded
  software solutions that meet our clients’ requirements.

  Key Responsibilities

  - Design, develop, and implement high-quality embedded
    software solutions using industry best practices and
    coding standards
  - Develop clean, efficient, and well documented code, ensuring
    code quality through testing, debugging, and code reviews
  - Stay up to date with the latest trends, tools, and
    technologies in embedded software engineering and share
    your knowledge with the team
  - Collaborate with cross-functional teams and clients to
    gather project requirements, analyse feasibility, provide
    technical recommendations, and contribute to project
    planning
  - Collaborate with project managers to ensure successful
    project delivery within the defined timelines and budget
  - Accurately deliver high quality work to agreed timelines and
    requirements, including taking the initiative on the most
    complex problems in a project
  - Supporting client engagements, including pitches and
    presentations
  - Helping to support & grow Daintta by actively inputting into
    the company strategy and helping to shape our future
  - Representing us and our core values: Transparent, Fair and
    Daring

    Skills / Knowledge

  Essential

  The role requires the following key skills / knowledge, non-
  exhaustively:

  - Bachelor’s degree in computer science, software engineering,
    electronic and electrical engineering or related field
  - Professional experience as an embedded software engineer,
    preferably in a consultancy or industry setting
  - Proven experience developing firmware or low-level drivers
    in resource-constrained environments.
  - Expertise of system programming languages (C, C++, Rust,
    Ada) and experience managing memory allocation, threading,
    and real-time constraints.
  - Strong background in Unix/Linux operating systems, including
    kernel interaction or usage of RTOS
  - Hands-on experience with build systems (CMake, Bazel) and
    testing frameworks (e.g. Google Test).
  - Practical knowledge of modern software development
    methodologies (Agile, Scrum) and applying iterative design
    principles in conjunction with the client
  - Excellent problem-solving and analytical skills, with the
    ability to find innovative solutions to complex technical
    challenges
  - Strong communication, presentation, and interpersonal skills
    to effectively interact with clients and team members
  - Ability to adapt to new technologies and learn quickly in
    fast-paced environments
  - A passion for delivering high quality software solutions
    that meet client expectations
  - Knowledge of software security principles and best practices

  Desirable

  The following key skills are desirable, non-exhaustively:

  - Experience with a non-system language, including Python,
    Java or similar
  - Knowledge of database systems and proficiency in database
    query languages/tools
  - Familiarity with Continuous Integration/Continuous
    Deployment (CI/CD) pipelines, containerization (Docker),
    and automated testing workflows.
  - Experience with cloud platforms such as AWS, Azure or Google
    Cloud
  - Experience with FPGAs including development using VHDL or
    Verilog
  - Experience with RF, including SDRs

  Location?

  Hybrid, with 2-3 days working from Daintta office (London or
  Cheltenham) or on client site as required.

  What’s in it for you?

  You will be joining the company at Daintta "Consultant"
  grade. In addition to being rewarded fairly for your
  contribution to the business, you get to work in a dynamic
  organisation that is agile and responsive. A business that
  is growing fast and where you get to drive and shape the
  future. A place where you are respected by everyone and your
  voice is important. Somewhere where you can be innovative
  and creative. A place where you have the opportunity to
  learn about all aspects of business from marketing to sales,
  to delivery and business operations.

  Benefits

  We believe in supporting our people both professionally and
  personally. Here’s what you can expect when you join us:

  Time Off:

  - 25 days annual leave, plus bank holidays
  - Up to 5 days annual training leave with a dedicated training
    budget
  - Up to 3 days annual volunteering leave - give back to the
    community
  - Competitive maternity, paternity, shared parental leave &
    compassionate leave

  Health & Wellness:

  - Comprehensive Private Health Insurance
  - Employee Assistance Programme - 24/7 support services
  - £2,000 Flex Cash Allowance, paid pro-rata over the year

  Financial Benefits:

  - 5% pension contribution
  - Discretionary company awards and bonuses, based on
    performance and company targets

  Professional Development

  - Up to £1,000 annual training budget (access to additional
    training and development budget via business case)
  - Up to 5 days annual training leave
  - 1 professional membership paid annually
  - Up to £200 of additional IT budget for new joiners

  Perks

  - Free breakfast every Tuesday in the London office
  - Fortnightly drinks – in London
  - Regular social events, quizzes, and guest workshops
  - Huckletree perks – including gym and restaurant discounts
  - Employee referral programme
  - Monthly breakfast club in our Cheltenham office

  Security Information

  Due to clients’ requirements, all applications are strictly
  subject to security clearance requirements relevant to the
  role.
