description: |
  As a Senior Python Software Engineer, you will:

  - Design, develop, and maintain scalable, secure, and high-
    quality Python applications following modern software
    engineering best practices.
  - Build clean, maintainable, and reusable software components
    using object-oriented programming (OOP) principles and
    clean architecture.
  - Develop and optimize enterprise applications with a strong
    focus on code quality, performance, scalability, and
    maintainability.
  - Design, implement, and manage CI/CD pipelines using Azure
    DevOps and Azure Release Pipelines to support automated
    software delivery.
  - Collaborate with cross-functional Agile teams to deliver
    reliable software solutions aligned with business and
    technical objectives.
  - Utilize Docker to develop, package, and deploy containerized
    applications across development and production
    environments.
  - Manage source code, branching strategies, and collaborative
    development workflows using Git.
  - Leverage AI-assisted development tools responsibly to
    improve productivity, code quality, testing, and software
    maintainability while ensuring secure and compliant usage.
  - Review, validate, and critically evaluate AI-generated code
    recommendations before integrating them into production
    systems.
  - Participate in architecture discussions, technical design
    reviews, and continuous improvement initiatives across the
    software development lifecycle.
  - Troubleshoot complex production issues, perform root cause
    analysis, and implement long-term solutions.
  - Mentor team members, contribute to engineering best
    practices, and promote a culture of technical excellence
    and continuous learning.

  What You Bring to the Table:

  - 8+ years of experience in Software Engineering, including 3+
    years of hands-on Python development experience.
  - Strong expertise in Python and modern software engineering
    principles.
  - Solid understanding of Object-Oriented Programming (OOP),
    inheritance, design patterns, and clean coding practices.
  - Hands-on experience with Azure DevOps, Azure Release
    Pipelines, and cloud-based development environments.
  - Experience working with Docker and containerized application
    development.
  - Strong proficiency with Git and modern version control
    workflows.
  - Experience working in Agile and DevOps delivery
    environments.
  - Knowledge of cloud fundamentals and modern software
    deployment practices.
  - Experience using AI-assisted development tools responsibly,
    with the ability to assess AI-generated code for quality,
    security, and compliance.
  - Strong analytical, troubleshooting, and problem-solving
    skills.
  - Excellent communication, collaboration, stakeholder
    management, and leadership abilities.
  - Fluent English communication skills.

  You Should Possess the Ability to:

  - Design and develop scalable, maintainable, and secure Python
    applications.
  - Build automated software delivery pipelines using Azure
    DevOps and CI/CD best practices.
  - Apply clean architecture, design patterns, and software
    engineering principles to enterprise applications.
  - Work independently, take ownership of technical solutions,
    and drive initiatives to completion.
  - Critically evaluate AI-assisted development outputs and
    apply them responsibly in software engineering workflows.
  - Troubleshoot complex technical issues and perform effective
    root cause analysis.
  - Collaborate effectively with developers, architects, DevOps
    engineers, and business stakeholders.
  - Continuously improve engineering practices, software
    quality, and development productivity.

  What We Bring to the Table:

  - Opportunity to work on enterprise-scale software engineering
    and digital transformation initiatives.
  - Exposure to modern cloud technologies, DevOps practices, and
    AI-assisted software development.
  - Collaborative environment with experienced engineers,
    architects, and product teams.
  - Challenging projects focused on innovation, automation,
    software quality, and continuous improvement.
  - Opportunities for technical leadership, professional
    development, and career advancement.
  - A culture that values ownership, collaboration, innovation,
    and engineering excellence.

