description: |
  About the role

  This role is going to be working on the open source Doppler
  SDK and Indexer.

  Responsibilities

  - Implementing - new SDK and Indexer features
  - Testing - automate backend testing alongside a release
    pipeline
  - Support - helping applications and protocols integrate the
    SDK and Indexer
  - Shipping - overseeing successful production releases with
    release notes and versioning

  What we're looking for

  Ideally are experienced implementing and delivering highly
  reliable and scalable backend data services. You are deeply
  familiar with TypeScript and GraphQL. You have an
  understanding of the blockchain industry and the
  difficulties of managing multichain indexer deployments. You
  know that testnet faucets are frustrating to deal with and
  have clever solutions for testing across all various
  configurations that users may end up deploying. You have
  experience contributing to and managing open source software
  projects external teams rely on in production. You like
  helping others solve their problems with novel solutions and
  are a great communicator.

  About Whetstone Research

  Whetstone Research is focused on designing and building new
  protocols that accelerate the future of onchain markets. The
  team is less than 10 people with deep hands on experience in
  the blockchain industry; previously at Uniswap, Primitive,
  Aztec, and numerous others. We are working on Doppler, a
  hyper-efficient price discovery and liquidity bootstrapping
  Protocol built on the EVM, used by Zora and others. Learn
  more about Whetstone on our website or read our blog.
