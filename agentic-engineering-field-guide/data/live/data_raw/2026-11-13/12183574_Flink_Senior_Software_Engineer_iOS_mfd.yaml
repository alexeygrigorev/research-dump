description: |
  Company Description

  Launched in 2021 with a simple yet bold mission, Flink set
  out to give people back their most valuable resource: time.
  We didn't just join the quick commerce race, we defined its
  potential. By enabling customers to order from a curated
  selection of over 3,000 groceries and household essentials
  through our user-centric app, we deliver what people need in
  minutes. We have fundamentally shifted the retail landscape
  across Germany and the Netherlands, while embedding
  sustainability into our core through an all-electric
  delivery fleet, recyclable packaging, and a focus on
  reducing food waste.

  Today, Flink has evolved from a disruptive startup into a
  resilient and sustainable powerhouse. In an industry defined
  by rapid change, we’ve mastered the balance of hyper-
  efficiency and massive scale. With a network of more than
  160 hubs, we now bring the Flink experience to more than 22
  million people, making us an integral part of the urban
  infrastructure. This impact is driven by a dedicated team of
  more than 10,000 colleagues, including a fully employed
  rider fleet that serves as the backbone of our operations.
  By generating over €550m in revenue in 2025, we have proven
  that our model is not only desirable but financially
  formidable.

  Having built a proven foundation, we are now shifting from
  establishing our presence to accelerating our impact. Backed
  by prestigious partners like Prosus, Mubadala, Bond,
  DoorDash, Btomorrow Ventures and REWE, and fueled by fresh
  investment, we are entering our next major growth phase. We
  are thinking bigger, expanding our footprint, and refining
  every link in our value chain.

  Our culture is defined by a shared bias for action and the
  commitment to being 1% better every day. We take ownership,
  stay close to the frontline, and support one another to
  ensure we never let another Flinker fail. We celebrate
  diversity and believe that our multicultural team is our
  greatest competitive advantage.

  As Senior Software Engineer - Mobile (iOS) on the Order
  Fulfillment squad, you will build and own the iOS side of
  our rider app, the tool riders use to pick up and deliver
  orders. You will work end to end on features, from the UI to
  the integration with our backend services, together with
  Android, backend and web engineers and a product manager.
  The Order Fulfillment squad owns the part of Flink where an
  order gets from the hub to the customer. Our work covers the
  flows that riders and hub staff depend on every day:
  fulfilment and pickup, rider quality and feedback, and the
  operational tooling around them. You will be the main iOS
  engineer on the squad, so you will shape how we build, test
  and release on the platform. We use Kotlin Multiplatform for
  shared logic between iOS and Android, so you will work
  closely with Android engineers on a shared module, and you
  will build the native UI on top of it in Swift. We care
  about quality and care about production: you will test
  thoroughly, run bug bashes, and help support the app in
  production, including on-call. We work with coding agents in
  our day-to-day, and we want an engineer who is curious about
  using them to move faster without cutting corners. We are
  looking for an engineer who goes deep on iOS, enjoys working
  with the people around them, and takes ownership from
  discovery through release.

  Job Description

  - Help the team with feature development and maintenance
    across Flink's arsenal of mobile applications;
  - Work End to End: Take features from prototype through
    technical design, implementation, release and production
    monitoring. You build it, you own it.
  - Engineer with Agents: Use coding agents such as Claude Code
    for writing, testing, reviewing and porting code. Improve
    the agent instructions and skills in our repositories so
    the whole team gets better results.
  - Taking part in the discussion and planning of new features;
  - Closely collaborate with other teams to deliver value to the
    end user;
  - Raise the Quality Bar: Lead code reviews, write unit and UI
    tests (we use XCTest and Maestro), and keep our CI and
    release process healthy. Help your team get 1% better
    every day.
  - Protect Sensitive Data: Follow secure coding practices for
    personal data, and fix vulnerabilities quickly.
  - Ensure the best possible application performance and
    reliability of the applications on a range of devices;
  - Contribute actively to the iOS release process.

  Qualifications

  - Native mobile engineer with hands-on experience in building
    iOS applications in Swift, and a strong knowledge of iOS
    mobile development (SwiftUI, UIKit, Foundation), protocol-
    oriented programming in Swift;
  - Hands-on experience working on a large code base and
    applying design patterns other than  MVC (MVVM);
  - Open, communicative team player who loves to solve
    interesting, complex problems and can work on problems
    until they are solved;
  - Experience with CI/CD (Bitrise) and release process (Runway)
    is a plus;
  - Passion for well-structured, readable, and testable code
    (experience in functional programming is a plus);
  - You thrive in a place where you can really innovate, grow,
    and take ownership - and of course, never let another
    teammate fail.
  - Works with AI coding tools: You have used coding agents such
    as Claude Code, Cursor, Codex or GitHub Copilot, and you
    want them to be a central part of how you work. You know
    what to hand over to an agent, and you check the result
    before it ships.
  - Knowledge of Kotlin and KMP is a plus.

  Additional Information

  For this role as Senior Software Engineer (m/f/d), the
  starting remuneration is as follows:

  - Base pay: €80,000 to €100,000.00 gross/annually, full-time
    (40 hours per week)
  - VSIPs: (10 %) annual allotment

  Cash and Non-cash Benefits:

  - A €1000 annual L&D budget as well as individual coaching
    options to ensure you have plenty of opportunities to
    learn, grow and achieve your goals
  - 26 days of vacation, +1 day every year up to a maximum of 30
    days
  - A mobility budget of 35 EUR per month for Deutschland Ticket
    subsidy
  - A discount on your Urban Sports Club membership
  - Attractive company pension options
  - Unlimited access to an e-learning and development platform,
    MyAcademy, including online German courses
  - Online discounts with Corporate Benefits and Future Bens
  - A cool discount off your personal Flink orders; be the first
    to test out new products!
  - A modern and dog-friendly office in the heart of Berlin -
    lots of delicious lunch spots available within short
    walking distance

  For this role as Senior Software Engineer iOS (m/f/d), the
  following provisions of the collective agreement EU Pay
  Transparency Directive apply: Directive (EU) 2023/970.

  It is our commitment that every applicant will be evaluated
  according to their skills regardless of age, gender
  identity, ethnicity, sexual orientation, disability status,
  or religion
