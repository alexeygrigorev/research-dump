  Job Summary

  We are seeking a highly skilled Full Stack Website Developer
  based in the United States to manage and execute all aspects
  of website and CRM development. This role is ideal for
  someone with strong technical expertise across WordPress,
  Shopify, and CRM platforms such as HubSpot and HighLevel,
  who thrives in a fast-paced environment and takes pride in
  delivering high-quality work on time.

  You will be responsible for building, optimizing, and
  maintaining websites and CRM systems that directly impact
  marketing performance, lead generation, and sales
  operations.

  Key Responsibilities

  - Build, customize, and maintain high-performing websites
    using WordPress and Shopify
  - Develop and manage CRM builds and automations using HubSpot,
    HighLevel, and related tools
  - Ensure websites are responsive, SEO-optimized, and
    conversion-focused
  - Integrate CRM systems with websites, landing pages, and
    marketing automation tools
  - Manage technical implementations end-to-end — from planning
    to deployment
  - Deliver projects on time with strong attention to detail and
    quality standards
  - Troubleshoot and resolve technical issues efficiently
  - Collaborate with marketing and sales teams to optimize
    funnels and customer journeys
  - Maintain documentation and ensure scalable system
    architecture

