description: |
  About Mesh

  At Mesh, our mission is to enable consumers to pay and be
  paid with any asset. Today, trillions of dollars in
  tokenized assets exist but remain largely unusable for
  everyday commerce. Mesh is bridging this gap by making
  crypto payments reliable, useful, and ubiquitous. We combine
  a powerful orchestration engine with a seamless consumer app
  to unlock liquidity for the world. Backed by leading
  investors like SBI, Money Forward, Paradigm, Dragonfly,
  Galaxy, and PayPal Ventures, we are building the
  infrastructure for the next era of the global economy. Join
  us!

  Overview

  We are seeking an experienced Senior Software Engineer with
  a strong background in backend engineering. As a member of
  our team, you will play a crucial role in designing,
  developing, and maintaining our innovative software
  solutions. You will work closely with the Engineering and
  Product teams spread across North America, Europe and India.

  What You'll Do

  - Develop and maintain backend services and APIs
  - Work closely with Azure cloud services for deployment and
    scalability
  - Conduct thorough testing, debugging, and prompt resolution
    of software defects
  - Stay up-to-date with industry trends and emerging
    technologies
  - Contribute to code reviews, architectural decisions, and
    system design
  - Create high-quality, efficient, and reliable code following
    best practices
  - Optimize performance and scalability of backend systems for
    handling large data volumes
  - Stay updated on the latest trends and technologies in
    fintech/crypto and backend development
  - Build crypto first and secure products to facilitate
    traditional financial activity, such as payments,
    transfers etc.

  Who You Are

  - 5-7+ years of professional experience as a backend Software
    Engineer, preferably in the fintech/crypto industry
  - Strong proficiency in backend programming languages such as
    C#, Java, Scala, Go, etc.
  - A security first mindset: with good knowledge of common
    security concepts such as AuthN, AuthZ, SAML, API
    security, encryption etc.
  - An understanding of crypto concepts such as blockchains,
    RPCs, self custody wallets etc.
  - Solid understanding of RESTful API design principles and
    microservices architecture
  - Familiarity with cloud platforms such as Azure
  - Knowledge of DevOps practices and CI/CD pipelines
  - Excellent communication and collaboration abilities

  The compensation range provided may span multiple career
  levels and will be narrowed during the interview process
  based on factors including a candidate's experience, skills,
  qualifications, and geographic location. For candidates
  outside of New York or San Francisco, compensation will be
  adjusted to reflect the applicable market and location-based
  pay band. The base salary range listed excludes commission
  (if applicable), equity, and benefits. The pay range
  represents the minimum and maximum target for new-hire
  compensation. Actual compensation may vary and may be higher
  or lower depending on individual circumstances.

  Pay Range

  $180,000—$200,000 USD

  Why You’ll Love It Here

  At Mesh, you're not stepping into a typical role—you're
  joining a rocket ship in mid-liftoff. You'll tackle complex,
  meaningful problems that actually move an industry forward,
  working alongside a sharp, motivated team that moves
  quickly, collaborates deeply, and expects everyone to
  operate with ownership. This is the kind of place where
  you'll see your work ship fast, make real impact, and be
  able to point to something and say, "I built that." You'll
  grow fast, level up your skills, and get a front-row seat to
  how a high-growth company scales from the inside, with
  competitive comp, solid benefits, and room to stretch your
  craft all coming standard. If you're energized by building,
  learning, and shaping something big—this is where you'll
  want to be.

  In-Office Expectations

  Employees based in our San Francisco, New York, and
  Bangalore hubs are expected to work from the office at least
  40% of the time (approximately two days per week). This
  expectation may vary slightly depending on role, team, and
  business needs. Certain roles that require closer cross-
  functional collaboration or operational support may have
  additional in-office requirements, which will be discussed
  during the interview process. Our hybrid approach is
  designed to balance meaningful in-person collaboration, team
  building, and real-time decision-making with the flexibility
  to work remotely. We believe this structure supports strong
  execution while preserving autonomy and focus time.

  How We Care For Our Team

  We believe great work happens when people feel valued and
  supported. That starts with competitive salary and equity
  that grows as you and the company grow, plus comprehensive
  health coverage for you and your family. We offer unlimited
  PTO—and we mean it. Take the time you need to recharge and
  show up at your best.

  We're invested in your growth with a dedicated budget for
  courses, conferences, and certifications. Work from wherever
  you're most productive with our remote-friendly approach,
  and count on having the top-tier tools and equipment you
  need to do exceptional work.

  Mesh Pay is committed to equal employment opportunities
  regardless of race, color, genetic information, creed,
  religion, sex, sexual orientation, gender identity, lawful
  alien status, national origin, age, marital status, and non-
  job related physical or mental disability, or protected
  veteran status. Pursuant to the San Francisco Fair Chance
  Ordinance, we will consider for employment qualified
  applicants with arrest and conviction records.
