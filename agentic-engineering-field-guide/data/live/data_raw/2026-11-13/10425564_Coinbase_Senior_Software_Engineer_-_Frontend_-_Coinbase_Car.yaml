  Frontend Software Engineer - Coinbase Card Team

  As a Frontend Software Engineer on the Coinbase Card team
  within the Consumer Product Group, you'll build and ship the
  user-facing experiences behind Coinbase's card products,
  including the Coinbase One Card (credit) and the Coinbase
  Card (debit). This team is consolidating both products onto
  a unified card platform, and you'll join a small team with
  high ownership, greenfield feature work, and direct impact
  on how millions of customers discover, activate, and use
  their cards.

  What you’ll do:

  - Own end-to-end frontend development for core card
    experiences, including transactions, rewards, onboarding,
    and account management across web and mobile
  - Build new user-facing features - such as authorized card
    users, reward offers, real-time transaction status
    trackers
  - Partner with product, design, and backend engineering to
    scope, prioritize, and ship projects that reduce CX
    contact rates and improve the customer experience
  - Identify and resolve frontend performance bottlenecks across
    card UX journeys, driving measurable improvements in CUJ
    latency and availability SLOs

  Required skills and experience:

  - 5+ years of software engineering experience with deep
    expertise in React and React Native
  - Proven track record of shipping consumer-facing products
    end-to-end in a high-scale environment, with a focus on
    performance, reliability, and user experience
  - Experience owning SLOs and driving measurable improvements
    in latency and availability for user-facing flows
  - Demonstrated ability to mentor junior engineers and operate
    as a senior technical voice on a team of mixed levels
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality

  Pay Transparency Notice: Base salary varies by location (see
  range below). Total compensation may also include equity and
  bonus eligibility, and benefits (medical, dental, vision,
  401(k)).

  Annual base salary range (excluding equity and bonus):

  $186,065—$218,900 USD

