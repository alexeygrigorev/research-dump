description: |
  We are looking for an experienced Senior Frontend Developer
  to maintain, optimize, and continuously improve our company
  website. The ideal candidate should have strong frontend
  development skills, a keen eye for detail, and the ability
  to ensure our website remains fast, responsive, secure, and
  user-friendly.

  Responsibilities

  - Maintain, update, and improve the company website.
  - Develop new frontend features and implement design
    improvements.
  - Ensure responsive design and cross-browser compatibility.
  - Optimize website performance, loading speed, and SEO.
  - Identify and fix bugs and technical issues.
  - Collaborate with the design, marketing, and backend teams
    when needed.
  - Follow frontend best practices and maintain clean, scalable
    code.

  Requirements

  - Proven experience as a Senior Frontend Developer or in a
    similar role.
  - Strong proficiency in HTML, CSS, and JavaScript/TypeScript.
  - Experience with modern frontend frameworks such as React,
    Next.js, or Vue.js.
  - Good understanding of responsive design, web performance,
    and accessibility.
  - Experience with Git and frontend development workflows.
  - Strong problem-solving skills and attention to detail.
  - Ability to work independently and take ownership of website
    maintenance.

  What We’re Looking For

  Someone proactive, reliable, and detail-oriented who can
  take ownership of our website, keep it running smoothly, and
  help us continuously improve its performance and user
  experience.

  How to Apply

  If you are interested, please send us your CV, portfolio,
  and links to websites or projects you have worked on.

  We look forward to hearing from you!
