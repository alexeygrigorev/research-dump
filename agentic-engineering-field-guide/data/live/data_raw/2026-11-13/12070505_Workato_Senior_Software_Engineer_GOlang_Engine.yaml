description: |
  About Workato

  Workato is the leading Control and Execution Platform for
  Enterprise AI — the neutral platform enterprises trust to
  put AI to work across their business. Workato unifies data,
  applications, and processes into a single platform so AI can
  reliably orchestrate business processes in production at
  enterprise scale. Built on more than a decade of running
  mission-critical processes for over half the Fortune 500 —
  including Nasdaq, Amazon, Cisco, Vodafone, Atlassian, and
  Lucid Motors — Workato turns over 14,000 enterprise systems
  AI needs to act on into one governed execution layer. For
  more information, visit workato.com.

  Why join us?

  Ultimately, Workato believes in fostering a flexible, trust-
  oriented culture that empowers everyone to take full
  ownership of their roles. We are driven by innovation and
  looking for team players who want to actively build our
  company.

  But, we also believe in balancing productivity with self-
  care. That’s why we offer all of our employees a vibrant and
  dynamic work environment along with a multitude of benefits
  they can enjoy inside and outside of their work lives.

  If this sounds right up your alley, please submit an
  application. We look forward to getting to know you!

  Also, feel free to check out why:

  - Business Insider named us an “enterprise startup to bet your
    career on”
  - Forbes’ Cloud 100 recognized us as one of the top 100
    private cloud companies in the world
  - Deloitte Tech Fast 500 ranked us as the 17th fastest growing
    tech company in the Bay Area, and 96th in North America
  - Quartz ranked us the #1 best company for remote workers

  Responsibilities

  The Engine team develops and maintains core components of
  the Workato Recipe runtime. Scope includes recipe execution,
  DSL, event pulling, webhook processing, and job execution.
  The team owns trigger and event infrastructure that defines
  how integrations start and react to external events. Current
  focus: modernization of a high-throughput platform to
  improve reliability, scalability, and long-term
  evolvability. Work is platform-oriented and directly impacts
  runtime performance and system correctness.

  In this role, you will also be responsible to:

  - Design and implement distributed backend systems in Go with
    deep consideration of performance and memory behavior.
  - Work on runtime-level components operating under high
    concurrency and throughput.
  - Apply in-depth knowledge of Go internals (scheduler, memory
    model, garbage collection behavior) to improve system
    efficiency.
  - Design and optimize concurrent workflows using goroutines,
    channels, synchronization primitives, and context
    propagation.
  - Analyze and optimize slice usage, memory allocations, and
    data structures for performance-critical paths.
  - Improve execution engine for custom third-party code
    (isolation, performance, feature extensions).
  - Modernize runtime components with focus on modularity,
    structured architecture, and observability.
  - Improve trigger configuration and execution across webhooks
    and polling mechanisms.
  - Integrate and optimize data storage solutions (Postgres, S3,
    DynamoDB, Kafka, ClickHouse).
  - Identify bottlenecks, race conditions, deadlocks, and
    performance degradation in distributed systems.
  - Own initiatives end-to-end, from design to rollout and
    production support.
  - Conduct code reviews with emphasis on correctness,
    concurrency safety, and performance characteristics.

  RequirementsQualifications / Experience / Technical Skills

  - Strong experience in building scalable distributed backend
    applications (7+ years).
  - Great understanding of all building blocks of large web
    applications: databases, load balancers, application
    servers, message brokers, caching, monitoring, etc.
  - Good understanding of network protocols and stacks.
  - Good understanding of DB technologies: classic databases and
    modern no-SQL.
  - Knowledge of basic data structures and algorithms and how
    they are used is a must.
  - Multilingual programming experience: our code base is
    primarily in Ruby, with trend to migrate to GOlang and
    Rust.
  - Excellent debugging, analytical, problem solving, and social
    skills.
  - BS/MS degree in Computer Science, Engineering or a related
    subject, 7+ years of industry experience.
  - Readiness to work remotely with teams distributed across the
    world and timezones.

  Nice to Haves

  - Background in network programming.
  - Background in application, data security.
  - Deep knowledge of physical DB design.
  - Experience of working with Docker and other isolation
    technologies.
  - Experience of working with public cloud infrastructure
    providers(AWS/Azure/Google Cloud).
  - Experience in related fields (DevOps, ML, DBA, Enterprise
    applications, etc).
  - Experience in building/deploying data processing pipelines
    is a plus.
  - Experience of working with third-party REST APIs at scale
    (request throttling, batch processing etc).

