description: |
  About the company

  Our client is a healthcare company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Own the design, speed and quality of user-facing interfaces
  for a web app and website, working with a small engineering
  group on client-side architecture. The role calls for deep
  frontend specialization alongside enough backend knowledge
  to collaborate across the full stack. Scope is broad, and
  the work is shaped by direct feedback from internal users
  and a growing product group.

  What you'll do

  - Own the look, feel and accessibility of a web app and
    website.

  - Build an information-rich internal tool that presents the
    right details to staff at the right moment.

  - Partner with backend and AI engineers to turn new
    capabilities and third-party integrations into user-facing
    features.

  - Guide how the client-side codebase is organized, from
    reusable component libraries and data handling to test
    coverage and load speed.

  - Iterate quickly on feedback from internal users and cross-
    functional partners.

  Requirements

  What we're looking for

  - Five-plus years delivering end-user web interfaces in live
    products.

  - Track record of shipping interfaces that real customers use,
    rather than storefronts, B2B tools or internal tools.

  - Bachelor's degree.

  - Advanced command of JavaScript-based web development and
    component-driven UI frameworks.

  - Advanced skill in stylesheets, motion design and component
    systems.

  - Working knowledge of the full stack alongside clear frontend
    specialization.

  - Experience at an early-stage, high-growth company.

  Bonus points

  - Exposure to machine learning and large language model
    features in software products.

  - Experience at a healthcare or regulated-industry startup.

  Benefits

  Compensation and benefits

  - Base salary: USD 190K to 220K per year

  - Equity

  - Health, dental and vision coverage

  - Retirement plan

  Location and work model

  - New York, NY, United States

  - Hybrid, number of in-office days not specified

  - Full-time
