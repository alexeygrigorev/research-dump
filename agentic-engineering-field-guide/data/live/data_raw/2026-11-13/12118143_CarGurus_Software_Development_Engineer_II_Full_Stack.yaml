description: |
  Who we are At CarGurus (NASDAQ: CARG), our mission is to
  give people the power to reach their destination. We started
  as a small team of developers determined to bring trust and
  transparency to car shopping. Since then, our history of
  innovation and go-to-market acceleration has driven
  industry-leading growth. In fact, we're the largest and
  fastest-growing automotive marketplace, and we've been
  profitable for over 15 years. What we do The market is
  evolving, and we are too, moving the entire automotive
  journey online and guiding our customers through every step.
  That includes everything from the sale of an old car to the
  financing, purchase, and delivery of a new one. Today, tens
  of millions of consumers visit CarGurus.com each month, and
  ~30,000 dealerships use our products. But they're not the
  only ones who love CarGurus-our employees do, too. We have a
  people-first culture that fosters kindness, collaboration,
  and innovation, and empowers our Gurus with tools to fuel
  their career growth. Disrupting a trillion-dollar industry
  requires fresh and diverse perspectives. Come join us for
  the ride! Role overview The Dealer team at CarGurus is
  looking for a Software Engineer II to advance our Inventory
  products. This role involves transforming CarGurus market
  data into impactful experiences for dealers. As we develop
  brand-new dealer-facing inventory products from scratch, you
  will have extensive opportunities to work across the entire
  technical stack. Success in this position requires the
  ability to adapt swiftly and work harmoniously within a
  cross-functional environment. What you'll do

  - Develop and deploy clean, well-tested and efficient code,
    ensuring high standards of architecture, quality and
    performance
  - Provide support and improvements to core systems while
    maintaining high standards for internal stakeholder teams
  - Integrate modern AI tools into your development pipeline to
    boost productivity, troubleshoot efficiently, and stay at
    the forefront of engineering workflows
  - Collaborate with cross-functional teams, including data
    scientists and product managers, to guide projects from
    concept through technical design, implementation, quality
    testing, and performance measurement


  What you'll bring

  - 2-5 years of hands-on software development experience in a
    professional setting
  - Proficiency in React and Javascript fundamentals
  - Proficiency in Java and SQL
  - Experience and/or interest in leveraging AI coding tools
  - Practical knowledge of distributed systems and microservice
    architecture design
  - A strong understanding of data structures, algorithms and
    complexity analysis
  - Ability to iterate and ship ideas quickly in collaboration
    with your peers
  - Curiosity and a passion for learning new technologies and
    concepts quickly

  The displayed range represents the expected annual base
  salary / On-Target Earnings (OTE) for this position. On-
  Target Earnings (OTE) is inclusive of base salary and on-
  target commission earnings, which applies exclusively to
  sales roles. Individual pay within this range is determined
  by work location and other factors such as job-related
  skills, experience, and relevant education or training. This
  annual base salary forms part of a comprehensive Total
  Rewards Package. In addition to benefits, this role may
  qualify for discretionary bonuses/incentives and Restricted
  Stock Units (RSUs). Position Pay Range $112,000 - $141,000
  USD Working at CarGurus We reward our Gurus' curiosity and
  passion with best-in-class benefits and compensation,
  including equity for all employees, both when they start and
  as they continue to grow with us. Our career development and
  corporate giving programs, as well as our employee resource
  groups (ERGs) and communities, help people build connections
  while making an impact in personally meaningful ways. A
  flexible hybrid model and robust time off policies encourage
  work-life balance and individual well-being. Thoughtful
  perks like daily free lunch, a new car discount, meditation
  and fitness apps, commuting cost coverage, and more help our
  people create space for what matters most in their personal
  and professional lives. CarGurus may require in-person
  interviews as part of our hiring process, particularly for
  positions based in our Boston and Dublin offices. Candidates
  selected for an in-person interview will be notified in
  advance. Please be aware that travel expenses are the
  responsibility of the candidate. We welcome all CarGurus
  strives to be a place to which people can bring the ultimate
  expression of themselves and their potential-starting with
  our hiring process. We do not discriminate based on race,
  color, religion, national origin, age, sex, marital status,
  ancestry, physical or mental disability, veteran status,
