description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Consumer Intelligence & Engagement
  organisation responsible for delivering the intelligence and
  engagement capabilities that enable more relevant and
  personalised consumer experiences across digital channels.
  The organisation plays a key role in how consumers discover
  products, engage with content, and elevate experiences
  through membership & loyalty. Through capabilities such as
  personalisation, recommendations, consumer intelligence,
  experimentation, and AI-driven decisioning, the organisation
  helps deliver more contextual, data-driven interactions
  across the consumer journey.

  As a Software Engineer (Full Stack), you will build backend
  services membership and loyalty capabilities as well as
  frontend applications. You will be responsible for technical
  design, development and validation. Working closely with the
  Lead Engineer, Product Owner and Engineering Manager, you
  will deliver low latency services that support real-time
  consumer experiences. You will also build reusable assets
  for consistent development and delivery.

  What you will do:

  - Design, build, and operate scalable, low-latency APIs,
    event-driven services, and integration layers that support
    real-time and batch membership, loyalty, rewards, and
    consumer engagement use cases.
  - Configure, extend, and integrate the Antavo loyalty
    platform, including custom workflows, reward mechanisms,
    member lifecycle processes, event processing, and
    promotional capabilities.
  - Design and implement integrations between Antavo and
    enterprise commerce platforms such as SFCC, Fluent
    Commerce, CDP, CRM, marketing automation, and data
    platforms to support accurate and near real-time member
    data synchronisation.
  - Ensure solutions are secure, observable, reliable, and
    resilient by implementing engineering best practices for
    monitoring, logging and performance optimisation.
  - Troubleshoot production issues through monitoring, logging,
    crash analysis, and root cause investigation.

  YOUR TALENT

  - 4+ years of experience designing and building large scale
    distributed backend systems on cloud-native platforms.
  - Experience implementing or integrating enterprise loyalty
    platforms (Antavo preferred), including member lifecycle
    management, rewards, promotions, campaign execution, and
    loyalty transaction processing.
  - Strong understanding of design patterns, data structures and
    algorithms, with practical experience applying them to
    real-world use cases.
  - Expertise in backend engineering, API design, microservices,
    event-driven architectures, and scalable integration
    patterns using Java, Spring Boot and related frameworks.
  - Working knowledge of React and modern frontend development
    practices sufficient to contribute to consumer-facing
    applications.
  - Experience with Node.js and related frameworks.
  - Experience in event streaming platforms such as Kafka.
  - Experience with SQL/No-SQL databases with understanding of
    database architecture and distributed data management.
  - Experience with observability, reliability engineering and
    performance optimisation.

  - Experience using coding agents, LLMs or AI-assisted
    engineering tools.

  - Experience in eCommerce, retail, or consumer digital
    products is strongly preferred.
  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or a related field.

