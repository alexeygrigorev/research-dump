title: UI Lead Software Engineer - React / TypeScript - Digital Markets Execution Technology (DMET)
company: JPMorganChase
location: London, GBR
work_type: FULL_TIME
company_size: 289,097 Employees
description: |
  Lead and shape the UI for a real-time trading platform,
  delivering high-performance user experiences that drive
  business outcomes. As a Lead Software Engineer (UI) at
  JPMorgan Chase within Digital Markets Execution Technology
  you will set front-end technical direction and lead hands-on
  delivery of a latency-sensitive, real-time user experience
  used directly by traders and sales. You will partner closely
  with business stakeholders, product specialists, designers,
  and control partners to build intuitive, high-signal
  workflows at scale. This role emphasizes engineering
  excellence, operational readiness, and secure, compliant
  delivery in a fast-paced global environment.

  You will lead and shape the UI for a mission-critical front-
  office execution platform where performance, resiliency, and
  user experience directly influence business outcomes and
  client satisfaction. The work spans real-time data, latency-
  sensitive workflows, and production-grade operational
  readiness, with close-to-the-business stakeholders and a
  global engineering organization. This role offers meaningful
  technical leadership scope, tangible impact, and the
  opportunity to raise the bar on engineering excellence while
  operating within strong security, compliance, and control
  expectations.



  Job Responsibilities

  - Lead the design and delivery of user interface capabilities
    across Execute, from discovery to production support
  - Set front-end technical direction, including architecture,
    standards, performance, and testing strategy
  - Partner with product, business stakeholders, and designers
    to translate trading workflows into intuitive UX
  - Drive quality through thorough testing, troubleshooting, and
    performance optimization
  - Build high-performance, real-time UIs with strong
    responsiveness and stability
  - Establish and evolve scalable UI architecture, including
    component libraries and shared platform services
  - Drive engineering excellence through code reviews, quality
    gates, CI/CD, observability, and operational readiness
  - Ensure secure, compliant development practices aligned to
    firm standards
  - Collaborate with backend, platform, and SRE partners to
    deliver end-to-end solutions
  - Drives team adoption of enterprise-authorized AI-assisted
    engineering practices within the work environment to
    improve code quality, delivery speed, and operational
    outcomes (e.g., AI-assisted code review/refactoring, test
    strategy acceleration, incident/root-cause analysis
    support), while establishing consistent validation
    standards (secure coding, peer review, automated testing)
    and promoting reuse of effective patterns across the team
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation



  Required qualifications, capabilities, and skills



  - Formal training or certification on software engineering
    concepts and advanced applied experience in building
    production UIs with React and TypeScript in large-scale
    applications
  - Strong knowledge of modern front-end engineering, including
    state management, asynchronous data flows, and UI
    architecture
  - Expertise in performance optimization, testing strategies,
    and automation in CI/CD pipelines
  - Experience delivering real-time or data-intensive user
    experiences
  - Demonstrated technical leadership in setting standards,
    leading designs, and mentoring teams
  - Solid software engineering fundamentals, including OO/design
    patterns, debugging, and documentation
  - Familiarity with agentic development approaches across the
    software development lifecycle
  - Strong communication skills and ability to work effectively
    in global, cross-functional environments
  - Ability to tackle design and functionality problems
    independently
  - Demonstrated experience leading effective use of approved
    AI-assisted software development tools (e.g., for coding,
    code review, test acceleration, troubleshooting) with the
    ability to set team expectations for validating AI outputs
    for correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    engineers on safe, compliant adoption within delivery
    practices



  Preferred qualifications, capabilities, and skills



  - Experience in front-office trading or electronic execution
    domains
  - Familiarity with financial market concepts and protocols
  - Experience with UI component libraries, advanced data grid
    patterns, and visualization
  - Exposure to backend-for-frontend patterns, event-driven
    architectures, and API design collaboration
  - Experience operating UIs in regulated environments with
    strong auditability and controls

