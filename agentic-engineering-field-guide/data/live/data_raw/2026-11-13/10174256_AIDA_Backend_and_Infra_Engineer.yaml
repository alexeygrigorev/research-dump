description: |
  Company Overview

  Aida is a B2B enterprise AI company founded by Piyush
  Prahladka, former co-founder of Glean (a unicorn valued at
  $7.2B), and Atish Das Sarma, former head of growth
  engineering at Patreon and head of AI at Apple Cloud.
  Currently operating in stealth mode, Aida is developing deep
  AI assistants tailored for every role. The company is well-
  funded, having secured a significant seed round.

  Aida’s team consists of 20 members based in Palo Alto and
  India. We are seeking a strong Backend and Infra Engineer
  who is comfortable working in a fast-paced environment.

  Must-have skills:

  - Solid coding experience in Python, JavaScript/TypeScript,
    and other languages
  - Strong background in Data Structures and Algorithms
  - Solid system design skills, with the ability to describe
    moderately complex system design problems in technical
    depth
  - Experience with SQL and NoSQL databases
  - Knowledge of at least one public cloud platform—AWS, GCP, or
    Azure
  - Familiarity with modern cloud environments: Docker &
    containerization, infrastructure-as-code, DevOps, CI/CD
    pipelines, and automation
  - Experience with modern monitoring/logging architectures
    (e.g., Prometheus, Grafana, ELK, fluent-bit, DataDog) and
    the ability to discuss these systems
  - Strong networking knowledge: DNS, firewalls, routing, VPC
    peering, packet-sniffing, security groups, ports, tcpdump,
    DNS caching, etc.
  - Solid Linux/Unix fundamentals
  - Hands-on experience with network security and database
    systems
  - At least 3 years of relevant experience

  Nice to have:

  - Prior startup experience

  Other:

  - Bachelor’s and/or Master’s degree in CS or a related field
    with a strong academic background
  - Competitive pay and benefits
