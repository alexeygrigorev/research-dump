description: |
  About Company

  Cracken is an applied AI lab building world’s first full
  kill chain proactive cyber platform. Built by cyber warfare-
  experienced operators and AI researchers Cracken keeps
  digital infrastructure resilient so businesses and societies
  operate.

  We are growing and seeking an extremely talented software
  engineer to help us pioneer the future of cybersecurity.

  Responsibilities

  - Product Software Engineering: Hands-on engineering and
    testing of the product in various capacities, focusing on
    AI Agent features.
  - Agents Framework Engineering: Hands-on engineering and
    testing of the internal agent’s framework (similar to
    LangChain / Haystack and others).
  - Research & Development: Stay updated with the latest in AI
    and AI Agents. Provide relevant insights to the team and
    integrate innovations.

  Requirements

  - Ideally 5+ years of experience in Python (we can consider
    less experienced engineers, who learn very quickly and are
    ready to work in the startup environment)
  - Experience with Generative AI
  - Experience with Generative AI Agents will be a huge plus,
    specifically:— implementation of Generative AI Agents
    using Langchain / Haystack and others— implementation of
    RAG using LlamaIndex and other Advanced RAG frameworks—
    evaluation of AI Agent Performance— integration of AI
    Agents into Existing Systems
  - Cybersecurity product background: worked on security-focused
    software or platforms.

  Nice To Have

  - Master’s or Ph.D. in Computer Science, Cybersecurity, or
    related fields.
  - Interest or active participation in cybersecurity-related
    activities.
  - Contributions to AI / CS/ Cybersecurity research, blogs, or
    whitepapers showcasing expertise.
  - Experience in developing or contributing to open-source
    developer tools or frameworks.

  Why Cracken?

  - Real-world impact: Our technology is validated in nation-
    state operations and grounded in hands-on internal
    research
  - Team with a mission: Ukrainian-heavy international team of
    PhDs, professors, and top-tier industry veterans, driven
    by intrinsic motivation shaped by real-world adversity
  - Adaptive roles: We shape roles around exceptional talent —
    your ownership and drive will define your path
  - Perfect timing: Operating at the intersection of AI,
    cybersecurity, and autonomous systems, Cracken is uniquely
    positioned to win against sophisticated adversaries

  What we offer

  - Ownership over a core cybersecurity product
  - Direct collaboration with founders and elite cyber operators
  - High autonomy and real impact on product direction
  - Fully remote & flexible work setup
  - Competitive compensation
