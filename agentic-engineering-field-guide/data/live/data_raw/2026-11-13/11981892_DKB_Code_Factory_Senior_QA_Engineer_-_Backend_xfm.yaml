description: |
  Welcome to DKB AG….

  We’re excited to share that our hiring process is now led by
  Code Factory (CoFa), DKB’s sister tech company, bringing a
  more agile and collaborative approach to building our cross-
  functional teams. While you’ll go through the hiring journey
  with CoFa, your employment will be with DKB, combining the
  stability of a leading bank with the speed and innovation of
  a tech-driven environment. Join us to be part of a team
  where collaboration and impact come first.

  { your_responsibilities: [

  - You work with developers and product teams to develop a
    suitable testing strategy for our backend systems and
    ensure sensible test coverage across different testing
    levels.
  - You design, implement, and maintain automated tests for our
    APIs and microservices, ensuring that our test automation
    remains stable and maintainable as complexity grows.
  - You decide which tests make sense at the API/integration, or
    end-to-end level, and help avoid duplication between
    testing levels.
  - You integrate automated tests into our CI/CD pipelines,
    analyze test results, and help identify errors and quality
    risks early in the development process.
  - You analyze and debug failed and unstable tests, and
    continuously improve existing test frameworks and
    processes.
  - You actively contribute to our quality engineering efforts,
    identify quality risks with the team, and decide where
    test automation adds real value.
  - You work closely with developers, product owners, business
    teams, and other QA engineers, making quality a shared
    part of product development.

  ] } ;

  { following_qualifications_would_be_in_line_with_our_desired
  _profile_for_this_position: [

  - You have a completed degree in a STEM field, equivalent
    training, or relevant practical experience in software
    development or quality assurance.
  - You have solid experience in test automation and can
    structure it to remain maintainable, reliable, and
    scalable over the long term.
  - You have practical programming experience with Java and
    write readable, maintainable test code. Experience with
    Serenity BDD is a plus; alternatively, you’re willing to
    learn it.
  - You’re familiar with testing APIs and microservices and have
    a good understanding of distributed backend systems and
    synchronous and asynchronous communication.
  - You’re familiar with the fundamentals of event-driven
    architectures; ideally, you’ve already worked with Apache
    Kafka or similar technologies.
  - You have experience with CI/CD pipelines and understand how
    automated tests are integrated into the development and
    delivery process.
  - To you, quality means more than running test cases: you
    identify risks, question existing test coverage, and
    contribute ideas to improve our testing strategy and
    automation.
  - You work independently, in an organized and solution-
    oriented way, and enjoy learning about new technologies
    and subject areas.
  - You communicate technical and quality-related topics
    confidently with different stakeholders and adapt the
    level of detail to your audience.
  - Confident communication in German and English, ideally at B2
    level or above

  ] } ;

