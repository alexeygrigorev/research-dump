description: |
  About Us

  Government contracting runs on expertise, yet reaching the
  right expert at the right moment is still a labyrinth.
  OnFrontiers is the expert network built to change that. We
  connect the organizations that win and deliver government
  work with a vetted network of 17,000+ practitioners who have
  actually done it. We're also building that expertise into
  the AI workflows teams already use, so the right person
  informs the right task at the moment it counts.

  We create value for the whole GovCon ecosystem:

  - For contractors, we lower the friction of engaging the right
    subject-matter expert at the right time, turning a
    labyrinth into a fair, merit-based advantage that rewards
    what a team knows, not who it knows.
  - For experts leaving government, we open a direct path to put
    hard-won expertise to work, engage with mission-driven
    companies, and often build a second career.
  - For government, we grow an expert ecosystem around public
    work that gets better solutions into agencies faster and
    helps keep institutional knowledge from walking out the
    door.

  We're a lean, AI-native team building the infrastructure for
  how expertise gets deployed. This is a chance to build not
  just a product, but an industry-defining technology.

  The Role

  As a full-stack engineer on our team, you'll build and ship
  the next generation of our expert intelligence platform.
  You'll code every day across the stack, from LLM-powered
  features to the APIs and interfaces that deliver them,
  working closely with our engineering lead and the rest of
  the team to get new capabilities into customers' hands
  quickly.

  This is a hands-on building role on a small, AI-native team.
  Your work ships fast and matters immediately, and you'll
  have real ownership of the features you take from idea to
  production.

  What You'll Do

  - Build LLM-powered systems for expert matching and
    solicitation intelligence.
  - Build and improve our vector-backed indexes of experts and
    solicitations, and the search that connects them
    (OpenSearch, PGVector, Go).
  - Ship features that accelerate talent mobility by graphing
    knowledge at the individual work-experience level.
  - Build core SaaS platform and API features across the stack
    (Python, Go, React).
  - Take features from idea to production: write clean, tested,
    maintainable code and own what you ship.
  - Work AI-first: pair with Claude and our internal tooling to
    design, write, test, and review code, and help improve how
    we build.
  - Collaborate directly with the engineering lead, product, and
    leadership to ship quickly and iteratively.
  - Balance startup speed with the things that keep a platform
    healthy: security, reliability, and scalability.

  What We're Looking For

  - Proven experience shipping full-stack software in Python,
    React, and AWS. Go is a plus.
  - Hands-on experience with LLMs, LLM orchestration, vector
    search, or AI-first product development.
  - You already build with AI tools daily (Claude, Copilot, or
    similar) and want to go deeper.
  - Startup speed: comfortable with ambiguity, fast iteration,
    and wearing many hats.
  - Solid engineering fundamentals: you write readable, tested
    code and care about what happens in production.
  - Mission-driven, hungry, and eager to own outcomes.
  - Comfortable engaging on data security and compliance topics
    (CMMC / FedRAMP / SOC 2 familiarity a plus, not required).

  Why Join

  - Impact: your work will directly shape how $100B+ in
    government contracting decisions get made.
  - Equity upside: a meaningful ownership stake.
  - Growth path: join early and grow with the team, with room to
    take on more scope and seniority as we expand.
  - Mission: build AI-first technology that modernizes how
    government and industry collaborate.
