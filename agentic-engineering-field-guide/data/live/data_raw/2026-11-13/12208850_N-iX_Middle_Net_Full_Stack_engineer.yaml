description: |
  Our client is a comprehensive site lifecycle management
  solution tailored for the telecommunications and energy
  industries. It enables organizations to efficiently manage
  sites, assets, projects, and leases, enhancing operational
  visibility and resource allocation throughout the site
  lifecycle.

  Responsibilities:

  - Building new features on the top of existing web
    application, using .Net, JS, React, jQuery
  - Support of existing web application (bug fixes, security
    updates, technical improvements)
  - Work, using SAFe methodology, to deliver incremental value,
    actively participating in code reviews, sprint planning,
    and design discussions.
  - Troubleshoot and debug complex issues in production and
    staging environments.
  - Write clean, maintainable, and efficient code while adhering
    to coding standards and best practices.

