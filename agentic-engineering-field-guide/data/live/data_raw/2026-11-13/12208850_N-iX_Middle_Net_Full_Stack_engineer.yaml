  - 3+ years of experience in development of .Net-based web
    applications
  - Good experience with .NET Framework 4.7, ASP.NET
  - Practical experience with JS, HTML, CSS, XML, React, jQuery
  - Familiarity with microservices architecture
  - Knowledge of Oracle 19c database
  - Hands-on experience with Octopus, TeamCity, Github Actions
  - Working experience with MS Azure
  - Proficient in using development tools like Visual Studio,
    Postman
  - Strong understanding of version control, security best
    practices, and Agile methodologies, especially Kanban
  - Familiarity with MSTest, xUnit and test-driven development
  - Effectively use AI-powered tools to improve coding
    efficiency, code quality, and development workflows.
  - Excellent communication and teamwork skills, with the
    ability to mentor junior developers

  Nice to have:

  - Experience with Sencha and Bootstrap
  - Experience with Veracode
  - Expertise with OpenSearch

  We offer*:

  - Flexible working format - remote, office-based or flexible
  - A competitive salary and good compensation package
  - Personalized career growth
  - Professional development tools (mentorship program, tech
    talks and trainings, centers of excellence, and more)
  - Active tech communities with regular knowledge sharing
  - Education reimbursement
  - Memorable anniversary presents
  - Corporate events and team buildings
  - Other location-specific benefits

  *not applicable for freelancers
