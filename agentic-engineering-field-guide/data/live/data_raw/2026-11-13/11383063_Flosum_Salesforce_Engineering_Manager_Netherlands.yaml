description: |
  We're looking for a Salesforce technical architect and
  engineering manager who can drive development velocity
  across a team of 10 to 15 engineers building enterprise
  applications on the Salesforce Platform. This is a hybrid
  role combining deep hands on technical leadership with
  people management. We're specifically looking for candidates
  with strong Salesforce expertise, Salesforce technical
  architecture experience, and Node.js development experience.

  What you'll do

  Lead the architecture, performance, and scalability of our
  Salesforce Platform and Node.js based services. While our
  applications are deployed primarily on AWS today, they are
  designed to be scalable and highly available, and you'll
  ensure architectural decisions follow Salesforce and cloud
  engineering best practices.

  You'll own the technical direction of our Salesforce
  applications, mentor senior engineers, and partner with
  Product and Engineering leadership to deliver high quality
  solutions quickly.

  You'll also manage a team of 10 to 15 developers by setting
  goals, conducting 1:1s, growing careers, hiring top
  engineering talent, and removing blockers. You'll balance
  roadmap delivery with engineering excellence, including code
  quality, system reliability, platform performance, security,
  and developer experience.

  RequirementsWhat we're looking for

  - 8+ years of software engineering experience, with 3+ years
    leading engineering teams.
  - Strong Salesforce expertise, including Apex, Lightning Web
    Components, SOQL, Salesforce APIs, and Salesforce platform
    best practices.
  - Proven Salesforce technical architecture experience
    designing scalable enterprise solutions.
  - Strong Node.js background and a clear point of view on
    building maintainable services and integrations at scale.
  - Experience integrating Salesforce with external systems
    using modern APIs and integration patterns.
  - Deep understanding of software architecture, scalability,
    security, and performance optimization.
  - Track record of improving engineering velocity, system
    performance, scalability, and deployment processes in
    production environments.
  - Proven ability to grow engineers, hire well, and lead high
    performing engineering teams that consistently deliver
    results.

  Nice to have

  - Experience with Salesforce DevOps, CI/CD pipelines, and
    deployment automation.
  - Experience with AWS, cloud infrastructure, or enterprise
    SaaS platforms.
  - Experience with Kubernetes, Terraform, or containerization
    technologies.
  - Salesforce certifications such as Platform Developer I or
    II, Application Architect, or System Architect.
  - Background scaling SaaS platforms or developer facing
    products.
