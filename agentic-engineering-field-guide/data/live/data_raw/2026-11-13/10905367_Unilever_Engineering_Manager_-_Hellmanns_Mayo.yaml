description: |
  Earlier this year (March 2026), Unilever announced an
  agreement to separate our Foods business. Our Foods
  business, including brands such as Hellmann's and Knorr,
  will join forces with McCormick to become a global flavour
  leader, with leading positions across spices, seasonings,
  condiments and complementary food categories, supported by a
  strong retail and foodservice platform. McCormick has 135+
  years of heritage, a presence in 150+ countries and
  territories, and a portfolio of trusted brands. The
  transaction remains subject to consultation, regulatory
  approvals and other customary closing conditions with a
  targeted deal close of mid-2027.

  JOB PURPOSE The Engineering Manager plays a critical role in
  delivering this ambition at the Rexdale Factory by leading
  the site’s engineering strategy, capital investment program,
  and technical capability development. Reporting to the Head
  of Factory, this role is accountable for end-to-end capital
  delivery, asset reliability, utilities optimization, and
  engineering governance, ensuring full alignment with
  Unilever’s Unilever Manufacturing Systems (UMS) standards.

  This position is instrumental in accelerating our journey
  toward zero defects, zero waste, and zero losses, while
  building a strong engineering culture rooted in safety,
  quality, and continuous improvement.

  You’ll be part of a team that believes in doing work that
  matters — for people and the planet.

  Because here, we don’t just hire for jobs. We invite you to
  be part of something bigger. KEY RESPONSIBILITIES Lead
  Capital Investment & Innovation • Own and deliver the
  factory’s capital agenda, including innovation, savings,
  capacity expansion, and infrastructure upgrades • Ensure all
  projects are delivered on time, in full, on budget, and in
  compliance with Unilever safety and quality standards •
  Drive robust project governance, including stage-gate
  discipline, financial tracking, and post-launch benefit
  realization • Manage capital planning, forecasting, and
  system compliance. (e.g., SAP / internal capital tools) •
  Provide clear reporting and governance through the Project
  Board and leadership forums • Define and deploy engineering
  standards and best practices aligned with Unilever Global
  Engineering Champion Sustainability & Utilities Optimization
  • Lead site delivery of Unilever’s Compass / Climate &
  Nature goals (energy, carbon, water) • Drive reduction of
  utilities baseload and improve efficiency across
  refrigeration, steam, water, and electrical systems •
  Partner cross-functionally to deliver site sustainability
  roadmap and targets Embed Unilever Manufacturing System
  (UMS) • Drive loss elimination through AM, PM, Focused
  Improvement (FI), and Quality (Q) pillars • Build capability
  in problem solving, root cause analysis, and countermeasure
  implementation • Coach teams to identify, prioritize, and
  eliminate chronic losses Ensure Safety, Quality & Compliance
  • Uphold Unilever’s safety-first culture and ensure
  compliance with PSM, H&S, Food Safety, and Quality standards
  • Ensure adherence to machinery safeguarding standards
  (e.g., CSA Z432) and engineering compliance requirements •
  Embed safety and risk management into all engineering
  designs and activities Lead Partnerships & Stakeholder
  Management

  • Manage third-party contractors and suppliers in line with
  Unilever procurement strategy

  • Build strong partnerships with Operations, Quality, Supply
  Chain, Finance, and Global Engineering

  • Negotiate effectively to optimize cost, performance, and
  service delivery

  REQUIRED QUALIFICATIONS

  - Bachelor’s degree in Mechanical, Electrical, Chemical
    Engineering, or a related STEM discipline.

  - Minimum 5+ years of progressive engineering experience in
    FMCG or high-speed manufacturing environments.

  - Proven track record of successfully delivering capital
    projects end-to-end (scope, cost, schedule, safety, and
    quality).

  - Effective communication skills, able to simplify complex
    technical topics for diverse audiences.

  - Proven ability to lead, coach, and develop engineering or
    technical teams, building capability and fostering a high-
    performance culture.

  - Experience in driving team engagement, accountability, and
    continuous improvement.

  - Strong stakeholder management and influencing skills, with
    the ability to collaborate across functions and levels.

  - Ability to thrive in a fast-paced, performance-driven
    manufacturing environment, managing multiple priorities.

  PREFERRED QUALIFICATIONS

  - Experience with industrial control systems (e.g., PLCs,
    SCADA), including troubleshooting and implementation.

  - Experience with World Class Manufacturing (WCM), TPM, or
    Lean methodologies, with practical application.

  - Strong knowledge of utilities systems, including
    refrigeration, steam, compressed air, and water
    management.

  - Experience in maintenance, asset management, and reliability
    engineering.

  Pay: The pay range for this position is $98,200-$147,200.
  Unilever takes into consideration a wide range of factors
  that are utilized in making compensation decisions
  including, but not limited to, skill sets, experience and
  training, licensure and certifications, qualifications and
  education, and other business and organizational needs.

  Bonus: This position is bonus eligible.

  Long-Term Incentive (LTI): This position is LTI eligible.

  Benefits: Unilever employees are eligible to participate in
  our benefits plan. Should the employee choose to
  participate, they can choose from a range of benefits to
  include, but is not limited to, health insurance (including
  prescription drug, dental, and vision coverage), retirement
  savings benefits, life insurance and disability benefits,
  parental leave, sick leave, paid vacation and holidays, as
  well as access to numerous voluntary benefits. Any coverage
  for health insurance and retirement benefits will be in
  accordance with the terms and conditions of the applicable
  plans and associated governing plan documents.

  Unilever uses artificial intelligence tools in the hiring
  process to screen or assess applicants. However, hiring
  decisions will be made by the line manager and in accordance
  with applicable employment standards and human rights laws.
  All information collected, used or disclosed during the
  application and interview process will be subject to
  Unilever’s Privacy Policy.

