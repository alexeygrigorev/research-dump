description: |
  ResearchGate is the professional network for scientists and
  researchers. From climate change and emerging diseases to
  food security and the responsible development of AI, the
  challenges facing our world are complex. Still, we’re
  optimistic about the power of millions of scientists working
  together to tackle them. We provide scientists with the help
  and support they need by connecting them to the world’s most
  active scientific community.

  We've built a platform that gives the world's scientists the
  tools and services they need to connect, collaborate, and
  advance their research. Over 25 million members from 193
  countries use ResearchGate to share, discover, and discuss
  research.

