description: |
  Job Description:

  At Remitly, we believe everyone deserves the freedom to
  access, move, and manage their money wherever life takes
  them. Since 2011, we've tirelessly delivered on our promise
  to customers sending money globally, providing secure,
  simple, and reliable ways to manage their money, ensuring
  true peace of mind. Whether it's supporting loved ones back
  home, growing a business across continents, or pursuing new
  opportunities abroad, we're not just here to move money—
  we're here to move our global customers forward. We're
  looking for builders, reimaginers, and global thinkers who
  want to work at the intersection of technology, trust, and
  transformation. If that's you and you're ready to do the
  most meaningful work of your career—we invite you to join
  over 2,800 passionate Remitlians worldwide who are united by
  our vision to transform lives with trusted financial
  services that transcend borders.

  About the Role:

  As an AI Native Software Engineer II, you direct AI agents
  to build products and solutions, rather than writing code
  directly. You leverage AI coding agents to replace manual
  tasks, build and ship entire applications and basic agents
  end-to-end. You're a full-stack product builder who thinks
  in terms of "I need to solve this customer problem" and
  orchestrates AI to get there. You are measured by the speed
  of delivery and the robustness of what you ship, not the
  volume of your commits.

  You Will:

  - Build complete applications, workflow automations, and basic
    agents within your team's product area using AI coding
    agents
  - Translate customer needs into buildable specifications and
    ship solutions from requirements through deployment
  - Instrument solutions to track usage and outcomes, iterating
    based on what you learn
  - Evaluate AI-generated output against Remitly's standards for
    security, privacy, reliability, and quality before
    shipping
  - Participate in customer conversations to understand acute
    problems and identify automation opportunities
  - Document your approaches, effective prompts, and patterns
    for the team

  You Have:

  - Proficiency with AI coding agents for end-to-end application
    development
  - Ability to write effective prompts and iterate to achieve
    desired outcomes
  - Understanding of full-stack applications: frontend, backend,
    data, and infrastructure
  - Familiarity with common architectural patterns (web
    applications, APIs, databases, queues)
  - Awareness of fundamental design principles, common UI/UX
    patterns, and basic product development concepts
  - Ability to read and interpret basic analytics (usage
    metrics, conversion rates, error rates)
  - Strong communication skills and a collaborative, learning-
    oriented mindset

  Compensation Details. The starting base salary range for
  this position is typically $144,000 - $180,000. In the U.S.,
  Remitly employees are shareholders in our Company and equity
  is part of our total compensation plan. Your recruiter can
  share more information about medical benefits offered, as
  well as other financial benefits and total compensation
  components offered with this role.

  Our Benefits:

  - Flexible paid time off
  - Health, dental, and vision + 401k plan with company matching
  - Paid parental, medical, military and family care leave
  - Mental Health & Family Forming Benefits
  - Employee Stock Purchase Plan (ESPP)
  - Continuing education and travel benefits

  Our Connected Work Culture: Driving Innovation, Together

  At Remitly, we believe that true innovation sparks when we
  come together. Our Connected Work Culture fosters dynamic
  in-person collaboration, where ideas ignite and challenging
  problems find solutions faster.Under the Company's current
  hybrid-work expectations, employees in this position work
  onsite Tuesday through Thursday each week. Additional onsite
  attendance may be required based on business needs, and the
  Company may modify its hybrid-work expectations from time to
  time. These intentional in-office moments are vital for
  deepening relationships, fueling creativity, and ensuring
  your impact is felt where it matters most.

  Remitly is an E-Verify Employer

  At Remitly, we are dedicated to ensuring that our workplace
  offers equal employment opportunities to all employees and
  candidates, in full compliance with applicable laws and
  regulations.

  Remitly is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
