description: |
  About the company

  Our client is a fast-growing technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and ship polished web interfaces for a data-driven
  platform, working closely with research and operations
  colleagues. You will move quickly from idea to production,
  delivering features that many users rely on every day.

  What you'll do

  - Ship intuitive, well-crafted user interface features used
    daily by a large user base.

  - Build fast, responsive front ends on top of large-scale data
    processing systems.

  - Design interfaces that present machine learning and signal-
    processing capabilities to customers.

  - Work with researchers and operations colleagues to quickly
    deploy interfaces that support experimentation.

  - Keep up with current frontend tools and frameworks and apply
    them to improve the product.

  Requirements

  What we're looking for

  - 2+ years of frontend software engineering experience.

  - Proficiency in TypeScript.

  - Experience building production user interfaces with React.

  - Familiarity with Node.js or PostgreSQL is helpful.

  - Experience delivering new product features end-to-end from
    zero to one.

  Bonus points

  - Experience at a high-growth startup.

  - Experience building data-heavy or machine-learning-driven
    interfaces at production scale.

  - Computer science degree.

  Benefits

  Compensation and benefits

  - Base salary: USD 175,000 to 225,000 per year

  - Equity

  - Health, dental and vision coverage

  - Flexible time off

  - Retirement plan

  - Tax-advantaged health accounts

  Location and work model

  - San Francisco, CA, United States

  - On-site, 5 days per week in office

  - Full-time
