  where they work - whether in an office, from home, or a
  combination of the two. That way, Atlassians have more
  control over supporting their family, personal goals, and
  other priorities. We can hire people in any country where we
  have a legal entity. Your future team In Networking we build
  and operate shared services that route and protect traffic
  across Atlassian's cloud infrastructure and products. Our
  work spans API gateways, rate limiting, service connectivity
  and real-time messaging, helping product teams deliver
  reliable experiences at scale. As a P50 Senior Software
  Engineer, you will design, build and operate distributed
  platform services. You will take projects from an ambiguous
  problem through design, implementation, rollout and
  production ownership, working with engineers, architects and
  internal customers across Atlassian. What you'll do

  - Build and evolve reliable, resilient, high-throughput and
    low-latency backend services.
  - Evolve shared networking services across AWS, GCP and
    Kubernetes, delivering safe migrations that preserve
    compatibility and reliability for dependent teams.
  - Build traffic-control capabilities that protect services
    from bursts, enforce quotas fairly and give engineers
    visibility into throttling decisions.
  - Own projects end to end: clarify requirements, evaluate
    design tradeoffs, implement and test changes, plan safe
    rollouts and measure their results.
  - Improve platform reliability, performance, scalability and
    operational efficiency.
  - Participate in the team's production support and on-call
    responsibilities, investigate incidents and deliver
    lasting improvements.
  - Work with partner teams to understand their needs and
    deliver reusable platform capabilities.
  - Mentor engineers, provide thoughtful code and design
    reviews, share knowledge and improve engineering
    practices.

  What you'll bring

  - Experience independently delivering and operating backend
    services in production at scale, with the technical
    judgment expected of a senior engineer.
  - Strong software development skills in one or more of Java,
    Kotlin, Go or Python, and willingness to work across the
    team's stack.
  - A sound understanding of networking protocols, distributed
    systems, microservices, HTTP and REST APIs, including
    their failure modes and performance tradeoffs.
  - Experience debugging complex production issues using logs,
    metrics and other observability tools.
  - Experience with automated testing, continuous delivery and
    safe changes to production services.
  - Clear communication, effective collaboration across teams
    and a track record of mentoring other engineers.

  Additional experience we'd value

  - API and traffic management, rate limiting, authentication or
    service-to-service connectivity.
  - Cloud infrastructure, such as AWS and GCP, and container
    technologies such as Docker and Kubernetes.
  - Building a service from the initial requirements through
    launch and ongoing ownership.
  - Improving on-call practices, incident response, service
    reliability or infrastructure cost efficiency.

  Proposed first 6-12 month outcomes

  - Develop enough knowledge of the team's services and
    dependencies to contribute confidently to operations and
    incident response.
  - Own a networking platform capability or migration through
    production rollout and adoption, demonstrating an agreed
    improvement in reliability, latency, operating cost or
    developer effort.
  - Deliver measurable reliability, performance or operational
    improvements and share the resulting knowledge across the
    team.
  - Support the growth of other engineers through mentoring,
    design collaboration and high-quality reviews.

