description: |
  About the Company

  Fractional is a social platform for fractional ownership of
  investment properties. We’re on a mission to open the
  private real estate market to everyone by making it
  inclusive, educational, collaborative, and fun.

  Current options for real asset investments are limited and
  expensive.

  Many people with the skills to do it themselves lack the
  cash to get started, whereas others with sufficient capital
  are stuck with the high fees and limited opportunities
  typical markets offer.

  We believe that with the right tools, guidance, and
  community, anyone can choose to own, invest in, and grow
  real assets in their own way.

  We're well funded, with backing from Fifth Wall, Left Lane,
  CRV, Y Combinator, Will Smith, Kevin Durant, and others,
  such as the founders and leaders of Affirm, Compass, Blend,
  AirBnB, and Sprout Social. We bring prior experience in
  fintech, real estate, and securities regulation.

  Democratizing real estate is just the start. We’d love to
  have you join us to build the future of ownership

  What you'll do

  - Drive end-to-end design and implementation of product
    requirements including task break-down, delivery, testing,
    monitoring, and maintenance.
  - Consistently generate simple and elegant designs, and write
    high-quality code that can be easily understood and
    leveraged by others.
  - Collaborate closely with product, design, and the rest of
    engineering to turn feature and product specs into
    reality.
  - Influence the features and direction of the platform with
    your own ideas and proactively identify opportunities to
    improve business processes.
  - Grow with the company as a technical leader, including
    mentoring earlier-career engineers, and helping to shape
    our systems and culture

  What we look for

  - Prior experience building, launching, and maintaining
    products at scale
  - Sense for small details and shaping speedy, reliable user
    experiences
  - Ability to collaborate cross-functionally and
    collaboratively with both internal and external
    stakeholders, such as design and sales
  - Grit and adaptability to thrive with an early-stage team and
    navigate the unknown
  - Well-developed interpersonal, written, and verbal
    communication
  - Passion about Fractional's mission, empathizing with our
    users and how they'll interact our products
  - At least 6 years of engineering experience, including
    technical leadership (ideally with prior experience at a
    startup)
  - Knowledge of Typescript, Postgres, GraphQL

  Bonus points for

  - Interest or experience in building social or collaboration
    platforms
  - Marketplace or fintech experience
  - Interest or experience in industries with regulatory or
    compliance considerations

  Preference will be given to candidates who can help build
  our SF and NYC engineering hub.

  What we offer

  - Health benefits Full healthcare benefits including health,
    dental, and vision insurance - for you and your
    dependents.
  - Time off We encourage you to take advantage of our unlimited
    vacation policy.
  - Team events Regular off-sites and retreats throughout the
    year.
  - Tools A laptop, monitor and any equipment you might need to
    do your best work.
