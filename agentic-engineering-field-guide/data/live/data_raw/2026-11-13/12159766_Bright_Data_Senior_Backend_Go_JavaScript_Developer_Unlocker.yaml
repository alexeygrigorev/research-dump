description: |
  Description

  We're looking for an exceptional Senior Backend Go and
  JavaScript developer, with expertise in Node.js. MongoDB,
  Express, Kubernetes, RabbitMQ, Redis, Snowflake to join our
  Unlocker Team.

  In this role, you will take full ownership of product and
  feature development, using cutting-edge technologies, in a
  fast-paced and professional agile environment.

  ﻿

  Responsibilities

  - End-to-end feature development, from conception to
    production.
  - Participate in system design and architecture planning, for
    optimal software performance.
  - Take on independent responsibilities, while contributing to
    the team's collective goals.
  - Actively learn, adapt and stay up-to-date with the evolving
    tech landscape, including best practices.

  Requirements

  - At least 5 years of hands-on experience in development /
    engineering, including 3+ years focused specifically on
    back-end Go and JavaScript development.
  - In-depth understanding of network protocols and security,
    including TCP/IP, DNS, HTTP, HTTPS, CORS and WebSockets.
  - Proficient in system design and architecture to ensure
    product functionality, performance, scalability, and
    reliability.
  - Fast learner, able to work both independently and as a team
    player.
  - Fluent in English, with excellent communication skills.
