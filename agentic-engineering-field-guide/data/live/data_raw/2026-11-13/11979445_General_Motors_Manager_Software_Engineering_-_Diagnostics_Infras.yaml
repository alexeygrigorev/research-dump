description: |
  Description Vacancy Status: This posting is for an existing
  vacancy within the organization and is open to new
  applications. (Backfill) AI Disclosure: As part of the
  application process, Artificial Intelligence will be used in
  the hiring process for this role Hybrid - This role is
  categorized as hybrid. This means the successful candidate
  is expected to report to Markham Elevation Center three
  times per week, at minimum [or other frequency dictated by
  the business]. About The Role: At General Motors, we're
  transforming mobility through innovation - driving toward a
  future of zero crashes, zero emissions, and zero congestion.
  As part of this mission, we're building the next generation
  of autonomous vehicles and the platforms that power them.
  We're looking for a Manager of Software Engineering to join
  the Autonomous Vehicles Integrity Platform group. This is a
  high-impact leadership role responsible for guiding the AV
  Diagnostics Infrastructure team as it develops the fault
  detection and diagnostic foundation for autonomous-driving
  and active-safety systems. You'll lead engineers building
  shared software for AV sensing, compute, and vehicle
  platforms, with reuse across AV and IVI systems. The role
  combines team leadership, product ownership, architecture,
  and execution across multiple vehicle programs. What You'll
  Do (Responsibilities)

  - Lead, coach, and develop a team of software engineers;
    provide feedback, career development, performance
    management, hiring, and succession planning.
  - Own the team's technical roadmap and delivery for shared AV
    diagnostic infrastructure across autonomous-driving and
    active-safety programs.
  - Guide architecture and implementation of UDS Server, DTC
    Manager, Diagnostic Monitor Library, manufacturing support
    services, configuration, common utilities, and scan tools.
  - Partner with Systems Engineering and software teams to turn
    diagnostic requirements into reliable, maintainable
    platform software.
  - Coordinate integration with AV Health, cybersecurity,
    software updates, communications, power management,
    calibration, platform software, manufacturing, service,
    QA, and V&V teams.
  - Drive technical risk management, issue resolution,
    dependency tracking, and release readiness for vehicle-
    program milestones.
  - Establish strong engineering practices for design reviews,
    code reviews, unit and integration testing, automation,
    static analysis, CI/CD, logging, metrics, and
    observability.
  - Ensure the team delivers software that supports safety,
    compliance, manufacturing, serviceability, and robust
    degraded operation.
  - Communicate status, risks, decisions, and recovery plans
    clearly to technical and program leadership.
  - Promote an inclusive, collaborative culture focused on
    accountability, innovation, continuous improvement, and
    technical excellence.


   What You'll Need (Required Qualifications)

  - Bachelor's degree in Computer Science, Software Engineering,
    Electrical or Computer Engineering, or a related technical
    field.
  - 8+ years of professional software engineering experience,
    including embedded, automotive, platform, or
    infrastructure software.
  - Experience leading technical teams and delivering complex
    software across multiple stakeholders, platforms, or
    programs.
  - Strong experience with C or C++ and Python, including
    software design, implementation, debugging, code review,
    and unit testing.
  - Experience with embedded Linux or POSIX-based systems,
    software interfaces, interprocess communication,
    networking, and hardware/software integration.
  - Experience with automotive diagnostics, such as UDS/ISO
    14229, diagnostic trouble codes, diagnostic identifiers,
    routines, or ECU diagnostic services.
  - Experience defining or executing software quality practices,
    including test strategy, automation, code coverage, static
    analysis, and root-cause analysis.
  - Strong analytical, communication, interpersonal, and
    organizational skills.
  - Ability to work effectively with distributed teams and
    cross-functional partners.
  - Ability to travel occasionally to GM locations, supplier
    sites, test facilities, and vehicle or bench integration
    activities.


   What Will Give You a Competitive Edge (Preferred
  Qualifications)

  - Experience with diagnostic infrastructure, DTC management,
    monitor frameworks, manufacturing or service diagnostics,
    traceability, scan tools, or diagnostic configuration
    systems.
  - Experience with SOME/IP, TCP/IP, protobuf, IPC, or other
    automotive communication technologies.
  - Experience with Linux-based SoC platforms, Yocto, embedded
    middleware, or common platform software.
  - Experience supporting automated driving, ADAS, active
    safety, sensor, compute, or vehicle platform software.
  - Knowledge of functional safety, software safety,
    cybersecurity, ISO 26262, ASPICE, MISRA, or related
    automotive development practices.
  - Experience delivering software for manufacturing, after-
    sales service, vehicle validation, HIL, or fleet
    operations.
  - Experience with Agile or SAFe development practices, roadmap
    planning, and release execution.
  - Experience managing suppliers, external partners, or
    transitions of externally developed software.


  The successful candidate will be a technically credible
  people leader who can connect software architecture and
  engineering execution to vehicle-level outcomes. This role
  offers the opportunity to shape a reusable diagnostic
  platform that supports the reliability, observability, and
  launch readiness of GM's autonomous vehicles and active-
  safety products.  Compensation: The salary range for this
  role is $147,000 to $196,600. The actual base salary a
  successful candidate will be offered within this range will
  vary based on factors relevant to the position. GM DOES NOT
  PROVIDE IMMIGRATION-RELATED SPONSORSHIP FOR THIS ROLE. DO
