  Software Engineer II - Reporting Platform

  Why We Have This Role

  As a Software Development Engineer on the Reporting Platform
  team, you would apply your distributed-systems knowledge,
  familiarity with full-stack development, databases, various
  storage-engines, and web-services design and implementation
  to build premier software and services.

  Things You’ll Do

  - Develop scalable, fast, robust, and simple web-based
    solutions to solve complex business problems
  - Implement new features and optimize existing ones to drive
    maximum performance
  - Work closely with, and incorporate feedback from other
    engineers, tech-ops, and product managers
  - attend daily stand-up meetings, collaborate with your peers,
    prioritize features, and work with a sense of urgency to
    deliver value to your customers


  What We’re Looking For On Your Resume

  - Work with design and product teams to understand needs,
    propose features, create early prototypes, and transform
    them into exciting end user features.
  - Develop scalable, fast, robust, and rich web-based solutions
    to solve complex business problems, using the latest
    frontend and backend technologies.
  - Strong algorithms, data structures and coding background.
  - Experience with continuous delivery, git, test automation
    and build/deploy systems.
  - Experience building large-scale web applications or
    distributed services.
  - Experience with MVC and single page application
    technologies, including AngularJS, Angular2, Polymer, Vue,
    Ember, React or ReactNative.
  - Experience building high performance RESTful services.
  - Bachelor’s degree in Computer Science or related field.
  - 3-6 years working in a full stack web engineering position.


  What you Should Know About This Team

  - As a Software Engineer on our Reporting Platform team, you
    will apply your distributed-systems knowledge to design
    and implement scalable web services, participate in full
    stack development and work with open source software and
    cloud services.
  - Our Reporting Platform includes a flexible software-
    framework for building dashboards, software for generating
    beautiful reports and powerful data analysis and
    visualization tools.


  How You’ll Grow

  - Develop the ability to build scalable, fast, and robust
    customer solutions
  - Develop familiarity with containerization and full-stack
    development
  - Understand the critical use cases of digital experiences,
    learn what it means to support enterprise level clients
  - Learn to implement new functionality from provided
    requirements and specifications
  - Benefit from working with other engineers, product managers,
    UX, and more
  - Learn Agile methodologies by attending daily stand-up
    meetings, prioritizing tasks, and working with a sense of
    urgency to meet a scheduled plan to deliver value to our
    customers


  How You’ll Find Success

  - Strong level of curiosity and interest to learn
  - Strong ownership and all-in spirit

  Our Team’s Favorite Perks and Benefits

  - Work life integration is deeply important to us - we have
    frequent office events, team outings, and happy hours.
  - We take pride in our office design aiming at cultivating
    creativity from our rooftop views to an open and
    collaborative work space.
  - On top of standard benefits package (medical, dental,
    vision, life insurance, etc) we provide snacks, drinks,
    and free lunches in our office.

  The Qualtrics Hybrid Work Model: Our hybrid work model is
  elegantly simple: we all gather in the office three days a
  week; Mondays and Thursdays, plus one day selected by your
  organizational leader. These purposeful in-person days in
  thoughtfully designed offices help us do our best work and
  harness the power of collaboration and innovation. For the
  rest of the week, work where you want, owning the
  integration of work and life. #hybrid

