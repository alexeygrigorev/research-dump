description: |
  ABOUT RETELL AI

  Retell AI is using first-principles thinking to reimagine
  the call center with cutting-edge voice AI. Thousands of
  companies now use Retell's AI voice agents to handle sales,
  support, and logistics calls that once required large teams
  of human agents. Backed by Y Combinator, Alt Capital, and
  other leading investors. We've grown 20x from $5M to $100M+
  in annualized revenue run rate in under two years, reaching
  a $1.5B+ valuation.

  Our vision for 2026 is to build a modern CX platform where
  entire contact centers are powered by AI. Instead of basic
  automation that needs constant human tuning, we're creating
  intelligent AI “workers” that act as frontline agents, QA
  analysts, and managers, continuously executing, monitoring,
  and improving every customer interaction.

  We're growing fast and looking for ambitious builders who
  want to tackle hard technical problems, move quickly, and
  have a real impact on one of the fastest-growing voice AI
  companies in the world.

  Let's build the future together.

  Recent recognition:

  - No. 1 Best Places to Work in the Bay Area, San Francisco
    Business Times 2026
  - Top 50 AI Apps, a16z (2025)
  - #3 Fastest-Growing Software Company, G2 Best Software Awards
    2026
  - Best Agentic AI Software, G2 Best Software Awards 2026
  - #4 Fastest-Growing Software Vendor, Brex Benchmark 2025
  - Enterprise Tech 30 Class of 2026, Nasdaq & Wing VC
  - Top-Ranked Startup, Lean AI Leaderboard
  - Backed by Y Combinator



  ABOUT THE ROLE

  Retell AI transforms customer experience with voice AI for
  enterprises, including customers like CVS/Aetna, San Antonio
  Spurs, Lenovo, and Grab. We have more customer stories than
  we can tell!

  As a Frontend Engineer at Retell AI, you’ll build the user
  experiences that power our voice automation platform from
  prompt management and dashboards to analytics and customer-
  facing tools. You’ll design and ship intuitive, responsive
  interfaces using React and TypeScript, working closely with
  backend and DevOps partners to ensure everything is fast,
  reliable, and scalable.

  You’ll own frontend projects end to end, collaborate
  directly with customers to onboard and debug real-world use
  cases, and turn feedback into meaningful UX improvements.
  This is a hands-on, high-impact role where you’ll move
  quickly, take ownership, and help shape a product used in
  production by teams building with voice AI.

  KEY RESPONSIBILITIES

  - Design and build core UI features like prompt management,
    dashboards, and analytics tools.
  - Develop responsive, intuitive interfaces using React,
    TypeScript, HTML, CSS, and JavaScript.
  - Collaborate on backend APIs and DevOps to ensure seamless,
    scalable systems.
  - Lead frontend projects from concept to launch, owning
    architecture, coding, and iteration.
  - Work with customers to onboard, debug, and turn feedback
    into UX improvements.

  YOU MIGHT THRIVE IF

  - Have 2+ years of experience building production-grade apps
    with React and TypeScript.
  - Hold a degree in CS, CE, or equivalent practical experience.
  - Take ownership like a founder, proactively solving problems
    with clean design thinking.
  - Thrive in fast-paced environments, quickly learning new
    tools and frameworks.
  - Collaborate effectively, balancing clarity and momentum in
    small, dynamic teams.

  JOB DETAILS

  - Location: Redwood City, CA, US
  - US Visas: Retell AI is open to sponsoring work authorization
    for qualified candidates, including H-1B, TN, L-1, E-3,
    F-1 (OPT/CPT), and O-1 visas.

  Compensation

  Our compensation ranges reflect different scopes of
  responsibility and cash/equity options. Your offer will
  depend on the skills and impact you demonstrate during
  interviews, the scope of the role, and your preferred
  cash/equity balance.

  Annual base salary ranges:

  - Senior: $210,000–$250,000
  - Staff: $200,000–$300,000
  - Principal: $250,000–$350,000

  OTHER BENEFITS

  - 100% coverage for medical, dental, and vision insurance
  - $70/day DoorDash credit for unlimited breakfast, lunch,
    dinner, and snacks
  - $200/month wellness reimbursement (gym, fitness classes,
    etc.)
  - $300/month commuter reimbursement (gas, Caltrain, etc.)
  - $75/month phone bill reimbursement
  - $50/month internet reimbursement

  COMPENSATION PHILOSOPHY

  - Best Offer Upfront: Choose from three cash-equity balance
    options; no negotiation needed.
  - Top 1% Talent: Above-market pay (top 5 percentile) to
    attract exceptional builders.
  - High Ownership: Small teams, >$1M revenue/employee, and
    significant equity.
  - Performance-Based: Offers tied to interview performance, not
    experience or past salaries.

  INTERVIEW PROCESS

  - Intro Call (15-20min): Connect with our talent team to get a
    deeper look at the team and the work you'd be doing.
  - First Technical Phone Interview (45 min): Practical coding
    session focused on code fluency and system design (For
    frontend roles, we will focus on React-specific questions)
  - Technical Phone Interview (45 min): Practical coding session
    focused on code fluency and focused more heavily on your
    systems design approach
  - Onsite/Virtual Interviews (2–3 hrs): Hosted in our office if
    located in the Bay Area or virtual, with three rounds:
    - Practical Coding: Tackle real-world coding tasks with
      debugging.
    - System Design: Architect a production-ready system.
    - Tools & Automation: Build automations or improve workflows
      in any basic environment setup like python, java,
      node.js, etc.

