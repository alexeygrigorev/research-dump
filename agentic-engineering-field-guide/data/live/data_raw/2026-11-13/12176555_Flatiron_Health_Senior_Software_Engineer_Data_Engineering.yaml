description: |
  Reimagine the infrastructure of cancer care within a
  community that values integrity, inspires growth, and is
  uniquely positioned to create a more modern, connected
  oncology ecosystem.  We're looking for a customer-obsessed
  Senior Data Engineer to help us accomplish our mission to
  improve and extend lives by learning from the experience of
  every person with cancer. Are you ready to be the next
  changemaker in cancer care? What You'll Do The Core Products
  Engineering team builds data product offerings that power
  insights for our life science partners, who leverage our
  data to improve health outcomes through cancer treatment
  research. Our customers rely on Flatiron data to make
  decisions about drug/disease targets, submit evidence for
  FDA approvals, and publish peer-reviewed research. In this
  role, you'll work at the intersection of engineering and
  cross-functional collaboration-designing data solutions
  while partnering closely with quantitative scientists,
  clinical data analysts, research oncologists, and project
  managers.

  - Design, build, and maintain data solutions that deliver
    insights to our customers, answer their targeted oncology
    research questions, and enable R&D across the drug
    discovery lifecycle
  - Collaborate with clinical data analysts to ensure data meets
    quality standards and contractual requirements
  - Break down ambiguous requirements into well-scoped,
    actionable work; surface risks and ask clarifying
    questions early
  - Translate business and research needs into technical
    solutions, balancing customer needs, technical
    constraints, and delivery timelines
  - Serve as a role model to mentor, educate, and develop junior
    data engineers
  - Context-switch across multiple pipelines and stakeholders
    while maintaining accountability for on-time delivery
  - Participate in design and code reviews, giving and receiving
    constructive feedback that elevates team quality
  - Identify inefficiencies in code or processes and propose
    improvements
  - Effectively leverage AI-assisted coding tools to accelerate
    development while applying critical judgment to maintain
    quality
  - Monitor CI/CD processes to ensure pipelines run reliably;
    investigate and resolve issues by tracing to root causes

  Who You Are You're a kind, passionate, and collaborative
  problem-solver who values the opportunity to think beyond
  the way things are. You're an empathetic communicator who
  can translate between technical and non-technical audiences.
  You thrive in ambiguity, stay calm under pressure, and are
  laser-focused on delivering value for our customers. In
  addition you have:

  - 4+ years of professional experience in data engineering,
    software engineering, or data-intensive applications
  - Strong proficiency in SQL and Python
  - Experience building, maintaining, and debugging ETL/ELT
    pipelines as well as the underlying systems orchestrating
    them
  - Experience with cloud platforms (AWS preferred) and
    containerized environments (Docker)
  - Experience with data modeling and production datasets in
    Snowflake
  - Experience leading data engineering teams and managing
    engineers
  - You are an expert in data engineering best practices
    (debugging, testing, validation, orchestration,
    observability)
  - You collaborate effectively through Git, code review, and
    documentation
  - You communicate clearly with non-technical stakeholders and
    enter discussions with curiosity
  - You're excited to work in a fast-moving environment and
    willing to be scrappy to get the job done
  - Bachelor's, Master's, or Ph.D. in computer science, data
    science, or a related field

  Extra Credit

  - Experience working in healthcare or with healthcare-related
    data standards
  - Experience working directly with customers in a solutions
    engineer or forward deployed engineer role
  - Experience developing with AI-assisted tools like Cursor or
    Claude Code

  Where You'll Work In this hybrid role, you'll have a defined
  work location that includes work from home and 3 office days
  set by you and your team. For more information on our
  approach to hybrid work, please visit the how we work
  website. Life at Flatiron At Flatiron Health, we offer a
  full range of benefits to support you and your loved ones so
  you can focus your working hours on improving cancer care
  and accelerating cancer research, and your non-working hours
  on everything else life has to offer:

  - Work/life autonomy via flexible work hours and flexible paid
    time off
  - Comprehensive compensation package
  - 401(k) contribution to help you reach your retirement
    planning goals
  - Financial health resources including 1:1 financial advice
  - Mental well-being tools and services
  - Parental benefits and policies including family-building
    care and generous leave
  - Path to parenthood programs supporting fertility, adoption
    and surrogacy
  - Travel support for safe healthcare services

  In addition to our robust benefit offerings, visit our Life
  at Flatiron page to learn how we support continuous learning
  and celebrate inclusion and belonging in the workplace.  Job
  Compensation Range Salary Range: $152,000.00 - $209,000.00
  Preferred Primary Location: NY office The annual pay range
  reflected above for this position is based on the preferred
  primary location of the role which is listed in the job
  description. Salary ranges for other locations vary from the
  range reflected above. Base pay offered may vary depending
  on job-related knowledge, skills, and experience. An annual
  bonus and equity may be provided as part of the compensation
  package, in addition to a full range of medical, financial,
  and/or other benefits, dependent on the position offered.
