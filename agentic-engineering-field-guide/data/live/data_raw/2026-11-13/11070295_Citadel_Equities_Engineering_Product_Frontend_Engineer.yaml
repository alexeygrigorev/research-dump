description: |
  Job Description Equities Engineering: Equities Engineering
  powers the world's most successful Fundamental Equities
  business. Our platform finds an edge in the market through
  proprietary research, analytics, and portfolio management
  tools. Our investors are sector specialists who develop deep
  theses on the largest public companies globally. As one of
  the most product-obsessed engineering teams at Citadel, we
  design and deliver a sophisticated suite of tools that drive
  every stage of the investment process-from rigorous
  fundamental research to systematic portfolio construction.
  Equities Product Frontend Engineers partner closely with
  trading, portfolio management, risk, and research teams to
  build high-impact, investor-facing products. In this role,
  you will own the full UI surface area for a segment of the
  investor workflow, operating with significant
  accountability, execution velocity, and direct commercial
  impact. Role Responsibilities:

  - Own the end-to-end development and evolution of products for
    an Equities vertical, from identifying user pain points
    and opportunities through design, implementation, launch,
    and iteration.
  - Work directly with investors and other users to understand
    workflows, uncover opportunities to improve Citadel
    processes, and translate those insights into intuitive,
    high-impact product experiences.
  - Build data-intensive, high-performance applications using
    React and TypeScript, supporting workflows such as
    research, risk analytics, portfolio analysis, and
    investment decision-making.
  - Partner with Product Managers and UX Designers, contributing
    to product strategy, prioritization, and solution design
    with strong technical judgment, commercial awareness, and
    user empathy.
  - Rapidly prototype and iterate on new products and features,
    refining solutions with user feedback and real-world usage
    to maximize impact.
  - Maintain a high bar for engineering quality and ownership,
    delivering clean, well-tested, maintainable software while
    managing multiple products and priorities.

  Requirements:

  - 3+ years of professional software engineering experience.
  - Strong frontend engineering expertise with advanced
    proficiency in React and TypeScript.
  - Demonstrated experience building and shipping production-
    grade, data-driven user interfaces.
  - Strong understanding of frontend architecture, state
    management, performance optimization, and component
    design.
  - Ability to operate independently with high ownership and
    accountability.
  - Proven product mindset, balancing technical excellence with
    commercial impact.
  - Excellent collaboration skills across engineering, product,
    and design teams.
  - Comfortable working in a fast-paced, iterative development
    environment.

