description: |
  Canonical is a leading provider of open source software and
  operating systems to the global enterprise and technology
  markets. Our platform, Ubuntu, is very widely used in
  breakthrough enterprise initiatives such as public cloud,
  data science, AI, engineering innovation, and IoT. Our
  customers include the world's leading public cloud and
  silicon providers, and industry leaders in many sectors. The
  company is a pioneer of global distributed collaboration,
  with 1200+ colleagues in 75+ countries and very few office-
  based roles. Teams meet two to four times yearly in person,
  in interesting locations around the world, to align on
  strategy and execution.

  The company is founder-led, profitable, and growing.

  We are hiring a Engineering Manager - Python and K8s that is
  passionate about building a world-class devops culture in
  corporate information systems. We are confident that we can
  dramatically improve the experience of running complex
  business operations - and then we can help our customers
  embrace those new techniques and products. Traditionally, IS
  is an inward-facing operation. We would like to transform
  our IS team into an extension of the product engineering
  capability at Canonical. Our internal workloads are in many
  cases the same open source workloads that our customers want
  to operate. This team will productise those workloads for
  real-time automated operations on Kubernetes.

  As an engineering manager you’ll lead a team in your local
  time zone, focused on the business workloads that make
  Ubuntu, Canonical, and our various services highly available
  around the planet.You will be responsible for sound software
  architecture and best practices in software quality, testing
  and documentation.Technical leadership experience and a
  background in software engineering are prerequisites for
  this role. You will be expected to lead, challenge, and
  develop strong engineers, positively influence the culture,
  facilitate technical delivery, and work with your team on
  strategy and execution.

  What you’ll do

  - You’ll lead a team focused on productising business
    workloads
  - You will build and manage a regional team of engineers
  - You'll develop your team through coaching, mentoring, and
    feedback
  - You will demonstrate sound engineering by directly
    contributing toward your team’s goals
  - Set reasonable schedules based on considered estimates, with
    feedback loops for improvement
  - Set and manage expectations with other engineering teams and
    external stakeholders
  - Advance modern, agile software development practices
  - Maintain a culture of quality and engineering excellence
  - Grow a healthy, collaborative engineering culture in line
    with the company values
  - Be an active part of the leadership team and collaborate
    with other leaders in the organisation
  - Work from home with global travel up to 20% for internal and
    external events

  Who you are

  - You have experience in Docker and Kubernetes operations
  - You have a software engineering background, with proven
    Python experience
  - You have experience developing Python frameworks, and
    understand the importance of stable consumable APIs
  - You love embracing new technologies and pushing the
    boundaries of what is possible
  - You have an interest in building products that improve how
    people operate software and infrastructure everywhere
  - You love developing and growing people and have a track
    record of doing it
  - You are knowledgeable and passionate about software
    development
  - You have experience working in an agile development
    environment

  What we offer colleagues

  We consider geographical location, experience, and
  performance in shaping compensation worldwide. We revisit
  compensation annually (and more often for graduates and
  associates) to ensure we recognize outstanding performance.
  In addition to base pay, we offer a performance-driven
  annual bonus or commission. We provide all team members with
  additional benefits which reflect our values and ideals. We
  balance our programs to meet local needs and ensure fairness
  globally.

  - Distributed work environment with twice-yearly team sprints
    in person
  - Personal learning and development budget of USD 2,000 per
    year
  - Annual compensation review
  - Recognition rewards
  - Annual holiday leave
  - Maternity and paternity leave
  - Team Member Assistance Program & Wellness Platform
  - Opportunity to travel to new locations to meet colleagues
  - Priority Pass and travel upgrades for long-haul company
    events

  About Canonical

  Canonical is a pioneering tech firm at the forefront of the
  global move to open source. As the company that publishes
  Ubuntu, one of the most important open-source projects and
  the platform for AI, IoT, and the cloud, we are changing the
  world of software. We recruit on a global basis and set a
  very high standard for people joining the company. We expect
  excellence; in order to succeed, we need to be the best at
  what we do. Most colleagues at Canonical have worked from
  home since our inception in 2004. Working here is a step
  into the future and will challenge you to think differently,
  work smarter, learn new skills, and raise your game.

  Canonical is an equal opportunity employer

  We are proud to foster a workplace free from discrimination.
  Diversity of experience, perspectives, and background create
  a better work environment and better products. Whatever your
  identity, we will give your application fair consideration.

