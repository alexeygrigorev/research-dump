description: |
  At Linkby, we believe great storytelling deserves to meet
  great audiences. We power a performance-based press release
  platform that helps D2C brands land editorial placements on
  premium publishers, but only pay for real clicks. We exist
  to amplify authentic voices and drive measurable impact in
  digital media.

  We're looking for a Senior Full Stack Developer to help us
  build and scale the next generation of our publishing
  marketplace. This role is about shipping high-quality
  features end-to-end on a lean, AI-augmented team where your
  output punches well above its weight. You'll also mentor
  teammates, contribute to technical direction, and raise the
  bar for how we build.

  About the role

  Location: North America (Canada, California, New York or
  Colorado), Remote-first (we have hubs in Sydney, London,
  Toronto and New York; occasional in-office/hybrid options)

  Employment Type: Full-time

  As a Senior Full Stack Developer, you'll own features from
  database to UI and everything in between. We're an AI-native
  engineering team - we treat tools like Cursor and Claude
  Code as core infrastructure, not nice-to-haves. You'll work
  closely with leadership and product to turn ambiguous
  problems into shipped software. Day to day, you will:

  - Design and implement high-quality, scalable and resilient
    web applications.
  - Ship features end-to-end in partnership with product
    managers and designers: design APIs, optimize queries,
    polish UI and own the outcomes.
  - Deploy and manage cloud-native applications on AWS, ensuring
    high availability, performance, and security.
  - Contribute to and influence architecture decisions that will
    shape how we scale the marketplace over the next 12–24
    months.
  - Build AI-powered platform capabilities - semantic matching
    between brands and publishers, in-app agents, campaign
    performance prediction, etc.
  - Keep the platform fast, reliable, and secure under load;
    proactively address bottlenecks and production issues.
  - Implement security best practices (e.g. OWASP guidelines)
    and ensure compliance with data privacy regulations (e.g.
    GDPR, CCPA) across all development stages, including
    secure coding, data encryption, and access control.
  - Drive continuous improvement through code reviews, agentic
    workflows, automated testing, and CI/CD practices.
  - Mentor teammates through code reviews, pairing, and career
    development.

  About you

  - Proficiency in both front-end (JavaScript/TypeScript,
    Vue/React) and back-end (Node.js, Golang) technologies.
  - Fluency in databases (PostgreSQL, Clickhouse), APIs
    (REST/GraphQL), and cloud infrastructure (AWS/GCP).
  - Real experience directing agentic coding workflows: you've
    used tools like Cursor or Claude Code to scaffold entire
    features, caught the subtle bugs they introduce, and know
    where they reliably fall short.
  - Proficiency operating in both human-in-the-loop and human-
    on-the-loop paradigms - you know when a task needs you
    steering every step versus when you set constraints and
    let an agent run, then review the output. You can
    articulate why you'd choose one over the other for a given
    problem.
  - Strong understanding of software engineering principles,
    design patterns, and best practices - AI tools make you
    faster, but you know what's happening under the hood and
    can debug a production outage at 2 AM without them.
  - Experience integrating LLM APIs or ML models into production
    applications - not just calling an endpoint, but handling
    prompt management, output validation, cost control, and
    graceful degradation.
  - Comfort working in fast-moving environments: you bias for
    shipping, iterate quickly, and bring others along with
    you.
  - A track record of influencing architecture, scaling systems,
    and making pragmatic trade-offs.
  - Strong communication skills: you can advocate for smart
    technical decisions with leadership, while ensuring the
    team feels heard and supported.
  - Bonus: background in adtech, programmatic advertising, or
    marketplace platforms with proven track record in
    developing and scaling high-traffic, large-scale
    applications.

  If you don’t meet 100% of the above qualifications, you
  should still consider applying. Studies show that you can
  still be considered for a role if you meet just 50% of the
  position’s requirements.

  About us

  Linkby is a growing, VC-backed adtech startup on a mission
  to democratize the link between brands and trusted voices -
  helping both grow and thrive. We’re transforming how brands
  share their stories with the world’s most trusted
  publishers, on a platform that feels like magic.

  Our technology connects D2C advertisers with high-quality
  publishers and powers CPC-based press releases that turn
  great storytelling into measurable results. We believe
  transparency and effectiveness go hand in hand, and that
  every connection between a brand and a publisher should
  create value for both sides.

  We’re a remote-first team with hubs in key cities - Sydney,
  London, Toronto, and New York - for those who thrive on in-
  person collaboration. No matter where we’re based, we’re
  united by a shared vision and a set of values that shape how
  we work every day.

  Our Vision

  To transform how brands share their stories with the world’s
  most trusted voices - on a platform that feels like magic.

  Our Mission

  To democratize the link between brands and trusted voices,
  helping both grow and thrive.

  Core Linkby Values

  This is how we do it.

  1. Excel with Kindness

  We’re thoughtful, equitable and team-first - with each
  other, and our partners.

  Kindness isn’t about being nice. It’s about honesty,
  empathy, and doing what’s right, even when it’s hard. We
  celebrate wins together, have each other’s backs, and
  approach challenges with care and accountability.

  2. BYO Magic

  We’re hungry, curious, and each of us brings something
  unique to the table. That spark - your superpower - is what
  drives results, builds culture, and helps us stand out. We
  back processes that help us move fast, but we also leave
  room for individuality, creativity, and the kind of impact
  you can’t templatize.

  3. Be a Maker

  We roll up our sleeves and find a way forward. No matter the
  challenge, we stay agile, take ownership, and get things
  done. Whether it’s a scrappy test or a big-picture shift,
  we’re all builders here.

  What we offer

  - Competitive salary + equity package (we believe in shared
    upside)
    - $155,000-185,000/yr depending on country location and
      experience level
  - Flexible remote work + optional office access
  - Generous paid time off / leave policy
  - Health & wellness benefits (depending on location)
  - Opportunities for fast growth, mentorship, and leadership
  - High autonomy and ownership - you’ll see the direct impact
    of your work

  Ready to apply?

  Send us your resume, links to your GitHub or portfolio, and
  a short note on what excites you about Linkby and this role.

  Interview process (typical):

  - Intro & role alignment chat
  - Technical assessment
  - Final interview with leadership

  We strive for fairness and transparency. If you don’t match
  every listed skill but bring passion, curiosity, and a
  strong foundation, we encourage you to apply.

  Note: You'll need valid work authorization in North America
  to join us.
