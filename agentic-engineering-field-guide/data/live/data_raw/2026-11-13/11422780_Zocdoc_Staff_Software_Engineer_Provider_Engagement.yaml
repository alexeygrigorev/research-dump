description: |
  Our Mission

  You call. You wait. You call again. In every other part of
  your life, you book in seconds. In healthcare, you’re
  blocked.

  We’re here to give power to the patient.

  For nearly 20 years, we’ve built the leading healthcare
  marketplace - helping tens of millions of people find and
  book the care they need. Now, we’re going further: building
  our infrastructure beyond Zocdoc’s marketplace to power
  access to care wherever patients search, from provider
  websites and insurance directories to search engines, AI
  platforms, and more.

  Healthcare still lacks something every other major consumer
  industry takes for granted: a seamless way to go from
  seeking to getting. We don’t want to own the front door to
  care; there isn't one. We want to make sure all of those
  doors open when patients are knocking.

  Fixing healthcare starts with fixing access to it. And we're
  still just getting started.

  Your Impact on our Mission

  We're building Zocdoc's provider engagement platform — a
  system that understands where each practice is in their
  journey and delivers personalized experiences that deepen
  their relationship with our platform. Think: intelligent
  recommendations, engagement scoring, AI-assisted practice
  management, and a provider experience that makes Zocdoc
  essential to daily operations.

  As Staff Engineer, you'll own the technical architecture for
  core components of this platform. You'll design systems that
  integrate ML models built by our Data Science team, build
  the data pipelines that power personalization, and ensure
  our product surfaces can consume intelligence seamlessly.

  What You'll Do

  - Own architecture for a major domain  practice intelligence
    APIs, recommendation serving, orchestration layer, or AI-
    assisted management
  - Design data pipelines that compute engagement signals,
    aggregate practice profiles, and feed downstream systems
  - Integrate ML models built by Data Science into production
    model serving, feature pipelines, monitoring, and feedback
    loops
  - Define APIs and contracts between platform services and
    product surfaces
  - Lead complex cross-team projects and drive alignment on
    technical direction
  - Make build-vs-buy decisions for infrastructure components
  - Mentor engineers and raise the bar on system design and
    operational excellence

  You'll enjoy this role if you are…

  - Inspired by the opportunity to positively impact the
    healthcare experience for millions of patients and
    providers
  - Passionate about building data-intensive platforms that
    power intelligent, personalized experiences at scale
  - Product-driven with a relentless focus on user needs, and
    excited to partner closely with cross-functional teams
    from early ideation through delivery
  - Energized by designing scalable platform systems  data
    pipelines, APIs, and real-time services that power
    intelligent product experiences
  - A fervent champion of engineering fundamentals who enjoys
    driving adoption of best practices in code health,
    testing, and observability across teams
  - A leader who mentors and grows engineers, cultivates
    innovation, and drives cross-collaboration across multiple
    teams
  - A believer that diverse and inclusive teams and cultures are
    non-negotiable
  - An entrepreneur with strong ownership who can thrive in an
    ambiguous and fast-changing environment

  Your day to day is…

  - Technical ownership of Zocdoc's Provider Engagement
    Platform, including roadmapping, prototyping, and leading
    0-1 projects that span data infrastructure, ML
    integration, and product surfaces
  - Designing and building the unified practice intelligence
    layer, aggregating fragmented data into real-time profiles
    that power personalization and recommendations
  - Architecting event pipelines that capture engagement
    signals, compute health scores, and feed downstream ML
    models
  - Integrating ML models built by Data Science into production
    systems, model serving, feature pipelines, monitoring, and
    feedback loops
  - Defining APIs and contracts between platform services and
    product surfaces (homepage, in-product messaging, CRM,
    Sales tools)
  - Making build-vs-buy decisions for infrastructure components
    (event systems, feature stores, in-product messaging
    platforms)
  - Analyzing and decomposing complex product challenges to
    drive sound design decisions
  - Working hands-on with your team and shipping production code
    using C#, React, and AWS technologies
  - Collaborating with our agile team of dedicated engineers,
    product managers, designers, and data scientists
  - Mentoring your peers and colleagues by giving thoughtful
    feedback, with the notion that helping others means
    learning and growing yourself

  You'll be successful in this role if you have…

  - 8+ years of software engineering experience with
    demonstrated technical leadership
  - Experience building data-intensive systems  event pipelines,
    aggregation services, or real-time data serving
  - Comfort integrating ML into products you've worked with Data
    Science to take models from notebook to production
  - Strong API and data modeling skills you design schemas and
    interfaces that evolve gracefully
  - Ability to navigate ambiguity you break product vision into
    concrete technical milestones
  - Excellent communication  you write clear design docs and
    explain tradeoffs to product partners
  - Track record of shipping you deliver high-quality systems,
    not just designs

  Benefits:

  - Flexible, hybrid work environment at our convenient Soho
    location
  - Unlimited Vacation
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - Commuter Benefits
  - 401(k) with employer funded match
  - Corporate wellness program with Wellhub
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Catered lunch every day along with beverages and snacks
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging
  - Great Place to Work Certified

  Zocdoc is committed to fair and equitable compensation
  practices. Salary ranges are determined through alignment
