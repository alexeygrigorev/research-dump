description: |
  About ElevenLabs

  ElevenLabs is an AI research and product company
  transforming how we interact with technology.

  We launched in January 2023 with the first human-like AI
  voice model. Today, we serve millions of users and thousands
  of businesses - from fast-growing startups to large
  enterprises like Deutsche Telekom and Meta. Our investors
  are some of the world's most prominent, including Andreessen
  Horowitz, ICONIQ Growth and Sequoia. We've raised $781M in
  funding and our last valuation was $22B - multiples of 11,
  always. We have expanded from voice into three main
  platforms:

  - ElevenAgents enables businesses to deliver seamless and
    intelligent customer experiences, with the integrations,
    testing, monitoring, and reliability necessary to deploy
    voice and chat agents at scale.
  - ElevenCreative empowers creators and marketers to generate
    and edit speech, music, image, and video across 70+
    languages.
  - ElevenAPI gives developers access to our leading AI audio
    foundational models.

  Everything we do is the result of the creativity and
  commitment of our team - builders doing the best work of
  their lives. We are researchers, engineers, and operators.
  IOI medalists and ex-founders. If you want to work hard and
  create lasting positive impact, we want to hear from you.

  How we work

  - High-velocity: Rapid experimentation, lean autonomous teams,
    and minimal bureaucracy.
  - Impact not job titles: We don’t have job titles. Instead,
    it’s about the impact you have. No task is above or
    beneath you.
  - AI first: We use AI to move faster with higher-quality
    results. We do this across the whole company—from
    engineering to growth to operations.
  - Excellence everywhere: Everything we do should match the
    quality of our AI models.
  - Global team: We prioritize your talent, not your location.

  What we offer

  - Innovative culture: You’ll be part of a generational
    opportunity to define the trajectory of AI, surrounded by
    a team pushing the boundaries of what’s possible.
  - Growth paths: Joining ElevenLabs means joining a dynamic
    team with countless opportunities to drive impact - beyond
    your immediate role and responsibilities.
  - Learning & development: ElevenLabs proactively supports
    professional development through an annual discretionary
    stipend.
  - Social travel: We also provide an annual discretionary
    stipend to meet up with colleagues each year, however you
    choose.
  - Annual team offsite: Each year, we bring your entire team
    together in a new location - past offsites have included
    Croatia, Italy and Cancún
  - Co-working: If you’re not located near one of our main hubs,
    we offer a monthly co-working stipend.

  About the role

  The Payments team owns how ElevenLabs charges customers:
  billing, usage tracking, pricing and payments across self-
  serve and enterprise. Everything we do has to be correct,
  because it underpins the company's revenue and is
  immediately visible to every customer and team.

  We are hiring full stack engineers (backend leaning) to
  expand and evolve our payments systems. Your
  responsibilities might include:

  - Building and maintaining usage tracking so that requests are
    metered accurately without impacting latency.
  - Leading our migration of enterprise pricing and usage
    processing, including new stream-processing services for
    usage events.
  - Making it easy for customers to upgrade and pay, including
    paying through different entities and supporting new
    payment providers.
  - Working with Finance and Tax teams to meet compliance, audit
    and reporting requirements.
  - Enabling pricing and Growth experiments with Growth and
    product teams.
  - Debugging complex customer billing scenarios: piecing
    together what happened from the customer's experience,
    logs and code, and fixing the cause.
  - Collaborating with Sales, FDEs, Finance and engineers across
    the company.

  Much of this work extends or replaces systems that already
  exist, so you will scope carefully, plan migrations, and
  roll changes out without disrupting customers.

  Requirements

  We do not require any formal experience, certifications, or
  degrees. Instead, we are seeking engineers who can show they
  have solved impressively hard problems, through past
  projects or GitHub contributions. We do require:

  - Expertise in Python.
  - A strong background in backend development.
  - Experience with common software and system design patterns
    and infrastructure, including APIs, cloud infrastructure
    tools, storage solutions and data structures.
  - Strong test design and security fundamentals.
  - Care and attention to detail when changing live systems that
    handle money.
  - The ability to learn a large existing system quickly and to
    debug complex production issues.

  Bonus:

  - Experience with payment processing providers, or with
    billing and usage-based pricing systems
  - Experience with stream processing or high-throughput event
    pipelines.
  - Experience working with finance, tax or audit requirements.
  - Experience with Kubernetes.

  Location

  Our team is based across the UK, EU and US, and this is our
  main focus. We are flexible for exceptional candidates
  elsewhere. You can work remotely, or from our offices in
  Dublin, London, New York, San Francisco and Warsaw.

  #LI-Remote

  We are an equal opportunity employer and do not discriminate
  on the basis of race, religion, national origin, gender,
  sexual orientation, age, veteran status, disability or other
  legally protected statuses.
