description: |
  This is a remote position.



  Position Overview



  We are looking for a Senior Full Stack Developer with strong
  proficiency in Python to produce scalable software
  solutions. You’ll be part of a cross-functional team
  responsible for the full software development life cycle,
  from conception to deployment. As a Full Stack Developer,
  you should be comfortable working with both front-end and
  back-end coding languages, development frameworks, and
  third-party libraries. You should also be a team player with
  a knack for visual design and utility. This is a work-from-
  home position for developers residing in Panama, Colombia.









  Duties and Responsibilities



  - Help with the design and development of software.
  - Test and debug software to ensure it remains optimized.
  - Write clean code for both the front-end and back-end of
    software.
  - Design user interactions for web applications.
  - Create servers and databases for back-end functionality.
  - Ensure cross-platform compatibility and optimization.
  - Test and maintain responsive design for applications.
  - Collaborate with graphic designers to design new features.
  - Develop APIs and RESTful services.
  - Stay up-to-date with technological advances to optimize
    software.
  - Communicate the effectiveness of emerging technologies to
    decision-makers.
  - Consider security, maintenance, scalability, and other
    factors when developing software.








  Requirements



  - Proven experience as a Full Stack Developer or similar role.
  - Degree in Computer Science or a related field is a plus.
  - Proficiency in English is a plus.
  - Excellent communication and teamwork skills.
  - Great attention to detail.
  - Strong organizational skills.
  - Analytical mindset with problem-solving capabilities.
  - Strong proficiency in Python frameworks (e.g., Django,
    Flask, FastAPI).
  - Knowledge of multiple front-end languages (HTML, CSS,
    JavaScript) and JavaScript frameworks (React, Node, Vue).
  - Familiarity with databases (MySQL, Oracle, PostgreSQL,
    MongoDB) and UI/UX design.
  - Proficient in software versioning tools (Git, SVN).
  - Familiarity with containerization technology (e.g., Docker).
  - Familiarity with GNU/Linux.
  - Familiarity with Agile methodologies.







    Benefits

  Benefits



  - Family Medical Insurance
  - Opportunities for professional development and career
    growth.
  - Collaborative and innovative work environment.
  - Flexible schedule with remote working options.



  Application Process



  Interested candidates should submit a resume, cover letter,
  and portfolio of relevant work to:




   Application Portal:
  https://intechideas.zohorecruit.com/jobs/Careers



  The selection process includes:



  - Screening interview.
  - Technical Test
  - Technical Interview
  - Final Interview



  Intech Ideas International is an Equal Opportunity Employer.



  We celebrate diversity and are committed to creating an
  inclusive environment for all employees.



  If you are a passionate and skilled professional eager to
  take on exciting challenges and grow with a dynamic team,
  we’d love to hear from you!



  Apply Now to join our team and contribute to building world-
  class web applications.
