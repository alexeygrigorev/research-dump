description: |
  Canonical is a leading provider of open source software and
  operating systems to the global enterprise and technology
  markets. Our platform, Ubuntu, is very widely used in
  breakthrough enterprise initiatives such as public cloud,
  data science, AI, engineering innovation, and IoT. Our
  customers include the world's leading public cloud and
  silicon providers, and industry leaders in many sectors. The
  company is a pioneer of global distributed collaboration,
  with 1200+ colleagues in 75+ countries and very few office-
  based roles. Teams meet two to four times yearly in person,
  in interesting locations around the world, to align on
  strategy and execution.

  The company is founder-led, profitable, and growing.

  We are hiring technical engineering manager to redefine the
  embedded Linux experience with the smallest, most secure,
  and most reliable operating system in the IoT market.

  This is an opportunity for a technical leader passionate
  about open source software, Linux, containers, security, and
  the developer experience, to shape the future of Linux from
  the smallest systems up to desktops. This challenging role
  demands a high degree of technical skill as well as high
  caliber for inspiring and driving people.

  Our mission is to allow everyone to build robust solutions
  in various fields including but not limited to IoT,
  automotive, and aviation using the next generation secure
  embedded Linux operating system in a simple solution. We
  define a reliable and secure set of device recovery
  mechanisms that enable device manufacturers to simplify and
  standardize the field operations for fleets of heterogeneous
  appliances.

  As an engineering manager, you’ll lead a team of strong
  software developers to design and implement Ubuntu Core
  system software on various CPU architectures, such as ARM,
  RISC-V, and X86.  You will meet stakeholders, prioritize
  requests, plan the roadmap and ensure the team can deliver
  their goals. You will have the opportunity to influence the
  culture, facilitate technical delivery, and work with your
  team on strategy and execution.

  The role entails

  - Building and leading a distributed team of engineers through
    hiring, coaching, mentoring, feedback and career
    development
  - Demonstrating sound engineering principles by directly
    contributing toward your team’s goals
  - Coaching and mentoring team members with hands-on career
    development
  - Effectively setting and managing expectations with other
    engineering teams, senior management, and external
    stakeholders
  - Advocating and advancing modern, agile software development
    practices and helping develop and evangelize great
    engineering and organizational practices
  - Contributing to a healthy, collaborative engineering culture
    in line with the company values
  - Actively participating in the leadership team and
    collaborating with other leaders in the organisation

  What we are looking for in you

  - Demonstrated competencies in embedded software development
  - Strong skills in Golang, C++ and Shell
  - A solid understanding of Linux and a modern GNU/Linux
    distribution, Debian or Ubuntu preferred
  - Love for developing and growing people and have a track
    record of doing it
  - Demonstrated ability of planning and executing to deliver
    high quality software in a timely manner
  - Solid experience working in an agile development environment
  - Exceptional academic track record from both high school and
    university
  - Undergraduate degree in a technical subject or a compelling
    narrative about your alternative chosen path
  - Professional written and spoken English with excellent
    presentation skills

  Nice-to-have skills

  - Familiarity with an immutable Linux distribution, preferably
    Ubuntu Core
  - Experience with multiple CPU architectures such as ARM,
    RISC-V
  - Experience with Linux native containerization and security

  What we offer colleagues

  We consider geographical location, experience, and
  performance in shaping compensation worldwide. We revisit
  compensation annually (and more often for graduates and
  associates) to ensure we recognize outstanding performance.
  In addition to base pay, we offer a performance-driven
  annual bonus or commission. We provide all team members with
  additional benefits which reflect our values and ideals. We
  balance our programs to meet local needs and ensure fairness
  globally.

  - Distributed work environment with twice-yearly team sprints
    in person
  - Personal learning and development budget of USD 2,000 per
    year
  - Annual compensation review
  - Recognition rewards
  - Annual holiday leave
  - Maternity and paternity leave
  - Team Member Assistance Program & Wellness Platform
  - Opportunity to travel to new locations to meet colleagues
  - Priority Pass and travel upgrades for long-haul company
    events

  About Canonical

  Canonical is a pioneering tech firm at the forefront of the
  global move to open source. As the company that publishes
  Ubuntu, one of the most important open-source projects and
  the platform for AI, IoT, and the cloud, we are changing the
  world of software. We recruit on a global basis and set a
  very high standard for people joining the company. We expect
  excellence; in order to succeed, we need to be the best at
  what we do. Most colleagues at Canonical have worked from
  home since our inception in 2004. Working here is a step
  into the future and will challenge you to think differently,
  work smarter, learn new skills, and raise your game.

  Canonical is an equal opportunity employer

  We are proud to foster a workplace free from discrimination.
  Diversity of experience, perspectives, and background create
  a better work environment and better products. Whatever your
  identity, we will give your application fair consideration.

