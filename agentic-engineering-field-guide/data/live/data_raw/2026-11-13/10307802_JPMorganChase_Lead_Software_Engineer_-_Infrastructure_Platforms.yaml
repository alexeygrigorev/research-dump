description: |
  Join us as we launch a new Technology Line of Business into
  Dublin, where you’ll help build and operate the
  infrastructure platforms that power JPMorganChase. You’ll
  work hands-on with a small, senior team, leveraging AI-
  native practices to accelerate development and reduce
  operational toil. This is your opportunity to own production
  systems, write impactful code, and create scalable patterns
  across the firm. If you’re ready to tackle greenfield
  challenges and advance your career alongside expert peers,
  this is the place for you.

  As a Senior Engineer in Infrastructure Platforms at JPMorgan
  Chase within the Infrastructure Platforms team, you will
  design, build, and operate enterprise-scale infrastructure
  platforms as a key member of our Dublin team. You’ll be
  hands-on and technically deep, writing production code and
  solving complex problems with full accountability for
  reliability, performance, security, and cost. You’ll work
  AI-native across the software development lifecycle, matched
  to a platform domain that fits your background, and help
  establish the engineering culture of our new hub.

  You’ll have the opportunity to join one of several high-
  impact teams, each focused on building critical capabilities
  for the firm. Whether you’re engineering self-service
  agentic development environments, shaping a database-wide
  control plane, creating an enterprise data lake, automating
  end-to-end workflows, enhancing the discoverability of
  infrastructure assets, or advancing automation platforms,
  your work will drive innovation and scale across
  JPMorganChase. You’ll collaborate with talented peers,
  tackle complex technical challenges, and help define the
  future of our infrastructure platforms.

  Job Responsibilities:

  - Design, build, and operate enterprise-scale infrastructure
    services end-to-end, from specification through production
  - Write and review high-quality production code, owning system
    reliability, performance, security, and cost
  - Solve complex problems live in production, establishing end-
    to-end ownership and expert understanding of your services
  - Work AI-native across the SDLC, using AI-assisted
    development, code review, test generation, and incident
    analysis while maintaining validation standards
  - Share an on-call rotation with your team and act as an
    escalation point for production incidents, building
    operability and observability from the start
  - Analyze and optimize code and systems for quality,
    scalability, efficiency, and performance
  - Decompose ambiguous problems into clear, executable work for
    yourself and AI agents, integrating results into
    production-ready systems
  - Define success criteria for your work and measure its impact
  - Collaborate with teammates and stakeholders, contribute to
    technical decisions, and proactively raise risks
  - Apply security and operational-risk judgment throughout the
    engineering lifecycle

  Required Qualifications, Capabilities, and Skills:

  - Solid production coding experience in an industry-standard
    language (e.g., Python, Go, Java, C++, Rust)
  - Experience with *nix (Linux or UNIX-like OS) and networking
    fundamentals
  - Hands-on experience building or operating systems in at
    least one infrastructure domain (cloud, networking,
    compute, storage, security, or data infrastructure)
  - Experience configuring and running infrastructure-level
    systems and tooling (Kubernetes, Terraform, CI/CD,
    databases)
  - Strong systems thinking, understanding interfaces,
    contracts, failure modes, and interactions at scale
  - Fluency using AI tools for engineering work, with sound
    judgment on AI applicability versus human expertise
  - Security-first mindset, integrating risk judgment from
    specification through production
  - Clear, direct communication with teammates, stakeholders,
    and peers
  - Outcome orientation, focused on impact, reliability, and
    cost
  - Comfort operating with ambiguity and greenfield scope

  Preferred Qualifications, Capabilities, and Skills:

  - Experience across multiple infrastructure domains or
    programming languages
  - Experience running services at scale, including on-call
    ownership, incident response, and capacity planning
  - Track record of reducing operational toil through automation
    and improved engineering
  - Demonstrated ongoing AI skill development (context/prompt
    engineering, agent orchestration) and use of AI tools to
    redesign workflows for measurable impact
  - Prior experience in regulated or large-scale enterprise
    environments
  - Experience with greenfield engineering projects
  - Track record of solving complex technical problems
    independently

  Why Join Us? You’ll do frontier infrastructure engineering
  alongside a small, senior team, owning real systems the firm
  depends on. You’ll work AI-native from the start, on
  greenfield problems, in a brand-new Dublin hub. We progress
  people based on the quality of their decisions and the
  impact of their work. Join a team where building takes
  precedence over maintenance, deep technical craft is valued,
  and your work scales across the firm.

  About UsJ.P. Morgan is a global leader in financial
  services, providing strategic advice and products to the
  world’s most prominent corporations, governments, wealthy
  individuals and institutional investors. Our first-class
  business in a first-class way approach to serving clients
  drives everything we do. We strive to build trusted, long-
  term partnerships to help our clients achieve their business
  objectives.




    We recognize that our people are our strength and the
