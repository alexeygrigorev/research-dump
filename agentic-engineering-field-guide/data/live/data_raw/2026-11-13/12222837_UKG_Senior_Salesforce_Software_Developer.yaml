description: |
  Why UKG:

  At UKG, the work you do matters. The code you ship, the
  decisions you make, and the care you show a customer all add
  up to real impact. Today, tens of millions of workers start
  and end their days with our workforce operating platform.
  Helping people get paid, grow in their careers, and shape
  the future of their industries. That’s what we do.

  We never stop learning. We never stop challenging the norm.
  We push for better, and we celebrate the wins along the way.
  Here, you’ll get flexibility that’s real, benefits you can
  count on, and a team that succeeds together. Because at UKG,
  your work matters—and so do you.


  About the team: You’ll join a team focused on delivering
  enterprise Salesforce solutions that support critical go-to-
  market business processes. The team works across Salesforce
  development, integrations, DevOps, and artificial
  intelligence-driven solutions to improve business
  capabilities and technical excellence.



  About the role: As a Senior Salesforce Sales Cloud Technical
  Developer, you will lead the design, development, and
  implementation of enterprise Salesforce solutions. You will
  design scalable Sales Cloud and artificial intelligence
  solutions, lead development efforts, mentor engineers, and
  contribute to strategic Salesforce initiatives.



  Key responsibilities:

  - Lead the development and deployment of Salesforce Sales
    Cloud and artificial intelligence solutions.
  - Design and develop scalable solutions using Apex, triggers,
    Batch Apex, Queueable Apex, Lightning Web Components
    (LWC), Flows, and other Salesforce platform capabilities.
  - Build and maintain integrations with enterprise applications
    using REST APIs, SOAP APIs, Platform Events, and
    middleware technologies.
  - Drive DevOps best practices and release automation using
    Gearset continuous integration and continuous delivery
    (CI/CD) pipelines.
  - Collaborate with business stakeholders, architects, and
    product teams to translate business requirements into
    effective technical solutions.
  - Conduct code reviews and enforce development standards for
    quality, security, maintainability, and performance.
  - Mentor junior developers and support knowledge sharing
    across the development team.
  - Troubleshoot complex production issues and implement
    sustainable solutions.
  - Evaluate and adopt emerging artificial intelligence and
    Agentic AI technologies to enhance Salesforce business
    processes.



  About you:

  Basic qualifications

  - 6–8 years of overall information technology experience,
    including 4+ years of Salesforce development experience.
  - Strong hands-on expertise in Apex, triggers, Batch Apex,
    Queueable Apex, and Lightning Web Components.
  - Experience with Salesforce integrations and API-based
    architectures.
  - Hands-on experience with Gearset CI/CD and automated
    deployment processes.
  - Knowledge of Salesforce Agentforce and Revenue Cloud or ARM
    solutions.
  - Salesforce Platform Developer I (PD1) certification.
  - Excellent problem-solving, communication, and leadership
    skills.



  Preferred qualifications

  - Experience with artificial intelligence application
    development, Agentic AI frameworks, or enterprise AI
    solutions.
  - Experience integrating AI agents and AI-powered workflows
    with Salesforce applications.
  - Additional Salesforce certifications.

  Company Overview:

  UKG is the Workforce Operating Platform with unified HR,
  payroll, and workforce management, built to solve the unique
  challenges of frontline work. Powered by people-first AI and
  decades of labor data, UKG turns workforce intelligence into
  real-time decisions around staffing, pay, compliance, and
  productivity, enabling every worker to confidently take
  action as work happens. That’s why more than 80,000
  organizations worldwide trust UKG to run their workforce —
  not just manage it. Learn more at ukg.com.

