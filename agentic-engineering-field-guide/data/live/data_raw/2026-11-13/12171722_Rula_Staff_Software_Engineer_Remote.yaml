description: |
  At Rula, we are a remote-first company that believes mental
  health is just as important as physical health. We recognize
  that mental health issues can be complex and multifaceted,
  and we are dedicated to treating the whole person, not just
  the symptoms.

  We aim to create a world where mental health is no longer
  stigmatized or marginalized, but rather is embraced as an
  integral part of one's overall well-being.

  We believe that by providing quality care that is both
  evidence-based and compassionate, we can empower individuals
  to take charge of their mental health and achieve their full
  potential. We are passionate about making a positive impact
  on the lives of those struggling with mental health issues
  and we strive to be a force for positive change in the field
  of mental healthcare.

  About the Role

  We are looking for a Staff Software Engineer to join the
  Patient Experience Team at Rula. This team owns the end-to-
  end care journey for our patients and is responsible for
  building the patient portal — the central platform through
  which patients manage every aspect of their care, from
  scheduling and billing to communicating with their care team
  and tracking their treatment plans. Our work directly drives
  patient engagement, retention, and operational efficiency.

  As a Staff Engineer on this team, you will lead the design
  and development of high-impact, full-stack solutions that
  shape the patient experience at scale. You’ll work closely
  with cross-functional partners to define technical
  direction, guide architectural decisions, and ensure our
  systems are reliable, secure, and scalable. In addition to
  delivering mission-critical features, you’ll mentor
  engineers, influence the technical roadmap, and play a key
  role in evolving the engineering culture. Your work will
  directly advance our mission to make mental healthcare work
  for everyone.

  Required Qualifications

  - 8+ years of experience as a software engineer building and
    maintaining scalable, production-ready systems.
  - Full-stack expertise with strong frontend and backend
    capabilities, including deep experience with React, state
    management, and frontend performance optimization. Strong
    backend engineering skills with TypeScript and Node.js,
    including API design, service architecture, data modeling,
    and database interactions. Demonstrated ability to design,
    build, and operate secure, scalable, and reliable systems
    across the full stack.
  - Hands-on experience with microservice and/or event-based
    architectures.
  - Proven ability to lead complex technical initiatives across
    teams, owning the full development lifecycle from planning
    through launch and maintenance. Experience owning
    technical problem spaces beyond individual projects,
    identifying systemic issues, defining long-term technical
    direction, and driving improvements over time.
  - Excellent collaboration and communication skills, with
    experience aligning engineering efforts to business goals.
  - Experience mentoring engineers, reviewing system
    architectures, and defining scalable design patterns.

  Preferred Qualifications

  While having the preferred qualifications enhances your
  candidacy, having all of them is not mandatory. We encourage
  all interested applicants to apply, even those who may not
  meet every preferred requirement.

  - Computer Science degree or equivalent practical experience.
  - Experience with modern frameworks and infrastructure
    including TypeScript, React, Node.js, Kafka, and AWS.
  - Comfortable participating in on-call rotations; able to
    independently troubleshoot and resolve complex production
    issues.
  - Background in building products that require high
    reliability and accuracy (e.g., healthcare, finance,
    mission-critical systems).
  - Prior experience in early-stage or high-growth startup
    environments.

  We're serious about your well-being! As part of our team,
  full-time employees receive:

  - 100% remote work environment: Working hours to support a
    healthy work-life balance, ensuring you can meet both
    professional and personal commitments (must be based in
    United States, currently not hiring in Hawaii)
  - Attractive pay and benefits: Full transparency of pay ranges
    regardless of where you live in the United States
  - Comprehensive health benefits: Medical, dental, vision,
    life, disability, and FSA/HSA
  - 401(k) plan access: Start saving for your future
  - Generous time-off policies: Including 2 company-wide
    shutdown weeks each year for self-care (for most
    employees)
  - Paid parental leave: Available for all parents, including
    birthing, non-birthing, adopting, and fostering
  - Employee Assistance Program (EAP): Supporting your mental
    and physical health
  - Quarterly department stipend: Fun team-building activities
    or in-person gatherings
  - Community and employee resource groups: Participate in
    groups that celebrate employee identity and lived
    experiences, fostering a sense of community and belonging
    for all
  - Home office stipend: New hire home office stipend & $50
    monthly stipend to help cover internet or cell phone
    expenses
  - Wellness at Rula program: Year-round wellness initiatives
    and a $50/month wellness stipend

  Our team

  We believe that diversity, equity, and inclusion are
  fundamental to our mission of making mental healthcare work
  for everyone.  We are dedicated to having a culture of
  inclusion that will support our employees in feeling safe,
  seen, heard, and valued.
