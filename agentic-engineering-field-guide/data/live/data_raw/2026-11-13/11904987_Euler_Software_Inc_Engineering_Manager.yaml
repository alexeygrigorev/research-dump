description: |
  Engineering Manager

  Location: Remote (Must accommodate US East Coast working
  hours)

  About Us

  Partnerships are the future of go-to-market. They drive
  30-50% of company revenue, yet most partner teams are stuck
  with spreadsheets, email chains, and outdated CRMs - tools
  never built for partnerships at scale. The result? Wasted
  time, lost deals, and inefficiencies that kill growth.

  EULER is the AI-native PRM for modern partnership teams -
  built to replace manual work, eliminate partner friction,
  and turn partner activity into repeatable revenue and
  measurable ROI. Our mission: make partner revenue scalable
  and predictable.

  We grew 600% YoY in 2025 and serve industry leaders like
  Gong, and BambooHR - consistently winning against legacy
  solutions. We move fast, build intentionally, and focus on
  delivering real value. If you're excited to solve big
  problems, work with smart teammates, and shape the future of
  partner tech, we'd be glad to meet you.

  Role Overview

  As Engineering Manager at Euler, you will own the day-to-day
  execution of the engineering team. You report to the
  Director of Engineering and work closely with Product and
  Design to ensure the team delivers high-quality work on
  time, every sprint.

  This is a player-coach role. You stay close to the technical
  work while growing the engineers around you. Your path at
  Euler is clear: own delivery and team health today, and grow
  into broader engineering leadership as the company scales.

  Key Responsibilities

  - Lead, mentor, and develop a team of engineers, providing
    regular coaching, feedback, and career support.
  - Own sprint planning, task distribution, and delivery
    execution in close partnership with the Product Manager.
  - Maintain engineering standards across code quality,
    documentation, testing practices, and technical debt
    management.
  - Translate product and technical requirements into clear,
    actionable plans for the team.
  - Identify bottlenecks and risks early, surface them
    proactively, and bring solutions to the Director of
    Engineering.
  - Coordinate closely with the Director of Engineering on team
    priorities, architectural decisions, and tooling.
  - Support hiring and onboarding of future engineering talent
    as the team grows.
  - Keep delivery moving without sacrificing quality,
    maintaining a healthy balance between speed and stability.

  What We're Looking For

  - 5+ years of software engineering experience, with at least 2
    years in an engineering leadership or management role.
  - Strong technical background, comfortable leading technical
    discussions and reviewing decisions without needing to
    code daily.
  - Hands-on experience with Bubble.io or strong familiarity
    with no-code and low-code platforms.
  - Proven ability to manage delivery in an agile environment
    with clear processes for sprint planning and execution.
  - Strong communicator, able to translate technical concepts
    clearly for both engineers and non-technical stakeholders.
  - Consultative mindset, comfortable surfacing problems early
    and proposing thoughtful solutions.
  - Highly organized, calm under pressure, and deeply ownership-
    driven.

  Nice to Have

  - Experience with AWS Lambda or similar cloud infrastructure.
  - Experience with Cloudflare products (eg., Workers, bindings,
    etc).
  - Familiarity with CRM integrations, APIs, or partner tech
    ecosystems.
  - Background in B2B SaaS platforms, particularly in PRM or
    adjacent categories.

  What Will Not Work Here

  - Managing from a distance instead of staying close to the
    technical work.
  - Letting technical debt pile up in the name of speed.
  - Avoiding hard conversations about performance or code
    quality.
  - Waiting for the Director of Engineering to catch problems
    you should have flagged first.

  Compensation

  Competitive salary and benefits.

  Why Join Us

  - Own engineering execution at a profitable, fast-growing SaaS
    company.
  - Work within a clear leadership structure with a defined
    growth path.
  - Be part of a team that is redefining how partner revenue
    gets built and managed.
  - Competitive salary and benefits.
  - No ego, full ownership, entrepreneurial culture.

  We'd love to meet you.
