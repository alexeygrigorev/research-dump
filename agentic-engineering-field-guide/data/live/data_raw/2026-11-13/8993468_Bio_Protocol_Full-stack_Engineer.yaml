description: |
  Bio is a decentralized science protocol that helps launch
  and grow AI-driven biotech research. It enables scientists
  to raise funds, create value from their work, and distribute
  that value directly to their communities. Since 2023, Bio
  has directed over $50m to global researchers, offering an
  alternative to traditional pharma funding. Backed by
  investors like Binance Labs, Northpond Ventures, and Animoca
  Brands, Bio accelerates real-world therapeutics across
  longevity, brain health, fertility, psychedelic science, and
  more.

  The Role

  We're looking for a full-stack engineer to help build
  products that connect researchers, funders, and the broader
  scientific community. You'll work across the entire stack -
  from crafting intuitive user interfaces to designing robust
  backend systems and smart contracts.

  What You'll Do

  • Build and maintain web applications that serve researchers
  and the science community

  • Design and implement APIs, databases, and backend services

  • Collaborate with designers and product to ship features
  users love

  • Contribute to web3 infrastructure and smart contract
  development

  • Help shape technical direction and engineering culture as
  we grow

  What We're Looking For

  • Experience building web applications (any stack - we value
  adaptability over specific tools)

  • Comfort working across frontend and backend

  • Strong problem-solving skills and a pragmatic approach to
  shipping

  • Clear communication - we're remote-first and async-
  friendly

  • Curiosity about web3, biotech, or open science (experience
  not required)

  Nice to Have

  • Experience with blockchain development or smart contracts

  • Background in science, research, or working with
  scientific data

  • Contributions to open source projects

  Why Bio

  • Fully remote - work from anywhere

  • Meaningful work at the frontier of science and technology

  • Small team, big impact - your work matters here

  • Competitive compensation with token/equity component
