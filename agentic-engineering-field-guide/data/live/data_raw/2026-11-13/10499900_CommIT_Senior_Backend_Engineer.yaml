description: |
  Description

  We’re growing fast and looking for a Senior Backend Engineer
  to join our Engineering team and help build the
  infrastructure that powers our platform at scale.

  This is a high-impact role where you’ll work alongside top-
  tier engineers, designing and building secure, high-
  performance systems in a fast-paced environment. If you
  enjoy solving complex technical challenges and want your
  work to have real impact — we’d love to meet you.

  What We’re Looking For:

  - Bachelor’s degree in Computer Science or a related field
  - 5+ years of experience in backend development
  - Strong experience building scalable, production-grade
    systems
  - Proficiency in Node.js
  - Experience with SQL and NoSQL databases
  - Familiarity with cloud platforms and microservices
    architecture
  - Strong problem-solving skills and attention to detail
  - Passion for writing clean, maintainable, and efficient code

  Requirements

  Bonus Points For:

  - Experience in cybersecurity or building security-focused
    products
  - Experience working in startup or high-growth environments
  - Familiarity with DevSecOps / SDLC tools
  - Experience with distributed systems and high-scale data
    processing
