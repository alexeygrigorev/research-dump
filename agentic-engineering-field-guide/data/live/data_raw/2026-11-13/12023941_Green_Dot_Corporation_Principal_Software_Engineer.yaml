  We’re looking for talented professionals to join us in
  bringing smart money management and payment solutions to
  everyone’s fingertips.

  <<>><<>><<>><<>><<>><<>><<>><<>><<>><<>>

  JOB DESCRIPTION

  Location Requirement This position is open only to
  candidates who currently reside in one of the following
  approved locations:

  West Los Angeles, CA

  Job Summary

  Principal Engineer: Rearchitect Green Dot Corporation’s
  Banking as a Service (BaaS) platform for the future using
  cloud native techniques. Build the next generation banking
  and payments platform. Contribute towards moving the team
  forward in continuous integration, continuous delivery,
  cloud migration, and test-driven development practices.
  Design highly scalable distributed solutions to handle large
  amounts of data. Work on complex integration projects by
  working out API contracts, identifying gaps, and working out
  optimal solutions. Document and demonstrate solutions by
  developing flowcharts, sequence diagrams and business
  process flow diagrams. Organize and run working sessions by
  setting up agendas, driving discussions towards resolutions,
  and delegating actions to participants. Own a component or
  capability during a project delivery stage and be on point
  for fulfilling the responsibility. Ensure software is
  designed and built with quality, maintainability,
  scalability, availability, extensibility, security,
  portability, and testability. Partner with product teams to
  shape the future state of products. Actively identify
  technical debt and work with internal stakeholders to
  address debt on an ongoing basis. Understand evolving
  industry trends and identify new technologies and patterns
  which should be adopted, and old technologies which should
  be deprecated. Participate in code reviews, coach team
  members, and learn from receiving feedback.

  Key Responsibilities

  - Lead the design and development of APIs and microservices
    that support BaaS onboarding and partner integration.
  - Collaborate with product managers, architects, and other
    engineering teams to define technical requirements and
    deliver robust solutions.
  - Drive engineering excellence through code reviews,
    mentoring, and best practices in CI/CD, testing, and
    observability.
  - Ensure compliance with SLA standards and contribute to the
    development of monitoring and alerting systems.
  - Lead incident response and root cause analysis to improve
    system reliability.
  - Drive architectural decisions and long-term technical
    strategy for BaaS platform, including generating
    documentation around architectural and design options
    analysis and decisions.
  - Champion emerging technologies evaluation and adoption.
  - Refactor and extend the existing codebase to fix defects and
    add features/functionality
  - Create systems that are durable and flexible by developing
    for change – favor configurability over customization.

  Required Qualifications

  - Education and experience
    - Bachelor's degree or foreign equivalent in Computer Science,
      Accounting, Accounting Information Systems, or a related
      field, plus six (6) years of experience as a Principal
      Engineer, Software Engineer, or related occupation.
    - A strong portfolio showing secure, standards-compliant code
      across multiple platforms, including the Microsoft stack
      and open-source technologies.
  - Experience must include:
    - Languages and frameworks: C#, .NET, ASP.NET, and SQL Server.
    - Cloud: Designing, developing, and hosting cloud-native
      applications in Azure or AWS. This includes Azure native
      services such as APIM, Azure SQL, Cosmos DB, and Key
      Vault, plus container technologies and caching
      frameworks.
    - APIs and web services: RESTful API design, OAuth2, and
      OpenAPI specifications. Also, SOAP and XML/JSON business
      object representations.
    - Architecture: Designing and building microservices
      frameworks, event-driven patterns (Service Bus, Event
      Hubs), and software design patterns and anti-patterns.
      Writing code for scalable, reliable systems.
    - DevOps and delivery: Git and GitHub, CI/CD processes, build
      tools (TeamCity), pipelines, and blue-green deployments.
    - Observability: Implementing and using observability
      dashboards and platforms (Datadog, Grafana).
    - Methodology: Agile development, including Scrum and Extreme
      Programming.
    - Security and compliance: Security best practices in
      financial services and compliance standards (PCI DSS,
      SOC 2).
  - Work environment
    - Ability to thrive in a fast-paced environment with iterative
      project turnarounds on mission- and revenue-critical,
      customer-facing applications.

  Preferred Qualifications

  - Prior experience in fintech or embedded finance platforms.
  - Familiarity with partner onboarding workflows and SLA
    management.
  - Contributions to open-source projects or technical
    publications.

  **Ability to work in the U.S. without sponsorship**
  **Ability to meet the location requirement outlined above**

  PAY RANGE

  The targeted base salary for this position is $160,000 to
  $230,000 per year. The final compensation will be determined
  by a number of factors such as qualifications, expertise,
  and the candidate’s geographical location.

