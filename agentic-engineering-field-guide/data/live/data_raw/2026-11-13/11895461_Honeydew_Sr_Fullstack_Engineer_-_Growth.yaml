description: |
  The Mission 💪

  Our mission is to ensure that no one in the world has to
  suffer from a treatable skin disease because of an access
  issue ever again.

  About Honeydew 👋

  Honeydew is building a platform for hundreds of millions of
  people globally to access expertise and science-backed skin
  treatments, from prescription to retail. Our tech-forward
  dermatology experience helps people with chronic skin
  conditions access licensed specialists, FDA-approved
  treatment, and ongoing support in record time. Honeydew is
  the future of skin health — digitally native, scientifically
  rooted, integrated end-to-end, and powered by AI.

  The Opportunity 📈

  Our Growth Engineering and Patient Experience team has more
  growth and retention opportunities than it can act on at
  once. As Senior Software Engineer, you add the throughput:
  building the features and experiments across our TypeScript
  backend and React front end that help more patients start
  treatment, stay with it, and have an experience they'd
  recommend. You'll ship, measure, and learn alongside a
  product manager and designer, so the team can run more
  initiatives in parallel and improve the patient journey
  faster.

  What You'll Build (Your First 6 Months) 🛠

  - Growth and retention features: by day 60, at least two
    features or experiments in the patient journey shipped
    behind feature flags, with success metrics defined before
    launch; by day 180, at least six, contributing to a
    measurable improvement in at least one conversion or
    retention metric agreed with product
  - A patient journey you can measure: by day 60, an
    instrumentation audit of at least one key journey, such as
    onboarding, with the gaps closed; by day 180, every
    feature and experiment you ship launches with complete
    instrumentation and a results readout shared with product
  - A faster, more accessible front end: by day 60, performance
    and accessibility baselined on the core patient pages your
    team owns and the top three issues fixed; by day 180,
    those pages within agreed performance targets, with no P1
    or P2 incidents caused by features you shipped

  How You'll Make an Impact

  Build growth features end to end. You'll work with the
  engineering lead, product manager, and designer to plan
  growth and retention initiatives, then build features across
  our TypeScript backend and React front end using agentic
  engineering methods.

  Run experiments. You'll instrument features and experiments,
  ship them behind feature flags, and analyze results with
  product to decide what to build next.

  Own the patient experience. You'll review other engineers'
  code, and investigate and fix incidents in the patient
  experience areas you own.

  What We're Looking For

  The Non-Negotiables:

  - Full-stack TypeScript — production experience building
    backend APIs in TypeScript on AWS (Lambda or ECS) and
    front-end features in React, ideally with MUI and Vite,
    and comfortable owning a feature from API to UI
  - Growth and experimentation — you've shipped growth or
    retention features in a consumer product, including A/B
    tests, feature-flagged rollouts, and analytics
    instrumentation, and you use data to decide what to build
    next
  - Consumer-facing product quality — you've built polished,
    mobile-friendly web experiences with attention to
    performance, accessibility, and usability for non-
    technical users
  - 4+ Years of experience in a similar role

  The Nice-to-Haves:

  - Healthtech experience — developed software in a digital
    health environment including experience handling PHI and
    HIPAA related practices.
  - Healthcare AI — familiarity with clinical NLP, healthcare
    data processing, or AI-assisted clinical workflows.
  - Technical leadership — Experience mentoring engineers and
    contributing to technical design decisions

  You'll Thrive Here If…

  - You deliver on the date you commit to, without cutting
    quality
  - You let data decide what to build next, including when an
    experiment doesn't work
  - You care how a patient experiences the product, not just
    whether it ships
  - You give direct, useful feedback in code review
  - You plan and learn alongside product and design rather than
    waiting for a spec

  Why Honeydew?

  Real Ownership:

  You'll own features from API to UI and the results they
  produce — this isn't a role where accountability disappears
  into a committee.

  Mission-Critical Work:

  Every improvement to the patient journey helps someone who
  has been struggling with their skin start and stay on
  treatment.

  Total Rewards:

  Competitive pay, equity, health benefits, and a fully remote
  role, plus employee perks and recognition programs.
