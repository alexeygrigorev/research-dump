description: |
  Simple Life is the #1 AI-powered health coaching app for
  adults who want to lose weight and enjoy a healthier
  lifestyle-without the stress or extremes. Our mission is to
  empower people to feel their best every day. By challenging
  traditional, restrictive approaches, Simple offers a more
  sustainable method grounded in ease, personalization, and
  real-life support.

  Simple has had over 17 million downloads and more than
  300,000 5-star reviews, having helped millions lose weight
  successfully and sustainably. Simple has earned recognition
  as Best Virtual Coach and one of the Top 100 AI companies —
  all thanks to a dedicated global team driving real impact.

  With SIMPLE as a partner in their pocket, users feel cared
  for and empowered to embrace - and stick to - new healthy
  habits. To learn more, visit simple.life.

  We’re looking for a senior, product-minded engineer to join
  our technical marketing team and build web products, growth
  tools, integrations, and automation.

  You’ll own initiatives end to end-from gathering
  requirements and researching solutions to shaping the UX,
  defining an MVP, designing the architecture, and shipping to
  production. We value strong engineering judgment, proactive
  ownership, and effective use of AI coding agents over a
  specific stack.

  What you'll do:

  - Own initiatives: clarify requirements, research options,
    define MVP scope, and deliver working solutions;
  - Build web applications, APIs, automation, and internal tools
    using Node.js, Python, or Go;
  - Create clear user flows, prototype interfaces, and turn
    ideas into intuitive, well-designed products;
  - Make architectural decisions and balance delivery speed,
    reliability, and maintainability;
  - Configure and improve agent-powered development workflows,
    integrations, and automated checks;
  - Collaborate with marketing, product, and design; own
    testing, deployment, releases, and improvements after
    launch.

  What we're looking for:

  - 5+ years of professional software development experience,
    with proven ownership of products or substantial features;
  - Strong backend skills in Node.js / TypeScript, Python, or
    Go—depth in one and flexibility across others; all three
    are not required;
  - Hands-on frontend experience with React, Vue, or similar
    frameworks;
  - Practical UX expertise and UI design skills: user flows,
    prototyping, usability, and visual consistency;
  - Strong system design skills: architecture, data modeling,
    APIs, integrations, reliability, and scalability;
  - Deep understanding and hands-on experience with AI coding
    agents and agent infrastructure: context management, tool
    integrations, task orchestration, and validation of
    generated changes
  - Experience turning loosely defined problems into production-
    ready solutions—not just implementing predefined tickets;
  - Solid knowledge of SQL, relational databases, Git, CI/CD,
    and cloud infrastructure;
  - Proactive execution, clear communication, and English for
    documentation and teamwork.

  Nice to Have:

  - Experience with marketing technology, analytics,
    experimentation, or growth engineering.

  Perks and Benefits:

  - Open-minded teams, a welcoming and inclusive company
    culture, plus the opportunity to make a real difference
    with a game-changing health tech product.
  - A competitive salary package based on your unique expertise,
    skillset, and impact on the product plus stock options.
  - Remote and hybrid work opportunities.
  - The equipment whatever you need to be happy and productive.
  - A premium SIMPLE subscription.
  - 21 days annual leave, plus bank holidays (those observed
    where you live).
  - Flexible hours. We focus on your results, not how long you
    spend at your desk.

  About our values:

  Think deeper: We understand that in order to grow we need to
  make all our decisions reality-based and change our opinion
  based on what we learn. We appreciate data coming in various
  forms – quantitative and qualitative, feedback from users
  and colleagues, and strong and weak signals.We treat data as
  the main source for leveraging insights and expect people at
  every level to have conversations that start with data.

  Focus on impact: Results and speed matter. When we are
  competing to become an A-player in the digital health
  market, we don’t have the luxury of deliberation. We need to
  make decisions and changes quickly and, swiftly learn from
  our mistakes.We prioritize what will have the greatest
  impact and aren’t distracted by anything else. We create
  products that benefit users while we are meeting our
  metrics.

  Take ownership: We seek to improve all facets of our company
  even in ways beyond our job description. We seek and take
  responsibility for our actions and their impact. We value
  and set high expectations for our own work so that it can
  add to the overall quality and innovation results of the
  team. Each one of us is empowered to make this company a
  success, take the lead to resolve disagreements and systemic
  issues.

  Push the limits: We encourage our team to explore new ideas,
  challenge conventional thinking, and continuously improve
  work. This mindset can lead to breakthroughs in product
  development, improved operational efficiency, and increased
  competitiveness in the market. We believe that a culture and
  mindset of constantly striving to exceed existing standards,
  boundaries, or expectations that include innovation,
  experimentation, and a willingness to take risks, can bring
  us success. We don't accept what someone says as truth if we
  disagree with it, no matter what authority that person has
  in the company and express ourselves directly, not through
  back channels. We challenge ideas, from policy to product
  decisions, and always seek to understand the reason behind
  what we do.

  Be a Championship Team: As a part of the championship team,
  you must improve your own performance constantly also know
  your teammates, their talents and skills and be focused on a
  common goal and how to achieve it together. We hold each
  other accountable for our contribution to the shared success
  or failure, and we constantly look for ways to help our
  colleagues to improve and for us to perform better as a
  team. We collaborate within the team in order to compete
  with challengers in the outside world. We build
  relationships of trust. We provide our teammates with the
  autonomy and support they need to deliver their part of the
  goal.
