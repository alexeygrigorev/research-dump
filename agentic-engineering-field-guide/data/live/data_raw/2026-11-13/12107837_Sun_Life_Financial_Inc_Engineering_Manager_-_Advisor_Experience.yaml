  Job Description:



  The Role  Prospr is Sun Life's digital front door for
  Canadians — startup velocity inside a Fortune 500. We're
  revolutionizing how Canadians access insurance and wealth
  solutions by building a platform that lets people buy
  products the way they want to: online in minutes or
  virtually via a team of trusted, licensed Advisors.

  We're not playing it safe. We're building with AI and
  creating omnichannel experiences — at the speed customers
  now expect. You lead the squad. Your team's success is your
  success. Despite the growth of digital channels, many people
  still prefer a conversation with a trusted advisor when
  making important financial decisions. We don't believe the
  future is a choice between digital and human experiences.
  It's giving customers the flexibility to move seamlessly
  between both: starting independently online, getting advice
  at the right moment, and returning to self-service later
  without friction.

  As Engineering Manager - Advisor Experience, you lead the
  squad that builds the advisor experiences, Salesforce
  integrations, business workflows, and internal capabilities
  supporting advisor-led and advisor-assisted sales processes.
  You're accountable for the squad's delivery, people
  development, and execution quality, balancing hands-on
  technical contribution with people leadership. You'll work
  closely with Product Directors, Advisors and sales
  stakeholders to drive business outcomes.

  For candidates with these preferred skills, exceptions
  beyond the usual salary range below may be possible.

  What You'll Do?  • Lead sprint execution and delivery
  commitments with full accountability • Translate product
  requirements and sales workflows into clear, executable
  engineering work • Own the delivery of advisor experiences
  and Salesforce integrations that support advisor-led and
  advisor-assisted sales • Partner with Advisors, sales
  operations, and business stakeholders to improve internal
  workflows and capabilities • Directly manage
  developers—hiring, performance, growth, engagement, and
  career development • Enforce engineering standards and code
  quality within your squad • Stay technically credible—you
  code when needed and lead technical discussions • Build and
  maintain a healthy squad culture aligned with Accelerator
  principles • Remove blockers and manage dependencies with
  other squads, enterprise teams, and vendors • Own day-to-day
  delivery coordination with Product, Design, and other squads
  • Balance technical debt with feature delivery—you make the
  trade-offs • Operate with startup velocity—fast iterations,
  continuous deployment, data-driven decisions

  What Success Looks Like?  Your squad delivers predictably
  and at high velocity. Advisors and sales teams get tools and
  integrations that make their sales process faster and
  easier.  Engineers are growing and engaged. Code quality is
  consistently high. The team collaborates well. Product and
  stakeholders trust your commitments. You're shipping
  features that drive business outcomes.

  Who You Are?  • Experienced engineer ready to lead people or
  current Engineering Manager from a product-focused tech
  company • Startup mindset—you know how to ship fast and
  iterate based on data • Comfortable balancing people
  management and hands-on technical work – you lead by setting
  the example • Strong at sprint planning, estimation, and
  execution in an Agile environment • Comfortable having tough
  conversations about performance, growth, and accountability
  • Detail-oriented without losing sight of business outcomes
  • Able to context-switch between code reviews, 1:1s, and
  stakeholder management • Protective of your team's time and
  focus while maintaining high throughput

  What You Bring  • 7+ years of professional software
  engineering experience, including 2+ years in an Engineering
  Manager (or equivalent team leadership) role • Experience
  leading a single squad/team end-to-end • Hands-on experience
  with CRM platforms (Salesforce preferred), including
  building and integrating CRM-based workflows • Strong
  knowledge of sales processes (e.g., lead management,
  pipeline stages, quoting, application, and advisor handoffs)
  • Hands-on expertise with Java, React (or similar modern
  JavaScript) and enterprise integrations • Demonstrated
  ability to run team-level execution and improve delivery
  predictability • Experience hiring, onboarding, and
  developing engineers • Technical credibility to guide design
  and implementation • Proven partnership with Product,
  Design, and business stakeholders

  Why This Role?  • High-Impact Work • Leadership Opportunity:
  help shape team structures, engineering practices, delivery
  processes, and how we measure success • Autonomy and
  Ownership • Learn and Grow Fast • Collaborative, Innovative
  Culture • Flexible Workstyle: In office 2–3 days per week,
  hybrid the rest of the week

  The Base Pay range is for the primary location for which the
