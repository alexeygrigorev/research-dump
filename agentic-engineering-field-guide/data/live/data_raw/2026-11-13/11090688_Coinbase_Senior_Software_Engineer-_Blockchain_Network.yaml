description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  As a Senior Software Engineer on the Blockchain Networks
  team within the Platform group, you'll build the critical
  infrastructure that integrates blockchain protocols with
  Coinbase's internal services for new assets, stablecoins,
  and staking. This team translates complex blockchain
  operations and state machines into simple, reliable APIs
  that product teams across Coinbase depend on. You'll own
  multi-quarter technical initiatives and ship platform
  primitives that directly improve the latency, reliability,
  and cost of our crypto stack.

  What you'll do:

  - Own the design and delivery of blockchain network
    infrastructure that abstracts blockchain complexity into
    reliable, platform APIs
  - Lead multi-quarter initiatives including new chain
    integrations, re-architecture efforts, and data migrations
    that improve system latency, reliability, and cost
  - Define and maintain APIs, SLOs, and observability for the
    systems you build, including on-call ownership
  - Partner with product and platform teams to establish data
    contracts and ship SDKs and platform primitives that drive
    adoption across Coinbase
  - Build deep technical context across multiple top blockchain
    protocols (e.g., Bitcoin, Ethereum) and apply that
    knowledge to simplify cross-chain operations

  Required Skills and Experience:

  - 5+ years of software engineering experience, with
    demonstrated ownership of production services in a
    service-oriented architecture
  - Proven track record designing, scaling, and maintaining
    distributed systems handling high-throughput, low-latency
    workloads
  - Hands-on experience with at least two of the following:
    Golang, Kafka, Redis, MongoDB, or similar infrastructure
    technologies
  - Direct experience with blockchain protocols or crypto
    infrastructure (e.g., integrating with Ethereum, Bitcoin,
    or similar L1/L2 networks)
  - Demonstrated ability to decompose complex systems
    (monoliths, legacy architectures) into well-bounded
    microservices with clear API contracts
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality.

  Job ID#: P77731

  Pay Transparency Notice: Base salary varies by location (see
  range below). Total compensation may also include equity and
  bonus eligibility, and benefits (medical, dental, vision,
  401(k)).

  Annual base salary range (excluding equity and bonus):

  $186,065—$218,900 USD

