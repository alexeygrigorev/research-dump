description: |
  At Index Exchange, we’re reinventing how digital advertising
  works—at scale. As a global advertising supply-side
  platform, we empower the world’s leading media owners and
  marketers to thrive in a programmatic, privacy-first
  ecosystem.

  We’re a proud industry pioneer with over 20 years of
  experience accelerating the ad technology evolution. Our
  proprietary tech is trusted by some of the world’s largest
  brands and media owners and plays a crucial role in keeping
  the internet open, accessible, and largely free.

  We process more than 800 billion real-time auctions every
  day (in comparison, Google processes 14 billion searches per
  day) with ultra-low latency. Our platform is vertically
  integrated from servers to networks and runs primarily on
  our own metal and cloud infrastructure. This end-to-end
  infrastructure is designed to provide both stability and
  agility, enabling us to adapt quickly as the market evolves.

  At the core of it all is our engineering-first culture. Our
  engineers tackle internet-scale problems across tight-knit,
  global teams. From moving petabytes of data and optimizing
  with AI to making real-time infrastructure decisions,
  Indexers have the agency and influence to shape the future
  of advertising. We move fast, build thoughtfully, and stay
  grounded in our core values.

  About the role:

  We are seeking an experienced Engineering Lead Manager with
  a strong background to lead and develop a high-performance
  team of engineers. The ideal candidate is an experienced
  developer who is eager to demonstrate leadership and
  technical acumen by offering guidance, mentorship, and
  direction to our teams. For over 20 years, IX has been known
  as the change agents of digital advertising – innovators who
  help shape how our industry reacts to new challenges and
  shifts in the market. As a result, we’ve been able to
  partner with some of the most prominent players in the media
  industry including Hearst, Disney, and Meredith Corporation
  among many others.

  Here’s what you’ll be doing:

  - Team Leadership: Build and lead a world-class team,
    fostering a culture of innovation, collaboration, and
    accountability. Provide mentorship, guidance, and
    professional development opportunities to team members.
  - Technical Expertise: Possess a deep understanding withing
    agile environments, with a focus on working
    collaboratively with product, marketing, and sales
  - Software Engineering Skills: Collaborate with software
    engineering teams to implement best practices in the
    software development life cycle, including designing
    scalable and resilient systems.
  - Reporting and Metrics: Develop and maintain meaningful
    performance metrics and reporting mechanisms to track the
    health and reliability of our systems. Use data-driven
    insights to guide decision-making and triaging.
  - Project Management: Act as a technical leader on projects,
    architecting the design of projects to meet the needs of
    the business outcome, and to align with existing
    architectural vision. Collaborate with subject matter
    experts and with a network of peers to ensure on-time
    quality delivery.

  Here's what you need:

  - Strong software engineering skills, including proficiency in
    programming languages such as Golang, Java, C#
  - Demonstrable expertise in complex back-end systems.
    Experience in designing, developing and testing high
    quality services
  - Exceptional leadership and team-building skills with a track
    record of developing high-performing teams with at least 2
    years of experience in that role.
  - Excellent problem-solving skills, the ability to think
    differently, and an understanding that compromise,
    negotiation and practicality are important qualities
  - Excellent communication skills, with the ability to
    collaborate effectively with cross-functional teams.

  Why you’ll love working here:

  - Comprehensive health, dental, and vision plans for you and
    your dependents
  - Paid time off, health days, and personal obligation days
    plus flexible work schedules
  - Competitive retirement matching plans
  - Equity packages
  - Generous parental leave available to birthing, non-birthing,
    and adoptive parents
  - Annual well-being allowance plus fitness discounts and group
    wellness activities
  - Commuter benefits and discounts, where available
  - Employee assistance program
  - Mental health first aid program that provides an in-the-
    moment point of contact and reassurance
  - One day of volunteer time off per year and a donation-
    matching program
  - Monthly town halls and regular community-led team events
  - Multiple resources and programming to support continuous
    learning
  - A workplace that supports a diverse, equitable, and
    inclusive environment – learn more here

  Equal employment opportunity

  At Index Exchange, we believe that successful products are
  built by teams just as diverse as the audience who uses
  them. As such, we are committed to equal employment
  opportunities. We celebrate diversity of race, color,
  ancestry, religion, sex, national origin, sexual
  orientation, age, citizenship, marital status, disability,
  gender identity or expression, or veteran status.
  Additionally, we realize that diversity is deeper than any
  status or classification—diversity is the human experience.
  For those who show grit, passion, and humility—Index will
  welcome you.

  Accessibility for applicants with disabilities

  Index Exchange welcomes and encourages individuals with
  disabilities to apply to work with us.

  If you require an accommodation, please share the details of
  your request and any information how we can assist you with
  the hiring recruiter when they contact you. Index Exchange
  will make reasonable efforts to ensure accommodation
  requests are met throughout the recruitment process.

  Index everywhere, Index anywhere

  Our corporate headquarters are in Toronto, with major
  offices in New York, Montreal, Kitchener, London, San
  Francisco, and many other global cities. As a major global
  advertising exchange, we are committed to operating as a
  tightly knit global team and embracing and empowering talent
  wherever our colleagues may be.

  AI Disclaimer: Automated tools including artificial
  intelligence may be used to assist in screening and
  assessing applicants for this role. All hiring decisions
  involve human review.



