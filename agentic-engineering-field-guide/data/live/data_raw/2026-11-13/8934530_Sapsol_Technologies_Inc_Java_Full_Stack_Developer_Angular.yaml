description: |
  Job Summary

  We are seeking a highly skilled Java Full Stack Developer
  with strong expertise in Angular (latest versions) and
  backend development using Java, Spring Boot, and
  Microservices architecture. The ideal candidate will be
  responsible for designing, developing, and integrating
  scalable frontend and backend applications, ensuring
  seamless user experience and robust system performance.

  🔧 Key Responsibilities

  - Design and develop scalable web applications using Angular
    (latest versions) for frontend
  - Build and maintain backend services using Java, Spring Boot,
    and Microservices
  - Develop and integrate RESTful APIs between frontend and
    backend systems
  - Ensure seamless frontend-backend integration and data flow
  - Collaborate with cross-functional teams including UI/UX,
    DevOps, and QA
  - Optimize applications for performance, scalability, and
    security
  - Participate in code reviews, testing, and deployment
    processes
  - Troubleshoot and resolve technical issues across the full
    stack
  - Follow Agile/Scrum methodologies for project delivery

  🧠 Required Skills

  - Strong experience in Core Java
  - Hands-on expertise in Spring Boot
  - Experience with Microservices architecture
  - Proficiency in Angular (latest versions preferred)
  - Solid understanding of frontend-backend integration
  - Experience in building and consuming RESTful APIs
  - Strong knowledge of HTML5, CSS3, TypeScript, and JavaScript
  - Familiarity with SQL databases (MySQL, PostgreSQL)

  ☁️ Preferred Skills (Nice to Have)

  - Experience with cloud platforms (AWS/Azure)
  - Knowledge of Docker, Kubernetes
  - Familiarity with CI/CD tools (Jenkins, GitHub Actions)
  - Understanding of authentication/authorization (JWT, OAuth)
  - Exposure to state management (NgRx/Redux)

  🎓 Education

  - Bachelor’s degree in Computer Science, Information
    Technology, or related field (or equivalent experience)
