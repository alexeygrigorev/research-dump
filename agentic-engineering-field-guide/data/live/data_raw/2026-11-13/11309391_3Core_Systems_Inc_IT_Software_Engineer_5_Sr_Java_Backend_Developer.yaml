description: |
  Job Title: IT Software Engineer 5 (Sr. Java Backend
  Developer with AWS)

  Location: 540 W. Madison, Chicago, IL (Hybrid: will need to
  go into office up to 2x a week; this role could change where
  they need to go in office 5 days a week)

  Duration: 12 months contract

  Interview Process: 2 rounds: 1st round will be virtual (1
  hr.), 2nd round will be panel for onsite interview.

  Experience Level: Min 10yrs - Max 15yrs



  Job Description:

  Senior Software Engineer provides technical leadership in
  design, development, testing and deployment of Client’s
  state-of-the-art digital platform hosted on AWS. This
  position will build a world class platform to host a wide
  range of digital applications.



  Position’s Contributions to Work Group:

  Team member contributing to programming, project management,
  and development assignments. Working on backend services in
  Client’s Digital platform.



  Typical task breakdown:

  ·         As a Senior Software Engineer you will be
  responsible for designing and developing backend RESTful API
  web services using Microservices architecture.

  ·         Be responsible for overseeing and mentoring other
  developers and handle code reviews.

  ·         Acts as Team Leader for development and support
  groups; provides programming and application/technical
  leadership, guidance, and assistance to other team members.

  ·         Works directly on complex application/technical
  problem identification and resolution.

  ·         Drives application development focused around
  delivering valuable business features.

  ·         Maintains high standards of software quality
  within the team by establishing good practices and habits.

  ·         Guide the team to develop a structured
  application/interface code, new program documentation,
  operations documentation and user guides in a casual,
  flexible environment.

  ·         Lead development of new functionality and
  applications on cross-functional Agile project teams.



  Education & Experience Required:

  ·         Bachelor’s degree in computer science or
  electrical engineering or related field is required w/ 8+
  years’ experience in this capacity is needed.

  ·         Master’s degree with 6+ years’ experience in
  capacity is needed.

  ·         No degree, then they must have a minimum of 10+
  years’ experience in this capacity.



  Technical Skills (Required):

  ·         10+ years or more of experience in designing and
  developing software applications in Java.



  Skills:

  ·         Software Development: Knowledge of software
  development tools and activities; ability to produce
  software products or systems in line with product
  requirements.

  ·         Software Product Design/Architecture: Knowledge of
  software product design; ability to convert market
  requirements into the software product design.

  ·         Decision Making and Critical Thinking: Knowledge
  of the decision-making process and associated tools and
  techniques; ability to accurately analyze situations and
  reach productive decisions based on informed judgment.

  ·         Effective Communications: Understanding of
  effective communication concepts, tools and techniques;
  ability to effectively transmit, receive, and accurately
  interpret ideas, information, and needs through the
  application of appropriate communication behaviors.



  Required Experience:

  ·         Experience software development experience using
  Java 17 or higher and Spring Boot RESTful API development.

  ·         Experience deploying and maintaining software
  using public clouds such as AWS or Azure.

  ·         Message streaming solutions, such as AWS Kinesis,
  AWS SQS, AWS SNS, Apache Kafka, RabbitMQ, Apache ActiveMQ,
  Azure Event Hub.

  ·         Datastores such as AWS Aurora, AWS RDS, AWS
  DynamoDB, PostgreSQL, MySQL, Oracle, ElasticSearch, MongoDB,
  Cassandra, Redis.

  ·         Deploying software using CI/CD tools such as Azure
  Devops, Jenkins, GoCD, etc.

  ·         Working within an Agile framework (ideally Scrum).



  Proven experience in many of the following:

  ·         Designing, developing, deploying and maintaining
  software at scale.

  ·         Developing software applications using relational
  and NoSQL databases.

  ·         Application architectural patterns, such as MVC,
  Microservices, Event-driven, etc.

  ·         Deploying software using CI/CD tools, such as
  Jenkins, Azure DevOps, GoCD, etc

  ·         Deploying and maintaining software using public
  clouds such as AWS or Azure.

  ·         Working within an Agile framework (ideally Scrum)

  ·         Experience with AI tools is a BIG PLUS**



  Strong understanding and/or experience in many of the
  following:

  ·         Message streaming solutions, such as AWS Kinesis,
  AWS SQS, AWS SNS, Apache Kafka, RabbitMQ, Apache ActiveMQ.

  ·         Experience designing well-defined Restful APIs.

  ·         Hands on experience with API tools such as
  Swagger, Postman and Assertible o Test Driven Development
  and Behavior Driven Development.

  ·         Hands on experience with testing tools such as
  Cucumber and Selenium and their integration into CI/CD
  pipelines.

  ·         Datastores such as AWS Aurora, AWS RDS, AWS
  DynamoDB, MongoDB, ElasticSearch, Cassandra, Redis, MySQL,
  Oracle. o Other AWS technologies, such as API Gateway, ALB,
  NLB, Fargate, Lambda, S3, CloudWatch, etc.

  ·         Debugging and maintaining software in Linux or
  Unix platforms.



  Soft Skills (Required):

  ·         Must demonstrate solid knowledge of Computer
  Science fundamentals, such as data structures and
  algorithms.

  ·         Ability to work under pressure and within time
  constraints.

  ·         Passion for technology and an eagerness to
  contribute to a team-oriented environment.

  ·         Demonstrated leadership on small to medium-scale
  projects impacting strategic priorities.



  Disqualifiers/Red Flags:

  ·         If candidate is not in local area, please do not
  submit.

  ·         If the candidate’s current place of residence is
  not on resume, they will be DQ.
