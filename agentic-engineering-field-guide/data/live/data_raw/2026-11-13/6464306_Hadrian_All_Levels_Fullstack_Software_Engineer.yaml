description: |
  Hadrian - Manufacturing the Future

  Hadrian is building autonomous factories to reindustrialize
  America. By combining AI, advanced software, robotics, and
  full-stack manufacturing, we help aerospace and defense
  companies build rockets, satellites, aircraft, ships, and
  other mission-critical systems up to 10x faster and at
  significantly lower cost.

  Following our $1.37B Series D at a $7.87B valuation, Hadrian
  is rapidly expanding our manufacturing footprint, launching
  new capabilities across welding, casting, forging,
  electronics, additive manufacturing, and more, while scaling
  our Factory-as-a-Service platform to transform how critical
  products are built.

  Backed by leading investors including JPMorgan Chase, Valor
  Equity Partners, Andreessen Horowitz, Founders Fund, 137
  Ventures, Lux Capital, T. Rowe Price, and Morgan Stanley,
  we’re building the future of American manufacturing—and
  looking for exceptional people to help make it happen.

  If you’re ready to take on the most challenging and
  rewarding work of your career while helping create American
  manufacturing jobs for generations to come, you’re exactly
  who we’re looking for.

  The Role:

  Hadrian is building advanced systems to automate technical
  data understanding and accelerate precision manufacturing
  planning and execution. Our platform processes technical
  data packages, engineering drawings and specifications, and
  CAD models to turn them into structured data that Hadrian
  uses to generate processes and plan factories.

  You will be building software that extracts, models, and
  enriches complex engineering data from a variety of 2D and
  3D sources. Custom ML models, agents, and computational
  geometry will be used to automate the extraction, this role
  will own the full stack application orchestrating these
  tools, tightly controlling data change management, and
  providing great user experiences for reviewing and editing
  the data in 2D and 3D.

  What You’ll Do:

  - Scope, architect, implement, and deploy the applications and
    services behind technical data intelligence
  - Build the APIs and pipelines that carry ML output into our
    database and applications, with versioning and provenance
    on every record
  - Build the harnesses our agents run in, including their
    tools, phases, budgets, tracing, and targeted reruns
  - Integrate with the CAD systems and formats our customers and
    factories use
  - Work directly with manufacturing engineers, operators, and
    ML engineers to drive our roadmap

  What We’re Looking For:

  - Extensive experience shipping modern, fullstack applications
  - AI native builder with strong business and product sense
  - Have tech-led critical projects or initiatives
  - Have worked on large, complex codebases
  - Bias to action, take pride in your work, and care more about
    getting to the right solution than being right
  - Are excited to work in a fast-paced environment with high-
    stakes and quick iteration cycles

  What sets you apart:

  - Experience building LLM agents or the systems around them,
    including tool use, evaluation, and observability
  - Experience with CAD data, geometry kernels (OpenCascade,
    Parasolid, etc.), or CAD automation APIs
  - Experience deploying on AWS and Kubernetes, including
    GovCloud or other regulated environments
  - Previously worked in aerospace, defense, or manufacturing,
    or with export-controlled data
  - You have a passion for manufacturing and believe that the
    industry needs better software

  Logistics

  This role is based out of our Los Angeles (Torrance) or San
  Francisco Bay Area office.

  Compensation

  For this role, the target salary range is $220,000 -
  $320,000 (actual range may vary based on experience).

  This is the lowest to highest salary we reasonably and in
  good faith believe we would pay for this role at the time of
  this posting. We may ultimately pay more or less than the
  posted range, and the range may be modified in the future.
  An employee's pay position within the salary range will be
  based on several factors, including, but not limited to,
  relevant education, qualifications, certifications,
  experience, skills, geographic location, performance, and
  business or organizational needs.

  Benefits for Full-time Employees

  - Medical, dental, vision, and life insurance plans for
    employees 401k
  - Relocation support may be provided for certain situations,
    based on business need.
  - Flexible vacation policy
  - Equity



  ITAR Requirements

  To conform to U.S. Government export regulations, including
  the International Traffic in Arms Regulations (ITAR) you
  must be a U.S. citizen or national, lawful permanent
  resident, protected individual as defined by 8 U.S.C.
  1324b(a)(3), or eligible to obtain the required
  authorizations from the U.S. Department of State. Learn more
  about the ITAR here.



  Use of AI in hiring

  Hadrian uses AI-assisted tools in our recruiting and hiring
  processes to help our team work more efficiently. This may
  include tools that help organize and analyze recruiting
  data, as well as an AI-powered notetaker that can record and
  transcribe interviews and help coordinate feedback. These
  tools support our team and are not used to make hiring
  decisions. All candidate evaluations and hiring decisions
  are performed by humans. If an interview will be recorded,
  you will be notified in advance and may opt out at any time
  with no impact on your candidacy. Candidate data processed
  through these tools is subject to the same protections
  described in our Privacy Policy.



  Consideration of Criminal History

  Hadrian will consider for employment qualified applicants
  with criminal histories in a manner consistent with the
  requirements of all applicable laws. We do not ask about
  criminal history on our application, and we do not consider
  criminal history before making a conditional offer of
  employment.



