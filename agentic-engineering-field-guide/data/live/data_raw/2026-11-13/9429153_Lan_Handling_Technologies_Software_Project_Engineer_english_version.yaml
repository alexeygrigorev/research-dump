description: |
  Your day as a Software Engineer?

  It’s Monday morning at the office: time for the kick-off
  meeting for a new project! A manufacturer of meal salads
  wants its salad trays into boxes as efficiently as possible
  and opts for an automated case packer. That means work to
  do, for you as a Software Engineer.

  For this End-Of-Line machine you are responsible for all
  software and control related issues during the engineering
  phase, assembly, testing and commissioning of this project.
  Think of writing software for machine control, control
  panels, robot control, servo and safety systems. During the
  kick-off meeting you discuss the different software modules,
  the customer’s wishes and your own ideas based on the
  customer’s layout. And now back to your desk to start
  working on the software design.

  After lunch you walk to the workshop. There you test the
  automated palletizing system of a large tomato grower.
  During testing, you run into an error in the software, you
  briefly talk to the Project Engineer who happens to be
  walking by and you fix the error. The machine is running
  smoothly again.

  Is it already that late? You quickly fill in your travel
  application, because in two weeks you will be flying abroad
  for a week to put the crate erector and crate loader into
  operation. It’s cool to see your own work running.

  How you get things moving

  - You have a HBO diploma in the direction of Industrial
    Automation or Mechatronics. Electrical engineering or
    similar;
  - You have 3-5 years experience Servo control, robot- & PLC-
    software;
  - You enjoy spending around 30-50% of your time abroad for
    work;
  - You are a go-getter and loves to push through;
  - You are fluent in English, Dutch is a plus.

  We offer

  A completely new supermarket experience. Huh, what?! Really.

  Once you start working at Lan Handling, shopping will never
  be the same again. From that day on, you will turn over all
  the pouches, cans and jars you see.

  You’ll find yourself always checking: yes! we also handle
  this product with our machines! But that’s not all of
  course:

  - Earn a salary between €4500 and €5.100, depending on your
    experience.
  - Work with modern software programs and tech stacks,
    including Siemens TIA Portal (V15+), Rockwell Studio 5000
    (V28+), Rockwell Factory Talk Optix (V1.6+), and KUKA
    Workvisual (6.o).
  - A growth path with possibilities to develop yourself further
    in R&D, service, or commissioning engineering.
  - A working environment full of opportunities to develop
    further. Good idea? Any training wishes? Discuss it with
    your supervisor and get started.
  - Do you work on site at a customer? Then we have an excellent
    reimbursement scheme.
  - In addition to 25 vacation days, you also get 13 days paid
    leave. So you have enough time to do fun things in
    addition to your work.
  - 8% holiday allowance.
  - Flexible working hours, so that you can make time for
    sports, hobbies or just to take your children to school
    quietly in the morning.
  - An annual profit-sharing benefit. Because we feel that we do
    it together and everyone contributes to a positive result
    for the organisation, you also benefit from a financially
    successful year.
  - Good travel expenses.
  - Join us for a quad ride or shine during one of the other fun
    activities organised by our staff association.
