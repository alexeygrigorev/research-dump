description: |
  What do we do?

  Paddle offers digital product companies a completely
  different approach to their payment infrastructure. Instead
  of assembling and maintaining a complex stack of payments-
  related apps and services, we’re a Merchant of Record for
  our customers. That means we take away 100% of the pain of
  payment fragmentation. It’s faster, safer, cheaper, and,
  above all, way better.

  We’re backed by investors including KKR, FTV Capital,
  Kindred, Notion, and 83North and serve over 10,000 software
  sellers in 245 territories globally.



  The role:

  Selling online as a software business is a complex process
  and many components need to work seamlessly to capture
  revenue and deliver this to sellers. Paddle manages payments
  so that we can take this burden from our customers. We
  process millions of payments globally and make thousands of
  payouts across multiple balance currencies every month. We
  do all this while ensuring we’re applying and remitting
  taxes accurately in all jurisdictions.

  As the Engineering Manager of our Subscriptions team, you'll
  lead the product at the core of Paddle's recurring revenue
  engine, giving our customers the tools to manage the full
  subscription lifecycle; from plan changes, upgrades and
  downgrades to proration, trials and flexible billing
  schedules. You will be instrumental in helping scale and
  shape the direction of a product that powers the recurring
  billing operations of thousands of companies each month.

  Each Product Engineering team at Paddle is made up of a
  Product Manager, Engineering Manager and between 4 - 6
  engineers. The teams are set up with a clear area of product
  ownership along with goals that give them clarity on who
  they’re building for and the tools to choose how best to do
  that. These teams are cross-functional by design, with
  supporting functions such as Design, Data, InfoSec, Platform
  and Developer Experience to embed the tools, values and
  expertise where needed to enable the end-to-end delivery of
  the team’s roadmap.



  What you’ll do:

  - As the team’s leader, you will facilitate the delivery of
    initiatives to a high standard from initial concept and
    planning through to rollout, collaborating with engineers
    and non-technical colleagues.
  - Manage, and coach the engineers in your team so that they
    develop both personally and professionally, and are able
    to perform together with impact.
  - Partner with the team’s Product Manager to create a roadmap
    for success, make sure the team is working in the right
    way for maximum (and sustainable) impact.
  - Drive improvements to the processes and practices of the
    team with the autonomy to do what you think is right and
    change what isn’t working.
  - Have oversight of the technical decisions being made in your
    team, and responsibility for the technical strategy within
    the product area that the team owns. The Engineering
    Manager role at Paddle is a technical role, although we do
    not expect you to be contributing code.
  - Contribute to the role of metrics within the wider data
    strategy of Paddle
  - Help to continuously improve the reliability and scalability
    of Paddle’s high-traffic event-driven system.
  - Work with our other leaders across Engineering, contributing
    to the department's engineering principles and practices
    to build an industry-leading organisation.



  We’d love to hear from you if you have:

  - Experience with Go or similar languages.
  - Experience building or scaling subscription or recurring
    billing systems will be a strong advantage.
  - Have a passion for developing people and bring at least 2
    years of management experience with several direct
    reports.
  - Have proven experience as a senior software engineer,
    working on complex, large-scale, cloud-based systems.
  - Have a strong and demonstrable understanding of what it
    means to be a high-performing and sustainable engineering
    team.
  - Have excellent written and verbal communication skills, and
    are comfortable leading technical discussions with
    engineers and non-technical colleagues.
  - Are excited by, and have specific experience in, building
    products that handle payments, transfers, and financial
    reconciliation.
  - Is someone that enjoys getting into the details and
    understanding the mechanics of money movements.
  - Are comfortable working closely with financial, risk, and
    legal stakeholders, ensuring systems are reliable,
    compliant, and can scale.
  - Are proactive and enjoy taking ownership, but self-aware and
    always open to improving and pushing on how you can get
    better.
  - Proven success working with complex problems and ambiguity,
    maintaining high standards while balancing progression and
    perfection.
  - A proven track record of bias for action and strong customer
    focus.



  Everyone is welcome at Paddle

  At Paddle, we’re committed to removing invisible barriers,
  both for our customers and within our own teams. We
  recognise and celebrate that every Paddler is unique and we
  welcome every individual perspective. As an inclusive
  employer, we don’t care if, or where, you studied, what you
  look like or where you’re from. We’re more interested in
  your craft, curiosity, passion for learning and what you’ll
  add to our culture. We encourage you to apply even if you
  don’t match every part of the job ad, especially if you’re
  part of an underrepresented group. Please let us know if
  there’s anything we can do to better support you through the
  application process and in the workplace. We will do
  everything we can to support any accommodations needed.
  We’re committed to building a diverse team where everyone
  feels safe to be their authentic self. Let’s grow together.



  Why you’ll love working at Paddle

  We’re a diverse, growing group of Paddlers who pride
  ourselves on our transparent, collaborative and respectful
  culture.

  We live and breathe our values, which are:

  - Paddle Together - “None of us, is as smart as all of us”
  - Paddle Simply - “Simple can be harder than complex: you have
    to get your thinking clean to make it simple”
  - Paddle for others - “We can realise our wildest dreams, so
    long as we help enough other people to realise theirs”



  We offer a full suite of benefits, including attractive
  salaries, stock options, unlimited holidays, enhanced
  parental leave, retirement plans, private healthcare and
  well-being initiatives.



  We invest in learning and will help you with your personal
  development via constant exposure to new challenges, an
  annual learning fund, and regular internal and external
  training.



  Connecting at Paddle

  We’re a ‘digital-first’ company, which means our Paddlers
  always have the freedom to choose where, when and how they
  work within our hub locations.

  We recognize that where our Paddlers do their best work is
  unique to them and we provide trust and autonomy for
  everyone to work in a way which fits them best. We also
  value the power of connection and have invested in global
  hubs which help local communities flourish and bring us
  together for focused collaboration.



  Our Paddle hubs:

  - In Europe: UK (London headquarters), Portugal (Lisbon hub),
    Netherlands and Ireland (Dublin hub)
  - In North America: Austin, TX (USA) and Toronto (Canada)

  Our hub philosophy creates an engaging experience for all
  Paddlers, wherever, whenever and however we choose to work.



  To support this, we focus hiring within our hubs and will
  always openly share the available locations for each open
  position on our job description.
