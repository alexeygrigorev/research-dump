description: |
  Department:

  WDTech - R&D

  We are Walker & Dunlop.  We are one of the largest providers
  of capital to the commercial real estate industry, enabling
  real estate owners and operators to bring their visions of
  communities — where people live, work, shop, and play — to
  life. We are committed to creating meaningful social,
  environmental, and economic change in our communities.

  Department Overview

  WDTech is W&D’s in-house technology team – a group of
  collaborative and highly skilled technology professionals,
  all of whom are leading experts in real estate data, data
  science, and technology.

  WDTech Engineering builds solutions that impact not only our
  products but also the people and processes across our
  organization. A commitment to innovation and a passion for
  disrupting the old-fashioned real estate industry are our
  highest priorities.

  The Impact You Will Have

  As a Senior Software Engineer, you will help shape the
  future of our Loan Origination and Servicing platform — the
  digital foundation for how capital is structured and
  deployed. You will design and build scalable applications
  and services that power real-time insights and complex
  financial workflows. By combining strong backend
  architecture with thoughtful system design, you will deliver
  high-performance solutions that enable smarter decision-
  making across the business.

  Primary Responsibilities

  - Design, build, and maintain scalable, high-quality
    applications across new and existing product lines.
  - Own features end-to-end — from architecture and development
    through testing, deployment, and iteration.
  - Architect and evolve our core stack (Python, FastAPI,
    Vue.js, PostgreSQL, Redis, Docker, Kubernetes).
  - Translate complex business and product requirements into
    elegant, reliable technical solutions in collaboration
    with Product and business stakeholders.
  - Drive improvements in performance, reliability, testing, and
    CI/CD practices.
  - Mentor engineers and contribute to a culture of engineering
    excellence and accountability.
  - Perform other duties as assigned.

  Education and Experience

  - 6+ years of professional software development experience.
  - Bachelor’s degree in Computer Science or a related field (or
    equivalent practical experience).
  - Strong experience building APIs and backend services in
    Python, including OpenAPI-based service contracts.
  - Experience developing and deploying containerized
    applications in AWS environments, including event-driven
    architectures.
  - Experience in real estate finance or financial services
    preferred.

  Knowledge, Skills and Abilities

  - Deep proficiency in Python (3.6+) and modern backend
    frameworks such as FastAPI, with a strong focus on clean,
    maintainable architecture.
  - Strong expertise in SQL databases, including schema design,
    query optimization, and performance tuning.
  - Ability to design efficient, scalable backend systems,
    including background processing, queues, caching
    strategies, and scheduled jobs.
  - Strong understanding of testing strategies across unit,
    integration, and end-to-end levels.
  - Working knowledge of system design documentation practices,
    including UML and architectural diagrams.
  - Familiarity with event sourcing and/or Domain-Driven Design
    (DDD) principles.
  - Ability to leverage AI-enabled development tools to enhance
    design, implementation, and testing workflows.
  - Demonstrated ownership mindset with a commitment to quality,
    accountability, and continuous improvement.
  - Agile mindset with the ability to work independently,
    provide early feedback, and adapt to evolving
    requirements.
  - Ability to show ownership of your work, take on challenges
    and acknowledge growth opportunities, and demonstrate
    patience when learning new processes.
  - Courtesy, respect, and thoughtfulness in teaming with
    colleagues and other stakeholders.

  #LI-MR1

  #LI-Remote

  What We Offer 

  - You will have the opportunity to accelerate in our rapidly
    growing organization.
  - Agile working environment with flexible working hours and
    location, career advancement, and competitive compensation
    package.
  - We are a family friendly company.
  - We arrange social activities to help our employees and
    families become familiar with each other and our culture.
  - In addition to other benefits, we offer a pension scheme and
    100% complimentary and confidential mental health
    services.

