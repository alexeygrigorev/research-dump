  About Us

  At South Geeks, we engage top-performing Software Engineers,
  Security Experts, and Data Analysts from Latin America to
  join our clients’ teams worldwide. For over 8 years, we’ve
  been helping future-shaping companies scale faster by
  curating world-class tech talent and building long-lasting,
  strategic partnerships. We pride ourselves on a people-
  centered culture that powers innovation, collaboration, and
  excellence.

  About the Client

  Our client is a pioneering biotechnology company that is
  unlocking the power of the adaptive immune system to
  transform the diagnosis and treatment of disease. By
  combining genomics, bioinformatics, and machine learning,
  they generate insights that are reshaping how patients are
  diagnosed, monitored, and treated. Their engineering teams
  build scalable, secure applications that directly support
  breakthroughs in personalized medicine.

  About the Role

  We are seeking a Fullstack Engineer (Java + JavaScript) to
  join the team. In this role, you’ll design, build, and
  maintain scalable applications that power critical features
  across both backend and frontend systems. You’ll work
  closely with cross-functional teams, contributing to the
  full stack from backend services and databases to web
  services and UI development.

  Key Responsibilities

  - Develop and maintain scalable applications using Java and
    Scala.
  - Deliver feature enhancements and bug fixes across the stack.
  - Design and develop backend services and controllers.
  - Manage PostgreSQL databases and perform SQL operations.
  - Handle event file changes and data flow management.
  - Develop and integrate web services.
  - Implement UI changes using Angular or React and JavaScript.
  - Collaborate across teams to deliver end-to-end solutions.

  What You Need to Succeed in This Role

  - Strong programming experience with Java, Scala, and
    JavaScript.
  - Hands-on experience with Angular or React for frontend
    development.
  - Proficiency with PostgreSQL and SQL.
  - Knowledge of web services development and integration.
  - Ability to work collaboratively across teams on full-stack
    projects.
  - Strong problem-solving and debugging skills.

  Our Team

  We strive to create an inspiring and growth-oriented
  environment where everyone feels valued, heard, and
  empowered. We promote both personal and professional
  development, with individualized support for your needs and
  concerns. We aim to build a space where everyone can thrive.

  What We Offer

  - Long-term projects
  - 100% remote work
  - Payment in USD
  - Paid Time Off (PTO)
  - Work from Home (WFH) & Training reimbursement
  - English lessons
  - Technical training
  - Career coaching

  This position is available for candidates based in LATAM.
