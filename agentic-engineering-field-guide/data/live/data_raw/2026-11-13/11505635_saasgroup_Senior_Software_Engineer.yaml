description: |
  This role is part of our ScraperAPI team, one of our growing
  brands at saas.group.

  ScraperAPI is an enterprise-scale web scraping solution,
  trusted by businesses across a wide range of industries to
  extract crucial data at scale. From e-commerce, travel to
  real estate and market research, we support companies in
  turning the web into actionable insights. We're currently on
  an exciting growth journey, scaling rapidly as demand for
  reliable, high-performance web scraping and data keeps
  rising.

  Profile Overview

  This is the hard end of web scraping. The sites we rely on,
  Google, Amazon, Walmart and many others, actively work to
  block us, and they change the rules without warning. We're
  looking for a senior engineer who can go deep on why we're
  being blocked, work out how the detection actually
  functions, and design repeatable ways around it. You'll be
  joining a self-driven, high-autonomy team to take on our
  most involved problems, with the room and the trust to build
  something from close to a blank page: an environment that
  turns one-off breakthroughs into a methodical, repeatable
  way of defeating anti-bot systems. If you like confronting
  problems that genuinely resist you, and you work
  methodically rather than by trial and error, this is an
  unusually open brief.

  Your immediate impact in the first 3-6 months will be:

  - Getting a full local environment running and becoming fluent
    in our systems and how they operate, in the first few
    weeks.
  - Contributing to a proposal on the design for a repeatable
    environment we can pose anti-bot problems to and get
    reliable analysis out of.
  - Building that environment out over the following months so
    that, by month six, we can point it at a target or
    provider and have it reliably tell us how we're being
    blocked and what is and isn't being used against us.

  Your responsibilities

  - Analyse how specific anti-bot and bot-mitigation systems
    (the likes of DataDome, Cloudflare Turnstile, Kasada,
    PerimeterX and Akamai) detect and block us, and design
    systems to work around them.
  - Turn isolated breakthroughs into durable, repeatable
    processes: hypothesis, test, discard what's wrong, move
    on.
  - In collaboration with other senior team members, design and
    build a greenfield agentic environment that can propose
    and run tests on anti-bot behaviour and bypass approaches,
    and do it in a way that's well understood and repeatable.
  - Work largely independently on deep, concentrated problems,
    while actively pulling in knowledge from across the wider
    engineering team.
  - Communicate clearly what you plan to do, and step into major
    incidents when the team needs your depth.

  What you bring to the table

  - Deep, genuine understanding of how the internet works
    underneath: HTTP, TLS and fingerprinting, proxies,
    headers, cookies, and browser behaviour. This is the core
    of the role and it isn't something we can shortcut.
  - Excellent problem-solving built on a scientific, methodical
    approach: you form a hypothesis, design a test, read the
    result honestly, and iterate. Trying things at random is
    the opposite of what this role needs.
  - Strong hands-on skills in our stack, Node.js and TypeScript
    with solid Python, and comfort across backend systems at
    scale (Postgres, Redis/Valkey, MongoDB,
    Puppeteer/Camoufox, Kubernetes).
  - Real skill at directing AI coding agents with precision, and
    the judgement to tell strong output from weak. The
    specific tool doesn't matter (Claude, Codex or similar);
    knowing how to steer it well is what counts.
  - A background that has given you this kind of depth and
    rigour. That might be scraping, anti-bot or web-security
    work, reverse engineering, or a research or academic path
    where you built your own tooling and lived by the
    scientific method. Direct scraping experience is a strong
    plus rather than a strict requirement.
  - Independence and strong communication: you're comfortable
    owning hard problems in a remote-first team with little
    hand-holding, and you keep the team in the loop on your
    thinking as you go.

  What's in it for you

  - Ultimate flexibility: We're 100% remote. You can work from
    wherever you like, whenever you like.
  - Freedom and autonomy: We're a high-trust team, and you'll be
    given lots of flexibility to solve problems in your own
    way, with plenty of help from the team when you need it.
  - Minimum bureaucracy: We don't like to get bogged down with
    meetings and red tape. We like to be efficient and keep
    momentum steady & sustainable.
  - Small & friendly team: We help each other out, have fun, and
    joke around.
  - Our network: We are a community of entrepreneurial SaaS
    professionals that regularly exchange ideas, knowledge,
    learning and expertise with each other internally.
  - Flexible time off: We want you to recharge your batteries
    when needed.

  ScraperAPI is part of saas.group and we have a shared goal
  of succeeding together.

  What is saas.group?

  Think of us as the driving catalyst behind your favorite
  software success stories. saas.group, established in 2017,
  is on a mission to turbocharge promising B2B SaaS ventures,
  unlocking their full potential. As a Software-as-a-Service
  portfolio powerhouse, we specialize in acquiring small
  software treasures and polishing them into industry stars.
  With a dynamic, fully remote team of nearly 400 colleagues
  spanning 50+ countries we are truly global and we are
  rewriting the playbook on SaaS innovation and collaboration.
  We grow 25 exciting brands under our umbrella. Feel free to
  explore our Candidate's Hub to get an insider's view, dive
  into our culture, gain valuable insights into our teams and
  how we work.

  We don't just simply offer you to "take a job with us" but
  rather to "join us on this journey" to build the world's
  largest platform of independent SaaS companies.

  Sounds like something you're up for? Feel free to apply even
  if you don't check all these boxes. We believe in the power
  of diversity and fresh perspectives to spice up our team.
  Your application might just be the missing ingredient!

  —

  saas.group is committed to creating a diverse and inclusive
  workplace. We are proud to be an Equal Opportunity Employer.
  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, gender,
  gender identity or expression, sexual orientation, national
  origin, genetics, disability, age, or veteran status. We
  celebrate diversity and are committed to creating an
  inclusive environment for all employees. If you're
  passionate about working with a team that values innovation,
  excellence, and fairness, we encourage you to apply.

  We believe in fair and transparent pay. Salary ranges at
  saas.group are location-adjusted, targeting local market
  medians for a remote-first environment, and will be shared
  with our potential future employees in writing before your
  first interview - so you have everything you need to
  evaluate the opportunity.
