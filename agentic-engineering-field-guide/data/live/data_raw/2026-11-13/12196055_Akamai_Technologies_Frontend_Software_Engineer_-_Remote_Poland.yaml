description: |
  Are you a software developer who loves solving problems?

  Would making an impact on the digital experiences of
  millions of users excite you?

  Join our Edge Experience Team

  Our Edge Experience Team is a group of dedicated
  professionals shaping Akamai's aspirations to create an
  industry-leading user experience. We take ownership for the
  design and development for core interfaces, applications,
  APIs and services. We create an experience that allows
  customers and internal stakeholders to build software using
  the best of internal and third-party technologies.

  Partner with the best

  As a Frontend Software Engineer, you will thrive on
  delivering outstanding quality and functionality to our
  customers. You will conceptualize, build and maintain user
  interfaces and shared web components for our team. You will
  translate visual design specifications and requirements into
  a fully functional UI for our web applications.

  As a Software Engineer, you will be responsible for:

  - Building powerful, yet easy-to-use next generation web
    applications to achieve consistent user experience across
    our multiple applications
  - Contributing to a library of common components and
    development tooling
  - Utilizing pixel-perfect layout skills and hand coding of
    both simple and complex cross-browser and cross-platform
    solutions
  - Contributing to all aspects of the project lifecycle:
    define, design, develop, and test

  Do what you love

  To be successful in this role you will:

  - Have a Bachelor in Computer Science or related discipline
  - Demonstrate familiarity with professional HTML, CSS, and
    JavaScript
  - Show experience with Angular or a leading JavaScript
    framework
  - Possess a clear understanding of Software Development Life
    Cycle and Source Code Management Systems (we use git).
  - Be familiar with software testing concepts including unit,
    functional, regression continuous integration, and
    performance testing

  About us

  At Akamai, we make life better for billions of people,
  trillions of times a day. Whether you're streaming live
  events, scrolling social media, watching your favorite
  series, or managing your savings, we're the engine behind
  the scenes. We provide the world's most distributed platform
  from Cloud to Edge to help the giants of the digital world
  work faster and stay more secure, making the internet a
  better experience for everyone. Our focus is simple: Cloud
  and Edge: Running apps closer to users for instant
  performance. Security: Neutralizing threats before they ever
  reach your data. Content Delivery: Scaling the world's
  biggest moments without a glitch. AI: Enabling our customers
  to build, secure, and scale AI apps on the world's most
  distributed cloud platform. At Akamai, we don't just support
  the internet; we power and protect it, because behind every
  great digital experience is a massive hidden challenge. And
  we're the ones who solve it. When millions of people hit
  play or pay, Akamai ensures it just works.

  Benefits at Akamai: We support your health, well-being,
  finances, and life beyond work. See our benefits.

  FlexBase adapts to your job's needs

  Akamai's FlexBase program is yet another way we show our
  commitment to providing employees with an exceptional
  workplace experience. It's not about telling employees where
  to work; it's about supporting employees to do their best
  work. We trust our incredible employees to work in ways that
  suit them best: at home, in an office, or a combination of
  both.

  Connect with us on social and see what life at Akamai is
  like!
