description: |
  At Beyond Finance, we've made it our mission to help
  everyday Americans escape the endless cycle of crippling
  debt and step into a brighter financial future. Through
  compassionate, individualized care, a culture focused on
  compliance and ethics, supportive user-centric technology,
  and customized financial solutions, we've helped over 1
  million clients on their path to a brighter future.

  While we're proud of what we've already accomplished, we're
  searching for new collaborators to help us get to the next
  level! If you're looking to join a forward-thinking, rapidly
  growing organization with helping people as its number one
  goal, we want to hear from you.

  What You’ll Do

  - Own technical direction and backend architecture for
    supporting creditor negotiations
  - Prototype new architecture and patterns, and lead the
    technical projects that strengthen the platform
  - Regularly code review and demonstrate technical leadership
    over the systems well enough to give good guidance on
    designs and tradeoffs
  - Partner with product management, QA and SDETs, and other
    engineering teams to plan, prioritize, and deliver the
    pod's roadmap
  - Weigh in on the feasibility, cost, and risk of product
    decisions, and giving alternatives when there's a better
    path
  - Lead a high-performing team: mentor engineers, staff them on
    projects that deliver results while growing their skills,
    and keep the engineering bar high
  - Set and model best practices for code quality, testing,
    reliability, and scalability, with particular care for
    data integrity across external integrations and sensitive
    financial data

  What We Look For

  - 3+ years of experience managing engineering teams
  - 5+ years of experience building and deploying scalable
    applications in the cloud
  - Experience with Ruby on Rails.
  - Expertise in scoping large projects and initiatives into
    small iterations for release
  - Clear and efficient communication skills
  - Mentorship skills and the ability to give well-crafted
    constructive feedback
  - Experience in a startup environment is not required but
    preferred

  #LI-LB2

  The base annual salary range is listed below. This role is
  eligible for additional incentives, including an annual
  bonus.

  Base Salary Range

  $170,000—$210,000 USD

  Why Join Us?

  While you make a difference for others, we’ll work to make a
  difference for you, providing an uplifting, collaborative
  work environment and benefits that reflect your value to us.
  For eligible full-time employees, we offer:

  - Considerable employer contributions for health, dental, and
    vision programs
  - Generous PTO, paid holidays, and paid parental leave
  - 401(k) matching program
  - Merit advancement opportunities
  - Career development & training

  And finally, our team spirit and culture! We cultivate an
  environment of community, connection, and belonging across
  our entire organization.

  Beyond Finance does not accept unsolicited resumes from
  individual recruiters or third-party recruiting agencies in
  response to job positions.  No fee will be paid to their
  parties who submit unsolicited candidates directly to Beyond
  Finance employees or the Beyond Finance HR team.  No
  placement fee will be paid to any third party unless such a
  request has been made by the Beyond HR team.
