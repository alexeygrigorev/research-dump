description: |
  About this role

  Associate Engineer – BlackRock SMA Solutions

  About BlackRock SMA Solutions:

  At BlackRock SMA Solutions, our strategies are designed to
  put our clients’ and their clients’ interests at the center
  of our investment advice; to minimize costs and taxes; and
  to incorporate each client’s unique values-aligned
  preferences into their investment portfolio. We are a
  purposefully growing quantitative, multi-asset investment
  management business specializing in managing customized
  portfolios tax efficiently.

  Technology is central to the success of the SMA business: on
  a daily basis our technology platform loads portfolio data;
  we raise and execute orders on our clients’ behalf; we
  gather security, index, and other essential reference data;
  we produce rich analytics to highlight risks; and we enable
  a strong investment research capability.

  We are looking for talented and passionate engineers who
  like to innovate and seek complex problems. We recognize
  that strength comes from teams with a variety of
  perspectives, and will embrace your unique skills,
  curiosity, drive, and passion while giving you the
  opportunity to grow technically and as an individual. We are
  committed to open source and we regularly give our work back
  to the community. Engineers looking to work in the areas of
  orchestration, data modeling, data pipelines, APIs, storage,
  distribution, distributed computation, consumption and
  infrastructure are ideal candidates.

  About this Role:

  We are expanding our team of engineers that owns and
  operates this extensive technology platform. As a member of
  this team, you will build, enhance, and support a wide
  variety of micro-services that enable financial portfolio
  construction, data integrations to connect diverse systems,
  and real-time operational workflows. You will work with your
  team and your stakeholders to ensure that platform
  capabilities address business needs in a complete and timely
  manner, with validated quality.

  Requirements:

  - BA/BS in Computer Science or equivalent practical experience
  - At least 5+ years of experience as an engineer with large
    scale systems, preferably in an investment management or
    trading environment
  - Solid knowledge of programming fundamentals—algorithms, data
    structures, design patterns, and paradigms
  - Strong knowledge of one or more modern object-oriented
    languages (Python, Java, Go, etc.)
  - Experience with web development and front-end frameworks
    (e.g., React, Angular, or similar)
  - Solid knowledge of SQL and relationship databases (SQL
    Server, PostgreSQL, Sybase, etc.)
  - Knowledge of API design approaches (RESTful, GraphQL, gRPC)
  - Ability to troubleshoot problems in a live environment and
    provide real time help with critical issues
  - Write code that is easily understood and maintainable by
    other team members
  - Keep up to date with developments in technologies we are
    using
  - Ability to communicate and work effectively, supporting
    various business departments
  - Ability to work in fast-paced interdisciplinary environment

  Desired additional qualifications:

  - Experience working in a cloud environment (AWS, Azure, GCP)
  - Experience integration with CRM platforms such as
    Salesforce, MS Dynamics
  - Familiarity with RabbitMQ, AWS SQS or other messaging
    technologies
  - Familiarity with other structured storage or NoSQL solutions
    (Cassandra, DynamoDB, etc.)
  - Background in statistical and / or financial analysis

  For San Francisco, CA Only the salary range for this
  position is USD$132,500.00 - USD$162,000.00 . Additionally,
  employees are eligible for an annual discretionary bonus,
  and benefits including healthcare, leave benefits, and
  retirement benefits. BlackRock operates a pay-for-
  performance compensation philosophy and your total
  compensation may vary based on role, location, and firm,
  department and individual performance.

  Our benefits To help you stay energized, engaged and
  inspired, we offer a wide range of benefits including a
  strong retirement plan, tuition reimbursement, comprehensive
  healthcare, support for working parents and Flexible Time
  Off (FTO) so you can relax, recharge and be there for the
  people you care about.

  Our hybrid work model

  BlackRock’s hybrid work model is designed to enable a
  culture of collaboration and apprenticeship that enriches
  the experience of our employees, while supporting
  flexibility for all. Employees are currently required to
  work at least 4 days in the office per week, with the
  flexibility to work from home 1 day a week. Some business
  groups may require more time in the office due to their
  roles and responsibilities. We remain focused on increasing
  the impactful moments that arise when we work together in
  person – aligned with our commitment to performance and
  innovation. As a new joiner, you can count on this hybrid
  model to accelerate your learning and onboarding experience
  here at BlackRock.

  Guidance on AI use for candidates

  At BlackRock, AI has long been part of how we work –
  enhancing decision-making, improving operations, and helping
  us deliver better outcomes for clients. We encourage
  candidates to use AI thoughtfully to learn, prepare, and
  work more effectively; but during our interview process, we
  want to focus on getting to know you through your own
  experiences, thinking, and judgment. To support you, we’ve
  provided guidance on when and how to use AI during our
  hiring process so you can approach each step with confidence
  and showcase your best self.

  About BlackRock

  At BlackRock, we are all connected by one mission: to help
  more and more people experience financial well-being.  Our
  clients, and the people they serve, are saving for
  retirement, paying for their children’s educations, buying
  homes and starting businesses. Their investments also help
  to strengthen the global economy: support businesses small
  and large; finance infrastructure projects that connect and
  power cities; and facilitate innovations that drive
  progress.

  This mission would not be possible without our smartest
  investment – the one we make in our employees. It’s why
  we’re dedicated to creating an environment where our
  colleagues feel welcomed, valued and supported with
  networks, benefits and development opportunities to help
  them thrive.

  To learn more about BlackRock, please visit
  Careers.BlackRock.com. We also encourage you to get to know
  us on LinkedIn, Instagram, YouTube, X, and TikTok.

