description: |
  About Dune

  Dune's mission is to make onchain finance observable. We're
  the industry standard for onchain data: a blockchain data
  and intelligence provider that institutions, protocols, and
  analysts trust to understand the onchain world and the
  frontiers of finance. We deliver structured datasets,
  spanning stablecoins, RWAs, tokens, lending, trading, and
  more, from 130+ chains and counting, to 1,000+ industry
  leaders including Visa, WisdomTree, FINRA, the IMF,
  Bloomberg, Standard Chartered, Coinbase, Forbes, and the
  Financial Times.

  We're a tight knit team of ~50 hard working people, spread
  across Europe and eastern US timezones 🌍️, having an
  outsized impact on the industry. We take pride in being
  ambitious and doing world class work while staying humble
  and lighthearted. We believe in building open, verifiable
  data that lets individuals and institutions do deep research
  into ecosystems like Ethereum, Solana, Robinhood and many
  more.

  We're backed by some of the world's best investors. In
  February 2022, we announced our Series B funding round led
  by Coatue and Union Square Ventures, an important milestone
  that let us double down on our mission.

  If you like being challenged and want to work together with
  a brilliant team on an important mission, come join us.

  Learn more about us:

  About Dune https://dune.com/about

  Values and working at Dune

  https://dune.com/careers

  About the role

  Dune is building market data solutions for institutional
  customers who need timely, accurate and reliable financial
  data they can depend on. Our team turns onchain activity
  into realtime feeds and associated reference data along with
  historical data capture.

  You will work on our new market data platform, and help
  shape how it evolves to support the growing features and
  customer base. You’ll design systems that can grow across
  chains, protocols and product capabilities while making
  clear decisions about correctness, latency, reliability, and
  cost.

  This is a hands-on Staff Engineer role. You will be expected
  to turn ambiguous requirements into designs and deliverable
  work, implement difficult parts yourself, and help other
  engineers own meaningful parts of the platform. AI-assisted
  development is a core part of how we expect you to work,
  paired with strong engineering judgment and ownership of
  what you ship.

  In this role you will

  - Design and build distributed systems for ingestion,
    normalization, processing, storage, and delivery of
    realtime market data from blockchain and other relevant
    sources.
  - Build and operate streaming solutions that handle event
    ordering, timestamps, duplicates, replay, gaps, and
    recovery, including blockchain reorganizations and
    finality where they affect customer data.
  - Build reliable client feeds and APIs with clear delivery
    contracts, schema evolution, access controls, and
    predictable behavior under load or when consumers fall
    behind.
  - Partner with teams across Dune on reference data models and
    historical data capture.
  - Define and improve service objectives and data quality
    measures.
  - Instrument latency, freshness, completeness, and
    correctness, and turn incidents into lasting improvements
    in recovery and operations.
  - You will debug independently and drive root cause analysis
    to a fix that holds.
  - Own services through deployment and production support,
    including participation in the team’s on-call rotation.
  - Use AI throughout development: explore designs, implement
    changes, build tests, investigate failures, and improve
    documentation. Develop repeatable workflows and share what
    works with the team.
  - Lead technical decisions across team boundaries, write clear
    designs, and mentor engineers through implementation and
    review.

  You might be a great fit if

  - You have built and operated distributed backend or data
    services with demanding reliability and performance
    requirements. You understand their failure modes and can
    debug problems across service and data boundaries.
  - You have experience with realtime streaming systems,
    including concurrency, state management, backpressure, and
    recovery. You care about data correctness, from timestamps
    and numeric precision to schema changes and corrections.
  - You have strong computer science fundamentals and backend
    engineering skills. Experience in Rust, Go or comparable
    languages is also valuable.
  - You turn ambiguous requirements into pragmatic designs and
    production services, and help other engineers deliver
    parts of the solution.
  - You communicate clearly in writing and work effectively with
    a distributed team.
  - Financial or market data experience at a financial
    institution.

  Not required but a plus

  - Onchain data experience: blockchain indexing such as with
    EVM or Solana.
  - Reference data experience: instrument and entity masters,
    identifier mapping, effective-dated records, or tokenized
    asset and fund data.
  - Experience at a company where the data is the product.

  Perks & Benefits

  - A competitive salary and equity package 🚀. Both salary and
    equity is top 25% of companies in the space
  - Our employee equity scheme has world-class employee-friendly
    terms with a heavily discounted strike price (~90%) and a
    10-year exercise window
  - 5 weeks PTO + local public holidays (that can be swapped to
    suit you) 🏖
  - A fully remote-first approach 🧑‍💻 within a distributed team
    with flexible working hours; you structure your own day
  - Say goodbye to meeting overload! We believe in a healthy mix
    of async and sync work, so you can focus on what truly
    matters—no more wasted time on endless meetings!
  - Good health is important, so we offer private medical
    insurance, dental & vision as standard 🩺
  - We believe in paid parental leave 👶 to help you celebrate
    this important milestone, transition to your new life, and
    bond with your new baby. We offer 16 weeks to primary and
    6 weeks to secondary caregivers, fully paid. Plus a 2-week
    part-time phased return at full pay to help you get used
    to your new (and slightly more complex!) schedule
  - Quarterly offsites in various exciting locations as a
    company or team to connect, work together and have fun (so
    far in Tuscany 🇮🇹 Berlin 🇩🇪 Austria 🇦🇹 and Athens 🇬🇷).
  - On top of this 👆each person gets a yearly travel allowance
    to connect and co-work with someone or a team of people
    for a few days.
  - An allowance for your at-home setup, to ensure you are
    happy, comfortable and productive. If you prefer a local
    co-working space, we’ll pay for your desk.
  - An annual allowance for your Learning and Development needs.
  - Work with some of the best people you’ll ever get to meet!
  - And of course, you get some awesome Dune swag! ✌️😎

  ------------------------------------------------------------
  ------------------------------

  We are dedicated to building a diverse, inclusive, and
  authentic workplace, so if you’re excited about this role
  but your experience doesn’t align perfectly with every
  qualification in the job description, we encourage you to
  apply anyway. You may be just the right candidate for this
  or other roles.

