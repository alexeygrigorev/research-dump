description: |
  Vestiaire Collective is the leading global online
  marketplace for desirable pre-loved fashion. Our mission is
  to transform the fashion industry for a more sustainable
  future by empowering our community to promote the circular
  fashion movement. Vestiaire was founded in 2009 and is
  headquartered in Paris with offices in London, Berlin, New
  York, Singapore, Ho Chi Minh, and warehouses in Tourcoing
  (France), Crawley (UK), Hong Kong and New York.



  We currently have a diverse global team of 600 employees
  representing more than 50 nationalities. Our values are
  Activism, Transparency, Dedication and Greatness and
  Collective.

  The role

  Vestiaire Collective is looking for a Berlin-based  Senior
  Engineering Manager to lead our cross-hub Discovery team
  across Berlin and Paris.

  The Discovery team plays a critical role in how buyers
  explore, discover and engage with our catalog. The team owns
  key user-facing surfaces such as search, browsing,
  merchandising exposure, and content-driven discovery, with
  the objective of helping buyers find the right items at the
  right time while balancing business, operational and brand
  considerations.

  As an Engineering Manager, you will lead a comprehensive,
  cross-functional squad encompassing frontend, backend,
  machine learning, and data science to execute the Discovery
  roadmap end-to-end. You will work closely with Product,
  Design, Marketing, Merchandising and Data to deliver
  impactful features that improve user engagement, performance
  and scalability. Because our Discovery experience is heavily
  driven by search ranking and personalization algorithms,
  your squad will also actively integrate and rely on
  solutions built by our Data Scientists.

  Reporting to the Director of Data Science and Engineering,
  you will combine people leadership, delivery ownership and
  technical contribution, while growing a strong, autonomous
  and product-oriented engineering team.

  What you’ll do

  - Lead the end-to-end execution of the technical roadmap,
    delivering high-quality, scalable Discovery features.
  - Collaborate with cross-functional partners (Product, Design,
    Marketing, Merchandising, CRM, Data) to align business
    priorities, user value, and technical feasibility,
    effectively balancing a global and local portfolio.
  - Drive the overarching Discovery Strategy, a key investment
    pillar for 2027, by partnering directly with leadership
    and cross-functional stakeholders. You will operate in a
    high-visibility, milestone-driven environment to ensure
    predictable, high-quality delivery.
  - Act as the technical bridge between software engineering and
    machine learning, leveraging your cross-functional domain
    expertise across disciplines to build upon the multi-stage
    composable search stack
  - Manage and mentor a unified squad of 9 members across
    software engineering and data science. You will drive
    their professional growth through tailored coaching,
    impactful 1:1s, and clear career development plans,
    ensuring every specialist feels supported within a unified
    team culture.
  - Actively contribute to technical discussions, system design
    and architectural decisions.
  - Drive operational excellence and foster a healthy
    engineering culture by championing automation, code
    quality, observability, and continuous improvement.

  Who you are

  - 5+ years of experience in software or machine learning
    engineering, with 3+ years in an Engineering Management or
    technical leadership role.
  - Domain experience in Search & Recommendation systems (bonus
    if E-commerce or Marketplace platforms) and experience in
    managing cross-functional squads to enable rapid
    onboarding and architectural alignment across disciplines.
  - You have a proven track record of building high-traffic,
    user-facing products. You are comfortable designing
    distributed systems and managing real-time data pipelines
    that power search and recommendation engines.
  - Proven track record of hiring, retaining and mentoring
    senior engineers, and building high-performing teams.
  - Strong communication skills and executive presence. You
    thrive in a high-accountability culture, comfortably
    navigating ambiguity, and aligning cross-functional
    stakeholders around shared company goals.

  Our tech stack

  Languages Golang, Python, TypeScript, Swift, Kotlin

  Data & Infrastructure OpenSearch, Kafka, Redis, Airflow,
  MariaDB AWS, Kubernetes, Terraform, Ansible

  Data & Analytics Snowflake, Snowplow, Tableau, Streamlit,
  Dust

  Tooling Github, Jira, OpenAPI,

  What we offer

  - Competitive compensation and 28 days of paid annual leave.
  - Health and wellness support through Urban Sports Club.
  - A BVG Job Ticket for public transport in Berlin.
  - Corporate Benefits discounts of up to 40% with participating
    providers, including leisure activities and subscriptions.
  - A company pension scheme to help you build additional
    retirement savings.
  - Investment in your learning and growth, with the opportunity
    to shape how millions of people discover pre-loved
    fashion.
  - Two days to volunteer with an organisation of your choice
    through our Two Days to Help programme.
  - A global team representing more than 50 nationalities,
    working together to make fashion more circular.

   Equal opportunities at Vestiaire Collective

  Vestiaire Collective is an equal opportunity employer. We
  welcome applicants of all backgrounds and are committed to
  creating an inclusive workplace. If this role excites you,
  we encourage you to apply even if you don’t meet every
  requirement. We value the different experiences and
  perspectives people bring to our teams.

  Beware of recruitment scams

  Vestiaire Collective only contacts candidates from official
  email addresses ending in @vestiairecollective.com or from
  no-reply@hire.lever.co. We never send job offers through
  WhatsApp, Telegram or similar messaging apps, and we never
  ask candidates for payments or banking details during
  recruitment.

  If you receive a suspicious message, please report it to
  talentacquisition@vestiairecollective.com.

  We may use AI tools to support parts of our hiring process,
  such as reviewing applications, analysing CVs, assessing
  responses or flagging information in application materials
  that may need verification. These tools support our
  recruitment team. People make all final hiring decisions. If
  you’d like more information about how we process your data,
  please contact us.
