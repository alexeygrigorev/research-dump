description: |
  Overview/ Job Responsibilities

  Entarian is seeking a high-performing Junior Full Stack
  Developer to work within a fast-paced, remote Agile DevOps
  team contributing and collaborating within your scrum team
  on a daily basis. In this role, the Developer will
  accomplish the following:

  - Analyze software requirements and provide solutions
  - Perform analysis, design, coding, testing, implementation,
    and maintenance of software solutions
  - Provide Full Stack software development support for User
    Interfaces, REST APIs, Data Access Layers
  - Ensure software developed meets the project coding standards
    so it passes all quality stages within the CI pipeline
  - Write automated test such as: unit, integration, functional,
    performance, and end-to-end
  - Develop in environments that utilize CI/CD tools for build,
    test, secure and deploy
  - Develop in a Docker and Docker Compose environment
  - Develop data access layers with Database schemas using JPA

  Salary: $55,000 DOE

  Minimum Qualifications

  - Must be able to pass a DHS Suitability clearance
  - Minimum of 1 years related experience
  - Agile Software Development experience
  - Java stack/J2EE, Spring Boot, and JPA
  - Frontend UI development with JavaScript frameworks such as
    React, jQuery, Angular
  - Developing data access layers with Database schemas using
    JPA
  - Experience in containerization developing in a Docker and
    Docker Compose environment
  - Experience writing automated test such as: unit,
    integration, functional, performance, and end-to-end.
  - Experience developing in environments that utilize CI/CD
    tools for build, test, secure and deploy
  - Excellent communication skills
  - Strong analytical and creative problem-solving skills
  - Able to be responsive and available in a remote
    collaborative environment - being proactive, passionate,
    and show initiative using MS Teams
  - Must be a U.S. Citizen
  - Must be able to obtain and maintain a Public Trust Clearance
  - Bachelor's Degree

  Desired Qualifications

  - Experience developing in a microservices architecture
  - Experience in Web Based Full Stack Development
  - Experience in Frontend UI development with JavaScript
    frameworks such as React, Angular, jQuery
  - Experience working with AWS tools and environments
  - Automated Test-Driven Development (ATDD) frameworks
    Selenium, Nightwatch, Cucumber, JUnit/TestNG
  - Experience with secure development, coding, scanning using
    tools such as SonarQube, Fortify, ZAP and
    Twistlock/Anchore
  - Experience with Asynchronous messaging preferably with
    Kafka. Other tools/protocols such as JMS, SMS, AMQP,
    RabbitMQ acceptable
  - Experience deploying microservices to Kubernetes platforms
    such as EKS, OpenShift, AKS
  - Experience developing Web Services using REST/JSON and
    SOAP/XML
  - Writing queries with relational databases
  - Web technologies - HTML, CSS, JavaScript, JSON, jQuery
  - Experience with database tools such as Flyway, Liquibase,
    ElasticSearch, Solr/Lucene
  - Experience working with Jenkins Continuous integration tools
    and DevOps automation
  - DHS/USCIS experience preferred

  Security Clearance: Must be a US Citizen and have or are
  able to attain a Government Agency Suitability Clearance.

  About Us

  Formed through the strategic union of Sev1Tech and ERT,
  Entarian is a premier provider of mission-critical
  engineering and technology solutions. Founded on a legacy of
  excellence dating back to 1993, Entarian is a product of an
  evolved and fully diversified engineering and federal
  technology leader. From deep space to defense and civilian
  missions, Entarian delivers secure, mission-aligned digital
  solutions that drive national resilience and operational
  effectiveness. We don't just support modernization; we
  define it.

  Join the Mission and Start your Career Journey: Apply
  Directly via our Careers Portal  Connect, Referrals &
  Inquiries? Email the team: careers@entarian.com

  Entarian is an Equal Opportunity and Affirmative Action
  Employer. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, sex, pregnancy, sexual orientation, gender
  identity, national origin, age, protected veteran status, or
  disability status.
