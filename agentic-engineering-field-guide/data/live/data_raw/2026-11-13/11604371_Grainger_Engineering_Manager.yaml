description: |
  Work Location Type: Hybrid  Req Number 335778 About Grainger
  W.W. Grainger, Inc., is a leading broad line distributor
  with operations primarily in North America, Japan and the
  United Kingdom. At Grainger, We Keep the World Working® by
  serving more than 4.5 million customers worldwide with
  products and solutions delivered through innovative
  technology and deep customer relationships. Known for its
  commitment to service and award-winning culture, the Company
  had 2024 revenue of $17.2 billion across its two business
  models. In the High-Touch Solutions segment, Grainger offers
  approximately 2 million maintenance, repair and operating
  (MRO) products and services, including technical support and
  inventory management. In the Endless Assortment segment,
  Zoro.com offers customers access to more than 14 million
  products, and MonotaRO.com offers more than 24 million
  products. For more information, visit www.grainger.com.
  Compensation The anticipated base pay compensation range for
  this position is $134,100.00 - $223,500.00. This role is
  eligible for an incentive target of up to 15 %, based on the
  achievement of individual and company performance objectives
  in accordance with the current terms of the incentive
  program which are subject to change. Position is not
  eligible for visa sponsorship. Rewards and Benefits With
  benefits starting on day one, our programs provide choice
  and flexibility to meet team members' individual needs,
  including:

  - Medical, dental, vision, and life insurance plans with
    coverage starting on day one of employment and 6 free
    sessions each year with a licensed therapist to support
    your emotional wellbeing.
  - 18 paid time off (PTO) days annually for full-time employees
    (accrual prorated based on employment start date) and 6
    company holidays per year.
  - 6% company contribution to a 401(k) Retirement Savings Plan
    each pay period, no employee contribution required.
  - Employee discounts, tuition reimbursement, student loan
    refinancing and free access to financial counseling,
    education, and tools.
  - Maternity support programs, nursing benefits, and up to 14
    weeks paid leave for birth parents and up to 4 weeks paid
    leave for non-birth parents.


  For additional information and details regarding Grainger's
  benefits, please click on the link below:
  https://experience100.ehr.com/grainger/Home/Tools-
  Resources/Key-Resources/New-Hire Grainger Benefits The pay
  range provided above is not a guarantee of compensation. The
  range reflects the potential base pay for this role at the
  time of this posting based on the job grade for this
  position. Individual base pay compensation will depend, in
  part, on factors such as geographic work location and
  relevant experience and skills. The anticipated compensation
  range described above is subject to change and the
  compensation ultimately paid may be higher or lower than the
  range described above. Grainger reserves the right to amend,
  modify, or terminate its compensation and benefit programs
  in its sole discretion at any time, consistent with
  applicable law. Position Details We are seeking an
  Engineering Manager to join the Pricing team in Product
  Engineering. Pricing owns the services, tools, and data that
  set Grainger's prices, apply customer pricing programs and
  promotions, and serve the right price to Grainger systems.
  Our mission is to deliver dependable, explainable pricing
  through API-first services and shared data products. This
  leader builds strong teams through encouraging teamwork,
  works well with senior leadership and business partners, and
  has a clear view of what a good solution looks like for the
  team, the customer, and the company. As an Engineering
  Manager at Grainger, you would partner with Product
  Management, Architects, Designers, and Engineers to lead
  teams in the end-to-end delivery of project work and to
  promote modern engineering practices. You would work closely
  with Pricing business partners, Security, and Platform teams
  to keep pricing services accurate, secure, resilient, and
  scalable. Many channels and downstream teams rely on the
  prices your services produce, so you will also guide quality
  at every stage of the development life cycle and keep
  delivery on time and on budget. This position reports to the
  Senior Manager, Pricing, Product Engineering. Location This
  role is a hybrid role located at Merchandise Mart in
  downtown Chicago, 2 days per week. We will also consider
  candidates who are seeking relocation to Chicago and provide
  partial relocation assistance. You Will

  - Leads, coaches, and develops a team of software engineers by
    setting performance expectations, providing ongoing
    feedback, supporting career development, building AI
    fluency and adoption of AI-enabled engineering practices,
    and fostering an inclusive, collaborative, and high-
    performing engineering culture.

  - Partners with Product Management, User Experience, Machine
    Learning Scientists, and technology stakeholders to
    translate product roadmaps and business priorities into
    delivery plans, engineering objectives, resource
    allocation, and successful execution of product
    initiatives.

  - Manages the delivery of software solutions by overseeing
    planning, development, testing, deployment, and production
    support activities while ensuring solutions meet quality,
    security, scalability, reliability, and performance
    standards.

  - Establishes and reinforces engineering standards, Agile
    delivery practices, DevSecOps principles, AI-assisted
    software engineering practices, code quality expectations,
    and continuous integration and deployment processes to
    improve engineering effectiveness and product quality.

  - Monitors team performance, delivery metrics, operational
    health, customer experience, and engineering outcomes by
    identifying risks, resolving delivery issues, implementing
    process improvements, and driving continuous operational
    excellence.

  - Collaborates with engineering leaders, architecture, Site
    Reliability Engineering, Security, and platform teams to
    resolve complex technical and operational challenges,
    support technology modernization initiatives, and ensure
    alignment with enterprise standards and governance.

  - Performs other work assignments as required.

  - Act as a key partner to Pricing business leaders and to the
    product and engineering teams that consume pricing APIs
    and data products. Explain tradeoffs, estimates, and risks
    in plain terms.

  - Ensure healthy team operations, including sustainable
    delivery, on-call practices, and incident response for
    pricing services on customer-facing and order paths. Serve
    as the point of escalation for the team's projects and
    deliverables.

  - Take part in domain-wide forums such as town halls and
    showcases, and help build a culture of direct feedback and
    shared learning across Pricing teams.


   You Have

  - Bachelor's Degree Computer Science, Information Technology,
    Software Engineering, or a related technical field, or
    equivalent required

  - 5+ years progressive experience in software engineering,
    application development, or related technology roles.
    required

  - 5+ years experience leading software development teams,
    technical teams, or Agile delivery teams with
    responsibility for coaching, performance management, and
    work prioritization. required

  - Experience delivering software solutions using Agile
    methodologies and modern software engineering practices in
    cloud-based environments preferred

  - Knowledge of software engineering principles, system
    architecture, Agile delivery methodologies, DevSecOps
    practices, cloud platforms, CI/CD pipelines, automated
    testing, containerization, and modern application
    development frameworks.

  - Ability to evaluate, adopt, and lead the effective use of
    AI-enabled engineering tools and practices to improve
    developer productivity, software quality, operational
    efficiency, and delivery outcomes while maintaining
    engineering standards and appropriate human oversight.

  - Ability to lead software development teams through planning,
    execution, deployment, operational support, continuous
    improvement, and delivery of customer-focused technology
    solutions.

  - Knowledge of engineering governance, software quality,
    application security, operational monitoring, incident
    management, and performance measurement within enterprise
    technology environments.

  - Ability to develop technical talent, coach engineers, manage
    team performance, facilitate cross-functional
    collaboration, and influence engineering decisions to
    achieve business and technology objectives.

  - Ability to manage Agile sprint teams, vendor relationships,
    and on-shore/off-shore teams. preferred

  - Technical knowledge in:

    - Java and Kotlin (JVM) with Spring Boot

    - Javascript

    - Microservices and API-first architecture, event-driven
      integration (Kafka)

    - Data platforms and pipelines (Snowflake, Databricks,
      Astronomer)

    - Cloud (AWS), platform usage, and containerization

    - Observability and monitoring tools (Datadog)

  - Experience leading teams that own high-volume, business-
    critical services where correctness matters, such as
    pricing, order management, payments, or commerce
    platforms. preferred

  - Ability to turn complex business rules into clear
    requirements and tests, and to explain them to non-
    technical partners.


