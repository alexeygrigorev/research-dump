title: Senior Frontend Engineer
company: Raydar
location: San Francisco, USA
work_type: FULL_TIME
company_size: 28 Employees
description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Own the design and delivery of user-facing web features,
  combining strong engineering with a sharp eye for interface
  design. Work closely with product and backend colleagues to
  turn advanced capabilities into intuitive experiences, and
  contribute to improving engineering workflows with modern
  tooling.

  What you'll do

  - Architect scalable frontend systems, including reusable
    component libraries, state management and API integration
    patterns.

  - Optimize bundle sizes and application performance as usage
    grows.

  - Ship the main user-facing features end-to-end, from
    components through API integration to production polish.

  - Partner with product and backend engineers to present
    powerful functionality in a simple, elegant interface.

  - Build complex real-time and interactive frontend features,
    including streaming, dashboards and conversational
    interfaces.

  - Prototype design ideas directly in code using AI tools,
    sharing working demos in place of static mockups.

  - Contribute ideas for making the team's review and delivery
    processes faster through automation.

  Requirements

  What we're looking for

  - 6+ years shipping production-grade products at a senior to
    staff level.

  - Deep expertise in modern web technologies such as React and
    TypeScript, with an understanding of the performance
    impact of architectural choices.

  - Daily use of AI coding tools, shipping several features a
    day with their help.

  - Engineering-first mindset paired with strong design
    instincts for spacing and visual hierarchy.

  - High agency, shown through founder, founding engineer or
    significant ownership roles at a startup.

  - Current awareness of AI tooling and the ability to explain
    how your own stack has changed recently.

  - Comfort speaking with customers and sales to shape the
    product.

  - Based in San Francisco or willing to relocate immediately.

  Bonus points

  - Prior founder or founding engineer experience.

  - Real-time streaming or video pipeline experience.

  - Voice AI product experience.

  - Generative UI or dashboard work.

  - Comfort with Python for occasional backend work.

  - No degree required; a portfolio and shipping track record
    matter more.

  Benefits

  Compensation and benefits

  - Base salary: USD 250,000 to 315,000 per year

  - Equity

  - Health, dental and vision coverage

  - Paid parental leave

  - Retirement plan

  - Relocation support

  Location and work model

  - San Francisco, CA, United States

  - On-site, 5 days per week in office

  - Full-time
