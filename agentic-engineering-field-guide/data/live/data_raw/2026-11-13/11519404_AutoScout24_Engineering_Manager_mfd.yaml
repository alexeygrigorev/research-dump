description: |
  A career driven by you. Join AutoScout24 Group and
  experience life in the fast lane. We’re not just leading the
  market; we’re creating it. We’re constantly innovating,
  evolving and transforming things for our customers. We’re
  driven, ambitious and determined to do our best work,
  together. For a career that doesn’t stand still, where you
  can put your ideas in the driving seat and change the way
  the world moves, join our international community.

  The role As an Engineering Manager, you will lead a team
  within one domain, building a high-performing environment
  that solves user problems and delivers measurable business
  value. You will combine people leadership with technical
  judgement, partner closely with Product and UX, and take
  accountability for delivery and the systems your team owns.
  The role spans people, delivery, technology, financials and
  business. You will understand the current position in each
  area and focus on the priorities that matter most at a given
  time.

  What you'll do Team leadership and development

  - Build, coach and develop a high-performing team. Identify
    capability gaps, break down knowledge silos, hire the
    right talent and support both top performers and people
    who need to improve.
  - Create an environment of trust, candid feedback, learning
    and psychological safety. Monitor morale and wellbeing,
    address productivity blockers and handle difficult
    conversations when needed.
  - Set clear expectations, support individual growth paths and
    hold people accountable for commitments. Delegate
    effectively, balancing autonomy, guidance and learning,
    and empower the team to make decisions aligned with
    company priorities.
  - Explain management decisions clearly, challenge
    constructively and commit to agreed decisions.

  Delivery and collaboration

  - Own team capacity, work in progress, output and engineering
    outcomes. Partner with Product and UX on feasible
    roadmaps, milestones and capacity allocation.
  - Plan and review technical initiatives, technical debt
    reduction and operational work. Define engineering
    excellence metrics, assess cost and value, contribute to
    design documents and refine effort estimates.
  - Communicate proactively with stakeholders and other teams.
    Resolve blockers through alternative solutions with clear
    ownership and timelines, or escalate when needed.
  - Recognise when business problems could benefit from machine
    learning and align initiative planning with data teams.
  - Ensure security and regulatory compliance for the systems
    your team owns, including timely remediation or formal
    risk acknowledgement.

  Technology and operational excellence

  - Understand your team’s services, architecture and data
    flows. Guide technical decisions, review design options
    for resilience, cost and performance, explain trade-offs
    and contribute hands-on when time allows.
  - Apply threat modelling, secure design principles and
    mandatory security training. Avoid accidental complexity
    and use established practices, platform capabilities and
    AutoScout24 engineering values and principles.
  - Ensure actionable monitoring and alerting. Define and refine
    service level objectives with stakeholders, review
    reliability and performance, and act when objectives are
    missed.
  - Where on-call is required, establish sustainable rotations,
    shared knowledge and incident practice. Follow incident
    and security escalation processes, conduct post-incident
    reviews and complete improvement actions.
  - Make business data available through the data platform,
    maintain its metadata and take responsibility for its
    quality, availability and consistency.

  Financials and business impact

  - Monitor infrastructure and licence costs, plan mitigating
    actions and involve the group director and Finance when
    needed. Support budget planning, follow procurement
    guidelines and align capitalisable product capacity with
    Finance.
  - Align team priorities with company strategy and stakeholder
    needs. Negotiate trade-offs across timing, quality and
    scope to maximise value and learning.
  - Measure the business impact of releases, use product metrics
    to inform recommendations and show how the team
    contributes to company goals.
  - Contribute to cross-team initiatives by identifying
    improvements, defining and delivering tasks, and
    presenting outcomes.

  What you'll bring

  - Industry experience consistent with Engineering Manager
    scope, typically 8+ years, with the ability to lead and
    develop an engineering team within one domain.
  - Experience working with mobile engineering teams and a solid
    understanding of React Native, including its architecture,
    development practices and the challenges of building and
    maintaining high-quality cross-platform applications.
  - Strong technical judgement and understanding of software
    architecture, operational reliability, security and the
    systems your team owns.
  - The ability to coach, delegate, give direct feedback and
    manage challenging people and leadership situations.
  - Experience planning capacity, delivering engineering
    outcomes and working effectively with Product, UX, data
    teams and other stakeholders.
  - An understanding of business metrics, financial trade-offs
    and fundamental data science concepts, combined with clear
    prioritisation and communication.

