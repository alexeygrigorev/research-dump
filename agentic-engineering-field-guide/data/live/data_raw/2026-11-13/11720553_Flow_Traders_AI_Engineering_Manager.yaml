description: |
  AI Engineering Manager We're setting up a new AI team within
  Data and AI and are looking for an Engineering Manager to
  lead it. Good engineering management makes a big difference
  to how well teams grow, keep their people and deliver, and
  that is what we want from this role. You'll look after the
  planning and people side: delivery, growth, performance,
  culture and hiring. You work alongside technical leads who
  own architecture, technical direction and hands-on
  execution. You need each other, so expect to work closely.
  We'll judge you on how your engineers develop and what your
  team delivers. Most of your time goes to understanding how
  the business works and unlocking use cases where AI makes a
  real difference, next to leading your people and your
  delivery. What you'll do:

  - Get to know how the business runs. Spend time with the
    teams, understand their processes and find where AI, or
    sometimes just a better tool, would help.
  - Unlock use cases and take them from first idea to something
    live, including the business case and how success will be
    measured.
  - Own the AI roadmap: set priorities and sequence the work in
    line with company goals.
  - Coach and develop your engineers, including career planning,
    promotions and regular performance conversations.
  - Build the team: hiring, headcount planning and allocating
    people to the work that matters most.
  - Keep the team healthy. Pay attention to morale and
    productivity, and deal with conflict early.
  - Hold regular one-on-ones, give feedback on time and make
    room for team building.
  - Turn technical and business requirements into clear delivery
    plans, and flag dependencies and risks up front.
  - Work with Engineering, Trading and Quant to design and roll
    out new AI solutions.
  - Track progress against plan, handle risk and scope trade-
    offs, and keep stakeholders informed.
  - Keep improving how we deliver and how fast the team moves.
  - Stay aligned with company goals and timelines, working
    closely with Tech Leads and Staff Engineers on technical
    direction.

  What we're looking for:

  - A good eye for processes. You've worked out how things
    really run, changed them yourself and can tell when a
    problem needs AI and when it doesn't.
  - Strong project management: roadmaps, sequencing,
    dependencies and risk, in a fast-moving environment.
  - Enough technical background to earn your engineers' respect
    and join technical discussions with credibility.
  - Experience leading software engineers, growing them and
    managing their performance.
  - A track record of delivering software through a team while
    balancing scope, quality and timelines.
  - Good people skills: coaching, giving feedback, resolving
    conflict and creating a team where engineers do their best
    work.
  - Good judgment when hiring and developing people.
  - Real interest in AI. You follow what's happening and can
    tell what matters for us.
  - Clear communication with technical and non-technical people,
    including cross-functional stakeholders like Trading and
    Quant.
  - Based in Amsterdam, or willing to relocate.

  What we offer: At Flow Traders, we create the conditions for
  hard‑working, high‑performing people to do their best work.
  From a thorough onboarding and ongoing access to Flow
  Academy, to latest technology and a collaborative,
  non‑hierarchical culture, we give you the tools, ownership,
  and support to move fast and drive outcomes. We keep a
  close‑knit, small‑company feel while offering competitive
  salary, annual discretionary profit share, and comprehensive
  benefits, so talent can grow here, and stay here. See our
  benefits below:

  - Flow Academy and opportunities to attend domain-related
    conferences
  - Daily catered lunch, great coffee, and a fully stocked
    kitchen and snack bar
  - In-house Bar and Lounge with arcade, table tennis,
    billiards, and game consoles
  - Company boat
  - In-house gym and sessions with our nutritionist or personal
    trainer
  - Bi-weekly massages
  - Annual company trip and a variety of events throughout the
    year, such as the New Years Event
  - Global rotations across our offices worldwide
  - and more

  Flow Traders does not accept unsolicited resumes from any
  professional staffing or search firms. All resumes, and any
  other information identifying potential candidates,
  submitted to any employee at Flow Traders via-email, the
  Internet or directly without a valid and signed search
  agreement will be deemed free to contact by Flow Traders
  without any restrictions and no placement fee of any kind
  will be paid in the event the candidate is hired by Flow
  Traders.
