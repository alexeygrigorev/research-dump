title: "Senior Software Build Engineer (ID :4118)"
company: STAFIDE
location: Amsterdam, NLD
work_type: FULL_TIME
company_size: 10 Employees
description: |
  As a Senior Software Build Engineer, you will

  - Design, develop, and implement software build solutions in
    alignment with technical requirements and project
    roadmaps.
  - Prepare and execute technical work packages, ensuring
    effective planning, high-quality deliverables, and timely
    completion.
  - Develop, maintain, and optimize build systems using Bazel,
    ensuring reliable, scalable, and reproducible software
    builds.
  - Work with Bazel concepts, including rules, macros,
    platforms, Remote Build Execution (RBE), caching,
    toolchains, and hermetic builds.
  - Develop and maintain software solutions using Go and Python
    programming languages.
  - Apply modern software engineering practices, including
    algorithm implementation, test-driven development (TDD),
    and behavior-driven development (BDD).
  - Implement and maintain automated software integration,
    build, and release processes using tools such as GitHub
    Actions.
  - Manage source code and version control using Git, GitHub
    Enterprise, and IBM Rational ClearCase.
  - Collaborate with cross-functional engineering teams to
    deliver robust and maintainable build solutions.
  - Identify and resolve build-related challenges, improve
    development workflows, and ensure software quality.
  - Communicate technical challenges, progress, and outcomes
    effectively to stakeholders.

  What You Bring to the Table

  - 8–10 years of professional experience in software
    development and build management.
  - Mandatory hands-on experience in Bazel development and a
    strong understanding of its core concepts.
  - Practical programming experience in Go and Python.
  - Strong knowledge of modern software design, development
    principles, and algorithm implementation.
  - Experience with automated software integration and release
    processes.
  - Hands-on experience with Git, GitHub Enterprise, and IBM
    Rational ClearCase.
  - Understanding of software testing methodologies, including
    TDD and BDD.
  - A strong quality mindset, problem-solving skills, and a
    proactive approach to engineering challenges.
  - Ability to work effectively in a collaborative, fast-paced
    engineering environment.

  You should possess the ability to

  - Design and implement efficient, scalable, and reliable
    software build systems.
  - Troubleshoot complex build issues and optimize build
    performance through caching, toolchains, and remote
    execution.
  - Develop and maintain reusable Bazel rules, macros, and build
    configurations.
  - Automate build, integration, and release workflows using
    modern CI/CD tools.
  - Plan and execute technical work packages while maintaining
    quality and meeting deadlines.
  - Work independently and collaboratively within small, highly
    skilled engineering teams.
  - Take ownership of deliverables and demonstrate initiative,
    accountability, and attention to detail.
  - Communicate technical information, challenges, and results
    clearly to technical and non-technical stakeholders.

  What we bring to the table

  - An opportunity to work on advanced software build
    engineering and development solutions.
  - A collaborative environment with experienced engineering
    professionals.
  - Opportunities to improve build automation, software
    integration, and development workflows.
  - Exposure to modern software engineering practices, tools,
    and technologies.

  Let’s Connect

