description: |
  Join Pigment: The AI Platform Redefining Business Planning



  Pigment is the AI powered business planning and performance
  management platform built for agility and scale. We connect
  people, data, and processes in one intuitive, feature-rich
  solution, empowering every team—from Finance to HR—to build,
  adapt, and align strategic plans in real time.



  Founded in 2019, Pigment is one of the fastest growing SaaS
  companies globally. Industry leaders like Unilever,
  Snowflake, Siemens, and DPD use Pigment daily to make more
  informed decisions and confidently navigate any scenario.



  With a team of 500+ across Paris, London, New York, San
  Francisco, and Toronto, we've raised nearly $400M from top-
  tier investors and were named a Visionary in the 2024
  Gartner® Magic Quadrant™ for Financial Planning Software.



  At Pigment, we take smart risks, celebrate bold ideas, and
  challenge the status quo all while working as one team. If
  you're driven by innovation and ready to make an impact at
  scale, we’d love to hear from you.





  Our Engineering team



  Our Engineering team is responsible for developing our SaaS
  platform and building a comprehensive and user-friendly
  product.



  Pigment engineers participate in the entire application
  development lifecycle, focusing on design, coding, and
  keeping the production platform up and running. They can be
  specialized, but there is no strict separation between the
  backend and the frontend.



  We value user-centricity and pragmatism: we choose the most
  relevant tools for the problem we have to solve,
  understanding the strengths and constraints of each
  technology.



  Our engineering culture also values curiosity, humility,
  trust, ownership and team spirit.



  Our technical stack is C# on .NET Core Linux, React,
  TypeScript, PostgreSQL, Google Cloud Platform, Docker,
  Kubernetes, Terraform, RabbitMQ and Circle CI.



  Explore Our Tech Blog:

  If you're curious about the kind of challenges our
  engineering team tackles, our culture and our organization,
  we invite you to explore our Tech Blog!



  Who you are



  More than knowledge of a specific language or framework, we
  are looking for great software engineering skills: ability
  to translate functional requirements into an elegant and
  simple design, and then deliver the code.



  We are also looking for engineers who understand the product
  and the customer's needs in detail and can suggest
  innovative ideas: in the end, it's all about delivering
  value to end users.



  In any case, you have:

  - Experiences as a software engineer working on a product in
    production.
  - Proven experience designing object oriented software with
    languages such as C#, Java, C++, Golang, Rust, Python or
    Ruby (this list is not exhaustive).
  - Great team spirit with a problem-solving attitude.
  - A good dose of humility and the willingness to grow (no
    matter your seniority!).



  Folks from underrepresented minorities: science shows that
  you are less likely to apply if you feel that you don’t have
  all the necessary prerequisites. If this description matches
  where you are now or what you'd like to grow into in your
  next position, we encourage you to apply.





  What you will get

  - Competitive salary
  - Equity
  - Trust and flexible working hours
  - Brand new offices in the heart of Paris, London, New York
    and, Toronto
  - Remote-friendly environment



