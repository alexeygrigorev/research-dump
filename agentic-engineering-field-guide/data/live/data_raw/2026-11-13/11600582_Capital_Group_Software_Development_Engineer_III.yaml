description: |
  “I can be myself at work.”

  You are more than a job title. We want you to feel
  comfortable doing great work and bringing your best,
  authentic self to everything you do. We value your talents,
  traditions, and uniqueness—and we’re committed to fostering
  a strong sense of belonging in a respectful workplace.

  We intentionally seek diverse perspectives, experiences, and
  backgrounds, investing in a culture designed to celebrate
  differences. We believe that belonging leads to better
  outcomes and a stronger community of associates united by
  our mission. At Capital, we live our core values every day:
  Integrity, Client Focus, Diverse Perspectives, Long-Term
  Thinking, and Community.



  “I can influence my income.”



  You want to feel recognized at work. Your performance will
  be reviewed annually, and your compensation will be designed
  to motivate and reward the value that you provide. You’ll
  receive a competitive salary, bonuses and benefits. Your
  company-funded retirement contribution will factor in salary
  and variable pay, including bonuses.



  “I can lead a full life.”



  You bring unique goals and interests to your job and your
  life. Whether you’re raising a family, you’re passionate
  about where you volunteer, or you want to explore different
  career paths, we’ll give you the resources that can set you
  up for success.

  - Enjoy generous time-away and health benefits from day one,
    with the opportunity for flexible work options
  - Receive 2-for-1 matching gifts for your charitable
    contributions and the opportunity to secure annual grants
    for the organizations you love
  - Access on-demand professional development resources that
    allow you to hone existing skills and learn new ones

  “I can succeed as a Software Development Engineer at Capital
  Group”

  As a Software Development Engineer, you will design and
  implement distributed systems to make Capital Group’s
  investment process measurably more efficient and effective.
  You will design and own services and launch critical
  features to impact over $3 trillion in assets under
  management.

  Capital Group’s mission since 1931 has been to improve our
  customers’ lives through successful long-term investing. As
  a privately held company with over eight decades of
  proprietary research and trading data, we are in a unique
  position to leverage large-scale cloud computing to deliver
  even more value to our funds’ investors. The ideal candidate
  for this engineering role will be passionate about our
  team’s mission of applying modern engineering and
  quantitative methods to drive superior long-term investment
  results.

  Responsibilities:

  - You successfully design and build projects from inception to
    completion, as well as operate them.
  - You bring a high level of craftsmanship to your work,
    ensuring integrity in both form and function.
  - You collaborate effectively to support team strategy,
    contributing to architecture and technology choices.
  - You bring a cloud-first approach to designing robust,
    distributed, and scalable services for both data
    processing and calculation.
  - You set the standard for quality, simplicity, test coverage,
    and documentation.
  - You work to identify and resolve the root causes of endemic
    problems, and collaborate effectively with other teams to
    implement correct, long-term fixes.
  - You work with a sense of urgency, and design and build
    simple and pragmatic solutions which solve complex
    problems.

  Required Skills & Experience

  - BS in Computer Science or related field, or an equivalent in
    relevant work experience.
  - Professional software development experience in at least one
    modern language such as Java, Go, Typescript, JavaScript,
    or Python.
  - Strong OO and functional design skills with an understanding
    of common design patterns.
  - Strong understanding of web development principles,
    including HTML, CSS, DOM manipulation, and responsive
    design.
  - Experience with low-latency Software Oriented Architecture
    (SOA) designs.
  - Experience with cloud native development.
  - Excellent verbal and written communication skills, and high
    emotional intelligence.
  - Experience working collaboratively within an agile team,
    including test-driven development.
  - Track record of successfully delivering enterprise-grade
    software into production.
  - Proficiency using AI-powered software engineering tools such
    as Claude Code, GitHub Copilot, or similar coding
    assistants as part of the software development lifecycle.
  - Experience designing, building, and operating data pipelines
    and ETL/ELT workflows using Databricks, dbt, and Apache
    Airflow.

  Preferred Skills & Experience

  - Experience with frameworks like ReactJS, Angular, or Vue.js
    to build interactive and responsive user interface.
  - Experience building or designing scalable software
    frameworks and APIs to enable other engineers.
  - Experience building in AWS.
  - Experience proposing new customer facing products and
    features to senior business leaders.
  - Experience creating financial analytics systems.

  “I can apply in less than 4 minutes.”



  You’ve reviewed this job posting and you’re ready to start
  the candidate journey with us. Apply now to move to the next
  step in our recruiting process. If this role isn’t what
  you’re looking for, check out our other opportunities and
  join our talent community.



  “I can learn more about Capital Group.”



  At Capital Group, the success of the people who invest with
  us depends on the people in whom we invest. That’s why we
  offer a culture, compensation and opportunities that empower
  our associates to build successful and prosperous careers.
  Through nine decades, our goal has been to improve people’s
  lives through successful investing. We know that our history
  is a testament to the strength of the people we hire. More
  than 9,000 associates in 30+ offices around the world help
  our clients and each other grow and thrive every day. Find
  us on LinkedIn, Instagram, YouTube and Glassdoor.‎

