description: |
  AgileEngine is an Inc. 5000 company that creates award-
  winning software for Fortune 500 brands and trailblazing
  startups across 17+ industries. We rank among the leaders in
  areas like application development and AI/ML, and our
  people-first culture has earned us multiple Best Place to
  Work awards.

  WHY JOIN US

  If you're looking for a place to grow, make an impact, and
  work with people who care, we'd love to meet you!

  ABOUT THE ROLE

  We are looking for a Full Stack Engineer to architect low-
  latency APIs and backend services using .NET while building
  user interfaces in Angular for a large-scale financial
  services platform supporting critical investment decision
  tools. You will work with microservices architecture,
  message-driven systems including Kafka, CI/CD pipelines via
  GitHub Actions, and Splunk for observability, while
  leveraging AI coding tools including GitHub Copilot and
  Claude to accelerate development. The role requires strong
  test automation discipline and rigorous code review
  practices.

  The mandatory requirements are 2+ years of experience with
  .NET and Angular, solid experience with SQL and NoSQL
  databases, hands-on experience with microservices
  architecture and high-performance RESTful APIs, a background
  with message-driven systems such as Kafka or RabbitMQ, and
  experience writing unit and integration tests, along with US
  work authorization and upper-intermediate English
  proficiency (B2 or higher).

  WHAT YOU WILL DO

  - Architect and build low-latency APIs and backend services
    using .NET to support firm-wide critical systems.

  - Build good-looking user interfaces using Angular.

  - Leverage GitHub Copilot and advanced AI models (Claude, GPT)
    to accelerate innovation.

  - Deliver high-impact analytical tools that guide investment
    decisions for over $11 trillion in customer assets.

  - Champion code quality by maintaining >80% test automation
    coverage and leading rigorous multi-peer code reviews.

  - Own the production lifecycle of your services, utilizing
    GitHub Actions for CI/CD and Splunk for deep system
    observability.

  - Define clear API contracts using OpenAPI/Swagger to ensure
    seamless integration and long-term maintainability.

  MUST HAVES

  - You must be authorized to work for ANY employer in the US
    (e.g., Green card holders, TN visa holders, GC EAD, H4
    EAD, U4U with EAD), as we are unable to sponsor or take
    over employment visa sponsorship at this time;

  - 2+ years of strong experience with .NET and Angular,
    delivering production-grade solutions.

  - Solid experience with SQL and NoSQL databases, including
    query tuning and schema design.

  - Hands-on experience with microservices architecture and
    building high-performance RESTful APIs.

  - Proven background with message-driven systems (e.g., Kafka,
    RabbitMQ, or similar).

  - Skilled in writing unit and integration tests to ensure
    reliability and maintainability.

  - Experienced in Agile/Scrum environments, contributing to
    sprint planning and peer reviews.

  - Bachelor’s degree in Computer Science, Engineering, or
    related field, or equivalent experience.

  - Upper-Intermediate English proficiency (B2 or higher).

  NICE TO HAVES

  - UX/UI Design experience.

  - Experience with PostgreSQL.

  - Control-M or similar orchestration platform.

  - Experience with Cloud Technologies such as Pivotal Cloud
    Foundry.

  - Asset Management / Investments / FinTech experience.

  - Working knowledge of Continuous Integration/Continuous
    Deployment and DevOps principles and tools (e.g., GitHub,
    Bamboo, SonarQube, Veracode).

  PERKS AND BENEFITS

  - Professional growth: Mentorship, TechTalks, and personalized
    growth roadmaps.

  - Competitive compensation: USD-based pay with education,
    fitness, and team activity budgets.

  - Exciting projects: Modern solutions with Fortune 500 and top
    product companies.

  - Flextime: Flexible schedule with remote and office options.
