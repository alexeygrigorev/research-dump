description: |
  Senior Fullstack Engineer

  TRACT BV—Amsterdam, Netherlands

  At TRACT, we are building a more sustainable and resilient
  food and agriculture industry. Our mission? To remove the
  burden of data management and resolve the debate on
  methodology so companies can drive impact. With our SaaS
  platform, we empower organizations to focus their resources
  on making a real impact while driving positive change in the
  industry.



  About the Team

  We are a diverse and passionate team of about 40, committed
  to creating a sustainable impact and technological
  innovation. We believe in the power of collaboration and
  leverage our collective expertise to tackle complex
  challenges and drive meaningful change. Our cultural
  heartbeat & business decisions are shaped by our core
  values: ‘Accept the challenge’, ‘Commit to learn’,
  ‘Authentic & accountable’, ‘Make momentum’, & ‘Simplify &
  ship.’ These ensure that every team member can thrive and
  make a difference.

  About the Job

  As a Senior Full Stack Engineer at TRACT, you'll build our
  insights platform using spec-driven development. In practice
  that means the specification comes before the code: you
  write it, the team reviews it, and an agent implements
  against it. Your name is on both the spec and the commit.

  This changes where your time goes. Less of it on typing
  implementation, more on requirements, system design,
  acceptance criteria, and review. We don't ship code we don't
  understand.

  You'll work across the stack (Python, FastAPI, PostgreSQL,
  BigQuery, React with TypeScript) on trunk-based development
  behind feature flags.  On significant initiatives you may
  step into the Lead Engineer role — shepherding an RFC or
  tech spec, aligning the team, acting as the point of contact
  for Product and Design.

  About You

  - You've got 7+ years in industry, at least 3 in a senior
    role, and a strong foundation in system design as well as
    writing software.
  - You're proficient in Python and React with TypeScript, and
    comfortable with FastAPI, PostgreSQL, and BigQuery.
  - You write clearly. Specs, RFCs, review comments, decision
    logs
  - You're a rigorous reviewer. You read the whole diff, you ask
    what should be removed, and you're direct about problems .
  - You're already working with AI coding tools and have
    opinions about where they help and where they quietly
    create debt.
  - You take end-to-end ownership: design, implementation,
    deployment, and monitoring.
  - You're motivated by purpose-driven work. What we're building
    affects how the food and agriculture industry measures its
    own impact.

  What We Offer

  - A unique opportunity to work on a fast-growing platform that
    enables our customers to create a positive impact in Ag &
    Food sustainability
  - Full ownership and autonomy in your work, with encouragement
    for development beyond your area of expertise
  - Close collaboration in a team of +- 40 highly diverse,
    motivated, and talented colleagues
  - Competitive compensation package
  - Employee participation plan (SARs)
  - Company pension
  - 25 paid holidays + 2 diversity days + public holidays
  - Swapping 3 Dutch public holidays for other recognized
    festive days
  - Hybrid working: 3 days minimum in-office to foster company
    culture and high impact collaboration
  - Commuting allowance: 0.25 cents per km (tax-free), capped at
    20 km single commute
  - Remote working: 2 weeks per year
  - Laptop & home-office equipment
  - Learning and development budget
  - Above statutory leave for maternity, paternity, adoption &
    other life events
  - Frequent lunch & learns, including sharing our many
    different food cultures
  - Office located within walking distance from Sloterdijk
    Station in Amsterdam

  Are you interested to ‘Accept the challenge’? Join us at
  TRACT to make a positive impact!
