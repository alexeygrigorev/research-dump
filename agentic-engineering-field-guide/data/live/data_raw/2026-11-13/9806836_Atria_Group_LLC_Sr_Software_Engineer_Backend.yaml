description: |
  Company Description

  We specialize in Staffing, Consulting, Software Development,
  and Training along with IT services to small to medium size
  companies. AG's primary objective is to help companies
  maximize their IT resources and meet the ever-changing IT
  needs and challenges.

  In addition, AG offers enterprise resource planning and
  enterprise application integration, supply-chain management,
  e-commerce solutions, and B2B public exchanges and B2B
  process integration solutions. Our company provides
  application analysis, design, development and programming,
  software engineering, systems development, testing,
  integration, and implementation, and management consulting
  services to various clients – including governmental
  agencies and private companies – throughout the United
  States and India.

  We provide these services in multiple computing environments
  and use technologies such as client/server architecture,
  object-oriented programming languages and tools, distributed
  database management systems, state-of-the-art networking,
  and communications infrastructures. Our honest and realistic
  approach to recruiting dictates that AG does not entice or
  lure engineers from their employers. We represent only high
  caliber technical professionals who have committed to making
  a change required by career.

  Job Description

  PS : Please look someone with Product Development Background

  Role :

  The Predix Platform Engineering team is looking for Sr
  Software Engineer with experience building and supporting
  high-performance, scalable, and secure data services and
  associated components; strong communication skills, and a
  motivation to achieve results in a fast paced environment.

  Responsibilities

  Essential Responsibilities

  You will be accountable for building and supporting a wide
  range of data services for the Predix platform for the
  Industrial Internet.

  We are looking for smart, enthusiastic, and friendly
  technologists to design, build, support, and grow the tools
  our developers and customers use nearly every minute of
  their day. You’ll help us design and build the ecosystem of
  tools that support GE Predix Platform’s developer community.
  You will also be a critical part of that community as we
  apply the same discoveries and innovations that go into our
  software to our own systems.

  In this role, you will:

  Be responsible for providing technical leadership and
  defining, developing, and evolving software in a fast-paced
  and agile development environment using the latest software
  development technologies and infrastructure

  Provide technical leadership to an agile team of 5-7

  Work with Product Line Leaders (PLLs) to understand product
  requirements & vision

  Translate requirements / vision into prioritized list of
  user stories and deliver to required timelines and quality
  standards

  Work with product line leaders and architects to develop
  multi-generation software technology plans

  Drive increased efficiency across the teams, eliminating
  duplication, leveraging product and technology reuse

  Support process improvements which guide the development,
  sustaining & support activities

  Coach, mentor and lead the team

  Work cross functionally with other business departments to
  align activities and deliverables

  Drive world-class quality in the development and support of
  products

  Communicate effectively both within immediate team and also
  across SSG leadership team and with PLLs

  Ensure team receives consistent messages and has clear
  understanding of business direction, strategy and results

  Engage subject matter experts in successful transfer of
  complex domain knowledge

  Apply principles of SDLC and methodologies like
  Lean/Agile/XP, CI, Software and Product Security,
  Scalability, Documentation Practices, refactoring and
  Testing Techniques

  Write code that meets standards and delivers desired
  functionality using the technology selected for the project

  Understand performance parameters and assess application
  performance

  Work on core data structures and algorithms and implement
  them using technology chosen

  Proactively share information across the team, to the right
  audience with the appropriate level of detail and timeliness

  Qualifications/Requirements

  Bachelor’s Degree in Computer Science or in “STEM” Majors
  (Science, Technology, Engineering and Math) or Minimum of 8
  years of experience in building large-scale, enterprise-wide
  applications

  A minimum of 5 years of professional experience in building
  large-scale, enterprise-wide applications OR Master’s degree
  with 3 years of experience building large-scale, enterprise-
  wide applications

  Desired Characteristics

  - Strong knowledge of Object Oriented Analysis and Design,
    Software Design Patterns and Java coding principles
  - Committed to TDD methodology and XP programming techniques
  - Experience with Core Java development and Go (Golang)
  - Contributed to or maintain open source projects
  - Hands-on experience in web services (REST, SOAP, OAuth
    etc.), using Apache Commons Suite & Maven, SQL databases
    such as Oracle MySQL, PostgreSQL etc., and NoSQL databases
    such as Cassandra, Riak, Couchbase etc.
  - Hands-on experience in utilizing Spring Framework (Core,
    MVC, Integration and Data)
  - Experience stream processing engines like Storm, Spark
    Streaming etc. preferred
  - Strong understanding of data structures and algorithms.
  - Experience with Big Data / Hadoop and NoSQL databases is a
    big plus
  - Knowledge of or experience with running applications on
    Cloud Foundry
  - Knowledge of or experience with building service brokers on
    Cloud Foundry
  - Strong problem solving abilities and capable of articulating
    specific technical topics or assignments
  - Demonstrates clarity of thinking to work through limited
    information and vague problem definitions
  - Able to work under minimal supervision
  - Excellent communication skills and the ability to interface
    with senior leadership with confidence and clarity

  Additional Information

  GOOD COMMUNICATION SKILLS

  DURATION: 6-12 months

  INTERVIEW: PHONE
