description: |
  Company Description



  Job Description

  You want to work on the core of high-impact mobility
  experiences, drive topics across multiple product and
  platform areas, and shape the future architecture of a broad
  Java backend landscape? Then join us and help evolve the
  systems behind digital checkout, post-booking journeys,
  customer self-service, and the shared platform capabilities
  around them. We are building and operating business-critical
  backend services with a strong focus on scalability,
  resilience, observability, and testability. Join us in
  Pullach near Munich and help shape the future of mobility
  with us!

  YOURS TO OWN

  - You design, build, and evolve reliable and scalable backend
    services in modern Java and Spring Boot across multiple
    product areas and shared platform capabilities
  - You stay hands-on in code, lead cross-team technical
    initiatives, and drive topics from idea to production with
    clear business impact
  - You work across REST and gRPC APIs, event-driven flows,
    PostgreSQL, Redis, Kafka, Flyway, and shared platform
    libraries to deliver robust customer-facing solutions
  - You raise the bar on architecture, observability,
    performance, security, testing, and developer experience
    in a cloud-native environment with Kubernetes, CI/CD, and
    modern engineering guardrails
  - You collaborate closely with product managers and cross-
    functional team members across backend, web, and mobile,
    and you mentor engineers through strong technical
    leadership, reviews, and knowledge sharing
  - You use AI-assisted tooling pragmatically where it improves
    quality, speed, or developer experience, and you help
    define sensible engineering practices around it

  YOUR SKILLS MATTER

  - Experience You have deep experience building backend
    services with modern Java and Spring Boot, and you are
    comfortable operating at Staff level across architecture,
    implementation, and cross-team technical leadership
  - Architecture You are experienced in microservices and event-
    driven architectures, and you know how to design for
    reliability, scalability, idempotency, and long-term
    maintainability
  - Data Stores You have worked with PostgreSQL, JPA/Hibernate,
    Flyway, Redis, and Kafka, and understand how to choose the
    right persistence and messaging patterns for the problem
  - Operations You are comfortable owning services in production
    environments and improving them through observability,
    metrics, alerting, CI/CD, and Kubernetes-based operations
  - AI-Assisted Development You are comfortable using AI-
    assisted tools thoughtfully and know how to apply them in
    ways that remain reviewable, reliable, and useful in day-
    to-day engineering work
  - Curiosity You are collaborative, and product-minded, willing
    to work across the stack when needed; experience with
    React, TypeScript, micro-frontends, and end-to-end feature
    delivery is a huge plus

  WHAT WE OFFER

  - Extra benefits Enjoy discounts on SIXT rent, share, ride and
    SIXT+, attractive vehicle leasing offers, and exclusive
    deals with partners for travel, tech, fashion and more
  - Mobility boost We support you with a monthly mobility
    allowance of €20 per month for even more freedom
  - Future security We contribute to your retirement plan and
    support you with capital-forming benefits to ensure you
    are well covered
  - Feel-good atmosphere Stay active with our modern SIXT gym,
    various leisure activities like the gaming area or the
    SIXT choir, and enjoy our high-quality employee restaurant
  - Flexibility Enjoy 30 days of vacation and a hybrid working
    model with flexible hours
  - Giving back Take one day each year to volunteer at a
    charitable organization dedicated to supporting children

  Additional Information

  About us:

  We are a globally leading mobility service provider with a
  revenue of €4.3 billion and around 9,000 employees
  worldwide. Our mobility platform ONE combines our products
  SIXT rent (car rental), SIXT share (car sharing), SIXT ride
  (taxi, ride, and chauffeur services), and SIXT+ (car
  subscription), giving our customers access to our fleet of
  360,000 vehicles, the services of 4,000 cooperation
  partners, and around 5 million drivers worldwide. Together
  with our franchise partners, we are present in more than 100
  countries at 2,000 rental stations. At SIXT, top-tier
  customer experience and outstanding customer service are our
  highest priorities. We believe in true entrepreneurship and
  long-term stability and align our corporate strategy with
  foresight. Get started with us and apply now!
