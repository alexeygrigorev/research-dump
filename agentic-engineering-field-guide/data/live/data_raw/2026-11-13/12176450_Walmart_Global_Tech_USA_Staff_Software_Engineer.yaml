description: |
  Position Summary...

  What you'll do...Role summary: Join Walmart as a Staff
  Software Engineer to lead the design, development, and
  deployment of scalable platform capabilities, including
  infrastructure, tooling, and AI/ML frameworks. This role
  drives the full software lifecycle, applying cloud-native
  architecture principles to enhance system resilience and
  agility. You will provide technical leadership, mentor
  engineering teams, and collaborate across functions to
  translate complex business needs into actionable solutions.
  Emphasizing innovation and engineering excellence, you will
  influence architectural decisions and continuously improve
  processes to support Walmart’s technology goals and deliver
  impactful results.


  ***Sponsorship is NOT available in this role***


  About the team: The Sponsored Search Ad Server team develops
  the core infrastructure powering Walmart Connect’s
  advertising platform. They build large-scale distributed
  systems delivering highly relevant ads with exceptional
  performance and reliability. Engineers collaborate closely
  with product, data science, machine learning, and
  infrastructure teams to address complex challenges in
  search, retrieval, ranking, and AI-driven advertising. This
  team leads the design of mission-critical services, drives
  cross-functional technical initiatives, mentors engineers,
  and shapes the future of Walmart’s advertising technology,
  ensuring scalable, resilient, and innovative solutions
  aligned with business goals.

  What you'll do:

  - Strong experience building and maintaining large-scale data
    processing systems using Java, Apache Spark, Kafka and
    Flink.
  - Strong background developing and managing data pipelines and
    cloud native solutions within GCP environments.
  - Familiarity with vector databases and modern data
    architectures that support AI/ML applications.
  - Drive full software development lifecycle activities such as
    coding, testing, deployment, monitoring, and maintenance.
  - Apply cloud-native architecture principles to ensure
    scalable, resilient, and agile systems.
  - Conduct system design reviews to validate feasibility and
    ensure alignment with architectural best practices.
  - Build AI-driven applications and integrate ML components to
    enhance automation and intelligence.
  - Mentor engineers, influence technical decisions, and promote
    engineering excellence through continuous improvement.
  - Collaborate with stakeholders to translate complex problems
    into actionable technical requirements.


  What you'll bring:

  - Proven expertise in cloud-native architecture, including
    microservices, containers, and automation to ensure
    scalable and resilient systems.
  - Strong proficiency in software design patterns, API design,
    and platform development to deliver maintainable and
    modular solutions.
  - Experience leading full software development lifecycle
    activities, including coding, testing, CI/CD deployment,
    and observability.
  - Ability to analyze complex problems and apply data-driven
    decision-making to optimize engineering outcomes.
  - Skilled in mentoring and providing technical leadership to
    foster team growth and uphold engineering excellence.
  - Demonstrated adaptability to evolving technologies and
    collaborative cross-team communication skills.


  At Walmart, we offer competitive pay as well as performance-
  based bonus awards and other great benefits for a happier
  mind, body, and wallet. Health benefits include medical,
  vision and dental coverage. Financial benefits include
  401(k), stock purchase and company-paid life insurance. Paid
  time off benefits include PTO (including sick leave),
  parental leave, family care leave, bereavement, jury duty,
  and voting. Other benefits include short-term and long-term
  disability, company discounts, Military Leave Pay, adoption
  and surrogacy expense reimbursement, and more.

  You will also receive PTO and/or PPTO that can be used for
  vacation, sick leave, holidays, or other purposes. The
  amount you receive depends on your job classification and
  length of employment. It will meet or exceed the
  requirements of paid sick leave laws, where applicable.

  For information about PTO, see
  https://one.walmart.com/notices.

  Live Better U is a Walmart-paid education benefit program
  for full-time and part-time associates in Walmart and Sam's
  Club facilities. Programs range from high school completion
  to bachelor's degrees, including English Language Learning
  and short-form certificates. Tuition, books, and fees are
  completely paid for by Walmart.

  Eligibility requirements apply to some benefits and may
  depend on your job classification and length of employment.
  Benefits are subject to change and may be subject to a
  specific plan or program terms.

  For information about benefits and eligibility, see
  One.Walmart.

