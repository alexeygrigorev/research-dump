description: |
  Job Description:

  Join a high-impact software team focused entirely on
  delivering internal software tools to help other teams at
  Shield AI. The engineer in this role will help create,
  manage, deploy, and maintain new full-stack internal
  software tools. This role offers a unique opportunity to
  work with many different teams at Shield AI on a variety of
  different projects. Internal tools range from things as
  complex as physics analysis of the aircraft to things as
  simple as a system for tracking tickets. A successful
  engineer in this role would excel at gathering requirements
  for the tool, pushing back on bad requirements, and
  implementing a robust full-stack solution to deliver the
  best value to the team in need. This role offers high
  visibility projects that can change the workflows of entire
  teams for the better.

  What you'll do:

  - Collaborate with other teams at Shield AI to hone tool
    requirements
  - Architect a robust full-stack solution to meet the team's
    needs
  - Deploy the tool internally for potentially wide reaching
    benefits
  - Maintain an existing suite of internal tooling

  Required qualifications:

  - Bachelor’s Degree in Computer Science
  - Strong communication skills
  - Familiarity with SQL
  - Experience using frontend frameworks
  - Experience coding in Rust or C/C++

  Preferred qualifications:

  - Experience making a full-stack web app
  - React framework experience
  - Rust language experience
  - Microsoft SQL server experience
  - Linux Proficiency

