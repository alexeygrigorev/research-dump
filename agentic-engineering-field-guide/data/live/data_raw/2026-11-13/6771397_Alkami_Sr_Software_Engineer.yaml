description: |
  Alkami is a leading cloud-based digital banking solutions
  provider for financial institutions in the United States
  that helps clients to transform through retail and business
  banking, digital account opening and loan origination,
  payment fraud prevention, and data analytics and engagement
  solutions. Alkami’s Mobile App Platform has been certified
  by J.D. Power for providing clients with “An Outstanding
  Mobile Banking Platform Experience.”

  Founded in 2009, we continue to be recognized for our
  intentional culture and tremendous growth (Best Place to
  Work in Fintech; Best & Brightest to Work For Nationally;
  and Comparably’s Best Company Culture, Best Career Growth,
  Best Engineering Team, and Best Places to Work in Dallas,
  among others). Through our bold investments in technology
  and people, we empower our clients to grow confidently,
  adapt quickly, and build thriving digital banking
  communities through tailored experiences for over 19.5M
  users.

  As a remote-first company, most of our positions can be
  remote in the US, except for key roles, which will be
  indicated in the Job Title.

  Follow us on Glassdoor and Linkedin!

  Technically enhance the process of getting new clients to
  production within our Activations squad, which includes
  integrating with the Clients’ core provider API. Enhancing
  third party integrations such as, Check Book ordering, ACH
  Transfers, and improving product services. You will also
  work with the clients to discover nuances to their online
  account opening process and partner with our product team to
  account for those nuances in our system.

  About You:

  ● You love writing clean, thoroughly documented, and well-
  tested code, with an eye for long term viability and
  performance. ● You measure twice and code once when writing
  features, placing an emphasis on error-handling, logging,
  and edge cases for every service you write. ● You enjoy the
  challenge of breaking down complex product asks into elegant
  solutions. ● You are comfortable with system design, and not
  only have architectural opinions but are comfortable
  writing, speaking, and advocating for them. ● You approach
  architectural challenges not with answers but with
  questions, and from those questions decide upon the best
  approach, knowing that there is no best solution, only
  different sets of tradeoffs to be made.

  ● You enjoy providing technical guidance, suggestions, and
  code reviews for your teammates, using your knowledge to
  raise the bar of their work as well.

  We Are Looking For:

  ● 3+ years of professional experience writing backend
  services & APIs ● Good understanding of Computer Science
  fundamentals / data structures / algorithms ● Experience
  with NodeJS ● Well versed with REST APIs ● Well versed with
  microservice architectures

  ● Good technical and communication skills —- with the
  ability to self manage, estimate

  The salary range for this position is: $128,857 -
  $193,286Cool Things to Know

