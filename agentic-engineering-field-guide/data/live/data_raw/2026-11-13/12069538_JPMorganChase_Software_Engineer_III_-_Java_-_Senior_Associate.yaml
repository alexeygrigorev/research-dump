description: |
  We have an exciting and rewarding opportunity for you to
  take your software engineering career to the next level.  As
  a Software Engineer III at JPMorgan Chase within the
  Commercial & Investment Bank's Payments Technology group,
  you play a vital role in an agile team dedicated to
  enhancing, building, and delivering reliable, market-leading
  technology products with a focus on security, stability, and
  scalability. As a key technical contributor, you are tasked
  with implementing essential technology solutions across
  diverse technical domains, supporting various business
  functions to achieve the firm's strategic goals

  Job responsibilities

  - Executes software solutions, design, development, and
    technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    breakdown technical problems
  - Creates secure and high-quality production code and
    maintains algorithms that run synchronously with
    appropriate systems
  - Leverages enterprise-authorized AI coding assist tools
    within the work environment to improve code quality,
    delivery speed, and productivity across complex
    deliverables (e.g., code generation/refactoring, unit test
    creation, documentation), while validating outputs through
    peer review, automated testing, and secure coding
    standards; contributes learnings and reusable patterns to
    improve broader team effectiveness.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.
  - Produces architecture and design artifacts for complex
    applications while being accountable for ensuring design
    constraints are met by software code development
  - Gathers, analyzes, synthesizes, and develops visualizations
    and reporting from large, diverse data sets in service of
    continuous improvement of software applications and
    systems
  - Proactively identifies hidden problems and patterns in data
    and uses these insights to drive improvements to coding
    hygiene and system architecture



  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and advanced applied experience in Java on Spring
    Boot programming language
  - Hands-on practical experience in system design, application
    development, testing, and operational stability
  - Proficiency in automation and continuous delivery methods
  - Proficient in all aspects of the Software Development Life
    Cycle, software engineering principles, design patterns,
    and best practices
  - Advanced understanding of agile methodologies such as CI/CD,
    Application Resiliency, and Security
  - Demonstrated proficiency in software applications and
    technical processes within a technical discipline (e.g.,
    cloud, artificial intelligence, machine learning, mobile,
    etc.)
  - Hands on experience working with high throughput, low
    latency distributed systems ensuring efficient
    communication and integration between different systems
  - Proven record of providing end-user support with excellent
    problem-solving abilities
  - Demonstrated experience leading effective use of enterprise-
    authorized AI-assisted software development tools within
    the work environment (e.g., for coding, code review, test
    acceleration, troubleshooting) with the ability to set
    team expectations for validating AI outputs for
    correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    senior engineers/leads on compliant usage patterns and
    controls.



  Preferred qualifications, capabilities, and skills

  - Advanced knowledge in reactive programming technology
  - Knowledge of On-prem and/or public cloud
  - Knowledge in Cockroach or Cassandra / distributed database

