description: |
  About Us:

  OptionMetrics, headquartered in New York, NY. is a dynamic
  and innovative technology company, a trusted provider of
  financial information and research derived from the option
  markets. We are at the forefront of developing solutions
  that empower businesses. Our commitment to excellence,
  coupled with a collaborative, forward-thinking culture, has
  made us the preferred choice for top-tier talent. Our data
  and analytics models are utilized by over 350 investment
  banks, hedge funds, asset management firms, and academic
  institutions globally, solidifying our position as a leader
  in the industry.

  OptionMetrics is seeking a highly skilled Software Test
  Engineer to join our Software QA team, with a focus on
  designing, implementing, and maintaining robust test
  frameworks for the back-end services that power our data and
  analytics products. In this role, you’ll take a proactive
  approach to identifying issues, writing and automating
  comprehensive test cases, and partnering cross-functionally
  with Engineering, Product Management, and Project teams to
  ensure product quality from initial concept to final
  release. We’re looking for someone who brings both technical
  depth and strategic insight to our QA process—someone who
  thrives in a collaborative environment and takes full
  ownership of their work. This role offers the opportunity to
  make a meaningful impact on the quality of our platform,
  with a culture that prioritizes autonomy, initiative, and
  accountability over micromanagement.



  Note: This is a full-time, fully remote contract position,
  with the team operating on Eastern Time hours. We’re looking
  for someone who is comfortable working in a distributed
  environment, able to stay engaged and communicative across
  teams, and proactive in managing their day-to-day
  responsibilities. While the role is remote, collaboration
  remains a key part of the position, with regular interaction
  across engineering, product, and QA teams.

  The Software Test Engineer Will:

  - Love working with back end services and large data sets.
  - Possess strong analytical, problem-solving, and creative
    thinking skills.
  - Excel in test case design and documenting test
    descriptions/test plans.
  - Enjoy figuring out what should be tested, creating the test,
    and implementing it. You're someone who can diagnose a
    potential bug before it occurs and isolate existing bugs.
  - Possess knowledge of and experience with Java, SQL, and
    Python. Experience with AWS data tools (S3, Redshift, RDS,
    and EMR) is a plus.
  - Have a strong commitment to technical quality assurance as a
    key part of the development lifecycle.
  - Implement automated tests and perform functional and
    regression testing.
  - Be dynamic and prepared to test/regress a high volume of
    changes daily.
  - Enjoy the challenge of researching issues to maintain
    quality in our large data sets.
  - Gain an understanding of the complex math associated with
    options.
  - Bachelor’s degree in Computer Science, Software Engineering,
    Information Systems, or a related technical field is
    strongly preferred. Candidates with equivalent practical
    experience in software testing, quality assurance, or test
    automation within backend systems are also encouraged to
    apply.

  OptionMetrics is an equal opportunity employer. All
  qualified applicants will receive consideration for
  employment without regard to sex, gender identity, sexual
  orientation, race, color, religion, national origin,
  disability, protected Veteran status, age, or any other
  characteristic protected by law. Further, OptionMetrics will
  not discriminate against applicants for inquiring about,
  discussing or disclosing their pay or, in certain
  circumstances, the pay of their co‐worker, Pay Transparency
  Nondiscrimination .

  If you need a reasonable accommodation for any part of the
  employment process, please contact us by email and let us
  know the nature of your request and your contact
  information. Requests for accommodation will be considered
  on a case-by-case basis. Please note that only inquiries
  concerning a request for reasonable accommodation will be
  responded to from this email address.
