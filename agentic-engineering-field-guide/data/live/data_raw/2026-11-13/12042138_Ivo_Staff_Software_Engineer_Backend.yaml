description: |
  Why Join Ivo?

  Contracts are the oldest business technology in human
  history. They allow us to collaborate: they define what we
  promise each other, how we work together, and what happens
  when things go wrong.  Ivo builds AI products that helps
  companies like Meta, Uber, IBM, Intel, DoorDash, Mitsubishi
  Electric, and Coinbase solve their most difficult
  contracting problems. We think that large language models
  have created an opportunity to fundamentally change how
  businesses collaborate with each other. At Ivo you will work
  on challenging problems with colleagues who have high
  standards for each other, move fast, and care deeply about
  their craft.

  Role: Staff Backend Engineer

  Our software solves all these problems (and more) at scale,
  and our Backend Engineers make it possible.

  Engineering at Ivo

  Engineers at Ivo are inventors. Ivo was first-to-market
  with:

  - An AI agent that lives in MS word and edits the document for
    you [2023]
  - Ditching imprecise embeddings models in favor of agentic RAG
    [2023]
  - Large-scale LLM-based legal fact extraction [2024]
  - A legal assistant that can search large contract databases,
    without sacrificing accuracy [2024]
  - Clustering legal documents descended from the same family
    [2025]
  - Automatic deviation analysis to locate buried risk in huge
    contract databases [2025]
  - Merging contracts with their amendments to make a time
    series of “composite” contracts (a customer actually cried
    when we showed her this) [2025]

  You’ll work on:

  - Building systems that process and analyze millions of
    contracts reliably
  - Designing pipelines that orchestrate LLMs, data extraction,
    and clustering algorithms at scale
  - Creating the most accurate search and retrieval systems on
    the market
  - Collaborating with lawyers and product to build the newly
    possible when LLMs change every few months

  Ivo might be a good fit for you if you:

  - You love writing code, but you love having impact more:
    We’re a team of engineers at heart, but our #1 goal is
    building the best possible product. That means making
    pragmatic choices and looking for 80/20 solutions.
  - Would describe yourself as being relentlessly resourceful.
  - You have a strong internal sense of urgency. You have a bias
    towards doing things *today*, rather than tomorrow.
  - Experience working in a startup environment is preferred but
    not required.
  - Are excited about the adventure of building a company!

  What We Offer

  - Competitive Compensation: Final offer details are determined
    based on experience, expertise, and overall fit.
  - Equity: Meaningful ownership in a company that's scaling
    fast
  - Relocation and Visa Support: We also offer relocation
    assistance for successful applicants moving to SF, as well
    as support for visa and green card applications where
    applicable.
  - Health & Wellness: Comprehensive medical, dental, and vision
    plans to suit the needs of you and your family.
  - Flexible Spending & Insurance: Access to HSA and FSA
    accounts, plus life insurance coverage.
  - 401(k) Program: Save for the future with our 401(k) program.
  - Commuter Benefits: We help make getting to and from the
    office easier and more convenient.
  - Unlimited PTO: So you can take the time you need to
    recharge, stay healthy, and bring your best self to work.
  - Office Perks: Enjoy a vibrant Downtown San Francisco office
    with catered lunch five days a week, premium snacks and
    coffee, an in-building gym, and a dog-friendly
    environment.

  FAQ

  - What stage of growth is Ivo at?: We recently raised our
    Series B after growing 6x in 12 months.
  - Is this a chill gig?: Startups are very hard, especially if
    they’re growing fast. You’ll have a ton of responsibility,
    and there’s always an enormous amount of stuff to do. It’s
    hard work but the payoff is uncapped.

  Ivo is an equal opportunity employer. We celebrate diversity
  and are committed to creating an inclusive environment for
  all employees.
