description: |
  Opportunity Overview:

  We are seeking a Senior Manager, Data Platform Engineering
  to lead a critical part of Cohere Health’s Data Platform
  team as we continue scaling our technology, engineering
  practices, and client delivery capabilities.This role
  combines people leadership, technical judgment, and strong
  execution ownership to build a high-performing engineering
  team and drive predictable delivery, technical excellence,
  and operational reliability across complex data initiatives.
  You’ll partner closely with Product, Engineering,
  Architecture, Client Delivery, and business stakeholders to
  build a scalable, trusted data foundation that supports
  Cohere’s continued growth.

  What you’ll do:

  - Lead, coach, and develop a high-performing Data Platform
    engineering team through clear expectations, regular
    feedback, career development, performance management, and
    strong engineering leadership.
  - Own execution across complex data initiatives, translating
    priorities into credible delivery plans with clear scope,
    milestones, owners, dependencies, capacity assumptions,
    risks, decisions, and target dates. Maintain
    accountability through delivery and proactively adjust
    plans when scope, capacity, dependencies, or technical
    complexity change.
  - Establish strong delivery discipline by ensuring work is
    sufficiently defined, technically understood, estimated,
    sequenced, and ready before commitment; proactively
    address blockers, dependencies, scope changes, and
    capacity constraints, with clear mitigation and early
    escalation when commitments are at risk.
  - Maintain sufficient technical depth to independently assess
    delivery and implementation risk, while partnering closely
    with Staff Engineers and other technical leaders to
    validate architecture, implementation approaches,
    estimates, technical readiness, root causes, and quality
    before key decisions or commitments are made.
  - Build trusted cross-functional partnerships across Product,
    Client Delivery, Engineering, Architecture, Operations,
    and other stakeholders to align priorities, resolve
    tradeoffs, and communicate clear, fact-based status and
    decisions.
  - Drive operational excellence across production support, on-
    call readiness, incident management, data quality,
    observability, and reliability, while maintaining strong
    operating discipline across capacity planning, backup
    coverage, escalation paths, action tracking, and follow-
    through.
  - Guide the continued evolution of Cohere’s data platform,
    including scalable data ingestion, transformation,
    lakehouse and cloud architecture, governance, and reusable
    platform capabilities that support downstream
    applications, analytics, and business needs.

  What you’ll need:

  - 8+ years of experience in data engineering, platform
    engineering, software engineering, or a related technical
    field, including 3 years of directly managing software or
    data engineers or as a Lead/Staff level Data Engineer in a
    production engineering environment.
  - Demonstrated success building, coaching, and managing high-
    performing engineering teams, including setting
    expectations, developing talent, managing performance, and
    creating accountability for outcomes.
  - Proven ability to lead complex, cross-functional engineering
    initiatives from planning through production, with strong
    delivery discipline, dependency management, risk
    mitigation, accountability, and a demonstrated track
    record of improving predictability.
  - Proven ability to lead complex, cross-functional engineering
    initiatives from planning through production, with strong
    delivery discipline, dependency management, risk
    mitigation, accountability, and a demonstrated track
    record of improving predictability.
  - Strong technical depth in modern data platforms, including
    data ingestion, ETL/ELT, distributed data processing, data
    modeling, cloud-based data architectures, and production
    data systems.
  - Experience with modern cloud and data technologies such as
    AWS, S3, Iceberg, Glue, Airflow, Spark/PySpark, Athena, or
    comparable technologies.
  - Strong understanding of engineering quality and operational
    practices, including testing, data quality, observability,
    incident management, on-call operations, version control,
    CI/CD, and production reliability.
  - Excellent written and verbal communication skills, with the
    ability to provide concise, accurate updates to senior
    leadership and navigate priorities, tradeoffs, risks, and
    decisions across technical and non-technical stakeholders.

  Nice-to-haves

  - Experience building or operating enterprise-scale data
    lakehouse, data platform, or data infrastructure
    capabilities.
  - Experience working with healthcare data, including claims,
    eligibility, clinical, provider, or other healthcare
    datasets.
  - Familiarity with data governance, metadata management, data
    cataloging, security, privacy, and regulated data
    environments.
  - Demonstrated success helping an engineering team mature its
    delivery practices, technical standards, operational
    discipline, or platform capabilities during a period of
    significant growth.

  Pay & Perks:

  💻 Fully remote opportunity with about 5% travel

  🩺 Medical, dental, vision, life, disability insurance, and
  Employee Assistance Program

  📈 401K retirement plan with company match; flexible spending
  and health savings account

  🏝️ Flexible Time Off + Company Holidays

  👶 Up to 14 weeks of paid parental leave

  🐶 Pet insurance 

  The salary range for this position is $175,000 to $195,000
  annually; as part of a total benefits package which includes
  health insurance, 401k and bonus. In accordance with state
  applicable laws, Cohere is required to provide a reasonable
  estimate of the compensation range for this role. Individual
  pay decisions are ultimately based on a number of factors,
  including but not limited to qualifications for the role,
  experience level, skillset, and internal alignment.

  Interview Process*:

  - Connect with Talent Acquisition for a Preliminary Phone
    Screening
  - Meet your Hiring Manager!
  - Live System Design & Project Retro
  - Behavioral Interview(s)

  *Subject to change

  About Cohere Health:

  Cohere Health is a fast-growing clinical intelligence
  company that’s improving lives at scale by promoting the
  best patient-specific care options, using cutting-edge AI
  combined with deep clinical expertise. In only four years
  our solutions have been adopted by health plans covering
  over 15 million lives, while our revenues and company size
  have quadrupled.  That growth combined with capital raises
  totaling $106M positions us extremely well for continued
  success. Our awards include: 2023 and 2024 BuiltIn Best
  Place to Work; Top 5 LinkedIn™ Startup; TripleTree iAward;
  multiple KLAS Research Points of Light awards, along with
  recognition on Fierce Healthcare's Fierce 15 and CB
  Insights' Digital Health 150 lists.

  The Coherenauts, as we call ourselves, who succeed here are
  empathetic teammates who are candid, kind, caring, and
  embody our core values and principles. We believe that
  diverse, inclusive teams make the most impactful work.
  Cohere is deeply invested in ensuring that we have a
  supportive, growth-oriented environment that works for
  everyone.

  We can’t wait to learn more about you and meet you at Cohere
  Health!

  Equal Opportunity Statement:

  Cohere Health is an Equal Opportunity Employer. We are
  committed to fostering an environment of mutual respect
  where equal employment opportunities are available to all.
  To us, it’s personal.

