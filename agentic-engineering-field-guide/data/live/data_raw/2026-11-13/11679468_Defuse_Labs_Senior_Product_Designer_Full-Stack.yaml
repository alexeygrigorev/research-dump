description: |
  About Defuse Labs

  Defuse Labs builds NEAR Intents, the universal transaction
  layer for the AI economy — intent-based infrastructure that
  enables people, agents, and applications to move value
  across chains and assets without bridges, fragmented
  liquidity, or manual routing.

  At the center of our product ecosystem is near.com.

  near.com is building a permissionless financial account: one
  place to hold, grow, invest, trade and use assets across
  blockchains, with privacy and control at its core. Our
  ambition is to make sophisticated financial capabilities
  feel like parts of one coherent product, increasingly
  accessible through conversation and trusted agents.

  Our initial customers are comfortable with crypto and value
  their time, privacy and independence. They want access to
  what financial technology makes possible without having to
  manage its complexity.

  We also build NEAR Intents, the universal transaction layer
  for the AI economy — intent-based infrastructure that
  enables people, agents, and applications to move value
  across chains and assets without bridges, fragmented
  liquidity, or manual routing. Instead of specifying a
  transaction path, users simply express what they want to
  achieve, and a competitive network of solvers fulfills the
  intent with competitive execution across available
  liquidity.

  We operate in startup mode: high ownership, fast execution,
  and high standards. We’re a small, globally distributed team
  that moves quickly, takes initiative, and adapts as the
  product and market evolve.

  Responsibilities

  - Own the end-to-end design process across near.com, from
    discovery and product definition to interaction design,
    visual design, prototyping, and delivery.
  - Turn complex financial and cross-chain functionality into
    clear, intuitive, and trustworthy user experiences.
  - Design user journeys, information architecture, flows,
    wireframes, prototypes, and production-ready interfaces
    for web and mobile experiences.
  - Help shape how users interact with conversational interfaces
    and AI-powered financial agents.
  - Conduct user research, test assumptions, analyze product
    behavior, and use insights to improve the experience.
  - Build and evolve a scalable design system that supports a
    consistent experience across the product.
  - Contribute to product strategy and challenge requirements
    when a simpler or more effective solution is possible.
  - Work closely with Product, Engineering, and Growth to define
    problems, explore solutions, and bring new features to
    market.
  - Help users understand what near.com makes possible and why
    it matters through thoughtful UX, product language, and
    visual communication.

  Requirements

  - 7+ years of experience designing and shipping complex
    digital products, ideally within fintech, crypto, or
    consumer finance.
  - A strong portfolio demonstrating end-to-end product
    ownership, excellent interaction and visual design, and
    measurable product impact.
  - Proven ability to simplify complex systems and technical
    concepts into intuitive, trustworthy user experiences.
  - Strong proficiency in Figma, prototyping, and design
    systems, with experience partnering closely with Product
    and Engineering teams.
  - High level of ownership, sound product judgment, and
    familiarity with blockchain products, wallets, trading,
    DeFi, or cross-chain applications.

  Nice to Have

  - Experience designing financial dashboards, wallets, trading
    products, portfolio tools, or AI-powered interfaces.
  - Knowledge of blockchain concepts such as signing, bridging,
    swaps, gas, permissions, and transaction states.
  - Experience with user research, product analytics,
    experimentation, or conversion optimization.
  - Ability to create high-fidelity interactive prototypes.
  - Familiarity with front-end technologies such as HTML, CSS,
    React, or design-to-code workflows.
  - Experience establishing or scaling a design system in an
    early-stage product.

