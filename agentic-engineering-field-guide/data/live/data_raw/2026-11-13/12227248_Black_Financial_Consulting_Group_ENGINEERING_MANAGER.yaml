description: |
  This is a remote position.



   The Engineering Manager is responsible for leading
  engineering teams, driving technical execution, and ensuring
  the successful delivery of high-quality software solutions.
  This role combines people leadership, technical oversight,
  and project delivery, working closely with Product Managers,
  Technical Leads, Architects, and stakeholders to build
  scalable, secure, and reliable products.


   Key Responsibilities


  - Lead and manage cross-functional engineering teams across
    multiple product initiatives.
  - Drive the planning, execution, and delivery of software
    development projects.
  - Collaborate with Product Managers and Technical Leads to
    define technical roadmaps and delivery plans.
  - Coach, mentor, and develop engineers through regular
    feedback and performance management.
  - Establish engineering standards, development best practices,
    and quality assurance processes.
  - Monitor project progress, identify delivery risks, and
    implement mitigation strategies.
  - Ensure scalable architecture, code quality, security, and
    operational excellence across engineering teams.
  - Support recruitment, onboarding, and capability development
    of engineering talent.
  - Foster a culture of collaboration, innovation,
    accountability, and continuous improvement.
  - Engage with clients and internal stakeholders to provide
    technical leadership and project updates.

   Required Qualifications


  - 9+ years of software engineering experience, with at least 5
    years in an engineering leadership or management role.
  - Proven experience leading distributed engineering teams in
    Agile environments.
  - Strong background in enterprise software, fintech, or
    digital product development.
  - Demonstrated success delivering complex software projects
    from concept to production.
  - Excellent leadership, communication, stakeholder management,
    and decision-making skills.
  - Experience managing remote, cross-functional engineering
    teams.

   Technical Skills


  - Software Architecture & System Design
  - Cloud Platforms (AWS, Azure, or GCP)
  - REST APIs & Microservices
  - CI/CD & DevOps Practices
  - Agile/Scrum Delivery
  - Engineering Performance Metrics
  - Technical Risk Management
  - Team Leadership & Coaching
