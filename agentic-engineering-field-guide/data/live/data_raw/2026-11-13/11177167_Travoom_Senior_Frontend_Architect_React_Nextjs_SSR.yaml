description: |
  Company Description

  Who We Are

  Travoom is currently paused as we focus entirely on building
  OleOle — a football-focused social network, messaging
  platform, and sports super app designed for the world’s
  biggest sport.

  At the same time, oleolesport.com continues to operate as
  our curated football travel and hospitality marketplace,
  offering premium fan experiences around the biggest matches
  and tournaments in the world.

  Both platforms are strategically connected: • OleOle is the
  fan engagement, social, messaging, and content platform •
  oleolesport.com is the commerce and travel experiences
  platform

  Together, they are designed to create a complete football
  ecosystem for fans globally.

  What We’re Building

  OleOle is building a next-generation football platform
  combining: • Social networking and microblogging • Messaging
  and mobile calls • TikTok-style short-form video • Live
  scores and match experiences • AI-powered football history
  and statistics • Real-time global fan engagement

  We believe football deserves its own dedicated platform —
  not a small section buried inside general-purpose social
  networks.

  Football is the world’s biggest sport with more than 3
  billion fans globally, yet no company has successfully built
  a true digital home for football supporters.

  OleOle is designed to become that platform.

  Why It Matters

  Football fandom is global, emotional, tribal, and active
  every day of the year.

  Yet today, the fan experience remains fragmented across
  disconnected social platforms, messaging apps, score apps,
  news sites, ticketing sites, and travel providers.

  Fans move constantly between products that were never built
  specifically for football culture or football communities.

  We believe supporters are looking for a place to truly “kick
  off” — a platform designed around how football fans actually
  communicate, follow matches, consume content, travel, and
  engage with their clubs and national teams.

  Why We’re Different

  oleolesport.com removes the complexity from planning
  football travel experiences by combining curated ticketing,
  hospitality, lodging, and travel experiences into one
  streamlined platform.

  OleOle extends that vision much further — creating a
  football-first platform built specifically around fan
  identity, conversation, live interaction, creator content,
  and global football culture.

  This is not another generic sports app.

  We are building a dedicated football ecosystem that combines
  social networking, messaging, content, live experiences, and
  commerce into a single connected platform.

  OleOle – Where Fans Kick Off

  Job Description

  Senior Front-End Engineer Real-Time Consumer Platform •
  Social • Video • Messaging • Live Sports

  Job Description Summary

  OleOle is building a football-focused social network and
  super app designed for the world’s 3 billion football fans.

  The platform combines: • Real-time social feeds and
  microblogging • TikTok-style short-form video • Live scores
  and match experiences • Messaging and mobile calls • AI-
  powered translation and football history • Rewards,
  commerce, and future crypto-enabled infrastructure

  We are looking for a Senior Front-End Engineer to help
  architect and build core user-facing experiences across web
  and mobile platforms.

  This is not a ticket-driven implementation role.

  We are looking for engineers who can take ownership of major
  frontend systems, make strong architectural decisions, and
  help shape the long-term direction of the platform.

  You will work closely with backend engineers, product
  leadership, and design teams to build high-performance,
  real-time consumer experiences used by football fans
  globally.

  Core Areas You May Own

  • Social feeds and microblogging experiences • Real-time
  messaging and notification systems • TikTok-style video
  interfaces and engagement flows • Live score and match
  interaction experiences • Football history and SEO-driven
  content systems • Shared component systems and frontend
  infrastructure • Real-time data rendering and state
  management • Mobile-first responsive experiences across web
  and native applications

  What You’ll Be Responsible For

  • Architecting scalable frontend systems across web and
  mobile • Building reusable, maintainable UI components and
  frontend infrastructure • Developing high-performance real-
  time user experiences • Collaborating closely with backend
  engineers on APIs, event systems, and real-time workflows •
  Optimizing rendering performance, responsiveness, and
  frontend scalability • Contributing to frontend
  architecture, standards, and engineering direction • Helping
  establish long-term frontend engineering culture and
  technical quality

  What We’re Looking For

  • 7–12+ years of frontend or full-stack engineering
  experience • Strong experience building complex consumer-
  facing products at scale • Deep understanding of modern
  frontend architecture and performance optimization • Strong
  experience with React, Next.js, TypeScript, and modern
  frontend tooling • Experience building real-time
  applications, feeds, messaging systems, or high-engagement
  products • Strong understanding of responsive design,
  frontend state management, and rendering performance •
  Experience collaborating closely with product, design, and
  backend engineering teams • Ability to operate independently
  with high ownership and minimal hand-holding • Strong
  engineering judgment and ability to balance speed with long-
  term maintainability

  Nice to Have

  • Experience with SSR and SEO-focused frontend architecture
  • Experience building video-heavy or media-rich products •
  Experience with WebSockets, streaming, or event-driven
  systems • Experience working alongside Rust backend
  infrastructure • Experience with AI-driven consumer
  experiences • Startup experience building products from zero
  to one • Passion for football, sports media, or global fan
  communities

  What Makes Someone Successful in This Role

  • You have personally built and operated production frontend
  systems • You care deeply about performance, usability, and
  user experience quality • You can explain technical
  decisions and tradeoffs clearly • You understand how
  consumer products scale technically and operationally • You
  focus on practical engineering over unnecessary complexity •
  You are comfortable working in ambiguous, fast-moving
  startup environments • You value ownership, simplicity, and
  execution

  We value real-world product experience, technical depth, and
  ownership significantly more than keyword-heavy resumes.

