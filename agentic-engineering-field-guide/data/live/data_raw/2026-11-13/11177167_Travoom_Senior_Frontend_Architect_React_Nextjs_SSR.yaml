  Compensation & Structure



  This role is currently structured as deferred compensation.



  All current team members — including leadership, engineers,
  designers, and product teams — are currently working under
  the same structure while the company secures new funding.



  This is not unpaid work.



  Compensation is intended to convert into a normalized salary
  structure post-funding, in addition to: • Founding-level
  equity ownership • Long-term token participation •
  Significant influence over product and technical direction



  We want to be fully transparent: • There is real startup
  risk • Fundraising timelines are unpredictable • Building at
  this stage requires resilience, ownership, and long-term
  thinking



  At the same time, this role provides the opportunity to help
  build a globally ambitious consumer platform from the
  earliest stages with meaningful ownership and long-term
  upside.



