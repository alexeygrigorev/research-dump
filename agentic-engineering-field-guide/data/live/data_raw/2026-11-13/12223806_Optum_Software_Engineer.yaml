description: |
  Requisition Number: 2391258 Our Company Optum is a global
  organization that delivers care, aided by technology to help
  millions of people live healthier lives. The work you do
  with our team will directly improve health outcomes by
  connecting people with the care, pharmacy benefits, and data
  they need to feel their best. Here, you will find a culture
  guided by diversity and inclusion, talented peers,
  comprehensive benefits, and career development
  opportunities. Come make an impact on the communities we
  serve as you help us advance health equity on a global
  scale. Join us to start Caring. Connecting. Growing
  together. Position Summary As a Software Engineer within
  Optum Technology supporting UnitedHealthcare Technology
  initiatives, you will design, develop, test, and maintain
  robust software applications and services that modernize
  healthcare delivery. You will work within an innovative,
  collaborative engineering culture, building scalable REST
  APIs, dynamic user interfaces, and resilient backend
  services that power critical healthcare solutions. In this
  role, you will partner closely with cross-functional teams
  to solve complex problems, enhance application performance,
  and deliver high-quality technology that improves outcomes
  for millions of members and providers. You'll enjoy the
  flexibility to telecommute* from anywhere within the U.S. as
  you take on some tough challenges. Primary Responsibilities

  - Design, develop, test, and maintain scalable software
    applications, REST APIs, user interfaces, and backend
    services across the full software development lifecycle
  - Collaborate with Product Owners, Business Analysts, QA
    analysts, and engineers within an Agile environment to
    deliver new features, enhancements, and defect fixes
  - Participate in technical design discussions, evaluate
    architectural trade-offs, and contribute innovative ideas
    to improve system functionality and performance
  - Write clean, maintainable, and well-documented code adhering
    to enterprise development standards and secure coding
    practices
  - Conduct and participate in peer code reviews, incorporating
    constructive feedback from colleagues and technical
    leaders
  - Troubleshoot and resolve production incidents, implement
    resilient fixes, and assist with automated testing,
    release activities, and production support
  - Identify opportunities to optimize application performance,
    reliability, and maintainability while sharing knowledge
    and mentoring junior team members
  - Design, develop, and deploy AI-powered solutions to address
    complex business challenges with emphasis on responsible
    use of AI

  You'll be rewarded and recognized for your performance in an
  environment that will challenge you and give you clear
  direction on what it takes to succeed in your role as well
  as provide development for other roles you may be interested
  in.  Required Qualifications

  - 3+ years of software engineering experience in full-stack
    web application development using JavaScript and Node.js.
  - 3+ years of Experience developing backend services with
    Python
  - 3+ years of experience designing, building, and integrating
    RESTful APIs and microservices
  - 2+ years of experience with CI/CD tools, automated testing
    frameworks, and modern build pipelines
  - 1+ years of professional experience do you have using Git
  - 1+ years of experience with MongoDB or another NoSQL
    database technology
  - 1+ years of experience with Kafka or another similar message
    queue/event streaming technology (RabbitMQ, etc.)

  Preferred Qualifications

  - Bachelor's degree in Computer Science, Information
    Technology, Software Engineering, or related field, or
    equivalent practical experience (such as 2+ years of
    professional software engineering experience in lieu of a
    degree)
  - 1+ years of experience working with cloud platforms such as
    Azure, AWS, or Google Cloud Platform
  - 1+ years of professional software development experience
    designing, developing, and supporting enterprise-grade
    applications
  - Experience building responsive web applications using React
    and TypeScript
  - Exposure to cloud platforms (e.g., Azure, AWS), CI/CD
    deployment pipelines, and automated testing frameworks
  - Prior experience working within healthcare, health
    insurance, or other highly regulated industries
  - Interest in mentoring and supporting the technical growth of
    fellow engineers
  - Strong analytical, problem-solving, and written and verbal
    communication skills

  *All Telecommuters will be required to adhere to
  UnitedHealth Group's Telecommuter Policy.  Pay is based on
  several factors including but not limited to local labor
  markets, education, work experience, certifications, etc. In
  addition to your salary, we offer benefits such as, a
  comprehensive benefits package, incentive and recognition
  programs, equity stock purchase and 401k contribution (all
  benefits are subject to eligibility requirements). No matter
  where or when you begin a career with us, you'll find a far-
  reaching choice of benefits and incentives. The salary for
  this role will range from $72,800 to $130,000 annually based
  on full-time employment. We comply with all minimum wage
  laws as applicable. Pursuant to the San Francisco Fair
  Chance Ordinance, we will consider for employment qualified
  applicants with arrest and conviction records. Application
  Deadline: This will be posted for a minimum of 2 business
  days or until a sufficient candidate pool has been
  collected. Job posting may come down early due to volume of
  applicants. At UnitedHealth Group, our mission is to help
  people live healthier lives and make the health system work
  better for everyone. We believe everyone-of every race,
  gender, sexuality, age, location, and income-deserves the
  opportunity to live their healthiest life. Today, however,
  there are still far too many barriers to good health which
  are disproportionately experienced by people of color,
  historically marginalized groups, and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission. Diversity
  creates a healthier atmosphere: UnitedHealth Group is an
  Equal Employment Opportunity/Affirmative Action employer and
  all qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  age, national origin, protected veteran status, disability
  status, sexual orientation, gender identity or expression,
  marital status, genetic information, or any other
  characteristic protected by law. UnitedHealth Group is a
  drug-free workplace. Candidates are required to pass a drug
  test before beginning employment. #RPO, #GREEN
