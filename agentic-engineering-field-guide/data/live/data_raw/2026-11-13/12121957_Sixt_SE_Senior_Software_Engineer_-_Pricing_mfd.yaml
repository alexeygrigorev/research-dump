description: |
  Company Description



  Job Description

  Pricing is the engine of our business, and you’ll own it. In
  your role will take a business goal and drive it all the way
  to a validated outcome in production — shaping the solution
  with Product, designing it, shipping it, and proving it
  moved the metric it was meant to move. It is car-rental
  yield management — perishable inventory, real-time
  decisions, made millions of times — and one of the most
  consequential systems at SIXT. Join Team Orange in Pullach
  close to Munich and own it.

  YOURS TO OWN

  - You own pricing problems end to end — from ambiguous
    business intent to a running production system you are
    accountable for: writing it, testing it, deploying it, and
    monitoring it live
  - You partner with Product as a peer, co-owning the outcome:
    translating business goals into technical strategy,
    challenging unclear framing, and proposing better
    solutions instead of waiting for a spec
  - You turn ambiguity into clarity — specifications with
    measurable acceptance criteria, the real edge cases named,
    and a concrete plan for validating the result after launch
  - You make quality structural by encoding standards as
    automated checks so whole classes of issues are blocked
    rather than caught in review, and root-cause problems so
    they don’t recur — because in pricing, mistakes are
    expensive
  - You use AI tooling as a genuine engineering lever — moving
    faster from spec to working C++, accelerating root cause
    analysis, generating test coverage — and help define where
    it actually earns its place in the pricing stack
  - You set technical direction for performance, reliability,
    and correctness across the pricing stack, and raise the
    bar for the engineers around you

  YOUR SKILLS MATTER

  - Experience You are experienced in C++ as your primary
    language in a latency- and correctness-critical pricing
    core where the details matter
  - Ownership You build scalable distributed systems, without
    anyone telling you how; Golang is a strong plus as we
    build a service layer around the core
  - Systems Thinking You reason honestly about trade-offs in
    reliability, performance, and correctness, design clean
    subsystem contracts, and debug across services to genuine
    root cause — you know where things break and why
  - Motivation You ask what problem we are solving before what
    should I build and measure your success by outcomes, not
    lines of code
  - Soft Skills You are proactive, even in a high-stakes domain
    where precision matters and the numbers you move are real
  - Team Spirit You collaborate with Product and engineering
    peers, challenge unclear framing confidently, and compound
    your judgment on architecture and outcomes

  WHAT WE OFFER

  - Extra benefits Enjoy discounts on SIXT rent, share, ride and
    SIXT+, attractive vehicle leasing offers, and exclusive
    deals with partners for travel, tech, fashion and more
  - Mobility boost We support you with a monthly mobility
    allowance of €20 per month for even more freedom
  - Future security We contribute to your retirement plan and
    support you with capital-forming benefits to ensure you
    are well covered
  - Feel-good atmosphere Stay active with our modern SIXT gym,
    various leisure activities like the gaming area or the
    SIXT choir, and enjoy our high-quality employee restaurant
  - Flexibility Enjoy 30 days of vacation and a hybrid working
    model with flexible hours
  - Giving back Take one day each year to volunteer at a
    charitable organization dedicated to supporting children

  Additional Information

  About us:

  We are a globally leading mobility service provider with a
  revenue of €4.3 billion and around 9,000 employees
  worldwide. Our mobility platform ONE combines our products
  SIXT rent (car rental), SIXT share (car sharing), SIXT ride
  (taxi, ride, and chauffeur services), and SIXT+ (car
  subscription), giving our customers access to our fleet of
  360,000 vehicles, the services of 4,000 cooperation
  partners, and around 5 million drivers worldwide. Together
  with our franchise partners, we are present in more than 100
  countries at 2,000 rental stations. At SIXT, top-tier
  customer experience and outstanding customer service are our
  highest priorities. We believe in true entrepreneurship and
  long-term stability and align our corporate strategy with
  foresight. Get started with us and apply now!
