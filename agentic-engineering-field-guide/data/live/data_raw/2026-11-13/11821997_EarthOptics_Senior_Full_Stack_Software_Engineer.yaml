description: |
  Join EarthOptics as a Senior Software Engineer (Full Stack)!

  At EarthOptics, we are combining cutting-edge genomic
  analysis, data science, microbiology, and remote sensing to
  revolutionize agriculture. We are creating a future where
  traditional sampling methods are obsolete. Our mission is to
  be the leading soil information company, delivering maps
  that growers, farmers, ranchers, and other stakeholders use
  to cost-effectively increase yields, improve soil health and
  the climate and feed the growing world through all things
  soil.

  We are a growing company with a passion for soil health,
  innovative technologies, and supporting all within the food
  value chain. We currently have ~100 individuals spread
  across 20 states and 2 countries, and they come from all
  walks of life, industries, and experiences. We are deeply
  focused on building the future of AgTech and sustainability
  and helping the world see soil differently.

  Our Senior Software Engineer will join our Software
  Engineering team to impact our mission through individual
  contributor responsibilities to design, build and maintain
  the technology that powers EarthOptics’ products and
  operations. This is a hands-on technical leadership role
  requiring strong full-stack engineering capabilities,
  experience with modern cloud infrastructure, and the ability
  to independently own complex software systems. You'll work
  across frontend applications, backend services, APIs, and
  cloud infrastructure while helping shape technical decisions
  and improve engineering practices.

  The digs:

  - Job Type: Full-time, salaried, exempt (not eligible for
    overtime)
  - Work Location: This remote position is open to candidates
    authorized to work in the United States who reside in the
    contiguous 48 states, with a preference for those who can
    consistently align their working hours with US Central
    Time.
  - Travel: 5% of the time
  - Target Start Date: December 2026
  - Application Deadline: Applications will be accepted through
    November 30, 2026.
  - Compensation: $125,000 to $165,000 annual base salary, plus
    eligibility for our bonus program and an equity option
    grant (see below).
    - *This range covers all US locations where this remote role
      can be performed. Your offer will reflect the pay zone
      for your location and your job-related skills and
      experience, assessed consistently for every candidate.
      We do not ask about current or past pay.

  What you’ll cultivate as a Senior Software Engineer: (Your
  responsibilities)

  - Own the end-to-end design, development, deployment, and
    maintenance of full-stack applications, spanning user
    interfaces, backend services, APIs, and data integrations.
  - Design, build, and maintain scalable, reliable cloud-based
    systems, including infrastructure, CI/CD pipelines,
    observability, security, and production operations.
  - Take technical ownership of existing applications and
    services, developing a deep understanding of their
    architecture, identifying risks, addressing technical
    debt, and improving long-term maintainability.
  - Provide hands-on technical leadership through architectural
    decisions, code reviews, mentorship, and close
    collaboration with Product and other engineering teams.
  - Evaluate, develop, and integrate AI-powered solutions across
    engineering workflows, internal applications, and
    customer-facing products, identifying opportunities to
    improve productivity and deliver new capabilities while
    maintaining strong standards for security, correctness,
    and maintainability.
  - Collaborate directly with internal stakeholders and external
    customers to understand their needs, translate
    requirements into effective technical solutions, and
    support the successful delivery and adoption of software
    capabilities.

  What you can expect to accomplish within your first 60-120
  days

  - System Ownership & Knowledge Transfer: Develop a strong
    understanding of EarthOptics' applications, architecture,
    and cloud infrastructure. Successfully transition
    ownership of critical systems and identify key technical
    risks.
  - Full-Stack Feature Delivery: Independently design,
    implement, and deploy a meaningful full-stack feature or
    enhancement, demonstrating proficiency across frontend,
    backend, and cloud services.
  - Technical Debt & Reliability: Identify and begin addressing
    high-priority technical debt, performance bottlenecks, or
    reliability issues, with actionable recommendations for
    improving system maintainability.
  - AI-Assisted Engineering: Evaluate AI development tools,
    demonstrate practical applications, and recommend
    approaches that improve engineering productivity without
    compromising quality.

  Are you our soil-mate? You’ll bloom in this role if you have
  experience in: (Your qualifications)

  - 7+ years of professional software engineering experience, or
    equivalent demonstrated experience building and
    maintaining production software.
  - Strong full-stack engineering experience, including modern
    frontend frameworks, backend services, API development,
    and integration with databases and external systems.
  - Hands-on experience designing, deploying, and maintaining
    applications using modern cloud infrastructure, including
    cloud-native architecture, deployment automation, and
    production operations.
  - Proficiency with modern frontend and backend programming
    languages, with the ability to quickly learn and
    contribute to new technologies.
  - Experience designing and working with relational databases,
    SQL, REST APIs, and common application integration
    patterns.
  - Practical experience with infrastructure-as-code tools,
    containerization, and modern deployment technologies such
    as Terraform, Docker, Kubernetes, or equivalent solutions.
  - Strong engineering practices, including automated testing,
    code reviews, observability, secure software development,
    debugging, and production incident response.
  - Experience making architectural decisions, independently
    owning complex systems, and helping other engineers
    improve through technical guidance and mentorship.
  - Familiarity with AI-assisted software development tools and
    the ability to use them effectively while critically
    evaluating generated code for accuracy, security, and
    maintainability.
  - Strong problem-solving and communication skills, with
    experience collaborating across engineering, product, and
    other business functions.
  - Bachelor's degree in Computer Science, Engineering, or a
    related field, or equivalent practical experience.

  **We are interested in every qualified candidate who is
  eligible to work in the United States. However, we are not
  able to sponsor or transfer visas at this time.

  Although not required, we’d love to see roots in:

  - Production experience with Python and TypeScript, ideally
    including frameworks such as FastAPI, React, or similar
    technologies.
  - Experience developing geospatial or data-intensive
    applications, including GIS, spatial databases such as
    PostGIS, mapping technologies, or large-scale scientific
    data pipelines.
  - Experience integrating AI/ML capabilities, large language
    models, or agentic workflows into production software
    applications.
  - Experience thriving in a small, fast-moving engineering team
    where individuals take broad ownership, adapt to changing
    priorities, and work closely with stakeholders to solve
    technical and business challenges.

  Aside from “the green”, we can offer you:

  - Medical, Dental & Vision Insurance - 90% funded by
    EarthOptics for benefit-eligible employees and 55% for
    dependents
  - Company-paid LTD, STD, and Life Insurance
  - Meaningful equity option grants
  - 401k Plan + Employer Match up to 4%
  - Tenured PTO Accrual Policy starting with 17 days of paid
    time off per year,
  - 11 Paid Company Holidays

