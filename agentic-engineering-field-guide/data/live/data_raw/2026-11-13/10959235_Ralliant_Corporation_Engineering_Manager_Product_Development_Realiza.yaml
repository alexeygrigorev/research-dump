  About Us

  Ralliant Corporation Overview

  Ralliant, originally part of Fortive, now stands as a bold,
  independent public company driving innovation at the
  forefront of precision technology. With a global footprint
  and a legacy of excellence, we empower engineers to bring
  next-generation breakthroughs to life — faster, smarter, and
  more reliably. Our high-performance instruments, sensors,
  and subsystems fuel mission-critical advancements across
  industries, enabling real-world impact where it matters
  most. At Ralliant we’re building the future, together with
  those driven to push boundaries, solve complex problems, and
  leave a lasting mark on the world.

  About the Team

   About Gems–Setra





    Gems–Setra is a leading global supplier of sensing and
  monitoring technologies, operating within the Precision
  Technologies platform of Ralliant Corporation. Through our
  comprehensive portfolio of premium sensing products, we
  deliver solutions to customer problems and challenges.









    As two Ralliant businesses merged in 2022, Gems Setra’s
  vision is to connect our customers to their environment to
  create a safer, healthier, more sustainable world. Gems
  Sensors product offerings include a range of products that
  encompass liquid level, flow, and pressure sensors,
  miniature solenoid valves, proximity switches, and
  integrated fluid management solutions. The Setra Systems
  product line offers an extensive selection of high-quality
  sensing instruments for humidity, current, vacuum, energy,
  and pressure measurements.









    At the heart of our combined company's mission lies a
  shared dedication between Gems Sensors and Setra Systems to
  deliver high-quality sensing solutions, backed by reliable
  customer support on a global scale. As a part of Ralliant,
  we embrace a culture of innovation, driving progress and
  empowering advancements in the industries and customers we
  serve.




