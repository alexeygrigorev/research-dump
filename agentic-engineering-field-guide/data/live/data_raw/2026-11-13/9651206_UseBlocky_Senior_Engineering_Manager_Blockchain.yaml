description: |
  About UseBlocky

  At UseBlocky, we combine creativity, technology, and
  innovation to build exceptional digital experiences. Our
  multidisciplinary teams deliver blockchain, Web3, mobile,
  web, and growth solutions for ambitious businesses
  worldwide.

  Position Overview

  We are looking for a Senior Engineering Manager to lead the
  successful delivery of blockchain and Web3 development
  projects while managing and mentoring engineering teams. You
  will oversee technical execution, resource planning,
  engineering quality, and project delivery across smart
  contract, backend, frontend, and infrastructure initiatives.

  Responsibilities

  - Lead engineering teams delivering blockchain and Web3
    projects.
  - Collaborate with Product Managers and clients to define
    technical solutions and project scope.
  - Oversee architecture decisions for smart contracts, dApps,
    and supporting infrastructure.
  - Ensure projects are delivered on time, within scope, and at
    high quality standards.
  - Establish engineering best practices, security standards,
    and code review processes.
  - Manage project resources, technical risks, and development
    roadmaps.
  - Mentor and develop engineers across blockchain, backend, and
    frontend disciplines.
  - Support hiring, onboarding, and performance management.
  - Drive continuous improvements in engineering processes and
    team productivity.
  - Promote smart contract security, scalability, and
    operational excellence.

  Required Qualifications

  - 7+ years of software engineering experience, including 3+
    years in engineering leadership or people management
    roles.
  - Proven experience leading the development and delivery of
    blockchain and Web3 projects.
  - Strong understanding of blockchain architecture, smart
    contracts, decentralized applications (dApps), and Web3
    technologies.
  - Experience managing engineering teams across frontend,
    backend, blockchain, and infrastructure disciplines.
  - Strong knowledge of software architecture, system design,
    scalability, and security best practices.
  - Experience overseeing project planning, resource allocation,
    risk management, and delivery timelines.
  - Familiarity with Solidity, Ethereum, EVM-compatible chains,
    and modern Web3 development frameworks.
  - Experience implementing Agile development processes and
    engineering best practices.
  - Strong leadership, communication, mentoring, and team-
    building skills.
  - Ability to manage multiple projects and stakeholders in a
    fast-paced environment.

  Preferred Qualifications

  - Experience managing blockchain or Web3 engineering teams.
  - Hands-on experience with cloud platforms such as AWS, GCP,
    or Azure.
  - Background in consulting, agency, or startup environments.
  - Familiarity with DevOps, CI/CD, and infrastructure
    management.

  Benefits & Perks

  - Competitive Compensation — Attractive salary package with
    performance-based incentives.
  - Remote-First Flexibility — Work from anywhere with flexible
    hours and a focus on outcomes rather than schedules.
  - Professional Growth — Annual learning budget for
    certifications, courses, conferences, and blockchain-
    related training.
  - Modern Equipment & Home Office Support — Company-provided
    hardware and support for an efficient remote workspace.
  - Generous Paid Time Off — Flexible vacation policy that
    encourages work-life balance.

  Pay Transparency Notice:

  Base salary varies by location (see range below). Total
  compensation may also include equity and bonus eligibility,
  and benefits (medical, dental, vision, 401(k)).

  Exceptional candidates may be considered above the stated
  range. Additional performance-based incentives may be
  available.

   Annual base salary range (excluding equity and bonus):

  $220,000 - $320,000 USD
