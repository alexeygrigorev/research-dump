description: |
  MORSE Corp is an employee owned, small business based in
  Cambridge, MA, Arlington, VA, and Seattle, WA with a history
  of fielding cutting-edge technology. MORSE boasts a
  specially selected team of scientists, engineers, and
  software developers to deliver best-in-class technical
  solutions that solve difficult multidisciplinary problems
  faced by the US National Security Ecosystem. 

  As a Frontend Software Engineer at MORSE, you will play a
  key role in designing, developing, and deploying web-based
  applications that support AI model development, simulation,
  situational awareness, and mission planning capabilities for
  our DoD customers. You will work closely with our HCI and UX
  engineers to design intuitive UIs and collaborate with
  software engineers to implement them. This is an exciting
  opportunity to work with a talented team and build software
  for human users. We use a variety of languages including
  React, React Native, Kotlin, Python, and more.

  Responsibilities:

  - Design, develop, and deploy web-based applications using
    React, React Native, Typescript, Python and other
    technologies
  - Collaborate with HCI and UX engineers to design intuitive
    UIs and implement them with software engineers
  - Work on a team developing new code bases that are object-
    oriented, extensible, and maintainable
  - Stay up-to-date with the latest trends and technologies in
    frontend development
  - Participate in code reviews and contribute to the
    improvement of the codebase

  Requirements:

  - US CITIZENSHIP REQUIRED or the ability to obtain a U.S.
    Security Clearance
  - 5+ years experience working on front end development and
    UI/UX for web applications
  - Knowledge of React, Typescript, JavaScript, and Python
  - Knowledge of test driven development (TDD)
  - Experience with design patterns and a passion for developing
    user-centric applications with an eye for design
    principles
  - Experience with version control systems Git and/or
    Subversion
  - Experience working with teams using Agile software
    development
  - BS or MS (preferred) in computer science or equivalent
    degree, and at least 5 years of experience
  - Willingness to travel up to 25%

  MORSE Corp’s salary range for this role carefully considers
  a wide range of compensation factors, including but not
  limited to, prior experience, education, skills and
  expertise, location, internal equity, and other factors that
  are job related and consistent with business need.
  Therefore, final offer amounts may vary from the amount
  stated. Depending on role eligibility, total compensation
  may also include bonus, stock, 401(k) match, paid time off,
  medical, dental, vision and life insurance.

  Employees also receive 10 paid holidays per year. MORSE
  maintains an “open” leave policy that does not restrict
  exempt, regular full-time employees to a specific number of
  paid sick or vacation days. However, this policy is not an
  “unlimited” paid leave policy.

  Compensation

  $90,000—$180,000 USD

  The team at MORSE takes pride in being the smart team that
  is easy to work with. We focus on steady, long-term success
  with an emphasis on exceptionalism and delivering mission-
  critical impact to our customers. For more information,
  please visit www.morsecorp.com.
