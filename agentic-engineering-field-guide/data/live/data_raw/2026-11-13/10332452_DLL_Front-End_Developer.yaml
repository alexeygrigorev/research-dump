description: |
  Front-End Developer

  As Front-End Developer, you will design, build, and deliver
  high-quality front-end applications across the CCO Domain.
  This is a hands‑on leadership role with responsibility
  across the full SDLC, including requirements definition,
  UI/UX architecture, development, testing, deployment, and
  production support.

  You will collaborate closely with product owners, solution
  architects, UX/UI designers, and back-end development teams
  to ensure front-end solutions are scalable, secure,
  user‑centered, and aligned with DLL’s enterprise
  architecture and evolving customer needs. You will guide one
  or more Agile delivery teams to drive innovation, ensure
  high‑quality delivery, and foster engineering excellence
  within the domains supported by IT CCO Delivery (e.g., Asset
  Management, Pay Per Use, Salesforce CRM integrations, Global
  APIs, and Commercial Effectiveness).

  You will also mentor team members, support career
  development, promote best practices, and actively contribute
  to building a strong engineering culture.

  Responsibilities:

  Front-End Architecture, Design & Development

  - Lead the architecture design, development, testing,
    delivery, and support of front-end applications using
    modern frameworks (React, Angular, Vue, etc.).
  - Act as a hands‑on member of the Agile team, contributing to
    UI component development, state management, styling
    systems, and integration with APIs and Azure-based
    services.
  - Ensure front-end solutions integrate seamlessly with
    existing application ecosystems and follow enterprise
    design standards.
  - Build performant, accessible, secure user interfaces that
    deliver tangible business value.
  - Drive adoption of reusable UI patterns, shared component
    libraries, and modern design systems.
  - Review code, and ensure consistent adherence to engineering
    best practices.

  Team Leadership & Agile Delivery

  - Serve as a lead member and liaison to architecture,
    influencing decisions on front-end technologies and
    solution design.
  - Lead one or more agile developments, work with the other
    members and coach them on sizing, scoping, technical
    design, and risk mitigation.
  - Partner closely with Product Owners, UX/UI designers, and
    cross-functional teams to support value delivery and user-
    centered design.
  - Plan, coordinate, and integrate work across hybrid and
    virtual front-end engineering teams.
  - Drive continuous improvement initiatives across development
    practices, tooling, standards, and delivery workflow.

  Technical Execution & SDLC Ownership

  - Validate technical feasibility of UI/UX designs and convert
    them into scalable implementations.
  - Develop front-end applications that consume REST APIs, and
    Azure platform services.
  - Ensure the front-end codebase adheres to industry security
    standards (XSS, CSRF, etc.).
  - Support CI/CD pipelines for front-end deployments using
    Azure DevOps, GitHub Actions, or similar tooling.
  - Participate in requirements analysis and provide expert
    technical guidance to stakeholders.
  - Ensure all deliveries include proper documentation.
  - Lead troubleshooting and resolution of application issues,
    especially in production environments.

  Find out more here about how you can unleash your full
  potential at DLL

  Day to day:

  - Lead and contribute to front-end architecture, development,
    testing, and delivery.
  - Partner with UX designers to translate wireframes into high-
    performing interfaces.
  - Collaborate with solution architects to validate design
    alignment with enterprise direction.
  - Participate in agile ceremonies (planning, stand-ups,
    refinement, retrospectives).
  - Troubleshoot issues across development and production
    environments.
  - Support backlog management, sprint planning, and value
    realization.
  - Continuously explore new technologies and propose
    improvements to design and delivery.

  Measures:

  - Quality and usability of delivered front-end solutions
  - Customer satisfaction and end‑user adoption
  - Team velocity and throughput
  - Adherence to best practices and architectural guidelines
  - Reduction of defects and production issues

  All members enjoy

  - Two working days per year volunteering for a local charity.
  - Health and Wellness program including healthy food, free
    health checks, fun health & vitality activities.
  - Flexible hours with possibility to work from home
  - Career development opportunities: online learning, member
    development programs.
  - Click this link for an overview of all the benefits in your
    region.

  “We not only live up to the expectations of our customers
  for today, but also anticipate their market needs of
  tomorrow.”

  Essentials:

  - Bachelor’s Degree in Computer Science, Information
    Technology, or equivalent experience.
  - Has a can-do mentality and is self-starter with the ability
    to work independently
  - 5-7+ years in Information Technology and experience working
    in Agile/Scrum
  - Advanced experience with at least one major front-end
    framework (React-preferred, Angular, Vue, Kendo)
  - Strong understanding of:
    - NodeJS, JavaScript (ES6+), TypeScript
    - State management (Redux, Vuex, NgRx, etc.)
    - Responsive UI, accessibility (WCAG), and cross-browser
      practices
    - CSS architectures (CSS Modules, LESS Styling Components,
      SCSS, Tailwind, etc.)
  - Experience working with:
    - REST APIs and API integration patterns
    - HTTP secure module integrations
    - Azure CI/CD for front-end applications
  - Knowledge of relational databases (SQL) and ability to
    collaborate with backend teams.
  - Solid understanding of web application security and secure
    coding practices.

  Soft Skills & Business Acumen:

  - Strong communication skills, able to explain technical
    topics to non‑technical stakeholders.
  - Ability to translate business needs into user-friendly
    front-end solutions.
  - Experience writing high-quality user stories and acceptance
    criteria.
  - Ability to manage multiple priorities and collaborate within
    a diverse, distributed team environment.

  Leadership and Interpersonal Skills:

  - Ability to provide technical leadership across front-end
    architecture, design, and implementation.
  - Strong coaching, mentoring, and team development skills.
  - Highly adaptable and comfortable working in a dynamic
    environment.
  - Proven ability to influence, collaborate, and foster an
    inclusive and transparent culture.
  - Excellent analytical and problem-solving abilities.

