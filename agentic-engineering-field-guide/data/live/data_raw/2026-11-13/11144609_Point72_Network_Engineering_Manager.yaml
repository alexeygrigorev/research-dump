description: |
  A Career with Point72’s Technology Team

  As Point72 reimagines the future of investing, our
  Technology team is constantly evolving our firm’s IT
  infrastructure and engineering capabilities, positioning us
  at the forefront of a rapidly evolving technology landscape.
  We’re a team of experts who experiment and work to discover
  new ways to harness open-source solutions, modern cloud
  architectures, and sophisticated Artificial Intelligence
  (AI) solutions, while embracing enterprise agile
  methodologies. Our commitment to building and innovating in
  the AI space provides the framework intended to drive
  smarter decision making and enhance how we build and operate
  our platforms and applications.

  As a member of Point72’s Technology team, we encourage and
  support your professional development from day one—helping
  you advance your technical skills, contribute innovative
  ideas, and satisfy your own intellectual curiosity—all while
  delivering real business impact for our multi-billion-dollar
  global business.

  What you’ll do

  - Lead a team of network engineers who design, build, and
    operate resilient infrastructure that supports critical
    investment, trading, and business applications
  - Shape the network engineering roadmap by translating
    business priorities into scalable architecture,
    modernization plans, and measurable delivery outcomes
  - Design secure, high-performance network solutions across
    office, data center, and cloud-based environments, with a
    focus on availability and latency
  - Drive automation, observability, and infrastructure as code
    practices that improve reliability, accelerate delivery,
    and reduce operational risk
  - Partner with Technology, Security, and business teams to
    deliver networking capabilities for new applications,
    locations, and strategic initiatives
  - Oversee incident response, root cause analysis, and problem
    management to restore service quickly and prevent
    recurring issues
  - Guide change management for business-critical upgrades,
    migrations, and maintenance while minimizing disruption to
    global operations
  - Manage vendor relationships and partner with service
    delivery to ensure solutions meet performance, resilience,
    security, and commercial expectations
  - Coach engineers through technical mentorship,
    prioritization, performance feedback, and career
    development that strengthens the team’s impact

  What’s required

  - 15 or more years of experience in network engineering,
    including experience leading or managing engineers in a
    complex technology environment
  - Bachelor’s degree in computer science, information
    technology, engineering, or equivalent practical
    experience
  - Strong understanding of network architecture, routing,
    switching, wireless, firewall, remote access, and data
    center networking concepts
  - Experience designing and supporting large-scale, secure,
    high-availability network environments across office, data
    center, and cloud-based infrastructure
  - Experience with network automation, observability,
    infrastructure as code, incident response, and operational
    process improvement
  - Ability to lead technical decision-making, prioritize
    competing initiatives, and maintain service quality in a
    fast-paced environment
  - Strong analytical and troubleshooting skills, with the
    ability to resolve complex network issues and reduce
    recurring operational risk
  - Excellent communication and stakeholder management skills,
    including the ability to explain technical issues clearly
    to technical and nontechnical audiences
  - Commitment to the highest ethical standards

  We take care of our people

  We invest in our people, their careers, their health, and
  their well-being. When you work here, we provide:

  - Fully-paid health care benefits
  - Generous parental and family leave policies
  - Mental and physical wellness programs
  - Volunteer opportunities
  - Non-profit matching gift program
  - Support for employee-led affinity groups representing women,
    minorities and the LGBT+ community
  - Tuition assistance
  - A 401(k) savings program with an employer match and more

  About Point72

  Point72 is a leading global alternative investment firm led
  by Steven A. Cohen. Building on more than 30 years of
  investing experience, Point72 seeks to deliver superior
  returns for its investors through fundamental and systematic
  investing strategies across asset classes and geographies.
  We aim to attract and retain the industry's brightest talent
  by cultivating an investor-led culture and committing to our
  people's long-term growth. For more information, visit
  https://point72.com/.

  The annual base salary range for this role is
  $250,000-$325,000 (USD) , which does not include
  discretionary bonus compensation or our comprehensive
  benefits package. Actual compensation offered to the
  successful candidate may vary from posted hiring range based
  upon geographic location, work experience, education, and/or
  skill level, among other things.
