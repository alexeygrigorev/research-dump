description: |
  À propos du poste À titre de gestionnaire de l'ingénierie
  pour l'équipe du grand livre auxiliaire, vous serez
  responsable du système de référence pour chaque transaction
  financière chez Hopper, assurant l'exactitude des rapports
  et le rapprochement de tous les mouvements de fonds dans
  notre écosystème.

   Chaque équipe qui traite des transactions, tant pour la
  réservation que pour l'après-réservation, dépend du grand
  livre auxiliaire; vous façonnerez donc l'architecture de la
  plateforme financière d'Hopper aux côtés des équipes
  Finances, Comptabilité, Paiements et des équipes
  d'ingénierie produit qui s'y appuient. Vous serez la
  personne responsable principale sur le plan technique d'un
  système où l'exactitude et la traçabilité complète comptent
  plus que tout, conciliant la rigueur comptable et le
  jugement technique nécessaire à son évolution.

  À quoi ressemblera votre quotidien

  - Assumer la responsabilité et la gestion de la plateforme de
    grand livre auxiliaire avec une approche axée sur les
    résultats, en agissant comme point de contact principal
    pour les sujets techniques, comptables et opérationnels
    liés à l'enregistrement et au rapprochement des
    transactions
  - Diriger, faire grandir et encadrer une équipe
    d'ingénieur(e)s, en définissant l'orientation technique et
    en prônant l'exactitude dans un système où chaque écriture
    doit balancer
  - Piloter l'architecture du grand livre auxiliaire, en faisant
    évoluer la conception actuelle vers la simplicité et
    l'évolutivité grâce à des abstractions solides et à
    l'automatisation
  - Veiller à ce que tous les mouvements de fonds, tant à la
    réservation qu'après la réservation, soient comptabilisés
    avec exactitude, avec une traçabilité complète de
    l'événement source jusqu'au rapport financier
  - Établir des relations solides de haut niveau avec les
    équipes Finances et Comptabilité, en traduisant les
    exigences comptables en conception de système et en
    signalant tôt les contraintes techniques
  - Collaborer avec les équipes Paiements, Réservations, Après-
    réservation et Données qui s'intègrent au grand livre
    auxiliaire, en vous alignant sur les contrats, les modèles
    de données et les parcours de migration
  - Repérer et saisir les occasions de réduire l'effort de
    rapprochement manuel, de combler les lacunes de production
    de rapports et d'éliminer des catégories entières d'écarts
    à la source
  - Suivre des indicateurs clés comme l'exactitude des
    rapprochements, le taux de transactions non appariées, les
    délais du cycle de clôture et la fiabilité du système, et
    diriger des revues récurrentes avec les Finances et la
    direction de l'ingénierie

  Le ou la candidat(e) idéal(e) possède

  - Plus de 8 ans d'expérience en génie logiciel, dont plus de 2
    ans en gestion d'ingénieur(e)s, une expérience en fintech,
    en paiements ou en systèmes financiers étant un atout
  - De l'expérience dans la conception et l'exploitation de
    systèmes transactionnels à haut volume où l'exactitude,
    l'idempotence et l'auditabilité sont essentielles
  - Une connaissance pratique des fondements de la comptabilité,
    dont la comptabilité en partie double, les grands livres
    et grands livres auxiliaires, le rapprochement et le
    processus de clôture financière, ainsi que la capacité de
    les appliquer à la conception de systèmes
  - Une approche systémique de l'architecture, privilégiant des
    invariants clairs, des abstractions propres et
    l'automatisation plutôt que les correctifs ponctuels,
    ainsi que de l'expérience dans la conduite de refontes ou
    de migrations d'envergure de systèmes financiers en
    production
  - Une communication claire tant avec les comptables qu'avec
    les ingénieur(e)s, y compris la capacité d'expliquer les
    compromis techniques à des interlocuteurs non techniques
  - Un sens de l'organisation et une autonomie marqués dans un
    environnement en forte croissance
  - Être établi(e) dans le fuseau horaire de l'Est ou du Centre,
    avec un chevauchement quotidien avec les équipes Finances,
    Comptabilité et ingénierie avec lesquelles vous collaborez

  Avantages sociaux

  - Une entreprise en démarrage bien financée et éprouvée, avec
    de grandes ambitions, un salaire compétitif et les
    avantages d'un régime d'actions pré-IPO
  - Hopper couvre 100 % des primes du régime d'assurance
    collective
  - Hopper offre une couverture vie, invalidité de courte durée
    et invalidité de longue durée
  - Un compte de dépenses santé qui couvre les frais médicaux et
    dentaires admissibles
  - Tous les employés et leurs personnes à charge ont accès aux
    services de télémédecine de Dialogue, en tout temps, où
    que vous soyez
  - Tous les employés ont accès à un régime REER avec retenues
    automatiques avant impôt à chaque paie
  - Renseignez-vous sur notre congé parental très généreux, bien
    au-delà des normes de l'industrie
  - Vacances illimitées
  - Allocation de voyage Carrot Cash
  - Accès à un espace de co-travail sur demande via FlexDesk, et
    une allocation pour le télétravail
  - Une culture entrepreneuriale où repousser les limites et
    prendre des risques fait partie du quotidien
  - Communication ouverte avec la direction et les leaders de
    l'entreprise
  - Des équipes petites et dynamiques, un impact considérable

  À propos d'Hopper Chez Hopper, nous bâtissons la principale
  plateforme technologique de voyage au monde, et nous y
  parvenons en résolvant de vrais problèmes pour de vrais
  voyageurs partout dans le monde. Nos plateformes de
  réservation grand public Hopper et HTS (Hopper Technology
  Solutions), notre division B2B, travaillent ensemble pour
  offrir aux voyageurs ce que l'industrie n'a jamais offert de
  façon fiable : transparence, flexibilité et économies
  réelles sur chaque voyage. Nous combinons d'immenses
  quantités de données et l'IA avec des produits fintech
  exclusifs pour y arriver, non pas un simple moteur de
  réservation de plus, mais une façon fondamentalement
  meilleure de planifier et de vivre le voyage, pour nos
  clients comme pour nos partenaires.

  Nous sommes devenus rentables en 2025, un jalon rare pour
  une entreprise de voyage en démarrage à notre échelle, et la
  preuve que ce qui est meilleur pour le client et ce qui est
  meilleur pour l'entreprise peuvent ne faire qu'un

  Et nous continuons de croître rapidement! L'application
  Hopper a été téléchargée plus de 120 millions de fois, et 70
  % de nos utilisateurs font partie de la génération Z et des
  milléniaux, les voyageurs de la prochaine génération.
  Aujourd'hui, notre plus grande occasion consiste à propulser
  la fintech, le commerce et la fidélisation dans le voyage
  pour certaines des plus grandes marques de l'industrie.
  Notre premier partenariat HTS, avec Capital One, a contribué
  au lancement d'un portail de voyage dédié aux titulaires de
  cartes d'une grande marque financière, et nous avons depuis
  élargi notre portée auprès de certains des plus grands noms
  du voyage et de la banque, dont Air Canada, Uber, Banque
  Royale du Canada (RBC) et Nubank, en propulsant aussi bien
  une simple intégration fintech qu'un portail de fidélisation
  voyage complet de bout en bout.

  Voilà notre trajectoire : nous avons commencé comme une
  petite application disruptive dans l'univers du voyage, et
  nous sommes aujourd'hui le moteur qui propulse le
  fonctionnement des technologies de voyage.

  Voici à quoi cela ressemble concrètement :

  - Des milliards de dollars en voyages et en produits fintech
    de voyage transitent par Hopper et HTS chaque année.
  - Nos produits fintech, dont Annulation pour toute raison et
    Assistance en cas de perturbation pour toute raison,
    affichent une satisfaction client exceptionnellement
    élevée, parce que les conditions sont claires et les
    résolutions instantanées, sans poser de questions.
  - Près de 30 % des clients de l'application ajoutent un
    produit fintech à leur réservation, et ces clients sont
    1,6 fois plus susceptibles de réserver de nouveau avec
    nous.
  - HTS représente désormais plus de 90 % des activités, preuve
    de la rapidité avec laquelle le volet B2B s'est développé.
  - Grâce à HTS, tout fournisseur de services de voyage
    (compagnies aériennes, hôtels, banques, agences de
    voyages) peut intégrer les solutions fintech, commerce et
    IA de l'entreprise à ses propres canaux, qu'il s'agisse
    d'une simple intégration ou d'un portail de voyage complet
    de bout en bout.

