description: |
  Who is Atominvest

  Our software powers the world’s leading investment firms
  (across private equity, VC, infrastructure, credit etc.)
  enabling them to efficiently manage and drive value across
  their core business functions of investing, fundraising,
  operations and sustainability.

  At Atominvest, you’ll be working on something very exciting:
  the future of work, investments and sustainability/ ethical
  investing for the world’s best investors, and delivering a
  positive impact through this. Based on the growth we are
  experiencing, we think we’re on to something big.

  It won’t be easy. Joining a scale up business is an amazing
  and rewarding challenge, pushing well beyond the boundaries
  of natural growth cycles. You’ll move quicker than feels
  comfortable, and be brilliant at continually re-prioritizing
  what must get done to keep Atominvest growing year over year
  at the pace of the best SAAS companies on the planet.

  We’ve gone from zero to ten, now we’re looking to go from
  ten to one hundred!

  The role:

  We are looking for a full-stack software developer to take
  the lead in working across optimizing and building the next
  set of features across our award-winning web platform.

  We are looking for a highly motivated person with a hands-on
  approach looking to join the fast-paced world within a
  fintech software start-up.

  You will have to be comfortable moving quickly and
  accurately, and be brilliant at continually re-prioritizing
  what must be done to keep Atominvest growing at pace.

  You'll work with closely with the engineering and product
  teams to build and optimize our web-based software platform.

  We know that you can achieve great things, so we take a
  meritocratic approach to progression.

  What you’ll be doing:

  - Build performant, beautiful, and scalable features and
    services that delight our end users
  - Optimizing existing features and performance of our software
    platform
  - Solving complex problems in a logical an efficient manner
  - Taking a practical approach to prioritize engineering effort
    towards solving new engineering challenges
  - Identify opportunities for adopting new technologies and
    patterns
  - Lead, manage and mentor junior members of the team and help
    develop technical talent at Atominvest
  - Help attract, interview, and onboard your future team
    members during this exciting time of growth

  If this sounds like what you’d love to be doing, we can’t
  wait to hear from you.

  The must-haves:

  - 4-7 years+ experience in web development and deep
    proficiency across the following technologies
    - ReactJS
    - NodeJS
    - AWS
    - MongoDB
    - HTML, CSS/LESS/SASS
    - Git / CICD
  - A passion for maintainable, readable, stable, secure, and
    scalable code
  - Track record of shipping high quality SaaS products and
    features at scale
  - An ability to think through client needs and incorporate
    end-user feedback
  - Strong UI/UX instincts and an eye for visual design
  - Understanding of client-side performance, including
    rendering optimizations, memory management, and state
    management
  - Positive attitude, sense of humor and creativity
  - Strong analytical, project leadership and communication
    skills
  - Team leadership and management skills

  You should have a strong interest in web-based software
  development and additional experience in the financial
  services technology/ asset management space would be a
  bonus.

  What we offer

  - Competitive compensation (fixed base salary + performance
    incentives)
  - 20 days of holiday per year + bank holidays + a week off for
    Christmas
  - Hybrid working style (a minimum of 3 days in our central
    London office is required)
  - Cycle2Work scheme
  - Employee Assistance Programme (EAP) to support employee
    wellness
  - A culture of trust, ownership, responsibility and autonomy
    in your work
  - An incredible team of smart and mission-driven people to
    work with
  - Fun working atmosphere
  - Significant growth opportunities
  - Company-wide socials and events
