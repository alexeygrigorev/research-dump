description: |
  Who we are:

  At Rover, pets and their people are at the heart of
  everything we do. We connect pet parents with trusted pet
  care across the U.S., Canada, Europe, and Australia.

  Headquartered in Seattle and Barcelona, we’re a values
  driven, fast-growing tech company focused on building safe
  and personalized experiences tailored to the needs of each
  unique pet. We’re investing in AI as a business accelerator
  and provide every team member access to AI tools in service
  of creating better experiences for our community.

  We are proud to be recognized as a great place to work,
  having been named among the 100 Best Companies to Work For
  in Seattle Business Magazine and Washington’s Best
  Workplaces in the Puget Sound Business Journal. At Rover
  we’re committed to creating an accessible, inclusive, and
  welcoming community, which starts with our employees.

  Want to make an impact? Join our pack and come work (and
  play!) with us.

  This role is approved for Sponsorship and provides
  relocation assistance to Barcelona. This role is full-time
  permanent and hybrid (Mondays & Thursdays in our office in
  Poblenou in Barcelona).



  Curious about what it's like to engineer at Rover?

  Take a look at our Engineering Blog to see how our teams
  approach technical challenges, share what they've learned,
  and build products at scale. We hope it gives you a better
  sense of what it's like to work with us.

  We're looking for someone who:

  - Has a true passion for Rover’s mission and values - and is
    highly motivated by the responsibility to foster a safe
    environment for our community.
  - Has empathy for users and enjoys building customer-facing
    products that improve people's and pets' lives!
  - Brings their own unique background to the team, adding fresh
    ideas and perspectives.
  - Is able to take loose requirements, collaborate with others
    to determine what needs to be done, and drive a project
    forward.
  - Is eager to improve their craft as a software engineer and
    is excited to learn new technologies.
  - Is equally eager to share their knowledge and help foster a
    culture of learning.
  - Has great mentorship skills.

  Your Qualifications:

  - 7+ years of experience as a professional software developer
  - Long-term experience with backend development
  - Strong and proven knowledge of Python and Django
  - Solid knowledge and understanding of relational databases
    and schema design
  - Passionate about automated testing, code quality, and
    general software engineering best practices.
  - Experience pushing the boundaries of AI-assisted
    development, building custom workflows, automating
    repetitive tasks, or using AI tools beyond basic code
    completion.

  Your Bonus Skills:

  - Knowledge/Interest in React or React Native
  - Familiar with continuous integration/deployment tools.

  General Skills:

  - You are a great team player.
  - You are meticulous about design and user experience because
    you want to deliver the best service to your customers.
  - You are used to working with different agile methodologies
    (Scrum/Kanban/XP).
  - You love new challenges and are eager to solve new problems
    by applying analytical thinking.
  - Good level of written and spoken English (our engineering
    team is in Barcelona, but we work in English).
  - You love pets! 🙂

  Our Style:

  - We are proud to be professional software developers building
    high-quality, scalable, and supportable solutions.
  - We are curious and passionate about learning, providing the
    right environment and resources for professional growth.
  - We are committed to building, fostering, and maintaining a
    culture of inclusivity and diversity, both on our teams
    and in our products.
  - We embrace progressive engineering practices, including a
    continuous deployment pipeline, automated testing, and
    deployment.
  - We are serious about the quality of our production
    operation, and have thorough system, application, and user
    interaction monitoring and anomaly detection.
  - We are passionate about data-driven decision-making.
  - Our teams are integrated, with developers, product managers,
    designers, and data scientists working side-by-side.
  - And, dogs in the office. Bring yours, too!

  Benefits of Working at Rover:

  - Long-term incentive plan with a company performance-based
    cash payout
  - Pension plan
  - Private medical insurance
  - 25 days PTO
  - Meal allowance and flexible compensation plan (transport and
    nursery)
  - Gym membership
  - €450 to cover the costs associated with the adoption of a
    pet
  - Annual €150 wellness reimbursement
  - Flexible work hours, sometimes you'll need to be in at
    certain times, but on the whole, we're pretty flexible
    when it comes to managing workload and time
  - Grab snacks, fresh fruit, in our kitchen to keep yourself
    going
  - Regular team activities, events, game nights, and more
  - Dog-friendly office

  Locations

  - This position is located at our Barcelona office.
  - Applicants must currently have the right to live and work in
    Spain....We can help with relocation assistance, though!

  Compensation

  - In the greater Barcelona area the first-year salary range is
    €62,722 - €76,027. Additionally, Rover offers a long-term
    incentive plan with a company performance-based cash
    payout and benefits to full-time employees.
  - The cash compensation offered for this role will be
    dependent on the candidate's experience, qualifications,
    skills, and abilities as demonstrated in the interview and
    hiring process.

  Rover is an equal-opportunity employer committed to
  promoting a diverse, inclusive, and inventive environment
  with the best employees. We’re driven by seeing our people
  succeed and grow, and we work to ensure everyone contributes
  to their fullest potential. We consider all qualified
  applicants without regard to age, race, color, ancestry,
  national origin, religion, disability, protected veteran
  status, sex, gender identity or expression, sexual
  orientation, or any other protected status in accordance
  with applicable laws, regulations, and ordinances.
