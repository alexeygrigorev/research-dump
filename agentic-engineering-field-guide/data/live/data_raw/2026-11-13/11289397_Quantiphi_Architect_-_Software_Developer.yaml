  About the Role:

  Quantiphi is seeking a seasoned Architect – Software
  Developer with 10+ years of experience who is highly
  curious, has a high capacity for learning and problem-
  solving, and is passionate about building and scaling
  distributed services. You’ll join a high-impact team
  transforming healthcare through technology, building
  scalable platform services that connect fragmented clinical
  systems and enable real-time care coordination across
  thousands of healthcare facilities and millions of users.
  You’ll work across the full stack while leveraging modern
  cloud-native and AI-augmented engineering practices to
  deliver reliable, scalable solutions.

  Key Responsibilities:

  - Design, build, and scale robust platform services, APIs,
    microservices, and React applications
  - Drive architectural and technical decisions for critical
    business and healthcare platforms
  - Partner with Product and Clinical teams to understand
    complex workflows and develop effective solutions
  - Own the reliability, scalability, performance, and quality
    of production systems
  - Apply modern engineering practices, including automated
    testing, CI/CD, observability, and Infrastructure as Code
  - Leverage AI-augmented development tools throughout the
    software development lifecycle
  - Participate in code reviews, production support, incident
    response, and on-call responsibilities
  - Mentor engineers and contribute to technical direction and
    engineering best practices

  Basic Qualifications:

  - 10+ years of professional software engineering experience
    building and shipping production applications
  - Strong experience with Java, Python, or a similar modern
    programming language
  - Deep understanding of cloud-native architecture, distributed
    systems, and scalable service design
  - Strong experience designing, optimizing, and scaling
    relational/SQL databases
  - Proven experience designing and implementing RESTful APIs
    and microservices
  - Strong experience with automated testing, TDD, and software
    quality practices
  - Experience leveraging AI-augmented development tools (e.g.,
    GitHub Copilot, Claude Code) to drive the software
    development lifecycle, from requirements analysis and
    solution design through implementation, testing,
    documentation, debugging, and incident response.
  - Hands-on experience with React or modern frontend frameworks
  - Experience with CI/CD, Git, and Infrastructure as Code
  - Experience with production observability, monitoring,
    troubleshooting, and performance optimization
  - Demonstrated ability to take ownership of complex technical
    problems and deliver scalable solutions
  - Strong communication, collaboration, and mentoring skills

  Other Qualifications:

  - Experience building and scaling SaaS platforms
  - Strong background in Java and Spring Boot
  - Experience with Azure and Kubernetes/AKS
  - Experience with NoSQL databases
  - Experience in healthcare technology or other regulated
    industries
  - Understanding of HIPAA, data privacy, and sensitive
    healthcare data
  - Proven experience mentoring engineers or leading technical
    initiatives
  - Passion for continuous learning, emerging technologies, and
    solving complex technical challenges
  - Comfortable working in a high-ownership environment and
    supporting production systems through on-call and incident
    response

