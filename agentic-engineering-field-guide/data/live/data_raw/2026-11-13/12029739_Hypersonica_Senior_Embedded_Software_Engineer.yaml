description: |
  Help Build Europe's Hypersonic Capability



  At Hypersonica, we’re redefining what’s possible in European
  defence technology. We exist to deliver speed, resilience,
  and technological independence at a pace that sets a new
  standard. We are a small, elite team working on problems
  that matter, and solving them fast.



  By joining Hypersonica, you’re not stepping into a
  predefined role. You’re joining a talent dense environment
  where every individual shapes the direction of the company.
  Our philosophy is to hire a small number of exceptional
  people with broad, deep technical capability, strong
  judgement, and the ability to operate autonomously.



  We hire for talent, not rigid boxes. This role represents a
  business need, but the way it evolves will be shaped by the
  individual. If you’ve achieved what others said was
  impossible, or you bring a unique combination of skills that
  doesn’t fit a traditional mould, we want to hear from you.
  The work you do here directly contributes to Europe’s
  technological independence.

  What you'll do

  - Design, develop, and maintain embedded software that runs
    close to hardware on flight and ground systems.
  - Implement real time software on Embedded Linux, RTOS, or
    bare metal platforms, with a focus on determinism,
    reliability, and performance.
  - Develop and maintain low level drivers, interfaces, and
    middleware for sensors, actuators, and avionics hardware.
  - Write high quality C and/or C++ code that meets the demands
    of safety critical, high performance systems.
  - Work closely with electronics, avionics, and systems
    engineers to co-design hardware and software interfaces.
  - Support integration, debugging, and testing on real
    hardware, including bring up, fault isolation, and
    performance tuning.
  - Where useful, leverage model based design and code
    generation (e.g. MATLAB/Simulink) to accelerate
    development and reduce error.
  - Contribute to FPGA adjacent development or VHDL based
    workflows where they interface with embedded software.

  Who you are

  - An senior embedded software engineer with 8+ years’
    experience working close to hardware in aerospace,
    defence, or similarly demanding systems.
  - Comfortable developing on Embedded Linux, RTOS, or bare-
    metal platforms, with a strong intuition for timing,
    determinism, and resource constraints.
  - Fluent in C and/or C++, with a focus on correctness,
    clarity, and long-term maintainability.
  - Someone who enjoys debugging on real hardware, not just in
    simulation or abstraction layers.
  - Experienced collaborating tightly with electronics and
    avionics engineers, and shaping interfaces rather than
    just consuming them.
  - Pragmatic about tools, open to model-based development where
    it accelerates delivery without obscuring behaviour.
  - Curious about FPGA-adjacent workflows and comfortable
    interfacing with low-level logic when required.
  - Motivated by building flight-critical software in a small
    team where your code directly affects system behaviour.

  What we offer

  - A mission driven environment with the opportunity to work on
    one of Europe’s most consequential defence challenges,
    with direct impact on sovereign capability and security.
  - Daily collaboration with top experts across engineering,
    operations, and defence, with real opportunity to learn
    from the best, contribute, and grow.
  - High ownership and autonomy; no time tracking, no
    micromanagement, just clear objectives and accountability
    for outcomes.
  - A fast paced environment where good ideas are implemented
    quickly, and feedback from test and flight drives real
    decisions.
  - A culture that values clarity, integrity, and excellence,
    and supports people who take initiative and push
    boundaries responsibly.
  - Competitive compensation and real share options aligned to
    responsibility and impact, not tenure or hierarchy.

  Security and Eligibility Requirement

  Due to the nature of the work we undertake, applicants must
  be a EU/Nato/German citizen, and be eligible for German
  Security Clearance.

  At Hypersonica, every hire raises the bar. We are
  deliberately small, intensely capable, and deeply mission-
  driven. If this role feels like a strong fit, or if you
  believe you bring something exceptional that goes beyond the
  description, we encourage you to apply.



  Hypersonica is an equal-opportunity employer and assesses
  candidates solely on merit, capability, and potential.



  You can apply directly to this role or reach out to Nathan
  Sweeney, Head of Talent. We review every application and aim
  to respond to all candidates within two weeks, whether the
  answer is yes or no.
