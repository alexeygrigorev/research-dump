  Job Description:

  Senior Backend Engineer - Microservices

  In this senior engineering role, you will design, build, and
  support scalable microservices powering critical enterprise
  systems. You will collaborate across product, architecture,
  and cloud engineering teams, ensuring high‑quality delivery
  within a modern, cloud‑native platform. This role offers the
  opportunity to apply deep technical expertise while shaping
  best practices and mentoring others.

  Meaningful Work and Personal Impact

  • Architect and develop microservices using Java and Spring
  Boot • Engineer solutions leveraging Google Cloud Platform
  (Cloud Run, GKE, Pub/Sub, BigQuery) • Create efficient SQL
  queries and data pipelines for high‑availability systems •
  Implement CI/CD automation using Jenkins and
  Infrastructure‑as‑Code with Terraform • Develop robust unit
  tests with JUnit and drive continuous code quality
  improvements • Lead peer code reviews and support
  engineering standards adoption • Deliver production support
  with strong incident resolution and root‑cause analysis •
  Support agile execution and ensure accurate work tracking

  What You’ll Need to Succeed – Education

  Bachelor’s degree in Computer Science, Engineering,
  Information Systems, or related technical field.

  Alternative Path: If the candidate does not possess a
  relevant four-year degree, an additional four years of
  relevant work experience will be required.

  Required Experience

  • 13+ years of experience delivering microservices
  architecture • Expert‑level Java and Spring Boot proficiency
  • Hands‑on experience with GCP (Cloud Run, GKE, Pub/Sub,
  BigQuery) • Strong SQL and database performance tuning
  skills • Experience with Jenkins CI/CD pipelines and
  Terraform IaC • Proven ability to produce comprehensive
  JUnit coverage and ensure code quality • Conducting peer
  code reviews and providing actionable feedback • Experience
  with agile project tools (VersionOne or similar) •
  Production support experience including incident management
  and troubleshooting

  Preferred Qualifications

  • Containerization and orchestration (Docker, Kubernetes) •
  Microservices design patterns and advanced
  distributed‑systems concepts • Experience supporting
  high‑traffic, large‑scale platforms • Open‑source
  contributions

  Security Clearance Level:

  - This role will require you to obtain and maintain a Public
    Trust and will require you to provide onsite
    fingerprinting at a designated facility.  This
    investigation may review personal and criminal behavior,
    financial conduct, foreign influence, as well as other
    adjudications.
  - This position has a U.S. residency requirement. The USPS
    security clearance process requires the selected candidate
    to have resided in the U.S. (including U.S. Territories)
    for the last five years as follows: U.S. Citizens cannot
    have left the U.S. (including U.S. Territories) for longer
    than 6 months consecutively in the last 3 years (unless
    they meet certain exceptions). Non-U.S. Citizens cannot
    have left the U.S. (including U.S. Territories) for longer
    than 90 days consecutively in the last 3 years.

