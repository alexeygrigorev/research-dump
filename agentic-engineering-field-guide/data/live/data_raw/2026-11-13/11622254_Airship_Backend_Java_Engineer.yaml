description: |
  About Airship

  Airship is trusted by world’s leading brands such as Alaska
  Airlines, BBC and The Home Depot to drive revenue growth and
  customer loyalty with exceptional cross-channel customer
  experiences. Today, brands are challenged to deliver
  seamless, unified customer experiences across a fragmented
  array of channels and devices— apps, websites, email, SMS,
  wallets and more.

  Airship’s no-code, AI-powered platform was designed with
  non-technical, growth-focused teams in mind, making it easy
  to create, test and orchestrate hyper-personalized
  experiences across all channels. With the ability to easily
  enrich customer data and rapidly launch growth experiments,
  Airship enables brands to deliver consistent, meaningful
  interactions that accelerate conversion and foster deeper
  customer relationships.

  We invite you to be part of our journey in building products
  and delivering services that touch millions of customers
  around the world every day.

  To learn more about us, visit www.airship.com, read our blog
  or follow us on LinkedIn.

  About the Role

  As a Backend Java Engineer, you will design, develop, and
  support distributed systems that combine scale with high
  reliability. You will work on low-latency services that
  process continuous event streams and support analytical
  workloads across terabytes of data. Our backend
  infrastructure runs on Google Cloud Platform. It uses Java-
  based microservices and SQL and NoSQL databases. You will
  join a core engineering team that shapes Airship’s technical
  foundations and engineering practices.

  What You'll Do

  - Design data schemas and take ownership of data semantics
  - Maintain, improve, and scale Java APIs and distributed
    services
  - Investigate performance issues using server metrics,
    application data, and system behavior
  - Improve the reliability, testability, and maintainability of
    our backend systems
  - Partner with product and engineering teams on technical
    design and implementation
  - Help define technical standards across teams
  - Lead and own large-scale releases and technical projects
  - Use AI as a technical assistant to draft development plans
    and investigate problems or bugs
  - Critically assess AI-generated suggestions for accuracy,
    security, and suitability

  Duties and responsibilities described are not comprehensive.
  Additional tasks may be assigned, or the role’s scope may
  change based on business needs.

  What We're Looking For

  - At least three years of experience designing, operating, and
    maintaining distributed systems
  - Professional fluency in spoken and written French (required)
  - Strong Java development skills
  - Experience with unit testing, code reviews, documentation,
    and Git-based version control
  - Experience leading significant releases or technical
    projects
  - Familiarity with continuous integration and continuous
    delivery practices
  - Strong written and verbal communication skills
  - A collaborative and pragmatic approach to software
    development
  - A commitment to building reliable, maintainable, and
    testable systems

  We'd Be Delighted If You Also Have

  - Experience troubleshooting and improving JVM performance
  - Experience with Google Cloud Platform
  - Knowledge of distributed NoSQL databases or key-value stores
  - Strong Linux administration fundamentals

  Work Location & Travel Requirements

  Airship’s ‘Digital First’ approach to work means that for
  the majority of our roles, work can be performed remotely,
  either some or most of the time. Airship believes that
  flexible work contributes to a more productive and more
  equitable work environment, and that Airshippers are able to
  collaborate, innovate, and support one another across
  different locations and timezones.

  Some roles may require that employees perform their work
  from a specific location to support business activities,
  and/or be within proximity to an Airship office location or
  customer or partner locations, while other roles can be
  performed 100% remotely.

  This position is fully remote. Candidates must live in
  France or the United Kingdom and have the existing right to
  work in that country.This role may require up to 10% travel
  based on business needs or as requested by your manager.

  Compensation

  Starting pay may vary based on factors such as relevant
  skills, work experience, market demands, and location. All
  offers include stock options so employees have the
  opportunity to benefit from Airship’s success.

  Benefits & Perks

  - Medical insurance options for you and your dependents
  - Flexible time off, paid holidays, paid parental leave, and
    paid volunteer time off
  - Support for your overall wellbeing with employer-subsidized
    mental health and employee wellness programs
  - A digital-first work environment and a monthly stipend to
    support remote work
  - Mentorship and growth opportunities to build skills and
    accelerate professional development
  - And more!

  AI in Recruiting

  We use artificial intelligence tools in our recruitment
  process as decision-support tools only. Airship's People
  Operations team reviews all AI-generated scores and
  recommendations before making any hiring determination. No
  applicant is rejected solely on the basis of an AI-generated
  output. Depending on your location, you may have the right
  to request human review of any AI-assisted employment
  decision or to opt out of AI evaluation. To make a request
  or learn more about how we use AI in hiring, contact
  privacy@airship.com or visit airship.com/legal.

  View our EU and UK Candidate Privacy Notice here.

  **Please Note: To ensure the security of your personal
  information, Airship will only contact candidates through
  email addresses ending with “@airship.com”.

  Hiring Commitment

  Airship is committed to fostering a diverse work environment
  and providing equal employment opportunities to all
  applicants and employees. We welcome your application and
  our hiring and employment decisions are made irrespective of
  race, religion, color, national origin, gender, gender
  expression, sexual orientation, age, marital status, veteran
  status, disability status or any other characteristic
  protected by law. In alignment with our commitment to equal
  opportunity, Airship will consider for employment all
  qualified applicants, including those with criminal
  histories, in a way that adheres to the principles of
  fairness and the requirements of local Fair Chance laws,
  where applicable.

  By submitting this application, I affirm that the facts set
  forth in it are true and complete to the best of my
  knowledge. I understand that if I am employed, false
