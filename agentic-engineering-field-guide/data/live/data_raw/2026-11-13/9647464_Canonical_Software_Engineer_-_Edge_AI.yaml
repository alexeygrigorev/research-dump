description: |
  This is an exciting opportunity for a software engineer
  passionate about open source software, Linux, edge
  computing, and AI. Come build a rewarding, meaningful career
  working with the best and brightest people in technology at
  Canonical, a growing international software company.

  Your role will be to help us provide easy-to-deploy, secure,
  and customizable edge AI solutions, specifically focusing on
  Inference Snaps. You will work on designing and implementing
  silicon-optimized application packages for AI/ML inference,
  targeting devices from embedded systems to powerful
  gateways. Linux will be at the core of your everyday
  challenges.

  In our team we value collaboration, peer reviews, good
  integration/unit testing, and writing maintainable code.
  General knowledge and experience with Linux as a developer
  platform is required.

  What you’ll do

  - Collaborate proactively with a distributed team
  - Develop and maintain open-source AI/ML inference application
    packages
  - Debug issues and produce high-quality code to fix them
  - Review code produced by upstream and/or other engineers at
    Canonical
  - Discuss ideas and collaborate on finding good solutions
  - Experiment with Ubuntu Core and showcase industry-grade Edge
    AI solutions
  - Secure deployment of AI inference platforms on Linux
  - Build optimized AI solutions for local inferencing on Ubuntu
  - Work from home with global travel 2 to 4 weeks for internal
    and external events

  Who you are

  - Proven track record of at least 3 years of professional
    software development using Go or C++.
  - Experience working on and developing applications for Linux
  - You have interest and experience with a few of the
    following:
  - You value soft skills, communication and advocacy, and are
    passionate, enterprising, thoughtful, and self-motivated
  - You have a Bachelor’s or equivalent in Computer Science,
    STEM or similar degree

  Canonical is a growing international software company that
  works with the open-source community to deliver Ubuntu, the
  world’s best free software platform. Our services help
  businesses worldwide reduce costs, improve efficiency and
  enhance security with Ubuntu.

  We are proud to foster a workplace free from discrimination.
  Diversity of experience, perspectives, and background create
  a better work environment and better products. Whatever your
  identity, we will give your application fair consideration.

