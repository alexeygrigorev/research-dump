description: |
  Job Title

  Robotics Software Engineer

  Job Category

  Engineering

  Job Description

  Overview Are you looking to work in Automation and develop
  industry-leading technologies on a collaborative development
  team? A proven track record in technology is required – tell
  us what interests you and how you can help our emerging
  technology programs. This is an opportunity to impact
  materials handling by bringing Hyster and Yale products to
  the forefront of the marketplace.

  Our teams work on great projects within our "hands-on"
  engineering development centre in the South East of England.
  This role is within the Frimley-based global robotics
  development team contributing to the development of robotic
  options for all lift truck models.

  Role Summary Hyster-Yale Material Handling is looking for
  energetic and innovative robotic engineer for our emerging
  technology Product Development team in Frimley, Surrey. This
  engineering position plays an important role in implementing
  robotic technology into current products by creating,
  modifying, and implementing solutions across multiple
  platforms.

  As a global team-member you will interact with all aspects
  of the organization including manufacturing and factory
  testing, to ensure that we deliver quality robots. Finding
  the right team members for these roles is integral to our
  continued success in the global forklift marketplace.

  Join our team as we take materials handling design to the
  next level.

  Responsibilities

  - Develop, test, and integrate robotic controls software for
    vehicle controls and communication within an embedded
    development environment
  - Simulate, verify, and test developed software to ensure it
    meets technology requirements
  - Develop system and component level requirements from truck
    level requirements
  - Work with global software engineering team to develop
    efficient, cost effective electrical, electronic, and
    software architectures
  - Develop, design, release, and support activities to ensure
    that the engineering outputs meet the quality,
    reliability, performance, and cost expectations of the
    customer
  - Provide support to Manufacturing, Sourcing, Marketing, and
    Aftermarket groups in the area of vehicle control systems
  - Lead code and design reviews
  - Lead development with technology system suppliers
  - Ability to mentor and lead entry level engineers

  Qualifications

  - BS in Electrical Engineering, Computer Engineering, or
    Computer Science (embedded software skills)
  - Four years of relevant engineering work experience

  OR

  - MS in Electrical Engineering, Computer Engineering, or
    Computer Science (embedded software skills)

  Minimum Requirements

  - Development experience in C/C++ required
  - Experience with robotic sensors and SLAM applications
  - Experience in electrical, embedded control systems, and
    networked communications
  - Knowledge of CAN bus systems (SAE J1939 or CANopen)
    preferred
  - Knowledge of Wi-Fi and/or cellular radio technology
  - Develop with Matlab/Simulink/Stateflow model-based
    environment
  - Interest in industrial equipment (materials handling,
    automotive, agricultural, construction, or similar)
  - Excellent written and verbal communication skills
  - Innovative thinking, troubleshooting, and problem solving
  - Attention to quality: Follow established procedures and be
    attentive to details to ensure accuracy in design and
    documentation
  - Decision making: Exhibit good judgment and a realistic
    understanding of issues; take decisive actions to develop
    product
  - Systematic problem solving: Apply basic principles and
    methods to resolve product issues
  - Leadership and teamwork: Work well with other employees and
    departments in a team environment

  Occasional travel may be required (less than 10% total time)

  The successful candidate will be subject to background
  checks.

