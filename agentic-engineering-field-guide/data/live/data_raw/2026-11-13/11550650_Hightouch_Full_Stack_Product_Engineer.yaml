description: |
  About Hightouch

  Hightouch is an Agentic Marketing Platform powered by the
  industry-leading Composable CDP. With complete brand
  context, customer data, and performance history in one
  place, every marketer finally has the power to build and
  ship end-to-end campaigns themselves. Teams move faster,
  stay on brand, and get AI marketing that actually works.

  Founded in 2019 and headquartered in San Francisco,
  Hightouch enables marketing teams to analyze performance,
  brainstorm ideas, and generate creative at a speed and
  quality that wasn't previously possible.

  Named a Leader in the 2026 Gartner® Magic Quadrant™ for
  Customer Data Platforms, Hightouch is trusted by leading
  enterprises like Domino's, Spotify, Aritzia, Cars.com, Ramp,
  and PetSmart.

  At Hightouch, our mission is to help our customers leverage
  data and AI to grow their businesses. The team is ambitious,
  impact-driven, efficient — and we believe humility,
  kindness, and compassion are essential to our success. If
  you're energized by velocity, obsessed with raising the bar,
  and want to build alongside people who care deeply about
  each other and our customers, we'd love to meet you.

  About the Role

  We're looking for a front-end focused full stack product
  engineer to join our fast-growing engineering team, where
  you’ll help develop delightful and intuitive interfaces that
  enable non-technical users to easily engage with advanced
  features.

  At Hightouch, full stack engineers work closely with design,
  product managers, solutions engineers, and customers to
  understand problems and build polished and intuitive
  features.

  On a typical day, you will be:

  - Architecting and building features end-to-end for a new
    generation of marketing and growth products
  - Collaborating closely with customers and cross-functional
    partners - designers, product managers - to understand
    real-world behavior
  - Working alongside ML engineers to surface insights that
    empower marketers to make confident decisions

  Our ideal engineer is someone who has proven experience
  working closely with product teams to build user interfaces
  from zero to one. You should be able to independently lead
  and architect complex frontend systems, and be proficient in
  building CRUD applications and with a solid understanding of
  backend API design and data models.

  Our frontend is built in React and Typescript, and our
  backend is also built on Typescript with some elements of
  Go.

  The base salary range for this position is $180,000 -
  $400,000 USD per year, which is location independent in
  accordance with our remote-first policy. We also offer
  meaningful equity compensation.

  Interview Process

  - Recruiter Screen [30m]: Introductory call with our
    recruiting team to get to know each other and see if the
    role could be a good mutual fit.
  - Frontend Technical Screen [60m]: You will work together with
    one of our frontend engineers to build a component that is
    used commonly throughout the Hightouch app.
  - Full Stack Interview [90m]: This interview is a design-
    focused session where you'll work collaboratively with the
    interviewer to think through real product and engineering
    problems.
  - Hiring Manager Interview [30m]: Chat with the hiring manager
    about past experiences and future operating preferences to
    assess fit on company values and operating principles.

