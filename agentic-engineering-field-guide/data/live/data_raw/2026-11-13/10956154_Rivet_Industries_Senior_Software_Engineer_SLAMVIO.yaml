  Summary

  We are building the perception stack that enables robust
  three/six degrees of freedom tracking, localization, and
  mapping in complex real-world environments. This role
  focuses on fusing data from cameras and inertial sensors to
  power SLAM / Visual-Inertial Odometry pipelines. We need an
  experienced perception software engineer who can create
  algorithms and systems that run in real time, handle
  uncertainty gracefully, and provide the foundation for
  advanced spatial intelligence on edge devices.



  Responsibilities

  - Develop and optimize sensor fusion algorithms combining IMU
    and camera data for SLAM and VIO (Simultaneous
    Localization and Mapping & Visual Inertial Odometry)
  - Implement state of the art structure-from-motion techniques
    using different sensor modalities to generate consistent
    3D reconstructions
  - Evaluate algos against public benchmarks and real-world
    datasets
  - Integrate outputs into higher-level autonomy or
    collaborative mapping systems (i.e. shared mapping
    systems)
  - Collaborate with HW, robotics and platform teams to ensure
    end-to-end performance
  - Define metrics, testing frameworks and deployment strategies
    for production-ready perception systems

  Requirements

  - BS with 10+ years of academic or industry experience in
    inertial sensing, computer vision, robotics or related
    fields with shipped or published work (or MS with 8+ yrs
    of the above)
  - Shipped SLAM/VIO features to product
  - Strong background in linear algebra, 3D geometry, VIO
    (probabilistic filtering and/or factor-graph
    optimization), and visual mapping (incremental mapping,
    submaps, loop closure)
  - Proficient in C++/Python with experience in real-time
    optimization
  - Proficient in using and debugging geometric optimization
    frameworks (e.g. Ceres, GTSAM, g2o)
  - Knowledge of sensor modelling, calibration and noise
    characteristics
  - Experience with real-time processing pipelines on embedded
    or edge hardware
  - Preferred track record of applied research in robotics or
    AR/VR



