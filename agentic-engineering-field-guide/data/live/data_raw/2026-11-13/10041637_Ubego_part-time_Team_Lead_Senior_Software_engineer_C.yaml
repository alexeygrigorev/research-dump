description: |
  Ubego is a global platform where authors create scenarios in
  editor:

  - excursions

  - quests

  - games in real life

  Consumers buy and participate in these excursions / games
  with the mobile app.

  Ubego currently works in 60+ cities, and we continue to
  expand worldwide. In the near future, we plan to provide
  authors and customers with augmented reality functions.
  Ubego's goal is to create millions of quests so that
  customers can play these games every weekend and in most
  places around the world.

  My team and I believe that Ubego will embrace the world
  because we automatize excursions. It is just as obvious that
  people will use their smartphones for excursions as it is
  that autopilots will replace drivers. A cheaper, better
  service that makes customers independent will always win.



  Benefits

  - We work for 7 years

  - We have huge repeat purchase rate of 16%+

  - We earn money and grow

  - We have worldwide scalable business model

  - We are team of experienced and obsessive people

  - We have great company culture and ambitious goal



  How we work

  We work with use of Scrum methodology. There are 1 week
  sprints followed by discussing and planning.

  We are following Lean startup methodology where we actively
  test ideas.



  Responsibilities

  - Act as the Team Leader for an AI-driven engineering
    workflow—orchestrating, guiding, and reviewing the output
    of AI agents rather than managing human coders.
  - Define specs for AI agents, validate their code, and ensure
    the delivery of complete, production-ready features.
  - Lead the architecture and creation of the mobile app for
    playing quest games in real life.
  - Orchestrate AI agents to build the visual (no-code) quests
    editor and quests gameplay engine.
  - Lead the development of the gameplay server.
  - Ensure alignment with business goals and maintain
    engineering standards through rigorous code reviews and
    full end-to-end integration testing.



  Skills Requirements

  Frameworks & Languages:

  - Qt
  - C++ (C++23 standard)
  - QML
  - JavaScript / TypeScript

  Databases:

  - MySQL

  AI & Automation:

  - Mandatory: Heavy daily user of AI-assisted development tools
    (VS Code Copilot, Cursor, Claude Code, Aider, etc.)
  - Experience setting up and managing a complete AI development
    harness for high automation
  - AI agent programming and orchestration

  Tools & Engineering Practices:

  - Git / Code Reviews
  - Linux
  - Software Architecture design knowledge / UML
  - Full end-to-end integration testing

  Nice to Know:

  - Java / Android
  - Objective C
  - Node.js

  Personality requirements

  - Highly disciplined. Using task management tools to direct
    both human and AI workflows.
  - Tolerant to writing documentation (and writing precise specs
    for AI agents).
  - Ambitious. Ready to work hard to earn billions.
  - Desire to autonomously deliver features by
    designing/improving product requirements, delegating
    implementation to AI agents, and rigorously testing their
    output.
  - Comfortable acting as the "human in the loop" for a fully
    AI-driven development pipeline.

  We offer an option

  - Up to 1 500 000 shares of Ubego (at the moment there are 11
    500 000 shares). P shares hourly + dividends.

  - Workload amount is 15-20 hours weekly. You can mix easily
    with your office job.

  - This is an equity based compensation opportunity. To apply,
    you need to have a full-time job.



