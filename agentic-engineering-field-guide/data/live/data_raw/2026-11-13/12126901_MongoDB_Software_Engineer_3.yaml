description: |
  The Kubernetes teams make running MongoDB in and from
  Kubernetes so frictionless that it is the default database
  choice for cloud-native applications. Our operators let
  developers and platform teams provision, scale and operate
  MongoDB through Kubernetes-native APIs, in their own
  clusters or in MongoDB Atlas.

  You will join the Kubernetes Capabilities squad. Our sister
  squad builds the shared platform layer of the MongoDB
  Controllers for Kubernetes; we build the capabilities on top
  of it that users actually adopt. That means bringing MongoDB
  features such as Search and Vector Search to Kubernetes,
  extending what our users can deploy and manage
  declaratively, and owning the Atlas Kubernetes Operator. Our
  work starts with a user problem and ends with a Kubernetes
  API that solves it.

  In practice, we build a platform for other engineers. Our
  users are developers and platform teams who expect self-
  service, sensible defaults and APIs that behave predictably.
  If you have built an internal developer platform, a
  Kubernetes controller, or any system whose customers are
  other engineers, you will recognise the problems we work on.

  No prior experience with MongoDB is required. You will meet
  most of the team during interviews, and we pride ourselves
  on being an inclusive, collaborative group that Builds
  Together. Our core engineering values are Context,
  Predictability, Transparency, Focus and Craftsmanship.

  This role can be based in our Dublin office, Cork office or
  remotely within Ireland.

  The role

  We are looking for a Software Engineer to join the
  Kubernetes Capabilities squad and help decide which MongoDB
  capabilities our users get on Kubernetes and how they work.
  You will own significant capabilities from design to
  production, make sound technical decisions under ambiguity,
  and raise the engineering bar of the team through design,
  review and mentorship.

  Experience we value

  What matters most is that you have built platforms, not only
  operated them. We value experience from any of these
  backgrounds:

  - Building Kubernetes controllers, operators, CRDs, admission
    webhooks or other extensions against the Kubernetes API
  - Building internal developer platforms: self-service
    provisioning, golden paths, platform APIs, CLIs or
    developer portals used by other engineering teams
  - Building developer-facing infrastructure products such as
    SDKs, managed services, CI/CD systems or cloud
    provisioning tooling

  Responsibilities

  - Lead the design and delivery of new capabilities in our
    Kubernetes operators, from technical design through
    production support
  - Work with Product and the teams behind MongoDB features to
    turn them into Kubernetes-native APIs our users can adopt
  - Write technical designs that weigh trade-offs clearly and
    bring the team and stakeholders to a decision
  - Shape our platform APIs with our users in mind: predictable,
    self-service and safe to operate
  - Mentor engineers through pairing, code review and design
    feedback
  - Partner with our platform squad, Support, Docs and other
    engineering teams, and help resolve complex customer
    issues
  - Improve how the team works, including testing strategy,
    release quality and developer experience

  Requirements

  - Strong core software engineering skills and several years
    building production software in a modern language; we
    mostly use Go
  - Proven experience building a platform for other engineers,
    such as Kubernetes controllers and operators, an internal
    developer platform, or developer-facing infrastructure
    products
  - Deep working knowledge of Kubernetes, including its API
    model, reconciliation and the operational realities of
    running workloads on it
  - Experience designing, testing and operating distributed
    systems in production
  - A track record of leading projects through ambiguity and
    delivering them end to end
  - Strong written communication, including technical design
    documents

  Nice to have

  - Experience with controller-runtime, kubebuilder or
    contributing to Kubernetes ecosystem projects
  - Experience with multi-cluster Kubernetes, networking or
    service mesh
  - Experience running stateful workloads or databases on
    Kubernetes
  - Experience with a major public cloud provider

  What is in it for you

  - Generous compensation package (top-range salary, equity,
    comprehensive benefits)
  - A diverse, highly collaborative team that values shipping
    fast and clean
  - Time to learn on the job and grow into new technologies
  - A high level of independence, focused on results rather than
    the appearance of work

  About MongoDB

  MongoDB is built for change, empowering our customers and
  our people to innovate at the speed of the market. We have
  redefined the data platform for the AI era, enabling
  builders to create, transform, and disrupt industries with
  software. MongoDB’s unified data platform, the most widely
  available, globally distributed data platform on the market,
  helps organizations modernize legacy workloads, embrace
  innovation, and unleash AI. Our cloud-native platform,
  MongoDB Atlas, is the only globally distributed, multi-cloud
  data platform and is available across AWS, Google Cloud, and
  Microsoft Azure.

  With offices worldwide and over 67,000 customers, including
  AI-native startups and approximately 75% of the Fortune 100,
  relying on MongoDB for their most important applications,
  we’re powering the next era of software.

  Our compass at MongoDB is our Leadership Commitment, guiding
  how and why we make decisions, show up for each other, and
  win. It’s what makes us MongoDB.

  To drive the personal growth and business impact of our
  employees, we’re committed to developing a supportive and
  enriching culture for everyone. From employee affinity
  groups, to fertility assistance and a generous parental
  leave policy, we value our employees’ wellbeing and want to
  support them along every step of their professional and
  personal journeys. Learn more about what it’s like to work
  at MongoDB, and help us make an impact on the world!

  MongoDB is committed to providing any necessary
