description: |
  Job Overview

  Engineer the future of global finance. At Citi, our Tech
  team doesn’t just support finance – we are helping to
  redefine it. Every day, $5 trillion crosses through our
  network. We do business in 180+ countries operating at a
  scale few can match. From deploying advanced AI to helping
  shape global markets, we build systems that matter. Look to
  join a team where your work helps influence economies, your
  ideas can drive innovation and outcomes, and your growth is
  backed by mentorship, continuous learning and flexibility
  with potential hybrid work opportunities. Help solve real-
  world challenges that touch millions and get the opportunity
  to build the future of finance with Citi Tech.

  The Fixed Income eTrading team delivers eTrading strategy &
  provides market connectivity, price distribution, order
  management, RFQ management, Algo trading capability for
  Rates Products business. This role is for an individual who
  will leverage his/her skills to deliver solutions related to
  electronic trading implementations with key architectural
  and design decisions in the build out of global eTrading and
  Algo platform.

  The UI Application Senior Developer is responsible for
  establishing and implementing new or revised application
  systems and programs in coordination with the Technology and
  product teams. The overall objective of this role is to lead
  applications systems analysis and programming activities.
  The candidate will have the opportunity to work in a fast-
  paced environment dedicated to delivering business value and
  to enhancing our competitive edge.

  Responsibilities:

  - Design and develop modern, high-performance UI applications
    for eTrading and Algo platforms, including real-time data
    visualization (e.g., live pricing, order books, trade
    blotters)
  - Utilize in-depth knowledge across multiple Applications
    Development areas to provide technical oversight across
    systems and applications
  - Follow application development life cycle best practices and
    drive engineering excellence
  - Balance time-to-market (client delivery) with proper
    governance, compliance, and audit mandates

  Knowledge and Experience:

  - Proven experience designing, building, testing, maintaining,
    and supporting large-scale, high-performant UI
    applications using modern frontend technologies
  - Strong experience handling real-time/streaming data in the
    UI layer (e.g., high-frequency price updates, live order
    status) with attention to performance and low latency
  - Demonstrated ability to learn new business concepts and
    technologies quickly and thoroughly
  - Experience following good development standards and
    practices
  - Electronic trading (eTrading) experience is a plus but not
    required
  - Financial industry experience and knowledge of Rates
    Products (Bonds, Swaps, Futures) is a plus

  Qualifications:

  - Strong hands-on experience with modern UI frameworks (React,
    Angular, or Vue)
  - Solid understanding of real-time communication channels
    (WebSockets, HTTP streaming, SSE)
  - Understanding of reactive programming paradigms (e.g., RxJS)
    and state management libraries (Redux, Zustand)
  - Strong experience in distributed applications and
    architecture
  - Expertise in design, development, performance tuning, and
    troubleshooting of UI applications
  - Familiarity implementing styles based on UX designs
  - Team player with excellent interpersonal, communication, and
    problem-solving skills
  - Innovator - drives adoption of new approaches, solutions,
    and tools

  Education:

  - Bachelor's degree/University degree or equivalent experience

