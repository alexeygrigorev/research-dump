description: |
  At R1, we’re transforming how healthcare works by combining
  nearly two decades of revenue cycle expertise with advanced
  technology, including analytics, AI, intelligent automation
  and workflow orchestration. We pair that technology with the
  irreplaceable expertise of our people to help hospitals,
  health systems and medical groups improve financial
  performance, simplify administrative complexity and create
  better experiences for patients and providers.

  All Together Better defines our culture and the way we work.
  We’re a diverse, global team united by a shared mission to
  make healthcare work better for all. Across technology,
  operations and support functions, our people bring deep
  expertise, empathy and ingenuity to the work we do. Here,
  collaboration fuels progress, adaptability sparks innovation
  and every voice can help shape what’s next for R1 and the
  future of healthcare.

  About R37

  R37 is R1’s AI innovation lab, building technology to
  transform healthcare.

  Our flagship platform, Phare OS, uses AI and automation to
  improve critical pre-bill workflows, including
  authorization, utilization management, documentation and
  coding. By identifying and resolving issues before claims
  are submitted, Phare OS helps prevent denials, improve
  reimbursement and move revenue cycle work upstream.

  What makes R37 different is the opportunity to build
  advanced AI at real-world scale. R1 works across 95 of the
  top 100 U.S. health systems, giving R37 access to the data,
  workflows and reach needed to make an immediate impact:

  - 180M+ claims
  - 550M+ patient encounters
  - 1.2B+ workflow actions and outcomes annually

  This is startup-level ownership with enterprise-level
  impact. You’ll build technology that moves from idea to real
  healthcare environments, solving complex problems at scale
  and changing how healthcare works.

  As our Engineering Manager, you will help drive the
  development and delivery of AI-native products by leading
  high-performing engineering teams and shaping the future of
  AI capabilities across our core platform. Every day you will
  lead and mentor multidisciplinary engineering teams,
  collaborate with product and AI leaders to execute the
  product roadmap, and drive the delivery of scalable AI-
  powered solutions from concept to production. To thrive in
  this role, you must be a strong people leader, passionate
  about building innovative AI products, skilled at navigating
  ambiguity, and experienced in creating high-performing
  engineering organizations that deliver measurable business
  outcomes.

  Here’s what you will experience working as an Engineering
  Manager:

  - Lead and Support Teams: Lead a team of AI/ML, data, and
    full-stack engineers to deliver AI-native products. Define
    the organizational structure and necessary functions and
    cultivate a high-performing team through effective
    recruitment, mentorship, and retention strategies

  - Collaborate Across Functions: Work closely with product,
    engineering, AI research, and data science teams to define
    strategic goals and establish a roadmap for AI product
    development. Play a key role in hiring, recruiting, and
    onboarding new talent

  - Drive Innovation: Spearhead innovation in 0->1 product areas
    by exploring and implementing new AI/ML technologies and
    techniques to enhance user experience

  - Agile Methodologies and DevOps Practices: Champion agile
    methodologies and DevOps best practices within the team,
    fostering a culture of continuous improvement, automated
    testing, operational excellence and efficient software
    delivery and release

  - Foster a Diverse and Inclusive Culture: Contribute to
    building a diverse and inclusive team and culture. Support
    initiatives through hiring, community events, and other
    programs. Collaborate with teams across R37 to enhance
    mentoring and development efforts

  We prefer this role to be Hybrid (3 days onsite) at our SOHO
  Office Hub in New York City.

  Required Skills:

  - 3+ years of experience leading, hiring, and developing
    engineering teams as an Engineering Manager.

  - Proven experience building and scaling teams that deliver
    Search, Ranking, Generative AI, or other AI-driven
    products at scale.

  - Strong track record of leading 0→1 product development and
    transforming innovative ideas into successful customer-
    facing solutions.

  - Proficiency in one or more modern programming languages such
    as Python, Java, Go, Rust, TypeScript, Kotlin, or C#.

  - Experience with cloud platforms such as AWS, Azure, or
    Google Cloud Platform (GCP).

  Healthcare or Revenue Cycle Management (RCM) experience
  preferred but not required.

  For this US-based position, the base pay range is
  $101,100.00 - $206,802.61 per year . Individual pay is
  determined by role, level, location, job-related skills,
  experience, and relevant education or training.This job is
  eligible to participate in our annual bonus plan at a target
  of 10.00%

  The healthcare system is always evolving — and it’s up to us
  to use our shared expertise to find new solutions that can
  keep up. On our growing team you’ll find the opportunity to
  constantly learn, collaborate across groups and explore new
  paths for your career.

  Our associates are given the chance to contribute, think
  boldly and create meaningful work that makes a difference in
  the communities we serve around the world. We go beyond
  expectations in everything we do. Not only does that drive
  customer success and improve patient care, but that same
  enthusiasm is applied to giving back to the community and
  taking care of our team — including offering a competitive
  benefits package.

