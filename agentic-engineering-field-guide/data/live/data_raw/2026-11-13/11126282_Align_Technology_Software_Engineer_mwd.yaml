description: |
  Gestalte die Zukunft der digitalen Produktion – Werde Teil
  von Cubicure! Cubicure GmbH ist ein international tätiges
  Hightechunternehmen mit Sitz in Wien und Teil von Align
  Technology, Inc. – ein globales Medizintechnikunternehmen,
  bekannt für seine branchenführenden Produkte im Bereich der
  Kieferorthopädie. Wir bei Cubicure entwickeln, produzieren
  und vertreiben Systemlösungen für die industrielle additive
  Fertigung. Mit unserem Hot Lithography Verfahren ermöglichen
  wir den innovativen 3D-Druck von widerstandsfähigen
  Präzisionsbauteilen

  Werde Teil eines internationalen Teams, das mit
  Leidenschaft, Kreativität und modernster Technologie die
  Grenzen des Machbaren verschiebt!

  Als Software Engineer (m/w/d) bist Du für die Entwicklung,
  Weiterentwicklung und Optimierung anspruchsvoller
  Softwarelösungen verantwortlich. Du arbeitest in einem
  agilen Entwicklungsteam und übernimmst Verantwortung für die
  Planung, Umsetzung und technische Realisierung von
  Softwareprojekten. Dabei entwickelst Du zentrale
  Algorithmen, Datenstrukturen und Subsysteme, analysierst
  komplexe Fehlerbilder und optimierst Anwendungen
  hinsichtlich Performance und Stabilität. Abhängig vom
  Projekt arbeitest Du mit modernen Technologien wie Vue.js,
  TypeScript, Python oder C++ sowie mit MongoDB, Docker und
  automatisierten Test-, Build- und
  Versionsverwaltungssystemen. Die Position bietet Dir die
  Möglichkeit, innovative Technologien einzusetzen, technische
  Herausforderungen eigenständig zu lösen und aktiv zur
  Weiterentwicklung moderner Softwarelösungen bei Cubicure
  beizutragen.

  Deine Aufgaben als Software Engineer (m/w/d) bei Cubicure

  - Entwickle und implementiere Softwarelösungen innerhalb
    agiler Entwicklungsprojekte.
  - Plane, koordiniere und realisiere Entwicklungspakete
    gemeinsam mit interdisziplinären Entwicklerteams.
  - Konzipiere, implementiere und dokumentiere Algorithmen,
    Datenstrukturen und zentrale Software-Subsysteme.
  - Analysiere, identifiziere und behebe Softwarefehler durch
    systematisches Debugging und Ursachenanalysen.
  - Führe Performance-Benchmarking durch und optimiere
    Anwendungen hinsichtlich Stabilität, Effizienz und
    Skalierbarkeit.
  - Arbeite mit modernen Technologien wie Vue.js, TypeScript,
    Python und C++.
  - Nutze Datenbanken, Container-Technologien sowie
    automatisierte Test-, Build- und
    Versionsverwaltungssysteme.
  - Trage zur kontinuierlichen Verbesserung von
    Entwicklungsprozessen, Softwarequalität und technischer
    Dokumentation bei.

  Deine Fähigkeiten und Expertise

  - Abgeschlossenes Bachelorstudium in Informatik, Computer
    Science oder vergleichbare Qualifikation.
  - Mindestens 5 Jahre Berufserfahrung in der
    Softwareentwicklung mit Schwerpunkt Frontend-, Backend-
    oder Full-Stack-Entwicklung.
  - Fundierte Kenntnisse moderner Programmierkonzepte,
    Softwarearchitekturen und Datenstrukturen.
  - Erfahrung mit Technologien wie Vue.js, TypeScript, Python
    und/oder C++.
  - Kenntnisse moderner Datenbanksysteme, idealerweise MongoDB.
  - Erfahrung mit Container-Technologien, insbesondere Docker.
  - Ausgeprägte analytische Fähigkeiten sowie die Fähigkeit,
    komplexe technische Probleme strukturiert zu lösen.
  - Gute Deutsch- und Englischkenntnisse in Wort und Schrift.

  Attraktive Benefits

  - Corporate Benefits: Profitiere von exklusiven
    Vergünstigungen auf zahlreiche Produkte und
    Dienstleistungen.
  - Moderne Arbeitsmittel: Du erhältst hochwertige Hardware,
    damit du täglich optimal arbeiten kannst.
  - Betriebliche Altersvorsorge: Wir unterstützen dich aktiv bei
    deiner finanziellen Vorsorge für die Zukunft.
  - Wiener Linien Ticket: Komm bequem und umweltfreundlich zur
    Arbeit – wir übernehmen dein Öffi-Ticket.
  - Mitarbeiterrabatte auf Produkte: Freu dich auf attraktive
    Rabatte auf unsere innovativen Technologien und Produkte.
  - Lernmöglichkeiten: Entwickle dich weiter mit unseren Online-
    Ressourcen und individueller Unterstützung.
  - Integrativer Arbeitsbereich: Werde Teil eines vielfältigen
    Teams, das Zusammenarbeit und gegenseitigen Respekt lebt.

  Für die Position gilt der Kollektivvertrag für
  Kunststoffverarbeiter. Das Mindestgrundgehalt liegt bei
  monatlich 4.400 Euro brutto auf Vollzeitbasis mit klarer
  Bereitschaft zur Überzahlung.

