description: |
  About the Role at RobCo

  RobCo is building the category of Autonomous Industrial
  Robotics and we're doing it fast. We believe that automating
  the ordinary frees humans to do the extraordinary, and we're
  building the end-to-end robotics infrastructure to make that
  possible - hardware, software, and AI in one stack that just
  works.



  As our Senior Full Stack Engineer, Agentic Workflows
  (m/f/d), you'll build the agentic workflows that run our
  solution delivery behind the scenes. Every customer project
  produces requirements, designs, plans, and checks on the way
  from a customer's problem to a robot running on their
  factory floor. Your agents will work at each of these steps:
  reviewing requirements before they become commitments,
  checking and improving artifacts as the project moves, and
  catching risks while there's still time to act on them.
  You'll build the first agentic workflows, the reusable
  components and governance they run on, and much of how RobCo
  uses AI internally.

  Your Responsibilities

  - Design, build, and run agentic workflows across our delivery
    process - requirements review, automated checks and gates,
    early risk detection, and a knowledge base that makes
    everything we've learned from past projects available to
    agents and people - owning each from concept through
    production.
  - Build the way we build: reusable components, skills, and
    patterns for tool integrations, feedback loops, and
    identity, secret, and auth management. You know the
    agentic toolbox inside out and decide what we actually
    need and what we don't.
  - Own quality end to end: design and run evals, monitor agents
    in production, and manage observability, cost, guardrails,
    and security so teams can trust what the agents produce.
  - Design human-in-the-loop workflows that learn: people review
    and correct agent output at defined checkpoints, and those
    corrections flow back into better prompts, evals, and
    components, so the agents keep improving.
  - Embed with our delivery teams to understand how their work
    actually flows, identify where agents create the most
    leverage, and define together what good looks like.
  - Drive adoption and help shape how RobCo uses AI internally:
    deliver agents through the tools teams already use every
    day, establish best practices, and build paved paths so
    teams can eventually create their own agents.

  We're looking for someone who has:

  - Several years of software engineering experience and the
    seniority to take a problem from ambiguous idea to
    production system, with clean architecture, solid testing,
    and maintainable code.
  - Shipped LLM-powered or agentic systems that real users
    depend on, not just prototypes: tool calling, structured
    outputs, multi-step workflows. Deep, practical experience
    with the agentic stack — orchestration, tool use, MCP,
    memory, and retrieval — in production environments.
  - Strong context engineering and prompt engineering skills:
    you think carefully about what the model sees and in what
    structure, you treat prompts as versioned, tested
    engineering artifacts, and you have a rigorous way of
    judging whether the output is actually good.
  - Built knowledge bases and put RAG pipelines to work. You
    don't need to be a retrieval specialist; you need to make
    organizational knowledge reliably available to agents and
    people.
  - Thinks in terms of systems and user outcomes, not individual
    scripts and demos, and brings a component mindset: while
    building the first agent, you're already thinking about
    the second and the tenth.
  - Genuine enjoyment of working with non-engineering teams:
    understanding their process, speaking their language, and
    designing automation around how they actually work.
  - Strong proficiency in Python and/or TypeScript, plus fluency
    with SaaS APIs, webhooks, and the practical realities of
    integrating business systems.
  - Ownership of outcomes and a startup way of working: scope
    intentionally, build smart, ship fast, and prefer
    pragmatic solutions that ship over perfect ones that
    don't.
  - Fluent English (German is a plus).

  Why join RobCo?

  - Develop modular, software-defined robotics solutions with us
    that set new standards in automation.
  - Help us build robots equipped with state-of-the-art AI that
    perceive their environment, analyze data, and make
    intelligent decisions in real time.
  - As part of a very dynamic and fast-growing scale-up, you
    will take on responsibility from day one, drive your own
    projects, and see the direct impact of your work.
  - Flat hierarchies, open communication, and regular 360°
    feedback enable fast decisions and support your
    professional and personal development.
  - Wellpass membership (7,200+ studios across Germany), regular
    team events, and a team that takes both the work and the
    culture seriously.
  - Flexible working hours, a modern office in Munich whenever
    you with to visit, and the flexibility to work from home.
  - Regular team events - from relaxed beer & pizza nights on
    the rooftop terrace to shared experiences on ski trips or
    at Oktoberfest.

  About RobCo

  Founded in Munich in 2020, RobCo leads the transition toward
  fully Autonomous Industrial Robotics. Our mission is to
  deploy RobCo in every factory - solving the industrial labor
  shortage through end-to-end robotics that just works.
  Powered by Physical AI, our solutions combine a scalable
  modular hardware architecture with intelligent software that
  continuously learns and improves, requiring zero upfront
  investment through our Robotics-as-a-Service (RaaS) model.

  We solve our customers' most pressing pain points - labor
  shortage, cost pressure, workplace safety, and national
  reshoring - across the full spectrum of Autonomous
  Industrial Robotics. In October 2026, RobCo reached unicorn
  status with a valuation exceeding one billion US dollars,
  with its valuation doubling in less than nine months. With
  $200M raised from investors including Sequoia, Lightspeed,
  Lingotto, Kindred, Cherry Ventures, and the European Tech
  Collective, 225+ people globally, and 3.5M+ operating hours
  in the field, we are deploying robots in factories across
  Europe and the United States - with our US operations
  headquartered in Austin, TX, and our Bay Area Lab in San
  Francisco.

  Don’t meet every single requirement? If you’re excited about
  this role but your past experience doesn’t align perfectly
  with every qualification in the job description, we
  encourage you to apply anyway. You may be just the right
  candidate for this or other roles.

  At RobCo, applicants are selected regardless of ethnic
  origin, religion, gender, age, disability, or sexual
  orientation. All decisions throughout the recruitment
  process are based solely on applicants’ qualifications,
  skills, knowledge, and experience, as well as relevant
  business requirements.
