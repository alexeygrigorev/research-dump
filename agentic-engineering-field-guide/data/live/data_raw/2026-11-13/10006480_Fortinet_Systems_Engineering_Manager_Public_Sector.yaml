description: |
  Systems Engineering Manager – Public Sector

  Location: Germany

  Our company vision - a digital world you can always trust -
  is essential to achieving just and sustainable societies. We
  believe it is our responsibility to deliver on that vision
  by innovating sustainable security technologies,
  diversifying cybersecurity talent, and promoting responsible
  business across our value chain.

  Fortinet Germany is outperforming the Security Market since
  several years, contributing consistent and high profitable
  revenue streams to Fortinet’s global success. One of the key
  differentiators in the market is the Presales organization.
  The coverage and security technology competence level is
  outstanding and clearly above average vendor presence with
  the security industry.

  Objective:

  In this key role, you will lead a Team of Systems Engineers
  for the Public District. You work closely with the District
  Sales Director towards the team success. This position
  requires strong Leadership Skills as well as Problem solving
  & organizational skills and a strong Security Market
  understanding.

  Responsibilities:

  - Lead a comprehensive range of world-class security experts –
    from senior consultants to products experts
  - Recruit the best Talents and senior Professionals in our
    Industry
  - Partner with the District Sales Director and Sales
    Leadership Team to drive initiatives towards sales
    excellence
  - Establish and maintain relationship with Public customers,
    prospects and Partners at senior level
  - Understand and address key challenges of our clients,
    qualify opportunities effectively
  - Address proactively future market demands and high potential
    growth engines
  - Collaborate with the German and DACH Pre-Sales Management
    Team to align initiatives
  - Act as an escalation point for pre- and post-sales technical
    issues

  Required Skills:

  - Minimum 2 years as first line Systems Engineering Manager
  - Deep knowledge of industry cyber security market trends,
    e.g. SASE, ZTNA, SecOps
  - Knowledge how to map cyber security solutions to business
    requirements
  - A good combination of management, technical and business
    skills
  - Strong presentation skills to C-Level & individual
    contributors
  - Strong written and verbal communication skills, fluent in
    German, English
  - Good network to Public sector contacts in the region
  - A self-motivated, independent thinker that can move complex
    projects through the sales cycle

  Education:

  •        Bachelor's degree or equivalent experience in
  network security industry, MBA preferred.

  Fortinet is an equal opportunity employer. We value
  diversity in our company, and all qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, or any other applicable legally protected
  characteristics in the location in which the candidate is
  applying.

