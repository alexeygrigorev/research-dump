description: |
  Who We Are:

  Alpaca is a US-headquartered, global leader in agent-first
  brokerage infrastructure for stocks, ETFs, options, crypto,
  fixed income, 24/5 trading, and more. Amongst our
  subsidiaries, Alpaca is a licensed financial services
  company, serving hundreds of financial institutions across
  40 countries with our institutional-grade APIs. This
  includes broker-dealers, investment advisors, wealth
  managers, hedge funds, and crypto exchanges, totalling over
  10 million brokerage accounts. Our global team is a diverse
  group of experienced engineers, traders, and brokerage
  professionals who are working to achieve our mission of
  opening financial services to everyone on the planet. We're
  deeply committed to open-source contributions and fostering
  a vibrant community, continuously enhancing our award-
  winning, developer-friendly API and the robust
  infrastructure behind it. Alpaca is proudly backed by $400
  million in funding from top-tier global investors including
  Portage Ventures, Spark Capital, Tribe Capital, Social
  Leverage, Horizons Ventures, Opera Tech Ventures, SBI Group,
  Derayah Financial, Unbound, Peak XV, Elefund, and Y
  Combinator. Our Team Members:

  We're a dynamic team of 400+ globally distributed members
  who thrive working from our favorite places around the
  world, with teammates spanning the USA, Canada, Japan,
  Hungary, Nigeria, Brazil, the UK, and beyond! We're
  searching for passionate individuals eager to contribute to
  Alpaca's rapid growth. If you align with our core
  values—Stay Curious, Have Empathy, and Be Accountable—and
  are ready to make a significant impact, we encourage you to
  apply.

  Your Role:

  As a Senior Full-Stack Engineer, you will be responsible for
  designing, implementing, and maintaining systems and
  services that form the foundation of Alpaca and empower
  millions of users who trade billions of dollars worth of
  assets.

  As part of the Trading API team, you will be responsible for
  the user experience and product development for Trading API
  customers, encompassing both the frontend trading dashboards
  and backend systems that power Trading API product features
  like elite, high-yield cash, paper accounts, and more.
  Working closely with our users and internal stakeholders, we
  specialize in delivering high-quality end-to-end solutions
  across the full suite of frontend and backend systems at
  Alpaca.

  We’re looking for someone with a proven track record of
  designing and building scalable applications with an
  appreciation of the full-stack user experience. You’ll dive
  deep and specialize in a breadth of backend financial
  systems - payments, trading, market data, accounts, and more
  - to deliver innovative product features across the stack,
  while leading the design and implementation of the
  components that power elegant and performant frontend user
  experiences.

  Things You Get To Do:

  - Play a pivotal role in architecting and developing software
    solutions across the full stack that push the boundaries
    of technology
  - Work closely with cross-functional teams and dive deep into
    the backend systems and infrastructure that power
    financial markets
  - Opportunity to contribute to API design and product features
    within our ecosystem
  - Own the delivery of high-visibility features/projects, from
    design to deployment

  - Mentor peers and influence the technical strategy of our
    company

  Who You Are (Must-Haves):

  - 5+ years of experience in full-stack development with Golang
    & TypeScript/React.
  - Excellent communication and collaboration skills.
  - Ability to collect and translate stakeholder requirements
    into fully realized features.
  - Proficient in TypeScript and React.
  - Proficient in HTML and CSS frameworks such as TailwindCSS.
  - Proficient in at least one modern systems programming
    language like Golang or C#.
  - Passionate about creating intuitive and performance user
    interfaces.
  - Experience with SQL and relational databases, preferably
    PostgreSQL.
  - Experience with REST APIs and best practices.
  - Attention to detail and an appreciation for design
    aesthetics.

  Who You Might Be (Nice-to-Haves):

  - Algo trading experience (either professional or personal).
  - Experience with major cloud platforms (we primarily use
    GCP).
  - Experience or understanding of financial markets.
  - Experience with Docker and Kubernetes.
  - Experience working at a startup.
  - Experience working remotely.

  How We Take Care of You:

  - Competitive Salary & Stock Options
  - Health Benefits
  - New Hire Home-Office Setup: One-time USD $500
  - Monthly Stipend: USD $150 per month via a Brex Card

  Alpaca is proud to be an equal opportunity workplace
  dedicated to pursuing and hiring a diverse workforce.

  Recruitment Privacy Policy
