description: |
  Mapbox is the leading real-time location platform for a new
  generation of location-aware businesses. Mapbox is the only
  platform that equips organizations with the full set of
  tools to power the navigation of people, packages, and
  vehicles everywhere. More than 4 million registered
  developers have chosen Mapbox because of the platform’s
  flexibility, security and privacy compliance. Organizations
  use Mapbox applications, data, SDKs and APIs to create
  customized and immersive experiences that delight their
  customers.

  What We Do

  The Navigation Native team builds the high-performance C++
  engine that serves as the "brain" of our Navigation SDKs.
  This library runs directly on end-user systems (on-board),
  powering everything from mobile apps to in-vehicle
  infotainment systems for partners like BMW and Zeekr.

  We solve the fundamental challenges of movement:
  transforming noisy GPS/IMU data into precise map-matching,
  managing complex road-network graphs, supporting routes and
  alternatives, tracking progress along a route, and providing
  "Electronic Horizon" capabilities for ADAS. Our work happens
  at the edge, supporting location frequencies up to 10Hz and
  ensuring a seamless experience even in tunnels or dense
  urban canyons.

  As AI becomes embedded in modern engineering workflows, we
  value engineers who can thoughtfully integrate AI into
  design, development, and decision-making. Our interview
  process will include discussion of how you use AI in your
  engineering workflow.

  What You'll Do

  We are looking for smart, fast-learning engineers driven by
  the challenge of developing core components of the Mapbox
  navigation ecosystem. As a C++ Developer, you will:

  - Build and maintain a unified C++17 library that runs
    seamlessly across iOS, Android, and low-power automotive
    embedded hardware.
  - Analyze and improve map-matching and dead-reckoning
    algorithms using real-world data from millions of
    vehicles.
  - Implement route-following features, including high-frequency
    route progress reporting, deviation detection, and timely
    instruction delivery.
  - Work on road object matching (OpenLR) and live traffic
    incidents to give drivers a predictive "window" into the
    road ahead.
  - Design predictive caching for routing tiles and manage
    complex on-board resources like junction views and
    signposts.
  - Integrate and extend the Valhalla routing engine to support
    offline routing and route refresh controllers.
  - Thoughtfully leverage AI tools in your design and
    development workflow to increase efficiency and code
    quality.

  What We Believe are Important Traits for This Role

  - Strong proficiency (min 7 years of experience) in C++17 (or
    later) with a deep understanding of the language
    specification, memory management, standard library, and
    multi-threading.
  - A passion for writing clean, fast, and portable code that
    adheres to strict CPU and memory constraints.
  - Experience working with complex graph-based structures, data
    structures, and spatial algorithms.
  - Proven experience developing cross-platform code (Linux,
    mobile, or embedded systems).
  - Strong English skills, with the ability to explain complex
    technical trade-offs to both peers and stakeholders.

  Would be a Plus

  - Familiarity with navigation concepts (dead reckoning,
    bearing, Electronic Horizon, or OpenLR).
  - Experience working with IMU, OBD-II, or GNSS data.
  - Background in computational geometry or safety-critical
    features (ADAS).
  - Experience with or contribution to open source routing
    engines.

  Employment Requirements

  - Employment Type: Full-time
  - Weekly Hours: 40 h per week
  - Location/Hybrid Policy: Remote (from any city in Germany)

  What We Value

  In addition to our core values, which are not unique to this
  position and are necessary for Mapbox leaders:

  - We value high-performing creative individuals who dig into
    problems and opportunities.
  - We believe in individuals being their whole selves at work.
    We commit to this through supportive health care, parental
    leave, flexibility for the things that come up in life,
    and innovating on how we think about supporting our
    people.
  - We emphasize an environment of teaching and learning to
    equip employees with the tools needed to be successful in
    their function and the company.
  - We strongly believe in the value of growing a diverse team
    and encourage people of all backgrounds, genders,
    ethnicities, abilities, and sexual orientations to apply.

  How We Support You

  - Hybrid/Remote Options: Enjoy flexibility to work comfortably
    from home or periodically from an office where applicable.
  - Country-Specific Care & Coverage: Private health, dental,
    and income protection plans tailored to elevate your
    regional statutory benefits.
  - Family-First Support: Family care, maternity and paternity
    leave policies to support your growing family.
  - Lifestyle Spending Account: Contributions to support your
    health, wellness, and personal growth
  - Balance & Brainpower: Mental health support for you and your
    dependents.
  - Rest & Recharge: Paid time away, company holidays, and
    generous absence policies.
  - Time Off to Give Back: Dedicated paid volunteering time in
    addition to your standard PTO.

  By applying for this position, you acknowledge that you have
  received the Mapbox Non-US Privacy Notice for applicants,
  which is linked here. Completing this application requires
  you to provide personal data, such as your name and contact
  information, which is mandatory for Mapbox to process your
  application.

  We are committed to a fair and equitable hiring process. We
  do not discriminate against any protected class.

