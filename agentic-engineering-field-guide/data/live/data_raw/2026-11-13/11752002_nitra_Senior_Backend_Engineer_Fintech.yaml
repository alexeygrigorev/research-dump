description: |
  Who we are:

  Nitra's mission is to build a more efficient healthcare
  system and the technology that makes it possible.  Our goal
  is to provide an ecosystem of fintech and software solutions
  that help doctors better manage their practices, so they can
  have time back to focus on what matters to them most.



  We operate with urgency, intensity, and ambition. The bar is
  high because the opportunity is massive. We expect
  excellence, ownership, and intellectual rigor from every
  team member. We move fast, make bold decisions, and hold
  ourselves accountable to results. At the same time, we
  believe great companies are built on trust and respect.
  Every voice matters. Every contribution counts. When we win,
  we win together.



  We are scaling rapidly and on a clear trajectory toward
  becoming a unicorn this year — and beyond. Our growth is not
  accidental; it’s the result of disciplined execution,
  relentless focus, and a team that refuses to settle. We are
  building a category-defining company, and we’re looking for
  people who want to do the most meaningful work of their
  careers.



  If you want comfort, this isn’t the place.

  If you want impact, ownership, and the chance to help build
  a generational fintech company, welcome.



  Nitra was created by unicorn founders who have successfully
  scaled to thousands of customers and exited $1B+ public
  offerings. They are joined by an ambitious and experienced
  team from American Express, Citi, PayPal, Capsule, Plaid,
  Bloomberg, Meta, Facebook, and Mastercard. The team is
  backed by some of the world’s leading VCs (Andreessen
  Horowitz, NEA, etc.) and is supported by an expert group of
  advisors including the cofounders of Square and Xendit,
  executives from Intuit, former Governors, White House senior
  staffers, and a co-founder of CityMD.



  Nitra maintains a hybrid work policy, with team members
  working from the office four days per week and Wednesdays
  designated as a work-from-home day..



  We're looking for:

  A Senior Backend Engineer to help build Nitra Business
  Banking from the ground up. Nitra already helps healthcare
  practices manage corporate cards, expenses, BillPay, and
  accounting. You'll build the backend infrastructure that
  enables practices to manage their money directly through
  Nitra, from business deposit accounts and payments to
  transaction processing and ledger integrity. This is a
  foundational role where you'll make key architecture
  decisions, integrate with financial partners, and help
  establish the engineering standards for Nitra's banking
  products.

  Your responsibilities will include:

  - Design and build the core banking infrastructure, including
    account opening, balances, statements, and backend APIs.
  - Build and maintain money movement capabilities across US
    payment rails, including ACH, wires, RTP, and FedNow.
  - Own ledger integrity and transaction processing, including
    double-entry accounting, holds, idempotency, and daily
    reconciliation.
  - Integrate Nitra Business Banking with existing products,
    including cards, BillPay, expense management, and
    accounting, ensuring transactions are accurately funded
    and reconciled.
  - Build capabilities for incoming funds, including insurance
    payouts and patient payments, to give healthcare practices
    a consolidated view of their finances.
  - Work directly with sponsor banks, payment processors, and
    other financial partners on integrations, certifications,
    and compliance requirements.
  - Design reliable, auditable systems that handle payment
    exceptions, settlement timing, retries, and funds
    availability.
  - Partner with product, design, and the Taipei engineering
    team to scope features, write technical design documents,
    and identify risks early.
  - Make foundational architecture decisions, establish
    engineering best practices, and mentor engineers as the
    banking team grows.

  You have:

  - 5+ years of backend engineering experience, with strong
    Node.js/TypeScript skills or experience in a comparable
    backend language, and proficiency in PostgreSQL.
  - 3+ years of experience building production fintech products
    across payments, cards, spend management, lending,
    banking, or financial software.
  - A track record of designing and building financial systems,
    with hands-on ownership of architecture decisions
    involving money movement, ledgers, or transaction
    processing.
  - Strong system design skills, particularly around financial
    correctness, idempotency, event ordering, retries, audit
    trails, reconciliation, and safe backfills.
  - Experience integrating with third-party financial platforms,
    such as payment processors, card issuers, sponsor banks,
    or accounting systems.
  - The ability to build new products from specification through
    production in an ambiguous environment, with clear
    technical documentation and proactive risk identification.
  - Strong cross-functional communication skills and the ability
    to collaborate with distributed engineering teams,
    including scheduled evening overlap with our Taipei team.

  Nice to have:

  We offer:

  - Equity - Everyone at Nitra is an owner. When the company
    wins, you win
  - Competitive Salary - You’re the best of the best, and your
    salary will reflect your experience and reward your
    contributions to Nitra
  - Health Care - Your health comes first. We offer
    comprehensive health, vision, and dental insurance
    options.
  - Retirement Benefits - Your financial stability matters to us
    so we provide a generous employer 401K match
  - Nitra maintains a hybrid work policy, with team members
    working from the office four days per week and Wednesdays
    designated as a work-from-home day.

  The base salary range for this full-time position is $175k -
  $240k + bonus + equity + benefits. Our salary ranges are
  determined by role, level, and location. The range displayed
  reflects the minimum and maximum target for new hire
  salaries for the position across all US locations. Within
  the range, individual pay is determined by work location and
  additional factors, including job-related skills,
  experience, and relevant education or training. Please note
  that the compensation details listed reflect the base salary
  only, and do not include bonus, equity, or benefits.



