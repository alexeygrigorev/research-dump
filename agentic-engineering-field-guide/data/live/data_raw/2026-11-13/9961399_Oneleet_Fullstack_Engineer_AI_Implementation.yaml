description: |
  About Oneleet

  Oneleet's mission is to make effective cybersecurity
  painless. We're building the all-in-one security and
  compliance platform: real security first, compliance as the
  result.

  We recently closed a $33M Series A led by Dawn Capital.
  We're one of the fastest growing security companies in
  history, and we're only getting started. Our team of
  opinionated rebels has decades of security and compliance
  experience, with vision and expertise, reshaping the broken
  and fragmented compliance and cybersecurity industry.

  If you’re ready to challenge the status quo and help shape
  the future of cybersecurity, we’d love to meet you.

  Who we’re looking for:

  We value passionate self-starters with a growth mindset and
  a bias for action and personal accountability. If you love
  solving hard problems, thrive in ambiguity, and want to make
  a real impact, you’ll fit right in.

  We’re especially drawn to:

  - Rebels with a cause — frustrated with the status quo and
    eager to disrupt it.
  - Opinionated (but not obstinate) builders — decisive yet
    collaborative, who help us move fast.
  - Clear communicators — who own their ideas and follow
    through.

  Our mission is simple: make effective cybersecurity
  painless. We believe cybersecurity should empower, not
  burden. This belief unites our team and drives every
  decision we make.

  As a Fullstack Engineer focused on AI Integration at
  Oneleet, you'll be responsible for bringing our AI
  capabilities to life within our cybersecurity platform.
  You'll work across our entire stack to integrate AI
  endpoints, prepare contextual data, and create intuitive
  interfaces that make complex AI-powered insights accessible
  to our users.

  This is a hands-on engineering role where you'll own the
  complete integration flow - from gathering the right
  security context from our platform, calling our AI services
  effectively, to presenting results in ways that drive real
  value for security teams. You'll work closely with customers
  to understand their needs and iterate rapidly based on their
  feedback. Working primarily in Go, Python and JavaScript,
  you'll ensure our AI features are fast, reliable, and
  genuinely useful in day-to-day security operations.

  Key Responsibilities:

  - Integrate AI service endpoints into our platform, handling
    authentication, error states, and response processing
  - Design and implement context gathering systems that pull
    relevant security data from across our platform to feed
    into AI services
  - Build intuitive UI components in JavaScript/React that
    present AI-generated insights, recommendations, and
    automations to users
  - Map AI service responses to actionable UI elements, ensuring
    complex outputs are presented clearly and drive user
    action
  - Implement robust error handling and fallback behaviors when
    AI services are unavailable or return unexpected results
  - Create feedback loops that capture user interactions with AI
    features to drive continuous improvement
  - Work directly with customers to understand how they use AI
    features and rapidly implement UX improvements
  - Optimize API calls to AI services for performance,
    implementing caching where appropriate while maintaining
    data freshness
  - Build monitoring and analytics to track AI feature usage,
    success rates, and user engagement
  - Collaborate with the AI team to communicate platform needs
    and user feedback that could improve the underlying
    services
  - Develop reusable patterns and components for AI integration
    that can be leveraged across different features
  - Ensure AI features integrate smoothly with existing platform
    workflows and don't disrupt current user patterns

  Qualifications:

  - 5+ years of fullstack software development experience with
    expertise in Go and JavaScript
  - Strong experience building production APIs (REST and/or
    gRPC) and integrating with third-party services
  - Proven track record of building responsive, intuitive user
    interfaces with modern JavaScript frameworks (React
    preferred)
  - Experience with data transformation and mapping between
    different system formats
  - Strong understanding of asynchronous programming patterns
    and API optimization techniques
  - Experience gathering requirements from users and translating
    feedback into technical improvements
  - Solid debugging skills across the full stack - from backend
    services to frontend UI
  - Experience with production monitoring, logging, and
    observability tools
  - Strong communication skills and comfort working directly
    with customers
  - Ability to balance technical excellence with shipping
    features that provide immediate value

  Bonus Experience:

  - Previous experience integrating AI/ML services into
    production applications
  - Background in cybersecurity or security tools
  - Experience with real-time data updates and WebSocket
    implementations
  - Experience building data visualization components

  You should apply if any of the following excite you:

  - Making powerful AI capabilities accessible through
    thoughtful engineering and design
  - Working directly with customers to refine features based on
    real-world usage
  - Building the integration layer that turns AI potential into
    practical security solutions
  - Owning features end-to-end from backend integration to
    frontend presentation
  - Creating patterns and systems that will scale as we add more
    AI capabilities
  - Being part of bringing AI-powered automation to the
    cybersecurity industry

  Why Oneleet?

  At Oneleet, you’ll join a tight-knit team of rebels
  redefining the cybersecurity industry. We move fast, own our
  work, and challenge outdated models to make security
  effortless and effective for companies.

  Here’s what makes us special:

  - We value impact over titles, autonomy over micromanagement,
    and clarity over jargon.
  - You’ll tackle meaningful, hard problems with real-world
    consequences.
  - You’ll work with smart, kind, and ambitious teammates who
    lift each other up.

  Perks & Benefits

  - Comprehensive health & wellness benefits
  - 20 days PTO per year, plus 8 floating holiday
  - Remote work culture
  - Team off-sites in stunning places (Amsterdam, Italy, etc).
  - Competitive compensation & equity

  We hire globally and compensate competitively within each
  market using geographic pay bands. The range for this role
  reflects a US national baseline. Offers for candidates in
  higher cost-of-labor markets (e.g., San Francisco, New York,
  Zurich) may fall at or above the top of the posted range,
  while offers in other markets are benchmarked to local
  standards and are lower. Within any range, individual
  compensation is determined by work location, skills and
  experience demonstrated through the interview process, and
  relevant education or training. This posting reflects base
  salary only and does not include equity or benefits.

  Remote-First & Global Hiring

  We’re a remote-first company and hire globally in regions
  where we can legally engage talent directly or via our
  employer-of-record (EOR) partner. If you’re based outside
  the U.S., we’ll explore the most compliant hiring
  arrangement for your location. We make hiring decisions
  based on merit, skills, and potential regardless of
  location.

  U.S. Hiring & E-Verify

  For U.S.-based candidates, Oneleet participates in E-Verify
  to confirm employment eligibility, in accordance with
  federal regulations. We are an equal opportunity employer.
  We do not discriminate on the basis of race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, age, disability, veteran status, or any other
  characteristic protected by applicable law.

  How we use AI in this Hiring Process

  This company uses automated technology, including AI-
  assisted tools, to assist in reviewing applications,
  assessing candidate qualifications, and detecting fraudulent
  submissions. These tools analyze application data and
  identity signals to support, but not replace, human hiring
  decisions. All final hiring decisions are made by a human
  reviewer. Candidates who require accommodation or who wish
  to request information about how these tools are used,
  including requesting the bias audit results, may contact
  recruiting@oneleet.com. This process is conducted in
  compliance with applicable federal, state, and local laws.

  Notice for New York City Residents:

  You have a right to take at least 10 business days to decide
  whether to proceed with submitting your information through
  this process. By continuing, you confirm your understanding
  of this notice. If you choose to proceed before the
  10-business-day period expires, you are making a knowing and
  voluntary decision to do so.
