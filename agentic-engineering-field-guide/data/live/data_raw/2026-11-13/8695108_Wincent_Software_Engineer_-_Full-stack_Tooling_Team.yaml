description: |
  About us

  Imagine building systems that think in microseconds —
  algorithms that move millions with absolute precision.

  We’re engineers driven by performance, reliability, and
  meaningful innovation in the crypto trading space. Our team
  — experienced builders from Amazon, and Google, with
  academic backgrounds from Berkeley, Caltech, ETH, and MIT —
  is developing a next-generation trading platform that
  executes orders seamlessly across 10+ exchanges and dozens
  of tokens.

  Here, every line of code matters. Push your work to
  production, and within minutes it could be driving thousands
  of trades per hour. It’s fast, impactful, and never dull —
  the kind of engineering challenge that keeps you sharp and
  inspired.

  About the Tooling team

  We design and build powerful applications that empower
  traders and data analysts to perform at their best. Our
  tools handle massive streams of high-frequency data,
  supporting everything from real-time trading and data
  visualization to configuring complex internal systems. To
  maintain top-tier code quality, we follow strict internal
  standards and conduct regular code reviews. With our robust
  tech stack, we deliver high-performance, reliable backend
  and frontend apps that drive speed, precision, and insight
  across the trading ecosystem.

  What will you do in the Tooling team

  - There are performance challenges both at UI and on backend
    side, so you’ll take responsibility for improving UI and
    workflows for internal users such as traders and quants.
  - Contribute to the development of internal tooling and new
    projects spanning frontend and backend technologies.
  - Build apps that automatize certain workflows or processes
    (such as automatic fund transfers)
  - Design and implement user-friendly applications using React,
    TypeScript, and Node.js.
  - Work closely with stakeholders to understand requirements
    and deliver impactful solutions.
  - Tackle complex challenges such as real-time trading
    platforms with autonomy and creativity.

  What we expect from you

  - Senior Engineering Expertise: 5+ years in system design,
    performance tuning, and UI development. Experience with
    TypeScript, React, and Node is an advantage.
  - Strong Algorithmic Thinking: Analyze data and develop
    efficient solutions.
  - Collaborative Spirit: Teamwork, communication, and
    collaboration are essential, as we work as a single unit,
    not as a group of individual contributors.
  - Systems Thinking: Strong understanding of distributed
    systems, scalability, and performance optimization.
  - Ownership & Problem Solving: We provide a lot of freedom to
    our engineers, so we expect you to be a “manager of one”
    who owns their agenda and delivers results.
  - Culture Fit: Say things as they are, answer questions
    truthfully, leave ego at the door, challenge decisions
    when you disagree, and once a decision is final, commit
    and deliver your best.

  Interview process

  - Introductory call: Learn more about the company and get your
    questions answered.
  - Online assessment: Algorithmic coding challenge
  - Technical screening: Interview with one of our engineers, to
    assess your tech skills.
  - Technical interview: The live coding part to evaluate coding
    skills as well as communication and problem solving
    skills.
  - System Design interview

  The entire interview process is online.

  Compensation, work arrangement, and benefits

  - We offer competitive, above-market compensation tailored to
    your expertise, seniority, and local residency. The
    typical base salary range is 80,000 € – 150,000 € per
    year, with the final offer reflecting each candidate’s
    individual experience and depth of technical skill. We can
    go even higher on base salary in specific cases.
  - Every six months, we celebrate impact. This bonus is tied
    directly to both individual excellence and the fund’s
    overall performance. When the team wins, you win too. In
    some exceptional cases, our engineers could get more than
    50% of yearly total compensation in bonuses,
  - At Wincent, equity is a part of your compensation package,
    letting you share directly in the company’s success — when
    the firm wins, so do you. The equity fund is being
    regularly reevaluated and has a permanent upward
    trajectory.
  - Fund Investment: As part of our team, you’ll have the rare
    opportunity to invest in our flagship multi-strategy fund,
    which has delivered up to 50% annualized net returns since
    2017. You decide how much you want to invest — it’s your
    chance to grow alongside the firm’s success.
  - Onsite vs Remote: We prefer onsite collaboration in
    Bratislava (we are more than happy to provide relocation
    support if needed). However we are also open to remote
    work, giving you the freedom to work from anywhere. We
    only ask for two types of “in-person touchpoints" — a
    2-week onboarding at the start and quarterly visit to
    Bratislava, Slovakia.
  - Vacation: We believe great work comes from a balanced life.
    We have flexible working time and we also offer unlimited
    paid vacation.

  Don't hesitate and apply today!

  Working at Wincent

  At Wincent, we foster a culture of transparency, ownership,
  and autonomy, where every team member is empowered to make a
  meaningful impact. We prioritize clear objectives and give
  you the freedom to innovate and grow within a supportive,
  high-performing environment.

  We value exceptional TOP 1% talent over a perfect match to a
  job description. If our vision and values resonate with you,
  we’d love to hear from you. Don’t hesitate to reach
  out—let’s explore how you can be part of shaping the future
  of cryptocurrency trading with us!
