description: |
  Who We Are

  Notion is the collaborative AI workspace where teams and
  agents think together. We're building one place where your
  knowledge, projects, meetings, and AI tools live side by
  side, so work is faster, clearer, and less fragmented.
  Millions of individuals, small teams, and large companies
  run their work on Notion.

  Notinos (our employees) are customer zero in bringing this
  future of work to life. We care about craft, building things
  that last, and the belief that great work is still
  fundamentally human. Our goal isn’t to ship the next
  feature. Each and every team of Notinos is working to set
  the standard for how humans work together in the AI era.
  From building a business’s system of record to making and
  managing AI agents to automating away the busy work, we care
  deeply about giving our customers more time for their life’s
  work.

  This internship will take place from May 24 - August 13 or
  June 14 - September 3 (based on your summer schedule) and
  you will need to be able to work out of our SF or NY office
  during this time.

  Please only apply to the internship role that best fits your
  interest / experience. Multiple applications may result in
  delayed review of your application.

  What You'll Achieve:

  - Ship frontend features to real users. Build and launch
    production UI on Notion’s web client, from marketplace and
    seller surfaces to permissions and sharing controls,
    partnering with designers, PMs, and senior engineers.
  - Strengthen the foundation other teams build on. Contribute
    to shared components, product primitives, and tooling so
    engineers across Notion can build faster and more
    consistently.
  - Make Notion performant, scalable, and accessible. Use real
    metrics to find and fix problems in load time,
    responsiveness, and accessibility on the web client.
  - Help people discover, install, and use products from Notion
    and its ecosystem, and control who can see and do what.
    Work on distribution surfaces for creators, consultants,
    and partners, and on interfaces for access across pages,
    databases, teams, groups, and guests.
  - Own a scoped project from design to launch. Measure its
    impact and present what you learned to your team and
    partners.

  Qualifications:

  - Pursuing a bachelor's or master’s degree in computer
    science, engineering, or another related field. Must
    graduate before Summer 2028.
  - Working toward proficiency in React / TypeScript
  - Previous internship experience.
  - You find large challenges exciting and enjoy discovering
    problems as much as solving them.
  - You are able to problem-solve and adapt to changing
    priorities in a fast-paced, dynamic environment.

  This internship will take place from May 24 - August 13 or
  June 14 - September 3 (based on your summer schedule) and
  you will need to be able to work out of our SF or NY office
  during this time.

  Skills You’ll Need To Bring:

  - Thoughtful problem-solving: For you, problem-solving starts
    with a clear and accurate understanding of the context.
    You can decompose tricky problems and work towards a clean
    solution, by yourself or with teammates. You're
    comfortable asking for help when you get stuck.
  - Put users first: You think critically about the implications
    of what you're building, and how it shapes real people's
    lives. You understand that reach comes with responsibility
    for our impact—good and bad.
  - Not ideological about technology: To you, technologies and
    programming languages are about tradeoffs. You may be
    opinionated, but you're not ideological and can learn new
    technologies as you go.
  - Empathetic communication: You communicate nuanced ideas
    clearly, whether you're explaining technical decisions in
    writing or brainstorming in real time. In disagreements,
    you engage thoughtfully with other perspectives and
    compromise when needed.
  - Team player: For you, work isn't a solo endeavor. You enjoy
    collaborating cross-functionally to accomplish shared
    goals, and you care about learning, growing, and helping
    others to do the same.
  - AI enthusiast: You have built or prototyped features with AI
    technologies (LLMs, Embeddings, ML) and are interested in
    learning more.

  Nice to Haves:

  - You have expertise with specific technologies that are part
    of our stack, including TypeScript and React.
  - You've heard of computing pioneers like Ada Lovelace,
    Douglas Engelbart, Alan Kay, and others—and understand why
    we're big fans of their work.
  - You have interests outside of technology, such as in art,
    history, or social sciences.

  Notion is committed to providing highly competitive cash
  compensation, equity, and benefits. The compensation offered
  for this role will be based on multiple factors such as
  location, the role’s scope and complexity, and the
  candidate’s experience and expertise, and may vary from the
  range provided below. For roles based in New York City, the
  estimated hourly range for this role is $57/hr for Bachelors
  and $61/hr for Master’s.

  By clicking “Submit Application”, I understand and agree
  that Notion and its affiliates and subsidiaries will collect
  and process my information in accordance with Notion’s
  Global Recruiting Privacy Policy and NYLL 144.

  #LI-Onsite

  A Note on AI

  You don’t need deep AI expertise for every role, but we do
  expect every Notino to be intellectually curious, drawn to
  tinkering and discovery, and excited to use AI as a real
  collaborator in their work. For some roles, AI fluency is a
  core requirement — when that’s the case, we'll say so
  explicitly in the qualifications. People who thrive here
  don’t treat AI as a novelty. They use it to think better,
  and make their work easier for others to build on.

  Equal Opportunity & Accommodations

