description: |
  The Full Stack Senior Developer is a senior level position
  responsible for establishing and implementing new or revised
  application systems and programs in coordination with the
  Technology team. The overall objective of this role is to
  lead applications systems analysis and programming
  activities. Responsibilities:

  - Lead the design, development, customization, and support of
    Loan IQ applications and integrations using LIQ SDK.
  - Analyze business requirements and translate them into
    scalable technical solutions and application designs.
  - Develop and maintain backend services, APIs, and
    microservices using Java, Spring Boot, and related
    technologies.
  - Develop and Maintain the LoanIQ APIs using LIQ SDK.
  - Develop and enhance frontend applications using Angular,
    JavaScript, HTML5, and CSS3.
  - Design and implement integrations with upstream and
    downstream systems using messaging technologies and
    RESTful services.
  - Provide technical leadership and guidance to development
    teams, ensuring adherence to architecture standards and
    best practices.
  - Conduct code reviews and ensure high-quality, secure, and
    maintainable software delivery.
  - Collaborate with product owners, business analysts, QA
    teams, and infrastructure teams throughout the SDLC.
  - Support production releases, issue triage, root cause
    analysis, and application stability initiatives.
  - Drive CI/CD adoption, automation, and DevOps best practices
    to improve delivery efficiency.
  - Participate in Agile ceremonies including sprint planning,
    estimation, backlog refinement, and retrospectives.
  - Mentor junior developers and contribute to the team's
    technical growth and capability development.
  - Ensure compliance with enterprise architecture, security,
    risk, and regulatory standards.
  - Work closely with global teams to support strategic
    initiatives, platform modernization, and digital
    transformation programs.

  Recommended Qualifications:

  - 10+ years of relevant experience in Apps Development or
    systems analysis role
  - Must have experience in handling Loan IQ Software
    Development Kit
  - Extensive experience system analysis and in programming of
    software applications
  - Experience in managing and implementing successful projects
  - Subject Matter Expert (SME) in at least one area of
    Applications Development
  - Ability to adjust priorities quickly as circumstances
    dictate
  - Demonstrated leadership and project management skills
  - Consistently demonstrates clear and concise written and
    verbal communication

  Education:

  - Bachelor’s degree/University degree or equivalent experience
  - Master’s degree preferred

  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

