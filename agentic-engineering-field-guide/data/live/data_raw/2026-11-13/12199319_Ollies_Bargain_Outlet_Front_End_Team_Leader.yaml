  Position Overview:

  The Retail Front End Team Leader provides leadership for the
  successful operation of the entire front-end of store. The
  Retail Front End Team Leader creates and leads a sales team
  that is passionate about selling merchandise and ensuring a
  good customer experience. Responsibilities include aspects
  of Associate development, customer service, asset protection
  and store maintenance.

  Primary Responsibilities:

  - Oversee front-end, entrance, and exterior standards while
    driving associate productivity, daily task assignment, and
    customer service standards.
  - Assist with managing payroll budgets, expenses, store
    banking, shrink reduction, and related reporting to
    support financial and operational goals.
  - Provide leadership with the Associates regarding all
    donation programs and Ollie’s Army sign-up and membership.
  - Lead monthly safety meetings and ensure follow-up actions
    are completed.
  - Assist with the hiring, development, supervision, and
    scheduling of store Associates to support staffing and
    performance goals.
  - Support merchandising execution and ensure pricing updates
    are completed as required.
  - Perform all Team Leader functions to open and close the
    store when needed and complete additional responsibilities
    as assigned.

   Qualifications:

  - High school diploma or equivalent required.
  - Minimum of 1–2 years of supervisory experience with a mid-
    to large-size retailer.
  - Schedule flexibility to work evenings, weekends, and
    holidays on a regular basis.
  - Positive attitude and team player who interacts well with
    customers and associates.

   Physical Requirements:

  - Ability to lift and carry up to 50 pounds.
  - Ability to push and pull up to 35 pounds.
  - Ability to stand for extended periods and work in a constant
    state of alertness and safe manner.



