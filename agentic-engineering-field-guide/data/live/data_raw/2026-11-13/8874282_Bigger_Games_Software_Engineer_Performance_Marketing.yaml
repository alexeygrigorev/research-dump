description: |
  We're looking for a Software Engineer to join our
  performance marketing team. As a Software Engineer, you’ll
  create and iterate playable ads.

  In this role, you will build high-impact interactive
  experiences that reach millions of players worldwide through
  our marketing channels. You will work at the intersection of
  game development and performance marketing, rapidly
  experimenting, iterating, and bringing ideas to life.

  If you are a passionate Software Engineer who enjoys
  building, testing, and scaling playable ads with real-time
  impact, come and join us!

  ABOUT THIS ROLE:

  - Build high-quality playable ads to reach and engage millions
    of users
  - Have a strong understanding of AI tools to accelerate
    development
  - Design, implement, and iterate on core gameplay mechanics
    tailored for playable ads
  - Collaborate closely with Product Managers, Marketing
    Managers, and Artists to bring creative concepts to life
  - Optimize projects for performance, size, and cross-device
    compatibility
  - Rapidly prototype and test new ideas in a fast feedback loop
    environment
  - Own your projects end-to-end with a strong sense of
    responsibility and impact

  YOU COULD BE A GREAT FIT IF:

  - Bachelor’s Degree in a related field
  - Experience developing with Unity (C#) and HTML5
  - Strong engineering skills and programming fundamentals
  - Understanding of performance optimization and lightweight
    development constraints
  - Experience with AI tools and technologies
  - Experience in developing playable ads is a big plus
  - Knowledge of software architecture design, OOP, and best
    practices in game development
  - Ability to work cross-functionally with marketing and
    creative teams
  - Good sense of gameplay experience and attention to detail
  - 3+ years of industry experience is a plus
