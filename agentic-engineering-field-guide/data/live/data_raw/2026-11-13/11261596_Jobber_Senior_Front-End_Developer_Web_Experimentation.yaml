description: |
  Are you a builder?

  Then Jobber might be the place for you! We're looking for a
  Senior Front-End Developer, Web Experimentation, to join our
  Web Strategy team.

  Jobber exists to help people in small businesses be
  successful. We work with small home service businesses, like
  your local plumbers, painters, and landscapers, to transform
  the way service is delivered through technology. With Jobber
  they can quote, schedule, invoice, and collect payments from
  their customers while providing an easy and professional
  customer experience. Running a small business today isn’t
  like it used to be—the way we consume and deliver service is
  changing rapidly, technology is evolving, and customers
  expect more. That’s why we put the power and flexibility in
  their hands to run their businesses how, where, and when
  they want!

  Our culture of transparency, inclusivity, collaboration, and
  innovation has been recognized by Great Place to Work,
  Canada’s Most Admired Corporate Cultures, and more. Jobber
  has also been named on the Globe and Mail’s Canada’s Top
  Growing Companies list, and Deloitte Canada’s Technology
  Fast 50™, Enterprise Fast 15, and Technology Fast 500™
  lists. With an Executive team that has over thirty years of
  industry experience of leading the way, we’ve come a long
  way from our first customer in 2011—but we’ve just scratched
  the surface of what we want to accomplish for our customers.



  The Role:

  Jobber's website is one of our most important growth engines
  — the place where small home-service businesses first meet
  the product and decide to start a trial. The Web team builds
  and continuously improves getjobber.com, shipping new pages,
  running a high-velocity experimentation program, and pushing
  the limits of what a marketing site can do for conversion,
  SEO, and AI-driven discovery.

  We're looking for a Senior Front-End Developer with deep web
  experimentation experience — to drive high-velocity A/B and
  multivariate testing across our web properties while
  elevating our technical architecture. You'll work across our
  modern Jamstack stack (Next.js, Sanity headless CMS, React,
  TypeScript) as well as our traditional headful WordPress
  platform (PHP, Twig templates), expanding our component
  libraries and engineering high-performance CRO frameworks.
  CMS familiarity is essential: you'll build and optimize
  features across both modern headless APIs and legacy
  PHP/Twig codebases. This is a senior individual-contributor
  role with real technical influence: you'll set
  experimentation standards, mentor developers, and partner
  with the Engineering Manager on quality and site
  performance.

  Just as importantly, we want someone who treats AI-assisted
  development as a core engineering skill. We're actively
  reshaping how we build — using AI coding agents, MCP-
  connected tooling, and automated workflows to move faster
  without sacrificing quality — and we want this person to
  help lead that evolution, not just keep up with it.



  What you'll do:

  Build on a modern front-end stack

  - Engineer across a hybrid web stack — ship production
    features in Next.js, Sanity, and React with TypeScript,
    alongside ongoing support and enhancements for our headful
    WordPress (PHP/Twig) environment across getjobber.com.
  - Contribute to and extend our shared component library and
    design system so the team builds faster on consistent,
    reusable, well-tested foundations.
  - Own performance and accessibility as first-class
    requirements — Core Web Vitals, semantic and accessible
    markup, and fast, resilient page loads that directly
    support conversion.
  - Work seamlessly between headless and traditional CMS
    architectures — integrate APIs and structured content in
    Sanity while maintaining Twig-templated components in
    WordPress as we transition our web ecosystem.
  - Write well-tested, scalable, well-organized code and drive
    consistent engineering practices through code review.
  - Collaborate with our other developers on best technical
    practices and project decisions.

  Push our AI-assisted workflow forward

  - Use AI coding tools and agents fluently (e.g. Claude, AI-
    assisted IDEs, agentic workflows) to accelerate
    development while keeping a critical eye on output quality
    and reliability.
  - Improve how the team works with AI — building and refining
    MCP integrations, prompts, and context so our tickets,
    content, and codebase are AI-ready.
  - Help define and benchmark team standards for AI-assisted
    development — identifying what works, documenting it, and
    raising the whole team's baseline.

  Power experimentation and growth

  - Architect and execute complex A/B and multivariate
    experiments across high-converting marketing flows,
    partnering with CRO leads and data analysts to design
    statistically sound, performant test variants.
  - Build for experimentation velocity and statistical integrity
    — minimize flicker, ensure client/server-side rendering
    accuracy, and reduce time-to-market from test hypothesis
    to live variant.
  - Support experimentation with the technical foundations
    (structured data, performance, rendering) that use best
    practices

  Raise the technical bar

  - Set patterns and technical direction for how we build, and
    bring the team along through pragmatic, well-reasoned
    decisions.
  - Mentor and coach other front-end developers, lifting their
    skills and holding the team to its engineering principles.
  - Partner with the Engineering Manager on technical standards,
    code quality, and architecture
  - Identify and act on opportunities to improve the stack,
    tooling, and processes, and maintain strong team
    documentation.



  To be successful, you should have:

  - Deep front-end expertise. Expert command of HTML, CSS,
    JavaScript/TypeScript, accessibility, and web performance,
    plus several years building production applications.
  - Proven web experimentation & CRO expertise. Hands-on
    experience architecting and shipping complex A/B,
    Multivariate Testing, and personalized web experiments
    with measurable conversion outcomes.
  - Experience with web experimentation and feature flag
    platforms (e.g. Kameleoon, Optimizely, VWO, LaunchDarkly)
    and product analytics tools (e.g. Amplitude, GA4).
  - Strong Jamstack and modern front-end stack. Mastery of
    Next.js, React, TypeScript, and modern rendering
    strategies with a focus on performance and accessibility.
  - Experience working within a design system or maintaining a
    shared component library.
  - Versatile CMS background (Headless Sanity & WordPress/Twig).
    Experience modeling content in headless CMS platforms
    (Sanity/Contentful) alongside hands-on proficiency in
    traditional WordPress, PHP, and Twig templates.
  - Hands-on AI-assisted development. You actively use AI coding
    tools in your day-to-day work and have a point of view on
    where they help, where they don't, and how to use them
    responsibly.
  - A growth and experimentation mindset. You're comfortable
    building for measurement and iteration, and you care about
    the business outcome your code drives.
  - Technical leadership without ego. You set standards and
    mentor others while staying collaborative and open to
    better ideas.
  - Strong communication. You collaborate easily with both
    technical and non-technical partners — designers,
    marketers, and CRO.
  - Ambitious and humble. You don't accept the status quo simply
    because "it's what we've always done" — you push for
    better, newer, more innovative approaches while staying
    grounded.
  - Comfort in the grey areas. You're adaptable, can prioritize
    amid ambiguity and changing priorities, and break large,
    complex problems into shippable pieces.

  Nice to have:

  - Back-end familiarity. Comfort working beyond the front end:
    integrating APIs and services, or background experience
    with full-stack development.
  - Experience collaborating closely with designers in Figma.



  Location:

  We believe great collaboration is intentional, and sometimes
  that means coming together in person to build, brainstorm,
  and connect. To support this, the role is open to candidates
  based in one of our hub cities: Edmonton, Toronto,
  Vancouver, or Kitchener-Waterloo.



  Compensation:

  At Jobber, we believe that compensation should be
  transparent, fair, and reflective of your experience and
  growth. This role has a minimum annual salary of $125,715 a
  midpoint of $147,900, and a maximum salary of $170,085
  designed to show the progression from learning the ropes to
  truly excelling.

  We design our compensation to reflect each new hire’s
  skills, experience against the complexity of the role,
  ensuring a fair and competitive salary. Our range is
  intentionally broad to support growth and long-term impact,
  with fully established hires typically starting around the
  midpoint. The higher end of the range is reserved for those
  who have demonstrated deep expertise and lasting
  contributions, while offers below the midpoint reflect
  strong potential with room to develop. This approach ensures
  that compensation aligns with both an individual’s current
  capabilities and their opportunity for future growth.

  Base salary is just one part of a total compensation package
  that will include equity rewards, annual stipends for health
  and wellness, retirement savings matching, and an extended
  health package with fully paid premiums for body and mind.
  Your professional growth matters to us too! You’ll have
  access to a dedicated talent development program that
  includes career coaching and opportunities for career
  development.

  We believe in transparency and open conversations about
  compensation. If you have any questions about our approach,
  we’re happy to discuss them throughout the hiring process!

  What you can expect from Jobber:

  - A total compensation package that includes an extended
    health benefits package with fully paid premiums for both
    body and mind, matching in RRSP, TFSA or FHSA, and stock
    options.
  - A dedicated Talent Development team and access to coaching,
    learning, and leadership programs to help you grow your
    career, reach your goals, and unlock your full potential.
  - A unique opportunity to build, grow, and leave your impact
    on a $400-billion industry that has no dominant
    player...yet.
  - To work with a group of people who are humble, supportive,
    and give a sh*t about our customers.

  We believe that diverse teams perform better and that
  fostering an inclusive work environment is a key part of
  growing a successful team. We welcome people of diverse
  backgrounds, experiences, and perspectives. We are an equal
  opportunity employer, and we are committed to working with
  applicants requesting accommodation at any stage of the
  hiring process.

  A bit more about us:

  Job by job, we’re transforming the way service is delivered.
  Your lawn care provider, home cleaning service, plumber or
  painter could use Jobber to better connect with their
  customers, save time in the office, invoice faster, and get
  paid! We’re bringing tens of thousands of people together
  with technology to deliver billions of dollars a year in
  services to happy customers. Jobber exists to help make
  these small businesses successful, and when they’re
  successful we all win!
