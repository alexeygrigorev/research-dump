description: |
  Toast creates technology to help restaurants and local
  businesses succeed in a digital world, helping business
  owners operate, increase sales, engage customers, and keep
  employees happy.

  Toast is a rapidly growing company that's revolutionizing
  how the restaurant industry does business by pairing
  technology with an extraordinary commitment to customer
  success. We help restaurants streamline operations, increase
  revenue, and deliver amazing guest experiences through our
  platform that combines restaurant point of sale, team
  management, guest-facing technology, and award-winning
  customer support. Join us as we empower the restaurant
  community to delight guests, do what they love, and thrive.

  We're looking for an engineer to help build and scale
  Toast's earnings platform — systems that calculate tips and
  employee earnings for restaurant locations across Toast's
  network. You'll work on highly visible, mission-critical
  infrastructure that powers Tips Manager, one of Toast's
  growing products, while laying the groundwork for a broader
  earnings calculation platform that will determine paychecks
  for employees everywhere Toast operates.

  In this role, you'll gain hands-on experience with event-
  driven systems built on Kotlin, gRPC, Apache Pulsar, and
  DynamoDB. We're building a new source of truth for employee
  earnings — from real-time tip pooling and redistribution to
  wage calculation and earnings retrieval — and we care deeply
  about getting the math right: our systems directly influence
  what employees take home. If you're excited to build
  calculation infrastructure where correctness and scale
  matter in equal measure, and where the work has a real
  impact on product revenue and employee livelihoods, we'd
  love to hear from you.

  About this roll*:

  As a Software Engineer on our team, you will:

  - Help shape our tip and earnings calculation platform —
    building the systems that determine how restaurant
    employees are paid, starting with Tips Manager and
    expanding toward a full earnings source of truth.
  - Build, run, and improve core backend services alongside a
    collaborative, supportive team.
  - Be a part of the organization with a strong focus on
    engineering culture and full end-to-end ownership.
  - Participate across the full development lifecycle — design,
    estimation, implementation, testing, debugging, and
    deployment — while learning and applying best practices
    for building correct, reliable calculation systems at
    scale.
  - Ship code that directly impacts Tips Manager revenue and the
    accuracy of earnings for restaurant employees across
    Toast's network.
  - Partner with product and design to influence what we build
    and how we build it.
  - Participate in thoughtful code reviews, both giving and
    receiving feedback.

  Do you have the right ingredients*?

  - Experience with one or more object-oriented programming
    languages (such as Java, Kotlin, or similar).
  - An appreciation for precision and correctness — when the
    output drives someone's paycheck, getting the calculation
    right matters.
  - Willingness to monitor, troubleshoot, and improve system
    performance through logging and metrics.
  - Ability and motivation to learn quickly and apply knowledge
    to solve real problems.
  - A hunger to take on challenging problems where correctness
    and scale go hand in hand.

  Above all, we’re looking for a strong engineer with solid
  fundamentals.

  This role is for a current vacancy.

  Leverage cutting edge AI tools to enhance your development
  workflow, improve velocity, and help pioneer new approaches
  to building - contributing to a culture of innovation and
  productivity across the team.

  AI at Toast

  At Toast, one of our company values is that we're hungry to
  build and learn. We believe learning new AI tools empowers
  us to build for our customers faster, more independently,
  and with higher quality. We provide these tools across all
  disciplines, from Engineering and Product to Sales and
  Support, and are inspired by how our Toasters are already
  driving real value with them. The people who thrive here are
  those who embrace changes that let us build more for our
  customers; it’s a core part of our culture.

  Our Total Rewards Philosophy  We strive to provide
  competitive compensation and benefits programs that help to
  attract, retain, and motivate the best and brightest people
  in our industry. Our total rewards package goes beyond great
  earnings potential and provides the means to a healthy
  lifestyle with the flexibility to meet Toasters’ changing
  needs. Learn more about our benefits at
  https://careers.toasttab.com/toast-benefits.

  The base salary range for this role is listed below. The
  starting salary will be determined based on skills,
  experience, and geographic location. In addition to base
  salary, our total rewards components include cash
  compensation (overtime, bonus/commissions if eligible),
  equity, and benefits.

  Pay Range

  $100,000—$147,000 CAD

  How Toast Uses AI in its Hiring Process

  Throughout the hiring process, our goal is to get to know
  you. We use AI tools to support our recruiters and
  interviewers with tasks like note-taking, summarization, and
  documentation of interviews to ensure they can be fully
  focused on your conversation. All hiring decisions are made
  by people. We ask that you complete interviews and
  assessments on your own, without real-time AI tools,
  recording, or transcription bots, unless we tell you
  otherwise in advance. To learn more:
  https://careers.toasttab.com/ai-in-hiring

  Our Approach to Hybrid Working We embrace a hybrid work
  model that fosters in-person collaboration while valuing
  individual needs. Our goal is to build a strong culture of
  connection as we work together to empower the hospitality
  community, regardless of location. Please visit the
  Locations page on our career site to learn more about our
  in-office expectations by region:
  https://careers.toasttab.com/locations-toast

  People Are the Secret Ingredient in Our Recipe for Success

  At Toast, our employees are our secret ingredient—when they
  thrive, we thrive. The restaurant industry brings together
  people with a wide range of backgrounds, experiences, and
  perspectives, and we value that same breadth at Toast. We
  strive to build a culture grounded in authenticity, respect,
  and humility, where every Toaster has a real opportunity to
  grow, contribute, and do their best work—raising the bar in
  delivering exceptional experiences for our customers and
  each other.

  Apply today!

