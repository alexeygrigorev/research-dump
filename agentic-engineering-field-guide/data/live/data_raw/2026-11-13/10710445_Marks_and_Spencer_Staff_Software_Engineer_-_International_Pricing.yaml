description: |
  As part of the M&S Software Engineering team, you’ll be
  joining a well-loved, historic brand, working on solutions
  that serve millions of loyal customers and thousands of
  colleagues. With ethical values running through the
  company’s core, and technology leaders who truly understand
  software engineering, it’s an exciting time to join us as we
  redefine ourselves as a digital-first, engineering-led
  organisation. The quality of our engineering team is a key
  differentiator.

  This role sits within the International Pricing team,
  supporting M&S’s International business across stores and
  online markets outside the UK and Ireland. This is central
  to M&S’s ambitious global expansion plans. Your expertise
  will help us on this journey, creating solutions for the
  business that are robust, scalable and secure, with strong
  observability, clear metrics and best-in-class engineering
  practices. You’ll play a key role in designing and evolving
  the platforms and integrations that enable international
  pricing capabilities across multiple markets and channels.

  Due to high interest, this role may close earlier than
  advertised. We recommend applying as soon as possible.

  What You'll Do

  Your key accountabilities will include:

  - Develop, test and debug high-quality software solutions,
    leading by example and championing engineering best
    practices across the team.
  - Provide technical leadership on complex projects, ensuring
    software solutions align with technology strategy,
    architectural principles and engineering standards.
  - Lead the design and implementation of scalable software
    solutions and third-party integrations, partnering closely
    with Architecture teams to deliver adaptable and resilient
    systems.
  - Conduct thorough code reviews to ensure maintainability,
    automated testing coverage, technical quality and
    adherence to engineering standards while fostering a
    culture of continuous improvement.
  - Collaborate with product managers, business stakeholders and
    engineers to understand business challenges and deliver
    effective technical solutions.
  - Mentor and coach engineers at all levels, sharing knowledge
    and creating opportunities for technical growth and
    development.
  - Drive operational excellence through effective monitoring,
    alerting, incident management and continuous learning from
    production events and operational insights.

  Who You Are

  Your skills and experience will include:

  - Proven track record developing high-performing, robust
    backend systems and integrations, with a focus on
    optimisation, scalability and reliability.
  - Deep understanding of software engineering principles,
    patterns and best practices, applied to the development of
    maintainable, adaptable and resilient solutions.
  - Strong understanding of automated testing strategies and
    tools, and how they should be applied across unit,
    integration and system testing levels.
  - Proven hands-on experience implementing DevSecOps practices
    at scale across enterprise applications and technology
    platforms.
  - Technical proficiency across a variety of programming
    languages and technologies, including Java, PL/SQL,
    JavaScript and modern CI/CD tooling.
  - Experience designing and implementing scalable cloud-native
    applications with a strong focus on performance,
    resilience, observability and security.
  - Excellent communication skills with the ability to explain
    complex technical concepts to both technical and non-
    technical audiences.
  - A mentoring mindset with a genuine passion for sharing
    knowledge, raising engineering standards and helping
    others develop.
  - Knowledge of AI/ML technologies and GenAI tools such as
    Copilot, with practical experience implementing AI-enabled
    tools and agents across the software development
    lifecycle.

  Desirable Experience

  - Knowledge of the retail domain would be advantageous but is
    not essential.
  - Experience working within international commerce, pricing,
    commercial systems or large-scale enterprise integration
    environments would be beneficial.
  - Familiarity with event-driven architectures, cloud-native
    technologies and distributed systems at scale.

  Tech Stack

  The team uses a variety of technologies, including:

  - Languages & Frameworks: PL/SQL, Java (Spring Boot), Python,
    AI/ML technologies.
  - Cloud & Infrastructure: Azure IaaS and PaaS services,
    Docker, Kubernetes, Helm and Terraform.
  - Data & Messaging: Kafka/Confluent, IBM MQ/MQFTE and SFTP.
  - Databases: MongoDB and SQL Server on Azure.
  - API & Integration: Apigee, REST APIs and Windows Services.
  - Observability: Dynatrace, OpenTelemetry, PagerDuty and
    Helix.

  What’s in it for you?

  Working at M&S means being part of something bigger –
  helping to deliver quality, value and service to millions of
  customers every day. We’re inclusive, fast-moving and always
  evolving, with a strong sense of purpose and a focus on
  doing the right thing.

  Here are just a few of the benefits that make working here
  even more rewarding:

  - 20% colleague discount on all M&S products and many third-
    party brands for you and someone in your household,
    available once you’ve completed your probation.
  - Competitive holiday allowance with the option to buy more.
  - Discretionary bonus schemes linked to your performance and
    ours.
  - Strong pension and life assurance to help plan for the
    future.
  - Tailored induction and training to support your development
    from day one.
  - Exclusive perks and savings through our M&S Choices portal.
  - Market-leading family policies, including parental, adoption
    and neonatal leave.
  - 24/7 wellbeing support, including virtual GP access and
    mental health services.
  - One paid volunteer day a year to support a cause that
    matters to you.

  Everyone’s Welcome

  We are ambitious about the future of retail. We’re
  disrupting, innovating and leading the industry into a more
  conscientious, inspiring digital era. We’re transforming how
  we work together and offering our most exciting
  opportunities yet. Marks & Spencer strives to be an
  inclusive organisation, trusted and admired by our
  colleagues, customers and suppliers. Join us and make change
  happen.

  We are committed to building diverse and representative
  teams, where everyone can bring their whole selves to work
  and be at their best. We support each other and work
  together to win together.

  If you feel you'd benefit from any support or reasonable
  adjustments during any stage of the recruitment process,
  please don’t hesitate to let us know when completing your
  application. This information will be picked up by our team,
  so we can try and put steps in place to help you be at your
  best through this process.

