description: |
  We are so glad you are interested in joining Sutter Health!

  Organization:

  SHSO-Sutter Health System Office-Bay

  Position Overview:

  The Revenue Cycle Front-End Performance Manager serves as
  the operational leader responsible for improving front-end
  revenue cycle performance across ambulatory service lines.
  This position partners directly with operational leadership
  to drive point-of-service (POS) copay collection
  performance, reduce avoidable write-offs and bad debt,
  improve registration and insurance data quality, and
  strengthen revenue integrity. The Manager provides ongoing
  operational support, performance oversight, workflow
  standardization, education, and consultative guidance to
  service lines. Through collaboration with Patient Access,
  clinic operations, and Revenue Cycle teams, this role
  identifies revenue leakage, addresses front-end process
  failures, and implements sustainable improvements that
  enhance financial performance and the patient experience.

  Job Description:

  EDUCATION: Equivalent experience will be accepted in lieu of
  the required degree or diploma. Bachelor's: Business
  Administration, Healthcare or related field TYPICAL
  EXPERIENCE: 5 years of recent relevant experience. SKILLS
  AND KNOWLEDGE: Current knowledge in the areas of patient
  registration, billing, accounts receivable (AR) and cash
  management requirements, managed care contractual terms and
  requirements, health insurance practices, industry
  regulatory requirements, business office operations, AR and
  financial reporting technology, wage and hour regulations,
  and industry standards for healthcare revenue resolution
  management practices. Ability to analyze and resolve
  problems that affect the claim submission process,
  regardless of whether the problem originates in an area
  under direct or indirect control. Financial management
  skills, including the ability to financially analyze data
  for operations, auditing, forecasting; staffing and
  financial reporting skills. Organizational and time
  management skills, with the ability to prioritize multiple
  projects while delivering quality service and achieving
  business results. Verbal and written communication, and
  interpersonal skills. Demonstrates tactical and analytical
  thinking and planning skills, and is able to develop plan to
  accomplish objectives, identify obstacles and resolve
  operational issues.

