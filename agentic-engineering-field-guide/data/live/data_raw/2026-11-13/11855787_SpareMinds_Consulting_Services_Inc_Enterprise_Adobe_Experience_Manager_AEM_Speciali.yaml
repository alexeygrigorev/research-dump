description: |
  Placement Type: Future Contract Assignments via Spareminds
  (Licensed Temporary Help Agency)

  Duration: Typically 6–12 months per project assignment (with
  potential extensions)

  Location: Remote / Hybrid options available (Dependent on
  final client requirements)

  Focus: Modern AEM architecture, headless/hybrid
  implementations, cloud-native digital experience management,
  and automated Adobe Cloud Manager CI/CD pipelines.

  💰 Compensation: Highly competitive hourly contract rates,
  negotiable based on chosen tax structure (Track A: T4 vs.
  Track B: B2B incorporated status).

  📋 Regulatory Notice & Transparency: SpareMinds Consulting
  Services Inc. is an officially licensed Temporary Help
  Agency in the Province of Ontario. This evergreen posting is
  specifically for our active Technical Assignment Roster to
  support upcoming, high-priority digital projects across our
  enterprise financial services network. Per provincial
  regulations, SpareMinds never charges candidates any fees
  for application, registration, or placement.

  Key Responsibilities by Stream

  We are building a comprehensive pool of AEM experts across
  four distinct technical disciplines. Depending on your
  specialization, your responsibilities will include:

  🧩 1. AEM Core Developer (Back-end Focus)

  - OSGi & Backend Logic: Develop, maintain, and optimize custom
    OSGi services, bundles, configurations, and components
    using Java.
  - API & Data Layer: Write robust Apache Sling Servlets,
    models, and custom workflows to handle backend application
    logic and content syndication.
  - Repository Architecture: Maintain and optimize JCR (Oak)
    repository structures, access controls, and perform
    efficient query tuning.

  🎨 2. AEM Front-end Developer (UI Focus)

  - Component Development: Build responsive, modular, and
    dynamic UI components utilizing HTL (Sightly) and modern
    CSS/HTML5 structures.
  - Asset & Styling Management: Set up, optimize, and maintain
    complex Clientlibs structures, ensuring clean dependency
    management.
  - Modern Web Architectures: Implement headless and hybrid
    digital experiences using the AEM SPA Editor framework in
    conjunction with modern frontend libraries
    (React/Angular).

  📐 3. AEM Architect (System Design & Integration)

  - Cloud Topologies: Design end-to-end enterprise AEM
    environments, topology patterns, and large-scale
    integration frameworks.
  - Modernization Strategies: Direct the technical migration
    paths from legacy systems (AEM 6.5) to AEM as a Cloud
    Service (AEMaaCS).
  - Governance: Set enterprise-wide development standards,
    custom governance models, and multi-tenant structures
    across global web properties.

  🚀 4. AEM DevOps Engineer (Infrastructure Focus)

  - Caching & Security: Configure, secure, and fine-tune
    Dispatcher caching mechanisms, rewrite rules, and security
    filters.
  - Deployment Automation: Architect and manage automated CI/CD
    pipelines natively within Adobe Cloud Manager.
  - Cloud Operations: Monitor environment health, manage Cloud
    Manager configurations, and coordinate seamless
    deployments across staging and production instances.

  Required Qualifications

  🌟 Core Requirements (All Roles)

  - Experience: 5+ years of professional software development or
    infrastructure experience.
  - AEM Mastery: Proven track record working with Adobe
    Experience Manager environments (AEM 6.5 or AEMaaCS).
  - Delivery Standards: Professional experience writing robust
    documentation and working within collaborative agile
    environments.

  🛠️ Role-Specific Prerequisites

  - For Core Devs: Advanced Java capabilities, deep
    understanding of Apache Sling/Felix frameworks, and OSGi
    architectural principles.
  - For Front-end Devs: Masterful knowledge of HTL/Sightly,
    native JavaScript, modern framework integration (React),
    and page-speed performance optimization.
  - For Architects: Proven leadership in system design, large
    enterprise asset migrations, and managing AEM Cloud
    integrations with third-party software.
  - For DevOps Engineers: Deep understanding of web server
    infrastructures (Apache/IIS), advanced Dispatcher rules
    matching, Maven build scripts, and Adobe Cloud Manager
    configurations.
