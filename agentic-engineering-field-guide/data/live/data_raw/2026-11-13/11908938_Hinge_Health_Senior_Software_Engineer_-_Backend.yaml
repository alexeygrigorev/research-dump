description: |
  About the Role

  Hinge Health is a digital health company focused on
  delivering evidence-based solutions for musculoskeletal
  (MSK) pain. By combining personalized exercise therapy with
  virtual care, Hinge Health helps people manage and reduce
  chronic pain while improving quality of life and reducing
  healthcare costs.

  The Financial Systems team builds and operates the billing
  and financial infrastructure that powers how Hinge Health
  makes money. Our systems support the movement of revenue-
  critical data across products, payers, and internal
  financial workflows. As Hinge Health expands into new
  products such as HingeSelect, introduces more complex
  payment models, adds multi-payer integrations, and grows
  globally, we need engineers who can build systems that are
  correct, observable, secure, and resilient at scale.

  We are looking for a Backend Software Engineer who is
  excited to work on high-impact financial systems where
  correctness and reliability matter. You will help design the
  technical foundations for billing and financial workflows,
  improve the traceability of money-related data, and make it
  easier for our product, operations, and Finance partners to
  deliver a seamless experience for members and customers.

  The ideal candidate thrives in cross-functional
  collaboration, is comfortable with ambiguity, and takes a
  systems-thinking approach to problems involving data
  integrity, integrations, operational workflows, and long-
  term maintainability. You care about the details, understand
  the customer impact of financial systems, and take ownership
  from design through production operation.

  Backend engineers at Hinge Health contribute to their team’s
  success by architecting and implementing end-to-end
  solutions, well-tested and performant APIs, and durable data
  models. You will profile systems to stay ahead of scaling
  bottlenecks, participate in thoughtful and constructive code
  reviews, and help maintain a high engineering bar.

  We practice continuous deployment and expect owner-operators
  to support the systems they build in production. Our
  production systems rely on Golang, gRPC, AWS, Postgres,
  Redis, and Temporal. Our workflow is trunk-based CI/CD, and
  our security and compliance posture reflects the standards
  required for healthcare, including HIPAA, HITRUST, SOC 2,
  and CCPA.

  What You’ll Accomplish

  - Deliver large projects across billing and financial
    workflows, often acting as a maintainer for key code
    repositories.
  - Design and evolve reliable services, APIs, and data models
    for revenue-critical systems, including billing flows,
    payment-model changes, payer integrations, and financial
    data movement.
  - Build for correctness and traceability by establishing clear
    data ownership, durable workflows, idempotent processing,
    strong validation, and actionable audit and operational
    signals.
  - Break down complex, cross-functional problems into
    manageable tasks, enabling steady delivery while
    identifying and resolving root causes of incidents and
    data discrepancies.
  - Collaborate with Product, Finance, Operations, Data, and
    partner engineering teams to define requirements, roadmap
    technical strategy, and balance short-term delivery with
    long-term system health.
  - Improve the maintainability, availability, performance, and
    observability of financial systems, including developer
    tooling and operational runbooks.
  - Mentor and support junior engineers through thoughtful code
    reviews, pairing, design feedback, and knowledge sharing.
  - Communicate technical ideas clearly to technical and non-
    technical partners, and document decisions and workflows
    so they remain understandable as the team grows.
  - Integrate and leverage AI technologies to automate
    engineering and operational processes and enhance product
    capabilities, while preserving appropriate review and
    control for financial workflows.
  - Participate in the team’s weekly on-call rotation, helping
    ensure the reliability and timely support of the systems
    we build.

  Basic Qualifications

  - Bachelor’s degree, or equivalent experience, in Computer
    Science, Engineering, or a related technical field.
  - 3+ years of non-internship, full-time professional software
    development experience.
  - 2+ years of experience with at least one programming
    language.
  - 2+ years of experience across the full software development
    life cycle, from design through production support.
  - Experience delivering large software projects or features in
    a production environment.
  - Proficiency in at least one modern programming language,
    such as Golang, Python, Java, or JavaScript/TypeScript.
  - Experience designing and operating backend services, APIs,
    data models, and asynchronous or distributed workflows.
  - Experience working with relational databases and
    integrations where data integrity, failure handling, and
    observability are important.
  - Demonstrated ability to work effectively with cross-
    functional partners and communicate technical trade-offs
    clearly.

  Preferred Qualifications

  - Experience building billing, payments, revenue, accounting,
    claims, or other financial systems.
  - Familiarity with distributed systems, event-driven
    architectures, workflow orchestration, and scalable cloud
    services.
  - Experience with Golang, Python, gRPC, Postgres, Redis,
    Temporal, AWS\
  - Experience improving data quality, operational visibility,
    incident response, or developer tooling for critical
    systems.
  - Experience mentoring or onboarding junior engineers.
  - Experience with AI technologies for software design, coding
    assistance, or process automation.

  Beware of Phishing Attempts: We've noticed an increase in
  phishing where fraudsters impersonate employees and send
  fake job offers to steal sensitive information. We'll never
  ask for financial details during the hiring process and only
  use "@hingehealth.com" emails. If you receive a suspicious
  offer, stop communication and report it to the US FBI
  Internet Crime Complaint Center. To verify an email from our
  recruiting team, forward it to security@hingehealth.com.
