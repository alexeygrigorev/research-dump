description: |
  Get to Know Us

  Horizon3 is a fast-growing, remote cybersecurity company
  dedicated to the mission of enabling organizations to
  proactively find, fix and verify exploitable attack vectors
  before criminals exploit them. Our flagship product, the
  NodeZero™ platform, delivers production-safe autonomous
  pentests and other key assessment operations that scale
  across the largest internal, external, cloud, and hybrid
  cloud environments. NodeZero has been adopted by
  organizations of all sizes, from small educational
  institutions to government agencies and Global 100
  enterprises. It is used by IT Ops/SecOps teams, consulting
  pentesters, and MSSPs and MSPs.

  We are a fusion of former U.S. Special Operations cyber
  operators, startup engineers & operators, and formerly
  frustrated cybersecurity practitioners. We're committed to
  helping solve our common security problems: ineffective
  security tools and false positives, resulting in alert
  fatigue, blind spots, "checkbox" security culture,
  cybersecurity skills shortage, and the long lead time and
  expense of hiring outside consultants. Collectively, we are
  a team of learn-it-alls, committed to a culture of respect,
  collaboration, ownership, and results.

  About the Role

  We are looking for a Staff Software Engineer to join our
  Core Front-End team and help shape the future of the user
  experience across the Horizon3 NodeZero platform.

  This is not a traditional feature team role. The Core Front-
  End team operates as a central front-end architecture and
  enablement group responsible for driving the long-term
  scalability, consistency, performance, and usability of the
  NodeZero platform. You will work across multiple product
  areas and partner closely with Product, Design, Front-End,
  Back-End, Platform, and Security Engineering teams to define
  and implement modern user experiences at scale.

  As a Staff Engineer, you will lead complex technical
  initiatives that span multiple teams and systems. You will
  help define architectural direction, establish engineering
  standards, improve developer workflows, and guide the
  evolution of our front-end platform and design system. You
  will also play a key role in mentoring engineers,
  influencing technical strategy, and accelerating engineering
  effectiveness across the organization.

  This role is ideal for engineers who enjoy solving ambiguous
  problems, influencing technical direction beyond their
  immediate team, and building systems that enable other
  engineers to move faster.

  What You’ll Do

  Technical Leadership & Architecture

  - Drive front-end architecture decisions across the platform
  - Design scalable, maintainable, and reusable UI systems and
    application patterns
  - Lead large cross-functional initiatives involving multiple
    engineering teams
  - Identify and reduce technical debt across shared front-end
    infrastructure
  - Define and evolve front-end best practices, standards, and
    engineering guidelines
  - Improve application reliability, observability,
    accessibility, and performance
  - Partner with Design to improve consistency and usability
    across the product
  - Help shape the long-term technical vision for the front-end
    platform

  Platform & Developer Experience

  - Improve shared tooling, component systems, and developer
    workflows
  - Drive improvements in CI/CD pipelines, testing strategy,
    local development experience, and review environments
  - Build reusable frameworks and abstractions that accelerate
    feature development across teams
  - Collaborate on front-end performance optimization and
    platform-wide UX improvements
  - Help standardize approaches across teams while balancing
    flexibility and autonomy
  - Collaborate with Product Designers on aligning the UI
    component library (including patterns and templates) to
    the latest version of the Design System, while ensuring
    that the components can be re-used for Claude Code
    Prototyping by Designers

  Engineering Execution

  - Contribute hands-on production code in React and TypeScript
  - Review code and provide high-quality technical feedback
  - Collaborate closely with Product Managers, Designers, and
    Engineers throughout the development lifecycle
  - Participate in technical planning, roadmap discussions, and
    architecture reviews
  - Help unblock teams and provide technical guidance for
    complex implementation challenges

  Mentorship & Influence

  - Mentor engineers across multiple teams
  - Raise the engineering bar through technical leadership and
    collaboration
  - Influence engineering culture, review quality, and
    development practices
  - Act as a trusted technical partner for both engineering and
    product leadership
  - Help grow future technical leaders and architects within the
    organization

  What We’re Looking For

  Required Qualifications

  - 8+ years of experience building modern web applications used
    in production at scale
  - Deep expertise in JavaScript/TypeScript and React
  - Strong understanding of modern front-end architecture and
    application design
  - Experience leading large technical initiatives across
    multiple teams
  - Experience designing reusable component systems and scalable
    UI patterns
  - Strong knowledge of application state management,
    asynchronous data flows, and API integration patterns
  - Experience improving front-end performance, reliability, and
    maintainability
  - Strong debugging and problem-solving skills across both
    front-end and full-stack systems
  - Excellent written and verbal communication skills
  - Experience mentoring engineers and influencing technical
    direction
  - Ability to thrive in fast-moving, highly collaborative
    environments with evolving priorities

  Preferred Qualifications

  - Experience building platforms, frameworks, or shared
    engineering infrastructure
  - Experience with GraphQL and modern API-driven architectures
  - Experience working in a monorepo environment
  - Experience with modern build systems and tooling
  - Familiarity with cloud-native environments and AWS
  - Experience with observability and monitoring tools such as
    Datadog
  - Experience working closely with Product Design and Design
    Systems
  - Startup experience, particularly in high-growth environments
  - Cybersecurity or offensive security domain experience
  - Experience leveraging AI-assisted development workflows and
    engineering tooling

  Our Front-End Stack

  - React
  - TypeScript
  - GraphQL
  - GitLab
  - AWS
  - Modern CI/CD pipelines
  - Design systems and shared component libraries

  What Success Looks Like

  - Engineering teams can move faster because of the systems and
    foundations you build
  - Front-end experiences become more scalable, consistent, and
    maintainable
  - Architectural decisions improve long-term product velocity
  - Shared standards and tooling reduce friction across teams
  - Engineers across the organization seek your guidance for
    complex technical challenges
  - You help shape the future direction of the platform, not
    just individual features

  Travel Required

  We are a fully remote company, and this job may require up
  to 5% of travel to be successful.



  Compensation and Values

  At Horizon3, we believe that our people are our greatest
  asset, and our compensation philosophy reflects this core
  value. We are committed to fostering an environment where
  all employees feel valued, respected, and rewarded for their
  contributions. Our compensation structure is designed to be
  fair, competitive, and transparent, ensuring that every team
  member is recognized and compensated equitably across roles,
  levels, and locations.

  In accordance with various State's transparency regulations,
  we provide the following salary range information for this
  position:

  - Base salary range: $199,750 - $260,000 annually. The exact
    salary will be determined based on the selected
    candidate's location, qualifications, experience, and
    relevant skills.
  - Additional compensation: All full-time roles are eligible
    for an equity package in the form of stock options.



  Perks of Horizon3

  - Inclusive Team: We value diversity and promote an inclusive
    culture where everyone can thrive.
  - Growth Opportunities: Be part of a dynamic and growing team
    with numerous career development opportunities.
  - Innovative Culture: Work in a collaborative environment that
    encourages creativity and out-of-the-box thinking.
  - Hybrid & Remote Work: We embrace a mix of remote and hybrid
    work models depending on role and location, including our
    Chicago office, where some roles require regular in-office
    presence.
  - Competitive Compensation: We offer competitive salary,
    equity and benefits. Our benefits include health, vision &
    dental insurance for you and your family, a flexible
    vacation policy, and generous parental leave.



  You Belong Here

  Horizon3 is not just an equal opportunity employer - we are
  a community that values diversity, equity, and inclusion as
  fundamental principles of our culture and success. We are
  dedicated to fostering a workplace where everyone feels
  welcome and respected, regardless of race, color, religion,
  sex, national origin, age, disability, veteran status,
  sexual orientation, gender identity or expression, genetic
  information, marital status, or any other legally protected
  status by law.

  Our commitment to diversity and inclusion means we strive to
  attract, develop, and retain a workforce that reflects the
  varied communities we serve. We believe that diverse
  perspectives drive innovation and strengthen our ability to
  create cutting-edge cybersecurity solutions. At Horizon3,
  every team member is valued and supported in an environment
  that encourages personal and professional growth.

  We welcome candidates from all backgrounds and experiences,
  and we encourage all qualified individuals to apply. Come be
  a part of Horizon3, where your unique contributions are
  recognized, and your potential is limitless.



