  PowerUs is the #1 career platform for skilled blue-collar
  workers from apprenticeships (electricians, mechanics). We
  help our users to develop further in their careers and
  companies to find, hire and retain the best talent.

  Skilled blue-collar workers are the most important missing
  piece to solve the energy transition to renewable energies
  like solar. By using our platform, users can go into these
  new and exciting industries while earning up to 50% more.

  Since our foundation, we are keeping our increasing pace
  with the support of renowned investors such as Y Combinator
  and HV Capital, as well as successful business angels like
  the VP Engineering from Dropbox or founders of Personio and
  Flixbus.

  In order to be able to grow even faster, we are looking for
  talented software developers to help us to carry PowerUs to
  the next level.

  Job Description

  Tasks

  - Implementing full-stack solutions to meet our users need
  - Support the development teams in setting up and expanding
    continuous integration pipelines
  - Supporting the integration and selection of existing cloud
    platform services. Helping to scale our infrastructure to
    multiple countries
  - Follow and iterate on engineering best practices to achieve
    a robust code base, e. g. through code reviews and unit
    tests
  - Identify and proactively address challenges on the product,
    driving complex technical decisions within your peer group
  - Collaborate closely with Product and Design to build new
    features
  - Improving the code architecture and delivering high-value
    solutions
  - Manage individual projects and take ownership
  - Bug fixing

  Qualifications

  - Bachelor's or Master's degree in Computer Science /
    Engineering or related fields
  - Great skill in analytical thinking
  - Self-motivated and communicative
  - At least 3 years of total experience working on backend and
    frontend
  - Experience with automation, continuous integration, cloud
    services, and Docker.
  - Preferably experience with our tech stack: Angular, Nest,
    Typescript, Nx, MongoDB, Jest, Docker, Digital Ocean,
    Drone.
  - Deep understanding and practical experience working with
    agile software development practices
  - Fluent English language skills
