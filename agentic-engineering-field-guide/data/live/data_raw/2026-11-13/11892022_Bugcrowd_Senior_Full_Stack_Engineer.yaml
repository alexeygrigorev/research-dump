description: |
  Founded in 2012, Bugcrowd is the preemptive security
  platform that unifies exposure discovery and assessment,
  offensive testing, and intelligence shaped by AI and human
  insight to help organizations avoid, discover, and validate
  real-world risk. Bugcrowd helps security teams move faster
  by identifying the exposures that matter most so they can
  act first and stay ahead of attackers. By combining the
  power of humans and AI, teams can preempt attack paths and
  prevent breaches. Based in San Francisco and New Hampshire,
  Bugcrowd is supported by General Catalyst, Rally Ventures,
  Costanoa Ventures, and others. Visit www.bugcrowd.com.

  This is a seasoned engineer role in which you lead technical
  efforts across multiple teams or subsystems, owning system
  architecture and development across the stack. A Senior
  Software Engineer drives technical innovation, acts as a
  mentor and process advocate, driving improvements that scale
  beyond a single team. You will exercise high discretion over
  technical decisions and influence department-level business
  outcomes. You will set the architectural direction for the
  systems you own, make and document the key design tradeoffs,
  and provide strong leadership within and across scrum teams
  to deliver on that vision. This role will partner with
  cross-functional teams to build and scale critical security
  products engineered specifically for offensive cyber
  capabilities (DoW) and healthcare programs (HHS).

  Essential Duties and Responsibilities

  - Proactively research, prototype, and introduce technologies
    and  system designs for green-field products.
  - Lead the design of new systems and major changes to existing
    ones: write design docs, evaluate alternatives, and
    document tradeoffs and decisions (e.g., ADRs)
  - Primary IC for green-field product, ensuring long-term code
    maintainability, readability, and extensibility.
  - Continuously evolve team processes, driving scalable
    improvements in delivery, quality, and collaboration.

  API & Integration

  - Design, develop, and maintain scalable and secure APIs, UIs
    and integration services.
  - Implement RESTful, RPC, and event-driven APIs/UIs for
    internal and external systems.
  - Collaborate with product, data, and platform teams to ensure
    seamless system interoperability.
  - Manage API lifecycle including versioning, authentication,
    monitoring, and performance optimization.
  - Develop and maintain integration pipelines between SaaS
    systems, data sources, and third-party applications.
  - Troubleshoot integration issues, conduct root cause
    analysis, and implement fixes.
  - Support continuous improvement through automation,
    observability, and best practices.

  Education, Experience, Knowledge, Skills, and Abilities

  - 5+ years of experience of software development experience
  - Strong proficiency in TypeScript and modern JavaScript.
  - Extensive experience with React and JavaScript web
    development frameworks (Next.js preferred)
  - Experience with ORM frameworks and relational databases,
    including data modeling and provenance tracking patterns
    (Prisma, Drizzle, PostgreSQL)
  - Experience building long-running, fault-tolerant workflows
    with durable execution engines (Inngest, Temporal, or
    similar)
  - Hands-on experience integrating state-of-the-art LLMs into
    production systems, including agent design, tool use, and
    evaluation
  - Strong understanding of integration patterns, and
    experiencing building external API integrations (pub/sub,
    webhook, ETL, etc.).
  - Excellent debugging, analytical, and problem-solving skills.

  Preferred Experience

  - Bachelor’s degree in Computer Science, Software Engineering,
    or related field.

  Working Conditions and Physical Requirements

  The ideal candidate must be able to complete all physical
  requirements of the job with or without reasonable
  accommodation. Sitting and / or standing - Must be able to
  remain in a stationary position 50% of the time Carrying and
  / or lifting - Must be able to carry / move laptop as needed
  throughout the work day. Environment - remote, work-from-
  home 100% of the time with travel to client sites

  Pay Range Disclosure

  At Bugcrowd, we strive for fairness, equality and to create
  an environment that allows our people to perform at their
  very best. Our compensation philosophy is to foster a
  collaborative community that rewards, attracts and retains
  the best possible talent. The provided salary details are
  based on US national averages and we retain the flexibility
  to tailor to the needs of the business.

  The national estimate for the current base range for the
  position of Senior Full Stack Engineer is: $140,400 -
  $175,500.

  This position may also be eligible to participate in a
  discretionary bonus program or commission plan, subject to
  the rules governing the program, whereby an award, if any,
  depends on various factors, including, without limitation,
  individual and organizational performance.

  Culture

  - At Bugcrowd, we understand that diversity in the workplace
    is vital to a company’s success and growth. We strive to
    make sure that people are included and have a sense of
    being part of making Bugcrowd not only a great product but
    a great place to work.
  - We regularly hear from both customers and researchers that
    Bugcrowd feels like a family, and we strive to maintain
    that internally as well.
  - Our team consists of a broad range of people: musicians,
    adventure sports junkies, nature lovers, parents, cereal
    enthusiasts, night owls, cyclists, artists—you get the
    point.

  At Bugcrowd, we are solving security threats and
  vulnerabilities that are relevant to everyone, therefore we
  believe solving these problems takes all kinds of
  backgrounds. We value the perspectives and experiences
  people from underrepresented backgrounds bring.

