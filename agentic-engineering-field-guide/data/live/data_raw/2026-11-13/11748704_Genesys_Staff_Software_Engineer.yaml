description: |
  Be the one building AI-powered experiences where they matter
  most.

  At Genesys, we help organizations create better customer
  experiences through AI-powered experience orchestration. Our
  platform connects people, systems, data and AI to help
  organizations deliver more personalized service, improve
  operational efficiency and build stronger customer
  relationships.

  Help build, support and operate technology used by more than
  8,000 organizations in over 100 countries – moving AI from
  possibility to production in real-world enterprise
  environments every day.

  Job Title: Staff Software Engineer

  Department: AI Group

  Summary:

  The Staff Software Engineer will be responsible for the
  development of components and services used to deliver
  mission critical cloud products. They will work in a fast-
  paced cloud-based environment where continuous change,
  innovation and experimentation are all encouraged. They will
  work with technologies like Java, Redis, Amazon Web
  Services, New Relic and Jenkins, among others. They will
  iteratively deliver software in a true DevOps model
  following CI/CD and agile best practices.

  Additionally, they will demonstrate mastery in one or more
  of these technologies and will be an expert in distributed
  systems. They will be a leader, mentor and role model for
  their peers and juniors.

  Key Responsibilities:

  ·       Design and develop high quality, efficient, testable
  software to implement key product features.

  ·       Ownership of features beginning to end from design
  documents and reviews to acceptance testing and deployment.

  ·       Understand, and contribute to the evolution of, the
  overall architecture of the system and the wider ecosystem.

  ·       Work across teams to lead feature development that
  spans several microservices

  ·       Actively contribute input and direction to the
  Product roadmap.

  ·       Resist poor or short-term solutions, instead
  favouring pragmatic, incremental enhancements that work
  toward long-term goals

  ·       Review code and provide feedback relative to best
  practices, improve readability and anticipate issues.

  ·       Research, benchmark, and prototype new TTS and STT
  engines and models, comparing them on accuracy, latency,
  naturalness, language coverage, cost, and operational fit

  ·       Work with the Engineering Manager to assess
  architectural implications of supporting new tech in the
  stack

  ·       Act as a mentor to other members of the team.

  ·       Apply processes appropriately for data security,
  traceability and information sharing.

  Minimum Requirements:

  ·       Degree in Computer Science, Software Engineering, or
  related work experience.

  ·       Excellent programming skills, particularly in Java.

  ·       7+ years of experience in Software Engineering.

  ·       Working experience with REST API back-end services

  ·       Expert level understanding of object-oriented
  programming & design.

  ·       Proactive, self-driven, and possessing a growth
  mindset.

  ·       Effective verbal and written communicator

  ·       Strong collaboration and listening skills

  Desirable Skills:

  ·       Cloud Native application development, preferably AWS
  based.

  ·       Familiarity with Voice Bot Platforms and Voice
  concepts.

  ·       Understanding of Microservices architecture
  principles and best practices.

  ·       Experience working with remote engineering teams

  ·       Working on research projects, taking high level
  direction and turning that into meaningful demos or proofs
  of concept.

