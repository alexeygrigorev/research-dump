  Senior Software Engineer, Backend - Platform (Tokens &
  Wrapped Assets)



  We're hiring a Senior Software Engineer to join the Tokens &
  Wrapped Assets team within the Platform organization. This
  team builds and operates the platform that issues, wraps,
  and transforms every asset at Coinbase, including flagship
  wrapped assets like cbBTC, spanning Ethereum, Base, and
  Solana. You'll own complex projects end-to-end, from smart
  contract through APIs and production rollout, designing and
  operating the Go services that mint, burn, bridge, and
  reconcile wrapped assets across chains. What you'll do:

  - Own end-to-end delivery of complex token and wrapped asset
    initiatives, from smart contract deployment through API
    design, SLOs, and production rollout across multiple
    chains.
  - Build and operate the Go services and smart contracts that
    mint, burn, bridge, and reconcile wrapped assets, ensuring
    correctness across on-chain and off-chain systems.
  - Drive improvements to the asset transformation and migration
    pipeline, making it dramatically faster and safer to
    launch, upgrade, and migrate tokens at scale.
  - Partner across Trading, Custody, USDC, Compliance, and the
    broader crypto stack to ship customer- and revenue-
    impacting work that advances onchain innovation.
  - Lead on-call ownership for team services, building
    observability, runbooks, and operational improvements that
    keep Tier-0 systems reliable.
  - Strengthen team engineering quality by onboarding and
    coaching junior engineers, contributing to design reviews,
    and establishing patterns that raise the technical bar.

  Required Skills and Experience:

  - 5+ years of experience in software engineering with
    proficiency in at least one backend language (Go
    preferred), including designing, building, and operating
    production backend services at scale.
  - Hands-on blockchain experience, either from smart contract
    development (Solidity/EVM), onchain integrations, or
    building services that transact onchain.
  - Demonstrated experience with distributed systems patterns
    including APIs, event-driven architectures, data
    reconciliation, and on-call ownership.
  - Track record of owning complex projects with autonomy in
    fast-moving, multi-chain or multi-system environments.
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality.

