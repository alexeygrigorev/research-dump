title: Engineering Manager - Controls Engineering - Remote
company: Jabil
location: Austin, USA
remote: true
work_type: FULL_TIME
company_size: 41,000 Employees
description: |
  At Jabil (NYSE: JBL), we are proud to be a trusted partner
  for the world's top brands, offering comprehensive
  engineering, supply chain, and manufacturing solutions. With
  60 years of experience across industries and a vast network
  of over 100 sites worldwide, Jabil combines global reach
  with local expertise to deliver both scalable and customized
  solutions. Our commitment extends beyond business success as
  we strive to build sustainable processes that minimize
  environmental impact and foster vibrant and diverse
  communities around the globe.



  How will you make an impact?

  Jabil is seeking a collaborative and technically experienced
  Engineering Manager to join our Data Center Infrastructure
  Engineering team. This individual will lead and develop an
  engineering team supporting the design, development, release
  and lifecycle management of complex power, cooling and
  infrastructure products.

  The Engineering Manager will establish clear priorities,
  strengthen engineering capabilities and create an
  environment in which engineers can work effectively across
  disciplines. This role will partner closely with other
  engineering teams, technical program management,
  manufacturing, quality, supply chain and business
  stakeholders to deliver scalable, robust, manufacturable and
  dependable products.

  The position may support Design and Configuration, including
  CAD and PLM related functions, Electrical Engineering, or
  Controls Engineering. While the technical focus may vary by
  team, the role maintains a consistent responsibility for
  people leadership, engineering execution, technical
  oversight, resource planning and organizational development.
  Location: This role allows remote work or can be based in
  Austin, TX with 25% travel per year domestically and
  international (rare)

  What will you do?

  - Lead, coach, and develop a high performing engineering team
    supporting product development, NPI, production and
    sustaining activities.

  - Establish clear team priorities, performance expectations,
    development plans, and a culture of accountability,
    collaboration, technical rigor and continuous improvement.

  - Help plan and balance resources across multiple projects,
    programs and product platforms while monitoring workload,
    capacity, dependencies and capability needs.

  - Partner with technical program managers and engineering
    leaders to establish realistic schedules, milestones,
    resource plans and deliverables.

  - Provide technical guidance and design oversight while
    empowering engineers to maintain ownership of their work
    and decisions.

  - Ensure engineering deliverables meet functionality, quality,
    safety, manufacturability, reliability, serviceability,
    compliance and configuration requirements.

  - Facilitate technical and design reviews, resolve cross
    functional issues, and communicate technical, resource,
    and execution risks to stakeholders.

  - Work across Systems, Mechanical, Electrical, Controls,
    Design and Configuration, Manufacturing, Quality, Supply
    Chain and Product Management throughout the product
    lifecycle.

  - Drive consistent use and continuous improvement of
    engineering standards, tools, documentation, release
    processes, change control, baselining and traceability
    practices.

  - Support root cause analysis and resolution of design,
    production, and field issues, including implementation of
    corrective actions.

  - Lead workforce planning, recruiting, onboarding, performance
    management and organizational capability development.

  - Participate in customer discussions, business reviews and
    technical planning; support global collaboration and
    perform other responsibilities as assigned.

  How will you get here?

  Education

  - Bachelor’s degree in mechanical engineering, electrical
    engineering, controls engineering, systems engineering,
    computer engineering, or another relevant technical
    discipline is required.

  Experience

  - 5+ years of engineering experience supporting complex
    products, equipment or integrated systems.
  - Experience leading controls engineering involving PLCs,
    embedded or industrial controls, BMS integration,
    instrumentation, automation, sequences of operation or
    system commissioning.

  - 3+ years of experience leading, supervising or managing
    engineering teams.

  - Demonstrated experience supporting product development, NPI,
    production and/or sustaining engineering environments.

  - Experience managing multiple projects, priorities, resources
    and technical deliverables simultaneously.

  - Experience collaborating across engineering, technical
    program management, manufacturing, quality, supply chain
    and other functional organizations.

  - Experience supporting engineering processes such as design
    reviews, product release, configuration management, change
    control, validation or technical issue resolution.

  Knowledge, Skills, Abilities

  - Ability to lead, motivate, coach, and develop engineers with
    varied technical backgrounds and experience levels.

  - Strong understanding of engineering execution, product
    development, product lifecycle, configuration management,
    and product release processes.

  - Ability to translate business and program objectives into
    executable priorities, resource plans, milestones and team
    deliverables.

  - Capable of assessing technical, schedule, and resource risks
    and driving appropriate mitigation and resolution plans.

  - Able to provide effective technical oversight while
    maintaining clear engineering ownership and
    accountability.

  - Strong cross functional leadership, influence,
    communication, presentation and problem-solving skills.

  - Ability to communicate technical and organizational
    information effectively to engineering teams, management,
    customers, and non-technical stakeholders.

  - Comfortable operating within a global, geographically
    distributed organization supporting multiple products and
    lifecycle phases.

  - Ability to identify capability gaps and implement
    development, hiring, or resource strategies; travel as
    required.

  Preferred Qualifications

  - Master’s degree in engineering, engineering management, or a
    related discipline.

  - Experience leading Controls engineering teams.

  - Experience with critical infrastructure, data center
    equipment, industrial systems, cooling products, power
    distribution equipment, automation or similarly complex
    products.

  - Familiarity with electrical design, requirements management,
    PLM and configuration controlled or customer configured
    products.

  - Familiarity with applicable industry standards and
    regulatory requirements, including IEC, UL, IEEE, ASHRAE,
    or related standards.

  - Experience supporting globally distributed engineering and
    manufacturing operations using stage gate product
    lifecycle processes.

  Experience building or scaling engineering teams; project
  management experience or certification is a plus. A suitable
  combination of education, experience and training may be
  considered

  The pay range for this role is $121,300 - $218,300. Job-
  related, non-discriminatory factors used to determine the
  actual offered rate include qualifications and experience,
  geographic location, education, external market data, and
  consideration of internal equity. The anticipated close date
  of this job requisition is: December 31, 2026.

  As part of the total rewards package, this position is
  eligible for a short-term incentive based on performance. In
  addition, Jabil offers benefits to enhance your health,
  wealth, and resilient self. These include medical, dental,
  and vision insurance plans; paid time off accruing at a rate
  of 3.07 hours during your first year of employment; 4 weeks
  of paid parental leave; in 2027, 11 company-paid holidays (9
  fixed holidays and 2 optional floating holidays), subject to
  change yearly; 401(k) retirement plan; and employee stock
  purchase plan.



