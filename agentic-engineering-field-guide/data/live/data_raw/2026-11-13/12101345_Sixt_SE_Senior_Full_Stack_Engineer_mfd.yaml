description: |
  Company Description



  Job Description

  When a replacement car is needed fast, someone has to make
  sure the right vehicle is found, offered and delivered
  without delay. In our Car Replacement technology team in
  Pullach close to Munich, you will build the Go services and
  AI agents behind that. These are production systems that
  decide, act and automate at scale across SIXT and our
  partner network, running on real data with real business
  impact. You will work closely with Product, Data Science and
  business experts, and your work will show up in measurable
  results.

  YOURS TO OWN

  - You build and run Go microservices in a cloud-native, event-
    driven architecture that powers Car Replacement across
    internal systems and partner integrations
  - You design, ship and operate AI agents in production, with
    multi-step orchestration, RAG and context management. You
    also own how they are evaluated and guarded, and your
    patterns become the team’s standards
  - You own features end to end, in an experienced team with
    short paths to Product and the business. You challenge
    unclear requirements, define acceptance criteria, then
    implement, deploy, monitor and validate in production,
    without waiting for a detailed spec
  - You build the TypeScript and React interfaces that make
    agent behavior transparent and usable for business users
    (roughly 30% of your time, with the focus on backend)
  - You build quality in from the start through automated
    testing, observability, code reviews and agent evaluation,
    and you help shape the team’s technical direction
  - You use AI engineering tools across the full software
    lifecycle, and you stay accountable for the correctness of
    what you ship

  YOUR SKILLS MATTER

  - Microservices in Go You have built and run distributed
    services in production. You are strong in Go, REST/gRPC
    API design, event-driven systems, containers and
    Kubernetes, CI/CD and observability
  - Agentic applications You have built and shipped AI agents in
    production, not just used AI tools to write code. You know
    multi-step orchestration, RAG, context management, and
    agent evaluation and guardrails. You can explain what
    worked, what failed and how you measured it
  - Product mindset You start with the problem, ask how success
    will be measured, and take responsibility for the outcome,
    not only the code
  - Engineering quality You value automated testing,
    observability, maintainability and systematic root-cause
    analysis as core parts of your craft
  - Collaboration You communicate clearly with engineers,
    Product, Data Science and business stakeholders, and you
    give and receive constructive feedback
  - TypeScript & React Experience with TypeScript applications,
    ideally React

  WHAT WE OFFER

  - Extra benefits Enjoy discounts on SIXT rent, share, ride and
    SIXT+, attractive vehicle leasing offers, and exclusive
    deals with partners for travel, tech, fashion and more
  - Mobility boost We support you with a monthly mobility
    allowance of €20 per month for even more freedom
  - Future security We contribute to your retirement plan and
    support you with capital-forming benefits to ensure you
    are well covered
  - Feel-good atmosphere Stay active with our modern SIXT gym,
    various leisure activities like the gaming area or the
    SIXT choir, and enjoy our high-quality employee restaurant
  - Flexibility Enjoy 30 days of vacation and a hybrid working
    model with flexible hours
  - Giving back Take one day each year to volunteer at a
    charitable organization dedicated to supporting children

  Additional Information

  About us:

  We are a globally leading mobility service provider with a
  revenue of €4.3 billion and around 9,000 employees
  worldwide. Our mobility platform ONE combines our products
  SIXT rent (car rental), SIXT share (car sharing), SIXT ride
  (taxi, ride, and chauffeur services), and SIXT+ (car
  subscription), giving our customers access to our fleet of
  360,000 vehicles, the services of 4,000 cooperation
  partners, and around 5 million drivers worldwide. Together
  with our franchise partners, we are present in more than 100
  countries at 2,000 rental stations. At SIXT, top-tier
  customer experience and outstanding customer service are our
  highest priorities. We believe in true entrepreneurship and
  long-term stability and align our corporate strategy with
  foresight. Get started with us and apply now!
