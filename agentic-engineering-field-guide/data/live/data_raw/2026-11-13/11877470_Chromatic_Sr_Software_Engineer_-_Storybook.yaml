description: |
  Chromatic is a platform used by thousands of front-end teams
  worldwide, including BBC, Shopify, Adobe, and ourselves. Our
  mission is to safeguard all of the world's pixels, and
  Storybook plays a critical role: it’s how our work reaches
  the broadest developer audience and sets the standard for UI
  quality across the web. We’re now building on that
  foundation to make Storybook a critical component of AI
  development workflows.

  We're seeking an engineer to join the Storybook maintainers
  team. Storybook is the industry-standard tool for building,
  testing, and documenting UI components. Our team covers a
  broad surface area, so your work will have immediate,
  visible impact. You’ll work with a collaborative group that
  values kindness, empathy, and thoughtful communication. We
  care deeply about creating an environment where people can
  learn, grow, and feel supported in taking on new challenges.
  Momentum matters, but we also make space to think ideas
  through carefully to ensure we’re shipping the right things.

  Our latest product bet is on agentic workflows: helping AI
  agents build, test, and iterate on UI with Storybook.
  Alongside that, we continue to expand support for the
  frontend ecosystem. Some highlights from this year include:

  - Launched Storybook MCP and Skills to help agents reuse
    existing components, preview their work, and run tests to
    catch and fix issues
  - Introduced automated setup and change detection, helping
    agents configure Storybook in complex applications and
    helping developers focus their reviews on affected stories
  - Shipped Storybook for TanStack React to broaden our
    framework support

  This is a fully remote position with core hours within
  Central European Time (09:00–15:00 UTC overlap).

  Responsibilities

  - Contribute to the Storybook codebase as a core maintainer
  - Design, develop, and refine Storybook APIs that serve our
    end users, addon authors, and core maintainers (us!)
  - Collaborate in the open by triaging issues, reviewing pull
    requests, supporting contributors, and writing or
    reviewing RFCs
  - Understand how developers use Storybook, and create
    educational content that helps users get the most value
    out of features we ship
  - Engage with the wider developer community to share our work
    and ideas, with opportunities to speak at conferences if
    interested
  - Work with other engineering teams at Chromatic to ensure
    feature continuity between Chromatic and Storybook
  - Participate in the engineering team's support rotation,
    which is primarily within business hours

  What we’re looking for

  - 5+ years of experience building for the web using
    JavaScript/TypeScript or other relevant languages
  - Experience building tooling, frameworks, or libraries for
    other developers (internal tools count too!)
  - Solid understanding of “the backend of frontend” — you know
    how modern web frameworks and build tools work under the
    hood
  - Strong written and verbal communication skills in English;
    comfortable working asynchronously across a distributed
    team
  - Interest in engaging with developer communities to
    understand their needs, exchange ideas, and share your
    work
  - Ability to form your own opinions, explain your reasoning,
    but also open to changing your mind as you learn
  - Genuine enthusiasm for making developers' lives easier and
    helping shape where frontend development is headed

  Prior open-source maintainer experience is not required.

  We’d be extra excited if you…

  - Have shared knowledge publicly through talks, writing,
    videos, or other channels
  - Have deep expertise beyond React for the web (e.g. Web
    Components, Angular, or React Native), with an opinion of
    what good developer experience looks like in that
    ecosystem
  - Have experimented with agentic tools and workflows, and are
    excited about how AI is changing software development
  - Have experience with Storybook or Chromatic
  - Have worked effectively in a distributed, remote-first team
    environment
  - Have taken a non-traditional path into software and can
    bring insight from experiences beyond engineering

  We understand that even the best candidates might not meet
  all the above qualifications on day one. That's okay. If
  you’re excited about Storybook’s mission and want to grow
  your skills, we’d love to hear from you.

  Salary range: US $161,900 - 197,700 + equity. Learn more
  about our compensation philosophy here. Visit our careers
  page for a list of our other benefits and a peek into life
  at Chromatic.
