description: |
  Location: Hybrid- San Francisco OR Palo Alto Office,
  Tuesday/Thursday Job Type: Full-time W2

  About Midi Health

  Midi Health is the largest virtual care clinic for women in
  midlife navigating perimenopause, menopause, and other
  hormonal transitions. We combine expert clinicians,
  evidence-based protocols, and a modern technology platform
  to deliver care that has historically been underserved by
  the healthcare system. We're a fast-growing, mission-driven
  company building the infrastructure and products that define
  this new category of care.

  How We Work

  - Hybrid by design. Two days a week in-office (Tuesday and
    Thursday) in Palo Alto or San Francisco. We believe high-
    trust teams are built in person and scaled remotely.
  - AI-native engineering. We expect every engineer to be fluent
    with modern AI coding tools (Claude Code, Cursor, Copilot,
    and similar) and to actively push the frontier of how we
    build software.
  - Low-ego, high-curiosity. We approach disagreement with
    humility and technical rigor, not politics. We invest in
    each other's growth.
  - Outcome-oriented. We move fast, own our work end-to-end, and
    balance speed with the durability that healthcare demands.

  The Difference You Will Make

  You'll join a team building the products that power Midi's
  care — spanning the patient journey (discovery, booking,
  ongoing care) and the clinician and operational surfaces
  that deliver that care at scale. You'll drive significant
  projects from early brainstorming through architecture,
  execution, rollout, and iteration, shipping user-facing
  software that meaningfully changes how women experience
  healthcare.

  What You Will Do

  - Design, build, and own full-stack features end-to-end across
    our patient, clinician, and operational products
  - Partner closely with product, design, marketing, clinical,
    and operations stakeholders to turn ambiguous problems
    into shipped software
  - Write thoughtful, scalable code that balances speed of
    execution with long-term maintainability
  - Contribute to architecture decisions and raise the bar for
    code quality, testing, and CI/CD practices
  - Review code, participate in technical discussions, and help
    teammates level up
  - Use AI coding tools every day to multiply your output and
    help the team adopt better workflows

  About You

  - 6+ years of experience building and shipping full-stack web
    applications at production scale
  - Strong hands-on coding skills in a modern web stack — we use
    Django/DRF and React/Next.js, but equivalent experience is
    fine
  - Seasoned at system design: you can take an ambiguous product
    problem and produce a clean, pragmatic architecture
  - Solid command of AI coding tools; comfortable adopting and
    applying the workflows the team converges on
  - Good mentorship instincts — you share context generously and
    help peers grow through code review and pairing
  - Strong written and verbal communicator; collaborates well
    with non-engineering stakeholders
  - Proactive ownership mindset; advocate for automated testing,
    CI, and high code quality
  - Low-ego, curious, humble

  Nice to Have

  - Experience in healthcare, EHR integrations, or other
    regulated domains
  - Prior consumer-facing startup experience

  Interview Process:

  - Recruiter Screen (30 min)
  - Hiring Manager Screen (45 min)
  - Live Technical Assessment (2 hours: 2 x 60 min sessions)
  - On-Site Interview and lunch (3 hours)

  At this time, Midi Health is not able to sponsor or take
  over sponsorship of any employment visa (including H-1B, TN,
  or other work authorization). Applicants must be authorized
  to work in the U.S. without current or future visa
  sponsorship.

