description: |
  Radar Reinvented.

  Echodyne offers the world’s first compact solid-state true
  beam-steering radar for a wide range of industries and
  applications. Our high-performance radars work in all
  weather and are designed for autonomous vehicles, uncrewed
  aircraft & drones, and security of borders, critical
  infrastructure, and smart cities. The company combines the
  patented technology of metamaterials with powerful software
  to create a radar sensor with unprecedented performance at
  commercial price points. Echodyne offers its radars to
  companies working in Automotive, Transportation, Critical
  Infrastructure Protection, Border Security, Smart Cities,
  Uncrewed Aircraft Systems (UAS), and Airspace Management
  including Urban Air Mobility (UTM).

  Echodyne is seeking a Front-End Engineer to join our fast-
  growing team. Echodyne is seeking a Front-End Engineer II to
  build our next-generation visualization. As a member of this
  team, you will lead and partner with teams across the
  organization to design compelling UI that runs our cognitive
  radar technology. This is an exciting opportunity to jump
  into the cutting-edge field of mission-critical security and
  help shape the roadmap of one of the world’s fastest-growing
  C-UAS companies. RESPONSIBILITIES

  - Build user-facing UI that manages the end-to-end operations
    of our radars
  - Champion an architecture that can scale and perform for
    mission-critical operations
  - Work cross-functionally with teams across the organization
    to address customer pain using established UI/UX patterns
  - Demonstrate leadership within and outside the team in
    technical and non-technical areas
  - Other related tasks required to fulfill the needs of the
    business

  REQUIRED SKILLS / EXPERIENCE

  - 3+ years of industry experience developing products and
    tooling Front-end experience working with React in
    TypeScript
  - Strong knowledge of Python and/or Rust
  - Experience implementing back-end web services
  - Familiarity with CI/CD platforms
  - Excellent verbal and written communication skills, with the
    ability to articulate complex technical concepts to cross-
    functional teams and stakeholders
  - B.S. in Computer Science or equivalent experience

  Echodyne’s technology is export controlled by the U.S.
  Government and we must evaluate an applicant’s eligibility
  to handle export-controlled information or obtain required
  Government authorizations.  Therefore, we will ask you as
  part of the application process to identify whether you are
  a U.S. Citizen or green card holder, or have asylum/refugee
  status in the U.S.

  WHAT WE OFFERThis is an exempt role. The annual salary range
  for this role is $114,330 to $170,980.

  If your skills generally align but not perfectly, please
  apply anyway. There may be another role that’s a great fit
  for you!

  We offer competitive compensation and benefits to our full-
  time, US-based employees, including:

  - RSU (Restricted Stock Units)
  - Generous Benefits:
  - Mental Health coverage through Springhealth & Talkspace
    (Premera)
  - Travel Assistance Insurance
  - Company Paid Life Insurance
  - Company Paid Short & Long Term Disability
  - Flexible PTO (exempt) / 15 days per year (non-exempt)
  - 401(k) match
  - Pet Insurance
  - Prepaid Legal Program
  - Commuter Benefits
  - Paid Company Holidays

  All qualified applicants receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, age, status as a protected veteran or any other
  characteristic protected by law.
