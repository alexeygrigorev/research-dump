description: |
  Company Description

  Mirantis, an IREN company, is the Kubernetes-native AI
  infrastructure company, enabling organizations to build and
  operate scalable, secure, and sovereign infrastructure for
  modern AI, machine learning, and data-intensive
  applications. By combining open source innovation with deep
  expertise in Kubernetes orchestration, Mirantis empowers
  platform engineering teams to deliver composable,
  production-ready developer platforms across any
  environment—on-premises, in the cloud, at the edge, or in
  sovereign data centers. As enterprises navigate the growing
  complexity of AI-driven workloads, Mirantis delivers the
  automation, GPU orchestration, and policy-driven control
  needed to manage infrastructure with confidence and agility.
  Committed to open standards and freedom from lock-in,
  Mirantis ensures that customers retain full control of their
  infrastructure strategy.  https://www.mirantis.com/

  Job Description

  Our organization is seeking a talented Senior Engineering
  Manager to lead our development team! We build enterprise
  software that addresses operational, security, and
  compliance challenges of managing cloud-native platforms
  such as Kubernetes, while providing enterprise customers
  with integrated tools for running containerized workloads
  securely. Our enterprise container platform manages mission-
  critical services for major global organizations and
  enterprise customers around the world.

  Main Responsibilities:

  - Driving Technical Vision & Operational Excellence: Define
    and execute the long-term technical strategy and roadmap
    while maintaining rigorous operational excellence, high
    availability, and robust software engineering practices.
    Drive continuous improvement in system resilience,
    operational metrics, and platform performance.
  - Security Leadership & Secure SDLC: Embed security best
    practices across all stages of the software development
    lifecycle (SDLC), including the secure integration and
    governance of AI technologies and agentic workflows.
    Champion security architecture, threat modeling,
    vulnerability management, and secure coding practices to
    safeguard cloud-native platforms and enterprise customer
    workloads.
  - Hiring, Talent Development & Team Empowerment: Hire, mentor,
    and grow a high-performing engineering organization. Build
    clear career progression paths, foster an inclusive
    culture, and empower engineers to take ownership of
    quality, platform health, and technical innovations.
  - Balancing Features and Platform Stability: Partner closely
    with Product Management and executive leadership to align
    feature delivery with technical debt reduction, system
    stability, and security enhancements, making disciplined
    trade-off decisions grounded in operational metrics and
    customer needs.
  - Cross-Functional Collaboration & Customer Focus: Communicate
    effectively with executive stakeholders, enterprise
    customers, and cross-functional teams. Translate real-
    world customer usage patterns and operational feedback
    into actionable engineering priorities and platform
    guardrails.
  - Industry Trends & Continuous Innovation: Stay up-to-date
    with emerging industry trends, containerization
    innovations, and cloud-security standards, driving
    adoption of modern tools and methodologies to maintain
    technical leadership.

  Qualifications

  Qualifications and Experience Requirements:

  - Education: a bachelor's or master's degree in Computer
    Science or a related field is required. A degree in a
    relevant field such as software engineering, computer
    engineering or information technology could also be
    suitable.
  - Experience: Minimum of 7–10 years in software engineering
    with demonstrated experience leading or managing
    engineering teams in commercial software ecosystems.
  - Technical and Security Expertise: Strong technical depth in
    distributed systems, cloud-native infrastructure, secure
    SDLC practices, and operational metrics in enterprise
    production environments.
  - Leadership, Hiring & People Management: Demonstrated success
    in attracting, hiring, and developing top engineering
    talent, setting technical vision, establishing operational
    excellence standards, and leading engineering teams
    through complex deliverables.
  - Communication skills: excellent communication skills,
    including the ability to present technical information in
    a clear and concise manner, collaborate with stakeholders,
    and work effectively in a team environment.
  - Management Coaching (Preferred): Experience in coaching,
    mentoring, and managing engineering managers or team leads
    is a strong plus.

  Additional Information

  What does Mirantis offer you?

  - Work with an established Silicon Valley leader in the cloud
    infrastructure industry;
  - Work with exceptionally passionate, talented and engaging
    colleagues, helping Fortune 500 and Global 2000 customers
    implement next-generation cloud technologies;
  - Be a part of cutting-edge, open-source innovation;
  - Thrive in the high-energy environment of a young company
    where openness, collaboration, risk-taking, and continuous
    growth are valued;
  - Professional development and training;
  - Attend conferences and working groups;
  - Company outings, happy hours, hackathons, and tech talks;
  - Receive a competitive compensation package with a strong
    benefits plan.

  We are a Leader for Container Management in G2 (#2 after
  AWS)!
