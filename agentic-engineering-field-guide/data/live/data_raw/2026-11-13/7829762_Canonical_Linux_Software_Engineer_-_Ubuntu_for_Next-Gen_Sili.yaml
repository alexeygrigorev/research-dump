description: |
  Canonical is a leading provider of open source software and
  operating systems to the global enterprise and technology
  markets. Our platform, Ubuntu, is very widely used in
  breakthrough enterprise initiatives such as public cloud,
  data science, AI, engineering innovation and IoT. Our
  customers include the world's leading public cloud and
  silicon providers, and industry leaders in many sectors. The
  company is a pioneer of global distributed collaboration,
  with 1200+ colleagues in 75+ countries and very few office-
  based roles. Teams meet two to four times yearly in person,
  in interesting locations around the world, to align on
  strategy and execution.

  The company is founder-led, profitable, and growing.

  Canonical’s Partner Engineering Team is looking for open-
  source enthusiasts to work across the full Linux stack to
  ensure new silicon technologies, such as new hardware
  accelerators, AI stacks, confidential computing, networking,
  virtualization, and containerization stacks, are optimized
  for new silicons.

  Partner Engineering works closely with worldwide silicon
  companies to optimize Ubuntu for their new silicon, from
  x86, ARM, RISC-V, PowerPC and s390x architectures.

  Location: This is a Globally remote role

  The role entails

  - Collaborating proactively within a distributed team
  - Fostering a software ecosystem with seamless user experience
    for all Ubuntu users
  - Evaluating contributions of other engineers to maintain
    high-quality software standards.
  - Playing a role in shaping the future of Ubuntu via both -
    new ideas in your areas of interest and advising on work
    being done elsewhere
  - Collaborating with other teams in the Ubuntu and Debian
    communities, with upstream projects, and commercially
    supported customers
  - Debugging issues on open source code and team maintained
    code.
  - Helping our our customers to integrate their apps, SDKs,
    build OS images, optimize applications with Ubuntu Core,
    Desktop and Server
  - Working with a team to maintain Ubuntu, silicon features,
    and silicon-optimized packages across platforms and
    technologies such as:
  - Work from home with global travel 2 to 4 weeks for internal
    events

  What we are looking for in you

  - Exceptional academic track record from both high school and
    university
  - Undergraduate degree in a technical subject or a compelling
    narrative about your alternative chosen path
  - You love technology and working with brilliant people
  - You are curious, flexible, articulate, and accountable
  - You value soft skills and are passionate, enterprising,
    thoughtful, and self-motivated
  - You value building partnerships with a diverse set of
    internal and external groups
  - Strong fundamentals in C, C++ and Python
  - Experience or interest in learning Linux distribution
    packaging
  - Experience or Interest in open source maintenance or
    contribution and licenses
  - Fundamental understanding of package management and
    dependency resolution

  Additional skills that you might also bring

  - Experience with one or more of the following:

  What we offer colleagues

  We consider geographical location, experience, and
  performance in shaping compensation worldwide. We revisit
  compensation annually (and more often for graduates and
  associates) to ensure we recognize outstanding performance.
  In addition to base pay, we offer a performance-driven
  annual bonus or commission. We provide all team members with
  additional benefits which reflect our values and ideals. We
  balance our programs to meet local needs and ensure fairness
  globally.

  - Distributed work environment with twice-yearly team sprints
    in person
  - Personal learning and development budget of USD 2,000 per
    year
  - Annual compensation review
  - Recognition rewards
  - Annual holiday leave
  - Maternity and paternity leave
  - Team Member Assistance Program & Wellness Platform
  - Opportunity to travel to new locations to meet colleagues
  - Priority Pass and travel upgrades for long-haul company
    events

  About Canonical

  Canonical is a pioneering tech firm that is at the forefront
  of the global move to open source. As the company that
  publishes Ubuntu, one of the most important open source
  projects and the platform for AI, IoT and the cloud, we are
  changing the world on a daily basis. We recruit on a global
  basis and set a very high standard for people joining the
  company. We expect excellence - in order to succeed, we need
  to be the best at what we do. Canonical has been a remote-
  first company since its inception in 2004. Working here is a
  step into the future, and will challenge you to think
  differently, work smarter, learn new skills, and raise your
  game.

  Canonical is an equal opportunity employer

  We are proud to foster a workplace free from discrimination.
  Diversity of experience, perspectives, and background create
  a better work environment and better products. Whatever your
  identity, we will give your application fair consideration.

