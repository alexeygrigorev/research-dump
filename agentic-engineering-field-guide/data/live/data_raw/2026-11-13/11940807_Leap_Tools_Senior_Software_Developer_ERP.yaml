description: |
  At Leap Tools, we are building the world's most advanced
  solutions for the interior décor industry. With customers in
  80+ countries, our clientele includes Fortune 500 companies
  such as Home Depot, local retailers such as Alexanian's, and
  everything in between. We have been recognized as one of the
  fastest-growing tech companies by Deloitte for multiple
  years in a row, and we are looking for ambitious challenge-
  seekers to fuel our momentum and help us create an iconic
  global tech company.

  About our product

  Our technology lets you preview products in your own room
  before you buy them. Imagine you want to redesign your home
  and have been searching for new tiles for your kitchen, or a
  new rug for your living room. You definitely want to make
  sure it will look good in your space. We enable you to do
  that through our proprietary cutting-edge technology,
  presented in an extraordinarily simple and accessible way.
  Try our rug demo now! Simply upload a picture of your room
  using your mobile phone, and slide the rug under your coffee
  table: https://www.roomvo.com/rugdemo...

  Our ERP product also helps flooring retailers manage their
  day-to-day business operations, supporting essential
  workflows such as sales, inventory, purchasing, and
  accounting. This is a business-critical application that
  customers rely on every day to operate efficiently and serve
  their customers.

  About the role

  As a Senior Software Developer on our ERP team, you will
  take ownership of complex features and technical initiatives
  across our business management applications. You'll design
  and build reliable, scalable solutions, work across
  different technologies, and help improve the quality and
  maintainability of our software.

  You'll work closely with product managers and fellow
  engineers to translate business requirements into well-
  designed solutions. This role offers the opportunity to
  solve challenging engineering problems, make meaningful
  architectural contributions, and have a direct impact on
  software that businesses depend on every day.

  About you

  You have a passion for solving complex problems and working
  on products that businesses run on every day. You enjoy
  setting the bar high and clearing it. You can lead by
  example, but you know when to step aside and let the team
  run with the ball.

  You turn an ambiguous requirement into a plan the team can
  execute. You care about data: you know that a schema
  decision made today is one that every customer lives with
  for years. You want to own something meaningful, and you
  want the engineers around you to grow because you were
  there.

  We hire humans, not job descriptions. You should apply even
  if this role and salary range don't align with your
  experience. We’re happy to create unique roles and
  compensation for the right talent.

  About our stack

  Our engineering teams work with a range of technologies,
  including:

  - Backend: Python, Django, C++, PostgreSQL
  - Frontend: React, Next.js, TypeScript
  - Infrastructure: AWS, Azure, Kubernetes
  - Platforms: Web and Windows desktop applications

  We value strong engineering fundamentals and the ability to
  work effectively across different technologies. Deep
  expertise in every part of our stack is not required.

  What you'll do

  - Own the design, development, and delivery of complex
    features and technical initiatives across our business
    management applications.
  - Design and implement backend services, APIs, data models,
    and user-facing functionality with a focus on reliability,
    performance, and maintainability.
  - Work with complex relational data models, ensuring data
    integrity, consistency, and efficient database operations.
  - Work across existing systems and technologies to understand
    business requirements, investigate technical challenges,
    and implement effective solutions.
  - Own the reliability of your features in production: lead
    incident fixes, improve monitoring, and leave the system
    better than you found it.
  - Set the bar for code quality through thoughtful code
    reviews, automated testing, and sound engineering
    practices.
  - Work directly with Product and other engineering teams to
    shape requirements, evaluate technical approaches, and
    deliver high-quality solutions.
  - Mentor intermediate developers, share technical knowledge,
    and contribute to hiring and onboarding.

  We’re looking for someone with

  - 5+ years of software development experience building and
    operating systems that businesses depend on in production.
  - Strong computer science fundamentals based on a degree in
    computer science or distinctive work experience in
    software development.
  - Strong data modelling and relational database skills,
    ideally including multi-tenant systems.
  - Experience designing and building backend services and APIs,
    and enough front-end experience to own a feature in the UI
    as well.
  - A track record of shipping changes to live systems safely:
    feature flags, incremental rollouts, data migrations with
    a way back.
  - A demonstrated ability to provide guidance, mentorship, and
    support.
  - A leadership mindset. You take initiative, make decisions
    and deliver results consistently
  - Strong communication skills, including with people who are
    not engineers.
  - Comfortable working in a fast-paced, evolving environment
    where learning and adaptability are key.

  Preferred, not required:

  - Experience with Python and Django, and with Next.js or
    React.
  - Experience with ERP, accounting, or other business
    management software.
  - Experience developing or maintaining Windows desktop
    applications using C++ or comparable technologies.

  About our culture

  - We're a remote-first company that encourages our employees
    to work from where they're most productive.
  - We work in tight-knit teams to cultivate an ownership
    mentality.
  - We cherish curiosity and an obsession for details because we
    know these details are invaluable over the long run.
  - We're hyper-focused on our achievements and our ability to
    execute our promises. We act with urgency.
  - Work anywhere in the world for up to 3 months!
  - We value families, by offering a parental leave program
  - We offer a work-from-home stipend
  - Your birthday (and our company's birthday) is a day off!

  About our hiring process

  - You upload your resume and complete a brief questionnaire.
  - Three rounds of technical assessment: two technical + System
    Design.
  - Culture fit assessment.
  - Final interview with leadership.
  - Offer

  AI in Recruitment - At Leap Tools, we leverage AI technology
  to enhance our recruitment process. These tools assist with
  tasks such as resume screening, sourcing prospective
  candidates, and to support administrative tasks for enhanced
  operational efficiency. Founders and senior leadership are
  directly involved in our recruitment process, and AI is
  never used to make the final hiring decision. We are
  committed to the responsible use of AI in our hiring
  practices.

  Expected salary range, Ontario based: $110,000 - $160,000 +
  other benefits.

  We value exceptional talent above all else. If your
  expectations or seniority sit outside the stated range, you
  should still apply. We can scale roles and compensation to
  match your unique situation.

  This is a net new position on the team.

  Leap Tools is an equal opportunity employer committed to
  fostering an inclusive, equitable, and accessible
  environment. Accommodations are available on request for
  candidates taking part in all aspects of the interview
  process. If you require any accommodation, please contact us
  at ta@leaptools.com

  Take the Leap. Apply now.

  Our demo, in case you missed it:
  https://www.roomvo.com/rugdemo4r

  You should apply to this job even if you don't fit this role
  perfectly because we can create a new role for you with
  corresponding compensation.
