description: |
  The Role We’re hiring our first Engineering Manager to lead
  Pythagoras AI’s engineering team. You’ll own delivery across
  customer implementations and core product work, keep
  projects moving, and be the bridge between engineering,
  customers, and the rest of the company.

  This is primarily a leadership role. You’ll spend most of
  your time managing people, projects, and stakeholders, but
  you’re still an engineer, and you’ll jump in to build,
  debug, or review when the team needs it.

  What You’ll Do

  - Lead and grow the team. Manage, mentor, and support
    engineers. Run 1:1s, give clear feedback, help people
    grow, and help us hire as the team scales.
  - Own delivery. Plan and prioritize work across customer
    rollouts and product roadmap. Make sure projects ship on
    time, risks are surfaced early, and trade-offs are made
    deliberately.
  - Coordinate with customers and stakeholders. Work directly
    with customers, sales, clinical operations, and
    leadership. Set realistic expectations, communicate
    status, and turn customer needs into scoped, prioritized
    work.
  - Balance customization and product. Help the team decide what
    belongs in per-customer strategies and configuration
    versus what should become core product. Keep the platform
    from fragmenting as we grow.
  - Raise the engineering bar. Establish practices for code
    review, testing, deploys, incident response, and on-call.
    Make reliability and HIPAA compliance part of how the team
    works, not an afterthought.
  - Stay hands-on. Write code, review PRs, and debug production
    issues when needed. Expect this to be a smaller but real
    part of the role.

  What We’re Looking For

  Required:

  - 7+ years in software engineering, including 2+ years
    managing engineers or leading a team with direct reports
  - Track record of delivering complex projects with external
    stakeholders or customers involved
  - Hands-on with TypeScript/Node.js. You should be able to read
    and review code across the stack, and ship a fix when it
    matters
  - Strong written and verbal communication. Comfortable with
    engineers, clinical operations leaders, compliance teams,
    and customer executives
  - Good judgment on prioritization and scope. You know when to
    say no, when to say not yet, and how to explain why
  - Self-directed and comfortable with ambiguity in an early-
    stage environment
  - Experience with LLM-based or conversational AI products

  Preferred:

  - Healthcare experience: HIPAA, EHR workflows, working with
    clinical or compliance teams
  - Experience with EHR integrations
  - Familiarity with AWS, GraphQL, React, and voice/telephony
    systems (e.g., Twilio)
  - Experience at an early-stage startup (Series A or earlier),
    ideally as an early engineering leader

  Compensation & Logistics

  - Competitive base salary + meaningful equity
  - Fully remote within the US
  - Health, dental, vision
industries:
