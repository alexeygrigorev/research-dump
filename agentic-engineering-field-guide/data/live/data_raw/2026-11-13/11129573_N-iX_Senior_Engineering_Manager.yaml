description: |
  At N-iX CTO Group, we harness the power of technology to
  drive innovation and deliver exceptional business value. We
  specialize in designing and executing industry-relevant
  solutions that redefine standards in enterprise technology.
  Join a vibrant team committed to driving large-scale
  transformation across global enterprises.

  As a Senior Engineering Manager at N-iX, you will play a key
  leadership role in guiding our partners through digital
  transformation, application modernization, and other large-
  scale technology programs. You will lead engineering
  delivery across multiple engagements, ensuring our teams
  deliver exceptional technical outcomes and business value.

  The role has a second half that matters just as much. You
  take part in discoveries and presales, where you shape how
  delivery will actually run, and you grow the accounts you
  already work with by finding the next piece of work and
  making the case for it. The balance between running delivery
  and opening new work depends on the portfolio you are
  assigned to.

  This role is ideal for a seasoned technology leader with a
  strong consulting mindset, the ability to manage complexity,
  and a passion for building high-performing teams that help
  clients succeed in their most critical initiatives.

  Key Responsibilities

  - Act as a trusted advisor to client technology executives
    (CIOs, CTOs, Heads of Product/Innovation).
  - Take part in discoveries and assessments: size the work,
    define the team, and describe how delivery will run.
  - Shape solutions, proposals, and technical strategy for
    complex engagements, together with sales and architects.
  - Grow existing accounts: find the next piece of work, build
    the case with the client, and land it.
  - Shape and steer digital transformation and modernization
    programs in partnership with clients.
  - Translate business goals into technology strategies,
    roadmaps, and execution plans.
  - Lead engineering execution across multiple accounts and
    initiatives, ensuring scalability, security, and
    performance.
  - Own the critical path across engagements, keeping scope,
    priorities, and delivery aligned to it.
  - Manage scope and change professionally across T&M, fixed-
    price, and managed-services engagements.
  - Ensure delivery quality, and manage dependencies and risks
    across teams.
  - Step into accounts under pressure and get them back on
    track.
  - Establish and enforce best practices in solution
    architecture, software engineering, DevOps, and cloud
    adoption.
  - Mentor and grow senior engineering leaders, cultivating a
    culture of innovation and technical excellence.
  - Build and scale distributed engineering teams, and keep them
    staffed as the work changes.
  - Raise the bar on how we work with AI: improve engineering
    and delivery workflows, integrate AI into the software
    development lifecycle, and help teams and clients adopt it
    with sensible guardrails.
  - Drive cross-cutting initiatives to strengthen N-iX practices
    in modernization, solution development, ERP, and emerging
    technologies.

  Qualifications

  - Presale, discovery, and engagement experience. You have
    shaped scope, team composition, and estimates for work
    that was later won, and you can say what you produced
    yourself and at what opportunity size.
  - 10+ years in software delivery, including at least 5 years
    hands-on as a software engineer or architect before moving
    into management, and at least 3 years in senior
    engineering leadership roles.
  - Proven track record leading large-scale enterprise programs,
    including modernization and digital transformation.
  - Experience owning technical delivery across more than one
    account or engagement at the same time.
  - Engagement model fluency: T&M, fixed price, and managed
    services, and how each one changes team operations, risk,
    and the client relationship.
  - Deep expertise in cloud platforms (AWS, Azure, GCP), modern
    architectures (microservices, event-driven, API-first),
    and DevOps practices.
  - Practical AI proficiency. You use AI tools daily in your own
    work and can lift others to the same level: improving team
    workflows, integrating AI into the delivery lifecycle,
    choosing and rolling out tooling, and setting sensible
    guardrails for its use.
  - Strong consulting and client-facing skills, with experience
    engaging senior stakeholders in enterprise environments.
  - Experience building and scaling high-performing, distributed
    engineering teams.
  - Excellent leadership, communication, and strategic thinking
    skills.
  - English: Advanced.

  Nice to Have

  - Hands-on experience with a modern data stack: data
    platforms, pipelines, warehousing, and analytics.
  - Architecture governance and methodologies.
  - Hands-on agentic development capabilities.
  - AI practices and governance establishment and measurement.

  We offer*:

  - Flexible working format - remote, office-based or flexible
  - A competitive salary and good compensation package
  - Personalized career growth
  - Professional development tools (mentorship program, tech
    talks and trainings, centers of excellence, and more)
  - Active tech communities with regular knowledge sharing
  - Education reimbursement
  - Memorable anniversary presents
  - Corporate events and team buildings
  - Other location-specific benefits

  *not applicable for freelancers
