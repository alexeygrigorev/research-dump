description: |
  Belay Technologies has been voted Baltimore Business
  Journal's (BBJ) Best Places to Work 2026!


  Belay Technologies is seeking a Senior Software Engineer to
  join our intel team. You will be supporting IIA SWAT as the
  lead for a small team, working with a combined set of data
  from different elements throughout the agency, and building
  agentic tools to assist in gathering and curating
  information packages. You will work directly with the
  customer, learning their workflows, and seeing the results
  of your work firsthand. Your day to day will consist of
  direct customer interaction with leadership, analysts, and
  other developers, implementation of solutions to support
  mission needs, and participation in a team of teams working
  towards similar solutions for separate customers.
  Responsibilities:

  - Provide expertise on a diverse set of existing highside
    services.
  - Expand on existing workflow automation efforts.
  - Discover new opportunities to introduce agentic AI.
  - Develop and maintain web apps to provide analytic and
    workflow support.
  - Emphasize customer communication and gather feedback on
    project status and results.

  Candidates should have the following qualifications: 

  - TS/SCI Clearance with polygraph
  - 12 yrs., B.S. in a technical discipline or 4 additional yrs.
    in place of B.S.

  Candidates should have the following skill requirements:

  - Extensive experience with full stack development with an
    emphasis on AI workflows.
  - Experience with customer cross-domain solutions.
  - Experience soliciting and applying feedback.
  - Experience with AI assisted development.
  - Experience programming in JavaScript and python.
  - Experience working with corporate services in the highside
    environment.
  - Leadership experience.
  - Prior experience in TAO.
  - Experience with relational databases.

  Candidates are desired to have the following skills:

  - Development experience in a Linux environment.
  - Prior experience in TAO.
  - Experience with relational databases.
  - Experience with pipeline data processing.

  Perks and Benefits:

  - 8 weeks paid leave - 4 weeks of personal leave, 3 Yay! days,
    take off on your birthday,11 paid holidays and optional
    leave up to 6 days through Belay's volunteer program
  - 10% matching in 401(k) contributions vested on day one
  - $5,000 annual training/tuition
  - Student Loan Repayment Program
  - 100% company-funded HSA
  - Rich medical coverage (100% coinsurance)
  - Dental coverage including orthodontia
  - Up to $420,000 in life insurance, premiums 100% company
    funded
  - Amazon Prime, gym reimbursement, monthly lunches, games and
    prizes
  - Pet adoption program, generous referral bonus program, fun
    events, and more!


  At Belay, we are committed to creating an environment where
  you can thrive both professionally and personally.  We
  believe in transparency and fairness in compensation.
  Several factors influence final salary including, but not
  limited to, geographic location, Federal Government contract
  labor categories and contract wage rates, relevant prior
  work experience, education, specific skills and competencies
  and certifications. Belay offers a competitive total
  compensation package that includes benefits and perks, a
  flexible work-life balance, and career development. Salary
  Range: $190,000 to $240,000 Belay Technologies is a
  certified Service-Disabled Veteran-Owned Small Business
  located in Columbia, Maryland (Baltimore/Washington area).
  Belay Technologies specializes in systems automation and
  full stack development. Belay Technologies provides leading
  technology and engineering solutions to the DoD, as well as
  state-of-the-art commercial products. We hire software
  engineers, web designers, test engineers, systems engineers,
  systems administrators, database engineers and other tech
  services. We are an Equal Opportunity Employer. Employment
  decisions are made without regard to race, color, religion,
  national origin, gender, sexual orientation, gender
  identity, age, physical or mental disability, genetic
  factors, military/veteran status or other characteristics
  protected by law.
