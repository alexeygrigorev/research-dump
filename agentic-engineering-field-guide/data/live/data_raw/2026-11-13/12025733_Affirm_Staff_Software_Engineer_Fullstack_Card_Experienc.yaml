description: |
  At Affirm, we exist for the moments that matter—giving
  people a clear, predictable way to pay over time, with no
  hidden fees, no surprises, and no tradeoffs on what matters
  most.

  The Card Experiences team builds the product surfaces that
  make the Affirm Card feel simple and trustworthy. We own the
  cardholder journey from the moment a card is ordered to
  every time it's used. Our work spans the full stack:
  customer-facing web and mobile experiences and the backend
  services behind them. You'll work closely with product,
  design, risk, and operations partners to turn customer pain
  points into shipped improvements, and use data to measure
  their impact. You'll own features end to end, from shaping
  the problem to launching and monitoring in production, and
  you'll help raise the bar on reliability and on-call health.
  AI is central to how we work. We use it to build faster, to
  improve the quality of what we ship, and to create smarter,
  more helpful customer experiences. We lead from the front on
  adopting it, while holding a high bar on security and craft.
  A card is a high-trust product, so speed never comes at the
  expense of quality. If you want to help change how people
  plan their purchases, with a customer-first mindset and an
  eye for both speed and craft, we'd love to meet you. What
  You'll Do

  - You will be responsible for setting technical strategy for
    your team on a year-long time scale, and help your team
    tie it together with critical, business-impacting
    projects.
  - You will collaborate across teams in the product development
    lifecycle by collaborating with product management, design
    & analytics to ensure technical sustainability, risks and
    trade-offs are well understood and managed.
  - You will act as a force-multiplier for your team through
    your definition and advocacy of technical solutions and
    operational processes.
  - You take ownership of your team’s operations and
    availability by ensuring you have the right monitoring,
    triage rotations, playbooks, policies, testing and
    alerting in place to support “keep the lights on” & on-
    call efforts.
  - You will foster a culture of quality and ownership on your
    team by setting code review and design standards for your
    team, and advocating for them beyond your team through
    your writing and tech talks.
  - You will help develop talent on your team by providing
    feedback and guidance, and leading by example.

  What We Look For

  - This is a full stack role. You have 8+ years of experience
    designing, developing and launching backend systems at
    scale using languages like Python or Kotlin.
  - You have an extensive track record of developing highly
    available distributed systems using technologies like AWS,
    MySQL, Spark and Kubernetes.
  - You have a total of 8+ years of experience as a software
    engineer.
  - You are proficient in developing web apps using declarative
    UI frameworks like React Native or React or Vue.
  - You are proficient in designing, developing and launching
    systems at scale.
  - You have experience delivering major features, system
    components or deprecating existing functionality in a
    system through the definition of a technical and execution
    plan. You write high quality code that is easily
    understood and used by others.
  - You thrive in ambiguity, and are comfortable moving from low
    level language idioms all the way to the architecture of
    large systems to understand how they work.
  - You think AI first and an adopter of latest technologies.
    You identify trends and safely apply them to the work.
  - Your growth and impact trajectory demonstrates that you have
    mastered gathering and iterating on feedback from your
    engineering and cross-functional peers.
  - You have strong verbal and written communication skills that
    support effective collaboration with our global
    engineering team.
  - This position requires either equivalent practical
    experience or a Bachelor’s degree in a related field.



  Base Pay Grade - P

  Equity Grade - 13

  Employees new to Affirm typically come in at the start of
  the pay range. Affirm focuses on providing a simple and
  transparent pay structure which is based on a variety of
  factors, including location, experience and job-related
  skills.

  Base pay is part of a total compensation package that may
  include equity rewards, monthly stipends for health,
  wellness and tech spending, and benefits (including 100%
  subsidized medical coverage, dental and vision for you and
  your dependents.)

  USA Pacific base pay range (CA, WA, NY, NJ, CT): $230,000 -
  $290,000

  USA Sapphire base pay range (all other U.S. states): $204,00
  - $264,000



   #LI-Remote

  Remote-first with flexibility built in Affirm is proud to be
  a remote-first company. Most roles can be done from almost
  anywhere within the country of employment. Some positions
  may occasionally require in-person work at an Affirm office,
  and a few are office-based due to the nature of the work.
  All new hires will be invited to attend an in-person
  onboarding experience.

  Benefits designed for you Our benefits reflect our
  commitment to care, transparency, and flexibility. Here are
  a few highlights:

  - Health coverage at no cost: We cover 100% of premiums for
    employees and their dependents.
  - Spending stipends: Monthly stipends support your tech setup,
    and the ability to choose health and wellness options that
    are right for you.
  - Time off to recharge: Flexible time off and generous holiday
    calendars help you rest when you need to.
  - Own a piece of what you build: Our employee stock purchase
    plan (ESPP) lets you buy Affirm stock at a discount.

  We’re committed to providing an inclusive interview process,
  including accommodations for candidates with disabilities.
  If you need support, we’re happy to help.

  For positions based in San Francisco or Los Angeles: Affirm
  considers qualified applicants with arrest and conviction
  records, as required by law.

  By clicking "Submit Application," you acknowledge that you
  have read Affirm's Global Candidate Privacy Notice and
  consent to the use of your personal information as
  described.
