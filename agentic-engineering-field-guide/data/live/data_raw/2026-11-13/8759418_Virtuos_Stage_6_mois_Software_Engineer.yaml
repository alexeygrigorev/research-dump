description: |
  Responsibilities

  Principales responsabilités :

  - Écrire le code qui répond aux exigences fonctionnelles et
    techniques des projets.
  - Comprendre, développer et optimiser le code des sous-
    systèmes du moteur.
  - Livrer un code propre, commenté et structuré.
  - Rédiger la documentation technique pour les autres
    programmeurs.
  - Rédiger de la documentation pour les utilisateurs finaux
    destinée aux concepteurs et aux artistes.
  - Travailler sur différents moteurs de jeu et s'adapter aux
    bases de code existantes.
  - Identifier les obstacles techniques et proposer des
    solutions correspondantes.
  - Communiquer sur l'état d'avancement de votre travail à votre
    responsable, signaler les problèmes et livrer les
    résultats dans les délais.
  - Suivre les instructions et conseils de votre Lead
    programmeur

  Qualifications

  Qualifications requises :

  - Français et anglais écrit et parlé.
  - Bonne connaissance de C/C++.
  - Bonne connaissance des mathématiques appliquées à la 3D.
  - Expérience de la programmation d'applications interactives
    en temps réel.
  - Expérience de l'équilibre entre performance et
    maintenabilité.
  - Capacité à se lancer sans crainte dans de grandes bases de
    code existantes.
  - Capacité à apporter des idées originales pour la production
    et le développement de jeux.
  - Bonnes capacités de communication.
  - Attitude autonome et proactive.
  - Esprit d'équipe !

  Qualifications souhaitables :

  - Formation bac +4/5 dans le domaine de la programmation
    professionnelle dans l'industrie du jeu vidéo ou tout
    autre domaine lié à une application en temps réel.
  - Expérience de la programmation C++ dans Unreal Engine 4.

  Ce que nous offrons :

  - Stage à partir de janvier 2026.
  - Une culture d'entreprise ouverte et collaborative.
  - Une entreprise située proche de la gere RER.
  - Possibilité de travailler partiellement à domicile.
  - Possibilités de travail à l'étranger.
  - Un régime de soins de santé.
  - Bâtiments d'équipe et activités d'entreprise.
  - Des boissons gratuites.
  - Et plus encore...

  About Us



    Founded in 2004, Virtuos is one of the largest independent
  video game development companies. We are headquartered in
  Singapore with offices in Asia, Europe, and North America.
  Specializing in full-cycle game development and art
  production, we have delivered high-quality content for more
  than 1,500 console, PC, and mobile games. Our clients
  include 23 of the top 25 gaming companies worldwide.




   About Our Team

   Founded in 2004, our Paris studio is located within the
  lush confines of Parc Saint-Christophe in Cergy – easily
  reachable by public transport.















          Our studio has a full suite of capabilities to
  undertake projects of varying scopes, including co-
  developments, adaptations, and remasters of AAA games. A
  great example of this is our recently launched homemade
  game, Mahokenshi, which was released in January 2023.




          Virtuos Paris houses a team of experts from
  technical artists and game designers to engineers. Our Paris
  studio takes pride in its engineering team’s depth of
  experience, which has been providing its rich expertise in
  re-engineering and adaptation, as well as in gameplay
  mandates to our global partners to bring some of the world’s
  top AAA games to life.














  About the Team

   • Work at Virtuos Paris studio, close to the city center of
  Paris - the iconic capital of France

   • Contribute to the world’s biggest AAA titles in gaming

   • End-of-project celebrations, teambuilding outings, and
  studio bonding activities

   • Gaming corners with consoles and a common area

   • Comprehensive medical healthcare provided for all staff

   • Remote work is possible

   • Relocation support

   • Career and international mobility opportunities with
  Virtuos Internal Mobility Program

   People matter. Diverse opinions and experiences matter. At
  Virtuos, our talented teams are the cornerstone of our
  success, and we recognize that fostering and advocating for
  inclusivity is at the center of what we do best - we make
  games better, together. Virtuos is proud to be an equal
  opportunity employer that embraces diversity of thought,
  expression, culture, and backgrounds.
