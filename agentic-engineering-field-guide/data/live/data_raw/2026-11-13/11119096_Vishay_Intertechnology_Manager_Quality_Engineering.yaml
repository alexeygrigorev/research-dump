  Do you want to help us build the DNA of tech.?  Vishay
  Spectrol is currently seeking applicants for a Quality,
  Environmental, Health & Safety Manager.  Candidates needs
  develop, maintain, and implement company quality,
  environmental, health & safety policies, processes, and
  systems.

  Job Location:

  The ideal candidate will be working on-site in the sunshine
  state of California, USA in the city of Ontario.  Ontario is
  named “The Next Urban Center” and is just one hour away from
  the Greater Los Angeles Area of great beaches, entertainment
  and a melting pot of diverse people and culture.

  What you will be doing:

  - Manage Receiving Inspectors, Final inspectors, and Quality
    Engineers.
  - Maintenance and development of the quality system and
    retention of ISO 9001:2015 certification in manufacturing
    facilities located in Ontario (California) and Mexicali
    (Mexico).
  - Maintenance and development of ISO 14001: 2015 and
    ISO45001:2018 certifications in manufacturing located in
    Ontario.
  - Coordinate external audits with an official registrar
    company.
  - Lead auditor for internal system audits which includes
    training auditors and directing internal audits in both
    facilities.
  - Respond to customer complaints and perform activities
    related to root cause identification and corrective action
    implementation. Must verify that corrective actions are
    effective and relate pertinent information to the customer
    and management.
  - Manage the Corrective Action Preventive Action program
    including NCMAs, supplier nonconformities, audit findings,
    etc…
  - Contribute to APQP activities related to new product
    development and prepare and submit PPAP packages to
    customers prior to full production.
  - Ensure all products, equipment and processes are fully
    qualified prior to changes being implemented,
    products/processes being moved to new locations or new
    product start up.
  - Develop, facilitate and review QEHS risk assessments for
    routine and non-routine activities in consultation with
    the operations team.
  - Actively participate in the EH&S incident investigations and
    prepare required reports in consultation with top
    management.
  - Train & create awareness to the employees of EH&S risks.
  - Review and understand military, automotive, aerospace, and
    commercial specifications prior to accepting contracts and
    ensure all quality requirements are met during the
    manufacturing process.
  - Ensure compliance with all regulatory requirements.
  - Anticipate resources needed yearly and budget for capital
    needed.
  - Identify QEHS objectives, prepare the metrics and reports
    related to QEHS activities, and present these metrics to
    staff and various levels of management.
  - Ability to effectively communicate verbally and in writing
    with all levels of management staff, suppliers, and
    customers.

  What you will bring along:

  - Bachelor’s degree in a related technical field
  - 3 to 5 years minimum experience within a manufacturing
    environment (including team management).
  - Good understanding of electromechanical concepts.
  - Knowledge of ISO 9001:2015 quality management system
    standard, ISO 14001:2015 environment management system
    standard and ISO 45001:2018 occupational health and safety
    management system standard.
  - Firm understanding of statistical concepts related to
    quality (SPC, NQA, DOE,…).
  - Strong knowledge of quality tools in term of problem solving
    (PDCA, 8D, …) and project management (FMEA, Functional
    analysis, project milestones…).
  - Ability to work hands on in a fast paced, unpredictable
    environment.
  - Must travel to Mexicali in support of the Quality functions.
  - May include travel to customer and/or suppliers.

  Rate of Pay:  $100,000 - $120,000 annual

