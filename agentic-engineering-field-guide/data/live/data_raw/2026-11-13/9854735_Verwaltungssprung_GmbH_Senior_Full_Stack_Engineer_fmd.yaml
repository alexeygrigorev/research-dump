description: |
  Verwaltungssprung is a Berlin-based GovTech company
  developing AI-powered software solutions to simplify and
  digitize administrative processes. Our platform enables
  citizens and public institutions to access secure, user-
  friendly, and fully digital public services. To support the
  growth of our organization, we are looking for a Senior Full
  Stack Engineer (f/m/d) with strong expertise in modern
  frontend and backend development, scalable system
  architectures, and high-quality software engineering
  practices. In this role, you will lead the technical
  implementation of digital platforms and AI-powered
  applications that modernize public administration and
  deliver seamless user experiences for citizens and
  institutions. Tasks * Design, develop, and maintain scalable
  full stack applications across frontend and backend systems
  * Lead the technical implementation of new features and
  platform functionalities * Build intuitive, high-performance
  user interfaces and robust backend services * Collaborate
  closely with Product, Design, AI, and Engineering teams to
  deliver impactful digital solutions * Ensure code quality,
  maintainability, security, and performance through best
  engineering practices * Develop and maintain APIs,
  databases, and cloud-based infrastructure components *
  Review code, mentor team members, and contribute to
  engineering standards and technical decisions * Optimize
  application scalability, reliability, and system performance
  * Contribute to architecture planning and continuous
  improvement of the development environment Requirements *
  Degree in Computer Science, Software Engineering, or a
  related field * Several years of experience in full stack
  software development * Strong expertise in modern frontend
  frameworks and backend technologies * Solid understanding of
  scalable architectures, APIs, databases, and cloud
  environments * Experience with CI/CD pipelines, automated
  testing, and DevOps practices * Strong knowledge of software
  engineering principles, clean code, and system design *
  Ability to lead technical initiatives and work
  collaboratively in cross-functional teams * Strong
  analytical and problem-solving skills * Excellent
  communication skills in English; German is a plus Benefits *
  Attractive above-average compensation package * Centrally
  located offices with access to the unique ThinkTank Campus
  in Berlin-Wannsee * Free snacks and beverages in our offices
  * Flat hierarchies, fast decision-making, and room for your
  own ideas * International team spirit with recognition of
  both collective and individual successes * Early
  responsibility and creative freedom from day one *
  Structured onboarding with a buddy and experienced mentor *
  Continuous training programs and regular development
  discussions Join Verwaltungssprung and become part of a
  mission-driven team building the future of digital public
  services. If you are passionate about translating complex
  requirements into meaningful digital solutions with real
  societal impact, we would love to hear from you.
