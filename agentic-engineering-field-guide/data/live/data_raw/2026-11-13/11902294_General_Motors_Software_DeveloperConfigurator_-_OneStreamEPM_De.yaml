description: |
  Description The Role General Motors is seeking a hands-on
  Software Developer/Configurator to design, develop, test,
  implement, and support OneStream/EPM applications and
  related software solutions. This role is ideal for a
  developer who enjoys turning business requirements into
  maintainable, scalable technology and who can contribute
  across the full software development lifecycle. The
  successful candidate will bring strong programming
  experience in C# and VB.NET , along with the ability to
  customize OneStream, build reusable solutions, troubleshoot
  complex issues, and collaborate with finance, functional,
  and technology partners. Experience with enterprise
  performance management, planning, consolidation, or related
  platforms is highly valuable. What You'll Do

  - Design, develop, test, deploy, and maintain OneStream
    applications, customizations, integrations, and supporting
    software components.



  - Write, enhance, debug, and optimize production-quality code
    using C#, VB, and VB.NET . Apply sound object-oriented
    programming and software engineering practices.



  - Translate business and finance-planning requirements into
    technical designs, development tasks, and reliable
    software solutions.



  - Build reusable, flexible, and globally compatible frameworks
    and components that improve the maintainability and
    scalability of EPM solutions.



  - Participate in the full development lifecycle, including
    requirements analysis, technical design, coding, code
    review, testing, deployment, documentation, and post-
    implementation support.



  - Investigate defects and production issues, identify root
    causes, and implement durable fixes and performance
    improvements.



  - Collaborate with functional teams, project managers, and
    stakeholders to deliver high-quality solutions and support
    business adoption.



  - Contribute to coding standards, development methodologies,
    technical documentation, test plans, and knowledge-sharing
    activities.



  - Provide technical guidance and mentorship to other
    developers while promoting clean code, effective testing,
    and continuous improvement.


   Required Qualifications

  - Bachelor's degree in STEM, computer science, information
    technology, or related field.



  - 5+ years of overall experience in planning development,
    software development, or a related technical discipline.



  - Nice to have hands-on OneStream application development
    experience.



  - Professional software development experience with C# and
    VB.NET . Candidates should be comfortable with reading,
    writing, debugging, enhancing, and supporting code in
    these languages.



  - Working knowledge of software development fundamentals,
    including object-oriented design, coding standards,
    testing, troubleshooting, version control, and technical
    documentation.



  - Extensive knowledge of finance planning and consolidation
    processes.



  - Nice to have experience with enterprise planning and EPM
    technologies such as OneStream, Oracle, Hyperion, Hyperion
    Planning, PBCS, EPBCS, or Essbase.



  - Experience with VBA and finance data warehouse analytics.



  - Knowledge of SAP, GitHub, Azure Databricks, and Power BI.



  - Ability to develop reusable, flexible, and globally
    compatible technical frameworks and architecture.


   Preferred Qualifications

  - Experience delivering software enhancements, integrations,
    and customizations in OneStream or comparable EPM
    platforms.



  - Demonstrated ability to design and lead implementations of
    maintainable solutions in C# and VB.NET .



  - Experience participating in code reviews, automated or
    structured testing, release activities, and production
    support.



  - Strong problem-solving, analytical, communication, and
    collaboration skills.



  - Experience in IDE/AI tools (like Cursor, GIT HUB COPILOT,
    Glean, Claude)



  - Ability to work independently, contribute as part of a
    cross-functional team, and mentor junior developers.



  - Ability to deliver quality software solutions in a dynamic
    environment with challenging timelines.


   Who You Are

  - A developer who enjoys solving complex problems with clean,
    practical, and maintainable code.



  - Curious, resourceful, and willing to work across application
    development, troubleshooting, support, and stakeholder
    collaboration.



  - Comfortable learning new technologies and applying software
    engineering practices in an enterprise EPM environment.



  - A team player who communicates clearly and takes ownership
    of delivering reliable solutions.


