description: |
  About Hubs

  At Hubs, we're building the intelligence layer for
  organizations — where anyone can build AI solutions that
  spread and compound across the org. Our team is growing,
  fast-moving, and ambitious — led by multi-exit Silicon
  Valley entrepreneurs with a strong track record of creating
  products that shape how people work.

  Along the way, we get to work with some of the most exciting
  parts of technology today — autonomous AI, innovative UIs,
  and reactive dataflows. It's the kind of work where the
  engineering itself feels fresh and creative, with room for
  invention and curiosity.

  Joining Hubs means working on problems that matter. You'll
  be building for yourself, your peers, and millions of
  professionals navigating the shift from pre-AI to AI-first
  work. The products you create will be visible, widely used,
  and part of a broad societal transformation in how knowledge
  work gets done.

  About the Role

  We’re looking for a Senior Frontend UX Engineer who is
  passionate about creating experiences, not just interfaces.
  Our product is a breakthrough visual canvas for AI that
  redefines how human and machine intelligences collaborate.
  Basic building blocks called tiles are interactively
  composed into dataflow mosaics that generate  real-time
  insight, with seamless support for agentic automation and
  autonomy. Our product is not a simple dashboard or data
  viewer — it’s a persistent intelligent workspace where
  aesthetics, intuitiveness, and smooth workflows are
  absolutely critical.

  You will play a key role in shaping how users feel when they
  interact with our product. As part of the UX design council,
  you'll need to think deeply about collaboration, complex
  interactions, and how to make a powerful tool feel simple
  and delightful. This highly collaborative role is ideal for
  someone who doesn’t just “implement specs” but actively
  improves them, anticipating user needs and sweating the
  details that make an interface feel polished and intuitive

  Responsibilities

  - Lead
                  the end-to-end implementation of user-facing
  features, from concept to release.
  - Translate
                  design ideas into seamless, performant, and
  accessible experiences.
  - Work
                  closely with product management, design
  council, and backend team to ensure interactions are both
  elegant and technically sound.
  - Bring
                  attention to detail and polish — raising the
  bar and reducing rework by getting things right the first
  time.
  - Help
                  shape best practices for frontend
  development in a growing, ambitious team.

  Requirements

  Core Technical Skills

  - Expert-level
                  proficiency in React (and ideally Next.js or
  similar SSR frameworks).
  - Strong
                  background in real-time applications
  (WebSockets, CRDTs/OT collaboration patterns).
  - Deep
                  experience with CSS architecture, animation
  libraries, and building pixel-perfect UIs.
  - Familiarity
                  with performance optimization (lazy-loading,
  memoization, bundle optimization).
  - Strong
                  grasp of accessibility standards (WCAG) and
  responsive design principles.

  UX & Product Thinking

  - Passion
                    for creating experiences, not just
  interfaces — you empathize with users and design for ease of
  use vs. power tradeoffs.
  - Ability
                    to simplify complex workflows into
  elegant, intuitive interactions.
  - Obsessive
                    attention to micro-interactions, motion,
  and polish — you notice when a pixel is off or a transition
  feels wrong.
  - Aesthetic
                    sense for color, typography, and spacing
  that builds user trust and delight.
  - Experience
                    with collaborative or interactive apps
  (e.g. Figma, Notion, Miro, Google Docs-like systems).

  Mindset & Collaboration

  - A
                    proactive, “product-first” approach — you
  challenge specs when they don’t feel right and propose
  better solutions.
  - Comfortable
                    with ambiguity and excited to co-create
  features, not just build tickets.
  - Strong
                    communication skills and ability to
  collaborate with designers, PMs, and backend engineers to
  ship quickly without sacrificing quality.
  - A
                    builder at heart — self-directed, curious,
  and eager to ship beautiful, impactful features.
  - Committed
                    to shaping and scaling best practices for
  frontend development and design systems as the team grows.

  Benefits

  At Hubs, we’re committed to building not just transformative
  products, but also a place where ambitious builders can
  thrive. You’ll join a fast-moving, design-obsessed team
  where your ideas have real impact from day one. We offer a
  competitive salary, a chance for participation in upside via
  stock plans, and the flexibility of a remote-first
  environment. As an early member of the engineering team,
  you’ll help shape both our product and our culture, working
  alongside passionate people who care deeply about craft,
  autonomy, and creating experiences users love.
