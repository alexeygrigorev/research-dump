description: |
  At Duna, we see the company as the second product we’re
  building and are continually working to create a
  transparent, ambitious culture. We want this to be the place
  where you do your best work.

  Our mission is to redefine identity for the global economy.
  We’re backed by world-class investors including Index
  Ventures as well as founders and executives from companies
  like Stripe, Adyen, Notion, Remote, Qonto, Framer,
  Anthropic, Mollie, OpenAI, Goldman Sachs.

  Since your role with us will rarely fit a job description,
  we only wrote a crisp overview. WHAT YOU'LL BE DOING IN THIS
  ROLE

  - Design and build backend systems that are clean, testable,
    and efficient
  - Architect scalable APIs and infrastructure for high-trust
    environments
  - Own core systems end to end, and stay hands-on in the code
  - Bring strong opinions on testing, quality, and long-term
    maintainability
  - Tackle complex product challenges with a user-first mindset
  - Shape our engineering practices and technical culture

  WHAT WE'RE LOOKING FOR

  - Senior or staff-level experience building and owning
    production systems
  - Systems thinking - you see beyond features to long-term
    system behaviour
  - Clear communicator who enjoys breaking down complexity and
    collaborating deeply
  - Appetite for learning and working in ambiguity
  - Curiosity
  - Big ambitions
  - Kindness

  Bonus if you've built AI features and the evaluations behind
  them, or worked on product analytics.

  Our current stack includes Node.js + TypeScript, Event
  Sourcing, Express, Postgres, RabbitMQ, Kubernetes, AWS.
  Experience with these is a plus, but not required. We are
  more excited about how you approach problems and find
  solutions.

  A final note before you apply: please read through our
  website in detail. You'll find the fundamentals there: what
  we believe in, how we work, and why we're building this
  company.

  We're a remote-first, fast-moving team of builders looking
  for exceptional people who love to create, build, and ship.
  Beyond passion and grit, we highly value curiosity,
  authenticity and kindness.

  If this sounds like you, we'd love to hear from you!

  PS. We are looking to hire passionate people from a variety
  of backgrounds. So even if you don't check all the boxes, we
  welcome your application!
