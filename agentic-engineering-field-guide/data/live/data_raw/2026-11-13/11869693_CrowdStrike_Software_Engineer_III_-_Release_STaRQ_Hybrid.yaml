description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  We are CrowdStrike, a fast-growing security company that
  protects a wide range of customers from cybersecurity
  attacks. We're investing in sensor Release Engineers who are
  energetic, eager to learn, flexible, and capable of managing
  large scale/complex engineering projects in a fast-paced
  environment.

  As a Release Engineer, you will focus on the entire Release
  Management lifecycle, from build execution, deployment and
  post-release support. You will coordinate releases across
  multiple teams, build automated release processes, and
  ensure quality deployments across our environments. This is
  an operations heavy role with supporting projects to improve
  tooling and deployment quality.

  Ideal candidate has experience deploying software at scale
  across millions of endpoints. Has demonstrated experience
  with data driven decisions, using deployment telemetry and a
  history of improving deployment tooling.

  Location and Work Arrangement:

  - This role is a hybrid role with an expectation of at least
    2x days in office each week, working out of one of the
    posted locations:.

  What You'll Do:

  - Own the release process end-to-end, from initial build
    creation through production deployment and post-release
    monitoring
  - Execute and manage release builds across multiple platforms
    (Platforms supported are Windows, Mac, Linux, Containers
    and mobile), including initial validation and triage of
    test failures.
  - Establish and improve consistent release management
    processes and cadence
  - Facilitate cross-department coordination of release
    activities
  - Develop scripts and automation tools for building,
    integrating, and deploying software releases
  - Track and manage a multi-platform release calendar
  - Inform stakeholders across worldwide business units of
    release risks and work to effectively mitigate them
  - Measure release effectiveness using common metrics and
    identify opportunities for greater efficiency
  - Define mechanisms for rollback and standards for capturing
    release-related performance indicators
  - Lead efficient release blocker meetings and go-live
    activities

  What You'll Need:

  - Experience working in a release management capacity for
    software development
  - Familiarity with common CI/CD tools such as Jenkins, Git, or
    Bitbucket
  - Experience with build systems and troubleshooting build
    failures
  - Ability to interpret test results and perform basic
    debugging to identify issue patterns
  - Proficiency with tools/languages including Jira, Confluence,
    Query engine like Splunk, Python, Go
  - Problem-solving skills to handle multiple concurrent
    releases in a fast-paced environment
  - Experience with software development life-cycle,
    specifically Agile/Scrum
  - Excellent written and verbal communication skills
  - Ability to work effectively with cross-functional groups
    across divisions worldwide
  - Meticulous attention to detail with ability to make good,
    timely decisions
  - Willingness to support critical release windows which may
    occasionally occur outside standard business hours
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

