description: |
  About Bask Health

  Bask Health is a software platform that enables
  entrepreneurs, doctors, and healthcare businesses to launch,
  manage, and grow direct-to-consumer telehealth businesses.

  Our platform brings together patient experiences, clinical
  workflows, pharmacy operations, and commerce tools in one
  place.

  We're an entrepreneurial, product-focused engineering team
  that values ownership, technical excellence, and building
  software that solves real problems. Engineers work closely
  with product teams and company leadership, take features
  from idea to production, and have a direct role in shaping
  the platform.

  Engineering at Bask is AI-first and builder-led. We use
  tools like Cursor and Claude Code throughout development
  while maintaining high standards for reliability, testing,
  and software quality.

  About the Role

  We're looking for a Frontend Engineering Intern to join Bask
  Health's engineering team and gain hands-on experience
  building modern web applications.

  This internship is designed for students, recent graduates,
  and aspiring software engineers who want to strengthen their
  frontend development skills while contributing to real
  product features. You'll work alongside experienced
  engineers, designers, and product managers to help build and
  improve the interfaces that power Bask's telehealth
  platform.

  You'll contribute to frontend components, responsive
  layouts, forms, application workflows, and user interface
  improvements. Your projects may involve merchant dashboards,
  patient-facing experiences, storefronts, or internal
  applications used by Bask's teams.

  You'll gain practical experience with technologies such as
  React, Next.js, TypeScript, HTML, and CSS while learning how
  professional engineering teams plan, develop, test, review,
  and deploy software.

  This is a hands-on engineering internship, not an
  observational program. You'll write code, participate in
  development discussions, receive feedback through code
  reviews, and contribute to features that may be used in
  production.

  We're looking for someone who enjoys programming, is eager
  to learn, and takes initiative when solving problems. You
  don't need previous professional experience, but you should
  have a basic understanding of frontend development and be
  able to demonstrate your interest through coursework,
  personal projects, or other hands-on experience.

  What You'll Do

  - Assist with developing frontend features across Bask
    Health's web applications.
  - Work with experienced engineers to implement user interface
    components and application functionality.
  - Write frontend code using JavaScript, TypeScript, React, and
    Next.js.
  - Help build responsive interfaces using HTML, CSS, and modern
    frontend development techniques.
  - Develop reusable components for merchant-facing and internal
    applications.
  - Assist with implementing forms, navigation elements,
    buttons, modals, and other interactive components.
  - Translate design specifications and Figma files into working
    frontend interfaces.
  - Support improvements to merchant dashboards, storefronts,
    and patient-facing experiences.
  - Help connect frontend components to backend APIs and
    application data.
  - Assist with implementing basic application state and
    interactive functionality.
  - Learn how to handle user input, validation, and error
    messages.
  - Help identify and resolve frontend bugs and layout issues.
  - Test interfaces across different browsers and screen sizes.
  - Support accessibility and responsive design improvements.
  - Collaborate with designers to improve visual consistency and
    usability.
  - Learn and apply frontend coding standards and development
    best practices.
  - Write clean, readable, and maintainable code.
  - Assist with writing unit tests and checking frontend
    functionality.
  - Participate in code reviews and apply feedback from
    experienced engineers.
  - Use Git and established development workflows to manage code
    changes.
  - Help document reusable components and implementation
    details.
  - Participate in engineering discussions and team
    collaboration.
  - Learn how frontend applications interact with backend
    services.
  - Assist with improving application performance and loading
    behavior.
  - Explore new frontend technologies and development techniques
    when relevant.
  - Use AI-assisted development tools while reviewing and
    understanding generated code.
  - Complete assigned development tasks with guidance and
    gradually take on more responsibility.

  RequirementsRequirements

  - Currently studying computer science, software engineering,
    web development, or a related field, or developing
    equivalent skills through bootcamps or independent
    learning.
  - Basic knowledge of JavaScript.
  - Familiarity with HTML and CSS.
  - Foundational understanding of how websites and web
    applications work.
  - Basic experience with React or another frontend framework
    through coursework or personal projects.
  - Interest in learning TypeScript and modern frontend
    development tools.
  - Understanding of fundamental programming concepts.
  - Familiarity with responsive web design principles.
  - Basic understanding of reusable UI components.
  - Willingness to learn how frontend applications communicate
    with APIs.
  - Familiarity with Git or willingness to learn version
    control.
  - Ability to write organized and readable code.
  - Basic problem-solving and debugging skills.
  - Attention to detail when implementing frontend interfaces.
  - Interest in user interface development and user experience.
  - Willingness to learn software testing and quality assurance
    practices.
  - Ability to follow technical instructions and development
    guidelines.
  - Strong curiosity and willingness to explore unfamiliar
    technologies.
  - Ability to ask questions and seek guidance when needed.
  - Openness to constructive feedback and code reviews.
  - Good communication and collaboration skills.
  - Ability to manage assigned tasks and communicate progress.
  - Willingness to learn professional software development
    workflows.
  - Genuine interest in building useful web applications.
  - Comfort collaborating with a remote engineering team.

  Nice to Have

  - Personal projects demonstrating frontend development skills.
  - Coursework or projects involving React.
  - Familiarity with TypeScript.
  - Experience building applications with Next.js.
  - Familiarity with Tailwind CSS or comparable styling
    frameworks.
  - Experience translating Figma designs into working
    interfaces.
  - Familiarity with responsive layouts using Flexbox and CSS
    Grid.
  - Experience building forms or interactive web components.
  - Basic understanding of REST APIs.
  - Familiarity with browser developer tools.
  - Experience using GitHub for personal or collaborative
    projects.
  - Exposure to component libraries or design systems.
  - Familiarity with frontend state management concepts.
  - Experience writing basic unit tests.
  - Exposure to accessibility and semantic HTML.
  - Experience building a personal portfolio website.
  - Contributions to open-source or collaborative development
    projects.
  - Interest in e-commerce, SaaS, or healthcare technology.
  - Familiarity with frontend deployment platforms or CI/CD
    workflows.
  - Experience using AI-assisted development tools such as
    Cursor or Claude Code.
