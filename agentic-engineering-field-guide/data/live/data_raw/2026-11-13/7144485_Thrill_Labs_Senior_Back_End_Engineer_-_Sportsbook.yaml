description: |
  About the company

  At Thrill Labs, we're not just building a gaming company;
  we're creating a global sensation. We are the innovative
  force behind Thrill.com, a groundbreaking crypto gaming
  venture set to launch soon! Our mission? To build the
  world’s most epic gaming brand and craft magical experiences
  for millions of users. Backed by a world-class team, we’re
  here to redefine the future of gaming.﻿

  About the role We are seeking for a Senior/Lead Back End
  Software Engineers with building Sportsbook from scratch to
  join our brand new Sportsbook team we are building. In this
  role, you will be a crucial player in our growth,
  responsible for the end-to-end software development cycle,
  from framing product requirements and designing to testing
  and maintaining deployments for Sportsbook.

  Your contributions will be critical in shaping our product
  and architecture, ensuring high-quality deliverables in an
  agile environment. This is a unique opportunity to work on
  cutting-edge solutions and build robust backend systems that
  power our platform.

  What You’ll Be Doing:

  - Design, develop, and maintain scalable and efficient
    software solutions for our new Sportsbook platform
  - Collaborate with cross-functional teams to gather
    requirements and translate them into technical
    specifications.
  - Troubleshoot and debug technical issues.
  - Lead architectural discussions and make informed technology
    decisions to improve system performance and reliability.
  - Conduct reviews, ensuring adherence to best practices and
    coding standards.

  What You’ll Need:

  - Proven experience in building Sports betting application
    from scratch
  - 7+ years of software development experience, with a strong
    background in Java/Kotlin and Spring.
  - Experience leading the design and implementation of large-
    scale software systems, particularly with a focus on
    distributed systems.
  - Experience with AWS.
  - Experience building CI/CD pipelines.
  - Good communication skills, capable of explaining technical
    concepts to non-technical stakeholders.
  - Good command of English (at least B2 equivalent).

  Why Join Us? At Thrill Labs, your creativity will shape the
  future of entertainment products. This is more than a job;
  it’s an opportunity to leave your mark on a global stage. If
  you’re ready to take on the challenge, push boundaries, and
  build a brand like no other, we want you on our team.

  Ready to Create the Next Big Thing? Apply Now!
