description: |
  QuantCo turns advances at the frontier of artificial
  intelligence and statistical learning into real-world impact
  in globally leading enterprises. Our deep learning
  engineers, quantitative researchers, software developers,
  and product experts work together to build scalable systems
  that solve complex, economically critical challenges – from
  pricing and fraud detection for financial services to risk
  modeling for healthcare.

  Our solutions are built on a deep understanding of the
  decisions and processes that drive success in large
  enterprises. QuantCo’s technology combines extensive
  organizational and data access with our team’s world-class
  expertise in AI research, quantitative optimization, and
  systems engineering to optimize and continuously improve key
  decisions and workflows in production.

  Help us build great products!

  Steering workflows in real time, extracting insights from
  large volumes of unstructured data, and enabling financially
  transformative decisions present unique challenges in human-
  computer interaction and when building intuitive user
  interfaces for AI-based systems. Our front-end engineers are
  user-focused systems thinkers who tackle these challenges in
  close collaboration with deep learning engineers, AI
  scientists, and other software teams.

  You will work in an agile, cross-functional team on
  innovative greenfield projects in an environment that lets
  you make fundamental decisions to avoid long-standing
  technical debt. You will own applications end-to-end, from
  ideation and prototyping to production, and continuously
  refine features based on user feedback and data to deliver
  measurable impact.

  What we are looking for:

  - at least 3 years of experience as a front-end engineer
    building complex React applications that solve real user
    problems
  - self-direction and drive to create exceptional experiences
    without needing detailed specifications, while proactively
    engaging others in important decisions
  - adaptability to evolving requirements and openness to rapid
    iteration, balancing pragmatism with perfectionism to
    build great products
  - proficiency with TypeScript; Python knowledge is beneficial
  - experience in designing and implementing backends for
    frontends
  - ability to write clean, effective, and production-ready code

  What we offer:

  Working from one of our state-of-the-art offices, you will
  be part of a smart, motivated, and driven team solving
  challenging real-world problems. We offer a generous
  compensation package that includes a base salary, bonus,
  stock options, along with additional location-based
  benefits.

  About QuantCo

  At QuantCo, we leverage expertise in data science,
  engineering, and economics to help organizations turn data
  into decisions. Started by 4 PhDs from Harvard and Stanford,
  we are now more than 180 professionals with extensive
  quantitative, engineering, and business experience. We are
  globally distributed with offices in Berlin, Boston,
  Cologne, Karlsruhe, London, Munich, San Francisco, and
  Zurich.



  Our solutions include algorithmic pricing, data-driven
  claims management, and high-dimensional forecasting systems.
  Our customers include some of the largest financial, retail,
  and healthcare organizations in the US and Europe. We impact
  core business processes and decisions by combining advanced
  data-driven insights with scalable engineering solutions.



  We are excited about writing mission-critical code that
  affects millions of people and impacts billions of dollars.
  If you feel the same way, we look forward to hearing from
  you.
