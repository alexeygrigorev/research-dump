description: |
  Canonical is a leading provider of open-source software and
  operating systems for global enterprise and technology
  markets. Our platform, Ubuntu, is very widely used in
  breakthrough enterprise initiatives such as public cloud,
  data science, AI, engineering innovation and IoT. Our
  customers include the world's leading public cloud and
  silicon providers, and industry leaders in many sectors. The
  company is a pioneer of global distributed collaboration,
  with 1200+ colleagues in more than 80 countries and very few
  office-based roles. Teams meet two to four times yearly in
  person, in interesting locations around the world, to align
  on strategy and execution.

  The company is founder led, profitable and growing.

  We are hiring an Engineering Manager, who strives for
  accountability for the development of an internal product,
  who has high engineering quality standards, continuously
  develops their skills as well as skills of their direct
  reports, and who has the drive to deliver. This is an
  exciting opportunity to work with great people and exciting
  open-source solutions on innovative engineering solutions
  supporting Canonical's growth.

  The Commercial Systems unit is conceived as six engineering
  teams that closely collaborate with other engineering and
  business teams at Canonical. Services designed, developed,
  and operated by the Commercial Systems unit are at the heart
  of Canonical business.

  The Business Systems team is responsible for systems such as
  NetSuite, Salesforce, and several others. The team works
  closely with operations teams, implements business
  processes, and keeps the systems compliant. This team is a
  great opportunity for a software engineering leader with a
  genuine interest in understanding the business, high
  engineering standards, and drive to deliver first-class
  experience to Canonical employees using those systems to get
  their job done.

  Location: This role will be based remotely in the EMEA
  region.

  The role entails

  - Accountability for the design and development of an internal
    product
  - Leading a team of software engineers
  - Developing the skills and capabilities of direct reports
  - Seeking improvements to established processes, designs, and
    solutions
  - Building an understanding of business needs to deliver the
    most impact

  What we are looking for in you

  - Exceptional academic track record from both high school and
    university
  - Undergraduate degree in a technical subject or a compelling
    narrative about your alternative chosen path
  - Track record of going above-and-beyond expectations to
    achieve outstanding results
  - Experience with software development in Salesforce,
    NetSuite, or other CRM/ERP system
  - Professional written and spoken English with excellent
    presentation skills
  - Result-oriented, with a personal drive to meet commitments
  - Ability to travel internationally twice a year, for company
    events up to two weeks long

  Nice-to-have skills

  - Experience with accounting, sales, sales operations, or
    other business roles
  - Performance engineering

  What we offer colleagues

  We consider geographical location, experience, and
  performance in shaping compensation worldwide. We revisit
  compensation annually (and more often for graduates and
  associates) to ensure we recognize outstanding performance.
  In addition to base pay, we offer a performance-driven
  annual bonus or commission. We provide all team members with
  additional benefits, which reflect our values and ideals. We
  balance our programs to meet local needs and ensure fairness
  globally.

  - Distributed work environment with twice-yearly team sprints
    in person
  - Personal learning and development budget of USD 2,000 per
    year
  - Annual compensation review
  - Recognition rewards
  - Annual holiday leave
  - Maternity and paternity leave
  - Employee Assistance Program
  - Opportunity to travel to new locations to meet colleagues
  - Priority Pass, and travel upgrades for long haul company
    events

  About Canonical

  Canonical is a pioneering tech firm at the forefront of the
  global move to open source. As the company that publishes
  Ubuntu, one of the most important open source projects and
  the platform for AI, IoT and the cloud, we are changing the
  world of software. We recruit on a global basis and set a
  very high standard for people joining the company. We expect
  excellence - in order to succeed, we need to be the best at
  what we do. Most colleagues at Canonical have worked from
  home since its inception in 2004. Working here is a step
  into the future, and will challenge you to think
  differently, work smarter, learn new skills, and raise your
  game.

  Canonical is an equal opportunity employer

  We are proud to foster a workplace free from discrimination.
  Diversity of experience, perspectives, and background create
  a better work environment and better products. Whatever your
  identity, we will give your application fair consideration.

