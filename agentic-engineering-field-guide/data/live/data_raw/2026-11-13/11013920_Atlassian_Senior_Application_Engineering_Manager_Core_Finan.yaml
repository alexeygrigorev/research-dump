description: |
  Atlassian Corporate Engineering (ACE) | Seattle, United
  States | San Francisco, United States | Mountain View,
  United States or Remote Working at Atlassian Atlassians can
  choose where they work - whether in an office, from home, or
  a combination of the two. That way, Atlassians have more
  control over supporting their family, personal goals, and
  other priorities. We can hire people in any country where we
  have a legal entity. Interviews and onboarding are conducted
  virtually, a part of being a distributed-first company. As a
  Senior Application Engineering Manager on the Atlassian
  Corporate Engineering- Finance Technology team, you will get
  the opportunity to work on Oracle Fusion Cloud and other
  Finance SaaS applications that help modernize Finance
  Operations by embarking on transformations, automations,
  AI/ML and other Finance priorities. You will use your
  application development and engineering expertise to solve
  difficult problems, tackling complex architecture challenges
  and proposing effective business options. You will have the
  opportunity to lead a group of application development
  engineers and software engineers to drive run the business
  and also projects from technical design to launch. You will
  also collaborate with other teams and internal customers to
  set expectations, gather input, and communicate results. In
  this role:

  - You will be leading a team comprised of application
    development engineers and software development engineers
    across all levels. You will be guiding run-the-business
    operations, projects, and partnering across engineering
    teams to take on company-wide initiatives spanning
    multiple projects.
  - Maximize Oracle Fusion Cloud features: Lead the team in
    understanding our current implementation and guide them in
    leveraging new Fusion features that comes out after every
    quarterly upgrade for our Finance team. You will work on
    all Core Financial modules (OM, AR, AP, FA, GL). You will
    ensure all projects are meeting OKRs.
  - Automation Mindset: Understand current operational
    challenges and inspire the team with an automation mindset
    using RPA and low-code/no-code tools to drive efficiency
    across the Finance organization. You will also get an
    exposure to AI/ML and how you can impact Finance.
  - Best of Breed SaaS: We operate a best-of-breed SaaS
    ecosystem for our Finance functions. You will get the
    chance to lead, integrate, and maintain the integrations
    between Fusion Cloud and the Finance SaaS footprint. We
    use Zuora, Coupa, Anaplan, Avalara, Fieldglass and other
    SaaS packages to name a few to serve our function.
  - Metrics driven: Be passionate about metrics and outcomes for
    the business teams, and help your team see why they are
    doing certain things and ensure outcomes are not only
    achieved but are measured. You will also get a chance to
    work with Internal Audit to ensure our systems continue to
    be SOX compliant.
  - Collaborate with diverse minds: Partner with a brilliant
    team of engineers, data scientists, and Technical Product
    managers, cross-pollinating ideas and learning from each
    other's expertise
  - Make a tangible impact: Your work will directly influence
    the reliability and performance of Finance systems,
    driving customer satisfaction and propelling our business
    forward. This is an extremely high-visibility role. You
    will make an impact across Procurement, Tax, Treasury,
    FP&A, Accounting and Internal Audit.
  - Routinely tackle complex architectural challenges, spar with
    other principal engineers to build and maintain critical
    integrations to Fusion, including new M&A as and when it
    occurs. Lead code reviews & documentation as well as take
    on complex bug fixes, especially on high-risk problems.

  Key Qualifications:

  - Core Finance Domain Expertise with experience in leading
    Finance Business Transformation efforts using latest
    technologies and SAAS application stacks.
  - Expertise in Oracle Fusion Cloud and Other SaaS systems
    (Zuora, Coupa, Fieldglass, Anaplan, Avalara)
  - At least 9+ years of industry experience working as a hands-
    on senior engineering manager, managing a team of
    application development engineers in Core Finance domain.
  - Good understanding of application development supporting
    large organizations. Experience in running transformations
    would be a huge plus.
  - Experience in automation, PaaS and BRE tools (RPA, Workato,
    Camunda)
  - Exposure to upstream and downstream systems such as
    SalesForce, Databricks would be a plus.
  - Familiarity with AI/ML, and implementation of use cases for
    any business function
  - Comfortable operating a 24x7 highly reliable system and
    driving a culture of continuous improvement from the ashes
    of incidents
  - Strong interpersonal, communication and presentation skills
    as this role requires interacting with senior Finance and
    Engineering stakeholders
  - Passion to make a difference everyday

