  Senior Manager, Software Engineering - Developer Platform
  (DevTools)About Ping Identity:

  As Senior Manager, Software Engineering for Developer
  Platform & Experience, you will lead the DevTools
  engineering team supporting PingOne Multi-Tenant SaaS.
  DevTools owns the continuous delivery model, application
  CI/CD pipelines, build systems, and self-service developer
  tooling that enable 400+ engineers to ship code safely and
  rapidly. Reporting to a Senior Director of Engineering, you
  will lead a globally distributed team across North America
  and India, driving operational rigor, efficiency, and
  platform modernization.

  Key Responsibilities:

  - Drive the adoption of AI-enabled capabilities across
    developer tooling and pipelines to improve system
    reliability, developer efficiency, and automated failure
    remediation.
  - Set technical direction and own the continuous delivery
    model, application CI/CD pipelines, and build systems
    supporting multitenant SaaS engineering.
  - Contribute technically to the platform: provide
    architectural oversight, lead design reviews, and guide
    hands-on technical problem-solving to ensure pipeline
    scalability, reliability, and security.
  - Treat the developer platform as a product, partnering across
    engineering to define paved roads, self-service developer
    tooling, and automated workflows that accelerate developer
    productivity.
  - Establish a strong operational culture around proactive
    alerting, system observability, rapid incident response,
    and disciplined internal RCAs to eliminate recurring
    platform issues.
  - Lead, mentor, and grow a globally distributed team of senior
    and staff engineers across North America and Bangalore,
    maintaining an uncompromising technical bar, high team
    throughput, and a culture of continuous technical
    excellence.

  You have:

  - 5+ years of engineering management experience leading
    platform, CI/CD, DevTools, or infrastructure engineering
    teams.
  - 8+ years of hands-on software development experience with
    Java (Spring Boot), Groovy pipeline-as-code, Python, or
    shell scripting in enterprise cloud environments.
  - Proven track record implementing AI-assisted engineering
    workflows or automation to improve platform reliability,
    failure diagnosis, or pipeline self-healing.
  - Deep technical expertise in modern CI/CD architectures and
    toolchains: Jenkins (pipeline-as-code), GitHub, Docker,
    Kubernetes/Helm, and AWS.
  - Proven success running developer platforms as a product
    supporting 100+ engineers, defining clear SLAs/SLOs, and
    driving adoption of paved-road tooling.
  - Strong track record operating at a Principal-level technical
    bar, conducting rigorous architecture reviews and
    collaborating effectively with Staff/Principal engineers
    and senior leadership.
  - Bachelor's Degree in Computer Science or equivalent
    practical experience.

