    wins as a team.
  - We Care about ResultsBe high productivity, low drama.
    Results matter. To keep our pace, everyone owns the
    outcomes of their actions and takes action when needed. We
    reward speed over perfection. We empower each other to
    iterate and experiment.You are welcome at Gremlin for who
    you are. The more voices and ideas we have represented in
    our business, the more we will all flourish, contribute,
    and build a more reliable internet. Gremlin is a place
    where everyone can grow and is encouraged. However you
