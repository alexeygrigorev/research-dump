description: |
  Company Description

  At Xplor, we help businesses thrive by making life simple
  for daily activities with a recurring nature. We do that by
  offering smart software, payments, and commerce-enabling
  solutions across five “everyday life” verticals: Education,
  Health and Fitness, Boutique Wellness, Field Services and
  Personal Services. 

  At Xplor Mariana Tek, our mission is to simplify fitness
  studio management by making it approachable, effortless, and
  focused on the people who matter most.

  Our core values - Make Life Simple, Build for People, Move
  with Purpose, and Create Lasting Communities are key to who
  we are and what guides us from how we hire to how we
  recognize our team members.

  Job Description

  We’re looking for a back end platform software engineer who
  can design and write code in a multi-tenant SaaS
  environment. The candidate needs to be highly collaborative,
  productive in a dynamic development environment and be
  willing to utilize AI in their day-to-day work.

  Job Description

  - Collaboration with teammates and other functions in a
    geographically distributed remote environment
  - Hands-on development with Python, Django, Ember and
    PostgreSQL
  - Creating well-designed, testable, efficient systems
    following company processes and industry best practices
  - Leading technical design initiatives and efforts
  - Troubleshooting and resolving software defects
  - Utilizing PRs as a path to teach and learn
  - Shared ownership for team dynamics, processes and growth

  Location

  At Xplor, we value flexibility. This role is fully remote
  within the US. You'll collaborate closely with others across
  many time zones and some overlap in working hours is
  important.

  Qualifications

  Must-haves

  - Successful collaboration in a remote environment
  - Python and Django (REST APIs, models, migrations)
  - PostgreSQL and comfort writing / reasoning about SQL
  - Multi-tenant SaaS (tenant isolation, shared vs tenant data)
  - Git / GitHub and PR-based delivery
  - Use of Docker for local development
  - Writing and maintaining robust tests
  - Willingness to utilize AI in day-to-day work
  - AWS basics (S3, RDS, containers)

  Strongly preferred

  - Django REST Framework (or equivalent API framework)
  - Dependency Upgrade experience
  - Redis and background jobs (queues, scheduled work)
  - CI/CD (GitHub Actions)
  - Auth (sessions, OAuth, permissions)
  - Use of Feature flags
  - Debugging production issues from logs and stack traces

  Nice to have

  - Experience using AI in software delivery
  - Observability (Sentry, log platforms, tracing)
  - E2E tests (Playwright or similar)
  - Experience working with 3rd-party integrators
  - E-commerce / POS / cart flows
  - JavaScript framework experience (We happen to use Ember.)
  - Payments / billing (Stripe or similar)

  Additional Information

  Values and Life at Xplor

  Our five core values guide us from how we hire and recognise
  our team members to how we interact with our customers day
  to day:

  - Find a better way
  - Do the right thing
  - Say it straight
  - Win together
  - Own the outcome

  If these values sound like you, and describe people you want
  to work with, you will thrive at Xplor.

  As an Xplorer, you will be part of a global network of
  talented colleagues who will support your success. We look
  for commonalities and shared passions and give people the
  tools they need to deliver great work and grow at speed.

  Some of our perks and benefits are:

  - Paid Parental Leave benefit programs
  - #GiveBackDays/Commitment to social impact – 3 extra days off
    to volunteer and give back to your local community
  - Ongoing dedication to Diversity & Inclusion initiatives such
    as D&I Council, Global Mentorship Program
  - Access to free mental health support
  - Flexible working arrangements

  Ready to apply?

  To start your application, please submit your resume, and we
  will be in touch as soon as we can. Please include the word
  "moonshot" at the top of your message to the Hiring Manager
  so that we know you took the time to read our job ad.



  Before you apply

  To be considered for employment, you must be legally
  authorized to work in the country where the role is
  advertised. This applies to remote roles too. Xplor does not
  sponsor visas, either at the time of hire or at any later
  time. We're also not able to offer contractor arrangements
  or Employer of Record engagements for this position at this
  stage.

  Please apply through our careers portal or external job
  boards only. We're unable to upload emailed applications, as
  our process requires you to answer screening questions
  directly.

  We also invite you to check out our Candidate FAQs for more
  information about our recruitment process
  xplor.com/recruitment-faqs/.

  Interview Recording and Background Checks

  As part of our hiring process, successful candidates will be
  asked to complete background and identity verification
  checks. Many of our roles are remote, and to protect both
  candidates and our business from recruitment fraud, we may
  record video interviews during the process. We keep any
  recordings and related data only for as long as the hiring
  process is active and do not retain them afterwards.

  EEO and Artificial Intelligence

  We believe in transparent hiring. We use an applicant
  tracking system with artificial intelligence-enabled
  features to support our recruitment process, but our
  recruitment team makes all hiring decisions after human
  review. We do not rely on artificial intelligence to make
  final hiring decisions. Find our Candidate AI Usage
  guidelines here.

  Xplor is proud to be an Equal Employment Opportunity
  employer. We're dedicated to attracting, retaining and
  developing our people regardless of gender identity,
  ethnicity, sexual orientation, disability, veteran status
  and age. We encourage applications from all sectors of the
  community. All Information will be kept confidential
  according to EEO guidelines.

  Xplor is committed to fully including all qualified
  individuals. In keeping with our commitment, Xplor will take
  steps to ensure people with disabilities receive reasonable
  accommodations. Accordingly, if reasonable accommodation is
  required to fully participate in the job application or
  interview process, to perform the essential functions of the
  position, and/or to receive all other benefits and
  privileges of employment, please contact us via
  talent@xplortechnologies.com.

  We make it a priority to respond to every applicant.
