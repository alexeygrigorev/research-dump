description: |
  Front End / Full Stack Engineer

  Build the future of investment management with us

  The infrastructure managing $300 trillion in assets was
  built in the 90s. Now, all of it is up for grabs. The winner
  of the AI era of investment management will be a $100B+
  company. We intend to be that company.

  To get there, we're assembling the most talent-dense startup
  in New York. We hire people who are 1) exceptional, 2)
  allergic to anything that's not exceptional, and 3)
  recruiters of other exceptional people. We also have no
  tolerance for brilliant jerks.

  We run lean by design. We work with a select group of the
  largest financial institutions in the world, go incredibly
  deep with each, and sit in the flow of trillions of dollars.
  We hire fewer people, ask each to own the outcome, and pay
  on impact - not tenure or experience.

  Moment is not for everyone. The standards are unreasonably
  high. The pace is intense. And there is no playbook.

  In return: the best work of your career, building a
  generational company.



  About Moment

  Moment is the AI operating system for investment management,
  built for the world's largest wealth firms and fintechs.
  Moment works with firms managing more than $10 trillion in
  client assets and is backed by Index, a16z, and Lightspeed.
  Moment was founded by former quants from Citadel and Jane
  Street and is based in NYC.

  The Role

  As we enter a new era, we're hiring a Frontend Engineer to
  help shape how Moment shows up for the people who use it
  every day.

  We're building software for the leading financial
  institutions of the world - and the interfaces we ship carry
  a tremendous amount of weight. Our users move billions of
  dollars through our products and need to see, understand,
  and act on dense, fast-moving information in real time. The
  frontend is not a thin layer over an API; it's where
  complexity gets translated into clarity, and where craft is
  most visible.

  As a Frontend Engineer at Moment, you will architect and
  ship interfaces that make hard problems feel effortless.
  You'll build performant UIs that handle enormous volumes of
  data, real-time updates, and the kind of operational
  complexity that demands serious engineering thought. Moment
  will be a generational company, and the products you build
  will define how an entire industry experiences modern
  financial software.

  You'll work closely with design, product, and engineering
  leadership to deliver experiences that are as ambitious and
  distinctive as the company itself. This is a highly
  autonomous, highly collaborative role. You are equally
  comfortable thinking in systems and pixels, and the details
  that matter. You can navigate different levels of
  abstraction - from component architecture and state
  management to interaction design and motion. You can clearly
  articulate, lead, and execute work that spans engineering
  and design.

  You’re a good fit if you have

  - A frontend, full-stack, or product engineer with a strong
    background in React/TypeScript
  - Experienced in building and shipping performant UIs that
    handle lots of data and complex operations
  - Familiar with Next.js and Vercel
  - Willing and able to just go figure stuff out:)

  Even better if you have

  - Figma
  - API development in Go or Python
  - Websocket-based real-time UIs

  Compensation & Benefits

  - Base salary: $200K to $400K
  - Equity: aggressive initial grant + annual performance-based
    bonuses
  - Our beautiful West Village Office with a terrace / 5x a week
    in office
  - Free lunch and dinner.
  - $150 monthly gym stipend.
  - Health, dental, and vision coverage. 100% company
    reimbursement
