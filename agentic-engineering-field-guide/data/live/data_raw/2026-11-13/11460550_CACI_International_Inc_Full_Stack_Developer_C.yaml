description: |
  Job Title: Full Stack Developer (C#)

  Job Category: Information Technology

  Time Type: Full time

  Minimum Clearance Required to Start: Secret

  Employee Type: Regular-Long Term Assignment

  Percentage of Travel Required: Up to 10%

  Type of Travel: Local

  * * *

  The Opportunity: ELITE has an excellent opportunity for an
  experienced, self-directed Software Developer. This position
  is in support of a Department of Defense (DoD) organization,
  located OCONUS in Stuttgart, Germany. EUCOM’s Knowledge
  Management (ECKM) division develops custom KM solutions
  using agile methodology. Responsibilities: Will work with
  the Scrum team to develop business process improvement
  software packages. Support and code client side and/or
  server-side applications in a development environment, test
  code for accuracy in pre-production, ensure interoperability
  and completeness, and document the solution that achieves
  desired results. Provides custom application development
  solutions to enhance the command’s decision-making processes
  and increase the speed and accuracy of decision-making using
  the Microsoft .Net framework, ASP.Net, JavaScript (JS),
  Node.js, Bootstrap, Angular, React, TypeScript, Node.js, and
  object models to include JSON, CSOM, and REST.

  Provides technical guidance and mentorship to the
  development staff. Collaborates with product owners, DevOps
  engineers, and security personnel to deliver mission-
  critical capabilities.

  Troubleshoot and resolve technical issues across the full
  technology stack in both development and operational
  environments.

  Supports system deployment and sustainment in IL2/IL4 cloud
  and on-prem environments. Qualifications: Required: • U.S.
  Citizenship and active Secret clearance with the ability to
  obtain TS/SCI • Bachelor’s degree in Computer Science,
  Software Engineering, or a related technical field • 6+
  years’ experience in software development, focused on full-
  stack engineering • Must be proficient in development of
  SharePoint applications using current tech enhancements and
  advantages. • Expert-level proficiency in C#, .NET Core,
  Entity Framework • Experience with Angular and/or Node.js •
  Proficiency in T-SQL, relational database design (e.g., SQL
  Server) • Strong understanding of software architecture
  patterns, clean code principles • Experience with Git, Agile
  methodologies, and collaborative team environments Desired:
  • Experience working in DoD or classified environments •
  Familiarity with Azure Government, Azure DevOps, or other
  secure cloud platforms • Knowledge of containerization and
  orchestration (e.g., Docker, Kubernetes) • Understanding of
  DevSecOps principles and CI/CD automation • Awareness of
  NIST, RMF, or other compliance/security frameworks
  applicable to defense software systems • Experience with
  Microsoft Power Platform (Power Automate, Power Apps, Power
  BI, etc.)


  -

  What You Can Expect:

   A culture of integrity.

  At CACI, we place character and innovation at the center of
  everything we do. As a valued team member, you’ll be part of
  a high-performing group dedicated to our customer’s missions
  and driven by a higher purpose – to ensure the safety of our
  nation.

  An environment of trust.

  CACI values the unique contributions that every employee
  brings to our company and our customers - every day. You’ll
  have the autonomy to take the time you need through a unique
  flexible time off benefit and have access to robust learning
  resources to make your ambitions a reality.

  A focus on continuous growth.

  Together, we will advance our nation's most critical
  missions, build on our lengthy track record of business
  success, and find opportunities to break new ground — in
  your career and in our legacy.

  Pay Range:

  There are a host of factors that can influence final salary
  including, but not limited to, geographic location, Federal
  Government contract labor categories and contract wage
  rates, relevant prior work experience, specific skills and
  competencies, education, and certifications. Our employees
  value the flexibility at CACI that allows them to balance
  quality work and their personal lives. We offer competitive
  compensation, benefits and learning and development
  opportunities. Our broad and competitive mix of benefits
  options is designed to support and protect employees and
  their families. At CACI, you will receive comprehensive
  benefits such as; healthcare, wellness, financial,
  retirement, family support, continuing education, and time
  off benefits.

  The proposed salary range for this position is:

  $82,700 - 173,900 USD

