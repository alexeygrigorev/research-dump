description: |
  About Eneba



  At Eneba, we’re building the technology and products shaping
  the future of gaming.

  Our core is a global digital gaming marketplace used by 20M+
  customers, with 100,000+ digital items and a platform built
  to operate at massive scale. Behind it is a complex
  technology ecosystem spanning 100+ microservices,
  distributed systems, internal platforms, and tooling that
  helps our teams build and ship faster.

  And we’re not stopping at the marketplace. We’re building
  new products like Snakzy, AI game coaches, and more,
  exploring new ways for players to discover, buy, and
  experience games.

  We’re proud of how far we’ve come in such a short time - and
  there’s a lot more to build. Join us as we scale and build
  the next generation of products for the gaming community.



  About your team



  You’ll join a cross-functional team of 5–10 people spanning
  design, backend, frontend, mobile, and data, supported by a
  dedicated platform engineering team. We move fast,
  experiment often, and build for a growing community of
  active users.

  As an engineer, you’ll do more than ship features - you’ll
  help shape how the team works and the technology we build.
  With strong infrastructure, a modern codebase, and hundreds
  of microservices, you’ll tackle real challenges in scale,
  performance, reliability, trust, and safety while having the
  ownership to make a real technical impact.



  About the tech



  Code

  - PHP 8.5+
  - Symfony 6, 7 and 8
  - Golang
  - GraphQL
  - Temporal
  - Saga orchestration
  - Microservices architecture - 100+ services
  - Custom PHPStan rules

  Databases & metrics stores

  - MongoDB, Postgres, MySQL, Redis, Prometheus, InfluxDB,
    ElasticSearch

  Infrastructure

  - Kubernetes, Helm, AWS, Terraform with custom-made
    abstractions

  About you

  - You have 8+ years of backend engineering experience, with
    hands-on experience building and scaling distributed
    systems and strong expertise in PHP and Symfony.
  - You are a quick problem solver who takes ownership
  - You are genuinely open to feedback
  - You are familiar with common patterns like CQRS, circuit
    breaking, and service orchestration
  - You can effectively contribute to architectural discussions.
  - You are product-minded and always thinking about the end-
    user impact
  - You are genuinely excited to work in a supportive,
    collaborative environment where we learn, experiment, and
    continuously improve.



  What it’s like to work at Eneba



  *Opportunity to join our Employee Stock Options program.

  *Opportunity to help scale a unique product.

  *Various bonus systems: performance-based, referral,
  additional paid leave, personal learning budget.

  *Paid volunteering opportunities.

  *Work location of your choice: office, remote, opportunity
  to work and travel.

  *Personal and professional growth at an exponential rate
  supported by well-defined feedback and promotion processes.



  *Please attach CV's in English.

  *To find out about how we handle your personal data, make
  sure to check out our Candidate Privacy Notice
  https://www.eneba.com/candidate-privacy-notice
