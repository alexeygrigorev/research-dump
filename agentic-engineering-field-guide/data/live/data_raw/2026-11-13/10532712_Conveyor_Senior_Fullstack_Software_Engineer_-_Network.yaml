description: |
  Hi, we’re Conveyor 👋 creators of the first AI-Native
  Customer Trust Platform.

  We solve a problem that our customers “hate with the fury of
  1000 suns” (actual quote!) - the dreaded customer security
  review. It’s a key part of the B2B sales cycle, but one that
  still involves too much time, effort, and mental anguish
  from those involved.

  Enter Conveyor, where our vision is instant, perfect
  security reviews for everyone. We’ve made a lot of progress
  – we have an awesome customer list whose lives we’ve
  significantly impacted through product, we launched the
  first AI agents for security reviews and RFPs, and we raised
  a $20M Series B from SignalFire and OVF! (TechCrunch) But we
  have ambitious goals and we’re looking for our next Senior
  Software Engineer to help make them a reality!

  The top 3 1/2 reasons you should be interested in working at
  Conveyor:

  - You’ll be building a great product with a slam dunk AI use
    case, and as part of a small team, be involved in the
    entire lifecycle of development (design, frontend,
    backend, AI).
  - Everyone on the team is amazing at their jobs. We care
    deeply about psychological safety, and believe that the
    ability to take risks and exist in the learning zone is
    critical to our success. This also comes with high
    accountability, which isn’t for everyone. But, you have
    the potential to have an outsize impact on the direction
    and success of the company.
  - We’re highly transparent and collaborative. Giving
    constructive, thoughtful feedback and asking hard
    questions are highly encouraged! We come together to
    figure it out when times are hard, and in celebration when
    we get our wins.½ Plus we’ll even teach you how to saber a
    bottle of champagne.

  About the Role

  This role is to join our new initiatives team, as one of the
  first engineers on the team. This is a unique opportunity to
  shape Conveyor’s future offerings and strategy, and have a
  huge impact on our success. Designing and building
  innovative new AI-powered products and capabilities, you
  will have the opportunity to collaborate closely with a
  great team, as well tackle challenging engineering problems
  on your own.

  What you’ll do:

  - You will design, implement and maintain new products and
    capabilities, taking full ownership across the stack
    (backend, frontend and AI).
  - You'll autonomously manage and own individual project
    priorities, deadlines, and deliverables.
  - You’ll collaborate and pair frequently with teammates and
    peers.
  - You'll inform the product roadmap and implementation
    decisions based on feasibility.
  - You'll ensure that our product is maintainable, meaning that
    other engineers are able to contribute new functionality
    easily, and without frequent technical debt.
  - You'll partner with Product and Design to effectively plan
    new features, avoiding bottlenecks and maximizing velocity
    when it comes time to implement.
  - Provide constructive feedback through design and code
    reviews, and mentor to new or junior team members

  What we’re looking for:

  We are looking for candidates with 5-8 years of experience
  as a Fullstack Software Engineer, with a focus on B2B SaaS
  solutions, and experience in startup environments.

  - 5-8 years of experience as a Software Engineer, with strong
    foundations on building and shipping products. Your
    designs should be performant, maintainable (for years, not
    months), and evolvable.
  - Experience building and scaling web applications with real
    users, familiarity with SaaS architecture concepts, Cloud
    infrastructure and services (AWS preferred), popular
    databases, authentication services, etc.
  - Specifically, rich experience working across the stack:
    Python, React, RESTful APIs, Ruby on Rails, PostgreSQL,
    AWS, use of LLMs and AI coding tools
  - Bias for action: Startup mentality, get things done, fast
    iterations, scope and implement project-level solutions
    with minimal guidance, strong problem-solving and
    decision-making capabilities. Previous experience in a
    small startup (or as a founder) is highly preferred.
  - Curiosity and Continuous Learning: You are up to speed on
    developments in fullstack technologies and patterns, and
    constantly thinking about how to apply new technologies
    and offerings to our platform.
  - Desire to Improve: You seek to understand why things are the
    way they are, and think about ways to make them better.
  - Product Sense: You seek to understand the features you're
    working on, and actively propose positive changes.
    Collaborate with product and design to inform roadmap
    decisions.
  - Team Player: You have excellent communication skills (verbal
    and written), enjoy collaborating with others and
    mentoring team members.
  - Deliver Legendary Customer Experience: You have experience
    building and scaling products that delight real users.
  - Ownership: Strong sense of ownership and accountability,
    honor commitments and be transparent about challenges.

  Job Location

  This position is available in the United States and Canada.
  We are a remote-first company so you’ll be working from home
  most of the time, traveling for in person sessions a few
  times a year.

  The estimated total compensation for this role is $190,000 -
  $220,000 per year, plus equity and benefits.

  Ready to join our team and have a tremendous impact? We’d
  love to hear from you. Also, we know it’s tough, but please
  try to avoid the confidence gap. You don’t have to match all
  the listed requirements exactly to be considered for this
  role.
