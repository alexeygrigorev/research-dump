description: |
  At Second Nature, our people are our greatest
  differentiator. To build an industry-changing business, we
  don’t just need talent; we need an environment where high
  standards, continuous improvement, and customer obsession
  are the default.

  Excellence is not a destination — it is how we show up every
  day. In twenty years time, we want every single employee to
  look back to their time at Second Nature and say: This is
  where I did my very best work. Where I grew the most. Where
  I pushed myself beyond what was comfortable. ✨

  About Us

  Today, we live in a world where everything has become
  convenient. Now you can get a ride anywhere, buy anything,
  and get an answer to your question with just a couple clicks
  on your phone. Convenience isn’t a luxury, it’s an
  expectation.

  So why not renting? It's still a chore to get utilities set
  up, buy renters insurance, get air filters changes, handle
  pest control and more. That’s why we’ve built the world’s
  first Resident Experience Platform that makes resident
  onboarding, resident services, and ancillary revenue
  effortless for property managers. We’re passionate about
  turning friction into triple win experiences for residents,
  investors, and managers. That way renting can be easy and
  rewarding for everyone. And now you can join us. Apply today
  to join 275+ passionate, creative people who strive to make
  a difference each day so residents, property managers, and
  investors all win, creating the ultimate Triple Win!.

  About the Role We're looking for a highly experienced Staff
  Software Engineer to lead the development of innovative and
  scalable software solutions on our RBP Ops team. In this
  role, you will work closely with cross-functional teams to
  design, implement, and maintain mission-critical systems.
  You will also mentor junior engineers and contribute to the
  company’s overall technology strategy.

  Key Responsibilities

  - Lead the design, architecture, and development of high-
    performance, scalable software systems
  - Write, test, and maintain high-quality code, ensuring it
    meets both functional and non-functional requirements.
  - Contribute to architectural decisions, ensuring scalability,
    performance, and maintainability of software systems.
  - Uphold coding standards, best practices, and guidelines
    while conducting code reviews to ensure high-quality
    software.
  - Analyze and resolve complex technical issues, optimizing
    code and improving system performance.
  - Work closely with product managers, designers, and other
    engineers to understand business requirements and
    translate them into technical solutions.
  - Drive continuous improvements in code quality, development
    processes, and team efficiency.
  - Create and maintain technical documentation, including
    architecture diagrams and API specifications. Communicate
    technical decisions and strategies clearly to both
    technical and non-technical stakeholders
  - Participate in agile development processes, including sprint
    planning, stand-up meetings, and retrospectives.
  - Stay up-to-date with emerging technologies and industry
    trends to drive innovation

  Key Outcomes

  - Backend services and APIs that ship on schedule and hold up
    in production, with defects caught in review or test
    rather than by customers.
  - Clean, well-tested code that other engineers can pick up and
    extend without a translation layer, raising the bar for
    maintainability across the codebase.
  - A continuous delivery pipeline and monitoring setup that
    stays healthy, supporting trunk-based development so the
    team deploys with confidence instead of caution.
  - Product ideas translated into working technical solutions,
    with design and product partners who see you as a reliable
    thought partner early in the process rather than a
    downstream implementer.

  Preferred Qualifications

  - 5+ years of professional software development experience,
    with a strong background in software design and
    architecture.
  - Experience with TypeScript and Node.
  - Experience with AWS, postgress, SQL
  - Deep knowledge of Domain Driven Design
  - Experience using AI coding tools (like Claude Code, Copilot,
    Cursor, etc.) in your daily workflow, with genuine
    excitement about where agentic AI is headed for software
    development.
  - Deep knowledge of software architecture patterns and design
    (e.g., microservices, distributed systems, hexagonal
    architecture, domain driven design, etc).
  - Strong problem-solving and analytical skills.

  We get it. Requirements can sometimes hold people back from
  applying to a job, but don’t let that be the case here. If
  you believe you have the skills it takes to elevate this
  role, team, and company, we encourage you to apply for this
  role.

  Our Core Values

  🏴‍☠️ Pirate Ship; not a cruise ship. Bias towards action.

  💪 Massive Growth takes massive growth. We embrace challenges
