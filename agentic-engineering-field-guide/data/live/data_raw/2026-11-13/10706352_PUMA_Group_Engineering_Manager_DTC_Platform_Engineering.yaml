description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  You will be part of the DTC Platform Engineering
  organisation responsible for delivering the shared
  platforms, engineering services, and foundations that enable
  product teams to build, test, deploy, and operate software
  securely and reliably at scale. Product engineering teams
  are the primary customers of the organisation. Through
  capabilities such as cloud platforms, developer experience,
  software delivery, quality engineering, security
  engineering, performance engineering, and AI-native
  engineering enablement, the organisation helps accelerate
  software delivery, improve engineering productivity, and
  establish consistent engineering standards across the
  technology landscape.

  The Engineering Manager is accountable for engineering
  delivery, roadmap execution, operational excellence, and
  engineering team development. Partnering with Product
  Owners, Project Managers, Tech Leads, Platform Leads, SREs
  and peer engineering teams, you will enable predictable
  delivery, grow engineering talent, and build a high-
  performing culture focused on ownership, accountability, and
  continuous improvement What you will do:

  - Partner with the Platform Engineering Director to execute
    platform strategy, roadmap, and engineering initiatives
    across the organisation.
  - Ensure platform roadmaps align with the needs, priorities
    and delivery objectives of product & project teams.
  - Drive adoption of platform capabilities through developer
    enablement, training, workshops, and technical knowledge
    sharing.
  - Establish effective feedback mechanisms to continuously
    improve platform capabilities, developer experience, and
    engineering productivity.
  - Build strong collaboration models across product engineering
    teams, architecture, security, SRE, and platform teams to
    improve platform adoption and effectiveness.
  - Lead engineering teams delivering integration platforms,
    shared services, and enterprise integration capabilities.
  - Drive execution of the integrations roadmap and ensure
    reliable delivery of reusable integration capabilities
    across the technology landscape.
  - Drive quality engineering practices, test automation
    adoption, and quality enablement capabilities across
    engineering teams.
  - Establish and track platform adoption, engineering
    productivity, software quality, and developer experience
    metrics.
  - Drive planning and execution against team objectives and key
    results (OKRs), ensuring alignment, accountability and
    transparent reporting.
  - Own sprint execution, delivery planning, capacity
    management, dependency management, and risk management.
  - Coach engineers through regular feedback, mentoring,
    performance management, and career development.
  - Build a high-performing engineering culture focused on
    ownership, accountability, collaboration, and learning.
  - Drive adoption of AI-native engineering capabilities, coding
    agents and engineering automation to improve developer
    productivity and software delivery effectiveness.
  - Collaborate with engineering leadership on hiring, staffing,
    onboarding, talent development, and succession planning.
  - Manage delivery partners and vendors where applicable and
    ensure alignment with team objectives.

  YOUR TALENT

  - 10+ years of software engineering experience, with
    experience leading engineering teams in an agile delivery
    environment.
  - 3+ years of people leadership experience.
  - Strong experience leading roadmap execution, delivery
    planning, dependency management and stakeholder
    engagement.
  - Solid software engineering background with experience
    building shared platforms, developer tooling, integration
    services or engineering enablement capabilities.
  - Experience driving test automation, quality engineering, and
    software quality initiatives across multiple engineering
    teams.
  - Experience driving platform adoption, engineering
    enablement, developer productivity, or technology
    transformation initiatives.
  - Strong stakeholder management skills with the ability to
    influence engineering teams and drive adoption of shared
    platforms, standards, and engineering practices.
  - Familiarity with cloud platforms, developer experience,
    CI/CD, integration platforms, quality engineering,
    observability, and platform engineering practices.
  - Experience enabling engineering teams through AI-assisted
    development tools, coding agents, developer productivity
    platforms, and automation capabilities will be a strong
    advantage.
  - Strong people leadership skills with experience in hiring,
    mentoring, developing, and retaining high-performing
    engineering teams.
  - Strong communication, collaboration, decision-making, and
    organisational leadership skills.
  - Experience working in Agile delivery environments using
    tools such as Jira & Confluence or equivalent.
  - A data-driven mindset with the ability to use engineering,
    delivery, and operational metrics to improve team
    effectiveness and predictability.

