title: Sr. Manager, Firmware Engineering
company: Chamberlain Group
location: Oak Brook, USA
work_type: FULL_TIME
company_size: 5,769 Employees
description: |
  Chamberlain Group (CG) is a global leader in intelligent
  access and Blackstone portfolio company. Powered by our myQ
  technology, we make access simple and secure for millions of
  homeowners, businesses, and communities worldwide. Our
  flagship brands, LiftMaster®  and Chamberlain® , are found
  in 51+ million homes, and 14 million+ people rely on the
  myQ®  app daily.

  This position provides strategic and functional leadership
  for Firmware Engineering teams, defining and driving the
  firmware strategy and roadmap across New Product
  Development, Productivity, Sustaining, and Advanced
  Development initiatives. The role oversees resource
  planning, project execution, and process improvement to
  ensure quality solutions are delivered on time and within
  budget. Additionally, this position leads Firmware
  Engineering talent, manages departmental budgets, and
  partners with cross-functional teams and external
  stakeholders to achieve business objectives.

  Job Responsibilities:

  - Responsible for the day to day management of on time, on
    budget and quality functional project execution for one
    team
  - Responsible for the functional development plans, including
    resource effort, schedule estimate and cost, for new and
    active projects for multiple teams throughout full product
    lifecycle
  - Responsible for 18 month project forecasting for multiple
    teams; accountable for direct reports project time
    accounting
  - Responsible for the functional design approach and technical
    feasibility for multiple projects, with input from key
    technical personnel across multiple teams
  - Ensure functional process compliance and contribute to
    defining the process; responsible for meeting and
    monitoring key performance indicators (KPIs) and metrics
    for functional group
  - Lead continuous improvement initiatives within functional
    area or business unit; lead a functional or business area
    community of practice, a group of staff in similar roles
    that drives best practices, peer reviews, and common
    processes to ensure quality work product
  - Evaluate, recommend, and implement changes in firmware
    methods, procedures, and architecture for both direct and
    indirect reports; execute 1-3 year technology roadmap
    projects
  - Responsible for annual expense and capital budget planning
    and tracking for their team
  - Monitor and create training plans for direct reports that
    improves the core competencies of the functional area or
    business area
  - Review and approve the functional deliverables and
    engineering change notices (ECNs), Pull Requests or Change
    Approval Board (CAB) tickets for all direct reports
  - Ensure design quality through participation in design
    reviews for projects supported by team; serve on design
    review committee as an alternate as needed
  - Builds key cross functional relationships with other
    functional areas.
  - Lead day to day operations and directly supervises a team of
    supervisors, engineers or technical staff
  - Responsible for complying with the security requirements set
    forth by the Information Security team and the established
    ISO 27001 Security Roles, Responsibilities, and
    Authorities Document found in the ISMS Document Library
  - Comply with health and safety guidelines and rules; managers
    should also ensure compliance across their teams
  - Comply with health and safety guidelines and rules; managers
    should also ensure compliance across their teams.
  - Protect Chamberlain Group’s reputation by keeping
    information confidential.
  - Maintain professional and technical knowledge by attending
    educational workshops, reading professional publications,
    establishing personal networks, and participating in
    professional societies.
  - Contribute to the team effort by accomplishing related
    results and participating on projects as needed.

  Job Requirements:

  - Bachelor’s degree in Computer Science, Computer Engineering,
    Electrical Engineering, related technical field or
    equivalent practical experience
  - An advanced degree in directly applicable area of study may
    substitute for up to two (2) years of job related
    experience
  - Six Sigma Green Belt certification strongly preferred; or
    commitment to obtain certification within two (2) years of
    date of hire or promotion
  - 9+ years of job-related experience as defined in the
    Essential Duties and Responsibilities
  - Experience leading a team of engineers or technical staff

  Knowledge, Skills, and Abilities:

  - Demonstrated ability to lead and motivate others
  - Ability to train a technical staff in functional area on
    functional subjects, process and tools
  - Ability to create functional schedules and accurately
    estimate task completion time
  - Able to adjust to multiple demands and shifting priorities
    and accepts responsibility for results of actions
    Independently determines approach to managing teams and
    daily operations
  - Ability to collect and analyze data to make timely decisions
  - Ability to delegate tasks and appropriately apply
    situational management
  - Ability to solve complex problems, recognizes gaps in
    process, develops and recommends new techniques to support
    innovative solutions
  - Needs proficient understanding of Firmware Engineering
    including C and C++ and best coding practices
  - Understanding of Agile and Scrum development practices
  - Needs proficient understanding of continuous integration and
    continuous deployment concepts

  The pay range for this position is $129,700.00 -
  $226,900.00; base pay offered may vary depending on a number
  of factors including, but not limited to, the position
  offered, location, education, training, and/or experience.
  In addition to base pay, also offered is a comprehensive
  benefits package and 401k contribution (all benefits are
  subject to eligibility requirements). This position is
  eligible for participation in a short-term incentive plan
  subject to the terms of the applicable plans and policies.

  Chamberlain Group wants all of its employees to succeed and
  encourages people of all backgrounds to apply. We’re proud
  to be an Equal Opportunity Employer, and you’ll be
  considered for this role regardless of race, color,
  religion, sex, national origin, age, sexual orientation,
  ancestry; marital, disabled or veteran status. We’re
  committed to fostering an environment where people of all
  lived experiences feel welcome.

  Persons with disabilities who anticipate needing
  accommodations for any part of the application process may
  contact, in confidence Recruiting@Chamberlain.com.

  NOTE: Staffing agencies, headhunters, recruiters, and/or
  placement agencies, please do not contact our hiring
  managers directly.
