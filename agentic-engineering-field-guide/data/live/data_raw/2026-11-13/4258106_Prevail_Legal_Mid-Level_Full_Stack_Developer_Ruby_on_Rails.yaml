description: |
  About Prevail Legal

  A well-funded startup founded in San Francisco, our
  workforce includes a diverse collection of individuals
  located across the country. Our first-of-its-kind platform
  combines secure video conferencing with a collection of
  intuitive tools developed for conducting remote, in-person,
  and hybrid legal proceedings.

  By maintaining a dynamic work environment where employees
  collaborate and grow, we aim to modernize and transform the
  processes involved in court reporting, testimony management,
  trial preparation, use of video evidence, and more. Join us
  in disrupting the legal industry and beyond while working
  alongside our talented team!

  About the Position: We are seeking a motivated and skilled
  Mid-Level Full Stack Developer with experience in Ruby on
  Rails. As a Mid-Level Full Stack Developer, you will
  contribute to building and maintaining web applications,
  collaborating with the team to implement new features, and
  optimizing performance. You will work with both object-
  oriented and functional programming paradigms in a fully
  remote environment. Success in this role requires a solid
  understanding of Git/source control and familiarity with
  Gen-AI tools and their practical applications in development
  workflows. This position reports to the Chief Technology
  Officer.

  Required Qualifications:

  - 4+ years of Ruby on Rails experience
  - Strong understanding of Git/source control systems
  - Solid understanding of object-oriented and functional
    programming paradigms
  - Ability to write clear technical documentation
  - Familiarity with Gen-AI tools and their practical
    applications in development workflows

  Preferred Knowledge:

  - Familiarity with WebRTC
  - Experience writing performant JavaScript preferably
    Stimulus, Hotwire, or Importmaps
  - Understanding of asset optimization techniques
  - Experience with PostgreSQL (1+ year preferred)
  - Exposure to AWS/Kubernetes environments

  Ideal Candidate:

  - A passionate self-starter with strong time-management skills
  - Exceptional problem-solving ability and critical thinking
  - Collaborative but capable of working independently
  - Experience working in smaller companies or startups is a
    plus
  - Interest in mentoring junior developers and growing within
    the company

  A note on AI Use: In interviews, we're looking at how you
  think and solve problems in real time. You're welcome to use
  AI while preparing. Using it without disclosing it during
  the interview is treated as misrepresentation and leads to
  automatic rejection.Benefits:

  - Comprehensive medical, dental, vision, and 401(k) plans
  - PTO, including vacation and company holidays
  - Generous continuing education allowance
  - Employee stock option plan
  - Remote-first workplace
  - Open, diverse, and respectful work culture

  Compensation Range: $120,000 - $160,000 per year. The final
  base salary will be determined based on several factors,
  including geographical location, level of experience,
  relevant skills, and knowledge.

  Prevail Legal reserves the right to change this job
  description to meet the organization's business needs.
  Please note that the pay band listed is for major cities,
  and compensation is based on both location and experience.



  We are hiring for US Citizens and do not provide H1B Visa
  support.

  We are committed to equal employment opportunity regardless
  of race, color, ancestry, religion, sex, national origin,
  sexual orientation, age, citizenship, marital status,
  disability, gender, gender identity or expression, or
  veteran status. We are proud to be an equal opportunity
  workplace.
