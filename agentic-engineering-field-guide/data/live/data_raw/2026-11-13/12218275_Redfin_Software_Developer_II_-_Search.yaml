description: |
  This position is a hybrid role requiring employees to work
  from our headquarters location in Seattle, WA every Tuesday
  and Wednesday, and remote all other days.  Redfin is
  revolutionizing the $75 billion real estate industry. We use
  data, beautiful software, and innovative design to put
  customers first at every step in the home-buying and selling
  process. Get ready to dive headfirst into our award-winning
  website and mobile apps, solving complex business problems
  in a highly visible, customer-centric way. If you value
  doing great work in a collaborative environment, join our
  team! The Search Personalization team is redefining how
  people connect with homes by creating a personalized and
  engaging search experience that helps millions of users find
  their dream home. We power some of Redfin's most visible
  features-including the Homepage, login and registration
  systems, and home discovery tools like Favorites and Saved
  Searches. By joining Search Personalization, you'll help
  shape one of the most impactful parts of the search journey,
  building experiences that make home discovery simpler,
  smarter, and more personal. Who We Are

  - High impact and high visibility. We develop and maintain
    some of the highest visibility systems on redfin.com. Our
    work serves millions of customers daily and is the
    essential top of the funnel for Redfin's businesses.
  - Full Stack Full Ownership. From data pipelines to the user
    interface, we own our features end to end.
  - Performance is critical. Because our features attract so
    much traffic, everything we develop must meet strict
    performance criteria. We dictate performance initiatives
    and best practices for the rest of the company because we
    have the most expertise and experience.

   About the r ole

  - You will leverage AI code generation tools to document,
    architect, and create code.
  - You will stay up to date with the rapidly evolving AI
    ecosystem and help evaluate new tools, models, and
    frameworks.
  - You will develop responsive, resilient, scalable, and high-
    quality software using React, Java, AWS, and various other
    tools/libraries.
  - You will balance the trade-offs between complex
    infrastructure investments and quick, pragmatic solutions
    to meet specific business needs.
  - You will collaborate with other engineering and product
    stakeholders to define, design, and develop projects,
    taking full ownership for leading projects from start to
    finish.
  - You will mentor and guide other junior engineers

   About y ou

  - 3+ years of professional full stack software development
    experience, developing full-stack, customer-facing
    applications.
  - You have experience using AI code generation tools tools
    such as GitHub CoPilot, Anthropic Claude Code, Cursor, or
    similar.
  - Proven track record of designing, building, and maintaining
    scalable, high-performance web applications.
  - You love elegant interfaces that can tell stories and
    inspire trust.
  - Strong communication and collaboration skills, with the
    ability to work effectively in a team environment, handle
    ambiguity, and empathize with customers.
  - You're curious and a life-long learner: you're willing to
    take risks and champion new ideas.
  - You are eager to help us in our mission to create a
    fundamentally better real estate experience for our
    customers.

   What y ou'll g et  Our team members fuel our strategy,
  innovation and growth, so we ensure the health and well-
  being of not just you, but your family, too! We go above and
  beyond to give you the support you need on an individual
