description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  At PUMA, technology plays a critical role in enabling
  exceptional consumer, digital, and business experiences
  across global markets. Our engineering teams build and
  operate the platforms, products, and services that power
  PUMA's digital ecosystem, supporting consumers, business
  users, and operational teams worldwide.

  As part of the Engineering organization, you will contribute
  to the development and evolution of modern digital platforms
  and applications that support key business capabilities
  across eCommerce, consumer engagement, retail,
  merchandising, supply chain, data, and enterprise domains.
  The organization embraces cloud-native architecture,
  engineering excellence, automation, AI-assisted development,
  and a product-centric mindset to deliver scalable and
  impactful solutions.

  As a Senior Software Engineer (Full Stack), you will design,
  build, and maintain modern web applications and backend
  services that power business-critical and consumer-facing
  experiences. You will work closely with Product Managers,
  Designers, Architects, Data Engineers, and fellow engineers
  to deliver intuitive, scalable, secure, and high-performing
  solutions while contributing to engineering best practices
  across the organization.

  What you will do:

  - Design, build, and maintain modern web applications and
    supporting backend services that power digital products
    and business platforms.
  - Lead the technical design and delivery of complex frontend
    features and end-to-end user journeys, ensuring high
    quality, performance, accessibility, and maintainability.
  - Collaborate with backend, data, platform, and architecture
    teams to design and deliver scalable end-to-end solutions.
  - Develop reusable UI components, frontend frameworks, and
    integration layers using modern web technologies such as
    React and TypeScript.
  - Build and integrate APIs, microservices, and backend
    services required to support frontend applications and
    business workflows.
  - Develop responsive, accessible, and user-centric experiences
    across desktop and mobile web platforms.
  - Drive improvements in application performance, reliability,
    observability, security, and overall user experience.
  - Contribute to architecture discussions, design reviews, and
    engineering best practices across teams.
  - Mentor engineers through code reviews, technical guidance,
    and knowledge-sharing activities.
  - Collaborate with product, design, engineering, and external
    technology partners to deliver impactful business
    outcomes.
  - Leverage automation, AI-assisted engineering tools, and
    modern software development practices to improve
    productivity, code quality, and delivery effectiveness.

  Participate in production support, troubleshooting, and
  continuous improvement initiatives to ensure application
  stability and operational excellence.

  YOUR TALENT

  - 7+ years of experience designing, building, and operating
    modern web applications and digital experiences.
  - Strong expertise in React, TypeScript, JavaScript, and
    modern frontend engineering practices.
  - Experience building scalable, responsive, and high-
    performing web applications with a strong focus on
    usability, accessibility, and user experience.
  - Strong understanding of component-based architecture, state
    management, frontend design patterns, and design-system-
    driven development.
  - Hands-on experience integrating frontend applications with
    REST APIs, microservices, and backend platforms.
  - Good understanding of backend engineering fundamentals using
    Java, Spring Boot, API design, and microservices
    architecture.
  - Experience building and operating cloud-native applications
    on Azure, AWS, or GCP, with exposure to Docker and
    Kubernetes.
  - Experience building AI-powered and conversational user
    experiences using frameworks such as Google Conversational
    Commerce Kit (CCK), Vercel AI SDK, CopilotKit,
    LangChain/LangGraph, OpenAI SDK, or similar agentic
    application frameworks.
  - Familiarity with agentic workflows, conversational commerce
    experiences, tool calling, streaming interactions, and
    Retrieval-Augmented Generation (RAG) patterns within
    modern web applications.
  - Familiarity with search technologies such as Elasticsearch,
    OpenSearch, Azure AI Search, or similar platforms.
  - Strong understanding of application performance,
    observability, security, and frontend architecture for
    large-scale applications.
  - Experience leading frontend initiatives, mentoring
    engineers, and driving engineering best practices across
    teams.

