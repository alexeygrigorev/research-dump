description: |
  About Our Company:



  At Patch My PC, we exist to improve lives. What started as a
  free tool to keep apps updated has grown into a trusted
  enterprise solution that helps IT and Security teams
  automate, manage, deploy, and report on third-party updates
  in Microsoft ConfigMgr, Intune, and WSUS. Our fully remote
  crew of 150 GIF-loving humans supports over 10,000 customers
  and more than 32 million devices. We make patching easier,
  boost security, and give IT teams their time back.



  Our core values guide how we work, how we treat each other,
  and how we grow. They keep us focused on what matters most.
  We're here to improve the lives of our customers, our team
  members, and our communities.

  About this Role:



  We are looking to hire an Experienced Software Engineer to
  design, develop, implement, test and support high quality
  internal software, systems and customer facing products and
  features that delight customers. You will be a key member of
  our development team, working to enhance and expand our
  software management platform.

  Responsibilities:

  Required Skills:

  Nice to Have:

  - Experience with device management products like Microsoft
    Configuration Manager or Intune.
  - Experience with cloud platforms such as AWS, Azure, or
    Google Cloud.
  - Experience with Event-driven architecture.
  - Familiarity with Docker, Kubernetes, and CI/CD pipelines.
  - Experience with building cross-platform applications or
    services.

