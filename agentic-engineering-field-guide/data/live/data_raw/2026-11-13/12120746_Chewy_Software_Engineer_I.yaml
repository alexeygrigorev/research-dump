description: |
  Job Description: Our Opportunity: Chewy is seeking a
  Software Engineer I to join an established technology team
  in Boston, MA. At Chewy, it is our mission to be the most
  trusted and convenient destination for pet parents (and
  partners) everywhere. We have evolved into an innovative
  Fortune 500 industry leader. As a Software Engineer I within
  our team, you will have the ability to enhance or create new
  functionality as part of a high performing engineering team.
  This team values broad-based technical skills in cloud-based
  services, databases, security, server-less technologies, and
  more. The expectations of the prospective candidate will be
  to design and build software components of services and or
  platforms. In this role, the ideal candidate will engage in
  development, testing, and make contributions to the growth
  and development of one of Chewy's fastest growing areas. We
  continue to grow and always Think Big about new innovative
  ideas, while consistently exploring opportunities to
  differentiate ourselves in the industry. What You'll Do:

  - Utilize algorithms, data structures, and design patterns to
    produce efficient and performant code
  - Develop, extend, and debug code within the scope of their
    team's existing tools and services
  - Execute on design and debug tasks
  - Troubleshoot root causes of and solutions for bugs and
    production issues
  - Will contribute to team's best practices for logging,
    testing, instrumentation, metrics, monitors, alerts,
    practices, and processes
  - Make meaningful contributions to the team's existing service
    architecture, data architecture, dev-ops, and
    infrastructure as code, deployment pipelines, and public
    cloud services as part of a software development team
  - Participate in on-call rotations and operational excellence

  What You'll Need:

  - Bachelor's degree or higher in Computer Science, Computer
    Information Systems, or similar; or equivalent experience
  - 1+ years of professional experience as Software Engineer
  - Hands-on experience in designing, building, and deploying
    scalable, highly available systems
  - Be a hands-on engineer spending significant percentage of
    their time writing code or debugging tricky issues
  - Knowledge of professional software engineering practices for
    the full software development life cycle including coding
    standards, code reviews, source control management, build
    processes, testing, and operations
  - Proficiency in Computer Science fundamentals - object-
    oriented design, data structures, algorithm - design,
    problem solving, and complexity analysis
  - Knowledge of cloud technologies
  - Knowledge of databases and operating systems
  - Able to conduct root causes of and solutions for bugs and
    production issues.
  - Proficiency in popular coding languages including Python,
    Java and C++ and frameworks or systems such as Git

  Bonus:

  - Exposure in e-commerce
  - Experience with Scrum, XP, or other agile methodologies
  - Experience with configuration and deployment management and
    be hands on technology infrastructure, network, compute,
    storage, and virtualization experience
  - Experience with data analysis/mining in large scale database
    environments a plus
  - Experience with AWS

  The base salary range for this role is $92,500 -
  $160,000.00.

  - The specific salary offered to a candidate may be influenced
    by a variety of factors including but not limited to the
    candidate's relevant experience, education, and work
    location. In addition, this position is eligible for 401k
    and a new hire and annual equity grant. C08+ positions may
    also be eligible for annual bonus.

  We offer different types of insurance and benefits, such as
  medical/Rx, vision, dental, life, disability, hospital
  indemnity, critical illness, and accident. We offer parental
  leave, family services benefits, backup dependent care,
  flexible spending accounts, telemedicine, pet adoption
  reimbursement, employee assistance program, and many
  discounts including 10% off pet insurance and 20% off at
  Chewy.com. Exempt salary team members have unlimited PTO,
  subject to manager approval. Team members will receive six
  paid holidays per year. Team members may be eligible for
  paid sick and family leave in compliance with applicable
  state and local regulations. Chewy is an equal opportunity
  employer. All qualified applicants will receive
  consideration for employment without regard to race, color,
  ancestry, national origin, gender, citizenship, marital
  status, religion, age, disability, gender identity, results
  of genetic testing, veteran status, as well as any other
  legally-protected characteristic. If you have a disability
  under the Americans with Disabilities Act or similar law,
  and you need an accommodation during the application process
  or to perform these job requirements, or if you need a
  religious accommodation, please contact CAAR@chewy.com. To
  access Chewy's California CPRA Job Applicant Privacy Policy,
  please click here.
