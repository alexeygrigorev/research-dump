description: |
  Are you a structured and experienced Technical Project
  Manager (m/f/d) with a passion for hardware development? Are
  you eager to take ownership, drive cross-functional
  collaboration, and lead projects from idea to mass
  production? Then join our international team in Munich and
  give your career a workout!  Your daily workout

  - Project Coordination: You coordinate projects for the
    development of smart fitness equipment working with cross-
    functional teams
  - Collaboration: You collaborate with Engineering Teams,
    Product Managers, and other stakeholders across the
    business, to build aligned roadmaps based on our product
    development processes
  - Goal Setting: You define short- and long-term project goals
    in a fast-paced environment and guide teams toward
    successful delivery aligned with the company strategy
  - Process Improvement: You continuously evaluate and improve
    departmental processes and tools, driving change and
    transformation through project management methodologies,
    ensuring your solutions align with EGYM’s operational
    framework
  - Project Planning: You lead projects through all phases, from
    initiation to mass production, while continuously
    monitoring and controlling the schedule. You effectively
    prioritise deliverables to ensure on-time completion
  - Status Analysis: You assess and present current project
    statuses with your team, proactively identifying risks and
    implementing mitigation strategies



  Your fitness level

  - Professional Experience: You bring at least 4 years of
    hands-on project management experience in product
    development, manufacturing or engineering
  - Educational Background: You hold a university degree in
    Engineering or related technical field
  - Hardware Development Expertise: You have a deep
    understanding of the complexities involved in managing
    hardware product development and delivery
  - Process Improvement: You have experience driving process
    improvements and managing organizational change
  - Hands-on Mentality: You stand out with a pragmatic,
    proactive approach, eager to take the lead and share your
    knowledge and ideas
  - Strong Communication: You are an effective and empathic
    communicator, able to convey complex ideas to a wide range
    of stakeholders. You also bring strong problem-solving
    skills and can troubleshoot with limited oversight
  - Willingness to Travel: You are open to travel up to 20% ,
    including both international trips lasting several days
    and shorter visits within Germany for production or
    supplier site visits
  - Languages: You are fluent in English, German is a plus



  Your training goal for your first 6 months

  - Collaboration: You’ve built strong, effective day-to-day
    working relationships with the Project Management Team
  - Integration: You are a well-connected member of the Hardware
    Engineering department, with a solid understanding of our
    teams, tools, and processes
  - Project Involvement: You’ve taken ownership of at least one
    project, gaining a deep understanding of our workflows



  The equipment we provide

  - Modern & International: Be part of an international company
    culture where talent and passion are valued, heard and
    included in the decision-making process
  - Work-Life Balance: Benefit from flexible working hours,
    hybrid workplace model and 30 days of vacation per year
  - Fit & Healthy: Train for free with EGYM Wellpass and use our
    in-house gym equipped with EGYM Smart Strength and Smart
    Flex machines
  - Employee Discounts: Have access to a variety of great
    discounted offers, from fashion to leisure, through our
    employee benefits portal
  - Bike Leasing: Stay active by taking advantage of our bike
    leasing offer for your commute or leisure activities
  - Subsidized Pension: Profit from our employer-subsidized
    pension
  - Flex Budget: Use €60 per month flexibly for public
    transportation and a meal subsidy
  - Rooftop Terrace: Enjoy your lunch breaks or after work
    drinks with your colleagues on our roof terrace when in
    the office

  #LI-DNI



  Contact Information:

  Please upload your documents (CV, certificates, references,
  salary expectations and earliest possible start date) and
  specify the job ID #2020.  Contact: Liska Kürten

  For further information: https://career.egym.com

  About EGYM

