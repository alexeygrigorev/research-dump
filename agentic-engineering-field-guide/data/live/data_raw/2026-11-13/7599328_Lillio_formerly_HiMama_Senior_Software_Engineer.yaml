description: |
  About Lillio (formerly HiMama) and Our Mission:



  At Lillio (formerly HiMama), we are a mission driven
  business with the goal of empowering early childhood
  educators through innovative, affordable tools that enable
  them to improve child outcomes, engage family members, and
  support continued professional growth for their staff. We
  are committed to serving the field as an authentic voice of
  the early childhood education (ECE) workforce, providing
  programs with all of the building blocks for high-quality
  early care and education and helping early educators focus
  on what matters most for children’s successful development
  and learning: relationships, play, creativity, and loving,
  nurturing caregiving. If you are excited about being part of
  an impact-driven business, focused on making a difference in
  the early childhood education industry, Lillio is the place
  for you.



  Lillio is a Series B, private-equity backed company and
  we're proud to be part of the Bain Double Impact portfolio.
  Lillio is recognized as an industry leader, most recently
  selected in 2025 by Time Magazine as one of the world's top
  EdTech companies.

  We’re looking for…

  A talented and motivated full stack engineer to join our
  dynamic engineering team. You care deeply not just about the
  security, performance, and maintainability of your code, but
  about our mission to elevate early childhood programs with
  innovative design and quality solutions. As a Senior
  Software Engineer you will play a lead role in designing,
  developing, and maintaining web applications using Ruby on
  Rails, React, and GraphQL.

  Lillio Engineering

  At Lillio, our Product & Engineering teams are a tight-knit
  unit. By using strong product creation methodologies and
  processes, and by working closely together, we imagine and
  create great products that immediately make an impact in the
  lives of millions of educators, parents, and young children.
  The engineering team at Lillio is made up of full stack web
  engineers as well as multi-platform mobile experts. Every
  individual on the engineering team has the opportunity to
  make a big impact on growing the Lillio product offering
  with a wide and varied feature set as well as impacting how
  Lillio builds and delivers that product. From feature
  enhancements to the core product, ground-up engineering on
  brand-new architecture, data scaling, and system
  performance, our team strives for excellence. Engineering at
  Lillio requires being an adept problem solver that is hard
  working and motivated to get stuff done.

  How You'll Make an Impact:

  - Develop secure, performant, and well-tested code for web
    applications using Ruby on Rails, GraphQL and React.
  - Collaborate with product managers, designers, and other
    engineers to define project requirements and
    specifications.
  - Mentor and coach your peers, including compassionate code
    review.
  - Troubleshoot and debug issues as part of our shared on-call
    rotation.
  - Lead technical decision making and contribute to
    establishing best practices for your team.

  What You Bring to the Table:

  - Bachelor’s degree in Computer Science from an accredited
    University or relevant experience
  - Strong communicator who enjoys collaborating with teammates
  - Knowledgeable about best practices and emerging trends
  - Ambition to work hard in order to make an impact
  - Evidence of independence and self-starter attitude
  - Propensity to always want to learn and improve
  - Strong sense of empathy not only for the user but others
    that you work with

  Required Technical Skills

  - 5+ years as a software engineer
  - Demonstrated technical or project leadership experience
  - Demonstrated expertise with relational databases
  - Proficiency with Ruby on Rails, GraphQL, React
  - Experience with data monitoring and logging tools, ex
    Sentry, New Relic, Data Dog, etc

  Nice to Have:

  - Experience with mobile app development
  - Knowledge of UX and UI best practices and trends
  - Experience with AWS, Postgres, Heroku
  - Comfort leveraging AI (such as): Claude, Gemini, Co-Pilot,
    MCP, etc.

  Tech Stack:

  - AWS, PostgreSQL, Heroku
  - Ruby on Rails, GraphQL, React Native

  Note: we are only considering Canadian applicants for the
  position at this time.

  This role is posted to hire a backfill.



  Don’t have all the requirements but convinced you’ll be able
  to make an impact? We’d love to hear from you!  Please note
  that we place serious consideration to your application
  responses to all questions; only completed profiles will be
  considered for this role.  



  Lillio Perks

  -- Flexible working arrangements; we are a remote-first
  company who gathers together (virtually) every quarter, and
  in-person at least once per year. You must be willing to
  travel in-person as required for the role

  -- Health benefits package includes medical, dental and
  vision

  -- Paid time off, including vacation, personal and volunteer
  days

  -- Opportunities for learning, mentorship and professional
  development

  -- Ongoing team-wide and company-wide virtual social
  activities and success celebrations



  Accessibility

  Lillio is committed to inclusiveness, equity and
  accessibility. If you require accommodations at any step of
  the application or interview process, please indicate so
  under the "Accommodations Question" box on your application.
  Accommodations may include but are not limited to:
  alternative methods of communication, providing a detailed
  “what to expect”, or modified testing. Please note this list
  is not exhaustive and we are more than happy to discuss
  other accommodations as required.



  Commitment to Diversity

  Diversity, Inclusion and Belonging are central to Lillio's
  core values. Lillio aims to ensure we provide a safe
  environment for everyone to thrive while bringing their
  authentic selves to work. Our mission is to promote an
  inclusive work space for all employees through Education,
  Discussion, and Celebration of our differences. Embracing
  these differences while coming together with a common
  purpose is what makes our team extra special. Our focus on
  inclusion and belonging is activated in the day-to-day
  culture at Lillio through our Diversity, Inclusion and
  Belonging (DIBS) committee, our bi-weekly DIBS discussions,
  DIBS Slack community, D&I training and education, volunteer
  days, donation matching, and more.



  Equal Employment

  Lillio is an equal employment opportunity employer. We
  consider all qualified applicants without regard to race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, genetics, disability,
  age, veteran status, or any other legally protected
  characteristics.
