description: |
  About the Role

  As a Software Technical Support Engineer at ARX Robotics,
  you will bridge the gap between cutting-edge software
  development and real-world robotic performance. Our
  autonomous ground systems operate in critical, demanding
  environments where reliability and resilience are paramount.
  You will ensure our software and hardware work seamlessly
  together, both in our labs and out in the field.

  In this role, you will diagnose complex challenges, validate
  key system features, and directly support engineering teams
  and operational partners. Your work ensures our robotic
  platforms perform reliably, helping safeguard personnel and
  protect operational readiness across Europe.



  What You’ll Build

  - Enhance and optimize our core robotics software stack by
    integrating new hardware, drivers, and capability updates.
  - Test and validate complete robotic platforms across all
    critical communication layers, including CAN bus,
    Ethernet, and wireless networks.
  - Conduct hands-on verification in lab facilities and active
    field environments to evaluate durability and operational
    readiness.
  - Reproduce, investigate, and root-cause complex technical
    bugs, partnering directly with software and systems
    engineers to implement lasting solutions.
  - Build automated diagnostic scripts and testing utilities
    (using Python or Bash) to streamline repetitive workflows
    and increase coverage.
  - Provide high-impact technical guidance and troubleshooting
    support to internal teams and external customers during
    field deployments.
  - Refine testing frameworks, verification checklists, and
    issue escalation workflows to maintain high standards of
    system quality.
  - Collaborate across cross-functional engineering groups to
    maintain seamless integration across all vehicle
    subsystems.



  What You Bring

  - Practical experience testing, troubleshooting, and
    diagnosing integrated hardware, software, and robotics
    systems.
  - Strong proficiency in C++ along with hands-on experience
    using ROS 2 in development or testing environments.
  - Practical knowledge of network and communication protocols
    such as CAN, Ethernet, TCP/UDP, and serial interfaces.
  - Working knowledge of Linux operating systems, shell
    navigation, and diagnostic scripting in languages like
    Python or Bash.
  - Familiarity with engineering tools such as Git, Docker, and
    packet analysis tools like Wireshark.
  - Foundational understanding of embedded systems,
    microcontrollers, and sensor/actuator integration.
  - A curious, systematic approach to problem-solving across
    both software logic and physical hardware components.
  - Clear communication skills with the ability to explain
    complex technical issues constructively to teammates and
    partners.
  - Professional working proficiency in English (German language
    skills are a valuable asset).



  Please note: You do not need to meet every single
  requirement to apply. We welcome motivated candidates who
  are eager to grow into the role and develop their expertise
  further.

  What We Offer

  Join a mission-driven European defense tech company at a
  pivotal stage of growth, where you can help shape meaningful
  technology, take ownership early, and grow with the
  business!

  - Competitive compensation package including a bonus
    opportunity
  - 27 vacation days to start, increasing with tenure up to 30
    days
  - Employer-supported pension contribution
  - Learning & development support and team events budget
  - Employee discounts and flexible benefits budget via Probonio
  - Hybrid working setup depending on role and team needs
  - Structured salary bands, levelling framework, and bi-annual
    development conversations
  - Referral bonus program, dog-friendly office, and relocation
    support where applicable

  About Us

  ARX is a dual-use technology company that specializes in
  developing autonomous unmanned systems and sensors for the
  European defence sector. Our dual-use unmanned ground
  systems and sensors assist NATO Armies and civilian first
  responders in tackling their most challenging problems by
  providing them with training and information to make better
  decisions and take effective actions in life-or-death
  situations. As our team continues to expand rapidly, we are
  seeking motivated candidates who are excited to work in a
  highly energetic, creative, and innovative team dedicated to
  developing autonomous systems for challenging environments.
  We operate in a dynamic sector where collaboration, sharing
  innovative ideas, and developing novel problem-solving
  strategies are ingrained in our work culture. If you are
  passionate about overcoming challenges that have a real
  impact on the security of our democracies, apply here to
  join ARX and help shape the future of dual-use technology!

  ARX is an equal-opportunity employer, and we encourage
  candidates from all backgrounds to apply.

