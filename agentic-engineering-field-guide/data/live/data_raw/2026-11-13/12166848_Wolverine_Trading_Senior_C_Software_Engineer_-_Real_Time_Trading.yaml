description: |
  Senior C++ Software Engineer - Real Time Trading Department:
  Technology Employment Type: Full Time Location: Chicago, IL
  Description At Wolverine Trading, we're looking for a Senior
  C++ Software Engineer to build and optimize the market data
  and execution systems at the heart of our trading operation.
  This role is on-site in our Chicago headquarters, where
  engineers work shoulder-to-shoulder with traders and
  hardware specialists on systems where every microsecond
  counts. You'll take on some of the most technically
  demanding problems in the industry including processing
  enormous volumes of market data, connecting exchanges around
  the world, and executing orders at maximum speed and
  reliability. This is a hands-on role for an engineer who
  thrives on performance-critical work, wants their code
  running in production where its impact is immediately
  measurable, and is ready to help set the technical direction
  of a growing team. What You'll Do

  - Build and enhance low-latency C++ components for market data
    processing, exchange connectivity, and order execution.
  - Develop and optimize connectivity to new markets and
    exchange platforms, expanding the reach of our trading
    business.
  - Analyze and tune system performance at every level from
    application code and lock-free data structures to network
    and OS-level behavior.
  - Collaborate with traders, FPGA engineers, and infrastructure
    teams to deliver end-to-end solutions across software and
    hardware.
  - Own production systems through the full lifecycle: design,
    implementation, testing, deployment, and real-time
    support.

  What We're Looking For

  - Bachelor's or Master's Degree in Computer Science, Computer
    Engineering, or a related field.
  - 3+ years of professional experience developing C++ code;
    exposure to low-latency, real-time, or high-throughput
    systems from any industry is a plus.
  - Expert-level knowledge of modern C++ (C++17 or later),
    including templates, move semantics, and low-level
    performance idioms.
  - Strong grasp of systems fundamentals: memory hierarchies,
    CPU architecture, lock-free programming, and network
    protocols (TCP/UDP).
  - No prior trading or financial markets experience needed! We
    are looking for a strong technical foundation and a drive
    to learn the domain is what matters.
  - A pragmatic, detail-oriented approach and communication
    skills to work effectively with both technical and trading
    teams.

  Why Join Us Our flat organizational structure promotes
  teamwork across the Firm and offers easy access to senior
  staff. While we work exceptionally well as a team in the
  office, our bonds are further strengthened through company
  events, activities and giving back. Volleyball, soccer,
  hockey, 5K runs, picnic, parties, and trivia nights provide
  friendly competition and build better relationships. By
  getting out of our usual environment and doing out-of-the-
  ordinary things together, we foster creativity and broaden
  our imaginations to accomplish new challenges. Benefits:

  - Highly competitive salary & bonus opportunity
  - Generous paid time off and flexible scheduling
  - 100% coverage of medical, dental, vision, life, and
    disability benefits for single coverage
  - Generous Paid Parental Leave
  - Retirement Plans: 401K and Roth 401K
  - Profit sharing plan
  - Long- and short-term disability

  Additional Perks:

  - Free breakfast and lunch from our in-house kitchen with
    rotating menus (including snacks!)
  - On-site gym with a subsidized membership
  - Frequent company outings
  - Opportunity to give back to organizations that help
    individuals in need in the Chicagoland area

  Professional Development:

  - In-house education team - classes and resources are offered
    for continuous learning opportunities
  - Mentorship Program through your first six months of
    employment

  The base compensation range for this role is approximately
  $100,000-$140,000 contingent on experience. Wolverine
  Trading's total compensation model includes base salary and
  an annual discretionary bonus.
