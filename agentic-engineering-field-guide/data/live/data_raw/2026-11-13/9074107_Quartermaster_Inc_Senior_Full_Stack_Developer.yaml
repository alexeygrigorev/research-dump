description: |
  BUILD SOMETHING YOUR NEIGHBOURS WILL LOVE

  We’re building home management for GTA homeowners, and a
  better way for neighbours and the local Pros they trust to
  be useful to each other.

  Our focus is the GTA, and only the GTA for now. We grow one
  neighbourhood at a time. We’re a local tech company in every
  sense of the word, and we start with integrity and the
  belief that good work matters.

  We believe homeowners should have everything their home
  needs in one place, and that neighbourhoods work best when
  trust runs high and stays local. Commissions should be small
  and charged only on completed work, so the best Pros can
  actually say yes. Tech companies should go to work for the
  locally loved Pros of the GTA, rather than trying to get
  those Pros to effectively work for the tech company.

  If this resonates with you and you’re at a point in your
  career and your life where you want to do something uniquely
  difficult for a meaningful outcome, you’ve found your next
  home.

  ROLE OVERVIEW

  The Senior Full stack Developer is a key contributor
  responsible for delivering high-quality, scalable software
  across the frontend and backend. This role involves building
  performant UIs, designing robust APIs, modeling data flows,
  and integrating services that support complex product
  features.

  Working closely with product, design, and engineering teams,
  the developer drives architecture decisions, leads technical
  implementation, and mentors others on best practices. They
  balance hands-on execution with systems thinking,
  consistently improving code quality, performance, and
  developer experience. The ideal candidate pairs deep
  technical skill with a strong product mindset and a focus on
  reliability, usability, and long-term maintainability.

  EMPLOYEE OWNERSHIP:

  We’re a team on a mission.  We expect a high degree of
  ownership from each other and we pair that with higher than
  usual employee ownership in the company.

  WHAT YOU WILL BE DOING Technical Execution & Ownership

  - Architect and implement scalable, maintainable, and
    observable fullstack applications using modern
    JavaScript/TypeScript ecosystems (React, Next.js, Node.js,
    Express/Koa, NestJS)
  - Design and optimize relational (PostgreSQL, MySQL) and non-
    relational (MongoDB, DynamoDB, Redis) data models to
    support transactional consistency, efficient querying, and
    multi-tenancy
  - Build robust API layers (REST/GraphQL/gRPC), incorporating
    input validation, rate limiting, auth middleware,
    pagination, and real-time event streaming via WebSockets
    or SSE
  - Construct flexible state management patterns (Redux Toolkit,
    Zustand, React Query) across web applications for
    efficient data hydration, caching, and optimistic UI
  - Implement progressive rendering strategies (SSR, ISR, SSG)
    to balance performance and SEO within frontend frameworks
    like Next.js
  - Manage frontend build tooling and transpilation (Webpack,
    Vite, Babel, SWC), including module federation, code-
    splitting, and lazy loading optimizations
  - Develop backend services with clean architecture principles
    (domain-driven design, hexagonal ports/adapters),
    enforcing separation of concerns and enabling high
    testability
  - Instrument frontend and backend code with structured logging
    (Pino, Winston), distributed tracing (OpenTelemetry,
    Honeycomb), and metrics (Prometheus, StatsD) for proactive
    debugging and performance tuning
  - Build automated deployment pipelines for both client and
    server with CI/CD tools (GitHub Actions, CircleCI,
    ArgoCD), including staging environments, ephemeral
    previews, and rollback mechanisms
  - Integrate cloud-native capabilities like object storage
    (S3), job queues, messaging systems (Kafka, NATS), and
    container orchestration (Docker, Kubernetes)

  Decision-Making & Collaboration

  - Make full stack architectural decisions balancing developer
    productivity, system scalability, and product roadmap
    velocity
  - Collaborate with product, design, and QA to define technical
    requirements and delivery plans, including accessibility,
    internationalization, and performance
  - Align frontend and backend concerns via shared contracts
    (e.g. GraphQL schema, OpenAPI specs) to drive consistency
    and testability
  - Facilitate cross-team decisions for shared infrastructure,
    deployment pipelines, and development standards

  - Transparently communicate tradeoffs and drive alignment
    across stakeholders on architectural risk, effort, and
    technical debt remediation

  Leadership & Mentorship

  - Mentor junior and mid-level engineers in front-end and
    mobile development, accessibility, and system design
    principles
  - Lead code reviews, architecture sessions, and cross-platform
    design discussions with a focus on performance and
    accessibility
  - Support team learning through documentation, knowledge-
    sharing, and feedback-driven growth
  - Advocate for accessibility and mobile quality in engineering
    culture and product planning

  Agile Process & Delivery

  - Drive backlog refinement, estimation, and sprint planning
    across cross-functional squads with fullstack
    responsibilities
  - Own release readiness for features, including end-to-end
    testing, canary rollout strategies, and post-deployment
    observability
  - Establish and maintain CI/CD pipelines for web and backend
    services using GitHub Actions, CircleCI, or similar tools
  - Integrate code coverage, static analysis, and test
    automation into delivery pipelines to support velocity
    without sacrificing stability
  - Continuously improve team workflows via retrospectives,
    tooling improvements, and process experimentation

  WHAT YOU BRING Candidates should have 6+ years of fullstack
  experience, with 2+ years leading technical projects or
  teams. They must be fluent in JavaScript or TypeScript, with
  strong proficiency in React and backend development using
  Node.js or similar. Experience building APIs, modeling data,
  and deploying to cloud infrastructure is essential.

  They should be confident owning architecture decisions,
  mentoring teammates, and collaborating across design,
  product, and engineering. Familiarity with accessibility
  standards, performance optimization, and secure coding
  practices is expected. The ideal candidate delivers
  scalable, user-focused solutions and thrives in fast-paced,
  cross-functional environments.

  THIS IS A GOOD FIT FOR YOU IF…

  - You’re mission-driven and looking to solve the mission’s
    hardest problems.
  - You’re at a point in your life and your career where you
    want to tackle a uniquely demanding job to produce
    meaningful impact.
  - You’re keen to work in-person with a team.
  - You show up like an owner.
  - You want to value the equity and solve for others.

  ROLE SALARY BAND

  $150,000 - $190,000

  LOCATION

  We believe that in-person work builds a level of connection
  and shared understanding that fully-remote work cannot
  achieve.

  This role requires you to work at our office every Monday,
  every Thursday and every second Tuesday.  Reasonable
  exceptions are made when life happens, but these should be
  infrequent.

  If you are not already located in Toronto or one of its
  nearby suburbs, we will only be able to consider your
  application if you already have concrete plans to relocate
  to the Toronto area.

  OUR VALUES

  ❤  Integrity – We prioritize integrity over comfort,
  convenience, and the short-cuts of success that drive
  metrics but undermine trust.

  ❤  Trust – We cannot win  unless we win on trust.  Trust is
  hard to earn and easy to lose.  We need to be built for it
  in our DNA.

  ❤ Competitiveness – We believe that competitiveness is a
  critical complement to integrity and trust.  If we’re not
  our customer’s best choice, then we’re wasting their time.
  We believe in the power of healthy competitive markets, and
  we believe we need to be uniquely competitive to win in this
  space.   We have too much respect for the other players in
  this space to expect things to be easy.  That’s a good
  thing.

  ❤ Empowerment – Any win we achieve needs to be first and
  foremost a win that we deliver to others, starting with our
  customers, and their long term best interests.

  VACATION AND BENEFITS

  We know the power it takes to be successful in a challenging
  mission and we want to ensure our team is rested and ready
  to go.

  - We offer 30 days of PTO annually, which can be used for
    vacation, personal days, or illness. Five of these days
    are designated as company-wide closures around the start
    and end of the year.
  - In addition, our benefits plan covers health, dental and
    wellness to add that extra pep in our step, and help us
    sleep at night.
  - We have a tech allowance benefit to help set you up for
    work.
  - We have pregnancy and parental leave policies, and we’re
    ready to support your family’s next stage of growth.

  EMPLOYEE OWNERSHIP

  We’re a team on a mission.  We expect a high degree of
  ownership from each other and we pair that with higher-than-
  usual employee ownership in the company.

  A NOTE ON HUMAN BEINGS

  We believe that meaning is created between human beings.
  This job description was written by a human, and every
  resume will be reviewed by a human.
