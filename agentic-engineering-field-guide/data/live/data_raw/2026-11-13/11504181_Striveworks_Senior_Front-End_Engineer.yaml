description: |
  “In 36 months, agentic AI systems will be an operating
  reality across major institutions. We intend to be central
  to it.” — Dr. Jim Rebesco, Cofounder and CEO, Striveworks

  The government’s demand for AI is growing far faster than
  the systems required to support it. Fewer than 15% of
  federal AI programs have reached sustained production,
  despite billions of dollars invested. The models perform in
  testing, but they degrade in the real world. And when
  performance drops, trust goes with it.

  Striveworks was built to solve that problem.

  What you’ll build

  Since 2018, we have delivered the most trusted AI systems
  operating in real-world use cases—providing a layer of
  assurance underneath hundreds of deployed models that
  monitors performance, manages drift, and sustains systems
  long after they leave the lab.

  As a Senior Front-End Engineer, you will be a core
  contributor to building the next generation of our
  AI/machine learning (ML) operations platform. You’ll work
  closely with data scientists, product designers, software
  engineers, and DevOps engineers to turn user and technical
  requirements into intuitive, reliable, and maintainable
  experiences. We’re looking for exemplary engineers with a
  product mindset who care deeply about how users interact
  with complex systems and who are excited about building
  software that makes advanced AI/ML capabilities accessible
  and useful.

  What it’s like here

  We lead with trust, treat each other with respect, and use
  candor consistently, kindly, and constructively. We care
  deeply about our work, and we find genuine satisfaction in
  doing it well. Above all, we take ownership—because we feel
  the weight of collective results personally. We are looking
  for people who share these values and are eager to put them
  into practice.

  What we’re looking for

  - A bachelor’s degree with a STEM concentration and 6+ years
    of professional software engineering experience, or
    equivalent
  - Strong understanding of UI/UX principles, design patterns,
    responsive design, and modern CSS
  - Proven experience building production web applications with
    React
  - High level of proficiency with TypeScript and modern
    JavaScript
  - Experience integrating REST APIs and familiarity with
    GraphQL
  - Familiarity with modern front-end development tools and
    frameworks such as Next.js and Vite
  - Experience with automated testing and unit testing
    frameworks such as Playwright and Jest
  - Experience building and deploying software using cloud-based
    services
  - Expertise with component libraries and design systems, such
    as Material UI
  - Understanding of modern distributed version control systems,
    such as Git
  - Experience integrating AI development tools, including LLMs
    and code agents, into daily workflows to drive engineering
    efficiency
  - A history of maintaining high-quality code standards
    required by agentic work and providing concise, well-
    scoped changes that optimize code and context windows, and
    maximize agents
  - Ability to collaborate effectively with product designers,
    software engineers, DevOps engineers, and other
    stakeholders to translate requirements into intuitive and
    maintainable user experiences
  - US citizenship with eligibility and willingness to obtain a
    Secret US security clearance

  The following isn’t required, but we’d love to see it:

  - Experience with modern front-end libraries and tools such as
    TanStack Query, Axios, React Context API, and styled
    components
  - Proficiency in Python and/or Go
  - Experience deploying applications to Kubernetes using tools
    such as Helm
  - Experience deploying and operating applications in cloud
    environments such as AWS, GCP, or Azure
  - Familiarity with continuous integration and continuous
    delivery (CI/CD) practices
  - Experience collaborating directly with product designers to
    translate Figma designs and prototypes into polished,
    intuitive user experiences
  - Passion for understanding user needs, exploring design
    alternatives, and iterating on UI/UX solutions
  - Active Secret (or above) US security clearance

  This position offers a fully remote work environment, or you
  can work hybrid/on site at our office in Austin, TX. You
  will be expected to travel up to 10% of the time.

  Compensation

  The anticipated base pay range for this position is
  $160,000–$200,000/year. Striveworks’ total compensation
  package includes a competitive base salary, equity grants,
  and cash bonuses.

  Benefits include:

  - Medical/dental/vision insurance
  - Voluntary life, long-term disability, accident, and hospital
    indemnity insurance
  - HSA and FSA (including dependent care FSA) plans
  - 401(k) plan
  - Unlimited PTO
  - Paid parental leave

  Ready to build systems that work for a mission that matters?
  Let’s talk.

  Striveworks is an Equal Opportunity Employer and does not
  discriminate in employment on the basis of race, color,
  religion, belief, sex (including pregnancy and gender
  identity or expression), national origin, social or ethnic
  origin, political affiliation, sexual orientation, marital
  status, disability, genetic information, age, membership in
  an employee organization, retaliation, parental status,
  military service, or other non-merit factors. Striveworks
  will not tolerate discrimination or harassment of any kind.

  If you require assistance or a reasonable accommodation in
  the application process, please contact People Operations at
  hr@striveworks.us.

  In compliance with federal law, all persons hired will be
  required to verify their identity and eligibility to work in
  the United States and to complete an employment eligibility
  verification form upon hire.

  Striveworks is a participating employer in the E-Verify
  program.
