  Job Description

  Cox Automotive Corporate Services, LLC

  Lead Software Engineer

  Job Description:

  Lead Software Engineer positions offered by Cox Automotive
  Corporate Services, LLC (Austin, TX). Work with Product
  Management to understand the challenges that customers and
  end users face in their day-to-day work and partner with
  them to design viable solutions. Recommend solutions to
  processes, technology, and interfaces that improve the
  effectiveness of the team and reduce technical debt. Foresee
  capacity requirements for component usage and identify
  limitations. Provide input into story sizing, backlog
  grooming, and release planning. Contribute to product and
  solution designs to address critical issues and complex
  problems. Build software applications across multiple
  platforms in response to the needs of stakeholders.
  Understand technical architecture and write software and
  automated tests that are aligned with agreed-upon standards.
  Perform trouble-shooting efforts and investigations when
  necessary. Provide ongoing support, monitoring, and
  maintenance of deployed products. Work with less experienced
  software engineers, providing technical guidance and
  oversight. Perform analysis and proof-of-concepts for new
  and upgrading feature work.

  Minimum Requirements:

  - Requires a bachelor’s or foreign equivalent degree in
    Computer Science, Computer Engineering or a related field
    and 6 years of experience designing, developing, and
    implementing software systems and components, and major
    Internet-oriented applications or systems.

  - Must have 6 years of experience in each of the following:

  - Realizing applications from design to implementation;
  - Coding within multiple technology stacks on the Front-end
    using HTML, CSS, JavaScript (Angular or React) and on
    applications and using C#; and
  - Analyzing, designing, and programming in C#.

  - In lieu of a bachelor’s or foreign equivalent degree in the
    aforementioned fields and 6 years of experience as stated,
    employer will accept a master’s or foreign equivalent
    degree in the aforementioned fields and 4 years of
    experience as stated, or a Ph.D. or foreign equivalent
    degree in the aforementioned fields and 1 year of
    experience as stated.

  - Must have 1 year of experience writing unit tests.
  - Position reports to Austin, TX office.  Telecommuting
    permitted in accordance with company policy, but must live
    within commuting distance of stated office.

  - Experience may be, but need not be, acquired concurrently.

  Compensation includes a base salary of $175,584-$203,610.
  The base salary may vary within the anticipated base pay
  range based on factors such as the ultimate location of the
  position and the selected candidate’s knowledge, skills, and
  abilities. Position may be eligible for additional
  compensation that may include an incentive program.

  The Company offers eligible employees the flexibility to
  take as much vacation with pay as they deem consistent with
  their duties, the company’s needs, and its obligations;
  seven paid holidays throughout the calendar year; and up to
  160 hours of paid wellness annually for their own wellness
  or that of family members. Employees are also eligible for
  additional paid time off in the form of bereavement leave,
  time off to vote, jury duty leave, volunteer time off,
  military leave, and parental leave.

  If interested, please apply online at:
  https://jobs.coxenterprises.com. EOE. CAI-0455.

