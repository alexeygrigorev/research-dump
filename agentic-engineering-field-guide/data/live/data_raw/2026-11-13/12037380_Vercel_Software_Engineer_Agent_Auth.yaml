title: Software Engineer, Agent Auth
company: Vercel
location: San Francisco, USA
work_type: FULL_TIME
description: |
  About Vercel:

  Vercel is the agentic infrastructure company, freeing people
  and agents to ship what's next. For more than a decade we've
  helped builders move from idea to production with speed,
  security, and exceptional developer experience.

  Now we're scaling our products for both agents and people to
  ship and run software, built in the open and trusted by
  OpenAI, PayPal, Ramp, Supreme, and millions of developers
  worldwide.

  About the role:

  Agents are becoming first-class users of the internet. They
  sign in, call APIs, deploy code, and act on behalf of people
  and teams. That raises questions the web was never designed
  to answer: Who is this agent? Who does it work for? What is
  it allowed to do, for how long, and how do we know?

  As an engineer on the Agent Auth and Identity team, you'll
  help answer those questions. You'll build the systems that
  let agents and people authenticate, delegate access, and act
  safely across Vercel and the services our customers connect
  to. This is foundational work: identity and authorization
  sit underneath everything we ship, and getting them right
  for agents will shape how modern software gets built.

  The scope is intentionally broad. You might spend one
  quarter designing how credentials are issued and scoped for
  autonomous agents, and the next building the developer-
  facing APIs and SDKs that make secure auth feel effortless.
  You'll own systems end-to-end, from design through long-term
  operation in production.

  We're looking for engineers who care deeply about security
  and developer experience in equal measure, enjoy working on
  problems without established playbooks, and want to define
  how trust works in an agentic world. This is a hybrid role
  based in San Francisco, in the office on Monday, Tuesday,
  and Friday.

  What you'll do:

  - Design, build, and operate the identity, authentication, and
    authorization systems that power Vercel and our Customers
    for both people and agents.
  - Shape how agents prove who they are, act on behalf of users
    and teams, and receive scoped, time-bound, auditable
    access.
  - Build secure, scalable APIs, services, and SDKs that make
    auth simple for developers and their agents to adopt.
  - Work with modern and emerging standards (such as OAuth 2.x,
    OIDC, and agent-focused protocols) and help influence
    where they go next.
  - Lead projects end-to-end: identify opportunities, set
    technical direction, and deliver improvements in security,
    reliability, and developer experience.
  - Participate in the on-call rotation, taking responsibility
    for the reliability of critical systems.

  What you need:

  - 3+ years of experience designing, building, and operating
    backend systems in production at scale.
  - Strong proficiency in JavaScript/TypeScript, or a comparable
    backend language and the willingness to work primarily in
    TypeScript.
  - Solid understanding of authentication and authorization
    concepts, such as sessions, tokens, OAuth/OIDC flows,
    permission models, and secrets management.
  - A security-minded approach to engineering: you think about
    threat models, least privilege, and failure modes as part
    of design, not as an afterthought.

  Benefits & Compensation:

  - Competitive compensation package, including equity.
  - Inclusive Healthcare Package.
  - Learn and Grow: we provide mentorship and send you to events
    that help you build your network and skills.
  - Flexible Time Off.
  - We will provide you the gear you need to do your role, and a
    WFH budget for you to outfit your space as needed.

  The base pay range for this role is $196,000 – $294,000.
  Actual salary will be based on job-related skills,
  experience, and location. The total compensation package may
  include benefits, equity-based compensation, and eligibility
  for a company bonus or variable pay program depending on the
  role. Your recruiter can share more details during the
  hiring process.

  Disclosures:

  - Privacy: Please review our Job Applicant Privacy Policy for
    more information on how we handle your data.
  - Equal Opportunity: Vercel is committed to fostering and
    empowering an inclusive community within our organization.
    We do not discriminate on the basis of race, religion,
    color, gender expression or identity, sexual orientation,
    national origin, citizenship, age, marital status, veteran
    status, disability status, or any other characteristic
    protected by law. Vercel encourages everyone to apply for
    our available positions, even if they don't necessarily
    check every box on the job description.
