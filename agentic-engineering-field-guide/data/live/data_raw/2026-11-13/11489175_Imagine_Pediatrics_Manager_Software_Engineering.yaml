description: |
  Who We Are

  Imagine Pediatrics is a tech enabled, pediatrician led
  medical group reimagining care for children with special
  health care needs. We deliver 24/7 virtual first and in home
  medical, behavioral, and social care, working alongside
  families, providers, and health plans to break down barriers
  to quality care. We do not replace existing care teams; we
  enhance them, providing an extra layer of support with
  compassion, creativity, and an unwavering commitment to
  children with medical complexity.

  What You’ll Do

  As Manager, Software Engineering at Imagine Pediatrics, you
  will collaborate with product leaders and other stakeholders
  to deliver tech-enabled solutions that further our mission
  of ensuring every child with special health care needs get
  the care and support they deserve.

  You will:

  - Build, develop, and mentor a team of software engineers,
    fostering a culture of innovation, collaboration, and
    continuous improvement

  - Own the career growth of your engineers, from calibrated,
    timely feedback to growth planning and promotion advocacy,
    so each person on your team can reach their next level

  - Partner directly with Product and cross-functional teams
    (Data Engineering, Enterprise Analytics, Foundations) to
    shape data models, system boundaries, and integration
    decisions; proactively surface decisions and context
    across squads so nothing gets lost in translation

  - Facilitate the execution of our technical roadmap with a
    focus on data-driven decisions, timely and iterative
    product development, simplicity, and value delivery

  - Communicate with business stakeholders to understand goals
    and translate them to technical architecture and
    requirements; estimate product scopes and timelines

  - Collaborate with team to contribute to technical solutions
    that satisfy business requirements with a focus on
    scalability, stability, efficiency, maintainability and
    extensibility

  - Drive forward progress when requirements, ownership, or
    system boundaries are still being defined, bringing enough
    structure to unblock the team without waiting for perfect
    information

  What You Bring & How You Qualify

  First and foremost, you’re passionate and committed to
  reimagining pediatric health care and creating a world where
  every child with special health care needs gets the care and
  support they deserve. You will need:

  - 9+ years of software development experience; 3+ years of
    experience managing engineers as a sustained, primary
    function

  - Demonstrated experience navigating change and evolving
    priorities; comfortable driving progress amid ambiguous
    requirements

  - Experience managing teams that have purview across a cloud-
    based tech stack (AWS preferred)

  - Strong verbal and written communication skills with a
    demonstrated history of working asynchronously and
    remotely

  - A continual drive to clear the path for your team so that
    they can do their best work; comfortable working across
    disciplines to achieve this goal

  - Passion for developing engineers in a full range of
    professional skills

  - Ability to maintain a healthy balance between speed to
    proof-of-concept and robust, ideal systems

  - Experience driving organization-wide initiatives to improve
    outcomes in engineering

  - Experience at an earlier-stage or scale-up company
    preferred; healthcare experience preferred

  What We Offer (Benefits + Perks)

  The role offers a base salary range of $180,000 - $220,000
  in addition to annual bonus incentive, competitive company
  benefits package and eligibility to participate in an
  employee equity purchase program (as applicable). When
  determining compensation, we analyze and carefully consider
  several factors including job-related knowledge, skills and
  experience. These considerations may cause your compensation
  to vary.

  We provide these additional benefits and perks:

  - Competitive medical, dental, and vision insurance
  - Healthcare and Dependent Care FSA; Company-funded HSA
  - 401(k) with 4% match, vested 100% from day one
  - Employer-paid short and long-term disability
  - Life insurance at 1x annual salary
  - 20 days PTO + 10 Company Holidays & 2 Floating Holidays
  - Paid new parent leave
  - Additional benefits to be detailed in offer

  What We Live By

  We’re guided by our five core values:

  Our Values:

  - Children First. We put the best interests of children above
    all. We know that the right decision is always the one
    that creates more safe days at home for the children we
    serve today and in the future.
  - Earn Trust. We listen first, speak second. We build lasting
    relationships by creating shared understanding and
    consistently following through on our commitments.
  - Innovate Today. We believe that small improvements lead to
    big impact. We stay curious by asking questions and
    leveraging new ideas to learn and scale.
  - Embrace Humanity. We lead with empathy and authenticity,
    presuming competence and good intentions. When we stumble,
    we use the opportunity to grow and understand how we can
    improve.
  - One Team, Diverse Perspectives. We actively seek a range of
    viewpoints to achieve better outcomes. Even when we see
    things differently, we stay aligned on our shared mission
    and support one another to move forward — together.

  We Value Diversity, Equity, Inclusion and Belonging

  We believe that creating a world where every child with
  complex medical conditions gets the care and support, they
  deserve requires a diverse team with diverse perspectives.
  We're proud to be an equal opportunity employer. People
  seeking employment at Imagine Pediatrics are considered
  without regard to race, color, religion, sex, gender, gender
  identity, gender expression, sexual orientation, marital or
  veteran status, age, national origin, ancestry, citizenship,
  physical or mental disability, medical condition, genetic
  information, or characteristics (or those of a family
  member), pregnancy or other status protected by applicable
  law.
