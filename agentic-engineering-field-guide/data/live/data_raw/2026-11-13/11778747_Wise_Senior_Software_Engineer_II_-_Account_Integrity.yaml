description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  About the role:

  Join us as a Senior Software Engineer in our critical
  Account Integrity team. This is a high-impact engineering
  role with a strong product focus, dedicated to solving
  complex, real-world adversarial problems to directly protect
  our global customer base.

  How we work:

  The Account Integrity Team

  The Account Integrity team is on the front lines, dedicated
  to safeguarding our platform against sophisticated financial
  crime. We leverage cutting-edge machine learning, real-time
  transaction monitoring, and advanced data analysis to create
  robust controls and detection capabilities. Our vision is to
  build a globally scalable fraud prevention engine that
  protects customer accounts, prevents scams, and consistently
  surpasses regulatory expectations.

  What will you be working on?

  This defining role involves continuously improving our
  financial crime prevention infrastructure and systems. You
  will deliver a direct, measurable impact on customer
  security by taking end-to-end ownership of projects focused
  on:

  - Building and refining critical controls to protect Wise
    customers accounts from account takeovers.
  - Drive Backend and Frontend for our crime prevention and
    detection systems - You will be working 80% of the time on
    a backend and 20% on the frontend
  - You will be delivering a tangible, real-world impact by
    securing customers' money, accelerating product growth by
    raising automation levels, and helping us engineer a
    world-class money transfer product.

  What do you need?

  - Engineering Expertise: Professional experience with Java or
    other JVM-based languages, including the Spring framework.
  - System Design & Operation: Proven experience designing and
    operating CI/CD pipelines, Distributed, and Concurrent
    Systems.
  - Product Ownership: A strong product mindset, accountability,
    and the ability to drive projects independently, making
    data-driven decisions with the customer in mind.
  - Data Proficiency: Experience with relational and non-
    relational databases, including query optimisation and
    designing resilient schemas.
  - Code Quality: Exceptional fundamentals, sharp problem-
    solving ability, and a commitment to Test Driven
    Development and best coding practices.
  - Collaboration: Excellent communication skills to articulate
    complex technical concepts across teams (Product, Data
    Science, Investigations).

  Nice to Have:

  - Familiarity with the machine learning lifecycle (data
    pipelines, feature engineering, and deploying ML systems
    into production).

  Additional Information

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
