description: |
  RAVL helps technologists accelerate their careers.

  At RAVL, we connect strategy with execution, care deeply
  about the people we work with, and measure success by the
  lasting impact we leave behind. Our purpose is to build a
  team that puts real, sustainable business outcomes at the
  core of everything we do.

  We’re here to leave our clients better than we found them,
  and to create a place where our people are proud to Build.
  Better.

  As a Frontend Engineer at RAVL, you’ll craft elegant,
  accessible, and performant user experiences that connect
  people with technology. You’ll bring deep technical skill,
  curiosity, and creativity — designing modern, responsive
  applications that stand up to real-world scale.

  You’ll thrive in ambiguity, ship with intention, and grow
  fast — supported by world-class mentors, our proprietary
  learning journey, and meaningful client delivery from day
  one.

  At RAVL, what you build and how you build it both matter.

  What success looks like in this role:

  - Design and build responsive, performant UIs using modern
    frameworks (React, Next.js, Vue, etc.)
  - Architect maintainable frontend systems and component
    libraries for scale
  - Integrate APIs securely and efficiently across cloud-native
    environments
  - Champion accessibility, performance, and security as part of
    every release
  - Automate testing and delivery using CI/CD pipelines and
    modern tooling
  - Mentor peers, contribute to shared design systems, and
    influence frontend architecture
  - Collaborate cross-functionally with backend, DevOps, and
    design teams to deliver visible outcomes

  Sounds great, but do my skills fit the role?

  - Expert in JavaScript / TypeScript and SPA frameworks (React
    preferred)
  - Familiar with SSR/SSG (Next.js, Remix) and frontend
    performance optimization
  - Experience with frontend pipelines (Vite, Webpack, GitHub
    Actions) and test automation (Jest, Cypress)
  - Strong grasp of UX principles, accessibility standards
    (WCAG), and design systems
  - Ability to communicate technical detail clearly to both
    engineers and business stakeholders
  - Consulting excellence: prioritization, collaboration, and
    calm in ambiguity

  Mindset Traits

  - Delivery-first: focused on shipping meaningful impact
  - Craft-driven: passionate about code quality, design
    integrity, and user experience
  - Growth-minded: thrives on learning and mentorship — both
    giving and receiving
  - Empathetic influencer: leads through clarity, kindness, and
    credibility

  Technical Skills

  - Languages: TypeScript / JavaScript (ES6+)
  - Frameworks & Tooling: React, Next.js, Redux/Zustand, REST /
    GraphQL, Jest / Cypress
  - Build & Deployment: CI/CD (GitHub Actions, GitLab,
    CircleCI), containerization (Docker)
  - Cloud Platforms: AWS Amplify, Vercel, or Azure Static Web
    Apps
  - Security & Compliance: OWASP basics, secure API handling,
    RBAC for UI

  Why join RAVL?

  - Flexible, client-aligned work model — autonomy with
    accountability, adapting to client delivery needs
  - Variable bonus & RRSP contributions tied to performance and
    delivery impact
  - 4 weeks paid time off (plus public holidays)
  - Paid professional development days and continuous learning
    opportunities
  - Comprehensive health & dental coverage, including mental
    health support
  - Commitment to lifelong learning — continuous improvement
    through training, mentorship, and certification

  Compensation & hiring process

  We are recruiting for a future opportunity. The salary range
  for this role is $100,000–$150,000 CAD, reflecting expected
  base pay. Total compensation may also include additional pay
  such as bonuses or incentives, depending on the position,
  and final offers are based on experience, skills, and
  qualifications. As part of our hiring process we may use
  technology, including AI-based tools, to help summarize and
  assess applications; these tools assist our team and do not
  replace human review or decision-making.

  Equal Opportunity & Accessibility

  RAVL is an equal opportunity employer committed to building
  a diverse, inclusive, and accessible workplace. We welcome
  applications from all qualified individuals and provide
  accommodations throughout the hiring process upon request.
