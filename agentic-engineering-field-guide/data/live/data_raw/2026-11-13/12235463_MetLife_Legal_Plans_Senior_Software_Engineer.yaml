description: |
  This position is fully remote. The ideal candidate may be
  located anywhere in the continental United States.

  A Day in the Life of a Senior Software Engineer at MetLife
  Legal Plans:

  As a Senior Software Engineer, you will design, build, and
  own insurance tech and legal tech web applications from end
  to end. You will work across the full application lifecycle,
  from frontend development with JavaScript, React, CSS, and
  Material-UI to backend development with Python, Django, and
  Postgres, including APIs, architecture, testing, deployment,
  and ongoing support.

  Responsibilities (Essential Duties and Responsibilities):



  - Lead the design, architecture, and technology selection for
    client-facing applications, backend systems, and APIs.
  - Build and maintain scalable, secure, and high-performing web
    applications that support business growth and evolving
    client needs.
  - Own software solutions throughout the full Software
    Development Life Cycle (SDLC), from discovery and design
    through development, testing, deployment, and production
    support.
  - Develop high-quality code using modern software engineering
    principles, frameworks, and best practices.
  - Translate business requirements and strategic objectives
    into technical solutions and actionable development plans.
  - Establish and communicate technical standards, architectural
    guidelines, and development best practices across the
    engineering team.
  - Perform code reviews to ensure code quality,
    maintainability, security, and adherence to established
    standards.
  - Design and implement integrations and APIs that connect
    internal and external systems seamlessly and efficiently.
  - Evaluate emerging technologies and recommend innovative
    solutions to improve system performance, scalability, and
    user experience.
  - Collaborate with cross-functional stakeholders to prioritize
    work, resolve technical challenges, and deliver business
    value.
  - Lead, coach, and mentor mid-level and junior software
    engineers through regular feedback, technical guidance,
    knowledge sharing, and career development support.
  - Manage and drive software development projects end-to-end
    while fostering a culture of accountability,
    collaboration, continuous improvement, and technical
    excellence.

  Minimum Qualifications (Knowledge, skills, and abilities
  required)



  - Bachelor’s degree in CS, MIS, or equivalent.
  - 5+ years’ experience building web applications.
  - Experience in technology research & development methods and
    tools, while demonstrating ability to sponsor and lead
    multi-disciplined efforts.
  - Expert level knowledge of technology product evaluation and
    selection for web development.
  - Solid hands-on experience designing, building, deploying,
    and supporting end-to-end solutions for customer-facing
    applications.
  - Experience building applications using the Linux operating
    system.
  - Demonstrated experience building modern web applications
    using microservices.
  - Well-honed skills and knowledge of both agile development
    and the OKR framework.
  - Familiarity with modern web development tools and
    frameworks, including React, Material UI, SASS, Django,
    Postgres, and AWS.
  - Demonstrated ability to independently configure, run,
    troubleshoot, and develop within Docker-based
    environments, including containerized application stacks,
    supporting services, and local development workflows.
  - Experience leading software development projects across the
    full SDLC.Demonstrated experience coaching and mentoring
    mid-level and junior developers and helping them
    strengthen technical skills, engineering judgment, and
    career growth.
  - Experience leveraging AI development tools, including GitHub
    Copilot, for code generation, testing, debugging,
    refactoring, and productivity gains while exercising sound
    engineering judgment.



  What Will Make You Special (Preferred knowledge, skills, and
  abilities):

  - Advanced knowledge of React and Django.
  - Experience in an Agile / Scrum environment.
  - Cloud development experience, AWS preferred.
  - Experience building and integrating AI solutions into new
    and existing software, including MCP, agent frameworks,
    evaluation harnesses, and AI development tools.



  Characteristics of our Senior Software Engineer
  (Competencies):

  - Solid time-management skills
  - Leadership capabilities
  - Business acumen
  - Communication proficiency
  - Problem solving/analytical skills
  - Customer/client-focused
  - Detail-oriented
  - Results driven
  - Ability to thrive in an independent work environment

  Travel

  Occasional travel may be required.

  Who We Are:

  MetLife Legal Plans is the country's largest provider of
  legal voluntary benefits. We have more than 40 years of
  experience in employee legal services and are committed to
  providing excellent care to our plan members, sponsors and
  18,000+ attorneys.

  We are trusted by nearly 7 million families and more than
  200 Fortune 500 companies who offer our service as an
  employee benefit.

  It’s an exciting time to join our team. We are growing
  quickly and have a bold vision for our future as we evolve
  our company to dream bigger, move faster, and use creativity
  and technology to build products people love.

  MLP's Core 4:

  - Put customers first
  - Be the Best
  - Make things easier
  - Succeed together

  Anticipated application close date is 11/13.This job was
  posted on 10/14 and is expected to close within 30 days from
  the posting date.

  Benefits snapshot.

  • Two Healthcare Insurance options (Traditional PPO or HSA
  with employer contribution) • Dental and Vision Insurance •
  401(k) plan with company contribution and free access to
  financial advisors • Generous Paid Time Off (PTO) program
  with 23-39 days annually based on years of service, plus
  prorated PTO for new hires* • Free Aura® Identity Theft &
  Fraud Protection • Free access to the MetLife Legal Plans
  benefit • Company-paid Short- and Long-Term Disability •
  Corporate discounts • Market-competitive salaries with
  annual bonus eligibility • Nine company-paid holidays • Paid
  parental leave • Parking or RTA subsidy for Cleveland
  employees • Pet Insurance • Tuition Reimbursement Program •
  Voluntary Accident and Critical Illness Insurance •
  Volunteer Day • Robust Employee Assistance Program (EAP) •
  Financial wellness tools, education, and coaching

  *PTO is prorated during an employee's first year of
  employment based on their hire date. Employees hired in the
  first quarter of the year receive 18 days of PTO, those
  hired in the second quarter receive 16 days, employees hired
  in the third quarter receive 9 days, and those hired in the
  fourth quarter receive 7 days. PTO is awarded at the time of
  hire and then moves to the standard annual accrual schedule
  beginning January 1 of the following year

