description: |
  Join Tether and Shape the Future of Digital Finance

  At Tether, we’re not just building products, we’re
  pioneering a global financial revolution. Our cutting-edge
  solutions empower businesses—from exchanges and wallets to
  payment processors and ATMs—to seamlessly integrate reserve-
  backed tokens across blockchains. By harnessing the power of
  blockchain technology, Tether enables you to store, send,
  and receive digital tokens instantly, securely, and
  globally, all at a fraction of the cost. Transparency is the
  bedrock of everything we do, ensuring trust in every
  transaction.

  Innovate with Tether

  Tether Finance: Our innovative product suite features the
  world’s most trusted stablecoin, USDT, relied upon by
  hundreds of millions worldwide, alongside pioneering digital
  asset tokenization services.

  But that’s just the beginning:

  Tether Power: Driving sustainable growth, our energy
  solutions optimize excess power for Bitcoin mining using
  eco-friendly practices in state-of-the-art, geo-diverse
  facilities.

  Tether Data: Fueling breakthroughs in AI and peer-to-peer
  technology, we reduce infrastructure costs and enhance
  global communications with cutting-edge solutions like KEET,
  our flagship app that redefines secure and private data
  sharing.

  Tether Education: Democratizing access to top-tier digital
  learning, we empower individuals to thrive in the digital
  and gig economies, driving global growth and opportunity.

  Tether Evolution: At the intersection of technology and
  human potential, we are pushing the boundaries of what is
  possible, crafting a future where innovation and human
  capabilities merge in powerful, unprecedented ways.

  Why Join Us?

  Our team is a global talent powerhouse, working remotely
  from every corner of the world. If you’re passionate about
  making a mark in the fintech space, this is your opportunity
  to collaborate with some of the brightest minds, pushing
  boundaries and setting new standards. We’ve grown fast,
  stayed lean, and secured our place as a leader in the
  industry.

  If you have excellent English communication skills and are
  ready to contribute to the most innovative platform on the
  planet, Tether is the place for you.

  Are you ready to be part of the future?

  About the job

  Our pioneering P2P development platform, built on our open-
  source technology stack, Pear, eliminates the need for
  traditional server infrastructure. Pear platform facilitates
  direct deployment of applications from the developer’s
  machine to the user, enabling seamless scalability and
  performance. By leveraging Node.js-based technology akin to
  BitTorrent, we create robust peer-to-peer connections and
  data replication systems that set the foundation for a
  decentralized web.  Learn more about Pear: docs.pears.com
  Keet, our flagship P2P communications app, is the first step
  towards this new era. It exemplifies the potential of P2P
  technology in everyday applications, from messaging and file
  sharing to complex collaborative environments, all while
  maintaining user sovereignty over personal data. Learn more
  about Keet: keet.io

  Responsibilities

  In this role, you will be responsible for developing and
  maintaining Keet Desktop, our cross-platform P2P
  communications application built with React and running on
  the Pear runtime. You'll work on everything from UI/UX
  implementation to performance optimization, helping shape
  the future of decentralized communication.

  - Proven experience with React/Preact and modern
    JavaScript/TypeScript in production-scale applications.
  - Strong competency in state management (Redux, Redux Toolkit,
    Zustand, or similar).
  - Ability to write modular, maintainable, and well tested
    code.
  - Solid skillset in testing & debugging complex frontend
    applications.
  - Deep interest or experience with P2P technologies or
    distributed systems.
  - Comfort working in a remote, globally distributed team; good
    communication skills.

  Preferred Qualifications

  - Experience with desktop application development (Electron,
    Tauri, or similar runtimes).
  - Familiarity with video/audio APIs (WebRTC, media streams)
    and real-time communication.
  - Demonstrated ability to optimize UI performance: rendering,
    memory management.
  - Experience building cross platform applications (macOS,
    Windows, Linux, etc).
  - Bonus: Past contributions to OSS projects, especially in P2P
    or decentralized tech.

  Important information for candidates Recruitment scams have
  become increasingly common. To protect yourself, please keep
  the following in mind when applying for roles:

  - Apply only through our official channels. We do not use
    third-party platforms or agencies for recruitment unless
    clearly stated. All open roles are listed on our official
    careers page: https://tether.recruitee.com/
  - Verify the recruiter’s identity. All our recruiters have
    verified LinkedIn profiles. If you’re unsure, you can
    confirm their identity by checking their profile or
    contacting us through our website.
  - Be cautious of unusual communication methods. We do not
    conduct interviews over WhatsApp, Telegram, or SMS. All
    communication is done through official company emails and
    platforms.
  - Double-check email addresses. All communication from us will
    come from emails ending in @tether.to or @tether.io
  - We will never request payment or financial details. If
    someone asks for personal financial information or payment
    at any point during the hiring process, it is a scam.
    Please report it immediately.

  When in doubt, feel free to reach out through our official
  website.
