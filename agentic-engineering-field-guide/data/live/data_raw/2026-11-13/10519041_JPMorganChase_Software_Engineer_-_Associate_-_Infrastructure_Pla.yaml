title: Software Engineer - Associate - Infrastructure Platforms
company: JPMorganChase
location: Dublin, IRL
work_type: FULL_TIME
company_size: 289,097 Employees
description: |
  Join us as we launch a new Technology Line of Business in
  Dublin, where you’ll help shape the infrastructure platforms
  powering JPMorganChase. You’ll work alongside senior
  engineers on real production systems, using AI-native
  practices to accelerate delivery and grow your technical
  craft. This is your opportunity to write meaningful code
  from day one, develop deep skills, and be part of
  establishing a new engineering hub. We value your impact,
  encourage career growth, and offer a collaborative
  environment where your work drives innovation.

    As a Software Engineer III in the Infrastructure Platforms
  team, you will design, build, and operate enterprise-scale
  platforms as a key member of our Dublin hub. You’ll be
  hands-on, writing production code and solving complex
  problems with a focus on reliability, performance, security,
  and cost. You’ll work AI-native across the software
  development lifecycle, matched to a platform domain that
  fits your background. In this role, you will help shape our
  engineering culture and drive innovation across the firm.

  Job Responsibilities:

  - Design, build, and operate features and services within
    enterprise-scale infrastructure platforms, contributing
    across the SDLC from specification through production
  - Write and review high-quality production code, factoring
    reliability, performance, security, and cost into your
    engineering decisions
  - Diagnose and resolve production problems alongside senior
    engineers, building end-to-end understanding of the
    services you work on
  - Work AI-native across the SDLC, using AI-assisted
    development, code review, test generation, and incident
    triage while maintaining validation standards
  - Share an on-call rotation with your team, respond
    effectively to production incidents, and build operability
    and observability into what you ship
  - Analyze and improve code and systems for quality,
    scalability, efficiency, and performance
  - Decompose scoped problems into clear, executable work for
    yourself and AI agents, integrating results into
    production-ready systems
  - Define success criteria for your work and measure its impact
  - Collaborate with teammates and stakeholders, contribute to
    technical decisions, and proactively raise risks and
    questions
  - Apply security and operational-risk judgment in your
    engineering work

  Required Qualifications, Capabilities, and Skills:

  - Applied experience producing production code in an industry-
    standard language (e.g., Python, Go, Java, C++, Rust)
  - Working knowledge of *nix (Linux or UNIX-like OS) and
    networking fundamentals
  - Hands-on exposure to at least one infrastructure domain
    (cloud, networking, compute, storage, security, or data
    infrastructure), or clear appetite to specialize
  - Working experience with infrastructure-level systems and
    tooling (Kubernetes, Terraform, CI/CD, databases)
  - Developing systems thinking — awareness of interfaces,
    contracts, and common failure modes
  - Fluency using AI tools for engineering work, with judgment
    on where AI applies versus where deep human expertise is
    required
  - Security-first mindset when writing and shipping code
  - Clear, direct communication with teammates, stakeholders,
    and peers
  - Outcome orientation, focused on impact, reliability, and
    cost
  - Comfort operating with defined scope in a greenfield
    context, and willingness to work through ambiguity with
    guidance

  Preferred Qualifications, Capabilities, and Skills:

  - Exposure to multiple infrastructure domains or programming
    languages
  - Experience contributing to services at scale, including on-
    call participation and incident response
  - Examples of reducing operational toil through automation and
    better engineering
  - Demonstrated ongoing AI skill development (context/prompt
    engineering, agent orchestration) and use of AI tools to
    accelerate delivery
  - Prior experience in regulated or large-scale enterprise
    environments
  - Interest in greenfield engineering projects
  - Ability to solve well-scoped technical problems
    independently

  Why Join Us? You’ll write real code on infrastructure the
  firm depends on, alongside senior engineers who’ll help you
  grow. You’ll work AI-native from the start, on greenfield
  problems, in a brand-new Dublin hub. We progress people
  based on the quality of their decisions and the impact of
  their work — a Software Engineer III seat here is a
  launchpad, not a holding pattern. Join a team where building
  takes precedence over maintenance, deep technical craft is
  valued, and your work scales across the firm.

  About UsJ.P. Morgan is a global leader in financial
  services, providing strategic advice and products to the
  world’s most prominent corporations, governments, wealthy
  individuals and institutional investors. Our first-class
  business in a first-class way approach to serving clients
  drives everything we do. We strive to build trusted, long-
  term partnerships to help our clients achieve their business
  objectives.




    We recognize that our people are our strength and the
  diverse talents they bring to our global workforce are
  directly linked to our success. We are an equal opportunity
  employer and place a high value on diversity and inclusion
  at our company. We do not discriminate on the basis of any
  protected attribute, including race, religion, color,
  national origin, gender, sexual orientation, gender
  identity, gender expression, age, marital or veteran status,
  pregnancy or disability, or any other basis protected under
  applicable law. We also make reasonable accommodations for
  applicants’ and employees’ religious practices and beliefs,
  as well as mental health or physical disability needs. Visit
  our FAQs for more information about requesting an
  accommodation.


  About the TeamOur Corporate Technology team relies on smart,
  driven people like you to develop applications and provide
  tech support for all our corporate functions across our
  network. Your efforts will touch lives all over the
  financial spectrum and across all our divisions: Global
  Finance, Corporate Treasury, Risk Management, Human
  Resources, Compliance, Legal, and within the Corporate
  Administrative Office. You’ll be part of a team specifically
  built to meet and exceed our evolving technology needs, as
  well as our technology controls agenda.
