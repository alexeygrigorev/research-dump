description: |
  An Introduction to Primer

  Primer is the unified infrastructure for global payments. We
  give finance and payments teams the visibility and control
  to reduce complexity, improve performance, and capture more
  revenue - all from a single platform. Backed by Sofina, Peak
  XV Partners, ICONIQ, Tencent, Accel, and Balderton, we're
  building the payments layer the world's best companies rely
  on.

  Watch our showcase >

  Read up on our $100m Series C

  Learn more about our culture >

  Which team will you be joining?

  Primer’s payments platform produces a constant stream of
  transaction, merchant and product data, and the data team
  turns it into something the rest of the company can rely on.
  You’ll work day to day with product and engineering teams.
  The team treats data as a software discipline, so pipelines,
  models and tools get the same review, testing and ownership
  as product code.

  What will you be doing?

  - Own batch and streaming pipelines, including CDC feeds from
    operational databases into Snowflake, and make them
    reliable enough that other teams stop thinking about them.
  - Design the internal tools and APIs that make data usable for
    analytics, product features and machine learning.
  - Model and transform data in dbt so the warehouse is a source
    of truth people trust, not a pile of tables nobody can
    explain.
  - Decide how data should be stored and moved across
    CockroachDB, DynamoDB, Elasticsearch and Snowflake, and
    build the path between them.
  - Ship pipelines with the same standards as any production
    service: tests, CI/CD, containers, and observability
    through OpenTelemetry and Datadog.
  - Take a multi-component data project from scoping through to
    rollout, bringing other engineers into the design along
    the way.

  What we’re looking for

  Must-haves:

  - Strong software engineering fundamentals: tested, reviewed
    code with clean abstractions.
  - Proficiency in Python and SQL.
  - Hands-on experience building and running batch or streaming
    data pipelines in production.
  - Comfort across cloud-native infrastructure, ideally AWS,
    Kubernetes and Terraform.
  - Clear written and verbal communication, and a habit of
    sharing what you learn.

  Nice to have:

  - Working experience with Snowflake and dbt.
  - Experience with CDC tooling or streaming systems.

  You may not like it here

  - We’re remote-first and always will be. There’s no office to
    fall back on, so you’ll need to be self-directed and
    comfortable communicating in writing.
  - Context and priorities shift quickly. If you need a clear
    plan handed to you every week, this will be hard going.
  - There are no testers or QAs here. Writing and owning your
    own tests isn’t optional, and if you don’t enjoy it,
    you’ll feel the gap.



  ✅ A typical interview process

  - An initial intro call with a Talent Partner
  - An interview with the Hiring Manager
  - Challenge Stage - Contextualised to the role
  - A final, values-alignment interview

  What's the culture like at Primer?

  We're building a culture where people can do their best work
  and be proud of the impact they have. You'll be working with
  people who are mission-driven, smart, and reflective, and
  who are genuinely invested in building exceptional products
  and delivering success for our merchants. We work remotely,
  and have done since day one. We believe that building a
  successful, profitable company goes beyond proximity. We
  invest in our relationships through great remote working
  practices and thoughtfully designed face-to-face time,
  including workations, our annual company retreat, and access
  to co-working spaces across most major cities. The work is
  challenging. Scaleups are a challenge, and building
  category-defining products is a challenge. But there's a
  meaningful difference between a challenge and a struggle. At
  Primer, the right challenge comes with the right support:
  strong onboarding, a collaborative environment, and a team
  that is genuinely invested in your success. It's never
  something you face alone.

  Our benefits

  🌍 We are fully remote and globally distributed; and have
  been since day one 💰 Competitive share options 🌴 Flexible
  holiday, with 25 days minimum to be taken 🗣️ Co-working
  space access across major cities 📅 Workations & Company
  Retreat 💻 The best equipment for your role 🏠 £500 towards
  your home office setup 🔎 Generous learning budget 🏥 Private
  Medical Insurance 📈 A broad set of additional perks and
  benefits (depending on location)

  Don’t meet every single requirement?

  At Primer, we're dedicated to building a diverse, inclusive,
  and authentic workplace. If you're excited about this role
  but your experience doesn't align perfectly with every
  qualification listed, we encourage you to apply. You may be
  the right candidate for this or other roles. Primer is
  committed to the equal treatment of all current and
  prospective employees and adopts a zero-tolerance approach
  to discrimination, regardless of age, disability, sex,
  sexual orientation, pregnancy and maternity, race or
  ethnicity, religion or belief, gender identity, marriage and
  civil partnership, or any other background or belief.
