description: |
  Overview

  World Travel Holdings is seeking an experienced Software
  Engineering Manager to build high-performing teams, shape
  engineering practices, and lead the modernization of
  customer-facing applications that are critical to our
  business and the experiences we deliver to travelers. You
  will partner with Product Management, Architecture, Quality
  Engineering, DevOps, Delivery, and business leaders to
  connect engineering investments to measurable outcomes.
  These include stronger customer experiences, greater
  operational efficiency, increased platform adoption,
  improved reliability, and faster time to market. You will
  lead legacy application modernization, strengthen
  operational excellence, and accelerate modern and AI-enabled
  software development practices. This is a people-leadership
  role that requires strong technical judgment, not a hands-on
  coding manager position.

  About World Travel HoldingsWorld Travel Holdings,
  headquartered in Fort Lauderdale, FL, is the nation’s
  largest cruise agency and an award winning leisure travel
  company with nearly 40 travel brands. Through owned brands
  and private label partnerships, we sell cruises, villas,
  resort day passes, and luxury travel services. With a top-
  rated franchise, a UK cruise division, and a strong
  commitment to employee engagement and remote work, World
  Travel Holdings offers a people-focused culture. Learn more:
  WorldTravelHoldings.com

  Responsibilities

  - Lead, coach, and develop software engineers and emerging
    technical and people leaders through meaningful feedback,
    career planning, performance management, expanded
    ownership, and growth opportunities.
  - Build a culture of ownership, accountability, collaboration,
    curiosity, and continuous improvement.
  - Ensure teams take end-to-end responsibility for the health,
    reliability, security, maintainability, and customer
    experience of the applications they support.
  - Encourage cross-training, knowledge sharing,
    experimentation, and skill development beyond a single
    application or technology.
  - Partner with Product Management, Architecture, Quality
    Engineering, DevOps, Delivery, Operations, and business
    stakeholders to solve customer and business problems
    across organizational boundaries. Ensure engineering
    priorities support business objectives, improve customer
    outcomes, increase adoption, and maximize delivered value.
  - Lead strategic legacy application modernization while
    balancing business delivery, operational needs, and long-
    term technical health.
  - Advance modern engineering practices, including CI/CD,
    automation, observability, resilience, secure development,
    and cloud-native compatible architecture.
  - Champion the company’s AI-SDLC investments and drive
    measurable adoption of AI-assisted engineering practices.
    Use these practices to improve quality, productivity,
    developer effectiveness, knowledge sharing, and delivery
    outcomes.
  - Manage priorities, risks, dependencies, capacity, and
    commitments with transparency and consistent follow-
    through.
  - Use delivery, operational, quality, and people-development
    insights to guide decisions and continuous improvement.

  Qualifications

  - Bachelor’s degree in computer science, Engineering, a
    related field, or equivalent practical experience.
  - 8+ years of software engineering experience, including
    substantial experience leading engineering teams,
    developing technical and people leaders, and driving
    organizational or platform transformation.
  - Demonstrated success coaching engineers, developing talent,
    and building high-performing teams.
  - Proven ability to strengthen ownership, accountability,
    collaboration, learning, and delivery effectiveness.
  - Experience leading teams responsible for customer-facing web
    applications and supporting platforms through technical,
    organizational, or cultural change.
  - Experience modernizing legacy applications and adopting
    modern architecture and engineering practices.
  - Strong understanding of software architecture, APIs and
    integrations, CI/CD, DevOps, application operations, and
    Agile delivery.
  - Experience with AI-assisted software development tools or
    AI-enabled engineering workflows and an ability to guide
    responsible adoption.
  - Strong communication, coaching, stakeholder management, and
    change-leadership skills.

  Preferred Qualifications

  - Experience with AWS, Azure, Google Cloud, or cloud-native
    architecture patterns.
  - Experience with platform engineering, containerization,
    observability, resilience engineering, or site reliability
    practices.
  - Experience leading modernization in an environment that
    includes legacy applications and physical data center
    infrastructure.
  - Experience establishing adoption, enablement, governance, or
    measurement practices for AI-assisted engineering.
  - Travel, cruise, hospitality, e-commerce, or other customer-
    facing digital platform experience.
  - Experience leading distributed or remote engineering teams.

  Compensation & BenefitsEstimated Pay Range: $175,000 –
  $185,000 annuallyBenefits Overview:

  - Comprehensive medical, dental, and vision coverage
  - Company-paid life and disability insurance
  - 401(k) with discretionary company match
  - Paid time off and holidays
  - Travel discounts and employee perks
  - Employee Assistance Program (EAP)
  - Professional development and learning opportunities

  EEO Statement World Travel Holdings is an Equal Opportunity
  Employer. All qualified applicants will receive
  consideration without regard to any status protected by
  applicable law.
