description: |
  At NVIDIA, we’re solving the world’s most challenging
  problems with our unique approach to accelerated computing.
  We’re looking for passionate technologists with a background
  in crafting and/or deploying software tools for CAE to
  engage CAE developers, ISVs, and GSIs. In this enablement
  role, you will drive NVIDIA platform adoption by nurturing
  strategic partnerships, leading fruitful technical
  collaborations, providing first-line technical expertise and
  developer support, and guiding NVIDIA's product strategy as
  a representative of ISV and open-source developers in the
  CAE community.

  The Industrial Engineering organization is a strong,
  growing, and visible group both inside and outside of NVIDIA
  in this exciting area to drive strategy. We are looking for
  a self-starting leader to continue to grow this area. Do you
  thrive on technical engagement? Do you have the rare blend
  of both technical and relationship skills? Are you
  passionate about groundbreaking technology? If so, we would
  love to learn more about you!

  What you'll be doing:

  - Create fruitful technical engagements with ISVs across the
    engineering design and manufacturing ecosystem and lead
    strategic relationships with key opinion leaders, top
    developers, and influential researchers.
  - Inform NVIDIA's product strategy for CAE workflow
    acceleration by working with diverse teams including
    Product, Engineering, Marketing, Applied Research, etc.
  - Use your technical expertise to discover high impact
    problems NVIDIA can uniquely solve that create new market
    paradigms.
  - Drive early adoption of new products and support launch and
    go-to-market activities.
  - Activate relationships with higher education and research
    and speak at relevant scientific, technical and industry
    conferences.

  What We Need To See:

  - 8+ years of experience developing (or working with
    developers of) software tools for CAE practitioners,
    preferably with a CAE ISV such as Altair, Ansys, Cadence,
    Dassault, Hexagon, Siemens, Synopsys, etc.
  - A track record of defining and delivering impactful
    technical engagements, managing technical and business
    alliances across multiple partner groups, and working with
    peer teams to achieve objectives.
  - World-class communication skills with a demonstrated ability
    to articulate a value proposition to technical and non-
    technical audiences.
  - MS/PhD in Computer Science or Engineering or equivalent
    experience.

  Ways To Stand Out From The Crowd:

  - Developer experience creating simulation tools, virtual
    twins, and/or solutions for CAE, high-performance
    computing, applied machine learning, or deep learning.
  - Experience working closely with product management and
    business development to define product and go-to-market
    strategy.
  - Experience with AI physics models and model architecture
    including developing, defining, training, and deploying
    open or proprietary models.
  - Experience with NVIDIA products and SDKs: CUDA, CUDA-X
    Libraries, PhysicsNeMo, Omniverse, etc.

  With competitive salaries and a generous benefits package,
  we are widely considered to be one of the technology world’s
  most desirable employers. We have some of the most forward-
  thinking and hardworking people in the world working for us
  and, due to unprecedented growth, our exclusive engineering
  teams are rapidly growing. If you're a creative and
  autonomous person with a real passion for technology, we
  want to hear from you.

  Your base salary will be determined based on your location,
  experience, and other objective job-related factors. The
  expected base salary ranges for this position are: France:
  101,250 EUR – 175,500 EUR for Level 4; and 133,500 EUR –
  231,400 EUR for Level 5. Germany: 112,200 EUR – 194,480 EUR
  for Level 4; and 141,900 EUR – 245,960 EUR for Level 5.
