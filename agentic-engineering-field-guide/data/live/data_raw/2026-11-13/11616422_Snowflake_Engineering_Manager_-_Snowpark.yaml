description: |
  At Snowflake, we are powering the era of the agentic
  enterprise. To usher in this new era, we seek AI-native
  thinkers across every function who are energized by the
  opportunity to reinvent how they work. You don’t just use
  tools; you possess an innate curiosity, treating AI as a
  high-trust collaborator that is core to how you solve
  problems and accelerate your impact. We look for low-ego
  individuals who thrive in dynamic and fast-moving
  environments and move with an experimental mindset — who
  rapidly test emerging capabilities to discover simpler, more
  powerful ways to deliver results. At Snowflake, your role
  isn't just to execute a function, but to help redefine the
  future of how work gets done.

  Snowflake is on a mission to mobilize the world's data by
  changing the old-world paradigm of “bring data to compute”
  to “bring compute to the data”. Our innovative built-for-
  the-cloud architecture revolutionized the data warehousing
  industry with the flexibility of big data platforms and the
  elasticity of the cloud at a fraction of the cost of
  traditional solutions. Our products enable thousands of
  enterprises to unlock the value of their data with near-
  unlimited scale, concurrency, and performance.

  We are looking for a talented, passionate Software
  Engineering Manager for our Snowpark product to build our
  elastic, high-scale, high-performance, cloud-native compute
  platform that makes bringing compute to data effortless and
  simple. Our mission is to make Snowflake the preferred
  platform to run all AI, ML, Data Science, and Data
  Engineering workloads. We are building the next generation
  of compute platforms to open up Snowflake’s doors to
  limitless opportunities of discovering structure and
  unstructured data at scale. You will be part of a highly
  productive, fast-moving, and growing team that is critical
  to realizing Snowflake’s Data Cloud Mission. This team
  innovates on behalf of our customers to build a fully
  managed compute platform that enables our customers to
  leverage their data to solve business problems without
  needing to manage required compute infrastructure.

  AS A SOFTWARE ENGINEERING MANAGER FOR SNOWPARK, YOU WILL:

  - Provide technical and strategic direction leadership to
    define and build a full ecosystem of technologies,
    technical roadmap, and vision.
  - Plan, lead, and execute complex technical projects through
    your team that interact with a wide variety of teams
    within the company.
  - Anticipate future trends and evolving customer needs
    accurately and drive strategies appropriately.
  - Influence leadership on technical direction and product/team
    investment/pivot needs.
  - Create tools/processes/solutions that improve team
    productivity and efficiency.
  - Identify and lead improvements to product stability and
    reliability, on-call and service health, customer support,
    diagnosability, and manageability of the product.
  - Identify and fill skill and expertise gaps in the team.
  - Mentor and guide engineers, growing strong technical
    expertise within the team.

  OUR IDEAL SOFTWARE ENGINEERING MANAGER WILL HAVE:

  - 8+ years of industry experience designing and building
    large-scale distributed systems platforms that accelerate
    product innovation.
  - 2+ years of full-time Software Engineering Management
    experience.
  - Strong passion for making developers highly productive and
    enabling them to be successful and grow in their career.
  - Experience with cloud-native architectures and serverless
    compute platforms (e.g., AWS Lambda, Azure Functions,
    Cloud Run functions, etc).

  Every Snowflake employee is expected to follow the company’s
  confidentiality and security standards for handling
  sensitive data. Snowflake employees must abide by the
  company’s data security plan as an essential part of their
  duties. It is every employee's duty to keep customer
  information secure and confidential.

  Snowflake is growing fast, and we’re scaling our team to
  help enable and accelerate our growth. We are looking for
  people who share our values, challenge ordinary thinking,
  and push the pace of innovation while building a future for
  themselves and Snowflake.

  How do you want to make your impact?

  For jobs located in the United States, please visit the job
  posting on the Snowflake Careers Site for salary and
  benefits information: careers.snowflake.com
