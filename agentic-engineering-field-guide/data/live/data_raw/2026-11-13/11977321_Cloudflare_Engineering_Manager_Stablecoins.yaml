description: |
  About Us  At Cloudflare, we are on a mission to help build a
  better Internet. Today the company runs one of the world's
  largest networks that powers millions of websites and other
  Internet properties for customers ranging from individual
  bloggers to SMBs to Fortune 500 companies. Cloudflare
  protects and accelerates any Internet application online
  without adding hardware, installing software, or changing a
  line of code. Internet properties powered by Cloudflare all
  have web traffic routed through its intelligent global
  network, which gets smarter with every request. As a result,
  they see significant improvement in performance and a
  decrease in spam and other attacks. Cloudflare was named to
  Entrepreneur Magazine's Top Company Cultures list and ranked
  among the World's Most Innovative Companies by Fast Company.
  At Cloudflare, we're not looking for people who wait for a
  polished roadmap; we're looking for the builders who see the
  cracks in the Internet that everyone else has simply learned
  to live with. We value candidates who have the instinct to
  spot a "normalized" problem and the AI-native curiosity to
  create a solution using the latest tools. Our culture is
  built on iteration, leveraging AI to ship faster today to
  make it better tomorrow, while ensuring that every
  improvement, no matter how small, is shared across the team
  to lift everyone up. If you're the type of person who values
  curiosity over bureaucracy, and that AI is a partner in
  solving tough problems to keep the Internet moving forward,
  you'll fit right in. Available Locations: London or Austin
  or SF or NYC About the Department Emerging Technologies &
  Incubation (ETI) is where new and bold products are built
  and released within Cloudflare. Rather than being
  constrained by the structures which make Cloudflare a hugely
  successful business, we are able to leverage them to deliver
  entirely new tools and products to our customers.
  Cloudflare's edge and network make it possible to solve
  problems at massive scale and efficiency which would be
  impossible for almost any other organization. About the Team
  We build the infrastructure that makes the web Payable,
  powering high-volume, low-value machine-to-machine
  transactions using blockchain technologies and decentralized
  protocols. Here at Cloudflare, stablecoin payments are a
  core initiative developing blockchain-based settlement
  systems, programmable agent wallets, and cryptographic
  primitives to make the web payable at machine scale. As AI
  agents increasingly navigate, consume, and act on the web,
  standard payment and authorization models built for humans
  are breaking down. We build tools that leverage Web3 wallets
  and decentralized rails to give domain owners and agents
  secure, scalable settlement options. Building these
  capabilities requires solving problems across high-
  throughput web infrastructure, low-latency transaction
  processing, digital wallets, and emerging agentic payment
  protocols. We bridge mainstream commerce rails with
  decentralized smart contract environments, enabling
  micropayments at Internet scale to keep the web payable. We
  are a tight-knit group that communicates and collaborates
  regularly. We celebrate our achievements, support each other
  when we make mistakes, and hold each other and our work to a
  high standard. About the role We are looking for an
  Engineering Manager to build and lead the engineering team
  across our stablecoin initiatives. You will be responsible
  for the people, execution, and engineering quality behind
  products that power decentralized agent transactions, such
  as Cloudflare's stablecoin wallets and emerging micropayment
  rails that make web resources payable. You will partner
  closely with Product Management, cryptography experts, and
  engineering teams across Cloudflare to deliver current
  priorities and shape future opportunities. This is a
  management role for someone who is deeply technically
  credible in distributed systems, smart contracts, and
  cryptographic protocols. You will not be expected to write
  most of the code, but you should be able to understand the
  systems your engineers operate, challenge architectural
  decisions around blockchains (including transactions, RPCs,
  and execution + consensus clients) and step in when
  necessary. At the same time, we are looking for a manager,
  not a tech lead with direct reports. Your success will be
  measured by the quality and output of the team you build,
  the engineers you develop, and the systems and products they
  deliver. This role may require flexibility to be on-call
  outside of standard working hours to address technical
  issues as needed. What you'll do

  - Manage, coach, and grow engineers working across blockchain
    architecture, stablecoin wallets, and cryptographic
    payment channels to ensure the web remains payable for
    autonomous agents.
  - Own execution by establishing clear priorities, creating
    predictable delivery, and giving engineers the context and
    autonomy to own meaningful areas of the product.
  - Lead the development of a high-throughput blockchain
    leveraging cryptocurrency protocols and standards to
    enable ultra-low-latency micropayments.
  - Lead the engineering behind usage metering, pricing
    definition engines, outcome verification, and revenue
    attribution models tailored for agentic workflows.
  - Build capabilities that give businesses granular visibility
    and control over their agent-generated revenue streams.
  - Partner closely with Product Management to understand
    customer problems, shape the roadmap, and turn broad
    opportunities into clear engineering outcomes.
  - Interface directly with blockchain, wallet, and cryptography
    teams while scaling decentralized transaction pipelines on
    Cloudflare Workers and Durable Objects.
  - Balance near-term product delivery with thoughtful technical
    investments that allow promising ideas to grow.
  - Own the operational health of the systems in your area,
    including observability, incident response, cryptographic
    security, and long-term reliability.
  - Develop technical leaders and create space for engineers to
    lead architecture and implementation.

   Responsibilities  We want you to love it here. This role is
  a great fit for you if:

  - You have led and developed a high-performing engineering
    team(s) and can point to what that team shipped and how
    the people on it grew.
  - You are technically credible with experienced blockchain and
    systems engineers. You can review a design, understand the
    trade-offs in smart contract security or decentralized
    architecture, and evaluate cryptographic protocols.
  - You are comfortable managing a team working across
    specialized crypto topics (like decentralized settlement,
    programmable wallets, and key management systems).
  - You care deeply about reliability and quality, particularly
    when the output of a system handles monetary transactions
    or machine authorization.
  - You have strong product judgment and enjoy working with
    Product Management to decide what is worth building, what
    needs improvement and what should not be built at all.
  - You are comfortable with ambiguity and with finding
    structure in areas where the opportunity is clearer than
    the roadmap.
  - You communicate clearly, give direct feedback, and can
    explain complex technical decisions to both engineers and
    non-engineers.

   Examples of Desirable Skills, Knowledge, and Experience

  - Strong technical grounding in blockchain architecture, smart
    contract environments, and cryptographic key management.
    Past experience building L1 or L2 blockchains is a plus.
  - Experience building or operating cryptocurrency
    infrastructure, digital wallet providers, or decentralized
    settlement protocols. Past experience working on consumer
    or enterprise cryptocurrency wallets is a plus.
  - Experience operating systems where correctness, reliability,
    and security matter as much as feature delivery.
  - A track record of hiring, developing, and retaining strong
    engineers.
  - Experience partnering closely with Product Management to
    shape and execute a roadmap.
  - Experience taking products or major capabilities from an
    ambiguous opportunity to a clear customer outcome.
  - Strong written and verbal communication.

   Bonus Points

  - Hands-on experience with decentralized payment protocols or
    blockchain frameworks (e.g., Bitcoin Lightning, Ethereum
    rollups).
  - Experience building hybrid fiat/crypto payment
    infrastructure, such as onramp/offramp providers or apps
    where cryptocurrencies are invisible to users.
  - Familiarity with Cloudflare's developer platform (Workers,
    Durable Objects, KV) or edge computing architectures.
  - Experience turning complex underlying systems into useful
    payment or commerce products for a broad audience.
  - Experience with usage-based billing, metering engines,
    attribution systems, or complex commercial pricing models.
  - Previous experience working in payments or on payments
    technology (fiat or crypto)


  Compensation Compensation may be adjusted depending on work
  location.

  - For Bay Area based hires: Estimated annual salary of
    $200,000 - $288,000
  - For NYC based hires: Estimated annual salary of $190,000 -
    $275,000


  Equity This role is eligible to participate in Cloudflare's
  equity plan. Benefits Cloudflare offers a complete package
  of benefits and programs to support you and your family. Our
  benefits programs can help you pay health care expenses,
  support caregiving, build capital for the future and make
  life a little easier and fun! The below is a description of
