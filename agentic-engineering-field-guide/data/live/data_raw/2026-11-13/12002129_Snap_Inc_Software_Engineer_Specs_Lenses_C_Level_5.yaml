description: |
  Snap Inc is a technology company. We believe the camera
  presents the greatest opportunity to improve the way people
  live and communicate. Snap contributes to human progress by
  empowering people to express themselves, live in the moment,
  learn about the world, and have fun together.

  The Company operates Snapchat, a visual messaging app that
  enhances your relationships with friends, family, and the
  world, and Specs Inc., a wholly-owned subsidiary dedicated
  to making computing more human, in addition to Bitmoji,
  Saturn, and other digital services.

  Specs Inc. is a wholly-owned subsidiary of Snap Inc.
  dedicated to making computing more human. The company
  develops Specs, advanced eyewear that seamlessly integrates
  digital experiences into the physical world.

  Specs feature see-through lenses that place digital objects
  directly into three-dimensional space, powered by Snap OS, a
  proprietary, context-aware operating system designed for
  natural interaction with your hands and voice.

  Specs Inc. also provides Lens Studio, a full suite of
  advanced developer tools that powers immersive augmented
  reality experiences across Specs, Snapchat, and other
  services.

  We’re looking for a Software Engineer to join Lens Studio at
  Snap Inc!

  What you’ll do:

  - Design, develop, and support features for Lens Engine and
    Lens Studio, enabling AR experiences across Snapchat and
    Specs
  - Build, integrate, and improve agentic development workflows
    and tooling
  - Contribute to technical roadmap planning, architecture
    decisions, and technical specifications
  - Participate in code reviews, design reviews, and technical
    discussions
  - Collaborate with cross-functional partners across product,
    design, and engineering
  - Contribute to improving code quality, reliability,
    performance, and developer productivity

  Knowledge, Skills, Abilities:

  - Strong computer science fundamentals and problem-solving
    skills
  - Strong proficiency in C++ and experience with modern C++
    development
  - Experience with scripting languages such as Python,
    JavaScript, or TypeScript
  - Great communication skills; ability to work in a team and
    lead by example
  - Pragmatic engineering judgment, with the ability to balance
    iteration speed, reliability, maintainability, and
    security
  - Hands-on experience with AI-assisted development tools such
    as Cursor, Claude Code, Codex, or similar
  - Understanding of AI systems and agentic workflows
  - Focus on engineering quality, including testing,
    maintainability, and performance

  Minimum Qualifications:

  - BS in a technical field such as computer science or
    equivalent years of experience
  - 6+ years of post-Bachelor’s software development experience;
    or Master’s degree in a technical field + 3+ year of post-
    grad software development experience; or PhD in a relevant
    technical field

  Preferred Qualifications:

  - Experience designing or integrating agentic systems,
    including tool use, context management, evaluation,
    reliability, or integration into developer workflows
  - Experience with multi-agent systems, agent harness
    engineering, context engineering, or building tools and
    ecosystems for AI agents
  - Experience integrating AI or agentic capabilities into
    production developer workflows or software systems
  - Experience with a 3D engine such as Unity, Unreal Engine, or
    a comparable real-time rendering platform
  - Experience with build systems and developer infrastructure
    such as CMake, Conan, Jenkins, GitHub Actions, or similar
  - Experience with Qt, ImGui, or similar frameworks for
    building cross-platform desktop software
  - Experience with JavaScript engines, embedded runtimes, or
    frameworks used to execute and integrate user-provided
    code
  - Experience working on large or complex codebases

  If you have a disability or special need that requires
  accommodation, please provide us some information.

