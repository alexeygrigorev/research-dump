description: |
  Field Materials develops AI-native construction procurement
  software. Our AI agents automate workflows in procurement,
  AP, and inventory management. As a result, our customers
  spend less time on data entry and manual workflows in legacy
  ERPs. Our edge is in best-in-class AI and powerful
  integrations with existing construction ERPs.

  We're post-PMF and scaling: already processing $3B+ in
  material purchase volume across 16 construction trades.

  Tech Stack:

  - Go, GraphQL & Postgres (gqlgen, pgx, squirrel, dataloaders).
    Sophisticated data models aligned with ERPs. Complex
    authorization and approvals. In-house observability for
    GraphQL. AWS stack: ALB, ECS, RDS, S3.
  - Bidirectional integrations with unified data model across
    13+ construction systems & on-prem connector. REST APIs,
    ODBC, COM, and others.
  - Generative AI + optimization algorithms drive document
    extraction. Models are heavily tuned for the domain.
    Algorithms, LLMs, and RAGs drive automations. Strong
    metric-oriented culture with evaluation sets across the
    board.
  - We spin out separate services where it makes sense. The
    construction data model is complex with a lot of business
    data constraints so we use ACID transactions whenever
    possible.

  We’re looking for engineers who want extreme ownership.
  You’re not just a programmer; you own data models, API
  design, and distributed systems processing semantics.

  About You:

  - You are excited about startups and new products.
  - You enjoy solving complex problems and iterating fast.
  - You realize that products are built iteratively and specs
    evolve with customer feedback
  - You care about system and code design: well architected code
    is easier to understand, refactor, evolve, and inherit.
  - You enjoy building highly complex business applications that
    scale well with new requirements and new modules.
  - You care about products that have massive economic impact
    and have interest in FinTech.

  What We Look For:

  - BS (or higher) in Computer Science, related technical field
    or equivalent practical experience.
  - 2-5+ years of production level experience in Backend
    Engineering, preferably in Go.
  - Strong foundation in algorithms and data structures and
    their real-world use cases.
  - Experience working with SQL databases and complex data
    models.
  - Experience with distributed systems.
  - Experience with GraphQL, LLMs, and observability is a plus.

  Benefits:

  - Flexible time off
  - Equity awards
  - Gym reimbursement
  - Personal development fund for books, courses, certifications
    and conferences
  - Swanky new MacBook Pro
  - Work headphones reimbursement
  - Annual offsites at fun locations across Europe
