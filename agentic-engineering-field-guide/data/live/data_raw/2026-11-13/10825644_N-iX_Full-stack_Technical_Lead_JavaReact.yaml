description: |
  N-iX is a global software development service company that
  helps businesses across the globe create next-generation
  software products. Founded in 2002, we unite 2,400+ tech-
  savvy professionals across 40+ countries, working on
  impactful projects for industry leaders and Fortune 500
  companies. Our expertise spans cloud, data, AI/ML, embedded
  software, IoT, and more, driving digital transformation
  across finance, manufacturing, telecom, healthcare, and
  other industries. Join N-iX and become part of a team where
  your ideas make a real impact.

  Nowadays, finding a long-term job with an interesting
  project can feel like a real challenge.

  But hey — if you're an experienced Technical Lead / Full
  Stack Engineer (Java + React), look no further!

  Yes, it's real. You're not dreaming. Miracles do exist!

  When it comes to our customer – a strategic partner of ours
  in the integrated Shipping Services. They have set
  themselves apart as an independent carrier with a fresh,
  unique approach. Their strategy as a global niche carrier
  offers distinctive advantages to customers worldwide. We
  have created a smart, efficient network that ensures stable,
  reliable services; and we have made it our mission to focus
  on the needs of our customers, which stand at the heart of
  all our decisions. The main idea of our product operates in
  select trades, where it has a competitive advantage and
  where it can provide superior service. We maintain a
  flexible partnership approach with other major carriers, and
  our new line structure is a much-needed alternative to
  customers concerned about the current alliance-dominated
  market.

  Responsibilities:

  - Guide, mentor, and foster the growth of full-stack engineers
    within the team, championing engineering excellence and XP
    practices.
  - Lead the architectural design and technical direction of
    innovative full-stack applications, ensuring scalability,
    security, and alignment with business goals.
  - Establish and champion high standards of code quality,
    testing (TDD/BDD), CI/CD pipelines, and robust DevOps
    practices.
  - Act as a key technical point of contact, collaborating
    closely with product owners and stakeholders to translate
    complex requirements into actionable technical strategies.
  - Direct full-stack development of innovative applications,
    remaining actively involved in writing code and remote
    pairing.
  - Own the entire development cycle, including design,
    architecture, development, testing, and DevOps deployment.
  - Foster a highly collaborative Extreme Programming (XP)
    environment featuring remote pairing and rapid feedback
    loops.

  Requirements:

  - BS degree in Computer Science or an equivalent combination
    of education and experience.
  - Experience in technical leadership is a must.
  - 6+ years of full-stack development experience.
  - 6+ years of experience in the following technologies: Java,
    Spring.
  - Proven experience with Functional Programming and Java
    Streams.
  - 2+ years of experience in front-end development with React.
  - Experience with developing a reactive UI (Reactive JS).
  - 2+ years of experience in TDD/BDD development in the
    following frameworks: JUnit, Jasmine, Mockito,
    Protractor/Selenium.
  - 2+ years of experience in microservices-based architecture
    and tools (Spring Boot/Cloud).
  - AI experience
  - Experience in DevOps development and Jenkins (must).
  - Experience in development in Kotlin – an advantage.
  - Experience in designing, developing, and deploying
    cloud/hybrid-based solutions.
  - Experience in developing and deploying in Container-based
    environments (Kubernetes, Cloud Foundry).
  - Deep familiarity with the following design concepts:
    microservices, service discovery, circuit breakers.
  - Strong leadership abilities with the capacity to
    appropriately prioritize, plan, and delegate complex work
    in a rapidly changing environment.
  - Versatility and capability to switch easily between
    different tasks and technologies.
  - Experience in assessing a broad range of information
    solutions and products.
  - Strong critical thinker with an exceptional problem-solving
    aptitude.
  - Excellent English skills - both verbal and written.

  We offer*:

  - Flexible working format - remote, office-based or flexible
  - A competitive salary and good compensation package
  - Personalized career growth
  - Professional development tools (mentorship program, tech
    talks and trainings, centers of excellence, and more)
  - Active tech communities with regular knowledge sharing
  - Education reimbursement
  - Memorable anniversary presents
  - Corporate events and team buildings
  - Other location-specific benefits

  *not applicable for freelancers
