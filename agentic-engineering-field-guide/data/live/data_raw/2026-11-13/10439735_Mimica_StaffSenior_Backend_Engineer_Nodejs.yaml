description: |
  What we are building

  Mimica is an AI-powered process intelligence platform
  enabling enterprises and individuals to reclaim their most
  precious resource: time. We've all seen repetitive tasks and
  redundant processes quietly drain productivity and
  creativity. Not because companies don’t want to become more
  efficient, but because they don’t know where to start.

  Mimica automatically analyzes your team’s work, then
  generates the AI agents to execute it. Our software turns
  everyday work into data-backed decisions, helping companies
  remove process bottlenecks, automate the right tasks, and
  upskill teams with precision and confidence.

  We’ve raised $26 million in Series B financing and are
  scaling fast. Backed by investors including Khosla Ventures
  and Paladin Capital, our proprietary AI technology is
  trusted by Fortune 500 companies to accelerate
  transformation. Mimica is recognized as a Top 100 AI Start-
  up by Accel and an industry Leader by the Everest Group. Our
  team

  Behind our platform is a team of exceptionally talented
  people, remote-first and globally distributed across 16+
  countries. We're looking for curious, collaborative people
  excited to solve complex problems. You'll join a fast-paced
  environment built on high ownership, bottom-up thinking, and
  transparent, open communication – helping some of the
  world's leading organizations transform the way work gets
  done with AI.

  Our approach to engineering

  - We prioritize customer needs first
  - We work in small, project-based teams
  - We have flexibility in terms of the problems we work on
  - We own the full lifecycle of our projects
  - We avoid silos and encourage taking up tasks in new areas
  - We balance quality and velocity
  - We have a shared responsibility for our production code
  - We each set our own routine to maximize our productivity

  Your mission

  In this role, your mission will be to enhance and scale the
  backend systems powering the Mimica platform (MERN stack).
  This means designing and implementing a scalable
  architecture, developing and optimizing backend services and
  APIs, improving the performance and reliability of existing
  components, and taking operational responsibility for what
  you build.  As a member of our early engineering team,
  you‘ll have the opportunity to shape our technical
  direction, processes and culture.

  Part of your day-to-day

  - Contributing to architectural decisions and collaborating
    across teams to identify and implement product
    improvements.
  - Developing and optimizing a real-time backend service that
    enables multiple users to edit graph data and re-train AI
    models through their input.
  - Creating libraries and building APIs in our Node.js backend
    to interact with the various ML components of the system.
  - Diagnozing fault-tolerance and availability issues, as well
    as performance bottlenecks, and resolving them.
  - Refactoring our components and services and producing
    documentation for your implementations.
  - Providing feedback to peers through pair programming and
    code reviews and helping those around you to level up.
  - Participating in hiring and onboarding new team members;
    taking on end-to-end project management responsibilities
    as we grow.

  What you will bring

  - Background in backend engineering, focusing on developing
    high-performance production software and scalable
    architectures.
  - Minimum 8 years of experience as a Software Engineer.
  - Proficiency in TypeScript, and experience using modern
    frameworks and technologies (e.g., Docker, K8s) to build
    high-throughput, low-latency systems.
  - Practical experience in designing APIs and managing
    databases (e.g., PostgreSQL, MongoDB), with a keen eye for
    query optimization and efficient data storage & handling.
  - Firm grasp of distributed systems concepts and techniques –
    microservices, load balancing, caching,
    horizontal/vertical scaling and stateless architectures.
  - Commitment to upholding high engineering standards,
    prioritizing code quality, maintainability, reliability,
    and security.
  - Strong analytical and troubleshooting skills – methodically
    decomposing systems to identify bottlenecks, determine
    root causes, and implement effective solutions.
  - Drive to continually develop your skills, improve team
    processes and reduce debt.
  - Fluency in English, with effective communication skills –
    articulating complex ideas, concepts, and trade-offs
    clearly.

  Bonus

  - Experience and fluency with Python.
  - Experience working within an international high-impact
    Startup/Scale-up environment – delivering value quickly
    and iteratively.
  - Active interest in AI, automation, or related fields.

  We’d love to hear from you, even if you feel you don’t quite
  have all of the above.

  Location

  This is a fully remote position. You can be based anywhere
  in the UK, Americas, or Europe within a UTC-6 to UTC+1
  timezone.

  What we offer

  💰 Generous compensation + stock options - aligned with our
  internal framework, market data, and individual skills.

  🏢 Distributed work: Work from anywhere - fully remote, in
  our hubs, or a mix.

  💻 Company-issued laptop, remote setup stipend, and co-
  working budget

  📍 Flexible schedules and location

  ☀️ Ample paid time off, in addition to local public holidays

  🍼 Enhanced parental leave

  🧘‍♀️ Health & retirement benefits

  📖 Annual learning & development budget

  🌴 Annual workaways and regular virtual & in-person socials

  🌍 Opportunity to contribute to groundbreaking projects that
  shape the future of work

  Note: Some benefits may vary depending on location and role

  ⚠️ Mimica will only contact candidates from an @mimica.ai
  email address. We do not request banking or sensitive
  personal information during the recruiting process.
