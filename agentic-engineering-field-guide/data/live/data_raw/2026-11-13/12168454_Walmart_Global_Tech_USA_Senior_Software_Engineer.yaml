description: |
  Position Summary...

  What you'll do...Role summary:

  As a Senior Software Engineer, you will lead the design,
  development, and delivery of scalable software solutions
  that align with business objectives. This role requires
  expertise in software architecture, coding standards, and
  agile methodologies to create maintainable, high-quality
  components. You will collaborate with cross-functional teams
  to analyze requirements, address technical challenges, and
  implement continuous integration and deployment practices.
  Your contributions will ensure robust, secure, and efficient
  applications that meet customer needs while driving
  innovation and operational excellence within Walmart’s
  technology environment.  About the team:

  The GTP Data Frameworks team develops and maintains Walmart
  Data Clients, a unified data access layer supporting
  multiple data stores such as RDBMS, NoSQL, cache, search,
  and messaging systems. The team delivers scalable,
  standardized SDKs that simplify data interactions and
  promote best practices like optimistic locking and
  separation of business logic. Advancing the platform toward
  service-oriented models, they integrate features including
  platform security, traffic migration, caching, and
  telemetry. This team enables the creation of robust, high-
  performance applications aligned with Walmart’s evolving
  technology landscape, ensuring operational excellence and
  future-ready solutions.  What you'll do:


  - Analyze and classify requirements to align with business and
    technical objectives, ensuring comprehensive solution
    scoping.
  - Design scalable software components by evaluating trade-offs
    and converting high-level designs into detailed functional
    logic.
  - Develop maintainable, testable code adhering to coding
    standards, incorporating security and performance
    considerations.
  - Conduct thorough code reviews and debugging to ensure
    quality and compliance with nonfunctional requirements.
  - Create and execute test cases to identify defects and
    support continuous integration and delivery processes.
  - Monitor application performance, troubleshoot issues, and
    implement corrective maintenance activities.
  - Collaborate with stakeholders to align solutions with
    business needs and drive continuous improvement
    initiatives.


  What you'll bring:


  - Extensive experience in software engineering with strong
    technical acumen in coding, debugging, and continuous
    development.
  - Proficiency in object-oriented programming and knowledge of
    multiple coding languages and frameworks.
  - Expertise in requirement analysis, solution design, and
    translating high-level designs into detailed functional
    logic.
  - Ability to conduct thorough code reviews and deliver
    scalable, maintainable, and secure software components.
  - Familiarity with agile methodologies, iterative development,
    and continuous integration/continuous delivery (CI/CD)
    processes.
  - Strong problem-solving skills with experience in defect
    management, root cause analysis, and performance
    troubleshooting.
  - Capability to collaborate effectively with stakeholders and
    contribute to product strategy and delivery focus.


   At Walmart, we offer competitive pay as well as
  performance-based bonus awards and other great benefits for
  a happier mind, body, and wallet. Health benefits include
  medical, vision and dental coverage. Financial benefits
  include 401(k), stock purchase and company-paid life
  insurance. Paid time off benefits include PTO (including
  sick leave), parental leave, family care leave, bereavement,
  jury duty, and voting. Other benefits include short-term and
  long-term disability, company discounts, Military Leave Pay,
  adoption and surrogacy expense reimbursement, and more.

  You will also receive PTO and/or PPTO that can be used for
  vacation, sick leave, holidays, or other purposes. The
  amount you receive depends on your job classification and
  length of employment. It will meet or exceed the
  requirements of paid sick leave laws, where applicable.

  For information about PTO, see
  https://one.walmart.com/notices.

  Live Better U is a Walmart-paid education benefit program
  for full-time and part-time associates in Walmart and Sam's
  Club facilities. Programs range from high school completion
  to bachelor's degrees, including English Language Learning
  and short-form certificates. Tuition, books, and fees are
  completely paid for by Walmart.

  Eligibility requirements apply to some benefits and may
  depend on your job classification and length of employment.
  Benefits are subject to change and may be subject to a
  specific plan or program terms.

  For information about benefits and eligibility, see
  One.Walmart.

