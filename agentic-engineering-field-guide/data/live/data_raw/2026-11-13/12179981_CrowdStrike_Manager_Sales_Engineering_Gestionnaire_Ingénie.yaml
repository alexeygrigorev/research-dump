description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  Are you ready for your next real security challenge? Are you
  passionate about helping organizations stop breaches using a
  platform that just works? If so, CrowdStrike is seeking a
  Sales Engineer Manager with significant security expertise.

  Must Live in Montreal To Be Considered.

  What You'll Do: You should be able to articulate how current
  security solutions are designed and deployed, and why they
  are failing. You will lead a team of Enterprise Sales
  Engineers who are responsible for changing what the security
  market and customers believe is possible with a next-
  generation endpoint technology.

  What You'll Need:

  - Experienced in endpoint or network security space – AV, EDR,
    incident response, forensics, SIEM, firewall, HIPS/IDS,
    etc.
  - Strong understanding of Windows, macOS, and Linux operating
    systems
  - Can easily articulate complex security problems to a diverse
    set of audiences
  - Strong self-starter with the ability to work independently
  - Can work collaboratively with Sales, Marketing, Support, and
    Engineering; the Sales Engineer should be the technical
    bridge between CrowdStrike and prospects/customers
  - Excellent communication and presentation skills with the
    ability to present to a variety of external audiences,
    including C-level executives
  - Extensive contacts in the information security field and
    strong references
  - Bachelor’s degree or higher in a relevant field
  - Sales engineering background or 5+ years of relevant work
    experience
  - Ability to travel as required
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Experience with malware, threat intelligence, and/or sandbox
    analysis
  - Experience with programming or scripting languages such as
    PowerShell, Python, and Bash
  - Experience with virtualization/VDI technologies
  - Experience with large scale cloud platforms such as AWS,
    Azure, GCP, etc.
  - Understanding of the OSI model
  - Certifications such as CEH, CISSP, OSCP, and SANS

  À propos du poste :

  Êtes-vous prêt pour votre prochain grand défi en
  cybersécurité? Êtes-vous passionné par l’idée d’aider les
  organisations à enrayer les brèches de sécurité grâce à une
  plateforme dont l’efficacité n’est plus à prouver? Si c’est
  le cas, CrowdStrike est à la recherche d’un Gestionnaire,
  Ingénierie des Ventes possédant une expertise approfondie en
  sécurité.

  Le candidat doit résider à Montréal pour que sa candidature
  soit prise en compte.

  Ce que vous ferez:

  Vous serez en mesure de vulgariser l’architecture et le
  déploiement des solutions de sécurité actuelles, tout en
  expliquant les raisons de leurs lacunes. Vous dirigerez une
  équipe d’ingénieurs commerciaux (Sales Engineers) dédiés au
  marché des grandes entreprises. Votre rôle sera de
  transformer la perception du marché et des clients quant aux
  possibilités offertes par les technologies de protection des
  terminaux (endpoints) de nouvelle génération.

  Ce dont vous aurez besoin:

  - Expérience dans le domaine de la sécurité des réseaux ou des
    points d'accès – antivirus, EDR, intervention en cas
    d'incident, informatique judiciaire (forensics), SIEM,
    pare-feu, HIPS/IDS, etc.
  - Solide compréhension des systèmes d'exploitation Windows,
    macOS et Linux.
  - Capacité à vulgariser des enjeux de sécurité complexes
    auprès de divers publics.
  - Grand sens de l'initiative et capacité à travailler de
    manière autonome.
  - Aptitude à collaborer avec les équipes de vente, de
    marketing, de soutien et d'ingénierie; l’ingénieur
    commercial agit comme le pont technique entre CrowdStrike
    et les clients potentiels.
  - Excellentes compétences en communication et en présentation,
    avec une aisance à s'adresser à des interlocuteurs
    externes variés, y compris des cadres de la haute
    direction (C-level).
  - Vaste réseau de contacts dans le domaine de la sécurité de
    l'information et solides références.
  - Baccalauréat ou diplôme supérieur dans un domaine pertinent.
  - Expérience en ingénierie commerciale ou plus de 5 ans
    d'expérience professionnelle pertinente.
  - Disponibilité pour voyager selon les besoins.

  Atouts supplémentaires:

  - Expérience avec les logiciels malveillants, la
    cyberintelligence (threat intelligence) ou l'analyse en
    bac à sable (sandbox).
  - Expérience avec des langages de programmation ou de script
    (PowerShell, Python, Bash, etc.).
  - Expérience avec les technologies de virtualisation et
    d'infrastructure de bureau virtuel (VDI).
  - Expérience avec les plateformes infonuagiques à grande
    échelle (AWS, Azure, GCP, etc.).
  - Compréhension du modèle OSI.
  - Certifications professionnelles (CEH, CISSP, OSCP, SANS,
    etc.).

