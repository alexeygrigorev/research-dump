description: |
  Company Description

  The contingent workforce (gig workers) industry is enormous,
  at nearly $800B USD annually, and growing at an accelerated
  rate. Gig workers demand the power to decide when they are
  paid, and to assure their financial wellbeing. Join Paidiem
  as we pursue our vision to become the financial operating
  system for the workforce of the future.  Paidiem is an
  emerging FinTech, providing efficient contingent workforce
  management solutions, and providing gig workers with access
  to Income on Demand and financial and assurance products to
  meet their unique needs.

  Job Description

  We're looking for a talented Full Stack Senior Software
  Developer to join our team. As a Developer, you will work on
  specific platform projects critical to Paidiem’s needs, with
  opportunities to switch projects as you and our fast-paced
  business grow and evolve with our customer’s needs. This
  role will be involved in the product development, solution
  architecture and design process that involves the Paidiem
  system in its entirety.

  You’ll bring your expertise with Angular, TypeScript,
  NodeJS, Express, PostgreSQL and responsive web skills.
  Ideally, you have experience building PWAs and like the
  excitement of working in a fast-paced startup.  We need our
  developers to be versatile, display leadership qualities and
  be enthusiastic to take on new problems across the full-
  stack as we push forward. We are seeking an ambitious and
  innovative mind that will strive to elevate our
  organizational goals.

  We look to our developers to collaborate and support the
  team, build and deliver software products, and share, build,
  and leverage their expertise to help us deliver products
  that delight our customers and our users.

  Outline of Primary Functions:

  Collaborate and Support the Team:

  - Provide insight, estimates, and analysis to other members of
    the team to support the scoping, requirements, and
    development of product features.
  - Collaborate with other developers to establish and maintain
    coding standards and guidelines.
  - Support the existing infrastructure as well as designing and
    developing new technologies to meet our ongoing delivery.

  Build and Deliver Product:

  - Build solutions to match the visual design and interactions
    and features specified with minimal rework as necessary.
  - Develop our platform using coding best practices to maintain
    or increase the quality of the application and its
    underlying dependencies.
  - Conduct thorough testing to identify and resolve issues to
    avoid rework and performance issues.
  - Create and deploy efficient code using company approved
    practices and processes.
  - Maintain application security at all layers including
    frontend, backend, networking and infrastructure.

  Share, build, and leverage your expertise:

  - Be curious by seeking out new ways to deliver on our
    roadmap, through research of tools, technologies, and
    solutions that can create a more resilient, secure,
    scalable, and efficient platform.
  - Attend and participate in industry functions and trade
    shows, webinars; network with industry and referring
    groups.
  - Perform code reviews and provide knowledge transfers
    sessions.

  Successful Outcomes:

  Success in this role will be measured by the following
  (qualitative and quantitative) factors:

  - Quality of work products including efficiency and bug-free
    code
  - Sprint deliverables completed and commitments are met
  - Quality estimation of work is in sync with effort and
    complexity
  - Effective collaboration as a team including but not limited
    to peer code reviews, sprint planning, pair programming
  - Ability to expand knowledge base and apply new learnings in
    your work

  Qualifications



  Education in computer sciences, mathematics, engineering or
  related field

  You have been working in the area of software design and
  development, with a focus on SAAS web apps for at least 8+
  years

  Minimum 5 years expert level Full Stack Web Developer with
  Angular, TypeScript, NodeJS and Express experience.

  Experiences with a tech startup, SaaS, or Financial services
  industry

  Critical thinking, problem-solving, ability to write
  efficient and maintainable code.

  Experience building in a continuous delivery pipeline using
  GitLab, AWS and microservice architecture.

  Highly collaborative team player, and working within SCRUM
  and Agile methodologies

  Provide technical support to resolve incidents and outages.

  Additional Information

  We thank all applicants for your interest in Paidiem. Only
  those applicants selected for an interview will be
  contacted. Agency referrals or calls will not be accepted.

  Equal Opportunity & Diversity at Paidiem:

  We are building products for a diverse world and we need a
  diverse team to do that successfully. We strongly encourage
  applications from everyone regardless of race, religion,
  colour, national origin, gender, sexual orientation, age,
  marital status, or disability status.

  Paidiem provides an accessible candidate experience. If you
  need any accommodations or adjustments throughout the
  interview process, please let us know.
