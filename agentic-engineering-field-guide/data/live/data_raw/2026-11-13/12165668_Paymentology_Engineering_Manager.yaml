description: |
  Unstoppable starts with people. The future of payments is
  being built today, and at Paymentology, we are looking for
  people who want to help shape it. We power card issuing for
  leading banks, fintechs and digital brands across the globe,
  and as we continue to grow, we are looking for curious,
  ambitious people who thrive on solving complex challenges,
  embrace innovation and want to make a tangible impact at
  global scale.

  As an Engineering Manager at Paymentology, you will lead
  one, mission-critical engineering team, balancing people
  leadership, delivering excellence and technical guidance.

  Your primary responsibility is to create an environment
  where engineers can do their best work, growing as
  individuals, delivering high-quality systems and
  contributing to a strong, supportive engineering culture.

  You will partner closely with Product and other cross-
  functional stakeholders to shape and deliver meaningful
  outcomes, while ensuring your teams operate effectively,
  sustainably and with high standards.

  This role sits at the intersection of people, delivery and
  technology with a strong emphasis on leading through
  culture, clarity, and accountability.

  What You’ll do:

  Lead and Grow People

  - Build, support and develop a high-performing team of
    engineers (typically 8-12 individuals)

  - Coach, mentor and provide continuous feedback to support
    career growth and progression

  - Create clear development plans and help individuals grow

  - Foster a psychologically safe, inclusive and high-trust team
    environment

  - Actively manage performance, recognising strong
    contributions and addressing challenges early

  - Support hiring, lead onboarding and team growth in line with
    Paymentology’s needs

  Deliver Outcomes Reliably

  - Own delivery of team commitments, ensuring predictable,
    high-quality execution

  - Partner with Product to shape roadmaps, scope work and align
    priorities

  - Maintain clear and accurate delivery plans, proactively
    managing risks and dependencies

  - Remove blockers and ensure smooth collaboration between
    teams

  - Drive operational excellence, including incident response
    and continuous improvement

  - Ensure visibility of progress, metrics and outcomes across
    stakeholders

  Provide Technical Leadership

  - Bring experience leading mission-critical, high-volume
    transaction systems, including balancing technical debt
    and reliability risks, and planning safe maintenance and
    release cycles.

  - Bring a strong technical foundation, enabling sound
    decision-making and guidance

  - Contribute to architectural discussions and decisions, to
    ensure systems are scalable, reliable and maintainable

  - Drive engineering best practices (testing, observability,
    CI/CD, AI usage, code quality, security)

  - Support engineers in solving complex technical challenges
    without becoming a bottleneck

  - Maintain awareness of system health, operational patterns
    and technical risks.

  How you’ll work:

  This role aligns internally with the Engineering Manager
  (M3) level, where impact is measured through team outcomes,
  people growth, delivery effectiveness, and the reliability
  and availability of the systems the team owns.

  You will:

  - Be future-focused and pragmatic: keep systems stable while
    making steady, incremental improvements, anticipating
    risks, shaping roadmaps, and evolving team processes.

  - Drive excellence every day: maintaining high standards in
    delivery, quality and operations

  - Show accountability: owning outcomes and leading decisively
    during challenges

  - Inspire Growth: developing your team, and yourself, and
    strengthening team capability

  - Communicate to Collaborate: ensuring alignment across teams
    and stakeholders

  - Lead with Humanity: building trust, inclusion and a strong
    team culture

  Who you are:

  - At least three years’ experience managing engineering teams,
    with examples of navigating difficult stakeholder
    situations and maintaining alignment across functions.

  - An experienced engineering leader with a passion for people
    development and team success

  - Proven track record of leading high-performing engineering
    teams and delivering outcomes

  - Strong technical background (typically equivalent to a
    senior engineering or above)

  - Comfortable operating in distributed, cross-functional
    environments

  - Experienced in agile delivery, planning and continuous
    improvement practices

  - A clear, thoughtful communicator who can engage both
    technical and non-technical stakeholders

  - Someone who leads with empathy, ownership and a strong sense
    of accountability

  What Success Looks Like:

  - Your team consistently delivers high-quality outcomes
    aligned to business goals

  - The services your team owns maintain a 99.99% availability
    with a low defect density, all whilst maintaining high
    standards of external comms to users and clients.

  - Engineers in your team are growing, engaged and performing
    at their best

  - Delivery is predictable, transparent and continuously
    improving

  - Technical quality and operational standards are high and
    sustained

  - Team culture is collaborative, supportive and accountable

  Why Join Paymentology:

  - Working on a global, high-scale payments platform that has
    real world impact – it’s not abstract, it’s salaries,
    rent, medicine. It has to work!

  - Be part of a remote-first, globally distributed engineering
    organisation (for this role you will need to be +/- 2
    hours CET)

  - Lead teams solving complex, meaningful problems in fintech

  - Shape engineering culture, process and ways of working at
    scale

  - Grow your career with a clear and structured career
    framework

  At Paymentology, we believe that making a difference starts
  with the people behind the work. You will be part of a
  diverse, global team of Paymentologists who are united by a
  shared mission to advance the world through payments. This
  is an opportunity to contribute to meaningful work,
  collaborate across markets and functions, and help shape the
  future of a business with global reach and real impact.

  We are an equal opportunity employer committed to fostering
  a diverse and inclusive workplace where everyone can thrive.
  We welcome applications from people of all backgrounds and
  do not discriminate on any unlawful ground, including race,
  colour, ethnicity, sex, gender, pregnancy, marital status,
  family responsibility, age, disability, sexual orientation,
  religion, belief, language or HIV status.

  Paymentology will never request any form of payment from
  applicants at any stage of our recruitment process,
  including for applications, interviews, training or job
  placements. If anyone asks you for money while claiming to
  act on behalf of Paymentology, please treat this as
  fraudulent and do not make any payment. All legitimate
  Paymentology vacancies are advertised via our official
  careers page , and our recruitment emails are sent only from
  official Paymentology domains.
