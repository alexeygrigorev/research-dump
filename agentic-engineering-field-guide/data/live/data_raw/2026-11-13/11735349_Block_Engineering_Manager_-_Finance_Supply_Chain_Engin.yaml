description: |
  Block is one company built from many blocks, all united by
  the same purpose of economic empowerment. The blocks that
  form our foundational teams - People, Finance, Counsel,
  Hardware, Information Security, Platform Infrastructure
  Engineering, and more - provide support and guidance at the
  corporate level. They work across business groups and around
  the globe, spanning time zones and disciplines to develop
  inclusive People policies, forecast finances, give legal
  counsel, safeguard systems, nurture new initiatives, and
  more. Every challenge creates possibilities, and we need
  different perspectives to see them all. Bring yours to
  Block. The Role Block's Business Platform Engineering
  organization powers the foundational systems that support
  financial operations across Square, Cash App, TIDAL, and
  Proto. We are building the next generation of financial and
  supply chain infrastructure that enables accurate reporting,
  operational efficiency, regulatory compliance, and strategic
  decision-making across Block. As an Engineering Manager in
  Finance & Supply Chain Engineering, you will lead a team of
  engineers building mission-critical systems across areas
  such as Record-to-Report automation, financial planning and
  forecasting, tax and regulatory reporting, and supply chain
  planning and execution. This is a unique opportunity to help
  shape a mostly greenfield team and platform from the ground
  up. You will help build agentic systems that run the
  business - systems that automate workflows, reason across
  financial and operational data, assist decision-making, and
  make critical business processes more efficient, reliable,
  and scalable. You will have influence across the full
  spectrum: team culture, engineering practices, technical
  strategy, product direction, architecture, and
  implementation. You will be responsible for building and
  supporting a high-performing engineering team, shaping
  technical strategy, partnering closely with Finance,
  Accounting, Tax, Compliance, Product, and Operations
  stakeholders, and ensuring the team delivers reliable,
  scalable, and well-governed systems. You Will

  - Lead and grow an engineering team: Manage, coach, and
    develop engineers across a range of experience levels;
    create clarity, accountability, and growth opportunities
    for the team.
  - Shape a greenfield platform: Help define the foundations for
    a new generation of financial and supply chain systems,
    including the team's operating model, technical patterns,
    delivery practices, and long-term architecture.
  - Build agentic systems that run the business: Lead the
    development of intelligent, automated systems that
    streamline financial operations, coordinate business
    workflows, improve decision-making, and reduce manual
    operational burden.
  - Set technical direction: Partner with engineering leads and
    cross-functional stakeholders to define architecture,
    roadmap, and execution plans for financial and supply
    chain systems.
  - Drive execution: Translate ambiguous business needs into
    clear technical priorities, delivery plans, and measurable
    outcomes.
  - Partner cross-functionally: Work closely with Finance,
    Accounting, Tax, Compliance, Product, and Operations teams
    to understand business processes and build systems that
    support critical workflows.
  - Ensure reliability and operational excellence: Hold the team
    accountable for building well-tested, observable, secure,
    and resilient systems that support high-stakes financial
    operations.
  - Navigate complexity: Help the team make pragmatic decisions
    across legacy systems, integrations, data pipelines,
    regulatory requirements, agentic workflows, and evolving
    business needs.
  - Build engineering culture: Foster a collaborative,
    inclusive, and high-ownership team environment with strong
    engineering practices, healthy code review, documentation,
    and incident learning.
  - Develop people and leaders: Provide coaching, feedback,
    performance management, and career development for
    engineers; identify and grow future technical leaders


  You Have

  - 8+ years of software engineering experience, including 4+
    years of experience leading or managing engineers.
  - Experience serving in a technical leadership role with
    responsibility for delivery, execution, and team health.
  - Strong technical judgment and the ability to guide
    architecture and design decisions across distributed
    systems, data-intensive applications, automation
    platforms, or business-critical systems.
  - Interest in building intelligent or agentic systems that
    automate complex workflows, improve decision-making, and
    help teams operate more effectively.
  - Experience partnering with non-technical stakeholders and
    translating complex business requirements into clear
    engineering priorities.
  - A track record of delivering reliable, well-tested, and
    maintainable systems in production.
  - Strong communication skills, with the ability to create
    alignment across engineering, product, finance,
    compliance, and operations teams.
  - Comfort operating in ambiguous domains where business
    process, regulatory requirements, and technical systems
    intersect.
  - A strong desire to build healthy teams, grow engineers,
    influence culture, and shape strategy from early-stage
    ideas through implementation


  Technologies We Use and Teach You do not need to have
  experience with every technology listed below, but
  familiarity with modern application, data, automation, and
  infrastructure patterns will help you be successful.

  - Languages: Go, Ruby, JavaScript / TypeScript
  - Frameworks: Ruby on Rails, React
  - Databases: MySQL, Snowflake
  - Infrastructure: AWS, S3, Aurora, Docker
  - Orchestration: Temporal, Prefect
  - Testing: Unit tests, integration tests, RSpec, Vitest
  - Monitoring: Datadog, Sentry
  - Protocols: HTTP, JSON, gRPC
  - Emerging systems: Agentic workflows, AI-assisted automation,
    business process orchestration


