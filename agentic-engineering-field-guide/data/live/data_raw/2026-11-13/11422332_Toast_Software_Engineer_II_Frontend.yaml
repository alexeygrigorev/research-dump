description: |
  Ability to work EST hours required!

  Toast creates technology to help restaurants and local
  businesses succeed in a digital world, helping business
  owners operate, increase sales, engage customers, and keep
  employees happy.

  At Toast, we are committed to empowering our customers by
  providing the technology, resources, and community they need
  to thrive. While our roots are in food service, we are
  rapidly expanding into adjacent markets and international
  territories. Our mission is to build a world-class Device
  Management platform that supports the diverse needs of all
  Toast customers, regardless of their industry or location.

  As a frontend engineer on the Android Systems team, you will
  build the web experiences that sit on top of the
  foundational platform for Toast POS devices. Whether it’s an
  international team looking to deploy a new on-device
  application, a customer needing a critical firmware update,
  an Enterprise group needing multi-location device tooling -
  our web tools empower customers and Toast teams to set up,
  secure, and manage their devices from wherever they are.

  Why this team?

  - Expanding the Vision: We are expanding our Mobile Device
    Management ecosystem—unifying firmware, on-device apps,
    and security controls into one cohesive platform.
  - Frictionless Device Management: We are transforming the
    customer’s device lifecycle experience from out-of-the-box
    setup to continuous remote management, leveraging AI to
    dramatically reduce operator’s time spent troubleshooting
    and configuring devices.

  About this roll* (Responsibilities):

  - Hands-on design and implementation of web applications in
    React and TypeScript that power Toast's device management
    suite, including device configuration, policy management,
    and firmware and app update tooling.
  - Collaborate with Product Management, Hardware, QA, and other
    Software teams to build scalable systems, making solid
    technical decisions with quality, security, and
    maintainability in mind.
  - Partner with UX to turn designs into accessible, responsive,
    and performant interfaces using Toast's design system.
  - Write automated unit, integration, and end-to-end tests to
    keep our web apps reliable as they grow.
  - Deploy features out to customers using feature flags,
    monitor for success, and help investigate and fix
    production issues.
  - Leverage cutting edge AI tools to enhance your development
    workflow, improve velocity, and help pioneer new
    approaches to building, contributing to a culture of
    innovation and productivity across the team.

  Do you have the right ingredients*? (Requirements):

  - 3+ years of professional frontend web development
    experience.
  - Clear written and verbal communication.
  - Proficient in React, TypeScript, HTML, and CSS, with
    experience building responsive single-page applications.
  - Understanding of component architecture and state
    management.
  - Experience integrating with REST or GraphQL APIs.
  - Experience writing tests with frameworks such as Jest, React
    Testing Library, or Playwright.
  - Proficiency with source control and code review tools such
    as Git or GitHub.
  - Passion for clean, maintainable code and thoughtful user
    experiences.
  - Strong customer empathy and a drive to build tools that make
    restaurant operators' lives easier.

  Bonus ingredients*:

  - Experience working with design systems or shared component
    libraries.
  - Experience working in large, multi-team frontend codebases
    or micro-frontend architectures.
  - Experience with GraphQL clients and data-fetching libraries
    such as Apollo or React Query.
  - Some backend experience in Java or Kotlin, or an interest in
    learning.
  - Interest in hardware, Android, or mobile device management
    (MDM) concepts.
  - Familiarity with AI-augmented development workflows and
    tools (e.g., Claude Code, Codex, or similar).

  What we use to make our dish* (Our Tech Stack):

  - React and TypeScript micro-frontends built on Toast's in-
    house design system.
  - GraphQL and REST APIs, using modern data-fetching and state
    management libraries.
  - Automated testing with Jest, React Testing Library,
    Storybook, and Playwright.
  - Kotlin backend services built on AWS that manage device
    policies, firmware updates, and device configuration.
  - Android system apps in Kotlin running on Toast's POS
    devices.
  - Feature flags and production monitoring to ship safely to
    customers.

  AI at Toast

  At Toast, one of our company values is that we're hungry to
  build and learn. We believe learning new AI tools empowers
  us to build for our customers faster, more independently,
  and with higher quality. We provide these tools across all
  disciplines, from Engineering and Product to Sales and
  Support, and are inspired by how our Toasters are already
  driving real value with them. The people who thrive here are
  those who embrace changes that let us build more for our
  customers; it’s a core part of our culture.

  Our Total Rewards Philosophy  We strive to provide
  competitive compensation and benefits programs that help to
  attract, retain, and motivate the best and brightest people
  in our industry. Our total rewards package goes beyond great
  earnings potential and provides the means to a healthy
  lifestyle with the flexibility to meet Toasters’ changing
  needs. Learn more about our benefits at
  https://careers.toasttab.com/toast-benefits.

  *Bread puns encouraged but not required

  The base salary range for this role is listed below. The
  starting salary will be determined based on skills,
  experience, and geographic location. In addition to base
  salary, our total rewards components include cash
  compensation (overtime, bonus/commissions if eligible),
  equity, and benefits. You can learn more about how we align
  pay with local labor markets in our Geographic Pay Zone
  Philosophy.

  Zone A

