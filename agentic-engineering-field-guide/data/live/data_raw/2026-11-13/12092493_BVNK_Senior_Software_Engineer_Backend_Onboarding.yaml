description: |
  About us:

  BVNK is the stablecoin-powered financial stack for
  enterprises. We're now part of Mastercard, and together
  we're building a network for every form of money – one that
  delivers more reach, more capability and more choice.

  We enable businesses to build financial products, unlock new
  markets, and move money in seconds across 130+ countries,
  with 40+ licenses for fiat and digital assets globally.
  Processing billions annually, we empower enterprises
  worldwide to send, receive, convert, and settle stablecoins
  and fiat seamlessly through a single integration.

  Our mission is to accelerate global money movement, and
  we're assembling a world-class team to make it happen.

  Trusted by industry leaders like Corpay, Worldpay, Deel, and
  Flywire, we deliver the infrastructure that makes new forms
  of money usable within the financial systems customers
  already rely on today.

  By combining Mastercard's global payment reach and trusted
  networks with BVNK's stablecoin infrastructure, we're
  building the trusted operating layer for the evolution of
  money movement, helping customers participate in emerging
  digital networks without having to rebuild their businesses
  around every new innovation.

  We're a diverse team spread across EMEA, North America, and
  APAC, with a shared belief that stablecoins are the new
  infrastructure layer for financial services, and that BVNK
  is at the forefront of this shift.

  We're incredibly honored to have been recognized by:

  - CNBC World's Top Fintech Companies (2026)
  - FXC Intelligence Top 100 Cross-border Payment Companies
    (2026)
  - Newsweek's The Top 100 Global Most Loved Workplaces (three
    years running, most recently 2025)
  - LinkedIn as one of the Top 20 Startups in the UK (2025)

  Location: We offer a Hybrid/Remote working policy.

  About the role: The Onboarding & Identity team owns the
  whole journey that turns a prospective customer into a
  verified, compliant BVNK account. This covers direct
  businesses, partners' end customers (embedded) and
  underlying customers of licensed partners (nested). We build
  the orchestration layer and APIs behind KYC/KYB, identity
  checks, sanctions and PEP screening, automated customer risk
  assessment, and signing agreements. These connect to
  providers like SumSub, Orbis and Temporal. Our platform lets
  embedded partners onboard hundreds of thousands of end
  customers through simple APIs and webhooks. Our goal is very
  high rates of automated approval, without compromising on
  regulatory standards in the EU, UK and US.

  Key Areas of Responsibilities:

  - Collaborate closely with our product team to ensure
    efficient iteration and delivery of high-quality results
    in the Embedded Payments and Onboarding squad.
  - Have a pragmatic approach that prioritizes simplicity while
    maintaining effectiveness in all engineering projects.
  - Ensure that our products are engineered in a future-proof
    manner, emphasizing the sustainability of product design.
  - Facilitate the integration of Salesforce into our
    engineering practices, working closely with Salesforce
    experts and engineers to ensure seamless integration of
    this critical tool.
  - Collaborate with ID&V and RegTech vendors to seamlessly
    infuse cutting-edge regulatory technology solutions into
    our engineering ecosystem, ensuring our preparedness to
    adapt to shifting regulatory requirements.
  - Contribute to ensuring that our engineering practices remain
    compliant and up-to-date, playing a crucial role in
    strengthening our Embedded Payments and Onboarding
    capabilities.

  What we need from you:

  - Strong experience as a backend software engineer, with deep
    proficiency in languages such as Java, Kotlin or similar
    JVM-based languages.
  - Experience designing, building, and operating microservices
    in a distributed systems environment.
  - Solid understanding of relational databases (e.g.,
    PostgreSQL) and event-driven architectures (e.g., Kafka,
    SQS/SNS).
  - Experience with cloud platforms such as AWS, GCP, or Azure.
  - Experience with containerisation and orchestration
    technologies including Docker and Kubernetes.
  - Familiarity with infrastructure-as-code concepts and modern
    software delivery practices (CI/CD).
  - Experience with observability and reliability tooling
    including logging, metrics, tracing, and performance
    optimisation.
  - Comfortable working with Jira, Confluence, Git-based
    workflows, and collaborative engineering practices.
  - Strong communication skills with the ability to explain
    technical concepts clearly to both technical and non-
    technical stakeholders.
  - A thoughtful, practical approach to problem-solving that
    considers tradeoffs and avoids over-engineering.

  Nice to have:

  - Experience working in fintech, payments, or banking
    infrastructure, particularly around fiat payment
    processing, clearing, or settlement.
  - Exposure to payment schemes, banking APIs, or multi-rail
    payment routing and orchestration.
  - Experience with stablecoin or cryptocurrency infrastructure
    and fiat-to-crypto bridging.
  - Understanding of domain-driven design and hexagonal
    architecture patterns.
  - Familiarity with reconciliation systems, idempotency
    patterns, and handling eventual consistency in financial
    workflows.
  - Experience working in high-growth or fast-scaling technology
    environments.
  - Experience contributing to engineering strategy, hiring, or
    organisational scaling initiatives

  What you can expect from us:

  - Fair and competitive salary at every stage of your growth
  - Flexible working hours, with hybrid working at its heart
  - A culture built on passionate, growth-minded people
  - A flexible approach to holiday
  - Opportunities to travel to our offices around the world
  - An open and creative environment where you can help us
    define the future of BVNK, its culture, and its
    opportunity sets

  *At BVNK, we are focused on building a diverse and inclusive
  team. While you may not meet all of our requirements, we’d
  encourage you to apply if you meet the majority of our
  expectations. This is as you may be a great fit for this
  role or another role in our team.*



