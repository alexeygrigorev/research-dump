description: |
  Omada Health is on a mission to bend the curve of chronic
  disease.

  Job overview:

  Co-Intelligent Coaching is how Omada builds the future of
  coaching support. AI owns the member moments that run around
  the clock: goal setting, food guidance, reflection, and
  unblocking the daily challenges that happen between
  sessions. That frees our human coaches to do what only they
  can. They build real relationships and deliver care when it
  matters.

  We are hiring a Senior Engineering Manager to own a
  significant piece of Omada's Co-Intelligent Coaching. You
  own what gets built, in what order, and how the people
  building it grow.

  A squad owns problems from prototype to production,
  including the maintenance and the on-call rotation for what
  it ships. At this level you own more than one, which means
  the hardest calls you make are the ones about where capacity
  goes when two good things want it at the same time.

  You stay technical. You are in the codebase and in the same
  agent workflows your builders use, close enough to review
  architecture, catch a weak design, and be useful in an
  incident. Where you manage directly, you ship production
  work off the critical path. Where you manage through someone
  else, that person's growth is your work product.

  You partner with Product Strategists who spend their time in
  front of members, coaches, and stakeholders, and who
  prototype to test ideas quickly. They own what gets built
  and why. You own whether it can be delivered, at what cost,
  and by when, and you are senior enough that your answer
  shapes the roadmap rather than just responding to it.

  About you:

  You have built AI products, not just used AI to build them.
  You have shipped agents to production and lived with how
  they behave at scale. You measure quality with evals: when
  you change a prompt or swap a model, you can prove whether
  it got better.

  You are comfortable being accountable for what your squads
  ship. You still write code, and you want to. This role ships
  production work off the critical path, in the same codebase
  and the same agent workflows as your squads, so you feel the
  friction your people feel first-hand.

  You have a point of view on where AI-assisted development
  helps and where it creates rework, and it comes from
  changing how a real team works, not from reading about it.
  You have done the engineering manager job well enough that
  you can teach it. Whether or not you have carried the title
  of manager-of-managers, you have grown someone into leading,
  and you know the difference between doing the work for them
  and raising their ceiling.

  Your first team is your peer group, not your reports. When
  something is slowing down the engineering org and it is
  nobody's job, you have a track record of picking it up,
  getting the right people in the room, and finishing it.

  What you'll be doing:

  - Own the member experience that runs around the clock. AI
    handles the moments between sessions: goal setting, food
    guidance, daily reflection. You own where it hands off to
    a human coach, and your squads own all of it from
    prototype to production.
  - Own delivery across your squads. Sprint shaping,
    prioritization, backlog grooming, and estimation. Make the
    calls, write them down, and be accountable for them. When
    two squads want the same thing at the same time, you are
    the one who decides.
  - Own cycle time. Yours to improve, not at the expense of
    quality, and yours to explain when it changes, including
    why one of your squads is slower than the other.
  - Stay technical. On squads you manage directly, you ship
    production work every sprint, off the critical path, in
    the same agent workflows your builders use. On squads that
    run through a manager, you stay close enough to review
    architecture, catch a weak design, and be useful in an
    incident. Either way, you can teach someone to navigate
    the system, not just navigate it yourself.
  - Partner with your Product Strategist.  They own what the
    squad builds; you hold the line between their scope and
    yours so the squad never has two people answering the same
    question differently.
  - Grow a manager. If an EM reports to you, their growth is
    your work product. Their squad's health is the evidence.
  - Plan the team you need next year, not just this quarter.
    Headcount, skill mix, and the onboarding path that gets a
    new builder productive in an agent-heavy codebase in weeks
    rather than months.
  - Set the AI standard past your own boundary. Write down what
    good looks like, teach it, and measure whether it stuck.
    Other squads should be able to use what you built without
    you in the room.
  - Take on the problem that is nobody's. You will find things
    that slow down engineering broadly. Some of them you
    should pick up, organize, and close out with your peers.

  What you need for this role:

  - 8+ years in software engineering, including 4+ years
    managing engineers directly.
  - Experience developing another leader: a manager who reported
    to you, or an engineer you grew into a tech lead or EM
    role with real accountability attached. Tell us where they
    are now.
  - A track record shipping mission-critical software to
    production, and living with it afterwards. We all make
    mistakes; what sets you apart is that you own yours and
    turn them into something better.
  - Experience owning prioritization and estimation for a team,
    including saying no, not now, and explaining why.
  - Experience giving direct developmental feedback, and at
    least one case where you managed someone through
    underperformance with real support attached.
  - Currently shipping, or recently shipping, production code in
    at least one layer of our stack (backend (Ruby, Python,
    ...), web frontends (React), iOS, or Android,) with enough
    range to follow the conversation in the others and review
    architecture decisions critically.
  - Comfort with an expert-generalist team model, where a
    backend-heavy builder ships in the mobile app and a
    mobile-heavy one ships in the backend.  You understand how
    transformative this model is, and you should be able to
    name the risks and opportunities it brings.
  - Hands-on experience directing AI agents through real world
    production changes, and a considered view on where they
    help and where they produce work someone else has to redo.
  - Understanding of CI/CD, logging, monitoring, and telemetry,
    at the level where you can tell whether your squad's
    operational story checks out or falls short.
  - Excellent written communication.  Much of this job is
    writing things down clearly once so they do not have to be
    argued four times.

  Technologies we use:

  Ruby on Rails, Python (Flask, FastAPI), React, native iOS
  (Swift, SwiftUI), native Android (Kotlin), PostgreSQL,
  GraphQL, AWS (RDS, SQS), Docker, Kubernetes, GitLab,
  Datadog, PagerDuty.

  Benefits:

  - Competitive salary with generous annual cash bonus
  - Equity grants
  - Employee stock purchasing plan (ESPP)
  - Remote first work from home culture
  - Flexible Time Off to help you rest, recharge, and connect
    with loved ones
  - Generous parental leave
  - Health, dental, and vision insurance (and above market
    employer contributions)
  - 401k retirement savings plan
  - Lifestyle Spending Account (LSA)
  - Mental Health Support Solutions
  - ...and more!

  It takes a village to change health care. As we build
  together toward our mission, we strive to embody the
  following values in our day-to-day work. We hope these hold
  meaning for you as well as you consider Omada!

  - Cultivate Trust. We listen closely and we operate with
    kindness. We provide respectful and candid feedback to
    each other.
  - Seek Context. We ask to understand and we build connections.
    We do our research up front to move faster down the road.
  - Act Boldly. We innovate daily to solve problems, improve
    processes, and find new opportunities for our members and
    customers.
  - Deliver Results. We reward impact above output. We set a
    high bar, we’re not afraid to fail, and we take pride in
    our work.
  - Succeed Together. We prioritize Omada’s progress above team
    or individual. We have fun as we get stuff done, and we
    celebrate together.
  - Remember Why We’re Here. We push through the challenges of
    changing health care because we know the destination is
    worth it.

  About Omada Health: Omada Health (Nasdaq: OMDA) is reverse
  engineering the way healthcare is delivered in America,
  putting the space between doctor visits–where health is won
  or lost–at the center of care. Today's healthcare system
  poorly serves chronic conditions that require ongoing
  support outside of the exam room, like obesity, diabetes,
  hypertension, cholesterol, and musculoskeletal conditions.
  Omada’s virtual-first model combines human-led care teams,
  connected devices, and AI-enabled technology to deliver
  personalized care at scale, including support for GLP-1
  therapy. Omada has served more than two million members
  since launch across 2,000+ employers, health plans, pharmacy
  benefit managers, and health systems. Learn more at
  omadahealth.com.

