description: |
  Location: Remote

  Company Description: Magnify Cash is pioneering the
  decentralized finance (DeFi) sector, enabling users to lend
  ERC-20 tokens and borrow against NFTs with unmatched
  flexibility and transparency. Our mission is to build a
  global onchain economy that fosters innovation, creativity,
  and economic freedom. We champion a truly decentralized
  platform that is open source, freely accessible, and
  globally available—making us leaders in transforming
  financial interactions across the globe.

  Position Overview: We are looking for a dynamic and
  experienced Engineering Manager to lead our world-class
  engineering team. This role requires managing and expanding
  our engineering operations, fostering a culture of
  innovation and collaboration, and driving the execution of
  our ambitious product roadmap. You will play a pivotal role
  in our continued growth and in shaping the future of our
  cutting-edge DeFi solutions.

  Responsibilities:

  - Leadership and Team Building: Lead and support a team of
    high-performing engineers by providing mentorship,
    fostering an environment of rigor and innovation, and
    enhancing team growth and cohesion.
  - Strategic Planning and Execution: Develop and maintain
    comprehensive product roadmaps. Collaborate with cross-
    functional teams—including Product, Design, Security, and
    Developer Relations—to refine and achieve strategic
    objectives. Drive project management and coordination to
    ensure timely and high-quality execution.
  - Technical Oversight: Maintain the technical quality and
    architectural integrity of all products. Provide guidance
    and support across frontend (React), backend (Solidity),
    and dApp frameworks. Oversee code reviews and uphold high
    DevOps practices.
  - Project and Product Management: Manage project tracking and
    development workflows using tools like ClickUp and GitHub.
    Ensure tasks are appropriately assigned, prioritized, and
    tracked across the team.
  - Process Improvement: Implement and maintain standardized
    development, testing, and deployment processes to foster
    continuous improvement and innovation.
  - Quality Assurance: Oversee all quality assurance processes,
    ensuring high standards are maintained across all
    products. Ensure comprehensive documentation of processes
    and codebases.
  - Security: Design and implement robust security measures to
    protect company data and assets. Regularly update security
    protocols and ensure compliance with industry standards.
  - Stakeholder Communication: Act as the primary point of
    contact for both internal and external stakeholders.
    Provide regular updates to the leadership team on
    engineering progress, product development, and technical
    challenges. Set up and manage dashboards for system
    monitoring to ensure transparent and effective
    communication.

  What We Look for in You:

  - Experience: At least 7 years of experience in software
    engineering, with at least 2 years in engineering
    management.
  - Skills: Strong technical competency, including onchain
    fluency; proficient in project management tools like
    ClickUp and GitHub; excellent organizational and
    communication skills.
  - Attributes: Optimistic about the future of crypto; ability
    to thrive in a fast-paced and dynamic environment; strong
    problem-solving skills and a passion for innovation.

  Why Join Us:

  - Innovative Environment: Lead projects at the cutting edge of
    blockchain and DeFi technology.
  - Impact: Make a significant impact on the future of Web3 and
    the global cryptoeconomy.
  - Growth Opportunities: Shape our engineering team and product
    strategy in a rapidly evolving company.
  - Competitive Compensation: Attractive salary, equity options,
    performance-based bonuses, and comprehensive benefits
    package.
  - Remote Flexibility: Work from anywhere, or join us on-site
    for a more collaborative experience.

  Commitment to Equal Opportunity: Magnify Cash is committed
  to creating a diverse environment and is proud to be an
  equal opportunity employer. We welcome all qualified
  applicants regardless of race, color, religion, gender,
  national origin, age, disability, or veteran status.
