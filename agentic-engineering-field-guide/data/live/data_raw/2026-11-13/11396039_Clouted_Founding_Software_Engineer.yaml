description: |
  About Clouted

  Clouted (fka Clout Kitchen) is The Virality Engine for
  brands, startups, artists, and creators. Generating over
  300M+ views/monthly for our clients, we are a team of
  experts in viral strategies, distribution, and marketing
  campaigns. We cook up some cool stuff — check out our
  website for more information.

  We operate at the intersection of technology and
  entertainment, backed by top global VCs including a16z, Peak
  XV, and AppWorks. Our focus is building products and systems
  that automate strategy and operations for mass content
  distribution. We partner with leading artists, festivals,
  creators, and brands across the US and Asia.

  About The Role

  We are hiring a senior Founding Software Engineer to build
  the Clouted Engine and platform - the products and systems
  that automate strategy and operations for mass content
  distribution. This is an early, high-ownership role working
  directly with the founders. You'll ship full-stack features
  end-to-end, build the data and automation backbone behind
  our campaigns, and help shape our AI/agent infrastructure.

  You should be a senior generalist who ships fast, has strong
  product instincts, and is excited about the intersection of
  social platforms, data, and AI agents.

  What You'll Own

  1. Product & Platform Engineering

  - Build and ship core features of the Clouted Engine end-to-
    end (frontend and backend).

  - Own significant surface area of the product, from
    architecture through deployment.

  Balance velocity with reliability.

  2. Distribution Automation & Data

  - Build pipelines and integrations that automate content
    distribution across TikTok, Instagram, and YouTube.

  - Ingest and normalize performance data to power Clouted's
    distribution intelligence.

  3. AI / Agent Infrastructure

  - Build and extend agentic tooling for campaign strategy,
    creator sourcing, and agent-to-agent workflows.

  - Integrate LLMs and automation into internal and client-
    facing products.

  4. Technical Foundation & Scale

  - Build internal tools that make campaign ops, reporting, and
    creator management faster and more scalable.

  - Help set engineering standards and practices as the team
    grows.

  What Success Looks Like

  - Core platform features ship quickly and reliably, owned end-
    to-end.

  - Manual, repetitive campaign work is increasingly automated
    by systems you build.

  - Data flows cleanly into distribution intelligence the team
    actually uses.

  - The engineering foundation scales without constant
    firefighting.

  You'll Thrive in This Role If You…

  - Are a strong senior full-stack engineer who owns features
    from idea to production.

  - Ship fast and are comfortable with ambiguity.

  - Have genuine product sense.

  - Are excited about AI agents, automation, and social-platform
    APIs.

  - Want the ownership and pace of a founding-team role.

  Requirements

  - 5+ years of full-stack engineering experience (e.g.,
    TypeScript/React/Node, Python).

  - Strong experience with API integrations, cloud
    infrastructure, and shipping production software.

  - Startup or 0→1 experience strongly preferred.

  - Bonus: LLM/agent frameworks, data pipelines, or social-
    platform APIs (TikTok, Meta, YouTube).

  What We Offer

  - Unlimited PTO

  - Meaningful founding-level equity and real technical
    ownership

  - Fast-moving environment building at the intersection of tech
    and entertainment

  - Comprehensive medical, dental, and vision insurance options
