description: |
  Mitsubishi Motor Sales of Canada, Inc. is an equal
  opportunity employer fostering an inclusive, accessible
  environment. We are committed to building an environment
  where all employees and customers feel valued, respected,
  and supported. Mitsubishi Motor Sales of Canada, Inc. will
  support applicants requiring accommodation during the
  recruitment process.



  All employees are required to espouse MMSCAN’s company
  values, MMC WAY, and conduct themselves accordingly:

  - Think of Our Customers First; Strengthen Trust
  - Enrich Society
  - Welcome All Facts; Share Difficult News First
  - Conduct and Challenge Yourself Professionally
  - and Respect All; Work as Part of a Broader Team



  Use of Artificial Intelligence (AI)

  MMSCAN does not utilize AI to review or assess applicants.
  All screening is conducted internally by a member of the HR
  team and/or the hiring manager.



  PURPOSE

  The Full Stack Web Developer, Information Systems works
  closely with the IS Manager and Project team to develop,
  test, and implement strategic software solutions as defined
  by the customer and the Manager of IS.



  This position reports to the Manager, IS.



  RESPONSIBILITIES

  - Design, develop, test, and maintain scalable, secure, and
    high-quality web applications using Angular, Node.js
    (Fastify), and MySQL, following established coding
    standards and best practices.
  - Build responsive, accessible, and user-friendly interfaces,
    translating UI/UX designs, wireframes, and business
    requirements into functional application features.
  - Develop and maintain backend services, business logic, and
    RESTful APIs, including integration with internal systems
    and third-party services.
  - Design, implement, and optimize database schemas, SQL
    queries, and data access patterns to ensure data integrity
    and application performance.
  - Write clean, reusable, maintainable, and well-documented
    code, while participating in peer code reviews and
    contributing to continuous improvements in code quality.
  - Develop and maintain automated tests, including unit and
    integration tests, and perform cross-browser and
    responsive design testing to ensure application
    reliability.
  - Apply secure coding practices and contribute to improving
    application performance, scalability, and reliability
    across the full technology stack.
  - Support the deployment, monitoring, and troubleshooting of
    applications and their supporting cloud services on cloud
    platforms such as Google Cloud (GCP) and Amazon Web
    Services (AWS), following established CI/CD processes and
    development workflows
  - Collaborate with the technical team and business
    stakeholders to clarify requirements, evaluate technical
    approaches, and deliver effective solutions.
  - Participate in technical design discussions and contribute
    to architectural decisions, identifying opportunities to
    improve existing applications and development processes.
  - Take ownership of assigned features and development tasks
    from implementation through testing and delivery, ensuring
    quality and alignment with project requirements and
    timelines.
  - Investigate, troubleshoot, and resolve technical issues
    across frontend, backend, and database layers, proactively
    identifying risks and communicating blockers to the
    appropriate stakeholders.
  - Continuously expand technical knowledge, evaluate emerging
    technologies and development tools, and recommend
    practical improvements that benefit the team and its
    applications.
  - Other duties as assigned.



  TYPICAL EDUCATION & EXPERIENCE PROFILE

  - Minimum Information Technology Diploma OR, Any equivalent
    combination of experience, training and/or education.
  - Strong understanding of user interface principles, cross-
    browser compatibility, responsive website creation and
    general web functions and standards.
  - Hands-on experience in web application and web service
    development using programming languages and technologies
    such as HTML5, CSS, JavaScript, and TypeScript, as well as
    modern frontend frameworks and libraries (e.g., Angular
    19+, Tailwind CSS). Experience with other relevant
    technologies is an asset.
  - Experience with web accessibility, performance, and end to
    end testing
  - Hands-on experience with server-side JavaScript and
    TypeScript development using runtime environments (e.g.,
    Node.js), backend frameworks (e.g., Express.js, Fastify),
    and package management tools (e.g., npm, pnpm).
  - Hands-on experience with Git-based version control,
    including branching strategies, merging, conflict
    resolution, and repository management.
  - Experience with collaborative software development workflows
    using platforms such as GitHub, including pull request
    management, peer code reviews, and adherence to team
    coding standards and best practices.
  - Strong understanding of cloud computing platforms (e.g.,
    Amazon Web Services (AWS), Google Cloud Platform (GCP)),
    including cloud infrastructure, networking, security, and
    the deployment and management of cloud-based applications
    and services.
  - Familiarity with Infrastructure as Code (IaC) principles and
    tools (e.g., Terraform, OpenTofu) for provisioning and
    managing cloud infrastructure is considered an asset.
  - Teamwork, strong verbal and written communication skills and
    a dedication to purpose are must haves.
  - Experience leveraging AI-powered coding tools (e.g., Claude
    Code, GitHub Copilot) to assist with code generation,
    debugging, refactoring, and development productivity.
