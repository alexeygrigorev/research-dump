description: |
  Senior Software Engineer INTOO is a fast-growing HR
  technology solutions provider seeking a highly experienced,
  hands-on Senior Software Engineer. This is an individual
  contributor role with significant ownership over technical
  execution, system reliability, and architectural direction.
  You’ll operate across the stack, lead by example, and mentor
  engineers while driving high-impact initiatives.

  **Strong preference given to applicants living in any of the
  following states: MA, IL, OH, NE, MO, IN, TX, NY, NJ, MD,
  MI, WI**

  WHAT YOU’LL DO Own and deliver complex technical systems and
  critical workflows end-to-end Ensure production reliability,
  performance, and security across the platform Lead and
  influence architectural decisions with a focus on long-term
  maintainability Communicate complex technical and business
  concepts effectively to technical and non-technical
  stakeholders Mentor and coach engineers at all skill levels
  Drive incident response and continuous improvement of system
  health and processes Continuously assess industry trends,
  risks and identify areas for improvement

  REQUIRED (NON-NEGOTIABLE)

  7+ years hands-on experience with Ruby on Rails (formal
  training or equivalent required) 7+ years of cloud
  infrastructure experience (AWS or equivalent), including
  reliability, security, and cost management Extensive
  experience operating in high-ownership environments (small
  businesses, startups, early engineering teams, or
  consulting) where you were responsible for end-to-end system
  outcomes Extensive experience configuring, maintaining, and
  troubleshooting Linux-based production environments

  CORE TECHNICAL EXPERIENCE (STRONGLY PREFERRED) Expert-level
  JavaScript and modern frontend development (React, Stimulus,
  etc.) Direct responsibility for production uptime, including
  monitoring, alerting, incident response, and root cause
  analysis. Strong ownership of relational databases (MySQL or
  similar), including schema design, performance tuning, and
  data integrity Experience with automated testing, CI/CD
  pipelines, and code review practices Hands-on experience
  with application, network, and cloud security best practices
  Experience with monitoring, alerting, and observability
  tooling

  ADVANCED / DIFFERENTIATORS (PREFERRED QUALIFICATIONS)
  Ability to work 1 day per week in our Framingham, MA office
  Experience implementing and maintaining security and
  compliance frameworks (SOC 2, NIST, ISO 27001) Experience
  working in Agile environments (Jira, Scrum, etc.) Advanced
  experience with web servers such as NGINX Experience with
  Redis or other NoSQL data stores Experience implementing SSO
  integrations (OAuth, SAML) Additional language fluency
  (Italian, French, Spanish)

  EDUCATION BS/MS in Computer Science, Engineering, or related
  field (or equivalent experience)

  LOCATION & TRAVEL **Final stage of interview process will be
  held in person in Framingham, MA** Onboarding includes 1
  week onsite in Framingham, MA Travel up to 6 times per year

  WHAT WE OFFER:  Medical, Vision, Dental Telemedicine and
  Well-Being Resources 100% Remote Career Development
  Resources

