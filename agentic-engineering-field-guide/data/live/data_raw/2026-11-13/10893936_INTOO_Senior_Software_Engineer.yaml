  ABOUT INTOO: Our Values include
  SPEED/INNOVATION/COLLABORATION/CARING Develop careers.
  Nurture your talent.

  At INTOO, our Global Outplacement Practice flagship for Gi
  Group Holding, we believe developing the careers of people
  is what ultimately drives the success of our business. We
  take a long-term view of careers and help people identify
  what success looks like now and in the future.

  We know that helping individuals find the right career path
  is about developing a positive mindset, building confidence,
  and giving people control over their own choices. That’s why
  we take the time to understand every candidate’s priorities
  and career aspirations before providing bespoke outplacement
  and career coaching support along with expert advice, tools,
  and guidance to help them quickly reconnect with their
  chosen career.

  Being part of the team Our team supports workforce
  transformation by helping candidates become the best version
  of themselves and providing them with the skills they need
  to be employable. Join us and you can make a real difference
  by designing and delivering hi-touch, customized solutions
  for business leaders, managers and employees that help
  enhance their performance and careers. Together, we can show
  employees how to take ownership of their development and
  create an empowered workforce that’s ready for the future.
