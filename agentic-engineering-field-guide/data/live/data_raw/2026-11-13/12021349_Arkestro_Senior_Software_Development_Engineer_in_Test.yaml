description: |
  About Arkestro

  Arkestro's Predictive Procurement Platform applies AI, game
  theory, and behavioral science to enterprise negotiations.
  It moves teams away from reactive supplier bidding toward
  data-driven offers that reduce friction and help both buyers
  and suppliers reach better outcomes faster.

  Arkestro helps procurement teams influence more enterprise
  spend and uncover savings that traditional sourcing
  approaches often leave behind by applying predictive
  intelligence to how sourcing events are designed and
  executed.

  We’re a hyper-growth company looking for people who take
  ownership and are comfortable working through complexity.
  This is a tremendous opportunity if you want to do
  meaningful work and help shape how large enterprises run
  procurement… Arkestro is a place where you can have a big
  impact. See Arkestro in action at arkestro.com.

  About the role

  We’re looking for an experienced SDET with a strong test
  background to continue to help us develop our QE processes
  and support the team building increased capabilities and
  enhancements to our Arkestro platform. We need someone  who
  will be responsible for finding and reporting software
  defects and identifying discrepancies between specification
  and system behavior.

  Responsibilities

  - Build regression automation scripts that support app
    functionality
  - Manually test software for validation and accuracy based on
    defined set of criteria
  - Execute smoke, regression, integration, performance and
    other testing types to ensure proper behavior of software
  - Record detailed documentation of feature behavior
  - Record pass/fails conditions of tests and correlates
    failures to bug identification
  - Identifies and escalates any risk to quality of the product
    or the process
  - Collaborates with the product team to ensure quality
    throughout the SDLC and product release cycles
  - Collaborates with customer-facing teams to incorporate user
    feedback in the testing strategy
  - Participate in refinement and estimations of effort to
    promote accurate planning
  - Utilize Github to maintain automation repositories, run
    custom scripts, and facilitate automated quality practices
  - Participate in On-Call rotation

  Required Qualifications:

  - At least 5 years experience in a software quality assurance
    role
  - At least 5 years experience in automated testing
  - Strong written and verbal communication skills
  - Possess a mindset focused on holistic quality
  - Experience with programming languages such as Javascript,
    Typescript, Gherkin, SQL, Ruby/Rails

  Nice to Have Qualifications

  - Experience with automated testing frameworks such as
    Jest/Puppeteer, Playwright, Postman, Jmeter or any other
    object-oriented based automated testing framework
  - Experience with testing support functionalities such as
    Github Actions, Lambdatest, Sendgrid, Datadog, PagerDuty
  - Understanding of quality management systems and quality
    control processes
  - Background in data-based testing and/or security-based
    testing
  - A degree in Computer Science, Engineering, or other relevant
    experience

  Pay Range

  $135,000—$165,000 USD

  Arkestro is committed to providing our employees with a
  benefits package designed to give you the flexibility you
  need to ensure a healthy life/work balance. Arkestro offers
  our employees great benefits and perks, including, but not
  limited to:

  - Competitive salary and startup equity
  - Medical, Dental, Vision insurance premiums covered up to
    100% (employee only)
  - 401K discretionary employer matching
  - Unlimited PTO
  - A remote-first team with regular opportunities to get
    together in person for team building, design sprints, and
    customer visits
  - Annual budget of $1,000 for learning and professional
    development
  - Diverse, inclusive, highly collaborative, and vibrant
    culture

  Arkestro is an equal opportunity employer that is committed
  to diversity and inclusion in the workplace. We prohibit
  discrimination and harassment of any kind based on race,
  color, sex, religion, sexual orientation, national origin,
  disability, genetic information, pregnancy, or any other
  protected characteristic as outlined by federal, state, or
  local laws.

