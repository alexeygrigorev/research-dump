description: |
  Become a part of our caring community The Lead Full Stack
  Engineer for Platform Quality and Reliability owns the
  operational health of the NBA platform after it is built.
  This is a hands-on engineering role first - you are expected
  to be a significant individual contributor every sprint. You
  take handoff from the delivery pods and are accountable for
  ensuring the platform scales, stays up, fails gracefully,
  and is covered by rigorous testing and observability. You
  are not building new features - you are making sure what
  gets built is production-ready and stays that way.

  What You'll Own

  - Platform reliability - own uptime, performance, and
    resilience across NBA platform services; identify and
    resolve bottlenecks, failure points, and scaling
    constraints before they become incidents
  - Hands-on development - actively write and ship production
    code alongside your team; this is not a supervisory role
  - Testing frameworks - build and maintain automated testing
    infrastructure across unit, integration, and end-to-end
    layers; establish testing standards and ensure pods are
    handing off code that meets the bar
  - Observability and logging - own the platform's logging,
    alerting, and monitoring stack; ensure the team has
    visibility into what the system is doing in production at
    all times
  - Error management - design and enforce error handling
    patterns across platform services; ensure failures are
    caught, logged, surfaced, and resolved systematically
  - Scalability engineering - evaluate platform components under
    load and lead efforts to ensure the system scales reliably
    as member volume and data throughput grow
  - Handoff and quality gates - define and enforce the criteria
    pods must meet before handing off new services or
    features; own the process that gets code from delivery to
    production safely
  - Contractor management - manage quality and reliability
    engineers within your pod; set expectations, review work,
    and hold the team to standards
  - Cross-pod coordination - work closely with all delivery pod
    leads to catch quality and reliability concerns early; be
    the voice that asks how something breaks before it ships

  What You'll Need

  - Bachelor's degree in computer science or related field
  - 2+ years of project leadership experience
  - 6+ years of full stack software engineering experience with
    at least 1-2 years focused on platform reliability,
    software quality, or site reliability engineering
  - 8+ years of progressive tech experience as a senior
    developer in large tech projects
  - Hands-on experience building and owning testing
    infrastructure - automated test suites, integration
    testing, load testing, and end-to-end coverage
  - Strong understanding of observability practices: structured
    logging, distributed tracing, metrics, and alerting
  - Experience designing and enforcing error handling and
    failure management patterns across distributed systems
  - Proven ability to lead a small team or pod through delivery
    and manage contractor resources
  - Comfortable reading and working across a polyglot stack -
    the NBA platform spans Java, Python, Node.js, and
    TypeScript
  - Strong communication skills - you can clearly articulate
    quality risk to engineering leads and to senior leadership
  - Must be passionate about contributing to an organization
    focused on continuously improving consumer experiences
  - Comfort using AI productivity tools (Claude, Copilot, or
    similar) to accelerate testing, debugging, and analysis

  Strong plus:

  - Resides in Boston, MA
  - Master's degree
  - Experience with Kubernetes-based platforms and container-
    level reliability and scaling
  - Familiarity with Kafka and event-driven architectures -
    understanding how failures propagate across async systems
  - Background in healthcare, insurance, or other regulated
    industries where audit trails and compliance are non-
    negotiable
  - Experience with chaos engineering or fault injection testing
  - Familiarity with Azure DevOps pipelines and CI/CD quality
    gates

  Use your skills to make an impact


  Additional Information

  Work Style: Remote/Hybrid - Preferably Boston, MA.

  Occasional travel to Humana's offices for training or
  meetings may be required.

  Work Hours: Typical business hours are Monday-Friday, 8
  hours/day, 5 days/week-- some flexibility might be possible,
  depending on business needs.

  Very minimal travel might be required for training,
  meetings, and/or conferences

  Interview Format

  As part of our hiring process, we will be using on-demand
  technology provided by Hire Vue, a third-party vendor. This
  technology provides our team of recruiters and hiring
  managers with an enhanced method for decision-making through
  on-demand candidate assessments.

  If you are selected to move forward from your application
  prescreen, you will receive correspondence inviting you to
  participate in an on-demand assessment with pre-determined
  questions. You should anticipate the assessment to take
  approximately 10-15 minutes.

  Your on-demand assessment will be reviewed, and you will
  subsequently be informed if you will be moving forward to
  next round of interviews.

  SSN Task via Workday

  Should you be extended a formal employment offer you will
  receive a request to enter your SSN into our Workday system
  to scan for duplicate profiles.

  Work at Home Requirements: To ensure Home or Hybrid
  Home/Office employees’ ability to work effectively, the
  self-provided internet service of Home or Hybrid Home/Office
  employees must meet the following criteria: At minimum, a
  download speed of 25 Mbps and an upload speed of 10 Mbps is
  required; wireless, wired cable or DSL connection is
  suggested. In certain roles, the minimum recommended
  internet speed required by Humana may not be sufficient for
  business needs. Humana reserves the right to require
  associates to upgrade their internet service if necessary.
  Work from a dedicated space lacking ongoing interruptions to
  protect member PHI / HIPAA information. Travel: While this
  is a remote position, occasional travel to Humana's offices
  for training or meetings may be required.

  Scheduled Weekly Hours

  40

