description: |
  At River we are building the world’s most trusted financial
  institution to empower people to take ownership of their
  financial lives through Bitcoin, the world’s only
  incorruptible digital money. We believe in a future where
  every person will have bitcoin savings, and every business
  will have bitcoin on the balance sheet. We obsessively
  design and build delightful products that help our clients
  buy, sell, secure, and use Bitcoin.

  We are looking for a Staff level candidate who is
  comfortable across the entire web stack and has experience
  building and maintaining production systems at scale. This
  person will be a leader on our engineering team, setting a
  high bar for quality and acting as a mentor to others. Our
  web stack consists of Elixir, React, and Postgres.

  River is growing quickly and has raised more than $50
  million from leading investors, including Goldcrest,
  Kingsway, Polychain, M13, DG, and Valor. We have also
  released our company's financials and proof of reserves
  publicly, so all of our clients and employees can verify the
  robustness and growth of the business themselves.

  What you will be doing

  - Architect and develop new features and products in the
    Elixir codebase powering our web applications and API
  - Work closely in cross-functional teams to plan and scope new
    projects and initiatives
  - Present innovative solutions to senior leadership, aligning
    engineering initiatives with company goals.
  - Own solving ambiguous technical and business problems,
    ensuring scalability, performance, and maintainability.
  - Ship high-quality, well tested code
  - Participate in code-reviews
  - Act as a key influencer in the team’s success, providing
    mentorship and fostering a culture of excellence.
  - Proactively identify and eliminate technical roadblocks.

  What we look for in you

  - 6+ years of experience in software engineering
  - You have designed, built and maintained production services
    at scale and understand how to build reliable systems
  - You write high-quality, reliable code and take ownership of
    systems you work on
  - You have experience developing solutions to ambiguous
    problems
  - You're excited about what we are building at River
  - You have a deep understanding of web and database
    fundamentals
  - You have a desire to mentor and lift up other members of
    your team
  - Excellent written and spoken communication skills

  Nice to haves

  - Fintech experience
  - You have worked with Elixir, React, Kubernetes, and Postgres
  - You have worked at a rapidly scaling company
  - Interest in Bitcoin

  Location & Salary

  - 100% remote option available within the Americas and Europe,
    with offices in NYC and Columbus
  - Salary range between $200,000 - $250,000 based on skills and
    experience (Note: this salary will not be location
    adjusted, the salary range is the same globally.)
  - Significant equity stock options
  - Medical, Dental and Vision Benefits
  - Unlimited PTO
  - Parental Leave separate from regular PTO policy
  - 401k
