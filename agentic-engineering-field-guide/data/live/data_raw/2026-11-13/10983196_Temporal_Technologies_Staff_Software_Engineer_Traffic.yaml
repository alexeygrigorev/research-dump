description: |
  Summary

  We are seeking a Staff Software Engineer to join our Traffic
  team, where you will play a key role in driving the
  technical strategy, execution, and leadership of projects
  across traffic management, network optimization, and cloud
  orchestration. This is an exciting opportunity to
  significantly impact the scalability, reliability, and
  operational excellence of Temporal’s networking
  infrastructure, while also mentoring and guiding the team.

  What You'll Do

  Invent

  - Lead the design and development of systems that optimize
    network traffic and scale for global expansion.
  - Drive architectural decisions for high-impact projects,
    ensuring scalability and reliability.
  - Co-author long-term technical roadmaps that set the vision
    for network scalability, performance, and engineering
    velocity.
  - Set the standard for a culture of engineering and
    operational excellence.

  Own

  - Build and nurture effective partnerships across engineering,
    product, and security teams to align on network
    infrastructure goals.
  - Lead and conduct design reviews for critical projects with a
    focus on system-level tradeoffs and network scalability.
  - Drive the design and implementation of “secure by default”
    network systems in collaboration with security teams.
  - Act as a key stakeholder by engaging with customers and
    internal teams to understand business requirements and
    deliver innovative solutions.

  Learn

  - Deeply understand how to leverage Temporal’s software to
    build and scale networking infrastructure.
  - Gather insights into customer needs and incorporate them
    into technical decision-making for traffic management and
    networking strategies.
  - Stay at the forefront of technology advancements in traffic
    management, networking, and cloud orchestration.

  Collaborate

  - Mentor and guide engineers, sharing best practices and
    design principles for building reliable and scalable
    networking systems.
  - Drive alignment across teams, ensuring roadmaps are cohesive
    and deliverables are on track.
  - Foster a collaborative and growth-oriented environment,
    helping others improve while continuing to expand your own
    expertise.

  What You'll Bring

  - Proven experience leading complex engineering efforts
    focused on network traffic management, network
    optimization, and cloud orchestration.
  - Exceptional collaboration and communication skills, with a
    demonstrated ability to align stakeholders and lead cross-
    functional teams.
  - A track record of contributing to long-term technical
    roadmaps and making thoughtful system-level tradeoffs.
  - At least 8+ years of coding experience in languages like Go,
    Java, or similar, with strong expertise in writing
    concurrent and distributed code.
  - Extensive experience designing and building distributed
    systems, leveraging concurrency primitives, and optimizing
    network performance.
  - Deep expertise in traffic and networking systems, with
    familiarity across adjacent infrastructure domains.
  - Hands-on experience with cloud providers such as AWS, GCP,
    or Azure, and the ability to optimize cost, performance,
    and scalability.
  - Operational experience with Envoy and xDS configuration.
    Bonus for custom controller expertise and controller
    migration familiarity.
  - A strong sense of ownership and the ability to balance
    short-term priorities with long-term strategic goals..

