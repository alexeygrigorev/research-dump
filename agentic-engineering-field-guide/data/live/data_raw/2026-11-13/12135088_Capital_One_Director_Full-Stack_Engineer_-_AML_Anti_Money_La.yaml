description: |
  Director, Full-Stack Engineer - AML (Anti Money Laundering)
  As a Director, Full-stack Engineer at Capital One, you will
  lead high-performing engineering teams working to define the
  future of banking in the cloud. You will partner closely
  with product managers, designers, architects and executive
  leaders to deliver scalable, customer-centric solutions. Our
  Directors are technical people leaders who drive engineering
  strategy, guide complex architectural decisions and
  translate business goals into impactful technology
  platforms. At Capital One, we believe diversity of thought
  strengthens our ability to influence, collaborate and
  provide the most innovative solutions across organizational
  boundaries. You will foster a culture of engineering
  excellence and inclusivity, balancing technical depth with
  empowered team leadership. You will lead the way in building
  next-generation talent for Capital One Tech-mentoring
  managers and engineers, driving workforce strategy and
  actively recruiting top-tier talent. Directors are expected
  to lead through technical vision, operational rigor and
  strategic alignment. You will serve as a key owner for your
  domain's technical health, delivery velocity and system
  resilience. While shaping long-term technology strategy and
  platform roadmaps, you will inspire a culture of continuous
  learning, innovation and high-impact delivery across your
  organization. Team Description The Anti Money Laundering
  (AML) Technology Team at Capital One is responsible for
  providing solutions that enable the detection, investigation
  and reporting of suspicious activities to FinCen, the
  Financial Crimes Enforcement network, a bureau of the United
  States Department of Treasury. We are transforming the
  technology that drives AML investigations with Agentic AI.
  If you are interested in building and leading engineering
  teams that are at the forefront of this innovation with a
  high bar for engineering and operational excellence, this
  role is for you. What You'll Do:

  - Lead, manage and grow multiple teams of product-focused
    software engineers
  - Mentor and guide the professional and technical development
    of engineers on your team.
  - Work with product managers to understand desired application
    capabilities and testing scenarios
  - Continuously improve software engineering practices
  - Work within and across Agile teams to design, develop, test,
    implement and support technical solutions across a full-
    stack development tools and technologies
  - Lead the craftsmanship, availability, resilience, and
    scalability of your solutions
  - Bring a passion to stay on top of tech trends, experiment
    with and learn new technologies, participate in internal &
    external technology communities, and mentor other members
    of the engineering community
  - Encourage innovation, implementation of cutting-edge
    technologies, inclusion, outside-of-the-box thinking,
    teamwork, self-organization and diversity
  - Work across to improve the velocity of your and other teams
  - Lead efforts to deploy new and existing applications into
    AWS environments
  - Oversee and guide the technical implementation of breaking
    existing monolithic applications into microservice
    architectures and build new microservices
  - Shape long-term technical strategy and architecture
    standards for enterprise platforms
  - Partner with senior engineering and business leaders to
    align product roadmaps with scalable technology
    capabilities
  - Drive talent strategy, ensuring succession planning, skill
    development, and equitable opportunity across engineering
    teams

  This role is designated as a hybrid position. You are
  expected to adhere to Capital One's hybrid policy regarding
  required on-site presence at your designated office
  location.  Basic Qualifications:

  - Bachelor's Degree or higher in Computer Science or a related
    quantitative field (Statistics, Economics, Operations
    Research, Analytics, Mathematics, Engineering)
  - At least 5 years of people management experience
  - At least 7 years of experience in all of the following:
    - Software engineering and solution architecture
    - Enterprise architecture and design patterns
    - Cloud computing (AWS, Microsoft Azure, Google Cloud)
    - Data architecture

  Preferred Qualifications:

  - Master's Degree in Computer Science or Software Engineering
  - Foundational knowledge in AI/ML.
  - Experience building and delivering Generative AI
    applications.
  - 10+ years of experience in all of the following:
    - Software engineering and solution architecture
    - Enterprise architecture and design patterns
    - Web technologies (JavaScript, TypeScript and SPA frameworks)
    - Designing and building distributed HPC and ML systems
    - Cloud computing (AWS, Microsoft Azure, Google Cloud)
    - Data architecture
  - 10+ years of professional experience coding in commonly used
    languages like Go, Java, JavaScript/TypeScript, Python,
    Rust, C#, Scala
  - 8+ years of experience with database and database management
    systems
  - 10+ years of professional experience in the full lifecycle
    of system development, from conception through
    architecture, implementation, testing, deployment and
    production support
  - 8+ years of experience with public cloud platforms (AWS,
    GCP, Azure), cloud-based productivity tools, or
    virtualization technologies
  - 7+ years of experience mentoring senior engineers and
    driving professional development within technical teams
  - 2+ years of experience leading cross-domain architectural
    reviews and establishing coding and design standards
  - Expertise in the strategic application of agentic AI coding
    tools to solve systemic development challenges

  Capital One will consider sponsoring a new qualified
  applicant for employment authorization for this position.
  The minimum and maximum full-time annual salaries for this
  role are listed below, by location. Please note that this
  salary information is solely for candidates hired to perform
  work within one of these locations, and refers to the amount
  Capital One is willing to pay at the time of this posting.
  Salaries for part-time roles will be prorated based upon the
  agreed upon number of hours to be regularly worked.
  Cambridge, MA: $269,100 - $307,200 for Director, Full-stack
  Engineer McLean, VA: $269,100 - $307,200 for Director, Full-
  stack Engineer New York, NY: $293,600 - $335,100 for
  Director, Full-stack Engineer Candidates hired to work in
  other locations will be subject to the pay range associated
  with that location, and the actual annualized salary amount
  offered to any candidate at the time of hire will be
  reflected solely in the candidate's offer letter. This role
  is also eligible to earn performance based incentive
  compensation, which may include cash bonus(es) and/or long
  term incentives (LTI). Incentives could be discretionary or
  non discretionary depending on the plan. Capital One offers
  a comprehensive, competitive, and inclusive set of health,
  financial and other benefits that support your total well-
  being. Learn more at the Capital One Careers website .
  Eligibility varies based on full or part-time status, exempt
  or non-exempt status, and management level. This role is
  expected to accept applications for a minimum of 5 business
  days. No agencies please. Capital One is an equal
  opportunity employer (EOE, including disability/vet)
  committed to non-discrimination in compliance with
  applicable federal, state, and local laws. Capital One
  promotes a drug-free workplace. Capital One will consider
  for employment qualified applicants with a criminal history
  in a manner consistent with the requirements of applicable
  laws regarding criminal background inquiries, including, to
  the extent applicable, Article 23-A of the New York
  Correction Law; San Francisco, California Police Code
  Article 49, Sections 4901-4920; New York City's Fair Chance
  Act; Philadelphia's Fair Criminal Records Screening Act; and
  other applicable federal, state, and local laws and
  regulations regarding criminal background inquiries. If you
  have visited our website in search of information on
  employment opportunities or to apply for a position, and you
  require an accommodation, please contact Capital One
  Recruiting at 1-800-304-9102 or via email at
  RecruitingAccommodation@capitalone.com . All information you
  provide will be kept confidential and will be used only to
  the extent required to provide needed reasonable
  accommodations. For technical support or questions about
  Capital One's recruiting process, please send an email to
  Careers@capitalone.com Capital One does not provide, endorse
  nor guarantee and is not liable for third-party products,
  services, educational tools or other information available
  through this site. Capital One Financial is made up of
  several different entities. Please note that any position
  posted in Canada is for Capital One Canada, any position
  posted in the United Kingdom is for Capital One Europe and
  any position posted in the Philippines is for Capital One
  Philippines Service Corp. (COPSSC).
