description: |
  At CesiumAstro, we are developers and pioneers of out-of-
  the-box communication systems for satellites, UAVs, launch
  vehicles, and other space and airborne platforms. We take
  pride in our dynamic and cross-functional work environment,
  which allows us to learn, develop, and engage across our
  organization. If you are looking for hands-on, interactive,
  and autonomous work, CesiumAstro is the place for you. We
  are actively seeking passionate, collaborative, energetic,
  and forward-thinking individuals to join our team.

  In this position, you will be responsible for low-level and
  high-level software in CesiumAstro’s products through all
  phases of the development process. Key projects will include
  Linux-based single-board computers and high-reliability
  microcontroller systems. Cesium’s goal is to create an out-
  of-the-box hardware and software experience which enhances
  our customers’ ability to rapidly integrate our products
  into their systems.

  As a CesiumAstro software team member, you will be
  responsible for software designs from concept through
  production, including product roadmaps, block diagrams,
  detailed design and coding, analysis, test, qualification,
  and in-orbit support. The ideal candidate will have
  development experience at nearly every level of the software
  stack, including microcontrollers, low-level drivers, board
  support packages (BSP), end-use applications, and user
  interfaces. Additionally, the ideal candidate will have
  experience in software testing and high-reliability
  qualification, as well as software engineering and software
  project management practices.

  The successful candidate will present engineering design
  review materials to our customers and executive team, as
  well as participate in proposal-writing efforts. As such,
  excellent written and verbal communication skills are
  required.

