description: |
  What is Bilt?

  Bilt is the membership for where you live.

  What started as a way to reward people on their largest
  expense has turned into an ecosystem connecting our members,
  property managers and local merchants.

  Travel, dining, fitness, everyday spend. We are building
  systems across payments, credit, loyalty, and commerce all
  at once.

  We run lean and move quickly. Every person here has a real
  impact on what gets built and how fast it happens.

  This role comes with real ownership and high expectations.
  If you prefer clearly defined lanes and structure, this will
  feel uncomfortable. If you want to build quickly, have a
  real say in what gets built, and work on products used by
  millions, you will likely do your best work here.

  What’s the role?

  As a Back End Engineer at Bilt, you’ll join a renowned team
  that is transforming the future of renting. You will be
  responsible for designing, implementing, and documenting the
  back-end services for the Bilt mobile app and website while
  coaching and mentoring junior resources and collaborating
  with other team members and stakeholders. You will also
  drive best practices, ensure the technical feasibility of
  integrations, and optimize the application for maximum
  speed, scalability, and reliability.

  We are targeting levels from 5+ years: Back End Engineers,
  Senior Back End Engineers, and Staff Back End Engineers.
  Level is decided throughout the interview process.

  In this role, you will:

  - Investigate and utilize Google Cloud Platform services to
    continuously improve application architecture
  - Implement microservices using Java and Go
  - Propose and enhance automation initiatives related to
    infrastructure as code, CI/CD, monitoring and alerting
  - Contribute to all phases of the development lifecycle
  - Write well-designed, testable, and efficient code

  In terms of qualifications, we’re seeking:

  - 5+ years of experience
  - Proven hands-on Software Development experience
  - Demonstrable experience in Java or Go development
  - Experience with/ Google Cloud Platform and/or AWS or Azure
  - Great interpersonal skills and a team player
  - A burning desire to win and reach overall company goals
  - Flexibility - we are disrupting an industry, so changes to
    traditional processes should be expected
  - Knowledge of the start-up world is preferred

  Benefits:

  - Compensation - We offer a competitive salary with a
    meaningful stake in the company via equity and our
    performance bonus program
  - Health insurance for you (& your loved ones) from day one -
    Enjoy a One Medical Membership, wellness stipends, family
    programs and more, on us. We’ve got you and your family
    covered from day one.
  - 401k plan with a match - Retirement may feel more like a
    pipe dream than a reality but we’re here to help you get
    there.
  - Commuter FSAs - We believe the best ideas come from being
    together in one place. We just don’t think getting there
    should be so expensive.
  - UNLIMITED PTO - Because we believe that working hard
    shouldn’t mean always working. Take time for yourself as
    often as you need it.
  - Exclusive Employee only Bilt Points - We give our employees
    unique opportunities to earn points throughout their time
    at Bilt.
  - Team Events - We believe in human connection so we hold
    events to help our employees break from the monotony of
    the typical work week.

  At Bilt Rewards, we believe in transparency and we do our
  best to make sure the company and our candidates are on the
  same page as it relates to compensation. In addition to
  posting salary ranges for our open roles, candidates should
  expect to be asked about compensation expectations and
  requirements early on in their interview process. Our goal
  is to highlight when expectations and Bilt’s salary range
  may be out of sync, and work with the candidate to determine
  whether it makes sense to continue conversations.

  We are considering candidates with differing levels of
  expertise for this position. Leveling will be based upon
  your experience and performance in the interview process.

  Where a new hire falls within a range will be based on their
  skills and experience, and how these competencies compare
  across other employees in the same role. Bilt's bands are
  designed to allow for individual compensation growth within
  the role. As such, new hires typically start at the lower
  end of the range. Bilt Rewards performance and outcomes -
  should you join the company, you will have the opportunity
  to grow your salary over time.

  The salary range for a Back End Engineer is $170,000 -
  $300,000 (based on YOE/level), and you will be eligible for
  equity and an annual performance-based bonus.
