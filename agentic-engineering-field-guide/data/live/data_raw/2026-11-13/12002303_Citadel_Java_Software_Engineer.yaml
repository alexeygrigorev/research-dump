description: |
  Job Description Java Software Engineers build scalable,
  resilient systems that support every stage of Citadel's
  investment and business workflows. Our engineers work on
  complex applications and platforms spanning trading, data,
  risk management, funding, settlement, operations, and
  enterprise technology, where performance, reliability, and
  thoughtful system design are critical. They work across the
  full software development lifecycle, designing new systems,
  modernizing existing platforms, improving performance and
  reliability, and partnering directly with investment
  professionals and other stakeholders to solve challenging
  problems and drive commercial outcomes. Key
  Responsibilities:

  - Design, develop, test, deploy, and maintain high-quality
    Java applications, services, and platforms
  - Build scalable, reliable, and high-performance systems
    supporting critical investment and business workflows
  - Partner directly with users and engineering teams to
    understand complex requirements and develop effective
    technical solutions
  - Design and improve distributed systems, APIs, data
    platforms, and event-driven architectures
  - Develop green-field systems while also improving and
    modernizing existing technology
  - Build systems designed to support future growth in data
    volumes, transaction volumes, and business complexity
  - Improve application performance, reliability, scalability,
    and maintainability
  - Contribute to system architecture, engineering standards,
    and technical strategy
  - Own solutions throughout the software development lifecycle,
    from design and implementation through production
  - Learn from industry leaders, distinguished engineers, and
    investment professionals

  Qualifications:

  - Minimum of a Bachelor's degree in Computer Science, or a
    related STEM discipline, or equivalent experience
  - Expert-level Java programming skills and experience
    developing production-quality software
  - Strong background in computer science fundamentals, data
    structures, algorithms, object-oriented design, and
    distributed systems
  - Experience designing and building scalable applications,
    services, or platforms
  - Comfortable with modern software development tools and
    practices, including testing, source control, build
    systems, and CI/CD
  - Experience with SQL, relational or distributed databases,
    and data-intensive systems is a plus
  - Experience with messaging technologies, event-driven
    systems, cloud infrastructure, or containerized
    environments is a plus
  - Excellent analytical, problem-solving, communication, and
    teamwork skills
  - Strong entrepreneurial spirit and the ability to adapt to
    changing requirements and technologies

  Opportunities may be available from time to time in any
  location in which the business is based for suitable
  candidates. If you are interested in a career with Citadel,
  please share your details and we will contact you if there
  is a vacancy available.  To be eligible for UK postings, you
  must have or be able to obtain UK work authorization. For
  our privacy policy, go to https://www.citadel.com/privacy.
  In addition, the employee who fills this role will be
  eligible to participate in a discretionary incentive
  compensation program, as well as a wide array of benefit
  programs, such as medical and life insurance, retirement and
  tax-free savings plans, and access to other healthcare
  programs. In accordance with applicable law, the base salary
  range for this role is $200,000 to $300,000. In addition,
  the employee who fills this role will be eligible to
  participate in a discretionary incentive compensation
  program, as well as a wide array of benefit programs, such
  as medical and life insurance, retirement and tax-free
  savings plans, and access to other healthcare programs.
  About Citadel Citadel is one of the world's leading
  alternative investment managers. We manage capital on behalf
  of many of the world's preeminent private, public and
  nonprofit institutions. We seek the highest and best use of
  investor capital in order to deliver market leading results
  and contribute to broader economic growth. For over 30
  years, Citadel has cultivated a culture of learning and
  collaboration among some of the most talented and
  accomplished investment professionals, researchers and
  engineers in the world. Our colleagues are empowered to test
  their ideas and develop commercial solutions that accelerate
  their growth and drive real impact.
