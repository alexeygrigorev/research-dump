description: |
  Your Impact

  As a Senior Software Engineer, you will architect and
  deliver core components of a highly scalable platform for
  Cisco Hypershield. You will focus on extending platform
  availability across multiple hypervisors, directly removing
  barriers to customer adoption and increasing market reach.
  Working with senior technical leadership, you will translate
  architectural goals into robust, high-performance code,
  ensuring the platform meets rigorous scalability and
  security standards while coordinating delivery across
  engineering and infrastructure teams.

  Responsibilities

  Partner with application teams and infrastructure providers
  to understand workload requirements and hypervisor
  constraints. Use technical feedback, performance metrics,
  and system signals to validate architectural decisions and
  ensure desired platform outcomes.

  Contribute to the technical roadmap and own the
  implementation of a defined feature set or workstream for
  the Hypershield platform. Translate high-level priorities
  into technical requirements, success metrics (SLIs/SLOs),
  and execution plans.

  Collaborate with Engineering, Security, and Data teams to
  design and build dynamic scalability and a hardened security
  posture. Clarify technical tradeoffs, manage cross-
  functional dependencies, track risks, and proactively
  resolve blockers within the development lifecycle.

  Support platform readiness and operational excellence by
  assisting with technical documentation and resolving complex
  customer escalations. Monitor platform health, stability,
  and adoption post-deployment, using telemetry and incident
  data to recommend architectural improvements.

  Use AI tools responsibly to accelerate software development,
  code analysis, and prototyping. Share engineering best
  practices and design patterns that strengthen team
  collaboration and improve overall platform quality.


  Minimum Qualifications

  - 9+ years' experience building software systems in one or
    more programming languages such as Go, Python.
  - Technical leadership experience in a software engineering
    environment
  - Agile experience
  - Bachelor's degree with 11+ years of related experience,
    Master's with 9+ years, PhD with 4+ years, or equivalent
    combination of education and experience. In lieu of a
    degree, a minimum of 10 years of relevant professional
    experience

  Preferred Qualifications

  - Proficiency in Computer Science foundational areas,
    including algorithms, systems, databases, performance
    engineering and security architecture
  - Experience with large-scale event processing architectures
  - Experience in systems programming and performance
    engineering
  - Experience working with security architecture and
    distributed systems
  - Kubernetes experience using Kubernetes Cluster API, Gateway
    APIs Operators
  - Experience deploying solutions for cloud architectures for
    AWS, Azure, or GCP
  - A professional who embraces agile methodologies that involve
    rapid prototyping by feedback gathered from customers,
    peers and technical solution architects, customer
    enablement engineers and support engineers.
  - A technically skilled leader who enjoys architecting,
    designing, analyzing, and brainstorming solutions that
    improve the product and produce customer-facing
    capabilities



  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
