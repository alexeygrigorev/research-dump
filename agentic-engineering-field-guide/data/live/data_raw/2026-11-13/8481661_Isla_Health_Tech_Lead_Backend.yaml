  Tech Lead (Backend)

  🕙 Role details: This is a full time role

  💷 Salary: €92,000 - €115,000

  🌍 Location: Ireland - Remote

  The role

  We are looking for a Platform Engineering Lead to own the
  technical implementation and scalability of our cloud
  infrastructure. As the technical authority for our backend
  team, you will be responsible for ensuring our Digital
  Pathway Platform is architected for seamless scalability
  across international health systems.

  This is a pivotal leadership position where you will drive
  technical excellence, directly impacting the lives of
  millions of patients by enabling a new asynchronous and
  remote operating model for healthcare.

  What You’ll Do

  Why This Role is Unique

  We are building a new operating model for healthcare in
  which care is delivered remotely, asynchronously and
  increasingly personalised. You will be building the
  infrastructure for how we deliver this shift. This role
  offers the rare opportunity to exercise true technical
  ownership over a mission-critical platform.

  You will have the autonomy to set the technical pace, drive
  architectural decisions, and foster a culture of engineering
  excellence across the backend organisation. If you are a
  builder who thrives on high-stakes platform stability and
  wants to lead a team through 100% YoY growth, this role
  provides a level of agency and impact rarely found in later-
  stage environments.

  Who We Are

  Isla Health is a venture-backed healthtech startup,
  supporting our partners across the UK, EU and
  internationally beyond this. We have built a new category of
  healthcare technology which we refer to as the Digital
  Pathway Platform (DPP). Founded in 2019, we now support 25%
  of NHS Trusts and see over 2 million submissions on the
  platform each year.

  As a company we are all laser focused on enabling a scalable
  model of care which empowers healthcare staff and improves
  patient outcomes. The DPP supports this by setting up
  digital pathways which are remote-first and asynchronous. As
  pathways harness sophisticated automation, clinical
  algorithms and intelligent cohorting, patients always take
  the optimised route through their pathway, thereby
  delivering a step change in clinical productivity.

  The Team

  You will be joining a lean & high performing engineering
  organisation. We value pace, but also hold really high
  quality standards for each other.

  - The structure: You will lead the Backend/Platform team. As
    the lead, you will report directly to our Director of
    Engineering.
  - Cross-functional collaboration: You’ll work in a tight loop
    with our Product, Design, and Frontend teams.
  - Our tech & tools:

  Requirements

  Benefits

  🏡 Work from home - this is a remote first role

  🕜 Flexible working times

  🌍 Work abroad for up to 90 days per year

  🏖️ 25 days annual leave on top of Irish bank holidays. Plus,
  take your birthday off and another significant day off of
  your choice 🎂

  🍜 Quarterly meal on us enjoy up to £75 to treat friends or
  family

  🧘‍♀️ Private medical insurance

  🎉 Enhanced parental leave to support your family when it
  matters most

  🎳 Quarterly team socials based in London

  📚 An annual learning budget to support your growth

  💗 Work with purpose - you'll be delivering social impact
  through improved patient healthcare

  🚀 Join at an exciting stage - we're a well-funded, rapidly
  growing health tech company tackling a global challenge

  🌱 Help shape the future of Isla - your ideas won't disappear
  into layers of management. You'll have real ownership, real
  impact, and help define how we grow the business

  ------

  What is the hiring process for this role at Isla?Hiring
  Process

  Interviewing with us for the Lead Backend role will be split
  into 4 stages (all conducted virtually):

  1) A screening interview with one of our People Operations
  team

  2) A take home technical task

  3) A technical interview with two of our Engineers. This
  will be a strategy deep dive: We will run through a scenario
  to challenge you on your decision making, the speed of your
  technical understanding, your communication and your out-of-
  the-box thinking

  4) A final interview with our Director of Engineering
  (Dylan) and CTO/Co-founder (James)

  Diversity and Inclusion

  Isla is an equal opportunity employer and is committed to
  building an inclusive and diverse team. We encourage all
  qualified candidates to apply. Isla does not discriminate
  against anyone on the basis of their race, gender,
  disability, religion, national origin, age, or any other
  protected category. We choose to celebrate our team’s
  differences and see them as one of our most valuable assets.

  Recruitment is not one-size-fits-all and we're happy to
  tailor our hiring process to better meet the needs of
  individual applicants. Please email recruitment@isla.health
  with any requests for support.
