description: |
  Do you enjoy turning complex business challenges into
  elegant, scalable technology? Join our team as a Back-end
  Architect and play a key role in designing the systems
  behind high-impact digital solutions. In this role, you
  will:

  • Define and establish the back-end architectural vision and
  ensure it aligns with business objectives and front-end user
  experience.

  • Design and implement high-performance, scalable server-
  side logic and database structures.

  • Lead the evaluation and selection of back-end
  technologies, frameworks, and tools that meet the needs of
  the business.

  • Collaborate with front-end architects, developers, and
  product managers to ensure seamless integration and
  consistency across the full stack.

  • Establish coding standards, best practices, and
  development methodologies for back-end development.

  • Mentor and provide technical leadership to back-end
  development teams, promoting a culture of quality and
  continuous improvement.

  • Oversee the security aspects of back-end systems, ensuring
  data protection and compliance with relevant regulations.

  • Optimize existing back-end systems for speed, scalability,
  and stability.

  • Stay up-to-date with emerging trends and advancements in
  back-end development and architecture.

  • Facilitate knowledge sharing and technical discussions
  within the team to foster innovation and problem-solving.

  Requirements

  - • Previous experience as a Back-end Architect in B2B
    commerce environments.
  - • Experience migrating B2B Commerce from CCRZ to LWR
  - • Demonstrated success in deploying enterprise-grade
    solutions with minimal custom coding.
  - • Deep understanding of B2B commerce workflows, pricing
    models, and customer hierarchies.
  - • Strong architectural and system design skills in a back-
    end context.
  - • Excellent problem-solving abilities and analytical
    mindset.
  - • Proficiency in developing and optimizing large-scale,
    high-availability systems.
  - • Leadership skills with the ability to mentor and guide
    development teams.
  - • Strong communication skills to effectively collaborate
    with cross-functional teams and articulate technical
    concepts.
  - • Strong grasp of configuration management principles and
    best practices.

  OSF Digital is proud to be an equal opportunity employer,
  where you can bring your whole self to work. Join an
  inclusive and passionate community of professionals who help
  bring about digital transformation for businesses around the
