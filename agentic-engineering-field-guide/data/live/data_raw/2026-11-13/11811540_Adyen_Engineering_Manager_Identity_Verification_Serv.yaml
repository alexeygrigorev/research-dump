description: |
  This is Adyen

  Adyen provides payments, data, and financial products in a
  single solution for customers like Meta, Uber, H&M, and
  Microsoft - making us the financial technology platform of
  choice. At Adyen, everything we do is engineered for
  ambition.

  For our teams, we create an environment with opportunities
  for our people to succeed, backed by the culture and support
  to ensure they are enabled to truly own their careers. We
  are motivated individuals who tackle unique technical
  challenges at scale and solve them as a team. Together, we
  deliver innovative and ethical solutions that help
  businesses achieve their ambitions faster.

  Why join Identity & Verification Services

  Every business that joins Adyen has to be verified before it
  can accept its first payment. Identity & Verification
  Services is the team that makes that possible. It is part of
  Adyen’s Unified Platform organization, and is responsible
  for:

  - the systems that verify the businesses on our platform;
  - the legal entity data behind them, across every jurisdiction
    and merchant type we serve.

  The team has built the verification framework that powers
  our KYC processes, flexible enough to run hundreds of
  different checks. These include automated checks with third-
  party data providers, document reviews, and checks handled
  by our operations teams.

  What you’ll do

  - Lead, coach and grow a team of 7 engineers.
  - Own the team’s execution and roadmap together with Product,
    making sure the team delivers on what matters most.
  - Act as a technical partner to your engineers. You’ll engage
    in system design and architecture discussions, ask the
    right questions and validate key decisions. This is not a
    hands-on coding role, but it is a technical one.
  - Shape how the platform scales. That includes migrating
    existing checks, introducing versioning, simplifying how
    new checks are built, and opening the platform up to use
    cases beyond KYC.
  - Work with leaders across Unified Platform and the product
    teams in other organizations who depend on verification,
    aligning with them on priorities and technical direction.
  - Create an environment where engineers feel safe to take
    ownership and run with their own initiatives, with clear
    goals and priorities.
  - Hire and develop engineers who thrive in a fast-moving
    environment.

  Your first six months

  In your first month you’ll focus on learning the platform,
  the domain and the people. You’ll build relationships with
  your team, Product and partner teams. By three to six
  months, you’ll own the team’s execution and roadmap, have
  earned the team’s trust, and be shaping how the platform
  should scale next.

  Who you are

  - An experienced engineering manager who leads by empowering
    people. You bring clarity, give engineers room to own
    their work, and build a team where people feel safe to
    speak up.
  - Technically credible with senior engineers. You come from a
    strong backend background and understand distributed
    systems well enough to review designs, challenge trade-
    offs and spot risks.
  - Experienced with systems built for meaningful scale, in an
    organisation beyond the early-startup stage.
  - Comfortable taking ownership quickly in an established team,
    and building trust while doing it.
  - A strong collaborator who works well with Product and with
    peer engineering leaders, and can align stakeholders
    around technical decisions.
  - A clear communicator who can explain complex technical
    topics to both engineers and non-technical audiences.

  Minimum qualifications

  - 2+ years of people management experience leading software
    engineering teams, including performance management,
    career development and hiring.
  - 7+ years of experience in software engineering, primarily in
    backend development.
  - Experience with distributed systems running in production at
    scale, in any modern backend language.

  Nice to have

  - Experience with Java.
  - Exposure to KYC, identity verification, onboarding or
    compliance-driven systems.
  - Experience building B2B platforms.

  Diversity, Equity, and Inclusion at Adyen

  We actively seek different perspectives to sharpen our
  ideas. Our unique culture is a product of our diverse
  backgrounds and experiences. No matter who you are or where
  you’re from, you’re welcome to be your true self at Adyen.

  If you need accommodations or support during the recruitment
  process to perform at your best, you’ll have the opportunity
  to let our team know in your application. We encourage
  people from all backgrounds and abilities to apply.

  What’s next?

  Ensuring a smooth and enjoyable candidate experience is
  critical for us. We aim to get back to you regarding your
  application within 5 business days. Our interview process
  tends to take about 4 weeks to complete, but may fluctuate
  depending on the role. Learn more about our hiring process
  here. Don’t be afraid to let us know if you need more
  flexibility.

  This role is based out of our Amsterdam office. We are an
  office-first company and value in-person collaboration; we
  do not offer remote-only roles.
