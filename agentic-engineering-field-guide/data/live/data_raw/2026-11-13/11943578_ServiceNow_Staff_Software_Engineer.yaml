description: |
  Company Description

  It all started when engineer Fred Luddy wrote code that
  automated a tedious task for his coworker, Phyllis. She
  cried tears of joy. That moment inspired Fred to build a
  company that could do that for everyone—freeing people from
  busywork so they could focus on meaningful work. Today,
  ServiceNow is the AI control tower for business reinvention.
  Our ServiceNow AI platform brings together any AI, any data,
  and any workflow— helping 85% of the Fortune 500® work
  smarter, faster, and better. We're building an AI-native
  culture where technology and talent are unstoppable
  together. And we're just getting started.

  Join us to put AI to work for people.



  Job Description

  As a Staff Software Engineer, within the Enterprise
  Integration team, you'll provide technical leadership and
  strategic direction in building state of the art
  applications and integration solutions using ServiceNow
  platform and related technologies. You’ll partner closely
  with Product Owners, Architects, Business Analysts, and
  cross-functional IT teams to design, and implement scalable
  robust solutions.



  What You’ll Do:

  - Build high-quality, scalable, clean, and reusable
    applications and integration solutions using ServiceNow
    platform and related technologies.
  - Play a lead role to drive end to end design and
    implementation of features with a focus on the development
    of our Analytical Product (Javascript & Java).
  - Own critical technical initiatives from planning to
    deployment, continuously refining and improving existing
    applications and services.
  - Explore the latest ServiceNow features and evaluate them for
    adoption
  - Develop proof-of-concept and prototype solutions to validate
    architectural, design decisions and demonstrate
    feasibility.
  - Establish and promote best practices around platform
    development, integrations, and performance optimization.
  - Mentor and guide engineers, fostering technical excellence
    and professional growth within the team.

  Qualifications

  What we are looking for

  We are looking for a forward-thinking Staff Software
  Engineer, to drive the next phase of our platform evolution,
  focusing on intelligent automation, scalable integrations,
  and reusable applications.

  To be successful in this role you will need:

  - Experience in leveraging or critically thinking about how to
    integrate AI into work processes, decision-making, or
    problem-solving. This may include using AI-powered tools,
    automating workflows, analyzing AI-driven insights, or
    exploring AI's potential impact on the function or
    industry.
  - Typically requires a minimum of 10+ years of related
    experience delivering end-to-end enterprise-grade
    solutions
  - Expert-level proficiency in Javascript, with good experience
    of Java or a similar OOP language.
  - Proficient in modern UI frameworks such as React or web
    component based frameworks, with strong JavaScript
    development skills.
  - Proven capability in building and maintaining secure
    applications and integrations with a strong emphasis on
    scalability and security best practices.
  - Demonstrated ability to lead technical initiatives and
    collaborate across teams without formal authority

  Good to have:

  - Experience using AI Coding tools such as Claude or Codex.
  - Experience with backend disciplines such as RESTful API
    design, design patterns and database technologies.

