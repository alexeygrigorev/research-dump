title: Lead Software Engineer - Senior Android Engineer
company: JPMorganChase
location: New York, USA
work_type: FULL_TIME
company_size: 289,097 Employees
description: |
  You’ll deliver features end to end in an Agile environment,
  communicate progress to teammates and stakeholders, and help
  shape reliable, well-designed mobile products. You’ll also
  have opportunities to explore how AI can improve mobile
  experiences and engineering workflows.

  As a Lead Software Engineer - Senior Android Engineer at
  JPMorgan Chase within Consumer and Community Banking -
  Mobile Payments team, you’ll design, build, and maintain
  high-quality Android applications that deliver meaningful
  experiences for customers and businesses. You’ll work with a
  collaborative team of technologists across the full software
  development lifecycle—from design and implementation to
  testing, release, and ongoing improvement.

  Job responsibilities

  - Design, develop, test, and maintain Android applications
    using Kotlin and Jetpack Compose.
  - Build accessible, responsive interfaces and implement clean
    architectures such as MVVM or MVI.
  - Integrate REST APIs and work with remote data in formats
    such as JSON.
  - Use Android Studio debugging and profiling tools to
    investigate and resolve performance and reliability
    issues.
  - Write unit tests and use code coverage tools to maintain
    software quality.
  - Contribute to code reviews, technical discussions, and Agile
    planning.
  - Use AI-assisted development tools thoughtfully to support
    tasks such as code exploration, test generation, and
    documentation.
  - Keep the team and stakeholders informed about development
    progress, risks, and dependencies.



  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 5+ years applied experience
  - Experience designing, developing, and maintaining Android
    applications, as well as experience with Android testing
    tools and frameworks, including JUnit and Mockito.
  - Strong knowledge of Kotlin and the Android ecosystem; Java
    experience is also valuable, and experience with Kotlin
    Coroutines and asynchronous programming.
  - Experience with Jetpack Compose and modern Android UI
    development.
  - Experience integrating RESTful APIs and working with JSON
    and remote data.
  - Familiarity with architectural patterns such as MVVM and
    MVI, and design patterns such as those described by the
    Gang of Four.
  - Working knowledge of Git or a comparable version-control
    platform.
  - Understanding of mobile UI fundamentals, including layouts,
    navigation, and animations.
  - Familiarity with Kotlin Coroutines, RxJava, or LiveData in
    production applications.
  - Experience with Dagger or another dependency-injection
    framework.
  - Experience with CI/CD processes and tools such as Jenkins.



  Preferred qualifications, capabilities, and skills

  - Familiarity with prompt engineering, including writing clear
    instructions, providing context, and refining prompts to
    improve results.
  - Experience using AI-assisted coding tools to support
    development while reviewing and validating generated
    output.
  - Understanding of how to test AI-generated code, including
    checking for correctness, security, maintainability, and
    edge cases.
  - Experience integrating generative AI or machine-learning
    capabilities into Android applications through APIs or on-
    device frameworks.
  - Familiarity with evaluating AI features for quality,
    latency, reliability, and user experience.

  About Us

  Chase is a leading financial services firm, helping nearly
  half of America’s households and small businesses achieve
  their financial goals through a broad range of financial
  products. Our mission is to create engaged, lifelong
  relationships and put our customers at the heart of
  everything we do. We also help small businesses, nonprofits
  and cities grow, delivering solutions to solve all their
  financial needs.

  We offer a competitive total rewards package including base
  salary determined based on the role, experience, skill set
  and location. Those in eligible roles may receive
  commission-based pay and/or discretionary incentive
  compensation, paid in the form of cash and/or forfeitable
  equity, awarded in recognition of individual achievements
  and contributions.  We also offer a range of benefits and
  programs to meet employee needs, based on eligibility. These
  benefits include comprehensive health care coverage, on-site
  health and wellness centers, a retirement savings plan,
  backup childcare, tuition reimbursement, mental health
  support, financial coaching and more. Additional details
  about total compensation and benefits will be provided
  during the hiring process.

