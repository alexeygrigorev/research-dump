description: |
  About Us:  At eCapital, we are on a mission to ignite growth
  and empower businesses across North America and the U.K. by
  accelerating their access to capital. As a leading financial
  company, our extensive expertise and forward-thinking
  technology creates customized, cutting-edge solutions for
  clients in over 80 industries. Our business model has been
  focused on growth, and through continued expansion through
  strategic acquisition, we have built a reputation as the
  strongest alternative lender in the market. We have also
  been proud to be recognized as a ‘Great Place to Work’ by
  the Secured Finance Network, named as a prestigious Inc.
  Magazine Power Partner, and celebrated as a ‘Most Innovative
  Company’ by ABF Journal, all thanks to our diverse and
  dynamic team who is the cornerstone of our success. To
  continue to innovate and find better solutions for our
  company and clients, we need bright minds, enthusiastic
  advocates, and savvy industry professionals. By joining our
  team, you will have the opportunity to unleash your
  potential, challenge yourself, and experience the thrill of
  being part of a rewarding culture. Are you ready to make an
  impact and help us shape the future of finance? The
  Opportunity: The Front-End Web Developer will be responsible
  for building, maintaining, and optimizing responsive,
  conversion-focused web pages that support eCapital’s
  marketing goals. This role blends front-end development,
  visual design awareness, user experience, and marketing
  technology to create digital experiences that are
  professional, intuitive, high-performing, and aligned with
  brand standards. The ideal candidate has strong front-end
  development skills, a solid understanding of modern web best
  practices, and the ability to translate creative concepts,
  wireframes, and marketing objectives into polished,
  functional web experiences. Responsibilities:

  - Build, maintain, and optimize responsive web pages, landing
    pages, and digital campaign assets.
  - Support website updates, page builds, content changes,
    technical improvements, and ongoing optimization efforts.
  - Translate marketing objectives and design concepts into
    clean, user-friendly web experiences that drive engagement
    and conversions.
  - Collaborate with marketing, content, SEO, design, and
    development teams to ensure web projects are delivered
    accurately and on time.
  - Ensure all web pages align with eCapital’s brand guidelines,
    design standards, and digital best practices.
  - Optimize pages for mobile responsiveness, accessibility,
    usability, site speed, browser compatibility, and
    performance.
  - Apply front-end best practices using HTML, CSS, JavaScript,
    and content management systems.
  - Support CMS development, page templates, reusable
    components, forms, integrations, and website
    functionality.
  - Assist with A/B testing, conversion rate optimization,
    analytics tracking, and user experience improvements.
  - Troubleshoot layout issues, front-end display errors,
    browser compatibility problems, form issues, and CMS-
    related updates.
  - Stay current on front-end development trends, UX principles,
    accessibility standards, SEO, performance optimization,
    and digital marketing best practices.

  Qualifications:

  - 4+ years of experience in front-end web development, web
    design, digital development, or a related role.
  - Strong proficiency in HTML, CSS, and JavaScript.
  - Strong understanding of responsive web development and
    mobile-first best practices.
  - Experience working with WordPress or similar content
    management systems.
  - Familiarity with CMS templates, page builders, plugins,
    forms, and website integrations.
  - Strong visual design awareness with attention to typography,
    spacing, hierarchy, layout, and brand consistency.
  - Experience working with design tools such as Figma, Adobe
    Creative Suite, Canva, or similar platforms.
  - Understanding of SEO, website performance, accessibility,
    analytics tracking, and conversion-focused web best
    practices.
  - Ability to manage multiple projects and prioritize deadlines
    in a fast-paced environment.
  - Strong communication skills and the ability to collaborate
    with cross-functional teams.
  - A portfolio of web pages, landing pages, websites, or
    digital development work is preferred.
  - Understanding of UX principles, wireframing, user journeys,
    and how design decisions impact website performance.

  Nice to Haves:

  - Experience building websites or landing pages for B2B,
    financial services, fintech, or professional services
    brands.
  - Familiarity with marketing automation platforms, CRM
    systems, analytics tools, A/B testing platforms, and how
    they integrate with websites.
  - Experience creating campaign landing pages for paid media,
    email marketing, SEO, and lead generation.
  - Working knowledge of back-end web concepts, including CMS
    architecture, APIs, databases, forms, integrations,
    hosting environments, and basic server-side functionality.
  - Familiarity with version control, staging environments, QA
    testing, and developer handoff processes.
  - Experience supporting technical SEO, schema markup, site
    speed improvements, and web performance optimization.

  What we Bring:

  - $70,000-$90,000 Annually
  - Annual Bonus Incentives
  - PTO
  - Health, Dental, and Life Benefits
  - RRSP Matching
  - Abundant professional development opportunities at a growing
    and thriving Fintech company!

  eCapital Culture: At eCapital, we're not just a funding
  provider—we're a strategic partner built for what's next.
  Our culture is defined by innovation, scalability, and
  personalized service. We value:

  - Agility: We adapt quickly to changing market conditions and
    customer needs.
  - Relationships: We put our clients' needs at the center of
    everything we do, and we believe the best results come
    from diverse teams working together.
  - Accountability: We hold ourselves to the highest standards
    in all aspects of our work.
  - Innovation: We constantly push boundaries to create better
    solutions for our clients.

  We offer a dynamic work environment where you'll have the
  opportunity to make a significant impact on our business and
  the SMBs we serve. Join us in revolutionizing how businesses
  access and manage capital in the digital age. eCapital
  values diverse experiences and backgrounds. We encourage all
  qualified candidates to apply, regardless of race, color,
  religion, gender, sexual orientation, national origin,
  genetics, disability, age, or veteran status. AI Statement:
  eCapital uses AI-enabled tools within our applicant tracking
  system to support resume screening by comparing
  qualifications by job requirements. Final hiring decisions
  and resume reviews are always conducted by our recruiters.
