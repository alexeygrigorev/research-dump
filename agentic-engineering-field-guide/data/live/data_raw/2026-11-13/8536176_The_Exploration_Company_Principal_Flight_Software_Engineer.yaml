description: |
  Here at The Exploration Company, we are building spacecraft
  for humanity.

  We are looking for an experienced and hands-on Principal
  Flight Software Engineer (Team Lead) to lead the development
  at one of the key teams working on the Flight Software stack
  for Nyx. In this critical role, you will guide a team of
  talented engineers in building and validating the software
  systems that control and operate the spacecraft: from launch
  to docking, re-entry, and recovery.

  You will combine deep technical expertise with strong
  leadership to deliver high-reliability software under tight
  mission timelines. You will collaborate with the other
  Flight Software teams and the Flight Software Lead to drive
  architectural decisions, enforce rigorous testing standards,
  and foster a culture of ownership, simulation-driven
  development, and cross-functional collaboration with other
  subsystems such as GNC, avionics, propulsion, and mission
  operations.

  This is a high-impact leadership position where your
  decisions directly influence mission success.

  Key Responsibilities

  - Lead and mentor a high-performing team of flight software
    engineers in the design, implementation, testing, and
    integration of spacecraft software.
  - Own the technical roadmap and execution for flight software,
    including architecture, modularity, and interfaces across
    avionics and vehicle subsystems.
  - Set high standards for code quality, test coverage,
    simulation fidelity, and system robustness.
  - Drive development in modern C++ (C++17 or newer) and Python,
    enabling safe and efficient spacecraft operations in real-
    time environments.
  - Oversee the development of test infrastructure, including
    unit, integration, and hardware-in-the-loop (HIL) testing,
    to ensure flight readiness.
  - Own key areas of the Nyx Flight Software, such as
    Simulation, Embedded software and firmware, specific
    subsystems… in accordance with your experience and
    expertise.
  - Collaborate closely with teams across your team key
    stakeholders, for example systems engineering, GNC,
    propulsion, avionics, and mission operations to define
    requirements, resolve interface challenges, and validate
    end-to-end behavior.
  - Participate in and lead code reviews, software audits,
    flight software simulations, and mission rehearsals.

  What we would love to see from you

  - Strong proficiency in modern C (Embedded/Firmware) or C++
    (C++17 or newer, spacecraft software).
  - Python experience.
  - Experience with real-time systems, embedded development,
    simulation, or spacecraft software.
  - Demonstrated ability to take ownership of complex technical
    problems and drive them to resolution.
  - Familiarity with software testing methodologies and
    simulation tools.
  - Excellent cross-disciplinary communication and collaboration
    skills.
  - Good understanding of math & physics.
  - Focus on detail, quality, and testing.
  - Experience with CI/CD systems and build systems in general.
    Bazel is a plus.

  Nice to have

  - Knowledge of safety critical and real-time critical software
    and familiarity with RTOS.
  - Good understanding of communication protocols such as:
    TCP/IP, UART, CAN Bus and serialization.
  - Experience with automotive or flight software frameworks.
  - Background in orbital mechanics, spacecraft systems,
    simulation, or space mission lifecycle.
  - Experience with industry standards such as AUTOSAR, ECSS,
    DO-178.

  Why you should join us!

  What makes us special here at The Exploration Company and
  why we think you will enjoy working here is:

  - We’re Agile - we make decisions fast whilst keeping our
    goals and systems in mind
  - We’re Open and Collaborative - we are transparent about
    risks and obstacles, so that we can cooperate to overcome
    them
  - We have a lot of Fun - we refuel our energy knowing we are
    democratising space. It’s a wonderful and rare
    opportunity, are YOU up for the challenge?

  We'd love to hear from you if you wish to be a part of our
  journey. Please submit your CV now for immediate
  consideration and we will be in touch shortly.

  The Exploration Company is an equal opportunity employer and
  values diversity. We do not discriminate based on race,
  religion, colour, national origin, gender, sexual
  orientation, age, marital status or disability status.
  Relocation assistance is provided for those willing to
  relocate including visa sponsorship where applicable.

  All offers are contingent upon the successful completion of
  a background check, which will be subject to the country,
  role, and project you applied for. By submitting your
  application, you acknowledge and agree that any offer of
  employment may be conditional upon successful condition of
  this check. The Exploration Company partners with Zinc Work
  Limited located in the UK (Zinc), a third-party provider, to
  ensure this process as efficient and transparent as
  possible.  If applicable, you will receive an email from
  Zinc upon acceptance of your offer with a link to a secure
  portal where you can provide the required information to
  Zinc.
