description: |
  Talon.One, an Adyen company, is the most powerful incentives
  engine that unifies loyalty, personalized promotions and
  offer management into a single platform. Built for
  enterprise scale and security, Talon.One helps businesses
  design and deliver incentives that drive real customer
  behavior.

  Today, over 300 of the world’s most-loved brands including
  Sephora, Gymshark and Costa Coffee work with Talon.One to
  turn their incentives into a reliable growth engine.

  ABOUT THE TEAM:

  Our development team consists of specialists in frontend,
  backend, QA, product, and visual design. We work in small
  cross-functional teams that give everybody insight and
  hands-on experience of what everyone else is doing. Each
  team is self-sustained, autonomous, and responsible for a
  specific feature or area in our platform. We believe in
  strong collaboration, open communication, and mentoring to
  allow bi-directional growth. We are working to make
  Talon.One an inclusive workplace because we believe it is
  the right thing to do and because we want to have a positive
  impact on the entire tech industry.

  We are currently looking for a Senior Backend Engineer to
  join our development teams. You will work closely with our
  product people to design the right solutions to our
  challenging problems while collaborating, mentoring, and
  supporting the other team members.

  For this position, we need professionals who are already
  based in Berlin or willing to move to Berlin.

  ONCE YOU ARE HERE YOU WILL:

  - Be a crucial member in a small cross-functional team (a
    squad)
  - Collaborate closely with Product Manager and Tech Lead
    during roadmap discussions
  - Contribute effectively during all Scrum rituals,
    facilitation of process maturity increments, and
    engineering best practices initiatives
  - Provide valuable inputs during Refinement and Solution
    Design sessions and be able to lead feature development
    independently
  - Regularly participate in code reviews and provide
    constructive feedback
  - Consistently monitor the maintenance of quality standards
    and proactively recommend engineering or process
    improvements
  - Offer technical/soft guidance to Junior engineers and
    participate in Mentorship Programs
  - Participate in cross-squad (Backend Guild) brainstorming
    sessions and problem-solving discussions
  - Propose and own technical initiatives toward
    performance/scale/maintenance improvements

  WHAT WE NEED YOU TO BRING TO THE TABLE:

  - 6+ years of previous experience as a Backend Developer with
    focus on Golang
  - In-depth knowledge of REST API design, PostgreSQL, and
    Testing Techniques
  - Experience building scalable, maintainable, and performant
    large-scale applications
  - Experience designing and developing complex architectures,
    including monolithic and microservice architecture
  - Strong tendency towards implementing modern best practices
    like pair-programming sessions, unit and integration
    tests, adaptation of AI and automation, refactoring, SOLID
    principles, security best practices, documentation as
    code, regular knowledge sharing, etc.
  - Big-picture thinking; You collaborate with non-developers to
    clarify requirements and help plan projects, with an eye
    on the overall impact on the business & product
  - Proactive and constructive approach to support/mentor junior
    members of the team
  - A willingness to learn about and contribute to the whole
    stack is essential
  - A team-first attitude; As a group, we strive to leave egos
    at home
  - Empathy for your customers and your colleagues

  ABOUT TECHNOLOGY:

  - Kubernetes running on Google Cloud
  - PostgreSQL
  - We use Go for our API, core logic, and internal tooling
  - TypeScript, React, Redux, and CSS modules for our web
    application
  - Cypress for automated end-to-end testing
  - Other odds & ends in JavaScript and shell script

  WHAT'S IN IT FOR YOU:

  - A product & engineering team, now part of Adyen, building
    the incentives engine behind some of the world’s biggest
    brands
  - Adyen+, a significant monthly allowance to spend on whatever
    matters most to you and your wellbeing
  - 28 days of paid annual leave
  - €115 monthly commuting allowance when you join us in the
    office 3 days per week
  - 25% employer contribution to your pension
  - Annual all-company gathering at Adyen’s headquarters in
    Amsterdam, plus regional team events throughout the year
  - Opportunity to connect in person at Adyen offices across 29
    locations worldwide
