description: |
  Company :enGenJob Description :

  JOB SUMMARY

  ***CANDIDATE MUST BE US Citizen (due to contractual/access
  requirements)***

  This job is an integral member of an agile software engineer
  team responsible for building scalable software applications
  across all digital channels to serve our customers.
  Responsible for taking an enterprise-wide, architectural
  view of the solutions and the technical execution of
  products using the technical stack that best meets the needs
  of the platform. The incumbent, and team, will be involved
  in every aspect as a part of the software application build
  process from idea generation, business analysis, technical
  design and software development using the latest
  technologies and design patterns.

  ESSENTIAL RESPONSIBILITIES

  - Responsible for designing and creating engineering
    specifications for software applications and programs.
    Responsible for writing code that adheres to coding
    standards. Perform code reviews.
  - Responsible for idea generation, exploring and suggesting
    appropriate technical solutions to achieve the required
    product features, as well as monitoring technical process
    against project plan while safeguarding functionality,
    scalability and performance.
  - Part of an agile work team and responsible for participating
    in all scrum ceremonies, assisting in sprint planning and
    completing required sprints in the development through
    final execution of software applications/programs.
    Communicate any issues/blockers to the Scrum Master in a
    timely manner.
  - Help in story creation (i.e. DoD, Acceptance Criteria,
    estimation). Creates Tasks for their stories in applicable
    software (ex: RTC or Jira), and updates status and
    assignment accordingly
  - Monitor work against production schedule and provide
    progress updates and report any issues or technical
    difficulties to senior developers/principals on a regular
    basis.
  - Other duties as assigned or requested.

  EDUCATION

  Required

  - Bachelor's Degree in Computer Science, Computer Engineering
    or closely related field

  Preferred

  - Master's Degree in Computer Science, Computer Engineering or
    a related field

  EXPERIENCE

  Required

  - 1  year proficiency in design and analysis of algorithms,
    data structures, and design patterns in the building and
    deploying of scalable; highly available systems

  To include:

  - 1 years experience in at least one modern programming
    languages (Java, Python, JavaScript, ACE, IIB/ITX,
    Informatica preferred), and experience with at least two
    of the following: React, Angular v4+, NodeJS, NoSQL
    databases, HTML5, CSS, Google Cloud Platform or Amazon Web
    Services.
  - 1 years of understanding of web services technologies such
    as REST, HTTPS, JSON

  Preferred

  - 3 years with one or more general purpose programming
    languages including but not limited to: Java, Python
    (Django/Flask), C/C++, C#, Objective C, JavaScript, or Go
  - 3+ years of experience developing integrations using Oracle
    Integration Cloud (OIC).
  - 3+ years of experience with Oracle Platform as a Service
    (PaaS) technologies and cloud-native application
    development.
  - 3+ years of experience working with Oracle Autonomous
    Transaction Processing (ATP) databases.
  - 2+ years of experience developing applications using Oracle
    APEX and/or Visual Builder Cloud Service (VBCS).
  - Experience designing and implementing REST and SOAP
    integrations with Oracle Fusion Cloud and external
    systems.
  - Experience with Oracle Cloud Infrastructure (OCI) services
    and API-led integration architectures.
  - Experience supporting enterprise-scale integrations and
    business-critical cloud applications.
  - Experience with Oracle Application Development Framework
    (ADF) is preferred but not required.

  To Include:

    - 3 years in defining system architectures and exploring
      technical feasibility trade-offs for optimizing short
      term execution while planning for long term technical
      capabilities
    - 3 years of working with a variety of technology systems,
      designing solutions or developing applications in
      healthcare
    - 3 years of translating design mockups, prototypes and user
      stories into working applications
    - 3 years of ability to produce code that is fault-tolerant,
      efficient, and maintainable

  LICENSES or CERTIFICATIONS

  Required

  - None

  Preferred

  - Oracle Integration Cloud (OIC) Certification preferred.
  - Oracle Cloud Infrastructure (OCI) Certification preferred.

  - Oracle APEX Developer Certification preferred

  SKILLS

  - Demonstrated ability to achieve stretch goals in a highly
    innovative and fast paced environment
  - Have experience working with agile methodology of scrum
  - Interest and ability to learn other programming languages as
    needed
  - Knowledge of professional software engineering practices &
    best practices for the full software development life
    cycle, including coding standards, unit testing, code
    reviews, source control management, build processes,
    testing, and operations
  - Strong track record in designing and implementing large
    scale consumer facing applications
  - Strong sense of ownership, urgency, and drive
  - Demonstrated passion for user experience and improving
    usability
  - Experience and willingness to mentor junior engineers and
    help develop their skills and leadership

  Language (Other than English)

  None

  Travel Requirement

  0% - 25%

  PHYSICAL, MENTAL DEMANDS and WORKING CONDITIONS

  Position Type

  Office-based

  Teaches / trains others regularly

  Rarely

  Travel regularly from the office to various work sites or
  from site-to-site

  Occasionally

  Works primarily out-of-the office selling products/services
  (sales employees)

  Never

  Physical work site required

  Yes

  Lifting: up to 10 pounds

  Constantly

  Lifting: 10 to 25 pounds

  Rarely

  Lifting: 25 to 50 pounds

  Never

