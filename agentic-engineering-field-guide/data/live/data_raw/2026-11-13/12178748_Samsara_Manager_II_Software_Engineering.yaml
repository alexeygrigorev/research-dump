description: |
  Who we are

  Samsara (NYSE: IOT) is the pioneer of the Connected
  Operations™ Cloud, which is a platform that enables
  organizations that depend on physical operations to harness
  Internet of Things (IoT) data to develop actionable insights
  and improve their operations. At Samsara, we are helping
  improve the safety, efficiency and sustainability of the
  physical operations that power our global economy.
  Representing more than 40% of global GDP, these industries
  are the infrastructure of our planet, including agriculture,
  construction, field services, transportation, and
  manufacturing — and we are excited to help digitally
  transform their operations at scale.

  Working at Samsara means you’ll help define the future of
  physical operations and be on a team that’s shaping an
  exciting array of product solutions, including Video-Based
  Safety, Vehicle Telematics, Apps and Driver Workflows, and
  Equipment Monitoring. As part of a recently public company,
  you’ll have the autonomy and support to make an impact as we
  build for the long term.

  Recovering entrepreneur? Frustrated with bureaucracy? Want
  to build the team and write the roadmap, not inherit one?

  We’re hiring Engineering Managers across multiple verticals.
  The nice thing about growing 30%+ at ~$2.1B ARR is that we
  need great engineering leaders everywhere, and we have the
  room to shape the team around the right person. You lead
  like a founder. We give you the platform to do it at scale.

  About the role:

  Samsara (NYSE: IOT) sits at the center of hardware,
  software, AI, and the physical world. The platform processes
  25+ trillion data points annually from IoT sensors, cameras,
  and connected devices across thousands of organizations, and
  that dataset is compounding: it grew from 4 trillion to 25+
  trillion in four years. We’re still early in turning that
  data into the products that will define how physical
  operations run, and we’re hiring the leaders who will build
  the teams that build what comes next.

  We’re at ~$2.1B ARR growing 30%+ year over year, with 96% of
  our largest customers on two or more products. The fastest-
  growing divisions at Samsara are tackling the hardest, most
  ambiguous problems at the company: building new products
  from scratch, applying AI and ML to massive real-world
  datasets, and shipping capabilities that change how
  organizations maintain equipment, manage fleets, and run
  day-to-day operations. Most of this work is zero-to-one, at
  billion-dollar scale.

  We’re looking for Engineering Managers who want to define
  what ships next by building and leading great teams. You’ll
  manage engineers across platform and product, and we’re open
  to shaping team scope around the right person’s strengths
  and interests. That window won’t stay open long.

  This role is remote and open to candidates residing in the
  US or Canada. Relocation assistance will not be provided for
  this role.

  You should apply if:

  - You want to impact the industries that run our world. The
    software your team builds will have real-world stakes:
    helping keep the lights on, getting food into grocery
    stores, keeping workers safe. What ships here isn’t
    metrics on a dashboard. It shows up on the loading dock,
    the job site, and the dispatch floor.
  - You want to build, not maintain. Samsara is in full growth
    mode. Your team will build new systems from scratch, not
    babysit old ones. You’d own entire problem spaces end to
    end, with the autonomy to set direction from day one.
  - You want to work where AI meets the physical world. Samsara
    has spent a decade building the largest proprietary
    dataset for physical operations. More connected assets
    generate more data, more data trains better models, better
    models drive more value, and more value wins more assets.
    The market and the opportunity here are what set us apart,
    not just the models.
  - You believe customers are more than a number. Samsara
    engineers have a rare closeness to end users. You and your
    team will participate in customer interviews, collaborate
    with product managers and customer success, and use that
    context to build products that solve real problems
    operators face every day.
  - You believe great teams are the real product. You get energy
    from hiring exceptional people, growing them, and creating
    the conditions for them to do the best work of their
    careers. The rate-limiting step on our teams isn’t tooling
    or process. It’s ambition, and your job is to unlock it.

  In this role, you will:

  - Lead and grow a team of engineers: hire top talent, coach
    and develop individuals, manage performance, and build a
    culture of ownership, quality, and velocity.
  - Take ownership of technically complex, mission-critical
    areas and run with them. We want to point you in a
    direction and show up to the demo meeting impressed, not
    spend our weeks managing the details.
  - Define and drive technical strategy and roadmap for new
    products and platform capabilities, from backend services
    and APIs to the customer-facing UI.
  - Guide your team to design and ship full-stack features end
    to end, delivering AI-powered products that solve real
    operational problems across backend, frontend, and
    potentially mobile.
  - Partner with product, design, and customer-facing teams to
    translate ambiguous, real-world problems into clear
    technical plans, staffing, and measurable outcomes.
  - Oversee the systems behind AI-driven products, including
    data ingestion, APIs, and the workflows that put
    intelligence into the hands of operators, and stay close
    enough to the technical work to guide architecture and
    make sound tradeoffs.
  - Raise the bar across engineering through design reviews,
    hiring standards, mentorship of senior engineers and
    future leaders, and by setting the standard for quality,
    velocity, and craft.
  - Champion, role model, and embed Samsara’s cultural
    principles (Focus on Customer Success, Build for the Long
    Term, Adopt a Growth Mindset, Be Inclusive, Win as a Team)
    as we scale globally and across new offices.

  Minimum requirements for the role:

  - Bachelor’s degree in Computer Science, Engineering, or
    equivalent practical experience.
  - 8+ years of experience in software design and development,
    including building and operating production systems at
    scale.
  - 3+ years of experience directly managing software engineers,
    including hiring, performance management, and career
    development.
  - Strong technical fundamentals across backend services, APIs,
    and frontend (web or mobile), enough to guide
    architecture, review designs, and earn your team’s
    respect.
  - Familiarity with modern languages and frameworks (Go,
    Python, TypeScript/JavaScript, React, or similar).
  - Demonstrated experience leading cross-team or cross-org
    projects from inception through rollout, including
    managing ambiguity, driving alignment, and delivering
    measurable impact.
  - Experience building or leading teams that build AI-powered
    or data-driven products. You don’t need to train models,
    but you know how to take AI capabilities and turn them
    into products customers love.
  - Strong communication skills and the ability to translate
    between technical and non-technical stakeholders,
    including executives.
  - A track record of building: zero-to-one products, teams and
    systems you left in a meaningfully better place, or hard
    problems you refused to let stay unsolved.

  An ideal candidate also has:

  - Experience shipping AI-powered features in production,
    whether that’s LLM-based products, agentic workflows,
    recommendation systems, or other customer-facing AI.
  - Experience leading teams through AI-augmented development
    workflows (Cursor, LLMs, etc.) to multiply output and
    accelerate delivery.
  - Background working with real-world operational data
    (telematics, sensor data, work orders, inspections) or a
    strong interest in learning the domain.
  - A proven track record of managing and developing senior
    engineers, building managers-of-managers, and influencing
    engineering culture, standards, and best practices beyond
    a single team.
  - Experience scaling teams through fast growth, including
    building hiring pipelines and onboarding.

  The compensation range shown spans approved pay zones for
  this role. Your primary work location determines the range
  applicable to you, which may be narrower than the full range
  displayed.

  The range of annual base salary for full-time employees for
  this position is below. Please note that base pay offered
  may vary depending on factors including your city of
  residence, job-related knowledge, skills, and experience.
  This role is also eligible for an initial RSU grant with no
  vesting cliff, and ongoing refresh opportunities tied to
  performance, subject to plan terms and conditions. Learn
  more about our total rewards and benefits below.

  Annual Base Salary

  $142,800—$184,800 CAD

  Total Rewards

  At Samsara, we build for the people who keep the global
  economy moving. We want owners, not passengers, which is why
  our rewards are designed to fuel high-impact builders. Our
  compensation program delivers above-market total
  compensation through a combination of base salary,
  performance-based bonus/variable pay, and equity (for
  eligible roles) in a high-growth public company. We
  meaningfully differentiate pay for our top performers, who
  have the opportunity to earn above-market compensation that
  can outpace the broader market over time.

  Beyond compensation, we provide the foundations that enable
  long-term success: a flexible, employee-led remote model, a
  professional development stipend, comprehensive health and
  parental leave plans, and more. If you’re ready to build for
  the long term and own the outcome, your journey starts here.

  Flexible Working

  At Samsara, we embrace a flexible working model that caters
  to the diverse needs of our teams. Our offices are open for
  those who prefer to work in-person and we also support
  remote work where it aligns with our operational
  requirements. For certain positions, being close to one of
  our offices or within a specific geographic area is
  important to facilitate collaboration, access to resources,
  or alignment with our service regions. In these cases, the
  job description will clearly indicate any working location
  requirements. Our goal is to ensure that all members of our
  team can contribute effectively, whether they are working
  on-site, in a hybrid model, or fully remotely. All offers of
  employment are contingent upon an individual’s ability to
  secure and maintain the legal right to work at the company
  and in the specified work location, if applicable.

  Belonging at Samsara

  At Samsara, we welcome everyone regardless of their
  background. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, national origin, sex, gender, gender identity,
  sexual orientation, protected veteran status, disability,
  age, and other characteristics protected by law. We depend
  on the unique approaches of our team members to help us
  solve complex problems and want to ensure that Samsara is a
  place where people from all backgrounds can make an impact.

  Accommodations

  Samsara is an inclusive work environment, and we are
  committed to ensuring equal opportunity in employment for
  qualified persons with disabilities. Please email
  accessibleinterviewing@samsara.com or click here if you
  require any reasonable accommodations throughout the
  recruiting process.

  Our Commitment to Authenticity

  We use Tofu, a fraud detection tool, to validate the
  authenticity of applications and protect against identity
  fraud. This ensures we are connecting with real people and
  allows us to prioritize genuine candidates. Please see
  Samsara’s Candidate Privacy Notice for more information.

  Fraudulent Employment Offers

  Samsara is aware of scams involving fake job interviews and
  offers. Please know we do not charge fees to applicants at
  any stage of the hiring process. Official communication
  about your application will only come from emails ending in
  @samsara.com, @us-greenhouse-mail.io or @mail3.guide.co. For
  more information regarding fraudulent employment offers,
  please visit our blog post here.
