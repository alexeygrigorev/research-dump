description: |
  Building Healthcare That Remembers

  Every time you call a doctor's office, the system forgets
  you the moment you hang up. You wait on hold, explain
  everything from scratch, get bounced between lines, and hope
  someone follows up. Everyone has felt this. No one should
  have to.

  At Assort Health, we're building one continuous conversation
  for every patient. An AI agent that knows who you are,
  remembers how you like to be reached, and carries that
  context from your first symptom to your full recovery. What
  began as the first voice AI agent to schedule a specialty
  appointment has become the largest proprietary specialty
  dataset in healthcare: 345 million patient interactions,
  62,000 care protocols, 1.6 million decision pathways.

  We went from 15 people in 2025 and will cross 250 by the end
  of 2026. Revenue is up 20x in 15 months and we've raised
  $222 million, including a recent $120 million Series C at a
  $1.2 billion valuation from investors including Menlo
  Ventures and Lightspeed. We've also been named to the Forbes
  Cloud 100 and the 2026 Enterprise Tech 30 as the only
  healthcare AI company on the list!

  Healthcare spends $1.1 trillion a year on administration
  instead of care. If you want to help change that, apply
  below.

  About the Role

  As an Infrastructure Engineer at Assort Health, you'll be a
  key member of the team building and scaling the
  infrastructure that powers our AI-driven healthcare
  platform. You'll own the systems, automation, and tooling
  that enable our engineering teams to ship safely and
  reliably — from CI/CD pipelines and infrastructure-as-code
  to deployment automation and developer productivity tools.
  Your work will directly impact how quickly we can deliver
  value to patients and healthcare providers, ensuring our
  voice AI agents and platform services run smoothly at scale.
  We expect you to be hands-on and pragmatic: building
  automation that eliminates toil, improving deployment
  workflows, and collaborating closely with engineering teams
  to unblock them and accelerate delivery.

  What You'll Do

  You'll be responsible for building and maintaining the
  infrastructure, tooling, and automation that enables our
  engineering team to ship fast and safely. Your primary focus
  will be on CI/CD pipelines, infrastructure automation, and
  developer productivity, while also contributing to
  reliability and operational excellence. Your scope might
  include:

  - Design, build, and maintain CI/CD pipelines, streamlining
    build, test, and deployment workflows to enable fast, safe
    releases
  - Own infrastructure as code practices using tools like
    Terraform.
  - Scale our infrastructure to support rapid growth: design and
    implement autoscaling strategies, optimize resource
    utilization, and ensure our platform can handle increasing
    traffic and workloads as we expand to new healthcare
    systems and patient populations
  - Build and maintain internal developer tools and platforms
    that improve engineering velocity and reduce friction
  - Manage cloud infrastructure across environments including
    compute, networking, storage, databases, and third-party
    integrations
  - Plan and execute capacity planning initiatives, ensuring
    infrastructure stays ahead of demand while maintaining
    cost efficiency
  - Implement and maintain observability tooling (metrics,
    logging, tracing, dashboards, alerts) to support both
    development and operations
  - Reduce operational toil through automation: automate
    repetitive tasks, build self-service tooling, create
    automated remediation workflows
  - Support incident response and participate in on-call
    rotation, contributing to postmortems and implementing
    preventive measures
  - Optimize cloud costs and resource utilization through
    monitoring, right-sizing, and automation
  - Ensure security and compliance requirements are embedded in
    infrastructure and deployment processes



  What We're Looking For

  - Experience building and maintaining production
    infrastructure (3+ years in DevOps or infrastructure
    engineering roles)
  - Deep familiarity with cloud platforms
  - Strong experience with Terraform
  - Proven track record building and maintaining CI/CD pipelines
  - Experience with Kubernetes
  - Understanding of networking, security, and cloud
    architecture best practices
  - Strong automation mindset — you see manual work as a problem
    to solve
  - Good communicator and collaborator who enjoys enabling other
    engineers



  Benefits & Perks for Assorties

  - 💸 Competitive Compensation – Including salary and employee
    stock options so you share in our success.
  - 📚 Lifelong Learning – Annual budget for professional
    development, plus training opportunities to help you grow.
  - 💻 Office Setup Stipend – We’ll outfit your in-office
    workspace so comfy as it's productive.
  - 🩺 Top-Tier Health Coverage – Medical, dental, and vision
    insurance, because your health comes first.
  - 🏖 Flexible PTO – We trust you to take the time you need to
    recharge and come back ready to crush it.
  - 🥗 Meals & Snacks – Lunch, dinner, and snack breaks that fuel
    great ideas.
  - 💪 Fitness Stipend – Your wellness matters. We reimburse
    monthly membership costs to support your health.
  - 🚆 Commuter Benefits – We cover eligible transportation costs
    to make your trip to work easier.
  - 👵 401(k) – Build your retirement savings.

  How We Work & What We Value

  Our team at Assort Health moves fast, stays focused, and is
  fueled by a desire to serve our customers and patients. Our
  company values guide how we work—they are present in how we
  show up, make decisions and work together to move our
  mission forward. We bring a Day One Drive, relentlessly
  striving to improve, keep a 5-Star Focus, as our customers
  are our lifeblood, always Answer the Call, remembering that
  ownership and accountability are paramount, and show up with
  One Pulse, because we are one team, with one rhythm and one
  result. Our team is growing and we are looking for
  motivated, hardworking, and passionate talent. If you want
  to make healthcare accessible for everyone, we’d love to
  hear from you! Please note: the Assort Health Talent Team
  will only email you from an assorthealth.com email address.
