description: |
  The company

  Smart Electric Vehicle Charging Solutions. That’s the
  business we are in!

  GreenFlux offers a cloud-based charge point management SaaS
  (Software as a Service) solution. This software platform
  enables Charge Point Operators (CPOs) and e-Mobility Service
  Providers (eMSPs) to successfully launch their respective
  businesses. With its offering, GreenFlux plays a pivotal
  role in facilitating the uptake of electric vehicles and the
  renewable energy revolution.

  Our Development department is responsible for the technical
  design of new features, owns the architecture, and does
  technical operation. We are organised in agile end-to-end
  teams, working with well-defined and transparent processes.
  Our tech stack is centred around Microsoft .NET on Azure.

  To keep up with the rapid market and business expansion and
  to support the company’s dynamic growth, we are looking to
  bring an Engineering Manager to the team.

  The job

  The Engineering Managers (internally referred to as Heads of
  Engineering) are responsible for the performance of our
  development teams and the quality of our platform. You will
  be responsible for line managing the engineers of up to
  three development teams, ensuring they have the right
  direction, skills, and support to deliver high-quality
  results. Besides this, you will contribute to improving our
  agile way of working and strengthening engineering practices
  throughout the Development department.

  Key result areas include:

  - Leadership and accountability: You are the hierarchical
    manager of the engineers in your teams and are accountable
    for growing those teams to become autonomous and highly
    performing. You set clear expectations, provide regular
    feedback, and are accountable for individual and team
    performance. You actively identify and address performance
    issues and skill gaps, coaching and developing engineers
    to become more self-sufficient and effective.

  - Delivery and execution: You take responsibility for ensuring
    your teams deliver high-quality software in a predictable
    and efficient manner. You proactively manage risks,
    dependencies, and impediments, taking action when delivery
    or quality is at risk and driving improvements where
    needed.

  - Technical quality: You use your technical background to
    assess and challenge engineering decisions, ensuring that
    software solutions meet the required standards for
    quality, reliability, scalability, and maintainability.
    You work closely with engineers and technical leads to
    promote sound technical decisions and address technical
    debt

  - Continuous improvement: You drive improvements in
    engineering processes, ways of working, and the adoption
    of modern technologies, practices, and tools. You identify
    opportunities to increase efficiency, improve delivery
    performance, and strengthen engineering quality across
    teams.

  - Team development: You build and maintain high-performing
    teams by ensuring the right balance of skills, experience,
    and perspectives. You proactively identify development
    needs, support professional growth, and foster a culture
    of ownership, collaboration, and continuous learning.

  - Quality and documentation: You promote strong engineering
    standards, effective quality control, and clear technical
    documentation to support the long-term stability and
    maintainability of our platform.

  - Strategic contribution: You contribute to setting the
    strategic direction of the Development department,
    translating broader objectives into concrete improvements
    and actions within your teams.

  Requirements

  We are looking for a strong and accountable engineering
  leader who combines a people-oriented approach with a clear
  focus on delivery, technical quality, and results. You
  empower your teams and create an environment where people
  take ownership of their work. You have a strong agile
  mindset without being dogmatic about tools and frameworks,
  and you know when to coach, challenge, or take decisive
  action to improve performance.

  You have

  - 3+ years of experience as an Engineering Manager, preferably
    in a tech scale-up or SaaS environment.

  - A solid background in software engineering, with the
    technical expertise to evaluate engineering decisions and
    assess software quality, reliability, scalability, and
    maintainability.

  - Proven experience in leading engineering teams, setting
    clear expectations, managing performance, and addressing
    skill gaps through coaching, feedback, and development.

  - A strong focus on delivery and execution, with the ability
    to take ownership of results, proactively manage risks,
    and drive improvements.

  - Extensive knowledge of software development processes,
    modern engineering practices, and agile ways of working.

  - Strong communication and interpersonal skills, with the
    confidence to challenge decisions, provide constructive
    feedback, and collaborate with different stakeholder
    groups.

  - The ability to think and act strategically while also
    translating plans into concrete actions and measurable
    improvements.

  - Fluency in English. Dutch is a plus.

  - A drive for continuous learning and self-improvement.

  - A sustainable mindset!

  Our offer

  Working at GreenFlux means working in a dynamic, innovative,
  and informal organization, where new ideas and developments
  move quickly, and each day brings new opportunities and
  challenges. At one of the most inspiring locations in
  Amsterdam, you will have the chance to actively contribute
  to a sustainable future!

  We are striving towards an international and inclusive team,
  so we also offer Visa sponsorship and relocation
  compensation to expats.

  Join our revolution in mobility and energy!
