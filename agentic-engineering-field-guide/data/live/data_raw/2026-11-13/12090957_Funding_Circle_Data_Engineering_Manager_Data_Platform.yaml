description: |
  We’re on a mission to back the UK’s small businesses like no
  one else 🚀

  Small businesses are the backbone of the economy, and we’re
  here to help them win. We’ve built a platform that uses
  clever data to get them the funding they need in minutes,
  not weeks.

  At Funding Circle, we have the restless energy of a fintech
  start-up with the stability of a public company. It’s a
  unique mix that gives Circlers the autonomy to take
  ownership and the scale to make an impact that truly counts.

  We’re a high-performing team that chooses to lift each other
  up. We challenge, we champion, and we have each other’s
  backs - because we know that when we stand together, we move
  faster and build better.

  The impact is real: Last year alone, the businesses on our
  platform generated £7.2bn for the UK economy 📈 Come and join
  a mission that matters!

  [Read our Impact Report] | [See our Trustpilot]

  The role ⚡

  📍 London (Hybrid) | 🤝 2 days in the office | 💰 Competitive
  Salary + Benefits You’ll make a real difference for our
  customers and your team from day one. We believe the fastest
  way to grow is by doing, so we give you the ownership to run
  with things and see real-time results. We are looking for a
  Data Platform Engineering Manager to join our Data Platform
  Engineering team which sits under Tech and Data. We’re
  partway through a migration to a modern Snowflake-based
  platform, so you’ll join at a pivotal point where your
  decisions will shape how we work for years to come Reporting
  directly to the Head of Data Engineering, You’ll partner
  closely with our Technical Lead and Principal Engineer:
  while they drive architecture and technical patterns, you
  will own the delivery engine, team health, career
  progression, and stakeholder alignment that turns strategy
  into reality.

  - Lead, manage, and mentor a team of data platform engineers,
    fostering a collaborative, innovative, and inclusive team
    culture.
  - Champion a product mindset for internal tooling, ensuring
    our platform empowers domain teams to build quickly and
    safely without bottlenecks
  - Oversee the recruitment, onboarding, and performance
    management processes for the team. Set clear goals and
    expectations, providing regular feedback and guidance to
    team members.
  - Oversee the planning, execution, and delivery of projects
    within the data platform roadmap, ensuring timely and
    high-quality outcomes.
  - Manage the team's backlog, prioritise tasks effectively.
    Define and track key performance indicators (KPIs) for
    platform health and team delivery.
  - Build strong relationships and collaborate effectively with
    key stakeholders, including technical and business
    leaders. Understand stakeholder needs and translate them
    into actionable requirements for the data platform.
  - Communicate the team's roadmap, progress, challenges, and
    successes clearly and proactively to technical and non-
    technical audiences.
  - Actively invest in the career development of your team
    members through coaching, mentoring, and identifying
    growth opportunities. Create personalised development
    plans and support engineers in acquiring new skills and
    expertise. Foster a culture of continuous learning,
    knowledge sharing, and technical curiosity within the
    team.



  What we’re looking for 🌱

  We value deep expertise, but a growth mindset and good
  energy are what really make our team click. We’re a group
  that chooses to lift each other up and think smart every
  day.

  - Solid understanding of modern data platform architectures
    (,e.g. Snowflake, data mesh/lakehouse, dbt, Airflow,
    streaming vs. batch pipelines, data contracts)
  - Proven experience managing and leading high-performing data
    engineering teams in a product-driven environment
  - Proven track record of mentoring and developing engineers,
    fostering a culture of technical excellence, innovation,
    and professional growth.
  - Demonstrable experience in managing project delivery,
    including planning, prioritisation, and execution.
  - Experience with Agile/Scrum methodologies.
  - Excellent stakeholder management and communication skills,
    with the ability to engage effectively with both technical
    and non-technical audiences.
  - Able to architect custom AI solutions and smart automated
    systems that are safe, maintainable, and aligned with our
    long-term mission
  - Act as a technical bridge and mentor, training “builders"
    across the company to move from basic AI usage to
    sophisticated system creation

  Skills we’d love to see:

  - Experience shaping data platform strategy and vision,
    aligning technical capabilities with evolving business
    needs and helping drive technical innovation.
  - A proactive approach to identifying and implementing
    improvements related to platform reliability, scalability,
    performance, and cost.
  - Experience running a platform team that serves internal
    customers, with a focus on self-service and developer
    experience.

  We’re building a place where everyone truly feels they
  belong. Even if your past experience doesn't align perfectly
  with every requirement, we'd still love to hear from you.

  Why join us? 💜

  We back you to build an incredible career and by joining us,
  you'll be part of one of The Sunday Times Best Companies to
  Work For 2026! As a flexible-first employer, we use a "best
  of both" approach. We’ll see you in our London office to
  collaborate – with barista coffee and subsidised Just Eat
  lunches on us!

  Our Circler Proposition focuses on five areas:

  - Flexibility: We provide a benefit allowance you can tailor
    to your own life and family.
  - Health: This includes private medical and dental, health
    assessments, and access to a digital GP.
  - Wealth: We offer life assurance, share schemes, and
    financial coaching.
  - Development: You get a dedicated annual learning allowance
    to help you level up.
  - Lifestyle: We have electric car and cycle-to-work schemes,
    plus season ticket loans.

  We also have award-winning parental leave policies. We're
  here to support you through the big life moments, from
  fertility treatments to new additions to the family.

  Ready to join a mission that matters? We’d love to chat!
