description: |
  Who we are:

  At Rover, pets and their people are at the heart of
  everything we do. We connect pet parents with trusted pet
  care across the U.S., Canada, Europe, and Australia.

  Headquartered in Seattle and Barcelona, we’re a values
  driven, fast-growing tech company focused on building safe
  and personalized experiences tailored to the needs of each
  unique pet. We’re investing in AI as a business accelerator
  and provide every team member access to AI tools in service
  of creating better experiences for our community.

  We are proud to be recognized as a great place to work,
  having been named among the 100 Best Companies to Work For
  in Seattle Business Magazine and Washington’s Best
  Workplaces in the Puget Sound Business Journal. At Rover
  we’re committed to creating an accessible, inclusive, and
  welcoming community, which starts with our employees.

  Want to make an impact? Join our pack and come work (and
  play!) with us.

  This role is full-time permanent and hybrid (Mondays &
  Thursdays in our office in Poblenou, Barcelona).





  Software Engineer



  Are you a passionate and detail-oriented Software Engineer
  ready to use your technical skills to build customer-facing
  products that genuinely improve the lives of people and
  their pets? We're looking for an enthusiastic engineer to
  join our team in Barcelona.



  In this role, you'll be a core contributor to our platform,
  collaborating with cross-functional teams to tackle tough
  technical challenges and deliver high-quality, scalable
  solutions. If you're eager to grow your craft and contribute
  to a safe, supportive community, we want to hear from you!

  What You'll Be Doing

  - Product Development: Build, test, and deploy high-quality,
    scalable, and supportable solutions across our technology
    stack, focusing on both web and mobile applications.
  - Cross-functional collaboration: Take ownership of features
    from initial concept to launch. You'll work with loose
    requirements and collaborate with Product, Design, and
    Data Science to define the necessary technical steps and
    drive projects forward.
  - Engineering Excellence: Champion core engineering practices.
    You are passionate about automated testing, ensuring code
    quality, and maintaining a solid understanding of
    relational databases and schema design.
  - Collaboration & Growth: Thrive in a heavily collaborative
    environment, where you'll share your knowledge, contribute
    fresh ideas, and eagerly improve your craft as an
    engineer.
  - User Focus: Apply analytical thinking to solve problems and
    maintain a meticulous focus on design and user experience
    to deliver the best service to our customers, aligning
    with our mission to foster a safe environment for our
    community.

  Your Qualifications & Experience

  - Professional Experience: 5+ years of experience as a
    professional software developer.
  - Product Experience: Experience building web and/or mobile
    applications.
  - Adaptability: Demonstrated ability to quickly learn new
    technologies and embrace new challenges.
  - Methodology: Used to working with different agile
    methodologies (Scrum/Kanban/XP).

  Your bonus skills

  - Technical Stack: Experience with technologies similar to our
    tech stack, including React, React Native, Python, and
    Django.
  - Familiarity with continuous integration/deployment tools.

  Our Style:

  - We are proud to be professional software developers who are
    curious and passionate about learning. We embrace
    progressive engineering practices, including a continuous
    deployment pipeline and thorough production monitoring.
    Our teams are integrated, working side-by-side with
    developers, product managers, designers, and data
    scientists, and we are committed to building a culture of
    inclusivity and diversity.

  Benefits of Working at Rover:

  - Long-term incentive plan with a company performance-based
    cash payout
  - Pension plan
  - Private medical insurance
  - 25 days PTO
  - Meal allowance and flexible compensation plan (transport and
    nursery)
  - Gym membership
  - €450 to cover the costs associated with the adoption of a
    pet
  - Annual €150 wellness reimbursement
  - Flexible work hours, sometimes you'll need to be in at
    certain times, but on the whole, we're pretty flexible
    when it comes to managing workload and time
  - Grab snacks, fresh fruit, in our kitchen to keep yourself
    going
  - Regular team activities, events, game nights, and more
  - Dog-friendly office

  Locations:

  - This position is located at our Barcelona office.
  - Applicants must currently have the right to live and work in
    Spain....We can help with relocation assistance, though!

  Rover is an equal-opportunity employer committed to
  promoting a diverse, inclusive, and inventive environment
  with the best employees. We’re driven by seeing our people
  succeed and grow, and we work to ensure everyone contributes
  to their fullest potential. We consider all qualified
  applicants without regard to age, race, color, ancestry,
  national origin, religion, disability, protected veteran
  status, sex, gender identity or expression, sexual
  orientation, or any other protected status in accordance
  with applicable laws, regulations, and ordinances.
