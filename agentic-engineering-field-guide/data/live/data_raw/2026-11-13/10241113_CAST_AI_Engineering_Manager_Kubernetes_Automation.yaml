description: |
  Why the Kubernetes Automation Domain?

  Kubernetes Automation is Cast AI's core: a family of product
  teams that turns optimization into real infrastructure.
  Together, they own the full loop — deciding which nodes to
  run and where, provisioning them across EKS, GKE, AKS, and
  our own Cast AI Anywhere, optimizing the workloads on top,
  and reshaping it all continuously as conditions change. No
  manual tuning: automation makes the call and makes it
  happen.

  The scale is the point. When demand spikes, the platform
  brings up 15,000 nodes in a single cluster and gets every
  pod scheduled in under 45 minutes — and tears a cluster of
  that size back down in under 15 minutes — across multiple
  clouds at once, mixing instance types and spot capacity in a
  single operation. Across a fleet of thousands of customer
  clusters, our teams make the same high-stakes Kubernetes
  decisions — add this node, drain that one, move that
  workload, is this change safe — thousands of times a day,
  and each one has to land cleanly.

  The problems sit at the intersection of Kubernetes internals
  and cloud-provider behavior, and much of the territory is
  undocumented. One team might be writing scaling algorithms,
  another reverse-engineering managed control planes, another
  migrating running containers between nodes without
  disruption. The common thread: deep Kubernetes knowledge,
  strong infrastructure fundamentals, and the judgment to own
  high-stakes automation in production. If you have that, you
  can lead any of these teams — you'll be matched with the
  team that best fits your strengths and interests during the
  hiring process.

  Role overview

  We are looking for a hands-on Engineering Manager to join
  one of our Kubernetes Automation teams. It is a hybrid role:
  you will manage a team and spend at least half your time in
  the product code.

  Responsibilities as an Engineering Manager

  You own product development execution.

  - Lead, mentor, and grow a team of talented software engineers
  - Collaborate closely with the Product Owner and stakeholders
    to align on requirements and roadmaps
  - Ensure quality, scalability, and resilience in all
    deliverables
  - Foster a culture of continuous improvement, innovation, and
    technical excellence
  - Be the role model and champion of Cast AI core values

  Responsibilities as a Software Engineer

  You will work in a highly skilled team across the full
  development lifecycle.

  - Take on scaling challenges at fleet level
  - Participate in feature brainstorming, requirement gathering,
    and solving customer needs
  - Design and architect software for scalability,
    maintainability, and performance
  - Write clean, maintainable, documented code using best
    practices
  - Ensure reliability through test coverage and local testing
  - Contribute to CI/CD pipelines and the monitoring and
    alerting stack
  - Respond to incidents to resolve customer issues or service
    disruptions
  - Support the team's code (on-call week every few months)

  Requirements

  - Proven experience managing and leading a technical team
  - Strong software engineering skills
  - Strong verbal and written communication skills
  - In-depth knowledge of Kubernetes and experience managing
    multi-cloud environments (AWS, GCP, Azure)
  - Knowledge of cloud-native infrastructure, APIs, and cloud-
    provider-specific implementation differences
  - Hands-on experience with IaC tools such as Terraform
  - Proficient in designing and managing CI/CD pipelines (GitLab
    CI, ArgoCD) with a GitOps approach
  - Strong analytical, problem-solving, and troubleshooting
    skills

  What's in it for you?

  - Competitive salary (up to €10,000 gross, depending on the
    level of experience)
  - Enjoy a flexible, remote-first global environment.
  - Collaborate with a global team of cloud experts and
    innovators, passionate about pushing the boundaries of
    Kubernetes technology.
  - Equity options.
  - Get quick feedback with a fast-paced workflow. Most feature
    projects are completed in 1 to 4 weeks.
  - Spend 10% of your work time on personal projects or self-
    improvement.
  - Learning budget for professional and personal development –
    including access to international conferences and courses
    that elevate your skills.
  - Annual hackathon to spark new ideas and strengthen team
    bonds.
  - Team-building budget and company events to connect with your
    colleagues.
  - Equipment budget to ensure you have everything you need.
  - Extra days off to help maintain a healthy work-life balance.

  Why Cast AI?

  Cast AI is an automation platform that operates cloud-native
  and AI infrastructure at scale. By embedding autonomous
  decision-making directly into Kubernetes and cloud
  environments, Cast AI continuously optimizes performance,
  reliability, and efficiency in production.

  The old way doesn't work. As Kubernetes and AI environments
  grow, manual decisions don't. Cast AI replaces tickets,
  alerts, and manual tuning with continuous automation that
  adapts infrastructure as conditions change. Efficiency and
  cost savings follow naturally from that automation.

  Over 2,100 companies already rely on Cast AI, including
  Akamai, BMW, Cisco, FICO, HuggingFace, NielsenIQ, Swisscom,
  and TGS.

  Global team, diverse perspectives We're headquartered in
  Miami, but our impact is international. We take a global and
  intentional approach to diversity. Today, Cast AI operates
  across 34 countries spanning Europe, North America, Latin
  America, and APAC, bringing a wide range of perspectives
  into how we build and lead.

  Unicorn momentum In January 2026, we achieved unicorn status
  with a strategic investment from Pacific Alliance Ventures,
  the corporate venture arm of Shinsegae Group (a $50+ billion
  Korean conglomerate). Our valuation now exceeds $1 billion,
  and we're just getting started.

  Join us as we build the future of autonomous infrastructure.

  This is a location-specific opportunity, we hire from:
  Bulgaria, Croatia, Cyprus; Estonia, Finland, Greece,
  Hungary, Ireland, Latvia, Lithuania, Malta, Moldova,
  Montenegro, North Macedonia, Poland, Romania, Slovakia,
  Slovenia, Sweden and Ukraine.

  Hiring process

  - Screening call with Recruiter
  - Hiring Manager interview
  - Technical interview (system design)
  - Live coding
  - Culture Check interview with an executive

  *As part of our standard hiring process, we would like to
  inform you that a background check may be conducted at the
  final stage of recruitment through our third-party provider,
  Checkr. *Please note that Cast AI does not provide any form
  of visa sponsorship/work permit.
