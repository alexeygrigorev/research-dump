title: Software Engineer - DevSecOps (Senior or Lead)
company: Boeing
location: Tukwila, USA
work_type: FULL_TIME
company_size: 170,000 Employees
description: |
  Job Description At Boeing, we innovate and collaborate to
  make the world a better place. We're committed to fostering
  an environment for every teammate that's welcoming,
  respectful and inclusive, with great opportunity for
  professional growth. Find your future with us. The Boeing
  Company is currently seeking a Software Engineer-DevSecOps
  (Senior or Lead) to support our E7A Software Development
  Environments team located in Tukwila, Washington. This team
  is responsible for building and maintaining multiple secure
  development environments that enable continuous integration
  and secure software development for the US Air force E-7A
  Rapid Prototype Program. This position will focus on
  developing and maintaining Software Factories used by E-7A
  teams to build, test and deploy Maven, Gradle and Python
  applications in both AWS and onsite disconnected
  environments. Our team is currently hiring for a broad range
  of experience levels including: Senior and Lead Engineers.
  Position Responsibilities:

  - Lead the design, development, testing and verification of
    E-7A software engineering tools
  - Develop and enhance our DevSecOps operations across multiple
    environments
  - Collaborate with cross-functional teams to integrate and
    implement solutions for software development
  - Provide end user support and troubleshooting to software
    development teams using program defined pipeline
    configurations and development environments
  - Monitor and maintain software development environments and
    tools
  - Participate in peer reviews and provide technical leadership
    to junior engineers
  - Utilize analytical problem-solving skills to resolve issues
    and improve processes and tools

  Basic Qualifications (Required Skills/Experience):

  - Bachelor's Degree
  - Active Secret U.S. Security Clearance. (A U.S. Security
    Clearance that has been active in the past 24 months is
    considered active.)
  - 4+ years of experience administering Linux systems
  - 4+ years of experience administering Kubernetes, EKS or RKE2
    deployments
  - 4+ years of experience with AWS cloud development and
    containerization
  - 2+ years of experience with Python
  - Experience in Java, C++

  Preferred Qualifications (Desired Skills/Experience):

  - Bachelor of Science degree from an accredited course of
    study in engineering, engineering technology (includes
    manufacturing engineering technology), chemistry, physics,
    mathematics, data science, or computer science and 5+
    years of related work experience OR Bachelor's Degree and
    14+ years of directly related work experience OR 22+ years
    of related, relevant experience
  - 10 or more years' related work experience or an equivalent
    combination of education and experience
  - AWS Certification
  - Experience in containerization including Docker, Kubernetes,
    Helm, Rancher, Istio, Big Bang
  - Experience working with PostgresQL, RDS or databases
    technologies
  - Experience working with Sonotype Nexus
  - Experience with designing and implementing full
    stack/Microservice infrastructure
  - Experience with secure software development methodologies
  - Experience with cloud architecture and design methodologies
  - Experience evaluating, testing and integrating software
    tools

  Drug Free Workplace: Boeing is a Drug Free Workplace where
  post offer applicants and employees are subject to testing
  for marijuana, cocaine, opioids, amphetamines, PCP, and
  alcohol when criteria is met as outlined in our policies.
  Union: This is a union-represented position. CodeVue Coding
  Challenge: To be considered for this position you will be
  required to complete a technical assessment as part of the
  selection process. Failure to complete the assessment will
  remove you from consideration. Pay & Benefits: At Boeing, we
  strive to deliver a Total Rewards package that will attract,
  engage and retain the top talent. Elements of the Total
  Rewards package include competitive base pay and variable
  compensation opportunities. The Boeing Company also provides
  eligible employees with an opportunity to enroll in a
  variety of benefit programs, generally including health
  insurance, flexible spending accounts, health savings
  accounts, retirement savings plans, life and disability
  insurance programs, and a number of programs that provide
  for both paid and unpaid time away from work. The specific
  programs and options available to any given employee may
  vary depending on eligibility factors such as geographic
  location, date of hire, and the applicability of collective
  bargaining agreements. Pay is based upon candidate
  experience and qualifications, as well as market and
  business considerations. Summary Pay Range for Senior Level
  (level 4): $130,900 - $177,100. Summary Pay Range Lead Level
  (Level 5): $161,500 - $218,500 Applications for this
  position will be accepted until Nov. 18, 2026 Export Control
  Requirements: This position must meet U.S. export control
  compliance requirements. To meet U.S. export control
  compliance requirements, a "U.S. Person" as defined by 22
  C.F.R. §120.62 is required. "U.S. Person" includes U.S.
  Citizen, U.S. National, lawful permanent resident, refugee,
  or asylee. Export Control Details: US based job, US Person
  required Education Bachelor's Degree or Equivalent Required
  Relocation Relocation assistance is not a negotiable benefit
  for this position. Security Clearance This position requires
  an active U.S. Secret Security Clearance (U.S. Citizenship
