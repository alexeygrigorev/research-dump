description: |
  Why Mozilla?

  Mozilla Corporation is the non-profit-backed technology
  company that has shaped the internet for the better over the
  last 25 years. We make pioneering brands like Firefox, the
  privacy-minded web browser. Now, with more than 225 million
  people around the world using our products each month, we’re
  shaping the next 25 years of technology and helping to
  reclaim an internet built for people, not companies. Our
  work focuses on diverse areas including AI, social media,
  security and more. And we’re doing this while never losing
  our focus on our core mission – to make the internet better
  for people.

  The Mozilla Corporation is wholly owned by the non-profit
  501(c) Mozilla Foundation. This means we aren’t beholden to
  any shareholders — only to our mission. Along with thousands
  of volunteer contributors and collaborators all over the
  world, Mozillians design, build and distribute open-source
  software that enables people to enjoy the internet on their
  terms.

  About this team and role:

  The Firefox team is a community of engineers who care deeply
  about delivering the fastest, friendliest, most usable
  browser possible. We are responsible for making the things
  you see in the browser work securely, quickly, and well! The
  Enterprise team is a cross-disciplinary team in charge of
  improving and maintaining Firefox support for large
  Enterprise deployments. As part of the team, you will be
  responsible for all things related to services and
  infrastructure for our Enterprise products.

  A Staff Software Engineer is the next level up from a Senior
  Software Engineer. At Mozilla this role can vary, but
  typically a staff engineer supports an engineering team,
  providing technical leadership, building cross-team
  relationships, and helping the team deliver on their
  objectives.

  What You'll Do:

  - Improve the ease of use and security of Firefox in large
    deployments by developing better administration and
    monitoring tools.
  - Improve Firefox functionality by better integration with
    remote services.
  - Assess what work supports the team and product roadmap and
    make insightful recommendations in regards to priorities.
  - Work with a geographically-distributed development team.

  What You’ll Bring:

  - 8+ years of professional experience in software development.
  - Experience developing robust services according to modern
    best practices.
  - Strong software engineering fundamentals: modularity,
    abstraction, data structures, and algorithms.
  - Proficiency in Rust and JavaScript.
  - Proven understanding of database systems (SQL and/or non-
    relational databases).
  - You are an excellent communicator and have participated
    effectively on a distributed team.
  - You’re pragmatic about how to move things forward in
    specific timeframes including trade-offs and safeguards
    when implementing new functionality.
  - Curiosity and interest in learning new things.
  - Commitment to our values:

  Bonus Points

  - Front-end development experience.
  - Experience with kubernetes.
  - Experience with OIDC/OAuth2.
  - You have previously successfully contributed to an open
    source project.

  What you’ll get:

  - Generous performance-based bonus plans to all eligible
    employees - we share in our success as one team
  - Rich medical, dental, and vision coverage
  - Generous retirement contributions with 100% immediate
    vesting (regardless of whether you contribute)
  - Quarterly all-company wellness days where everyone takes a
    pause together
  - Country specific holidays plus a day off for your birthday
  - One-time home office stipend
  - Annual professional development budget
  - Quarterly well-being stipend
  - Considerable paid parental leave
  - Employee referral bonus program
  - Other benefits (life/AD&D, disability, EAP, etc. - varies by
    country)

  We value a variety of voices within our team and at Mozilla.
  You don't need to check every box on this list to apply.

  About Mozilla

  Mozilla exists to build the Internet as a public resource
  accessible to all because we believe that open and free is
  better than closed and controlled. When you work at Mozilla,
  you give yourself a chance to make a difference in the lives
  of Web users everywhere. And you give us a chance to make a
  difference in your life every single day. Join us to work on
  the Web as the platform and help create more opportunity and
  innovation for everyone online.

