description: |
  About Self Financial

  Self Financial is a venture-backed, high-growth FinTech
  company with a mission to increase economic inclusion and
  financial resilience by empowering people to build credit
  and build savings.

  We challenge the status quo of the credit industry by giving
  people accessible tools to take control of their credit,
  with a focus on the 100 million+ Americans who have no or
  low credit. We're looking for people who share our passion,
  tackle challenges, find solutions, and make the financial
  space better for the communities we serve.

  Title

  Associate Software Engineer

  Team

  Credit Builder Account (CBA) is a product team, much like
  our card team. CBA is a way to credit. It is a loan in a
  bank-held Certificate of Deposit (CD) that members can pay
  off. Each payment gets reported to all three credit bureaus.
  The CBA team builds and operates the systems supporting the
  product, including the services, APIs, jobs, mobile webs and
  web platforms.

  Location: Austin, TX

  Work Arrangement: Austin – Hybrid

  About the Role

  You’ll join CBA early in your career and learn how a
  regulated fintech product is built, shipped, and maintained.
  You’ll implement, develop, and test software, collaborating
  with senior engineers to understand project requirements and
  complete assigned tasks. You’ll also work alongside product
  managers, QA, and DevOps, and use AI tools like Claude every
  day to write code and move the product forward.

  What you’ll do:

  - Build new features and enhancements for the Credit Builder
    Account, and feel comfortable raising questions when
    something is unclear.
  - Ship functional, secure Python code, REST APIs, and
    integrations with in-house and third-party services and
    SQL databases, collaborating through Git (branches, pull
    requests, code reviews).
  - Debug and resolve issues by digging in and understanding the
    root cause, not just patching the symptom.
  - Use good judgment: ask questions, weigh tradeoffs, flag
    risks, and keep our work aligned with compliance
    requirements as a regulated fintech.
  - Own what you ship. Use Claude and other AI tools to move
    faster, but review, understand, and stand behind every
    line of code.
  - Partner with product managers, QA, DevOps, and teams across
    the company to deliver on product goals.
  - Keep growing: take feedback from code reviews in stride,
    learn from mistakes, and stretch into harder problems over
    time.

  What You Bring

  - Associates, Bachelors, or Masters in Computer Science or a
    related field, or equivalent internship, project, or
    hands-on experience.
  - Proficiency in Python, with a solid grasp of core data
    structures and algorithms (you can explain why one
    approach is better than another).
  - Working knowledge of REST APIs.
  - Experience with SQL databases.
  - Familiarity with Git and collaborative development
    workflows.
  - Understanding of unit testing and how to apply it.
  - Clear communication and a willingness to ask questions, take
    feedback, and learn quickly.

  What Separates You

  - Relevant software engineering internships or project work.
  - Hands-on experience with AWS or another cloud provider.
  - Understanding of CI/CD and how code actually gets deployed,
    including the broader software development life cycle.
  - Real exposure to AI-assisted development (such as Claude) in
    school, internships, or personal projects.

  Benefits & Perks

  - Generous health, dental, and vision insurance coverage
  - Employer-paid benefits including life, disability, and cost-
    containment resources
  - Hybrid work arrangement
  - Flexible vacation
  - Company performance-based bonuses
  - Paid parental leave
  - Company equity in the form of stock options
  - Education reimbursement program
  - Relocation bonus to move to Austin
  - Gym membership options through ClassPass or monthly
    reimbursement
  - Lunchdrop stipend
  - Paid parking
  - ERG and inclusion opportunities
  - Casual dress code
  - Team building events and activities
  - Referral program

  Equal Opportunity Employer

  Self Financial is an Equal Opportunity Employer. We
  celebrate diversity and are committed to an inclusive
  environment. We do not discriminate on the basis of any
  protected group status under applicable law. If you need an
  accommodation during the application or interview process,
  please let us know.

  Work Authorization

  We can only consider candidates who are U.S. citizens or
  permanent residents (green card holders). We are unable to
  offer visa sponsorship of any kind, now or in the future.
  All new hires must successfully pass a background check.

  AI Integrity Policy

  Self Financial is an AI-forward company. Our interview
  process is designed to understand your own career
  experience, technical acumen, and communication skills.
  Please do not use AI tools to generate or assist with your
  answers during interviews unless we explicitly invite you
  to. If we have reason to believe AI was used in a way that
  misrepresents your own abilities, we may remove you from the
  interview process and from consideration for future
  opportunities at Self.
