description: |
  This role is located in Somerville, MA - We are a hybrid
  work environment and are in the office 3+ days/per week.

  Tulip, the leader in AI-native frontline operations, is
  helping companies around the world equip their workforce
  with composable, connected apps, leading to higher quality
  work, improved efficiency, and end-to-end traceability
  across operations. Tulip’s cloud-native, no-code platform,
  powered by embedded AI, is driving the digital
  transformation of industrial environments through
  composable, human-centric solutions that go beyond
  disrupting the Manufacturing Execution System (MES)
  category.

  A spinoff out of MIT, Tulip is headquartered in Somerville,
  MA, with offices in Germany, Hungary, Singapore, Israel and
  Japan. Tulip has been recognized as a World Economic Forum
  Global Innovator, a 2024 Deloitte Technology Fast award
  winner, one of Energage’s Top Workplaces USA, and one of
  Built In Boston’s “Best Places to Work” and “Best Midsize
  Places to Work.”

  About the Team:

  The team owns the authoring experience and runtime for Tulip
  Apps — the no-code App editor, publishing and governance
  features like versioning and import/export, and the mission-
  critical runtime that every Tulip app runs on. The team also
  owns the backend services and integrations behind Tulip's
  Agentic AI chat experience, including the infrastructure
  that grounds it in customer data.

  About You:

  You possess strong technical acumen, people management
  skills, and a deep understanding of product business value.
  With years of experience building and delivering web-enabled
  SaaS products, you're passionate about mentoring engineers.
  A collaborative, motivated self-starter, you're ready to
  lead and bring your authentic self to work. You also love
  cross-functional collaboration with product, design,
  infrastructure, and customer teams on key projects.

  What skills do I need?

  - 7+ years of SaaS software engineering experience, ideally in
    contemporary tech stacks, with direct involvement in
    complex and stable backend infrastructure
  - 3+ years in people management leading a software team, with
    experience hiring, mentoring, and creating career
    opportunities for your team
  - Hands-on experience with cross-functional team leadership
    with technical and customer-facing feature delivery
  - Strong understanding of testing and deploying systems in
    multicloud / multitenant environments
  - Experience architecting systems that integrate agentic and
    generative AI capabilities
  - Familiarity with our tech stack - including Typescript,
    React, Redux, Node.js, Golang, MongoDB, Postgres, and
    Docker.
  - Active use of AI tooling in your own practice, with a point
    of view on how it changes the way teams build
  - Bachelor's degree in Computer Science or related field, or
    equivalent working experience

  Key Responsibilities

  - Own delivery for your team's surface area — scoping,
    sequencing, unblocking, and making the trade-off calls
    between speed and durability. As a product threaded team,
    collaborate closely with product and design.
  - Work alongside tech leads to set technical direction and
    guide architectural decisions.
  - Maintain a strong operational health: on-call, incident
    response, and paying down tech debt before it becomes a
    tax on velocity.
  - Cultivate an AI-first development culture and continuously
    raise the bar on velocity and quality.
  - Hire, mentor, and grow a team capable of operating with high
    autonomy and quality.
  - Establish engineering standards: testing, observability, AI-
    driven development practices for the team.

  Key Collaborators

  - Engineering Leadership
  - Product Management
  - Operations & QA
  - Customer Success

  Working At Tulip

  We know even great candidates experience imposter syndrome.
  Even if you don’t match every requirement, applying gives
  you the opportunity to be considered.

  We're building a strong, diverse team that values hard work,
  families, and personal well-being. Benefits of working with
  us include:

  - Direct impact on product and culture
  - Company equity
  - Competitive benefits package including Health, Dental,
    Vision, Short-term Disability, Long-term Disability, Life
    Insurance, AD&D Insurance, Flexible Spending Account
    (FSA), Commuter Benefits, Parental Leave, and 401(K)
  - Flexible work schedule and unlimited vacation policy
  - Learning & Development program
  - Virtual and in-office global company events and happy hours
  - Fitness subsidies
  - An inclusive, dog-friendly office with diverse and inspiring
    colleagues

  We are an equal opportunity employer. At Tulip, we celebrate
  all. Qualified applicants will receive consideration for
  employment without regard to race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, or disability status. Help us build an
  inclusive community that will transform frontline
  operations.

  The compensation information displayed on each job posting
  reflects the range for new hire pay rates for the position
  across all US locations. Within the range posted, actual
  compensation will be determined depending on multiple
  factors including job-related knowledge & skills,
  experience, business needs, geographical location, market
  compensation data, and internal equity. Expected
  compensation ranges for this role may change over time. The
  salary range for this position is $160,000 - $220,000 per
  year.

  It is unlawful in Massachusetts to require or administer a
  lie detector test as a condition of employment or continued
  employment. An employer who violates this law shall be
  subject to criminal penalties and civil liability.

  Please note that we may use AI-based tools to support parts
  of our hiring process. All data processing is carried out in
  compliance with local data protection laws, ensuring all
  personal candidate information is handled securely and
  ethically.
