description: |
  At Affirm, we exist for the moments that matter—giving
  people a clear, predictable way to pay over time, with no
  hidden fees, no surprises, and no tradeoffs on what matters
  most.

  We are looking for a passionate engineer to join our Capital
  Orchestration team, which is responsible for providing
  liquidity to Affirm by enabling the sale and
  collateralization of Affirm loan assets. To achieve this,
  our team develops a robust and extensible platform for on-
  demand transactions with low operational risk that scales to
  billions of dollars of collateral movement each month. In
  simpler terms, we help ensure Affirm has enough money to
  originate loans, pay merchants, and continue to grow.

  What You'll Do

  - Build a foundational platform enabling us to reconcile each
    transaction across systems, partners, and cash movements.
  - Build and integrate data pipelines from a variety of
    products and systems.
  - Build intuitive and thoughtful user experiences to
    streamline the workflows of our business counterparts.
  - Develop a deep understanding of the capital systems which
    power and fund Affirm.
  - Partner with engineers on the team to help improve designs,
    code quality, and testing.
  - Collaborate with product managers and business counterparts
    to design best-in-class systems and processes.
  - With the support of your team’s tech lead and manager, you
    will break down larger projects into individual tasks,
    deliver them in multiple phases, and collaborate with
    others to ensure timely delivery of your work.
  - You will support your peers and stakeholders in the product
    development lifecycle by collaborating with product
    management, design & analytics by participating in
    ideation, articulating technical constraints, and
    partnering on decisions that properly consider risks and
    trade-offs.
  - You will support the operations and availability of your
    team’s artifacts by creating and monitoring metrics,
    escalating when needed, and supporting “keep the lights
    on” & on-call efforts

  What We Look For

  - You have a total of 1.5+ years of experience as a software
    engineer.
  - Fluency in full stack web development, back end development,
    event processing, or batch processing.
  - Experience in designing, building, launching, and
    maintaining products at scale.
  - Strong cross-team communication and collaboration skills.
  - Proficiency with agentic coding.
  - Knowledge of Python, JavaScript/React, Airflow, Spark,
    Horizon Portal, and SQL is a plus.
  - You have mastered taking a simple problem or business
    scenario into a solution that interacts with multiple
    software components, and executing on it by writing clear,
    easily understood, well tested and extensible code.
  - You are comfortable navigating a large code base, debugging
    others' code, and providing feedback to other engineers
    through code reviews.
  - Your experience demonstrates that you take ownership of your
    growth, proactively seeking feedback from your team, your
    manager, and your stakeholders.
  - You have strong verbal and written communication skills that
    support effective collaboration with our global
    engineering team.
  - Someone who is proactive, organized, curious, and a self-
    starter.
  - This position requires either equivalent practical
    experience or a Bachelor’s degree in a related field.

  Pay Grade - L Equity Grade - 6 Employees new to Affirm
  typically come in at the start of the pay range. Affirm
  focuses on providing a simple and transparent pay structure
  which is based on a variety of factors, including location,
  experience and job-related skills. Base pay is part of a
  total compensation package that may include equity rewards,
  monthly stipends for health, wellness and tech spending, and
  benefits (including 100% subsidized medical coverage, dental
  and vision for you and your dependents.) USA base pay range
  (CA, WA, NY, NJ, CT) per year: $165,000 - 225,000 USD

  USA base pay range (all other U.S. states) per year:
  $146,000 - 206,000 USD

  Additional benefits include: • Flexible Spending Wallets for
  tech, food and lifestyle • Away Days - wellness days to take
  off work and recharge • Learning & Development programs •
  Parental benefits • Employee Resource & Community Groups
  #LI-Remote

  Remote-first with flexibility built in Affirm is proud to be
  a remote-first company. Most roles can be done from almost
  anywhere within the country of employment. Some positions
  may occasionally require in-person work at an Affirm office,
  and a few are office-based due to the nature of the work.
  All new hires will be invited to attend an in-person
  onboarding experience.

  Benefits designed for you Our benefits reflect our
  commitment to care, transparency, and flexibility. Here are
  a few highlights:

  - Health coverage at no cost: We cover 100% of premiums for
    employees and their dependents.
  - Spending stipends: Monthly stipends support your tech setup,
    and the ability to choose health and wellness options that
    are right for you.
  - Time off to recharge: Flexible time off and generous holiday
    calendars help you rest when you need to.
  - Own a piece of what you build: Our employee stock purchase
    plan (ESPP) lets you buy Affirm stock at a discount.

  We’re committed to providing an inclusive interview process,
  including accommodations for candidates with disabilities.
  If you need support, we’re happy to help.

  For positions based in San Francisco or Los Angeles: Affirm
  considers qualified applicants with arrest and conviction
  records, as required by law.

  By clicking "Submit Application," you acknowledge that you
  have read Affirm's Global Candidate Privacy Notice and
  consent to the use of your personal information as
  described.
