description: |
  Description

  We’re looking for exceptional and experienced Senior Backend
  JavaScript Developers to join our team, with deep expertise
  in Node.js and building production-grade backend services.

  In this role, you will take end-to-end ownership of product
  and feature development, building SaaS applications and
  services in a microservices architecture, using modern
  technologies in a fast-paced and professional environment.

  Tech Stack:

  Node.js, JavaScript, MongoDB, Kubernetes, Redis (including
  Redis Streams)

  Requirements

  - End-to-end feature development, from design and
    implementation to production rollout and ongoing
    improvements.
  - Build and operate backend services with a strong focus on
    scalability, reliability, and performance in a
    microservices environment.
  - Participate in system design and architecture planning, and
    contribute to technical decisions across the team.
  - Work with asynchronous, message-driven components using
    Redis Streams, including debugging, tuning, and ensuring
    resilient processing.
  - Write high-quality, maintainable code with appropriate test
    coverage; participate actively in code reviews.
  - Collaborate effectively with teammates and cross-functional
    stakeholders to deliver high-impact outcomes.
  - Continuously learn, adapt, and stay up-to-date with best
    practices and evolving technologies.
