description: |
  STRICTLY NO AGENCIES: We are only accepting direct
  applications for this role. Any unsolicited CVs sent will be
  treated as a gift and will not be subject to any terms or
  fees. RECRUITERS: please do not call or email us regarding
  this role.

  THIS IS A HYBRID ROLE WITH THREE DAYS IN OUR FARRINGDON,
  LONDON OFFICE.

  Stack: Next.js, React and TypeScript on the front end.
  Laravel and PHP on the back end.

  About Eventogy

  Eventogy is the event management platform used by investment
  banks, corporate banks and law firms to run their events,
  from partner dinners to 3,000-person conferences. Our
  clients care about the details: who is invited, who approved
  it, what they have registered for, and what happens to their
  data afterwards. Governance is what sets us apart.

  We are a small team rebuilding our platform, and we have
  changed how we build. Features start as working prototypes,
  become clear specs, and are increasingly built with
  assisting AI coding agents, lead by humans. We are looking
  for someone who can do this well.

  The role

  This is not a front-end role or a back-end role. You will be
  a product builder: someone who takes a feature from spec to
  production and owns all of it.

  You will usually start from a ticket with a working
  prototype, acceptance criteria and a suggested approach. A
  feature often has both a hub ticket and an API ticket, and
  you will take both. You will question the spec, fill in the
  gaps, brief and direct Claude Code, review its output
  critically, test it and ship it.

  Your strength will be on the front end, but you will be
  comfortable in our Laravel API whenever a feature needs it.

  What you will do:

  - Build features end to end across our Next.js admin hub and
    attendee websites and our Laravel API
  - Turn prototypes and specs into production-quality code,
    raising gaps and edge cases before you build
  - Use AI coding agents as a core part of your workflow,
    including running work in parallel where it makes sense
  - Review agent-written code sceptically, especially around
    permissions, shared state and data that crosses client
    boundaries
  - Write and maintain tests, and use our automated test suite
    and seeded test events to check your work
  - Ship safely to a live product: non-destructive migrations,
    feature branches, no surprises for existing clients
  - Work closely with product on the why, not just the what

  Requirements

  What we are looking for

  Front end is your home:

  - Strong Next.js, React and TypeScript, including routing,
    rendering and data-fetching patterns
  - Good component design and state management, and you care
    about accessibility
  - You build interfaces enterprise users trust: predictable,
    clear and calm

  Back end does not put you off:

  - Confident in an existing Laravel codebase: Eloquent,
    migrations, repositories, API resources, and feature tests
    with PHPUnit or Pest
  - You understand data modelling well enough to spot when a
    change will break existing records
  - You do not need to be a Laravel expert, but you do need to
    understand what you have shipped

  You are genuinely good with AI tooling:

  - You use Claude Code, or something similar, daily, and you
    know how to brief it well
  - You know where it goes wrong, such as shared state,
    validation, security boundaries and confident-but-wrong
    fixes, and you check those areas yourself

  You think like a product person:

  - You ask "what happens when...?" before writing code
  - You would rather own a whole feature than one slice of it
  - You write clearly in pull requests, tickets and questions to
    product

  Nice to have:

  - B2B or multi-tenant SaaS experience
  - Experience in regulated sectors such as finance or legal
  - Playwright or other end-to-end testing

  This probably is not for you if:

  - You want fully specified tickets with no ambiguity
  - You see AI tools as a gimmick, or as a replacement for
    understanding the code
  - You only want to work on one side of the stack

  How we work:

  - Small team, a direct line to product, and short feedback
    loops
  - Prototype first: you will usually see the feature working
    before you build it
  - Clear specs written for humans and agents alike

  How to apply

  Send a CV plus short answers to two questions:

  - Describe something you shipped that you owned end to end.
    What was hard about it, what did you get wrong, and what
    would you do differently?
  - Where has AI-assisted development made you faster, and where
    have you seen it make a codebase worse?

  Applications without answers to both will not be reviewed.
  This is deliberate.

  This is a permanent position in our team. We are an equal
  opportunities employer. You must be eligible to work in the
  UK without requiring sponsorship, hold a valid visa or UK
  residency, be currently based in the UK.

  NO AGENCIES. Please do not attempt to canvass from here.

  Benefits

  What we offer:

  - Salary of 55,000 to 60,000 GBP
  - Company pension scheme
  - Gym membership
  - Hybrid working, three days a week in our Farringdon, London
    office
  - Multiple progression routes, through leadership, product or
    deep technical work
  - Serious investment in AI tooling and training
  - A vibrant location with a top-quality coffee shop next door
    and a food market outside
