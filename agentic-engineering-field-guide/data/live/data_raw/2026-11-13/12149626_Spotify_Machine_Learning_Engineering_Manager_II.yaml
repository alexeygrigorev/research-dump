description: |
  The Personalization team makes deciding what to play next
  easier and more enjoyable for every listener. From Blend to
  Discover Weekly, we’re behind some of Spotify’s most-loved
  features. We built them by understanding the world of music
  and podcasts better than anyone else. Join us and you’ll
  keep millions of users listening by making great
  recommendations to each and every one of them.

  At Spotify, great personalization is about more than
  recommending the right song. It's about creating listening
  experiences that feel effortless and meaningful while
  balancing the needs of listeners, creators, and our
  business. The Samba team, part of Spotify's Personalization
  Mission, works on multi-objective balancing and sequencing
  for personalized listening experiences like Autoplay, Radio,
  and Mixes. Our engineers bring together machine learning,
  backend engineering, and data engineering to build systems
  that support Spotify's financial objectives while keeping
  listeners at the center of what we do.

  We're looking for an Engineering Manager to lead this team,
  develop our engineers, and help shape the technical
  direction of systems that influence how millions of people
  experience Spotify.

  What You'll Do

  - Lead and grow a team of machine learning, backend, and data
    engineers, supporting their development and helping them
    deliver their best work.Shape the team's technical
    strategy and execution, ensuring engineering efforts align
    with listener needs and Spotify's broader business goals.
  - Guide the development of machine learning and recommendation
    systems that balance multiple objectives across
    personalized listening experiences.
  - Collaborate with Product and engineering partners to define
    priorities, align on outcomes, and translate complex
    challenges into clear plans.
  - Support the team in making thoughtful technical decisions
    across experimentation, scalability, system reliability,
    and model performance.
  - Create a culture of ownership, collaboration, and continuous
    improvement, where engineers feel empowered to experiment
    and learn.
  - Drive effective planning and delivery while balancing
    immediate priorities with long-term technical health.
  - Foster an inclusive, supportive team environment through
    coaching, feedback, and thoughtful people leadership.

  Who You Are

  Where You'll Be

  - We offer you the flexibility to work where you work best!
    For this role, you can be within the North Americas region
    as long as we have a work location.
  - This team operates within the Eastern Standard time zone for
    collaboration.

  The United States base range for this position is $227,495-
  $262,928 plus equity. The benefits available for this
  position include health insurance, six month paid parental
  leave, 401(k) retirement plan, monthly meal allowance, 23
  paid days off, 13 paid flexible holidays, paid sick leave.
  These ranges may be modified in the future.

  Spotify is an equal opportunity employer. You are welcome at
  Spotify for who you are, no matter where you come from, what
  you look like, or what’s playing in your headphones. Our
  platform is for everyone, and so is our workplace. The more
  voices we have represented and amplified in our business,
  the more we will all thrive, contribute, and be forward-
  thinking! So bring us your personal experience, your
  perspectives, and your background. It’s in our differences
  that we will find the power to keep revolutionizing the way
  the world listens.



  At Spotify, we are passionate about inclusivity and making
  sure our entire recruitment process is accessible to
  everyone. We have ways to request reasonable accommodations
  during the interview process and help assist in what you
  need. If you need accommodations at any stage of the
  application or interview process, please let us know - we’re
  here to support you in any way we can.
