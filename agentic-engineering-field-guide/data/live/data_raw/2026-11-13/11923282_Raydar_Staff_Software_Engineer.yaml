description: |
  About the company

  Our client is a software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Lead the technical direction of a productivity add-in and
  related suite integrations, owning designs from architecture
  through production launch. Build AI-assisted document
  editing features centered on clear, reviewable edits, while
  guiding other engineers on quality and developer experience.

  What you'll do

  - Set the technical direction for a productivity add-in and
    other productivity suite integrations.

  - Build AI-assisted editing features, including automated
    rewrites, tracked changes and workflow automation.

  - Partner with product, design, backend and adjacent
    engineering teams to define APIs and interfaces for AI-
    driven features.

  - Design maintainable solutions across desktop and web
    versions of the host application, including manifests and
    version compatibility.

  - Take features from architecture through production launch
    with polished interactions and robust error handling.

  - Coach fellow engineers and keep the quality bar high across
    code and developer tooling.

  Requirements

  What we're looking for

  - Typically five or more years of experience as a core
    software engineer.

  - Hands-on background creating a system that generates
    comparisons, change tracking or programmatic office
    document file editing.

  - Experience at large-scale technology companies or fast-
    paced, high-growth environments.

  - A track record of owning hard technical problems and
    shipping high-performance products that users depend on.

  - Ability to lead technical work in a fast-moving, high-
    intensity environment.

  Bonus points

  - Previously released add-ins for productivity software using
    a JavaScript-based add-in API.

  - Experience with enterprise software products.

  Benefits

  Compensation and benefits

  - Base salary: USD 231,000 to 340,000 per year

