description: |
  About Bask Health

  Bask Health is a software platform that enables
  entrepreneurs, doctors, and healthcare businesses to launch,
  manage, and grow direct-to-consumer telehealth businesses.

  Our platform brings together patient experiences, clinical
  workflows, pharmacy operations, and commerce tools in one
  place.

  We're an entrepreneurial, product-focused engineering team
  that values ownership, technical excellence, and building
  software that solves real problems. Engineers work closely
  with product teams and company leadership, take features
  from idea to production, and have a direct role in shaping
  the platform.

  Engineering at Bask is AI-first and builder-led. We use
  tools like Cursor and Claude Code throughout development
  while maintaining high standards for reliability, testing,
  and software quality.

  About the Role

  We're looking for a Junior Full Stack Engineer to join Bask
  Health's engineering team and help build and improve the
  applications that power our telehealth platform.

  You'll work across frontend and backend development,
  contributing to user-facing features, APIs, databases, and
  integrations. Depending on the project, you may help develop
  merchant tools, patient experiences, internal applications,
  or shared platform functionality.

  This role is designed for an early-career engineer who has
  experience building web applications through coursework,
  internships, personal projects, or professional work and
  wants to continue developing their full-stack engineering
  skills.

  You'll collaborate with experienced engineers, product
  managers, and designers to deliver reliable, maintainable
  software. You'll receive technical guidance while gradually
  taking on more ownership of features and implementation
  decisions.

  We're looking for someone who enjoys solving problems, takes
  initiative, and is excited to grow into an engineer who can
  build and maintain features across the entire application
  stack.

  What You'll Do

  - Build and improve full-stack features across Bask's web
    applications.
  - Develop frontend interfaces using JavaScript, TypeScript,
    and React.
  - Contribute to applications built with Next.js.
  - Help implement backend functionality using Node.js and
    TypeScript.
  - Build and integrate APIs connecting frontend applications
    with backend services.
  - Work with SQL databases to retrieve, update, and manage
    application data.
  - Contribute to merchant-facing and patient-facing application
    features.
  - Help develop internal tools and operational workflows.
  - Implement reusable frontend components and application
    functionality.
  - Collaborate with product managers and designers to
    understand feature requirements.
  - Translate technical specifications into working software.
  - Assist with third-party API integrations.
  - Help improve application responsiveness, usability, and
    accessibility.
  - Investigate and resolve bugs across frontend and backend
    systems.
  - Write readable, maintainable, and well-tested code.
  - Participate in code reviews and incorporate technical
    feedback.
  - Learn and apply best practices for authentication,
    authorization, and data security.
  - Contribute to automated testing and quality assurance.
  - Work with experienced engineers to understand application
    architecture.
  - Help document technical changes and development processes.
  - Participate in engineering planning and implementation
    discussions.
  - Learn about cloud-based applications and deployment
    workflows.
  - Use Git and collaborative development tools.
  - Use AI-assisted development tools while understanding and
    validating generated code.
  - Take increasing ownership of assigned engineering features
    and improvements.

  Requirements

  - Foundational software engineering experience gained through
    coursework, internships, personal projects, freelance
    work, or professional roles.
  - Experience building web applications with both frontend and
    backend functionality.
  - Working knowledge of JavaScript or TypeScript.
  - Familiarity with React or another modern frontend framework.
  - Basic understanding of HTML, CSS, and responsive web
    development.
  - Familiarity with Node.js or another backend development
    environment.
  - Understanding of REST APIs and frontend-to-backend
    communication.
  - Basic knowledge of SQL databases or relational data.
  - Familiarity with asynchronous programming concepts.
  - Understanding of reusable frontend components and
    application state.
  - Ability to read, understand, and modify existing application
    code.
  - Familiarity with Git and version control.
  - Basic debugging and troubleshooting skills.
  - Understanding of common software development and testing
    practices.
  - Willingness to learn authentication, authorization, and
    application security principles.
  - Ability to follow technical documentation and implementation
    guidance.
  - Interest in building and maintaining production web
    applications.
  - Strong problem-solving skills and attention to detail.
  - Ability to communicate technical questions, progress, and
    challenges clearly.
  - Willingness to collaborate with engineers, designers, and
    product managers.
  - Openness to feedback, mentorship, and continuous learning.
  - Ability to work independently on clearly defined tasks in a
    remote environment.

  Nice to Have

  - Previous software engineering internship or junior
    development experience.
  - Experience with TypeScript, React, and Next.js.
  - Experience building backend applications with Node.js.
  - Familiarity with SQL databases and ORM tools.
  - Experience with Prisma or Drizzle ORM.
  - Familiarity with tRPC or typed API frameworks.
  - Exposure to AWS or another cloud platform.
  - Familiarity with serverless application development.
  - Experience using AWS Lambda or other cloud functions.
  - Familiarity with SST or similar infrastructure frameworks.
  - Experience with automated frontend or backend testing.
  - Exposure to CI/CD pipelines and application deployment.
  - Experience building SaaS applications or internal business
    tools.
  - Familiarity with multi-tenant application concepts.
  - Experience working in a TypeScript monorepo.
  - Interest in e-commerce, merchant platforms, or subscription
    software.
  - Interest in healthcare or telehealth technology.
  - Experience using AI-assisted development tools such as
    Cursor or Claude Code.
  - A GitHub profile or portfolio demonstrating full-stack
    application projects.
