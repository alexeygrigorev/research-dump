description: |
  As a Senior Software Engineer on the Database Integration &
  Observability team, you will drive core initiatives across
  three key areas:

  - Ecosystem Integrations: Seamlessly connect the MongoDB
    database with key ecosystem products, including Search,
    Vector Search, Atlas Stream Processing, and Atlas Data
    Federation
  - Change Data Capture & Streaming: Enhance and scale our
    Change Streams product, enabling real-time event tracking
    and data synchronization across downstream systems.
  - Database Observability: Build advanced diagnostics, query
    shape statistics, logging systems, and process-level
    metrics to deliver deep operational insights

  Our core services are built primarily in modern C++, though
  prior professional C++ experience is not required if you
  possess strong systems programming fundamentals. Our testing
  and automation infrastructure utilizes JavaScript and
  Python.

  This role can be based out of one of our US offices or
  remotely in the United States.

  Candidate Profile

  - 5+ years of experience in software development and/or
    performance engineering
  - Experience with large backend/compiled codebases, such as
    Rust or C/C++
  - Solid computer science fundamentals with expertise in data
    structures, algorithms, concurrency, and software design
    architecture
  - Strong interest in database internals, query engines, and
    distributed systems architecture (hands-on experience or
    an advanced degree like an M.Sc./Ph.D. in databases is a
    plus).
  - Experience with observability tooling (e.g. time series
    metrics, dashboards)

  Position Expectations

  - Design, implement, and optimize integrations connecting the
    MongoDB query engine with our broader ecosystem
  - Write clean, maintainable, and high-performance C++ code
    while actively participating in code reviews and design
    discussions
  - Lead projects end-to-end—from initial design to
    implementation and support.
  - Collaborate cross-functionally with product and engineering
    peers to define technical roadmaps and deliver robust
    engineering solutions

  Success Measures

  - In 3 months, you'll have shipped code into production and
    collaborated with the team to solve tough problems
  - In 6 months, you'll have contributed to a large project
  - In 12 months, you'll have designed new features, led
    development work, and become a go-to expert on parts of
    the system

