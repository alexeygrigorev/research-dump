description: |
  Ambrook helps American family-run businesses become more
  profitable and resilient. From volatile markets to climate
  shifts, independent operators face mounting pressure. While
  sustainable investments often yield the best long-term
  returns, they require financial clarity and capital that
  fragmented legacy systems can’t provide. We are rebuilding
  the financial infrastructure that real economy operators
  rely on. By replacing paperwork with modern tools for
  accounting, banking, and spending, Ambrook gives owners the
  data they need to prove viability to lenders and the next
  generation. We empower the stewards of land and labor to
  make confident investments in their future. We’re a Series B
  startup backed by Lachy Groom, Thrive Capital, Dylan Field,
  Thomson Reuters Ventures, Cameron Ventures, and leaders at
  Notion, Gusto, and Vercel. We’re looking for team members to
  help us untangle the intersection of American industry,
  climate, and the economy.

  About Ambrook Labs

  Ambrook Labs is a small team purpose-built for rapid
  experimentation on customer-facing AI applications. We
  prototype, ship, and learn from AI experiments that turn
  Ambrook's proprietary advantages into category-defining
  capabilities no horizontal tool can replicate. Ambrook
  customers span industries underserved by modern AI — the
  opportunity is to define what business tools look like when
  they're built with real operational context, data, and
  domain depth from the start.

  The team: Jeff Anders (co-founder, head of design), Henry
  Bridge (tech lead), plus 2-3 new engineers (you?). Read more
  at ambrook.com/labs.

  What you'll do

  - Run experiments end to end in 1-2 week cycles — prototype,
    ship to real customers, learn, repeat
  - Work directly with operators across agriculture,
    construction, trucking, and other industries to ground
    experiments in real problems
  - Build the eval framework that lets the team move fast with
    confidence
  - Share what you learn — internal demos and external write-ups
    are a core output, not an afterthought
  - Help figure out what's worth scaling and what's not — and be
    right often enough that the team builds conviction about
    where to invest

  What you bring

  - You've shipped AI/LLM-powered features to real users, not
    just demos or internal tools
  - You're comfortable across the stack: frontend, API, prompts,
    evals
  - You've built 0-to-1 products and are excited by ambiguity,
    scoping from scratch, and making strategic decisions
    alongside technical ones
  - You have a track record of self-direction: you've
    consistently identified important problems and gone after
    them
  - You write and share naturally, both internally and
    externally
  - You have a portfolio of side projects, open source work, or
    the like that shows how you generate and build on ideas
  - You've demonstrated curiosity about underserved industries:
    you've read about them, talked to people in them, built
    something for them, or otherwise taken real action

  Why this role

  - You'll build AI for customers and industries where the gap
    between what exists and what's possible is enormous
  - The Labs team has the buy-in and autonomy to move from idea
    to shipped experiment rapidly
  - Direct access to real customers from day one
  - Ambrook's data pipeline, domain models, and customer
    relationships give you a foundation for novel approaches
    and real-world impact
  - You'll help define how the team operates, not just what it
    builds

  Ambrook is an equal opportunity employer. We encourage you
  to apply even if you don't meet every qualification listed
  above. If you've built things you're proud of and you're
  excited about this problem space, we want to hear from you.
