description: |
  Overview

  CoreAI is at the forefront of Microsoft’s mission to
  redefine how software is built and experienced. We are
  responsible for building the foundational platforms,
  services, programming models, and developer experiences that
  power the next generation of applications using Generative
  AI. Our work enables developers and enterprises to harness
  the full potential of AI to create intelligent, adaptive,
  and transformative software.    



  Microsoft Foundry Experiences team within CoreAI builds
  SDKs, UI, and agentic experiences that span core AI
  capabilities including model inferencing, knowledge and
  memory systems, AI services, model customization, and multi-
  agent solutions. As a Principal Software Engineering Manager
  on this team, you will lead and grow a team of engineers
  responsible for delivering cohesive, scalable, and intuitive
  experiences that enable developers and enterprises to
  effectively build, deploy, and operate AI applications. You
  will set technical direction, coach engineers, and ensure
  the team deeply understands customer and developer needs in
  complex scenarios, translating them into durable platform
  capabilities and delightful experiences.



  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.   

  In alignment with our Microsoft values, we are committed to
  cultivating an inclusive work environment for all employees
  to positively impact our culture every day.   

  #CoreAI, #AIPlatform, #FoundryAgents, #AIJobs

  Responsibilities

  As a Principal Software Engineering Manager on the Microsoft
  Foundry team, your responsibilities will include:

  - Lead, grow, and coach a diverse and inclusive team of
    engineers to thrive in the fast-changing world of AI.

  - Set technical and product direction for the team, aligning
    engineering investments with customer needs and business
    priorities.

  - Create clarity and accountability by establishing goals,
    decision-making mechanisms, and execution rhythms that
    help the team deliver with predictability and impact.

  - Build a culture of ownership, inclusion, and continuous
    growth by setting high standards, building sustainable
    systems, and reinforcing learning through regular feedback
    and reflection.

  - Model and coach the team in AI-first engineering practices
    grounded in software engineering fundamentals, driving up
    both speed of execution and product quality.

  - Champion a customer-obsessed culture by guiding the team to
    turn customer and developer feedback into innovative
    platform improvements that address real-world needs.

  - Establish clear ownership and operating mechanisms that
    ensure live site health, effective incident response, and
    continuous improvement.

  Qualifications

  Required/minimum qualifications

  Bachelor's Degree in Computer Science or related technical
  field AND 8+ years technical engineering experience with
  coding in languages including, but not limited to, C, C++,
  C#, Java, JavaScript, or Python OR equivalent experience.

  Other Requirements: 

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include, but are not limited to the
  following specialized security screenings: 

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Additional or preferred qualifications

  - Master's Degree in Computer Science or related technical
    field AND 12+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python OR Bachelor's Degree in
    Computer Science or related technical field AND 15+ years
    technical engineering experience with coding in languages
    including, but not limited to, C, C++, C#, Java,
    JavaScript, or Python OR equivalent experience.

  - 6+ years of experience as a people manager.
  - 5+ years of technical leadership in defining and building
    developer experiences and scalable systems, preferably in
    the Generative AI, Machine Learning domain.

  - 10+ years of experience shipping software products, product
    development expertise, taking special pride in shipping
    delightful experiences that solve clear customer needs.

  - 5+ years of experience in JavaScript, React, Python, .NET,
    C#, or similar programming languages or platforms.

  - Experience leading cross-functional engineering efforts
    across distributed teams.

  - Experience delivering customer-facing software products or
    platform capabilities in production environments.

  - Demonstrated proficiency around leveraging AI to build AI
    systems and a passion to make this technology accessible
    to everyone

  - Proven record of identifying challenges, making clear
    judgment calls on tradeoffs, and making systemic changes
    for lasting impact, while bringing value to customer
    quickly.

  - Clarity in communication and ability to influence without
    authority when stakes are high.



  Software Engineering M6 - The typical base pay range for
  this role across the U.S. is USD $165,600 - $296,400 per
  year. There is a different range applicable to specific work
  locations, within the San Francisco Bay area and New York
  City metropolitan area, and the base pay range for this role
  in those locations is USD $220,800 - $331,200 per year.



  Certain roles may be eligible for benefits and other
  compensation. Find additional benefits and pay information
  here: https://careers.microsoft.com/us/en/us-corporate-pay

  This position will be open for a minimum of 5 days, with
  applications accepted on an ongoing basis until the position
  is filled.

