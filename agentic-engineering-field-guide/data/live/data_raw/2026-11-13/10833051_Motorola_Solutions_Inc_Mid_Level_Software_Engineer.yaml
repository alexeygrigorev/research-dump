description: |
  Company Overview

  At Motorola Solutions, we believe that everything starts
  with our people. We’re a global close-knit community, united
  by the relentless pursuit to help keep people safer
  everywhere. We build and connect technologies to help
  protect people, property and places. Our solutions foster
  the collaboration that’s critical for safer communities,
  safer schools, safer hospitals, safer businesses, and
  ultimately, safer nations. Connect with a career that
  matters, and help us build a safer future.

  Department OverviewAre you a software engineer looking for
  your next challenge? Are you looking to advance your career
  by collaborating with experts on a next-generation video
  management system? Do you want to join a highly skilled team
  based in Edinburgh and across the UK, influencing the
  direction of future features and bringing innovation and
  dynamism to our work? Motorola Solutions’ Avigilon Alta
  Video brings Cloud video security systems to the next level.
  Alta’s cloud-based video security solution offers industry
  leading full AI video analytics and exceptional operational
  insights. The Alta Video engineering team injects
  intelligence into their approach to security and all their
  solutions. They help organisations see, understand, and act
  on their surroundings to protect people, business, and
  reputation in real-time. We are seeking enthusiastic and
  talented graduates and software engineers with several years
  of experience to expand our teams and contribute to product
  development. We offer a hybrid working environment with 2
  days in our fantastic city centre office in Edinburgh. Job
  Description

  What You Will Do

  - Delivering high quality, reliable software in our cloud
    video management system in an agile environment.
  - Contributing to, and thriving in, a culture of collaboration
    and continuous improvement.
  - Collaborate within your cross functional team and with
    international colleagues.
  - Contribute to feature refinement and generate innovative
    solutions.
  - Participate in peer reviews, sharing and learning from
    others.

  Basic Requirements

  What you bring:

  - Strong skills in at least one general-purpose programming
    language, including any of: Golang, Python, C, C++, Rust
    or Java.
  - Several years of solid industry experience as a Software
    Engineer, although we will consider talented graduates as
    well.
  - Be able to demonstrate strong software development
    fundamentals
  - A passion for owning, building and delivering great software
    experiences for end-users.
  - A formal qualification (Degree) in Software Engineering,
    Computer Science or equivalent or a proven industry track
    record.
  - Experience with the use or adoption of AI tools in a
    software development context is preferred.
  - Exposure to Cloud platforms (GCP preferred).
  - Desire to build a T-shaped skill set combining deep
    expertise in backend services with a broader technical
    outlook.
  - Able to collaborate in-person in our Edinburgh office 2 days
    per week.

  The Avigilon Alta Video teams default to programming using
  Go for backend and Typescript for frontend, but also use a
  wide variety of different languages and frameworks. It is
  not expected that you would be familiar with Go (or any of
  the other languages we use) but you should be enthusiastic
  and willing to learn new things!

  We are looking for a team player who thinks holistically,
  enjoys solving complex problems and thrives in an agile,
  cross functional environment.

  We believe that a diverse and inclusive workplace spawns
  innovation – the more diverse our employees are, the more
  ideas and talents we have to excel as a leader in the
  technology sector. If you would like to be part of a dynamic
  team of people who are ambitious, focused, and hardworking
  then we look forward to meeting you!

  In return for your expertise, we’ll support you in this new
  challenge with coaching & development every step of the way.
  Also, to reward your hard work you’ll get:

  - Competitive salary and bonus schemes.
  - Two weeks additional pay per year (holiday bonus).
  - 25 days holiday entitlement + bank holidays.
  - 10% time (1 day in every 10 to pursue innovation and
    personal development).
  - Attractive defined contribution pension scheme.
  - Employee stock purchase plan.
  - Flexible working options.
  - Private medical care.
  - Life assurance.
  - Enhanced maternity and paternity pay.
  - Career development support and wide ranging learning
    opportunities.
  - Employee health and wellbeing support EAP, wellbeing
    guidance etc.
  - Carbon neutral initiatives/goals.
  - Corporate social responsibility initiatives including
    support for volunteering days.
  - Well known companies discount schemes.

