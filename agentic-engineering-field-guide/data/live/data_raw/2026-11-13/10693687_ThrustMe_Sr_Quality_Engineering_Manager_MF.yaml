description: |
  At ThrustMe, we develop and manufacture advanced electric
  propulsion systems that enable satellites to maneuver safely
  and efficiently once in space. Our products are already
  operating in orbit on close to one hundred satellites around
  the world, and we are now entering a new phase of industrial
  growth. As our organisation grows and production volumes
  increase, ensuring quality at every step is becoming
  critical.

  We are therefore looking for an experienced Senior Quality
  Engineering Manager (M/F) to build and lead our quality
  function.

  Reporting directly to the CEO, you will unify and lead the
  quality assurance and quality control functions, and
  establish a strong quality culture across the company. You
  will ensure our products and processes meet the highest
  standards expected by our customers and the space industry.

  This is a unique opportunity to build the quality function
  of a rapidly growing industrial company and play a key role
  in scaling one of Europe's leading space technology
  companies.

  Your responsibilities:

  - Build and lead ThrustMe's Quality function by bringing
    together Quality Assurance and Quality Control under one
    unified function.
  - Establish company-wide quality processes, standards and a
    culture of continuous improvement.
  - Lead customer and supplier quality activities, including
    audits, quality reviews and issue resolution.
  - Drive product and manufacturing improvements through root
    cause analysis, CAPA and quality performance monitoring.
  - Prepare the company for future quality certifications and
    support the development of a scalable Quality Management
    System.

  Your profile:

  - Master's degree in Mechanical Engineering, Electrical
    Engineering, Mechatronics, Industrial Engineering,
    Physics, or another relevant technical discipline.
  - Strong experience in Quality Engineering or Quality
    Management (more than 8 years) within a manufacturing or
    high-technology industry.
  - Proven experience leading quality teams and implementing
    quality systems in a growing organization.
  - Strong background in customer quality, supplier quality and
    audit management.
  - Experience with continuous improvement methodologies, root
    cause analysis and CAPA.
  - Experience in aerospace, space, automotive, medical devices
    or another high-reliabilitiy industry is a strong
    advantage.

  WHY JOIN THRUSTME?

  Joining ThrustMe means joining a company where innovation
  moves from the laboratory to orbit. You will have the
  opportunity to build an entire quality organization from the
  ground up, influence company-wide processes, and work
  alongside highly talented engineers and scientists
  developing world-leading space technologies.

  This is a high-impact leadership position with direct
  visibility at executive level, where your work will shape
  the quality culture and industrial excellence of a company
  entering its next phase of industrial growth.
