description: |
  Our Mission: Hospital-Quality Care, Everywhere.

  The healthcare industry still relies on faxes and phone tags
  to coordinate critical care for patients at home. We think
  patients and the clinicians who serve them deserve better
  than a system stuck in 1995.

  Verse Medical is building the modern software infrastructure
  to make it happen. We're a well-funded Series C company
  (backed by General Catalyst, SignalFire, and Sapphire
  Ventures) on a mission to heal a fragmented system. Our
  platform connects the dots between providers, payors, and
  patients, ensuring people get the high-quality care they
  need, reliably and right where they live. We’re growing fast
  and looking for people who are driven by this mission to
  join us!

  Our Values: The Principles That Guide Us

  Our values are the operating system for how we work together
  and with our partners. They aren't just words on a wall;
  they are the principles we bring to every decision, every
  day.

  - We are transparent, upfront and direct. We operate with
    honesty and clarity. We share information openly, the good
    and the bad, and believe that direct, respectful feedback
    is the foundation of trust and progress.
  - We value speed of iteration. We are building something new,
    which means we learn by doing. We prioritize rapid
    iteration and getting solutions into the hands of users,
    believing that progress is more valuable than perfection.
  - We give 110% effort, 30% of the time. We are passionate
    about our mission, and there are moments that require us
    to go the extra mile. We believe in focused intensity when
    it counts, balanced by a sustainable pace that keeps our
    team energized for the long run.
  - We empathize with customers to a fault. When our users face
    a problem, we own it. Instead of asking them to change, we
    ask ourselves, "How can we make this better?" We believe
    true innovation comes from deep empathy and a relentless
    focus on solving the real-world challenges of healthcare.

  Your Impact: How You'll Help Us Heal a Broken System

  As a Full Stack Software Engineer, you'll be shaping the
  future of at-home care. You'll be a key part of the team,
  working closely with customers & internal teams to define
  exactly what needs to be built. Our engineers deeply
  understand our users’ and internal needs, which has been a
  big key to our success.

  What You'll Achieve: A Glimpse into Your Contributions

  Within your first year, you will have the opportunity to
  work on critical initiatives for Verse. This includes, but
  not limited to:

  - Document extraction with LLMs
    - Programmatically translating complex and nuanced medical
      documents into structured info to automate ordering and
      validation.
    - This directly works to get patients the care they need more
      accurately and more quickly while saving medical
      professionals time and stress.
  - Laying the groundwork for new DME (durable medical
    equipment) categories
    - Working toward a strategic priority to expand into new DME
      categories to increase the appeal of our product to
      entire healthcare systems and diversify our sales motion
      and business model.
    - Building an extensible application in entirely new verticals
      (e.g. oxygen tanks, wheel chairs, etc) in a way that
      minimizes duplication, maximizes speed, and allows us to
      iterate quickly on user learnings.
  - Building increasingly sophisticated automation to fulfill
    orders
    - The home health DME space is complex.
      - It does not operate at all like an ecommerce platform. If
        you order a backpack from amazon, you (as the user)
        pick the exact SKU that gets sent out (color, brand,
        size, etc). That’s not how it works in our space.
      - Nurses only send in some detail about the prescribed DME
        products with the patient information. We have to
        translate this into specific products that:
        - Meet the patient need
        - Are (ideally) covered by insurance, which is very hard to
          know definitively.
        - Adhere to the customized way that the clinic wants to
          operate (notification styles, brand preferences,
          product terminology etc)
        - Are in stock, available, and financially sustainable.

  There is a long tail of special cases, nuanced business
  logic, etc. that goes into fulfilling these orders. Our goal
  as engineers is to build an increasingly sophisticated
  system that captures more and more of this over time.

  What You'll Bring: The Skills for Our Shared Mission

  We believe that diverse experiences and backgrounds lead to
  better solutions. While we have an idea of what will help
  someone succeed in this role, we are open to being convinced
  by your unique story and skills. If you believe you can
  achieve the outcomes above, we encourage you to apply.

  Core Skills & Experience:

  - Deep understanding and proficiency in CS fundamentals and
    programming.
  - Desire to be a part of a dynamic, growing team.
  - Must be graduating from university within the next 6 months.

  Our Team & Our Tools

  You'll be joining the Engineering team, a group of talented
  innovators who value pragmatism, simplicity, and speed of
  execution. We collaborate closely and believe the best ideas
  can come from anywhere.

  The tools and technologies you'll use include

  - Languages: Python, Typescript
  - Frameworks: Flask, React, Apollo GraphQL
  - Infrastructure: Postgres, Airflow, AWS, Google Cloud
    Platform

  About The Interview Process

  - Introductory Call (30 minutes): A conversation with a Verse
    Talent Partner to discuss your background, interests, and
    the role.
  - Technical Interview (90 minutes): A live technical session
    with one of Verse’s engineers.
  - Onsite Technical Interview (4 hours): An in-depth technical
    exercise and a discussion with Verse’s Engineering
    Leadership.
  - Final Head of Engineering Interview (45 minutes): A
    conversation with Verse’s Head of Engineering to align on
    vision, values, and long-term impact.

  Interview Note: To support a more interactive and engaging
  experience, we ask candidates to keep their cameras on
  during interviews.

  The Rewards & Reality: Compensation, Benefits & Logistics

  We believe in taking care of our team, both professionally
  and personally. Here’s what we offer:

  - Meaningful Compensation: $130,000-$140,000 base salary +
    equity
    - While our compensation bands provide a clear framework,
      every candidate is assessed on a case-by-case basis.
      Your final offer will be thoughtfully determined by your
      individual experience, interview performance, and
      current market data.
  - Comprehensive Health & Wellness: We cover 100% of your
    health insurance premium and provide access to high-
    quality dental and vision insurance plans for you and your
    dependents.
  - Plan for the Future: We offer a 401(k) plan to help you save
    for your future. At this time, the company does not offer
    a 401(k) match.
  - Career Growth: You'll have opportunities for rapid career
    advancement in a company that's at a major inflection
    point. We want you to grow with us.

  Work Environment & Location

  - This role is either based in our New York City office in
    Chelsea or our new San Francisco hub. You will play a
    critical role in shaping the engineering culture and team
    structure. We have a hybrid model, with a requirement of 4
    days per week in the office to foster collaboration and
    innovation. Unfortunately, we are not able to accept
    remote applications at this time.
  - Please note that at this time, we are not able to provide
    visa sponsorship for this position. All candidates must be
    authorized to work in the United States.

  Our Pledge for an Equitable Future

  At Verse Medical, our mission is to deliver equitable,
  hospital-quality care to everyone, regardless of their
  background or where they live. We can only achieve this if
  our own team reflects the diversity of the patients we
  serve. We are committed to building a workplace where
  everyone feels a sense of belonging, where their
  contributions are valued, and where they can do their best
  work. We embrace diversity of all kinds: race, gender, age,
  religion, identity, experience. We are actively working to
  build a more inclusive and equitable world, starting from
  within our own walls. We are an equal opportunity employer.

  We are also committed to providing a positive and accessible
  interview experience. If you require any accommodations to
  participate in our process, please contact us at
  recruiting@versemedical.com.
