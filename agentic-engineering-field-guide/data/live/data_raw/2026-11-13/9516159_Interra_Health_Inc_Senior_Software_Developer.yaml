description: |
  Who We Are: Interra Health is a fast-growing healthcare
  technology company transforming how providers and patients
  navigate the prescription journey. Formed through the merger
  of DoseSpot, Arrive Health, and pVerify, Interra Health
  delivers trusted eligibility, real-time coverage and pricing
  insights, prescribing tools, and pharmacy transparency at
  the point of care—helping providers make informed decisions
  and patients access the right medications with greater
  clarity and affordability. Backed by strong market momentum
  and a bold vision for the future of connected care, Interra
  Health offers the chance to join an innovative, mission-
  driven team working at the intersection of software and
  healthcare to reduce friction, improve access, and make the
  healthcare experience better for everyone.

  The Role:

  As a Senior Software Developer, you will design, build, and
  maintain modern, scalable

  cloud-native applications using .NET (C#) and React on
  Microsoft Azure. Contributing

  across the full stack, you will deliver performant backend
  API services and intuitive front-

  end experiences that support product growth and platform
  stability — on a system that

  demands high concurrency, high transaction volumes, and
  exceptional reliability.

  You will work cross-functionally with product, cloud, and
  engineering teams to deliver high-

  performance solutions that improve patient outcomes and
  modernize how healthcare is

  delivered. You bring deep technical expertise, a cloud-
  native mindset, and an AI-first

  approach to every layer of the software development
  lifecycle.

  Key Responsibilities:

  Backend Development

  - Design and build robust, scalable, and maintainable backend
    services using .NET Core (C#), following clean
    architecture and SOLID principles.
  - Develop and maintain RESTful and event-driven APIs capable
    of sustaining high-throughput, concurrent workloads.
  - Develop data access layers using MS SQL Server, with a
    strong emphasis on query optimization, indexing
    strategies, connection pooling, and transaction management
    for high-volume environments.
  - Implement resilience patterns including circuit breakers,
    retry policies to ensure system stability under load.

  Design and deploy cloud-native solutions leveraging core
  Azure services:

  - Azure App Services — hosting and scaling web APIs and front-
    end applications.
  - Azure Function Apps — building lightweight, event-driven
    compute components.
  - Azure Event Grid — designing reactive, decoupled event-
    driven architectures for distributed systems.
  - Azure Storage Accounts — implementing Blob Storage, Queue
    Storage, and Table Storage for scalable data and messaging
    needs.

  Frontend Development:

  - Build responsive, performant user interfaces using React 18+
    (TypeScript strict mode), following hooks-only, functional
    component patterns within an Nx monorepo structure.
  - Develop within and contribute to an internal design system
    built on Mantine, preferring shared component abstractions
    over raw library usage.
  - Implement scalable data-fetching using React Query and
    internal API hooks, with clean separation of server state
    from UI state.
  - Write frontend tests using Jest and React Testing Library,
    maintaining 90%+ line coverage with mock-first patterns
    for all API hooks and external dependencies.
  - Collaborate with UX/design to translate wireframes and
    specifications into responsive UI experiences.
  - Optimize frontend performance for scalability through lazy
    loading, code splitting, and efficient rendering
    strategies.

  AI-First Engineering:

  - Apply an AI-first mindset to daily development — leveraging
    AI-powered tools such as GitHub Copilot, Claude Code, and
    AI-assisted testing and observability platforms as
    foundational instruments to accelerate productivity and
    elevate code quality.
  - Evaluate and champion the adoption of emerging AI tooling
    across the engineering team, driving continuous
    improvement in how the team designs, builds, and validates
    software.

  Quality Engineering:

  - Write comprehensive unit, integration, and end-to-end
    automated tests as a core part of the development workflow
    — not an afterthought.
  - Champion a test-first culture, ensuring testability is a
    primary design consideration in every feature and service.
  - Participate actively in code reviews, maintaining high
    standards for correctness, performance, security, and
    long-term maintainability.

  Core Skills and Collaboration:

  - Collaborate with product owners, and DevOps engineers to
    deliver cohesive, reliable solutions
  - Contribute to system design, architecture decisions, and
    performance optimizations
  - Support software delivery through CI/CD pipelines across QA,
    Staging, and production environments.
  - Write clean, maintainable, and well-tested code following
    industry best practices
  - Participate in code reviews, mentoring, and knowledge
    sharing across the team
  - Ensure secure, reliable, and compliant systems in a
    regulated environment (e.g., healthcare or finance if
    applicable)

  What You’ll Bring:

  - Bachelor’s degree in Computer Science or a technology-
    related field; or equivalent experience with at least ten
    (10) years of strong technical experience in .NET (C#) and
    React.
  - Solid understanding of API design, REST principles,
    authentication/authorization (OAuth2, JWT, etc.)
  - Proficiency with SQL Server and data modeling.
  - A minimum of three (3) years of practical experience in
    Microsoft Azure.
  - Experience with React, JavaScript/TypeScript and full-stack
    development required.
  - Familiarity with CI/CD workflows using Azure DevOps or
    GitHub Actions.
  - Experience working in agile/scrum methodology.
  - Detail oriented with the ability to multitask, manage time,
    and communicate effectively.
  - Demonstrated ability to independently apply a broad range of
    theories, concepts, principles, and methodologies to
    product projects involving complex features.
  - Experience with microservice architecture, CQRS, or event-
    driven design preferred.
  - Exposure to containerization technologies like Docker or
    Kubernetes preferred.
  - Experience in regulated industries such as healthcare or
    finance preferred.
  - Familiarity with monitoring, logging, and observability
    tools (e.g., App Insights, OpenTelemetry) preferred.

  Core Competencies:

  Knowledge & Application:

  Complete knowledge and full understanding of area of
  specialization, principles and practices within a
  professional discipline. Assesses unusual circumstances and
  uses sophisticated analytical and problem solving techniques
  to identify cause. Resolves and assesses a wide range of
  issues in creative ways and suggests variations in approach.
  This job is a for fully qualified, experienced professional.

  Complexity & Problem Solving:

  Works on problems of diverse scope where analysis of
  information requires evaluation of identifiable factors.
  Devises solutions based on limited information and precedent
  and adapts existing approaches to resolve issues. Uses
  evaluation, judgment, and interpretation to select right
  course of action. Work is done independently and is reviewed
  at critical points.

  Collaboration & Interaction:

  Enhances relationships and networks with senior internal/
  external partners who are not familiar with the subject
  matter often requiring persuasion. Adapts style to differing
  audiences and often advises others on difficult matters.

  Working Conditions & Environment:

  - Fully remote role within the United States
  - Periodic travel (approximately 10-15 %) for team meetings,
    and company events
  - Operates in a fast-paced, growth-oriented, PE-backed SaaS
    environment
  - Requires cross-functional collaboration across Product,
    Sales, Customer Success,and Executive Leadership
  - Ability to manage multiple concurrent product launches and
    shifting priorities.

  Success in this role requires the ability to balance
  synchronous collaboration with

  thoughtful asynchronous execution in a remote-first
  environment

  Benefits & Perks:

  💸Competitive compensation

  🌍Remote-first

  Work from anywhere in US. We also provide a one-time home
  office stipend to set up your workspace, plus a monthly Wi-
  Fi reimbursement.

  Flexible work  Flexible scheduling and core collaboration
  hours (10:00 AM – 3:00 PM ET), giving you space for both
  deep work and real life.

  ✈ Company-wide offsite  We invest in connection—join us for
  an annual offsite to collaborate, build relationships, and
  have some fun together.

  🌴Time off that you’re expected to use  Flexible PTO designed
  for real recharge, plus 17 company holidays, paid sick
  leave, and paid parental leave.

  💙Comprehensive health coverage  Choose from multiple medical
  plan options with significant company premium contributions,
  along with dental (including orthodontia) and vision
  coverage for you and your family. Includes company
  contributions to HSA/FSA accounts (based on plan selection).

  💰Financial wellness  401(k) with company match to help you
  plan for the future.

  Interra Health is an Equal Employment
  Opportunity/Affirmative Action employer and all qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, age, national origin,
  protected veteran status, disability status, sexual
  orientation, gender identity or expression, marital status,
  genetic information, or any other characteristic protected
  by law.
