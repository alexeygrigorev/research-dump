description: |
  About Evergrowth

  Evergrowth is built on the belief that AI agents should act
  as digital colleagues, not just automate tasks. Our Agentic
  GTM Workspace enables revenue teams to collaborate and win
  with AI-powered teammates—breaking down silos and helping
  B2B teams grow smarter with fewer resources.

  We’re backed by leading European and American VCs, as well
  as successful entrepreneurs and operators with multiple
  exits. Our mission: replace outdated, record-centric GTM
  stacks with a customer-centric workspace that empowers
  sales, marketing, enablement, and RevOps to do meaningful,
  creative work.

  Evergrowth is the antithesis of the “AI-SDR” or spray-and-
  pray approach. Our platform enables real, strategic customer
  conversations by helping teams cherry-pick the highest-
  potential companies and most relevant contacts, ensuring
  every outreach is highly personalized and designed for
  meaningful business impact.

  What You’ll Do

  - Design, develop, and scale backend services for AI-driven
    sales automation and agentic workflows.
  - Own end-to-end features: from database and APIs to
    background processing and integrations.
  - Collaborate with product, AI, and front-end teams to deliver
    seamless, scalable solutions.
  - Champion best practices in code quality, testing,
    performance, and security.

  Technical Skills We’re Looking ForCore Programming Languages

  - Strong proficiency in PHP 8.2+ (primary language across most
    services)
  - Experience with Python (for AI Agents services)
  - Modern PHP frameworks: Laravel 12 and Symfony
  - Understanding of async programming and queue-based
    architectures

  Database Technologies

  - MySQL/MariaDB expertise (primary DB)
  - Redis for caching & queue management
  - Google Cloud Firestore (NoSQL) experience
  - Google BigQuery for analytics & data warehousing
  - Database optimization, indexing, and performance tuning

  API Development

  - Strong RESTful API design & implementation
  - Experience with API documentation tools (Swagger/OpenAPI,
    Scramble, L5-Swagger)
  - Token-based authentication: JWT, Bearer tokens, Auth0
  - API versioning and backward compatibility
  - Webhook design and processing

  Message Queuing & Background Processing

  - Laravel Queue system & Redis as queue backend
  - Symfony Messenger with AWS SQS
  - Temporal for workflow orchestration
  - Async job processing and retry mechanisms

  Integration Experience

  - Integrations with third-party APIs (LinkedIn, Google APIs,
    CRM systems)
  - Webhook processing & event-driven architectures
  - Experience with Ampersand Platform or similar CRM
    integrations
  - LLM/AI integrations: OpenAI, Azure OpenAI, Google Gemini

  DevOps & Infrastructure

  - Docker containerization and orchestration
  - AWS services: S3, SQS, ECS
  - Nginx configuration
  - CI/CD pipelines: GitHub Actions
  - Environment management and configuration

  AI/ML Technologies (Plus)

  - LangChain/LangGraph for AI workflows
  - LLM providers & prompt engineering
  - AI agent architecture familiarity (OrqAI or similar tools)

  Architecture & Design

  - Microservices and service-oriented design
  - Multi-tenant app design & event-driven architecture patterns
  - Distributed systems & scalability
  - Modular, extensible architecture experience

  Additional Technical Skills

  - WebSocket for real-time features
  - RoadRunner or similar high-performance PHP servers
  - Testing frameworks: PHPUnit, Larastan
  - Error tracking: Sentry
  - Code quality tools: PHP CodeSniffer, Laravel Pint
  - Performance monitoring & optimization

  What We Value

  - Startup mentality: Proactive, independent, and hands-on
  - Teamwork: Strong communication and willingness to share
    knowledge
  - Passion for emerging tech, AI, and automation
  - Experience in B2B SaaS or sales tech is a plus

  Why Join Evergrowth?

  - Shape the future of agentic B2B sales tech
  - Work on cutting-edge AI and automation
  - Competitive salary, stock options, and benefits
  - Remote-first, flexible culture
