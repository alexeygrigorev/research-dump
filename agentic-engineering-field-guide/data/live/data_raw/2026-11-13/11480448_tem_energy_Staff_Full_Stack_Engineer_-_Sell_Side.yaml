description: |
  📈 Who We Are:

  We are rebuilding the energy transaction, making it
  transparent and fair.

  We're rebuilding how energy is bought and sold. That means
  cutting out middlemen, connecting businesses directly with
  renewable generators, and ensuring every transaction is
  traceable and transparent.

  We're a 160+ person team - operators, data scientists,
  engineers, customer champions and energy experts - backed by
  top-tier investors including Lightspeed Venture Partners,
  Hitachi Ventures, Allianz, AlbionVC and Atomico. We closed a
  $75M Series B round in early 2026, taking our total funding
  to $94M, and we now power energy for over 4,000 UK
  businesses across 8,500+ sites, with over £75m in value
  returned to businesses and generators so far.

  We're a technology company solving the energy industry, not
  an energy company. Some people call us a neo-utility, the
  neo-bank idea, applied to energy.

  The industry is noticing. We were crowned Europe's Most
  Exciting Tech Company at the GP Bullhound Allstars awards,
  came in at #6 on LinkedIn's Top Startups 2026 in the UK, #7
  on the Scaling Europe 50 of Europe's fastest-growing
  companies, and #14 on Sifted's AI 100.

  Learn more about us on our website.

  🏅 The Role:

  We're hiring a Staff Software Engineer to join Origination &
  New Products, a new three-person squad inside Sell Side
  Growth.

  Sell Side Growth originates, contracts, and retains the
  renewable generators whose volume powers our platform -
  without generators, there's no product. The engine is
  scaling fast, and much of the manual process underneath
  today's pipeline - tendering, contracting, onboarding -
  needs to be rebuilt to handle that growth rather than buckle
  under it.

  This is a deep, hands-on IC role, not a squad-lead one -
  that's owned by the Staff/Senior Staff engineer leading the
  initiative. You're free to go all-in on the hardest
  technical problems: integration with Rosso (our pricing and
  settlement engine), Control Room (our core tendering and
  pipeline platform), and the deal-gating risk tooling that
  lets us take on genuinely new categories of commercial risk
  safely. We're not hiring for leadership polish here. We're
  hiring a ridiculously good engineer.

  In your first 12 months, you might:

  - Own architecture-level decisions on the integration-heavy
    systems connecting Origination & New Products to Rosso,
    Data, and Billing.
  - Help ship the first new product category live and generating
    qualified pipeline within 6 months.
  - Help solve the tendering automation problem that currently
    limits how much volume the team can quote on - one of the
    highest-leverage levers for supporting our growth.
  - Contribute to productising a currently manual, error-prone
    pricing process that's already turning away large, complex
    deals.
  - Design deal-gating risk tooling for commercial risk
    categories that don't exist yet at tem, within our
    React/TypeScript and Python/AWS serverless stack.



  🚀 Responsibilities:

  - Go deep on hard systems: Own architecture-level decisions on
    integration-heavy systems, reasoning clearly about
    boundaries, contracts, and failure modes.
  - Build for ambiguity: Take a piece of an undefined,
    commercially-driven problem and turn it into a shippable
    plan, within the direction your squad lead sets.
  - Work across boundaries: Deliver on dependencies that sit
    with teams you have no authority over, such as Rosso,
    Data, and Billing, getting integrations right without
    needing to own the relationship.
  - Build with impact: Design, build, and ship the hardest parts
    of the new-product build sequence yourself, backend-first
    but comfortable moving into the React/TypeScript front end
    when it matters.
  - Maintain high standards: Write clean, well-tested code,
    contribute to code reviews, and help improve team
    practices and documentation.



  🎯 Requirements:

  Must-Haves:

  - Deep technical depth in backend and systems design, with a
    track record of owning architecture-level decisions on
    complex, integration-heavy systems.
  - Comfortable in our core stack: Python, AWS serverless
    (Lambda, API Gateway, DynamoDB, EventBridge), and event-
    driven architectures. React/TypeScript exposure is a plus
    but not the bar.
  - Comfort operating without a full spec: able to take a
    defined slice of an ambiguous problem and turn it into a
    shippable plan.
  - Experience delivering work where a critical dependency sits
    with a team you have no authority over.
  - Proven product delivery experience: experience as a Full
    Stack or Backend Engineer in a startup or fast-paced
    product environment, with ownership of complex projects
    from start to finish.

  Desirable:

  - Prior experience mentoring engineers or setting technical
    direction, even without a formal leadership title. Not
    required. We'd rather have a brilliant engineer who has
    never led a squad than a mediocre one who has.
  - Experience in energy, fintech, or another regulated, high-
    stakes commercial domain.
  - Exposure to workflow orchestration, event-driven systems, or
    real-time pricing engines.
  - Experience originating new product lines from scratch rather
    than only scaling existing ones.



  ✨ Benefits & Perks:

  - Competitive salary - our current band for this role is
    £104,000 or equivalent in local currency.
    - We pay against a clear benchmark for your role and level. No
      fixed once- or twice-a-year cycle - pay moves when the
      evidence for it does.
  - Stock Options - everyone on the team has ownership in our
    mission.
  - 25 days holiday + public holidays - Swap public holidays for
    ones that matter most to you. Plus, get an extra day off
    for your birthday 🎉.
  - Remote & flexible working - We’re fully remote with clear
    core hours, and no internal meetings on Friday afternoons.
  - Home working & wellbeing budgets:
    - Up to £1,200 / €1,200 annually to upgrade your remote setup
      (co-working passes, equipment, etc.).
    - Up to £150 / €150 monthly on anything that supports your
      wellbeing - from therapy to gym memberships to
      meditation apps.



  🗣️ Interview Process:

  Our processes normally take around 2-3 weeks from first call
  to offer - please let us know about any adjustments to
  timelines that may be required.

  - First call with our Talent Team (30 Mins). This is to
    understand your experience, motivations, and discuss the
    role in more detail.
  - Behaviour Interview with our Engineering Managers (60 Mins).
    This is your chance to really understand the role, the
    expectations, and ensure alignment on ways of working.
  - Technical Interview with the Team (75 Mins). You’ll meet
    with potential peers in this session and will discuss
    technical topics and experiences.
  - Bar Raiser Interview with Stakeholders (45 Mins). The final
    session will be with two cross-functional stakeholders,
    and will explore how your values align with ours, and is
    designed to be a genuine two-way conversation, your chance
    to understand what it’s really like to work at tem.

  We welcome applications from people of all backgrounds,
  experiences, and identities, including those that are
  traditionally underrepresented in the tech and energy
  sectors. If you’re excited about this role but not sure you
  meet every requirement, we’d still love to hear from you.
  Your unique perspective could be exactly what we’re looking
  for.
