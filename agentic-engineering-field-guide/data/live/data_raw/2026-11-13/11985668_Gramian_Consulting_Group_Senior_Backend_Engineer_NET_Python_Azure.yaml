description: |
  About Gramian

  Gramian Consultancy is a boutique consultancy specializing
  in IT professional services and engineering talent
  solutions. With a strong background in software engineering
  and leadership, we help companies build high-performing
  teams by matching them with professionals who truly fit
  their needs.

  About the Role

  Our client is a Big4 Consultancy group that works with
  leading financial institutions on AI-driven transformation,
  automation, advanced analytics, and financial crime
  prevention. Their are building a production-grade AI-
  assisted KYC / Customer Due Diligence platform for an
  international insurance environment.

  We are looking for an experienced Backend / Full-Stack
  Engineer to build the services connecting the AI-driven CDD
  platform with enterprise systems. The role requires strong
  hands-on experience across C#/.NET and Python, with a focus
  on APIs, enterprise integrations, asynchronous workflows,
  containerization, Azure DevOps, and production reliability.

  CONTRACT: B2B or B2C contract

  COMMITMENT: Full-time, 3-4 months contract with possibility
  of extension or getting on new projects

  LOCATIONS: Remote, EU-based candidates

  START: ASAP

  PROCESS: Initial qualification followed by client interviews

  Responsibilities

  - Build middleware APIs connecting enterprise applications,
    data platforms, and legacy systems.
  - Develop and maintain ASP.NET Core Web APIs and Python
    services.
  - Extend AI-driven service modules and connector frameworks.
  - Implement reliable asynchronous workflows, callbacks,
    retries, and safe write-back mechanisms.
  - Integrate with REST APIs, messaging systems, queues,
    databases, and enterprise platforms.
  - Package and deploy services using Docker and CI/CD
    pipelines.
  - Support deployments to Azure / Databricks-based
    environments.
  - Write and maintain unit and integration tests.
  - Troubleshoot issues found during testing and in production.
  - Contribute to a business-critical platform where uptime,
    speed, and correct results are essential

  Requirements

  - Strong hands-on experience with C# / .NET and ASP.NET Core
    Web APIs.
  - Practical experience with Python, ideally FastAPI or a
    comparable framework.
  - Experience building and integrating REST APIs and enterprise
    services.
  - Experience with messaging / queues and asynchronous
    integration patterns.
  - Strong experience with Docker, Git, and Azure DevOps CI/CD.
  - Experience writing unit and integration tests for production
    services.
  - Ability to work across modern cloud services and legacy
    enterprise systems.
  - Fluent English and ability to work remotely within the EU.
