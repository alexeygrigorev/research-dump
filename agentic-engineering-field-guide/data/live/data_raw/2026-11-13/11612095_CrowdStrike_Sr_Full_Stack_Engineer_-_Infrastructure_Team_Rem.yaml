description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  CrowdStrike is hiring a Sr. Software Engineer on the
  Infrastructure team to help grow our global team of
  engineers focused on developing tools to build, deploy,
  observe, and maintain a first class, highly available cloud
  platform at massive scale. This is a software development
  role where candidates with a strong background in full stack
  development, DevOps, and Golang will shine.

  What You'll Do:

  The Infrastructure team is responsible for building and
  operating CrowdStrike's internal cloud management platform.
  We build and operate the tools that enable other
  CrowdStrikers to confidently ship code. We're a small,
  remote-first team of full stack engineers building APIs and
  UIs in Go and TypeScript. The right candidate will have
  extensive experience in both Go and TypeScript, as well as a
  deep understanding of cloud native infrastructure and CI/CD.

  - Continually enhance existing CI/CD systems and processes to
    improve efficiency and speed in the software delivery
    cycle.
  - Develop, maintain, and operate mission critical pipelines
    built on top of Temporal and Argo Workflows.
  - Research and introduce innovative tooling solutions aimed at
    boosting developer productivity.
  - Design and implement integration strategies for seamlessly
    incorporating new tools into the existing development
    environment.
  - Work closely with development teams to understand their
    needs, identify bottlenecks, and gather requirements for
    system enhancements.
  - Ensure our development processes adhere to best practices
    for sustainability and security, with a clear
    understanding of SOC2 compliance impacts on CI
    environments.
  - Engage in collaborative initiatives with development,
    infrastructure, security, and SRE teams to drive
    improvements in the SDLC and CI/CD practices.
  - Participate in an on-call rotation to maintain uptime and
    operations of the CI/CD system.

  What You'll Need:

  - Must be a US Citizen or Green Card holder
  - 5+ years of overall experience as a DevOps, SRE, or software
    engineer.
  - Extensive experience in Golang
  - Strong experience in TypeScript/JavaScript
  - Deep understanding of the Software Development Life Cycle
    (SDLC) and CI/CD best practices.
  - Proven track record of effectively supporting and
    collaborating with large development teams.
  - Hands-on experience configuring and operating CI/CD tools
    such as Argo Workflows, Jenkins, Temporal, or similar.
  - Proficient with Linux operating systems and cloud computing
    services.
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Preferred Qualifications:

  - Experience creating development tools is preferred.
  - Experience with modern software deployment technologies like
    Kubernetes and Docker.
  - Experience building artifacts using tools like GoReleaser,
    and familiarity with packaging formats including Docker,
    Debian, and PyPI.
  - Familiarity with Configuration Management and Infrastructure
    as Code tools such as Terraform or Pulumi.
  - Experience with GitOps tools such as Helm, Kustomize, and
    Argo CD.
  - Proven ability to work effectively with both local and
    remote teams.
  - Excellent verbal and written communication skills, with an
    emphasis on clear, correct, complete, concise, and
    compassionate interactions.
  - Proficient in using monitoring and alerting tools such as
    Prometheus, Alertmanager, and Grafana to manage software
    operations effectively.
  - Author clear technical documentation, guides and knowledge
    base articles for developers.
  - Bachelor's degree in Computer Science, Computer Information
    Systems, Engineering or a related field.

