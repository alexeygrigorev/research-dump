  Today, we’re a profitable B2B SaaS company valued at $250M+,
  trusted by 40,000+ sales teams worldwide to book more
  meetings and close more deals.

  The Role

  We’re looking for a Fullstack Developer to help us improve
  Taplio.

  If you love building new things, but also turning messy code
  into something scalable and maintainable, keep reading

  What You’ll do

  Refactor and optimize our codebase (Fullstack TypeScript,
  Nodejs, React, Next.js, Google Cloud Platform).

  Build amazing new features for our users, including ones
  involving AI and improving our MCP

  Improve performance and maintainability

  Support customer success, solving technical issues when
  needed

  Challenge product requests, balancing speed and quality

  What’s in It for You?

  Fully remote & flexible work. Amazing offices in Paris if
  you prefer

  Join a profitable, bootstrapped, and high-growth company

  Work with a motivated, no-BS team

  Direct impact – your work will shape our product

  Who You Are?

  Must-Haves

  5+ years experience

  Strong JavaScript / TypeScript skills

  Responsible for your own code

  Ability to see the big picture and suggest smart trade-offs

  Fast learner, proactive, and independent

  Fluent in English

  Nice-to-have

  Experience with LinkedIn API

  Strong GCP knowledge

  Additional Information

  Salary up to 65K€ base salary + additional company bonus

  Where you live, and work is totally up to you – we do have
  an office in Paris if you enjoy life at the office

  Full-remote Work Setup: A well-funded home office budget to
  ensure seamless remote work

  Get a 48GB Macbook Pro + all the tools and equipment you
  need for your job obviously

  Team building: We all meet once per year at really cool
  places around the world

  Interview Process

  Interview with Lucas, our Tech TAM

  Interview with Sebastien, our Technical Manager

  Technical test + review with 2 devs from team

  Interview with our GM & COO
