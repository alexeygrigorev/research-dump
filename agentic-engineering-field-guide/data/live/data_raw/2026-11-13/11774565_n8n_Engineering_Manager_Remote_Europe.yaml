description: |
  The AI orchestration of your wildest imagination.

  n8n is the open workflow orchestration platform built for
  the new era of AI. We give technical teams the freedom of
  code with the speed of no-code, so they can automate faster,
  smarter, and without limits. Backed by a fiercely inventive
  community and 500+ builder-approved integrations, we’re
  changing the way people bring systems together and scale
  ideas for impact.

  Since our founding in 2019, we’ve grown into a diverse team
  of over 260 - working across Europe and the US, connected by
  a shared builder spirit and with our centre of gravity in
  Berlin. Along the way, we’ve:

  - Cultivated a community of more than 650,000 active
    developers and builders
  - Earned 190K+ GitHub stars, making us one of the world’s Top
    40 most popular projects
  - Backed by top investors, from Sequoia’s first German seed to
    our SAP's recent strategic investment - bringing us to a
    $5.2bn valuation

  That’s the company we’ve built. Now we’d love to see what
  you can build. If you’re applying, try n8n out - whether
  you’re technical or not - and share a screenshot of your
  first workflow with us. The easiest place to start is here:
  app.n8n.cloud/register.

  We’re in a defining moment of an incredible journey. Come
  and build with us.

  🎯 Your main goal will be to build and lead a high-performing
  engineering team that makes n8n a trusted platform for
  enterprise automation. As Engineering Manager of the
  Enterprise Nodes & Partnerships team, you'll empower
  engineers to grow, deliver secure and reliable enterprise
  integrations, and build strong technical partnerships while
  navigating the opportunities of a fast-moving, AI-native
  world.

  Here's how you'll make an impact:

  Build enterprise-grade integrations and strategic
  partnerships

  - Lead the team responsible for building and maintaining the
    integrations that make n8n a trusted orchestration
    platform across the enterprise technology stack.
  - Drive successful technical collaborations with strategic
    partners, aligning on requirements, timelines, and
    delivery to build strong, lasting partnerships.
  - Ensure enterprise integrations meet high standards for
    security, reliability, scalability, and production
    readiness.

  Build and develop a high-performing engineering team

  - Coach and develop engineers through regular feedback, career
    development, and meaningful opportunities to grow their
    ownership and impact.
  - Foster a high-trust environment where engineers feel
    empowered to make decisions, learn through
    experimentation, and take accountability for outcomes.
  - Lead hiring, onboarding, and team development to build a
    strong, collaborative engineering team as n8n scales.

  Drive execution and cross-functional alignment

  - Partner with Product, Design, and other stakeholders to
    align priorities, navigate trade-offs, and deliver
    meaningful product and platform outcomes.
  - Create clarity and focus as priorities evolve, helping your
    team navigate uncertainty and embrace opportunities
    emerging from AI.
  - Establish lightweight processes and clear expectations that
    enable fast execution without compromising engineering
    quality, maintainability, or team health.

  Lead with technical credibility and sound judgment

  - Guide architectural and technical decisions, helping
    engineers navigate trade-offs around scalability,
    reliability, performance, and speed.
  - Maintain a high bar for engineering excellence by mentoring
    engineers, challenging technical decisions constructively,
    and encouraging strong engineering practices.
  - Dive into technical details or code when needed to unblock
    the team, while keeping your primary focus on people
    leadership and team effectiveness.

  REQUIREMENTSMust-haves

  - 🌱 Engineering management experience: You have at least 1
    year of experience as a first-line Engineering Manager,
    directly leading engineers and delivering meaningful
    product or platform outcomes in a growing organization.
  - 🎯 Relevant technical domain expertise: You bring strong
    experience in at least one of these areas: strategic
    integrations, production-grade connector reliability,
    governance and observability, developer experience,
    platform engineering, or infrastructure tooling.
  - 🤝 Strong people leadership: You're experienced in coaching
    engineers, providing actionable feedback, supporting
    career development, and navigating difficult conversations
    with empathy and accountability.
  - 🏎️ Adaptability in fast-moving environments: You bring
    clarity, optimism, and sound judgment when priorities
    shift, helping your team stay focused, confident, and
    effective through change.
  - ⚙️ Strong software engineering background: You have hands-on
    software engineering experience and the technical depth to
    mentor engineers, contribute to architectural discussions,
    and assess complex technical trade-offs.
  - 🛠️ Pragmatic technical involvement: You're comfortable
    diving into code or technical challenges when needed to
    unblock your team, without becoming a bottleneck for
    delivery.
  - 🔄 Cross-functional communication and alignment: You
    communicate clearly and collaborate effectively with
    Product, Design, Engineering, and customer-facing teams to
    align stakeholders, resolve competing priorities, and
    escalate when needed.
  - 🏢 High-growth SaaS experience: You've worked in a high-
    growth SaaS environment and understand how to scale
    engineering teams, balance speed with quality, and deliver
    ambitious outcomes.

  Nice-to-haves

  - 🤝 Strategic partner collaboration: You've worked with
    external technology partners to build enterprise products
    or integrations and establish successful, long-term
    technical relationships.
  - 🧩 TypeScript / Node.js familiarity: You have experience with
    JavaScript, TypeScript, or Node.js and can quickly develop
    technical context within our stack.
  - 🌍 Open-source and developer tooling: You're passionate about
    developer-focused products, open-source communities, and
    building extensible platforms that empower technical
    users.
  - 🤖 AI product exposure: You've worked with AI-native
    products, AI-powered features, or engineering teams
    exploring how AI is transforming product development and
    engineering practices.

  Why join us?

  At n8n, your impact will go far beyond managing delivery.
  You'll lead a team at the heart of our enterprise ambitions,
  shaping the integrations and strategic partnerships that
  make n8n a trusted automation platform for businesses
  worldwide. You'll have the autonomy to build an empowered
  engineering team, influence technical direction, and work
  closely with stakeholders across the company as we scale.

  You'll join a fast-growing, remote-first company with a
  strong builder culture, an ambitious vision for AI-native
  automation, and a community of more than 650,000 active
  developers and builders. We value technical excellence,
  ownership, experimentation, and leaders who help others do
  their best work.

  Sound like a challenge you're excited to take on?

  Apply now — and help us build the future of enterprise
  automation.

