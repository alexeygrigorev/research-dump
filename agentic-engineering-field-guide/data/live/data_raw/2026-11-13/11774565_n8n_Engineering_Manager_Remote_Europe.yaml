  Location disclaimer: If you see multiple job postings for
  the same role, it is most likely because we're hiring
  remotely for this role and posting in different locations to
  make sure every potential candidate can see the role. Please
  apply to the location you're the most likely to work from in
  the future.

  Benefits

  - Competitive compensation 💸 – We offer fair and attractive
    pay.
  - Ownership 💪 – Our core value is to “empower others,” and we
    mean it—you’ll get a slice of n8n with equity.
  - Work/life balance 🏖️ – We work hard but ensure you have time
    to recharge:
    - Europe: 30 days of vacation, plus public holidays wherever
      you are.
    - US: 20 vacation days, 8 sick days, plus public holidays
      wherever you are.
  - Health & wellness 🩺 –
    - Europe: We provide benefits according to local country
      norms.*
    - US: Multiple low-premium, low-deductible medical plans with
      coverage for individuals and families—plus a no-cost
      premium HDHP option with a pre-seeded HSA—along with
      dental and vision coverage.
  - Future planning 💰 –
    - Europe: We provide pension contributions according to local
      country norms.*
    - US: 401(k) retirement plan with a 4% employer match.
  - Financial security 🛡️ –
    - Europe: We provide benefits according to local country
      norms.*
    - US: Company-paid short-term and long-term disability
      insurance, plus life insurance to support you and your
      loved ones.
  - Career growth 📈 – We hire rising stars who grow with us!
    You’ll get €1K (or equivalent) per year to spend on
    courses, books, events, or coaching to level up your
    skills.
  - A passionate team 🤩 – We love our product, and we prove it
    with regular hackathons where we see who can build the
    coolest thing with it!
  - Remote-first 🌏 – Our team works remotely across Europe, with
    regular off-sites for team bonding. Some roles, like sales
    in the US, are hybrid—please check the job description.
  - Giving back 🤝 – We're big fans of open source, and you'll
    get $100 per month to support projects you care about.
  - Transparency 🙏 – We all know what everyone’s working on, how
    the company is doing—the whole shebang.

  *Country and/or State specific details provided in your
  employment agreement.
