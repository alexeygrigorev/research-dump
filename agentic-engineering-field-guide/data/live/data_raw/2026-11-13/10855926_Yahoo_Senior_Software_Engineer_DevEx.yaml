description: |
  It takes powerful technology to connect our brands and
  partners with an audience of hundreds of millions of people.
  Whether you’re looking to write mobile app code, engineer
  the servers behind our massive ad tech stacks, or develop
  algorithms to help us process trillions of data points a
  day, what you do here will have a huge impact on our
  business—and the world.

  A Little About Us

  The Central Tech Developer Experience (DX) team builds and
  operates the core platform infrastructure that powers
  software delivery across Yahoo. We own the overarching CI/CD
  ecosystem, artifact repositories (Artifactory), release
  pipelines, and GitOps deployment engines (ArgoCD). Operating
  with a product-first mindset, our squad builds enterprise
  golden paths, reduces developer friction, and deploys AI-
  augmented automation workflows to eliminate operational toil
  for engineering teams.

  Responsibilities

  - Platform Initiative Execution: Own and deliver key
    components of developer platform initiatives across CI/CD
    pipeline modernization, artifact management, developer
    tooling, and company-wide ArgoCD GitOps rollouts.
  - AI-Augmented Engineering Workflows: Utilize AI pair-
    programming and automation tools (such as GitHub Copilot
    Enterprise and Anthropic Claude via AWS Bedrock) to
    rapidly generate, refactor, and test reusable CI/CD
    actions, deployment manifests, and platform scripts.
  - Automated Config Validation & Triage: Inspect, validate, and
    troubleshoot AI-assisted or agent-generated platform
    configurations and exception queues, ensuring automated
    pipeline migrations meet production correctness and
    security standards.
  - Golden Path & Paved Road Delivery: Build and maintain
    reusable pipeline templates, standardized build workflows,
    and clear developer documentation that make approved
    golden paths easy for application squads to adopt.
  - Artifact & Infrastructure Support: Support artifact
    publish/consume patterns (Artifactory, container
    registries), assist with CI compute runner optimization,
    and resolve complex pipeline break/fix issues.
  - Developer Enablement & Adoption: Serve as a primary
    technical contact for application squads through platform
    rollouts—running office hours, guiding migration steps,
    and gathering feedback to iterate on platform tooling.
  - Platform Quality & Observability: Instrument pipeline
    automation with telemetry, monitoring time-to-green
    metrics, build flakiness, and reliability trends to drive
    continuous platform improvement.

  Basic Qualifications

  - Bachelor’s degree in Computer Science, Software Engineering,
    or a related technical discipline.
  - 5+ years of professional software development or platform
    engineering experience, with a deep focus on CI/CD
    pipeline design and troubleshooting (IC4 level).
  - Hands-on expertise with enterprise CI/CD platforms (e.g.,
    GitHub Actions, Jenkins, GitLab CI) and writing reusable
    workflow modules.
  - Hands-on experience using AI-assisted development tools
    (e.g., GitHub Copilot, Cursor, LLM coding assistants) to
    accelerate code generation, debugging, and documentation.
  - Experience working with artifact management platforms (e.g.,
    Artifactory) and release promotion patterns.
  - Demonstrated ability to independently own and deliver squad-
    level software features, technical migrations, or internal
    tools.
  - Strong technical writing skills for creating clear developer
    playbooks, API documentation, and migration guides.

  Preferred Qualifications

  - Hands-on experience with GitOps deployment frameworks (e.g.,
    ArgoCD), including repository structuring, environment
    promotion workflows, and secrets management.
  - Experience participating in evaluation loops or validation
    checks for automated/agentic AI tooling operating on
    developer infrastructure.
  - Proven experience building custom platform scripts or tools
    against enterprise developer APIs (GitHub REST/GraphQL
    APIs, Artifactory APIs).
  - Practical familiarity with security-minded platform
    practices, including least-privilege secrets management
    and pipeline security scanning.

  The material job duties and responsibilities of this role
  include those listed above as well as adhering to Yahoo
  policies; exercising sound judgment; working effectively,
  safely and inclusively with others; exhibiting
  trustworthiness and meeting expectations; and safeguarding
  business operations and brand integrity.

