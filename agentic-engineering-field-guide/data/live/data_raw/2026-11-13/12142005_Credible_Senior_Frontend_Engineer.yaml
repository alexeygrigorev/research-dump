description: |
  Who is Credible?

  Credible is a leading U.S. consumer finance marketplace,
  transforming the way consumers access and compare financial
  products. We operate at a consumer and enterprise level. On
  the consumer side, we help millions of people make smarter
  financial decisions by comparing personalized, pre-qualified
  offers across student loans, personal loans, mortgages,
  credit cards, and insurance — all without impacting their
  credit score. On the enterprise side, we power financial
  product comparison and distribution through deep
  integrations and partnerships with lenders, insurance
  carriers, and financial institutions, as well as providing
  marketplace technology and capabilities to third-party
  partners and distribution channels.

  About the Role

  We are looking for a talented and passionate Senior Frontend
  Engineer to join our software engineering team. You'll build
  the user-facing side of an extraordinary web-based platform
  that has already helped thousands of people save money and
  aims to help millions more, while also contributing to the
  APIs and services that power it. If you've been seeking a
  product that's worthy of your skills, then read on!

  Responsibilities

  • Own the design and delivery of customer-facing web
  features in React and TypeScript, with a passion for quality
  in user experience, web design principles, and code quality

  • Contribute to backend work that supports the frontend,
  such as building and extending REST and/or GraphQL APIs,
  backend-for-frontend layers, and Node.js services

  • Understand customer requirements and efficiently translate
  them into code

  • Be a self-starter who works in an Agile/Lean environment
  with minimal supervision

  • Thrive on collaboration; Credible's Software team works
  closely with Product Management, Design and Operations for
  everything from roll-out to feature enhancement

  • Show strong leadership and verbal communication skills,
  including mentoring other engineers

  • Take pride in writing and maintaining clean, modular,
  well-tested code

  • Be resourceful and mindful; you move fast and show empathy
  for your colleagues

  • Stay open to learning new technologies

  Education and Experience

  • 8+ years of solid web and front-end development

  • 8+ years of experience programming JavaScript and
  TypeScript, including concepts like asynchronous
  programming, closures, promises, and types

  • Solid experience with React

  • Mastery of ES6, HTML5, and CSS3

  • Working experience with Node.js, Express.js, Next.js,
  Webpack, Babel, or similar tools

  • Experience building and consuming REST and/or GraphQL
  APIs, including contributing to server-side code that backs
  them

  • Working knowledge of relational databases and SQL

  • Demonstrable experience building testable software with
  tests

  • BS in Engineering, Computer Science, or equivalent
  experience

  Nice to Have

  • Solid experience with SEO

  • Experience with AWS services such as EC2, RDS, S3 and SQS

  • Knowledge or experience with Docker

  • Experience with Ruby on Rails or a similar MVC framework
  (e.g., Django), with RSpec or similar test frameworks

  Pursuant to state and local pay disclosure requirements, the
  pay ranges for this role, with final offer amount dependent
  on education, skills, experience, and location, are listed
  below. This role is also eligible for an annual
  discretionary bonus, various benefits, including
  medical/dental/vision, insurance, a 401(k) plan, paid time
  off, and other benefits in accordance with applicable plan
  documents. View more details about Credible Benefits

  For high cost of labor markets such as but not limited to
  New York City and San Francisco:

  $114,000—$150,000 USD

  For all other US locations:

  $100,000—$140,000 USD

  Why work at Credible?

  We combine the intelligence, expertise, and confidence of a
  financial advisor with the approachability and honesty of a
  friend. In other words, we’re the friend you always wish you
  had in finance.

  We are optimistic, challengers, trustworthy, clever, and
  smart. We are open and transparent. We strive to act as
  advisors by being friendly, objective, and open in our
  communication. We use language that is intelligent yet
  approachable. When appropriate, we’ll drop in a bit of wit
  to position ourselves as a fresh, reliable voice in the
  financial world.

  We are an equal opportunity employer and all qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, national origin,
  gender identity, disability, protected veteran status, or
  any other characteristic protected by law. We will consider
  for employment qualified applicants with criminal histories
  consistent with applicable law.
