description: |
  Description Job Summary The AI Software Consulting Engineer
  is responsible for designing, developing, integrating, and
  deploying artificial intelligence and machine learning
  solutions for clients. This client-facing, billable role
  provides high-quality deliverables and ensures solutions are
  implemented as designed to the client's satisfaction and
  approval. The engineer gains a clear understanding of client
  requirements, data and application environments, and
  operational constraints in order to deliver secure,
  supportable AI applications and MLOps capabilities. What You
  Will Do • Manage time and expense to meet or exceed
  expectations defined in the Statement of Work, proactively
  escalating potential scope, schedule, or budget issues as
  soon as they are known. • Develop and deploy AI
  applications, model-serving workflows, APIs, retrieval-
  augmented generation solutions, and integrations with
  enterprise systems and data sources. • Implement NVIDIA NIM,
  NVIDIA Blueprints, containerized AI services, and supporting
  software components as applicable to customer requirements.
  • Build and execute test plans covering functionality,
  performance, reliability, security, and operational handoff
  for assigned deliverables. • Troubleshoot software, model,
  API, data, container, and platform integration issues across
  diverse customer environments. • Provide technical input for
  SOWs, ROMs, LOEs, implementation plans, and solution
  validation when requested. • Create and maintain accurate
  project documentation, as-built configurations, test plans,
  work logs, and client handoff materials. What We Expect of
  You • Bachelor's degree and 3 year's experience delivering
  software, data, or AI/ML solutions, including development,
  implementation, integration, and support OR 7 year's
  experience delivering software, data, or AI/ML solutions,
  including development, implementation, integration, and
  support. • Demonstrated software development experience
  using Python and common engineering practices such as
  version control, code review, testing, and documentation. •
  Experience developing or integrating REST APIs, services,
  data pipelines, or event-driven components. • Working
  knowledge of containers, Kubernetes, Linux, Git, CI/CD, and
  enterprise data-center deployment environments. •
  Understanding of AI/ML concepts, including model inference,
  embeddings, retrieval-augmented generation, vector search,
  evaluation, and model lifecycle considerations. •
  Familiarity with NVIDIA NIM, NVIDIA Blueprints, PyTorch,
  Hugging Face, LangChain, LangGraph, or comparable AI
  application frameworks. • Ability to implement secure
  integrations with enterprise identity, data, application,
  and observability services. • Strong written and verbal
  communication skills with the ability to effectively
  interact with leadership stakeholders and clients. • Proven
  ability to create technical documentation and transfer
  knowledge to client technical teams. • Demonstrated
  attention to detail, analytical problem solving, and the
  ability to balance competing priorities while meeting
  deadlines. • Ability and willingness to work beyond
  regularly scheduled shifts, select weekends, or overtime as
  necessary to meet operational needs. • Ability and
  willingness to travel as needed to CDW locations or client
  sites. • Valid U.S. driver's license. • Experience
  delivering generative AI, agentic AI, RAG, model-serving, or
  MLOps solutions in enterprise environments, is a plus. •
  Experience with vector databases, model gateways, AI
  observability, evaluation frameworks, guardrails, or prompt-
  management tooling, is a plus. • Familiarity with GPU
  infrastructure, NVIDIA AI Enterprise, CUDA dependencies, and
  the relationship between AI software and accelerated
  hardware, is a plus. • Preferred NVIDIA certifications
  aligned to the role include NVIDIA-Certified Associate
  Generative AI LLMs (NCA-GENL) and NVIDIA-Certified Associate
  Multimodal Generative AI (NCA-GENM), is a plus. Pay range:
  $77,725 - $108,265 depending on experience and skill set
  Annual bonus target of %10 subject to terms and conditions
  of plan Benefits overview: https://cdw.benefit-info.com/
  Salary ranges may be subject to geographic differentials *
  CDW is committed to being an AI-fluent organization * We're
  looking for people who bring curiosity, a learner's mindset,
  and a willingness to engage with ever-evolving technology
  and tools. We value adopting AI as a partner, openness to
  experimentation, and a shared interest in learning together
  on AI. Our goal is to create a culture where AI enhances-
  not replaces- human creativity and decision-making. You
  don't need to be an expert today; what matters is your
  readiness to explore, adapt, and grow with us as we
  integrate AI responsibly and effectively into our
  work.Additionally, CDW is committed to fostering an
  equitable, transparent, and respectful hiring process for
  all applicants. During our application process, our goal is
  to understand your experience, strengths, skills, and
  qualifications. As an AI forward company, we see AI not just
  as a tool, but as a catalyst for new ways of thinking,
  creating, and communicating. We encourage candidates to
  embrace an AI mindset, one that's curious, adaptive, and
  ready to explore what's possible. We welcome thoughtful use
  of AI to expand your perspective and elevate how you share
  your story, while ensuring your application remains rooted
  in your own background, judgment, and voice. * About Us *
  CDW is a Fortune 500 technology solutions provider that
  helps businesses, government, education, and healthcare
  organizations achieve what's possible through technology.
  What makes CDW different isn't just what we do- it's how we
  do it. At CDW we act as one- building trust, speaking
  candidly, and working together to achieve more. We play to
  win- focusing on what matters most and delivering for our
  customers. And we think forward- staying curious, moving
  fast, and continuously learning. We believe meaningful work
  happens when people feel supported, heard, and empowered to
  contribute. That's why we think of ourselves as coworkers,
  not just employees- working together to solve complex
  challenges and deliver real impact for our customers and
  communities. As a full-stack, full-lifecycle technology
  partner, CDW brings deep expertise, strong relationships,
  and broad industry knowledge to help turn ideas into
  outcomes. When you join CDW, you become part of a
  collaborative environment where your work matters, your
  growth is supported, and your contributions help shape
  what's next. Together, we deliver the full promise of what
  technology can do. * Together, we Make Amazing Happen. * CDW
  is an equal opportunity employer. All qualified applicants
  will receive consideration for employment without regards to
  race, color, religion, sex, sexual orientation, gender
  identity, national origin, disability status, protected
  veteran status or any other basis prohibited by state and
  local law.
