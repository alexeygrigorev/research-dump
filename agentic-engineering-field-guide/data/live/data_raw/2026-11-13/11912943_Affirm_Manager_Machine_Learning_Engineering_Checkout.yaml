description: |
  At Affirm, we exist for the moments that matter—giving
  people a clear, predictable way to pay over time, with no
  hidden fees, no surprises, and no tradeoffs on what matters
  most.

  Join Affirm as a Machine Learning Engineering Manager and
  become a pivotal part of our International Credit Machine
  Learning group. Specifically, you will manage a team of ML
  engineers that builds the models powering credit lending
  decisions in countries across Europe and in Australia. You
  will lead your team in using novel ML techniques and rich
  data representations to predict repayment behavior and
  optimize how we offer loans to our borrowers.

  In this role, you will help shape the future of machine
  learning at Affirm. You'll partner with engineering,
  product, and risk leaders to design, implement, and scale
  advanced ML solutions that drive critical capabilities
  across the company. You will mentor engineers, bring clarity
  to complex, ambiguous problems, and contribute to a cohesive
  long-term ML strategy.

  What you'll do

  - Set the technical strategy for your team, and help your
    engineers tie it together with critical, business-
    impacting projects in our underwriting system
  - Act as a force multiplier through your definition and
    advocacy of technical solutions and operational processes.
  - Collaborate across teams in the product development
    lifecycle by partnering with product management, design,
    analytics, and risk to ensure technical sustainability,
    risks and trade-offs are well understood and managed.
  - Develop talent by providing feedback and guidance, and
    leading by example.

  What We Look For

  - Bachelor's in a technical field with 8+ years of industry
    experience, including 3+ years managing engineers.
  - A background in financial services, specifically in credit /
    lending.
  - Proficiency in machine learning with experience in areas
    including tree-based models, transformers, deep learning,
    and agentic ML.
  - Strong engineering skills and the ability to provide hands-
    on technical leadership while working with our code and
    architecture.
  - You thrive in ambiguity, and are comfortable moving from
    low-level language idioms all the way to the architecture
    of large systems to understand how they work

  Total rewards

  We believe the people building honest financial products at
  Affirm should share in its success. That's why our total
  rewards are designed to support your health, growth,
  financial well-being, and future.

  In service of our mission, we reward employees through a
  combination of base pay, equity (from parent company), and
  comprehensive benefits.

  Base Pay Grade - P

  365,000 zł  -  485,000 zł

  Employees new to Affirm typically come in at the start of
  the pay range. Affirm focuses on providing a simple and
  transparent pay structure which is based on a variety of
  factors, including location, experience and job-related
  skills.

  Base pay is part of a total compensation package that may
  include monthly stipends for health, wellness and tech
  spending, and benefits (including 100% subsidized medical
  coverage, dental and vision for you and your dependents). In
  addition, the employees may be eligible for equity rewards
  offered by Affirm Holdings, Inc. (parent company).

  Base pay ranges and placement within those ranges are
  determined based on several factors, including role,
  experience, and job-related skills.

  In addition to base pay, all employees in this role are
  eligible to receive equity from the parent company each
  year. This means as Affirm’s parent company grows, employees
  have the opportunity to share in that growth financially.

  Equity Grade - 5 (awarded in US Dollars)

  Affirm Holdings, Inc. Equity Grade example

  Equity grade: 5 New hire equity: $48,000-$72,000 Annual
  Refresh: $15,000 Reward equity: $0-$225,000

  Affirm also provides flexible spending wallets to all
  employees for technology and wellbeing related needs, which
  are reimbursable up to 1390 zł per month.

  In addition to your compensation, our comprehensive benefits
  are designed to support you and the people who matter most.
  Benefits include:

  - Competitive paid time off, paid public holidays, and
    additional paid Away Days to rest and recharge.
  - Comprehensive private healthcare through Lux Med's Platinum
    package.
  - A MultiSport card to support your health and well-being.
  - Learning and development programs to help you grow
    professionally.
  - Family healthcare support through Maven and parental leave
    support through Parentaly.
  - Mental well-being support through Lyra, including up to 12
    confidential counseling or coaching sessions each year for
    you and your household members.
  - Financial well-being support through Northstar, with
    unlimited access to Certified.
  - Financial Advisors and planning tools at no cost to you.
  - Employee Resource Groups (ERGs) that foster connection and
    inclusion.
  - Eligibility for creative tax benefits, subject to applicable
    law, role, and company policy.

  Location - Remote Poland

  The majority of our roles can be located anywhere in Poland.

  **This job description is not a contractual document, and is
  not intended to have binding force.** #LI-Remote

  Remote-first with flexibility built in Affirm is proud to be
  a remote-first company. Most roles can be done from almost
  anywhere within the country of employment. Some positions
  may occasionally require in-person work at an Affirm office,
  and a few are office-based due to the nature of the work.
  All new hires will be invited to attend an in-person
  onboarding experience.

  Benefits designed for you Our benefits reflect our
  commitment to care, transparency, and flexibility. Here are
  a few highlights:

  - Health coverage at no cost: We cover 100% of premiums for
    employees and their dependents.
  - Spending stipends: Monthly stipends support your tech setup,
    and the ability to choose health and wellness options that
    are right for you.
  - Time off to recharge: Flexible time off and generous holiday
    calendars help you rest when you need to.
  - Own a piece of what you build: Our employee stock purchase
    plan (ESPP) lets you buy Affirm stock at a discount.

  We’re committed to providing an inclusive interview process,
  including accommodations for candidates with disabilities.
  If you need support, we’re happy to help.

  For positions based in San Francisco or Los Angeles: Affirm
  considers qualified applicants with arrest and conviction
  records, as required by law.

  By clicking "Submit Application," you acknowledge that you
  have read Affirm's Global Candidate Privacy Notice and
  consent to the use of your personal information as
  described.
