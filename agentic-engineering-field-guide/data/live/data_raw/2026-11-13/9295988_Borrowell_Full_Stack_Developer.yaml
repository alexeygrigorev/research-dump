description: |
  About Borrowell:

  At Borrowell, we’re on a mission to help Canadians feel
  confident about their money. We empower individuals to take
  control of their financial futures by providing the tools
  and insights needed to understand, build, and use their
  credit effectively.

  With over four million members, Borrowell empowers Canadians
  to understand their credit, build credit through Rent
  Advantage and Credit Builder, and make better financial
  product choices.

  Our team is diverse, inclusive, and driven by a shared
  passion for making a meaningful difference in the lives of
  Canadians. We pride ourselves on fostering a culture of
  collaboration, humility, and innovation. If you’re looking
  to join a company that’s transforming the financial
  landscape and empowering Canadians to achieve their
  financial aspirations, we invite you to explore career
  opportunities at Borrowell. Together, we can help Canadians
  feel confident about money.

  About the Role:

  As a Full Stack Developer on Borrowell’s Engineering team,
  you will design, develop, optimize, test, and maintain
  application code for our in-house web and mobile products.
  You will ensure that software meets both the technical and
  business requirements that guided its design.

  We are currently hiring for a role on one of our Product
  Development Pods. Embedded within cross-functional teams
  (Product, Design, QA), you’ll work on building and
  maintaining products from the ground up, directly impacting
  the lives of over 4 million Borrowell members.

  Requirements

  - Technical Versatility: Working experience building scalable
    web applications on the cloud, preferably within a
    microservices architecture.
  - Core Stack: Knowledge of modern JavaScript front-end
    frameworks (we primarily use React, React Native, and
    TypeScript) OR a strong foundation in backend development
    (our backend is .NET 10 on Azure).
  - Database Proficiency: Demonstrated proficiency with SQL and
    NoSQL databases.
  - Growth Mindset: A large chunk of your time will be spent
    experimenting and building new products from scratch
    rather than just maintaining old code.

  Nice to Have:

  - Knowledge of Microsoft Azure.
  - Experience with Next.js or headless CMS platforms (e.g.,
    Contentful).
  - Turborepo knowledge.
  - Experience in fast-paced Fintech or startup environments.

  Our Engineering Team Values

  - We work well as a team and collaborate always!
  - We are humble and open to each others' ideas and opinions
  - We are not afraid of making mistakes and we are always
    learning
  - We are persistent about solving problems we are facing
  - Change is good and welcomed
  - We are always willing to take on new challenges
  - We are not afraid to say, "I don't know," or, "I need help"
  - We take ownership over our platform and the work that we
    deliver
  - We communicate clearly to ensure we collaborate well
  - We find the simplest solutions possible for the hardest
    problems

  The Interview Process

  We believe in fast, lean, and efficient processes and that
  trickles into every aspect of our work, including hiring.
  Interviewing for this role is typically done in 4 steps:

  - A phone call with a recruiter
  - A technical coding challenge and discussion that is grounded
    in being practical, realistic, and open book - we're
    trying to understand your skills holistically, not trying
    to see how much you can memorize algorithms
  - A systems design conversation that dives deeper into your
    experience building scalable systems
  - A conversation with a senior leader

  That's it! After each step, we will follow up within the
  week.

  Benefits

  - The Opportunity - join and have a major impact at a growing
    company that is helping make financial stability possible
    for everybody

  - Comprehensive Health Benefits - medical, dental, vision, and
    paramedical health benefits for you and your family, with
    extra yearly coverage for psychotherapists and massage
    therapists
  - Additional Health Benefits - virtual benefit offering that
    allows you to connect 24/7 with nurses, doctors and mental
    health professionals
  - Maternity & Parental Leave Top-up - available to new parents
  - WFH Reimbursement - we ship you gear like a laptop, mouse,
    keyboard, and you can reimburse additional items to make
    your workplace better for you
  - Employee Development Benefit - annual reimbursements on
    payments to help your learning
  - Givewell Benefit - 1 paid volunteer day a year to give back
    to the community
  - Flexibility - flexible working hours and a flexible vacation
    policy

  We are remote-first across Canada with an office in Toronto.
  This role will require you to attend in-person meetings and
  team-building events. While this role is remote, we are
  currently only able to hire candidates physically located in
  Ontario, BC, or Alberta.

  At Borrowell, one of our core values and firm beliefs is
  that diversity makes us better. If you’re unsure about your
  qualifications for this position, we’d still encourage you
  to apply. We’re looking for candidates who have experience,
  but know that not everyone’s had a chance to demonstrate
  what they can do. What’s most important is that you have a
  growth mindset and care about helping people with their
  finances - an area in their lives that causes a lot of
  stress.

  Please note that due to the sensitive nature of the work we
  do, clearing a credit and criminal record check is a
  condition of employment.

  Borrowell encourages applications from candidates with
  differing abilities. Please let us know if you require
  accommodation at any stage in the selection process.

  This posting represents a current and active vacancy within
  our organization.

  The budgeted annual salary range for this role is $80,000 –
  $130,000 CAD. Starting pay is determined by the candidate's
  relevant experience and skills. In addition to base salary,
  this role is eligible for Borrowell’s full benefits package.
