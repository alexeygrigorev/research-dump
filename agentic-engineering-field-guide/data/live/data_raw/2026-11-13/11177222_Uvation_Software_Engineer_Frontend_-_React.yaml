description: |
  Job Overview:

  As a React Frontend Software Engineer, you will be
  responsible for developing and implementing user interface
  components using React.js and workflows (such as Flux or
  Redux). You will ensure that these components and the
  overall application are robust and easy to maintain,
  ensuring a seamless user experience.

  Key Responsibilities:

  Development and Design: Develop new user-facing features
  using React.js. Build reusable components and front-end
  libraries for future use. Translate designs and wireframes
  into high-quality code.

  Performance Optimization: Optimize components for maximum
  performance across a vast array of web-capable devices and
  browsers.

  Collaboration: Collaborate with product team and back-end
  developers for defining and implementing innovative
  solutions for the product direction, visuals, and user
  experience.

  Testing and Debugging: Write and maintain test cases to
  ensure the robustness and reliability of the code. Debug and
  fix issues reported in the production environment.

  Maintenance and Upgrades: Keep up-to-date with the latest
  React.js trends and industry best practices.

  Requirements:

  Education: Bachelor's degree in Computer Science, Software
  Engineering, or a related field.

  Experience: At least 5-6 years of experience in React.js
  development. Experience with popular React.js workflows
  (such as Flux or Redux) is a must.

  Technical Skills: Proficiency in JavaScript, including DOM
  manipulation and the JavaScript object model. Familiarity
  with newer specifications of ECMAScript. Experience with
  data structure libraries.

  Soft Skills: Strong problem-solving skills, a keen eye for
  detail, and a team-oriented mindset. Excellent communication
  skills for coordinating with other teams.

  Other: Familiarity with RESTful APIs, modern front-end build
  pipelines and tools, code versioning tools such as Git.

