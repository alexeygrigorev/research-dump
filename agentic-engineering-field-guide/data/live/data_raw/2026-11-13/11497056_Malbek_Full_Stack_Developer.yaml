description: |
  We are looking for a US based Full Stack Developer to help
  design, build, and scale our SaaS platform. You will work
  across the stack, from responsive front end interfaces to
  backend services, APIs, and data layers, collaborating
  closely with product, design, and other engineers to ship
  reliable, high-performance features used by our customers.
  This is a great role for someone who enjoys owning features
  end to end, reasoning about system design tradeoffs, and
  growing their skills across the entire technology stack.

  What You'll Do

  - Design, build, and maintain features across the full stack,
    from responsive UI components to backend services, APIs,
    and database schemas

  - Own features end to end, from technical design and
    estimation through implementation, testing, deployment,
    and monitoring

  - Design and implement RESTful and/or GraphQL APIs with
    attention to scalability, versioning, and query
    performance

  - Write efficient database queries and design normalized
    schemas; contribute to indexing and query optimization for
    relational and/or NoSQL data stores

  - Build and maintain integrations with third party systems and
    APIs, including authentication flows (OAuth2/SSO) and
    webhook-based event handling

  - Write unit, integration, and end-to-end tests; maintain
    strong automated test coverage and participate in thorough
    code reviews

  - Contribute to system architecture decisions, including
    service boundaries, caching strategy, and data flow, as
    the platform scales

  - Improve application performance through profiling, load
    testing, and query/caching optimization

  - Instrument and monitor services using logging, metrics, and
    tracing tools; troubleshoot and resolve production
    incidents

  - Contribute to CI/CD pipeline improvements, infrastructure as
    code, and deployment automation

  - Apply secure coding practices (input validation, encryption
    in transit/at rest, dependency and vulnerability
    management)

  - Participate in agile ceremonies including sprint planning,
    standups, and retros



  Required Qualifications

  - 10+ years of professional full stack development experience

  - Strong proficiency in a modern front end framework (Angular)
    and TypeScript/JavaScript, including component
    architecture and state management

  - Strong backend experience in Spring Framework building
    production services

  - Hands-on experience designing, building, and consuming
    RESTful APIs; familiarity with API versioning and
    documentation

  - Solid understanding of relational databases (PostgreSQL,
    MySQL) including schema design and query optimization,
    and/or NoSQL databases (MongoDB, DynamoDB)

  - Experience with cloud platforms such as AWS, GCP, or Azure,
    including core compute, storage, and networking services

  - Proficiency with Git, code review workflows, and CI/CD
    pipelines (e.g., GitHub Actions, Jenkins, CircleCI)

  - Experience writing automated tests (unit, integration, e2e)
    using frameworks such as Jest, Mocha, Cypress, or
    Playwright

  - Strong understanding of web application security best
    practices (OWASP Top 10, authentication/authorization,
    encryption)

  - Solid grasp of data structures, algorithms, and system
    design fundamentals

  - Excellent communication skills and ability to work cross
    functionally



  Nice to Have

  - Experience with GraphQL schema design and resolvers

  - Familiarity with containerization (Docker) and orchestration
    (Kubernetes), and infrastructure as code (Terraform,
    CloudFormation)

  - Experience with microservices, event-driven architectures,
    and message queues/streaming (Kafka, SQS, RabbitMQ)

  - Experience with observability tooling (Datadog, Grafana,
    ELK, OpenTelemetry)

  - Familiarity with e-signature or document workflow tools and
    their APIs

  - Contributions to open-source projects



  What We Offer

  - Competitive salary and equity

  - Comprehensive benefits

  - Flexible PTO and remote friendly culture

  - Learning and development budget

  - Collaborative, high growth environment
