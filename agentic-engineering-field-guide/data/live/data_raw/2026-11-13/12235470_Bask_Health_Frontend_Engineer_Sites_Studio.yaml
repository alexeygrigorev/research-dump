description: |
  About Bask Health

  Bask Health is a software platform that enables
  entrepreneurs, doctors, and healthcare businesses to launch,
  manage, and grow direct-to-consumer telehealth businesses.

  Our platform brings together patient experiences, clinical
  workflows, pharmacy operations, and commerce tools in one
  place.

  We're an entrepreneurial, product-focused engineering team
  that values ownership, technical excellence, and building
  software that solves real problems. Engineers work closely
  with product teams and company leadership, take features
  from idea to production, and have a direct role in shaping
  the platform.

  Engineering at Bask is AI-first and builder-led. We use
  tools like Cursor and Claude Code throughout development
  while maintaining high standards for reliability, testing,
  and software quality.

  About the Role

  We're looking for a Frontend Engineer, Sites & Studio to
  help build and improve the website creation, customization,
  and visual editing experiences within Bask Health's
  platform.

  In this role, you'll develop frontend features that allow
  merchants to create, manage, and customize their digital
  storefronts and patient-facing websites. You'll work on
  tools that make complex website configuration accessible
  through intuitive interfaces, reusable components, and
  flexible editing experiences.

  You'll collaborate closely with designers, product managers,
  and backend engineers to develop tools for page editing,
  layout customization, content management, and website
  publishing. Your work will help merchants build professional
  digital experiences while maintaining consistency,
  performance, and reliability across the platform.

  This position combines strong frontend engineering
  fundamentals with an interest in visual interfaces, design
  systems, and interactive product development. You'll help
  create editing tools that are easy to use while supporting
  the flexibility needed for different merchants and business
  models.

  You'll contribute throughout the development process, from
  planning and implementing new features to improving existing
  functionality, debugging issues, and refining the overall
  user experience.

  We're looking for someone who enjoys building polished
  interfaces, solving challenging interaction problems, and
  creating software that gives users more control over their
  websites without requiring advanced technical knowledge.

  What You'll Do

  - Build and maintain frontend features for Bask's Sites &
    Studio experiences.
  - Develop website creation, editing, and customization
    interfaces using React, Next.js, and TypeScript.
  - Build intuitive tools that allow merchants to manage their
    website content and appearance.
  - Develop reusable components for page layouts, sections,
    forms, and interactive website elements.
  - Implement visual editing functionality for configuring pages
    and storefront experiences.
  - Build interfaces for editing text, images, colors,
    typography, and layout settings.
  - Develop responsive website templates and configurable page
    components.
  - Implement live previews that reflect changes made through
    editing tools.
  - Create intuitive controls for managing website sections and
    reusable content blocks.
  - Support drag-and-drop or other interactive editing
    experiences where appropriate.
  - Build interfaces for managing navigation, page structure,
    and content organization.
  - Develop functionality for saving, updating, and publishing
    website changes.
  - Integrate frontend editing tools with backend APIs and
    content management services.
  - Collaborate with designers to translate visual concepts into
    flexible frontend components.
  - Work with backend engineers to define data structures for
    configurable website content.
  - Improve the usability and consistency of website editing
    workflows.
  - Build responsive interfaces that function across desktop and
    mobile devices.
  - Help maintain consistent styling and behavior across
    customizable merchant websites.
  - Optimize frontend performance for editing tools and
    published website experiences.
  - Implement reliable form validation, loading states, and
    error handling.
  - Write clean, maintainable, and well-tested frontend code.
  - Develop automated tests for important editing and publishing
    workflows.
  - Investigate and resolve frontend issues involving rendering,
    layout, and interactions.
  - Participate in code reviews and contribute to frontend
    architecture decisions.
  - Help improve reusable design systems and component
    libraries.
  - Collaborate with product teams to identify opportunities for
    better merchant customization.
  - Take ownership of assigned features from development through
    deployment and maintenance.

  Requirements

  - 3+ years of professional experience in frontend or full-
    stack software engineering.
  - Strong professional experience developing web applications
    with React.
  - Proficiency in JavaScript and TypeScript.
  - Experience with Next.js or comparable modern frontend
    frameworks.
  - Strong knowledge of HTML, CSS, and responsive web
    development.
  - Experience building interactive, component-based user
    interfaces.
  - Strong understanding of reusable component architecture.
  - Experience implementing complex frontend interactions and
    application state.
  - Familiarity with modern CSS approaches and component styling
    techniques.
  - Experience translating design specifications into functional
    interfaces.
  - Understanding of responsive layouts and cross-browser
    compatibility.
  - Experience integrating frontend applications with REST APIs
    or comparable backend services.
  - Familiarity with asynchronous data fetching and client-
    server communication.
  - Experience building configurable user interfaces or data-
    driven components.
  - Strong debugging and troubleshooting skills.
  - Understanding of frontend performance optimization.
  - Familiarity with web accessibility and usability principles.
  - Experience working with Git and collaborative software
    development workflows.
  - Familiarity with frontend testing tools and automated
    testing practices.
  - Ability to write clean, maintainable, and well-documented
    code.
  - Experience collaborating with product managers, designers,
    and backend engineers.
  - Strong attention to detail when implementing visual designs
    and interactive behavior.
  - Ability to independently manage assigned features and
    technical responsibilities.
  - Strong communication and problem-solving skills.
  - Comfort working in a fast-moving, remote engineering
    environment.

  Nice to Have

  - Experience building website builders, visual editors, or no-
    code/low-code platforms.
  - Experience developing drag-and-drop interfaces or
    interactive editing tools.
  - Familiarity with rich-text editors or content editing
    frameworks.
  - Experience with libraries such as dnd-kit, Lexical, TipTap,
    or ProseMirror.
  - Experience building configurable page layouts or component-
    based website templates.
  - Familiarity with content management systems and structured
    content models.
  - Experience developing live-preview or real-time editing
    functionality.
  - Experience with Tailwind CSS or modern styling systems.
  - Familiarity with reusable design systems and component
    libraries.
  - Experience building e-commerce storefronts or merchant-
    facing SaaS applications.
  - Familiarity with Shopify themes, storefront customization,
    or comparable website platforms.
  - Experience developing white-label or multi-tenant SaaS
    interfaces.
  - Experience with tRPC or strongly typed API integrations.
  - Familiarity with Prisma, Drizzle, or relational data models.
  - Experience with frontend state management libraries such as
    Zustand.
  - Familiarity with browser rendering behavior and complex
    layout debugging.
  - Experience with frontend performance monitoring and Core Web
    Vitals.
  - Experience with end-to-end testing tools such as Playwright
    or Cypress.
  - Experience collaborating closely with product designers on
    interactive tools.
  - Experience using AI-assisted development tools such as
    Cursor or Claude Code.
