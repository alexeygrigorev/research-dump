description: |
  About Us

  Propel is on a mission to build technology that strengthens
  the social safety net. We’re a passionate team of ~100
  Propellers who envision a future where every American has
  the tools and resources they need to thrive.

  The Role

  Are you a Fullstack Engineer looking to make a big impact at
  a mission-driven company? Do you thrive in high-autonomy
  startup environments?

  We’re looking for a motivated Fullstack Engineer to join our
  engineering team at Propel to help make this a reality. This
  role includes opportunities to flex between IC and
  engineering management and team leadership!

  This role will make an impact and possibly work across
  several products and stacks, including interacting with
  government programs, surfacing savings opportunities,
  enrolling users in healthcare plans, internal tooling,
  architecture, and more! We are looking for a passionate,
  user-centric fullstack engineer that is excited about
  working on meaningful and complex technical problems that
  have a positive impact on our users’ lives.

  Here's how you'll impact the company:

  - Be a strategic leader in identifying the best technical and
    product opportunities. Whether it’s hopping in to build a
    service from scratch to support a new product line or
    advocating for a large refactor of a legacy system, this
    role will have a strong voice in setting the technical and
    product direction of the company and be hands-on in making
    it happen. You will likely be asked to lead a team at
    various points and be flexible in going between impactful
    IC work and leadership responsibilities.
  - Up-level and set the bar for engineering. You will be a role
    model for others and establish best practices when it
    comes to technical decisions, code hygiene, written
    communication and documentation, and judgment when it
    comes to shipping high-quality products and projects on a
    timeline.
  - Dive deep into the most important, highest complexity
    problems at the company. When there is something that
    needs to get done at high complexity and scale, you’ll be
    someone we lean on to help get it done. You’ll be given
    both a lot of autonomy and a lot of support in how you
    want to tackle tough but rewarding challenges!

  Requirements:

  - 10+ years experience in designing, building, shipping, and
    maintaining complex full-stack software at scale
  - 3+ years experience successfully leading and managing a team
  - Fluency in at least one backend and one frontend language,
    with a willingness to learn Python and JavaScript
  - Experience working in a startup environment and possess the
    ability to operate effectively and independently when
    faced with ambiguity
  - Ability to ramp up quickly to our product ecosystem to
    contribute to large and impactful projects
  - Excellent communication skills across technical and non-
    technical audiences and topics, both written and verbal
  - Ability to provide excellent feedback in technical specs,
    code reviews, and team discussions
  - Passion for making a difference in the lives of our users

  Exceptional candidates will have:

  - A track record of identifying the right problems to solve,
    advocating for and driving change, and keeping
    stakeholders in the loop
  - Experience with building consumer-facing product(s) for
    large user bases
  - Flexibility in operating as a pure individual contributor or
    as a manager of a small team
  - Curiosity and excitement when confronted with new
    technologies, stacks, or novel problems
  - Excellent judgment when trading off speed of shipping vs.
    robustness and scalability
  - The ability to adapt and communicate smoothly across all
    levels of seniority
  - A focus on impact and ability to prioritize both long-term
    and short term needs
  - Eagerness to participate at the strategic level when it
    comes to the technical and product roadmap and
    prioritization on the organization-level
  - Passion and skill for mentoring and up-leveling other
    engineers

  At Propel, you'll enjoy:

  - Meaningful work and a strong, shared sense of mission with a
    passionate and world-class team
  - Remote-friendly work environment with a dog-friendly office
    in Downtown Brooklyn
  - 20 days of PTO and unlimited sick days
  - 4% 401K match
  - $10k lifetime spend towards Carrot Fertility
  - Excellent Medical, Dental and Vision options
  - Other health and mental health focused benefits and perks
  - Propel builds compensation bands referencing the 75th
    percentile of compensation for companies like us. Expected
    compensation for the role as scoped is $240K - $270K and
    will be based on how a candidate matches to our internal
    leveling guide. Bands may be expanded if someone is
    leveled more senior than the role was initially scoped.

  Additional Considerations:

  - We are committed to building a diverse and inclusive team,
    and welcome applicants from all backgrounds and abilities.

  More About Propel

  Propel is a technology company that’s strengthening the
  social safety net for people who receive government
  benefits. Over 5 million Americans trust the free, modern
  Propel app to manage their government benefits, save money,
  and get updates when their benefits change. We’ve also
  partnered with renowned institutions and organizations like
  Vote.org, GoFundMe, and GiveDirectly.

  Propel is a for-profit, venture-backed company that holds
  its social mission at its core. We're proud to be supported
  by a blend of nonprofits, impact investors, and world-class
  investors including the Robin Hood Foundation, Andreessen
  Horowitz, Nyca Partners, Financial Health Network,
  JPMorganChase, Kevin Durant, Serena Williams, and Nas.

  Learn more about our impact from the press

  - Fintech Company Propel Announces $10 Million Fund For Food
    Stamp
  - Late Show With Stephen Colbert
  - How to Propel the Fight Against Poverty in America
  - How Tech is Helping Poor People Get Government Aid
  - How one tech startup is giving cash to SNAP recipients
  - Recipients Affected By Government Shutdown
  - How hunger relief groups say you can help feed your
    neighbors during the shutdown and beyond

  Join us, and let's build something amazing together!
