description: |
  Join a dynamic team at the pulse of global markets, where we
  deliver innovative software and service solutions for
  essential financial reporting and capital markets
  transactions. At DFIN, we are a values-driven organization
  that empowers you to build a fulfilling career while
  bringing your authentic self to work every day. Our "Win as
  One" mentality ensures that our team's success is directly
  linked to Client, Shareholder and Employee Satisfaction.  In
  2026, DFIN was named #1 on the 2026 Top 100 Global Most
  Loved Workplaces® by Best Practice Institute. We have also
  been recognized as one of America's Most Loved Workplaces®
  for five consecutive years and a Built In Best Place to Work
  for six years, reflecting our continued commitment to
  supporting employees' total well-being. Enjoy competitive
  compensation, a flexible workplace, comprehensive benefits,
  and opportunities for professional growth. Bring your
  passion and talents to DFIN - because being YOU thrives
  here. Summary: We are seeking a highly experienced and
  strategic Senior Manager to lead our Network Security
  Engineering & Operations team. This role is responsible for
  ensuring the availability, reliability, and security of
  critical network infrastructure components including remote
  worker technologies, firewalls, load balancers, web
  application firewalls (WAFs), routers, switches, and
  wireless access points. This includes supporting network
  connectivity and network security to all sites, datacenters,
  and cloud providers. The ideal candidate will bring deep
  technical expertise, strong leadership skills, and a
  proactive approach to managing 24/7 operational support and
  escalations. Responsibilities: Leadership & Strategy

  - Lead and mentor a team of network security engineers,
    ensuring a team culture aligned to CISO Org behavioral
    goals and DFIN values.
  - Lead network security projects, including strategy,
    requirements gathering, and definition of scope and
    project timelines as a Product Owner.
  - Collaborate with cross-functional teams to align network
    security initiatives with business objectives, balancing
    internally and externally driven work requests.
  - Maintain relationships with partners and vendors including
    budget management and negotiations.
  - Foster a culture of continuous improvement through regular
    coaching, mentoring, and performance check-ins; ensure
    appropriate skills are gained and maintained.
  - Promote accountability and recognize high performance while
    addressing areas for improvement with clear action plans.
  - Exceptional communication and interpersonal skills,
    including negotiation, facilitation, and consensus
    building; ability to influence and persuade without direct
    authority.
  - Ability to communicate complex and technical issues to
    diverse audiences, orally and in writing, in an easily
    understood, authoritative, and actionable manner.

  Responsibilities Continued  Engineering & Operations

  - Oversee the design, implementation, and maintenance of
    network security technologies including firewalls, WAFs,
    load balancers, routers, switches, remote access, and
    wireless access points.
  - Ensure high availability and performance of network and
    network security services through proactive monitoring and
    capacity planning.
  - Manage lifecycle of network security systems and services
    including upgrades, patching, and end-of-life transitions.
  - Develop and maintain appropriate metrics to monitor the
    health of network and network security services, as well
    as team responsiveness and delivery.

  Incident Management & Escalation

  - Serve as primary escalation point for critical network and
    network security incidents, including 24/7 support for
    critical outages.
  - Lead root cause analysis and resolution efforts for outages
    or incidents.
  - Maintain and improve incident response processes and
    documentation.

  Compliance & Risk Management

  - Ensure network security infrastructure complies with
    internal policies and client obligations.
  - Conduct regular audits and assessments to identify and
    mitigate risks.
  - Support vulnerability management and remediation efforts.

  24/7 Availability

  - Maintain readiness for 24/7 support and escalation,
    including participation in on-call rotations as needed.
  - Implement automation and redundancy to reduce manual
    intervention and improve resilience.

  Qualifications:

  - Bachelor's degree in a relevant discipline or equivalent
    experience.
  - CISSP, CISM, CCNP, and/or other relevant certifications are
    a plus.
  - Minimum of 5 years' experience leading network and other
    engineering disciplines including related architecture
    efforts.
  - Minimum of 5 years' experience designing and implementing
    enterprise network security or similar engineering
    disciplines; demonstrates exceptional innovation and keen
    awareness of external threats necessary to drive a
    preventative posture.
  - Strong demonstrated knowledge of network security products
    including firewall, WAF, load balancer, DDoS, and
    microsegmentation technologies.
  - Strong demonstrated knowledge of networking products
    including routers, switches, and wireless technologies.
  - Proven experience interfacing with senior management and
    communicating complex cybersecurity concepts in business-
    relevant ways.
  - Strong demonstrated knowledge of enterprise systems, cloud
    solutions, and IT/security technologies.
  - Extensive experience in strategic planning, budgeting, and
    resource allocation.
  - Excellent written and verbal communication skills with
    experience presenting to leadership teams and
    communicating security and risk-related concepts to both
    technical and non-technical audiences.
  - Strong business analysis skills, problem-solving techniques,
    and follow-through.
  - Willing and able to roll up sleeves and lead from the front.
  - A self-starter with a can-do attitude who drives engagement
    and accountability internally and cross-functionally.
  - A driver and implementer who possesses the poise and ability
    to act calmly and competently in high-pressure, high-
    stress situations.

