description: |
  We're looking for contractors and/or part-time employees
  with demonstrated experience using GeneratePress and
  GenerateBlocks to build WordPress sites. You will be
  expected to translate designs and site architectures into
  functional, scalable, responsive websites, including
  WooCommerce based e-commerce sites.

  We have settled on this stack after years working with a
  wide-variety of other page- and site-builders. Full-site
  development experience using GeneratePress Pro and
  GenerateBlocks Premium, and its suite of in-built tools and
  functionality is an absolute requirement. Extending
  functionality via core plugins for custom fields, forms,
  SEO, commerce integrations, CRM and email marketing
  integrations is also expected.

  Most of our clients are B2B manufacturers or mixed B2B/B2C
  retailers so sites will almost always have some commerce
  component.

  This is a freelance/contractor/part-time position.

  Requirements

  - Front-End WordPress website development experience using
    GeneratePress Pro and GenerateBlocks Premium.
  - Use of core plugins like ACF, forms, SEO, security and site
    backups, marketing and crm integrations.
  - Design implementation using responsive best-practices.
  - Translating Figma prototypes into responsive design elements
    and reusable blocks.
  - Implementing and configuring required plugins
  - Following accessibility best practices
  - Working as part of design, implementation and customer
    support team

  No recruiters or placement agencies.

  Benefits

  Contingent on employment/contract type.
