description: |
  Join Pigment: The AI Platform Redefining Business Planning



  Pigment is the AI-powered business planning and performance
  management platform built for agility and scale. We connect
  people, data, and processes in one intuitive platform, with
  AI agents that work alongside every team, from Finance to
  HR, to build, adapt, and align strategic plans in real time.
  Founded in 2019, Pigment is one of the fastest-growing SaaS
  companies globally, passing $100M in ARR in 2026 and
  doubling revenue for the second year in a row. Industry
  leaders like Unilever, Uber, Anthropic, Snowflake, and
  Siemens use Pigment every day to make better-informed
  decisions and navigate any scenario with confidence. In
  October 2026, we raised a $250M Series E at a $2.3B
  valuation, bringing our total funding to $650M+. Today we’re
  a growing team of 700+ across Paris, London, New York,
  Toronto, San Francisco, and Austin, and we’ve been named a
  Visionary in the Gartner® Magic Quadrant™ for Financial
  Planning Software two years running. At Pigment, we take
  smart risks, celebrate bold ideas, and challenge the status
  quo - all while working as one team. If you’re driven by
  innovation and ready to make an impact at scale, we’d love
  to hear from you.

  The opportunity



  We are looking for an Engineering Program Manager (EPM) to
  help us scale our engineering team. Because we have EPMs
  almost since the beginning of Pigment, the role is already
  well-known. Our team is central to the engineering
  organization, perceived as a force multiplier by all the
  other engineers. We are constantly on the lookout to improve
  how we work. We like to try new ideas, whether it is to
  accelerate delivery, structure the organization or develop a
  unique culture. By joining our passionate, close-knitted
  team, you can have an impact in many different ways and
  learn in a team that is both young and fast-growing!

  Here is what the day-to-day of an EPM looks like at Pigment:



  Deliver: You make a difference every day in the engineering
  team(s) you are working with, as you enhance clarity,
  direction, scope, and keep all the parts together with other
  roles (such as Product Managers). Typically an EPM
  accompanies 1 to 3 teams in their delivery, ranging from
  technical projects (e.g. scalability and performance, SRE)
  to more functional ones (e.g. bringing automations to our
  product).



  Scale: You contribute to the engineering instances wherever
  you can bring added value. For instance, you can contribute
  to maintaining a healthy release pipeline, participate to
  incident response, oversee improvements to our monitoring
  and alerting practices…You also lead initiatives of various
  sizes to tackle the needs and issues that arise when growing
  as an organization. For instance, suggest evolutions to
  roles and responsibilities, better organize knowledge
  management, or work on large-scale projects related to
  quality management and production stability.



  Federate: You contribute to the general well-being of the
  team, upon opportunity and based on affinity, for example as
  an organizer of regular instances (all-hands meetings,
  newsletters…), hackathons, team building activities, and any
  other idea related to the promotion of Pigment culture
  internally and externally. You also contribute to Pigment
  hiring and branding initiatives.



  The team

  As a team, we have a mission statement and a roadmap that we
  maintain over time. We are open to different styles and we
  rotate responsibilities and projects on a regular basis
  between us. We regularly exchange on our challenges in “co-
  development” sessions and sound new ideas to one another.
  You will also grow as an individual thanks to a career
  ladder and a culture of on-going feedback.



  Explore Our Tech Blog:

  If you're curious about the kind of challenges our
  engineering team tackles, our culture, and our organization,
  we invite you to explore our Tech Blog!



  Who you are



  We expect demonstrated experience in helping technical teams
  build and run in a fast-paced environment, with the right
  touch of processes and empowerment of individuals.



  Technical project/product management, engineering
  management, quality engineering, and production-related
  roles are typically the kind of roles where such an
  experience is demonstrated, but we are open to a diversity
  of backgrounds.



  Experience as a software engineer is a plus but not
  required. The position does not involve coding. You should
  be able to read and understand code and read / comment /
  challenge a technical design.



  To help you better understand the role, here are the
  qualities we are looking for in an EPM:

  Resourcefulness: you like to be dropped in a new context and
  come up with your own solutions

  Change management: you are a people person and you convey
  change smartly and courageously

  Diligence: you are curious and connect the dots in ways no
  one else can, you strive to reach alignment through shared
  understanding, clarity, and direction

  Integrity: you lead by example, inspire others, and always
  play “first team”



  The position doesn’t involve people management.

  Fluency in English (French not required)



  Folks from underrepresented minorities: science shows that
  you are less likely to apply if you feel that you don’t have
  all the necessary prerequisites. If this description matches
  where you are now or what you'd like to grow into in your
  next position, we encourage you to apply.



  #LI-CK1

  What you will get



  - Competitive salary (70k to 100k)

  - Equity

  - The best health insurance with Alan Blue entirely free for
    you and your family 💙

  - Trust and flexible working hours

  - Brand new offices in the heart of Paris (Bourse), London,
    New York, and Toronto

  - Remote-friendly environment

  We conduct background checks as part of our hiring process,
  in accordance with applicable laws and regulations in the
  countries where we operate. This may include verification of
  employment history, education, and, where legally permitted,
  criminal records. Any checks will be conducted lawfully
  prior to formal employment contracts being signed, with
  candidate consent, and information will be treated
  confidentially.



  Pigment is an equal opportunity employer. We believe
  diversity is a strength and fosters innovation. We are
  committed to enabling everyone to feel included and valued
  at the workplace.  All qualified applicants will receive
  consideration for employment without regard to age, color,
  family, gender identity, marital status, national origin,
  physical or mental disability,  sex (including pregnancy),
  sexual orientation, social origin, or any other
  characteristic protected by applicable laws. We may process
  your personal data in accordance with our HR Data Protection
  Notice.
