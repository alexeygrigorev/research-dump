description: |
  Engineering | Canada, Canada | Remote, Remote Working at
  Atlassian Atlassians can choose where they work - whether in
  an office, from home, or a combination of the two. That way,
  Atlassians have more control over supporting their family,
  personal goals, and other priorities. We can hire people in
  any country where we have a legal entity. With a sufficient
  timezone overlap with the team, we're able to hire eligible
  candidates for this role from any location in Canada.
  Atlassian is looking for a Senior Frontend Software Engineer
  to design, build, evolve and maintain our web frontend
  systems and tools in order to deliver great experiences to
  our users. Your Future Org To be a 100-year company, we are
  proudly building a world-class engineering organization
  composed of empowered teams that are equipped with the tools
  and infrastructure to do the best work of their careers.
  Engineering at Atlassian prioritizes initiatives that
  advance AI and support our customers' transition to the
  cloud while consistently delivering maximum value through
  our core product suite - Jira, Confluence, Trello, and
  Bitbucket. We seek individuals who are eager to shape the
  future and believe in the power of collaboration to achieve
  extraordinary results together. Your Future Team You will
  join Secoda, the team building Atlassian's AI-first data
  catalog and analysis product. We connect to a company's data
  sources, build a trustworthy picture of what that data
  means, and help people get grounded answers without waiting
  on a data team. We are a lean product team shipping a
  complex UI: catalog search, lineage, knowledge, dashboards,
  and AI chat. We care about speed, polish, and whether the
  product actually feels good to use. If something is slow,
  unclear, or untrustworthy, that is our bug to fix. Atlassian
  is looking for a Senior Frontend Software Engineer to own
  the quality of that experience. In this role, you will:

  - Design and ship user-facing features end to end, from
    technical design through launch and the follow-through
    after customers start using them
  - Build fast, testable React interfaces for search, catalog
    navigation, lineage, and AI-assisted analysis
  - Profile and improve performance on large trees, tables, and
    streaming AI surfaces so the product stays responsive at
    real workspace scale
  - Partner with design and product to shape the problem, not
    just implement a spec. Speak up when the UX, speed, or
    polish can be better
  - Raise the frontend bar through code reviews, documentation,
    and complex bug fixes, especially on high-risk or cross-
    cutting issues
  - Mentor other engineers and help the team write frontend code
    that lasts

  Minimum Qualifications

  - 5+ years of experience building customer-facing frontend
    products at a high-quality software company
  - Strong React and TypeScript fundamentals, with deep
    experience in the JavaScript language and ecosystem
  - Experience building frontend applications at scale,
    including bundling, linting, testing, and releasing
  - Experience with modern testing frameworks (e.g., Jest,
    Cypress, Playwright)
  - Track record of driving complex, end-to-end features with
    visible product impact, not only incremental improvements
    and refactors
  - Product sensibility: you care about UX, speed, and polish,
    and you raise it when something does not feel right
  - Experience engineering software systems of medium-to-large
    scope and complexity
  - Experience mentoring more junior engineers
  - Bachelor's or Master's degree (preferably a Computer Science
    degree or equivalent experience)

  Preferred Qualifications

  - Comfortable working without heavy PM overhead. You can help
    shape the problem, not just implement a solution
  - High ownership: self-directed, full-lifecycle builder who
    takes a feature from idea to shipped
  - Experience with component libraries and design systems,
    including Atlassian Design System or similar
  - Experience building accessible, performant web applications,
    including virtualized lists, large trees, or data-dense
    UIs
  - Experience with search, catalog, or AI-assisted product
    interfaces
  - Thrives on a lean, high-output, remote-first team

  Compensation At Atlassian, we strive to design equitable,
  explainable, and competitive compensation programs. To
  support this goal, the baseline of our range is higher than
  that of the typical market range, but in turn, we expect to
  hire most candidates near this baseline. Base pay within the
  range is ultimately determined by a candidate's skills,
  expertise, or experience. Canada: CA$144,900 - CA$189,175
  This role may also be eligible for benefits, bonuses,
  commissions, and equity. Benefits & Perks Atlassian offers a
  wide range of perks and benefits designed to support you,
  your family and to help you engage with your local
  community. Our offerings include health and wellbeing
  resources, paid volunteer days, and so much more. To learn
