description: |
  About Atla

  Atla is committed to engineering safe, beneficial AI systems
  that will have a massive positive impact on the future of
  humanity. We are a London-based start-up building the
  improvement engine for AI agents. Become part of our growing
  world-class team, backed by Y Combinator, Creandum, and the
  founders of Reddit, Cruise, Rappi, Instacart and more.

  Role

  As Atla’s Product Engineer, you will build intuitive and
  novel user experiences that help users automatically
  discover the underlying issues in their agents—and fix them
  fast. You will own our customer-facing platform, designing
  seamless workflows that make AI agent evaluation effortless.
  As part of your role, you will:

  - Own and build the platform that lets users automatically
    find, understand, and fix their agents’ most critical
    failures by actively contributing to user research,
    usability testing, and setting the direction of the
    product.
  - Design an intuitive and seamless user flow from onboarding
    to detailed trace analysis, ensuring effortless AI agent
    evaluation through polished, high-quality UX/UI.
  - Work closely with founders, product, engineering, and
    research to translate cutting-edge AI capabilities into
    intuitive, accessible products that help users ship AI
    agents with confidence.
  - Ship end-to-end features across the stack, contributing to
    APIs, databases, and backend logic when needed to ensure a
    smooth and scalable product experience.

  Qualifications

  - 3yrs+ experience at a company known for world-class user
    experience such as Notion, Lovable, Sierra, or Revolut.
  - Demonstrated ability to build world-class software products,
    with a strong emphasis on frontend development:
    - Proven track record of building and scaling frontend
      systems, ideally in React and TypeScript.
    - Experience with relational databases (e.g., PostgreSQL).
    - Familiarity with deploying applications to cloud platforms
      (e.g., Azure) and experience with frontend testing
      frameworks and CI/CD pipelines.
  - Product-driven engineer with a strong grasp of UX, UI
    principles, and responsive layouts, focused on delivering
    exceptional user experiences.

  Nice to have

  - Experience in developer tools, AI, or ML-related products.
  - Python proficiency is a plus.
  - Experience with specific portions of our frontend stack,
    including Supabase, Vercel, Prisma, NextJS, and React
    Query.
  - Experience as an early engineer at a fast-growing startup.

  About you

  You'll work by and thrive through our core principles:

  Own the Outcome

  - Create real value: Every action should deliver tangible,
    meaningful value for the people who use what we build.
  - Drive to completion: Do the second 90%.
  - Do fewer things, better: Prioritize focus over breadth.

  Back the Team

  - Collaborate for excellence: The whole is greater than the
    sum of its parts.
  - Seek truth: Let the best ideas win, no matter where they
    come from, and let go of ego.
  - Argue passionately, then commit fully: Debate fiercely, but
    once a decision is made, own it like it’s yours.

  Drive the Mission

  - Advance AI safety: Every action should contribute towards
    the safe development of AI.
  - Go big or go home: “The people who are crazy enough to think
    they can change the world are the ones who do.”

  Compensation

  - £90K - £130K GBP
  - Stake in equity as one of the early joiners
  - Pension plan
  - Medical, dental, and vision benefits

  Join our team to make a dent in the universe by engineering
  safe, beneficial AI systems!
