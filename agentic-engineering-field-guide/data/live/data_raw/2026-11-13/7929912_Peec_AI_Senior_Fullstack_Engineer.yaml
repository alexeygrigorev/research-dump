description: |
  About Peec AI

  AI search is changing how brands are discovered and chosen.
  People now ask ChatGPT, Gemini, Claude and Google’s AI
  answers what they used to search for, and AI assistants
  increasingly shape the journey from discovery to purchase.
  Winning customers now means winning over the AI systems that
  influence their decisions.

  Peec AI is an AI search platform that helps marketing teams
  understand and improve how their brands are discovered,
  represented, and recommended. We show them where they stand,
  what’s shaping it, and where to act. Since launching in
  January 2025, Peec AI has passed $20M ARR and 4,000 paying
  customers. We’re a Series A company backed by 20VC and
  Singular, with 100+ people across our Berlin HQ and our New
  York office.

  What you’ll do

  - Take ownership of complex product features end-to-end - from
    architecture and data modeling to beautiful and performant
    user interfaces
  - Translate product ideas and designs into pixel-perfect,
    production-grade UI using modern frontend frameworks and
    component libraries
  - Work closely with Product, Design, and Engineering to define
    scope, shape technical direction, and deliver features
    that delight users
  - Contribute to and evolve both our backend infrastructure and
    frontend design system, ensuring consistency, scalability,
    and developer velocity
  - Push the boundaries of what’s possible across the stack -
    improving developer experience, introducing new
    capabilities, and driving innovation

  What we’re looking for

  - 5+ years of professional fullstack engineering experience
  - Deep expertise in TypeScript, React, Tailwind CSS and proven
    ability to deliver high-quality features across both
    frontend and backend
  - Strong architectural instincts and ability to design clean,
    maintainable, and scalable systems end-to-end
  - Experience designing and implementing APIs (REST, GraphQL,
    or gRPC) and integrating them seamlessly into polished
    user interfaces
  - Strong communication skills and a high sense of ownership -
    able to work autonomously while staying tightly aligned
    with team goals
  - Some markers of excellence, which could also be non-work
    related, like having a high FIDE rating
  - Most importantly: we care deeply about working with
    genuinely kind, collaborative, and hard-working people who
    make the team better through empathy and openness

  Tech Stack

  - Languages: TypeScript
  - Backend: GCP, Cloud Functions, Cloud Tasks, RabbitMC,
    Firestore, PostgreSQL, Elasticsearch
  - Frontend: React, shadcn/ui, Tailwind CSS
  - AI Models: OpenAI, Claude, Perplexity, Gemini, Llama, etc.

  Bonus Points

  - Active contributions to open-source projects
  - Deployed side/hobby projects that we can check out
  - Experience in starting a company or working at a top-tier
    high-growth startup

  What we offer

  - Exciting and challenging work with real impact and ownership
    at one of Europe’s fastest-growing Series A startups
  - Regular team events and off-sites
  - Aggressive equity compensation package
  - Paid Dinner & Uber home when working late
  - The most beautiful office space and work environment in
    Berlin
