description: |
  Overview

  The Microsoft Silicon Engineering Solutions and Cloud
  Hardware Infrastructure Engineering (SCHIE) team is
  responsible for developing and delivering the hardware and
  firmware that is responsible for powering Microsoft’s
  “Intelligent Cloud” mission. From cloud game streaming to
  data services, the hardware we design is contributing to the
  success of millions of customers. The SCHIE team is looking
  for a Principal Firmware Engineering Manager -- Diagnostics:

  We in SCHIE’s Firmware Center of Excellence create the
  foundational firmware that powers the Microsoft Cloud. Our
  firmware lights up millions of servers and racks across the
  globe, enabling users to do everything from running blogs to
  crunching through powerful AI algorithms. We’re a growing
  team of diverse, talented & passionate engineers inventing
  and delivering technology to light up the “world’s
  computer!” We believe that a robust firmware infrastructure
  leads to incredibly powerful computing experiences—if you
  believe this too, we need you!

  We are working on the next generation hardware/firmware for
  server, silicon and rack infrastructure with a focus on
  innovation in firmware technology to secure Azure
  infrastructure for Microsoft and their customers. Along with
  leading a team of wonderful engineers, this role will give
  you an opportunity to design and architect the systems and
  servers of tomorrow that will scale in the Azure Fleet.

  We are looking for a Principal Firmware Engineering Manager
  to join our team.

  Responsibilities

  - You will be involved with all phases of product development,
    from microarchitecture design through firmware
    architecture and development and diagnostics.
  - At the design phase, you will be part of a team driving the
    architecture, design and development of the various sub-
    systems including firmware development of low-level
    hardware interfaces and define flows for boot flows of
    ASIC.
  - You will be responsible for firmware level diagnostics and
    debug as part of end-to-end firmware development and
    debug.

  Qualifications


  Minimum Qualifications:

  - Doctorate in Electrical Engineering, Computer Engineering,
    Computer Science, or related field AND 7+ years technical
    engineering experience
    - OR Master's Degree in Electrical Engineering, Computer
      Engineering, Computer Science, or related field AND 10+
      years technical engineering experience
    - OR Bachelor's Degree in Electrical Engineering, Computer
      Engineering, Computer Science, or related field AND 12+
      years technical engineering experience
    - OR equivalent experience.

   Other Requirements: Ability to meet Microsoft, customer
  and/or government security screening requirements are
  required for this role. These requirements include, but are
  not limited to, the following specialized security
  screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.



  Preferred Qualifications:

  - The successful candidate should have experience with some or
    all the following: Peripherals such as PCIe, memory
    interfaces, OS primitives, memory management, scheduling,
    interrupts, threading.
  - Experience with Implementation of Hardware/Firmware Security
    primitives.
  - Experience with Platform initialization, Board support
    package integration, low level drivers for peripherals
    such as PCIe, I2C, eMMC, SPI, USB, UARTs as well as Memory
    Management, Scheduling, Interrupts and multi-threading.
  - Experience with Architecting, Designing and delivering on
    new Data Center class technologies across the entire
    platform.
  - Experience working with external partner teams to drive
    design and architectural changes.
  - Experience driving changes in organizations in the past in
    terms of design and architecture of products.
  - 10+ years of professional experience designing and
    developing Embedded Software solutions.
  - Experience with working from early concept of SoC
    Architecture and design to shipping final product.
  - Experience driving firmware architecture solutions with
    detailed troubleshooting and debugging skills.

