description: |
  McKesson is an impact-driven, Fortune 10 company that
  touches virtually every aspect of healthcare. We are known
  for delivering insights, products, and services that make
  quality care more accessible and affordable. Here, we focus
  on the health, happiness, and well-being of you and those we
  serve – we care.

  What you do at McKesson matters. We foster a culture where
  you can grow, make an impact, and are empowered to bring new
  ideas. Together, we thrive as we shape the future of health
  for patients, our communities, and our people. If you want
  to be part of tomorrow’s health today, we want to hear from
  you.

  The Shared Capabilities team builds and operates the core
  APIs, event standards, and integration services that power
  product development across CoverMyMeds. These services
  connect directly to critical business data and serve as
  foundational building blocks used by engineering teams
  throughout the organization.

  As a Senior Software Engineer, you will design, build, and
  operate production-grade APIs and event-driven services
  while helping establish the engineering standards that other
  teams follow. In addition to hands-on software development,
  you will serve as a technical resource for the organization
  by reviewing solution designs, mentoring engineers, and
  providing guidance on architectural decisions and
  implementation approaches.

  This is a highly collaborative, backend-focused engineering
  role with minimal frontend development. Success requires
  strong technical depth, sound engineering judgment, and the
  ability to influence teams through expertise rather than
  authority.



  What You'll Do

  Core Engineering Responsibilities

  - Design, build, and operate scalable, production-grade APIs
    used across CoverMyMeds.
  - Develop and maintain services built using TypeScript,
    Node.js, and Python.
  - Build and support Kafka-based event-driven integrations and
    services.
  - Design and maintain relational database schemas using
    PostgreSQL.
  - Develop and maintain infrastructure as code using Terraform
    and related tooling.
  - Build and enhance CI/CD pipelines using GitHub Actions and
    automated deployment processes.
  - Build migration tools and assist engineering teams in
    adopting new platform capabilities.
  - Troubleshoot and resolve production issues across services
    owned by the Shared Capabilities team.
  - Participate in an on-call rotation supporting services owned
    by the team.



  Technical Leadership Responsibilities

  - Perform technical feasibility reviews and provide actionable
    feedback on proposed solutions.
  - Partner with engineering teams to establish and maintain API
    and event-design standards.
  - Mentor engineers through code reviews, technical
    discussions, and collaborative problem solving.
  - Act as a technical resource for teammates and partner
    engineering groups.
  - Identify opportunities to improve engineering quality,
    maintainability, reliability, and scalability.
  - Help drive adoption of modern engineering practices and
    development tooling.
  - Collaborate with teams early in the design process to
    prevent costly architectural divergence.



  AI-Assisted Development

  - Utilize AI-assisted development tools to improve engineering
    productivity and delivery speed.
  - Contribute to the continuous improvement of team development
    workflows and engineering practices.
  - Apply sound engineering judgment when validating AI-
    generated solutions and recommendations.


  Priority will be given to candidates who reside in the
  Columbus, OH Metropolitan area.

  We are unable to provide sponsorship for this role presently
  or in the future.



  Minimum Qualifications

  Degree or equivalent and typically requires 7+ years of
  relevant experience.



  Education

  Bachelor's degree in Computer Science, Software Engineering,
  or a related technical field, or equivalent practical
  experience.



  Critical Skills

  - 5+ years of professional software development experience.
  - Demonstrated experience designing, building, and operating
    production APIs.
  - Experience developing backend services using
    TypeScript/Node.js and Python.
  - Experience working with Kafka or similar event-streaming
    platforms.
  - Experience designing and maintaining relational database
    schemas using PostgreSQL or similar technologies.
  - Experience implementing infrastructure as code using
    Terraform or comparable tooling.
  - Experience working with modern CI/CD platforms such as
    GitHub Actions.
  - Experience supporting production systems and resolving
    operational issues.
  - Experience participating in technical design discussions and
    code reviews.



  Preferred Qualifications

  - Experience with Azure services, including API Management and
    Service Bus.
  - Experience with Helm and Kubernetes-based deployment
    environments.
  - Experience modernizing applications built with Ruby on Rails
    or Elixir.
  - Experience working in SOX, ITGC, or other regulated
    software-delivery environments.
  - Experience developing platform services, shared engineering
    capabilities, or internal developer platforms.
  - Experience mentoring engineers and influencing technical
    decisions across teams.
  - Experience using AI-assisted software-development tools such
    as Claude or similar technologies.



  Technical Capabilities

  - Strong understanding of API design principles, including
    versioning and backward compatibility.
  - Strong problem-solving and analytical skills.
  - Ability to evaluate technical approaches and provide
    constructive engineering feedback.
  - Ability to communicate technical concepts and tradeoffs to
    technical and non-technical audiences.
  - Demonstrated ability to learn new technologies and apply
    them effectively in a production environment.




