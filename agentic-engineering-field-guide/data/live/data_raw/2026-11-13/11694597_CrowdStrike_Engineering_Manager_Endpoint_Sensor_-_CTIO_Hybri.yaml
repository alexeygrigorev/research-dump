  About CrowdStrike Falcon (Endpoint Security)

  CrowdStrike Falcon Endpoint Security is a two-component
  security product.

  One component is the “sensor”: an agent installed on client
  machines that observes system activity and recognizes
  malicious behavior, then provides on-box prevention
  capability and remote telemetry to the Falcon cloud. The
  sensor processes thousands of events per second to provide
  deep visibility into operations on the endpoint, and
  performs rich correlation and computation to identify
  malicious events and block malicious activity.

  The other component is the cloud: it aggregates sensor
  telemetry for each customer’s network, correlates malicious
  behavior across multiple machines, and presents our
  customers’ operations teams with a prioritized summary of
  the threats detected in their environments.

  About the Team:

  The CTIO (Chief Technology Innovation Officer) team at
  CrowdStrike defines and executes on the company's technology
  vision and strategy, driving innovation, and overseeing the
  development and evolution of the Falcon platform. We deliver
  cutting edge innovation for our sensor across Windows, macOS
  and Linux. We ensure that CrowdStrike maintains its position
  as a technology leader by fostering engineering excellence,
  aligning technical capabilities with business objectives,
  and anticipating emerging threats and market trends.

  About the Role:

  As an Engineering Manager, you'll lead a team working on
  user-mode security architecture on Windows, where
  reliability, performance, and resource footprint all matter.

  The sensor sits at the intersection of OS internals,
  performance, and security. Small design choices have an
  outsized impact on millions of machines. Safe deployment and
  rigorous testing are core to how we build.

  You will be expected to have ownership over all major
  components and development projects in your team, as well as
  training and growing individuals. You’ll assist with
  architecting solutions and support the implementation of
  core features that cross-cut most core OS subsystems such as
  file system, memory and processes, and networking. Many
  features are also built as shared components across multiple
  platforms. You’ll be expected to lead projects efficiently
  while maximizing performance and minimizing costs, making
  sure high standards are being followed when it comes to
  design, code quality, and testing.

  What You'll Do:

  - Lead and grow engineers across the US and the EU
  - Own your team's roadmap and delivery from design through
    release, with some components affecting all platforms
    (Windows, macOS, Linux)
  - Guide and drive designs for cross-platform features touching
    file system, processes, memory, and networking subsystems
  - Collaborate with peer sensor teams across the company,
    including presenting progress at the conclusion of each
    deliverable.
  - Set the bar for engineering quality: design reviews, code
    reviews, testing strategy, performance, and safe rollout
  - Coach engineers through career growth, feedback, and
    performance conversations
  - Build a culture of ownership and independence

  What You'll Need:

  - Experience as an Engineering Manager leading a distributed
    team to ship major features and releases
  - Track record of shipping systems-level software (agents,
    kernels, drivers, OS components) at scale
  - Hands-on systems programming experience and solid OS
    internals knowledge, preferably on Windows, although deep
    macOS or Linux experience is welcome
  - Comfortable reviewing code and reasoning about memory
    management, concurrency, and performance
  - Experience with C/C++ preferrably, although other low-level
    languages like Rust are valuable too
  - Experience driving alignment across teams and organisations
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Cross-platform architecture experience
  - Security product experience (such as EDR, AV, DLP,
    telemetry)
  - Kernel development, or low-level troubleshooting and
    performance tuning

