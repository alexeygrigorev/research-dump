description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  As a Software Engineer on the CDP Payment Acceptance team
  within the Developer group, you'll build the stablecoin
  payment rail powering merchant checkout, subscriptions, and
  onchain settlement for businesses of all sizes. This team
  owns the end-to-end payment experience, from merchant-facing
  checkout components through gRPC orchestration services to
  onchain settlement workers across multiple EVM chains.
  You'll ship full-stack features across our Go backend and
  React/Next.js frontend, directly contributing to our mission
  of becoming the most trusted, performant, and widely adopted
  stablecoin payment rail for global commerce.

  What you'll do:

  - Own end-to-end feature delivery across Go backend services
    and the React/Next.js merchant-facing checkout experience,
    including gRPC/HTTP APIs, protobuf definitions, database
    migrations, and TypeScript client integrations
  - Build and refine the buyer checkout UI (payment links,
    embeddable web components, wallet connection flows via
    WalletConnect, wagmi/viem) with a focus on conversion,
    accessibility, and performance
  - Implement durable, fault-tolerant payment workflows using
    Temporal for onchain settlement, refunds, and
    reconciliation against PostgreSQL
  - Instrument every change with structured logs, metrics, and
    Datadog traces, and own on-call rotation for services you
    ship
  - Partner with Product, Design, and engineering teams (CDP,
    Base, Coinbase Business) to integrate Payment Acceptance
    into the broader Coinbase developer platform

  Required Skills and Experience:

  - 3+ years of professional full-stack software engineering
    experience shipping production systems in Go (concurrency,
    gRPC, testing) and TypeScript/React (hooks, suspense,
    server components, Next.js)
  - Demonstrated experience with relational databases
    (PostgreSQL preferred), including schema design,
    migrations, query performance, and transactional
    correctness
  - Proven track record designing APIs (protobuf/gRPC, REST,
    OpenAPI) and instrumenting production systems with
    structured observability (Datadog, OpenTelemetry, or
    similar)
  - Experience building durable workflow systems (Temporal,
    Cadence, or Step Functions) or working with EVM
    blockchains, stablecoins, and onchain payment patterns
  - Consistent record of writing clear design docs, PR
    descriptions, and runbooks that enable cross-team
    collaboration and operational maturity
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality.
  - Demonstrates the ability to responsibly use generative AI
    tools and copilots (e.g., LibreChat, Gemini, Glean) in
    daily workflows, continuously learn as tools evolve, and
    apply human‑in‑the‑loop practices to deliver
    business‑ready outputs and drive measurable improvements
    in efficiency, cost, and quality.

  #P77903

