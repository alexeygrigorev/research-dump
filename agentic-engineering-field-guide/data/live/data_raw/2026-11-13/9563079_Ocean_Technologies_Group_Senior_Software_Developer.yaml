  🧭 Navigating the position: Senior Python Developer

  We have an exciting opportunity with us now at OneOcean to
  join our Shared Services branch of the Engineering Team as a
  Senior Software Developer. The successful candidate will
  join a team and assist in building a new suite of services
  which will provide cohesion for other services developed
  elsewhere within the business; this means close
  collaboration with other team leaders and stakeholders. The
  kind of projects they can expect to work on will be AI
  related. They must be extremely open-minded, able to seek
  out new technologies on their own initiative and produce
  robust code.

  🚢 Your Voyage Ahead:

  Project Execution:

  - Execution of software development projects, ensuring
    adherence to best practices, coding standards, and quality
    assurance in accordance with the development lifecycle,
    from concept to deployment, with a focus on delivering
    scalable and robust solutions.

  Collaboration and Communication:

  - Collaborate with stakeholders to ensure a cohesive and
    integrated approach to development projects.

  Continuous Improvement:

  - Participate in processes for continuous improvement,
    including code reviews, performance analysis, and feedback
    loops to enhance the overall development lifecycle.

  Agile Methodology:

  - Use agile development methodologies, promoting adaptive
    planning, evolutionary development, and early delivery of
    value. Collaborate with cross-functional teams to
    streamline processes and enhance overall project
    efficiency.

  Team Empowerment:

  - Work with other members of the team to foster a
    collaborative environment that encourages continuous
    learning and professional growth. Instill a passion for
    quality code, creativity, and problem-solving within the
    development team.

  🚢 Recommended to bring on board: 

  Continuous Improvement:

  - Stay up-to-date with new technology trends and best
    practices in Python development and Databricks.
  - Continuously improve the codebase, fix bugs, and optimize
    performance.
  - Participate in processes for continuous improvement,
    including code reviews, performance analysis, and feedback
    loops to enhance the overall development lifecycle.

  Required Experience & Skills:

  - 4+ years in commercial development.
  - In-depth understand of Python stacks, frameworks and tools
    such as pyspark, Delta Table, pyodbc, psycopg2.
  - Proficiency in Test Driven Development, unit, integration,
    and acceptance testing.
  - Familiarity with SQL (SQL), Docker, and cloud platforms
    (Azure).
  - Excellent communication, teamwork, detail-oriented, and
    analytical skills.

  Desirable skills:

  - Exposure to PostgreSQL administration/maintenance.
  - Exposure to Azure DevOps CI/CD & release pipelines.
  - Exposure to Terraform
  - Exposure to API design & Development.

