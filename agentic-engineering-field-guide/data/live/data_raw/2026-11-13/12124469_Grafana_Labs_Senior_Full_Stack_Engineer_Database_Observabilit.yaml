description: |
  Grafana Labs is the company behind Grafana Cloud, the fully
  managed observability platform trusted by more than 10,000
  organizations to ensure reliability, resolve incidents
  faster, and optimize telemetry at scale. Built on open
  source and open standards and designed for interoperability
  across any stack, Grafana Cloud brings AI to observability
  and observability to AI, giving teams (and their agents)
  unified visibility so they can see, understand, and act on
  all their disparate data, wherever it lives, and move at the
  speed of their ambitions. Customers, including Anthropic,
  Bloomberg, NVIDIA, Microsoft, and Salesforce, rely on
  Grafana Labs. We are a 100% remote company with team members
  across 40+ countries, backed by leading investors including
  Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue,
  J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at
  grafana.com and follow us on LinkedIn and X.

  We’re scaling fast and staying true to what makes us
  different: an open-source legacy, a global collaborative
  culture, and a passion for meaningful work. Our team thrives
  in an innovation-driven environment where transparency,
  autonomy, and trust fuel everything we do.

  You may not meet every requirement, and that’s okay. If this
  role excites you, we’d love you to raise your hand for what
  could be a truly career-defining opportunity.

  This is a remote opportunity and we would be interested in
  applications from the UK, Ireland, Spain and Germany.

  About Grafana Cloud Observability

  Grafana Cloud is our fully managed observability platform
  that integrates metrics, logs, and traces with Grafana. It
  allows our customers to use the best open source
  observability software, including Prometheus, Mimir, Loki,
  and Tempo, without the overhead of installing, maintaining
  and scaling their own observability stack.

  Within the Observability department, we build products that
  help customers understand and troubleshoot their
  applications and infrastructure. We work closely with
  product management, design and other engineering squads to
  provide seamless and highly curated experiences for our
  customers.

  The squad: Database Observability

  We build and evolve Grafana Cloud Database Observability. We
  want to help users understand the health and performance of
  their databases, identify slow queries and troubleshoot
  issues through clear, actionable insights.

  As a frontend engineer on the squad, you’ll build
  experiences that make complex database telemetry easy to
  explore and understand. You’ll work closely with backend
  engineers, product management and design to take ideas from
  early exploration through to production and improve them
  based on customer feedback.

  Our frontend stack is primarily TypeScript and React,
  interacting with backends written in Go. Your primary focus
  will be frontend engineering, with opportunities to work
  across the stack, contributing to APIs and backend
  functionality to deliver complete customer experiences.
  Frontend engineers at Grafana also have opportunities to
  contribute to open source communities.

  The opportunity:

  - Own technical projects from problem framing through rollout,
    including getting user feedback and measuring whether what
    you shipped actually worked.
  - Collaborate with Product Management, Product Design and
    backend engineers to build intuitive user experiences
    using clean, reusable components, contributing to
    supporting APIs and backend functionality where needed.
  - Mentor and collaborate with other engineers. Raise the
    engineering bar through code review, design feedback,
    pairing on hard problems, and writing that leaves the team
    better than you found it.
  - Participate in on-call for the software you help build,
    contributing to incident response and learning from
    incidents.
  - Provide technical support in customer escalations and help
    us identify areas of high friction to address.
  - Collaborate with other squads on shared dependencies,
    contribute to design proposals, and share the team’s work
    through demos and technical discussions.

  We invest heavily in developer productivity. You can use
  modern AI coding assistants as part of your daily workflow
  (your choice of tools, within security guidelines), backed
  by a company-funded usage budget so you can iterate quickly
  without unnecessary friction. We encourage pragmatic AI-
  assisted development: faster prototyping, test generation,
  refactors, documentation, and incident follow-ups, always
  with strong code review and quality standards. You'll also
  have access to the latest frontier models from OpenAI,
  Anthropic, and Google.

  What makes you a great fit:

  - We highly value those who are intellectually curious, who
    default to transparency, possess a high bias towards
    action, and who are also kind and enjoy working as a team.
  - Strong frontend engineering experience, with experience
    across the stack. You have experience building and
    maintaining production web applications with React and
    TypeScript, and are comfortable contributing to backend
    services and APIs. You value maintainability, readability,
    automated testing and secure development practices.
  - Technical ownership. You have solid experience delivering
    complex projects, mentoring other engineers and helping
    teammates work more effectively. You communicate clearly
    in a fully remote, asynchronous environment.
  - You take responsibility for operating the software you have
    built. You have experience being on-call, supporting
    software in production, ensuring reliability and
    responding to incidents as needed.
  - You enjoy working on complex solutions, building production
    software systems. You’re a self-starter, capable of
    tackling complex engineering problems with minimal
    supervision.
  - User focus and pragmatism. You break complex problems into
    short feedback loops: analyze, design, deliver an MVP,
    learn, iterate.
  - AI experience with a practical mindset. You use AI coding
    tools thoughtfully to improve productivity and quality,
    validate their output, and share useful practices with
    teammates.
  - You care about our community of users and contributors and
    are keen to be an active Grafana Community Contributor.

  Bonus Points for

  - Open-source contribution or maintainership, and comfort
    engaging a community in the open.
  - An active interest in observability (metrics, logs and
    traces) and experience with tools like Grafana, Prometheus
    or other observability platforms.
  - Experience with databases, SQL or database performance
    monitoring.
  - Experience building backend services in Go.
  - Experience as an on-call user of Grafana, Prometheus, Loki
    or Tempo in a previous role (or on a homelab).
  - Experience in a fully remote, globally distributed team.

  Compensation & Rewards:

  In the UK, the base compensation range for this role is
  £94,000 - £118,000. Actual compensation may vary based on
  level, experience, and skillset as assessed throughout the
  interview process. All of our roles include Restricted Stock
  Units (RSUs), giving every team member ownership in Grafana
  Labs' success. We believe in shared outcomes—RSUs help us
  stay aligned and invested as we scale globally.

  *Compensation ranges are country specific. If you are
  applying for this role from a different location than listed
  above, your recruiter will discuss your specific market’s
  defined pay range & benefits at the beginning of the
  process.

  Why You’ll Thrive at Grafana Labs:

  - 100% Remote, Global Culture - As a remote-only company, we
    bring together talent from around the world, united by a
    culture of collaboration and shared purpose.
  - Scaling Organization – Tackle meaningful work in a high-
    growth, ever-evolving environment.
  - Transparent Communication – Expect open decision-making and
    regular company-wide updates.
  - Innovation-Driven – Autonomy and support to ship great work
    and try new things.
  - Open Source Roots – Built on community-driven values that
    shape how we work.
  - Empowered Teams – High trust, low ego culture that values
    outcomes over optics.
  - Career Growth Pathways – Defined opportunities to grow and
    develop your career.
  - Approachable Leadership – Transparent execs who are
    involved, visible, and human.
  - Passionate People – Join a team of smart, supportive folks
    who care deeply about what they do.
  - In-Person onboarding - We want you to thrive from day 1 with
    your fellow new ‘Grafanistas’ to learn all about what we
    do and how we do it.
  - Balance is Key - We operate a global annual leave policy of
    30 days per annum. 3 days of your annual leave entitlement
    are reserved for Grafana Shutdown Days to allow the team
    to really disconnect. *We will comply with local
    legislation where applicable.

  Equal Opportunity Employer: Grafana Labs is an equal
  opportunities employer. We welcome applications from
  everyone regardless of race, colour, nationality, origin,
  caste, sex, gender reassignment identity or expression,
  sexual orientation, age, religion or belief, disability,
  veteran status, genetic information, pregnancy, maternity,
  marital, family or carer status, or any other characteristic
  which is protected by local law. We believe that equality
  and diversity build a strong organisation, and we work hard
  to ensure that is the foundation of our organisation as we
  grow.

  Grafana Labs may utilize AI tools in its recruitment process
  to assist in matching information provided in CVs to job
  postings. The recruitment team will continue to review
  inbound CVs manually to identify alignment with current
  openings.

