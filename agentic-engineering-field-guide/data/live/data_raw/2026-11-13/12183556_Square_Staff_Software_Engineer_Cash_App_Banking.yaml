description: |
  It all started with an idea at Block in 2013. Initially
  built to take the pain out of peer-to-peer payments, Cash
  App has gone from a simple product with a single purpose to
  a dynamic ecosystem, developing unique financial products,
  including Afterpay/Clearpay, to provide a better way to
  send, spend, invest, borrow and save to our 50+ million
  monthly active customers. We want to redefine the world's
  relationship with money to make it more relatable, instantly
  available, and universally accessible. Today, Cash App has
  thousands of employees working globally across office and
  remote locations, with a culture geared toward innovation,
  collaboration and impact. We've been a distributed team
  since day one, and many of our roles can be done remotely
  from the countries where Cash App operates. No matter the
  location, we tailor our experience to ensure our employees
  are creative, productive, and happy. The Role At Cash App,
  we strive to build the best consumer financial products in
  the world. The Cash App Banking team aspires to make Cash
  App the primary place for our customers to store, manage,
  and move money across all their banking needs. We achieve
  this by providing various offerings including a range of
  deposit and transfer options, savings and automation tools,
  and a suite of benefits for Banking customers, all while
  ensuring a fast and reliable experience. As a staff software
  engineer on the Cash App Banking server engineering team,
  you will help lead the overall technical strategy of the
  team, through close collaboration across teams and
  disciplines. In addition, you'll drive cross-cutting
  architectural decisions and infrastructure improvements to
  make our systems more robust and scalable. You will also
  foster the growth of aspiring engineers to expand their
  scope of influence beyond their immediate teams. The things
  that you build will create significant impact at scale and
  will fundamentally change the consumer banking landscape as
  we know it today. You Will

  - Partner closely with product managers, designers, engineers,
    and business leads to develop, communicate and execute
    technical strategies that benefit the Banking organization
  - Play a critical role in influencing leaders across the
    organization and company to drive consistent, sound and
    efficient technical decisions
  - Stay close to the details of systems that power our products
    by directly contributing to technical designs and staying
    hands on with code contributions
  - Hold your teammates and yourself to high engineering
    standards
  - Leverage your experience and knowledge to grow your
    teammates' technical breadth and depth through direct
    coaching and mentoring
  - Apply an AI-first mindset in your everyday work, raising the
    bar of AI application across the team by staying connected
    to efforts across the organization


  You Have

  - 12+ years of software development or equivalent experience
  - 3+ years of experience leading large scale features, which
    includes planning, managing and executing on the delivery
    projects in a timely manner while maintaining a high
    quality bar
  - Drive and experience in identifying, aligning and landing
    globally optimal solutions in a system with many moving
    parts
  - The ability to design and build creative solutions to
    complex problems
  - A strong track record in helping other engineers grow
  - Bachelor's Degree or Diploma in Computer Science, Computer
    Engineering, Software Engineering, or equivalent
    experience


  Technologies We Use and Teach

  - Java, Kotlin
  - AWS
  - HTTP, JSON, gRPC, Protocol Buffers
  - OkHttp, Jetty, JUnit, Guice
  - Hibernate, Aurora, MySQL, DynamoDB, Redis
  - Kafka, event-driven architecture, microservices
  - DataDog
  - Buildkite, Gradle


