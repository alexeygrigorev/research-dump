description: |
  NVIDIA has been transforming computer graphics, PC gaming,
  and accelerated computing for more than 25 years. It’s a
  unique legacy of innovation that’s fueled by great
  technology—and amazing people. Today, we’re tapping into the
  unlimited potential of AI to define the next era of
  computing. An era in which our GPU acts as the brains of
  computers, robots, and self-driving cars that can understand
  the world. Doing what’s never been done before takes vision,
  innovation, and the world’s best talent. As an NVIDIAN,
  you’ll be immersed in a diverse, supportive environment
  where everyone is inspired to do their best work. Come join
  the team and see how you can make a lasting impact on the
  world.

  We are hiring a Senior Systems Software Engineer to join our
  Applied Systems Engineering team and improve storage
  development in AI systems. This opportunity involves
  software development, practical experimentation, and systems
  integration to refine storage on next-generation NVIDIA
  platforms. You will lead technical analyses, transform
  workload insights into engineering fixes, and guide the
  formulation and implementation of storage policies. You will
  handle storage integration, testing, and rollout while
  coordinating with engineering groups on hardware and
  software projects. This role supports the efficiency and
  dependability encouraged at datacenter scale.

  What you'll be doing:

  - Engineer and integrate storage systems for large-scale HPC
    and AI clusters, including Lustre, NFS, and their
    interaction with compute nodes, networks, and storage
    hardware.
  - Examine performance and reliability issues throughout the
    I/O stack, supervising application behavior across
    filesystem clients, Linux kernel paths, network protocols,
    servers, and storage devices.
  - Develop software fixes and performance improvements, working
    with NVIDIA engineering teams, storage partners, and open-
    source maintainers to bring changes through review,
    testing, and deployment.
  - Characterize real application I/O, including training-data
    access, checkpoint and restart, metadata-intensive
    operations, and concurrent workloads. Translate findings
    into improvements to software, and system configuration
    and design.
  - Build reproducible benchmarks, diagnostic tools, and
    regression tests that measure efficiency, latency,
    metadata performance, scalability, and behavior under
    contention.
  - Lead storage qualification and commissioning, validating
    functionality, data integrity, failure recovery, and
    sustained performance at cluster scale.
  - Define and implement storage placement, caching, and data
    lifecycle policies informed by workload requirements,
    capacity, and operational evidence.

  What we need to see:

  - Deep engineering experience with Lustre, NFS, or comparable
    shared storage systems, including implementation-level
    debugging in at least one stack and experience integrating
    storage into Linux clusters.
  - Strong C programming and Linux debugging skills, with
    experience reading, modifying, and diagnosing kernel or
    user-space storage software.
  - Understanding of filesystem and distributed-system behavior,
    including metadata operations, caching and consistency,
    locking, concurrency, client/server communication, and
    recovery.
  - Experience analyzing application access patterns and tuning
    filesystem or storage-stack behavior to deliver
    performance improvements.
  - Ability to take a complex performance or correctness problem
    from initial symptoms through reproduction, root-cause
    analysis, implementation, and validation.
  - Proficiency in Python and shell scripting to build
    maintainable diagnostic, test automation, and analysis
    tools.
  - Ability to independently lead technical efforts, influence
    design decisions across teams, and communicate findings
    and tradeoffs clearly.
  - BS or MS in Computer Science, Engineering, Mathematics,
    Physics, or equivalent practical experience, with 12+
    years of relevant experience.

  Ways to stand out from the crowd:

  - Contributions to Lustre, Linux filesystems, NFS
    implementations, or other storage projects, including
    features, performance improvements, bug fixes, or
    technical reviews.
  - Expertise in Lustre metadata and client I/O, Linux VFS and
    page cache, NFS protocol and client/server internals, or
    distributed locking and recovery.
  - Experience with hierarchical storage management, policy
    engines, or migration between filesystems and object
    storage, including data recall and recovery from
    interrupted transfers.
  - Experience with RDMA storage transports, GPUDirect Storage,
    or optimizing data loading and checkpointing for GPU
    workloads.
  - Experience with storage security and multi-tenancy,
    including authentication, identity mapping, permissions,
    and encryption.

  Your base salary will be determined based on your location,
  experience, and other objective job-related factors. The
  expected base salary ranges for this position are: Poland:
  375,000 PLN – 650,000 PLN for Level 5; and 483,750 PLN –
  838,500 PLN for Level 6. France: 114,000 EUR – 197,600 EUR
  for Level 5; and 150,000 EUR – 260,000 EUR for Level 6.
  Germany: 141,900 EUR – 245,960 EUR for Level 5; and 165,825
  EUR – 287,430 EUR for Level 6.
