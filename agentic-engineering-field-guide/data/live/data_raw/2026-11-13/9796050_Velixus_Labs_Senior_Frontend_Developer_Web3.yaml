description: |
  About Velixus Labs

  Velixus Labs is building the next generation of AI,
  blockchain, and Web3 infrastructure. We partner with
  startups, enterprises, and emerging technology companies to
  develop products that leverage decentralized technologies,
  intelligent automation, and modern digital experiences.

  We're a team of engineers, designers, and builders who care
  deeply about creating products that are both technically
  ambitious and genuinely useful.

  The Role

  We're looking for a Senior Frontend Developer to help build
  the user-facing experiences behind our blockchain and Web3
  products.

  You'll work closely with product managers, designers,
  blockchain developers, and backend engineers to create
  applications that are fast, intuitive, and reliable. You'll
  have significant ownership over technical decisions and will
  help establish the standards that shape how we build
  frontend applications across the company.

  This role is ideal for someone who enjoys turning complex
  blockchain functionality into simple and elegant user
  experiences.

  What You'll Do

  - Build and maintain modern web applications used by clients
    and end users.
  - Collaborate with product, design, and engineering teams to
    deliver high-quality user experiences.
  - Develop reusable components, design systems, and frontend
    architecture.
  - Integrate blockchain functionality, wallets, and Web3
    services into customer-facing applications.
  - Improve application performance, reliability, and
    accessibility.
  - Participate in technical planning, architecture discussions,
    and code reviews.
  - Mentor other developers and contribute to engineering best
    practices.
  - Help shape the frontend development culture at Velixus Labs.

  What We're Looking For

  - Strong experience building and shipping modern web
    applications.
  - Professional experience with React, TypeScript, and modern
    frontend development practices.
  - Experience working on blockchain, cryptocurrency, or Web3
    products.
  - Understanding of how frontend applications interact with
    smart contracts and blockchain infrastructure.
  - Ability to make thoughtful technical decisions and take
    ownership of projects.
  - Strong attention to user experience and product quality.
  - Excellent communication and collaboration skills.

  Nice to Have

  - Experience with Next.js and modern frontend frameworks.
  - Familiarity with Ethers.js, Wagmi, Viem, or similar Web3
    libraries.
  - Experience building DeFi, wallet, NFT, tokenization, or
    infrastructure products.
  - Knowledge of frontend security best practices.
  - Contributions to open-source projects or involvement in the
    blockchain community.

  Why Join Velixus Labs

  - Work on cutting-edge blockchain and AI products.
  - Join a highly collaborative remote-first team.
  - Have direct influence on product and technical decisions.
  - Competitive compensation and performance-based incentives.
  - Learning budget for conferences, courses, and professional
    development.
  - Opportunity to work with clients and products across
    multiple blockchain ecosystems.

  Compensation

  Annual base salary: $140,000 – $200,000 USD

  Compensation is based on experience, location, and
  demonstrated impact.

  Additional compensation may include performance bonuses,
  equity participation, and other benefits depending on role
  and location.

  How to Apply

  Send your resume, GitHub profile (if available), portfolio,
  and examples of blockchain or Web3 products you've worked on
  to:

  careers@velixuslabs.org

  We're most interested in what you've built, the decisions
  you've made, and the products you've helped bring to life.
