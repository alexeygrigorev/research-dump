title: Engineering Manager (m/f/x) Customer Facing Teams
company: rebuy reCommerce GmbH
location: Berlin, DEU
work_type: FULL_TIME
company_size: 550 Employees
description: |
  We are looking for an experienced Engineering Manager to
  join our Engineering department and lead two customer-facing
  teams (7–8 engineers in total), and to support us shaping
  how the whole department works.

  rebuy's engineering teams are stable and well established,
  and that gives us a strong base to build on. Now we're
  looking for ways to unblock delivery and get great ideas to
  our customers faster, with the support of AI.

  You are a catalyst: you are there where you are needed most.
  Sometimes that means being deep in the daily work,
  supporting the team and even coding along. Sometimes it
  means making a decision because the team is stuck. And
  sometimes it means zooming out to improve flows across the
  whole department. You set direction and pace, and make sure
  that what we ship reaches customers and moves our quarterly
  OKRs. You also make room for the bigger picture: business
  topics, our leveling matrix, and driving AI adoption across
  engineering together with fellow Engineering Managers.

  Ready to become part of the most important mission on this
  planet? We are rebuy, pioneers in the sustainable reuse of
  electronics and media, and we are looking for you! Our
  mission: to make circular living accessible to all, one
  transaction at a time. By giving products a second chance,
  we reduce resource consumption and avoid unnecessary
  e-waste.

  Our team of 500 comes from all corners of the world; we
  drive things forward collaboratively, take personal
  responsibility, value positive critical thinking, and
  persistently serve our customers and planet.

  Key Responsibilities:

  - Lead two customer-facing teams as a catalyst: zoom in to
    support the daily work and unblock the team when it’s
    stuck, zoom out to improve flows across the department
  - Set direction: make sure the teams understand the “why”
    behind their topics, own them and are motivated to drive
    them. Make the call when full consensus isn’t possible,
    and focus everyone on what is truly urgent
  - Own delivery: keep the teams focused on their promise dates,
    get them to the finish line and course-correct fast. Use
    modern metrics to track progress and speed
  - Stay close to the tech: pair with engineers, review work,
    join technical discussions, and challenge estimates and
    trade-offs
  - Drive AI adoption across engineering with fellow Engineering
    Managers (tools, workflows, review standards and measuring
    real impact), starting in your own teams
  - Drive hiring and take care of your people and their growth
    through regular 1:1s, honest feedback and by evolving our
    engineering leveling matrix
  - Connect product, design and engineering, keep stakeholders
    informed early, and work with engineering leadership on
    cross-team strategy

  Requirements:

  - Substantial experience as an Engineering Manager, with a
    track record of delivering business outcomes. You’re
    accountable for results, not only team happiness, and
    comfortable owning and reporting engineering metrics
  - A software engineering background with a strong foothold in
    at least one of our stacks: Angular/TypeScript,
    PHP/Symfony or Kotlin/Spring. You don’t need all three,
    but you can challenge solutions and form an objective view
    of your teams’ work, even if you don’t code day to day
  - Experience driving or shaping AI adoption in engineering
    teams, or a strong focus on it
  - High self-organization and drive: you spot what’s urgent
    among many important topics and act on it without waiting
    to be told
  - The ability to flex between hands-on support, decisive
    action and department-level thinking
  - Fast, documented decision-making and direct, transparent
    communication
  - Fluent English

  Nice to have

  - German (a big plus)
  - Experience with customer-facing products or e-commerce
  - Experience building or scaling teams, or evolving career
    frameworks

  Location:

  - Berlin
  - Hybrid model (Must be willing to work from the office at
    least 1 day per week)

  Purpose, a great company culture and incredible benefits -
  what to expect at rebuy:

  - Work with a friendly team that is passionate about
    circularity and wants to make the world a little more
    sustainable, one transaction at a time.
  - Feel comfortable in an environment where independence and
    new ideas are welcome.
  - Benefit from flat hierarchies and the greatest possible
    transparency so that things don't take longer than they
    have to and you always feel well informed.
  - Enjoy our centrally located office in Berlin (Erkelenzdamm
    11 - 13, 10999 Berlin).
  - Benefit from our family-friendly, flexible environment and
    paid child sick leave.
  - Bring your dog to the office: we love animals and want to
    cuddle yours, too!
  - Use employee discounts on rebuy.de, sustainable products at
    Futurebens, offers for sustainable micro-mobility and
    massages directly in our office.
  - Have fun at our legendary team and company events.
  - Use our mental health offers as part of a cooperation with
    Nilo.
  - Take care of your work-life balance with 30 vacation days.
  - Stay active with our own gym located directly in the
    building, making it easy to fit workouts into your daily
    routine.
  - Benefit from an on-site daycare in the building, supporting
    a truly family friendly and flexible working environment.

  *At rebuy all people are welcome and supported! We would
  like to talk, regardless of age, disability, national and
  social origin, skin color, religion, gender identity and
  sexual orientation. Just be who you are.
