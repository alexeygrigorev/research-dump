description: |
  This is Adyen

  Adyen provides payments, data, and financial products in a
  single solution for customers like Meta, Uber, H&M, and
  Microsoft - making us the financial technology platform of
  choice. At Adyen, everything we do is engineered for
  ambition.

  For our teams, we create an environment with opportunities
  for our people to succeed, backed by the culture and support
  to ensure they are enabled to truly own their careers. We
  are motivated individuals who tackle unique technical
  challenges at scale and solve them as a team. Together, we
  deliver innovative and ethical solutions that help
  businesses achieve their ambitions faster.

  Adyen is looking for full-time Kotlin Engineers to help us
  develop our in-person payments solution. We have a large and
  varied fleet of payment terminals and payment SDKs in the
  field, which we are continuously improving by adding new
  features and payment methods. Kotlin development plays a
  vital role in this effort, as your code will be deployed
  across our various solutions using Kotlin Multiplatform.

  What you’ll do

  As a Kotlin Engineer you will work on solutions for our
  payment terminals and payment SDKs featuring many
  capabilities, such as:

  - Accepting payments using credit cards and debit cards, Apple
    Pay or Google Pay on mobile phones or accepting payments
    through QR codes
  - Building and maintaining payment features for global
    merchants
  - Integration with a variety of cash registers using state of
    the art standards

  You will be working on developing our main business logic in
  Kotlin, which will be deployed on both Android and Linux
  based payment terminals, and on our backend. You will also
  be contributing to C++ libraries that are central to our
  payment business logic.

  Your code is tested using a variety of testing methods.
  These methods range from unit testing to complete product
  testing via automated programmable robots in order to offer
  a stable and feature rich solution to all of our merchants.

  Who you are:

  - A motivated, enthusiastic team player: collaborate with
    other engineers, product designers, and business
    stakeholders
  - Able to provide reliable and clearly understandable code
  - Willing to learn and improve
  - Flexible, open to new ideas
  - Have a keen eye for detail
  - Able to debug and solve problems within the Android
    application and collaborate effectively on cross-
    functional issues
  - Proactive in bringing great ideas to improve our solution
  - Enthusiastic to investigate new technical possibilities, yet
    able to work within existing frameworks
  - Self-disciplined and enjoy working at a fast pace while
    managing and prioritizing goals

  Must have qualifications:

  - +5 years of experience writing code in Kotlin.
  - Proficiency in building software for the Android platform.
  - Experience in development of enterprise level SDKs.
  - Expert level knowledge of Kotlin, Android SDK, Jetpack
    Compose, Coroutines, Gradle, Dependency Injection
  - Experience writing and maintaining a comprehensive suite of
    automated unit and integration tests
  - A high level of personal accountability and a blend of
    strong technical skills, creative problem-solving, and a
    collaborative spirit
  - Ability and desire to mentor and grow other engineers
    through code reviews, design reviews, and over-the-
    shoulder debugging
  - Excellent verbal and written communication skills in
    English.

  Good to know:

  - Experience in another non-JVM language, such as C or C++
  - Experience with building libraries used by other engineers
  - Knowledge about security best practices and standards
  - Experience working with Bluetooth-connected devices
  - Experience working in payment industry (This is a plus, not
    a must)
  - The annual base salary range for this role is $154,000.00 -
    $200,000.00; to learn more about our compensation
    philosophy, please click here.

  This role is based out of our Chicago office. We are an
  office-first company and value in-person collaboration; we
  do not offer remote-only roles. You must be work authorized
  in the United States without the need for new visa
  sponsorship. The company can support visa transfers but will
  not sponsor individuals for H-1B CAP applications

  Our Diversity, Equity and Inclusion commitments

  Our unique approach is a product of our diverse
  perspectives. This diversity of backgrounds and cultures is
  essential in helping us maintain our momentum. Our business
  and technical challenges are unique, and we need as many
  different voices as possible to join us in solving them -
  voices like yours. No matter who you are or where you’re
  from, we welcome you to be your true self at Adyen.

  Studies show that women and members of underrepresented
  communities apply for jobs only if they meet 100% of the
  qualifications. Does this sound like you? If so, Adyen
  encourages you to reconsider and apply. We look forward to
  your application!

  What’s next?

  Ensuring a smooth and enjoyable candidate experience is
  critical for us. We aim to get back to you regarding your
  application within 5 business days. Our interview process
  tends to take about 4 weeks to complete, but may fluctuate
  depending on the role. Learn more about our hiring process
  here. Don’t be afraid to let us know if you need more
  flexibility.

  This role is based out of our Chicago office. We are an
  office-first company and value in-person collaboration; we
  do not offer remote-only roles.
