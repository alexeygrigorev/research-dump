description: |
  Mattermost is the leading collaborative workflow platform
  for defense, intelligence, security, and critical
  infrastructure. Trusted by the U.S. Department of War and
  Fortune 500s, our platform runs on-premises and in private
  clouds, delivering secure messaging, file sharing, workflow
  automation, audio/screenshare, and project management—all
  with full data and operational control. Mattermost powers
  high-stakes workflows across mission planning, real-time,
  real-world operations, DevSecOps, incident response, and
  cyber defense—enabling secure collaboration from tactical
  edge and DDIL environments to enterprise HQ. Teams operate
  across web, desktop, and mobile, with embedded
  interoperability for Microsoft Teams, Outlook, and Microsoft
  365.

  To learn more, visit www.mattermost.com

  We are seeking a Staff Full Stack Engineer to set the
  technical direction for and scale Mattermost’s core web
  platform for teams operating in defense and critical
  infrastructure sectors. You’ll drive architecture and
  technical strategy across our Go backend and
  React/TypeScript web frontend — partnering across teams to
  ship features that hold up under strict security,
  compliance, and reliability requirements.

  Our engineering culture is AI-forward. We expect engineers
  to work fluently with AI coding agents such as Claude Code
  day-to-day — for scaffolding, refactors, code review, and
  test generation — and treat that as core craft rather than a
  shortcut. We would rather hire smart people who get stuff
  done than chase an exact tech-stack match. If you have a
  track record of shipping and owning complex software end-to-
  end, we want to hear from you.

  What You Will Do

  - Define and drive the technical architecture and roadmap for
    Mattermost’s core web platform across multiple engineering
    teams, spanning Go, React, TypeScript, PostgreSQL, and
    Redis
  - Set org-wide standards and best practices for AI-agentic
    engineering workflows — going beyond personal fluency with
    tools like Claude Code and Cursor to shape how the broader
    engineering org adopts them, while retaining
    accountability for correctness, security, and design
    decisions
  - Lead the internal tooling and testing infrastructure
    strategy that speeds up delivery for the broader
    engineering org, not just your immediate team
  - Own the testing strategy and quality bar across frontend and
    backend systems, and hold other engineers accountable to
    it through design reviews and mentorship
  - Drive architectural decisions for REST and WebSocket API
    design, grounded in deep networking fundamentals
  - Partner directly with security, compliance, and product
    leadership on strategic technical bets tied to our
    government and enterprise customer requirements
  - Mentor senior engineers and act as a technical multiplier
    across the org
  - Contribute to and help shape technical direction for
    Mattermost’s open-source codebase

  What We Are Looking For

  Required:

  - Senior full-stack development experience in Go and React (or
    a comparable stack), with a track record of owning complex
    systems end-to-end
  - Proven experience designing and owning distributed systems
    or high-availability service architecture at scale
  - Experience designing and consuming REST and WebSocket APIs
    with solid networking fundamentals
  - Relational database experience including PostgreSQL, schema
    design, and query optimization
  - Hands-on daily fluency directing AI coding agents such as
    Claude Code, Cursor, or Copilot for scaffolding,
    refactors, code review, and test generation — with the
    judgment to know when to trust the output and when to take
    the wheel yourself
  - Demonstrated ability to influence technical direction across
    multiple teams without relying on formal authority
  - Experience mentoring senior engineers and raising the
    technical bar for a broader team
  - Comfortable operating in regulated or high-compliance
    environments (e.g., enterprise security, government, or
    critical infrastructure requirements)

  Nice to Have:

  - Prior experience operating as a staff, principal, or
    technical lead engineer at another company
  - Experience maintaining (not just contributing to) an open-
    source project
  - Program-level familiarity with compliance frameworks
    relevant to defense or government customers (e.g.,
    FedRAMP, ITAR)
  - Experience helping scale engineering practices or standards
    across a growing organization
  - Background in defense, intelligence, or critical
    infrastructure products
  - Experience building tools, skills, or workflows on top of AI
    coding agents including MCP servers, agent skills, or CI-
    integrated agents

  How Success Is Measured

  First 90 Days: Build cross-team credibility by shipping a
  meaningful full-stack feature on the core platform, while
  assessing the technical landscape and identifying the
  highest-leverage architectural or process improvements to
  pursue.

  Why Mattermost

  - Mission-driven work: Your contributions directly support the
    organizations and missions that depend on secure, reliable
    collaboration including the U.S. Department of War and
    critical infrastructure operators worldwide
  - Remote-first culture: Work from anywhere with a globally
    distributed, high-trust team built for autonomy and
    ownership
  - AI-forward environment: We actively adopt and build AI-
    enabled workflows. Agentic development is core craft here,
    not a novelty
  - End-to-end ownership: Ship and own complex software across
    the full stack with real accountability for what you build
  - Open source at the core: Be part of a vibrant developer
    community shaping the future of secure collaboration

  Compensation

  Mattermost takes a market-based approach to pay. Actual
  compensation may vary based on location, skills, experience,
  qualifications, and market conditions.

  Target Salary Range: $195,001 – $238,965

  Canada Eligibility & Compliance

  Candidates must be legally authorized to work in Canada
  without current or future sponsorship.

  This role may require obtaining and maintaining a government
  security clearance or equivalent designation (such as
  Reliability Status or Secret clearance under Canada's
  Controlled Goods Program), depending on customer engagement.
  Candidates must meet eligibility requirements to be
  considered.

  Given Mattermost's work with U.S. defense and government
  customers, some positions may also require compliance with
  U.S. export control laws, including EAR and ITAR, which can
  apply to non-U.S. based employees working on covered
  technical data. For more information, visit the Bureau of
  Industry and Security and the Directorate of Defense Trade
  Controls.



  Mattermost is an EEO Employer, we are a remote-first, open-
  source company.



  We are continually working to expand our hiring in more
  countries and regions, ensuring compliance with local laws
  and regulations, which takes time.



  Mattermost values your unique perspective—we welcome all
  applicants. We encourage individuals from all backgrounds to
  apply and are committed to assessing candidates based on
  their skills and qualifications. We do not tolerate
  discrimination against staff or applicants based on race,
  religion, national origin, age, disability, pregnancy
  status, veteran status, or other personal characteristics.



  If you require accommodations during the interview process,
  please let us know—we’re happy to assist.
