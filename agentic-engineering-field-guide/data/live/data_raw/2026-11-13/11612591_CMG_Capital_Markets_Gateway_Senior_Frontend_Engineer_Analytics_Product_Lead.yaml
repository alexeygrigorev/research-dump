description: |
  The Company



  Capital Markets Gateway LLC (CMG) is a capital markets-
  focused fintech transforming global equity capital markets
  (ECM) through data, technology, and connectivity. As the
  preferred source for ECM analytics and the first network
  connecting the buy-side and sell-side for ECM workflows, we
  are committed to reshaping how capital markets operate.
  Founded in 2017 by a team of ECM practitioners, CMG has
  completed three successful fundraising rounds and is backed
  by a group of the world’s most prestigious financial
  institutions. The CMG platform is currently relied upon by
  25 global investment banks and 135 asset managers
  representing $40 trillion in AUM. For more information,
  please visit www.cmgx.io. 



  The Role

  We’re looking for a Senior Frontend Engineer to join the
  Mission Control team (DataLab product) as the frontend
  technical lead for the western hemisphere-based team. As a
  frontend engineer, you will play a critical role in crafting
  user-centric, performant, and scalable interfaces that power
  our enterprise financial solutions using industry standard
  technologies like React, TypeScript, and GraphQL.

  You will collaborate closely with product managers, back-end
  engineers, and engineering leaders to translate complex
  business requirements into clean, maintainable code. You
  will contribute to frontend architecture decisions,
  establish best practices in UI development, and champion
  design consistency, accessibility, and overall product
  quality.

  You will also be empowered to use modern agentic coding
  tools thoughtfully to accelerate delivery, improve code
  quality, explore solutions, and raise the team’s engineering
  leverage while maintaining strong judgment, ownership, and
  review standards.

  Our Engineering Team


  The CMG engineering team is made up of domain experts who
  collaborate across disciplines and share knowledge openly.
  We value engineers who are passionate about modern
  technologies and best practices who can raise the bar for
  React, TypeScript, UI architecture, testing, accessibility,
  and developer experience. Our engineers are encouraged to
  challenge the status quo and are constantly seeking
  improvement and efficiency in our codebase and platform. CMG
  engineers are empowered to explore solutions and bring
  recommendations to the table. We are in a period of making
  impactful engineering decisions, and this role will help
  guide frontend technical direction through research,
  prototyping, code review, and production-quality
  implementation.

