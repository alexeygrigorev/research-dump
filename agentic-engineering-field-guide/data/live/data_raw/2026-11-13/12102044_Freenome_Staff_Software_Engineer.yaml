description: |
  About this opportunity:

  At Freenome, we are seeking a Staff Software Engineer to
  grow our Platform team and lead the development of our Real
  World Evidence engine. Join a stellar group of engineers on
  a mission to save lives with early cancer detection, at an
  exciting phase as we develop and commercialize new blood
  test products.   The ideal candidate is an experienced lead
  software engineer with a strong background in developing
  scalable and reliable distributed software systems,  and
  integrating internal products with third-party solutions. In
  this role you will partner with a cross-functional team
  including product managers, clinical data analysts,
  informaticists, researchers, and external vendors. Your work
  will help these teams turn fragmented data into reliable,
  traceable datasets that support evidence generation and
  inform future product development.

  This role reports to our Director of Engineering, Platform.
  This is a remote position within the US, with occasional
  travel to our headquarters in Brisbane, CA, 2-3 times a
  year.

  What you’ll do:

  - Lead the design, development and operation of maintainable,
    scalable, and reliable backend software.
  - Build system and data integrations connecting data from
    commercial products and external providers with our
    analytical platforms, to enable a feedback loop that
    accelerates research and product development.
  - Work closely with TPMs and SMEs to understand business needs
    and translate product requirements into technical strategy
    and incremental execution.
  - Partner with the Real World Data team to evolve their tech
    stack, identify workflow bottlenecks, and build reusable
    tools for data curation and analysis.
  - Effectively use AI tools to scale engineering and RWD
    workflows, automating manual operations, reducing data
    curation efforts, and improving data quality.
  - Evaluate technologies, frameworks, and data providers
    through focused proofs of concept.
  - Lead code and design reviews, champion engineering best
    practices, and promote a culture of quality and
    collaboration.
  - Contribute to hiring and mentoring new team members,
    fostering their growth, and enhancing the team's technical
    knowledge and productivity.

  Must haves:

  - Bachelor of Science in Computer Science, Engineering, or
    related field or equivalent work experience.
  - 10+ years as a software engineer successfully shipping
    software in production preferably in backend or platform
    teams, and with 2+ years as lead developer.
  - Proficiency in Python and SQL.
  - Ability to build and operate distributed systems using
    Infrastructure as Code on public cloud platforms,
    preferably Azure or Google Cloud.
  - Expertise developing and running containerized software,
    preferably using Docker and Kubernetes.
  - A track record of building and operating data pipelines and
    integrations, with experience in areas including
    ingestion, database replication, analytical data modeling,
    or     data quality validation.
  - Experience building systems that process and store sensitive
    data, such as PHI, implementing access controls, audit
    logging, and secure data handling.
  - Software architecture leadership: you ship clean code, write
    clear design docs and ADRs, guide constructive reviews and
    collaborative technical decisions.
  - Excellent written and verbal communication skills, with a
    mindful and transparent approach to collaboration.
  - Ability to thrive in an environment where cross-functional
    collaboration, communication, and compromise are part of
    your day-to-day work.

  Nice to haves:

  - Domain-specific experience or academic background in life
    sciences, real world data, or related fields.
  - Working in an FDA-regulated environment, with a strong
    understanding of compliance requirements and best
    practices.
  - Columnar processing and storage using Apache Parquet.
  - Open lakehouse technologies and modern table formats such as
    Apache Iceberg.
  - Workflow orchestration frameworks like Flyte, Airflow, or
    similar.
  - Scientific Python frameworks and data-science tools.

  Benefits and additional information:

  The US target range of our base salary for new hires is
  $188,275 - $270,375. You will also be eligible to receive
  equity, cash bonuses, and a full range of medical,
  financial, and other benefits depending on the position
  offered.  Please note that individual total compensation for
  this position will be determined at the Company’s sole
  discretion and may vary based on several factors, including
  but not limited to, location, skill level, years and depth
  of relevant experience, and education. We invite you to
  check out our career page @ freenome.com/job-openings/ for
  additional company information.

