description: |
  Serves as the Java Full Stack Developer for pre-production
  efforts. Designs and develops new software products or major
  enhancements to existing software; addresses problems of
  systems integration, compatibility, and multiple platforms;
  is responsible for project completion; and performs
  feasibility analysis on potential future projects for
  management. This position requires deep, demonstrated Java
  expertise. Knowledge of COBOL and prior experience
  converting mainframe systems to modern systems is a
  significant differentiator, given that the task order
  translates the legacy code base to a modern software
  language (i.e., Java) within a micro services architecture.

  *This position is contingent upon contract award. Award
  anticipated December 2026/January 2027.*

  Responsibilities:

  - Translate and re-factor the legacy code base into a modern
    software language (i.e., Java) within the defined micro
    services architecture.
  - Update and perform static code analysis of the current
    legacy code base — including COBOL, ASM, JCLs, and
    Copybooks — to identify functional and non-functional code
    across the entire baseline.
  - Leverage AI/ML tools and processes to translate the legacy
    code base where appropriate, ensuring those tools and
    processes are used efficiently and effectively.
  - Optimize translated code leveraging microservices
    architecture or other architecture that modularizes
    functionality.
  - Design and develop new software products or major
    enhancements to existing software; address problems of
    systems integration, compatibility, and multiple
    platforms.
  - Implement translated code so it functions within the pre-
    production environment supporting development, test, and
    integration activities.
  - Support integration of the modern UI/UX front end, service
    layer, and the modernized relational database.
  - Build and support batch processing as well as real-time
    processing, and the ability to ingest both flat files and
    modern file standards.
  - Develop within the CI/CD pipeline, workflows, and processes;
    support ZT/ICAM integration and cloud native capabilities.
  - Perform feasibility analysis on potential future projects
    for management.
  - Other duties as assigned.

  Qualifications:

  Years of Experience: Five (5) years

  Education Level: None.  Desired BS in Computer Science,
  Information Systems, Engineering, IT, or closely related
  discipline, or equivalent additional relevant experience.

  Clearance Requirements: Secret. Must possess IT-II Non-
  Critical Sensitive security clearance or Tier 3 (T3) at time
  of proposal submission.

  Certification Requirements: Security+ or ability to obtain
  Security+ within first year of employment

  Any other work-related qualifications needed for the role:

  - Must be highly experienced in Java — this is the primary
    technical screen for the position.
  - Knowledge of COBOL is a significant plus.
  - Experience converting mainframe systems to modern systems is
    a significant plus.
  - Demonstrated experience as a full stack developer.
  - Demonstrated experience working with hierarchical database
    structures as well as relational database structures.
  - Experience with web-based software such as Java, HTML, .NET,
    AngularJS, JavaScript, SOAP, REST API, and Web Based API
    in the design, development, test, and deployment of
    software applications.
  - Significant experience implementing software solutions
    leveraging agile SW methodology.
  - Extensive experience working highly complex IT systems.
    Resume must demonstrate experience working legacy system
    upgrades, modernization, legacy system transition, data
    migration and/or system analysis and design. Priority
    given to personnel with demonstrated experience performing
    functional and technical solutions decomposition that
    enables solutions analysis and design and demonstrated
    experience implementing solutions with respect to modern
    database design and modern software languages within the
    federal Government, specifically within the DoD. AI/ML
    experience is preferred.
  - Travel to on-site meetings in Columbus, OH (Onsite once per
    month (average) up to 3 days.)

  About Us

  Diné Development Corporation (DDC) is a Navajo Nation–owned
  family of companies that provides government agencies and
  commercial organizations with high-quality IT, professional,
  environmental, and research and development services. DDC is
  dedicated to empowering the Navajo Nation and the
  communities we serve.

