title: Technical Account Manager
company: Coast (Buffd Digital, Inc.)
location: New York, USA
work_type: FULL_TIME
company_size: 35 Employees
description: |
  About the Role

  You’ll be working closely with our founders, early team, and
  customers. We are looking for someone who can master the
  Coast platform and help our customers be as successful as
  possible. This role is perfect for someone who has a
  technical background but prefers to be customer facing and
  has strong communication skills.

  About You

  - You work hard and are excited to roll up your sleeves, build
    something you’re proud of, and take ownership.
  - You are eager to become an expert on API-first companies and
    their sales motions (if you are not already).
  - You’re customer-obsessed and will do whatever it takes to
    ensure they are successful with our platform.

  Who This Role is Not a Fit For

  - You can’t work hard right now.
  - You need a structured environment to follow in order to do
    your job successfully.
  - You’re not excited about helping sales and solutions teams
    at API companies. You won’t be able to succeed in this
    role unless you love our customers and truly want to help
    them.

  What You Will Do

  - Become a Coast subject matter expert, addressing questions,
    concerns, and requests.
  - Lead kickoffs, onboarding, training, solutioning and
    renewals.
  - Navigate our customers’ organizations to identify champions
    and help sell our solution internally for expansion
    opportunity.
  - Have a deep understanding of customers' challenges and help
    solve them with Coast’s platform.
  - Ensure speedy responses in Slack and email.
  - Identify product gaps and opportunities based on customer
    needs for our roadmap.

  Requirements

  - Located in New York, New York and able to work in office 5
    days a week
  - Must have experience in account management (customer
    success)
  - Must have technical experience with APIs
  - Previous experience with Javascript and frontend development
    in strongly encouraged
  - Bachelor’s degree

  About the interview

  - Intro call
  - Take Home Assessment
  - Presentation of Assessment
  - Meet in person
