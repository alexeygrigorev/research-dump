description: |
  🦄 DataDome delivers real-time bot and agent trust
  management, enabling businesses to trust the intent behind
  their traffic—human, bot, or AI agent. Named a Leader in The
  Forrester Wave™ for Bot And Agent Trust Management Q2 2026,
  DataDome is trusted by enterprises like Etsy, PayPal, and
  Soundcloud. Acting as a traffic control plane, DataDome's
  multi-layered AI engine leverages thousands of models and 5
  trillion signals daily, analyzing the intent of every
  session so only trusted traffic reaches your business —
  powering growth across your sites, apps, APIs, and MCP
  servers. Backed by a 24/7 SOC and expert threat researchers,
  DataDome stops 20k+ attacks every second. With 35+ global
  PoPs, and 80+ ready-made integrations, DataDome is a
  recognized Leader on G2 across several categories—delivering
  traffic you can trust.

  Our Dashboard technical stack is mainly composed of
  ElasticSearch & MariaDB for the storage, Symfony 8 & Angular
  21. Our infrastructure is deployed on AWS, GCP and Azure,
  using Docker, Ansible and Terraform, and monitored with
  Grafana, Prometheus & DataDog. We're also heavily invested
  in integrating AI into our engineering workflows, and expect
  the same from anyone joining the team.

  The team:

  Our Dashboard team is currently composed of a mixture
  Fullstack, Backend & Frontend engineers, and is looking for
  a Frontend-strong engineer to help us design and develop our
  current product. Some of our best engineers started
  specialized and grew into full-stack over time — if that's a
  path you want, the team supports it, but there's no
  expectation to do so.

  This is a fully remote position.

  You will be more specifically in charge of:

  - Developing new features in our customer dashboard
  - Improving the frontend performance
  - Finding and fixing bug reports from our Q/A process
  - Investigating and fixing production bugs
  - Planning and evaluating the issues to work on
  - Using AI tools as part of your day-to-day engineering
    workflow
  - Owning topics you want to push forward — from idea to
    delivery, with real autonomy
  - Engaging directly with stakeholders to shape and defend your
    proposals

  You're the perfect candidate if you:

  - You have been building applications for 4+ years
  - You have strong, hands-on experience with Angular 17 or
    newer
  - You're comfortable using AI-assisted tools to speed up and
    improve your engineering work
  - You care about code quality, simplicity and performance

  Your growth path:

  - If you want to, you can grow into full-stack over time —
    picking up Symfony/PHP with support from the team, at your
    own pace
  - This is entirely optional and up to you: staying and
    deepening your frontend expertise is just as valid a path
    here
  - Whichever direction you choose becomes part of your ongoing
    career path conversations — and for the right person,
    motivated and driven, there's real room to grow further,
    whether that's deepening technical expertise or moving
    into a leadership role as the team scales

  Bonus points

  - You have experience with Symfony or another PHP framework
  - You've worked at high scale with systems like MariaDB, Redis
    or ElasticSearch
  - You wrote your own crawler once or twice before
  - You understand how internet works
  - You have a BS/MS/PhD in a scientific field or equivalent
    experience

  What’s in it for you?

  - Flex Life: While we offer remote, hybrid, & in-office
    options each position specifies the level of flexibility.
    Our Parisian office is located next to the Opera Garnier.
    You will also receive a 500€ stipend to help you set up
    your ideal workspace if you work hybrid or remotely.
    - If you are full remote, the SNCF dicount card is paid for
      you to come to our office to visit us & your team!
  - Generous Health Benefits: We have partnered with Kenko for
    your healthcare needs.
  - A 100€ annual allowance is provided for a leisure activity
    of your choice in Sports or Culture.
  - Annual allowance of €200 if you come to the office by bike
    to cover maintenance costs.
  - Professional Development: #Weaimhigh is part of our DNA,
    therefore we have invested in an internal Learning and
    Development platform and offer the opportunity to request
    additional training and support via your manager.
  - Events & Team building: #We care and we have fun! We
    organise ****Annual Company-Offsite, Events, Drinks,
    Winter Party, Lunch & Learns and much more are part of our
    Culture
  - Parent Care: Gift & care packages for parents.
  - PTO: Based on the country you are based from (e.g. 25 days
    in France).

  What are the next steps?

    - You x Talent Acquisition Manager: first interview and
      cultural fit
    - You x Engineering Manager: technical and cultural fit +
      Take-home technical challenge
    - You x Team: Presentation and review of your "technical
      proposal" with the team
    - You x Member of the leadership team - Discussion about
      DataDome vision and "raison d'être"!
    - Now you really met everyone! Welcome to DataDome:)

  DataDome is an equal opportunity employer, and is proud to
  be committed to diversity and inclusiveness. We will
  consider all qualified applicants without regard to race,
  color, nationality, gender, gender identity or expression,
  sexual orientation, religion, disability, or age.
