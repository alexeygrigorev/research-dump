  About SiFive

  As the pioneers who introduced RISC-V to the world, SiFive
  is transforming the future of compute by bringing the
  limitless potential of RISC-V to the highest performance and
  most data-intensive applications in the world. SiFive’s
  unrivaled compute platforms are continuing to enable leading
  technology companies around the world to innovate, optimize
  and deliver the most advanced solutions of tomorrow across
  every market segment of chip design, including artificial
  intelligence, machine learning, automotive, data center,
  mobile, and consumer. With SiFive, the future of RISC-V has
  no limits.

  At SiFive, we are always excited to connect with talented
  individuals, who are just as passionate about driving
  innovation and changing the world as we are.

  Our constant innovation and ongoing success is down to our
  amazing teams of incredibly talented people, who collaborate
  and support each other to come up with truly groundbreaking
  ideas and solutions.  Solutions that will have a huge impact
  on people's lives; making the world a better place, one
  processor at a time.

  Are you ready?

  To learn more about SiFive’s phenomenal success and to see
  why we have won the GSA’s prestigious Most Respected Private
  Company Award (for the fourth time!), check out our website
  and Glassdoor pages.

  Job Description:



  The Role:

  Join SiFive's tools team to develop and maintain the core
  tools and flows required for microprocessor design. Work on
  simulation and build tools to validate microprocessor
  designs, as well as the infrastructure around those flows.
  An ideal candidate will have systems-level programming
  experience; have built complex systems with multiple tools
  communicating through multiple means such as files, pipes,
  shared memory, databases, and REST calls; and have a strong
  desire to produce correct and tested tools.

  Requirements:

  - Systems programming experience.
  - Fluency in C++ and Python.
  - Fluency with standard Linux-based development environments
    and tools.
  - Experience with build tools and languages, including make
    and cmake.
  - Test and verification methodologies for software tools.

  Desired:

  - Above-average knowledge of processor microarchitecture.
  - Detailed profiling experience.
  - Experience with simulation and emulation tools, especially
    development of them  (e.g. QEMU, etc).

  If you want to do incredible work and be challenged by
  exciting, truly innovative projects that will test the
  boundaries of your skills and creativity, then SiFive is the
  place for you! Be proud of your work. Do things better. Join
  SiFive.

  In addition to base pay, this role may be eligible for
  variable/ incentive compensation and/ or equity.  In
  addition, this role is eligible for a comprehensive,
  competitive benefits package which may include healthcare
  and retirement plans, paid time off, and more!

  Additional Information:

  This position requires a successful background and reference
  checks and satisfactory proof of your right to work in

  United States of America

