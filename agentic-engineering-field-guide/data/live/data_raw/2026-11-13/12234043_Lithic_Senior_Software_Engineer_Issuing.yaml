  Benefits for Full-Time US Employees:

  - Unlimited PTO
  - 12-weeks fully paid parental leave
  - 4-Week Fully Paid Sabbatical (earned at your 5-year
    anniversary)
  - Work From Anywhere: work from anywhere in the world 4-weeks
    each year
  - 3% cashback on card purchases with your complimentary
    Privacy.com employee account
  - Health, vision, and dental insurance; HSA Contribution Match
  - 401(k) match
  - Voluntary Life Insurance and STD/LTD

  NYC-based employees work from our SoHo office three days a
  week. Tuesdays and Thursdays are our core days, and you'll
  choose a third day that works for your schedule and team
  needs.

  In-office employees receive:

  - Commuter benefit
  - Catered lunch every Tuesday and Thursday
