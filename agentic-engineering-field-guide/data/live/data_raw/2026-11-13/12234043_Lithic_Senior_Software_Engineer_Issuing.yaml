description: |
  Lithic is the modern card issuing and processing platform
  empowering ambitious financial companies to build the future
  of payments.

  Our infrastructure powers card programs for 100+ innovative
  clients, from fintechs reimagining credit and digital
  banking to platforms transforming disbursements and spend
  management. Companies like Mercury, Flex, and Novo rely on
  Lithic's developer-friendly APIs, direct network
  connections, and flawless reconciliation to launch and scale
  card programs in weeks, not years.

  We're building a future where access to better financial
  products materially improves people's lives, free from the
  constraints of 30-year-old mainframes and legacy processors.
  We're proud to be backed by world-class investors who share
  that vision, including Bessemer Venture Partners, Index
  Ventures, Spark Capital, Stripes, and Mastercard, along with
  many others.

  We're a team of 170+ across 26 states and 7 countries,
  headquartered in New York City.

  Lithic is hiring a Senior Software Engineer for our Issuing
  team to work cross-functionally with product, solutions,
  compliance and support to build reliable, developer-friendly
  experiences that make the complicated world of payments safe
  and easy for our customers and their users.

  Issuing is the front door for Lithic and its customers’ card
  payments programs. Nearly every API interaction and card
  transaction traces back to a card or account created by a
  service the Issuing team owns. We can be the reason a launch
  is successful, a customer signs on or an end user takes up a
  payment card in their day-to-day life.

  You’ll build and own the services that manage the entire
  lifecycle of cards and account holders, including card
  issuance, physical card manufacturing, digital wallet and
  agentic tokenization, as well as the KYB/KYC programs that
  keep our customers and bank partners safe. Working with our
  team will turn you into an expert in the card payments
  space.

  We encourage you to apply even if you don’t meet every
  requirement listed below!

  What You’ll Do:

  - Build and innovate in card and account lifecycle features
  - Own initiatives from planning to launch, including working
    with stakeholders and demonstrating developer-first
    product design thinking
  - Design APIs as products, thinking through the developer
    experience from endpoints to docs to error messages
  - Build resilient, fault-tolerant systems with predictable
    failure modes and fast recovery
  - Lead efforts to improve systems and processes both within
    the team and across teams
  - Participate in the team’s on-call rotation
  - Write and operate production services in Python and Rust on
    AWS

  What You’ll Bring:

  - 4+ years of experience shipping code in fast-paced
    production environments
  - Strong distributed systems design skills, including building
    high-availability, fault-tolerant services
  - Experience building APIs that drive the product experience
    for external developers
  - Sound judgment about what has to be right the first time and
    what can ship with a narrower scope and be iterated on
    later
  - The ability to advocate for high-leverage work and weigh it
    collaboratively against near-term deadlines
  - Experience in or desire to learn Rust
  - Growth mindset and continuous desire to learn and improve
  - Previous experience in fintech (especially card payments) is
    a bonus

  The annual US salary range for this role is $160,000 -
  $200,000 plus equity. This salary range may be inclusive of
  several career levels at Lithic and will be narrowed during
  the interview process based on the candidate’s experience
  and qualifications.

  This is a remote position. However, candidates must be
  located in the United States or Canada (Ontario or British
  Columbia). We do not offer visa sponsorship or assistance.

