description: |
  Position: Senior Full-stack Engineer

  Location: Remote from APAC

  Contract Type: Full-time Contractor

  Time Zone Alignment: APAC Time Zones (e.g., SGT, AEST)

  About In All Media:We are a Managed Nearshore Teams provider
  headquartered in Austin, specializing in building and
  embedding high-performing software development teams. From
  design to deployment, we deliver customized solutions by
  connecting global talent with innovative client projects.
  Our model gives you the opportunity to work on international
  challenges, collaborate with diverse teams, and grow your
  career while being part of a company that values expertise,
  creativity, and impact.

  Project OverviewIn this role, you will join a high-impact
  team as a Senior Full-stack Engineer focused on
  architecting, building, and scaling modern web applications.
  You will be responsible for designing seamless user
  interfaces using React and robust backend systems with
  Node.js. The project emphasizes high-level web architecture,
  component lifecycle design, and delivering scalable RESTful
  APIs. As a Senior Full-stack Engineer, you will tackle
  complex requirements, integrate event-driven analytics, and
  ensure our platforms remain highly testable, maintainable,
  and production-ready while collaborating closely with cross-
  functional teams.

  Key Responsibilities

  - End-to-End Development: Design, build, and maintain scalable
    full-stack web applications leveraging JavaScript,
    TypeScript, React, and Node.js.
  - System Architecture & API Design: Architect robust web
    solutions, manage complex state and component lifecycles,
    and lead the creation and integration of RESTful APIs.
  - Quality & Automated Testing: Ensure code reliability and
    maintainability by implementing comprehensive automated
    testing (unit, integration, and e2e).
  - Analytics Integration: Implement event-driven analytics and
    telemetry instrumentation to track user behavior and
    accurately measure feature impact.
  - Cross-Team Collaboration: Navigate ambiguous product
    requirements and manage cross-team technical dependencies
    through proactive and clear communication.
  - Build & Deployment: Oversee module bundling, build
    automation, and web application architecture best
    practices across the development lifecycle.

  Must-Have Skills

  - Core Software Engineering Experience: 5+ years of
    professional full-stack or web software engineering
    experience.
  - Modern Frontend Proficiency: Strong hands-on proficiency in
    JavaScript and TypeScript, paired with modern UI
    frameworks (React preferred).
  - Backend Runtime & API Design: Proven experience with Node.js
    or another server-side language/runtime, including
    building and consuming RESTful APIs.
  - Web Architecture & Build Tooling: Solid grasp of web
    application architecture, state management, component
    lifecycle design, and module bundling/build automation.
  - Automated Testing: Demonstrated experience writing testable,
    maintainable code backed by automated testing frameworks
    (unit, integration, e2e).
  - Telemetry & Event Analytics: Familiarity with event-driven
    analytics and telemetry instrumentation to track user
    behavior and measure feature impact.
  - Ambiguity & Cross-Team Communication: Strong written and
    verbal communication skills with comfort navigating
    ambiguous requirements and cross-team technical
    dependencies.

  Nice-to-Have Skills

  - Production Incident Response: Direct experience supporting
    production systems (on-call rotations, incident triage,
    and SLA resolution).
  - CRM & Contact Center Integration: Experience with CRM
    (Customer Relationship Management) platforms (e.g.,
    Salesforce), messaging protocols, or live chat routing
    systems.
  - AI / LLM Integration: Hands-on experience integrating
    application workflows or UI components with AI/LLM (Large
    Language Model) platforms and automated AI agents.
  - Micro-Frontend Architecture: Experience with micro-frontend
    patterns (e.g., Module Federation) or embedding cross-
    platform widgets across diverse host application surfaces.

  Time Zone & Collaboration:This role is 100% remote from APAC
  and requires consistent alignment with standard APAC
  business hours. Flexibility may be expected occasionally to
  accommodate key ceremonies, stand-ups, and collaborative
  sessions with global team members in other time zones.

  Language:All interviews, documentation, and daily
  communication are in English.

