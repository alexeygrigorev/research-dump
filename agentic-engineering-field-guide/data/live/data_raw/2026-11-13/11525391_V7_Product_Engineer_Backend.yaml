description: |
  V7

  At V7, we’re building AI platforms that help humans do their
  best work, at incredible scale and speed. Our mission is to
  turn human knowledge into trustworthy AI, making complex
  tasks faster, smarter, and more accurate. We’re growing
  fast, backed by leading investors and AI pioneers (including
  the minds behind Transformers and Gemini).

  The product

  V7 Go helps teams turn complex, repeatable work into AI
  workflows they can run, review and improve. Built for
  private markets, insurance and real estate, it supports
  investment diligence, underwriting, claims review and
  portfolio reporting—from analysing documents and data to
  generating deliverables and updating connected systems.

  Your experts define how the work should be done. V7 combines
  reusable Skills, shared company knowledge and configurable
  workflows, with citations, audit logs and human review to
  help teams verify results and control key decisions. It
  supports models including GPT, Claude and Gemini.

  - Build workflows around your processes. Configure each stage,
    choose models and tools, and set review steps where human
    judgement matters. Teams can inspect sources, correct
    outputs and refine workflows over time. Explore workflows.
  - Give every workflow your firm’s knowledge. The Context Graph
    connects documents, entities, relationships and source
    evidence, creating institutional memory that teams and
    agents can draw on.
  - Turn analysis into work your team can use. Generate editable
    memos, reports, presentations and spreadsheets, and
    connect workflows to the tools your business already uses.
    Explore document generation.



  The team you’ll be joining and impact you’ll have

  - Reporting to Chris, our Engineering Manager, you’ll be
    working in the Go Engineering team.
  - You’ll work in a team of (eventually) 7 people and be given
    significant responsibility, not just for coding but also
    for testing, planning, and analysis.
  - You’ll set your own goals, plans, and metrics, focusing on
    impact and outcomes rather than task completion.
  - Engineers are expected to be self-starters who really strive
    for impact. This means proactively solving problems,
    seeking help when needed, and having a strong sense of
    product ownership.

  What you’ll be doing from day one

  - Enabling foundation models to be applied to multimodal data
    at scale.
  - Helping to scale our platform to meet challenging multi
    tenant usage patterns.
  - Building a rich suite of APIs to power all of our internal
    systems and customer-facing products.
  - Shipping to production multiple times a day, working closely
    with Product and Design to solve customer problems.

  Who you are

  - You’ll have experience with functional programming.
    Familiarity with Elixir is a plus, but other languages
    like Scala, GoLang, Node.js, Haskell, Clojure, and F# are
    also great.
  - Infrastructure management experience at scale; ideally you
    should be comfortable in using AWS and terraform.
  - An understanding of queue management and observability.
  - Experience with orchestration tools like Docker.
  - Knowledge of GenAI and prompt engineering.
  - Place the customer at the heart of everything you do.

  V7 champions equality and inclusion because diverse teams
  build better products. Don't check every box? Apply anyway —
  we value what makes you unique and will support you through
  the process, just let our Talent team know how they can
  help.
