description: |
  Block is one company built from many blocks, all united by
  the same purpose of economic empowerment. The blocks that
  form our foundational teams - People, Finance, Counsel,
  Hardware, Information Security, Platform Infrastructure
  Engineering, and more - provide support and guidance at the
  corporate level. They work across business groups and around
  the globe, spanning time zones and disciplines to develop
  inclusive People policies, forecast finances, give legal
  counsel, safeguard systems, nurture new initiatives, and
  more. Every challenge creates possibilities, and we need
  different perspectives to see them all. Bring yours to
  Block. The Role The Data Enablement team builds the
  platforms and frameworks that move and serve data across
  Block. We support four core capabilities-online and offline
  data projections, third-party data integration, and graph
  data stores-for customers across the company, including
  Risk, Compliance, Data Engineering, and Data Science. As a
  Senior Software Engineer on the team, you will design,
  build, and operate backend systems that make data easier to
  acquire, process, and use. Your work will include expanding
  Block's external data acquisition capabilities and
  contributing to Sessions, which brings customer activity
  data together for analytics and machine learning, among
  other high-priority initiatives. You will help shape
  technical direction, own projects from design through
  production, and build shared capabilities that other teams
  can use. We're looking for a strong systems engineer who
  brings sound architectural judgment, takes ownership of
  outcomes, and is eager to learn across the backend and data
  engineering worlds. A deep data engineering background is
  valuable, but it is not a prerequisite. You Will

  - Design and build shared backend services, platforms, and
    frameworks that support data acquisition, processing, and
    access across Block.
  - Lead projects from problem definition and architecture
    through implementation, rollout, and ongoing production
    operation.
  - Work across backend services, event-driven systems, and
    batch and streaming data processing to deliver reliable
    capabilities for downstream consumers.
  - Partner with software engineers on the team and across the
    organization, Data Foundations engineers, and data
    scientists to turn their needs into reusable platform
    capabilities.
  - Make practical architectural decisions that balance
    reliability, latency, scalability, cost, and
    maintainability.
  - Improve the observability, data quality, and operational
    reliability of the systems you build and support.
  - Mentor engineers, contribute to technical standards, and
    grow familiar with the team's other domains over time.


  You Have

  - 8+ years of professional software engineering experience, or
    equivalent experience.
  - Deep experience designing, building, and operating
    distributed backend systems in production.
  - A track record of leading technical projects, making sound
    architectural decisions, and turning ambiguous problems
    into well-defined, deliverable work.
  - Proficiency in a backend programming language such as Java
    or Kotlin, with strong software design and engineering
    fundamentals.
  - Experience building on cloud infrastructure, ideally AWS.
  - The ability to learn unfamiliar systems and domains,
    communicate technical trade-offs clearly, and collaborate
    across software engineering, data engineering, and data
    science.
  - Bonus points for a data engineering background, including
    data pipelines, large-scale processing, or lakehouse and
    warehouse systems.
  - Bonus points for hands-on experience with Kafka and Spark
    Structured Streaming. Experience building and operating
    low-latency streaming systems with Spark Structured
    Streaming is especially valuable.


  Technologies We Use and Teach

  - Kafka, Spark, Spark Structured Streaming, Iceberg,
    Databricks, Snowflake, dbt, Prefect, block-forge, DataHub,
    Java, Kotlin, AWS, CloudEvents.
  - You do not need prior experience with every technology in
    our stack.


