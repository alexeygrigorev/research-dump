description: |
  SPREEAI is a fast-growing, innovative AI company at the
  forefront of fashion and e-commerce, revolutionizing how
  consumers engage with fashion through lifelike
  photorealistic try-on technology and hyper-personalized
  shopping experiences. Our mission is to redefine the retail
  landscape with cutting-edge AI solutions that blend high
  fashion and technology. We thrive in a dynamic, fast-paced
  environment where creativity meets technology to drive real
  impact. If you are passionate about innovation and shaping
  the future of fashion, SPREEAI offers a platform to make
  your mark.

  About the team

  Partner Engineering builds every customer-facing touchpoint
  for our brand partners: mobile SDKs, web integrations, and
  the onboarding surfaces partners use to get live on SPREEAI.
  It's a small, high-leverage team, everything you ship is
  something a partner will touch directly.

  About the role

  Right now, one engineer owns frontend work across every
  partner-facing surface we have (the Partner Portal, our
  Shopify onboarding flow, the demo site, and the Rescale
  App), while the Go/Node backend behind those surfaces sits
  with a separate team. That handoff is slowing both sides
  down. This role owns the full stack for those surfaces,
  frontend and the backend API layer that serves them, so
  features ship end to end without a handoff between teams.
  This is a priority hire.

  What you'll do

  - Build and maintain React.js interfaces for the Partner
    Portal, Shopify onboarding flow, demo site, and Rescale
    App
  - Design and own the Go/Node backend services behind those
    surfaces: REST API design, auth (OAuth 2.0, API keys,
    JWT), webhook delivery, and the PostgreSQL/DynamoDB data
    behind them
  - Own frontend performance, accessibility, and polish, the
    Partner Portal is often a brand partner's first hands-on
    impression of SPREEAI
  - Work directly with product and partner engineering leads to
    turn onboarding requirements into shipped features, end to
    end
  - Help set engineering practices, code review norms, testing,
    and component/service patterns as the team scales

  What you'll bring

  - 3+ years building production React.js applications, plus
    real experience owning a backend service in Go or Node.js,
    not just consuming one
  - Strong grasp of modern state management (Redux Toolkit,
    Zustand, or React Query) and component architecture
    (hooks, context, memoization)
  - Comfort designing REST APIs (versioning, pagination,
    idempotency), auth, and webhook systems
  - Experience with performance optimization (code splitting,
    lazy loading, virtualized lists) and accessibility (WCAG
    2.1, ARIA, keyboard navigation)
  - Comfort working independently in an ambiguous, fast-moving
    environment

  Nice to have

  Shopify app development, embeddable SDK/widget experience,
  or other e-commerce integration work.

  You'll thrive here if

  You take full ownership of what you build, from a Figma file
  to the database schema behind it, and you sweat the details
  that make an interface feel polished rather than just
  functional. You're comfortable being the person closest to a
  customer-facing surface end to end, and you communicate
  proactively when something's at risk rather than waiting to
  be asked.
