description: |
  About the role

  As the Team Lead for our software development team, you will
  play a key role in driving the architecture, development,
  and delivery of high-quality software solutions. You will
  lead a group of talented developers, ensuring smooth
  collaboration, technical innovation, and strong delivery
  results. Your responsibilities will encompass both hands-on
  coding and line management, helping the team grow, improve,
  and thrive in a fast-paced environment.

  Our Stack

  - Language: Java 17
  - Frameworks: Spring Boot (Tomcat, Netty), Spring Data, Spring
    Cloud
  - Architecture: Microservices, REST API, Message Queues
  - Database: MySQL, MyBatis, MongoDB
  - Caching: Redis (AWS ElastiCache), ElasticSearch
  - Message Queue: RocketMQ
  - Cloud: Kubernetes, AWS
  - Monitoring: Grafana, Prometheus, Loki, Tempo, AWS
    CloudWatch, OpenTracing
  - CI/CD: Jenkins, ArgoCD

  What you'll be doing

  - Lead and mentor a talented development team in the EU
    region, fostering a collaborative, high-performance
    culture
  - Provide technical leadership and ensure best practices in
    software development, code quality, and architecture
  - Participate in high-level architecture and design decisions
    for complex software systems
  - Drive the development lifecycle from requirements gathering
    to deployment, ensuring timely delivery of high-quality
    solutions
  - Conduct regular code reviews, offering constructive feedback
    to improve the team’s skills and output
  - Manage team members' performance and career development
  - Help drive continuous improvement in development processes,
    tools, and techniques

  What you'll bring

  - 8+ years of experience in software development, with a
    strong focus on backend technologies (e.g. Java, Node.js,
    Python, Go, etc.)
  - 2+ years of experience in a leadership role, with experience
    in mentoring, performance reviews, work allocation
  - Strong experience in software architecture and designing
    scalable, reliable systems
  - Hands-on experience in backend development, with expertise
    in APIs and microservices
  - Excellent communication skills in English and the ability to
    manage and collaborate within a remote, diverse team
  - A passion for technology and innovation, with a drive to
    solve complex technical challenges

  What’s in it for you

  - Sporty is a remote first company in pursuit of
    sustainability
  - A competitive salary + individual performance based bonuses
    every quarter
  - 28 days paid annual leave
  - Our core working hours are 10am-3pm in your local time zone
    with flexibility outside of this
  - Referral bonuses & flash bonuses
  - Top of the line equipment
  - Annual company retreats to provide great internal networking
    opportunities

  Interview Process

  - Remote video screening with our Talent Acquisition Team
  - Offline Take home assignment
  - Remote video interview with Team Members (60 Mins)
  - Final discussion with the hiring manager (60 mins)

  If you're interested, we encourage you to apply! Every
  application is reviewed by a member of our team (AI is not
  used in our recruitment process), and we aim to respond
  within 48 hours.
