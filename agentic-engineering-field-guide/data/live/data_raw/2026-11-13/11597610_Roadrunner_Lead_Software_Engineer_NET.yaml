description: |
  Roadrunner is growing, and we're looking for a highly
  motivated Lead Software Engineer (.NET) to join our winning
  team. If you're results-driven and want a fast-growing
  company with strong growth and earnings potential, apply
  today! Much of our operation runs on software we build
  ourselves. We're modernizing our core platforms, moving off
  legacy systems and onto cloud-native, API-first services on
  Azure. We also have AI use cases running in production and
  are expanding them carefully. As Lead Software Engineer
  (.NET), you'll drive engineering practices and hands-on
  design within the applications team, working closely with
  our Director of Architecture. Your work directly affects how
  freight moves. This role may provide opportunities for
  future leadership growth based on business needs and
  individual performance. You'll start as a hands-on lead, and
  as you show leadership, you can take on broader
  responsibility for people, priorities, and technical
  direction.

  What you’ll do

  - Design and build scalable, secure services and web apps (C#,
    .NET 8+, ASP.NET Core, React, Azure)
  - Lead the modernization of legacy applications: refactoring,
    re-platforming, and replacing them step by step
  - Design APIs and integrations with internal systems,
    customers, and partners
  - Own production quality: CI/CD, automated testing,
    observability, and secure coding
  - Mentor engineers on the team through code reviews, design
    discussions, and day-to-day coaching
  - Work directly with operations and business leaders to turn
    real freight problems into software

  What you bring

  - Bachelor's degree in a related field, or equivalent
    experience
  - 8+ years building production software in C# and .NET,
    including modern .NET, ASP.NET Core, and Entity Framework
    Core
  - Strong SQL Server skills: data modeling, query tuning,
    performance
  - Modern front-end knowledge (JavaScript/TypeScript); backend
    depth matters most.
  - Hands-on Azure experience (App Service, Functions, Azure
    SQL, Storage, Application Insights, or similar)
  - Experience designing RESTful APIs and system integrations
  - A track record of improving or modernizing legacy .NET
    Framework systems
  - Experience setting engineering practices (Git-based
    workflows, CI/CD, testing, code review) and mentoring
    other developers
  - Comfort explaining technical tradeoffs to non-technical
    stakeholders

  Nice to have

  - Transportation, logistics, LTL, or supply chain experience
  - Hands-on React or Angular experience
  - API gateway, microservices, or identity/authorization
    experience
  - Experience leading Scrum, Agile, or Kanban teams
  - Hands-on use of AI coding tools or building AI-enabled
    features

  Compensation & Setup

  - Pay: $120,000 – $130,000 base salary
  - Location: Hybrid – Downers Grove, IL
  - Benefits: Comprehensive benefits package including medical,
    dental, vision, 401(k), and paid time off

  Physical Demands and Work Environment

  The physical demands and work environment described here are
  representative of those an employee encounters while
  performing the essential functions of this position.
  Reasonable accommodations may be made to enable qualified
  individuals with disabilities to perform the essential
  functions.

  Physical Demands

  - Sedentary physical activity performing non- strenuous daily
    activities of an administrative nature.
  - While performing the duties of the job, the employee is
    regularly required to sit, walk, stand, reach/handle
    items, work with the fingers, and talk and hear others in
    conversations via the phone or in person.

  Work Environment

  - Sedentary physical activity performing non- strenuous daily
    activities of an administrative nature.
  - While performing the duties of the job, the employee is
    regularly required to sit, walk, stand, reach/handle
    items, work with the fingers, and talk and hear others in
    conversations via the phone or in person.
  - Up to 5% travel; occasional after-hours support based on
    business needs
  - Hybrid schedule: 3 days a week in the Downers Grove office
  - Occasional after-hours escalations for production issues

  * The above statements reflect the general details necessary
