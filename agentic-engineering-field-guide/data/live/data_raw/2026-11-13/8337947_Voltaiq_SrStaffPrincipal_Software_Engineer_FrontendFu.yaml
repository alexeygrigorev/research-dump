description: |
  “The battery is the technology of our time.” -The Economist

  Voltaiq is an Enterprise Battery Intelligence (EBI) software
  company. Our data platform brings unprecedented analytics,
  visualization, and predictive capabilities to any company
  with a battery-powered business model. Our customers are
  world-leading brands — including global automakers
  (Mercedes, Subaru), household-name tech giants (Google,
  Meta, Amazon), and major battery producers and their
  materials suppliers (Albemarle, Sila Nanotechnologies) —
  depend on Voltaiq software to accelerate product
  development, optimize performance, ensure safety and
  reliability, and unlock financial value in their products.
  Our high-powered team is composed of battery industry
  veterans, PhD scientists, a highly skilled product and
  engineering team, and an advisory board of C-level industry
  execs, all of whom are passionate about enabling the global
  energy transition. Voltaiq is a USA-based fully-remote
  company serving customers around the world.

  The Role

  Voltaiq is seeking an exceptional Frontend/Fullstack
  Software Engineer to join our team as we build out the
  future of EBI data visualizations and user experiences. We
  are open to hiring at the Senior, Staff, or Principal level.
  You will work with other engineers and product managers to
  develop next-generation battery analytics software solutions
  to serve some of the world's biggest companies in
  automotive, consumer electronics, and battery manufacturing.

  Responsibilities:

  - Design and develop web applications using Plotly, React,
    Django, and GraphQL
  - Work with engineering leadership to shape future
    architectural decisions of Voltaiq’s Frontend Products,
    mentor team-mates, champion development best practices and
    keep abreast of new front-end technologies
  - Work closely with the Product Management and Design
    functions, along with other engineers to understand
    requirements and design performant solutions
  - Write clean, maintainable, and efficient code that meets
    business and technical requirements
  - Perform unit testing and integration testing of developed
    code
  - Own feature development from technical requirements
    gathering to deployment in production
  - Participate in code reviews and provide feedback to other
    engineers
  - Troubleshoot and debug issues in production and staging
    environments

  Required Skills & Qualifications:

  - 3+ years of experience in developing web applications using
    React, Python, and GraphQL
  - 2+ years of data visualization experience with tools like
    Plotly.js, D3.js, or similar
  - Deep experience with frontend technologies such as HTML,
    CSS, TypeScript, and Jest
  - Proficient in cloud computing (AWS, Azure, GCP)
  - Experience with relational database technologies like SQL
  - Experience with containerization technologies like Docker
  - Experience with agile software development methodologies
  - Experience with Git or similar Version Control Systems
  - Strong communication and collaboration skills
  - Strong problem-solving and analytical skills
  - Highly-developed attention to detail, with a drive to
    deliver intuitive and beautiful solutions to complex
    analytical workflows
  - Comfortable working in a linux environment
  - Bachelor's degree in Computer Science, Engineering or a
    related field or comparable experience
  - A passion for working to help accelerate the global
    transition to sustainable energy
  - Experience in the battery industry is a plus

  Additional Skills & Qualifications:

  - Experience with React Relay
  - Experience developing from Figma or similar design tools
  - Experience with Django
  - Experience with numpy and pandas
  - Experience with generative AI a plus

  Voltaiq is a remote-first company, and salaries are adjusted
  for cost of labor in each city. The salary range for this
  position is $120,000 - $180,000 + equity, depending on
  location and experience.

  Voltaiq is an equal opportunity employer and is committed to
  achieving a diverse workforce through application of its
  equal opportunity and nondiscrimination policy, in all
  aspects of employment.
