  Equal opportunities for everyone

  Diversity and inclusion are a priority for us and we’re
  making sure we have lots of support for all of our people to
  grow at Monzo. At Monzo, we’re embracing diversity by
  fostering an inclusive environment for all people to do the
  best work of their lives with us. This is integral to our
  mission of making money work for everyone. You can read more
  in our blog, 2026 Diversity and Inclusion Report and 2025
  Gender Pay Gap Report.

  We’re an equal opportunity employer. All applicants will be
  considered for employment without attention to age,
  ethnicity, religion, sex, sexual orientation, gender
  identity, family or parental status, national origin, or
  veteran, neurodiversity or disability status.

  If you have a preferred name, please use it to apply. We
  don't need full or birth names at application stage 😊
