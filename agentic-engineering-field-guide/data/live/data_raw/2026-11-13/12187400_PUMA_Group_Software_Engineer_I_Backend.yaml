description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  At PUMA, technology plays a critical role in enabling
  exceptional consumer, digital, and business experiences
  across global markets. Our engineering teams build and
  operate the platforms, products, and services that power
  PUMA's digital ecosystem, supporting millions of consumers
  and internal users worldwide.

  As part of the Engineering organization, you will contribute
  to the design, development, and evolution of scalable
  platforms and services that enable business capabilities
  across eCommerce, consumer engagement, merchandising, supply
  chain, retail operations, data, and enterprise functions.
  The organization embraces modern engineering practices,
  cloud-native architecture, automation, AI-assisted
  development, and a product-centric mindset to deliver high-
  quality solutions at scale.

  As a Software Engineer (Backend), you will implement and
  operate production-grade backend systems, APIs, and
  distributed services that support critical business and
  consumer-facing applications. You will work closely with
  Product Managers, Architects, Data Engineers, and fellow
  engineers to deliver secure, reliable, and scalable
  solutions while contributing to technical excellence and
  engineering best practices across the organization.

  What you will do:

  - Design, develop, test, and maintain backend services, APIs,
    and microservices that support digital products and
    business platforms.
  - Contribute to the implementation of scalable, reliable, and
    secure software solutions following engineering best
    practices.
  - Collaborate with product managers, architects, and engineers
    to deliver business requirements and product enhancements.
  - Build integrations with internal and external systems using
    modern APIs, messaging platforms, and cloud-native
    technologies.
  - Work with databases, caching solutions, and event-driven
    systems to develop efficient and performant applications.
  - Participate in the development and operation of cloud-native
    applications and distributed systems.
  - Troubleshoot production issues, identify root causes, and
    implement fixes to improve system reliability and
    stability.
  - Contribute to application monitoring, logging,
    observability, and performance optimization initiatives.
  - Participate in code reviews, technical discussions, and
    design reviews while continuously improving engineering
    skills.
  - Leverage automation, CI/CD pipelines, and AI-assisted
    development tools to improve productivity and software
    quality.
  - Work closely with cross-functional teams in an Agile
    environment to deliver high-quality software.
  - Contribute to continuous improvement initiatives focused on
    engineering excellence, operational efficiency, and
    platform modernization.

  YOUR TALENT

  - 2+ years of experience building backend applications, web
    services, or microservices.
  - Good proficiency in Java, Spring Boot, RESTful API
    development, and backend engineering fundamentals.
  - Understanding of object-oriented programming, software
    design principles, data structures, and clean coding
    practices.
  - Experience working with relational and/or NoSQL databases
    such as PostgreSQL, MySQL, MongoDB, or similar
    technologies.
  - Familiarity with caching technologies such as Redis and
    messaging/event-streaming platforms such as Kafka.
  - Exposure cloud platforms such as Azure, AWS, or GCP and
    modern cloud-native development practices.
  - Understanding of distributed systems concepts, scalability,
    reliability, and performance optimization.
  - Familiarity with CI/CD pipelines, version control systems,
    automated testing, and DevOps practices.
  - Exposure to containerization technologies such as Docker and
    orchestration platforms such as Kubernetes.
  - Familiarity with monitoring, logging, and observability
    tools used in production environments.
  - Exposure to search technologies such as Elasticsearch,
    OpenSearch, Azure AI Search, or similar platforms is a
    plus.
  - Exposure to AI-assisted engineering tools, Generative AI,
    LLMs, or intelligent application development is a plus.

