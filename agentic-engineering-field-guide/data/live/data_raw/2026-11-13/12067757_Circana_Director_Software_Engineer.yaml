description: |
  Lead software engineer (Director)



  Let’s be unstoppable together!



  At Circana, we are fueled by our passion for continuous
  learning and growth, we seek and share feedback freely, and
  we celebrate victories both big and small in an environment
  that is flexible and accommodating to our work and personal
  lives. We have a global commitment to diversity, equity, and
  inclusion as we believe in the undeniable strength that
  diversity brings to our business, employees, clients, and
  communities. With us, you can always bring your full self to
  work. Join our inclusive, committed team to be a challenger,
  own outcomes, and stay curious together. Circana is proud to
  be Certified™ by Great Place To Work®. This prestigious
  award is based entirely on what current employees say about
  their experience working at Circana.

  Learn more at www.circana.com.



  What will you be doing?

  We are looking for an App development lead who would be
  responsible for designing the solution and leads the end-to-
  end development and maintenance of Android and IOS
  applications. Primary focus will be to architect the
  solutions and lead the development of Android and IOS
  applications and their integration with back-end services.
  He/She will be working along-side other engineers and
  developers working on different layers of the
  infrastructure. Therefore, commitment to collaborative
  problem solving, sophisticated design, and creating quality
  products is essential.

  An outstanding app development lead should be able to
  create/lead functional, attractive applications that
  perfectly meet the needs of the user.

  Job Responsibilities

  - Designing, building and leading mobile applications for both
    IOS and android platform.
  - Maintaining the code and atomization of the application.
  - Work in a fast-paced environment, work independently for
    delivering the app releases for the end users.
  - Translate designs and wireframes into high-quality code and
    final delivery to the end users.
  - Ensure the best possible performance, quality, and
    responsiveness of the application
  - Work closely with other team members in guiding software
    architecture and technology decisions. Mentor, document,
    and share knowledge, growing the technical capability of
    the team around you.
  - Follow software engineering best practices in code,
    architecture, and testing.
  - Lead the end-to-end development of Android and iOS
    applications, owning architecture, delivery and the
    technical growth of the team across both platforms.
  - Understand business and product requirements and translate
    them into wireframes and solution designs before
    development begins.
  - Ensure delivery happens on time within Circana’s fast-paced
    culture, managing priorities and dependencies so that
    committed release dates are met.
  - Drive quality delivery by setting and upholding standards
    for code, testing and the end-user experience in every
    release.
  - Promote a high level of collaboration within the team and
    with product, design, QA and back-end teams so that the
    group delivers as one unit.
  - Make effective use of AI tools to generate designs and code
    faster, improving speed of delivery without compromising
    quality or maintainability.
  - Manage, coordinate and work effectively with a team of 6
    members based in India, allowing for differences in time
    zone and working practice.

  Requirements

  - Experience of around 8+ years with app development, leading
    the team and ability to pick up new languages and tools
    quickly.
  - Experience in developing Customer facing app (B2C) is good
    to have.
  - Experience with offline storage, threading, and performance
    tuning
  - Ability to understand business requirements and translate
    them into technical requirements.
  - Ability to work well with others, learn on the job, and
    thrive in a dynamic work environment.
  - A focus on user-oriented development, supporting services,
    and end-user satisfaction.
  - Excellent verbal and written communication skills.
  - Familiarity with Continuous Integration/Continuous
    Delivery/Continuous Deployment testing, tooling, and
    processes.
  - Experience with performance and memory tuning using
    different tools.
  - Demonstrated experience leading app development for both
    Android and iOS platforms, through to app store release.
  - Experience gathering requirements from stakeholders and
    creating wireframes or prototypes to validate them before
    build.
  - Good understanding of the challenges specific to B2C
    applications, such as scale, device fragmentation, app
    store compliance, user retention and data privacy.
  - Well versed with AI tools and AI-assisted development to
    generate designs and code faster.
  - Able to communicate in most of the following languages:
    English, French, Spanish and/or Portuguese
  - Proven experience managing and coordinating with distributed
    teams across Europe, India, US and South Africa.
  - Bachelor’s degree in Computer Science or related field, or
    equivalent work experience.



  Circana Behaviors

  As well as the technical skills, experience and attributes
  that are required for the role, our shared behaviors sit at
  the core of our organization. Therefore, we always look for
  people who can continuously champion these behaviors
  throughout the business within their day-to-day role:

  - Stay Curious: Being hungry to learn and grow, always asking
    the big questions.
  - Seek Clarity: Embracing complexity to create clarity and
    inspire action.
  - Own the Outcome: Being accountable for decisions and taking
    ownership of our choices.
  - Center on the Client: Relentlessly adding value for our
    customers.
  - Be a Challenger: Never complacent, always striving for
    continuous improvement.
  - Champion Inclusivity: Fostering trust in relationships
    engaging with empathy, respect, and integrity.
  - Commit to each other: Contributing to making Circana a great
    place to work for everyone.

  Location

  This position can be located in the following area(s):

  France (remote) or Paris Office

  Spain (remote) or Madrid Office

