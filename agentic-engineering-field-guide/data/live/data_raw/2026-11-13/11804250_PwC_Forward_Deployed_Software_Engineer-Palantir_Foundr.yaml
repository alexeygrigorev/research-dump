description: |
  The Opportunity As a Forward Deployed Software Engineer-
  Palantir Foundry-Experienced Associate, you will leverage
  advanced technologies and techniques to design and develop
  robust data solutions for clients, transforming raw data
  into actionable insights that drive business growth. Within
  our Technology Consulting practice, you will apply data,
  algorithms, and software engineering to build and deploy AI
  and Machine Learning solutions at scale, enabling informed
  decision-making. As an Associate, you will focus on learning
  and contributing to client engagements and projects,
  developing your skills and knowledge to deliver quality
  work. You will be exposed to clients to learn how to build
  meaningful connections, manage and inspire others, and grow
  your personal brand by deepening your technical knowledge of
  firm services and technology resources. You will navigate
  complex situations, anticipate the needs of your teams and
  clients, and embrace ambiguity as opportunities for growth.
  In this role at PwC, you will take ownership of your
  development, appreciate diverse perspectives, and commit to
  understanding the business context, building commercial
  awareness along the way. Responsibilities
  - Leading the development and deployment of data solutions
    using Palantir Foundry
  - Leading teams in the development of robust data solutions
    for client needs
  - Coaching team members to leverage their strengths and
    deliver quality outcomes
  - Analyzing system interactions to identify opportunities for
    improvement
  - Utilize proficiency in data engineering and analytics to
    drive client benefits
  - Manage client accounts and foster enduring client
    relationships
  - Taking ownership of projects, including planning, budgeting,
    and execution
  - Encouraging innovation and technology adoption to enhance
    delivery
  - Addressing conflicts and engaging in challenging
    conversations with stakeholders
  - Upholding professional and technical standards, including
    PwC's code of conduct
  - Identify opportunities for team development and continuous
    improvement
  What You Must Have
  - At least a Bachelor's degree
  - At least 1 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Foundry Data Engineer,
    Solution Architect, or Application Developer
  - Excelling in customer-centric solutions
  - Delivering significant contributions beyond expectations
  - Strength in analytical and problem-solving abilities
  - Building applications with large datasets
  - Collaborating with diverse technical teams
  - Familiarity with Python and/or Typescript
  - Experience with Palantir Foundry and AIP
  The salary range for this position is: $63,000 - $140,000.
  Actual compensation within the range will be dependent upon
  the individual's skills, experience, qualifications and
  location, and applicable employment laws. All hired
  individuals are eligible for an annual discretionary bonus.
