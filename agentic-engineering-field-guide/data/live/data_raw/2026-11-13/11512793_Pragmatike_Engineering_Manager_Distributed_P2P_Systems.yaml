description: |
  Location: Remote, Europe Time Zone Start Date: ASAP
  Employment Type: Full-Time Team: Core Compute & Distributed
  Systems Language: English

  About the Role

  We are looking for an experienced Engineering Manager to
  lead a team building the distributed systems that power a
  decentralized compute and storage platform.

  You will lead a team of senior engineers working on P2P
  networking, distributed storage, compute orchestration, and
  core platform services. You’ll combine people leadership
  with strong technical ownership, helping shape architecture,
  guide execution, and stay hands-on with critical systems and
  production code.

  This is a great opportunity for a technical engineering
  leader who enjoys working close to complex distributed
  systems, making pragmatic architectural decisions, and
  building a strong engineering culture in an async, writing-
  first environment.

  What You’ll Do

  - Lead, mentor, and grow a high-performing team of distributed
    systems and backend engineers
  - Drive the technical direction and execution of core P2P,
    compute, and distributed platform systems
  - Stay hands-on with architecture, design, implementation, and
    technical problem-solving
  - Guide the development of high-throughput distributed
    protocols, including peer discovery, communication,
    replication, and data distribution
  - Oversee systems responsible for compute orchestration,
    provisioning, scaling, and workload distribution
  - Champion reliability, resilience, observability, and
    production readiness across the platform
  - Establish strong engineering practices around testing,
    CI/CD, releases, incident response, and root-cause
    analysis
  - Work closely with Infrastructure, Product, Security, and
    Platform teams on roadmaps, priorities, and cross-team
    dependencies
  - Run effective 1:1s, retrospectives, performance reviews, and
    career development conversations
  - Translate technical and business priorities into clear
    execution plans and measurable outcomes
  - Foster a culture of ownership, technical excellence,
    pragmatic decision-making, and continuous improvement

  What We’re Looking For

  - 7+ years of software engineering experience, with 3+ years
    in an Engineering Manager or technical leadership role
  - Proven experience leading teams building and shipping
    distributed systems or infrastructure software to
    production
  - Strong understanding of P2P and distributed systems, such as
    peer discovery, DHTs, gossip protocols, NAT traversal,
    replication, consensus, or content-addressed systems
  - Strong backend and systems programming experience, ideally
    with Go, or alternatively C/C++ or Rust
  - Solid understanding of concurrency, networking, distributed
    communication, and fault-tolerant system design
  - Experience with compute orchestration, distributed storage,
    distributed databases, or platform infrastructure
  - Familiarity with technologies such as libp2p, gRPC,
    Protobuf, IPFS/CIDs, Kubernetes, or containerized
    infrastructure
  - Experience with observability and production operations,
    including tools such as Prometheus, Grafana,
    OpenTelemetry, or distributed tracing
  - Strong understanding of Linux systems and networking
    fundamentals
  - Experience establishing engineering standards around
    automated testing, CI/CD, release processes, and incident
    management
  - Strong technical judgment and the ability to balance hands-
    on engineering, people leadership, and strategic decision-
    making
  - Excellent written and verbal communication skills, with the
    ability to work effectively in a remote and async
    environment

  Nice to Have

  - Experience with distributed storage, object storage,
    distributed filesystems, or data integrity systems
  - Knowledge of S3 APIs, NFS, FUSE, POSIX semantics, block
    storage, or storage engines
  - Experience with erasure coding, sharding, garbage
    collection, or large-scale data migration
  - Experience managing multi-cloud, bare-metal, or
    geographically distributed infrastructure
  - Familiarity with GPU infrastructure, distributed AI compute,
    model serving, or inference routing
  - Experience with infrastructure-as-code such as Terraform,
    Pulumi, or similar tools
  - Experience working with decentralized, blockchain, Web3, or
    other P2P architectures

  Why This Role Matters

  - Shape a distributed platform from the core: Influence the
    architecture of the systems that power decentralized
    compute and storage
  - Lead a strong technical team: Mentor senior engineers and
    build an environment where engineers can do their best
    work
  - Stay hands-on: Continue solving complex technical problems
    while growing as an engineering leader
  - Work on genuinely distributed infrastructure: Tackle
    challenges around networking, replication, resilience,
    data distribution, and compute at scale
  - Influence architecture: Make meaningful technical decisions
    rather than simply managing delivery
  - Work across the platform: Collaborate with Infrastructure,
    Security, Product, and Backend teams
  - Remote-first and async: Work remotely with strong European
    time-zone overlap in a writing-first engineering culture

  How We Work

  We favor clear written communication, focused deep work, and
  pragmatic engineering over unnecessary meetings and
  synchronization.

  Our engineering culture emphasizes:

  - RFCs and well-documented technical decisions
  - High automated test coverage and rigorous production
    validation
  - Pragmatic, maintainable code
  - Strong observability and operational ownership
  - Regular production releases
  - Continuous improvement through retrospectives and post-
    incident reviews

