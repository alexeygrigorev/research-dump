description: |
  With over 30,000 customers, including a third of Fortune 500
  companies, Tempo is trusted by organizations across the
  globe to make their workflows work better.

  We create a suite of integrated solutions for time
  management, resource planning, budget management,
  roadmapping, program management, reporting and more. We
  create the tech that enables the modern team to deliver –
  for every step from first vision to value.

  Since our beginning in 2007 as a project to make a time-
  tracking tool to help a client – Tempo has expanded to
  become the #1 time management add-on for Jira, and we have
  developed and acquired a multitude of tools to become one of
  the most trusted names in the Atlassian ecosystem.

  We want everyone to work better – but we also want to be a
  tech company with a heart. Join us as we continuously
  innovate our award-winning products, create new solutions,
  and help the world work smarter, not harder.

  About the role:

  We are looking for a passionate software developer to join
  our engineering team. You will collaborate with product
  managers, designers, developers, QA engineers, and technical
  writers to develop some of our flagship products – Tempo
  Timesheets, Capacity Planner and Financial Manager for Jira
  Cloud. The ideal candidate is a person that wants to solve
  customers’ problems rather than just close issues in the
  task tracking system.

  What you’ll do:

  - Write efficient, readable, maintainable, and testable side
    code both on the frontend and on the backend
  - Create unit tests, sometimes integration and performance
    tests
  - Review your peers' code
  - Solve challenging problems with a great attention to user
    experience, security and performance
  - Cooperate with product managers, designers, software
    developers, QA engineers, and technical writers to develop
    and maintain the best Atlassian plugins that are used by
    thousands of people in many big-name companies around the
    world

  Who you are:

  - 5+ years of experience in software development for
    commercial software, preferably SaaS
  - 4+ years of experience in commercial software development in
    TypeScript with React as well as in server-side
    development of commercial web applications in Java and/or
    Kotlin
  - Degree in Computer Science, Software Engineering, or related
    studies, knowledge of Computer Science fundamentals:
    big-O, basic data structures, and algorithms
  - Excellent knowledge of TypeScript, JavaScript, CSS3, HTML5,
    Java/Kotlin
  - Well versed in making efficient use of agentic AI workflows
    to do their work, while keeping code quality up
  - Experience in building complex user interfaces
  - Good sense of usability
  - Skills in designing APIs
  - Has experience with building highly scalable distributed
    systems
  - Has experience with Kubernetes and AWS
  - Has experience with SQL queries and database performance, as
    well as experience with NoSQL technologies, such as
    MongoDB or AWS DynamoDB
  - Experience with performance optimization

  - Upper-intermediate spoken and written English

  - Ability to express thoughts clearly, including explanation
    of technical decisions
  - Solid soft skills to communicate in multicultural
    environment
  - Ability to work autonomously and remotely without extensive
    control or micro-management, ability to start working
    without complete technical specification

  - Ability to learn and have productive communication on topics
    which the candidate doesn’t know 100% in advance
  - Ability to work with the teammates on elaborating technical
    specifications

  Why Join Tempo?

  - Impact: Work on meaningful products that empower enterprise
    users and improve productivity.
  - Innovation: Be part of a culture that values creativity and
    innovation, with opportunities to make a real impact.
  - Collaboration: Join a supportive, collaborative UX team that
    values openness, communication, and a continuous learning
    environment.
  - Growth: Opportunities for professional development,
    including conferences, courses, and mentorship.

  What's In It For You (Org-wide)

  - Remote First work environment
  - Unlimited vacation in most of our locations!!
  - Great benefits including health, dental, vision and savings
    plan.
  - Perks such as training reimbursement, WFH reimbursement, and
    more.
  - Diverse and dynamic teams with challenging and exciting
    work.
  - An opportunity to have a real impact on our business.
  - A great range of social activities (both in person and
    virtual).
  - Optional in person meet-ups and the ability to travel to our
    international offices
  - Employee referral program
  - And so much more!

  Note: As our hiring teams are global, please submit your
  resume in English only

  Apply today to join the Tempo team and help shape the future
  of enterprise productivity software.

  Join us at Tempo Software, where we proudly foster an equal
  opportunity workplace. We are committed to creating an
  inclusive culture where all qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, genetics, disability,
  age, or veteran status.
