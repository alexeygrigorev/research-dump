description: |
  We enable financial institutions to become AI-first digital
  leaders.

  As a professional team of global scale, we work with best
  clients for great and exciting projects, in an environment
  where we learn amazing things every day. Each code, each
  voice, each contribution, each challenge, each success is
  celebrated here.

  We welcome candidates who share our values, have the skills
  and are passionate to enjoy our journey to build the digital
  future of finance, together.  About The Job:

  What you will be doing:

  - Development & Implementation

  Design, develop, and maintain scalable web applications
  using .NET (C#, ASP.NET Core, Web API) for backend and
  Angular/React for frontend development.

  Collaborate in a CI/CD pipeline environment for continuous
  integration and delivery.

  - Planning & Requirement Analysis

  Ensure a clear understanding of project requirements,
  including business goals and technical specifications.

  Collaborate with stakeholders, including product owners and
  project managers, to align software solutions with business
  goals and user needs.

  - Testing & Debugging

  Identify, debug, and resolve application issues to ensure
  software meets project requirements and functions correctly.

  - Performance Optimization & Monitoring

  Improve application performance by optimizing queries,
  caching, and front-end rendering.

  - Maintenance & Support

  Continuously monitor, maintain, and update software
  applications to ensure they function optimally and align
  with evolving business needs.

  Provide support to end-users, ensuring effective utilization
  of the software application.

  Maintain comprehensive documentation of the development
  process, codebase, and software changes for future reference
  and scalability.

  - Leadership & Continuous Improvement

  Stay updated with the latest .NET and Angular/React
  advancements, integrating new technologies and best
  practices into development processes.

  What we are looking for:

  - Bachelor's degree in Computer Science, Information Systems,
    Engineering, or related field.
  - At least 5 years of relevant industry experience.
  - Strong proficiency in C# and .NET Core / ASP.NET Core for
    backend development.
  - Experience in Angular or React with a strong understanding
    of TypeScript, and respective CLI tools.
  - Expertise in RESTful API design.
  - Design and develop Database operations on SQL databases
    using Entity Framework/EF Core.
  - Proficiency in GIT and DevOps tools for version control and
    deployment.
  - Strong problem-solving skills and ability to work
    independently or within a team.
  - Ability to work in a collaborative environment, coordinate
    with cross-functional teams, and clearly communicate
    technical concepts.

  About VeriPark:

  VeriPark is a global technology powerhouse with more than
  two decades of experience in the financial services
  industry. Our mission is to enable financial institutions to
  become digital leaders by delivering world class customer
  journeys.

  With offices in 15 countries from Canada over Europe and the
  Middle East to Kuala Lumpur, our 1000+ colleagues are
  serving customers in more than 30 countries worldwide.

  As a global player, we offer more than just a workplace; we
  provide a transformative environment that transcends
  boundaries. Joining VeriPark means becoming part of a
  diverse family where talent is nurtured, diversity is
  celebrated, and our culture empowers each individual to
  reach their full potential.

  Be a part of our global family, where opportunities are as
  vast as our global footprint.

