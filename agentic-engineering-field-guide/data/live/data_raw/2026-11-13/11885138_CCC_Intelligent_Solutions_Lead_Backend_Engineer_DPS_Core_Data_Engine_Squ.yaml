  CCC Intelligent Solutions Inc. (CCC) is a leading cloud
  platform for the multi-trillion-dollar insurance economy,
  creating intelligent experiences for insurers, repairers,
  automakers, part suppliers, and more. At CCC, we’re making
  life just work by empowering more than 35,000 businesses
  with industry-leading technology to get drivers back on the
  road and to health quickly and seamlessly. We’re pushing
  boundaries with innovative AI solutions that simplify and
  enhance the claims and repair journey. Through purposeful
  innovation and the strength of its connections, CCC
  technologies empower the people and industry relied upon to
  keep lives moving forward when it matters most. Learn more
  about CCC at www.cccis.com.



  The RoleWe are seeking a Lead Backend Engineer who is
  passionate about database modernization, performance
  optimization, and strategic refactoring of mission-critical
  systems. You will be a key member of the DPS Core & Data
  Engine Squad, working on the system-of-record platform that
  powers both internal (DPS) and external (IES) claims
  management experiences supporting millions of transactions
  and billions of dollars in claims. This is a modernization
  engineering role for someone who gets excited about: •
  Refactoring complex stored procedures and carving out domain
  logic into maintainable services • Optimizing SQL
  performance and improving system efficiency • Creating safe
  migration patterns that enable continuous modernization
  while maintaining business continuity • Working in .NET
  codebases and evolving them into clean, testable, domain-
  aligned modules If you love the challenge of strategic
  system evolution and want to participate in evolving the
  technical architecture of a multi-year transformation from
  monolithic database logic to service-oriented
  architecture—this role is for you.



  Key Responsibilities:

  Database Engineering & Modernization (60%)

  Stored procedure refactoring: Analyze, optimize, and
  decompose complex stored procedures into smaller, testable,
  well-documented units

  - Performance engineering: Query tuning, indexing strategy,
    execution plan analysis, optimizing data access patterns
  - Schema evolution: Design backward-compatible schema changes
    with safe rollout/rollback patterns
  - Migration seams: Create facades, wrappers, and anti-
    corruption layers around stored procedures to enable
    gradual extraction of business logic into services

  Legacy .NET Modernization (30%)

  - Refactor .NET Framework code supporting DPS workflows into
    maintainable, testable modules
  - Implement strangler fig patterns to incrementally move logic
    from database service layer while maintaining production
    stability
  - Build domain-aligned modules/services with clear contracts
    that enable the Domain & Services Squad to extract
    capabilities
  - Establish patterns for dependency injection, observability,
    and error handling in established .NET codebases

  Operational Excellence (10%)

  - Implement performance baselines, regression detection, and
    alerting for data-intensive workflows
  - Participate in incident response for data/performance-
    related production issues
  - Create diagnostic tooling and runbooks to reduce time-to-
    resolution
  - Collaborate with SRE/DevOps on deployment safety
    (blue/green, feature flags, canary releases for schema
    changes)



  Requirements:

  Technical Skills

  - 8+ years of professional software development experience in
    object-oriented languages (C#/.NET required)
  - Expert-level SQL Server knowledge (SQL Server 2019):
  - Advanced query optimization (execution plans, index tuning,
    query hints)
  - Stored procedure, function, and trigger
    development/refactoring
  - Database design and normalization
  - Performance tuning at scale (multi-million row tables,
    complex joins, aggregations)
  - Understanding of indexing strategies (clustered, non-
    clustered, filtered, columnstore)
  - SQL Agent jobs and automated workflow patterns
  - Transaction isolation levels, locking, and concurrency
    management
  - C# and .NET Framework/.NET Core (legacy and modern)
  - Experience refactoring established systems while maintaining
    production stability
  - SQL source control (migrations, version control for
    schema/stored procedures)

  Highly Desired:

  - Experience with strangler fig, anti-corruption layer, and
    facade patterns in practice
  - Hands-on experience migrating logic from stored procedures →
    service layer in production systems
  - Familiarity with domain-driven design (DDD) concepts
    (bounded contexts, aggregates, repositories)
  - Azure SQL Database, Azure DevOps experience
  - Observability tools (Application Insights, SQL Profiler)
  - API design and versioning (REST, OpenAPI/Swagger)
  - Unit testing frameworks (xUnit, NUnit) and test data builder
    patterns
  - PowerShell for database scripting/automation
  - Experience with microservices architecture and event-driven
    patterns
  - Familiarity with Entity Framework Core, Dapper, or other
    ORMs (and knowing when to use native SQL)



