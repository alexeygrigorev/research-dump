description: |
  Job Description

  As a crucial member of the product development team of the
  keylight platforms, our Senior Frontend Developer will be
  responsible for overseeing end-to-end strategic importance
  projects and ensuring their timely completion. Daily, you’ll
  be developing and implementing the visual layout and UI/UX
  for components and features that are directly accessed by
  external users. On top of that, you’ll keep an eye on new
  trends and share the best practices with your peers.

  Your main activities will be focusing on:

  - writing reusable code to a standard which makes it quick and
    easy to maintain in the future
  - writing automated testing to resolve interface problems
  - optimizing applications for maximum speed and scalability
  - writing libraries and reusable components with matching
    documentation
  - collaborating with software engineers to integrate backend
    functionality
  - participating and planning retrospectives to help improve
    the overall software development process

  To succeed in this position, you will bring to our company:

  - broad knowledge and proficiency in JS, TS, Angular, RxJS,
    HTML5, CSS3, and AWS
  - understanding of different stakeholders' needs to provide
    relevant technical solutions
  - experience in using a complex REST API from the client-side
  - ability to make important decisions with high impact in a
    short period of time
  - a detailed approach to developing, testing and documenting
    clean code

  keylight is a global subscription technology vendor founded
  in 2015. We prioritize users to design an ecosystem that
  streamlines all subscription operations on one unified
  platform. Our user-centric approach has enabled our
  customers to gain full control over complex business
  processes and inspired many to put users first in their
  technological architecture.

  Perks of working at keylight:

  - Have a great work-life balance with flexible working hours
    and home office
  - A self-funded tech company with a family atmosphere
  - Agile and self-organizing work environment
  - Be part of a diverse, lively and international team
  - As a company, we have jointly designed our own employee
    development concept
  - Regular company events

  The recruitment process contains:

  - Initial meeting with the HR team
  - Interview with Hiring Manager
  - Meeting with keylighters
  - Offer stage
