  Job Description:

  *** Up to 2 Days a Week Telework! ***

  Transform technology into opportunity as a Full Stack
  Engineer at GDIT. Shape what’s next for mission-critical
  government projects while shaping what’s next for your
  engineering career.

  MEANINGFUL WORK AND PERSONAL IMPACT

  As a Full Stack Engineer, the work you’ll do at GDIT will be
  impactful to the mission of a mission critical customer. You
  will play a crucial role in driving backend framework
  updates, building responsive Angular frontend interfaces and
  updating cloud infrastructure.

  An ideal candidate has full stack experience with strong
  devops skills. Development is done unclassified with the
  ability to work from home as tasking allows.

  Contractor facility work location in the National Business
  Park.

  WHAT YOU’LL NEED TO SUCCEED

  Bring your engineering expertise along with a drive for
  innovation to GDIT. The Full Stack Engineer must have:

  ● Education: Bachelor of Arts/Bachelor of Science

  ● Experience: 5+ years of related experience (all experience
  levels are encouraged to apply)

  ● Security clearance level: Top Secret with Polygraph

  ● US citizenship required

  What you will do:

  Backend Development: Develop and maintain backend
  microservices using Java and Spring Boot.

  Build Frontend Applications: Develop and support frontend
  Angular user interfaces.

  API Design: Design, implement and document secure RESTful
  API's

  Manage Databases: Optimize and update database schema's in
  PostgreSQL

  DevOps: Build and manage containerized application
  deployments

  Core Tech Stack

  Backend: Java, Spring Boot (3.5,4.0), Node.js

  FrontEnd: Angular 19+

  Database: PostgreSQL

  Infrastructure: AWS, Linux/RHEL

  Devops: Docker, Git, Maven, Ansible

  Tools: VS Code, IntelliJ, JIRA, Confluence

  GDIT IS YOUR PLACE At GDIT, the mission is our purpose, and
  our people are at the center of everything we do.

  ● Growth: AI-powered career tool that identifies career
  steps and learning opportunities

  ● Support: An internal mobility team focused on helping you
  achieve your career goals

  ● Rewards: Comprehensive benefits and wellness packages,
  401K with company match, and competitive pay and paid time
  off

  ● Flexibility: Full-flex work week to own your priorities at
  work and at home

  ● Community: Award-winning culture of innovation and a
  military-friendly workplace

  OWN YOUR OPPORTUNITY

  Explore a career in software development at GDIT and you’ll
  find endless opportunities to grow alongside colleagues who
  share your dedication to advancing innovation.

  The likely salary range for this position is $136,000 -
  $184,000. This is not, however, a guarantee of compensation
  or salary. Rather, salary will be set based on experience,
  geographic location and possibly contractual requirements
  and could fall outside of this range.

