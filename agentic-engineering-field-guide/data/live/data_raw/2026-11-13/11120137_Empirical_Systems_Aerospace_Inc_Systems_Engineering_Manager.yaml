  Summary The Manager, Systems Engineering, is an experienced
  individual within the Unmanned Aircraft System (UAS) systems
  technology or related industry with extensive knowledge
  performing one's function in a fast-paced organization. As a
  member of the Engineering management team, the Systems
  Manager oversees the Systems discipline and participates in
  defining and executing the overall engineering product
  development strategy, budget, team development and
  evaluation. Position Responsibilities

  - Manages a group of systems and test engineering
    professionals, including budget planning, staffing,
    training, performance evaluation and career development
  - Manages resources to meet project demands
  - Plans workload for engineering activities
  - Provides technical expertise and guidance to team to meet
    applicable deadlines
  - Maintains a high level of customer satisfaction with both
    internal and external customers
  - Manages requirements traceability and evolution through the
    system development cycle
  - Maintain and develop Systems Engineering best practices,
    processes, and continuous improvement initiatives
  - Actively manage a high-performing engineering team,
    providing mentoring, performance evaluations, and
    structured technical career pathing.
  - Follows processes and operational policies in selecting
    methods and techniques for obtaining solutions
  - Frequently interacts with subordinate supervisors, customers
    and/or functional peer group managers, normally involving
    matters between functional areas
  - Other duties as assigned

  Basic Qualifications

  - BS degree in Engineering (i.e., Systems, Electrical,
    Aerospace, etc.) is required or equivalent combination of
    education, training, and experience
  - 10 - 12 years of experience in a systems engineering role,
    with minimum 3 years managerial experience
  - Aerospace systems engineering experience preferred
  - Experience writing Systems Safety protocols and ensuring
    personnel safety during field testing
  - Experience in taking a product from concept to production
    with contract manufacturers a plus
  - Managed requirements traceability and evolution through the
    system development cycle
  - Experienced in providing weekly status of system development
    progress with requirements burn down
  - Allocated requirements to subsystem & engineering
    coordination
  - Evaluated system performance thresholds and providing
    direction
  - Development of instrumented flight test vectors and data
    acquisition
  - Provided input for model development and simulation analysis
  - Has developed systems test plans, procedures and reports,
    reviewed and interpreted customer specification

  Other Qualifications & Desired Competencies

  - MS preferred in Computer Science, Aero-Mechanical Eng.,
    Electrical Eng. Mechanical Eng.
  - Must be able to provide clear and concise communication
    (written and oral), as well as provide professional
    presentations
  - Familiarity with electronics and systems related to image
    collection and analysis
  - Demonstrates clear oral communication and well-organized
    documentation skills
  - Uses vision to think beyond the immediate situation, explore
    multiple potential paths, and adapt decision-making style
    based on the situational circumstances
  - Inspires, motivates, and empowers people to deliver
    organizational goals, while also delivering value back to
    employees
  - Brings organizational values to life using personality,
    uniqueness and the creation of a shared vision
  - Champions the process of change and promotes a culture of
    quick adaptation while helping others deal with the
    effects of change
  - Demonstrates the ability to develop and maintain internal
    and external trusting, professional relationships
  - Assesses the degree of risk and opportunity in plans or
    actions and takes appropriate action to mitigate them or
    makes plans to build on the opportunity

  Physical Demands

  - Ability to work in an office and production environment
    (Constant)
  - Required to sit and stand for long periods; talk, hear, and
    use hands and fingers to operate a computer and telephone
    keyboard (Frequent)

  Comprehensive Benefits & Perks:

  - Health & Wellness: Choose from three health, dental, and
    vision plans - including a 100% employer-paid option
    covering both employees and their families.
  - Paid Time Off: Enjoy 120 hours of PTO, 80 hours accrued plus
    an additional 40 hours of holiday break pay in addition to
    Christmas Eve, Christmas Day, and New Year’s Day off.
  - Life Insurance: $25,000 employer-paid life insurance policy,
    with the option to purchase additional coverage for
