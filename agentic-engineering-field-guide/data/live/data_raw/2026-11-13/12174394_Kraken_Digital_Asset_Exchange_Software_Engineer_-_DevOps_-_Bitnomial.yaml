description: |
  Building the Future of Open Finance

  Payward - the parent company behind Kraken, NinjaTrader,
  Breakout, xStocks, Payward Services and CF Benchmarks - has
  spent the last 15 years building one of the most modern and
  globally accessible financial infrastructure platforms in
  the industry, built to advance an open, global financial
  system.

  The team

  Bitnomial is building the next generation US-based global
  derivatives exchange, starting with digital assets and
  progressively expanding to encompass a full spectrum of
  commodities worldwide. Bitnomial operates a US CFTC
  regulated exchange (DCM), clearinghouse (DCO), and brokerage
  (FCM). It offers a range of crypto-settled derivatives,
  including futures, options, and a suite of live perpetual
  futures, used by brokers, hedge funds, institutions, and
  trading firms around the world.

  Bitnomial's exchange, clearinghouse, and brokerage systems
  are written largely in Haskell. In this role you will build
  the services and data models that record every order, fill,
  and settlement at a CFTC-regulated exchange and
  clearinghouse, with the database as a first-class part of
  the design. You will build features across these systems and
  design the schema, queries, and migrations behind them.



  The opportunity

  - Improve build and release pipelines in GitHub Actions:
    caching, parallelism, pinned toolchains, and required
    tests and scans before production
  - Manage AWS infrastructure as code with Terraform, and run
    services as containers on Nomad
  - Build deployment tooling with health checks and automated
    rollback, and make deploys safe around market sessions
  - Add metrics and alerts to the services you build, so you can
    see whether a deploy worked
  - Monitor systems, respond to alerts, and support daily
    operations such as settlement cycles
  - Fix the cause of production issues and write down what you
    learned
  - Build, test, and ship well-reviewed features and fixes in
    our services across the exchange, clearinghouse, and
    brokerage. Most of the code is Haskell
  - Understand the order, trade, clearing, and settlement flows
    end to end



  What you bring

  - Hands-on experience with CI/CD pipelines, such as GitHub
    Actions or GitLab CI
  - Production experience with AWS and Docker, and
    infrastructure as code with Terraform
  - Strong Linux and scripting skills (Bash, Python, or similar)
  - 3+ years of professional software engineering experience
    with a functional or strongly typed programming language
    such as Haskell, Rust, or C++
  - Solid computer science fundamentals, including distributed
    systems: failure modes, retries and idempotency,
    consistency, and how to observe them across services
  - Willingness to take part in on-call and operational shifts
  - Care and rigor with code that moves money
  - Good judgment with AI tools. You use them to work faster,
    and you read, test, and understand what they produce
    before you ship it
  - A habit of asking why before changing something
  - Sound judgment under pressure, with a calm and methodical
    approach when production is live
  - Collaboration across engineering, operations, risk, and
    compliance, with a habit of documenting



  Nice to haves

  - Financial knowledge or experience in trading, markets, or
    financial services
  - Bachelor's degree in computer science or a related field, or
    equivalent experience
  - Experience with Nomad or Kubernetes
  - Experience with Nix, Ansible, Vault, or Prometheus, Grafana,
    and Loki
  - Haskell experience

