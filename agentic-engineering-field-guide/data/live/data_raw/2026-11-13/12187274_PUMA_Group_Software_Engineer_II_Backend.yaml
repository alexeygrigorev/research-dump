  YOUR MISSION

  About the Organisation & Role::



  At PUMA, technology plays a critical role in enabling
  exceptional consumer, digital, and business experiences
  across global markets. Our engineering teams build and
  operate the platforms, products, and services that power
  PUMA's digital ecosystem, supporting millions of consumers
  and internal users worldwide.

  As part of the Engineering organization, you will contribute
  to the design, development, and evolution of scalable
  platforms and services that enable business capabilities
  across eCommerce, consumer engagement, merchandising, supply
  chain, retail operations, data, and enterprise functions.
  The organization embraces modern engineering practices,
  cloud-native architecture, automation, AI-assisted
  development, and a product-centric mindset to deliver high-
  quality solutions at scale.

  As a Software Engineer (Backend), you will design, build,
  and operate production-grade backend systems, APIs, and
  distributed services that support critical business and
  consumer-facing applications. You will work closely with
  Product Managers, Architects, Data Engineers, and fellow
  engineers to deliver secure, reliable, and scalable
  solutions while contributing to technical excellence and
  engineering best practices across the organization.



  What you will do:

  - Design, develop, and maintain scalable APIs, microservices,
    and backend services that support digital products and
    business platforms.

  - Lead the technical design and implementation of complex
    software solutions, ensuring scalability, maintainability,
    and high performance.
  - Collaborate with product, engineering, architecture, and
    data teams to deliver reliable and impactful business
    solutions.
  - Build and integrate systems using modern cloud-native
    architectures, distributed systems patterns, and event-
    driven technologies.
  - Develop and optimize data-intensive applications leveraging
    databases, caching solutions, messaging platforms, and
    search technologies.
  - Drive improvements in application performance, reliability,
    observability, security, and operational excellence.
  - Contribute to architecture reviews, technical discussions,
    and engineering best practices across teams.
  - Mentor and support engineers through code reviews, design
    guidance, and knowledge sharing.
  - Partner with internal stakeholders and external technology
    partners to accelerate delivery and innovation.
  - Leverage modern engineering tools, automation, and AI-
    assisted development practices to improve productivity and
    software quality.

  Participate in production support, incident management, and
  continuous improvement initiatives to ensure system
  stability and availability.

  YOUR TALENT

  - 4+ years of experience designing, building, and operating
    large-scale backend applications and distributed systems.
  - Strong proficiency in Java, Spring Boot, RESTful API design,
    and microservices-based architectures.

  - Experience developing scalable, reliable, and secure backend
    services that support business-critical applications.
  - Solid understanding of object-oriented programming, software
    design patterns, data structures, and clean coding
    practices.
  - Hands-on experience with relational and NoSQL databases such
    as PostgreSQL, MySQL, MongoDB, or similar technologies.
  - Experience working with caching technologies such as Redis
    and event-streaming platforms such as Kafka.
  - Experience building and deploying cloud-native applications
    on Azure, AWS, or GCP.
  - Exposure to containerization and orchestration technologies
    such as Docker and Kubernetes.
  - Exposure to AI/ML-powered applications, Generative AI, LLMs,
    RAG-based systems, AI-assisted engineering tools, or
    intelligent automation solutions.
  - Familiarity with search technologies such as Elasticsearch,
    OpenSearch, Azure AI Search, or similar platforms.
  - Good understanding of distributed systems concepts,
    scalability, resiliency, observability, and performance
    optimization.
  - Experience designing and implementing event-driven
    architectures and asynchronous processing patterns.
  - Understanding of Infrastructure as Code and automation tools
    such as Terraform, Bicep, or similar technologies.
  - Experience implementing and supporting monitoring, logging,
    tracing, and operational excellence practices for
    production systems.
  - Experience working with CI/CD pipelines, DevOps practices,
    automated testing, and modern software delivery
    methodologies.
  - Ability to collaborate effectively with product managers,
    architects, data engineers, and software engineers in
    Agile teams.
  - Strong analytical, problem-solving, and communication skills
    with the ability to troubleshoot and solve complex
    technical problems.

