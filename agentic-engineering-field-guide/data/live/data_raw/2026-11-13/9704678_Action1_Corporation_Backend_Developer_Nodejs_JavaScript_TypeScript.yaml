  - 4+ years of software development experience
  - Good knowledge of Node.js, JavaScript, TypeScript
  - Experience in designing and developing REST APIs and high
    load applications
  - Proficiency in working with databases (DynamoDB, MySQL)
  - Experience writing tests
  - Good knowledge of Docker and AWS (Lambda, EC2)

  We offer:

  - Fully remote work, giving you the flexibility you need in
    the modern world
  - A multitude of interesting challenges and opportunities
  - Stable income and flexible working hours, opportunities for
    promotion
  - Friendly and professional peers, eager to help and help you
    grow

  Join Action1 and be a driving force behind our success!
