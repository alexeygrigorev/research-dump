description: |
  TELUS Health is empowering every person to live their
  healthiest life. Guided by our vision, we are leveraging the
  power of our leading edge technology and focusing on the
  uniqueness of each individual to create the future of
  health. As a global-leading health and well-being provider –
  encompassing physical, mental and financial health – TELUS
  Health is improving health outcomes for consumers, patients,
  healthcare professionals, employers and employees.

  TELUS Health is dedicated to assisting our employees reach
  their professional goals through internal promotion and
  transfer opportunities. A successful junior System Analyst
  works collaboratively within a team environment, providing
  essential support for system implementation, configuration,
  and maintenance. This is an ideal entry-level position
  designed to launch your career in system implementation and
  analysis. You'll configure healthcare systems, troubleshoot
  client issues, and participate in live
  implementations—learning from experienced technical teams
  and building foundational expertise in a fast-paced,
  supportive environment. The ideal candidate demonstrates
  initiative, problem-solving abilities, and a commitment to
  continuous learning. This position is designed to build your
  foundational skills and position you for mid-level System
  Analyst or technical specialization roles as you grow with
  TELUS Health.

  Responsibilities:

  - Manages multiple assignments and priorities while
    maintaining quality standards
  - Understands business and system requirements and ensures
    that assigned requirements are met in a timely and
    accurate manner
  - Liaisons with Project Managers, Client Managers, Technical
    Managers, Infrastructure teams, and Developers regarding
    client projects and implementation demands
  - Performs analysis of business requirements and produces
    system specifications and configuration designs as needed
  - Ensures quality control and service standards are met for
    all assigned activities, including system testing and
    validation
  - Participates in system implementation projects, assisting
    with configuration and customization of systems to meet
    client requirements
  - Works effectively as a team member on implementation and
    support projects

  Growth & Development:

  - Actively participates in ongoing learning on organizational
    systems, industry topics, and emerging trends—building
    expertise over time
  - Assists in identifying process improvements and suggests
    ideas to the team to enhance efficiency and workflows
  - Supports special projects and additional tasks as assigned,
    with guidance from senior team members

  Core Qualifications & Required Skills

  Education & Experience:

  - Post-secondary education in Information Technology, Business
    Analysis, or related field (required)
  - 1–5 years of relevant experience in system implementation,
    analysis, technical support, or a related IT/business
    analysis role (junior-level candidates welcome; we
    prioritize learning potential over seniority)

  Technical Skills — Required:

  - Basic understanding of system configuration and
    implementation principles
  - Ability to read and interpret technical documentation
  - Foundational knowledge of SQL or ability to query databases
    and understand data relationships
  - Familiarity with at least one of the following programming
    languages: ASP.NET, ASP, Python, or JavaScript
  - Basic understanding of web development or system
    architecture concepts
  - Familiarity with testing tools and QA processes
  - WCAG 2.2 accessibility standards knowledge – basic ability
    to code and test for web accessibility compliance

  Technical Skills — Preferred:

  - Experience with ASP.NET, Python, JavaScript, HTML, and CSS
  - Experience with Content Management Systems (Sitefinity,
    Drupal, WordPress, Joomla, or similar)
  - Database management or system configuration tools
  - Advanced understanding of QA processes and testing tools

  Professional Skills:

  - Dedicated team player with initiative, independence, and
    strong organizational skills
  - Excellent written and verbal communication skills
  - Strong analytical and critical thinking abilities; flexible
    problem-solver
  - Customer and stakeholder focus with ability to understand
    business requirements
  - Proactive learner committed to continuous growth

  Language Skills:

  - Fluent in English (required)
  - Bilingual in French and English is an asset

  Salary Range: 39,900.00 - 57,000.00 - 74,100.00 CAD Annual

  Actual total compensation will be determined based on
  factors such as knowledge, skills, performance and
  experience. We encourage all qualified candidates to apply,
  even if the posted salary range doesn't match your
  expectations. We're open to discussing competitive
  compensation packages tailored to your experience level and
  expertise.

  Job Type: This is for a current vacancy.

  A bit about us

  We’re a people-focused, customer-first, purpose-driven team
  who works together every day to innovate and do good. We
  improve lives through our technology solutions and foster a
  culture of innovation that empowers team members to solve
  complex problems and create remarkable human outcomes in a
  digital world.

  TELUS is proud to foster an inclusive culture that embraces
  diversity. We are committed to fair employment practices and
  all qualified applicants will receive consideration for
  employment. We offer accommodation for applicants with
  disabilities, as required, during the recruitment process.

  Disclaimer:  In accordance with the TELUS Health Solutions
  Data Center Security Policy, as a condition of employment,
  all team members whose job functions require they work at a
  Data Center and/or have access to detailed knowledge of
  technology related to client service delivery, are subject
  to a Personnel Security Screening conducted through the
  Government of Canada.

  Note for Quebec candidates: if knowledge of English is
  required for this position, it is because the team member
  will be asked, on a regular basis, to interact in English
  with external or internal parties or to use English
  applications or software as part of their tasks.

  By applying to this role, you understand and agree that your
  information will be shared with the TELUS Group of
  Companies’ Talent Acquisition team(s) and/or any leader(s)
  who will be part of the selection process.
