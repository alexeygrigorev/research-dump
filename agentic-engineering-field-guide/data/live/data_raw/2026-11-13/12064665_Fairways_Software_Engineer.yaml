description: |
  About FairWays

  Fairways is a fast-moving consulting company that helps
  businesses scale confidently. We specialize in application
  architecture, AI integration, and digital transformation,
  providing expert support that unlocks efficiency and fuels
  real innovation.

  We’re a brand-new company with big ambitions, and we are
  building a team that’s just as passionate about solving
  complex problems as we are.

  What You'll Do

  As one of our first software engineers, you’ll play a key
  role in executing solutions for our clients. You’ll work
  across platforms and tech stacks, bringing thoughtful code
  and fresh ideas to every project.

  - Contribute to building and refining client applications
    across mobile and backend systems
  - Help design and implement scalable, reliable, and clean
    solutions
  - Collaborate with senior engineers, architects, and clients
    to solve real-world fintech challenges
  - Explore and test new technologies—we move fast and love
    trying new things
  - Ask questions, challenge assumptions, and continuously level
    up your skills

  What You’ll Bring

  We care more about how you think and learn than what your CV
  looks like. If you like to code, dig into systems, and get
  curious about how things work, this could be a great fit.

  Must-Haves

  - Bachelors degree
  - 3 to 4 years of coding experience - either professional or
    personal
  - Familiarity with C or C++ and Java
  - Experience developing for Android  (and at least a basic
    understanding of iOS)
  - Strong problem-solving instincts and a love for figuring
    things out
  - Good communication skills in both Spanish and English
  - A self-starter mindset with curiosity and a drive to learn

  Nice-to-Haves

  - Previous experience working on a team or contributing to
    real-world projects
  - Exposure to backend services, REST APIs, or cloud platforms

  Why Join FairWays?

  - A chance to be part of something new and ambitious
  - Highly competitive salary package
  - Pick your own Gear! High spec macbook, or PC alternative and
    accessories.
  - Value-driven, fast-growing start-up organisation with huge
    opportunity for career growth
  - A collaborative team that values humility, learning, and
    impact
  - Drive your development with a personal learning budget

  If this role sounds exciting—even if you don’t tick every
  box—we’d love to hear from you.
