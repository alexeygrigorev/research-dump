description: |
  In this role, you will be responsible for designing,
  developing, and maintaining software applications. This
  position requires leveraging advanced engineering principles
  and practices to ensure high-quality software solutions that
  meet business needs.

  The Honeywell building is a controlled goods program
  environment. Candidates must be eligible for CGP security
  clearance.

  Responsibilities

  Key Responsibilities:

  - Design, implement, and test software solutions using
    C++/Python on both Windows and Linux platforms.
  - Collaborate with cross-functional teams to identify and
    address software requirements.
  - Mentor junior engineers and provide technical guidance on
    best practices.
  - Conduct code reviews and ensure adherence to coding
    standards.
  - Participate in architecture and design discussions,
    contributing to the overall design of software systems.
  - Troubleshoot and resolve software defects and issues,
    ensuring smooth operation of the software.
  - Stay up to date with industry trends and emerging
    technologies to inform future product development.
  - Document software design and implementation details for
    future reference.

  Qualifications

  Qualifications:

  - Bachelor’s degree in computer engineering, computers
    science, software engineering or a related field.
  - 5 years of experience in software development, with a focus
    on Object Oriented Design and Programming
  - 5 years in programming languages such as C++
  - Object Oriented Design and Programming (OOD/OOP)
  - Build Tools such as Make, CMake
  - Strong coding ability in C++11 and higher
    - STL and/or Boost
    - Template Meta programming
    - Visual C++ and gcc
  - Cross platform development in both Linux and Windows
    - Multi-thread / Multi-Core software development
      - Synchronization (Mutex/Semaphores)
    - Networking (UDP/TCP/IP): Socket Programming
    - Process / Thread Synchronization and resource control
    - File system and its organization
    - Heap/Stack memory management in C++ and Legacy C
    - Strong Debugging skills in Visual Studio and GCC.
  - Strong problem-solving skills and the ability to work
    independently.
  - Excellent communication and collaboration skills.

  We Value:

  - An understanding of communications protocols: both IP and
    avionics bus
  - An in-depth understanding of objects and how to best
    interface them
  - Design patterns are a plus
  - Ability to work independently or with little support and
    supervision
  - Strong analytical and problem-solving skills
  - Experience in Windows and Linux operating systems
  - Experience with database set up and use such as SQL
  - Experience with driver and kernel codes is a plus
  - RTOS Experience is valued
  - Experience in Python, Perl, LUA
  - Experience in leading software development projects.
  - Passion for innovation and continuous learning.
  - Documentation formats: such as HTML, CSS, MD
  - Understanding various software development lifecycles
  - Knowledge of software configuration management and change
    management practices
    - JIRA and Bitbucket experience are an asset

  The annual base salary range for this position is $105,000 -
  $135,000 in Mississauga, Ontario. Please note that this
  salary information serves as a general guideline. Honeywell
  Aerospace considers various factors when extending an offer,
  including but not limited to the scope and responsibilities
  of the position, the candidate's work experience, education
  and training, key skills, as well as market and business
  considerations.

  About Honeywell Aerospace

  Join a company that's reintroducing itself to the aviation
  community we've helped advance for more than a century. At
  Honeywell Aerospace (NASDAQ: HONA), we're launching as an
  independent, publicly traded aerospace and defense company
  built on a legacy of operational excellence and mission-
  focused execution.

  Our new brand identity pairs that heritage with real
  momentum, as we build technology that helps pilots navigate
  with confidence, aircraft operate more efficiently, and
  operators stay ahead of change. With our systems on board
  90% of the world's aircraft, your work here has reach that's
  rare to find anywhere else.

  Focusing on our customers, investing in innovation, and
  building a culture of accountability and performance is how
  we're shaping what comes next.

  Every horizon. Every mission. Every day.

  Accommodation is available upon request for applicants with
  disabilities under the Ontario Human Rights Code.
