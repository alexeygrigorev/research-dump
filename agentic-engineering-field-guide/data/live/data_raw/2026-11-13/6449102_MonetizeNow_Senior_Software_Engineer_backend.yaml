description: |
  Company Description

  B2B Product Led Growth Enterprises are struggling in their
  Go-To-Market as they don’t have systems in place to support
  their rapid growth. We are building the first elegant
  solution for API-centric Saas Monetization Platform to allow
  our customers to monetize their products across all channels
  with a single system.

  Job Description

  Overview Our team is building a modern microservices-based
  multi-tenant SaaS platform that needs to be highly scalable
  and performant. We are looking for an engineer who has done
  this before to help us architect and build it right from the
  start. We are using Java/Spring, AWS, Lambda, Postgres,
  NoSQL, Kafka, and much more. Our company is still young so
  this role will get a chance to work across the entire
  backend and help bring our product to market. This is a
  high-impact/high ownership role and is expected to grow as
  our company does.

  What you’ll do

  - Design, architect, and build Java/Kotlin microservices in an
    API first way
  - Collaborate with design, product, and other engineers to
    execute on our product roadmap
  - Assist in setting up testing, pipeline, infrastructure, and
    deployment pipelines to ensure we can build and deploy
    fast and predictably
  - Ensure our software is working correctly and fix any
    customer issues with passion and dedication.

  Qualifications

  Who you are

  - Someone who builds microservices-based cloud products and
    platforms.
  - A creator of beautiful REST API and someone who’s willing to
    debate the most RESTFul way to describe an API
  - You live and breath automation, can’t live without a robust
    deployment pipeline, and can prove your code will work
    when it gets to production
  - 8+ years of software engineering experience
  - 5+ years recent experience Java
  - 3+ years AWS experience with some combo of
    EC2/ECS/RDS/Lambda/DynamoDb
  - Comfortable modeling data in both relational and non-
    relational databases, and know when to use them
  - A person who’s obsessed with customers and takes ownership
    for putting the customer first

  Things we’d like you to have, but it’s ok if you don’t

  - 3+ years working on enterprise, billing, CPQ, finance, or
    other business software
  - Have deployed a GraphQL API to production
  - Experience working with remote teams on complex software
    experiences
  - Experience with JavaScript/React and how a modern frontend
    interacts with APIs

  Additional Information

  We are also proud partners of Pledge 1% and have pledged 1%
  of equity, 1% of the product, 1% of profits, and 1% of
  employee time for giving back.

  We believe in an open, remote-first culture that fosters
  creativity, individual ownership, and team collaboration.
