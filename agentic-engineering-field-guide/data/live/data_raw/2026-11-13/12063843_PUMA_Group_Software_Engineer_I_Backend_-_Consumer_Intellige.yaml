  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Consumer Intelligence & Engagement
  organisation responsible for delivering the intelligence and
  engagement capabilities that enable more relevant and
  personalised consumer experiences across digital channels.
  The organisation plays a key role in how consumers discover
  products, engage with content, and elevate experiences
  through membership & loyalty. Through capabilities such as
  personalisation, recommendations, consumer intelligence,
  experimentation, and AI-driven decisioning, the organisation
  helps deliver more contextual, data-driven interactions
  across the consumer journey.

  As a Software Engineer (Backend), you will build the backend
  services that power personalisation and recommendation
  capabilities. You will be responsible for technical design,
  build and validation. Working closely with the Lead Engineer
  and Engineering Manager, you will deliver low latency
  services that support real-time consumer experiences. .

  What you will do:What you will do:

  - Design and build scalable APIs, microservices, and
    integration services that power AI-driven product
    discovery, search, recommendation, and personalization
    experiences.
  - Partner with AI/ML and Data Engineers to deploy and
    integrate GenAI, recommendation, and search capabilities
    into consumer-facing applications.
  - Build and enhance search experiences using technologies such
    as Elasticsearch, OpenSearch, or vector search platforms.
  - Develop UI applications and reusable components using React.
  - Build reliable event-driven solutions using technologies
    such as Kafka and modern cloud-native architectures.
  - Ensure solutions are secure, scalable, observable, and
    resilient through strong engineering practices.
  - Leverage AI-assisted engineering tools and practices to
    improve productivity, code quality, and delivery
    effectiveness.

  YOUR TALENT

  - 2+ years of experience building scalable web applications
    and backend services.
  - Strong programming experience in Java and Spring Boot.
  - Experience building REST APIs, microservices, and
    distributed applications.
  - Exposure to search technologies such as Elasticsearch,
    OpenSearch, or similar platforms.
  - Experience working with SQL/NoSQL databases and caching
    solutions such as Redis.
  - Experience with event streaming platforms such as Kafka.

