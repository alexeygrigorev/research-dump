description: |
  About the RoleWhat we do

  The Experimentation team provides cutting edge tooling and
  methodologies for all teams at Uber to make rapid decisions
  for their product iterations. Experimentation is an exciting
  domain that combines multiple disciplines of Software
  Engineering (Backend, Distributed Systems, Mobile, Web, Data
  Infra), Data Science, and Product Design.



  Every major launch across any of Uber’s Rides, Delivery,
  Earner, Freight, and Uber For Business (U4B) organizations
  leverages the Experimentation platform to determine how new
  features impact key business metrics. Virtually all
  Engineers, Scientists, and Product Managers at the company
  use our platform on a daily basis to launch, monitor, test,
  and make changes to Uber’s ecosystem.

  Why it matters

  - Velocity with Confidence: By automating experiment design,
    rollout, and analysis, we reduce the cost of iteration and
    let teams validate the impact of features our members
    love.
  - Company Wide Reach: Virtually every engineer, data
    scientist, and product manager touches our platform daily
    to launch, monitor, and refine Uber’s ecosystem.
  - Business Impact at Scale: Decisions backed by our tooling
    safeguard core metrics while empowering innovators to push
    boundaries.

  Basic Qualifications

  - Bachelor's or Master’s degree in Computer Science or a
    related technical field, or equivalent experience in an
    engineering related bootcamp
  - 5+ years of experience in professional software development
    experience, developing and deploying systems in production
    environments
  - Proven skills writing efficient, clean code in Go, Java, or
    Python
  - Ability to debug and fix software bugs in a production scale
    environment
  - Experience with software engineering best practices
  - Strong grasp of distributed-systems fundamentals: caching,
    sharding, consensus, fault tolerance, observability, and
    incident response
  - Excellent written and verbal communication skills, including
    the ability to document architectures and algorithms

  Preferred Qualifications

  - Advanced coursework or industry background in statistics,
    causal inference, or experimental design.
  - Direct ownership of experiment analysis workflows (A/B,
    quasi-experimental, marketplace simulations) at scale.
    - Python, Pandas, PySpark
    - Data Pipelines (e.g. Spark, Scala)
    - Jupyter Notebooks
  - Professional experience with feature-flag and progressive-
    delivery systems (e.g. internal rollout platforms)

  What You Will Do

  - Own and evolve A/B and Marketplace Experimentation products
    at Uber.
  - Build and optimize large-scale data pipelines in
    Spark/Presto to compute experiment metrics, power
    analyses, and marketplace-level supply-demand insights.
  - Advance monitoring & alerting so product teams spot
    experiment-driven regressions in minutes—expand real-time
    dashboards, anomaly detection, and on-call playbooks.
  - Collaborate with data scientists and product managers to
    translate causal-inference models into robust, production-
    ready APIs and batch workflows.
  - Continuously raise the engineering bar—deliver comprehensive
    tests, champion code health, conduct performance
    profiling, and drive incident retrospectives.
  - Utilize software development best practices to ensure team
    owned systems, libraries, and microservices are reliable
    (monitoring, alerting, logging, etc)
  - Design and document architectural solutions to complex
    engineering problems

  Responsibilities

  For San Francisco, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  You will be eligible to participate in Uber's bonus program,
  and may be offered an equity award & other types of comp.
  All full-time employees are eligible to participate in a
  401(k) plan. You will also be eligible for various benefits.

  About Us

  Ready to Ride?



  This isn't the kind of place where you follow a playbook —
  it's where you help write one. If you're driven by impact,
  energized by challenge, and ready to shape how the world
  moves — we'd love to hear from you.

  You may be eligible for bonuses, equity, and other
  compensation, as well as a range of benefits. Explore our
  benefits.

