  Senior Software Engineer, Frontend (Platform - Identity)

  As a Senior Software Engineer, Frontend on the Identity
  Horizontal team within the Platform group, you'll own the
  user-facing experiences for login, signup, OAuth, account
  security, and multi-factor authentication that every
  Coinbase customer touches first. This team builds and
  maintains the frontend surfaces that establish the right
  level of assurance for every identity, enabling products to
  ship faster while blocking attackers and satisfying
  regulators. You'll lead end-to-end frontend delivery across
  authentication surfaces, drive the Native vs. Webview
  architecture strategy, and mentor engineers as the team
  scales.

  What you'll do:

  - Lead end-to-end frontend projects from design doc through
    implementation, deployment, and monitoring for login,
    signup, OAuth, account security, and multi-user/multi-
    organization support.
  - Author and review technical design documents, breaking down
    ambiguous, complex initiatives into executable plans for
    the team.
  - Drive Identity's Native vs. Webview architecture strategy
    for authentication surfaces, evaluating trade-offs across
    latency, reliability, and user experience.
  - Identify and resolve technical debt and code quality issues
    proactively across the team's codebase, not just your own
    scope.
  - Lead team rituals including on-call, code review, and
    incident response, and mentor L04 engineers on frontend
    craft and ownership.

  Required Skills and Experience:

  - 5+ years of production frontend engineering experience with
    React and TypeScript, including independently leading end-
    to-end delivery of ambiguous, complex projects.
  - Authored and driven technical design documents through
    cross-functional review and implementation on at least 2-3
    major initiatives.
  - Demonstrated ability to identify and resolve systemic
    technical debt across a team's codebase, with measurable
    improvements to reliability or developer velocity.
  - Experience mentoring engineers and leading team rituals (on-
    call rotations, code review standards, incident response).
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality

