description: |
  ABOUT THE TEAM

  At Mural, we're changing how teams collaborate, think, and
  make decisions together. The Growth & Engagement team helps
  customers discover value through intuitive product
  experiences, rapid experimentation, and emerging AI
  capabilities that make collaboration more effective. We own
  key parts of the customer journey - from acquisition and
  onboarding to activation, engagement, retention, and
  monetization - and use data, experimentation, and customer
  insights to continuously improve those experiences.

  We're a cross-functional team of engineers, product
  managers, designers, and data partners who move quickly,
  measure outcomes, and learn from every experiment. We value
  curiosity, collaboration, and thoughtful technical
  craftsmanship, building systems that enable rapid iteration
  while maintaining a high bar for quality, reliability, and
  scalability.



  YOUR MISSION

   As a Senior Software Engineer on the Growth & Engagement
  team, you'll build the products, platforms, and
  experimentation capabilities that help customers discover
  value faster and achieve more with our product. You'll
  partner closely with Product, Design, Data, and other
  Engineering teams to identify opportunities, validate ideas
  through experimentation, and deliver experiences that
  improve customer outcomes and drive sustainable business
  growth.

  Beyond shipping features, you'll help shape the technical
  direction of the team, mentor other engineers, and establish
  engineering practices that enable us to experiment
  confidently and move quickly.

  WHAT YOU'LL DO

  - Design, build, and maintain customer-facing features that
    improve acquisition, activation, engagement, retention,
    and monetization.
  - Collaborate closely with Product, Design, Data, Marketing,
    and Customer Success to identify growth opportunities and
    translate customer feedback, product analytics, and
    experimentation to guide product decisions.
  - Design, implement, and analyze experiments using feature
    flags, A/B testing, and analytics to validate hypotheses
    and measure customer and business impact.
  - Build reliable instrumentation and event pipelines that help
    teams understand customer behavior and make informed
    product decisions.
  - Write high-quality, maintainable code while contributing to
    architecture, technical design, and long-term platform
    improvements.
  - Improve the performance, reliability, accessibility, and
    scalability of critical user journeys.
  - Mentor teammates through technical leadership, code reviews,
    design discussions, and knowledge sharing.
  - Contribute to roadmap planning, technical strategy, and
    continuous improvement of the team's engineering
    practices.

  WHAT YOU'LL BRING

  - 5+ years of professional experience as a Software Engineer
    building and operating production software.
  - Strong proficiency building modern web applications.
    Experience with TypeScript, React, Node.js, and MongoDB or
    similar technologies, with the ability to become
    productive quickly.
  - Familiarity with Model Context Protocol (MCP) and the
    broader AI tooling ecosystem and the ability to quickly
    learn emerging AI technologies.
  - Experience leveraging AI-assisted development tools and
    workflows to improve engineering productivity, code
    quality, and delivery.
  - Experience building customer-facing products in close
    partnership with Product and Design teams.
  - A product mindset with the ability to balance customer
    needs, technical tradeoffs, and business goals.
  - Experience using analytics and data to inform engineering
    and product decisions.
  - Strong software engineering fundamentals, including system
    design, testing, observability, and operational
    excellence.
  - Excellent communication and collaboration skills, with the
    ability to influence technical decisions across cross-
    functional teams.
  - A track record of taking ownership of ambiguous problems,
    driving projects from concept to delivery, and mentoring
    other engineers.
  - Experience working on a Growth/Engagement team or in a
    product engineering role focused on experimentation and
    customer lifecycle improvements.
  - Experience working with business metrics such as activation,
    engagement, retention, conversion, and monetization to
    inform product and engineering decisions.
  - Experience designing, implementing, or analyzing product
    experiments (A/B testing, feature flagging, or similar
    experimentation frameworks).

  Compensation offered will be determined by factors such as
  location, level, job-related knowledge, skills, and
  experience.

  Equal Opportunity

  We will ensure that individuals with disabilities are
  provided reasonable accommodation to participate in the job
  application or interview process, to perform essential job
  functions, and to receive other benefits and privileges of
  employment. Please contact us to request accommodation.
